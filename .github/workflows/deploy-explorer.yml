name: Deploy database explorer

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'vocab/**'
      - 'oedb/**'
      - 'build/build_db.py'
      - 'build/build_explorer_site.py'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python build/build_db.py --db-out artifacts/catalog.db
      - run: python build/build_explorer_site.py --db artifacts/catalog.db --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
