# Equipment-Vokabular — geschlossene Liste, zwei getrennte Achsen.
#
# primary_equipment : genau EIN Wert je Uebung. Das Hauptgeraet, das die Last
#                     erzeugt. Beantwortet "Womit trainiere ich?".
# setup             : Liste, darf leer sein. Was ausserdem dastehen muss.
#                     Beantwortet "Kann ich das hier ueberhaupt machen?".
#
# Die Trennung ist der Grund, warum "Was geht im Hotelzimmer?" filterbar wird:
#   primary_equipment == bodyweight  UND  setup == []

version: 1

primary_equipment:
