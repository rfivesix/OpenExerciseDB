name: Bird Dog
description: 'Starting Position:

  Begin on all fours (quadruped position) on a mat with hands directly under shoulders
  and knees under hips. Maintain a neutral spine and engage your core.


  Execution:

  1. Simultaneously reach your right arm straight forward and extend your left leg
  straight back until both are parallel to the floor.

  2. Pause and hold the fully extended position for 1–2 seconds, actively squeezing
  your glute and spinal erectors without arching your lower back.

  3. Return to the starting position under control and switch to the opposite arm
  and leg.


  Cues:

  Keep your hips and shoulders squared to the floor. Avoid rotating your pelvis or
  overarching the lumbar spine.'
