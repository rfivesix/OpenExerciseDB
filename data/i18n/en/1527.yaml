name: Pendulum Squat
description: 'Starting Position:

  Step onto the pendulum squat platform, placing your shoulders snugly against the
  pads and feet shoulder-width apart in the center of the footplate. Disengage the
  safety latch and brace your core.


  Execution:

  1. Bend your knees and hips to descend along the machine''s curved circular arc
  into a deep squat.

  2. When your thighs reach full depth and your quadriceps are fully stretched, drive
  through your midfoot and heels to push back up.

  3. Return to the starting position without forcefully locking your knees out at
  the top.


  Cues:

  The pendulum mechanism counterbalances spinal loading and allows an exceptionally
  deep knee flexion angle, placing tremendous tension on the quadriceps.'
