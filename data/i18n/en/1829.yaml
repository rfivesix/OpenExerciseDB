name: Landmine Squat to Press
description: "Starting Position:\nAnchor one end of a barbell in a landmine attachment\
  \ or corner. Stand facing the barbell with feet slightly wider than shoulder-width,\
  \ toes angled outward 15 to 30 degrees. Cup the sleeve of the free end with both\
  \ hands interlaced and hold it at mid-chest height just beneath your collarbones.\n\
  \nExecution:\n1. Brace your core and descend into a deep squat, keeping your chest\
  \ proud and heels planted until thighs are parallel to the floor.\n2. Powerfully\
  \ drive through your heels to stand up, utilizing the upward leg drive to thrust\
  \ the barbell upward.\n3. In one fluid motion, press the bar overhead until your\
  \ arms are fully extended.\n4. Lean slightly into the bar at the top to support\
  \ natural upward scapular rotation.\n5. Lower the barbell with control back to chest\
  \ level and seamlessly transition into the next squat repetition.\n\nCues:\nSeamlessly\
  \ link the squat and the press into a single explosive, coordinated full-body movement."
