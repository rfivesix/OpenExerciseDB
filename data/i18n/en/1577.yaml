name: Bretzel Stretch
description: 'Starting Position:

  Lie on your side on a mat. Bring your top knee up to hip level at a 90-degree angle
  resting on the floor, and hold it pinned down with your bottom hand.


  Execution:

  1. Bend your bottom knee behind you and grab the bottom foot or ankle with your
  top hand.

  2. Inhale deeply, then exhale as you slowly rotate your top shoulder and upper back
  towards the floor.

  3. Keep the top knee pinned to the floor to preserve rotation in the thoracic spine
  and stretch through the hips.

  4. Hold the position for 20 to 30 seconds, taking slow deep breaths, then switch
  sides.


  Cues:

  A premier mobility drill that combines thoracic spine rotation with a stretch of
  the bottom leg''s hip flexors/quads and top leg''s gluteals.'
