name: Bretzel stretch
description: |-
  How to Perform the Bretzel Stretch&nbsp; &nbsp; Starting Position:&nbsp; &nbsp; &nbsp; &nbsp; Lie on your back on a flat surface, such as a mat.&nbsp; &nbsp; &nbsp; &nbsp; Bend your knees and place your feet flat on the ground.&nbsp; &nbsp; Leg Positioning:&nbsp; &nbsp; &nbsp; &nbsp; Lift your right leg and cross it over your left leg, placing your right foot on the outside of your left knee.&nbsp; &nbsp; &nbsp; &nbsp; Your left leg should remain flat on the ground.&nbsp; &nbsp; Arm Positioning:&nbsp; &nbsp; &nbsp; &nbsp; Extend your left arm out to the side at shoulder height, keeping it straight.&nbsp; &nbsp; &nbsp; &nbsp; Use your right hand to gently pull your right knee towards the floor on the left side of your body.&nbsp; &nbsp; Stretching:&nbsp; &nbsp; &nbsp; &nbsp; As you pull your knee down, try to keep your left shoulder flat on the ground.&nbsp; &nbsp; &nbsp; &nbsp; You should feel a stretch in your hip, lower back, and possibly your chest.&nbsp; &nbsp; Hold the Position:&nbsp; &nbsp; &nbsp; &nbsp; Maintain this position for 20-30 seconds, breathing deeply and relaxing into the stretch.&nbsp; &nbsp; &nbsp; &nbsp; Switch sides and repeat the process.
