name: Forward Arm Circles
description: 'Starting Position: Stand upright with feet shoulder-width apart and
  extend both arms straight out to the sides at shoulder height, palms facing down.

  Execution: Make small, controlled circular motions with your arms rotating forward.
  Gradually increase the size of the circles as your shoulders warm up.

  Cues: Keep your shoulder blades retracted and avoid shrugging your shoulders toward
  your ears.'
