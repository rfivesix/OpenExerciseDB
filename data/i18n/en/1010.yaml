name: Back Neck Stretch
description: 'Starting Position: Sit upright on a chair or stand tall with shoulders
  relaxed and down. Place your hands lightly behind your head with fingers interlaced.

  Execution: Exhale and gently tilt your head forward, tucking your chin toward your
  chest. Allow the natural weight of your hands to provide light guidance until you
  feel a comfortable stretch along the back of your neck and upper spine.

  Return: Hold for 15–30 seconds, then slowly and gently lift your head back to neutral.

  Cues: Do not force or pull hard on your head; let gentle gravity and relaxed breathing
  deepen the stretch.'
