name: Single-Leg Calf Raise
description: '- Stand on the ball of one foot on a step or sturdy elevated platform,
  keeping the other foot lifted off the floor.

  - Lightly hold onto a wall or railing for balance.

  - Lower your heel as far down as comfortable to achieve a full stretch in the calf
  muscle.

  - Press explosively through the ball of your foot to raise your heel as high as
  possible into peak contraction.

  - Pause briefly at the top, then lower under slow control before switching to the
  other leg.'
