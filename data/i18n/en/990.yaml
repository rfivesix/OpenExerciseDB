name: Kneeling Glute Kickback
description: 'Starting Position: Begin on all fours (quadruped) on a mat with your
  hands beneath your shoulders and knees beneath your hips.

  Execution: Keeping your core tight and maintaining a 90-degree bend in your knee
  (or extending the leg straight), drive the sole of one foot upward and backward
  toward the ceiling, contracting your glute intensely.

  Return: Hold for a second at the top, then slowly lower your knee back toward the
  floor without letting it rest completely.

  Cues: Avoid arching your lower back or shifting your weight heavily to one side.'
