name: Lying Hamstring Stretch with Band
description: "Starting Position: Lie flat on your back and loop a resistance band\
  \ or strap around the ball of one foot. Hold the ends of the band firmly with both\
  \ hands. The opposite leg rests straight or bent on the floor.\nExecution: Extend\
  \ the banded leg toward the ceiling and gently pull the band toward your chest until\
  \ you feel an effective stretch through the belly of your hamstrings.\nTips: Avoid\
  \ locking the knee into hyperextension; keep a micro-bend if needed. Hold the stretch\
  \ for 20–30 seconds with calm breathing, then switch legs."
