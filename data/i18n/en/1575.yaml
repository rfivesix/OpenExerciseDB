name: Standing Dowel Shoulder Press
description: 'Starting Position:

  Stand upright with your feet shoulder-width apart and core engaged. Grasp a lightweight
  wooden dowel (or PVC pipe/broomstick) with an overhand grip slightly wider than
  shoulder-width at chest height.


  Execution:

  1. Press the dowel smoothly overhead until your arms are fully extended and shoulders
  shrugged slightly up to clear the subacromial space.

  2. Lower the dowel with control either in front to your clavicles or behind your
  neck, alternating between front and back positions.

  3. Focus on shoulder and thoracic mobility rather than resistance.


  Cues:

  An excellent warm-up and mobility drill for the shoulder girdle and thoracic spine.
  Move only within a pain-free range of motion.'
