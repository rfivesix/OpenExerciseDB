name: Bench Dips On Floor
description: 'Triceps dips on floor are a compound exercise as they worked multiple
  muscle groups simultaneously. Although this bodyweight exercise mainly targets the
  triceps, it also hits your chest and front of your shoulder.

  Triceps dips on floor are one of the most effective exercises to increase arm strength
  and also build lean muscle in your upper arms.

  Triceps dips on floor are a closed kinetic chain exercise and express that you do
  the movements around a fixed point. It increases compression force on your joints
  thereby improving stability.'
