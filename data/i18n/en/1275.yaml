name: Plantarflexion Stretch with Band
description: 'Starting position:

  Sit on the floor with your legs extended in front of you. Loop a light resistance band over the top of your foot (instep),
  holding the ends to guide the stretch.


  Execution:

  1. Gently point your toes forward and downward (plantarflexion), creating a mild stretch along the front of your ankle and
  the tibialis anterior muscle.

  2. Hold the stretch comfortably for 20–30 seconds.

  3. Release slowly and switch to the other foot.'
