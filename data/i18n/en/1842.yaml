name: Banded Clamshell
description: "Starting Position: Lie on your side (or in a side plank) with your knees\
  \ bent and legs stacked. Place a mini resistance band around your thighs just above\
  \ the knees.\nExecution: Keeping your feet together, raise your top knee upward\
  \ against the band's resistance like an opening clamshell. Slowly return to the\
  \ starting position.\nTips: Keep your pelvis stable and square; do not let your\
  \ hips roll backward as you lift the knee."
