name: Seated Machine Hip Abduction
description: "Starting Position:\nSit upright in the hip abduction machine with your\
  \ back flat against the backrest. Place the outside (lateral aspect) of your knees\
  \ and thighs firmly against the padded lever arms. Rest your feet on the footplates\
  \ and grasp the side handles to stabilize your pelvis.\n\nExecution:\n1. Drive your\
  \ legs outward against the pads by contracting your gluteus medius and outer hip\
  \ muscles.\n2. Open your legs to full comfortable abduction and pause for 1 to 2\
  \ seconds at peak contraction.\n3. Slowly resist the weight as you bring your knees\
  \ back toward the center without allowing the weight stack to touch down between\
  \ reps.\n\nCues:\nKeep your hips seated and torso stationary; do not use momentum\
  \ or rock back and forth."
