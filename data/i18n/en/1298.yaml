name: High-Cable Triceps Extension
description: 'The high-cable cross tricep extension is an isolation exercise for targeting
  the triceps,

  particularly the long head. It utilizes cables and handles grasped with opposite
  hands, allowing for a unique pressing motion that can be effective for building
  tricep strength. Unlike exercises that use a straight bar or rope, this variation
  can be more comfortable on your wrists and elbows'
