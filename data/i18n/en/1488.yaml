exercise_id: '1488'
language: en
status: ai_reviewed
name: Dumbbell Pullover
description: |-
  Starting Position:
  Lie perpendicularly across a flat bench with your upper back and shoulders resting firmly on the pad and feet flat on the floor. Hold a dumbbell with both hands (palms pressing against the underside of the top plate) directly over your chest with arms extended.

  Execution:
  1. With a slight, fixed bend in your elbows, lower the dumbbell backward in an arc over and behind your head until you feel a full stretch in your lats and ribcage.
  2. Pull the dumbbell back up along the same arc by contracting your lats and chest until it is once again positioned over your chest.
  3. Keep your hips stable and abdominal muscles braced throughout all repetitions, preventing your lower back from excessively arching.

  Cues:
  Maintain a consistent elbow angle throughout the entire movement; do not turn it into a triceps extension.
