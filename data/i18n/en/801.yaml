name: Dumbbell Push-Up
description: '- Place two flat-sided dumbbells on the floor about shoulder-width apart
  and grip the handles with a neutral grip.

  - Assume a push-up plank position with your body forming a rigid, straight line
  from head to heels.

  - Lower your chest down between the dumbbells, taking advantage of the elevated
  height for a deeper range of motion.

  - Press firmly through your chest and triceps to return to the starting plank position.'
