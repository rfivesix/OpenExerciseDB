name: Chin Tuck
description: 'Starting Position: Sit or stand tall with your shoulders back and down,
  eyes looking straight ahead at eye level.

  Execution: Without tilting your head down, draw your chin horizontally backward
  as if making a subtle "double chin," aligning your ears directly over your shoulders.

  Return: Hold the retracted position for 3–5 seconds, feeling a gentle stretch at
  the base of the skull, then release back to neutral.

  Cues: Do not bend your neck down toward your chest; the movement is purely horizontal
  retraction.'
