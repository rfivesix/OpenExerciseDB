name: Bulgarian Split Squat (Left)
description: 'Starting Position: Stand about two feet in front of a sturdy bench or
  chair. Place the top of your right foot onto the bench behind you, with your left
  foot firmly planted forward.

  Execution: Lower your hips by bending your left knee until your left thigh is roughly
  parallel to the ground and your right knee hovers just above the floor.

  Return: Push through the heel and midfoot of your left leg to return to the starting
  upright position.

  Cues: Keep your torso slightly leaned forward from the hips with a flat back; do
  not let your front knee collapse inward.'
