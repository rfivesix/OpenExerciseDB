name: Handstand
description: 'Starting Position:

  Place both hands shoulder-width apart on the floor with fingers splayed for stability.
  Keep your shoulders active, pressing firmly into the ground.


  Execution:

  1. Kick up one leg smoothly while pushing off with the trailing leg until your body
  is inverted vertically.

  2. Lock your elbows, push tall through your shoulders, and squeeze your core, glutes,
  and legs together in a straight line.

  3. Balance by making micro-adjustments with your fingertips and the palms of your
  hands.


  Cues:

  Avoid excessive arching in the lower back; keep your ribs pulled down and maintain
  a rigid hollow body position.'
