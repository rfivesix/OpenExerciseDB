name: Biceps Close Grip Pull Down
description: 'On a lat pull down machine, hold the bar keeping your hands relatively close. Use an underhand grip (I.E.: the
  back of your hand must be facing the machine). Then pull down the bar in a straight line towards the ground. Make sure your
  biceps are the main drivers of the motion. You will probably feel your shoulders and lats working, but make sure your biceps
  are working more.'
