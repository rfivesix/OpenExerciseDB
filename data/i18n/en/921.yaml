name: Seated Cable Row
description: 'Starting Position: Sit tall at the seated cable row station with feet
  braced on the footrests and knees slightly bent.

  Execution: Maintain a slight forward lean at the hips and pull the handle toward
  your abdomen, keeping your elbows tucked close to your sides during the eccentric
  phase.

  Note: This exercise has been merged into exercise 1117 (Seated Cable Row).'
