name: Smith Machine Slight Incline Press
description: 'Starting Position: Lie on a slight incline bench (15–30 degrees) positioned
  inside a Smith machine. Grasp the bar with an overhand grip slightly wider than
  shoulder-width. Unrack the bar and hold it above your upper chest with arms extended.

  Execution: Lower the bar smoothly toward your upper chest and collarbones, keeping
  your shoulder blades retracted and elbows angled at roughly 45–60 degrees from your
  torso.

  Return: Press the bar straight up along the guided track until your arms are nearly
  fully extended, focusing on the contraction of the clavicular (upper) pectorals.

  Cues: Keep your feet flat on the floor and maintain a stable arch in your upper
  back without lifting your glutes off the bench.'
