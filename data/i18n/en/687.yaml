name: Overhead Press
description: '- Unrack the barbell from shoulder height with an overhand grip slightly
  wider than shoulder width, resting it on your anterior deltoids.

  - Brace your core and glutes, tilt your head slightly back, and press the bar vertically
  in a straight path.

  - As the bar passes your forehead, bring your head slightly forward and lock out
  your arms overhead over midfoot.

  - Lower the barbell under control back to your upper chest and shoulders.'
