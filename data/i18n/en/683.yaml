name: Power Clean
description: '- Stand over the barbell with feet hip-width apart and grip the bar
  slightly wider than shoulder-width using a hook grip.

  - Keep your back flat and chest lifted as you initiate the first pull by extending
  your knees and hips smoothly to knee level.

  - Explosively extend hips, knees, and ankles (triple extension) while shrugging
  and pulling the bar upward close to your torso.

  - Drop quickly into a partial squat, rotating your elbows forward to catch the bar
  across your front deltoids (front-rack position), then stand tall.'
