name: Barbell Reverse Lunge
description: "Starting Position:\nRest a barbell across your upper trapezius. Stand\
  \ tall with your feet hip-width apart, chest proud, and core firmly braced.\n\n\
  Execution:\n1. Take a deliberate, controlled step backward with one leg, keeping\
  \ your hips square.\n2. Lower your hips vertically until your front thigh is parallel\
  \ to the floor and your back knee hovers just above the mat (both knees at roughly\
  \ 90 degrees).\n3. Drive firmly through the heel and midfoot of your FRONT leg to\
  \ stand back up to the starting position.\n4. Repeat with the opposite leg, alternating\
  \ sides, or complete all reps on one leg before switching.\n\nCues:\nPush through\
  \ the front heel rather than kicking off the rear foot to keep tension loaded on\
  \ the lead glute and quadriceps."
