name: Pec Deck Rear Delt Fly
description: "Starting Position:\nSit facing the pad of a pec deck machine. Adjust\
  \ the seat height so that the handles align with your shoulders. Rest your chest\
  \ flat against the back pad, plant your feet firmly on the floor, and grasp the\
  \ handles with a neutral or overhand grip with elbows slightly bent.\n\nExecution:\n\
  1. Drive your elbows back and outward in a wide horizontal arc by contracting your\
  \ posterior deltoids.\n2. Pause for a second at peak contraction when your arms\
  \ are in line with your torso.\n3. Slowly resist the weight as you bring the handles\
  \ back together to the starting position without allowing the weight stack to rest.\n\
  \nCues:\nFocus on pulling with the back of your shoulders; avoid shrugging your\
  \ traps upward or relying solely on excessive scapular pinching."
