name: Knee Push-Up
description: 'Start by kneeling on the floor, keeping your knees together. Place your
  hands on the floor in front of you, slightly wider than shoulder-width apart.

  Make sure your body forms a straight line from head to knees. Hands should be positioned
  below shoulders.

  Lower your torso towards the ground, bending your elbows while keeping your trunk
  stable. Keep your knees in contact with the floor.

  Push through your hands to return to the starting position. Be sure to maintain
  contraction of chest, shoulder and arm muscles at the top of the movement.

  Perform the desired number of repetitions, controlling the movement and maintaining
  good form.'
