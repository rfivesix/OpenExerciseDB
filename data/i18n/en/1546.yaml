name: Larsen Press
description: 'Starting Position:

  Lie back on a flat bench beneath the barbell. Extend your legs straight out in front
  of you suspended in mid-air (or rest them flat on an adjacent bench), completely
  removing your feet from the floor. Grasp the bar slightly wider than shoulder-width
  and retract your shoulder blades.


  Execution:

  1. Unrack the bar and lower it with steady control to your mid-chest, keeping your
  core rigidly braced for balance.

  2. Press the barbell straight back up to full arm extension using pure upper-body
  pressing power, completely devoid of leg drive.

  3. Pause briefly at lockout before beginning the next repetition.


  Cues:

  Eliminating leg drive places tremendous isolated overload on the pectorals and triceps
  while forcing significant core and scapular stability.'
