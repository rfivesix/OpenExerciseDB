name: Reverse Barbell Curl
description: |-
  Starting Position:
  Load an appropriate weight on a barbell. Stand upright holding the bar with a shoulder-width pronated (overhand) grip. Brace your core and keep your chest lifted.
  Execution:
  Flex your elbows to curl the bar upward with control, without swinging your torso. Lower the bar smoothly back to the starting position.
