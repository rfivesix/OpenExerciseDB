name: Wide-Grip Pull-Up
description: 'Starting Position:

  Hang from a pull-up bar with an overhand grip significantly wider than shoulder-width
  apart, arms fully extended and core braced.


  Execution:

  1. Pull your body upward by driving your elbows down and out towards your sides
  until your chin clears the bar.

  2. Squeeze your lats firmly at the top of the movement.

  3. Lower yourself back down with control to a full hang before repeating.


  Cues:

  The wide grip shifts greater mechanical emphasis onto the latissimus dorsi and teres
  major, minimizing biceps assistance.'
