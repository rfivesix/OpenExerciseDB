name: Side Lunge (Right)
description: 'Starting Position: Stand upright with your feet wider than shoulder-width
  apart, toes pointing forward or slightly outward.

  Execution: Shift your weight toward your right side, bending your right knee and
  sitting your hips back while keeping your left leg straight and foot flat on the
  floor. Lower until your right thigh is nearly parallel to the ground.

  Return: Drive through your right heel to return to the wide standing position.

  Cues: Keep your chest up, your right knee tracking over your right foot, and do
  not let your heel lift off the ground.'
