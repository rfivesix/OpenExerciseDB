name: Hip hinge
description: |-
  Hip Hinge Exercise DescriptionThe hip hinge is a fundamental movement pattern that involves bending at the hips while keeping the spine neutral. It is commonly used in exercises like deadlifts, kettlebell swings, and good mornings. To perform a hip hinge:&nbsp; &nbsp; Starting Position: Stand with your feet hip-width apart and a slight bend in your knees.&nbsp; &nbsp; Hinge at the Hips: Push your hips back while maintaining a straight back. Your torso should lean forward, and your chest should stay up.&nbsp; &nbsp; Lowering Phase: Continue to hinge until your torso is nearly parallel to the ground, or until you feel a stretch in your hamstrings.&nbsp; &nbsp; Return to Standing: Drive through your heels and thrust your hips forward to return to the starting position.
