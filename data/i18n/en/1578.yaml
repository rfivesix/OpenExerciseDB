name: Hip Hinge
description: 'Starting Position:

  Stand upright with your feet hip-width apart. Place your hands on the creases of
  your hips or across your chest. Keep a soft, slight bend in your knees.


  Execution:

  1. Push your hips straight back as if trying to touch a wall behind you with your
  glutes.

  2. Hinge forward at the hips while maintaining a flat, neutral spine and keeping
  your chest proud.

  3. Lower your torso until you feel a distinct hamstring stretch without rounding
  your lower back.

  4. Drive through your heels and squeeze your glutes powerfully to return to standing.


  Cues:

  The foundational movement pattern for deadlifts, swings, and good mornings. Ensure
  movement originates from the hips, not by squatting or bending the spine.'
