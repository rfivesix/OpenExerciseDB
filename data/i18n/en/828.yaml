name: Incline Bench Reverse Fly
description: '- Lie chest-down on an incline bench set to a 30- to 45-degree angle,
  holding a pair of dumbbells hanging down with palms facing each other.

  - Keeping a slight, rigid bend in your elbows, raise the dumbbells out to the sides
  in a wide arc until your upper arms are level with your shoulders.

  - Squeeze your rear deltoids and upper back muscles firmly at the top.

  - Lower the dumbbells back down slowly and under control without using momentum.'
