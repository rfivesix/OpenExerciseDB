name: Reverse Nordic Curl
description: '- Kneel upright on a padded mat with your toes pointed behind you and
  hips fully extended in a straight line from knees to head.

  - Lean your torso backward slowly under control by bending only at your knees.

  - Resist gravity using your quadriceps, descending as far back as your strength
  allows without breaking at the hips.

  - Contract your quadriceps powerfully to pull yourself back up to the starting tall-kneeling
  position.'
