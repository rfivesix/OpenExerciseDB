name: Split Squat (Right)
description: 'Starting Position: Take a long stride forward with your right leg, keeping
  your feet hip-width apart for balance. Keep your torso upright with your weight
  distributed between both feet.

  Execution: Lower your hips straight down by bending both knees until your right
  thigh is parallel to the ground and your left knee hovers just above the floor.

  Return: Drive upward through your right front heel and left forefoot to return to
  the starting position.

  Cues: Keep your torso vertical and avoid leaning forward or letting your front knee
  track past your toes.'
