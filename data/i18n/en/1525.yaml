name: Medicine Ball Slams
description: 'Starting Position:

  Stand with your feet shoulder-width apart, knees and hips slightly bent, holding
  a medicine ball with both hands at chest height. Engage your core.


  Execution:

  1. Extend your knees and hips explosively while raising the ball overhead, rising
  onto your toes.

  2. Use your core, lats, and arms to slam the ball straight down into the floor between
  your feet with maximum force.

  3. Hinge at your hips and bend your knees to absorb the movement as you follow through.

  4. Squat down to retrieve the ball and immediately transition into the next repetition.


  Cues:

  A full-body explosive power exercise developing triple extension, core strength,
  and metabolic conditioning.'
