name: L-Sit Pull-Ups
description: "Starting Position:\nGrip a pull-up bar with an overhand grip slightly\
  \ wider than shoulder-width. Hang with your arms fully extended, then lift your\
  \ straight legs directly in front of you to a 90-degree angle with your torso, forming\
  \ an \"L\" shape. Brace your core and hip flexors tightly.\n\nExecution:\n1. Maintaining\
  \ the strict L-sit position, pull yourself upward by driving your elbows down and\
  \ back until your chin clears the bar.\n2. Pause briefly at the top while keeping\
  \ your legs locked horizontally.\n3. Lower your body under strict control back to\
  \ the full hang without letting your legs drop.\n\nCues:\nKeep your knees fully\
  \ extended and toes pointed; do not use momentum or kip."
