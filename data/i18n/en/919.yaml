name: T-Bar Row
description: 'Starting Position: Straddle the T-bar or landmine bar with feet shoulder-width
  apart. Hinge forward at the hips at roughly a 45-degree angle with a flat back and
  slightly bent knees. Grasp the V-grip handles with arms fully extended.

  Execution: Pull the weight smoothly toward your upper abdomen, driving your elbows
  back and squeezing your shoulder blades together at the top of the movement.

  Return: Lower the weight under control until your arms are extended, keeping your
  spine in a neutral position throughout.

  Cues: Keep your chest lifted and avoid using excessive momentum or rounding your
  lower back.'
