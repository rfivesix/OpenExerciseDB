name: Standing Barbell Lunge
description: 'Put barbell on the back of your shoulders. Stand upright, then take
  the first step forward. Step should bring you forward so that your supporting legs
  knee can touch the floor. Then stand back up and repeat with the other leg.

  Remember to keep good posture.'
