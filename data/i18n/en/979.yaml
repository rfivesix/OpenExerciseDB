name: Hanging Leg Raise
description: 'Starting Position: Hang from a pull-up bar with a firm shoulder-width
  grip, body elongated and shoulders engaged to protect the joints.

  Execution: Keeping your legs straight, contract your abdominal muscles to raise
  your legs until they are at least parallel to the floor (a 90-degree angle with
  your torso) or higher.

  Return: Lower your legs slowly and smoothly back to the vertical hanging position
  without swinging.

  Cues: Initiate the movement from your core and pelvis, not by swinging through the
  shoulders or arching your back.'
