name: Left-Leg Calf Raise
description: 'Stand on the floor or on the edge of a step to increase the range of
  movement.

  Raise one foot.

  Lift your heel until you''re standing on your toes.

  (variable) Stay in this position for three seconds

  Slowly lower your foot until you almost touch the ground with your heel - don''t
  slam your foot!'
