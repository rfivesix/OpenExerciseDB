name: Reach ups
description: |-
  To perform this exercise, lie on your back with your arms extended overhead. Then, contract your abdominals and lift your torso off the floor while reaching your arms toward the ceiling to "reach" as high as possible. Slowly return to the starting position, controlling the movement. Reach ups strengthen the abdominal muscles and improve the flexibility of the spine. They can be incorporated into a variety of training routines to work on core strength and stability.
