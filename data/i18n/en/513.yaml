name: T-Bar Row
description: 'The execution of this exercise is very similar to the regular bent over
  rowing, only that the bar is fixed here.

  Grab the barbell with a wide grip (slightly more than shoulder wide) and lean forward.
  Your upper body is not quite parallel to the floor, but forms a slight angle. The
  chest''s out during the whole exercise. Pull now the barbell with a fast movement
  towards your belly button, not further up. Go slowly down to the initial position.
  Don''t swing with your body and keep your arms next to your body.'
