name: Step-Up
description: 'Starting Position: Stand upright facing a sturdy bench, box, or step
  with feet hip-width apart.

  Execution: Place your entire right foot firmly onto the step. Drive through your
  right heel to lift your body onto the platform until your right leg is fully extended.
  Tap your left foot on the surface or bring your left knee up.

  Return: Step back down under control with the left foot, followed by the right foot,
  returning to the starting position.

  Cues: Keep your torso upright and do not push off excessively with the trailing
  leg.'
