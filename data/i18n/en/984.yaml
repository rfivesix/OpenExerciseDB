name: Bodyweight Lunge
description: 'Starting Position: Stand tall with your feet hip-width apart, chest
  lifted, and hands on your hips or held together in front of your chest.

  Execution: Take a controlled, generous step forward with one leg. Lower your hips
  until both knees are bent at approximately 90-degree angles, with the back knee
  hovering just above the floor.

  Return: Push through the front heel to drive yourself back up to the starting standing
  position.

  Cues: Keep your torso upright throughout and ensure the front knee tracks in line
  with your toes without caving inward.'
