name: One-Handed Kettlebell Curl
description: 'Starting Position: Stand upright with feet hip- to shoulder-width apart.
  Hold the kettlebell by the handle in one hand with your arm extended at your side.

  Execution: Curl the kettlebell upward toward shoulder height by flexing your elbow,
  maintaining a stable wrist and neutral spine.

  Return: Lower the weight under control back to full extension. Complete all reps
  before switching sides.

  Cues: Keep your elbow pinned close to your ribcage and resist leaning or twisting
  your torso.'
