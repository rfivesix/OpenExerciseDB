name: Pull-Up Isometric Hold
description: 'Starting Position:

  Grasp a pull-up bar with an overhand grip slightly wider than shoulder-width. Pull
  yourself up into your target hold position (such as chin over the bar or with elbows
  bent at 90 degrees).


  Execution:

  1. Lock your body completely in place at that specific joint angle.

  2. Retract and depress your scapulae, maintaining maximal static contraction in
  your lats, upper back, and biceps.

  3. Hold for the prescribed duration (e.g., 10 to 30 seconds) before lowering under
  control.


  Cues:

  Builds isometric pulling strength, reinforces scapular stability, and helps overcome
  sticking points in the pull-up.'
