name: Deadbug
description: |-
  Lie on your back with hips and knees bent to 90 degrees and arms extended toward the ceiling. Press your lower back flat against the floor. Slowly lower one leg and tap the heel to the floor while keeping your lower back pressed to the floor. Return the knee to the starting position and repeat on the other side. To increase difficulty, lower the opposite arm and leg simultaneously.
