name: Two-Handed Kettlebell Curl
description: 'Starting Position: Stand tall with feet shoulder-width apart, gripping
  the horn handles of the kettlebell with both hands in front of your thighs, arms
  extended.

  Execution: Keeping your elbows stationary at your sides, curl the kettlebell upward
  toward chest height by flexing your biceps.

  Return: Lower the kettlebell slowly and smoothly back to full arm extension.

  Cues: Avoid using torso swing or hip drive to move the weight; focus on pure biceps
  contraction.'
