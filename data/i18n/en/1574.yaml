name: Swimming
description: 'Starting Position:

  Enter the pool and prepare in the water for laps using your preferred stroke (such
  as freestyle or breaststroke).


  Execution:

  1. Swim continuous laps at a steady, rhythmic cadence focusing on smooth breathing
  and efficient propulsion.

  2. Engage your latissimus dorsi, deltoids, and core to pull through the water with
  full arm extension.

  3. Maintain a streamlined horizontal body position throughout the session.


  Cues:

  Swimming provides low-impact, high-efficiency cardiovascular conditioning and muscular
  endurance, heavily engaging the back, shoulders, and core.'
