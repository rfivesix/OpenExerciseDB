name: Smith Machine Overhead Press
description: '- Position an incline bench set to an 80-85 degree angle directly beneath
  the Smith machine bar.

  - Sit back on the bench, grip the bar slightly wider than shoulder width with an
  overhand grip, and unrack it at chin level.

  - Press the bar upward in the fixed track until your arms are extended overhead
  without aggressively locking out your elbows.

  - Lower the bar slowly under control back down to chin or upper-chest level before
  pressing again.'
