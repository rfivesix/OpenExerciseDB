name: Behind-the-Back Cable Lateral Raise
description: "Starting Position:\nStand sideways next to a low cable pulley. Grasp\
  \ the single D-handle with your far (outer) hand with the cable running behind your\
  \ hips and back. Hold onto the cable tower with your inside hand and lean slightly\
  \ forward for balance.\n\nExecution:\n1. Keeping a slight bend in your working elbow,\
  \ raise your arm out to the side until your upper arm is parallel to the floor.\n\
  2. Squeeze your lateral deltoid at the top of the range of motion.\n3. Slowly lower\
  \ the handle back behind your body, feeling the continuous resistance in the side\
  \ shoulder.\n\nCues:\nRunning the cable behind your back prevents friction against\
  \ your hips and maintains pure lateral deltoid recruitment without trap takeover."
