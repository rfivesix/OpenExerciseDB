name: Suitcase Carry
description: "Starting Position:\nDeadlift a heavy dumbbell or kettlebell from the\
  \ floor with one hand like a suitcase. Stand tall with your feet hip-width apart,\
  \ shoulders packed, and torso completely vertical. Brace your core and obliques\
  \ tightly.\n\nExecution:\n1. Walk forward with slow, deliberate, and controlled\
  \ steps in a straight line.\n2. Actively resist the pull of the weight: keep your\
  \ shoulders level and prevent your torso from tilting sideways toward the load (anti-lateral\
  \ flexion).\n3. Continue for the designated distance or time, set the weight down\
  \ safely, and switch hands.\n\nCues:\nWalk with tall posture as if balancing a book\
  \ on your head; do not lean toward the weight or hike your opposite hip."
