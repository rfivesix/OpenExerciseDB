name: Lying Leg Raise
description: Lay down on a bench and hold onto the recliner with your hands to keep
  you stable. Hold your legs straight and lift them till they make an angle of about
  45°. Make a short pause of 1 sec. and go slowly down to the initial position. To
  increase the intensity you can make a longer pause of 7 sec. every 5th time.
