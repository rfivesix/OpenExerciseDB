name: Lying Dumbbell Curl
description: 'Starting Position:

  Hold a dumbbell in each hand and lie flat on your back on a bench. Let your arms
  hang down straight towards the floor on either side of the bench.


  Execution:

  1. Keeping your upper arms stable and elbows in place, curl the dumbbells upward
  until your forearms are perpendicular to the ceiling.

  2. Squeeze your biceps firmly at the top of the movement.

  3. Slowly lower the dumbbells back down under control until your arms are fully
  extended.


  Cues:

  Lying on a bench eliminates torso momentum and places the long head of the biceps
  under a significant passive stretch at the bottom.'
