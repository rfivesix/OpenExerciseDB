name: Leg Extension
description: '- Sit on the leg extension machine, adjusting the backrest and shin
  pad so your knees align with the pivot point and the pad rests comfortably above
  your ankles.

  - Grip the side handles to stabilize your upper body.

  - Extend your knees smoothly to lift the weight until your legs are nearly straight,
  squeezing your quadriceps.

  - Hold the peak contraction briefly without harshly locking out your knees, then
  lower the weight under slow, steady control.'
