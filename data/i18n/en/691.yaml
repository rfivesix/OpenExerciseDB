name: Smith Machine Upright Row
description: 'The movements are basically the same as with an SZ-bar, but you use
  the bar on the multi press:

  Stand straight, your feet are shoulder-width apart. Hold the bar with an overhand
  grip on your thighs, the arms are stretched. Lift the bar close to the body till
  your chin. The elbows point out so that at the highest point they form a V. Make
  here a short pause before going slowly down and repeating the movement.'
