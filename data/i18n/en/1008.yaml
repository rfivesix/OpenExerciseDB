name: Neck Stretch (Left)
description: 'Starting Position: Sit or stand upright with shoulders relaxed and down.

  Execution: Gently tilt your head to the right, bringing your right ear toward your
  right shoulder to stretch the left side of your neck and upper trapezius. Optionally
  place your right hand lightly over your head to deepen the stretch with minimal
  pressure.

  Return: Hold for 15–30 seconds while breathing smoothly, then slowly return your
  head to the neutral center.

  Cues: Keep your left shoulder depressed; do not shrug either shoulder upward.'
