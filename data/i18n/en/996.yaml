name: Mountain Climbers
description: 'Starting Position: Start in a high plank position with your hands directly
  under your shoulders, core braced, and body forming a straight line from head to
  heels.

  Execution: Drive your right knee forward toward your chest without letting your
  hips pike or your foot touch down. Quickly return the right leg while simultaneously
  driving the left knee forward in a rhythmic running cadence.

  Cues: Keep your hips down, shoulders stacked over your wrists, and back flat throughout
  the movement.'
