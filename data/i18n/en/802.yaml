name: Walking Barbell Lunge
description: '- Rest a barbell across your upper back (trapezius) and stand tall with
  feet hip-width apart.

  - Take a controlled step forward with one leg and lower your hips until both knees
  are bent at approximately 90 degrees.

  - Drive through your front heel to stand up and immediately step forward with your
  trailing leg into the next lunge.

  - Continue walking forward in a smooth, alternating rhythm while keeping your torso
  upright and core engaged.'
