name: Cable Biceps Curl
description: 'Starting Position:

  Attach a straight or EZ bar to the low pulley of a cable station. Stand upright
  (or sit) facing the machine and grasp the bar with a shoulder-width supinated grip
  (palms facing up). Pin your elbows to your sides.


  Execution:

  1. Keeping your upper arms completely still, curl the bar up towards your upper
  chest by flexing at the elbows.

  2. Squeeze your biceps hard at the top of the range of motion.

  3. Lower the weight under control until your arms are almost fully extended, resisting
  the cable tension.


  Cues:

  Cables deliver continuous mechanical tension on the biceps throughout both the concentric
  and eccentric phases.'
