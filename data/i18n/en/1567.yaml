name: Alternating Dumbbell Hammer Curl
description: 'Starting Position:

  Stand tall with knees slightly bent and feet shoulder-width apart. Hold a dumbbell
  in each hand at your sides with a neutral grip (palms facing each other).


  Execution:

  1. Keeping your upper arm stationary and elbow tucked, curl one dumbbell up toward
  your shoulder with the weight vertical.

  2. Squeeze your brachioradialis and brachialis firmly at the top of the curl.

  3. Lower the dumbbell slowly with control back to the starting position before repeating
  with the other arm.


  Cues:

  Avoid swinging the torso or using momentum. The neutral grip maximizes tension on
  the forearm and brachialis.'
