name: TRX Biceps Curl
description: 'Starting Position: Grasp the TRX handles with an underhand (supinated)
  grip and face the anchor point. Lean backward with your arms extended and feet positioned
  forward, keeping your body in a rigid plank line.

  Execution: Keeping your elbows high at shoulder height and pointed forward, flex
  your elbows to pull your forehead toward your hands using biceps strength.

  Return: Slowly lower your body backward under control by extending your arms back
  to the starting position.

  Cues: Do not drop your elbows or use hip thrusting momentum; maintain full core
  tension throughout.'
