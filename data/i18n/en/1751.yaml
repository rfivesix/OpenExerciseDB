name: Cable Pull-Through
description: "Starting Position:\nAttach a rope attachment to the lowest setting of\
  \ a cable pulley. Stand facing away from the machine with the cable running between\
  \ your legs. Grip the rope handles with both hands, take two steps forward to establish\
  \ cable tension, and adopt a stance slightly wider than shoulder-width with a slight\
  \ bend in your knees.\n\nExecution:\n1. Hinge at your hips, pushing your glutes\
  \ backward while keeping your spine flat and shoulders packed.\n2. Allow the rope\
  \ to travel backward between your legs until you feel a deep stretch in your hamstrings.\n\
  3. Powerfully drive your hips forward to return to an upright standing position,\
  \ squeezing your glutes firmly at the top.\n\nCues:\nThis is a hip hinge, not a\
  \ squat. Keep your arms relaxed and straight; do not pull the weight with your upper\
  \ body."
