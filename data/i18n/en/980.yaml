name: Commando Pull-Up
description: 'Starting Position: Stand directly beneath the pull-up bar aligned with
  its length. Grip the bar with one hand facing forward (prone) and one hand facing
  backward (supine) in a close staggered grip. Hang with arms extended.

  Execution: Pull your body upward while keeping your torso straight and preventing
  rotation, bringing your head to one side of the bar until your shoulder touches
  it.

  Return: Lower yourself smoothly back to a full hang, then repeat by pulling up with
  your head passing on the opposite side of the bar. Alternate sides with each repetition.

  Cues: Maintain core tightness to resist rotational forces. Switch hand positions
  between sets for balanced development.'
