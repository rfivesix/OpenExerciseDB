name: Reverse Hyperextension
description: "Starting Position:\nLie face-down on a flat bench or reverse hyper machine\
  \ so that your hips rest right at the rear edge and your legs hang freely toward\
  \ the floor. Firmly grip the bench or handles to anchor your upper body.\n\nExecution:\n\
  1. Squeeze your glutes and hamstrings to raise your legs backward and upward in\
  \ a smooth, controlled arc.\n2. Lift until your legs are parallel with your torso,\
  \ feeling a peak contraction in your glutes and spinal erectors.\n3. Hold for a\
  \ brief pause at the top without hyperextending your lower back.\n4. Slowly lower\
  \ your legs back toward the starting position under control before beginning the\
  \ next rep.\n\nCues:\nFocus on hip extension driven by the glutes and hamstrings\
  \ rather than swinging your legs or hyperextending your lumbar spine."
