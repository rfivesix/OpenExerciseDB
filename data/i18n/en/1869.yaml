name: Lying Figure Four Stretch
description: "Starting Position: Lie on your back on a mat with your knees bent and\
  \ feet flat on the floor.\nExecution: Cross your right ankle over your left knee,\
  \ creating a figure-four shape. Reach through and grasp the back of your left thigh\
  \ with both hands, gently drawing the leg toward your chest until you feel a deep\
  \ stretch in your right glute and piriformis.\nTips: Keep your head, neck, and shoulders\
  \ relaxed on the floor. Hold for 20–30 seconds while breathing smoothly, then repeat\
  \ on the opposite side."
