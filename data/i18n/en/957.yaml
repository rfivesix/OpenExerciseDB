name: Quadruped Arm and Leg Raise (Bird Dog)
description: 'Starting Position: Begin on all fours (quadruped position) with your
  hands directly under your shoulders and your knees directly under your hips. Keep
  your head and spine in a neutral alignment.

  Execution: Simultaneously extend your right arm forward and your left leg backward
  until both are parallel to the floor, actively squeezing your glute and lower back
  muscles.

  Return: Hold for 1–2 seconds at full extension, then slowly lower your hand and
  knee back to the floor. Alternate sides on each repetition.

  Cues: Keep your core braced and your hips square to the ground; do not allow your
  pelvis to rotate or your lower back to hyperextend.'
