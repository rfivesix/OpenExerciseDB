name: Jump Rope (Basic Jumps)
description: 'Starting Position: Stand with feet close together, holding a jump rope
  handle in each hand with the rope resting behind your heels. Keep elbows tucked
  in close to your ribs.

  Execution: Turn the rope with small, controlled wrist rotations and jump slightly
  off the ground (about 1–2 inches) as the rope passes beneath your feet. Land softly
  on the balls of your feet.

  Cues: Keep your knees softly bent and maintain a relaxed, rhythmic cadence. Power
  the rope from your wrists, not your whole arms.'
