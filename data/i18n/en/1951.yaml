name: Foam Roll Adductors
description: 'Lie face down on a mat and prop yourself onto your forearms. Place a foam roller parallel to your body and extend one leg out to the side with the knee bent at roughly 90 degrees, resting your inner thigh on top of the roller. Slowly roll back and forth from just above the knee joint up toward the groin, pausing on tight spots for 10-15 passes per side. (Part of Joe DeFranco''s Limber 11 routine; note: this exercise entry is deprecated).'
