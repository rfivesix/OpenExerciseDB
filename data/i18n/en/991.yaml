name: Split Squat (Left)
description: 'Starting Position: Take a long stride forward with your left leg, keeping
  your feet hip-width apart for balance. Keep your torso upright with your weight
  distributed between both feet.

  Execution: Lower your hips straight down by bending both knees until your left thigh
  is parallel to the ground and your right knee hovers just above the floor.

  Return: Drive upward through your left front heel and right forefoot to return to
  the starting position.

  Cues: Keep your torso vertical and avoid leaning forward or letting your front knee
  track past your toes.'
