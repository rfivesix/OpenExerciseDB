name: Cross-Body Shoulder Stretch
description: 'Starting Position:

  Stand or sit upright with your shoulders relaxed and spine in neutral alignment.


  Execution:

  1. Bring one arm horizontally across your chest at shoulder height.

  2. Use your opposite hand to gently press your upper arm or elbow closer to your
  torso until you feel a comfortable stretch in the rear shoulder.

  3. Hold the position for 20 to 30 seconds, breathing steadily.

  4. Release slowly and repeat on the opposite side.


  Cues:

  Effectively stretches the posterior deltoid and external rotators. Avoid elevating
  the shoulder toward your ear during the stretch.'
