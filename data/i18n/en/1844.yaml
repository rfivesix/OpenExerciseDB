name: Frog Stretch
description: "Starting Position: Begin on your hands and knees (quadruped) and widen\
  \ your knees as far apart as comfortable. Drop down onto your forearms, keeping\
  \ your shins parallel and inner feet resting on the mat.\nExecution: Keeping your\
  \ spine neutral, slowly rock your hips backward toward your heels until you feel\
  \ a deep stretch in your hip adductors and groin.\nTips: Rock gently forward and\
  \ backward with control or hold the deep stretch for 20–30 seconds while breathing\
  \ deeply."
