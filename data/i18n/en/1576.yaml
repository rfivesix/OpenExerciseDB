name: Snap Down
description: 'Starting Position:

  Stand tall with feet shoulder-width apart. Reach your arms straight up overhead
  and rise onto your toes, making your body as tall and elongated as possible.


  Execution:

  1. Explosively snap your arms downward while rapidly dropping your hips and bending
  your knees into a solid athletic stance.

  2. Land softly on full feet, absorbing the force with chest up, hips hinged, and
  core firmly braced.

  3. Hold the solid athletic landing position for a brief pause before resetting.


  Cues:

  Develops rapid deceleration, landing mechanics, and eccentric control to prepare
  for explosive jumps and changes of direction.'
