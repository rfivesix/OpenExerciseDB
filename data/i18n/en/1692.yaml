name: Incline Smith Press
description: |-
  Execution
  
  Starting position:
  Unrack the bar and hold it above your upper chest with arms fully extended. Keep your shoulder blades retracted and pressed firmly into the bench.
  
  Lowering phase (eccentric):
  Slowly bring the bar down to just below your collarbone or upper chest. Maintain control throughout the descent and do not bounce the bar off your chest.
  
  Pressing phase (concentric):
  Push the bar upward along the fixed track until your arms are fully extended. Focus on squeezing your upper chest at the top of the movement.
  
  Lock and repeat:
  Complete your repetitions, then safely rotate and lock the bar back into the machine hooks.
