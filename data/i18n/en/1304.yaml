name: Meadows Row
description: The Meadows row is a unilateral row performed with a landmine setup, overhand grip, and staggered stance. Lean
  your torso forward and grip the barbell. Rest the other forearm on the forward leg. Start this movement by driving the elbow
  behind you while retracting the shoulder-blade. Keep the working shoulder down. Pull toward your back hip until the elbow
  is level with your torso.
