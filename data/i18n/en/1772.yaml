name: Reverse Crunch
description: "Starting Position:\nLie flat on your back on a mat with your arms at\
  \ your sides, palms pressing into the floor for support. Raise your legs with your\
  \ hips and knees bent at approximately 90 degrees.\n\nExecution:\n1. Contract your\
  \ abdominal muscles and curl your knees toward your chest.\n2. At the peak of the\
  \ movement, actively curl your pelvis and lower back a few inches off the mat.\n\
  3. Hold the contraction at the top for 1 to 2 seconds while breathing out.\n4. Slowly\
  \ and under control, lower your pelvis back down until your thighs return to vertical,\
  \ keeping abdominal tension engaged.\n\nCues:\nAvoid kicking or using momentum with\
  \ your legs; the movement must be driven purely by curling your spine with your\
  \ abdominals."
