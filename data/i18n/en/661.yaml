name: Machine Triceps Extension
description: '- Sit at the triceps machine and adjust the seat height so that your
  elbows align with the machine''s pivot point.

  - Grip the handles firmly and rest your upper arms securely on the support pad.

  - Press the handles downward by extending your elbows, fully contracting your triceps
  without aggressively locking your joints.

  - Slowly return the weight to the starting position under control, keeping your
  upper arms stationary against the pad.'
