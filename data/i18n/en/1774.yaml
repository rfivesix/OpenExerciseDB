name: Chair Dips
description: "Starting Position:\nSit on the front edge of a sturdy chair or bench.\
  \ Place your hands next to your hips gripping the edge, fingers pointing forward.\
  \ Extend your arms and slide your hips forward so they hover just off the edge.\
  \ Place your feet flat on the floor with knees bent (easier) or extend your legs\
  \ out straight with heels on the floor (harder).\n\nExecution:\n1. Slowly lower\
  \ your body by bending your elbows directly behind you, keeping your back close\
  \ to the chair.\n2. Descend until your upper arms are approximately parallel to\
  \ the floor (90-degree bend in the elbows).\n3. Press firmly through your palms\
  \ to extend your arms, returning to the starting position with triceps locked out.\n\
  \nCues:\nKeep your torso upright and close to the chair; avoid flaring your elbows\
  \ wide outward to protect your anterior shoulder capsule."
