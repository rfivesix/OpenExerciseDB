name: Rubber Band Glute Kickback
description: A rubber band glute kickback is an exercise performed on hands and knees,
  where you anchor a resistance band to your foot and kick your heel back and up,
  squeezing your glute at the top of the movement, while maintaining a stable core
  and flat back to target and strengthen the gluteal muscles.
