name: Child's Pose
description: 'Starting Position: Kneel on a mat with your knees spread wide, big toes
  touching, and sit back onto your heels.

  Execution: Fold forward at your hips, resting your torso between your thighs. Extend
  your arms long in front of you on the mat, palms down, and gently lower your forehead
  to the floor.

  Cues: Breathe deeply into your back and ribcage, allowing your spine, hips, and
  shoulders to relax and lengthen with each exhalation.'
