name: Suspension Chest Fly
description: 'Starting Position: Grasp the suspension trainer handles with a neutral
  grip and lean forward into an incline plank, arms extended straight in front of
  your chest and body in a rigid line from head to heels.

  Execution: Maintaining a slight bend in your elbows, open your arms out to the sides
  in a wide arc until you feel a deep, comfortable stretch across your pectorals.

  Return: Engage your chest muscles to bring the handles back together in front of
  your body, keeping your core braced and hips aligned.

  Cues: Adjust your body angle relative to the floor to scale difficulty (more horizontal
  increases resistance).'
