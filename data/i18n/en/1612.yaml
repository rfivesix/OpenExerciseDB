name: Kettlebell Sumo Deadlift
description: 'Place your feet wider than shoulder-width apart, pointing your toes
  outward.

  Keep your back straight, shoulders back, and chest up.

  The knees must follow the same direction as the toes and not move forward.

  When going up, it is advisable to contract your glutes to maximize the effectiveness
  of the exercise..'
