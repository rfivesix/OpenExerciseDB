name: Forward Shoulder Rotation
description: 'Starting Position: Sit or stand tall with a neutral spine and relaxed
  shoulders. Place the fingertips of each hand lightly on top of your shoulders.

  Execution: Draw smooth, large circles forward with your elbows, rotating your shoulder
  joints in a continuous and controlled rhythm.

  Cues: Keep your neck relaxed and chest open; focus on mobilizing the glenohumeral
  joint and scapulae without straining.'
