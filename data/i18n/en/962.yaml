name: Elliptical Trainer
description: 'Starting Position: Step onto the pedals and take hold of the moving
  handles or stationary bar. Stand tall with your chest up and core engaged.

  Execution: Push through your feet in a smooth, continuous elliptical gliding motion
  while pushing and pulling the handles in opposition to your leg drive.

  Cues: Keep your entire foot in contact with the pedals to reduce calf strain and
  engage glutes and hamstrings. Maintain an upright posture without slouching.'
