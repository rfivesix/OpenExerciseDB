name: DB Wrist Extension
description: "Starting Position: Sit on a bench and grasp two dumbbells with an overhand\
  \ (pronated) grip. Rest your forearms across your thighs or knees with your wrists\
  \ extending just past your knees.\nExecution: Lower the dumbbells by allowing your\
  \ wrists to flex fully downward toward the floor. Then raise the dumbbells by extending\
  \ your wrists upward as high as comfortable, squeezing the forearm extensors at\
  \ the top.\nTips: Keep your forearms stationary throughout the movement, isolating\
  \ the wrist extension."
