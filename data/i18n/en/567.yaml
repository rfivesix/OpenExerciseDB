name: Dumbbell Shoulder Press
description: Sit on a bench, the back rest should be almost vertical. Take two dumbbells
  and bring them up to shoulder height, the palms and the elbows point during the
  whole exercise to the front. Press the weights up, at the highest point they come
  very near but don't touch. Go slowly down and repeat.
