name: Backward Shoulder Rotation
description: 'Starting Position: Sit or stand tall with a neutral spine and relaxed
  shoulders. Place the fingertips of each hand lightly on top of your shoulders.

  Execution: Draw smooth, large circles backward with your elbows, opening up your
  chest and gently squeezing your shoulder blades together as you rotate.

  Cues: Keep your neck relaxed and breathe evenly throughout the mobility movement.'
