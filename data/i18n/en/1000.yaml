name: Floor Dips
description: 'Starting Position: Sit on the floor with knees bent and feet flat on
  the ground. Place your hands on the floor just behind your hips with fingers pointing
  forward toward your feet. Lift your hips a few inches off the floor.

  Execution: Bend your elbows to lower your hips toward the floor, keeping your elbows
  tracking backward and close to your body.

  Return: Press through the palms of your hands to extend your arms and raise your
  hips back up, contracting your triceps at the top.

  Cues: Keep the movement centered at your elbow joint rather than merely rocking
  your hips up and down.'
