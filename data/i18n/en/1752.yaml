name: Front-Crossing Cable Lateral Raise
description: "Starting Position:\nStand sideways next to a low cable pulley. Grasp\
  \ the single D-handle with your far (outer) hand so that the cable crosses in front\
  \ of your body. Brace yourself with the inside hand on the cable tower and stand\
  \ tall with a slight knee bend.\n\nExecution:\n1. With a slight bend in your elbow,\
  \ raise your arm out to the side until your hand reaches shoulder height.\n2. Pause\
  \ briefly at the top to emphasize peak contraction in the lateral deltoid.\n3. Slowly\
  \ lower your arm back across the front of your body under control, maintaining continuous\
  \ tension.\n\nCues:\nFocus the effort entirely on the side (lateral) deltoid; do\
  \ not shrug your upper traps or lean away from the pulley."
