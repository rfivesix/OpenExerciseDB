name: YTWL Exercise
description: "Purpose: Improves shoulder stability, posture, and scapular (shoulder\
  \ blade) control. Often used in physical therapy and warm-ups.\nStarting Position:\n\
  Stand with feet shoulder-width apart. Hinge forward at the hips (like a\ndeadlift)\
  \ keeping your back flat, or lie face down on an incline bench.\nKeep your thumbs\
  \ pointing up throughout.\nY (Arms up):\nExtend both arms straight forward and upward\
  \ at a 135-degree angle from\nyour body, forming a \"Y\". Squeeze your shoulder\
  \ blades together at the\ntop.\nT (Arms out): Open your arms straight out to the\
  \ sides, perpendicular to your body, forming a \"T\". Focus on pinching your shoulder\
  \ blades.\nW (Arms bent): Pull your elbows back, bending them to 90 degrees, and\
  \ squeeze your shoulder blades to form a \"W\". Keep your wrists firm.\nL (Arms\
  \ rotated):\nStart with elbows bent at 90 degrees and close to your body. Rotate\n\
  your forearms outward (external rotation) like a goalpost, forming an\n\"L\" or\
  \ a gate.\nKey Focus:\nMovements should be slow and controlled. Always lead with\
  \ the thumbs\nand think about moving the shoulder blades, not just the arms."
