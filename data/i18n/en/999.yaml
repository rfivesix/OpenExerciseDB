name: Reverse Lunge
description: 'Starting Position: Stand tall with feet hip-width apart, chest lifted
  and hands on hips or in front of your chest.

  Execution: Take a controlled step backward with one leg, landing on the ball of
  your foot. Lower your hips until your front thigh is parallel to the ground and
  your back knee hovers just above the floor.

  Return: Drive through your front heel to return to the standing starting position.

  Cues: Keep your torso upright and front knee tracking over your front toes.'
