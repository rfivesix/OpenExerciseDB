name: Ring Support Hold
description: "Starting Position:\nStand between a pair of hanging gymnastics rings.\
  \ Grasp the rings with a firm neutral grip and jump or press yourself up into a\
  \ top support position with arms fully locked out.\n\nExecution:\n1. Actively turn\
  \ the rings outward (Rings Turned Out / RTO) so that your palms face forward and\
  \ thumbs point away from your body, preventing your forearms from resting against\
  \ the straps.\n2. Depress your shoulders firmly away from your ears and lock your\
  \ elbows completely straight.\n3. Lock into a hollow-body position: brace your abs,\
  \ squeeze your glutes, and hold your legs straight together with toes pointed.\n\
  4. Maintain this rigid isometric hold for the required duration while breathing\
  \ steadily.\n\nCues:\nTurning the rings out eliminates resting on the straps and\
  \ maximizes chest, bicep, and anterior shoulder stabilization."
