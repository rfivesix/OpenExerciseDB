name: Single-Leg Hamstring Curl
description: 'Starting position:

  Lie on your back on a mat. Place the heel of one leg on the floor (or on a slider/towel) with the knee slightly bent, while
  holding the other leg elevated off the ground.


  Execution:

  1. Lift your hips off the mat into a single-leg bridge position.

  2. Curl your heel toward your glutes by flexing at the knee, strongly contracting the hamstrings.

  3. Slowly extend your leg back out under control while keeping your hips elevated.


  Tips:

  Effectively isolates and strengthens the hamstring group (biceps femoris, semimembranosus, semitendinosus) unilaterally
  using only bodyweight.'
