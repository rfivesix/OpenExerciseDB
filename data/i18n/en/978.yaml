name: Hanging Knee Raise
description: 'Starting Position: Hang from a pull-up bar with an overhand grip, arms
  fully extended and shoulders packed. Keep your legs together and body still.

  Execution: Engage your abs and curl your knees up toward your chest, flexing your
  spine and tucking your pelvis upward to maximize abdominal contraction.

  Return: Lower your legs back down under control to the starting position without
  swinging.

  Cues: Avoid swinging your legs or using momentum. Focus on posteriorly tilting your
  pelvis at the top.'
