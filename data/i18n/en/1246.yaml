name: TRX Rollout
description: 'Starting position:

  Kneel or stand facing away from the anchor point, holding the TRX handles with arms extended forward at chest height.


  Execution:

  1. Keeping your core braced and your body in a straight rigid line, lean forward and allow your arms to extend straight
  overhead.

  2. Lower yourself forward under control to a point where you can still maintain tension without collapsing through your
  lower back.

  3. Engage your abs and lats to pull your arms down, returning your body to the starting position.


  Tips:

  Keep your glutes and abs tight throughout to protect your lower back and prevent hyperextension.'
