name: Runners Lunge Stretch
description: "Starting Position: Step forward into a deep lunge, placing both hands\
  \ flat on the floor on either side (or to the inside) of your front foot.\nExecution:\
  \ Press through the ball of your back foot and extend your trailing leg straight\
  \ back, allowing your hips to sink toward the floor. Keep your front knee stacked\
  \ directly over the ankle.\nTips: Keep your chest lifted and spine long rather than\
  \ rounding forward. Feel the stretch across the trailing hip flexor and front hamstring.\
  \ Hold for 20–30 seconds, then switch legs."
