name: Devil's Press
description: 'Starting Position:

  Place a pair of dumbbells on the floor shoulder-width apart and stand behind them.


  Execution:

  1. Drop down placing your hands on the dumbbell handles, kick your feet back into
  a plank, and lower your chest to the floor between the weights (dumbbell burpee).

  2. Explosively jump your feet forward just outside the dumbbells into a wide hinge
  stance.

  3. In one continuous, fluid hip-hinge motion, swing the dumbbells slightly back
  between your legs and snatch them directly overhead to full lockout.

  4. Lower the dumbbells under control back to the floor and immediately begin the
  next rep.


  Cues:

  A demanding metabolic conditioning movement combining a burpee and a double dumbbell
  snatch. Keep your back flat during the hip drive.'
