name: Underhand Lat Pulldown
description: '- Sit at the lat pulldown station and adjust the thigh pads to secure
  your lower body firmly.

  - Grip the bar with an underhand (supinated) grip at shoulder width or slightly
  narrower.

  - Pull the bar smoothly down to your upper chest by driving your elbows down and
