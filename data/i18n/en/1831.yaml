name: Hammerstrength Decline Chest Press
description: "Starting Position:\nSit in a Hammer Strength decline chest press machine\
  \ with your shoulder blades retracted and depressed against the back pad. Adjust\
  \ the seat height so that the handles sit level with your lower chest. Plant your\
  \ feet firmly on the floor and grasp the handles with an overhand grip slightly\
  \ wider than shoulder-width.\n\nExecution:\n1. Brace your core and drive through\
  \ your palms to press the handles forward and slightly downward, keeping your elbows\
  \ tucked at approximately 45 degrees.\n2. Extend your arms to near lockout and strongly\
  \ contract the lower (sternocostal) pectoral fibers.\n3. Slowly lower the weight\
  \ arms back under control until you achieve a comfortable stretch across your chest\
  \ before the next repetition.\n\nCues:\nKeep your head, upper back, and hips pressed\
  \ firmly against the seat pad throughout the set."
