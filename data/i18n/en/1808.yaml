name: Parallel Bar Support Hold
description: "Starting Position:\nStand between a pair of parallel bars or dip station.\
  \ Grasp the bars with a neutral grip and jump or press yourself up to a top support\
  \ position with arms fully extended and locked out.\n\nExecution:\n1. Actively depress\
  \ your shoulder blades, pressing your shoulders down away from your ears with a\
  \ proud chest.\n2. Brace your core, squeeze your glutes, and lock your legs together\
  \ with pointed toes in a hollow-body position.\n3. Maintain this rigid isometric\
  \ hold for the prescribed duration while practicing controlled, steady breathing.\n\
  4. Step down safely under control when finished.\n\nCues:\nDo not allow your shoulders\
  \ to shrug up toward your ears or your lower back to collapse; maintain active scapular\
  \ depression throughout."
