name: Cable Fly
description: 'Starting Position: Set the pulleys of a cable crossover machine at chest
  or shoulder height. Grasp the handles and take two steps forward into a staggered
  stance with a straight back and slight forward lean.

  Execution: Bring the handles together in front of your chest in a wide hugging arc,
  keeping a slight bend in your elbows and squeezing your pecs at the center.

  Return: Slowly return your arms outward until you feel a comfortable stretch across
  your chest.

  Note: This exercise is deprecated.'
