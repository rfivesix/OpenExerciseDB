name: Renegade Row
description: |-
  Get into a high plank or push-up position with your hands gripping a pair of hex dumbbells resting on the floor. Spread your feet slightly wider than shoulder-width for stability. Perform one push-up, then row one dumbbell upward by driving your elbow toward your ribcage while keeping your hips square. Lower the dumbbell under control, perform another push-up, and row with the opposite arm to complete one repetition.
