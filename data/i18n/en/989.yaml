name: Bulgarian Split Squat (Right)
description: 'Starting Position: Stand about two feet in front of a sturdy bench or
  chair. Place the top of your left foot onto the bench behind you, with your right
  foot firmly planted forward.

  Execution: Lower your hips by bending your right knee until your right thigh is
  roughly parallel to the ground and your left knee hovers just above the floor.

  Return: Push through the heel and midfoot of your right leg to return to the starting
  upright position.

  Cues: Keep your torso slightly leaned forward from the hips with a flat back; do
  not let your front knee collapse inward.'
