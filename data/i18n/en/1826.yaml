name: Band Pull-Apart with External Rotation
description: "Starting Position:\nStand tall with feet shoulder-width apart, chest\
  \ upright, and shoulders set back and down. Grasp a light resistance band with both\
  \ hands using an underhand (supinated) grip in front of your navel. Bend your elbows\
  \ to 90 degrees and tuck your upper arms tight against your ribcage.\n\nExecution:\n\
  1. Keeping your elbows glued to your sides, rotate your forearms and hands outward\
  \ away from each other, stretching the band.\n2. Squeeze your shoulder blades together\
  \ and down as your shoulders externally rotate.\n3. Hold the end-range contraction\
  \ for 1 to 2 seconds to stimulate the infraspinatus and teres minor.\n4. Slowly\
  \ return your hands to the front starting position under full control.\n\nCues:\n\
  Do not allow your elbows to flare away from your ribs; the movement must come strictly\
  \ from glenohumeral external rotation."
