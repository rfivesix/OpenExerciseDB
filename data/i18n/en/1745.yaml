name: Cable Front Raise with Short Bar
description: "Starting Position:\nAttach a short straight bar to the low pulley of\
  \ a cable station. Stand facing away from the machine with the cable running between\
  \ your legs. Grasp the bar with a shoulder-width overhand grip (palms down) resting\
  \ against your thighs. Maintain an upright posture with chest up, shoulders depressed,\
  \ and a slight bend in your knees.\n\nExecution:\n1. Keeping your elbows nearly\
  \ straight, raise the bar upward and forward in a smooth arc until your hands are\
  \ level with your shoulders.\n2. Pause for a second at the top, focusing on the\
  \ contraction in your anterior deltoids.\n3. Slowly lower the bar back to the starting\
  \ position under control, keeping tension on the shoulders throughout.\n\nCues:\n\
  Avoid rocking your torso or hyperextending your lower back to swing the weight up."
