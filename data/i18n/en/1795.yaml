name: Unilateral Cross-Body Cable Pulldown
description: "Starting Position:\nSet the pulley of a cable station to its highest\
  \ position. Stand slightly offset so the cable travels diagonally across your upper\
  \ torso. Grasp the handle or cable ball with your far hand, maintain a slight forward\
  \ hinge at the hips, and allow your arm to extend fully upward in line with the\
  \ cable.\n\nExecution:\n1. Pull the cable diagonally downward and inward across\
  \ your torso toward your hip, keeping a slight, fixed bend in your elbow.\n2. Drive\
  \ your elbow tightly toward your ribcage, squeezing your latissimus dorsi and teres\
  \ major hard at peak contraction.\n3. Slowly let the cable guide your arm back up\
  \ along the diagonal path into a full lat stretch before initiating the next rep.\n\
  \nCues:\nAligning the cable across your body matches the natural anatomical fiber\
  \ orientation of your lats for superior isolated recruitment."
