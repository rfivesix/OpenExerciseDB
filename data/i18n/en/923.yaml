name: Lying Dumbbell Row and Seated Shrug
description: 'Starting Position: Lie face down (prone) on a slight incline bench (around
  30–45 degrees), holding a pair of dumbbells with arms hanging straight toward the
  floor in a neutral grip.

  Execution:

  1. Lying Dumbbell Row: Pull the dumbbells upward by driving your elbows back past
  your torso, squeezing your lats and mid-back at the peak. Lower under control. Complete
  the prescribed row repetitions.

  2. Seated Shrug: Immediately sit upright on the bench and perform dumbbell shrugs,
  elevating your shoulders straight up toward your ears to target the upper and middle
  traps.

  Return: Lower the dumbbells smoothly with control after each repetition.'
