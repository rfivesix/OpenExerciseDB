name: Smith Machine Shoulder Press
description: 'The exercise is basically the same as with a free barbell:

  Sit on a bench, the back rest should be almost vertical. Take a bar with a shoulder
  wide grip and bring it down to chest height. Press the weight up, but don''t stretch
  the arms completely. Go slowly down and repeat.'
