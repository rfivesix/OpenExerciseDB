name: Floor Glider Hamstring Curls
description: "Starting Position:\nLie flat on your back on the floor with your heels\
  \ planted on sliding discs (or towels on a smooth floor). Keep your arms at your\
  \ sides for stability. Drive through your heels to raise your hips into a glute\
  \ bridge position, forming a straight line from knees to shoulders.\n\nExecution:\n\
  1. Maintaining hip elevation, slowly slide your heels forward away from your body\
  \ until your legs are nearly fully extended.\n2. Pause briefly at full extension\
  \ without allowing your glutes to touch the floor.\n3. Powerfully curl your heels\
  \ back toward your glutes by contracting your hamstrings, driving your hips higher\
  \ as your heels arrive under your knees.\n4. Repeat smoothly for the desired number\
  \ of repetitions.\n\nCues:\nKeep your hips elevated throughout both the extension\
  \ and curl phases to maximize hamstring recruitment under full tension."
