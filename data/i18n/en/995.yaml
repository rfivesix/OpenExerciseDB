name: Backward Arm Circles
description: 'Starting Position: Stand upright with feet shoulder-width apart and
  extend both arms straight out to the sides at shoulder height, palms facing down.

  Execution: Make small, controlled circular motions with your arms rotating backward,
  opening up your chest and engaging your upper back.

  Cues: Keep your torso stable and avoid excessive arching in your lower back.'
