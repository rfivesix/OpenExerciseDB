name: Clamshell
description: "Starting Position:\nLie on your side on an exercise mat with your hips\
  \ flexed at approximately 45 degrees and knees bent at 90 degrees. Stack your legs\
  \ directly on top of each other with your heels together. Support your head with\
  \ your bottom arm and place your top hand on the floor or on your hip for stability.\n\
  \nExecution:\n1. Keeping your feet and heels glued together, slowly raise your top\
  \ knee toward the ceiling like an opening clamshell.\n2. Lift as high as you comfortably\
  \ can without allowing your hips or pelvis to rotate backward.\n3. Squeeze your\
  \ outer hip and gluteus medius at peak contraction for 1 to 2 seconds.\n4. Slowly\
  \ lower your knee back to the starting position under control before repeating.\n\
  \nCues:\nKeep your pelvis stacked perpendicular to the floor; do not roll backward.\
  \ (A side-plank clamshell can be used as an advanced progression)."
