name: Standing Leg Raise
description: Put your forearms on the pads on the leg raise machine, the body is hanging
  freely. Lift now your legs with a fast movement as high as you can, make a short
  pause of 1sec at the top, and bring them down again. Make sure that during the exercise
  your body does not swing, only the legs should move.
