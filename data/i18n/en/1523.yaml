name: Sled Push
description: 'Starting Position:

  Load the sled with the appropriate weight. Stand behind the sled and grip the vertical
  uprights with arms extended or slightly bent, leaning your torso forward at roughly
  a 45-degree angle.


  Execution:

  1. Drive powerfully through the balls of your feet, pushing the sled forward with
  strong, continuous strides.

  2. Keep your core braced and maintain a straight line from your head through your
  spine to your driving leg.

  3. Push through the target distance or time with steady cadence and high intensity.


  Cues:

  The sled push builds powerful leg drive and conditioning with minimal eccentric
  muscle damage, making it ideal for speed, power, and metabolic conditioning.'
