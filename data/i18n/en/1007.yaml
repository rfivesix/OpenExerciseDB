name: Head Turns
description: 'Starting Position: Sit or stand tall with shoulders relaxed and down,
  looking straight forward.

  Execution: Slowly turn your head to one side until you feel a gentle stretch along
  the opposite side of your neck. Hold for 1–2 seconds, return smoothly to center,
  and repeat to the opposite side.

  Cues: Move within a pain-free range of motion without tilting your head or forcing
  the turn.'
