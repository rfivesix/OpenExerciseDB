description: '- Attach a close-grip V-bar handle to the lat pulldown station and adjust
  the thigh pad to secure your legs.

  - Grip the handles with palms facing each other (neutral grip) and sit upright with
  chest lifted.

  - Pull the handle smoothly down toward your upper chest, driving your elbows down
