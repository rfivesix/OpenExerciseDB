name: Bronco Test
description: 'Starting Position:

  Set up cones at 0m (start line), 20m, 40m, and 60m markers on a running track or
  field.


  Execution:

  1. Sprint 20m from the start line, touch the line/cone, and sprint back to the start.

  2. Immediately turn and sprint 40m, touch the mark, and sprint back to the start.

  3. Immediately turn and sprint 60m, touch the mark, and sprint back to the start
  (this completes 1 repetition of 240m).

  4. Repeat for a total of 5 continuous repetitions without rest (1,200 meters total)
  as fast as possible.


  Cues:

  A gold-standard aerobic and anaerobic running fitness test widely used in rugby
  and field sports.'
