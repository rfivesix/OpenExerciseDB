name: SkiErg (Ski Machine)
description: 'Starting Position:

  Stand on the platform of the ski ergometer with feet hip-width apart. Reach overhead
  and grasp the handles with palms facing inward.


  Execution:

  1. Soften your knees, hinge your hips back, and drive both arms straight down past
  your thighs in an explosive, fluid pulling motion.

  2. Finish the pull with your hands passing just beside your knees.

  3. Extend your hips forward to return to an upright standing position as your arms
  return smoothly overhead.


  Cues:

  Simulates cross-country skiing double-poling technique, providing intense, low-impact
  cardiovascular training while engaging the lats, triceps, and anterior core.'
