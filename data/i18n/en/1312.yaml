name: Bodyweight Squat
description: 'Squat is a type of bodyweight exercise. It is one of the most popular
  exercises for strength and muscle growth. Squat is particularly effective for focusing
  on the muscles of the leg and hips.

  Squat are an easy exercise for beginners to do. It can help strengthen leg muscles,
  tighten hip muscles and burn calories to lose weight.

  It tightens the butt and legs. Squats are very effective for firming and strengthening
  your legs by acting on the gluteus,hip flexors, quadriceps, hamstrings and inner
  thigh muscles. Also, bodyweight squats can help shape your glutes and butt.'
