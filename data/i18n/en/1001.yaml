name: High Plank
description: 'Starting Position: Place your hands on the floor directly beneath your
  shoulders with arms fully extended. Step your feet back and balance on your toes,
  holding your body in a straight plank line from head to heels.

  Execution: Maintain isometric tension across your entire body: contract your abdominals,
  squeeze your glutes, and push the floor away to keep your upper back broad.

  Cues: Do not let your hips sag toward the floor or pike upward. Keep your neck in
  a neutral line looking slightly ahead of your hands.'
