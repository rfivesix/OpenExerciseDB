name: EZ-Bar Military Press
description: |-
  Stand tall holding an EZ-curl bar at shoulder level in front of your upper chest with an overhand grip. Brace your core and press the bar vertically overhead until your arms are fully extended. Lower the bar smoothly under control back to your upper chest and repeat.
