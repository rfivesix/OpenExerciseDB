name: Ab Wheel Rollout
description: 'Starting Position:

  Kneel on a padded mat with your knees hip-width apart. Grasp the handles of the
  ab wheel firmly, resting it on the floor in front of your knees.


  Execution:

  1. Brace your abdominal muscles, tuck your pelvis slightly, and slowly roll the
  wheel forward in a controlled line, extending your body towards the floor.

  2. Roll out as far as you can maintain a neutral, slightly rounded lumbar spine
  without sagging in the lower back.

  3. Pull through your abdominals and lats to roll the wheel back to the starting
  position.


  Cues:

  A premier anti-extension exercise for the rectus abdominis and transversus abdominis.
  Never allow your lower back to collapse into excessive extension.'
