name: Straight Bar Cable Front Raise
description: '- Attach a straight bar to the low cable pulley. Stand facing away from
  the cable stack with the cable running between your legs.

  - Grasp the straight bar with an overhand (pronated) grip at shoulder-width in front
  of your thighs.

  - Raise the bar straight out in front of you with slightly bent elbows until it
  reaches shoulder or eye level.

  - Pause briefly at the top to contract your anterior deltoids, then lower the bar
  slowly under control without swinging your hips.'
