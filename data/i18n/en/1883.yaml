name: Machine Chest Press
description: "Starting Position: Adjust the seat height so that the handles are aligned\
  \ with the middle of your chest. Sit back firmly against the pad with feet flat\
  \ on the floor.\nExecution: Grasp the handles with an overhand grip and press forward\
  \ until your arms are extended, exhaling as you push.\nTips: Pause briefly at full\
  \ extension without locking your elbows. Slowly return the handles under control\
  \ until you feel a comfortable stretch across your chest."
