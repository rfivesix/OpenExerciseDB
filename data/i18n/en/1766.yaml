name: Plank Reach
description: "Starting Position:\nAssume a forearm plank position with your elbows\
  \ directly beneath your shoulders, forearms parallel, and feet slightly wider than\
  \ hip-width apart to provide a stable base of support. Brace your core and squeeze\
  \ your glutes so your body forms a straight line from head to heels.\n\nExecution:\n\
  1. Slowly lift one arm from the floor and reach it straight out in front of you\
  \ at shoulder height.\n2. Hold the extended position for 1 to 2 seconds while actively\
  \ resisting any rotation or tilting of your hips.\n3. Return the forearm to the\
  \ starting position under control, then immediately repeat with the opposite arm.\n\
  4. Continue alternating sides with steady, deliberate pacing.\n\nCues:\nFocus on\
  \ anti-rotation; keep your hips and shoulders completely square to the floor throughout."
