name: Hanging Windshield Wipers
description: "Starting Position:\nHang from a pull-up bar with an overhand grip slightly\
  \ wider than shoulder-width. Engage your lats and shoulders, lean your torso slightly\
  \ back, and raise your straight legs all the way up until your toes point toward\
  \ the bar or ceiling.\n\nExecution:\n1. Keeping your legs straight and feet glued\
  \ together, slowly rotate your hips and legs down to one side in a sweeping arc\
  \ like a windshield wiper.\n2. Reverse the direction by contracting your obliques\
  \ and core, bringing your legs back through the vertical center.\n3. Lower your\
  \ legs to the opposite side under control and continue alternating from side to\
  \ side in a continuous rhythm.\n\nCues:\nKeep the movement strictly controlled with\
  \ zero swinging; bend your knees into a tuck wiper if straight legs compromise form."
