name: Cable Shoulder Y-Raise
description: "Starting Position:\nAttach D-handles to the low pulleys of a dual-cable\
  \ station. Stand in the center and grasp the handles with crossed arms (right hand\
  \ grabs the left cable, left hand grabs the right cable). Begin with your hands\
  \ crossed in front of your waist.\n\nExecution:\n1. Pull both arms upward and diagonally\
  \ outward in a smooth sweeping motion until your arms form a \"Y\" shape above shoulder\
  \ height.\n2. Actively retract and depress your shoulder blades at the top, focusing\
  \ on your lower trapezius and lateral deltoids.\n3. Slowly lower your arms along\
  \ the same diagonal path back to the crossed starting position.\n\nCues:\nMaintain\
  \ a slight, fixed bend in your elbows and avoid arching your lower back to complete\
  \ the lift."
