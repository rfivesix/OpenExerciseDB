name: Thruster
description: '- Hold a barbell in the front-rack position across the front of your
  shoulders, standing with feet shoulder-width apart.

  - Descend into a deep front squat until your thighs are at least parallel to the
  floor.

  - Drive explosively up through your heels, using the momentum from your legs to
  push the barbell overhead in one fluid motion.

  - Lower the bar under control back to your shoulders and transition smoothly into
  the next squat repetition.'
