name: Medicine Ball V-Up Crunch
description: 'Starting Position: Lie flat on your back on a mat with legs extended
  straight and arms extended overhead holding a medicine ball with both hands.

  Execution: Simultaneously raise your straight legs and torso off the floor, bringing
  the medicine ball toward your shins/feet into a "V" shape crunch. Squeeze your abdominal
  muscles firmly at the top.

  Return: Slowly lower your torso and legs back to the floor under control without
  letting your lower back hyperextend.

  Cues: Keep the movement smooth and controlled; avoid throwing the ball or utilizing
  uncontrolled momentum.'
