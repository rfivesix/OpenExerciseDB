name: Standing IT Band Stretch
description: "Starting Position: Stand tall sideways next to a wall or sturdy support.\
  \ Cross the outer leg (the one being stretched) behind the front leg, placing the\
  \ foot flat on the floor.\nExecution: Support yourself with your inner hand on the\
  \ wall and gently push your hips toward the wall (away from the direction of your\
  \ lean). Lean your torso in the opposite direction until you feel a distinct stretch\
  \ along the outer hip and thigh.\nTips: Keep your pelvis facing forward without\
  \ rotating. Hold for 20–30 seconds while breathing smoothly, then repeat on the\
  \ other side."
