name: Low-Cable Crossover
description: The low-cable cross-over is an isolation movement that uses a cable stack
  to target the upper portion of the pectoral muscles. It is common in upper-body
  and chest-focused muscle-building workouts, often in combination with presses or
  flyes from other angles to target all portions of the chest.
