exercise_id: '901'
language: en
status: ai_reviewed
name: Barbell Hip Thrust
description: '- Sit on the floor with your upper back supported against a stable bench
  and place a padded barbell across your hips.

  - Position your feet flat on the floor about shoulder-width apart so that your shins
  are vertical at the top of the movement.

  - Drive through your heels and squeeze your glutes powerfully to lift your hips
  until your thighs and torso form a straight horizontal line.

  - Squeeze your glutes firmly at the top for a count, then lower your hips under
  control back toward the floor.'
