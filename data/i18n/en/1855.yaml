name: Hamstring Foam roller
description: "Starting Position: Sit on the floor with the foam roller placed beneath\
  \ the back of your thighs. Support your body weight on your hands behind you and\
  \ lift your hips.\nExecution: Slowly roll forward and backward from just below your\
  \ glutes down to just above the back of your knees. Rotate your feet slightly inward\
  \ and outward to cover the entire hamstring group.\nTips: Move with control and\
  \ pause on tight areas to encourage myofascial release."
