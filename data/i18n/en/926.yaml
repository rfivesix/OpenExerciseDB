name: Machine Chest Fly
description: 'Starting Position: Sit on the chest fly machine with your back and head
  firmly against the backrest. Adjust seat height so that handles or pads are level
  with your mid-chest. Grasp the handles with a slight, fixed bend in your elbows.

  Execution: Contract your pectoral muscles to bring the handles together in front
  of your chest in a smooth, hugging arc. Squeeze firmly at the peak contraction.

  Return: Slowly reverse the motion, allowing your chest muscles to stretch under
  control without letting the weight stack touch down between reps.

  Cues: Keep your shoulders depressed and retracted; do not let your shoulders roll
  forward.'
