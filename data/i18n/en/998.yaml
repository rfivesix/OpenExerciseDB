name: No-Push-Up Burpees
description: 'Starting Position: Stand tall with feet hip-width apart and arms at
  your sides.

  Execution: Drop into a squat and place your hands flat on the floor. Jump your feet
  backward into a strong high plank without performing a push-up. Immediately jump
  your feet forward outside your hands, then leap explosively into the air, reaching
  overhead.

  Return: Land softly with bent knees and seamlessly transition into the next repetition.

  Cues: Maintain a rigid core line when kicking back into the plank.'
