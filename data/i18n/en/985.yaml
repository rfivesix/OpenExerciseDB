name: Push-up with Rotation
description: 'Starting Position: Assume a standard push-up position with hands slightly
  wider than shoulders and body in a rigid plank line.

  Execution: Lower your chest toward the floor into a push-up. As you press back up,
  rotate your torso and raise one arm straight toward the ceiling, forming a "T" shape
  with your body.

  Return: Lower your hand back to the floor under control, perform another push-up,
  and rotate to the opposite side.

  Cues: Keep your hips elevated and core tight; do not let your lower back sag during
  the rotation.'
