name: Neck Stretch (Right)
description: 'Starting Position: Sit or stand upright with shoulders relaxed and down.

  Execution: Gently tilt your head to the left, bringing your left ear toward your
  left shoulder to stretch the right side of your neck and upper trapezius. Optionally
  place your left hand lightly over your head to deepen the stretch with minimal pressure.

  Return: Hold for 15–30 seconds while breathing smoothly, then slowly return your
  head to the neutral center.

  Cues: Keep your right shoulder depressed; do not shrug either shoulder upward.'
