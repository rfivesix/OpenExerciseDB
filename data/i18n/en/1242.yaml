name: Exercise Band Plantarflexion
description: 'Starting position:

  Sit on the floor with your legs extended straight in front of you. Loop the center of a resistance band around the ball
  of your foot and hold both ends firmly with your hands to create tension.


  Execution:

  1. Press your foot forward and down against the band''s resistance (plantarflexion), strongly contracting your calf muscles.

  2. Hold the peak contraction briefly at the end of the movement.

  3. Slowly return the foot back to the starting position under control.


  Tips:

  Keep your leg stationary and isolate movement entirely to the ankle joint. Excellent for calf strengthening and Achilles
  tendon rehabilitation.'
