name: Front Plate Raise
description: '- Hold a weight plate with both hands on the sides (at roughly the 9
  and 3 o''clock positions).

  - Stand upright with your shoulders back and raise the plate in front of you with
  slightly bent elbows until it reaches shoulder height.

  - Pause briefly at the top to feel the contraction in your anterior deltoids, then
  lower the plate under control back to your thighs.'
