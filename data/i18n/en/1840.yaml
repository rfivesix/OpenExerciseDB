name: Bent-Leg Hamstring Stretch
description: "Starting Position: Lie on your back or sit upright. Grasp the back of\
  \ your thigh with both hands.\nExecution: Draw your thigh toward your chest while\
  \ keeping the knee slightly bent. Extend your lower leg just enough to feel a comfortable\
  \ stretch in the muscle belly of the hamstrings.\nTips: Hold for 20–30 seconds while\
  \ breathing steadily, then switch sides. Keeping the knee slightly bent protects\
  \ the sciatic nerve and focuses the stretch on the muscle tissue."
