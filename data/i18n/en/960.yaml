name: Kettlebell Swing
description: 'Starting Position: Stand with feet slightly wider than shoulder-width,
  with the kettlebell placed on the floor about a foot in front of you. Hinge at your
  hips with a flat back and grip the handle with both hands.

  Execution: Hike the kettlebell back between your legs like a center in football.
  Snap your hips forward explosively, driving through your heels and contracting your
  glutes to swing the kettlebell up to chest height.

  Return: Let the kettlebell float back down and hinge at your hips to guide it back
  between your legs, immediately transitioning into the next repetition.

  Cues: The movement is a pure hip hinge, not a squat. Power comes from your hips
  and glutes, not your shoulders or arms.'
