description: In strength training, rowing (or a row, usually preceded by a qualifying adjective — for instance a seated row)
  is an exercise where the purpose is to strengthen the muscles that draw the rower's arms toward the body (latissimus dorsi)
  as well as those that retract the scapulae (trapezius and rhomboids) and those that support the spine (erector spinae).
  When done on a rowing machine, rowing also exercises muscles that extend and support the legs (quadriceps and thigh muscles).
  In all cases, the abdominal and lower back muscles must be used in order to support the body and prevent back injury.
