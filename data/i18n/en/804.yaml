name: Fingerboard Sloper Hang
description: '- Place both hands with an open hand position flat onto the sloper holds
  of a hangboard/fingerboard.

  - Engage your shoulders actively (pulling them down and back) and maintain a slight
  bend in your elbows to protect your joints.

  - Lift your feet off the ground and rely on open-hand friction and forearm flexor
  strength to hang steadily for the prescribed duration.

  - Keep your core engaged and body steady without swinging.'
