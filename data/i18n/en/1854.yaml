name: Calves foam roller
description: "Starting Position: Sit on the floor and place the foam roller horizontally\
  \ beneath your calves (between the Achilles tendon and the back of the knee). Support\
  \ yourself with your hands behind you and lift your hips slightly off the ground.\n\
  Execution: Slowly roll forward and backward from just above your ankles to just\
  \ below your knees. Rotate your legs slightly inward and outward to target both\
  \ the inner and outer calf muscles.\nTips: Pause on tender spots (trigger points)\
  \ for 15–20 seconds while taking deep breaths."
