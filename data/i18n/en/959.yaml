name: TRX Row
description: 'Starting Position: Face the anchor point, grasp the TRX handles with
  a neutral grip, and lean backward with arms extended. Walk your feet forward to
  achieve the desired body incline, keeping your body in a straight plank line from
  head to heels.

  Execution: Pull your chest up toward the handles by driving your elbows backward
  and squeezing your shoulder blades together.

  Return: Lower your body under control until your arms are fully extended, maintaining
  a tight core throughout.

  Cues: The closer your body is to horizontal, the greater the difficulty. Do not
  allow your hips to sag.'
