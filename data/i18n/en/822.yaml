name: Cable Rear Delt Fly
description: '- Set the cable pulleys to approximately head or eye level.

  - Grasp the left cable with your right hand and the right cable with your left hand,
  crossing the cables in front of you.

  - Pull your arms out and back in a wide horizontal arc while keeping a slight, fixed
  bend in your elbows.

  - Squeeze your rear deltoids at the end of the range, then slowly return the handles
  back across your chest under control.'
