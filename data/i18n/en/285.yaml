exercise_id: '285'
language: en
status: upstream_unreviewed
name: High Knee Jumps
description: |-
  Start with legs slightly wider than shoulder width
  Drop into a bodyweight squat
  As you hit the bottom of the squat, explode upwards into a jump while simultaneously tucking your knees into your chest midflight.&nbsp; Remain tucked until the apex of your jump.
  Land on both feet, making sure your knees are not locked so as to avoid excessive strain upon your joints.&nbsp; Collect yourself into the next rep as quickly but under control as possible.
