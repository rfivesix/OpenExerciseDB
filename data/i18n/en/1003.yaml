name: Kettlebell Deadlift
description: 'Starting Position: Stand tall with feet hip- to shoulder-width apart,
  with a kettlebell centered between your feet in line with your ankles.

  Execution: Hinge at your hips, pushing your glutes back and bending your knees slightly
  while maintaining a flat back. Grip the kettlebell handle firmly with both hands.
  Drive through your feet and push your hips forward to stand up tall, contracting
  your glutes at the top.

  Return: Reverse the motion by hinging at the hips and lowering the kettlebell under
  control back to the floor between your feet.

  Cues: Keep your shoulders packed down and your spine neutral throughout; do not
  round your back.'
