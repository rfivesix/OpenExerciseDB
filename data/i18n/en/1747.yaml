name: Smith Machine Squat
description: "Starting Position:\nStep under the Smith machine bar and rest it across\
  \ your upper trapezius. Set your feet shoulder-width apart, positioned slightly\
  \ in front of the bar's vertical plane to optimize knee mechanics and direct load\
  \ to the quadriceps and glutes. Unrack the bar by rotating your wrists.\n\nExecution:\n\
  1. Inhale and brace your core, then initiate the squat by bending at your hips and\
  \ knees along the fixed track.\n2. Descend under strict control until your thighs\
  \ are at least parallel to the floor.\n3. Drive firmly through your whole foot and\
  \ heels to return to the starting position.\n4. Stop just short of locking your\
  \ knees out at the top to maintain continuous tension.\n\nCues:\nKeep your chest\
  \ proud and spine neutral; adjust foot placement forward if you wish to reduce forward\
  \ knee travel and maximize glute/quad emphasis."
