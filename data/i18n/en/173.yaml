name: Cable Kneeling Crunch
description: |-
  Grasp the cable attachment (rope) with both hands and hold it next to your temples. Kneel down facing or facing away from the cable stack with your torso upright and slightly hinged forward. Crunch down by rolling your spine inward, bringing your elbows toward your knees. Pause briefly, then slowly return under control to the starting position.
