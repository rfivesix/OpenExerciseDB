name: Seated Rear Delt Raise
description: '- Sit on the edge of a flat bench with feet flat on the floor and lean
  your torso forward over your thighs with a flat back.

  - Hold a dumbbell in each hand beneath your thighs with palms facing each other
  and elbows slightly bent.

  - Raise the dumbbells out to the sides until your upper arms are parallel to the
  floor at shoulder height.

  - Squeeze your posterior deltoids at the top, then lower the dumbbells slowly under
  control.'
