name: One-Arm Cable Triceps Extension
description: '- Stand facing or slightly angled to a high cable pulley, holding a
  single handle or rope end with one hand.

  - Pin your upper arm securely to your side with your elbow bent at roughly 90 degrees.

  - Press the attachment downward by extending your elbow until your triceps is fully
