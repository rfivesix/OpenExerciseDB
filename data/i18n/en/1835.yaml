name: Seated Dumbbell External Rotation
description: "Starting Position:\nSit on an exercise mat or flat bench with one knee\
  \ elevated and foot flat. Place the elbow of your working arm on top of your raised\
  \ knee, bent at a 90-degree angle. Hold a light dumbbell with your forearm positioned\
  \ horizontally forward.\n\nExecution:\n1. Keep your shoulder blade retracted and\
  \ depressed away from your ear.\n2. Rotate your forearm upward along a vertical\
  \ arc until it is perpendicular to the floor.\n3. Pause at the top for one second,\
  \ feeling the contraction in your external rotators (infraspinatus and teres minor).\n\
  4. Slowly lower the dumbbell back to horizontal with control, feeling a gentle stretch\
  \ at the bottom before repeating.\n\nCues:\nUse a light dumbbell to prevent compensatory\
  \ movements; keep your elbow anchored stably on your knee throughout."
