name: EZ-Bar Overhead Triceps Extension
description: 'Starting Position:

  Sit on a bench with back support or stand upright with a tight core. Grasp an EZ
  bar using a close overhand grip and press it overhead to arm''s length.


  Execution:

  1. Keeping your upper arms close to your head and elbows pointing forward, slowly
  lower the bar behind your head by bending your elbows to roughly 90 degrees.

  2. Pause briefly in the fully stretched position.

  3. Extend your elbows to press the bar back up to the starting position, contracting
  your triceps firmly at the top.


  Cues:

  Keep your elbows from flaring out wide. The overhead position heavily recruits the
  long head of the triceps.'
