name: 50m Swim Sprints
description: 'Starting Position: Position yourself in the pool at the starting wall,
  ready for an explosive push-off.

  Execution: Sprint 50 meters at maximum effort using freestyle (front crawl), focusing
  on high stroke cadence, powerful kick, and streamlined body position.

  Structure: Performed on a fixed interval (e.g. on 1 minute). Rest for the remainder
  of the interval after touching the wall before launching the next sprint.

  Cues: Maximize speed and power while maintaining efficient stroke mechanics throughout
  the entire 50-meter distance.'
