name: Glute Drive
description: 'Starting Position:

  Sit in the glute drive machine, resting your upper back against the pivot pad. Fasten
  the padded belt securely across your hips. Place your feet shoulder-width apart
  on the footplate with toes slightly flared.


  Execution:

  1. Disengage the safety release and drive through your heels to bridge your hips
  upward against the belt.

  2. Ascend until your torso and thighs form a straight horizontal line, squeezing
  your glutes intensely at peak contraction for 1–2 seconds.

  3. Lower your hips back down slowly under control before repeating.


  Cues:

  The machine provides a stable, biomechanically guided setup for heavy hip thrusting,
  isolating the gluteus maximus safely.'
