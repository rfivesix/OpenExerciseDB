name: Legend Incline Bench Press
description: "Starting Position:\nSit in the incline bench of the Legend Fitness LeverEdge\
  \ machine. Adjust seat height so that the converging handles align comfortably with\
  \ your upper chest. Press your head, upper back, and glutes firmly against the back\
  \ pad, and plant your feet flat on the floor. Grasp the handles with a firm overhand\
  \ grip.\n\nExecution:\n1. Drive through your palms to press the independent lever\
  \ arms upward and inward along their converging arc until your arms are nearly fully\
  \ extended.\n2. Squeeze your upper chest (clavicular head) firmly at lockout.\n\
  3. Lower the weight slowly and under control, feeling a deep stretch across the\
  \ pectorals before initiating the next repetition.\n\nCues:\nKeep your shoulder\
  \ blades retracted and depressed against the back pad throughout the press."
