name: Battle Ropes
description: 'Starting Position:

  Stand with your feet shoulder-width apart in an athletic quarter-squat stance. Hold
  the rope handles firmly in each hand with a neutral grip in front of your hips.


  Execution:

  1. Drive your arms up and down alternately (or simultaneously) in an explosive,
  rhythmic motion, creating continuous waves that travel all the way to the anchor.

  2. Keep your core solidly braced and your spine neutral to absorb the momentum.

  3. Maintain a rapid pace and high intensity for the prescribed work interval.


  Cues:

  Battle ropes deliver high-intensity cardiovascular conditioning while taxing the
  deltoids, lats, and core stabilizers.'
