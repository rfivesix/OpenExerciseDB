name: Open Book Thoracic Mobility Stretch
description: "Starting Position:\nLie on your side on an exercise mat with your hips\
  \ and knees stacked and bent at a 90-degree angle to stabilize your lumbar spine\
  \ and pelvis. Extend both arms straight out in front of your chest with palms together.\n\
  \nExecution:\n1. Inhale and lift your top arm upward and backward in a sweeping\
  \ arc like opening a book.\n2. Rotate through your thoracic spine while keeping\
  \ your pelvis, hips, and stacked knees firmly glued together.\n3. Allow your head\
  \ and eyes to gently follow your moving hand toward the floor behind you.\n4. Exhale\
  \ as you reach end range, enjoying the stretch across your chest and upper back\
  \ for 1 to 2 seconds.\n5. Inhale and slowly sweep your arm back to the starting\
  \ position with palms touching.\n\nCues:\nKeep the motion isolated to the mid- and\
  \ upper back (thoracic spine); do not allow your top knee to slide backward off\
  \ the bottom knee."
