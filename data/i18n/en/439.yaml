name: Overhand Cable Curl
description: |-
  Stand facing a cable pulley adjusted to shoulder or chest height. Grasp the attachment with an overhand (pronated) grip. Keeping your upper arms parallel to the floor, curl the attachment in toward your face or upper chest, contracting the brachioradialis and forearm muscles. Slowly extend your arms back to the starting position under tension.
