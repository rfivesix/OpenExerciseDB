name: Behind-the-Back Cable Lateral Raise
description: "Starting Position:\nStand sideways next to a low pulley cable machine.\
  \ Reach your outer hand behind your glutes to grasp the D-handle. Hold onto the\
  \ cable upright with your inside hand for support, and lean slightly forward with\
  \ your chest proud.\n\nExecution:\n1. With a slight, fixed bend in your elbow, raise\
  \ your arm outward and upward along your side until your hand reaches shoulder height.\n\
  2. Squeeze your lateral deltoid hard at the top of the movement for a full one-second\
  \ pause.\n3. Lower the handle back behind your body in a slow, controlled descent,\
  \ keeping tension on the shoulder throughout.\n\nCues:\nRouting the cable behind\
  \ your back prevents the handle from bumping your hips and provides uninterrupted\
  \ tension at the stretched position."
