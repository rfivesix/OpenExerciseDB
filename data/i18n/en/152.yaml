name: Chin Up
description: The chin-up (also known as a chin or chinup) is a strength training exercise. People frequently do this exercise
  with the intention of strengthening muscles such as the latissimus dorsi and biceps, which extend the shoulder and flex
  the elbow, respectively. In this maneuver, the palms are faced towards the body. It is a form of pull-up in which the range
  of motion is established in relation to a person's chin.
