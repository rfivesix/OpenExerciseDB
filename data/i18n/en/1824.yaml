name: Dumbbell Tate Press
description: "Starting Position:\nLie flat on your back on a flat exercise bench holding\
  \ a pair of dumbbells. Extend your arms directly over your chest as in the lockout\
  \ of a bench press. Rotate your hands into a pronated grip with palms facing toward\
  \ your feet and thumbs facing each other, keeping the inner heads of the dumbbells\
  \ touching or close together.\n\nExecution:\n1. Keeping your upper arms fixed and\
  \ elbows flaring outward to the sides, bend your elbows to lower the inner dumbbell\
  \ heads toward the center of your chest.\n2. Touch the dumbbells lightly against\
  \ your sternum without resting the weight on your body.\n3. Forcefully extend your\
  \ elbows to press the dumbbells back up to the starting position, focusing on \"\
  pushing your pinkies toward the ceiling\" for peak triceps recruitment.\n4. Squeeze\
  \ your triceps firmly at lockout before beginning the next repetition.\n\nCues:\n\
  Keep the movement isolated to elbow extension; do not let your shoulders or upper\
  \ arms swing during the press."
