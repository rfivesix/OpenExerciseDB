name: Chest-Supported Rear Delt Raise
description: "Starting Position:\nSet an incline bench to approximately 30 to 45 degrees.\
  \ Lie face-down with your chest firmly supported against the pad, feet grounded,\
  \ and neck neutral. Hold a pair of light dumbbells hanging straight down with a\
  \ neutral or thumbs-up grip.\n\nExecution:\n1. With elbows slightly unlocked, raise\
  \ the dumbbells upward and diagonally outward in a wide \"Y\" arc.\n2. Focus on\
  \ pulling through your rear deltoids and retracting your scapulae at peak height.\n\
  3. Squeeze firmly at the top when your arms are roughly level with your shoulders\
  \ for a one-second pause.\n4. Slowly lower the weights back to the starting position\
  \ under full control.\n\nCues:\nResting your chest against the bench prevents body\
  \ swaying and ensures strict, isolated posterior deltoid and upper-back recruitment."
