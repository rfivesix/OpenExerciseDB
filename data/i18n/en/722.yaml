name: Weighted Step-Ups
description: '- Place a barbell across your upper back (or hold a dumbbell in each
  hand) and stand upright facing a sturdy box or bench.

  - Step firmly onto the platform with one foot, ensuring your entire foot is supported.

  - Drive through your front heel to extend your hip and knee, stepping up onto the
  box until standing fully upright.

  - Step back down with control under full eccentric tension before repeating or alternating
  legs.'
