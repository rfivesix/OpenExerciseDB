name: Barbell Full Squat
description: "Starting Position:\nUnrack a barbell from a squat rack across your upper\
  \ trapezius (high-bar position). Take two steps back into a shoulder-width or slightly\
  \ wider stance with toes angled outward 15 to 30 degrees. Inhale deeply into your\
  \ belly to brace your intra-abdominal pressure, keeping your chest tall.\n\nExecution:\n\
  1. Break at your hips and knees simultaneously, driving your knees outward in line\
  \ with your toes.\n2. Descend smoothly past parallel into full squat depth, keeping\
  \ your torso upright and heels firmly anchored.\n3. Pause briefly without bouncing\
  \ out of the hole, then drive forcefully through your whole foot to return to a\
  \ standing lockout.\n4. Exhale at the top and reset your brace before the next repetition.\n\
  \nCues:\nFull depth maximizes quadriceps, adductor, and gluteus maximus recruitment;\
  \ descend only as deep as you can maintain a neutral spine without excessive pelvic\
  \ tuck (butt wink)."
