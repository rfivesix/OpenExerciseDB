name: Trap Bar Squat
description: "Starting Position:\nStep inside the center of a trap bar (hex bar) with\
  \ your feet shoulder-width apart. Squat down with an upright torso posture and grip\
  \ the neutral handles firmly. Pull your shoulders back, keep your chest high, and\
  \ brace your core.\n\nExecution:\n1. Drive forcefully into the floor through your\
  \ heels and midfoot, extending your knees and hips in unison.\n2. Keep your chest\
  \ up throughout the ascent to prioritize quadriceps and glute loading.\n3. Stand\
  \ fully upright at the top, squeezing your glutes and quads.\n4. Lower the weight\
  \ under control by breaking at the knees and hips until the plates touch the floor.\n\
  \nCues:\nMaintain a more upright torso than a conventional deadlift to emphasize\
  \ knee flexion and quadriceps engagement while sparing the lower back."
