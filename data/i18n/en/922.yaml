name: Seated Cable Mid Trap Shrug
description: 'Starting Position: Sit upright at a cable row station with feet secured
  against the footrests. Grasp the cable attachment with arms fully extended in front
  of you.

  Execution: Without bending your elbows, pull your shoulder blades straight back
  toward each other (scapular retraction). Squeeze your mid-traps and rhomboids firmly
  at the peak contraction for 1–2 seconds.

  Return: Slowly allow your shoulder blades to protract forward under control back
  to the starting position.

  Cues: Keep your torso still and upright; do not lean backward to move the weight.'
