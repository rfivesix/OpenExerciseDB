name: Side Lunge (Left)
description: 'Starting Position: Stand upright with your feet wider than shoulder-width
  apart, toes pointing forward or slightly outward.

  Execution: Shift your weight toward your left side, bending your left knee and sitting
  your hips back while keeping your right leg straight and foot flat on the floor.
  Lower until your left thigh is nearly parallel to the ground.

  Return: Drive through your left heel to return to the wide standing position.

  Cues: Keep your chest up, your left knee tracking over your left foot, and do not
  let your heel lift off the ground.'
