name: High Knees
description: 'Starting Position: Stand tall with your feet hip-width apart and arms
  relaxed at your sides.

  Execution: Run in place dynamically, driving one knee up toward your chest until
  your thigh is parallel to the ground, then rapidly switch to the other leg. Pump
  your arms in rhythm with your legs.

  Cues: Stay light on the balls of your feet, maintain an upright posture, and keep
  a rapid, rhythmic cadence.'
