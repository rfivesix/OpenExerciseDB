name: Shinbox IR Stretch
description: "Starting Position: Sit on the floor with both hips and knees bent at\
  \ 90-degree angles.\nLeg Placement:\nPlace one leg in front of you (external rotation)\
  \ and the other leg out\nto the side/behind you (internal rotation). The shins and\
  \ knees should\nremain flat on the ground.\nThe Movement:\nKeeping your hips square,\
  \ hinge your torso forward or tilt it laterally\n(side-to-side) toward the front\
  \ leg to deepen the stretch.\nTarget Areas:\nStretches the glutes and piriformis\
  \ (front leg) and the hip flexors and\nquads (back leg). Engages the core and obliques\
  \ during lateral flexion.\nGoal: Improves hip mobility, specifically internal and\
  \ external rotation, and relieves lower back tension."
