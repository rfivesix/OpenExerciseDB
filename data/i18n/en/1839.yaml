name: Solo Hip Flexor Stretch
description: "Starting Position: Kneel on the floor in a half-kneeling lunge position\
  \ (one knee on the ground, front leg bent at 90 degrees with the foot flat on the\
  \ floor). Keep your torso upright.\nExecution: Tuck your pelvis slightly, engage\
  \ the glute of the trailing leg, and gently shift your hips forward until you feel\
  \ a deep stretch in the front of your rear hip (hip flexors/psoas).\nTips: Hold\
  \ the stretch for 20–30 seconds while breathing steadily, then switch sides. Avoid\
  \ arching your lower back."
