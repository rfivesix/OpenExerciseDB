name: Sentadilla pendular
description: 'Posición inicial:

  Súbete a la plataforma de la máquina pendular, apoya los hombros contra las almohadillas y coloca los
  pies a la anchura de los hombros en el centro de la plataforma. Suelta el seguro y contrae el abdomen.


  Ejecución:

  1. Flexiona las rodillas y caderas para bajar en sentadilla siguiendo el arco circular de la máquina.

  2. Cuando los muslos alcancen la profundidad completa y los cuádriceps estén estirados, empuja hacia
  arriba con la parte media del pie y los talones.

  3. Vuelve al inicio sin bloquear las rodillas con fuerza.'
