name: Saltos con rodillas altas
description: 'Empieza con las piernas algo más separadas que la anchura de los hombros.

  Baja en una sentadilla con el peso corporal.

  Al llegar abajo, impúlsate explosivamente en un salto y lleva simultáneamente las rodillas hacia el
  pecho durante el vuelo. Mantén las rodillas recogidas hasta el punto más alto del salto.

  Aterriza con ambos pies y las rodillas sin bloquear para evitar una tensión excesiva en las articulaciones.
  Prepárate para la siguiente repetición lo antes posible, pero con control.'
