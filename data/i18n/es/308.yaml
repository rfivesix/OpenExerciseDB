name: Aperturas inclinadas con mancuernas
description: Usa un banco inclinado. Sujeta las mancuernas con los brazos extendidos hacia los lados y
  los codos ligeramente flexionados. Junta los brazos por encima del cuerpo manteniendo fijo el ángulo
  de los codos.
