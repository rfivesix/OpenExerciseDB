name: Peso muerto rumano a una pierna
description: Ponte de pie y, si utilizas carga, sujeta pesos en ambas manos. Contrae el core y levanta
  una pierna del suelo. Mantén la espalda recta e inclina el torso hacia delante desde las caderas, sin
  girarlas. Baja hasta notar un estiramiento en el isquiotibial de la pierna apoyada y vuelve a ponerte
  de pie. Repite en ambos lados.
