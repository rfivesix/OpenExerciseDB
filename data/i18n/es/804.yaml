name: Suspensión en presa roma
description: Plaats beide handen met open hand plat op de afgeronde grepen van een hangboard of vingerbord.
  Span je schouders actief aan door ze omlaag en naar achteren te trekken, en houd je ellebogen licht
  gebogen. Til je voeten van de grond en hang stabiel gedurende de voorgeschreven tijd met openhandwrijving
  en kracht van je onderarmbuigers. Span je romp aan en voorkom dat je lichaam zwaait.
