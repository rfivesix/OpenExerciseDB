name: Flexiones inclinadas con manos elevadas
description: 'Posición inicial:

  Apoya las manos, algo más separadas que los hombros, sobre un banco, cajón o superficie elevada y lleva
  los pies hacia atrás hasta formar una línea recta de la cabeza a los talones. Mantén el abdomen firme.


  Ejecución:

  1. Flexiona los codos y baja el pecho lentamente hacia el borde de la superficie.

  2. Desciende hasta que el pecho casi la toque, con los codos a unos 45 grados respecto al torso.

  3. Empuja con las palmas para extender los brazos y volver al inicio.

  4. Esta variante reduce la carga respecto a las flexiones en el suelo y enfatiza la parte media e inferior
  del pecho.'
