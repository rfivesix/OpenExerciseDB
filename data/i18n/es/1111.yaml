name: Flexiones | inclinadas (incline)
description: |-
  Las flexiones inclinadas trabajan principalmente los músculos del pecho (pectoral mayor y menor), pero también implican en menor medida los tríceps, los hombros y el core. Como el tren superior está elevado, la flexión inclinada pone menos énfasis en los tríceps en comparación con las flexiones normales, lo que puede ser beneficioso para quienes buscan trabajar específicamente los músculos del pecho.
