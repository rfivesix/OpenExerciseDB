exercise_id: '1188'
language: es
status: ai_reviewed
name: Flexión lateral con mancuerna
description: |-
  Posición inicial:
  • Ponte de pie erguido con los pies a la anchura de las caderas, sosteniendo una mancuerna en una mano a lo largo del muslo.
  • Coloca la otra mano detrás de la cabeza o apoyada en la cadera contraria.
  • Mantén el pecho elevado y el core activo.

  Ejecución:
  • Inclina lentamente el torso estrictamente hacia el lado de la mancuerna en un plano puramente lateral. ¡No gires ni rotes el tronco!
  • Usa la fuerza de los oblicuos del lado opuesto para volver a erguir el torso hasta la vertical.
  • Realiza el movimiento de forma controlada y repite con el otro lado.
