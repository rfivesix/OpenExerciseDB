name: Curl de bíceps en máquina
description: La máquina de curl de bíceps permite trabajar los bíceps con un recorrido controlado. Siéntate
  con la espalda contra el apoyo y ajusta el asiento para alinear los brazos con las empuñaduras o almohadillas.
  Sujeta las empuñaduras, mantén los codos fijos y flexiónalos para subir la carga. Baja lentamente a
  la posición inicial manteniendo el control.
