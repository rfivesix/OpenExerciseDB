name: Curl de bíceps sentado
description: |-
  La máquina de curl de bíceps está diseñada para aislar los músculos del bíceps y proporcionar un rango de movimiento controlado. Siéntate en la máquina con la espalda apoyada en el respaldo y ajusta el asiento para que tus brazos estén alineados con las manijas o almohadillas de la máquina. Agarra las manijas con firmeza, manteniendo los codos fijos en su lugar, y levanta las manijas contrayendo los bíceps. Baja las manijas lentamente a la posición inicial, manteniendo el control durante todo el movimiento.
