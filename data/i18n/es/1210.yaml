name: Paracaidista con brazos en T
description: |-
  Posición inicial:
  • Túmbate boca abajo sobre una colchoneta con las piernas más separadas que el ancho de los hombros.
  • Extiende los brazos hacia los lados a la altura de los hombros formando una T con el torso.

  Ejecución:
  • Eleva el pecho, los brazos y las piernas simultáneamente contrayendo la cadena posterior.
  • Gira los pulgares hacia el techo y junta las escápulas activamente.
  • Con el torso y las extremidades suspendidos en el aire, junta y separa las piernas de forma rítmica y controlada.
  • Desciende lentamente al suelo al finalizar la serie.
