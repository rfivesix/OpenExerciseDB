name: Paracaidista con brazos en posición de T
description: |-
  Túmbate boca abajo con las piernas más separadas que el ancho de los hombros y los pies elevados. Los brazos están extendidos hacia los lados y forman una T con el tronco, las palmas apoyadas en el suelo. Ahora eleva el tronco, los brazos y las piernas tan alto como puedas manteniendo el cuerpo en tensión. Gira los pulgares hacia el techo y junta las escápulas. Manteniendo el tronco y todas las extremidades en el aire, junta las piernas y luego sepáralas de nuevo, conservándolas en todo momento en el aire. Para las repeticiones restantes, mueve solo las piernas abriéndolas y cerrándolas.
