name: Prensa de piernas con postura amplia
description: 'Siéntate en la prensa de piernas con la espalda apoyada firmemente en el respaldo. Coloca
  los pies altos y separados en la plataforma, más allá del ancho de los hombros, con las puntas ligeramente
  hacia fuera.

  Suelta los seguros y baja el carro de forma controlada hasta que las rodillas formen aproximadamente
  un ángulo de 90 grados y sigan la dirección de los pies. Empuja con los talones y la parte media del
  pie para volver a la posición inicial, sin bloquear las rodillas.'
search_terms:
- Prensa de piernas con pies separados
