name: Medios círculos de cuello
description: |-
  Posición inicial:
  Siéntate o ponte de pie con la espalda recta y los hombros relajados. Inclina suavemente la cabeza hacia un hombro (oreja hacia el hombro).

  Ejecución:
  1. Baja lentamente el mentón hacia el pecho dibujando un semicírculo hasta llegar al hombro opuesto.
  2. Invierte el movimiento de forma suave y controlada, pasando de nuevo el mentón por el pecho hacia el hombro inicial.
  3. Repite alternando de un lado a otro sin llevar nunca la cabeza hacia atrás, protegiendo así las vértebras cervicales.
