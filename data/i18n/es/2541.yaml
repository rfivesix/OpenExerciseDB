name: Extensión isométrica de tríceps en polea con un brazo
description: 'Posición inicial: Colócate frente a una máquina de polea alta o ligeramente de lado. Sujeta
  un asa individual con una mano, con agarre prono o neutro. Mantén el brazo pegado al torso y el codo
  flexionado unos 90 grados. Inclínate ligeramente desde las caderas y activa el abdomen.


  Ejecución: Empuja hacia abajo extendiendo el codo hasta casi estirar el brazo por completo, o hasta
  el ángulo medio elegido. Mantén esta posición contraída completamente inmóvil frente a la resistencia
  de la polea durante el tiempo indicado, concentrándote en la contracción máxima del tríceps. Deja que
  el asa vuelva despacio y con control a la posición inicial con el codo a 90 grados; luego repite con
  el otro brazo.


  Indicaciones: Mantén el codo pegado al costado; no dejes que se desplace hacia delante, atrás o hacia
  fuera durante la pausa. Mantén el hombro bajo e inmóvil.'
