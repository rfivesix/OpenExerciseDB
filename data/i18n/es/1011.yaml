name: Estiramiento frontal de cuello
description: 'Posición inicial:

  Siéntate o ponte de pie con la espalda recta y los hombros relajados.


  Ejecución:

  1. Abre la boca de par en par.

  2. Inclina lentamente la cabeza hacia atrás con la boca abierta hasta notar un estiramiento suave en
  la parte frontal del cuello.

  3. Cierra y abre la boca muy despacio varias veces para profundizar el estiramiento del platisma y los
  músculos del cuello.

  4. Vuelve lentamente a la posición inicial y cierra la boca.'
search_terms:
