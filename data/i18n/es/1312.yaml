name: Sentadilla con peso corporal
description: 'La sentadilla es un tipo de ejercicio de peso corporal. Es uno de los ejercicios más populares
  para la fuerza y el crecimiento muscular. La sentadilla es particularmente efectiva para enfocarse en
  los músculos de la pierna y las caderas.

  Las sentadillas son un ejercicio fácil de hacer para los principiantes. Puede ayudar a fortalecer los
  músculos de las piernas, tensar los músculos de la cadera y quemar calorías para perder peso.

  Aprieta los glúteos y las piernas. Las sentadillas son muy efectivas para reafirmar y fortalecer las
  piernas al actuar sobre los glúteos, los flexores de la cadera, los cuádriceps, los isquiotibiales y
  los músculos internos del muslo. Además, las sentadillas con peso corporal pueden ayudar a dar forma
  a los glúteos.'
