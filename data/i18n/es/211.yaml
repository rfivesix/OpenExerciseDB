name: Extensión de tríceps con mancuerna sobre la cabeza
description: 'Sujeta una mancuerna por encima de la cabeza con ambas manos bajo el disco interior, formando
  un agarre de corazón.

  Con los codos por encima de la cabeza, baja los antebrazos por detrás de los brazos flexionando los
  codos. Flexiona las muñecas abajo para evitar que la mancuerna golpee la nuca. Eleva la mancuerna extendiendo
  los codos e hiperextendiendo las muñecas. Vuelve y repite.'
