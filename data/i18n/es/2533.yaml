name: Suspensión en arco
description: 'Posición inicial: Cuélgate de una barra de dominadas con agarre prono, algo más ancho que
  los hombros. Pasa de una suspensión pasiva a una activa bajando las escápulas, alejándolas de las orejas.


  Ejecución: Mantén los codos completamente extendidos, retrae con fuerza las escápulas y extiende la
  columna torácica. Eleva el pecho hacia el techo e inclina el torso hacia atrás unos 45 a 90 grados respecto
  al suelo para formar un arco poco profundo. Contrae con fuerza los dorsales y el trapecio inferior en
  el punto máximo del arco y mantén la posición isométrica de 2 a 5 segundos. Baja despacio y con control
  hasta volver a una suspensión activa.


  Indicaciones: No flexiones los codos para elevarte; el movimiento debe surgir únicamente de la retracción
  escapular y la activación de los dorsales.'
