name: Flexiones en pica
search_terms:
  - Flexiones de pica
  - Pike push-up
description: |-
  Posición inicial:
  Colócate en posición de V invertida (perro boca abajo), con los brazos, piernas y espalda rectos y las caderas elevadas. Las manos deben estar a una anchura ligeramente mayor que la de los hombros.
  Pasos:
  1. Flexiona los codos de manera controlada llevando la coronilla hacia el suelo ligeramente por delante de las manos.
  2. Empuja con fuerza con los hombros y tríceps para volver a extender los brazos por completo.
  3. Repite la operación.
