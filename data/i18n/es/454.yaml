name: Flexión en pica
description: 'Posición inicial:

  Colócate en posición de perro boca abajo o pica, con las manos al ancho de los hombros, las caderas
  elevadas y el cuerpo formando una V invertida.

  Ejecución:

  1. Flexiona los codos y baja la parte superior de la cabeza hacia el suelo, entre las manos o ligeramente
  por delante.

  2. Empuja con las palmas para volver a la posición inicial de pica.

  3. Mantén el tronco firme y las piernas lo más rectas posible. Si quieres aumentar la dificultad, puedes
  apoyar los pies en un banco o una caja.'
