name: Estiramiento del piriforme sentado
description: 'Posición inicial:

  Siéntate erguido en el borde de un banco o silla con los pies planos en el suelo. Cruza el tobillo de una pierna sobre la rodilla contraria formando un cuatro, dejando caer la rodilla flexionada hacia fuera.


  Ejecución:

  Mantén la espalda recta y el pecho alto. Inclínate hacia delante desde las caderas hasta sentir un estiramiento profundo en el glúteo y el músculo piriforme. Mantén la posición estática durante 20 a 30 segundos respirando con calma, luego cambia de lado.


  Consejos:

  Parte de la rutina Limber 11. No redondees la zona lumbar; la inclinación debe nacer de la cadera para aislar correctamente el piriforme.'
