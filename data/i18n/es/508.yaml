name: Remo
description: En el entrenamiento de fuerza, el remo es un ejercicio para fortalecer los músculos que acercan
  los brazos al cuerpo (dorsal ancho), los que retraen las escápulas (trapecio y romboides) y los que
  sostienen la columna (erectores espinales). En una máquina de remo también se trabajan los músculos
  que extienden y sostienen las piernas (cuádriceps y músculos del muslo). En todos los casos, los abdominales
  y la zona lumbar deben trabajar para sostener el cuerpo y ayudar a prevenir lesiones de espalda.
search_terms:
- Remo con barra
- Remo inclinado con barra
