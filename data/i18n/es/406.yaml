name: Rotación externa de hombro tumbado de lado
description: Túmbate de lado sobre una colchoneta y sostén una mancuerna ligera con la mano de arriba.
  Mantén el codo de ese brazo flexionado a 90 grados y ligeramente apoyado contra el costado o la cintura.
  Gira el antebrazo hacia arriba, en dirección al techo, contra la gravedad, y activa el infraespinoso
  y el redondo menor. Después, bájalo lentamente de forma controlada. Evita que el cuerpo ruede hacia
  atrás.
