name: Extensión de tríceps con barra tumbado
description: Túmbate en un banco y sujeta una barra con ambas manos en pronación, separadas a la anchura
  de los hombros. Empieza con los brazos sobre la parte superior del pecho y los codos flexionados unos
  45° hacia atrás. Flexiona los codos y lleva los brazos superiores hacia atrás, bajando la barra por
  detrás de la cabeza y hacia el suelo. La barra debe quedar detrás de la cabeza, no directamente encima.
  Mantén las escápulas retraídas, los codos cerca de la cabeza y el abdomen activo durante el movimiento.
