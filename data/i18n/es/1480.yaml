name: Extensiones de tríceps tumbado con barra
description: |-
  Posición inicial:
  Túmbate boca arriba en un banco plano sujetando una barra con agarre prono a la anchura de los hombros. Extiende los brazos hacia arriba de modo que la barra quede por encima del pecho o ligeramente inclinada hacia la cabeza.

  Ejecución:
  1. Manteniendo los brazos fijos y los codos apuntando al techo, flexiona únicamente los codos para descender la barra de forma controlada hacia la frente o justo detrás de la cabeza.
  2. Evita abrir los codos hacia afuera durante la bajada.
  3. Extiende los codos con fuerza contrayendo los tríceps para volver a la posición de partida.

  Consejos:
  Mantén los hombros estables y la espalda apoyada firmemente contra el banco durante toda la serie.
