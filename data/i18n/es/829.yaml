name: Elevaciones posteriores sentado
description: '- Siéntate en el borde de un banco plano e inclina el torso hacia adelante
  sobre los muslos manteniendo la espalda recta.

  - Sujeta una mancuerna en cada mano por debajo de las piernas con los codos ligeramente
  flexionados.

  - Eleva las mancuernas hacia los lados hasta que los brazos queden a la altura de
  los hombros.

  - Contrae los deltoides posteriores en la parte alta y desciende lentamente con
  control.'
