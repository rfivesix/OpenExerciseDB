name: Bus drivers
description: Siéntate erguido en un banco o en el suelo y sujeta un disco con ambas manos opuestas, en
  las posiciones de las 9 y las 3. Extiende los brazos hacia delante con los codos ligeramente flexionados
  y mantén el disco justo por debajo del nivel de los ojos. Gira el disco suavemente de lado a lado como
  si manejaras un volante, colocando una mano arriba y luego la otra. Mantén los brazos elevados a la
  altura de los hombros y el abdomen tenso durante toda la serie.
