name: Giro de volante con disco (Bus Drivers)
description: '- Siéntate erguido en un banco o en el suelo y sujeta un disco de pesas
  con ambas manos en los laterales (posición de las 9 y las 3 en punto).

  - Eleva el disco al frente con los brazos casi extendidos a la altura de los hombros
  o justo por debajo de los ojos.

  - Gira el disco de forma controlada de un lado a otro como si estuvieras girando
  un volante grande.

  - Mantén los brazos elevados y el abdomen contraído durante todo el movimiento.'
