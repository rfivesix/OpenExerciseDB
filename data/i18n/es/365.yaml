name: Curl de piernas tumbado
description: Túmbate en el banco y coloca las pantorrillas detrás del rodillo, preferiblemente cerca de
  la parte inferior de las pantorrillas. Sujeta las barras para mantener el cuerpo estable. Flexiona las
  piernas para elevar el peso y vuelve lentamente. Durante el ejercicio, el cuerpo debe permanecer quieto;
  el movimiento lo realizan las piernas.
