name: Peso muerto con mancuernas
description: 'Beginpositie:

  Ponte de pie con los pies a la anchura de las caderas y una mancuerna en cada mano, delante de los muslos
  o a los lados. Lleva los hombros atrás, el pecho erguido y las rodillas ligeramente flexionadas.


  Beweging:

  Haz una bisagra de cadera llevando los glúteos hacia atrás e inclinando el torso, con la columna recta
  y neutra. Baja las mancuernas cerca de las espinillas hasta notar un estiramiento intenso en los isquiotibiales.
  Empuja con los talones y extiende las caderas para volver a ponerte de pie, contrayendo los glúteos
  arriba.


  Opmerkingen:

  No encorves la zona lumbar. Mantén las mancuernas cerca de las piernas durante todo el movimiento.'
