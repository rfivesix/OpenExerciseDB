name: Círculos de muñeca
description: 'Posición inicial: Siéntate o ponte de pie con la espalda erguida y los hombros relajados.
  Entrelaza los dedos frente al pecho o forma puños relajados, con los codos cómodamente flexionados y
  las manos delante.


  Ejecución: Haz círculos lentos y fluidos con las muñecas, recorriendo todo el rango de movimiento que
  resulte cómodo, en sentido horario. Tras el tiempo indicado (por ejemplo, 15 a 30 segundos), invierte
  el sentido y gira en sentido antihorario. Mantén un movimiento fluido y nota la activación y el estiramiento
  suaves de los flexores y extensores de la muñeca.


  Indicaciones: Haz el movimiento con suavidad y sin dolor; no fuerces la muñeca hacia ángulos extremos.
  Es un calentamiento adecuado antes de hacer press, paradas de manos, sentadillas frontales o dominadas
  para preparar las muñecas para la carga.'
