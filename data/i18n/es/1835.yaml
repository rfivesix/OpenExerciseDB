name: Rotación externa sentado con mancuerna
description: 'Posición inicial: Siéntate en una esterilla o banco con una rodilla elevada y el pie apoyado.
  Coloca el codo del brazo de trabajo sobre esa rodilla, flexionado a 90°. Sujeta una mancuerna ligera
  con el antebrazo horizontal hacia delante.


  Ejecución:

  1. Mantén el omóplato retraído y bajo, lejos de la oreja.

  2. Gira el antebrazo hacia arriba en un arco vertical hasta que quede perpendicular al suelo.

  3. Pausa un segundo arriba y nota la contracción de los rotadores externos (infraespinoso y redondo
  menor).

  4. Baja lentamente la mancuerna hasta la horizontal, sintiendo un estiramiento suave abajo.


  Indicaciones: Usa poco peso para evitar compensaciones y mantén el codo apoyado de forma estable sobre
  la rodilla.'
