name: Rotación externa sentado con mancuerna
description: "Posición inicial:\nSiéntate en el suelo o sobre un banco con una rodilla\
  \ elevada y el pie apoyado. Apoya el codo del brazo activo sobre la rodilla levantada,\
  \ flexionado a 90 grados. Sujeta una mancuerna ligera con el antebrazo apuntando\
  \ en horizontal hacia adelante.\n\nEjecución:\n1. Mantén el hombro descendido y\
  \ las escápulas activas.\n2. Rota el antebrazo hacia arriba hasta que quede vertical\
  \ respecto al suelo.\n3. Mantén la contracción durante un segundo en la parte alta\
  \ sintiendo los rotadores externos.\n4. Desciende la mancuerna lentamente de regreso\
  \ a la horizontal sintiendo el estiramiento controlado.\n\nConsejos:\nUtiliza un\
  \ peso moderado para aislar con precisión el manguito rotador sin compensaciones."
