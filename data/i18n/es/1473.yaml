name: Apertura inversa en poleas
description: 'Posición inicial:

  Coloca las dos poleas a la altura del pecho o de los ojos. Cruza los cables y sujeta cada uno con la
  mano contraria. Colócate en el centro, con los pies a la anchura de los hombros, y extiende los brazos
  delante del pecho con los codos ligeramente flexionados.


  Ejecución:

  1. Abre ambos brazos hacia fuera y atrás en un arco horizontal amplio, hasta que las manos queden alineadas
  con los hombros.

  2. Contrae los deltoides posteriores y los romboides durante un segundo.

  3. Vuelve despacio a la posición inicial, con los brazos cruzados.


  Indicaciones:

  Conserva la ligera flexión de los codos y mantén el torso quieto.'
