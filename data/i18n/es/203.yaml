name: Sentadilla goblet con mancuerna
search_terms:
  - Sentadilla con disco
  - Goblet Squat con mancuerna
description: |-
  Sujeta una mancuerna verticalmente con ambas manos pegada al pecho, sosteniéndola por los lados de la cabeza superior del peso. Coloca los pies aproximadamente al ancho de los hombros con las puntas ligeramente hacia afuera.
  Desciende flexionando las caderas y las rodillas como si fueras a sentarte, manteniendo la espalda recta y el pecho erguido, hasta que los muslos queden al menos paralelos al suelo. Los codos deben pasar por dentro de las rodillas.
  Empuja con fuerza a través de los talones para volver a la posición inicial, contrayendo los glúteos en la parte superior.
