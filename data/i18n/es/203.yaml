name: Sentadilla goblet con mancuerna
description: 'Sujeta una mancuerna por los lados de los discos superiores con ambas manos. Sostenla delante
  del pecho, cerca del torso. Separa los pies aproximadamente a la anchura de los hombros y mantén las
  rodillas ligeramente flexionadas.

  Baja en sentadilla hasta que los muslos queden paralelos al suelo. Mantén la espalda recta y lleva las
  caderas hacia atrás para que las rodillas queden sobre los pies. Vuelve a subir manteniendo las rodillas
  ligeramente flexionadas. Repite.

  Apoya el peso del cuerpo en los talones y mira al frente o ligeramente hacia arriba para mantener la
  espalda recta.'
