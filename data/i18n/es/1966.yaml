name: Rotación torácica en posición de zancada (Half-Kneeling)
description: 'Posición inicial:

  Colócate en posición de rodillas (medio arrodillado) junto a una pared. La pierna más cercana a la pared queda adelantada a 90 grados. Si lo deseas, sujeta un balón de espuma entre la rodilla delantera y la pared para bloquear la pelvis. Extiende ambos brazos al frente a la altura del pecho.


  Ejecución:

  Abre el brazo exterior hacia atrás en un arco amplio rotando el tórax y la cabeza, manteniendo las caderas y la rodilla delantera inmóviles hacia delante. Haz una pausa de 1-2 segundos en la máxima apertura y regresa despacio al frente.


  Consejos:

  La fijación contra la pared evita compensaciones lumbares y asegura que la movilidad se desarrolle estrictamente en la columna dorsal.'
