name: Rotación torácica en media rodilla
description: Comienza en posición de medio arrodillamiento. Estabiliza contra la pared, con una pelota,
  la pierna que queda más alejada de ella. Coloca ambas manos delante de ti y abre un brazo en rotación,
  intentando alcanzar la pared que queda detrás. Exhala al girar, inhala al volver a la posición neutra
  y repite.
