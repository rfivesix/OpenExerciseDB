name: Estiramiento activo de isquiotibiales (Hamstring Chokes)
description: |-
  Siéntate en el suelo y flexiona una pierna, llevando la rodilla hacia ti. Coloca la mano detrás del isquiotibial y tira suavemente de la pierna hacia el pecho, sintiendo un estiramiento en la parte posterior del muslo. Estira la pierna, extendiéndola hacia arriba en dirección al techo.
