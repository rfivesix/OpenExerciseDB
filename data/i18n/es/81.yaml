name: Remo con mancuerna a una mano en banco
search_terms:
- Remo con mancuernas
- Remo unilateral con mancuerna
description: |-
  Posición inicial:
  Apoya una rodilla y la mano del mismo lado sobre un banco plano, manteniendo la espalda recta y el torso paralelo al suelo. Apoya el otro pie firmemente en el piso para darte estabilidad. Sujeta una mancuerna con la mano libre, dejando que el brazo cuelgue hacia abajo.

  Ejecución:
  1. Jala la mancuerna hacia tu cadera llevando el codo hacia atrás y arriba, manteniéndolo cerca del cuerpo.
  2. Aprieta el dorsal y retrae la escápula en la parte superior del movimiento durante un segundo.
  3. Baja la mancuerna de forma lenta y controlada hasta estirar completamente el dorsal.

  Notas:
  Mantén el torso estable sin rotar la columna al subir el peso. Completa las repeticiones con un brazo antes de cambiar al otro.
