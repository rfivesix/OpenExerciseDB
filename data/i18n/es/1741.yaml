name: Dominadas en L-sit
description: 'Sujeta la barra con agarre prono algo más ancho que los hombros. Cuélgate con los brazos
  extendidos y eleva las piernas rectas delante de ti hasta formar una L con el torso. Activa el abdomen
  y los flexores de cadera.


  1. Manteniendo la posición en L, tira de ti hacia arriba llevando los codos abajo y atrás hasta que
  la barbilla supere la barra.

  2. Haz una pausa breve arriba sin bajar las piernas.

  3. Baja con control hasta quedar colgado, manteniendo las piernas elevadas.


  Mantén las rodillas extendidas y las puntas de los pies estiradas; no uses impulso ni balanceo.'
