name: Saltos de tijera
description: Un jumping jack o salto de estrella, también llamado «side-straddle hop» en el ejército estadounidense,
  es un salto en el que se separan ampliamente las piernas y se llevan los brazos por encima de la cabeza,
  a veces dando una palmada; luego se vuelve a la posición con los pies juntos y los brazos a los lados.
