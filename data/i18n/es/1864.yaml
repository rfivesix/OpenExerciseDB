name: Rotaciones de tobillo
description: 'Posición inicial: Siéntate erguido en una silla o en el suelo y eleva un pie para que el
  tobillo se mueva libremente.


  Ejecución: Dibuja círculos amplios y lentos con los dedos, rotando el tobillo en todo su rango. Haz
  varias repeticiones en sentido horario y luego al contrario.


  Consejos: Mantén quietos la pierna y la rodilla para que la rotación venga del tobillo. Haz 10–15 círculos
  en cada dirección por pie.'
