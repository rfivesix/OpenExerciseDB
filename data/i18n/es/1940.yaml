name: Respiración diafragmática (respiración abdominal)
description: Túmbate cómodamente boca arriba, con las rodillas algo flexionadas si
  quieres. Coloca una mano en el pecho y otra en la parte alta del abdomen, bajo las
  costillas. Inhala lenta y profundamente por la nariz, expandiendo el abdomen para
  que suba esa mano mientras la del pecho permanece casi quieta. Pausa 1–2 segundos
  y exhala despacio por la nariz o con los labios entreabiertos. Repite 8–10 ciclos
  relajados; mantén cuello, hombros y mandíbula relajados.
