name: Jalón con brazos rectos en polea y barra recta
description: Usa el accesorio de barra recta en una polea alta. Sujeta ambos extremos de la barra con las palmas
  hacia abajo y los brazos extendidos delante de ti. Lleva las manos hacia las caderas manteniendo los brazos rectos
  y luego vuelve a elevarlas a la posición inicial.
