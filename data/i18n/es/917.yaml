name: Elevación frontal con barra recta en polea
description: Conecta una barra recta a la polea baja. Ponte de espaldas a la torre con el cable pasando
  entre las piernas. Sujeta la barra delante de los muslos con agarre prono al ancho de los hombros. Eleva
  la barra recta hacia delante con los codos ligeramente flexionados hasta la altura de los hombros o
  los ojos. Haz una pausa breve para contraer los deltoides anteriores y baja lentamente con control,
  sin balancear las caderas.
