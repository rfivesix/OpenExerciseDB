name: Crunch con peso
description: 'El crunch con peso es una variante del crunch clásico que consiste en añadir resistencia
  (un peso) para aumentar la intensidad del trabajo abdominal.


  Túmbate

  (Opcional) Flexiona las rodillas para añadir dificultad

  (Opcional) Flexiona las rodillas y apoya los pies sobre un banco, una caja o algo similar (ángulo de
  90 grados en las rodillas)

  Eleva la cabeza y el torso mientras curvas la espalda hacia delante (si no lo haces es un sit-up e implica
  también algunos músculos de la espalda). Cuanto más alto subas, más deberías sentir la contracción de
  los abdominales.

  Vuelve a la posición inicial y repite'
