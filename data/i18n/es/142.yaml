language: es
status: ai_reviewed
name: Rotación externa con polea
description: |-
  Posición inicial:
  Ajusta la polea a la altura del codo. Colócate de lado a la torre de poleas y toma el agarre con la mano más alejada (brazo externo). Flexiona el codo a 90 grados y mantenlo pegado al costado del cuerpo.

  Ejecución:
  1. Manteniendo el codo fijo contra el torso, rota el antebrazo hacia afuera alejándolo del cuerpo tanto como te sea cómodo.
  2. Haz una breve pausa en el punto de máxima contracción apretando los músculos del manguito rotador.
  3. Regresa lentamente a la posición inicial cruzando el abdomen de forma controlada.

  Notas:
  No gires el torso ni compenses con la espalda; el movimiento debe ser una rotación aislada del hombro.
