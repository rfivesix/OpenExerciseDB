name: Rotación externa en polea
description: 'Posición inicial:

  Ajusta la polea a la altura del codo. Colócate de lado a la torre y sujeta el asa con la mano exterior
  (la más alejada de la polea). Flexiona el codo a 90 grados y mantenlo junto al costado; puedes colocar
  una toalla pequeña enrollada entre el codo y el torso.


  Ejecución:

  1. Manteniendo el codo pegado al costado, gira el antebrazo hacia fuera, alejándolo del cuerpo, hasta
  donde te resulte cómodo.

  2. Contrae los músculos del manguito rotador al final del recorrido y haz una pausa de un segundo.

  3. Devuelve lentamente el asa por delante del torso a la posición inicial.


  Notas:

  Mantén el torso quieto, sin girar la columna ni las caderas. La rotación debe proceder únicamente de
  la articulación del hombro.'
