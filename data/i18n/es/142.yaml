exercise_id: '142'
language: es
status: upstream_unreviewed
name: Rotación externa con polea
description: |-
  Pasos:

  Comienza colocando una banda elástica alrededor de un poste o en una posición segura donde no se suelte y quede a la altura del codo.
  Colócate al lado de la banda y, con la mano contraria a la banda, alcanza y agarra el asa.
  Lleva la banda hacia el pecho manteniendo el codo flexionado en un ángulo de 90 grados, luego rota lentamente el brazo en un movimiento de revés de modo que la banda rote hacia fuera.
  Continúa hacia fuera lo máximo posible para sentir un estiramiento en los hombros, mantén un instante y luego vuelve a la posición inicial.
  Repite tantas repeticiones y series como desees.
