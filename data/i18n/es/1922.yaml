name: Aperturas de pecho en polea sentado
description: 'Posición inicial:

  Coloca un banco vertical entre dos poleas ajustadas a la altura del pecho. Siéntate
  con la espalda apoyada en el respaldo y sujeta las empuñaduras con agarre neutro.


  Ejecución:

  Junta las manos delante del pecho en un arco amplio como si dieras un abrazo, manteniendo
  los codos ligeramente flexionados. Aprieta fuertemente los pectorales al final del
  recorrido y regresa lentamente controlando la apertura hasta sentir un estiramiento
  agradable antes de repetir.


  Consejos:

  Mantén la espalda pegada al banco en todo momento y no estires ni dobles los codos
  durante el movimiento.'
