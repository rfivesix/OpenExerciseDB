name: Abdominales con mancuerna
description: |-
  Los abdominales con mancuerna son una variación con peso de los abdominales tradicionales, diseñados para trabajar los músculos abdominales con mayor intensidad. Acuéstate de espaldas con las rodillas dobladas y los pies apoyados en el suelo. Sostén una mancuerna con ambas manos cerca del pecho o sobre la cabeza. Levanta los hombros y la parte superior de la espalda del suelo en un movimiento de contracción, activando el core. Baja lentamente a la posición inicial. Asegúrate de mantener movimientos controlados durante el ejercicio para evitar lesiones.
