name: Abdominales con mancuerna
description: Los abdominales con mancuerna son una variante con carga del abdominal tradicional, pensada
  para trabajar con más intensidad los músculos abdominales. Túmbate boca arriba con las rodillas flexionadas
  y los pies en el suelo. Sujeta una mancuerna con ambas manos cerca del pecho o por encima de la cabeza.
  Eleva los hombros y la parte superior de la espalda en un abdominal, activando el tronco. Baja lentamente
  a la posición inicial y mantén el movimiento controlado.
