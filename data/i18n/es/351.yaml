name: Elevaciones laterales y frontales
description: '- Haz una elevación lateral y detente arriba, a la altura de los hombros.

  - Sin bajar el peso, lleva las mancuernas juntas delante del cuerpo con los brazos rectos, hasta la
  posición final de una elevación frontal.

  - Baja las mancuernas delante de los muslos como en una elevación frontal.

  - Invierte el movimiento: eleva las mancuernas rectas delante de ti hasta la altura de los hombros,
  abre los brazos hacia los lados hasta la posición final de una elevación lateral y baja las pesas junto
  al cuerpo. Esto completa una repetición.'
