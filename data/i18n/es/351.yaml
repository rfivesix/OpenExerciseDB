exercise_id: '351'
language: es
status: ai_reviewed
name: Elevaciones lateral a frontal
description: |-
  - Realiza una elevación lateral hasta la altura de los hombros y haz una breve pausa.
  - En lugar de bajar el peso, lleva las mancuernas hacia el frente de tu cuerpo con los brazos rectos, terminando en la posición alta de una elevación frontal.
  - Baja las mancuernas de forma controlada frente a tus muslos.
  - Invierte el movimiento: realiza una elevación frontal hasta la altura de los hombros, abre los brazos hacia los laterales a la posición de elevación lateral y baja los pesos a los lados del cuerpo. Esto completa una repetición.
