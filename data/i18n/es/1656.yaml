name: Press de pecho en polea - declinado
description: |-
  Press de pecho a un brazo realizado con la máquina de poleas. Usa el otro brazo para apoyar el peso corporal y así centrarte en la fuerza del empuje en lugar de en equilibrar el cuerpo. Comienza con la mano lo más cerca posible del pecho y luego empuja contra la polea en una ligera declinación, dirigiéndote hacia el centro del pecho.
