name: Estiramiento de tríceps sobre la cabeza (derecho)
description: 'Posición inicial:

  • Colócate de pie o sentado con la espalda erguida.

  • Eleva el brazo derecho por encima de la cabeza, flexiona el codo y deja caer la mano derecha detrás
  de la nuca.


  Ejecución:

  • Sujeta el codo derecho con la mano izquierda y tira suavemente de él hacia atrás y hacia abajo.

  • Siente un estiramiento cómodo en el tríceps derecho durante 20 a 30 segundos.

  • Mantén una respiración profunda y constante sin compensar con la espalda.'
