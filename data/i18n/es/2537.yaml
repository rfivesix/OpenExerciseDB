name: Press isométrico de hombros en polea
description: 'Posición inicial: Colócate entre poleas bajas con asas individuales, o frente a una estación
  de doble polea baja. Lleva las asas a la altura de los hombros con agarre prono y los codos justo debajo
  de las muñecas. Separa los pies al ancho de los hombros y activa firmemente el abdomen y los glúteos.


  Ejecución: Empuja las asas hacia arriba hasta que las manos lleguen a la altura de la frente o justo
  antes de extender por completo por encima de la cabeza. Mantén esa posición completamente inmóvil contra
  la tensión constante de la polea durante el tiempo indicado, contrayendo al máximo los deltoides anteriores
  y los tríceps. Cuando termine la pausa, baja las asas despacio y con control hasta la altura de los
  hombros.


  Indicaciones: Mantén las costillas hacia abajo y evita arquear la zona lumbar. La tracción constante
  y multidireccional de las poleas exige estabilidad intensa de los hombros y el tronco durante la pausa
  isométrica.'
