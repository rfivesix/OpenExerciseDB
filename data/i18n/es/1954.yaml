name: Volteretas hacia V-sit
description: Siéntate erguido con las piernas extendidas. Redondea la espalda y rueda
  hacia atrás sobre la parte alta de la espalda, elevando las caderas y llevando las
  piernas por encima de la cabeza. Usa un impulso controlado para volver a sentarte,
  abre las piernas en V y alcanza hacia delante entre ellas para estirar isquiotibiales
  e ingles. Repite 10 veces con fluidez. Mantén relajado el cuello y apoya el peso
  sobre la parte alta de la espalda y los hombros.
