name: Elevaciones frontales con disco
description: 'La elevación frontal con disco es una variante de la elevación frontal con mancuernas: se
  sujeta un disco con ambas manos en vez de usar una mancuerna, una barra u otra pesa. Puede aportar variedad
  a una rutina para desarrollar los hombros o a un circuito de tren superior o cuerpo completo.

  De pie, sujeta un disco de barra con ambas manos en las posiciones de las 3 y las 9 en punto. Las palmas
  deben mirarse entre sí; los brazos se extienden y permanecen casi rectos, con una ligera flexión de
  los codos. Coloca el disco delante de la cintura, tan abajo como puedas. Esta es la posición inicial;
  los brazos mantienen esta posición durante el ejercicio.

  Espira y eleva lentamente el disco hasta algo por encima de los hombros. Mantén la contracción un segundo.
  Inspira y baja lentamente el disco a la posición inicial. Repite el número de veces recomendado.'
