name: Estiramiento de rotación del torso
description: De pie con los pies al ancho de los hombros y las rodillas relajadas, o sentado erguido,
  coloca las manos en las caderas o cruza los brazos sobre el pecho. Gira lentamente el torso hacia un
  lado manteniendo las caderas y la pelvis orientadas al frente. Mantén el estiramiento en el torso y
  la zona torácica durante 15 a 30 segundos con respiración normal. Vuelve al centro y gira hacia el otro
  lado.
