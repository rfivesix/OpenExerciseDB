exercise_id: '1451'
language: es
status: ai_reviewed
name: Estiramiento de rotación del torso
description: |-
  Posición inicial:
  • De pie con los pies a la anchura de los hombros y las rodillas ligeramente relajadas (o sentado erguido en un banco).
  • Cruza los brazos sobre el pecho o apoya las manos en las caderas.

  Ejecución:
  • Rota el torso lentamente hacia un lado manteniendo las caderas y la pelvis mirando al frente.
  • Sostén el estiramiento de 15 a 30 segundos sintiendo la apertura en los oblicuos y la espalda media.
  • Vuelve al centro de forma controlada y repite hacia el lado contrario.
