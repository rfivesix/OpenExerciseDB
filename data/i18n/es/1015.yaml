name: Círculos de cuello en sentido horario
description: 'Posición inicial:

  Siéntate o ponte de pie con la espalda erguida y los hombros relajados hacia abajo. Baja suavemente
  la barbilla hacia el pecho.


  Ejecución:

  1. Realiza un movimiento circular lento y fluido en el sentido de las agujas del reloj: inclina la cabeza
  hacia el hombro derecho, pásala suavemente hacia atrás, continúa hacia el hombro izquierdo y vuelve
  al pecho.

  2. Mantén el cuello relajado y evita forzar o comprimir las cervicales al pasar por atrás.

  3. Repite las rotaciones de forma continua y controlada.'
