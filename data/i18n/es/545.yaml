name: Tijeras
description: Túmbate boca arriba con las piernas extendidas y las manos apoyando la zona lumbar o junto a los costados.
  Eleva ligeramente las piernas del suelo. Mueve las piernas como unas tijeras en sentido horizontal o vertical,
  cruzando una sobre la otra de forma alterna. Mantén el tronco activo y la zona lumbar presionada contra el suelo
  durante todo el movimiento.
