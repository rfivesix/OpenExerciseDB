name: Leñador inverso con banda
description: Fija una banda elástica a un soporte por debajo de la altura de la rodilla. Sujeta el otro
  extremo con ambas manos como un bate de béisbol y colócate de frente a la banda. Empieza con las manos
  junto a la cadera y las rodillas flexionadas. Gira las caderas mientras llevas las manos por encima
  del hombro contrario, como si batearas.
