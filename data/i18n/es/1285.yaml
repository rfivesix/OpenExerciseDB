name: Patadas hacia los glúteos
description: 'Beginpositie:

  Ponte de pie con los pies a la anchura de las caderas y el core ligeramente activado.


  Uitvoering:

  1. Empieza a trotar en el sitio o avanzando a un ritmo constante.

  2. Flexiona las rodillas para llevar los talones hacia los glúteos en cada zancada.

  3. Mantén los muslos orientados principalmente hacia abajo y acompaña el movimiento con los brazos de
  forma natural.


  Tips:

  Es un calentamiento dinámico para activar los isquiotibiales y las pantorrillas antes de un trabajo
  intenso del tren inferior.'
