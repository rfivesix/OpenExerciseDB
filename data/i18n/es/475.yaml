name: Dominada
description: Agarra la barra de dominadas con un agarre ancho y deja que el cuerpo cuelgue libremente.
  Mantén el pecho abierto y tira del cuerpo hacia arriba hasta que la barbilla llegue a la barra o la
  nuca la toque si haces la variante tras nuca. Baja lentamente y de forma controlada, manteniendo el
  pecho abierto.
