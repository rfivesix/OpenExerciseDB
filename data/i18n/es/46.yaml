name: Zancada de pie con barra
description: 'Coloca la barra sobre la parte posterior de los hombros. Ponte erguido y da un primer paso
  hacia delante, lo bastante largo para que la rodilla de la pierna de apoyo pueda acercarse al suelo.
  Vuelve a ponerte de pie y repite con la otra pierna.

  Recuerda mantener una buena postura.'
