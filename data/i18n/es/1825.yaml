name: Elevación para deltoides posteriores con apoyo en el pecho
description: "Posición inicial:\nAjusta un banco inclinado a 30-45 grados. Túmbate\
  \ boca abajo con el pecho bien apoyado en el respaldo y el cuello neutro. Sujeta\
  \ un par de mancuernas ligeras con agarre neutro o con los pulgares hacia arriba,\
  \ con los brazos colgando hacia el suelo.\n\nEjecución:\n1. Con los codos ligeramente\
  \ flexionados, eleva las mancuernas hacia arriba y hacia afuera en forma de \"Y\"\
  .\n2. Concéntrate en activar los deltoides posteriores y retraer los omóplatos en\
  \ la parte más alta.\n3. Mantén la contracción durante un segundo a la altura de\
  \ los hombros.\n4. Desciende las mancuernas lentamente hasta la posición inicial\
  \ sin usar balanceo.\n\nConsejos:\nEl apoyo sobre el banco aísla el trabajo eliminando\
  \ cualquier impulso de la zona lumbar."
