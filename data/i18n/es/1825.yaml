name: Elevación posterior con pecho apoyado
description: 'Posición inicial: Ajusta un banco inclinado a unos 30–45°. Túmbate boca abajo con el pecho
  apoyado, los pies en el suelo y el cuello neutro. Sujeta dos mancuernas ligeras colgando debajo de ti
  con agarre neutro o pulgares hacia arriba.


  Ejecución:

  1. Con los codos ligeramente flexionados, eleva las mancuernas en diagonal hacia fuera y arriba, trazando
  una Y amplia.

  2. Tira con los deltoides posteriores y retrae los omóplatos en la parte alta.

  3. Contrae arriba cuando los brazos estén aproximadamente a la altura de los hombros y haz una pausa
  de un segundo.

  4. Baja lentamente y con control.


  Indicaciones: Mantener el pecho apoyado evita el balanceo y favorece el trabajo aislado del deltoides
  posterior y la parte alta de la espalda.'
