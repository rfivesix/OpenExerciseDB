name: Flexiones en parallettes
description: |-
  Posición inicial:
  Coloca dos barras parallettes paralelas en el suelo a la anchura de los hombros. Sujeta las barras con un agarre neutro (las palmas mirándose) y colócate en posición de plancha alta con el cuerpo recto.

  Ejecución:
  1. Flexiona los codos y desciende el pecho profundamente entre las barras de forma controlada.
  2. Aprovecha el mayor rango de movimiento para conseguir un estiramiento profundo del pectoral.
  3. Empuja con fuerza hacia arriba extendiendo los brazos hasta volver a la posición inicial.
  4. Este agarre neutro reduce el estrés articular en las muñecas y aumenta la estimulación muscular.
