name: Flexiones en paralelas
description: 'Posición inicial:

  Coloca dos barras paralelas en el suelo, aproximadamente a la anchura de los hombros. Sujétalas con
  agarre neutro, con las palmas enfrentadas, y extiende las piernas hacia atrás hasta formar una plancha
  firme.


  Ejecución:

  1. Flexiona los codos y baja el pecho entre las barras con control.

  2. Aprovecha el mayor rango de movimiento para estirar los pectorales.

  3. Empuja con las palmas hasta extender los brazos.

  4. La posición neutra de las muñecas reduce la tensión en sus articulaciones y permite trabajar pecho
  y tríceps.'
