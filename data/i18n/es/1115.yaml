name: Zancadas 3D de calentamiento
description: |-
  Posición inicial:
  Ponte de pie con los pies al ancho de las caderas. Para calentar, puedes sostener mancuernas muy ligeras o realizarlo solo con el peso corporal.

  Ejecución:
  1. Plano sagital: Realiza una zancada hacia adelante, flexiona ambas rodillas a 90 grados y vuelve empujando hacia el centro.
  2. Plano frontal: Da un paso amplio hacia un lado en zancada lateral, doblando la rodilla del paso mientras la otra pierna queda extendida, y regresa.
  3. Plano transversal: Da un paso en diagonal hacia atrás a 45 grados rotando la cadera, desciende en la zancada y vuelve al inicio.
  4. Alterna las tres direcciones en ambas piernas para activar la movilidad articular de tobillos, rodillas y caderas.
