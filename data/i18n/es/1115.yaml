name: Zancada 3D de calentamiento
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de las caderas. Para el calentamiento, usa mancuernas ligeras
  o solo el peso corporal.


  Ejecución:

  1. Plano sagital: da un paso controlado hacia delante, baja hasta flexionar ambas rodillas unos 90 grados
  y vuelve al centro.

  2. Plano frontal: da un paso lateral y flexiona la rodilla de esa pierna mientras la otra queda extendida;
  regresa al centro.

  3. Plano transversal: da un paso en diagonal hacia atrás, abre las caderas unos 45 grados, baja en la
  zancada y vuelve al centro.

  4. Repite la secuencia en todas las direcciones con ambas piernas para preparar caderas, rodillas, glúteos
  y aductores.'
