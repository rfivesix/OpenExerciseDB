name: Giro ruso con balón medicinal
description: 'Posición inicial:

  Siéntate en el suelo con las rodillas flexionadas y los pies apoyados ligeramente o elevados para aumentar
  la dificultad. Sujeta un balón medicinal delante del pecho e inclina el torso hacia atrás unos 45 grados,
  con la espalda recta.


  Ejecución:

  1. Activa el abdomen y rota suavemente el torso a la derecha, llevando el balón hacia el suelo junto
  a la cadera derecha.

  2. Vuelve por el centro y gira hacia la izquierda, llevando el balón junto a la cadera izquierda.

  3. Mantén las caderas y las piernas lo más quietas posible para que la rotación se origine en la columna
  torácica y los oblicuos.

  4. Alterna los lados con fluidez.'
