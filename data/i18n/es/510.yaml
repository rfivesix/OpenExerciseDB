name: Remo con barra con el pecho apoyado en banco
description: 'Posición inicial: Túmbate boca abajo en un banco plano elevado. Sujeta la barra situada debajo del
  banco con agarre prono y a la anchura de los hombros.

  Ejecución: Tira de la barra hacia el torso llevando los codos hacia atrás y juntando los omóplatos.

  Regreso: Baja la barra de forma controlada hasta extender los brazos por completo.

  Indicaciones: El banco sostiene el torso y elimina la carga sobre la columna, permitiendo aislar los dorsales,
  los romboides y la parte superior de la espalda.'
