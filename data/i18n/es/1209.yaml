exercise_id: '1209'
language: es
status: upstream_unreviewed
name: Flexión a tres puntos al ancho de los hombros
description: |-
  Colócate en posición de flexión con los hombros directamente sobre las manos y los pies separados al ancho de las caderas. Lleva el ombligo hacia la columna y aprieta los músculos abdominales. Levanta el pie izquierdo unos cinco centímetros del suelo. Apunta los dedos del pie directamente hacia abajo. No muevas las caderas. Tu cuerpo forma una línea recta desde la cabeza hasta los talones durante todo el ejercicio. Ahora flexiona los codos, baja el pecho hacia el suelo y empújate de nuevo hacia arriba. Repite el ejercicio en el otro lado.
