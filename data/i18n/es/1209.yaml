exercise_id: '1209'
language: es
status: ai_reviewed
name: Flexión a tres puntos
description: |-
  Posición inicial:
  • Colócate en posición de flexión estándar con las manos a la anchura de los hombros.
  • Levanta un pie unos cinco centímetros del suelo, quedando apoyado sobre tres puntos.
  • Mantén la pelvis nivelada y el abdomen firme para evitar cualquier torsión.

  Ejecución:
  • Flexiona los codos descendiendo el pecho hacia el suelo con control.
  • Mantén el cuerpo recto y rígido sin dejar que la cadera rote o se hunda.
  • Empuja con las manos para volver a la posición superior y alterna la pierna elevada tras la serie.
