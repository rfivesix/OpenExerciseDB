name: Superman mariposa
description: 'Posición inicial: Túmbate boca abajo en una colchoneta con las piernas
  extendidas. Entrelaza los dedos detrás de la cabeza y abre los codos hacia los lados.


  Ejecución: Contrae los erectores de la columna y la musculatura de la espalda alta
  para elevar a la vez la cabeza, el pecho y los codos. Junta las escápulas y sube
  los codos hasta donde resulte cómodo. Mantén la contracción máxima durante 1–2 segundos
  y baja despacio con control.


  Consejos: Mantén la mirada dirigida hacia la colchoneta para conservar el cuello
  neutro, sin echar la cabeza hacia atrás.'
