name: Máquina de abdominales gym80 3008
description: Siéntate en la máquina y ajusta el asiento y las almohadillas para que
  el eje de giro coincida con la zona lumbar. Apoya el torso en la almohadilla del
  pecho y sujeta suavemente las asas. Exhala y flexiona la columna hacia delante y
  abajo contrayendo el recto abdominal; pausa un segundo y vuelve lentamente a la
  posición erguida sin dejar caer la pila de pesas. Inicia el movimiento con los abdominales,
  no con los brazos ni los pies.
