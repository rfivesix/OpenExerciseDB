exercise_id: '1198'
language: es
status: ai_authored
name: Remo invertido
description: |-
  Posición inicial:
  • Coloca una barra en un soporte a la altura de la cadera.
  • Túmbate boca arriba debajo de la barra y agárrala en pronación ligeramente más abierta que la anchura de los hombros.
  • Apoya los talones en el suelo manteniendo el cuerpo recto como una tabla desde la cabeza hasta los pies.

  Ejecución:
  • Tira del pecho hacia la barra llevando los codos hacia atrás y juntando las escápulas.
  • Mantén los glúteos y el abdomen activados para evitar que la cadera caiga.
  • Desciende de forma lenta y controlada hasta extender los brazos por completo.
