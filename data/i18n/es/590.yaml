name: Elevación de pantorrillas sentado
description: Siéntate en un banco para elevar las pantorrillas y comprueba que la mitad del pie quede libre y que
  puedas estirar completamente los músculos de la pantorrilla hacia abajo. Eleva los talones todo lo que puedas.
  Haz una pausa de 1 o 2 segundos en el punto más alto y baja.
