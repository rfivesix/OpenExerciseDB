name: Flexión lateral del tronco con mancuerna
description: También se conoce como flexión lateral con mancuerna. Ponte de pie con las caderas alineadas, las rodillas
  ligeramente flexionadas y la curvatura natural de la columna. Deja un brazo extendido junto al cuerpo y sujeta
  una mancuerna con esa mano. Flexiona lentamente el tronco hacia un lado de forma controlada hasta alcanzar aproximadamente
  45°.
