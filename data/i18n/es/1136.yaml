name: Jalón al pecho con agarre neutro
description: 'Posición inicial:

  Siéntate en una máquina de jalón (o arrodíllate frente a una polea alta) y fija los muslos bajo los
  soportes. Sujeta un agarre paralelo con las palmas enfrentadas. Mantén el pecho elevado y una ligera
  curvatura natural en la zona lumbar.


  Ejecución:

  1. Tira del agarre hacia la parte superior del pecho, llevando los codos hacia abajo y atrás.

  2. Junta las escápulas y haz una breve pausa abajo para contraer los dorsales.

  3. Devuelve el agarre lentamente hasta extender por completo los brazos.'
