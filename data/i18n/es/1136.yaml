exercise_id: '1136'
language: es
status: ai_reviewed
name: Jalón al pecho con agarre neutro
description: |-
  Posición inicial:
  • Siéntate en la máquina de jalón al pecho fijando los muslos bajo las almohadillas de sujeción.
  • Sujeta el agarre paralelo (neutro), de modo que las palmas de las manos queden enfrentadas.
  • Mantén la espalda recta, el pecho elevado y una ligera curvatura lumbar fisiológica.

  Ejecución:
  • Tira del agarre hacia abajo en dirección a la parte superior del pecho, llevando los codos hacia abajo y atrás.
  • Junta las escápulas y aprieta los dorsales en la posición más baja durante uno o dos segundos.
  • Deja que el agarre suba lentamente y de manera controlada hasta extender los brazos por completo.
