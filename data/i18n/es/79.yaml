name: Remo alto inclinado
description: 'Posición inicial:

  Ponte de pie con los pies al ancho de los hombros y sujeta una mancuerna en cada mano delante de los
  muslos. Inclínate desde las caderas, con las rodillas ligeramente flexionadas y la espalda recta, hasta
  que el torso quede inclinado y los brazos cuelguen.


  Ejecución:

  1. Tira de las mancuernas verticalmente hacia el pecho o las axilas, llevando los codos altos y hacia
  fuera.

  2. Contrae los deltoides posteriores y la parte superior de la espalda arriba.

  3. Baja las mancuernas despacio y de forma controlada hasta que los brazos cuelguen de nuevo.


  Notas:

  Mantén la espalda recta y el tronco firme. El movimiento debe impulsarse llevando los codos hacia arriba.'
