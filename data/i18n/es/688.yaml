name: Oblicuo externo superior
description: Adopta una posición de plancha lateral o cuélgate firmemente de una barra de dominadas con
  el abdomen activo. Flexiona el tronco lateralmente de forma controlada o eleva las piernas de lado para
  contraer la parte superior de los oblicuos externos. Mantén brevemente la contracción máxima y vuelve
  con suavidad a la posición inicial antes de repetir hacia el otro lado.
