exercise_id: '1215'
language: es
status: ai_reviewed
name: Ángel de nieve invertido
description: |-
  Posición inicial:
  • Túmbate boca abajo sobre una colchoneta con las piernas estiradas y los brazos extendidos por delante de la cabeza.
  • Mantén la mirada fija en el suelo para cuidar la alineación cervical.

  Ejecución:
  • Eleva ligeramente los brazos y la parte superior del pecho del suelo activando la espalda superior.
  • Mueve los brazos hacia afuera y hacia atrás en un amplio arco lateral hasta acercar las manos a los muslos.
  • Junta las escápulas y aprieta con fuerza los romboides y trapecios.
  • Vuelve a realizar el arco en sentido inverso hacia la cabeza sin dejar caer los brazos al suelo.
