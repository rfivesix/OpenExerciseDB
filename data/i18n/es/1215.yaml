name: Ángel de nieve invertido
description: 'Posición inicial:

  • Túmbate boca abajo en una colchoneta, con las piernas estiradas y los brazos extendidos por encima
  de la cabeza.

  • Mantén el cuello neutro y la mirada hacia el suelo.


  Ejecución:

  • Eleva ligeramente los brazos y la parte superior del pecho contrayendo la espalda alta.

  • Desplaza los brazos hacia fuera y hacia abajo en un arco amplio hasta que las manos se acerquen a
  los muslos.

  • Junta los omóplatos al final del recorrido.

  • Invierte lentamente el arco para volver a extender los brazos sobre la cabeza, manteniéndolos elevados
  del suelo.'
