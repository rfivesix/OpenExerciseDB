name: Press de banca con pausa
description: Baja la barra hasta el pecho y haz una pausa de 2 segundos, sin apoyarla ni descansar. Vuelve
  a empujarla hacia arriba. Usa el mismo peso que usarías en el press de banca, pero haz repeticiones
  individuales. El total de repeticiones debe coincidir con las que hiciste en una serie de press de banca
  (por ejemplo, si hiciste 3 series de 8, haz 8 repeticiones individuales con pausa).
