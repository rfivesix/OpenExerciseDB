name: Curl inverso con barra EZ en polea
description: Conecta una barra EZ al cable bajo y ponte frente a la máquina. Sujeta la barra con agarre
  prono en las curvas interiores. Mantén los codos pegados a los costados y lleva la barra hacia arriba
  hasta que los antebrazos se acerquen al pecho. Baja la barra lentamente y con control hasta el inicio,
  manteniendo la tensión en los antebrazos y el braquial.
