name: Curl inverso en polea con barra EZ
description: '- Conecta una barra EZ a la polea baja y colócate de pie erguido frente
  a la torre de poleas.

  - Sujeta la barra con agarre prono (palmas hacia abajo) en las curvas interiores.

  - Con los codos fijos a los costados, flexiona los brazos llevando la barra hacia
  el pecho.

  - Desciende el peso lentamente con control manteniendo la tensión en los antebrazos.'
