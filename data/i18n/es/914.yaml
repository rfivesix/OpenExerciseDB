exercise_id: '914'
language: es
status: human
name: Curl Inverso con Barra EZ en Polea
description: |-
  Este ejercicio es clave para desarrollar el músculo braquial (que se encuentra debajo del bíceps) y el braquiorradial (la parte superior del antebrazo), lo que añade grosor y una apariencia más completa al brazo. El uso de la barra EZ y la polea hace que el movimiento sea más cómodo para las muñecas y mantenga una tensión constante.
  Instrucciones

  Posición: Conecta una barra EZ a una polea en su posición más baja. De pie, sujeta la barra con un agarre prono (palmas mirando hacia abajo) y con las manos sobre las curvas exteriores de la barra.
  Movimiento: Manteniendo los codos fijos y pegados a los costados de tu cuerpo, flexiónalos para subir la barra en un arco controlado.
  Contracción: Concéntrate en apretar los antebrazos en la parte alta del movimiento. Baja de forma lenta, resistiendo la tensión del cable, hasta que tus brazos estén completamente extendidos.
