exercise_id: '366'
language: es
status: ai_reviewed
name: Curl femoral sentado
description: |-
  Ajusta la palanca de la máquina para adaptarla a tu altura y siéntate en la máquina con la espalda contra el respaldo. Coloca los tobillos sobre el cojín inferior, los muslos debajo de la almohadilla de sujeción justo por encima de las rodillas y las manos en los agarres. Al inspirar realiza una flexión de rodillas llevando los talones hacia atrás. Mantén la espalda inmóvil en todo momento. Aguanta la contracción un segundo y regresa lentamente a la posición inicial exhalando al final.
