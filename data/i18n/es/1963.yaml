name: Sentadilla a tempo lenta
description: 'Posición inicial:

  Colócate de pie con los pies a la anchura de los hombros y las puntas ligeramente hacia fuera. Pecho erguido y brazos cruzados o extendidos al frente.


  Ejecución:

  Desciende de forma controlada durante 3 segundos empujando las caderas hacia atrás hasta romper el paralelo. Mantén la posición baja profunda durante 2 segundos con el core firme. Sube de forma explosiva y firme en 1 segundo empujando con toda la planta del pie.


  Consejos:

  La cadencia controlada (3 segundos de bajada, 2 de pausa, 1 de subida) aumenta el tiempo bajo tensión y perfecciona la técnica.'
