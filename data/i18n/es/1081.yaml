name: Rotaciones de hombros con banda o palo
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de los hombros. Sujeta delante del cuerpo una banda elástica,
  un tubo de PVC o un palo de escoba con agarre prono amplio y los brazos extendidos.


  Ejecución:

  1. Mantén los codos rectos y lleva los brazos por encima de la cabeza describiendo un arco amplio.

  2. Continúa la rotación hacia atrás hasta que la banda o el palo llegue detrás de las caderas o los
  glúteos.

  3. Evita arquear la zona lumbar o doblar los codos; ensancha el agarre si hace falta.

  4. Invierte el movimiento y vuelve por encima de la cabeza hasta el frente.

  5. Repite con movimientos fluidos.'
