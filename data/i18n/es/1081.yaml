name: Dislocaciones de hombros (con banda o pica)
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de los hombros y la espalda recta. Sujeta una banda elástica o pica delante del cuerpo con un agarre prono amplio y los brazos estirados.

  Ejecución:
  1. Manteniendo los codos completamente rectos, sube los brazos por delante de ti y por encima de la cabeza describiendo un arco amplio.
  2. Continúa la rotación hacia atrás hasta llevar la banda o pica detrás de las caderas o glúteos.
  3. No arquees la zona lumbar ni dobles los codos; si notas excesiva rigidez, ensancha el agarre.
  4. Invierte el movimiento pasando de nuevo por encima de la cabeza hasta volver al frente.
  5. Repite de forma controlada para mejorar la movilidad articular del hombro.
