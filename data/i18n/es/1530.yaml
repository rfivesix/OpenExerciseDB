name: Curls con mancuernas tumbado
description: |-
  Toma una mancuerna en cada mano y túmbate boca arriba sobre un banco, de forma similar a un press de pecho clásico. Deja que los brazos cuelguen hacia abajo a los lados, con las mancuernas tocando posiblemente el suelo. Ahora empieza a levantar las mancuernas hacia arriba hasta que los antebrazos queden perpendiculares al techo. Baja lentamente las mancuernas hasta que casi vuelvan a tocar el suelo. Mantén los codos en su sitio para minimizar las trampas.
