name: Postura del niño
description: Arrodíllate sobre una esterilla con las rodillas separadas, los dedos gordos de los pies
  juntos y las caderas sobre los talones. Inclínate hacia delante desde las caderas y apoya el torso entre
  los muslos. Extiende los brazos al frente sobre la esterilla, con las palmas hacia abajo, y baja suavemente
  la frente al suelo. Respira profundamente hacia la espalda y las costillas, dejando que la columna,
  las caderas y los hombros se relajen y se alarguen con cada exhalación.
