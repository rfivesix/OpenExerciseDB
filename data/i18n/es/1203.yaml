name: Elevación de talones a una pierna (izquierda)
description: |-
  Posición inicial:
  • Colócate de pie sobre un escalón o en el suelo apoyando el tercio anterior del pie izquierdo en el borde.
  • Flexiona la pierna derecha para mantenerla suspendida en el aire.
  • Apoya una mano en la pared o soporte para mantener el equilibrio.

  Ejecución:
  • Deja descender ligeramente el talón izquierdo para estirar la pantorrilla.
  • Empuja con fuerza sobre la bola del pie elevando el talón hasta quedar de puntillas en máxima contracción.
  • Mantén la posición superior durante 2 o 3 segundos y desciende de forma controlada.
