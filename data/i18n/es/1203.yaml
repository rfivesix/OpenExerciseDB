name: Elevación de talones a una pierna (izquierda)
description: Ponte de pie en el suelo o en el borde de un escalón para ampliar el recorrido. Levanta un
  pie y eleva el talón del otro hasta quedar de puntillas. (Variable) Mantén la posición durante tres
  segundos. Baja el pie lentamente hasta que el talón casi toque el suelo; no dejes que caiga de golpe.
