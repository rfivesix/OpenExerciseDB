name: Hiperextensión inversa
description: 'Túmbate boca abajo en un banco plano o una máquina de hiperextensión inversa, con las caderas
  en el borde posterior y las piernas colgando. Sujétate al banco o a las asas para estabilizar el torso.


  1. Contrae glúteos e isquiotibiales para elevar las piernas hacia atrás y arriba en un arco controlado.

  2. Sube hasta que las piernas queden paralelas al torso y notes la contracción de glúteos y erectores
  espinales.

  3. Haz una breve pausa arriba sin hiperextender la zona lumbar.

  4. Baja las piernas despacio y con control antes de la siguiente repetición.


  Prioriza la extensión de cadera impulsada por glúteos e isquiotibiales; evita balancear las piernas
  o hiperextender la zona lumbar.'
