name: Hiperextensión inversa
description: "Posición inicial:\nTúmbate boca abajo sobre un banco plano o máquina\
  \ de hiperextensión inversa, de modo que las caderas queden al borde y las piernas\
  \ cuelguen libremente hacia abajo. Agárrate con firmeza al banco para fijar el torso.\n\
  \nEjecución:\n1. Contrae los glúteos y los isquiotibiales para elevar las piernas\
  \ hacia atrás y hacia arriba en un movimiento controlado.\n2. Sube hasta que las\
  \ piernas queden alineadas con el torso, apretando los glúteos en la parte alta.\n\
  3. Desciende las piernas lentamente hasta la posición inicial sin balanceo.\n\n\
  Consejos:\nEvita arquear en exceso la zona lumbar; el movimiento debe ser generado\
  \ principalmente por la extensión de cadera."
