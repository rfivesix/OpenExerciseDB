name: Rodillo de espuma para isquiotibiales
description: 'Posición inicial: Siéntate en el suelo con el rodillo bajo la parte posterior de los muslos.
  Apóyate en las manos detrás de ti y eleva las caderas.


  Ejecución: Rueda lentamente desde justo debajo de los glúteos hasta justo por encima de la parte posterior
  de las rodillas. Gira los pies ligeramente hacia dentro y fuera para abarcar los isquiotibiales.


  Consejos: Muévete con control y haz pausas en las zonas tensas para favorecer la liberación miofascial.'
