name: Zancada lateral (derecha)
description: Ponte de pie con los pies más separados que los hombros y las puntas hacia delante o ligeramente
  hacia fuera. Desplaza el peso hacia la derecha, flexiona la rodilla derecha y lleva la cadera hacia
  atrás. Mantén la pierna izquierda estirada y el pie izquierdo apoyado. Baja hasta que el muslo derecho
  quede casi paralelo al suelo y empuja con el talón derecho para volver a la posición amplia. Mantén
  el pecho elevado y la rodilla derecha alineada con el pie.
