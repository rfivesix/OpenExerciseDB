name: Elevación de talones en prensa de piernas
description: 'Posición inicial:

  Siéntate en la prensa de piernas y coloca la parte delantera de los pies en el borde inferior de la
  plataforma, dejando los talones libres por debajo. Desbloquea los topes de seguridad con las rodillas
  ligeramente flexionadas, no bloqueadas.


  Ejecución:

  1. Baja los talones flexionando los tobillos para estirar por completo los gemelos.

  2. Empuja con la parte delantera de los pies y los dedos para alejar la plataforma y llevar los tobillos
  a una flexión plantar completa.

  3. Contrae los gemelos en el punto máximo durante un segundo y baja lentamente a la posición estirada.


  Notas:

  Mantén las rodillas ligeramente desbloqueadas durante toda la serie para centrar la tensión en el gastrocnemio.'
