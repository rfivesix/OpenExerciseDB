name: Rodillo de espuma para cuádriceps
description: 'Posición inicial: Túmbate boca abajo con el rodillo bajo la parte delantera de los muslos.
  Apoya la parte superior del cuerpo sobre los antebrazos en posición de plancha.


  Ejecución: Rueda lentamente desde la parte superior del pliegue pélvico hasta justo encima de las rótulas.
  Inclina ligeramente las piernas hacia dentro o fuera para trabajar todas las porciones del cuádriceps.


  Consejos: Mantén los abdominales activos para evitar que la zona lumbar se hunda en extensión excesiva.'
