name: Rodillo de espuma para la banda iliotibial
description: 'Posición inicial: Túmbate de lado con el rodillo bajo la cara externa del muslo inferior,
  justo debajo de la cadera. Apóyate en un antebrazo y coloca el pie superior delante de ti, apoyado en
  el suelo, para estabilizarte y regular la carga.


  Ejecución: Rueda lentamente por la parte externa del muslo desde debajo de la cadera hasta justo por
  encima de la rodilla.


  Consejos: No ruedes directamente sobre el hueso de la cadera ni la articulación de la rodilla. Regula
  la presión empujando con el pie y el brazo de apoyo.'
