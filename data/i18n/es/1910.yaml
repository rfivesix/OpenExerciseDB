name: Superman de rodillas (Bird Dog)
description: 'Posición inicial: Colócate a cuatro apoyos sobre una colchoneta, con
  las manos debajo de los hombros y las rodillas bajo las caderas. Mantén la columna
  neutra y activa el tronco.


  Ejecución: Extiende a la vez un brazo recto hacia delante y la pierna contraria
  hacia atrás, hasta que ambos queden paralelos al suelo y alineados con el torso.
  Mantén la postura estática 2–3 segundos con el tronco estable. Vuelve despacio a
  la posición inicial y repite con el lado contrario.


  Consejos: No dejes que las caderas se inclinen o giren. Mira hacia la colchoneta
  para mantener el cuello neutro.'
