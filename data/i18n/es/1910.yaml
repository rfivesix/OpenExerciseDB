name: Superman de rodillas (Bird Dog)
description: 'Posición inicial:

  Colócate en cuadrupedia sobre una esterilla con las manos debajo de los hombros y las rodillas debajo de las caderas. Mantén la columna neutra y el core activado.


  Ejecución:

  Extiende simultáneamente un brazo hacia delante y la pierna contraria hacia atrás hasta que queden alineados con el torso. Mantén la postura durante 2 o 3 segundos con el core firme. Regresa con control y repite con el lado opuesto.


  Consejos:

  Evita rotar la pelvis o arquear en exceso la zona lumbar; el movimiento debe ser completamente estable y controlado.'
