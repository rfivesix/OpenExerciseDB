name: Curl Kong
description: Este ejercicio se parece a un curl en polea y a un cruce de poleas, pero trabaja el músculo
  braquial. Mantén los antebrazos en pronación, aproximadamente a 45° al empezar, y los codos ligeramente
  flexionados. Haz curls alternos hasta que las manos, primero los pulgares, lleguen a la parte superior
  y central del pecho.
