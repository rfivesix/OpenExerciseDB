description: 'Colócate sobre la barra con los pies al ancho de las caderas y agárrala algo más ancho que
  los hombros. Mantén la columna neutra, las caderas hacia atrás y el pecho elevado. Cargada: levanta
  la barra del suelo; al pasar los muslos, extiende explosivamente las caderas y las rodillas y métete
  debajo para recibirla en una sentadilla frontal profunda. Ponte de pie. Jerk: desde la posición frontal,
  flexiona las rodillas verticalmente y empuja explosivamente; métete debajo en posición dividida y bloquea
  los brazos sobre la cabeza. Recupera juntando los pies mientras mantienes la barra estable arriba.'
