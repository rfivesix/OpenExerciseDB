name: Jalón con brazos rectos en polea y cuerda
description: Usa el accesorio de cuerda en una polea alta. Sujeta los extremos de la cuerda con los brazos extendidos
  delante de ti. Lleva las manos hacia las caderas manteniendo los brazos rectos y luego vuelve a elevarlas a la
  posición inicial.
