name: Press de banca inclinado con barra
description: 'Siéntate en el banco inclinado con los pies firmes en el suelo para estabilizarte y la cabeza apoyada
  en el banco. Saca la barra del soporte con un agarre algo más ancho que los hombros y empújala hacia arriba. Bájala
  hasta que toque brevemente el pecho y vuelve a empujarla. Hazlo lentamente (tempo: 4010).'
