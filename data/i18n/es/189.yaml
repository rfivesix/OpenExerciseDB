name: Peso muerto con déficit
description: 'Preparación: Colócate sobre un disco, un disco bumper o una plataforma baja, con la barra
  cargada sobre los pies. Flexiona las piernas y agarra la barra con las manos a la anchura de los hombros
  o algo más, con agarre prono o mixto.

  Ejecución: Levanta la barra extendiendo las caderas y las rodillas hasta quedar erguido. Al final, lleva
  los hombros hacia atrás si estaban redondeados. Devuelve las pesas al suelo llevando las caderas atrás
  y flexionando las rodillas, con la espalda recta y las rodillas en la misma dirección que los pies.
  Repite.

  Comentarios: Mantén las caderas bajas, los hombros altos y los brazos y la espalda rectos durante el
  levantamiento. Las rodillas deben apuntar en la misma dirección que los pies. Mantén la barra cerca
  del cuerpo. La fuerza y resistencia del agarre pueden limitar las repeticiones con cargas pesadas. La
  tiza, las correas, el trabajo de agarre o un agarre mixto pueden ayudar. En el agarre mixto, una mano
  usa agarre prono y la otra supino. Un elevador de barra puede facilitar cargar y descargar los discos.
  El peso muerto con déficit con barra desarrolla fuerza en la parte más baja del recorrido del peso muerto.
  El músculo objetivo trabaja de forma isométrica. Los pesos muertos pesados con barra implican considerablemente
  al dorsal ancho. Consulta también «Peso muerto con déficit y barra» en «Gluteus Maximus» y el análisis del
  peso muerto.'
