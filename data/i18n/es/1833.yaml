name: Curl femoral con deslizadores
description: 'Posición inicial: Túmbate boca arriba en el suelo con los talones sobre discos deslizantes
  (o toallas en una superficie lisa). Deja los brazos a los lados para estabilizarte. Empuja con los talones
  para elevar las caderas en puente de glúteos, formando una línea recta de rodillas a hombros.


  Ejecución:

  1. Mantén las caderas elevadas y desliza lentamente los talones hacia delante hasta que las piernas
  estén casi extendidas.

  2. Haz una breve pausa sin dejar que los glúteos toquen el suelo.

  3. Flexiona con fuerza las rodillas, llevando los talones hacia los glúteos mediante la contracción
  de los isquiotibiales; eleva más las caderas al llegar los talones debajo de las rodillas.

  4. Repite con un ritmo fluido.


  Indicaciones: Mantén las caderas elevadas tanto al extender como al flexionar las piernas para mantener
  la tensión en los isquiotibiales.'
