name: Curl de isquiotibiales en el suelo con discos deslizantes
description: "Posición inicial:\nTúmbate boca arriba con los talones apoyados sobre\
  \ discos deslizantes o toallas. Eleva la cadera en posición de puente de glúteos\
  \ formando una línea recta entre rodillas y hombros.\n\nEjecución:\n1. Manteniendo\
  \ la pelvis alta, desliza los talones hacia adelante alejándolos del cuerpo hasta\
  \ extender casi por completo las piernas.\n2. Sin dejar caer los glúteos al suelo,\
  \ flexiona con fuerza las rodillas tirando de los talones hacia los glúteos mediante\
  \ la contracción de los isquiotibiales.\n3. Empuja las caderas hacia arriba a medida\
  \ que los talones regresan bajo las rodillas.\n\nConsejos:\nNo permitas que la cadera\
  \ caiga al suelo durante la fase de extensión o flexión."
