name: Remo inclinado con barra y agarre inverso
description: 'Igual que el remo habitual, pero con agarre inverso (las palmas hacia delante):

  Sujeta la barra con un agarre amplio, algo mayor que el ancho de los hombros, e inclínate hacia delante.
  El torso no queda del todo paralelo al suelo, sino ligeramente inclinado. Mantén el pecho hacia fuera
  durante todo el ejercicio.

  Tira de la barra con un movimiento rápido hacia el ombligo, sin subirla más. Vuelve despacio a la posición
  inicial. No balancees el cuerpo y mantén los brazos junto al torso.'
