name: Giro de sacacorchos sentado
description: Para este ejercicio de abdominales y oblicuos, empieza con las manos apoyadas detrás del
  cuerpo. Acerca las rodillas y llévalas hacia un lado, intentando contraer los oblicuos. Extiende las
  piernas para volver al inicio y repite hacia el lado contrario. A algunas personas principiantes puede
  costarles completar los primeros 45 segundos; puedes empezar desde ahí e ir progresando.
