name: Sacacorchos sentado (Seated Corkscrew)
description: |-
  Posición inicial:
  Siéntate en el suelo apoyando las manos detrás del cuerpo para mantener el equilibrio. Inclina ligeramente el torso hacia atrás, flexiona las rodillas y despega los pies del suelo.

  Ejecución:
  1. Flexiona y lleva las rodillas hacia el pecho mientras realizas una torsión rotando las piernas hacia un lado, contrayendo fuertemente los oblicuos.
  2. Extiende de nuevo las piernas hacia delante sin tocar el suelo.
  3. Vuelve a recoger las rodillas rotando esta vez hacia el lado contrario.
  4. Alterna de forma continua y fluida entre ambos lados.

  Consejos:
  Mantén la tensión en el core durante toda la serie. El movimiento debe ser controlado y sin balanceos bruscos.
