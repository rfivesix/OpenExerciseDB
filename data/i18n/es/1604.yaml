name: Zancada lateral deslizante
description: Ponte de pie erguido con los pies separados al ancho de las caderas, sujetando una kettlebell
  cerca del pecho en posición goblet. Coloca un pie sobre un slider, un disco deslizante o una toalla.
  Mantén el pecho erguido y el core activado. Desliza lentamente el pie hacia el lado mientras flexionas
  la rodilla contraria, bajando las caderas hacia una zancada lateral. Mantén la rodilla de la pierna
  que trabaja alineada con los dedos del pie y evita que se hunda hacia dentro. La pierna que no trabaja
  permanece estirada y se desliza suavemente por el suelo. Empuja con el talón de la pierna flexionada
  para volver a la posición inicial mientras mantienes el control de la kettlebell.
