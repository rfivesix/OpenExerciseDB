name: Estiramiento de pantorrilla con apoyo
description: 'Posición inicial: Ponte frente a una pared, a un brazo de distancia, y apoya ambas palmas
  a la altura de los hombros.


  Ejecución: Da un paso atrás con una pierna, mantenla extendida y presiona el talón contra el suelo.
  Flexiona la rodilla delantera y acerca las caderas a la pared hasta sentir un estiramiento intenso en
  la pantorrilla trasera.


  Consejos: Mantén ambos pies apuntando al frente, sin girarlos hacia fuera. Sostén 20–30 segundos y cambia
  de pierna.'
