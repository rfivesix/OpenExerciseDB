name: Cargada de potencia
description: Ponte detrás de la barra con los pies al ancho de las caderas y agárrala algo más ancho que
  los hombros con agarre de gancho. Mantén la espalda recta y el pecho elevado. Inicia el primer tirón
  extendiendo suavemente las rodillas y las caderas hasta la altura de las rodillas. Extiende explosivamente
  caderas, rodillas y tobillos mientras encoges los hombros y acercas la barra al torso. Desciende rápidamente
  a una sentadilla parcial, gira los codos hacia delante y recibe la barra sobre los deltoides frontales.
  Después, ponte erguido.
