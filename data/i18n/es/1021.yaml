name: Elevación de talones a una pierna (derecha)
description: |-
  Posición inicial:
  Colócate de pie sobre el pie derecho, apoyando el antepié en el suelo o en el borde de un escalón. Mantén la pierna izquierda levantada y apóyate ligeramente en una pared para mantener el equilibrio.

  Ejecución:
  1. Deja caer el talón derecho por debajo del nivel del escalón para estirar el gemelo.
  2. Empuja fuertemente a través del metatarso del pie derecho, elevando el talón lo más alto posible.
  3. Mantén la contracción máxima durante 1 o 2 segundos arriba.
  4. Desciende despacio y de forma controlada.
