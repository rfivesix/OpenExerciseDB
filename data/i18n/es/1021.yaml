name: Elevación de pantorrilla con pierna derecha
description: Colócate de pie en el suelo o en el borde de un escalón para ampliar el recorrido. Levanta
  un pie y eleva el talón de apoyo hasta quedar sobre la punta. Mantén esa posición durante tres segundos.
  Baja despacio el talón hasta casi tocar el suelo; no lo dejes caer de golpe.
