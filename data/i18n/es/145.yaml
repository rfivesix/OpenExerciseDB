name: Leñador en polea
description: Coloca la polea ligeramente por debajo de la altura del pecho. Mantén el cuerpo orientado
  hacia delante y las caderas estables. Sujeta el asa, extiende los brazos por completo y llévalos hacia
  delante y cruzando el cuerpo. Mantén la posición final durante un segundo y vuelve lentamente a la posición
  inicial.
