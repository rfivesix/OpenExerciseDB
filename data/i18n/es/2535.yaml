name: Extensión isométrica de piernas
description: 'Posición inicial: Siéntate en la máquina de extensión de piernas con la espalda apoyada
  firmemente en el respaldo. Alinea las rodillas con el eje de giro de la máquina. Coloca la almohadilla
  sobre la parte baja de las espinillas, justo por encima de los tobillos. Agarra las asas laterales para
  mantener las caderas en el asiento.


  Ejecución: Extiende las rodillas para elevar la palanca acolchada hasta el ángulo objetivo (normalmente
  con 45 a 60 grados de flexión, o justo antes de extenderlas por completo). Mantén la posición inmóvil
  contra la resistencia durante el tiempo indicado, contrayendo al máximo los cuádriceps. Cuando termine
  la pausa, baja el peso despacio y con control.


  Indicaciones: Respira de manera constante durante la pausa y evita hacer fuerza conteniendo la respiración
  (maniobra de Valsalva). Mantén las caderas firmes contra el asiento y las rodillas inmóviles durante
  la contracción.'
search_terms:
