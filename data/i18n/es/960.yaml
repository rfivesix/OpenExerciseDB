name: Balanceo con kettlebell
description: 'Posición inicial: ponte de pie con los pies algo más separados que los hombros y la kettlebell
  en el suelo, aproximadamente a un pie delante de ti. Lleva la cadera hacia atrás con la espalda recta
  y sujeta el asa con ambas manos. Ejecución: lleva la kettlebell hacia atrás entre las piernas, como
  un saque de fútbol americano. Impulsa las caderas hacia delante de forma explosiva, empuja con los talones
  y contrae los glúteos para balancearla hasta la altura del pecho. Vuelta: deja que la kettlebell baje
  y lleva la cadera atrás para guiarla entre las piernas, enlazando de inmediato la siguiente repetición.
  Indicaciones: es una bisagra de cadera, no una sentadilla. La fuerza procede de las caderas y los glúteos,
  no de los hombros ni de los brazos.'
