name: Empuje de cadera
description: Coloca la barra directamente sobre la parte superior de los muslos, justo debajo de la entrepierna.
  Los pies deben quedar directamente debajo de las rodillas. Empuja las caderas hacia arriba hasta formar
  una línea recta desde las rodillas hasta los hombros. Usa una almohadilla para mayor comodidad.
