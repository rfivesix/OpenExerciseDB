name: Postura de la esfinge
description: 'Posición inicial: Túmbate boca abajo en una esterilla, con las piernas separadas al ancho
  de las caderas y los empeines apoyados. Coloca los antebrazos paralelos en el suelo, los codos justo
  debajo de los hombros y las palmas hacia abajo.


  Ejecución:

  1. Presiona suavemente los antebrazos y las palmas contra el suelo para elevar el pecho y la cabeza
  en una extensión suave de espalda.

  2. Junta y baja los omóplatos, abre las clavículas y dirige la mirada suavemente al frente.

  3. Apoya ligeramente el pubis en la esterilla y activa un poco los glúteos; mantén la zona lumbar larga
  y relajada.

  4. Mantén la postura durante varias respiraciones lentas y profundas y vuelve a bajar despacio.


  Indicaciones: Busca la apertura de la columna torácica y el pecho, sin hundirte en la zona lumbar.'
