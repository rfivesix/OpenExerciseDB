name: Postura de la esfinge (Sphinx)
description: "Posición inicial:\nTúmbate boca abajo sobre una colchoneta con las piernas\
  \ extendidas al ancho de las caderas y el empeine de los pies en el suelo. Coloca\
  \ los antebrazos paralelos en el suelo con los codos directamente debajo de los\
  \ hombros y las palmas hacia abajo.\n\nEjecución:\n1. Presiona suavemente los antebrazos\
  \ contra el suelo para elevar el pecho y la cabeza en una suave extensión.\n2. Junta\
  \ los omóplatos hacia atrás y hacia abajo, abriendo el pecho y dirigiendo la mirada\
  \ al frente.\n3. Mantén la pelvis en contacto con el suelo y respira de forma profunda\
  \ y constante.\n4. Sostén la postura durante varios ciclos respiratorios antes de\
  \ descender con suavidad.\n\nConsejos:\nEnfócate en alargar la columna torácica\
  \ sin comprimir la zona lumbar."
