name: Curl de bíceps a un brazo con TRX
description: 'Paso 1: Ponte de pie cómodamente y sujeta los agarres del sistema de suspensión. Paso 2:
  Inclínate hacia atrás apoyando el peso en un brazo y mantén la columna neutra. Paso 3: Flexiona lentamente
  el brazo para tirar del peso del cuerpo hacia la posición elevada. Supina el brazo y apriétalo al acercarte
  a la posición final. Paso 4: Baja el cuerpo y repite.'
