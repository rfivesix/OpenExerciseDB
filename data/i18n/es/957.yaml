name: Elevación de Brazo y Pierna en Cuadrupedia (Bird Dog)
description: 'En este ejercicio se activan los músculos de la espalda y los músculos
  de la parte posterior de la pierna y del brazo al levantar al mismo tiempo el brazo
  y la pierna cruzados en posición de cuadrupedia. También mejora el equilibrio y
  la propiocepción. El movimiento se realiza de forma simétrica.


  Colócate en posición de cuadrupedia.2. Mete el abdomen y luego levanta tu pierna
  derecha y tu brazo izquierdo.3. Debes mantener el abdomen metido durante 8 segundos.4.
  Después de 8 segundos, baja lentamente el brazo y la pierna.5. Luego relaja los
  músculos.'
