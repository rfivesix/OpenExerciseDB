name: Extensión de brazo y pierna en cuadrupedia (bird dog)
description: 'Posición inicial: ponte a cuatro patas con las manos justo debajo de los hombros y las rodillas
  debajo de las caderas. Mantén la cabeza y la columna en posición neutra. Ejecución: extiende a la vez
  el brazo derecho hacia delante y la pierna izquierda hacia atrás hasta que ambos queden paralelos al
  suelo, contrayendo glúteos y zona lumbar. Vuelta: mantén la extensión máxima 1–2 segundos y baja lentamente
  la mano y la rodilla. Alterna los lados en cada repetición. Indicaciones: mantén el abdomen tenso y
  las caderas alineadas con el suelo; no dejes que la pelvis gire ni hiperextiendas la zona lumbar.'
