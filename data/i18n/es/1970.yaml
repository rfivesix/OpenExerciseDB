name: Sumo high pull con kettlebell
description: 'Posición inicial:

  Colócate de pie en postura sumo (pies más anchos que los hombros y puntas hacia fuera) directamente encima de la kettlebell. Flexiona las caderas y rodillas con la espalda neutra y agarra el asa con ambas manos en toma prona.


  Ejecución:

  Extiende de forma explosiva las caderas y piernas empujando el suelo con los talones. Aprovecha el impulso vertical para tirar de la kettlebell hacia la altura del pecho guiando con los codos altos y hacia fuera, manteniendo la pesa pegada al cuerpo. Baja con control por la misma trayectoria.


  Consejos:

  La aceleración procede de la extensión de cadera y los glúteos; los brazos se limitan a dirigir y completar la trayectoria del peso.'
