name: Remo con TRX
description: Pak de handgrepen van de suspension trainer met een neutrale greep vast en leun achterover
  met je armen volledig gestrekt. Houd je lichaam van hoofd tot hielen recht door je romp- en bilspieren
  aan te spannen. Trek je borst naar de handgrepen door je ellebogen naar achteren te bewegen en je schouderbladen
  naar elkaar toe te trekken. Laat jezelf gecontroleerd zakken tot je armen weer volledig gestrekt zijn.
