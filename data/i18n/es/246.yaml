name: Extensión de tríceps tumbado con barra EZ
description: 'Sujeta la barra EZ y túmbate en un banco plano de modo que aproximadamente una cuarta parte
  de la cabeza sobresalga del borde. Extiende los brazos con la barra y flexiónalos para bajarla. Justo
  antes de que toque la frente, empújala hacia arriba.

  Presta atención a los codos y los brazos: solo trabajan los tríceps; el resto de los brazos no debe
  moverse.'
