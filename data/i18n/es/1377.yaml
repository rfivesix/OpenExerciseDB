name: Giro de torso de pie
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de los hombros y las rodillas ligeramente flexionadas.
  Mantén la pelvis estable orientada al frente y cruza los brazos sobre el pecho o coloca las manos en
  las caderas.


  Ejecución:

  Gira el torso de manera lenta y controlada hacia un lado activando los oblicuos y manteniendo las caderas
  y piernas inmóviles. Haz una breve pausa en el punto de máxima rotación, vuelve al centro y gira hacia
  el lado opuesto a un ritmo fluido y constante.


  Consejos:

  La rotación debe originarse en la zona torácica y los músculos del core, sin forzar la columna lumbar
  ni mover las caderas.'
