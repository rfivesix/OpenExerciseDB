name: Dead bug
description: Túmbate boca arriba con las caderas y las rodillas flexionadas a 90 grados y los brazos extendidos
  hacia el techo. Presiona la zona lumbar contra el suelo. Baja lentamente una pierna y toca el suelo
  con el talón, manteniendo la zona lumbar apoyada. Vuelve la rodilla a la posición inicial y repite con
  el otro lado. Para aumentar la dificultad, baja a la vez el brazo y la pierna contrarios.
