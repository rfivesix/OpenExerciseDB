name: Envión olímpico (Jerk)
description: |-
  Posición inicial:
  • Sujeta la barra apoyada sobre la parte frontal de los hombros y las clavículas en posición de front rack.
  • Coloca los pies a la anchura de las caderas con el torso erguido y el core activado.

  Ejecución:
  • Realiza una flexión vertical rápida y corta de rodillas (dip) sin inclinar el torso hacia delante.
  • Extiende las piernas con máxima explosividad para transmitir impulso a la barra hacia arriba.
  • Sumérgete con rapidez debajo de la barra y recíbela con los brazos bloqueados por encima de la cabeza en posición de tijera (split).
  • Junta los pies en paralelo manteniendo la barra estabilizada sobre la cabeza antes de bajarla.
