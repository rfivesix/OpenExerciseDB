description: Apoya la barra sobre las clavículas y los deltoides delanteros en posición frontal. De pie
  con los pies al ancho de las caderas y el abdomen firme, flexiona las rodillas unos centímetros manteniendo
  el torso vertical. Impúlsate explosivamente con las piernas. Desciende rápidamente bajo la barra y recíbela
  con los brazos extendidos por encima de la cabeza, normalmente en posición dividida. Recupera la posición
  dando medio paso hacia atrás con el pie delantero y luego avanzando el trasero hasta juntar los pies,
  manteniendo la barra arriba antes de bajarla.
