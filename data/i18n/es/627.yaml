name: Peso muerto con piernas rígidas
description: 'Posición inicial: Ponte de pie con los pies a la anchura de las caderas y sujeta una barra delante
  de los muslos con agarre prono a la anchura de los hombros. Mantén las rodillas casi rectas, con una flexión mínima
  para proteger las articulaciones.

  Ejecución: Flexiona la cadera llevando los glúteos hacia atrás y mantén la espalda completamente recta y neutra.
  Baja la barra cerca de las piernas hasta sentir un estiramiento profundo en los isquiotibiales.

  Regreso: Contrae con fuerza los isquiotibiales y los glúteos para volver a estar completamente erguido.

  Indicaciones: No dejes que la zona lumbar se redondee. Mantén las rodillas casi rectas y en la misma posición
  durante todo el movimiento.'
