name: Curl de muñeca con mancuernas y agarre supino
description: 'Beginpositie:

  Siéntate en un banco y apoya los antebrazos sobre los muslos o el borde del banco, con las muñecas justo
  más allá de las rodillas. Sujeta las mancuernas con agarre supino (palmas hacia arriba).


  Uitvoering:

  1. Baja lentamente las mancuernas extendiendo las muñecas hasta donde te resulte cómodo.

  2. Flexiona las muñecas para elevar las mancuernas y contrae con fuerza los flexores de la muñeca arriba.

  3. Baja las pesas lentamente y con control.


  Tips:

  Aísla el movimiento en las muñecas. No uses el impulso de los brazos ni del cuerpo.'
