name: Muscle-up
description: 'Cuélgate de una barra de dominadas y tira del cuerpo hacia arriba de forma explosiva y arqueada.
  Cuando el pecho supere la barra, inclina el torso hacia delante sobre ella y gira las muñecas y los
  antebrazos por encima de la barra durante la transición. Empuja con las palmas y extiende los codos
  hasta quedar arriba, con los brazos extendidos y la barra a la altura de la cintura.

  Baja de forma controlada pasando por las fases de fondos y dominada hasta volver a colgarte. Los atletas
  avanzados lo hacen de forma estricta, sin impulso de piernas; quienes están desarrollando la técnica
  suelen usar un impulso moderado.'
