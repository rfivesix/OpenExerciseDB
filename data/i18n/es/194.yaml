name: Fondos
description: Los fondos son un ejercicio de fuerza para la parte superior del cuerpo. Los fondos con las
  manos a una anchura similar a la de los hombros trabajan principalmente los tríceps; los principales
  músculos sinergistas son el deltoides anterior, los músculos pectorales (porciones esternal y clavicular,
  y pectoral menor) y los romboides de la espalda, en ese orden. Una posición más amplia de los brazos
  da más énfasis a los pectorales, de forma parecida a un press de banca con agarre ancho, que prioriza
  más los pectorales y menos los tríceps.
