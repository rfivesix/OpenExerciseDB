name: Jalón al pecho con agarre supino ancho
description: 'Posición inicial:

  Siéntate en la máquina de jalón y ajusta el apoyo para sujetar los muslos. Agarra la barra con una toma
  supina amplia, desde aproximadamente la anchura de los hombros hasta algo más ancha. Mantén el pecho
  elevado y el torso ligeramente reclinado.


  Ejecución:

  1. Tira de la barra con suavidad, pasando cerca de la barbilla hasta tocar o casi tocar la parte superior
  del pecho.

  2. Lleva los codos hacia abajo y ligeramente atrás, bajando y contrayendo las escápulas.

  3. Mantén estable el torso, sin balancearte hacia atrás en exceso.

  4. Devuelve la barra lentamente a la posición alta, extendiendo los brazos y estirando los dorsales.'
