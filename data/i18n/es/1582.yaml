exercise_id: '1582'
language: es
status: ai_reviewed
name: Rotación interna tumbado de lado
description: |-
  Posición inicial:
  Túmbate de lado sobre un banco plano. Utiliza el brazo inferior (el más cercano al banco). Mantén el codo flexionado a 90 grados y apoya el brazo de forma estable sosteniendo una mancuerna ligera.

  Ejecución:
  Deja que el peso descienda de forma controlada hacia el suelo por el borde del banco, tanto como tu movilidad permita sin molestias. Desde esa posición, gira el antebrazo hacia arriba rotando internamente el hombro hacia tu abdomen y hombro contrario.

  Consejos:
  - Utiliza un peso moderado o ligero para asegurar un estímulo limpio y seguro en el manguito rotador.
  - Mantén el ángulo de 90 grados en el codo durante todo el recorrido.
