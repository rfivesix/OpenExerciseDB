name: Rotación interna tumbado de lado
description: Túmbate de lado y usa el brazo que queda junto al banco. Mantén el codo flexionado a 90 grados
  y deja que el peso baje junto al banco hasta donde te resulte cómodo. Luego eleva el peso hacia el hombro
  opuesto usando solo la rotación del hombro.
