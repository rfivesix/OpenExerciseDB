exercise_id: '1207'
language: es
status: ai_reviewed
name: Patada de escorpión
description: |-
  Posición inicial:
  • Colócate en posición de plancha alta con las manos directamente bajo los hombros y los pies a la anchura de las caderas.
  • Mantén el cuerpo alineado en una línea recta desde la cabeza hasta los talones.

  Ejecución:
  • Lleva una rodilla hacia el pecho y luego elévala flexionada hacia arriba y hacia atrás.
  • Rota la cadera haciendo pasar ese pie por encima de la pierna contraria en dirección al suelo.
  • Mantén los hombros y el pecho lo más orientados al suelo posible para disociar la cintura escapular de la pélvica.
  • Regresa de manera controlada a la posición inicial y repite con la otra pierna.
