name: Remo alto en polea alternado
description: |-
  Posición inicial:
  Coloca un agarre individual en una posición alta de la polea y da un paso atrás de aproximadamente un metro. Sujeta el asa con una mano a la altura de la cabeza con el codo ligeramente flexionado y retrasa el pie de ese mismo lado en posición escalonada.

  Ejecución:
  1. Tira del codo hacia el torso rotando ligeramente el cuerpo para activar intensamente el dorsal ancho.
  2. Contrae la musculatura de la espalda al final del movimiento durante un segundo.
  3. Regresa con control a la posición de partida, cambia de mano y de pie de apoyo, y repite con el lado opuesto.

  Consejos:
  Alternar los brazos de forma individual potencia el control del core antirrotacional y mejora el equilibrio entre ambos dorsales.
