name: Remo alto alterno en polea
description: 'Posición inicial:

  Fija un agarre individual a una polea alta. Colócate a unos tres pies de la polea, en posición escalonada,
  y sujeta el agarre con una mano a la altura de la cabeza, con el codo ligeramente flexionado.


  Ejecución:

  1. Lleva el codo hacia abajo y hacia dentro, hacia el torso, girándolo ligeramente de forma controlada.

  2. Contrae la espalda durante un segundo.

  3. Devuelve el cable con control; cambia de mano y de pierna adelantada y repite.


  Indicaciones:

  Alterna los brazos para trabajar la estabilidad del torso.'
