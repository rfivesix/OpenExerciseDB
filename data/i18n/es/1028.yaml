name: Rotación torácica en cuadrupedia izquierda
description: 'Posición inicial:

  Colócate en cuadrupedia sobre manos y rodillas. Apoya la mano derecha firmemente en el suelo debajo
  del hombro derecho. Coloca la mano izquierda detrás de la nuca con el codo abierto.


  Ejecución:

  1. Al inhalar, rota el torso hacia abajo llevando el codo izquierdo hacia la mano o muñeca derecha de
  apoyo.

  2. Al exhalar, gira y abre el pecho hacia la izquierda, apuntando con el codo izquierdo hacia el techo.

  3. Mantén la pelvis nivelada y evita mover las caderas.

  4. Realiza el movimiento de forma fluida y controlada durante las repeticiones prescritas.'
