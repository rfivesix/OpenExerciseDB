name: Remo sentado en polea (Remo Gironda)
description: 'Posición inicial:

  Siéntate en la máquina de remo en polea baja con los pies bien apoyados en los reposapiés y las rodillas
  ligeramente flexionadas. Inclínate hacia adelante con la espalda recta para coger el agarre y vuelve
  a colocar el torso erguido a 90 grados.


  Ejecución:

  1. Tira del agarre hacia la parte inferior del abdomen conduciendo los codos pegados a los costados
  hacia atrás.

  2. Junta con fuerza los omóplatos al final del tirón para contraer los dorsales y la espalda alta.

  3. Mantén el torso estable sin balancearte hacia adelante y hacia atrás.

  4. Extiende los brazos lentamente de forma controlada sintiendo el estiramiento de los dorsales antes
  de iniciar la siguiente repetición.'
