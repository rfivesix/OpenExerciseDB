name: Curl de muñeca en polea
description: "Posición inicial:\nConecta una barra recta a la polea baja. Arrodíllate\
  \ o siéntate frente a la máquina apoyando los antebrazos sobre los muslos o sobre\
  \ un banco plano, de modo que las muñecas queden libres sobre el borde. Sujeta la\
  \ barra con agarre supino (palmas hacia arriba).\n\nEjecución:\n1. Desciende la\
  \ barra permitiendo que ruede ligeramente por los dedos para obtener un estiramiento\
  \ completo de los flexores del antebrazo.\n2. Vuelve a cerrar la mano y flexiona\
  \ las muñecas con fuerza hacia arriba tanto como sea posible.\n3. Mantén la contracción\
  \ durante un segundo en la parte superior y regresa lentamente a la posición inicial.\n\
  \nConsejos:\nMantén los antebrazos totalmente fijos y apoyados para aislar el trabajo\
  \ en las muñecas."
