name: Flexión de muñeca en polea
description: Extiende el brazo hacia abajo y luego eleva ligeramente el antebrazo. Gira el antebrazo con
  la palma hacia arriba. Ajusta la altura de la polea para sujetar el agarre con la mano supinada. Flexiona
  la muñeca y la palma hacia arriba. Si lo deseas, haz una pausa arriba y vuelve despacio al inicio.
