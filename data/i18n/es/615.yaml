name: Sentadilla con barra
description: Coloca una barra en un soporte justo por debajo de la altura de los hombros. Pasa por debajo para apoyarla
  detrás del cuello, sobre la parte superior de la espalda, y sujétala con las manos más separadas que los hombros.
  Eleva el pecho y junta los omóplatos para mantener la espalda recta durante todo el movimiento. Ponte de pie para
  sacar la barra del soporte y da un paso atrás; coloca los pies algo más separados que los hombros. Lleva las caderas
  hacia atrás y mantén la espalda recta y el pecho arriba mientras bajas hasta que las caderas queden por debajo
  de las rodillas. Desde abajo, presiona los pies contra el suelo y lleva las caderas hacia delante para volver
  a estar de pie.
