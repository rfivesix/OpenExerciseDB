name: Empuje de trineo
description: 'Posición inicial:

  Carga el trineo con el peso adecuado. Colócate detrás y sujeta los postes verticales con los brazos
  extendidos o ligeramente flexionados. Inclina el torso unos 45° hacia delante.


  Ejecución:

  1. Impúlsate con la parte delantera de los pies y empuja el trineo hacia delante con zancadas firmes
  y continuas.

  2. Mantén el abdomen firme y una línea recta desde la cabeza, a lo largo de la espalda, hasta la pierna
  que impulsa.

  3. Empuja la distancia o durante el tiempo previsto con un ritmo constante e intenso.


  Indicaciones:

  El empuje de trineo desarrolla el impulso de las piernas y la condición física, con poco trabajo excéntrico.'
