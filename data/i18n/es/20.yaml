name: Press Arnold de hombros
description: 'Posición inicial:

  Siéntate erguido en un banco con respaldo. Sujeta dos mancuernas delante del pecho, a la altura de los
  hombros, con las palmas hacia el cuerpo (supinadas) y los codos debajo de las muñecas.


  Ejecución:

  1. Empuja las mancuernas por encima de la cabeza mientras giras suavemente las manos hacia fuera, de
  modo que las palmas miren hacia delante al final.

  2. Extiende los brazos sin bloquear los codos.

  3. Baja lentamente las mancuernas por el mismo recorrido y gira las palmas de nuevo hacia el pecho para
  volver a la posición inicial.


  Notas:

  Haz la rotación con suavidad durante la subida y la bajada. Mantén el tronco firme y la columna neutra
  contra el respaldo.'
