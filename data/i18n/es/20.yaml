name: Press Arnold
description: Siéntate en un banco con la espalda bien apoyada. Sostén un par de mancuernas frente a tus hombros, con las palmas
  de las manos mirando hacia tu cuerpo. A medida que empujas las mancuernas hacia arriba, rota las muñecas de forma que al
  final del movimiento tus palmas miren hacia el frente. Invierte el movimiento de forma controlada para volver a la posición
  inicial.
