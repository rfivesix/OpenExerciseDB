name: Encogimientos abdominales en polea
description: Coge el cable con las manos y sujétalo junto a las sienes. Arrodíllate, mantén el torso recto e inclínate hacia
  delante. Baja con un movimiento rápido, enrollando la espalda (los codos apuntan hacia las rodillas). Una vez abajo, vuelve
  lentamente a la posición inicial.
