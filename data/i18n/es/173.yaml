name: Encogimiento abdominal de rodillas en polea
description: Sujeta el accesorio de cuerda con ambas manos y mantenlo junto a las sienes. Arrodíllate
  mirando hacia la polea o de espaldas a ella, con el torso erguido e inclinado ligeramente hacia delante.
  Haz un crunch enrollando la columna hacia dentro y acercando los codos a las rodillas. Haz una breve
  pausa y vuelve lentamente y de forma controlada a la posición inicial.
