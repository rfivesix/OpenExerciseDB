name: Carrera en zona 2
description: Corre a un ritmo constante y conversacional, correspondiente al cardio de zona 2 (normalmente
  el 60–70 % de la frecuencia cardiaca máxima). Mantén una intensidad que te permita hablar cómodamente
  en frases completas o respirar principalmente por la nariz (prueba del habla). Mantén estable la frecuencia
  cardiaca durante la carrera para desarrollar la base aeróbica y la eficiencia metabólica.
