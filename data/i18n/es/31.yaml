name: Sujeción en cruz
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de los hombros y el tronco firme. Sujeta una mancuerna
  a cada lado del cuerpo.


  Ejecución:

  1. Eleva ambas mancuernas hacia los lados, con los brazos rectos o ligeramente flexionados, hasta que
  queden paralelos al suelo a la altura de los hombros.

  2. Mantén esta posición isométrica durante el tiempo indicado o hasta el fallo, manteniendo contraídos
  los deltoides laterales.

  3. Cuando termine el tiempo, baja las pesas despacio y de forma controlada.


  Notas:

  No encojas los hombros hacia las orejas ni arquees la zona lumbar. Respira con regularidad mientras
  mantienes la posición.'
