name: Flexiones laterales en silla romana
description: 'Posición inicial: Colócate de lado en una silla romana o en un banco de hiperextensiones a 45°, con
  la cadera apoyada en el acolchado y los pies sujetos.

  Ejecución: Baja el torso lateralmente hacia el suelo hasta que quede aproximadamente paralelo al suelo o notes
  un estiramiento en los oblicuos.

  Regreso: Contrae los oblicuos superiores para elevar el torso hasta la posición inicial alineada.

  Indicaciones: Mantén las manos cruzadas sobre el pecho o detrás de la cabeza y evita girar el torso hacia delante
  o atrás.'
