name: Postura de la rana (Frog Stand)
description: |-
  Posición inicial:
  • Ponte en cuclillas con los pies juntos y apoya las manos en el suelo a la anchura de los hombros con los dedos bien abiertos.
  • Coloca las rodillas por fuera de los codos o apoyadas sobre la parte posterior de los brazos (tríceps).

  Ejecución:
  • Traslada gradualmente el peso del cuerpo hacia delante sobre las manos.
  • Despega los pies del suelo uno a uno hasta quedar en equilibrio sobre las manos con los codos ligeramente flexionados.
  • Aprieta el abdomen, mantén la mirada ligeramente hacia delante y equilibra la postura.
  • Mantén la posición isométrica durante el tiempo establecido (p. ej., 10 a 30 segundos) y apoya suavemente los pies.
