name: Apertura con banda y rotación externa
description: 'Posición inicial: Ponte de pie con los pies al ancho de los hombros, el pecho erguido y
  los hombros atrás y abajo. Sujeta una banda ligera frente al ombligo con agarre supino. Flexiona los
  codos a 90° y mantenlos pegados a las costillas.


  Ejecución:

  1. Mantén los codos junto al cuerpo y gira los antebrazos y las manos hacia fuera, separándolos para
  estirar la banda.

  2. Junta y baja los omóplatos mientras rotas externamente los hombros.

  3. Mantén la contracción final 1–2 segundos para estimular el infraespinoso y el redondo menor.

  4. Vuelve lentamente al inicio.


  Indicaciones: No separes los codos de las costillas; el movimiento debe venir de la rotación externa
  glenohumeral.'
