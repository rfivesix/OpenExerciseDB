name: Apertura con banda y rotación externa
description: "Posición inicial:\nPonte de pie con los pies al ancho de los hombros\
  \ y el pecho erguido. Sujeta una banda elástica con ambas manos en supinación (palmas\
  \ hacia arriba) frente al ombligo. Flexiona los codos a 90 grados y pégalos firmemente\
  \ a los costados del torso.\n\nEjecución:\n1. Sin separar los codos de los costados,\
  \ rota los antebrazos hacia afuera separando las manos y estirando la banda.\n2.\
  \ Junta y desciende los omóplatos en el punto de máxima rotación externa.\n3. Mantén\
  \ la posición final durante 1 o 2 segundos apretando el manguito rotador.\n4. Regresa\
  \ lentamente con control a la posición de inicio.\n\nConsejos:\nMantén los codos\
  \ pegados a los costados para garantizar que el trabajo se concentre en los rotadores\
  \ externos."
