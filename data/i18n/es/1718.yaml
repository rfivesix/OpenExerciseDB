name: Remo unilateral alto en polea
description: 'Posición inicial:

  Coloca una polea alta con una empuñadura individual. Ponte frente a la máquina con una pierna adelantada,
  apoya la mano libre en el bastidor para estabilizarte y sujeta el agarre con el brazo extendido.


  Ejecución:

  1. Lleva el agarre en diagonal hacia la parte alta del pecho o las costillas, desplazando el codo hacia
  atrás.

  2. Aprieta el omóplato y la parte alta de la espalda al final del tirón.

  3. Extiende el brazo lentamente y con control para volver al inicio.


  Consejos:

  Mantén quieto el torso y evita girar las caderas o la columna.'
