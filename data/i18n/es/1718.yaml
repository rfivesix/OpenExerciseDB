name: Remo alto en polea alta
description: |-
  Posición inicial:
  Ajusta la polea en posición alta y coloca un agarre individual. Colócate frente a la máquina, apoya la mano libre en el soporte para mayor estabilidad y sujeta el agarre con el brazo extendido.
  
  Ejecución:
  1. Tira del cable en dirección descendente y hacia atrás, llevando el codo hacia el torso.
  2. Contrae con fuerza los romboides, el trapecio medio y el deltoides posterior al final de la tracción.
  3. Regresa lentamente con control extendiendo el brazo por completo.
  
  Consejos:
  Mantén el torso estable sin rotar la columna para ayudar en la repetición.
