name: Peso muerto sumo con kettlebell
description: Coloca los pies más separados que el ancho de los hombros y orienta las puntas hacia afuera.
  Mantén la espalda recta, los hombros hacia atrás y el pecho erguido. Las rodillas deben seguir la dirección
  de los dedos de los pies y no desplazarse hacia delante. Al subir, contrae los glúteos.
