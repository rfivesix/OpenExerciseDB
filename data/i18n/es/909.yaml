name: Curl nórdico inverso
description: Arrodíllate erguido sobre una esterilla acolchada, con los dedos de los pies hacia atrás
  y las caderas extendidas, formando una línea recta de las rodillas a la cabeza. Inclina el torso lentamente
  hacia atrás doblando solo las rodillas. Resiste la gravedad con los cuádriceps y desciende hasta donde
  te permita la fuerza sin flexionar las caderas. Contrae los cuádriceps con fuerza para volver a la posición
  erguida de rodillas.
