name: Flexiones rusas
description: 'Posición inicial: Colócate en una posición estándar de flexión sobre una colchoneta, con
  las manos algo más separadas que los hombros, los dedos hacia delante y el tronco firme y alineado.


  Ejecución: Baja el pecho hacia el suelo como en una flexión estándar. En la parte baja, desplaza el
  peso hacia atrás y apoya los codos y antebrazos en el suelo hasta quedar en plancha sobre los codos.
  Vuelve a impulsarte hacia delante sobre las manos y levanta los codos del suelo. Empuja con el pecho
  y los tríceps hasta extender los brazos arriba.


  Indicaciones: Mantén el cuerpo alineado durante el balanceo hacia atrás y hacia delante; no dejes que
  las caderas se hundan al pasar a los antebrazos.'
