name: Puente caminante (Walkout de manos)
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de las caderas. Flexiona ligeramente las rodillas e inclínate hacia adelante hasta apoyar las manos en el suelo delante de tus pies.

  Ejecución:
  1. Camina hacia adelante con las manos paso a paso, manteniendo el abdomen y los glúteos fuertemente activados.
  2. Avanza hasta alcanzar una posición de plancha extendida (las manos por delante de los hombros) sin permitir que la zona lumbar se arquee o caiga.
  3. Mantén la posición un instante con máxima tensión del core.
  4. Regresa caminando con las manos hacia atrás hasta los pies y vuelve a la posición inicial.
