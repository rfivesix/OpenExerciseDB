name: Círculos de fire hydrant
description: Colócate a cuatro apoyos con las manos bajo los hombros y las rodillas
  bajo las caderas; activa el tronco y mantén la espalda neutra. Con la rodilla de
  trabajo flexionada a 90 grados, elévala hacia un lado y dibuja un círculo amplio
  y fluido con la cadera. Haz 10 círculos hacia delante y 10 hacia atrás, y repite
  con la otra pierna. Evita girar o inclinar la pelvis.
