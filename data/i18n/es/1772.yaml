name: Crunch inverso
description: 'Túmbate boca arriba en una colchoneta, con los brazos a los lados y las palmas apoyadas
  en el suelo. Eleva las piernas con las caderas y rodillas flexionadas aproximadamente a 90 grados.


  1. Contrae el abdomen y acerca las rodillas al pecho.

  2. Arriba, enrolla la pelvis y despega unos centímetros la zona lumbar de la colchoneta.

  3. Mantén la contracción 1–2 segundos mientras exhalas.

  4. Baja la pelvis despacio y con control hasta que los muslos vuelvan a la vertical, manteniendo el
  abdomen activo.


  No des patadas ni uses impulso; inicia el movimiento enrollando la columna con el abdomen.'
