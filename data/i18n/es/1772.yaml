name: Crunch inverso
description: "Posición inicial:\nTúmbate boca arriba en una colchoneta con los brazos\
  \ extendidos a los lados y las palmas apoyadas en el suelo. Eleva las piernas flexionando\
  \ caderas y rodillas a 90 grados.\n\nEjecución:\n1. Contrae el abdomen y lleva las\
  \ rodillas en dirección al pecho.\n2. En la parte final del recorrido, despega la\
  \ pelvis y la parte baja de la espalda unos centímetros del suelo.\n3. Mantén la\
  \ contracción en el punto más alto durante 1 o 2 segundos.\n4. Desciende la pelvis\
  \ de forma lenta y controlada hacia la posición inicial sin dejar caer las piernas.\n\
  \nConsejos:\nNo des patadas ni uses el balanceo de las piernas; el movimiento debe\
  \ ser generado enteramente por la flexión del abdomen."
