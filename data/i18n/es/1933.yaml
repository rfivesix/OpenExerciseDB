name: Crunch invertido
description: 'Posición inicial:

  Túmbate boca arriba sobre una esterilla con los brazos a los lados para dar estabilidad. Eleva las piernas con las caderas y rodillas flexionadas a 90 grados.


  Ejecución:

  Contrae los abdominales para despegar la pelvis de la esterilla, llevando las rodillas hacia el pecho de manera suave y controlada. Haz una breve pausa en el punto máximo de contracción y desciende lentamente la pelvis sin que los pies toquen el suelo.


  Consejos:

  Enfócate en enrollar la pelvis con la fuerza del abdomen inferior en lugar de tomar impulso con las piernas.'
