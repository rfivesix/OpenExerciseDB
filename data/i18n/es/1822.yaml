name: Estiramiento torácico de libro abierto
description: 'Posición inicial: Túmbate de lado en una esterilla, con las caderas y las rodillas flexionadas
  a 90° y apiladas. Extiende ambos brazos frente al pecho, con las palmas juntas.


  Ejecución:

  1. Inhala y lleva el brazo de arriba hacia arriba y atrás en un arco, como al abrir un libro.

  2. Rota la columna torácica manteniendo pelvis, caderas y rodillas apiladas y estables.

  3. Deja que la cabeza y la mirada sigan suavemente la mano hacia el suelo detrás de ti.

  4. Exhala al llegar al final del recorrido y mantén 1–2 segundos el estiramiento del pecho y la parte
  alta de la espalda.

  5. Inhala y devuelve lentamente el brazo a la posición inicial, con las palmas juntas.


  Indicaciones: Limita el movimiento a la zona media y alta de la espalda (columna torácica); evita que
  la rodilla superior se deslice hacia atrás.'
