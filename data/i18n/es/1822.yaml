name: Libro abierto (Open Book)
description: "Posición inicial:\nTúmbate de lado sobre una colchoneta con las caderas\
  \ y rodillas flexionadas a 90 grados, una pierna sobre la otra para fijar la pelvis.\
  \ Extiende ambos brazos hacia adelante a la altura del pecho con las palmas juntas.\n\
  \nEjecución:\n1. Inhala y eleva el brazo superior en un arco amplio hacia arriba\
  \ y atrás, como si abrieras las páginas de un libro.\n2. Rota la columna torácica\
  \ siguiendo la mano con la mirada, manteniendo las rodillas y la pelvis totalmente\
  \ fijas y juntas.\n3. Exhala en la posición final sintiendo la apertura en el pecho\
  \ y la espalda alta durante 1 o 2 segundos.\n4. Inhala y regresa lentamente el brazo\
  \ hacia adelante hasta volver a juntar las palmas.\n\nConsejos:\nAsegúrate de que\
  \ la rotación provenga de la espalda media y alta, evitando que las rodillas se\
  \ despeguen."
