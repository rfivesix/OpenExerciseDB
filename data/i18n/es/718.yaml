name: Sentadilla isométrica en la pared
description: Ponte de pie con la espalda apoyada en la pared y los pies al ancho de los hombros, aproximadamente
  a medio metro de la pared. Deslízate hacia abajo hasta que los muslos queden paralelos al suelo y las
  caderas y las rodillas formen ángulos de 90 grados. Mantén las rodillas sobre los tobillos, tensa el
  abdomen y sostén la sentadilla isométrica durante el tiempo indicado.
