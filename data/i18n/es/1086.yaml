exercise_id: '1086'
language: es
status: ai_reviewed
name: Flexiones con agarre estrecho
description: |-
  Posición inicial:
  Colócate en posición de plancha alta con las manos juntas debajo del pecho (separación menor a la anchura de los hombros). Mantén el cuerpo en una línea recta desde la cabeza hasta los talones.

  Ejecución:
  1. Flexiona los codos manteniendo los brazos bien pegados a los costados y baja el cuerpo de forma controlada.
  2. Desciende hasta que el pecho casi toque el dorso de las manos.
  3. Empuja con fuerza a través de las palmas extendiendo los codos mediante la acción de los tríceps hasta volver arriba.
  4. Mantén el core y los glúteos firmes en todo momento.
