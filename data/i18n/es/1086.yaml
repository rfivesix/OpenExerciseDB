name: Flexiones con agarre estrecho
description: 'Posición inicial:

  Colócate en plancha alta con las manos juntas directamente debajo del pecho, más estrechas que los hombros
  y con los pulgares casi tocándose. Mantén una línea recta y firme desde la cabeza hasta los talones.


  Ejecución:

  1. Flexiona los codos de forma controlada y mantenlos pegados a las costillas.

  2. Baja hasta que el pecho casi toque el dorso de las manos.

  3. Empuja con las palmas y extiende los brazos para volver a la plancha.

  4. Mantén el abdomen firme y evita que las caderas se hundan.'
