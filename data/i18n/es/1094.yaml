name: Press de pecho sentado en máquina
description: |-
  Posición inicial:
  Ajusta la altura del asiento para que los agarres queden alineados con la parte media o inferior del pecho. Siéntate con la espalda y la cabeza bien apoyadas en el respaldo y los pies planos en el suelo.

  Ejecución:
  1. Sujeta los agarres con firmeza, retrae los omóplatos y activa el abdomen.
  2. Empuja hacia adelante con fuerza y control hasta extender casi por completo los brazos, sin bloquear los codos.
  3. Aprieta los pectorales en el punto de máxima contracción.
  4. Regresa de manera lenta y controlada sintiendo el estiramiento en el pecho antes de comenzar la siguiente repetición.
