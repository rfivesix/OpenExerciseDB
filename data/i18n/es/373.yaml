name: Prensa de piernas con postura estrecha
description: 'Siéntate en la prensa de piernas con la espalda apoyada firmemente en el respaldo. Coloca
  los pies en la plataforma con una postura estrecha, separados unos centímetros, aproximadamente al ancho
  de las caderas o menos, y con las puntas ligeramente hacia fuera o al frente.

  Suelta los seguros y baja el carro de forma controlada hasta que las rodillas estén flexionadas unos
  90 grados. Empuja con todo el pie para devolver la plataforma, sin bloquear las rodillas arriba.'
search_terms:
- Prensa de piernas con pies juntos
