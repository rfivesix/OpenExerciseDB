name: Remo unilateral perpendicular en landmine
description: 'Posición inicial:

  Coloca una barra en un soporte landmine de modo que quede perpendicular (a 90 grados) a tu cuerpo. Ponte
  junto al extremo de la barra, con una postura escalonada o atlética. Inclínate desde las caderas con
  la espalda recta y sujeta con una mano el extremo o el collar de la barra.


  Ejecución:

  Activa el core y tira de la barra hacia el costado del pecho o las costillas inferiores. Lleva el codo
  hacia atrás y arriba manteniendo el torso orientado al frente e inmóvil. Contrae los dorsales y la parte
  media de la espalda en el punto más alto; después baja la barra con control hasta extender el brazo.


  Indicaciones:

  Mantén la columna neutra y evita girar el torso. Tira con el codo, no con la mano, para implicar los
  dorsales y la parte alta de la espalda.'
