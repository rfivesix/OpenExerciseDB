exercise_id: '1580'
language: es
status: ai_reviewed
name: Remo unilateral perpendicular en landmine
description: |-
  Posición inicial:
  Coloca una barra en un accesorio de landmine de modo que quede en ángulo de 90 grados perpendicular a tu cuerpo. Colócate de pie junto al extremo donde van los discos, flexiona las caderas con la espalda recta y agarra la manga de la barra con una mano.

  Ejecución:
  Activa el abdomen y tira de la barra hacia la caja torácica o el lateral del pecho. Conduce el codo hacia atrás y arriba contrayendo la espalda. Aprieta el dorsal en el punto máximo de contracción y baja la barra de forma controlada hasta extender el brazo por completo.

  Consejos:
  - Mantén el torso firme y evita rotar la columna durante el tirón.
  - Tira guiando el movimiento desde el codo para involucrar al máximo el dorsal.
