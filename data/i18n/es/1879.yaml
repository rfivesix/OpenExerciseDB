name: Elevación en Y con mancuernas en banco inclinado
description: "Ajusta\nun banco inclinado a un ángulo de 45 grados y siéntate de cara\
  \ al banco, con el pecho\ncontra el respaldo, con una mancuerna en cada mano y las\
  \ palmas enfrentadas entre sí.\nApoya los pies firmemente en el suelo para mayor\
  \ estabilidad y deja que los brazos cuelguen de forma natural con una ligera flexión\
  \ en los codos.\nActiva el core y mantén la espalda recta durante todo el movimiento.\n\
  Eleva los brazos hacia adelante y hacia afuera formando una \"Y\", manteniendo el\
  \ movimiento controlado y los codos ligeramente flexionados.\nEleva hasta que los\
  \ brazos queden aproximadamente paralelos al suelo y a la altura de las orejas.\n\
  Haz\nuna breve pausa en la parte alta del movimiento para activar por completo\n\
  los músculos del hombro, y luego baja los brazos lentamente a la posición inicial.\n\
  Asegúrate de que\nel movimiento sea lento y controlado tanto en la subida como en\
  \ la bajada\npara maximizar la activación de los deltoides y los músculos de apoyo.\n\
  Repite el número de repeticiones deseado, manteniendo una técnica correcta en todo\
  \ momento."
