name: Elevación en Y inclinada con mancuernas
description: 'Ajusta un banco inclinado a 45° y siéntate mirando al banco, con el pecho contra el respaldo.
  Sujeta una mancuerna en cada mano con las palmas enfrentadas. Apoya firmemente los pies y deja colgar
  los brazos, con una ligera flexión de codos. Activa el core y mantén la espalda recta.


  Eleva los brazos hacia delante y hacia fuera formando una Y, con un movimiento controlado y los codos
  ligeramente flexionados, hasta que queden aproximadamente paralelos al suelo y alineados con las orejas.
  Haz una breve pausa arriba para activar los hombros y vuelve lentamente al inicio. Mantén el movimiento
  lento y controlado al subir y bajar para trabajar los deltoides y músculos de apoyo. Repite las veces
  indicadas manteniendo la técnica.'
