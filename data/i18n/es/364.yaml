name: Curl de piernas
description: El curl de piernas, también llamado curl de isquiotibiales, es un ejercicio de aislamiento
  para los isquiotibiales. Consiste en flexionar la pierna contra una resistencia, acercando la parte
  inferior de la pierna a los glúteos. Otros ejercicios para fortalecer los isquiotibiales son la elevación
  de glúteos e isquiotibiales y el peso muerto.
