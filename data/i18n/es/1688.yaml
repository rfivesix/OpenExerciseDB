description: 'Posición inicial: Ponte de pie y sujeta una barra delante de los muslos con agarre prono.
  Apoya aproximadamente el 80–90 % del peso corporal en la pierna delantera, que trabaja. Coloca el pie
  trasero un poco detrás y apoya solo los dedos en el suelo para mantener el equilibrio (posición kickstand).


  Movimiento:

  1. Mantén el pecho elevado y la columna neutra; lleva las caderas hacia atrás e inclínate desde la cintura.

  2. Baja la barra cerca de la espinilla delantera hasta sentir un estiramiento profundo en el isquiotibial
  de esa pierna.

  3. Lleva las caderas hacia delante y contrae los glúteos para volver a la posición erguida.


  Consejos: El pie trasero solo ayuda al equilibrio y debe soportar poco peso. Centra la tensión muscular
  en el isquiotibial y el glúteo de la pierna delantera.'
