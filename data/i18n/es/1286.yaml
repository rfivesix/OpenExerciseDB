name: Salto agrupado desde plancha
description: 'Comienza en posición de plancha, con las manos directamente debajo de los hombros y los
  pies separados al ancho de las caderas.

  Activa el core para mantener el cuerpo en línea recta de la cabeza a los pies.

  Desde esta posición, flexiona ligeramente las rodillas y salta con ambos pies hacia dentro, acercándolos
  lo máximo posible al core.

  En cuanto los pies toquen el suelo, empuja con fuerza para volver a saltar y regresar a la posición
  inicial de plancha.

  Continúa repitiendo este movimiento de salto, manteniendo el control y la estabilidad del core durante
  todo el ejercicio.

  Asegúrate de mantener una respiración constante mientras saltas, respirando profundamente y controlando
  la respiración.

  Mantén la mirada fija en el suelo para conservar una correcta alineación de la columna.

  Repite los saltos durante el tiempo deseado o el número de repeticiones recomendado para tu programa
  de entrenamiento.

  Para terminar el ejercicio, descansa soltando la posición de plancha y luego estira si es necesario
  para relajar los músculos.'
