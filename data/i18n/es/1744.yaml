name: Elevación lateral en maquina
description: "Técnica de Ejecución\nLa elevación lateral en máquina es un ejercicio\
  \ diseñado para trabajar específicamente el músculo deltoides lateral (hombro medio)\
  \ con un alto grado de control y seguridad.\nPasos de Ejecución:\nAjuste la máquina\
  \ a su altura y posición correcta\nSiéntese con la espalda apoyada firmemente contra\
  \ el respaldo\nAgarre los mangos laterales con un agarre cómodo\nMantenga los codos\
  \ ligeramente flexionados\nEleve los brazos lateralmente hasta la altura de los\
  \ hombros\nPause brevemente en la posición superior\nBaje los brazos de manera controlada\
  \ a la posición inicial\nBeneficios\nAislamiento preciso del deltoides lateral\n\
  Menor riesgo de lesiones en comparación con elevaciones libres\nControl del rango\
  \ de movimiento\nIdeal para principiantes y rehabilitación\nConsejos Importantes\n\
  Evite balancear o hacer movimientos de impulso\nMantenga un movimiento controlado\
  \ y constante\nNo sobrecargue el peso\nRespire de manera apropiada: exhale al levantar,\
  \ inhale al bajar"
