name: SkiErg (máquina de esquí)
description: 'Posición inicial:

  Colócate en la plataforma del ergómetro con los pies a la anchura de las caderas. Alcanza los agarres
  por encima de la cabeza y sujétalos con las palmas enfrentadas.


  Ejecución:

  1. Flexiona ligeramente las rodillas, lleva las caderas atrás e impulsa ambos brazos hacia abajo, pasando
  por delante de los muslos, con un tirón fluido y explosivo.

  2. Termina el tirón cuando las manos pasen junto a las rodillas.

  3. Lleva las caderas hacia delante para volver a ponerte erguido mientras los brazos regresan arriba.


  Indicaciones:

  El movimiento simula la técnica de doble bastón del esquí de fondo y trabaja dorsales, tríceps y abdomen.'
