name: Ergómetro de esquí (SkiErg)
description: 'Comienza de pie sobre la plataforma con los pies a la anchura de las
  caderas.

  Alcanza por encima de la cabeza para agarrar las empuñaduras con las palmas hacia
  dentro.

  Flexiona ligeramente las rodillas, luego empuja simultáneamente el trasero hacia
  atrás como si cerraras una puerta detrás de ti mientras tiras de los brazos recto
  hacia abajo más allá de las caderas hasta que las manos pasen por el lateral de
  las rodillas.

  A continuación, lleva los brazos de nuevo por encima de la cabeza mientras impulsas
  las caderas hacia delante hasta quedar de pie con los brazos completamente extendidos.

  Repite por repeticiones, por tiempo o por distancia.'
