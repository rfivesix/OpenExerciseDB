exercise_id: '1378'
language: es
status: ai_reviewed
name: Elevaciones laterales en polea (a un brazo)
description: |-
  Posición inicial:
  Colócate de lado junto a una polea baja con la polea en el ajuste inferior. Sujeta el agarre individual con la mano más alejada de la torre (el cable puede pasar por detrás o por delante del cuerpo). Agárrate al soporte con la otra mano para estabilizarte y reclínate ligeramente hacia afuera.

  Ejecución:
  Con el codo ligeramente flexionado, eleva el brazo lateralmente trazando un arco amplio hasta que la mano quede a la altura del hombro. Haz una breve pausa en la contracción del deltoides lateral y baja el agarre lentamente resistiendo la tensión constante del cable.

  Consejos:
  Evita encoger el trapecio o impulsarte con el torso. El cable mantiene la tensión muscular continua en todo el recorrido.
