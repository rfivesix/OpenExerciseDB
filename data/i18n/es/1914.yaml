name: Soporte isométrico en paralelas (Support Hold)
description: 'Posición inicial:

  Colócate entre las barras paralelas de fondos. Sujeta los agarres y empuja hacia abajo hasta que los brazos queden completamente extendidos y los pies suspendidos en el aire.


  Ejecución:

  Mantén esta posición estática con los brazos rectos. Empuja activamente los hombros hacia abajo (lejos de las orejas), saca pecho y activa fuertemente el abdomen y los glúteos para mantener el cuerpo inmóvil durante el tiempo marcado.


  Consejos:

  Evita hundirte en los hombros; conserva una firme depresión escapular durante toda la sujeción.'
