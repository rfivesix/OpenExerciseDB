name: Press alrededor con cable
description: Ajusta la polea a la altura del pecho y coloca un asa individual. Sujétala con agarre neutro
  a la altura del pecho, con el codo junto al costado, y gira unos 45 grados alejándote de la polea en
  una postura escalonada estable. Empuja el asa hacia delante y ligeramente cruzando la línea media en
  un arco que siga el ángulo natural del pectoral. Aprieta el pecho sin girar las caderas ni la zona lumbar.
  Vuelve lentamente, permitiendo un estiramiento profundo del pecho antes de la siguiente repetición.
