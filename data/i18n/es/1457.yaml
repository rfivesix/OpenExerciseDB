exercise_id: '1457'
language: es
status: ai_reviewed
name: Press de pecho unilateral en polea (Cable Press Around)
description: |-
  Posición inicial:
  • Ajusta la polea a la altura del pecho y coloca un agarre individual en D.
  • Sujeta el agarre en posición neutra pegado al costado del pecho y colócate en posición escalonada girando el torso unos 45 grados respecto a la polea.

  Ejecución:
  • Empuja el agarre hacia delante y cruzando ligeramente la línea media del cuerpo para conseguir un acortamiento completo del pectoral.
  • Aprieta el pectoral en el punto de máxima contracción durante un segundo.
  • Regresa de forma controlada sintiendo el estiramiento de las fibras pectorales antes de comenzar la siguiente repetición.
