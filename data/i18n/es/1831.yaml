name: Press declinado de pecho Hammer Strength
description: 'Posición inicial: Siéntate en una máquina Hammer Strength de press declinado, con los omóplatos
  retraídos y bajos contra el respaldo. Ajusta el asiento para que las asas queden a la altura del pecho
  inferior. Apoya los pies y sujeta las asas en pronación, algo más separadas que los hombros.


  Ejecución:

  1. Activa el core y empuja las asas hacia delante y ligeramente hacia abajo, con los codos a unos 45°.

  2. Extiende los brazos casi por completo y contrae con fuerza las fibras inferiores (esternocostales)
  del pectoral.

  3. Baja lentamente y con control los brazos de la máquina hasta notar un estiramiento cómodo en el pecho.


  Indicaciones: Mantén la cabeza, la parte alta de la espalda y las caderas contra el respaldo durante
  toda la serie.'
