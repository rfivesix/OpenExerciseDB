name: Press de pecho declinado en Hammer Strength
description: "Posición inicial:\nSiéntate en la máquina Hammer Strength de press declinado,\
  \ apoyando firmemente la espalda, los hombros y los glúteos contra el respaldo.\
  \ Ajusta el asiento para que las empuñaduras queden alineadas con la parte inferior\
  \ del pecho. Sujeta los mangos con agarre prono algo más ancho que los hombros.\n\
  \nEjecución:\n1. Activa el core y empuja a través de las palmas hacia adelante y\
  \ abajo, manteniendo los codos a 45 grados del torso.\n2. Extiende los brazos casi\
  \ por completo apretando los pectorales inferiores en la parte final.\n3. Regresa\
  \ lentamente controlando la bajada hasta sentir el estiramiento en el pecho.\n\n\
  Consejos:\nMantén la espalda pegada al respaldo en todo momento y no despegues los\
  \ hombros."
