name: Press de pecho en máquina con discos
description: 'Posición inicial: Ajusta el asiento de la máquina de press de pecho
  con discos para que las asas queden a la altura del centro del pecho. Siéntate con
  la espalda y la cabeza firmemente apoyadas en el respaldo, sujeta las asas y retrae
  y baja las escápulas.


  Ejecución: Empuja las asas hacia delante con un movimiento fluido y convergente
  hasta extender los brazos sin bloquear los codos. Contrae con fuerza los pectorales
  al final. Baja las asas lentamente y con control hasta notar un estiramiento profundo
  en el pecho y comienza la repetición siguiente sin brusquedad.


  Consejos: Mantén las escápulas contra el respaldo durante cada repetición para concentrar
  la tensión en el pecho y proteger los deltoides anteriores.'
