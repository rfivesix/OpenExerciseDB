name: Extensión de tríceps en polea con cuerda
description: '- Sujeta la cuerda en la polea alta, colócate de pie con los pies al
  ancho de los hombros y el torso ligeramente inclinado hacia adelante.

  - Mantén los codos pegados a los costados y empuja la cuerda hacia abajo extendiendo
  completamente los brazos.

  - Al final del recorrido, separa las puntas de la cuerda hacia fuera para acentuar
  la contracción de los tríceps.

  - Regresa de forma controlada a la posición inicial sin dejar que los codos se muevan.'
