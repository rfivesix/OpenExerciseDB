name: Extensión de tríceps con cuerda en polea
description: Sujeta el accesorio de cuerda de la polea y ponte de pie con los pies a la anchura de los hombros.
  Mantén la espalda recta e inclínate ligeramente hacia delante. Empuja la cuerda hacia abajo procurando que los
  codos no se muevan durante el ejercicio. Al final, gira las manos hacia fuera y vuelve a la posición inicial de
  forma controlada.
