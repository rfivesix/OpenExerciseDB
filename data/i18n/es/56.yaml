name: Estabilización abdominal
description: 'Posición inicial:

  Túmbate a lo largo sobre un rodillo de espuma colocado bajo la columna, de modo que queden apoyados
  la cabeza, la espalda y el cóccix. Flexiona las rodillas y apoya los pies en el suelo al ancho de las
  caderas.


  Ejecución:

  1. Activa los músculos profundos del tronco (transverso abdominal) acercando suavemente la zona lumbar
  al rodillo.

  2. Mantén el equilibrio y la estabilidad contrayendo el tronco. Deja las puntas de los dedos apoyadas
  suavemente en el suelo o cruza los brazos sobre el pecho para aumentar la dificultad.

  3. Mantén la posición durante el tiempo indicado y respira de forma lenta y profunda.


  Notas:

  No dejes que la zona lumbar se arquee separándose del rodillo. Mantén la pelvis neutra y estable.'
