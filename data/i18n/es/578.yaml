name: Rotación externa tumbado de lado
description: 'Con una pesa en una mano, túmbate de lado sobre el lado opuesto. Mantén las rodillas ligeramente flexionadas.
  Mantén el codo pegado al costado y el antebrazo extendido hacia delante. Sin separar el codo del cuerpo, gira
  el antebrazo 90 grados hacia arriba.

  Puede ayudar colocar una toalla bajo la axila para mantener la postura. También es buena idea apoyar la cabeza
  durante el ejercicio.'
