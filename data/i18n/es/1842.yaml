name: Almeja con banda
description: 'Posición inicial: Túmbate de lado (o colócate en plancha lateral) con las rodillas flexionadas
  y las piernas apiladas. Coloca una minibanda alrededor de los muslos, justo por encima de las rodillas.


  Ejecución: Mantén los pies juntos y eleva la rodilla superior contra la resistencia de la banda, como
  una concha que se abre. Vuelve lentamente al inicio.


  Consejos: Mantén la pelvis estable y alineada; evita que las caderas rueden hacia atrás al elevar la
  rodilla.'
