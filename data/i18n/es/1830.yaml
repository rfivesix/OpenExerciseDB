name: Zancada hacia atrás con barra
description: "Posición inicial:\nApoya una barra sobre la parte alta de la espalda.\
  \ Ponte de pie erguido con los pies al ancho de las caderas y el core activado.\n\
  \nEjecución:\n1. Da un paso amplio y controlado hacia atrás con una pierna manteniendo\
  \ el torso recto.\n2. Desciende la cadera hasta que el muslo delantero quede paralelo\
  \ al suelo y la rodilla trasera roce casi el suelo.\n3. Empuja con fuerza a través\
  \ del talón de la pierna DELANTERA para regresar a la posición inicial.\n4. Alterna\
  \ de pierna o completa todas las repeticiones por lado.\n\nConsejos:\nEl empuje\
  \ debe provenir del talón delantero y no de un rebote con el pie trasero."
