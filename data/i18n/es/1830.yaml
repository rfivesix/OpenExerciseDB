name: Zancada inversa con barra
description: 'Posición inicial: Apoya una barra sobre el trapecio superior. Ponte erguido con los pies
  al ancho de las caderas, el pecho abierto y el core firme.


  Ejecución:

  1. Da un paso deliberado y controlado hacia atrás con una pierna, manteniendo las caderas alineadas.

  2. Baja las caderas verticalmente hasta que el muslo delantero quede paralelo al suelo y la rodilla
  trasera casi toque la esterilla (ambas rodillas aproximadamente a 90°).

  3. Empuja con firmeza desde el talón y el mediopié de la pierna delantera para volver al inicio.

  4. Repite con la otra pierna alternando los lados o completa todas las repeticiones de un lado antes
  de cambiar.


  Indicaciones: Empuja desde el talón delantero en lugar de impulsarte con el pie trasero, para mantener
  la tensión en el glúteo y el cuádriceps delanteros.'
