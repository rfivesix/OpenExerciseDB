name: Abdominales laterales de pie
description: De pie, con los pies al ancho de los hombros y las manos detrás de la cabeza o una mancuerna
  en una mano, inclina el torso hacia un lado y contrae los oblicuos mientras acercas el codo a la cadera
  (o haces el gesto hacia la mancuerna). Vuelve a la posición inicial y alterna los lados, o completa
  las repeticiones de un lado antes de cambiar.
