name: Crunch lateral de pie
description: |-
  Los crunches laterales de pie son un ejercicio dinámico que trabaja los oblicuos mientras mejora el equilibrio y la estabilidad. Párate derecho con los pies a la altura de los hombros y las manos detrás de la cabeza o sosteniendo una mancuerna en una mano. Inclina el torso hacia un lado, contrayendo los oblicuos, mientras llevas el codo hacia la cadera (o realizas el crunch hacia el peso si usas mancuerna). Regresa a la posición inicial y alterna lados o realiza todas las repeticiones en un lado antes de cambiar.
