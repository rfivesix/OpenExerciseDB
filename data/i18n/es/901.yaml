exercise_id: '901'
language: es
status: ai_authored
name: Hip Thrust con Barra
description: '- Siéntate en el suelo con la parte superior de la espalda apoyada en
  un banco y una barra acolchada sobre la cadera.

  - Apoya los pies firmes en el suelo al ancho de las caderas, de modo que las espinillas
  queden verticales en la parte alta.

  - Empuja con los talones y contrae los glúteos fuertemente para elevar la cadera
  hasta alinear muslos y torso.

  - Mantén la contracción un segundo en la posición superior y desciende de forma
  controlada.'
