name: Estiramiento lateral
description: 'Posición inicial: Ponte de pie con los pies al ancho de las caderas o los hombros. Activa
  ligeramente el core.


  Ejecución: Eleva un brazo por encima de la cabeza e inclina lentamente el torso hacia el lado contrario,
  dejando que la otra mano baje por el muslo. Nota el estiramiento en las costillas, oblicuos y dorsal
  ancho.


  Consejos: Mantén las caderas alineadas y evita girar el torso hacia delante o atrás. Mantén 20–30 segundos
  y cambia de lado.'
