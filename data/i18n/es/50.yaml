name: Extensión de triceps
description: Coloque la barra sobre la cabeza con un agarre en pronación estrecho. Baje el antebrazo detrás de la parte superior
  del brazo con los codos sobre la cabeza. Extienda el antebrazo por encima de la cabeza. Baja y repite.
