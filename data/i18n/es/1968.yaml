name: Press de hombro con mancuerna a un brazo
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de los hombros y el abdomen firme (o bien siéntate en un banco). Sostén una mancuerna a la altura del hombro con el codo debajo de la muñeca. Coloca la mano libre en la cadera para mantener la estabilidad.


  Ejecución:

  Empuja la mancuerna verticalmente hacia arriba en un movimiento controlado hasta extender el brazo casi por completo sin bloquear el codo. Contrae el core para que el torso no se incline hacia el lado con peso. Baja despacio hasta la altura del hombro y completa la serie antes de cambiar de brazo.


  Consejos:

  Excelente para corregir desequilibrios de fuerza entre hombros y activar los músculos estabilizadores del tronco.'
