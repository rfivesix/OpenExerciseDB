name: Extensión unilateral de tríceps en polea alta
description: |-
  Posición inicial:
  Colócate de espaldas a la polea alta. Sujeta la empuñadura individual por encima de la cabeza con una mano, manteniendo el codo flexionado y orientado hacia delante.
  
  Ejecución:
  1. Manteniendo el brazo inmóvil, extiende el codo empujando el cable hacia delante y abajo hasta extender casi por completo el brazo.
  2. Aprieta el tríceps con fuerza en el punto de máxima contracción.
  3. Regresa lentamente a la posición inicial sintiendo el estiramiento del tríceps.
  
  Consejos:
  Mantén el core firme y el torso estable para evitar balanceos.
search_terms:
