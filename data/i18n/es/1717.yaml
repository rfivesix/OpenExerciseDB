name: Extensión de tríceps por encima de la cabeza a un brazo en polea
search_terms:
- "Extensión de cuello"
description: 'Posición inicial:

  Colócate de espaldas a una polea alta. Sujeta por encima de la cabeza una empuñadura individual o una
  cuerda con una mano; flexiona el codo y oriéntalo hacia delante, junto a la cabeza.


  Ejecución:

  1. Mantén inmóvil el brazo y extiende el codo para empujar el cable hacia delante y ligeramente hacia
  abajo, hasta estirar el brazo.

  2. Contrae con firmeza el tríceps al final del movimiento.

  3. Flexiona lentamente el codo para volver, con control, a la posición inicial estirada.


  Consejos:

  Mantén el abdomen activo y la columna neutra. El ángulo de la polea por encima de la cabeza estira la
  cabeza larga del tríceps.'
