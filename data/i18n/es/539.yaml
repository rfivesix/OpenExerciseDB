name: Press inclinado en máquina Smith
description: 'Posición inicial: Coloca un banco inclinado a 30–45 grados dentro de la máquina Smith. Siéntate con
  la espalda apoyada en el respaldo y los pies planos en el suelo. Sujeta la barra con un agarre algo más ancho
  que los hombros y libera los seguros.

  Ejecución: Baja la barra suavemente hasta que toque la parte superior del pecho.

  Regreso: Empuja la barra hacia arriba usando los pectorales superiores hasta extender los brazos, sin bloquear
  los codos.'
search_terms:
