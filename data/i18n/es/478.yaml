description: |-
  Lleva las mancuernas a la altura de los hombros con las palmas orientadas hacia dentro o ligeramente hacia delante. Inhala y activa el abdomen. Realiza una ligera flexión de rodillas y caderas (dip) y extiende las piernas de forma explosiva para aprovechar el impulso y empujar las mancuernas por encima de la cabeza hasta la extensión completa de los brazos. Baja las mancuernas de manera controlada hasta los hombros y repite.
