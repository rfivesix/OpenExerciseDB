name: Push press con mancuernas
description: Lleva dos mancuernas hasta la altura de los hombros, con las palmas enfrentadas (agarre neutro)
  o ligeramente hacia delante. Toma aire y afianza el tronco. Flexiona ligeramente las rodillas y las
  caderas; después, extiende las piernas de forma explosiva y empuja con los talones para impulsar las
  mancuernas por encima de la cabeza hasta extender los brazos. Baja las pesas de forma controlada hasta
  los hombros y repite.
