name: Pájaro para deltoides posterior en pec deck
description: 'Siéntate mirando al respaldo de la máquina pec deck. Ajusta el asiento para que las empuñaduras
  queden a la altura de los hombros. Apoya el pecho contra el respaldo, planta los pies y sujeta las empuñaduras
  con agarre neutro o prono, con los codos ligeramente flexionados.


  1. Lleva los codos hacia atrás y hacia fuera en un arco amplio, contrayendo los deltoides posteriores.

  2. Haz una pausa de un segundo cuando los brazos queden alineados con el torso.

  3. Resiste el peso al devolver lentamente las empuñaduras al inicio, sin dejar reposar la pila.


  Concéntrate en la parte posterior de los hombros; evita encoger los trapecios o depender solo de juntar
  mucho los omóplatos.'
