name: Pájaro en máquina pec deck
description: "Posición inicial:\nSiéntate de cara al respaldo de la máquina pec deck.\
  \ Ajusta el asiento de modo que los manillares queden a la altura de los hombros.\
  \ Apoya el pecho contra el cojín y sujeta las agarraderas con los codos ligeramente\
  \ flexionados.\n\nEjecución:\n1. Abre los brazos hacia atrás y hacia afuera en un\
  \ arco horizontal contrayendo los deltoides posteriores.\n2. Mantén la contracción\
  \ durante un segundo en el punto máximo cuando los brazos estén alineados con el\
  \ torso.\n3. Regresa lentamente controlando la carga hasta la posición inicial sin\
  \ dejar caer los pesos.\n\nConsejos:\nMantén los hombros descendidos y enfoca el\
  \ esfuerzo en la parte posterior del hombro."
