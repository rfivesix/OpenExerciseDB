name: Rodillas altas
description: Ponte de pie con los pies separados al ancho de las caderas y los brazos relajados. Corre
  en el sitio elevando una rodilla cada vez hasta que el muslo quede paralelo al suelo; alterna rápidamente
  las piernas y acompaña el movimiento con los brazos. Apoya con ligereza la parte delantera de los pies,
  mantén el torso erguido y conserva un ritmo rápido y regular.
