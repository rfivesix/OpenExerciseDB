name: Rotación torácica en cuadrupedia hacia la derecha
description: 'Posición inicial:

  Colócate en cuadrupedia con las rodillas debajo de las caderas. Apoya firmemente la mano izquierda en
  el suelo bajo el hombro izquierdo y coloca la mano derecha ligeramente detrás de la cabeza, con el codo
  abierto.


  Ejecución:

  1. Al inhalar, rota la columna torácica hacia abajo y lleva el codo derecho hacia el brazo o la muñeca
  izquierda de apoyo.

  2. Al exhalar, rota el pecho y la parte superior de la espalda hacia arriba y a la derecha, apuntando
  con el codo al techo.

  3. Mantén las caderas y la pelvis niveladas y estables, sin desplazarlas hacia un lado.

  4. Repite con un ritmo controlado.'
