exercise_id: '1029'
language: es
status: ai_reviewed
name: Rotación torácica en cuadrupedia derecha
description: |-
  Posición inicial:
  Colócate a cuatro patas sobre manos y rodillas. Apoya la mano izquierda firmemente en el suelo debajo del hombro izquierdo. Coloca la mano derecha detrás de la cabeza con el codo apuntando al costado.

  Ejecución:
  1. Al inhalar, rota el tronco hacia adentro llevando el codo derecho hacia el brazo de apoyo izquierdo.
  2. Al exhalar, gira y abre el pecho hacia la derecha, dirigiendo el codo derecho hacia el techo.
  3. Mantén las caderas estables y cuadradas.
  4. Repite de forma controlada y continua.
