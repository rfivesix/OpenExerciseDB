name: Fondos entre dos bancos
description: Coloca dos bancos lo bastante separados para poder sujetarte a uno con las manos y alcanzar
  el otro con los pies. Mantén las piernas completamente extendidas durante el ejercicio. Con los codos
  orientados hacia atrás, flexiónalos todo lo que puedas. Empújate hacia arriba sin extender del todo
  los brazos.
