name: Buenos días sentado en posición pancake
description: 'Posición inicial: Siéntate erguido en el suelo con las piernas extendidas y abiertas en
  posición pancake, las rodillas rectas y los dedos de los pies hacia arriba. Coloca las manos ligeramente
  detrás de la cabeza.


  Ejecución: Mantén la espalda plana y el pecho abierto; inclínate hacia delante desde las caderas hasta
  sentir un estiramiento intenso en la cara interna de los muslos y los isquiotibiales.


  Consejos: Contrae glúteos e isquiotibiales para volver suavemente a la posición erguida. Evita encorvar
  la parte alta de la espalda.'
