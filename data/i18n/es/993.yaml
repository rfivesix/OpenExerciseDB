name: Saltar a la cuerda (saltos básicos)
description: Ponte de pie con los pies juntos y sujeta un mango de la cuerda en cada mano, con la cuerda
  detrás de los talones. Mantén los codos cerca de las costillas. Gira la cuerda con movimientos pequeños
  y controlados de las muñecas y salta unos 2,5–5 cm cuando pase bajo tus pies. Aterriza suavemente sobre
  la parte delantera de los pies. Mantén las rodillas ligeramente flexionadas y un ritmo relajado; impulsa
  la cuerda con las muñecas, no con los brazos.
