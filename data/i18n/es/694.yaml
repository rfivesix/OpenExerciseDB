name: Remo al mentón con mancuernas
description: Ponte de pie con una mancuerna delante de cada muslo y las palmas hacia el cuerpo. Lleva
  las mancuernas verticalmente junto al torso, guiando el movimiento con los codos y manteniendo las pesas
  cerca del cuerpo. Sube hasta la mitad del pecho, con los codos elevados, y bájalas lentamente con control.
