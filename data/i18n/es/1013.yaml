name: Estiramiento del elevador de la escápula izquierdo
description: |-
  Posición inicial:
  Siéntate o ponte de pie con la espalda recta. Gira la cabeza unos 45 grados hacia la izquierda. Coloca la mano derecha detrás de la espalda o siéntate sobre ella para fijar el hombro derecho hacia abajo. Coloca la mano izquierda en la parte posterior de la cabeza.

  Ejecución:
  1. Inclina suavemente el mentón en diagonal hacia abajo, en dirección a tu axila izquierda, hasta sentir el estiramiento en la parte posterior del cuello y hacia el omóplato derecho.
  2. Aplica una presión muy suave con la mano izquierda para guiar el estiramiento sin forzar.
  3. Mantén la posición de 20 a 30 segundos respirando con tranquilidad y regresa despacio al centro.
