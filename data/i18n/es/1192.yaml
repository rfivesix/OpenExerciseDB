name: Curl alterno de bíceps con mancuernas
description: 'Posición inicial:

  Ponte erguido con los pies a la anchura de las caderas. Sujeta una mancuerna en cada mano a los lados,
  con los brazos extendidos y las palmas hacia dentro. Mantén el pecho elevado, los hombros atrás y los
  codos cerca de las costillas.


  Ejecución:

  1. Flexiona un brazo y gira el antebrazo para que la palma mire hacia el hombro arriba.

  2. Contrae el bíceps durante una breve pausa.

  3. Baja la mancuerna con control mientras empiezas el curl con el brazo contrario.

  4. Mantén el torso inmóvil, sin balancearte ni usar impulso.'
