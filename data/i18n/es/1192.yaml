name: Curls de bíceps alternos con mancuernas
description: |-
  Posición inicial:
  • Ponte de pie con los pies separados a la anchura de las caderas, sosteniendo una mancuerna en cada mano a los costados, con las palmas mirando hacia adentro.
  • Mantén el pecho erguido, los hombros hacia atrás y los codos fijos a los lados del torso.

  Ejecución:
  • Flexiona un brazo elevando la mancuerna mientras rotas (supinas) el antebrazo, de modo que la palma mire hacia tu hombro en la parte alta.
  • Aprieta con fuerza el bíceps en el punto máximo durante un instante.
  • Desciende la mancuerna lentamente bajo control mientras comienzas la flexión con el otro brazo.
  • Evita cualquier balanceo del torso para asegurar un aislamiento estricto.
