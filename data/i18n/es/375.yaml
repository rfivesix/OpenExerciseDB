name: Prensa de piernas en máquina Hackenschmidt
description: Siéntate en la máquina Hackenschmidt con los hombros apoyados en las almohadillas y los pies
  aproximadamente al ancho de los hombros. Baja en una sentadilla y vuelve a empujar sin bloquear completamente
  las rodillas.
