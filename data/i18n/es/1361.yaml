name: Sentadilla frontal con dos kettlebells
description: 'Beginpositie:

  Lleva dos kettlebells mediante un clean hasta la posición de rack a la altura del pecho: codos cerca
  de las costillas, muñecas neutras y las pesas apoyadas en el triángulo formado por los antebrazos y
  los bíceps. Separa los pies a la anchura de los hombros.


  Beweging:

  Inhala y contrae el core. Lleva las caderas atrás y flexiona las rodillas para bajar en una sentadilla
  profunda, manteniendo el torso lo más erguido posible. Empuja con la zona media de los pies y los talones
  para volver a ponerte completamente de pie.


  Opmerkingen:

  Mantén el pecho erguido y los codos altos para evitar que el peso encorve la parte superior de la espalda.'
