name: Puente de glúteo a una pierna
description: 'Túmbate boca arriba con las rodillas flexionadas y los pies apoyados, separados al ancho
  de las caderas. Levanta una pierna, extendida o acercando la rodilla al pecho, y deja los brazos a los
  lados para estabilizarte.


  1. Empuja con el talón de la pierna de apoyo y eleva las caderas hasta alinear muslos, caderas y torso.

  2. Contrae el glúteo arriba y mantén 1–2 segundos.

  3. Baja despacio sin apoyar completamente el peso y comienza la siguiente repetición.


  Mantén la pelvis nivelada; evita que el lado de la pierna levantada caiga o gire.'
