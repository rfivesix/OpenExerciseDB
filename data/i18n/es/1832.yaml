name: Sostén de apoyo en anillas
description: 'Posición inicial: Ponte entre dos anillas colgantes. Agárralas con agarre neutro y salta
  o impúlsate hasta quedar arriba, con los brazos completamente extendidos.


  Ejecución:

  1. Gira activamente las anillas hacia fuera (RTO), con las palmas al frente y los pulgares alejados
  del cuerpo, para evitar que los antebrazos descansen en las correas.

  2. Baja los hombros alejándolos de las orejas y bloquea los codos.

  3. Mantén una posición de cuerpo hueco: activa los abdominales, contrae los glúteos y junta las piernas
  extendidas con las puntas de los pies estiradas.

  4. Mantén la contracción isométrica el tiempo indicado y respira con regularidad.


  Indicaciones: Girar las anillas hacia fuera evita apoyarse en las correas y maximiza la estabilización
  del pecho, bíceps y deltoides anterior.'
