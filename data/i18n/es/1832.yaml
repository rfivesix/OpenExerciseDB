name: Mantenimiento en apoyo en anillas (Ring Support Hold)
description: "Posición inicial:\nColócate entre un par de anillas de gimnasia suspendidas.\
  \ Sujeta las anillas con agarre neutro y elévate con un salto o empuje a la posición\
  \ de apoyo con brazos completamente extendidos.\n\nEjecución:\n1. Gira activamente\
  \ las anillas hacia afuera (RTO), de modo que las palmas miren hacia adelante y\
  \ los pulgares hacia afuera.\n2. Empuja los hombros hacia abajo alejándolos de las\
  \ orejas y bloquea los codos rectos.\n3. Adopta una posición de cuerpo hueco (hollow\
  \ body) apretando abdomen y glúteos con las piernas juntas.\n4. Sostén esta posición\
  \ isométrica durante el tiempo prescrito con respiración constante.\n\nConsejos:\n\
  Girar las anillas hacia afuera maximiza la estabilidad articular de los hombros\
  \ y evita apoyarse en las correas."
