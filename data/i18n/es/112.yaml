name: Flexiones desde plancha sobre antebrazos
description: 'Neem op de vloer een plankpositie aan. Steun op je tenen en onderarmen en houd je romp recht.
  Plaats je onderarmen op schouderbreedte. Dit is de beginpositie.

  Duw je handpalmen stevig in de vloer en strek je ellebogen om je lichaam van de vloer te tillen. Houd
  je romp tijdens de beweging stevig.

  Laat je onderarmen langzaam weer naar de vloer zakken door je ellebogen te buigen.

  Herhaal indien nodig.'
