name: Encogimiento hacia dentro en poleas
description: 'Posición inicial:

  Fija dos agarres individuales en las poleas bajas de una estación doble. Colócate entre las torres,
  con los pies a la anchura de los hombros, y sujeta los agarres con los brazos rectos a los lados.


  Ejecución:

  1. Sin doblar los brazos, eleva los hombros y llévalos ligeramente hacia dentro, en dirección a las
  orejas.

  2. Mantén la contracción de la parte superior del trapecio durante un segundo.

  3. Baja los hombros despacio hasta estirarlos por completo.


  Indicaciones:

  Mantén los codos extendidos durante el movimiento.'
