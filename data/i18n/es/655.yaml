name: Patada de tríceps con mancuernas
description: 'Empieza con una mancuerna en cada mano y las palmas hacia el torso. Mantén la espalda recta, las rodillas
  ligeramente flexionadas e inclínate hacia delante desde la cintura. El torso debe quedar casi paralelo al suelo.
  Mantén la cabeza elevada. Coloca la parte superior de los brazos junto al torso y paralela al suelo; los antebrazos
  apuntan hacia abajo mientras sostienes las pesas, formando un ángulo de 90 grados con los brazos. Esta es la posición
  inicial.

  Manteniendo quieta la parte superior de los brazos, exhala y usa los tríceps para elevar las pesas hasta extender
  los brazos. Concéntrate en mover los antebrazos.

  Tras una breve pausa en la contracción máxima, inspira y baja lentamente las mancuernas a la posición inicial.

  Repite el movimiento durante el número indicado de repeticiones.


  Variaciones: También puedes hacer el ejercicio con un brazo cada vez, de forma similar al remo con un brazo. Si
  prefieres esa variante, puedes usar un asa de polea baja en lugar de una mancuerna para lograr una mayor contracción
  máxima. En ese caso, las palmas deben mirar hacia arriba (agarre supino), en lugar de hacia el torso (agarre neutro).'
