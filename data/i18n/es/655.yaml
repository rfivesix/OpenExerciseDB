exercise_id: '655'
language: es
status: ai_reviewed
name: Patada de tríceps con mancuernas
description: '- Sujeta una mancuerna en cada mano con agarre neutro, inclina el torso
  hacia adelante manteniendo la espalda recta y las rodillas ligeramente flexionadas.

  - Eleva los codos hacia atrás pegados al cuerpo de modo que los brazos queden paralelos
  al suelo y los antebrazos apunten hacia abajo a 90 grados.

  - Manteniendo la parte superior de los brazos inmóvil, extiende los codos hacia
  atrás hasta contraer completamente los tríceps.

  - Haz una breve pausa en el punto de máxima contracción y desciende lentamente las
  mancuernas hasta la posición inicial.'
