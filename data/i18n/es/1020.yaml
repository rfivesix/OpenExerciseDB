name: Pistol squat pierna derecha
description: |-
  Posición inicial:
  Ponte de pie sobre tu pierna derecha, manteniendo la pierna izquierda estirada hacia adelante en el aire. Extiende los brazos al frente para mantener el equilibrio.

  Ejecución:
  1. Flexiona lentamente la rodilla y cadera derechas, bajando en una sentadilla profunda sobre una sola pierna.
  2. Mantén el pecho erguido, la espalda recta y la pierna izquierda elevada sin que toque el suelo.
  3. Desciende de forma controlada hasta la máxima profundidad que permita tu movilidad.
  4. Empuja fuertemente con el talón derecho para extender la pierna y regresar a la posición erguida.
