name: Jumping Jacks
description: 'Los saltos de tijera son un ejercicio pliométrico. Los pliométricos son movimientos aeróbicos explosivos que
  aumentan la velocidad, la rapidez y la potencia y trabajan todo el cuerpo.

  El salto de tijera se enfoca en el brazo, el hombro, los músculos abdominales, los músculos de la cadera y los flexores
  de la cadera y también trabaja en los muslos, los tendones de la rodilla y los cuádriceps.

  Los saltos son beneficiosos para la salud porque combinan el acondicionamiento cardiovascular con el trabajo de fuerza.

  Dado que los saltos elevan el ritmo cardíaco, también pueden mejorar la condición cardiovascular.'
