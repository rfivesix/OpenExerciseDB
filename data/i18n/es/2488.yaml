name: Inclinación pélvica posterior
description: 'Posición inicial:

  Túmbate boca arriba con las rodillas flexionadas y los pies apoyados en el suelo. Deja los brazos relajados
  a los lados.


  Ejecución:

  Contrae el abdomen e inclina la pelvis para presionar la zona lumbar contra el suelo. Mantén brevemente
  la posición y vuelve de forma controlada a una posición neutra.


  Consejos:

  Mueve la pelvis con control sin levantar los pies ni los hombros del suelo.'
