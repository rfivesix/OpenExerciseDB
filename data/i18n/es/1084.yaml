name: Press de suelo con mancuernas
description: |-
  Coge tus mancuernas y túmbate boca arriba con las rodillas flexionadas y los pies apoyados en el suelo (usa un banco si tienes uno). Empuja los pesos hacia arriba, extendiendo por completo los codos (A). Bájalos lentamente hasta que los brazos superiores descansen en el suelo (B) cerca del cuerpo. Haz una pausa aquí antes de empujar de forma explosiva hacia arriba. Aprieta el pecho con fuerza y repite.
