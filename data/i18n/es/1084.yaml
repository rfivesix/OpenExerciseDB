name: Press de suelo con mancuernas (Floor Press)
description: 'Posición inicial:

  Túmbate boca arriba en el suelo con las rodillas flexionadas y los pies apoyados. Sostén un par de mancuernas
  sobre el pecho con los codos apoyados en el suelo formando un ángulo aproximado de 45 grados con el
  torso.


  Ejecución:

  1. Empuja las mancuernas hacia arriba con potencia hasta extender casi por completo los brazos.

  2. Contrae fuertemente los pectorales en la parte superior del movimiento.

  3. Desciende las mancuernas lentamente hasta que la parte posterior de los brazos toque suavemente el
  suelo.

  4. Haz una pausa breve en el suelo para evitar el rebote y vuelve a presionar hacia arriba.'
