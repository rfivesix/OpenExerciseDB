name: Sentadilla a caja baja con postura amplia
description: Saca la barra del soporte y adopta una postura amplia, con los pies más separados que las
  caderas. Lleva las caderas hacia atrás y siéntate en una caja que te permita bajar por debajo de la
  paralela. Siéntate por completo, sin hacer un rebote. Después, ponte de pie de forma explosiva. Mantén
  firme la parte superior de la espalda y el torso durante todo el movimiento.
