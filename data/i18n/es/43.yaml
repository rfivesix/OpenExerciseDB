name: Sentadilla hack con barra
description: 'Posición inicial:

  Coloca una barra en el suelo justo detrás de los talones. Ponte de pie con los pies separados al ancho
  de las caderas o los hombros. Baja en sentadilla con el pecho elevado y la espalda recta; sujeta la
  barra detrás de las piernas con agarre prono (las palmas hacia atrás).


  Ejecución:

  1. Empuja con los talones y los pies para extender las rodillas y las caderas, levantando la barra por
  detrás de las piernas hasta quedar completamente erguido.

  2. Contrae los cuádriceps y los glúteos arriba.

  3. Baja la barra de forma controlada por el mismo recorrido hasta que los discos toquen el suelo.


  Notas:

  Mantén el torso lo más erguido posible durante el movimiento para enfatizar los cuádriceps.'
