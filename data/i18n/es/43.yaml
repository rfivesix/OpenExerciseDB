name: Sentadilla Hack con Barra
description: Para realizarla, coloca una barra en el suelo justo detrás de tus talones. Párate con los pies relativamente
  juntos (al ancho de las caderas o menos) y, manteniendo el pecho erguido y la espalda recta, agáchate para agarrar la barra.
  Desde esa posición, ponte de pie extendiendo las rodillas y la cadera, deslizando la barra por la parte posterior de tus
  piernas. Baja de forma controlada para completar la repetición.
