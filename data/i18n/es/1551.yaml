name: Flexiones de brazos (Push-Up)
description: 'Posición inicial:

  Comienza en posición de plancha con las manos colocadas ligeramente más anchas que
  los hombros, los pies juntos y el cuerpo formando una línea recta desde la cabeza
  hasta los talones.


  Instrucciones:

  1. Contrae el core y los glúteos para mantener la columna alineada en posición neutra.

  2. Baja el cuerpo flexionando los codos a unos 45 grados con respecto al torso,
  evitando que se abran en exceso.

  3. Desciende hasta que el pecho casi roce el suelo.

  4. Empuja fuertemente a través de las palmas para volver a la posición inicial con
  los brazos extendidos.'
