name: Sentadilla completa con barra
description: 'Saca la barra del rack apoyada sobre los trapecios superiores (posición alta). Retrocede
  dos pasos y coloca los pies al ancho de los hombros o algo más, con las puntas giradas 15–30 grados
  hacia fuera. Inhala profundamente hacia el abdomen para estabilizar el tronco y mantén el pecho erguido.


  1. Flexiona caderas y rodillas a la vez y dirige las rodillas hacia la línea de los dedos.

  2. Baja con fluidez por debajo del paralelo, manteniendo el torso erguido y los talones apoyados.

  3. Haz una pausa breve sin rebotar y empuja con toda la planta del pie para volver a estar de pie.

  4. Exhala arriba y vuelve a preparar la tensión antes de la siguiente repetición.


  La fuente indica que la profundidad completa aumenta el trabajo de cuádriceps, aductores y glúteo mayor;
  baja solo hasta donde mantengas la columna neutra, sin bascular excesivamente la pelvis.'
