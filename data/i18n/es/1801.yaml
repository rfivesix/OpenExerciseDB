name: Sentadilla profunda con barra
description: "Posición inicial:\nSaca la barra del rack apoyándola sobre la parte\
  \ superior del trapecio. Da dos pasos atrás y coloca los pies al ancho de los hombros\
  \ o ligeramente más amplios, con las puntas dirigidas hacia afuera entre 15 y 30\
  \ grados. Inhala profundamente activando la presión intraabdominal y manteniendo\
  \ el pecho erguido.\n\nEjecución:\n1. Flexiona simultáneamente caderas y rodillas,\
  \ dirigiendo las rodillas en la misma línea que las puntas de los pies.\n2. Desciende\
  \ bajo control total pasando la línea paralela hasta alcanzar la profundidad completa\
  \ de la sentadilla.\n3. Empuja con fuerza a través de toda la planta del pie y los\
  \ talones para ascender de manera explosiva a la posición erguida.\n\nConsejos:\n\
  Baja únicamente hasta la profundidad en la que puedas preservar la neutralidad lumbar\
  \ sin que la pelvis bascule en exceso."
