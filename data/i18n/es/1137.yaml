name: Pullover en polea alta
description: |-
  Posición inicial:
  • Ponte de pie frente a la máquina de polea alta con los pies a la anchura de los hombros.
  • Sujeta la barra con agarre prono a la anchura de los hombros y los brazos casi extendidos (codos ligeramente desbloqueados).
  • Inclina ligeramente el torso hacia delante manteniendo la espalda recta y el abdomen firme.

  Ejecución:
  • Tira de la barra hacia abajo en un arco amplio hacia los muslos tirando desde los dorsales.
  • Contrae intensamente los dorsales en la parte inferior durante un segundo.
  • Deja que la barra vuelva lentamente por el mismo camino hasta la altura de los ojos, resistiendo la carga.
