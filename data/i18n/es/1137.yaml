name: Pullover en polea alta
description: 'Posición inicial:

  Ponte frente a una polea alta con los pies a la anchura de los hombros. Sujeta la barra con agarre prono
  y las manos a la anchura de los hombros; mantén los brazos casi rectos y los codos ligeramente desbloqueados.
  Inclínate un poco desde las caderas con la espalda recta y el abdomen activo.


  Ejecución:

  1. Tira de la barra en un arco amplio hacia la parte superior de los muslos usando los dorsales y manteniendo
  los brazos extendidos.

  2. Contrae los dorsales abajo durante una breve pausa.

  3. Devuelve la barra por el mismo arco hasta la altura de los ojos, controlando la resistencia.'
