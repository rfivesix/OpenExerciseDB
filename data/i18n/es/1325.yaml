name: Desplazamiento lateral con impulso
description: 'Beginpositie:

  Empieza en una postura atlética y equilibrada, con las rodillas ligeramente flexionadas y el core activado.


  Uitvoering:

  1. Impúlsate explosivamente hacia un lado con la pierna apoyada.

  2. Aterriza suavemente sobre la pierna contraria y amortigua el impacto con la rodilla y la cadera.

  3. Recupera brevemente el equilibrio y vuelve a impulsarte hacia el otro lado.'
