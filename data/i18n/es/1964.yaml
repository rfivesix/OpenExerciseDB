name: Flexión con manos separadas
description: 'Posición inicial:

  Colócate en plancha alta apoyando las manos bastante más abiertas que la anchura de los hombros (aproximadamente
  una vez y media el ancho de hombros), con las puntas de los dedos ligeramente hacia fuera y el cuerpo
  alineado de pies a cabeza.


  Ejecución:

  Baja el pecho hacia el suelo flexionando los codos de forma controlada hasta rozar la esterilla. Haz
  una breve pausa y empuja firmemente con las palmas para regresar a la posición de plancha inicial.


  Consejos:

  La posición amplia de manos incrementa la tensión en los pectorales y deltoides frontales. Mantén el
  abdomen tenso para evitar que la cadera se hunda.'
