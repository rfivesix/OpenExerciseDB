name: Press inclinado suave en máquina Smith
description: 'Posición inicial: túmbate en un banco con una inclinación ligera (15–30 grados) dentro de
  una máquina Smith. Sujeta la barra con agarre prono algo más ancho que los hombros, sácala del soporte
  y mantenla sobre la parte superior del pecho con los brazos extendidos. Ejecución: baja la barra suavemente
  hacia la parte superior del pecho y las clavículas, con los omóplatos retraídos y los codos a unos 45–60
  grados del torso. Vuelta: empuja la barra recta por la guía hasta casi extender los brazos, concentrándote
  en los pectorales claviculares (superiores). Indicaciones: mantén los pies apoyados y un arco estable
  en la parte alta de la espalda, sin levantar los glúteos del banco.'
