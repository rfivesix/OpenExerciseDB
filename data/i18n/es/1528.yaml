name: Máquina de empuje de glúteos
description: 'Posición inicial:

  Siéntate en la máquina de glúteos y apoya la parte superior de la espalda contra el respaldo móvil.
  Sujeta el cinturón acolchado sobre las caderas. Coloca los pies a la anchura de los hombros en la plataforma,
  con las puntas ligeramente hacia fuera.


  Ejecución:

  1. Suelta el seguro y empuja con los talones para elevar las caderas contra el cinturón.

  2. Sube hasta que el torso y los muslos formen una línea horizontal; contrae los glúteos durante 1–2
  segundos arriba.

  3. Baja las caderas lentamente y con control antes de repetir.'
