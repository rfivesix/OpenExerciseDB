- "Remo alto unilateral de rodillas"
description: 'Posición inicial:

  Fija un agarre individual a una polea alta. Arrodíllate frente a la torre, con la rodilla del lado que
  trabaja en la esterilla, el torso erguido y el abdomen firme. Sujeta el agarre con el brazo extendido
  en la dirección del cable.


  Ejecución:

  1. Tira del cable hacia abajo y atrás, llevando el codo hacia la cadera y las costillas.

  2. Contrae la espalda durante un segundo al final del tirón.

  3. Deja que el cable vuelva arriba con control y estira el dorsal antes de repetir.


  Indicaciones:

  La posición medio arrodillada ayuda a limitar el arqueo lumbar y el impulso.'
