name: Retracción Cervical
description: 'Este es un ejercicio postural clave para corregir la postura de "cabeza adelantada" y aliviar
  la tensión en el cuello.

  Instrucciones:

  De pie o sentado con la espalda y el cuello rectos, mira hacia el frente. Suavemente, lleva tu mentón
  y tu cabeza rectos hacia atrás, como si intentaras crear una "papada", hasta sentir un estiramiento
  en la nuca.

  Es un movimiento horizontal, no debes inclinar la cabeza hacia abajo. Sostén la posición por 5 segundos,
  relaja y repite. Puedes usar tus dedos en el mentón para guiar el movimiento.'
