name: Sentadilla a cajón a una pierna
description: |-
  Este ejercicio requiere un cajón resistente o una silla. Simplemente colócate a unos 15 cm por delante y equilíbrate sobre una pierna. Desde aquí, comienza a bajar en una sentadilla con un movimiento suave y controlado, manteniendo la otra pierna estirada recta hacia adelante para mantener el equilibrio. Siéntate lentamente sobre el cajón, haz una pausa de un segundo y empuja hacia arriba con la pierna que trabaja, sin dejar nunca que la otra pierna toque el suelo.
