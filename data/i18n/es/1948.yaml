name: Sentadilla cosaca (Cossack Squat)
description: 'Posición inicial: Colócate en una postura de sumo amplia, con los pies
  bastante más separados que los hombros y las puntas ligeramente hacia fuera. Mantén
  el torso erguido y junta las manos delante del pecho.


  Ejecución: Desplaza el peso hacia una pierna y haz una sentadilla profunda, manteniendo
  la otra pierna extendida hacia un lado. Al bajar, gira hacia arriba el pie de la
  pierna extendida para que los dedos apunten al techo, con el talón apoyado en el
  suelo. Desciende hasta donde permita tu movilidad, manteniendo plano el talón de
  la pierna de apoyo y el pecho elevado. Empuja con ese talón para volver al centro
  y baja hacia el otro lado.


  Consejos: Forma parte de la rutina Limber 11 de Joe DeFranco (5–10 repeticiones
  por lado). La fuente indica que desarrolla la fuerza unilateral de las piernas y
  mejora de forma notable la flexibilidad de los aductores y la dorsiflexión del tobillo.'
