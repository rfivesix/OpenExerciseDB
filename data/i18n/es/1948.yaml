name: Sentadilla cosaca (Cossack Squat)
description: 'Posición inicial:

  Colócate de pie con una apertura de piernas muy amplia y las puntas de los pies ligeramente hacia fuera. Mantén el torso erguido y las manos juntas frente al pecho.


  Ejecución:

  Desplaza el peso hacia un lado y flexiona profundamente esa rodilla mientras mantienes la otra pierna completamente estirada. Gira el pie de la pierna estirada hacia arriba apoyando solo el talón. Baja hasta la máxima profundidad cómoda manteniendo el talón de apoyo firme en el suelo y el pecho alto. Empuja con fuerza para volver al centro y desciende hacia el lado contrario.


  Consejos:

  Parte de la rutina Limber 11 (5-10 repeticiones por lado). Mejora la movilidad de cadera, tobillo y la flexibilidad de los aductores.'
