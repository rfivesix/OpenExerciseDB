name: Rutina de movilidad Limber 11
description: 'La rutina Limber 11 creada por Joe DeFranco es una conocida secuencia de calentamiento y movilidad articular para el tren inferior que combina liberación miofascial y estiramientos dinámicos y estáticos:


  1. Foam roller en banda iliotibial (10-15 pasadas por lado)

  2. Foam roller en aductores (10-15 pasadas por lado)

  3. Liberación miofascial de glúteos con pelota de lacrosse (30 seg - 2 min)

  4. Cruz de hierro con rodillas flexionadas (5-10 repeticiones por lado)

  5. Volteretas a sentada en V (10 repeticiones)

  6. Estiramiento de rana con balanceo (10 repeticiones)

  7. Círculos de boca de incendios / Fire Hydrant (10 adelante / 10 atrás)

  8. Escaladores / Mountain Climbers (10 repeticiones por pierna)

  9. Sentadilla cosaca (5-10 repeticiones por lado)

  10. Estiramiento del piriforme sentado (20-30 seg por lado)

  11. Estiramiento del flexor de cadera con pie trasero elevado (5-10 repeticiones con pausa de 3s)'
