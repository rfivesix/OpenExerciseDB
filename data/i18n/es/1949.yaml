name: Rutina de movilidad Limber 11
description: 'Rutina de calentamiento y movilidad para la parte inferior del cuerpo,
  atribuida al entrenador Joe DeFranco. Incluye: rodillo en la banda iliotibial (10–15
  pasadas por lado), aductores (10–15); automasaje de glúteos con pelota (30 s–2 min
  por lado); Iron Cross con rodillas flexionadas (5–10 por lado); roll-over a V-sit
  (10); estiramiento de rana con balanceo (10); círculos de fire hydrant (10 adelante
  y 10 atrás por lado); mountain climbers (10 por pierna); sentadilla cosaca (5–10
  por lado); estiramiento piriforme sentado (20–30 s por lado); y estiramiento de
  flexores de cadera con pie trasero elevado (5–10 repeticiones con pausa de 3 s por
  lado).'
