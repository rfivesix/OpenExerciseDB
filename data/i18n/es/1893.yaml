name: Press de barra por encima de la cabeza
description: 'Preparación: Ponte de pie con los pies a la anchura de las caderas y
  agarra la barra un poco más ancha que los hombros.

  Posición: Apoya la barra sobre la parte superior del pecho y los deltoides anteriores.

  Empuje: Activa el core y empuja la barra recta hacia arriba hasta que los brazos
  queden completamente estirados por encima de la cabeza.

  Final: Baja la barra de forma controlada de vuelta al pecho.'
