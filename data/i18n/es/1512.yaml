name: Curl drop
description: Los curls drop en esta posición modificada y a ritmo lento trabajan el braquial. Empieza
  con una mancuerna en cada mano y los brazos ligeramente inclinados uno hacia el otro, a la altura del
  pecho. Baja lentamente una mancuerna hasta casi extender el brazo y vuelve a subirla al inicio mientras
  la otra permanece arriba. Después baja la otra mancuerna. Así se mantiene la tensión en el braquial;
  al pasar los 90° durante el descenso, el bíceps asume el trabajo.
