name: Curl martillo
description: 'Inicio: Sujeta las mancuernas a los lados con las palmas hacia el torso.

  Curl: Eleva las pesas hacia los hombros manteniendo el agarre neutro, como si sujetaras un martillo.

  Aprieta: Contrae los bíceps arriba sin desplazar los codos hacia delante.

  Descenso: Vuelve lentamente a la posición inicial con control.'
