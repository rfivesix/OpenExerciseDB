name: Curl de bíceps con TRX
description: 'Posición inicial: sujeta las asas TRX con agarre supino mirando al punto de anclaje. Inclínate
  hacia atrás con los brazos extendidos y los pies adelantados, manteniendo el cuerpo en una línea rígida
  de plancha. Ejecución: mantén los codos altos a la altura de los hombros y apuntando hacia delante;
  flexiónalos para llevar la frente hacia las manos usando los bíceps. Vuelta: extiende los brazos y deja
  que el cuerpo se incline hacia atrás de forma controlada hasta el inicio. Indicaciones: no dejes caer
  los codos ni uses el impulso de las caderas; mantén el abdomen tenso.'
