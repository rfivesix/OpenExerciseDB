name: Abducción de cadera en cuadrupedia (Fire Hydrant)
description: 'Posición inicial:

  Colócate a cuatro patas sobre una esterilla con las manos bajo los hombros y las rodillas bajo las caderas. Opcionalmente, coloca una banda elástica justo por encima de las rodillas. Mantén el abdomen activo y la espalda recta.


  Ejecución:

  Con la rodilla flexionada a 90 grados, eleva una pierna lateralmente hacia fuera hasta que el muslo quede casi paralelo al suelo. Aprieta el glúteo medio y evita rotar la pelvis. Baja lentamente la pierna sin apoyarla del todo y repite. Completa la serie antes de cambiar de pierna.


  Consejos:

  Imagina que llevas un vaso de agua en la zona lumbar: no permitas que la espalda se balancee ni se incline.'
