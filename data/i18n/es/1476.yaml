name: Sit-up mariposa (Butterfly Sit-up)
description: |-
  Posición inicial:
  Túmbate boca arriba sobre una colchoneta con las plantas de los pies juntas y las rodillas abiertas hacia los lados en forma de mariposa. Extiende los brazos por detrás de la cabeza tocando el suelo con las manos.

  Ejecución:
  1. Contrae el abdomen y utiliza un ligero impulso coordinado de los brazos para incorporar el torso.
  2. Sube hasta quedar sentado erguido, llevando las manos a tocar el suelo justo por delante de los pies.
  3. Desciende desenrollando la espalda vértebra a vértebra de forma controlada hasta volver a tocar el suelo con las manos por detrás de la cabeza.

  Consejos:
  La posición de mariposa reduce la activación de los flexores de la cadera (psoas) y concentra el trabajo en el recto abdominal.
