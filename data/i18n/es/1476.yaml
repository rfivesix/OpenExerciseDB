name: Abdominal mariposa
description: En esta variante de dificultad intermedia, los brazos aportan algo de impulso para despegar
  el torso del suelo y se abren por encima de la cabeza, lo que implica la parte superior de la espalda.
  Túmbate con las plantas de los pies apoyadas, las rodillas flexionadas y los brazos cruzados sobre el
  pecho. Usa los abdominales para elevar el torso mientras abres los brazos en posición de portería. Baja
  despacio para volver al inicio.
