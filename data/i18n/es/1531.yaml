name: Curl de bíceps en polea
description: 'Posición inicial:

  Conecta una barra recta o EZ a la polea baja. Ponte de pie (o siéntate) frente a la máquina y sujeta
  la barra con agarre supino, a la anchura de los hombros. Mantén los codos pegados a los costados.


  Ejecución:

  1. Mantén inmóviles los brazos y flexiona los codos para llevar la barra hacia la parte superior del
  pecho.

  2. Contrae con fuerza los bíceps en la parte alta del recorrido.

  3. Baja el peso de forma controlada hasta que los brazos estén casi extendidos, resistiendo la tensión
  del cable.


  Indicaciones:

  La polea mantiene una tensión mecánica continua en los bíceps durante las fases concéntrica y excéntrica.'
