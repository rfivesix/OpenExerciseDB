name: Remo renegado
description: Colócate en plancha alta o en posición de flexión con las manos sujetando un par de mancuernas
  hexagonales apoyadas en el suelo. Separa los pies un poco más que el ancho de los hombros para ganar
  estabilidad. Haz una flexión y luego rema una mancuerna llevando el codo hacia las costillas, sin girar
  las caderas. Baja la mancuerna con control, haz otra flexión y rema con el otro brazo para completar
  una repetición.
