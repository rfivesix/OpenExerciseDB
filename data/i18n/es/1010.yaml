name: Estiramiento Posterior de Cuello (Nuca)
description: 'Este ejercicio es ideal para aliviar la tensión en la parte trasera del cuello (nuca) y
  la parte alta de la espalda.

  Instrucciones:

  Sentado o de pie con la espalda recta y los hombros relajados, baja lentamente el mentón en dirección
  al pecho hasta sentir un estiramiento.

  Para profundizarlo, puedes entrelazar los dedos y colocar las manos sobre la parte posterior de la cabeza.
  Deja que solo el peso de tus brazos aplique una presión muy suave y gentil. Es crucial que no jales
  la cabeza hacia abajo con fuerza. Mantén el estiramiento por 15-30 segundos y regresa lentamente a la
  posición inicial.'
