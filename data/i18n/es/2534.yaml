name: Puente de glúteos
description: |-
  Posición inicial:
  Túmbate boca arriba en el suelo con las rodillas flexionadas y los pies apoyados planos sobre la esterilla, separados al ancho de las caderas. Coloca los brazos relajados a los lados del cuerpo.

  Ejecución:
  1. Activa el abdomen y empuja con fuerza a través de los talones para elevar la cadera hacia el techo.
  2. Sube la pelvis hasta que los muslos, las caderas y el torso formen una línea recta desde las rodillas hasta los hombros.
  3. Aprieta fuertemente los glúteos en el punto más alto durante 1 o 2 segundos.
  4. Desciende la cadera de forma lenta y controlada hasta casi rozar el suelo y repite.

  Consejos:
  Evita arquear excesivamente la espalda baja en la parte superior; la extensión debe originarse en la cadera.
