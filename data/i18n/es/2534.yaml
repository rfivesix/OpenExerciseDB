name: Puente de glúteos
description: 'Posición inicial: Túmbate boca arriba en una colchoneta con las rodillas flexionadas y los
  pies apoyados en el suelo, separados aproximadamente al ancho de las caderas y a unos centímetros de
  los glúteos. Deja los brazos extendidos a los lados.


  Ejecución: Activa el abdomen y empuja firmemente con los talones para elevar las caderas hacia el techo.
  Súbelas hasta que los muslos, la pelvis y el torso formen una línea recta desde las rodillas hasta los
  hombros. Contrae con fuerza los glúteos arriba y mantén la posición de 1 a 2 segundos. Baja las caderas
  de forma controlada hasta que rocen el suelo y comienza inmediatamente la siguiente repetición.


  Indicaciones: Evita extender o hiperextender la columna lumbar en la parte alta; la extensión debe proceder
  únicamente de las articulaciones de la cadera.'
