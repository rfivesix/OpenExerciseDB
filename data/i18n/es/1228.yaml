exercise_id: '1228'
language: es
status: ai_reviewed
name: Press de banca con agarre cerrado con mancuernas
description: |-
  Posición inicial:
  • Túmbate boca arriba en un banco plano sosteniendo una mancuerna en cada mano sobre el pecho con los brazos estirados.
  • Usa un agarre neutro (palmas enfrentadas) y presiona las dos mancuernas entre sí manteniéndolas en contacto continuo.

  Ejecución:
  • Desciende las mancuernas hacia el centro del pecho manteniendo los codos pegados a los costados.
  • Empuja las mancuernas hacia arriba con fuerza extendiendo los tríceps.
  • Mantén la presión entre ambas mancuernas durante toda la repetición para enfatizar el tríceps.
