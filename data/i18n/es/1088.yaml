exercise_id: '1088'
language: es
status: ai_reviewed
name: Peso muerto sumo con mancuerna
description: |-
  Posición inicial:
  Adopta una postura ancha (aproximadamente 1.5 a 2 veces el ancho de los hombros) con las puntas de los pies rotadas hacia afuera a unos 45 grados. Coloca una mancuerna pesada en posición vertical en el suelo entre tus pies.

  Ejecución:
  1. Flexiona las rodillas y las caderas con la espalda neutra y el pecho erguido hasta agarrar la parte superior de la mancuerna con ambas manos.
  2. Empuja con fuerza contra el suelo con los talones y extiende las piernas y caderas para incorporarte de pie por completo.
  3. Aprieta los glúteos y los aductores en la parte superior.
  4. Desciende la mancuerna de forma controlada hasta que toque el suelo y repite.
