name: Peso muerto sumo con mancuerna
description: 'Posición inicial:

  Adopta una postura amplia (aproximadamente entre una vez y media y dos veces la anchura de los hombros),
  con las puntas de los pies giradas unos 45 grados hacia fuera. Coloca una mancuerna en vertical en el
  suelo entre los pies.


  Ejecución:

  1. Lleva las caderas atrás y flexiona las rodillas, con el pecho erguido y la espalda recta, para agarrar
  con ambas manos el extremo superior de la mancuerna.

  2. Empuja los pies contra el suelo y extiende caderas y rodillas hasta quedar de pie.

  3. Contrae glúteos y parte interna de los muslos arriba.

  4. Baja la mancuerna con control hasta tocar el suelo antes de la siguiente repetición.'
