name: Peso muerto sumo con mancuerna
description: |-
  Baja tu mancuerna al suelo entre las piernas. Adopta una postura amplia y, con la espalda recta, baja en sentadilla. Con la mancuerna en posición vertical, agárrala por la parte superior de la "cabeza" (imagen 1). Manteniendo el pecho arriba y el core activado, empuja el suelo, impulsándote de nuevo hacia arriba hasta quedar de pie (imagen 2). Repite. Si alcanzas fácilmente 20-30 repeticiones, usa dos mancuernas.
