name: Jalón al pecho inclinado hacia atrás
description: Siéntate en la estación de jalón al pecho y fija los muslos bajo los soportes. Sujeta la
  barra con un agarre más ancho que los hombros. Inclina ligeramente el torso hacia atrás (unos 20–30
  grados) y tira de la barra hacia la parte superior del pecho, llevando los codos hacia abajo y contrayendo
  los dorsales. Devuelve la barra hacia arriba de forma controlada hasta extender los brazos.
