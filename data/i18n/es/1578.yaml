exercise_id: '1578'
language: es
status: upstream_unreviewed
name: Hip Hinge
description: |-
  Descripción del ejercicio Hip HingeEl hip hinge es un patrón de movimiento fundamental que consiste en flexionar las caderas mientras se mantiene la columna neutra. Se utiliza habitualmente en ejercicios como el peso muerto, los kettlebell swings y los good mornings. Para realizar un hip hinge:    Posición inicial: Ponte de pie con los pies separados al ancho de las caderas y una ligera flexión en las rodillas.    Flexiona las caderas: Lleva las caderas hacia atrás manteniendo la espalda recta. El torso debe inclinarse hacia delante y el pecho debe permanecer erguido.    Fase de descenso: Sigue flexionando hasta que el torso quede casi paralelo al suelo, o hasta que notes un estiramiento en los isquiotibiales.    Regreso a la posición de pie: Empuja con los talones y proyecta las caderas hacia delante para volver a la posición inicial.
