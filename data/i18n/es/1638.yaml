name: Cargada y press con barra
description: Este ejercicio consiste en levantar una barra desde el suelo hasta los hombros y luego empujarla
  por encima de la cabeza. Es un movimiento compuesto que trabaja varios grupos musculares, incluidas
  las piernas, la espalda, los hombros y los brazos. Se utiliza a menudo en programas de fuerza y acondicionamiento
  para mejorar la potencia y el rendimiento atlético en general.
