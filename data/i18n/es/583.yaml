name: Flexiones de lado a lado
description: 'Posición inicial: Colócate en posición de plancha alta o de flexión, con las manos algo más separadas
  que los hombros y el cuerpo alineado.

  Ejecución: Baja el pecho hacia una mano flexionando los codos y desplazando la mayor parte del peso corporal hacia
  ese lado.

  Regreso: Empuja con fuerza para volver a la posición inicial y, en la siguiente repetición, desplázate hacia el
  lado contrario.'
