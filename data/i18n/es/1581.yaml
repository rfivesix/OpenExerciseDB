name: Press escapular con mancuerna (trap press)
search_terms:
- "Press de trapecio"
- "Golpe de serrato con mancuerna"
- "Protracción escapular con mancuerna"
description: 'Posición inicial:

  Túmbate boca arriba en un banco y sujeta una mancuerna con una mano. Extiende el brazo verticalmente
  hacia el techo, justo encima del hombro, con el codo extendido o casi extendido.


  Ejecución:

  Sin doblar el codo, protrae la escápula para empujar la mancuerna hacia el techo tanto como te resulte
  cómodo. Contrae el serrato anterior arriba y luego retrae lentamente la escápula para bajar el peso
  hasta la posición de reposo sobre el banco.


  Indicaciones:

  El movimiento debe ocurrir únicamente en la escápula, no en el codo. Mantén el core activado y la espalda
  apoyada y plana contra el banco.'
