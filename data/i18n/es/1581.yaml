exercise_id: '1581'
language: es
status: ai_authored
name: Press escapular con mancuerna (Press de trapecio)
search_terms:
  - Press de trapecio
  - Serratus punch con mancuerna
  - Protracción escapular con mancuerna
description: |-
  Posición inicial:
  Túmbate boca arriba en un banco plano sosteniendo una mancuerna con una mano. Extiende el brazo verticalmente hacia el techo directamente sobre tu hombro, con el codo completamente bloqueado o recto.

  Ejecución:
  Sin flexionar el codo, empuja el peso hacia el techo mediante la protracción de la escápula (separando el omóplato del banco). Mantén la contracción en el serrato anterior durante un instante y luego retrae lentamente la escápula para volver a apoyar el hombro en el banco.

  Consejos:
  - El movimiento debe originarse exclusivamente en la escápula; el codo no debe doblarse en ningún momento.
  - Mantén el torso estable y la espalda bien apoyada en el banco durante todo el ejercicio.
