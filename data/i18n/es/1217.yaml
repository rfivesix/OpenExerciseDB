name: Flexiones sobre las yemas de los dedos
description: 'Posición inicial:

  • Adopta la posición de flexión pero apoyando únicamente las yemas de los dedos y pulgares bien abiertos
  contra el suelo.

  • Las palmas de las manos deben quedar elevadas en el aire sin tocar el piso.

  • Mantén el cuerpo en una línea recta rígida mediante la activación del core.


  Ejecución:

  • Flexiona los codos lentamente descendiendo el pecho hacia el suelo con máximo control.

  • Mantén los dedos firmes y estables bajo la carga.

  • Empuja con fuerza a través de las yemas de los dedos para extender los brazos y volver arriba.'
