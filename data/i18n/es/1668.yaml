name: Extensión de tríceps sobre la cabeza a una mano en polea
description: 'Coloca la polea en la parte inferior de la máquina de cables y agárrala sin usar ningún
  accesorio. Extiende el cable directamente por encima de la cabeza.

  Manteniendo la espalda recta y el brazo superior inmóvil, baja el cable por detrás de la cabeza hasta
  que sientas un buen estiramiento en el tríceps, y después extiéndelo de nuevo hacia arriba hasta que
  el codo quede completamente bloqueado.'
