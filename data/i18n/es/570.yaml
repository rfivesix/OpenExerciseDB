name: Encogimiento de hombros
description: El encogimiento de hombros es un ejercicio de entrenamiento con pesas que se usa para desarrollar la
  parte superior del trapecio. Ponte de pie, con las manos separadas aproximadamente a la anchura de los hombros,
  y eleva los hombros lo máximo posible. Luego bájalos sin flexionar los codos ni mover el cuerpo. El recorrido
  puede ser menor que en un encogimiento realizado para trabajar la movilidad activa. Se suele considerar una buena
  técnica que, al elevarlos, la línea de los hombros quede horizontal.
