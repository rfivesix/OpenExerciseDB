description: La caminata lateral, también llamada pasos laterales o caminata en sentadilla, consiste en
  desplazarse de lado en posición de sentadilla. Puede hacerse con o sin bandas de resistencia. Trabaja
  los abductores de la cadera, los glúteos y otros músculos estabilizadores.
