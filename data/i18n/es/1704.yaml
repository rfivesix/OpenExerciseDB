name: L-sit agrupado
description: |-
  El L-sit agrupado es un sostenimiento con el peso corporal en el que te apoyas sobre barras paralelas, parallettes o el suelo con los brazos rectos mientras llevas las rodillas hacia el pecho. Las caderas permanecen elevadas, la columna se mantiene erguida y los pies flotan sin tocar el suelo. El objetivo es mantener el core firme, los hombros deprimidos y los brazos bloqueados mientras conservas la posición agrupada. Es un sostenimiento estático intenso para el core y estabilizador de los hombros que se usa a menudo como progresión hacia el L-sit completo.
