name: L-sit agrupado
description: 'El tuck L-sit es una posición isométrica con peso corporal: te sostienes sobre barras paralelas,
  paralelas bajas o el suelo, con los brazos extendidos, y acercas las rodillas al pecho. Mantén las caderas
  elevadas, la columna erguida y los pies sin tocar el suelo. Contrae el abdomen, mantén los hombros bajos
  y los brazos extendidos durante la posición recogida. Es una sujeción estática que exige al abdomen
  y estabiliza los hombros, y suele usarse como progresión hacia el L-sit completo.'
