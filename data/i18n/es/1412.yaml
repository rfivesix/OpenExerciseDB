name: Abdominales en bicicleta
description: |-
  Los abdominales en bicicleta son un ejercicio para el core que se realiza en el suelo. Acuéstate de espaldas con las manos detrás de la cabeza y las piernas extendidas. Eleva los hombros del suelo, lleva una rodilla hacia el pecho y gira el torso para que el codo opuesto toque la rodilla. Alterna los lados en un movimiento de pedaleo, asegurándote de mantener el core comprometido durante todo el ejercicio.
