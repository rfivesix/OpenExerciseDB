name: Puente de glúteos con press a un brazo
description: |-
  Con una mancuerna en la mano, realiza un puente de glúteos. Ahora sostén la mancuerna por encima del pecho, esta es la posición inicial de la repetición. Baja la mancuerna hasta que el codo toque el suelo o quede aproximadamente 45 grados por debajo del hombro si usas un banco. Empuja la mancuerna de nuevo hasta la posición inicial.
