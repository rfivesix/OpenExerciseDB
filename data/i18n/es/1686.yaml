name: Puente de glúteos con press a un brazo
description: 'Posición inicial: Túmbate boca arriba con las rodillas flexionadas y los pies apoyados en
  el suelo. Sujeta una mancuerna con una mano. Empuja con los talones para elevar las caderas hasta formar
  un puente de glúteos estable y coloca la mancuerna directamente sobre el pecho.


  Movimiento:

  1. Baja la mancuerna con control hasta que la parte superior del brazo o el codo toque el suelo, aproximadamente
  a 45 grados respecto al cuerpo.

  2. Empuja la mancuerna de nuevo a la posición inicial mientras mantienes las caderas completamente extendidas.

  3. Completa las repeticiones indicadas y repite con el otro lado.


  Consejos: Mantén los glúteos contraídos y el abdomen firme para evitar que las caderas roten o se hundan.'
