name: Press de banca con barra desde topes
description: Coloca un banco plano dentro de un rack y ajusta los topes de seguridad a la altura deseada
  (normalmente, unos centímetros por encima del pecho o en el punto donde cuesta más levantar). Túmbate,
  agarra la barra algo más ancho que los hombros y apoya firmemente los pies. Baja la barra con control
  hasta que repose por completo en los topes. Haz una pausa de 1 a 2 segundos manteniendo la tensión del
  tren superior y luego empuja la barra hasta extender los brazos, sin rebotar en los topes. No pierdas
  la tensión muscular mientras la barra descansa en ellos.
