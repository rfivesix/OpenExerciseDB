name: Aperturas en máquina con agarre estrecho
description: 'El movimiento es igual que en las aperturas habituales en máquina, pero con un agarre estrecho:

  Siéntate en la máquina, con los pies bien apoyados en el suelo y la parte superior de los brazos paralela
  al suelo. Junta los brazos hasta que las empuñaduras casi se toquen, pero sin llegar a hacerlo. Vuelve
  lentamente. Las pesas deben permanecer suspendidas durante todo el ejercicio.'
