name: Extensión de tríceps a un brazo en polea
description: Ponte frente a una polea alta o ligeramente de lado y sujeta un asa o el extremo de una cuerda
  con una mano. Mantén la parte superior del brazo pegada al costado y el codo flexionado unos 90 grados.
  Empuja el accesorio hacia abajo extendiendo el codo hasta contraer por completo el tríceps. Devuelve
  el asa hacia arriba lentamente y con control, sin mover el codo ni el hombro.
