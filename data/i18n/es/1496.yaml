name: Elevación supinada con mancuerna para el pecho superior
search_terms:
- "Variación con mancuerna para pecho superior"
- "Elevación con mancuerna para pecho superior"
- "Elevación frontal inclinada con mancuernas y agarre supino"
description: 'Posición inicial:

  Ponte de pie o siéntate en un banco con poca inclinación. Sujeta una mancuerna con una mano a la altura
  de la cadera, con agarre supinado y el codo ligeramente flexionado. Inclina un poco el torso hacia el
  brazo que trabaja.


  Ejecución:

  1. Eleva la mancuerna en diagonal por delante de la parte superior del pecho hacia la altura de la cabeza,
  manteniendo la palma hacia arriba.

  2. Sigue el ángulo natural de las fibras del pectoral superior.

  3. Contrae la parte superior del pecho y el deltoides anterior durante un segundo.

  4. Baja la mancuerna lentamente con control.'
