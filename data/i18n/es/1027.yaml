name: Estiramiento de oración con brazos elevados
description: 'Posición inicial:

  Arrodíllate frente a un banco plano o una superficie elevada. Coloca los codos en el borde, separados
  aproximadamente a la anchura de los hombros, y junta las palmas en posición de oración o sujeta una
  pica ligera.


  Ejecución:

  1. Lleva las caderas hacia atrás y deja que el pecho descienda hacia el suelo, con la cabeza entre los
  brazos.

  2. Flexiona los codos y lleva las manos hacia la nuca o la parte superior de la espalda.

  3. Siente el estiramiento en dorsales, tríceps y columna torácica.

  4. Mantén la posición de 20 a 40 segundos respirando lenta y profundamente; sal del estiramiento con
  suavidad.'
search_terms:
