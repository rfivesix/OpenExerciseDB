name: Estiramiento de la oración elevado (Prayer Stretch)
description: |-
  Posición inicial:
  Arrodíllate frente a un banco plano o una superficie elevada. Apoya ambos codos en el borde del banco separados al ancho de los hombros y junta las palmas de las manos en posición de oración.

  Ejecución:
  1. Lleva las caderas hacia atrás y deja que el pecho descienda hacia el suelo, pasando la cabeza entre los brazos.
  2. Flexiona los codos llevando las manos hacia la nuca o la parte superior de la espalda.
  3. Siente el estiramiento en los dorsales, tríceps y la columna torácica.
  4. Mantén la posición de 20 a 40 segundos respirando profundamente y sal del estiramiento con suavidad.
