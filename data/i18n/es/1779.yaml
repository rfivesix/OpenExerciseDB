name: Rotación con landmine
description: "Posición inicial:\nAncla un extremo de la barra en un soporte landmine.\
  \ Colócate de pie frente a la barra con los pies al ancho de los hombros. Sujeta\
  \ el extremo libre con ambas manos entrelazadas y los brazos extendidos frente al\
  \ pecho. Activa el abdomen y flexiona ligeramente las rodillas.\n\nEjecución:\n\
  1. Desciende la barra en un arco amplio y controlado hacia un lado de la cadera\
  \ manteniendo los brazos casi rectos.\n2. Rota el tronco de forma controlada pivotando\
  \ levemente sobre el pie trasero y frenando la carga con los oblicuos.\n3. Impulsa\
  \ la barra de vuelta hacia arriba al centro y desciéndela de inmediato hacia el\
  \ lado opuesto.\n\nConsejos:\nMantén los brazos prácticamente extendidos; la rotación\
  \ y el frenado deben ser ejecutados por el core y los oblicuos."
