name: Rotación con landmine
description: 'Ancla un extremo de la barra a un soporte landmine o a una esquina. Colócate frente a la
  barra con los pies al ancho de los hombros. Sujeta con ambas manos el extremo libre, con los dedos entrelazados
  y los brazos extendidos delante del pecho. Flexiona ligeramente las rodillas y activa el abdomen.


  1. Baja la barra en un arco amplio y controlado hacia una cadera, con los brazos casi rectos.

  2. Deja que el torso rote y el pie trasero pivote ligeramente; controla el peso con los oblicuos y el
  abdomen.

  3. Contrae el abdomen para llevar la barra al centro y después hacia la cadera contraria.

  4. Alterna de forma fluida.


  No flexiones mucho los codos. La rotación y el control deben venir del torso.'
