name: Curl de bíceps con press militar con mancuernas
description: |-
  Posición inicial:
  • Ponte de pie con los pies a la anchura de las caderas, sosteniendo una mancuerna en cada mano a los costados.
  • Mantén el tronco erguido y el abdomen firme.

  Ejecución:
  • Flexiona los codos realizando un curl de bíceps hasta llevar las mancuernas a la altura de los hombros.
  • De forma fluida, gira las muñecas hacia el frente y presiona las mancuernas verticalmente por encima de la cabeza hasta estirar los brazos.
  • Desciende los pesos de vuelta a los hombros y baja con control hasta la posición inicial de partida.
