name: Escaladora (ClimbMill)
description: |-
  Posición inicial:
  • Sube a los escalones de la máquina escaladora (ClimbMill) manteniendo el torso erguido.
  • Apoya ligeramente las manos en las barandillas para mantener el equilibrio, sin volcar el peso del cuerpo sobre ellas.

  Ejecución:
  • Sube de forma continua y acompasada, pisando con firmeza con toda la planta del pie en cada peldaño.
  • Mantén la espalda recta y el abdomen firme en todo momento.
  • Ajusta la velocidad de los escalones según tu nivel de resistencia cardiorrespiratoria.
