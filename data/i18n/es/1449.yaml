name: Subida de escaleras en máquina
description: Súbete a la máquina de escaleras giratorias y mantén el torso erguido. Apoya ligeramente
  las manos en las barandillas para mantener el equilibrio sin cargar el peso del torso sobre ellas. Sube
  de forma fluida, apoyando todo el pie en cada escalón. Mantén el pecho elevado, los hombros atrás y
  el abdomen activo. Ajusta la velocidad a tu nivel de acondicionamiento cardiovascular.
