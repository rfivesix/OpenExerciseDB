name: Elevación lateral en polea por detrás de la espalda
description: "Posición inicial:\nColócate de lado junto a una polea baja. Pasa la\
  \ mano exterior por detrás de los glúteos para sujetar la manija. Sujétate al soporte\
  \ de la máquina con la mano interior e inclina el torso ligeramente hacia adelante.\n\
  \nEjecución:\n1. Con una ligera flexión en el codo, eleva el brazo lateralmente\
  \ hasta la altura del hombro.\n2. Contrae fuertemente el deltoides lateral en el\
  \ punto más alto durante un segundo.\n3. Desciende la polea lentamente por detrás\
  \ del cuerpo manteniendo la tensión continua.\n\nConsejos:\nPasar el cable por detrás\
  \ evita el roce contra los muslos y proporciona una línea de tracción óptima para\
  \ el hombro lateral."
