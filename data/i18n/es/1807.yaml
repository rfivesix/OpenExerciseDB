name: Elevación lateral en polea por detrás de la espalda
description: 'Colócate de lado junto a una polea baja. Lleva la mano exterior por detrás de los glúteos
  para sujetar el agarre en D. Con la mano interior, sujétate al montante y flexiona ligeramente el torso
  hacia delante, con el pecho erguido.


  1. Con el codo ligeramente flexionado, eleva el brazo hacia fuera y arriba hasta que la mano llegue
  a la altura del hombro.

  2. Contrae el deltoides lateral arriba y mantén una pausa de un segundo.

  3. Baja el agarre lentamente detrás del cuerpo, manteniendo la tensión en el hombro.


  La fuente señala que pasar el cable por detrás evita que el agarre choque con las caderas y mantiene
  tensión en la posición estirada.'
search_terms:
