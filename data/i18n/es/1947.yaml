name: Arrancada con mancuerna
description: 'Pasos clave: Coloca la mancuerna entre los pies, con los hombros sobre
  las caderas, el pecho elevado y la espalda recta.


  Tirón: Extiende explosivamente las caderas, las rodillas y los tobillos (triple
  extensión) para impulsar la mancuerna hacia arriba. Mantén el codo alto y la mancuerna
  cerca del cuerpo.


  Recepción: Flexiona rápidamente las caderas y las rodillas para meterte debajo de
  la mancuerna y recibirla sobre la cabeza con el brazo bloqueado, aterrizando en
  media sentadilla.


  Errores frecuentes: Tirar demasiado con los brazos en vez de impulsar con las piernas,
  llevar el codo bajo durante el tirón o desalinear hombro, codo y muñeca en la posición
  final. Para empezar, la fuente recomienda usar poco peso, centrarse en la técnica
  y hacer 3–5 series de 3–5 repeticiones por brazo.'
