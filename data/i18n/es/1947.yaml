name: Arrancada con mancuerna (Dumbbell Snatch)
description: 'Posición inicial:

  Colócate de pie con los pies a la anchura de los hombros y la mancuerna en el suelo entre ambos pies. Flexiona caderas y rodillas manteniendo la espalda recta y sujeta la mancuerna con agarre prono.


  Ejecución:

  Extiende de forma explosiva tobillos, rodillas y caderas (triple extensión) para impulsar la mancuerna hacia arriba cerca del cuerpo con el codo alto. Flexiona rápidamente las piernas para meterte por debajo del peso y recibirlo con el brazo bloqueado sobre la cabeza en un cuarto de sentadilla, antes de ponerte completamente de pie.


  Consejos:

  La potencia proviene de la cadera y las piernas; no tires del peso con la fuerza aislada del brazo.'
