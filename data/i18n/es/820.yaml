name: Suspensión en canto de 20 mm
description: Sujeta con ambas manos el canto de 20 mm del fingerboard con agarre abierto o semiarqueado.
  Activa los hombros llevándolos hacia abajo, lejos de las orejas, y mantén los codos ligeramente flexionados.
  Levanta los pies del suelo y cuélgate de forma estable durante el tiempo indicado (por ejemplo, 10 segundos),
  manteniendo la tensión en todo el cuerpo.
