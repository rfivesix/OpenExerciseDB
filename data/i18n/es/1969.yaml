name: Extensión de tríceps en polea a un brazo
description: 'Posición inicial:

  Colócate frente a la polea alta con los pies a la anchura de los hombros. Engancha un maneral individual y sujétalo en agarre prono con el codo flexionado a 90 grados y pegado al costado. Inclina ligeramente el torso al frente y activa el abdomen.


  Ejecución:

  Empuja el maneral hacia abajo extendiendo el codo hasta estirar el brazo por completo. Mantén la contracción durante un segundo en el punto más bajo y regresa despacio controlando la subida hasta los 90 grados.


  Consejos:

  Conserva el codo completamente bloqueado junto al cuerpo sin permitir que oscile adelante o atrás.'
