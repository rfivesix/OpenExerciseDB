name: Plancha lateral de aductores (Copenhagen)
description: 'Posición inicial:

  Túmbate de lado junto a un banco plano. Apoya en él la parte interna del pie y el tobillo de la pierna
  superior (o la parte inferior de la pierna). Coloca el antebrazo inferior en el suelo, justo debajo
  del hombro, y deja la pierna inferior bajo el banco.


  Ejecución:

  1. Empuja con el antebrazo inferior y la cara interna del pie superior para elevar las caderas.

  2. Sube hasta formar una línea recta y firme con el torso, las caderas y la pierna superior, a la altura
  del banco.

  3. Mantén la pierna inferior separada del suelo, flotando justo debajo del banco.

  4. Mantén la posición isométrica durante el tiempo indicado; baja con control y cambia de lado.


  Consejos:

  No dejes que las caderas caigan ni roten hacia delante. Activa los oblicuos y la cara interna de los
  muslos.'
