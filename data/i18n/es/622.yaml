name: Elevación de pantorrillas de pie
description: Colócate en la máquina de elevación de pantorrillas y asegúrate de poder bajar los talones por completo.
  Ponte recto, sin arquear la espalda ni flexionar las piernas. Elévate todo lo que puedas. Haz una pausa breve
  de 1–2 segundos y baja lentamente.
