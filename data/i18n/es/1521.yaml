name: Hack squat pendular
description: 'Posición inicial:

  Colócate en la máquina de sentadilla hack pendular con la espalda y los hombros
  firmemente apoyados en las almohadillas y los pies a la anchura de los hombros en
  la plataforma.


  Ejecución:

  1. Desciende de forma controlada a lo largo de la trayectoria pendular curvada flexionando
  rodillas y caderas en una sentadilla profunda.

  2. Empuja fuertemente a través de toda la planta del pie para regresar arriba sin
  bloquear las rodillas por completo.

  3. Mantén la tensión constante en los cuádriceps.'
