name: Sentadilla hack pendular
description: 'Posición inicial:

  Colócate en la máquina de sentadilla hack pendular con la espalda y los hombros apoyados en las almohadillas.
  Sitúa los pies a la anchura de los hombros en la plataforma y suelta los seguros.


  Ejecución:

  1. Baja con suavidad siguiendo el arco curvo de la máquina, flexionando caderas y rodillas hasta una
  sentadilla profunda.

  2. Cuando los cuádriceps estén estirados abajo, empuja con todo el pie para volver a subir.

  3. Detente justo antes de bloquear las rodillas para mantener la tensión en los cuádriceps.'
