name: Curl de Bíceps con Kettlebell a una Mano
description: 'De pie, sostén una kettlebell en una mano con el brazo totalmente extendido. Comienza el
  movimiento flexionando el codo y levantando la pesa hasta que tu mano alcance la altura del hombro,
  contrayendo fuertemente el bíceps.

  Para realizar el ejercicio correctamente, evita impulsarte con la espalda o balancear el cuerpo; el
  codo debe permanecer relativamente fijo a un costado de tu torso. El movimiento debe ser controlado,
  enfocándose únicamente en la fuerza del brazo.'
