name: Inclinaciones laterales de cabeza
description: |-
  Posición inicial:
  Siéntate o ponte de pie con la columna recta y los hombros relajados y abajo.

  Ejecución:
  1. Inclina lentamente la cabeza hacia un lado, llevando la oreja en dirección al hombro hasta sentir un estiramiento suave en el lateral opuesto del cuello.
  2. Mantén ambos hombros abajo y sostén la posición de 15 a 30 segundos respirando con tranquilidad.
  3. Regresa con cuidado al centro y repite hacia el otro lado.
