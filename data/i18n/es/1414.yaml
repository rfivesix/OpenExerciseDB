name: Sentadilla Hack en máquina
description: |-
  Posición inicial:
  Colócate en la máquina de sentadilla Hack con la espalda y la cabeza bien apoyadas en el respaldo y los hombros bajo las almohadillas. Coloca los pies a la anchura de los hombros en la plataforma. Libera los seguros de la máquina.

  Ejecución:
  Flexiona las rodillas y baja el carro de forma controlada hasta que los muslos queden al menos paralelos a la plataforma. Empuja con fuerza a través de los talones y el mediopié para volver a la posición inicial sin bloquear bruscamente las rodillas arriba.

  Consejos:
  Mantén la zona lumbar pegada al respaldo en todo momento. No despegues los talones de la superficie de apoyo.
