name: Sentadilla hack en máquina
description: Colócate en la máquina hack squat con la espalda y la cabeza apoyadas en el respaldo y los
  hombros bajo las almohadillas. Pon los pies al ancho de los hombros, en el centro o la mitad superior
  de la plataforma, y libera los seguros. Flexiona las rodillas y baja el carro de forma controlada hasta
  que los muslos queden al menos paralelos a la plataforma, o más abajo según tu movilidad. Empuja desde
  el mediopié y los talones para volver arriba sin bloquear las rodillas bruscamente. Mantén la zona lumbar
  apoyada y los talones en la plataforma.
