exercise_id: '1414'
language: es
status: human
name: Sentadillas Hack
description: |-
  Las sentadillas hack son un ejercicio para la parte inferior del cuerpo que se realiza en una máquina hack squat o con barra. En la variación con máquina, coloca los hombros bajo las almohadillas y los pies ligeramente hacia adelante en la plataforma. Empuja con los talones para levantar el peso, luego flexiona las rodillas para bajar la plataforma de manera controlada hasta que los muslos estén paralelos al suelo. Empuja de vuelta a la posición inicial. En la variación con barra, sostiene la barra detrás de las piernas con los brazos extendidos y realiza un movimiento similar a una sentadilla.
