name: Burpees sin Flexión
description: 'Esta es la variante del burpee que omite la flexión de pecho pero sí incluye el salto vertical
  al final, haciéndola más explosiva que la versión de 4 tiempos.

  La secuencia es: agáchate y pon las manos en el suelo, salta con los pies hacia atrás a una plancha,
  salta de nuevo con los pies hacia adelante y termina impulsándote en un salto vertical.'
