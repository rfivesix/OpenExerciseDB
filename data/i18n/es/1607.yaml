exercise_id: '1607'
language: es
status: upstream_unreviewed
name: Dominadas typewriter
description: |-
  Cuélgate de una barra de dominadas con agarre prono, algo más ancho que el ancho de los hombros. Tira de tu cuerpo hacia arriba hasta que la barbilla supere la barra. En la posición superior, en lugar de bajar en línea recta, desplaza el cuerpo hacia un lado extendiendo un brazo mientras mantienes el otro flexionado. Muévete de forma fluida de un lado a otro, como el movimiento de una máquina de escribir, antes de bajar de nuevo. Este ejercicio aumenta el tiempo bajo tensión y fortalece los dorsales, los bíceps y los hombros, a la vez que desarrolla fuerza de tracción unilateral.
