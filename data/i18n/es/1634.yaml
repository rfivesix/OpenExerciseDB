name: Pullover/remo con cuerda
description: Coloca un banco inclinado delante de una polea baja con cuerda. Inclínate sobre el respaldo
  del banco, inicia el movimiento con los brazos extendidos en arco como un pullover y finaliza con un
  remo llevando los codos hacia atrás para contraer al máximo los dorsales.
