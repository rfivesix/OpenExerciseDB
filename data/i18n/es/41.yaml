name: Rueda abdominal con barra
description: 'Arrodíllate sobre una esterilla y coloca una barra en el suelo delante de ti.

  Sujeta la barra con las manos separadas al ancho de los hombros y con agarre prono.

  Con un movimiento lento y controlado, haz rodar la barra hacia delante hasta extender el cuerpo y mantener
  la espalda recta.

  Tira de la barra hacia ti usando los músculos abdominales para volver a la posición inicial.'
