name: Estiramiento gato-vaca
description: Colócate a cuatro apoyos con las manos bajo los hombros y las rodillas
  bajo las caderas, empezando con la espalda neutra. Inhala mientras inclinas la pelvis
  hacia delante, dejas que el abdomen baje y elevas el pecho y la mirada (vaca). Exhala
  mientras llevas el coxis hacia dentro, acercas el ombligo a la columna y redondeas
  la espalda hacia el techo (gato), dejando caer la cabeza. Alterna durante 8–12 ciclos
  respiratorios sin forzar la extensión.
