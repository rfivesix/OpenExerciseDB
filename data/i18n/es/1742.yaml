name: Back lever
description: 'Cuélgate de una barra o anillas con agarre prono o supino. Pasa las piernas entre los brazos
  hasta quedar invertido, mirando al suelo (posición skin the cat).


  1. Baja lentamente desde la posición invertida hasta mantener el cuerpo recto y horizontal, de hombros
  a talones.

  2. Mantén los brazos rectos, activa y retrae los omóplatos, y contrae glúteos, erectores espinales y
  abdomen.

  3. Mantén la posición el tiempo indicado y respira con regularidad.

  4. Sal de forma controlada, volviendo a la posición invertida o bajando de manera segura.


  No dejes que las caderas caigan ni se plieguen. La fuente recomienda progresar desde posiciones encogidas
  para acondicionar tendones del bíceps y hombros.'
