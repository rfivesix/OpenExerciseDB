name: Superman
description: 'Túmbate boca abajo con las piernas rectas y los brazos extendidos por encima de la cabeza sobre el
  suelo.

  Eleva simultáneamente los brazos, el pecho y los muslos unos centímetros del suelo contrayendo los músculos de
  la zona lumbar, los glúteos y la parte superior de la espalda.

  Mantén la contracción máxima durante 2–5 segundos mientras respiras con suavidad y luego baja lentamente de forma
  controlada.'
