name: Curl de kettlebell con dos manos
description: Ponte de pie con los pies separados al ancho de los hombros. Sujeta con ambas manos los cuernos
  de la kettlebell delante de los muslos, con los brazos extendidos. Mantén los codos junto a los costados
  y flexiónalos para llevar la kettlebell hacia el pecho. Baja el peso lenta y suavemente hasta extender
  los brazos. Evita balancear el torso o impulsar las caderas; concéntrate en contraer los bíceps.
