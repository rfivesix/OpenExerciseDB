name: Sentadilla dragón (Dragon Squat)
description: 'Posición inicial:

  • Comienza de pie con los pies separados a la anchura de las caderas y el abdomen firme.

  • Mantén el pecho erguido y los hombros hacia atrás.


  Ejecución:

  • Cruza un pie por detrás de la pierna contraria en diagonal hacia atrás, flexionando ambas rodillas
  en una zancada cruzada profunda.

  • Desciende la cadera manteniendo el torso erguido y las caderas mirando al frente.

  • Empuja con fuerza sobre el talón de la pierna delantera para regresar a la posición inicial y alterna
  los lados.'
