exercise_id: '1577'
language: es
status: human
name: Estiramiento Bretzel
description: |-
  Cómo realizar el estiramiento Bretzel    Posición inicial:        Túmbate boca arriba sobre una superficie plana, como una colchoneta.        Flexiona las rodillas y apoya los pies planos en el suelo.    Posición de las piernas:        Levanta la pierna derecha y crúzala sobre la izquierda, colocando el pie derecho por fuera de la rodilla izquierda.        La pierna izquierda debe permanecer apoyada en el suelo.    Posición de los brazos:        Extiende el brazo izquierdo hacia el lado a la altura del hombro, manteniéndolo recto.        Con la mano derecha, tira suavemente de la rodilla derecha hacia el suelo, hacia el lado izquierdo del cuerpo.    Estiramiento:        Mientras bajas la rodilla, intenta mantener el hombro izquierdo apoyado en el suelo.        Deberías notar un estiramiento en la cadera, la zona lumbar y posiblemente el pecho.    Mantén la posición:        Aguanta esta posición de 20 a 30 segundos, respirando profundamente y relajándote en el estiramiento.        Cambia de lado y repite el proceso.
