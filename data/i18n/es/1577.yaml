name: Estiramiento Bretzel
description: 'Posición inicial:

  Túmbate de lado sobre una colchoneta. Flexiona la pierna superior 90 grados hacia
  delante sobre el suelo y sujétala firme con la mano inferior.


  Ejecución:

  1. Dobla la rodilla inferior hacia atrás y agarra el pie o tobillo con la mano superior.

  2. Al exhalar, gira lentamente los hombros y la parte superior del tronco hacia
  el suelo, abriendo el pecho.

  3. Mantén la rodilla superior en contacto con el suelo durante todo el estiramiento.

  4. Mantén la postura durante 20-30 segundos respirando con calma y cambia de lado.'
