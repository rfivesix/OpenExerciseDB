name: Círculos de brazos hacia delante
description: Ponte de pie con los pies separados al ancho de los hombros y extiende los brazos a los lados
  a la altura de los hombros, con las palmas hacia abajo. Haz círculos pequeños y controlados hacia delante.
  Aumenta poco a poco su tamaño a medida que se calientan los hombros. Mantén las escápulas retraídas
  y evita encoger los hombros hacia las orejas.
