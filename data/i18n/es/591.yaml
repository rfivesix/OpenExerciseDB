name: Abdominales con los pies elevados en banco
description: Siéntate en una colchoneta y apoya las pantorrillas en un banco, con las rodillas en ángulo recto.
  Coloca las manos detrás del cuello. Sube con un movimiento de enrollamiento de la espalda; deberías notar cómo
  las vértebras se van despegando de la colchoneta. En el punto más alto, contrae los abdominales todo lo posible
  y mantén la posición durante 2 segundos. Baja desenrollando la espalda.
