exercise_id: '1234'
language: es
status: ai_authored
name: Empuje de cadera a una pierna con mancuerna
description: |-
  Posición inicial:
  • Siéntate en el suelo con la parte superior de la espalda apoyada contra el borde de un banco plano.
  • Coloca una mancuerna sobre la pelvis y sujétala con ambas manos.
  • Apoya firmemente un pie en el suelo (pierna de trabajo) con la rodilla a 90 grados y eleva la otra pierna en el aire.

  Ejecución:
  • Empuja con fuerza a través del talón de la pierna de apoyo extendiendo la cadera hasta que el torso y el muslo formen una línea horizontal recta.
  • Aprieta al máximo el glúteo mayor arriba durante 1 o 2 segundos.
  • Desciende la cadera de manera controlada y repite las repeticiones prescritas antes de cambiar de pierna.
