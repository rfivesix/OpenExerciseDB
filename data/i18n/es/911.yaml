name: Extensión de tríceps tumbado con mancuernas en banco inclinado
description: Túmbate en un banco inclinado a unos 30–45 grados con una mancuerna en cada mano y los brazos
  extendidos por encima de la cabeza. Mantén la parte superior de los brazos ligeramente inclinada hacia
  atrás y quieta durante todo el movimiento. Flexiona los codos suavemente y baja las mancuernas por los
  lados de la cabeza hasta estirar por completo los tríceps. Extiende los codos para volver a la posición
  inicial y contrae firmemente los tríceps arriba.
