name: Knee Tuck al codo en TRX
description: 'Posición inicial:

  Coloca los pies en los estribos del TRX y adopta una posición de plancha alta con las manos directamente debajo de los hombros
  y el cuerpo alineado.


  Ejecución:

  1. Contrae el abdomen y lleva ambas rodillas flexionadas de forma diagonal hacia el codo derecho.

  2. Mantén la contracción de los oblicuos durante un breve instante.

  3. Extiende las piernas de vuelta a la posición de plancha y repite el movimiento hacia el codo izquierdo.'
