name: Planche lean isométrico
description: 'Posición inicial: Adopta una plancha alta con los brazos extendidos y las manos en el suelo,
  aproximadamente al ancho de los hombros, con los dedos ligeramente girados hacia fuera para reducir
  la tensión en las muñecas.


  Ejecución: Empuja con fuerza el suelo para separar las escápulas (redondear la parte alta de la espalda)
  y lleva la pelvis hacia dentro, formando una posición de cuerpo hueco. Con los codos completamente extendidos,
  inclina lentamente los hombros hacia delante, tanto como puedas más allá de las muñecas. Apoya el peso
  en las puntas de los pies y las manos, y mantén la posición isométrica inclinada durante el tiempo indicado.
  Lleva los hombros de nuevo a una posición neutra para descansar.


  Indicaciones: No flexiones los codos ni arquees la zona lumbar; cuanto más te inclines hacia delante,
  mayor será la carga sobre los hombros.'
