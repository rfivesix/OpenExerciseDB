name: Curl predicador con barra EZ
description: 'Coloca una barra EZ en los soportes de delante del banco predicador. Inclínate sobre el
  banco y sujeta las empuñaduras interiores anguladas con agarre supino. Siéntate bien en el asiento,
  apoya los tríceps contra el respaldo inclinado y el pecho cómodamente contra el banco.

  Baja la barra lentamente y de forma controlada hasta extender los codos, sin hiperextenderlos. Flexiona
  los codos para subir el peso contrayendo los bíceps y detente justo antes de la vertical para mantener
  la tensión. Repite.'
