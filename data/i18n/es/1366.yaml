name: Sentadilla dividida con mancuernas
description: 'Beginpositie:

  Ponte de pie con una mancuerna en cada mano a los lados y los brazos extendidos. Adelanta un pie para
  adoptar una postura dividida, con los pies a la anchura de las caderas para mantener el equilibrio.
  Apoya completamente el pie delantero y eleva el talón trasero.


  Beweging:

  Baja las caderas flexionando ambas rodillas hasta que la rodilla trasera casi toque el suelo y el muslo
  delantero quede aproximadamente paralelo al suelo. Empuja con el talón delantero para volver a la posición
  erguida sin mover los pies.


  Opmerkingen:

  Mantén el torso erguido y el core activo. Completa todas las repeticiones con una pierna antes de cambiar
  de lado.'
