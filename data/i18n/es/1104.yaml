exercise_id: '1104'
language: es
name: Caminar
description: 'Mantén una postura erguida y relajada, con los hombros abajo y atrás y la mirada al frente.
  Camina con un paso rítmico: apoya suavemente el talón y rueda el pie hasta impulsarte con la parte delantera.
  Balancea los brazos de forma natural, en oposición a las piernas, con los codos ligeramente flexionados.
  Mantén un ritmo activo de al menos 100 pasos por minuto, el abdomen suavemente firme y una respiración
  constante.'
