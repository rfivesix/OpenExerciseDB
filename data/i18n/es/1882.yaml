name: Elevación lateral en polea a la altura de la cintura
description: "Colócate junto a una máquina de poleas con la polea ajustada a la altura\
  \ de la cintura.\nAgarra el manillar del lado opuesto con la mano más alejada de\
  \ la polea, manteniendo la palma hacia adentro.\nMantén el core activado, el pecho\
  \ arriba y los hombros relajados. Conserva una ligera flexión en el codo durante\
  \ toda la elevación.\nEleva el brazo hacia el lado hasta que el codo alcance la\
  \ altura del hombro, manteniendo la muñeca alineada con el codo.\nHaz una breve\
  \ pausa en la parte alta y luego baja el manillar lentamente y con control hacia\
  \ tu costado. Repite las repeticiones deseadas."
