name: Ciclismo
description: 'Posición inicial:

  Ajusta la altura del sillín de la bicicleta o la bicicleta estática de modo que, cuando el pedal esté
  abajo, la rodilla quede ligeramente flexionada (unos 25–35 grados). Ajusta el manillar para poder agarrarlo
  cómodamente, con los hombros relajados y la columna neutra.


  Ejecución:

  1. Pedalea en círculos suaves y continuos a un ritmo constante.

  2. Aplica fuerza con la parte delantera de los pies, empujando hacia abajo y tirando durante la rotación.

  3. Mantén un ritmo uniforme y ajusta la resistencia al objetivo del entrenamiento.


  Notas:

  Mantén el tronco estable para que las caderas no se balanceen de lado a lado en el sillín. Respira con
  regularidad y ritmo.'
