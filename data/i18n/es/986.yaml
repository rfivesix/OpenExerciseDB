name: Zancada lateral (izquierda)
description: Ponte de pie con los pies más separados que los hombros y las puntas hacia delante o ligeramente
  hacia fuera. Desplaza el peso hacia la izquierda, flexiona la rodilla izquierda y lleva la cadera hacia
  atrás. Mantén la pierna derecha estirada y el pie derecho apoyado. Baja hasta que el muslo izquierdo
  quede casi paralelo al suelo y empuja con el talón izquierdo para volver a la posición amplia. Mantén
  el pecho elevado y la rodilla izquierda alineada con el pie.
