name: Tríada de curl de bíceps
description: 'Posición inicial:

  Ponte de pie, con los pies a la anchura de los hombros, y sujeta una mancuerna en cada mano con los
  brazos extendidos a los lados.


  Ejecución:

  Combina tres variantes en una secuencia continua:

  1. Curl cruzado supinado: gira la palma hacia arriba y lleva la mancuerna hacia el hombro contrario.

  2. Curl cruzado pronado: gira la palma hacia abajo y lleva la mancuerna hacia el lado contrario.

  3. Curl «No Money»: flexiona los codos mientras giras los hombros hacia fuera y separas las manos.


  Indicaciones:

  Pasa de una variante a otra con fluidez.'
search_terms:
