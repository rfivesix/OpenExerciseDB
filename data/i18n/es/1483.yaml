name: Curl de bíceps trifecta
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de los hombros, sujetando una mancuerna en cada mano a los lados del cuerpo.

  Ejecución:
  Este ejercicio combina tres variaciones de curl de forma continua en una misma serie:
  1. Curl cruzado en supinación: Supina el antebrazo con la palma hacia arriba y eleva la mancuerna cruzando el torso hacia el hombro opuesto.
  2. Curl cruzado en pronación: Prona el antebrazo con la palma hacia abajo y eleva la mancuerna cruzando el torso para enfatizar el braquial y el braquiorradial.
  3. No Money Curl: Realiza el curl rotando externamente los hombros y llevando las manos hacia afuera para una contracción intensa del bíceps.

  Consejos:
  Realiza cada repetición de forma estricta y sin balanceos para acumular una alta intensidad y tiempo bajo tensión.
