name: Crunch de levitación
description: En este movimiento se eleva el torso sin mover la parte inferior del cuerpo. Túmbate con
  los pies apoyados en el suelo, los brazos cruzados por encima de la cabeza y las manos detrás de esta.
  Eleva el torso hasta despegar los omóplatos del suelo y haz una pausa de uno o dos tiempos arriba. Intenta
  contraer la parte superior de los abdominales durante 10 repeticiones controladas.
