name: Crunch de levitación
description: |-
  Posición inicial:
  Túmbate boca arriba en el suelo con las rodillas flexionadas y los pies apoyados en el suelo. Cruza los brazos por encima del pecho o coloca las manos suavemente detrás de la cabeza sin tirar del cuello.

  Ejecución:
  1. Despega la parte superior del torso y los omóplatos del suelo mediante una contracción directa del abdomen superior.
  2. Mantén la parte inferior del tronco y la pelvis completamente inmóviles en el suelo.
  3. Aguanta la contracción máxima en la posición alta durante 1 o 2 segundos.
  4. Desciende lentamente de nuevo sin relajar por completo los abdominales.

  Consejos:
  No tires de la cabeza ni del cuello; concéntrate en elevar el pecho hacia arriba como si levitaras desde el suelo.
