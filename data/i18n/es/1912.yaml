name: Rotación de core sentado (Russian Twist)
description: 'Posición inicial:

  Siéntate en el suelo con las rodillas flexionadas. Inclina el torso hacia atrás unos 45 grados con la espalda recta hasta activar el abdomen y despega ligeramente los pies del suelo para mantener el equilibrio sobre los glúteos.


  Ejecución:

  Gira el torso de lado a lado de forma controlada, tocando el suelo con las manos junto a cada cadera en cada repetición.


  Consejos:

  Mantén el pecho abierto y rota desde la zona media del tronco sin encorvar la espalda baja.'
