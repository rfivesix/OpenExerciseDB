name: Rotación de core sentado (Russian Twist)
description: 'Posición inicial: Siéntate sobre una colchoneta con las rodillas flexionadas
  y los talones inicialmente apoyados. Inclina el torso unos 45 grados hacia atrás
  hasta activar los abdominales y eleva los pies unos centímetros para equilibrarte
  sobre los isquiones.


  Ejecución: Gira el torso suavemente de lado a lado y lleva las manos a tocar el
  suelo junto a cada cadera. Activa los oblicuos para controlar cada giro y mantén
  estables las caderas.


  Consejos: Mantén el pecho erguido y la columna neutra. Evita encorvarte o mover
  solo los brazos sin girar el torso.'
