name: Flexiones explosivas
description: 'Posición inicial: Adopta una posición estándar de flexión en el suelo, con las manos algo
  más separadas que los hombros y el cuerpo alineado en una plancha rígida desde la cabeza hasta los talones.


  Ejecución: Baja el pecho de forma controlada hasta quedar a unos 2,5 cm del suelo. Empuja con máxima
  potencia a través de las palmas y el pecho, con la suficiente rapidez para que las manos se separen
  del suelo. Aterriza suavemente con los codos ligeramente flexionados, absorbe el impacto y baja de inmediato
  para la siguiente repetición.


  Indicaciones: Mantén el tronco firme durante el impulso y el aterrizaje; no dejes que la zona lumbar
  se hunda al impactar.'
