name: Encogimiento de hombros inclinado con barra
description: De pie, sujeta la barra con agarre prono algo más ancho que los hombros.
  Flexiona ligeramente las rodillas e inclina el torso unos 45 grados desde la cadera,
  manteniendo la espalda recta y los brazos extendidos. Sin doblar los codos, eleva
  y retrae las escápulas. Contrae trapecios y romboides un segundo y baja con control.
  Mantén la columna firme y no uses impulso de cadera o rodillas.
