name: Encogimientos Silverback con barra
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de los hombros sosteniendo una barra con agarre prono algo más ancho que los hombros. Flexiona ligeramente las rodillas e inclina el torso hacia delante unos 45 grados manteniendo la espalda recta. La barra cuelga verticalmente con los brazos rectos.


  Ejecución:

  Sin doblar los codos, eleva y junta las escápulas hacia arriba y hacia atrás. Aprieta con fuerza la parte media del trapecio y los romboides en la cima durante un segundo. Baja la barra despacio y con control hasta estirar por completo antes de repetir.


  Consejos:

  Mantén la columna lumbar neutra y evita dar impulsos con las piernas o las caderas.'
