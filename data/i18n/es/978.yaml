name: Elevación de rodillas colgado
description: Cuélgate de una barra con agarre prono, los brazos extendidos y los hombros estables. Mantén
  las piernas juntas y el cuerpo quieto. Contrae el abdomen, acerca las rodillas al pecho y lleva la pelvis
  hacia arriba. Baja las piernas de forma controlada, sin balancearte.
