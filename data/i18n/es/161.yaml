name: Pullover con mancuerna atravesado en banco
description: Sujeta una mancuerna de peso moderado con las palmas apoyadas contra la parte inferior de
  los discos superiores y los pulgares rodeando la barra. Túmbate atravesado sobre un banco plano, de
  modo que solo la parte superior de la espalda y los hombros estén apoyados. Separa los pies aproximadamente
  al ancho de los hombros y deja que la cabeza cuelgue ligeramente. Con la mancuerna sostenida con los
  brazos extendidos directamente sobre el pecho, flexiona los brazos unos 15 grados y mantenlos así durante
  todo el movimiento. Baja lentamente la mancuerna hacia atrás y hacia abajo describiendo un arco semicircular,
  hasta donde te resulte cómodo. Súbela despacio por el mismo arco y repite las repeticiones necesarias.
