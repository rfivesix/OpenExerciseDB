name: Retracción escapular tumbado boca abajo, brazos a los lados
description: 'Túmbate boca abajo con la cabeza sobre una toalla.

  Extiende los brazos rectos hacia los lados.

  Eleva lentamente los brazos mientras juntas los omóplatos y mantén la posición durante 3 segundos.'
