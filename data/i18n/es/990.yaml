name: Patada de glúteo de rodillas
description: Colócate a cuatro apoyos sobre una esterilla, con las manos debajo de los hombros y las rodillas
  debajo de las caderas. Mantén el abdomen firme y la rodilla flexionada unos 90 grados (o extiende la
  pierna). Empuja la planta de un pie hacia arriba y atrás, en dirección al techo, contrayendo el glúteo.
  Mantén un segundo arriba y baja la rodilla despacio, sin apoyarla por completo. Evita arquear la zona
  lumbar o desplazar demasiado el peso hacia un lado.
