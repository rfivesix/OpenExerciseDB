name: Abducción de cadera sentada en máquina
description: 'Siéntate erguido en la máquina de abducción, con la espalda apoyada. Coloca la parte externa
  de las rodillas y los muslos contra las almohadillas. Apoya los pies en las plataformas y sujeta las
  asas laterales para estabilizar la pelvis.


  1. Empuja las piernas hacia fuera contra las almohadillas, contrayendo glúteo medio y músculos externos
  de la cadera.

  2. Abre las piernas hasta un recorrido cómodo y haz una pausa de 1–2 segundos arriba.

  3. Devuelve lentamente las rodillas hacia el centro, resistiendo el peso y sin dejar que la pila toque
  abajo entre repeticiones.


  Mantén las caderas apoyadas y el torso quieto; no uses impulso ni te balancees.'
