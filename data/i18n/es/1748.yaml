name: Abducción de cadera en máquina
description: "Posición inicial:\nSiéntate en la máquina de abducción con la espalda\
  \ bien apoyada en el respaldo. Coloca la parte externa de los muslos y rodillas\
  \ contra las almohadillas acolchadas. Apoya los pies en los soportes y sujeta los\
  \ agarres laterales para estabilizar la pelvis.\n\nEjecución:\n1. Empuja las piernas\
  \ hacia afuera separándolas mediante la fuerza del glúteo medio y los abductores\
  \ de cadera.\n2. Abre al máximo rango de movimiento y mantén la contracción durante\
  \ 1 a 2 segundos en el punto final.\n3. Regresa lentamente juntando las piernas\
  \ de manera controlada sin que las placas de peso choquen.\n\nConsejos:\nMantén\
  \ el torso estable y evita balancearte hacia adelante o atrás durante el movimiento."
