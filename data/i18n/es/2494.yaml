name: Extensión terminal de rodilla con banda (TKE)
description: 'Posición inicial:

  Ancla una banda de resistencia a un poste firme a la altura de la rodilla. Pasa el otro extremo por
  detrás del pliegue de una rodilla. Aléjate del anclaje y colócate en posición escalonada, con la pierna
  que lleva la banda delante y la rodilla ligeramente flexionada.


  Ejecución:

  1. Presiona el talón contra el suelo y estira la rodilla hacia atrás contra la banda hasta extenderla
  por completo.

  2. Contrae con fuerza los cuádriceps (en especial el vasto medial oblicuo) al final durante 2–3 segundos.

  3. Deja que la rodilla se flexione un poco hacia delante con control, contra la tracción de la banda.

  4. Completa las repeticiones y cambia de pierna.


  Consejos:

  Mantén las caderas alineadas y el torso erguido. No hiperextiendas la rodilla con brusquedad; céntrate
  en una contracción controlada del cuádriceps.'
