name: Sentadilla búlgara (izquierda)
description: Colócate a unos 60 cm delante de un banco o una silla estable. Apoya el empeine del pie derecho
  detrás de ti sobre el banco y planta firmemente el pie izquierdo delante. Flexiona la rodilla izquierda
  y baja la cadera hasta que el muslo izquierdo quede aproximadamente paralelo al suelo y la rodilla derecha
  justo por encima del suelo. Empuja con el talón y la parte media del pie izquierdo para volver a erguirte.
  Inclina ligeramente el torso desde la cadera, con la espalda recta, y evita que la rodilla delantera
  se cierre hacia dentro.
