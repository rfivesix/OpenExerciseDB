name: Puente de glúteos
description: Túmbate boca arriba con las caderas y las rodillas flexionadas y los pies apoyados en el
  suelo. Desde esa posición, eleva los glúteos hasta que el cuerpo forme una línea recta desde las rodillas
  hasta los hombros. Para aumentar la intensidad, puedes apoyar una barra sobre las caderas durante el
  movimiento o colocar los pies sobre una superficie algo elevada, como un escalón o un banco.
