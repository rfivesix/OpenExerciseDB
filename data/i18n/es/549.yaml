name: Press de tríceps sentado
description: Siéntate en un banco, preferiblemente con respaldo. Sujeta firmemente una mancuerna con ambas manos
  y mantenla por encima de la cabeza con los brazos extendidos. Con las palmas hacia arriba y sosteniendo el peso
  de la mancuerna, bájala lentamente detrás de la cabeza.
