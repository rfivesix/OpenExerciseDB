name: Crunch en silla romana
description: 'Posición inicial: Colócate en la silla romana con los pies bien sujetos bajo los rodillos
  y el torso alineado.

  Ejecución: Flexiona el torso hacia delante contrayendo los abdominales. No subas hasta quedar completamente
  erguido ni te tumbes hacia atrás; así mantendrás la tensión en los abdominales.

  Vuelta: Regresa de forma controlada a la posición inicial sin hiperextender la zona lumbar.'
