exercise_id: '1083'
language: es
status: ai_reviewed
name: Elevaciones Y-W-T en decúbito prono
description: |-
  Posición inicial:
  Túmbate boca abajo sobre una colchoneta con el cuello neutral y la mirada hacia el suelo.

  Ejecución:
  1. Posición Y: Extiende los brazos en diagonal hacia adelante formando una 'Y' (a unos 45 grados), con los pulgares apuntando al techo. Eleva ligeramente el pecho y los brazos contrayendo la espalda alta durante 10–20 segundos.
  2. Posición W: Flexiona los codos tirando de ellos hacia abajo y pegados a los costados para formar una 'W', manteniendo los brazos en el aire y los omóplatos juntos.
  3. Posición T: Abre los brazos en cruz perpendiculares al cuerpo formando una 'T', con los pulgares hacia arriba, apretando fuertemente las escápulas.
  4. Realiza la secuencia de forma controlada y continua para mejorar la postura y estabilidad escapular.
