name: Elevaciones Y-W-T en decúbito prono
description: 'Posición inicial:

  Túmbate boca abajo sobre una colchoneta, con las piernas extendidas y el cuello neutro, mirando al suelo.


  Ejecución:

  1. En Y, extiende los brazos por encima de la cabeza en diagonal (unos 45 grados), con los pulgares
  hacia el techo. Eleva ligeramente brazos y pecho, junta las escápulas y mantén 10–20 segundos.

  2. En W, lleva los codos hacia abajo y las costillas formando una W, manteniendo las manos y los brazos
  elevados; contrae la parte media de la espalda.

  3. En T, extiende los brazos hacia los lados, perpendiculares al torso, con los pulgares hacia arriba;
  junta las escápulas y mantén la posición.

  4. Pasa de una posición a otra con suavidad para trabajar la estabilidad escapular y la resistencia
  de la espalda alta.'
