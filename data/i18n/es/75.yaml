name: Press de banca con mancuernas
description: 'Preparación y posición inicial: Siéntate en el extremo de un banco plano con una mancuerna
  apoyada verticalmente sobre cada muslo. Inclínate con cuidado hacia atrás mientras llevas las mancuernas
  al pecho con ayuda de las rodillas.


  Impulso de piernas y postura: Apoya bien los pies en el suelo. Junta las escápulas contra el banco y
  conserva la curva lumbar natural.


  Posición inicial: Empuja las mancuernas hacia el techo. Alinea las muñecas con los codos. Gira ligeramente
  las mancuernas hacia dentro (unos 45 grados) para que los codos no se abran demasiado hacia los lados.


  Fase excéntrica (bajada): Baja las mancuernas de forma controlada hacia los lados del pecho. Los codos
  deben descender formando unos 45–60 grados respecto al cuerpo. Nota el estiramiento en la parte inferior
  del pecho.


  Fase concéntrica (subida): Empuja el peso hacia arriba describiendo un arco leve hacia el centro, sin
  que las mancuernas choquen arriba ni bloquear completamente los codos, para mantener la tensión muscular.
  Espira al empujar.'
