name: Jalón a la cara con cuerda
description: 'Fija una cuerda a una polea ajustada aproximadamente a la altura del pecho.

  Aléjate para sostener el peso con los brazos completamente extendidos y adopta una posición escalonada,
  con un pie delante. Flexiona ligeramente las rodillas para tener una base estable.

  Retrasa las escápulas y tira del centro de la cuerda ligeramente hacia arriba y hacia la cara. Piensa
  en separar los extremos de la cuerda, no solo en tirar hacia atrás.

  Al acercarla a la cara, rota los brazos hacia fuera hasta que los nudillos miren al techo. Mantén la
  posición superior un segundo y baja lentamente.'
