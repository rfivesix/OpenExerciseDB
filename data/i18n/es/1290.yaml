name: Curl de bíceps con barra en agarre invertido
description: 'Sujeta la barra con un agarre prono (palmas hacia abajo) aproximadamente al ancho de los hombros. Asegúrate
  de mantener la espalda recta, los hombros ligeramente hacia atrás y los brazos completamente extendidos.

  Flexiona la barra hacia arriba en dirección al pecho con un movimiento controlado, manteniendo los codos cerca del cuerpo.
  El movimiento debe ser fluido, sin balanceos ni uso de impulso.

  Una vez que la barra esté a la altura del pecho, haz una breve pausa para maximizar la contracción en los bíceps y los antebrazos.

  Baja lentamente la barra de nuevo a la posición inicial con un movimiento controlado, extendiendo por completo los brazos.'
