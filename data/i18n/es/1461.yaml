name: Press de pecho con mancuernas sin impulso de piernas
description: Túmbate en un banco plano con una mancuerna en cada mano a la altura del pecho. Levanta los
  pies del suelo (puedes apoyar las piernas extendidas en el banco o mantenerlas elevadas) para eliminar
  el impulso de las piernas. Coloca los codos a unos 45 grados del torso. Empuja las mancuernas verticalmente
  sobre el pecho, aprieta arriba sin bloquear los codos y baja lentamente hasta que los brazos queden
  a la altura del banco.
