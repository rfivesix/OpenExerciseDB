exercise_id: '1461'
language: es
status: ai_authored
name: Press de pecho con mancuernas sin impulso de piernas
description: |-
  Posición inicial:
  • Túmbate en un banco plano con un par de mancuernas a la altura del pecho.
  • Coloca los pies sobre el propio banco o mantén las piernas elevadas en el aire para eliminar por completo el empuje con las piernas (leg drive).

  Ejecución:
  • Empuja las mancuernas hacia arriba directamente sobre el pecho utilizando exclusivamente la fuerza de los pectorales y tríceps.
  • Desciende las mancuernas lentamente hasta la altura del pecho, sintiendo el estiramiento muscular.
  • Mantén la espalda y el core estables sobre el banco en todo momento.
