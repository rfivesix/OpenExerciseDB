name: Encogimiento de hombros en máquina Smith
description: 'Posición inicial: Ponte erguido delante de la barra de la máquina Smith, con los pies separados a
  la anchura de los hombros. Sujeta la barra con agarre prono y los brazos extendidos hacia abajo.

  Ejecución: Encoge los hombros en línea recta hacia las orejas sin flexionar los codos. Mantén la contracción máxima
  arriba durante 1–2 segundos.

  Regreso: Baja los hombros lentamente y de forma controlada hasta la posición inicial.'
