name: Press de banca declinado con mancuernas
description: Toma dos mancuernas y siéntate en un banco declinado, con los pies firmes en el suelo y la
  cabeza apoyada en el banco. Sujeta las pesas junto al pecho, a la altura de los pezones, y presiónalas
  hacia arriba hasta extender los brazos. Baja las pesas despacio y con control.
