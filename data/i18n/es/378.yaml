name: Elevación de piernas en estación de fondos
description: Apoya los antebrazos en las almohadillas de la máquina de elevación de piernas y deja que
  el cuerpo cuelgue libremente. Eleva las piernas con rapidez tanto como puedas, haz una pausa breve de
  1 segundo arriba y vuelve a bajarlas. Asegúrate de que el cuerpo no se balancee; solo deben moverse
  las piernas.
