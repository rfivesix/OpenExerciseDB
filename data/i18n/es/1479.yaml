name: Sit-up con golpe de codo (Sit Up Elbow Thrust)
description: |-
  Posición inicial:
  Túmbate boca arriba en una colchoneta con las rodillas flexionadas, los pies apoyados en el suelo y las manos cerca del rostro en guardia defensiva.

  Ejecución:
  1. Incorpórate de forma explosiva realizando un sit-up mediante la contracción del abdomen.
  2. En la parte alta del movimiento, gira el torso con decisión y lanza un codazo diagonal cruzando el cuerpo con fuerza.
  3. Vuelve al centro y baja la espalda al suelo con control.
  4. Repite alternando el codazo hacia el lado opuesto en cada repetición.

  Consejos:
  Coordina la flexión espinal con la rotación explosiva arriba para activar simultáneamente el recto abdominal y los oblicuos.
