name: Abdominal con empuje de codo
description: 'Posición inicial:

  Túmbate boca arriba sobre una esterilla, con las rodillas flexionadas, los pies apoyados y las manos
  en guardia cerca de la cara.


  Ejecución:

  1. Haz un abdominal explosivo elevando el torso con los músculos abdominales.

  2. Arriba, gira el torso y dirige un codo en diagonal a través del cuerpo.

  3. Vuelve al centro y baja al suelo con control.

  4. Alterna el codo en cada repetición.


  Indicaciones:

  Combina la flexión del torso con el giro al llegar arriba.'
