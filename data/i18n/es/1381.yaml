name: Remo en máquina para espalda alta
description: |-
  Posición inicial:
  Siéntate en la máquina de remo apoyando el pecho firmemente contra la almohadilla acolchada. Ajusta la altura del asiento para que las empuñaduras queden al nivel de la parte superior del pecho. Sujeta los agarres con las manos abiertas o pronadas.

  Ejecución:
  Tira de los agarres hacia ti llevando los codos hacia afuera y hacia atrás a la altura del pecho. Junta las escápulas en la contracción final para enfocar el esfuerzo en la espalda media y alta (romboides y trapecio). Regresa lentamente a la posición inicial sintiendo el estiramiento dorsal.

  Consejos:
  Mantén el pecho pegado al soporte y no utilices balanceo lumbar para mover el peso.
