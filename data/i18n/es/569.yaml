name: Press de hombros en máquina Smith
description: 'El ejercicio es básicamente igual que con una barra libre:

  Siéntate en un banco con el respaldo casi vertical. Sujeta la barra con un agarre a la anchura de los hombros
  y bájala a la altura del pecho. Empuja el peso hacia arriba sin extender completamente los brazos. Baja lentamente
  y repite.'
