name: Elevación Trap-3
description: 'Posición inicial: Inclínate desde las caderas unos 45°, con la espalda plana y las rodillas
  ligeramente flexionadas. Apoya una mano en la rodilla o en un banco inclinado. Deja colgar el brazo
  de trabajo con el pulgar hacia arriba. Baja y retrae activamente el omóplato.


  Ejecución:

  1. Con el codo extendido, eleva el brazo en diagonal hacia delante y arriba hasta que la mano quede
  unos 15–30° por encima de la cabeza.

  2. Mantén el omóplato abajo, lejos de la oreja, para aislar el trapecio inferior (Trap 3).

  3. Pausa 1–2 segundos arriba, notando la contracción en la parte media e inferior de la espalda.

  4. Baja el brazo suavemente y con control.


  Indicaciones: No encojas el trapecio superior hacia la oreja; el objetivo es activar el trapecio inferior
  y la rotación ascendente del omóplato.'
