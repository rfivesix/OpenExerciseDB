name: Automasaje de glúteos con pelota
description: Siéntate en el suelo y coloca una pelota firme de masaje o lacrosse bajo
  un glúteo; apoya las manos detrás. Para una presión más profunda, cruza el tobillo
  de ese lado sobre la rodilla contraria. Desplaza el peso y rueda suavemente con
  movimientos pequeños sobre los glúteos y el piriforme. Al encontrar un punto sensible,
  mantén presión 20–30 segundos respirando despacio. Dedica 30 segundos–2 minutos
  por lado y evita el coxis.
