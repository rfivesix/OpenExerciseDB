name: Flexiones con déficit
description: 'Coloca en el suelo dos discos, bloques de yoga o soportes para flexiones, algo más separados
  que el ancho de los hombros. Apoya las manos sobre ellos y adopta una plancha firme, con los pies juntos
  y el abdomen activo.


  1. Baja con control flexionando los codos aproximadamente a 45 grados respecto al torso.

  2. Desciende por debajo del nivel de las manos hasta notar un estiramiento cómodo en los pectorales.

  3. Empuja con las palmas para volver a la plancha alta y extender los brazos.


  El déficit amplía el recorrido. Mantén el abdomen firme y no bajes más de lo que permite la movilidad
  de tus hombros.'
