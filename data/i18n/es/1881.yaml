name: Extensión de muñeca con mancuernas
description: 'Posición inicial: Siéntate en un banco y sujeta dos mancuernas con agarre
  prono. Apoya los antebrazos sobre los muslos o las rodillas, dejando que las muñecas
  sobresalgan ligeramente de estas.


  Ejecución: Baja las mancuernas flexionando por completo las muñecas hacia el suelo.
  Después, extiende las muñecas para elevarlas hasta donde resulte cómodo y aprieta
  los extensores del antebrazo arriba.


  Consejos: Mantén los antebrazos inmóviles durante todo el movimiento para aislar
  la extensión de muñeca.'
