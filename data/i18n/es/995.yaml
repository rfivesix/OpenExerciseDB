name: Círculos de brazos hacia atrás
description: Ponte de pie con los pies separados al ancho de los hombros y extiende los brazos a los lados
  a la altura de los hombros, con las palmas hacia abajo. Haz círculos pequeños y controlados hacia atrás,
  abriendo el pecho y activando la parte superior de la espalda. Mantén el torso estable y evita arquear
  demasiado la zona lumbar.
