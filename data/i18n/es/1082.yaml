exercise_id: '1082'
language: es
status: ai_reviewed
name: Remo inclinado con rotación externa
description: |-
  Posición inicial:
  Inclínate hacia adelante desde las caderas manteniendo la espalda recta y las rodillas ligeramente flexionadas. Deja que los brazos cuelguen rectos hacia el suelo.

  Ejecución:
  1. Tira de los codos hacia arriba hasta la altura de los hombros, manteniendo los antebrazos apuntando hacia abajo en un ángulo de 90 grados.
  2. Manteniendo los codos fijos a la altura de los hombros, rota externamente los antebrazos hacia arriba hasta que las manos queden a la altura de la cabeza.
  3. Aprieta la parte posterior de los hombros y el manguito rotador durante un instante.
  4. Rota los antebrazos de vuelta hacia abajo y extiende los brazos para regresar a la posición inicial.
