name: Press circular con mancuernas (Kreis Press)
description: |-
  Posición inicial:
  • Siéntate en un banco inclinado a unos 45 grados y mantén dos mancuernas sostenidas sobre la cabeza con los brazos extendidos.

  Ejecución:
  • Desciende las mancuernas trazando un arco circular amplio hacia los lados hasta llegar a la altura de los hombros.
  • Vuelve a empujar las mancuernas hacia arriba siguiendo una trayectoria semicircular controlada hasta juntarlas sobre la cabeza.
  • Mantén una velocidad constante para mantener la tensión sobre los deltoides.
