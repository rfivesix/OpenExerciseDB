name: Press de Kreis con mancuernas
description: Siéntate en un banco inclinado a unos 45 grados y sujeta dos mancuernas por encima de la
  cabeza con los brazos extendidos. Baja las mancuernas hacia fuera y abajo siguiendo una trayectoria
  circular hasta la altura de los hombros. Invierte el arco y vuelve a empujarlas por encima de la cabeza
  con un movimiento circular y fluido. Mantén la tensión en los deltoides delanteros y laterales sin usar
  impulso.
