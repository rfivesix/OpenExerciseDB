name: Press de pecho
description: 'Ajusta la altura del asiento para que las empuñaduras queden a la altura del pecho.

  Usa las piernas para empujar hacia delante el pedal.

  Lleva las empuñaduras a la posición inicial.

  Mantén la espalda en contacto con el respaldo y empuja hacia fuera.

  Aleja las empuñaduras del pecho mientras espiras.

  Deja que se acerquen suavemente hasta llegar al pecho.

  Permite que las empuñaduras vuelvan hacia el pecho mientras inspiras.'
