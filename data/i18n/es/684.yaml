name: Jalón al pecho con agarre supino
description: Siéntate en la máquina de jalón y ajusta los soportes para fijar bien los muslos. Sujeta
  la barra con agarre supino, a la anchura de los hombros o algo más estrecho. Lleva la barra suavemente
  hasta la parte superior del pecho, bajando y llevando atrás los codos mientras contraes dorsales y bíceps.
  Extiende lentamente los brazos hasta arriba con control y mantén la tensión en la espalda.
