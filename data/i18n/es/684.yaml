name: Jalón al pecho con agarre supino
description: '- Siéntate en la máquina de jalón ajustando las almohadillas sobre los
  muslos para asegurar una posición firme.

  - Sujeta la barra con agarre supino (palmas hacia ti) al ancho de los hombros o
  ligeramente más estrecho.

  - Tira de la barra hacia la parte superior del pecho dirigiendo los codos hacia
  abajo y atrás, apretando los dorsales.

  - Regresa lentamente hasta estirar por completo los brazos de forma controlada.'
