name: Deslizamientos de rodilla Black Widow
description: |-
  Posición inicial:
  Comienza en posición de plancha alta con las manos directamente debajo de los hombros y el cuerpo formando una línea recta desde la cabeza hasta los talones.

  Ejecución:
  1. Cruza una rodilla por debajo del torso dirigiéndola hacia el codo opuesto.
  2. Desliza la rodilla hacia arriba por el antebrazo mientras realizas una retroversión pélvica para conseguir la máxima activación de los oblicuos y el abdomen.
  3. Regresa la pierna de forma controlada a la posición de plancha.
  4. Repite el movimiento con la rodilla contraria, alternando lados.

  Consejos:
  Mantén el core firme en todo momento y evita que las caderas se hundan o se eleven en exceso.
