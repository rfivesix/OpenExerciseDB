name: Deslizamientos diagonales de rodilla, tipo Black Widow
description: 'Posición inicial:

  Colócate en plancha alta, con las manos justo debajo de los hombros y el cuerpo en línea recta desde
  la cabeza hasta los talones.


  Ejecución:

  1. Lleva una rodilla por debajo del torso hacia el codo contrario.

  2. Desliza la rodilla hacia arriba por el antebrazo, curvando la pelvis para contraer los oblicuos y
  el recto abdominal.

  3. Devuelve la pierna con control a la plancha.

  4. Repite hacia el lado contrario, alternando.


  Indicaciones:

  Evita que la zona lumbar se hunda o que las caderas giren demasiado; mantén el abdomen firme.'
