name: Cruce de poleas
description: Coloca las poleas aproximadamente a la altura de los hombros y sujeta una con cada mano.
  Da un paso adelante, con un pie delante del otro, para tener estabilidad y tensar los cables. Junta
  las manos delante de ti e intenta que se superpongan unos centímetros, cruzando así los cables.
