name: Patadas de aleteo
description: 'Túmbate boca arriba y eleva ambas piernas ligeramente del suelo, manteniéndolas rectas.

  Da patadas alternas hacia arriba y hacia abajo con un movimiento de aleteo, sin dejar que los pies toquen
  el suelo.

  Mantén el abdomen firme y la zona lumbar presionada contra el suelo durante todo el movimiento.'
