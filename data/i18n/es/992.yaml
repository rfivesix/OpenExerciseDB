name: Sentadilla dividida (derecha)
description: Da un paso largo hacia delante con la pierna derecha y separa los pies al ancho de las caderas
  para mantener el equilibrio. Mantén el torso erguido y el peso repartido entre ambos pies. Flexiona
  las dos rodillas y baja las caderas hasta que el muslo derecho quede paralelo al suelo y la rodilla
  izquierda justo por encima del suelo. Empuja con el talón delantero derecho y el antepié izquierdo para
  volver a la posición inicial. Mantén el torso vertical, evita inclinarte hacia delante y no dejes que
  la rodilla delantera sobrepase los dedos del pie.
