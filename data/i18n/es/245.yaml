name: Extensión de tríceps tumbado con mancuernas
description: 'Sujeta las mancuernas y túmbate en un banco plano de modo que aproximadamente una cuarta
  parte de la cabeza sobresalga del borde. Extiende los brazos hacia arriba y después inclina las mancuernas,
  alejándolas de los pies en un ángulo de 10 a 20 grados. Mantén los brazos en ese ángulo durante todo
  el ejercicio. Las mancuernas no deben apuntar a la cabeza, sino quedar por encima y detrás de ella;
  así los tríceps mantienen la tensión durante todo el movimiento.

  Presta atención a los codos y los brazos: solo trabajan los tríceps; el resto de los brazos no debe
  moverse.'
search_terms:
- Extensión francesa con mancuernas
