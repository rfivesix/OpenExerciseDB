name: Colgado pasivo
description: 'Posición inicial:

  Sujeta una barra de dominadas o el borde de un panel de escalada con agarre prono, aproximadamente al
  ancho de los hombros. Cuélgate con los brazos extendidos y los pies separados del suelo.


  Ejecución:

  1. Sujeta la barra firmemente.

  2. Puedes hacer una suspensión pasiva (con los hombros completamente relajados para descomprimir la
  columna) o activa (bajando y retrayendo ligeramente los omóplatos para activar los estabilizadores escapulares).

  3. Mantén la posición suspendida durante el tiempo indicado.


  Notas:

  Respira con regularidad y mantén el cuerpo quieto, sin balancearte. Ajusta la dificultad usando presas
  más estrechas, barras más gruesas o añadiendo peso.'
