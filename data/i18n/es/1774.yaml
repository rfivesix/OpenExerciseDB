name: Fondos en silla
description: "Posición inicial:\nSiéntate en el borde delantero de una silla estable\
  \ o banco. Apoya las manos junto a las caderas sujetando el borde con los dedos\
  \ hacia adelante. Extiende los brazos y desplaza la cadera hacia adelante para que\
  \ quede suspendida fuera del asiento. Mantén las piernas flexionadas (más fácil)\
  \ o estiradas (más exigente).\n\nEjecución:\n1. Flexiona los codos directamente\
  \ hacia atrás para descender el cuerpo de forma controlada.\n2. Baja hasta que los\
  \ codos formen un ángulo de unos 90 grados, manteniendo la espalda pegada a la silla.\n\
  3. Empuja con fuerza a través de las palmas para extender los brazos y regresar\
  \ arriba.\n\nConsejos:\nMantén la espalda cerca de la silla durante todo el descenso\
  \ para no forzar la articulación del hombro."
