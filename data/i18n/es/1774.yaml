name: Fondos en silla
description: 'Siéntate en el borde delantero de una silla o banco estable. Coloca las manos junto a las
  caderas y agarra el borde con los dedos hacia delante. Extiende los brazos y adelanta las caderas para
  quedar justo fuera del borde. Apoya los pies con las rodillas flexionadas (más fácil) o extiende las
  piernas con los talones en el suelo (más difícil).


  1. Baja despacio flexionando los codos hacia atrás y manteniendo la espalda cerca de la silla.

  2. Desciende hasta que los brazos queden aproximadamente paralelos al suelo, con unos 90 grados de flexión
  en los codos.

  3. Empuja con las palmas para extender los brazos y volver al inicio.


  Mantén el torso erguido y cerca de la silla; evita abrir mucho los codos.'
