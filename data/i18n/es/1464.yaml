name: Sentadilla hack con pausa
description: Colócate en la máquina hack squat con los hombros bajo las almohadillas y la espalda apoyada.
  Sitúa los pies al ancho de los hombros en la plataforma. Flexiona las rodillas y baja el carro lentamente
  hasta que los muslos queden paralelos o por debajo de la plataforma. Detente completamente de 1 a 2
  segundos abajo sin rebotar. Empuja con fuerza con los pies, activando cuádriceps y glúteos, y vuelve
  al inicio sin bloquear las rodillas bruscamente.
