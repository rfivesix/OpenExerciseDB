name: Sentadilla Hack con pausa (Pause Hack Squat)
description: |-
  Posición inicial:
  • Colócate en la máquina de sentadilla Hack, con los hombros bajo los soportes acolchados y la espalda apoyada en el respaldo.
  • Sitúa los pies a la anchura de los hombros en la plataforma.

  Ejecución:
  • Desciende el trineo de forma controlada flexionando las rodillas hasta alcanzar una profundidad adecuada.
  • Realiza una pausa estricta de 1 a 2 segundos en el punto más bajo sin rebotar.
  • Empuja la plataforma con fuerza a través de los cuádriceps para regresar a la posición inicial sin bloquear bruscamente las rodillas.
