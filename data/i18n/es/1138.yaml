exercise_id: '1138'
language: es
name: Jalón en banco inclinado con polea
description: Coloca un banco inclinado a unos 30–45 grados frente a una polea alta. Túmbate boca abajo,
  con la cabeza neutra y los pies apoyados para estabilizarte. Estira los brazos por encima de la cabeza
  y sujeta el agarre o la barra. Tira suavemente hacia la parte superior del pecho llevando los codos
  hacia abajo y atrás. El apoyo del banco limita el impulso del torso. Contrae la espalda arriba y vuelve
  a extender los brazos con control.
