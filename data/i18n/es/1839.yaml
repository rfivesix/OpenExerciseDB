name: Estiramiento de flexores de cadera sin asistencia
description: 'Posición inicial: Arrodíllate en posición de zancada con una rodilla en el suelo y la pierna
  delantera flexionada a 90°, con el pie apoyado. Mantén el torso erguido.


  Ejecución: Inclina ligeramente la pelvis, contrae el glúteo de la pierna atrasada y lleva suavemente
  las caderas hacia delante hasta notar un estiramiento profundo en la parte delantera de la cadera atrasada
  (flexores de cadera/psoas).


  Consejos: Mantén 20–30 segundos respirando de forma constante y cambia de lado. Evita arquear la zona
  lumbar.'
