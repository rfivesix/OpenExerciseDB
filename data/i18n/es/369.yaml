name: Extensión de piernas
description: La extensión de piernas es un ejercicio con resistencia que trabaja los cuádriceps. Se realiza
  en una máquina de extensión de piernas; los modelos pueden variar. Es un ejercicio de aislamiento para
  los cuádriceps y no debe considerarse un entrenamiento completo de piernas, como una sentadilla o un
  peso muerto. Flexiona las rodillas para bajar las piernas y luego extiéndelas; después, vuelve a bajarlas
  a la posición inicial.
