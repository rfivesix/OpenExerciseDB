name: Recruitment pulls en hangboard
description: 'Posición inicial:

  • Sitúate debajo de una tabla de entrenamiento de escalada (hangboard) y elige una regleta de tamaño
  específico.

  • Sujeta la regleta con una sola mano manteniendo los pies apoyados en el suelo o un escalón.

  • Ajusta un ángulo del codo abierto de 120 a 150 grados (evitando el bloqueo articular completo).


  Ejecución:

  • Ejerce una tracción hacia arriba con el máximo esfuerzo voluntario durante 3 a 5 segundos de forma
  isométrica.

  • Mantén la escápula y el hombro completamente activos y estabilizados.

  • Descansa el tiempo necesario entre series y cambia de brazo.'
