name: Extensión de tríceps en máquina
description: Siéntate en la máquina de tríceps y ajusta la altura del asiento para que los codos queden
  alineados con el eje de giro. Sujeta firmemente las asas y apoya bien la parte superior de los brazos
  en el soporte. Empuja las asas hacia abajo extendiendo los codos y contrae los tríceps sin bloquear
  las articulaciones de forma brusca. Devuelve el peso lentamente y con control, manteniendo los brazos
  apoyados e inmóviles.
