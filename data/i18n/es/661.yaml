exercise_id: '661'
language: es
status: ai_reviewed
name: Tríceps en máquina
description: '- Siéntate en la máquina de tríceps y ajusta la altura del asiento para
  alinear los codos con el eje de rotación de la máquina.

  - Sujeta los agarres firmemente y apoya la parte superior de los brazos sobre la
  almohadilla de soporte.

  - Empuja los agarres hacia abajo extendiendo los codos de forma controlada hasta
  contraer los tríceps.

  - Regresa lentamente a la posición inicial manteniendo los brazos firmemente apoyados
  en el acolchado.'
