exercise_id: '1091'
language: es
status: ai_reviewed
name: Plancha con toques de hombros
description: |-
  Posición inicial:
  Colócate en posición de plancha alta con las manos debajo de los hombros y los pies ligeramente más separados que el ancho de las caderas para lograr mayor estabilidad.

  Ejecución:
  1. Activa fuertemente el core y los glúteos para mantener la pelvis horizontal y evitar el balanceo lateral.
  2. Levanta la mano derecha del suelo y toca suavemente el hombro izquierdo con control.
  3. Apoya de nuevo la mano derecha y repite el movimiento tocando el hombro derecho con la mano izquierda.
  4. Alterna de lado a lado manteniendo el cuerpo inmóvil y compacto.
