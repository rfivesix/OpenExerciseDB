name: Press de banca inclinado con barra
description: 'Túmbate en un banco inclinado a 30–45 grados. Coloca los ojos bajo la barra, retrae y baja
  los omóplatos contra el banco y apoya los pies en el suelo. Sujeta la barra con agarre prono algo más
  ancho que los hombros, sácala del soporte y estabilízala sobre el pecho superior con los brazos extendidos.


  1. Inhala, activa el abdomen y baja la barra con control hacia la parte superior del pecho, justo debajo
  de las clavículas; mantén los codos a unos 45–70 grados del torso.

  2. Toca el pecho suavemente, sin rebotar.

  3. Empuja la barra hacia arriba describiendo un arco leve hasta extender los brazos.


  La fuente indica que una inclinación de 30–45 grados enfatiza la porción clavicular del pectoral y reduce
  la carga excesiva sobre el deltoides anterior.'
