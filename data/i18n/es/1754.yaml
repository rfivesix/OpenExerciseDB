name: Elevación lateral en plano escapular a 45°
description: 'Ponte de pie con los pies al ancho de las caderas y sujeta un par de mancuernas delante
  de los muslos, con agarre neutro o semipronado. Mantén el pecho erguido y los hombros atrás y abajo.


  1. Eleva las mancuernas en el plano escapular, unos 30–45 grados por delante de la línea lateral del
  cuerpo.

  2. Sube hasta la altura de los hombros, con los codos ligeramente flexionados y los pulgares algo orientados
  hacia arriba.

  3. Haz una pausa breve y baja lentamente hasta el inicio.


  La fuente describe esta trayectoria como una opción ergonómica para el hombro y señala que trabaja el
  deltoides lateral.'
