name: Remo sentado en polea con agarre ancho
description: Siéntate, apoya los pies en los soportes y sujeta la barra con un agarre ancho. Tira del
  peso rápidamente hacia el ombligo, no hacia la parte superior del abdomen. Mantén los brazos y los codos
  cerca del cuerpo y junta los hombros. Devuelve el peso lentamente hasta extender por completo los brazos.
