name: Plancha con elevación alterna de piernas
description: Empieza en plancha sobre los antebrazos, con los codos bajo los hombros y el cuerpo en línea
  recta. Mantén una pierna estirada, contrae los glúteos y levanta un pie unos centímetros de forma controlada.
  Haz una breve pausa arriba sin desplazar demasiado el peso, baja el pie y repite con la otra pierna.
  Evita girar las caderas, elevarlas o dejarlas caer; mantén el abdomen firme.
