name: Remo al mentón con barra EZ
description: Ponte de pie con los pies al ancho de los hombros. Sujeta la barra EZ sobre los muslos con
  agarre prono y los brazos extendidos. Eleva la barra cerca del cuerpo hasta la barbilla. Los codos apuntan
  hacia fuera y forman una V en el punto más alto. Haz una pausa breve y baja lentamente para repetir.
