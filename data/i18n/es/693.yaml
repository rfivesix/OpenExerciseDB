name: Remo al mentón con barra EZ
description: '- De pie con los pies al ancho de los hombros, sujeta la barra EZ con
  agarre prono en las curvas interiores de la barra.

  - Tira de la barra hacia arriba manteniéndola cerca del cuerpo, elevando los codos
  por encima de las muñecas hasta la altura del pecho.

  - Mantén la contracción un segundo en la parte alta y baja el peso de forma controlada
  hasta la posición de inicio.'
