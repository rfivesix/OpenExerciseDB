name: Pullback en polea con extensión de espalda
description: 'Posición inicial:

  Ajusta las poleas a la altura de la cadera o el pecho y coloca los agarres adecuados.
  Sujeta los agarres, da unos pasos hacia atrás, flexiona ligeramente las rodillas
  e inclina el torso recto hacia delante desde la cadera con los brazos extendidos.


  Ejecución:

  Tira de los agarres hacia el cuerpo mientras extiendes la espalda y abres el pecho
  al mismo tiempo. Junta las escápulas en la contracción máxima y regresa lentamente
  a la posición inicial inclinada.


  Consejos:

  Mantén la zona lumbar firme y realiza el movimiento de tirón y extensión de forma
  coordinada y sin balanceos.'
