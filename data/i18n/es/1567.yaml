name: Curl de martillo alterno con mancuernas
description: 'Posición inicial:

  Ponte de pie con las rodillas ligeramente flexionadas y los pies separados al ancho de los hombros.
  Sujeta una mancuerna en cada mano a los lados, con agarre neutro (las palmas enfrentadas).


  Ejecución:

  1. Mantén el brazo inmóvil y el codo pegado al cuerpo; flexiona un codo para llevar la mancuerna hacia
  el hombro, manteniéndola vertical.

  2. Contrae con fuerza el braquiorradial y el braquial en la parte alta del curl.

  3. Baja la mancuerna lentamente y con control hasta la posición inicial antes de repetir con el otro
  brazo.


  Indicaciones:

  Evita balancear el torso o usar impulso. El agarre neutro maximiza la tensión en el antebrazo y el braquial.'
