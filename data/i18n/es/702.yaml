name: Elevación de talones a una pierna
description: '- Colócate sobre el metatarso de un pie en el borde de un escalón o
  superficie elevada, manteniendo el otro pie en el aire.

  - Apóyate ligeramente en una pared o soporte para mantener el equilibrio.

  - Desciende el talón lentamente hasta sentir un estiramiento completo en la pantorrilla.

  - Empuja con fuerza a través del antepié elevando el talón lo más alto posible hasta
  colocarte de puntillas.

  - Mantén la contracción un segundo en la parte alta, baja de forma controlada y
  repite antes de cambiar de pierna.'
