name: Elevación de talón a una pierna
description: Apoya la parte delantera de un pie sobre un escalón o una plataforma estable y mantén el
  otro pie en el aire. Sujétate ligeramente a una pared o barandilla para mantener el equilibrio. Baja
  el talón tanto como te resulte cómodo para estirar la pantorrilla. Empuja con fuerza la parte delantera
  del pie para elevar el talón lo máximo posible y contraer el músculo. Haz una pausa breve, baja lentamente
  con control y cambia de pierna.
