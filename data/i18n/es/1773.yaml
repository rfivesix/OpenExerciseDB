name: Press inclinado en máquina Legend
description: 'Siéntate en el banco inclinado de la máquina Legend Fitness LeverEdge. Ajusta el asiento
  para que las empuñaduras convergentes queden a la altura del pecho superior. Apoya la cabeza, la espalda
  alta y los glúteos contra el respaldo, con los pies en el suelo. Sujeta las empuñaduras con agarre prono.


  1. Empuja las palancas independientes hacia arriba y hacia dentro siguiendo su recorrido convergente,
  hasta casi extender los brazos.

  2. Contrae el pecho superior (porción clavicular) al final.

  3. Baja el peso lentamente y con control, notando el estiramiento pectoral antes de la siguiente repetición.


  Mantén los omóplatos retraídos y bajos contra el respaldo.'
