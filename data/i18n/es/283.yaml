name: Elevación de piernas colgado
description: Cuélgate de una barra de dominadas con agarre prono y los brazos rectos. Mantén el abdomen
  firme y eleva las piernas hasta que queden paralelas al suelo o más arriba; las rodillas pueden estar
  rectas o ligeramente flexionadas. Después, bájalas despacio y con control.
