name: Extensión de tríceps por encima de la cabeza con barra EZ
description: 'Posición inicial:

  Siéntate con apoyo para la espalda o ponte de pie con el abdomen firme. Sujeta una barra EZ con agarre
  estrecho en pronación y elévala por encima de la cabeza hasta extender los brazos.


  Ejecución:

  1. Mantén los brazos superiores cerca de la cabeza y los codos hacia delante. Flexiona los codos lentamente
  y baja la barra detrás de la cabeza hasta unos 90°.

  2. Haz una breve pausa en la posición estirada.

  3. Extiende los codos y vuelve a subir la barra, contrayendo los tríceps arriba.


  Indicaciones:

  Evita abrir mucho los codos.'
