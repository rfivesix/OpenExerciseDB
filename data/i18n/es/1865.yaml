name: Movilidad de tobillo con banda
description: 'Posición inicial: Ancla una banda de resistencia fuerte baja detrás de ti. Arrodíllate en
  posición de zancada con el pie delantero dentro del bucle; coloca la banda justo debajo de los maléolos,
  sobre el astrágalo, de modo que tire hacia atrás y abajo.


  Ejecución: Lleva lentamente la rodilla delantera más allá de los dedos del pie, manteniendo el talón
  apoyado. Haz una pausa de 2–3 segundos al final de la dorsiflexión y vuelve.


  Consejos: La tensión posterior de la banda moviliza el astrágalo y mejora la dorsiflexión del tobillo
  sin pinzamiento articular. Haz 10–15 repeticiones controladas por pierna.'
