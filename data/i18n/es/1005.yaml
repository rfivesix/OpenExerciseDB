name: Rotación de Hombros Hacia Atrás
description: 'Este movimiento es ideal para la movilidad y el calentamiento de la articulación del hombro,
  complementando la rotación hacia adelante.

  Instrucciones:

  De pie o sentado con la espalda recta, coloca las yemas de tus dedos sobre los hombros. Dibuja círculos
  amplios y controlados con los codos, llevando el movimiento hacia atrás: primero junta los codos por
  detrás (apretando los omóplatos), luego súbelos, llévalos al frente y finalmente bájalos para completar
  el círculo.'
