name: Deslizamientos en la pared
description: Coloca los talones, los hombros, la parte posterior de la cabeza y las caderas contra la
  pared. Empieza con los brazos superiores extendidos hacia los lados y los codos flexionados a 90 grados.
  Extiende los brazos sin separarte de la pared ni arquear la espalda, imitando el movimiento de un press
  de hombros.
