exercise_id: '716'
language: es
status: ai_reviewed
name: Deslizamientos en la pared
description: '- Apoya la espalda contra una pared, manteniendo talones, glúteos, parte
  superior de la espalda y nuca en contacto con la superficie.

  - Coloca los brazos a los lados con los codos doblados a 90 grados en posición de
  ''W'', con codos y dorso de las manos apoyados en la pared.

  - Desliza lentamente los brazos hacia arriba por la pared hasta formar una ''Y'',
  sin arquear la zona lumbar ni perder el contacto con la pared.

  - Baja los brazos de forma controlada a la posición inicial contrayendo activamente
  las escápulas hacia abajo.'
