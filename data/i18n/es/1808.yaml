name: Sujeción de apoyo en barras paralelas
description: 'Colócate entre dos barras paralelas o una estación de fondos. Sujeta las barras con agarre
  neutro y súbete, saltando o empujando, hasta quedar arriba con los brazos extendidos.


  1. Baja activamente los omóplatos y aleja los hombros de las orejas, manteniendo el pecho erguido.

  2. Activa el abdomen, contrae los glúteos y junta las piernas con los dedos de los pies estirados, en
  posición de hollow body.

  3. Mantén esta posición isométrica el tiempo indicado y respira con calma.

  4. Al terminar, baja con control.


  No encojas los hombros ni dejes que la zona lumbar se hunda; mantén los omóplatos activos hacia abajo.'
