name: Sujeción en barras paralelas
description: "Posición inicial:\nColócate entre las barras paralelas. Sujeta las barras\
  \ con un agarre neutro y salta o empuja con los brazos para elevarte a la posición\
  \ de apoyo con los brazos completamente extendidos.\n\nEjecución:\n1. Empuja activamente\
  \ hacia abajo alejando los hombros de las orejas (depresión escapular).\n2. Aprieta\
  \ el abdomen y los glúteos, manteniendo las piernas juntas y extendidas.\n3. Sostén\
  \ esta posición isométrica durante el tiempo prescrito respirando de manera fluida.\n\
  4. Desciende con control al suelo al finalizar.\n\nConsejos:\nNo dejes que los hombros\
  \ se eleven hacia el cuello; mantén la tensión constante en tríceps y pecho."
