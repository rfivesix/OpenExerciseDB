exercise_id: '1102'
language: es
name: Zancadas inversas alternas
description: Ponte de pie con los pies a la anchura de las caderas y el abdomen firme; coloca las manos
  en las caderas o juntas delante del pecho. Da un paso largo y controlado hacia atrás y apoya la parte
  delantera del pie. Baja las caderas hasta que ambas rodillas queden aproximadamente a 90 grados, con
  la rodilla trasera cerca del suelo y la delantera sobre el tobillo. Empuja con el talón y el mediopié
  delanteros para volver a estar de pie. Alterna las piernas.
