name: Sentadilla con barra hexagonal
description: 'Colócate en el centro de la barra hexagonal, con los pies al ancho de los hombros. Agáchate
  con el torso erguido y sujeta las asas neutras. Lleva los hombros atrás, eleva el pecho y activa el
  abdomen.


  1. Empuja el suelo con talones y mediopié y extiende caderas y rodillas a la vez.

  2. Mantén el pecho erguido durante la subida.

  3. Ponte completamente de pie y contrae glúteos y cuádriceps.

  4. Baja el peso con control flexionando caderas y rodillas hasta que los discos toquen el suelo.


  Mantén el torso más erguido que en un peso muerto convencional para enfatizar la flexión de rodilla
  y el trabajo de cuádriceps, según la fuente.'
