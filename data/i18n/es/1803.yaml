name: Sentadilla con barra hexagonal (Trap Bar)
description: "Posición inicial:\nSitúate en el centro de la barra hexagonal (trap\
  \ bar) con los pies al ancho de los hombros. Desciende en sentadilla manteniendo\
  \ el torso erguido y sujeta los agarres neutros con firmeza. Saca pecho y activa\
  \ fuertemente el core.\n\nEjecución:\n1. Empuja con fuerza contra el suelo a través\
  \ de los talones y la planta del pie, extendiendo rodillas y caderas simultáneamente.\n\
  2. Mantén el torso levantado para enfatizar el trabajo sobre los cuádriceps y glúteos.\n\
  3. Llega a la extensión completa arriba contrayendo glúteos.\n4. Desciende la barra\
  \ con control flexionando caderas y rodillas hasta tocar el suelo.\n\nConsejos:\n\
  La barra hexagonal centra la carga de forma óptima, reduciendo la tensión sobre\
  \ la espalda baja."
