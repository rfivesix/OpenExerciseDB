name: Empuje en cuclillas
description: 'El burpee, o empuje en cuclillas, es un ejercicio de cuerpo completo utilizado en el entrenamiento
  de fuerza y también como ejercicio aeróbico. El movimiento básico consta de cuatro pasos y se conoce como burpee
  de cuatro tiempos: empieza de pie; pasa a una posición de sentadilla con las manos en el suelo (1); lleva los
  pies hacia atrás hasta una plancha con los brazos extendidos (2); devuelve enseguida los pies a la posición de
  sentadilla (3); ponte de pie desde la sentadilla (4).'
search_terms:
- Burpee sin flexión
- Burpee de cuatro tiempos
