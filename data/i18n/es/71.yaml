name: Extensión de una pierna
description: 'Posición inicial:

  Siéntate en la máquina de extensión de piernas con la espalda bien apoyada en el respaldo. Coloca la
  palanca acolchada contra la parte inferior de la espinilla de una pierna, justo encima del tobillo.
  Deja relajada la pierna que no trabaja.


  Ejecución:

  1. Extiende la pierna activa contrayendo los cuádriceps hasta que la rodilla esté casi recta.

  2. Mantén la contracción máxima arriba durante un segundo.

  3. Baja el peso despacio y de forma controlada hasta la posición inicial, sin dejar que la pila de pesas
  toque el suelo.


  Notas:

  Completa todas las repeticiones de una pierna antes de cambiar. Mantén las caderas y la espalda apoyadas
  en el asiento.'
