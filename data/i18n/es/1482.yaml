name: Curl con impulso con mancuernas
description: 'Posición inicial:

  Ponte de pie, con los pies a la anchura de los hombros, y sujeta una mancuerna pesada en cada mano,
  con las palmas hacia delante y los brazos extendidos.


  Ejecución:

  1. Haz una ligera bisagra controlada de cadera para generar el impulso necesario y subir las mancuernas
  hacia los hombros.

  2. Contrae los bíceps brevemente arriba.

  3. Baja las pesas con control estricto durante 3–4 segundos, resistiendo la carga.'
