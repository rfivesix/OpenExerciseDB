name: Cheat curl con mancuernas
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de los hombros. Sujeta una mancuerna pesada en cada mano con los brazos extendidos y agarre supino (palmas hacia delante).

  Ejecución:
  1. Utiliza un ligero balanceo coordinado de las caderas para iniciar el movimiento y superar el punto de estancamiento, elevando las mancuernas hacia los hombros.
  2. Aprieta intensamente los bíceps en el punto más alto durante un instante.
  3. Baja el peso de forma estrictamente lenta y controlada (en 3-4 segundos), aprovechando la sobrecarga excéntrica.

  Consejos:
  El impulso inicial sirve únicamente para superar la fase concéntrica y poder sobrecargar al máximo la fase negativa excéntrica.
