name: Almeja (Clamshell)
description: "Posición inicial:\nTúmbate de lado sobre una colchoneta con las caderas\
  \ flexionadas a 45 grados y las rodillas dobladas a 90 grados, manteniendo las piernas\
  \ apiladas y los talones juntos. Apoya la cabeza cómodamente sobre el brazo inferior.\n\
  \nEjecución:\n1. Manteniendo los talones pegados entre sí, eleva la rodilla superior\
  \ hacia el techo abriéndola como una concha de almeja.\n2. Sube hasta el punto máximo\
  \ sin permitir que la pelvis gire hacia atrás.\n3. Aprieta el glúteo medio durante\
  \ 1 a 2 segundos en la parte alta.\n4. Desciende la rodilla lentamente hasta la\
  \ posición inicial con total control.\n\nConsejos:\nMantén la cadera perpendicular\
  \ al suelo sin rodar hacia atrás durante la apertura."
