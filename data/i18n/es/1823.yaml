name: Almeja
description: 'Posición inicial: Túmbate de lado con las caderas flexionadas unos 45° y las rodillas a
  90°. Apila las piernas y junta los talones. Apoya la cabeza en el brazo inferior y coloca la mano superior
  en el suelo o en la cadera para estabilizarte.


  Ejecución:

  1. Mantén los pies y talones juntos y eleva lentamente la rodilla superior hacia el techo, como una
  concha que se abre.

  2. Sube hasta donde te resulte cómodo sin girar las caderas o la pelvis hacia atrás.

  3. Contrae la parte externa de la cadera y el glúteo medio durante 1–2 segundos.

  4. Baja la rodilla lentamente y con control antes de repetir.


  Indicaciones: Mantén la pelvis apilada y perpendicular al suelo, sin rodar hacia atrás. La variante
  en plancha lateral puede usarse como progresión avanzada.'
