name: Bird Dog
description: 'Posición inicial:

  Colócate a cuatro patas sobre una colchoneta, con las manos justo debajo de los hombros y las rodillas
  debajo de las caderas. Mantén la columna neutra y activa el core.


  Ejecución:

  1. Estira a la vez el brazo derecho hacia delante y la pierna izquierda hacia atrás, hasta que ambos
  queden paralelos al suelo.

  2. Haz una pausa y mantén la extensión durante 1–2 segundos. Contrae el glúteo y los erectores espinales
  sin arquear la zona lumbar.

  3. Vuelve a la posición inicial con control y cambia de brazo y pierna.


  Indicaciones:

  Mantén las caderas y los hombros paralelos al suelo. Evita girar la pelvis o hiperextender la zona lumbar.'
