name: Extensión de tríceps arrastrada en polea
description: 'Posición inicial:

  Colócate frente a una polea alta con una cuerda. Sujeta los extremos con agarre neutro, separa los pies
  a la anchura de los hombros e inclínate ligeramente desde las caderas.


  Ejecución:

  1. Deja que los codos se desplacen un poco hacia atrás mientras llevas la cuerda hacia abajo, cerca
  del torso.

  2. Extiende los codos abajo y separa los extremos de la cuerda para contraer los tríceps.

  3. Devuelve la cuerda lentamente, manteniéndola cerca del cuerpo.'
