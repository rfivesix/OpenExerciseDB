name: Drag pushdown en polea con cuerda
description: |-
  Posición inicial:
  Ponte de pie frente a una polea alta con un accesorio de cuerda. Sujeta los extremos de la cuerda con agarre neutro, pies separados al ancho de los hombros y flexiona ligeramente las caderas manteniendo el pecho erguido.

  Ejecución:
  1. Deja que los codos retrocedan ligeramente mientras empujas la cuerda hacia abajo, arrastrándola lo más pegada posible al torso.
  2. Extiende por completo los codos al final del recorrido y separa las puntas de la cuerda hacia afuera para contraer al máximo la cabeza larga del tríceps.
  3. Regresa lentamente con control manteniendo la cuerda cerca del cuerpo.

  Consejos:
  Mantener el accesorio pegado al torso permite conseguir un rango de contracción muy intenso en el tríceps.
