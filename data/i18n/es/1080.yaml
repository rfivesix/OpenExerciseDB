name: Flexiones hindúes
description: 'Posición inicial:

  Comienza en posición de perro boca abajo, con las manos algo más separadas que los hombros y las caderas
  elevadas formando una V invertida.


  Ejecución:

  1. Flexiona los codos y desciende en un arco, pasando el pecho y la cara cerca del suelo.

  2. Empuja dinámicamente hasta la posición de perro boca arriba, llevando el pecho hacia delante y los
  hombros hacia atrás.

  3. Invierte el movimiento o empuja las caderas hacia atrás y arriba para volver a la V invertida.

  4. Repite en un ciclo fluido y continuo.'
