language: es
status: ai_reviewed
name: Flexiones hindúes (Hindu Push-Ups)
description: |-
  Posición inicial:
  Comienza en posición de 'V' invertida (perro boca abajo), con los pies y las manos firmes en el suelo y las caderas empujadas hacia arriba.

  Ejecución:
  1. Flexiona los codos y baja en picado rozando el suelo con el pecho y la barbilla en un movimiento fluido hacia adelante.
  2. Empuja fuertemente con los brazos extendiéndolos para arquear el torso hacia arriba (postura de la cobra o perro boca arriba), abriendo el pecho.
  3. Empuja las caderas hacia atrás y hacia arriba para regresar a la 'V' invertida inicial.
  4. Repite el movimiento en un flujo continuo y controlado.
