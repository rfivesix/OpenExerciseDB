name: Peso muerto a una pierna con mancuerna
description: 'Posición inicial: Ponte de pie con las rodillas ligeramente flexionadas y sujeta una mancuerna
  con una o ambas manos. Apoya el peso en una pierna y despega ligeramente del suelo el otro pie.

  Bisagra: Con la espalda recta y el abdomen activo, lleva las caderas hacia atrás. Al bajar el torso,
  extiende la pierna libre detrás de ti para mantener el equilibrio, con las caderas orientadas al suelo.
  Baja la mancuerna junto a la pierna de apoyo.

  Recorrido: Continúa hasta que el torso quede casi paralelo al suelo o sientas un estiramiento intenso
  en el isquiotibial de apoyo, manteniendo la columna neutra.

  Vuelta: Haz una pausa abajo y contrae glúteos e isquiotibiales para volver lentamente al inicio; alinea
  de nuevo la pierna libre. Cambia de lado tras las repeticiones.'
