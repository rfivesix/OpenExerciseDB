exercise_id: '1441'
language: es
status: ai_reviewed
name: Press de hombros inclinado con mancuernas
description: |-
  Posición inicial:
  • Siéntate en un banco con respaldo inclinado a un ángulo elevado (entre 60° y 75°), con la espalda completamente apoyada.
  • Sujeta un par de mancuernas a la altura de los hombros con las palmas orientadas hacia delante.

  Ejecución:
  • Empuja las mancuernas hacia arriba de forma controlada hasta extender los brazos casi por completo sobre la cabeza.
  • Haz una breve pausa en la parte superior y baja lentamente las mancuernas de vuelta a la altura de los hombros.
  • Mantén los codos en un ángulo de aproximadamente 45 grados respecto al cuerpo para proteger las articulaciones.
