name: Press por encima de la cabeza con mancuernas en banco inclinado
description: Siéntate contra un banco inclinado a unos 60–75 grados, con la espalda apoyada. Sujeta una
  mancuerna en cada mano a la altura de los hombros, con las palmas hacia delante o ligeramente hacia
  dentro. Empuja las mancuernas hacia arriba en un arco controlado hasta extender los brazos sin bloquearlos
  con fuerza. Baja con control hasta que los brazos queden paralelos al suelo y notes el estiramiento
  en los deltoides delanteros.
