exercise_id: '1232'
language: es
status: ai_reviewed
name: Estiramiento de bíceps de pie (izquierdo)
description: |-
  Posición inicial:
  • Ponte de pie con tu costado izquierdo junto a una pared.
  • Extiende el brazo izquierdo hacia atrás y apoya la palma de la mano plana contra la pared a la altura del hombro.

  Ejecución:
  • Gira suavemente el torso y los pies hacia la derecha alejándote de la pared.
  • Detente al notar un estiramiento agradable en el bíceps izquierdo y la parte anterior del hombro.
  • Mantén la postura durante 20 a 30 segundos con una respiración controlada.
