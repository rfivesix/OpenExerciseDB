name: Estiramiento sentado de pantorrilla (dorsiflexión)
description: 'Beginpositie:

  Siéntate erguido en el suelo o en una esterilla, con una pierna extendida delante de ti.


  Uitvoering:

  1. Flexiona el tobillo para acercar los dedos del pie a la espinilla (dorsiflexión).

  2. Alcanza el pie con la mano o coloca una toalla alrededor de su parte delantera para profundizar suavemente
  el estiramiento de la pantorrilla y el tendón de Aquiles.

  3. Mantén el estiramiento cómodamente durante 20–30 segundos y respira con normalidad.

  4. Suelta lentamente y repite con el otro lado.


  Tips:

  Mantén la rodilla extendida sin forzarla. Es un estiramiento suave para la movilidad del tobillo y la
  recuperación de la pantorrilla.'
