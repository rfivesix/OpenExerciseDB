name: Remo al mentón en multipower
description: '- Colócate de pie frente a la barra del multipower con los pies a la
  anchura de los hombros y tómala con agarre prono algo más estrecho que los hombros.

  - Desbloquea la barra y tira de ella verticalmente hacia arriba a lo largo del cuerpo,
  liderando la subida con los codos altos.

  - Eleva la barra hasta la altura del pecho, haz una breve pausa y baja el peso de
  forma controlada hasta la posición inicial.'
