name: Remo al mentón en máquina Smith
description: El movimiento es básicamente igual que con una barra EZ, pero se usa la barra de la máquina
  multipower. Ponte de pie con los pies al ancho de los hombros. Sujeta la barra sobre los muslos con
  agarre prono y los brazos extendidos. Eleva la barra cerca del cuerpo hasta la barbilla, con los codos
  hacia fuera formando una V en el punto más alto. Haz una pausa breve y baja lentamente para repetir.
