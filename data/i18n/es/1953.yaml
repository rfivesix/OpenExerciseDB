name: Iron Cross con rodillas flexionadas
description: Túmbate boca arriba con los brazos en cruz a la altura de los hombros
  y las palmas hacia abajo. Eleva las piernas y flexiona caderas y rodillas a 90 grados,
  con las espinillas paralelas al suelo. Manteniendo los hombros apoyados, baja lentamente
  las rodillas juntas hacia un lado hasta casi tocar el suelo; vuelve al centro con
  los oblicuos y repite al otro lado. Haz 5–10 repeticiones dinámicas por lado.
