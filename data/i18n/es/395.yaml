name: Remo sentado en polea con agarre estrecho
description: 'Es el mismo ejercicio que el remo sentado en polea habitual, pero con un agarre estrecho:

  Siéntate, apoya los pies en los soportes y sujeta el asa con un agarre estrecho. Tira del peso rápidamente
  hacia el ombligo, no hacia la parte superior del abdomen. Mantén los brazos y los codos cerca del cuerpo
  y junta los hombros. Devuelve el peso lentamente hasta extender por completo los brazos.'
