name: Jalón al pecho con agarre estrecho
description: Sujeta la barra del jalón con las manos más juntas que el ancho de los hombros y las palmas
  hacia fuera. Inclínate ligeramente hacia atrás. Lleva la barra hacia el pecho manteniendo los codos
  cerca de los costados. Al final del movimiento, lleva los hombros hacia atrás.
