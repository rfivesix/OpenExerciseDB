name: Remo con barra en T
description: 'Posición inicial: ponte a horcajadas sobre la barra en T o landmine con los pies al ancho
  de los hombros. Flexiona la cadera aproximadamente 45 grados con la espalda recta y las rodillas ligeramente
  dobladas. Sujeta las asas en V con los brazos extendidos. Ejecución: lleva el peso suavemente hacia
  la parte superior del abdomen, llevando los codos atrás y juntando los omóplatos arriba. Vuelta: baja
  el peso con control hasta extender los brazos y mantén la columna neutra. Indicaciones: mantén el pecho
  elevado y evita usar demasiado impulso o redondear la zona lumbar.'
