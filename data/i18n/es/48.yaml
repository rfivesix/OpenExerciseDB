name: Curl inverso de muñeca con barra
description: 'Siéntate en un banco y sujeta una barra con las palmas hacia abajo y las manos separadas
  al ancho de los hombros. Apoya los antebrazos sobre los muslos y deja las muñecas colgando más allá
  de las rodillas.

  Flexiona las muñecas para acercar los nudillos a la cara y levantar la barra. Haz una breve pausa arriba
  y vuelve lentamente a la posición inicial.'
