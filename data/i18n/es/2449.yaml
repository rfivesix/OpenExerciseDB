name: Almeja y almeja inversa
description: 'Posición inicial:

  Túmbate de lado con las caderas y rodillas flexionadas a 90 grados y las piernas superpuestas. Mantén
  la pierna superior ligeramente suspendida en el aire.


  Ejecución:

  1. Manteniendo los talones en contacto, abre la rodilla superior hacia arriba en rotación externa (almeja
  tradicional).

  2. Baja la rodilla, junta ambas rodillas y eleva el pie superior hacia arriba en rotación interna (almeja
  inversa).

  3. Alterna de manera fluida y controlada entre ambos movimientos sin apoyar la pierna durante la serie.


  Consejos:

  Mantén la pelvis estable sin balanceos hacia atrás; concéntrate en el control del rango articular de
  la cadera.'
search_terms:
