name: Remo sentado en polea con agarre en V
description: 'Posición inicial:

  Siéntate en la máquina de remo en polea baja con los pies firmes en los soportes y las rodillas ligeramente flexionadas. Agarra el maneral en V con toma neutra, mantén el torso erguido y el pecho fuera.


  Ejecución:

  Tira del maneral en V hacia la parte baja del abdomen pegando los codos al cuerpo. Junta con fuerza las escápulas al final del recorrido y haz una pausa de un segundo. Regresa el peso hacia delante de forma lenta y controlada extendiendo los brazos por completo.


  Consejos:

  No te balancees hacia delante y hacia atrás; mantén la inclinación del torso fija para aislar la musculatura dorsal.'
