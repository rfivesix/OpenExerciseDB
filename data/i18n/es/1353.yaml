exercise_id: '1353'
language: es
status: ai_reviewed
name: Press hex con mancuernas
description: |-
  Posición inicial:
  Acuéstate sobre un banco plano con los pies bien apoyados en el suelo. Sujeta dos mancuernas (preferiblemente hexagonales) con agarre neutro y presiónalas firmemente una contra la otra sobre el pecho.

  Ejecución:
  Manteniendo una presión constante entre ambas mancuernas, bájalas de forma lenta y controlada hacia el centro del esternón. Empuja las mancuernas de vuelta hacia arriba contrayendo el pecho y los tríceps sin dejar de apretarlas entre sí.

  Consejos:
  No separes las mancuernas en ningún momento. La presión hacia adentro intensifica la activación del pectoral mayor.
