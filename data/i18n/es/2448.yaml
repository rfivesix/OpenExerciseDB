name: Almeja inversa (Reverse Clamshell)
description: |-
  Posición inicial:
  Túmbate de lado en el suelo con las caderas y las rodillas flexionadas a unos 90 grados, con las piernas alineadas una sobre otra. Apoya la cabeza cómodamente sobre el brazo inferior.

  Ejecución:
  1. Manteniendo las rodillas juntas en contacto, eleva el pie superior hacia el techo rotando internamente la cadera.
  2. Mantén la posición superior durante un segundo para sentir el trabajo en los rotadores de la cadera.
  3. Desciende el pie de forma lenta y controlada hasta la posición inicial.
  4. Realiza las repeticiones indicadas y cambia de lado.

  Consejos:
  Evita que la pelvis se desplace hacia adelante o hacia atrás; el movimiento debe limitarse a la rotación de la cadera.
