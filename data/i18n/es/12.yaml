name: Aducción de cadera sentado
description: 'Posición inicial:

  Siéntate erguido en la máquina, con la espalda bien apoyada en el respaldo y las almohadillas contra
  la parte interior de los muslos o las rodillas. Sujeta las asas laterales para estabilizarte.


  Ejecución:

  1. Junta los muslos contra las almohadillas de resistencia con un movimiento controlado, contrayendo
  los aductores.

  2. Mantén brevemente la contracción máxima cuando las almohadillas se acerquen.

  3. Invierte lentamente el movimiento y separa las piernas, controlando la carga sin dejar que las placas
  choquen.


  Notas:

  Mantén el torso estable y la espalda apoyada en el respaldo durante todo el movimiento.'
