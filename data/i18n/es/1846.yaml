name: Postura del caballo (apertura lateral)
description: 'Ponte como para una sentadilla, con los pies separados y las puntas ligeramente hacia fuera.

  Baja suavemente a una sentadilla profunda y amplia, con las caderas por debajo de las rodillas.

  Mantén la posición de 3 a 5 segundos.

  Sube con control y repite según sea necesario.'
