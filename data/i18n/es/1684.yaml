name: Thruster con mancuernas
description: 'Posición inicial: Ponte de pie con los pies separados al ancho de los hombros y sostén dos
  mancuernas a la altura de los hombros, con los codos ligeramente adelantados.


  Movimiento:

  1. Lleva las caderas hacia abajo y atrás hasta una sentadilla profunda, con los muslos al menos paralelos
  al suelo.

  2. Impúlsate de forma explosiva desde los talones y aprovecha el impulso ascendente para llevar las
  mancuernas por encima de la cabeza en un movimiento fluido.

  3. Baja las mancuernas con control hasta los hombros mientras enlazas con la siguiente repetición de
  sentadilla.


  Consejos: Mantén el pecho elevado y el abdomen firme para conservar estable la columna.'
