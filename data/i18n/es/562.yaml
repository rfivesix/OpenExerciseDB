name: Remo Shotgun
description: 'Sujeta un asa individual a una polea baja.

  Después de seleccionar el peso adecuado, colócate a unos pasos de distancia con las piernas en una posición amplia
  y escalonada. El brazo debe quedar extendido y el hombro adelantado. Esta es la posición inicial.

  Haz el movimiento retrayendo el hombro y flexionando el codo. Al tirar, supina la muñeca y gira la palma hacia
  arriba.

  Tras una breve pausa, vuelve a la posición inicial.'
