name: Shotgun Row
description: |-
  Engancha una sola agarradera a una polea baja.
  Tras seleccionar el peso correcto, sitúate un par de pasos atrás con una postura amplia de zancada. Tu brazo debe estar extendido y el hombro hacia delante. Esta será tu posición inicial.
  Realiza el movimiento retrayendo el hombro y flexionando el codo. Mientras tiras, supina la muñeca, girando la palma hacia arriba a medida que avanzas.
  Tras una breve pausa, vuelve a la posición inicial.
