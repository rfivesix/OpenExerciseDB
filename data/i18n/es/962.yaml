name: Elíptica
description: Súbete a los pedales y sujeta las barras móviles o la barra fija. Mantente erguido, con el
  pecho elevado y el tronco firme. Desliza los pies con un movimiento elíptico continuo mientras empujas
  y tiras de las barras en sentido opuesto al movimiento de las piernas. Mantén todo el pie apoyado en
  los pedales y evita encorvarte.
