name: Elevación lateral en polea por detrás de la espalda
description: 'Colócate de lado junto a una polea baja. Sujeta el agarre en D con la mano exterior, pasando
  el cable por detrás de las caderas y la espalda. Con la mano interior, sujétate a la torre e inclínate
  ligeramente hacia delante para equilibrarte.


  1. Con el codo de trabajo ligeramente flexionado, eleva el brazo hacia el lado hasta que quede paralelo
  al suelo.

  2. Contrae el deltoides lateral arriba.

  3. Baja lentamente el agarre detrás del cuerpo, manteniendo la tensión en el hombro.


  La fuente indica que el recorrido del cable detrás de la espalda evita el roce con las caderas.'
