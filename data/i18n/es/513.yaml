name: Remo en T con agarre ancho
description: La ejecución es muy parecida al remo inclinado tradicional, pero aquí la barra está fijada. Sujeta
  la barra con un agarre ancho, algo más que la anchura de los hombros, e inclínate hacia delante. El torso no queda
  paralelo al suelo, sino ligeramente inclinado. Mantén el pecho hacia fuera durante todo el ejercicio. Tira de
  la barra con rapidez hacia el ombligo, sin subirla más. Vuelve lentamente a la posición inicial. No balancees
  el cuerpo y mantén los brazos junto al torso.
