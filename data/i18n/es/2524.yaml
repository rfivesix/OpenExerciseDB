name: Good morning en postura escalonada
description: 'Posición inicial:

  Apoya una barra sobre la parte superior de la espalda, en el trapecio, como para una sentadilla. Adelanta
  un pie medio paso para adoptar una postura escalonada. Mantén la pierna delantera casi recta y flexiona
  ligeramente la rodilla trasera para equilibrarte.


  Ejecución:

  1. Inclínate desde las caderas y lleva los glúteos hacia atrás, manteniendo el pecho abierto y la columna
  neutra.

  2. Baja el torso hasta sentir un estiramiento profundo en los isquiotibiales de la pierna delantera;
  detente cuando el torso esté aproximadamente paralelo al suelo.

  3. Lleva las caderas hacia delante y contrae glúteos e isquiotibiales para volver erguido con suavidad.

  4. Completa las repeticiones de un lado, cambia la posición de los pies y repite.


  Consejos:

  Mantén la mayor parte de la carga sobre el talón y la cadera delanteros. No redondees la zona lumbar
  durante la bisagra de cadera.'
