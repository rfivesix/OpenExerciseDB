name: Curl araña con mancuernas
description: |-
  Posición inicial:
  Ajusta un banco inclinable a unos 45 grados. Colócate boca abajo apoyando el pecho firmemente contra el respaldo acolchado, con la cabeza sobresaliendo del borde superior y las puntas de los pies apoyadas en el suelo para mayor estabilidad. Sujeta una mancuerna en cada mano dejando colgar los brazos verticalmente con las palmas hacia delante (agarre supino).

  Ejecución:
  1. Manteniendo los brazos perpendiculares al suelo y los codos fijos, flexiona los codos para elevar las mancuernas hacia los hombros.
  2. Aprieta fuertemente los bíceps en el punto de máxima contracción durante 1 o 2 segundos.
  3. Desciende las mancuernas de forma lenta y controlada (en 3-4 segundos) hasta la posición inicial de completa extensión.

  Consejos:
  El soporte del banco evita cualquier tipo de balanceo o impulso con el cuerpo, aislando el trabajo en los bíceps.
