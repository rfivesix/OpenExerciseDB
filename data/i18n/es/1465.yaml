name: Curl araña con mancuernas
description: Ajusta un banco a unos 45 grados. Túmbate boca abajo con el pecho apoyado, la cabeza por
  encima del banco y los pies firmes en el suelo. Sujeta una mancuerna en cada mano, con los brazos colgando
  verticales y las palmas hacia delante. Mantén los brazos superiores quietos y perpendiculares al suelo
  mientras flexionas los codos y subes las mancuernas hacia los hombros. Aprieta los bíceps arriba durante
  1 a 2 segundos. Baja con control durante 3 a 4 segundos hasta extender los brazos. El apoyo del pecho
  reduce el balanceo del cuerpo y centra la tensión en los bíceps.
