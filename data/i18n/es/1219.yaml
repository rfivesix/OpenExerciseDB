exercise_id: '1219'
language: es
status: ai_authored
name: Dominadas australianas (remo invertido)
description: Túmbate bajo una barra alta o de suspensión colocada a una altura adecuada. Colócate boca
  arriba bajo la barra y agárrala en supinación (con las palmas hacia ti). Ajusta la posición para mantener
  el cuerpo alineado desde la cabeza hasta los pies, con los brazos extendidos, los hombros estabilizados
  y las piernas alineadas. Flexiona los codos y tira del pecho hacia la barra contrayendo la espalda;
  intenta acercar los omóplatos. Mantén brevemente la contracción en la parte alta para maximizar la activación
  muscular. Vuelve lentamente a la posición inicial extendiendo los codos.
