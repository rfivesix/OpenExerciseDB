exercise_id: '1219'
language: es
status: ai_reviewed
name: Dominadas australianas (remo invertido)
description: |-
  Posición inicial:
  • Colócate boca arriba debajo de una barra a la altura de la cintura y sujétala en agarre supino (palmas hacia ti) al ancho de los hombros.
  • Mantén el cuerpo en línea recta desde los talones hasta la cabeza activando glúteos y abdomen.

  Ejecución:
  • Flexiona los codos y tira del pecho hacia la barra contrayendo la espalda y los bíceps.
  • Junta las escápulas en la parte alta del movimiento y mantén la contracción durante un segundo.
  • Desciende lentamente hasta que los brazos queden completamente extendidos.
