name: Plancha lateral
description: 'Posición inicial: Túmbate de lado con las piernas extendidas y el antebrazo directamente debajo del
  hombro, perpendicular al cuerpo.

  Ejecución: Contrae los oblicuos y eleva las caderas del suelo hasta formar una línea recta desde la cabeza hasta
  los tobillos.

  Regreso / mantenimiento: Mantén la posición rígida durante el tiempo indicado, con las caderas elevadas y sin
  dejar que caigan.'
