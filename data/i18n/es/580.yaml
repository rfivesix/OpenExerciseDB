description: La plancha lateral es un entrenamiento eficaz para fortalecer el tronco. Puede ayudarlo a fortalecer y desarrollar
  los músculos de la parte superior e inferior del cuerpo. Al ser un movimiento multifuncional, este ejercicio se enfoca no
