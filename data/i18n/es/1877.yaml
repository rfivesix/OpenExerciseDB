name: Retracción escapular con banda
description: Sujeta un extremo de una banda de resistencia a una pared, poste u otro soporte vertical
  a la altura del hombro. Pasa el brazo por el bucle a la altura del tríceps. Aléjate hasta que la banda
  quede tensa y tira del codo y el hombro hacia atrás contra la resistencia.
