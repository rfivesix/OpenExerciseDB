name: Balanceo con kettlebell
description: 'Sujeta firmemente la kettlebell con ambas manos. Mantén la espalda recta durante todo el
  movimiento, sin redondear la columna. Con las rodillas ligeramente flexionadas, lleva las caderas hacia
  atrás y deja que la kettlebell pase entre las rodillas.

  Inclínate desde las caderas todo lo que puedas sin redondear la espalda. Después, impulsa las caderas
  rápidamente hacia delante y ponte erguido.

  La velocidad del movimiento hará que los brazos y la kettlebell se balanceen hacia delante. No intentes
  levantar la pesa con los brazos: el impulso de las caderas la hará avanzar. Según el peso de la pesa
  rusa y la rapidez del movimiento de cadera, los brazos llegarán aproximadamente a la altura de los hombros.
  En el punto más alto, vuelve a llevar las caderas atrás mientras la pesa baja entre las piernas para
  iniciar la siguiente repetición.'
