name: Thruster
description: '- Sujeta una barra en posición de front rack, apoyada delante de los hombros, y ponte de pie con los
  pies a la anchura de los hombros.

  - Baja en una sentadilla frontal profunda hasta que los muslos queden al menos paralelos al suelo.

  - Impúlsate explosivamente desde los talones y aprovecha el impulso de las piernas para empujar la barra por encima
  de la cabeza en un movimiento fluido.

  - Baja la barra con control hasta los hombros y enlaza con la siguiente sentadilla.'
