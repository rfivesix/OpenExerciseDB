name: Thruster
description: '- Sostén una barra en la posición de rack frontal sobre los hombros,
  de pie con los pies a la anchura de los hombros.

  - Desciende en una sentadilla frontal profunda hasta que los muslos queden al menos
  paralelos al suelo.

  - Empuja explosivamente hacia arriba aprovechando el impulso de las piernas para
  empujar la barra sobre la cabeza en un movimiento fluido.

  - Baja la barra con control hacia los hombros y enlaza suavemente con la siguiente
  sentadilla.'
