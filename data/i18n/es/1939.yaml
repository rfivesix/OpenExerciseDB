name: Rotaciones articulares controladas del cuello (CARs)
description: De pie o sentado, mantén la postura erguida, baja y retrae las escápulas
  y activa suavemente el tronco. Lleva despacio la barbilla al pecho; deslízala hacia
  la clavícula y el hombro derechos, inclina la oreja y traza un arco hacia atrás
  sin pellizcar el cuello. Continúa hacia el hombro izquierdo, baja la barbilla por
  la clavícula y vuelve al centro. Haz 3 círculos lentos y luego cambia de sentido.
  Mantén inmóviles hombros y torso, dentro de un rango sin dolor.
