name: Press militar con barra EZ
description: Ponte de pie y sujeta una barra EZ a la altura de los hombros, delante de la parte superior
  del pecho, con agarre prono. Afianza el tronco y empuja la barra verticalmente por encima de la cabeza
  hasta extender los brazos. Baja la barra suavemente y de forma controlada hasta la parte superior del
  pecho y repite.
