name: Limpiaparabrisas isométrico
description: 'Colócate en posición de flexión con las manos algo más separadas que la anchura de los hombros.

  Desplaza el peso del cuerpo lo más posible hacia un lado y flexiona el codo de ese lado.

  Invierte el movimiento y desplázate completamente hacia el otro lado.

  Vuelve a la posición inicial y repite el número deseado de repeticiones.'
