name: Palanca de codo
description: 'Posición inicial: Arrodíllate en el suelo y coloca las manos sobre la colchoneta, con los
  dedos hacia atrás o girados hacia fuera. Inclina el torso hacia delante y apoya firmemente ambos codos
  en la parte baja del abdomen o contra las crestas ilíacas.


  Ejecución: Inclina el centro de masa hacia delante, más allá de las manos, hasta que la cabeza baje
  un poco y los pies se eleven naturalmente del suelo. Contrae activamente los erectores espinales, los
  glúteos y el tronco para extender las piernas y llevar todo el cuerpo a una posición horizontal y paralela
  al suelo. Mantén el equilibrio sobre las manos, con los codos como punto de apoyo. Sostén la posición
  estática durante el tiempo indicado, respirando superficialmente, y baja los pies de forma controlada.


  Indicaciones: Mantén las manos apoyadas y desplázate hacia delante hasta encontrar el punto de equilibrio;
  evita que los hombros se hundan.'
