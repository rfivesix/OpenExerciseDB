exercise_id: '1194'
language: es
status: ai_reviewed
name: Press Pallof en polea
description: |-
  Posición inicial:
  • Colócate de pie de lado a la máquina de polea con la altura ajustada al nivel del pecho.
  • Sujeta el agarre con ambas manos y mantenlo pegado al centro del pecho.
  • Separa los pies al ancho de los hombros con las rodillas ligeramente flexionadas y el core bien activo.

  Ejecución:
  • Empuja las manos en línea recta hacia delante hasta extender los brazos casi por completo.
  • Resiste activamente la fuerza de rotación que ejerce el cable, manteniendo hombros y cadera mirando al frente.
  • Mantén la posición extendida durante 1 o 2 segundos y regresa lentamente las manos al pecho.
