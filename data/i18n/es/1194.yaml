name: Press Pallof en polea
description: 'Posición inicial:

  Ponte de lado a una máquina de polea ajustada a la altura del pecho. Sujeta el agarre con ambas manos
  y mantenlo junto al centro del pecho. Separa los pies a la anchura de los hombros, flexiona ligeramente
  las rodillas y activa el abdomen y los glúteos.


  Ejecución:

  1. Empuja el agarre recto hacia delante hasta extender los brazos por completo.

  2. Resiste la fuerza de rotación de la polea manteniendo hombros y caderas orientados al frente.

  3. Mantén la posición extendida durante 1–2 segundos y devuelve las manos al pecho con control.'
