name: Balanceos de dorsiflexión de tobillo
description: 'Adopta una posición de media rodilla sobre una colchoneta, con una rodilla apoyada y el
  pie delantero plano, a una distancia aproximada de una espinilla. Apoya las manos en el muslo delantero
  para equilibrarte.


  1. Lleva lentamente la rodilla delantera hacia delante, siguiendo la dirección de los dedos, y mantén
  el talón apoyado.

  2. Avanza hasta el final del recorrido de dorsiflexión del tobillo, donde notes un estiramiento profundo
  en la pantorrilla y el tendón de Aquiles.

  3. Mantén el estiramiento 2–3 segundos.

  4. Retrocede suavemente y repite el balanceo antes de cambiar de pierna.


  No levantes el talón delantero; la fuente indica que mantenerlo apoyado es importante para movilizar
  el tobillo y el sóleo.'
