name: Movilidad de dorsiflexión de tobillo
description: "Posición inicial:\nAdopta una posición de medio arrodillado con una\
  \ rodilla apoyada en el suelo y el pie adelantado plano y firme sobre la colchoneta.\n\
  \nEjecución:\n1. Desplaza la rodilla delantera hacia adelante pasando por encima\
  \ de la punta de los pies sin despegar el talón del suelo.\n2. Alcanza el rango\
  \ máximo de dorsiflexión del tobillo y mantén la posición durante 2 o 3 segundos.\n\
  3. Regresa suavemente a la posición inicial y repite el movimiento de oscilación\
  \ rítmica antes de cambiar de pierna.\n\nConsejos:\nAsegúrate de que el talón permanezca\
  \ siempre en contacto con el suelo durante todo el estiramiento."
