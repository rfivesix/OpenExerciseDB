name: Press militar con barra desde topes
description: Coloca la barra sobre los topes de seguridad del rack a la altura de la barbilla. De pie,
  con los pies al ancho de los hombros, agarra la barra algo más ancho y activa todo el cuerpo. Aprieta
  el abdomen y los glúteos y empuja la barra explosivamente desde los topes hasta extender los codos por
  encima de la cabeza, inclinando ligeramente la cabeza al pasar la barra por la cara. Devuélvela con
  control a los topes, deja que se detenga brevemente manteniendo la tensión y repite. Al empezar desde
  una parada completa se elimina el impulso elástico y se trabaja la fuerza concéntrica de los deltoides
  delanteros y tríceps.
