name: Curl martillo en polea
description: 'Sujeta el cable con las palmas paralelas y enfrentadas, manteniendo el cuerpo recto. Flexiona
  los brazos y eleva el peso con un movimiento rápido. Sin pausa, bájalo despacio y con control, sin extender
  completamente los brazos.

  No balancees el cuerpo: los bíceps deben hacer el trabajo. Mantén los codos a los lados, sin moverlos.'
