name: Ice Cream Maker
description: 'Posición inicial:

  Empieza en la parte superior de una dominada o chin-up, con los brazos flexionados y el pecho cerca
  de la barra.


  Ejecución:

  1. Empuja el torso hacia atrás con los hombros y los brazos, manteniendo firme el abdomen y extendiendo
  los brazos hasta alcanzar una posición horizontal de front lever.

  2. Desde esa posición, tira del cuerpo hacia arriba en un arco fluido hasta volver arriba de la dominada.

  3. Repite con un ritmo controlado.


  Consejos:

  La fuente indica que requiere mucha fuerza en los dorsales y control dinámico del tronco.'
