name: Press de hombros en máquina
description: 'Posición inicial: Siéntate en la máquina de press de hombros y ajusta la altura del asiento para que
  las asas queden a la altura de los hombros. Mantén la espalda apoyada en el respaldo y los pies planos en el suelo.

  Ejecución: Empuja las asas por encima de la cabeza de forma controlada hasta extender los brazos, sin bloquear
  los codos.

  Regreso: Baja el peso lentamente hasta la posición inicial, a la altura de los hombros.'
