name: Rueda abdominal
search_terms:
- "Despliegue con rodillo abdominal"
- "Rueda abdominal"
description: 'Posición inicial:

  Arrodíllate sobre una colchoneta acolchada, con las rodillas separadas al ancho de las caderas. Sujeta
  con firmeza las asas de la rueda abdominal y apóyala en el suelo delante de las rodillas.


  Ejecución:

  1. Contrae los abdominales, inclina ligeramente la pelvis hacia atrás y rueda despacio hacia delante,
  extendiendo el cuerpo hacia el suelo.

  2. Desplázate solo hasta donde puedas mantener la columna neutra y la zona lumbar ligeramente redondeada,
  sin hundirla.

  3. Tira con los abdominales y los dorsales para volver a rodar hasta la posición inicial.


  Indicaciones:

  Es un ejercicio de anti-extensión para el recto abdominal y el transverso del abdomen. No permitas que
  la zona lumbar se hunda en una extensión excesiva.'
