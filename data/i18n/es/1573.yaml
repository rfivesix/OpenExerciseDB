name: Rueda abdominal
description: 'Posición inicial: Arrodíllate en el suelo con la rueda abdominal frente
  a ti.

  Agarra la rueda: Sujeta los mangos con firmeza.

  Despliega: Rueda lentamente hacia delante, extendiendo el cuerpo mientras mantienes
  el core apretado.

  Regresa: Tira de la rueda de vuelta hacia las rodillas, manteniendo la tensión en
  el core.'
