name: Puente de glúteo a una pierna (empuje de cadera unilateral)
description: Túmbate boca arriba. Flexiona una rodilla y apoya ese pie cerca de los
  glúteos; extiende la pierna contraria en línea con el muslo o hacia el techo. Con
  los brazos a los lados, empuja con el talón apoyado y eleva la cadera hasta alinear
  torso y muslo. Contrae el glúteo, baja despacio sin descansar del todo y repite.
  Completa un lado antes de cambiar; mantén las caderas niveladas.
