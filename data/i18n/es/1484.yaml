name: Cruce de poleas en varios ángulos
description: 'Posición inicial:

  Coloca una polea arriba y la otra abajo en una estación doble. Sitúate en el centro, con una pierna
  adelantada, y sujeta ambos agarres.


  Ejecución:

  1. Lleva el cable bajo hacia arriba y en diagonal a través del torso.

  2. A la vez o por separado, lleva el cable alto hacia abajo y cruzando el cuerpo.

  3. Al terminar la serie, invierte la altura de las poleas para trabajar ambos lados del pecho.


  Indicaciones:

  Ajusta la carga según la dirección del tirón.'
