language: es
status: ai_reviewed
name: Cruce de poleas omni (Omni Cable Crossover)
description: |-
  Posición inicial:
  Coloca una polea en la posición más alta y la otra en la posición más baja de la estación de poleas. Sitúate en el centro con una postura de pies escalonada y sujeta ambos agarres.

  Ejecución:
  1. Tira de la polea baja hacia arriba y diagonalmente a través del torso para activar las fibras superiores del pectoral.
  2. Lleva la polea alta hacia abajo y cruzando el cuerpo para reclutar la parte inferior del pecho.
  3. Al finalizar la serie, invierte las alturas de las poleas para entrenar ambos lados por igual.

  Consejos:
  Adapta las cargas según la dirección del movimiento: en la trayectoria descendente se suele poder mover un 20-40 % más de carga que en la ascendente.
