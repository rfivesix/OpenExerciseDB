name: Aperturas de pecho en máquina
description: 'Posición inicial: siéntate en la máquina de aperturas con la espalda y la cabeza apoyadas
  firmemente. Ajusta el asiento para que las asas o almohadillas queden a la altura de la mitad del pecho.
  Sujeta las asas con los codos ligeramente flexionados y mantén ese ángulo. Ejecución: contrae los pectorales
  para juntar las asas delante del pecho en un arco suave, como un abrazo. Aprieta en la contracción máxima.
  Vuelta: invierte lentamente el movimiento y deja que el pecho se estire bajo control, sin permitir que
  las placas se apoyen entre repeticiones. Indicaciones: mantén los hombros bajos y retraídos; no los
  dejes rodar hacia delante.'
