name: Elevación de talones en máquina hack squat
description: 'Colócate en la máquina con la espalda bien apoyada en el respaldo y los pies sobre la plataforma
  para la elevación de talones. Comprueba que la mitad de cada pie quede fuera y que puedas estirar completamente
  los gemelos hacia abajo.

  Con las rodillas rectas, eleva el peso todo lo que puedas. Bájalo con un movimiento fluido hasta estirar
  por completo los gemelos. Repite.'
