name: Elevación frontal con mancuernas
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de las caderas, sosteniendo una mancuerna en cada mano
  delante de los muslos con agarre prono.


  Ejecución:

  1. Con los codos ligeramente flexionados, eleva las mancuernas hacia adelante hasta la altura de los
  hombros o los ojos.

  2. Haz una pausa breve arriba contrayendo la porción anterior del deltoides.

  3. Desciende lentamente de forma controlada sin balancear el cuerpo.'
