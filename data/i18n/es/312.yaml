name: Plancha declinada sobre pelota suiza con toque alterno de los dedos
description: 'Realiza una plancha con las piernas elevadas y los pies sobre una pelota de gimnasia. Cuando
  estés estable, separa lentamente un pie hacia un lado de la pelota, tócalo en el suelo y vuelve a la
  posición inicial. Alterna con el otro pie.

  Es un ejercicio para el tronco.'
