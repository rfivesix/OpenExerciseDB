name: Elevaciones frontales
description: 'Para realizar el ejercicio, ponte de pie con los pies a la anchura de los hombros y sujeta
  las pesas o los agarres de resistencia a los lados, con agarre prono.

  Eleva los brazos delante del cuerpo hasta la altura de los ojos, con una ligera flexión de los codos.
  El movimiento trabaja el deltoides anterior, que levanta el peso.

  Mantén el cuerpo quieto para que el deltoides anterior realice el trabajo; si no puedes levantar el
  peso sin balancearte, reduce la carga. Mantén los codos ligeramente flexionados: bloquearlos aumenta
  la tensión en la articulación y podría causar lesiones.

  También se puede usar un agarre neutro, como en un curl martillo. En esta variante, eleva el peso hasta
  la altura de los ojos, pero en un ángulo de 45 grados respecto al frente del cuerpo. Esto puede ser
  beneficioso para algunas lesiones de hombro, en particular las relacionadas con el manguito rotador.'
