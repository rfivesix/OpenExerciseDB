name: Press de banca isométrico
description: 'Posición inicial: Túmbate en un banco con los ojos directamente debajo de la barra. Junta
  y baja las escápulas, apoya firmemente los pies en el suelo y sujeta la barra con agarre prono, algo
  más ancho que los hombros. Saca la barra del soporte y estabilízala sobre el pecho con los brazos extendidos.


  Ejecución: Baja la barra de forma controlada hasta la altura objetivo (por ejemplo, a 2,5 a 5 cm del
  pecho o en tu punto de bloqueo). Como alternativa, empuja contra los topes inmóviles de seguridad colocados
  en un rack. Mantén la barra completamente inmóvil en esa posición durante el tiempo indicado, generando
  tensión máxima en el pecho, los deltoides anteriores y los tríceps. Cuando termine el tiempo, empuja
  la barra hasta la posición inicial con los brazos extendidos o vuelve a colocarla con cuidado en el
  soporte.


  Indicaciones: Mantén todo el cuerpo tenso y empuja continuamente con los pies. En las pausas con peso
  libre, no apoyes la barra sobre las costillas ni rebotes con ella.'
