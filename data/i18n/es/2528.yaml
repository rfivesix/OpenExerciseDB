name: Estiramiento de sentadilla con alcance hacia arriba
description: 'Posición inicial: Separa los pies al ancho de los hombros y baja las caderas hasta una sentadilla
  profunda sin peso. Sujeta el tobillo o el pie derecho con la mano contraria (izquierda) para estabilizarte.


  Ejecución: Mantén la sentadilla profunda y gira el torso y el pecho hacia la derecha. Lleva el brazo
  derecho hacia arriba y atrás, hacia el techo, siguiendo la mano con la mirada. Haz una pausa de 1 a
  2 segundos al final del giro y nota el estiramiento en la columna torácica, la ingle y el pecho. Vuelve
  suavemente a la sentadilla neutra. Completa las repeticiones de ese lado y luego cambia las manos para
  girar a la izquierda.


  Indicaciones: Mantén ambos talones apoyados en el suelo y empuja las rodillas hacia fuera; inicia el
  giro en la zona media de la espalda (columna torácica), no en el cuello.'
