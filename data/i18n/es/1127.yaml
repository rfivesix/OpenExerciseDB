name: Jalón al pecho con agarre supino estrecho
description: 'Posición inicial:

  • Siéntate en la máquina de jalón y ajusta los rodillos para fijar bien los muslos.

  • Sujeta la barra con un agarre supino cerrado (palmas hacia ti), a la anchura de los hombros o ligeramente
  más estrecho.

  • Mantén el pecho elevado y la espalda erguida con una ligera curvatura natural.


  Ejecución:

  • Tira de la barra hacia abajo en dirección a la parte superior del pecho, llevando los codos pegados
  al cuerpo hacia abajo y atrás.

  • Aprieta los dorsales y junta las escápulas en la parte inferior del movimiento.

  • Regresa de forma controlada y lenta a la posición inicial hasta que los brazos queden completamente
  extendidos.'
