name: Estiramiento intenso del hombro
description: 'Posición inicial: Ponte erguido de espaldas a un banco plano o una barra
  a la altura de la cintura. Coloca ambas manos detrás sobre el borde, con las palmas
  hacia abajo, o sujeta un poste firme detrás de ti.


  Ejecución: Baja cuidadosamente las caderas o da un pequeño paso hacia delante para
  llevar los brazos a extensión detrás del torso. Mantén el pecho elevado y las escápulas
  juntas hasta sentir un estiramiento profundo en las partes anterior y lateral de
  los deltoides. Mantén la posición 30–60 segundos mientras respiras lenta y profundamente.


  Consejos: No dejes que los hombros rueden hacia delante ni se encojan hacia las
  orejas. La fuente propone hacerlo después de entrenar para aliviar la tensión de
  los presses pesados.'
search_terms:
