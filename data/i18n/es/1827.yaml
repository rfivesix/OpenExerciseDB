name: Presión abdominal con ambas piernas
description: "Posición inicial:\nTúmbate boca arriba sobre una colchoneta con caderas\
  \ y rodillas flexionadas a 90 grados en posición de mesa. Pega la zona lumbar firmemente\
  \ contra el suelo. Coloca las palmas de las manos sobre los muslos, justo por encima\
  \ de las rodillas.\n\nEjecución:\n1. Empuja con fuerza las manos contra los muslos\
  \ mientras resistes empujando los muslos contra las manos con igual intensidad.\n\
  2. Genera una potente contracción isométrica en toda la pared abdominal.\n3. Mantén\
  \ este esfuerzo isométrico durante 10 a 15 segundos sin cortar la respiración.\n\
  4. Libera la presión lentamente y descansa antes de la siguiente repetición.\n\n\
  Consejos:\nLa espalda baja no debe despegarse del suelo en ningún instante."
