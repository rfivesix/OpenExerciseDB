name: Press abdominal con ambas piernas
description: 'Posición inicial: Túmbate boca arriba en una esterilla. Eleva las piernas en posición de
  mesa, con caderas y rodillas a 90°. Presiona la zona lumbar contra el suelo y coloca las palmas sobre
  los muslos, justo por encima de las rodillas.


  Ejecución:

  1. Empuja las manos con toda la fuerza contra los muslos y, a la vez, empuja los muslos contra las manos
  con la misma fuerza.

  2. Mantén una contracción isométrica máxima de toda la pared abdominal y la zona profunda del core (transverso
  abdominal).

  3. Sostén la tensión 10–15 segundos, respirando de forma superficial y rítmica.

  4. Suelta la tensión con suavidad, descansa brevemente y repite.


  Indicaciones: Mantén la zona lumbar pegada al suelo y no contengas la respiración.'
