name: Curl de bíceps en polea con agarre prono
description: Ponte frente a una polea ajustada a schouder- of borsthoogte. Sujeta el accesorio con un
  agarre prono. Mantén la parte superior de los brazos paralela al suelo y flexiona los codos para llevar
  el accesorio hacia la cara o la parte superior del pecho, contrayendo el braquiorradial y los músculos
  del antebrazo. Extiende lentamente los brazos hasta la posición inicial, manteniendo la tensión.
