name: Remo Kroc
description: 'Posición inicial:

  Apoya una mano y una rodilla en un banco plano, o una mano en un soporte firme para mancuernas. Mantén
  la espalda recta y el abdomen firme. Sujeta una mancuerna pesada con la mano libre y deja colgar el
  brazo.


  Ejecución:

  1. Tira de la mancuerna hacia la cadera; se permite un pequeño impulso controlado del cuerpo para iniciar
  el movimiento con una carga pesada.

  2. Lleva el codo arriba y atrás y contrae la espalda en la posición final.

  3. Baja la mancuerna con control en todo el recorrido, dejando que el hombro se estire abajo.'
