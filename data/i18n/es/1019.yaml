name: Plancha lateral derecha
description: 'Posición inicial:

  Túmbate sobre tu costado derecho con las piernas estiradas y los pies juntos o escalonados. Apoya el
  codo derecho directamente debajo del hombro derecho, con el antebrazo firme en el suelo.


  Ejecución:

  1. Activa el abdomen, los oblicuos y los glúteos, y eleva las caderas del suelo hasta formar una línea
  recta desde la cabeza hasta los pies.

  2. Mantén la pelvis alineada sin dejar que caiga hacia el suelo ni que rote hacia adelante.

  3. Sostén la posición de forma estática durante el tiempo indicado respirando con normalidad.'
