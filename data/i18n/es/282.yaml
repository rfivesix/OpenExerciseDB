name: Flexión en pino
description: La flexión en pino, también llamada flexión vertical o invertida (o «commandos»), es una
  variante de la flexión en la que el cuerpo se coloca en posición de pino. En la versión estricta, se
  mantiene el pino libre, sin apoyo. Mientras se desarrolla la fuerza y el equilibrio necesarios, los
  pies pueden apoyarse contra una pared, sostenerse con ayuda de otra persona o asegurarse de otra forma
  para evitar caer. La flexión en pino requiere mucha fuerza y, si se realiza sin apoyo, también equilibrio
  y control.
