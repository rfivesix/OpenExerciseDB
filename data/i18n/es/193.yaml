name: Press diagonal de hombros
description: Siéntate en la máquina de press de banca con la espalda ligeramente inclinada hacia atrás.
  La barra debe quedar a unos 20 cm delante de ti. Empújala y vuelve a llevarla atrás, como en un press
  de banca. En esta posición se trabajan mucho menos los músculos del pecho, lo que puede ser útil si
  quieres entrenar aunque el pecho aún no se haya recuperado.
