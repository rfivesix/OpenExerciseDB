name: Estiramiento intenso de dorsales
description: Ponte frente a un poste firme o un rack y sujétalo por encima de la cabeza
  con una o ambas manos. Da un paso atrás, lleva la cadera hacia atrás y baja el pecho
  hacia el suelo. Desplaza el peso hacia atrás hasta notar el estiramiento en el lateral
  de la espalda, desde la axila hacia la cadera. Mantén 30–60 segundos respirando
  profundamente, sin forzar ni dar tirones.
