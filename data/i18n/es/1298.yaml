name: Extensión de tríceps cruzada en polea alta
description: 'La extensión de tríceps cruzada en polea alta es un ejercicio de aislamiento para trabajar
  el tríceps,

  en particular la cabeza larga. Se utilizan cables y agarres sujetados con las manos contrarias, lo que
  permite un movimiento de empuje único que puede ser eficaz para desarrollar la fuerza del tríceps. A
  diferencia de los ejercicios que usan una barra recta o una cuerda, esta variante puede resultar más
  cómoda para tus muñecas y codos.'
