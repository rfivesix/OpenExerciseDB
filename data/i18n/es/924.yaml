name: Cruce de Poleas
description: |-
  Ubica las poleas en una posición alta. Toma los agarres, da uno o dos pasos hacia adelante e inclina el torso ligeramente, manteniendo la espalda recta. Con una leve flexión en los codos, junta las manos al frente de tu pecho en un movimiento de arco amplio, apretando los pectorales. Regresa de forma controlada.
