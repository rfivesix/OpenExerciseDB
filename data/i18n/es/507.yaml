name: Peso muerto rumano
description: 'Posición inicial: Ponte de pie con los pies al ancho de las caderas y sujeta una barra delante
  de los muslos con agarre prono al ancho de los hombros. Lleva los hombros atrás y abajo y afianza el
  tronco.

  Ejecución: Lleva las caderas hacia atrás e inclina el torso desde las caderas. Mantén la espalda recta
  y una ligera flexión fija en las rodillas. Baja la barra cerca de los muslos y las espinillas hasta
  sentir un estiramiento profundo en los isquiotibiales.

  Vuelta: Lleva las caderas hacia delante para volver a estar erguido y contrae con fuerza los glúteos
  y los isquiotibiales arriba.

  Indicaciones: Mantén la barra cerca del cuerpo y evita redondear la columna. El movimiento es una bisagra
  de cadera, no una sentadilla.'
