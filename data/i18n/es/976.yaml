name: Abdominales en V con balón medicinal
description: Túmbate boca arriba con las piernas estiradas y los brazos extendidos por encima de la cabeza,
  sujetando un balón medicinal con ambas manos. Eleva a la vez las piernas rectas y el torso, llevando
  el balón hacia las espinillas o los pies para formar una V. Contrae el abdomen arriba. Baja el torso
  y las piernas de forma controlada, sin arquear en exceso la zona lumbar. Mantén un movimiento fluido
  y no lances el balón.
