name: Curl de muñeca con barra
description: |-
  Posición inicial:
  Arrodíllate frente a un banco plano o siéntate en él. Apoya los antebrazos sobre el banco (o sobre tus muslos) con las muñecas sobresaliendo ligeramente del borde. Sujeta la barra con agarre supino (palmas hacia arriba) a la anchura de los hombros.

  Ejecución:
  1. Desciende la barra de forma lenta y controlada flexionando las muñecas hacia el suelo. Al final del recorrido, abre ligeramente los dedos para dejar rodar la barra y maximizar el estiramiento.
  2. Cierra los dedos con firmeza y flexiona las muñecas hacia arriba de forma potente hasta la máxima contracción de los flexores del antebrazo.
  3. Sostén la contracción durante un segundo en la posición alta y repite.

  Consejos:
  Mantén los antebrazos bien apoyados contra la superficie durante todo el ejercicio; solo deben moverse las muñecas y los dedos.
