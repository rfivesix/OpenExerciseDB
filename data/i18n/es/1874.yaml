name: Estiramiento de zancada del corredor
description: 'Posición inicial: Da un paso profundo hacia delante en una zancada y coloca ambas manos
  planas en el suelo, a los lados o por dentro del pie delantero.


  Ejecución: Empuja con la base del pie trasero y extiende la pierna de atrás, dejando que las caderas
  bajen. Mantén la rodilla delantera justo encima del tobillo.


  Consejos: Mantén el pecho elevado y la columna larga, sin redondearte. Nota el estiramiento en el flexor
  de la cadera trasera y la parte delantera del muslo. Mantén 20–30 segundos y cambia de pierna.'
