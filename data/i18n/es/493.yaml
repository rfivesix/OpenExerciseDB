name: Curl inverso con barra EZ
description: 'Ponte de pie y sujeta una barra EZ con un agarre prono al ancho de los hombros, con las
  palmas hacia abajo. Mantén los codos cerca del torso.

  Flexiona los codos para llevar la barra hacia el pecho, haciendo énfasis en el braquial y el braquiorradial
  del antebrazo. Contrae arriba y baja el peso lentamente y de forma controlada hasta extender los brazos.'
