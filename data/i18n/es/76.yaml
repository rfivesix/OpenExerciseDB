name: Press de banca con agarre estrecho
description: 'Preparación: Túmbate en el banco y sujeta la barra al ancho de los hombros, más estrecho
  que en el press de banca habitual.

  Descenso: Baja la barra con control hacia la parte inferior del pecho.

  Técnica: Mantén los codos pegados al torso; no dejes que se abran hacia los lados.

  Subida: Empuja la barra hacia arriba en línea recta y contrae los tríceps arriba.'
