name: Extensión de glúteos en polea
description: 'Posición inicial:

  Coloca una tobillera en la polea baja y ajústala al tobillo activo. Ponte frente a la máquina, inclínate
  ligeramente desde las caderas y sujétate a la estructura para mantener la estabilidad. Deja la rodilla
  de apoyo ligeramente flexionada y la pelvis orientada al frente.


  Ejecución:

  1. Extiende la pierna activa hacia atrás y arriba contrayendo el glúteo, con una ligera flexión de rodilla.

  2. Aprieta el glúteo arriba durante una breve pausa, sin hiperextender la zona lumbar.

  3. Baja la pierna lentamente y con control, manteniendo la tensión.'
