exercise_id: '1131'
language: es
status: ai_reviewed
name: Extensión de glúteos en polea
description: |-
  Posición inicial:
  • Coloca una tobillera fijada a la polea baja y sujétala a tu tobillo de trabajo.
  • Sitúate de cara a la máquina, inclina ligeramente el tronco hacia delante y agárrate a la estructura para mayor estabilidad.
  • Mantén la pierna de apoyo con la rodilla ligeramente flexionada y la pelvis nivelada.

  Ejecución:
  • Extiende la pierna activa hacia atrás y hacia arriba contrayendo el glúteo mayor, manteniendo la pierna casi recta.
  • Aprieta con fuerza el glúteo en el punto de máxima extensión sin arquear en exceso la zona lumbar.
  • Regresa de manera lenta y controlada a la posición de inicio resistiendo el peso.
