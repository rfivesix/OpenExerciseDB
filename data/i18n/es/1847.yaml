name: L-sit en apertura
description: 'Posición inicial: Siéntate en el suelo con las piernas extendidas y abiertas. Coloca las
  manos en el suelo entre los muslos.


  Ejecución: Presiona firmemente las palmas contra el suelo, bloquea los codos y eleva las caderas y las
  piernas extendidas, manteniéndolas horizontales.


  Consejos: Mantén tensión isométrica en el core, los flexores de cadera y los tríceps durante el tiempo
  indicado.'
