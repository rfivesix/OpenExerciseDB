exercise_id: '1132'
language: es
status: ai_authored
name: Extensión de glúteos en GHD
description: |-
  Posición inicial:
  • Colócate boca abajo en un banco GHD (Glute Ham Developer) o de hiperextensiones, asegurando los tobillos entre los rodillos.
  • Ajusta la almohadilla de modo que la pelvis quede libre para permitir la flexión completa de la cadera.
  • Cruza los brazos sobre el pecho o colócalos detrás de la cabeza.

  Ejecución:
  • Desciende el torso flexionando la cadera y manteniendo la espalda recta y neutra.
  • Contrae con fuerza los glúteos y los isquiotibiales para extender la cadera y elevar el tronco hasta que quede alineado con las piernas.
  • Aprieta los glúteos en la posición superior durante un instante y desciende lentamente.
