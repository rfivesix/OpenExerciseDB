name: Flexión plantar con banda elástica
description: 'Posición inicial:

  Siéntate en el suelo con las piernas extendidas delante de ti. Coloca el centro de una banda elástica
  alrededor de la parte delantera del pie y sujeta ambos extremos con las manos para crear tensión.


  Ejecución:

  1. Empuja el pie hacia delante y abajo contra la resistencia de la banda (flexión plantar), contrayendo
  con fuerza los músculos de la pantorrilla.

  2. Mantén brevemente la contracción máxima al final del movimiento.

  3. Vuelve lentamente a la posición inicial bajo control.


  Consejos:

  Mantén la pierna quieta y mueve únicamente la articulación del tobillo. La fuente indica que el ejercicio
  fortalece las pantorrillas y se emplea en la rehabilitación del tendón de Aquiles.'
