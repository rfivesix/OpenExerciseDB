name: Flexión plantar con banda elástica
description: 'Posición inicial:

  Siéntate en el suelo con las piernas extendidas hacia adelante. Coloca el centro de una banda elástica alrededor de la parte
  delantera del pie y sujeta los extremos con ambas manos manteniendo una tensión adecuada.


  Ejecución:

  1. Empuja la punta del pie hacia adelante contra la resistencia de la banda (flexión plantar), contrayendo firmemente los
  músculos de la pantorrilla.

  2. Mantén la contracción máxima durante un instante.

  3. Regresa lentamente a la posición inicial controlando la resistencia en todo momento.'
