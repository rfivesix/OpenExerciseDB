name: Jalón al pecho con agarre estrecho para bíceps
description: |-
  En una máquina de jalón al pecho, sujeta la barra manteniendo las manos relativamente juntas. Usa un agarre supino (es decir: el dorso de la mano debe mirar hacia la máquina). Luego tira de la barra en línea recta hacia el suelo. Asegúrate de que los bíceps sean los principales responsables del movimiento. Probablemente sentirás trabajar los hombros y los dorsales, pero asegúrate de que los bíceps trabajen más.
