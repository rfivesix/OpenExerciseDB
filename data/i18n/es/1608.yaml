exercise_id: '1608'
language: es
status: upstream_unreviewed
name: Curl de bíceps con el peso corporal
description: |-
  Colócate debajo de una barra recta (a la altura de la cintura o el pecho aproximadamente). Agarra la barra con las palmas mirando hacia ti (agarre supino), con las manos separadas al ancho de los hombros. Inclínate hacia atrás con los brazos estirados de modo que tu cuerpo quede en ángulo respecto al suelo. Manteniendo los codos altos y cerca de la barra, tira de la parte superior del cuerpo hacia la barra flexionando los codos, como en un curl de bíceps. Baja de nuevo de forma controlada. Mantén el core apretado y el movimiento lento para maximizar la tensión sobre el bíceps.
