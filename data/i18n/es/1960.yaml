name: Estiramiento del flexor de cadera con pie trasero elevado
description: 'Posición inicial:

  Colócate en posición de zancada frente a un banco o cajón, con el empeine del pie trasero apoyado en la superficie elevada y una esterilla bajo la rodilla. La pierna delantera queda flexionada a 90 grados.


  Ejecución:

  Mantén el torso erguido. Bascula la pelvis hacia atrás y aprieta con fuerza el glúteo de la pierna trasera mientras desplazas suavemente la cadera hacia delante. Siente el estiramiento en la parte frontal de la cadera y cuádriceps, mantén durante 3 segundos y relaja ligeramente para realizar 5 a 10 repeticiones por lado.


  Consejos:

  Parte de la rutina Limber 11. No arquees la espalda baja; la contracción glútea es la clave para desbloquear los flexores de cadera.'
