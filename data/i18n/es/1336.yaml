name: Extensión de tríceps sobre la cabeza con mancuerna
description: 'Posición inicial:

  Siéntate en un banco con la espalda recta o ponte de pie. Sujeta una mancuerna con ambas manos por encima de la cabeza con
  los brazos extendidos.


  Ejecución:

  1. Flexiona los codos bajando la mancuerna lentamente por detrás de la cabeza, manteniendo los codos cerca de las sienes.

  2. Una vez que sientas el estiramiento en los tríceps, extiende los brazos para regresar a la posición inicial.

  3. Realiza el movimiento de forma lenta y controlada, sin usar impulso.'
