name: Sit-out completo
description: '(A) Colócate en plancha alta sobre las manos y los pies. (B) Traslada el peso a la mano
  izquierda mientras giras el cuerpo hacia la derecha; flexiona la pierna derecha por detrás y extiende
  el brazo derecho hacia arriba. Vuelve al centro y repite hacia el lado contrario. Continúa alternando
  los lados. Para hacerlo más fácil: no eleves el brazo después de flexionar la pierna por detrás. Para
  hacerlo más difícil: mantén el equilibrio con el brazo y la pierna extendidos durante dos tiempos.'
