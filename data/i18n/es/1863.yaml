name: Rotación de cadera tumbado
description: 'Posición inicial: Túmbate boca arriba con los brazos extendidos en T y las palmas hacia
  abajo. Flexiona las rodillas, con los pies apoyados o elevados.


  Ejecución: Baja lentamente las rodillas (o cruza una sobre el cuerpo) hacia un lado y mantén ambos omóplatos
  en el suelo. Puedes girar suavemente la cabeza hacia el lado contrario.


  Consejos: Mantén 20–30 segundos el estiramiento en la cadera externa, los glúteos y la zona lumbar;
  respira profundamente y cambia de lado.'
