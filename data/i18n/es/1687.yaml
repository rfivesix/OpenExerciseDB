name: Arrastre de mancuerna en posición de oso (Bear Crawl Pull-Through)
description: 'Posición inicial: Colócate a cuatro apoyos con las manos debajo de los hombros y las rodillas
  debajo de las caderas. Pon una mancuerna en el suelo justo detrás de una mano. Eleva las rodillas unos
  centímetros del suelo y mantén la espalda recta (posición de bear crawl).


  Movimiento:

  1. Pasa la mano contraria por debajo del torso, agarra el asa de la mancuerna y arrástrala o deslízala
  al otro lado.

  2. Vuelve a apoyar la mano en el suelo para estabilizar la posición.

  3. Repite en la dirección contraria con la otra mano.


  Consejos: Mantén las caderas y los hombros paralelos al suelo. Evita que la pelvis oscile o rote al
  arrastrar el peso.'
