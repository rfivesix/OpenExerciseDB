name: Rodillo de espuma para la banda iliotibial
description: Túmbate de lado con el rodillo bajo la parte externa del muslo, justo
  debajo de la cadera. Apóyate en los antebrazos y cruza la pierna superior por delante,
  con el pie en el suelo para regular la presión. Rueda lentamente desde debajo de
  la cadera hasta justo por encima de la rodilla; pausa en zonas sensibles durante
  varias respiraciones. Haz 10–15 pasadas por lado. No pases directamente sobre la
  rodilla ni el hueso de la cadera.
