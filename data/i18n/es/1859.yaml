name: Rodillo de espuma para glúteos
description: 'Posición inicial: Siéntate sobre el rodillo. Cruza un tobillo sobre la rodilla opuesta en
  figura de cuatro y desplaza ligeramente el peso hacia el lado de la pierna cruzada. Apóyate con las
  manos detrás.


  Ejecución: Rueda lentamente y con control sobre los glúteos y la zona externa de la cadera.


  Consejos: Haz pausas de 15–20 segundos en puntos sensibles (puntos gatillo como el piriforme) y respira
  con regularidad. Cambia de lado al terminar.'
