name: Aperturas para deltoides posterior en polea a un brazo
description: 'Posición inicial:

  Colócate de lado a la torre de poleas con la salida del cable ajustada a la altura
  del hombro. Cruza la mano más alejada por delante del pecho para sujetar el cable.
  Mantén el codo ligeramente flexionado.


  Ejecución:

  Tira del cable hacia fuera y hacia atrás en un arco horizontal amplio hasta alinear
  el brazo con el hombro. Contrae intensamente el deltoides posterior durante un segundo
  y regresa despacio controlando el peso.


  Consejos:

  Mantén el torso inmóvil sin rotar el cuerpo para concentrar el esfuerzo exclusivamente
  en el hombro posterior.'
