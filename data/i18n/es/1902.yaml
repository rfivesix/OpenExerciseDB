name: Flexiones con peso
description: "Preparación: Comienza en una posición de plancha estándar con un disco\
  \ de peso equilibrado de forma segura sobre la parte alta de la espalda.\nAlineación:\
  \ Mantén una línea recta desde la cabeza hasta los talones, activando el core para\
  \ evitar que la espalda se hunda.\nEjecución: Baja el cuerpo hasta que el pecho\
  \ casi toque el suelo, manteniendo los codos a cuarenta y cinco grados.\nAscenso:\
  \ Empuja a través de las palmas para volver a la posición inicial, estirando completamente\
  \ los brazos."
