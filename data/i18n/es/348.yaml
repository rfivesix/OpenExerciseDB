name: Elevación lateral con mancuernas
description: 'Este ejercicio trabaja el deltoides del hombro. Empieza con los brazos rectos, sujetando
  pesas a los lados o delante del cuerpo. Inclina ligeramente el torso hacia delante y flexiona un poco
  las caderas y las rodillas. Mantén los brazos rectos o ligeramente flexionados y elévalos describiendo
  un arco en el plano coronal hasta que las manos queden aproximadamente a la altura de los hombros. Baja
  las pesas a la posición inicial para completar una repetición.

  Con una máquina de poleas, colócate de modo que el plano coronal quede alineado con la polea, situada
  a la altura del suelo o cerca de él. El ejercicio puede hacerse con un brazo cada vez, usando la otra
  mano para estabilizar el cuerpo frente al peso desplazado, o con ambos brazos a la vez si hay dos poleas
  paralelas.'
