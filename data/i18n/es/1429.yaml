name: Rotaciones de hombro con mancuerna
description: Para la rotación externa, sujeta una mancuerna con el codo flexionado a 90 grados junto al
  cuerpo. Gira el antebrazo hacia fuera manteniendo el codo quieto y vuelve lentamente. Para la rotación
  interna, desde la misma posición gira el antebrazo hacia dentro y vuelve lentamente. Realiza el movimiento
  de forma controlada.
