name: Press Tate con mancuernas
description: 'Posición inicial: Túmbate boca arriba en un banco plano con dos mancuernas. Extiende los
  brazos sobre el pecho como al final de un press de banca. Gira las manos a pronación, con las palmas
  hacia los pies y los pulgares enfrentados; mantén juntas o casi juntas las cabezas internas de las mancuernas.


  Ejecución:

  1. Mantén fijos los brazos superiores y los codos abiertos hacia los lados mientras los flexionas para
  bajar las cabezas internas de las mancuernas hacia el centro del pecho.

  2. Toca suavemente el esternón sin apoyar el peso sobre el cuerpo.

  3. Extiende los codos con fuerza para volver al inicio, pensando en empujar los meñiques hacia el techo
  para enfatizar los tríceps.

  4. Contrae los tríceps arriba antes de la siguiente repetición.


  Indicaciones: Aísla la extensión del codo; no balancees los hombros ni los brazos superiores.'
