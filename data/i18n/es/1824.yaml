name: Tate press con mancuernas
description: "Posición inicial:\nTúmbate boca arriba en un banco plano con una mancuerna\
  \ en cada mano. Extiende los brazos rectos sobre el pecho. Coloca un agarre prono\
  \ con las palmas mirando hacia los pies y los pulgares enfrentados, con los extremos\
  \ interiores de las mancuernas muy juntos.\n\nEjecución:\n1. Manteniendo los brazos\
  \ superiores fijos, flexiona los codos abriéndolos hacia los costados para descender\
  \ los extremos interiores de las mancuernas hacia el centro del pecho.\n2. Toca\
  \ suavemente el esternón sin apoyar el peso ni perder tensión.\n3. Extiende con\
  \ fuerza los codos para devolver las mancuernas a la posición inicial apretando\
  \ los tríceps.\n\nConsejos:\nMantén los codos apuntando hacia afuera para aislar\
  \ los tríceps en esta variante diseñada por Dave Tate."
