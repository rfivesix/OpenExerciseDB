name: Jalón con brazos rectos con banda elástica
description: 'Posición inicial:

  Fija una banda de resistencia a un punto alto. Sujeta la banda con ambas manos en agarre prono y da un paso atrás para crear tensión. Inclina ligeramente el torso hacia delante con la espalda recta y los brazos casi extendidos por encima de la cabeza.


  Ejecución:

  Tira de la banda hacia abajo en un arco amplio en dirección a los muslos, concentrando la fuerza en los dorsales. Aprieta intensamente en la posición final y regresa despacio controlando la resistencia hasta estirar los dorsales por completo.


  Consejos:

  Mantén los codos con un bloqueo fijo y no flexiones los brazos durante el movimiento para aislar correctamente el dorsal.'
