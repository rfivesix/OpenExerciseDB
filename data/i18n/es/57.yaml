name: Caminata del oso
description: 'Posición inicial:

  Colócate a cuatro patas, con las manos debajo de los hombros y las rodillas debajo de las caderas. Apoya
  los dedos de los pies y eleva las rodillas unos centímetros del suelo, manteniendo la espalda recta.


  Ejecución:

  1. Avanza moviendo a la vez la mano derecha y el pie izquierdo.

  2. Después avanza con la mano izquierda y el pie derecho, gateando en un patrón cruzado contralateral.

  3. Desplázate a un ritmo constante y controlado durante la distancia (por ejemplo, 20–30 metros) o el
  tiempo (por ejemplo, 45 segundos) indicados.


  Notas:

  Mantén las caderas bajas y paralelas al suelo, evitando balancearte demasiado de lado a lado. Activa
  el tronco y los cuádriceps.'
