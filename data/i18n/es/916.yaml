name: Press de hombros en máquina Smith
description: '- Coloca un banco con el respaldo a unos 80-85 grados en el interior
  de la máquina Smith.

  - Siéntate y sujeta la barra con un agarre prono algo más ancho que los hombros,
  desbloqueando la barra a la altura del mentón.

  - Empuja la barra verticalmente hacia arriba hasta extender los brazos sin bloquear
  bruscamente los codos.

  - Desciende la barra lentamente y de forma controlada hasta la altura del mentón
  o la clavícula.'
