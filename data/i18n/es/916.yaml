name: Press por encima de la cabeza en máquina Smith
description: Coloca un banco inclinado a 80–85 grados justo debajo de la barra de la máquina Smith. Siéntate,
  sujeta la barra con agarre prono algo más ancho que los hombros y sácala del soporte a la altura de
  la barbilla. Empuja hacia arriba por el recorrido fijo hasta extender los brazos por encima de la cabeza,
  sin bloquear bruscamente los codos. Baja la barra despacio y con control hasta la barbilla o la parte
  superior del pecho antes de repetir.
