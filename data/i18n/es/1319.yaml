name: Abdominales (Crunch)
description: 'El movimiento crunch es uno de los ejercicios más básicos diseñados para fortalecer los músculos centrales del
  cuerpo. El ejercicio ayuda a fortalecer los músculos centrales, mejorar la postura y aumentar la movilidad y flexibilidad
  muscular.

  Mejora los músculos del six pack: Cuando se realiza el ejercicio de abdominales, los músculos rectos abdominales y oblicuos
  se tensan, por lo que se desarrollan los músculos abdominales superiores y los músculos del six pack.

  Aumenta la fuerza de los músculos abdominales: La función principal de los músculos abdominales es estabilizar la sección
  media. Te apoya mientras levantas objetos pesados, lo que te permite girar y rotar tu cuerpo. Estas son acciones de todo
  el día que no notas, por lo que es importante que tus músculos abdominales puedan soportar largas horas de trabajo. El ejercicio
  crunch ayuda a desarrollar esta importante resistencia en los músculos abdominales. La resistencia muscular es la capacidad
  de estas fibras para resistir la resistencia durante mucho tiempo.'
