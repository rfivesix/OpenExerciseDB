name: Elevación de talones a dos piernas
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de las caderas. Apoya ligeramente las manos en una pared si necesitas ayuda
  para mantener el equilibrio.


  Ejecución:

  1. Empuja a través de los metatarsos para elevar los talones lo más alto posible.

  2. Mantén la contracción máxima en la posición superior durante 1 o 2 segundos.

  3. Baja los talones lentamente de forma controlada hasta la posición inicial.'
