name: Elevación de talones a dos piernas
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de las caderas. Apoya las manos ligeramente en una pared u objeto
  firme si necesitas ayuda para mantener el equilibrio.


  Ejecución:

  1. Empuja con la parte delantera de ambos pies para elevar los talones lo más alto posible.

  2. Mantén la contracción máxima durante 1 o 2 segundos arriba, apretando las pantorrillas.

  3. Baja lentamente los talones al suelo con control.


  Consejos:

  Haz las repeticiones con suavidad, sin rebotar ni usar impulso. La fuente menciona la estabilidad del
  tobillo y la fuerza de las pantorrillas como beneficios.'
