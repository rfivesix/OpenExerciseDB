name: Sesión de cardio en bicicleta estática
description: 'Posición inicial:

  • Ajusta el sillín de la bicicleta estática a la altura de la cadera para que la rodilla quede ligeramente
  flexionada al final de la pedalada.

  • Ajusta el manillar para mantener una postura erguida o ligeramente inclinada sin forzar el cuello.


  Ejecución:

  • Pedalea con suavidad y una cadencia estable, normalmente de 70 a 90 rpm.

  • Ajusta la resistencia para alcanzar la zona de frecuencia cardíaca aeróbica prevista durante el tiempo
  planificado.

  • Mantén el tren superior relajado y estable en el sillín, sin balancear las caderas.'
