name: Abducción de cadera de pie
description: 'Posición inicial:

  Ponte erguido con el peso equilibrado sobre la pierna de apoyo. Sujétate a una pared o barra firme para
  mantener el equilibrio. Mantén el torso recto, la pelvis nivelada y el abdomen activo.


  Ejecución:

  1. Eleva la pierna activa hacia un lado con un movimiento controlado, sin inclinar el torso hacia el
  lado contrario.

  2. Sube hasta donde resulte cómodo, con los dedos del pie hacia delante y las caderas alineadas.

  3. Haz una pausa arriba y contrae el glúteo medio y la parte externa de la cadera.

  4. Baja lentamente sin apoyar el peso entre repeticiones.

  5. Completa las repeticiones y cambia de pierna.'
