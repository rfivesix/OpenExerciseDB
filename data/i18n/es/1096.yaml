exercise_id: '1096'
language: es
status: human
name: Abducción de pie
description: |-
  Entrenar una postura estable, predominantemente sobre una pierna, es fundamental para ambos lados. Por un lado, previene molestias y, por otro, establece una base estable. El practicante adopta la posición habitual de pie y, con el tronco estable, intenta levantar repetidamente la pierna sin carga, flexionarla por la cadera y la rodilla, y luego bajarla de nuevo. El movimiento se repite también en el otro lado. El ejercicio entrena la estabilidad de la musculatura que rodea la cadera.
