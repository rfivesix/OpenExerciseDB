name: Abducción de cadera de pie
description: |-
  Posición inicial:
  Ponte de pie apoyando una mano en una pared o respaldo para mantener el equilibrio. Apoya firmemente el peso sobre la pierna de apoyo, manteniendo la postura erguida y la pelvis nivelada.

  Ejecución:
  1. Eleva la pierna libre lateralmente hacia afuera de forma lenta y controlada, sin inclinar el torso hacia el lado contrario.
  2. Mantén la punta del pie apuntando hacia adelante para incidir en el glúteo medio.
  3. Sostén la contracción durante un segundo en la parte alta.
  4. Desciende la pierna con control sin llegar a apoyar todo el peso en el suelo entre repeticiones.
  5. Completa la serie y cambia de pierna.
