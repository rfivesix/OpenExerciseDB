name: Remo en polea sentado
description: 'Posición inicial: Siéntate en la máquina de polea baja con los pies
  en los apoyos y las rodillas ligeramente flexionadas.

  Ejecución: Mantén una ligera inclinación hacia adelante en las caderas y tira del
  agarre hacia el torso, manteniendo los codos pegados al cuerpo durante la fase excéntrica.

  Nota: Ejercicio fusionado con el ejercicio 1117 (Remo en polea sentado).'
