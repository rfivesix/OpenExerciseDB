name: Zancada unilateral (sentadilla dividida)
description: 'Posición inicial: Colócate en posición escalonada, con el pie delantero
  apoyado por completo y el trasero equilibrado sobre la punta. Pon las manos en las
  caderas y mantén el torso erguido.


  Ejecución: Baja las caderas flexionando ambas rodillas hasta que la rodilla trasera
  quede justo sobre el suelo y las dos formen aproximadamente 90 grados. Empuja con
  el talón delantero para volver a subir sin detenerte arriba. Completa seguidas todas
  las repeticiones de una pierna antes de cambiar de lado.


  Consejos: Mantén el torso erguido y el tronco firme. Alinea la rodilla delantera
  con los dedos del pie y evita que se desplace hacia dentro.'
