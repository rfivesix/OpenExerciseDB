name: Remo bajo en máquina
description: 'Posición inicial:

  Siéntate en una máquina de remo bajo y ajusta el asiento y el apoyo para el pecho para alcanzar cómodamente
  las asas.


  Ejecución:

  Sujeta las asas y tira de ellas hacia el torso llevando los codos hacia atrás. Junta los omóplatos y
  vuelve de forma controlada hasta extender los brazos.'
