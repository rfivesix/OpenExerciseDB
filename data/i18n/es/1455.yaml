exercise_id: '1455'
language: es
status: ai_reviewed
name: Superman con toalla
description: |-
  Posición inicial:
  • Túmbate boca abajo sobre una esterilla con las piernas estiradas hacia atrás.
  • Sujeta una toalla tensa con ambas manos con los brazos extendidos por delante de la cabeza.

  Ejecución:
  • Eleva el pecho, los brazos y las piernas del suelo activando los lumbares y los glúteos.
  • Manteniendo la toalla tirante, flexiona los codos y lleva la toalla hacia la parte superior del pecho, contrayendo la espalda.
  • Vuelve a extender los brazos hacia delante de forma controlada sin tocar el suelo.
  • Realiza repeticiones continuas y fluidas manteniendo la tensión muscular.
