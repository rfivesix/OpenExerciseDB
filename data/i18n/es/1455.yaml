name: Superman con toalla
description: Túmbate boca abajo con las piernas extendidas y sujeta una toalla pequeña tensa con ambas
  manos, los brazos extendidos delante al ancho de los hombros. Eleva ligeramente del suelo el pecho,
  los brazos y las piernas a la vez, activando la zona lumbar, los glúteos y la parte superior de la espalda.
  Manteniendo la toalla tensa, flexiona los codos y llévala hacia la parte alta del pecho como en un jalón.
  Extiende los brazos de nuevo con control sin dejar que el torso caiga por completo.
