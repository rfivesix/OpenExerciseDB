name: Estiramiento de rana
description: 'Posición inicial: Colócate en cuadrupedia y separa las rodillas tanto como resulte cómodo.
  Baja sobre los antebrazos, con las espinillas paralelas y la parte interna de los pies apoyada en la
  esterilla.


  Ejecución: Mantén la columna neutra y lleva lentamente las caderas hacia los talones hasta notar un
  estiramiento profundo en los aductores y la ingle.


  Consejos: Balancea las caderas suavemente hacia delante y atrás con control o mantén el estiramiento
  profundo 20–30 segundos respirando hondo.'
