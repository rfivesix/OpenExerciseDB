name: Curl de bíceps alterno con mancuernas
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de las caderas y la espalda recta. Sostén una mancuerna en cada mano con los brazos extendidos a los lados y las palmas mirando hacia adentro.

  Ejecución:
  1. Flexiona un codo levantando la mancuerna mientras rotas el antebrazo hacia afuera (supinación), de modo que la palma apunte hacia tu hombro en la parte superior.
  2. Contrae el bíceps en el punto más alto, manteniendo la parte superior del brazo inmóvil y pegada al torso.
  3. Baja la mancuerna de manera lenta y controlada hasta la posición inicial.
  4. Repite el movimiento con el otro brazo, alternando de forma fluida.
