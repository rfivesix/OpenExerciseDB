name: Sentadilla sumo
description: 'Ponte de pie con los pies más separados que los hombros y las puntas giradas hacia fuera unos 45 grados.

  Manteniendo la espalda recta, baja lentamente flexionando las rodillas y las caderas como si fueras a sentarte.

  Baja hasta que los muslos queden paralelos al suelo.

  Vuelve a la posición inicial empujando hacia arriba y extendiendo las piernas, repartiendo el peso por igual entre
  la parte delantera del pie y el talón.'
