name: Sentadilla en máquina con cinturón (Belt Squat)
description: 'Posición inicial:

  Súbete a la plataforma de la máquina de sentadilla con cinturón y ajusta el cinturón de carga alrededor de las caderas. Engancha la cadena al soporte, coloca los pies a la anchura de los hombros y sujeta los asideros para mantener el equilibrio.


  Ejecución:

  Quita el seguro y desciende en una sentadilla profunda doblando las rodillas y caderas hasta que los muslos queden paralelos a la plataforma. Mantén el torso erguido y empuja con fuerza con toda la planta del pie para regresar a la posición vertical.


  Consejos:

  Al situar la carga directamente sobre la pelvis, se descarga completamente la columna vertebral, siendo ideal para entrenar piernas de forma pesada y segura.'
