name: Sentadilla con cinturón
description: |-
  Sentadilla con cinturón: una variante de la sentadilla que se realiza con un cinturón sujeto a una máquina de carga o plataforma, de modo que el peso se sostiene en las caderas en lugar de sobre la columna. Trabaja principalmente los cuádriceps y los glúteos, con mucha menos fatiga lumbar que una sentadilla con barra. Usa un rango de movimiento completo, mantén el torso erguido y empuja a través de la parte media del pie.
