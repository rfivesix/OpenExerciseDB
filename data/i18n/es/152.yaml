name: Dominada supina
description: La chin-up (también llamada chin o chinup) es un ejercicio de fuerza. Se suele realizar para
  fortalecer músculos como el dorsal ancho y el bíceps, que extiende el hombro y flexiona el codo, respectivamente.
  En este movimiento, las palmas miran hacia el cuerpo. Es una variante de la dominada en la que el recorrido
  se define con respecto a la barbilla.
