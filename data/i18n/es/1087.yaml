name: Cargada de potencia desde colgado con mancuernas
description: |-
  De pie, ponte erguido con tus mancuernas, sujetándolas a los costados. Flexiónate por las caderas para bajarlas hasta las rodillas (imagen 1). Vuelve a incorporarte con un ligero salto, usando el impulso para tirar de las mancuernas hasta los hombros (imagen 2). Ponte recto y luego bájalas de forma controlada hasta los costados y repite. Mantén esto rápido y explosivo; si tu ritmo cardíaco no se dispara, las estás haciendo mal.
