name: Hang Power Clean con mancuernas
description: |-
  Posición inicial:
  Ponte de pie con los pies a la anchura de las caderas sujetando una mancuerna en cada mano a los costados. Flexiona ligeramente las caderas y las rodillas para bajar las mancuernas justo por encima de las rodillas (posición de 'hang'), con la espalda recta.

  Ejecución:
  1. Extiende de forma explosiva las caderas y las rodillas a la vez que encoges los hombros con fuerza.
  2. Aprovecha el impulso vertical para elevar las mancuernas pegadas al cuerpo y gira rápidamente los codos hacia adelante.
  3. Recibe las mancuernas sobre los hombros en una posición de media sentadilla amortiguando el impacto.
  4. Extiende las piernas para ponerte de pie por completo y baja las mancuernas con control para la siguiente repetición.
