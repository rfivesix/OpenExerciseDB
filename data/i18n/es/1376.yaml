name: Elevación de pantorrillas con barra
description: 'Beginpositie:

  Coloca una barra sobre los trapecios superiores como para una sentadilla trasera. Ponte erguido con
  los pies a la anchura de las caderas. Si quieres aumentar el estiramiento, puedes apoyar la parte delantera
  de los pies en un bloque para pantorrillas o un disco.


  Beweging:

  Empuja con la parte delantera de los pies y eleva los talones todo lo posible, contrayendo las pantorrillas
  al máximo. Haz una breve pausa arriba y baja los talones despacio y con control hasta sentir un estiramiento
  suave.


  Opmerkingen:

  Mantén las rodillas ligeramente flexionadas y quietas. No rebotes abajo ni uses impulso de las caderas.'
