name: Elevación lateral isométrica en polea
description: 'Posición inicial: Colócate de pie junto a una polea baja o entre dos poleas bajas. Sujeta
  el asa con el codo ligeramente flexionado. Activa el abdomen y mantén una postura erguida y estable,
  con una inclinación muy leve del torso hacia delante.


  Ejecución: Eleva el brazo hacia un lado en el plano escapular hasta que el codo llegue aproximadamente
  a la altura del hombro, paralelo al suelo. Mantén el brazo inmóvil contra la resistencia constante de
  la polea durante el tiempo indicado, contrayendo intensamente el deltoides lateral. Cuando termine el
  tiempo, baja el brazo despacio y con control.


  Indicaciones: No encojas el hombro hacia la oreja; mantén relajados los trapecios superiores. Conserva
  la ligera flexión del codo durante toda la pausa isométrica, sin dejar que el brazo caiga.'
