name: Curl de piernas de pie
description: Haz el movimiento con una pierna cada vez en la máquina de curl de piernas de pie. Coloca
  la parte inferior de la pierna detrás del rodillo, flexiona la rodilla hasta formar un ángulo recto
  y baja el peso de forma controlada.
