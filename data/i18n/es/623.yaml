name: Rodillo de muñeca de pie
description: Sujeta un rodillo de muñeca con ambas manos y ponte de pie con los pies aproximadamente a la anchura
  de los hombros. Si tu gimnasio no dispone de uno, puedes construirlo fácilmente. Solo necesitas un disco de 5
  o 10 libras, una cuerda fina y resistente de unos 90 cm y una barra o palo de 15–20 cm. Ata firmemente la cuerda
  al centro de la barra y el otro extremo al disco. Para empezar, sujeta la barra con ambas manos usando un agarre
  prono. Extiende los brazos delante de ti, paralelos al suelo. Después, enrolla la cuerda girando rápidamente la
  barra con las manos y las muñecas hasta elevar el peso desde el suelo. Cuando llegue arriba, baja lentamente el
  disco invirtiendo el movimiento de las manos y las muñecas. Repite (¡si puedes!).
