name: Pino contra la pared
description: Sube dando una patada o caminando con los pies por una pared firme hasta quedar en posición
  de pino, con las manos al ancho de los hombros en el suelo. Mantén los brazos extendidos y empuja activamente
  el suelo con los hombros; tensa el abdomen y los glúteos. Mantén el cuerpo recto y rígido sin arquear
  demasiado la zona lumbar, y respira con regularidad durante la posición isométrica.
