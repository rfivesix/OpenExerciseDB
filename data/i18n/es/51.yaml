name: Curl de muñeca con barra
description: 'Siéntate en un banco y sujeta una barra con las palmas hacia arriba y las manos separadas
  al ancho de los hombros. Apoya los antebrazos sobre los muslos y deja las muñecas colgando más allá
  de las rodillas. Flexiona las palmas y las muñecas hacia la cara.

  Haz una breve pausa arriba y vuelve lentamente a la posición inicial.'
