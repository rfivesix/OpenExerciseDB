name: Curl de Predicador Inverso
description: '- Siéntate en el banco Scott (preacher) y apoya la parte posterior de
  los brazos sobre la almohadilla inclinada.

  - Sujeta la barra EZ con un agarre prono estrecho (palmas hacia abajo).

  - Flexiona los codos levantando la barra hacia los hombros concentrando el esfuerzo
  en el braquiorradial y los antebrazos.

  - Desciende la barra lentamente con control hasta casi extender los brazos por completo.'
