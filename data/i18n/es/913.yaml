name: Curl inverso en banco Scott con agarre cerrado
description: Siéntate en un banco Scott y apoya la parte superior de los brazos sobre el soporte inclinado.
  Sujeta una barra EZ con agarre prono cerrado y los nudillos hacia arriba. Flexiona los codos para subir
  la barra, manteniendo los brazos firmemente apoyados, y trabaja el braquiorradial y el braquial. Baja
  la barra lentamente y con control hasta casi extender los brazos, sin hiperextender los codos abajo.
