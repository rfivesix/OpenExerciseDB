name: Elevación frontal en polea con barra corta
description: "Posición inicial:\nConecta una barra recta corta a la polea baja. Colócate\
  \ de espaldas a la máquina, de modo que el cable pase entre tus piernas. Sujeta\
  \ la barra con un agarre prono al ancho de los hombros frente a los muslos, con\
  \ los codos ligeramente flexionados y el torso erguido.\n\nEjecución:\n1. Eleva\
  \ la barra hacia adelante y arriba en un arco controlado hasta la altura de los\
  \ hombros.\n2. Mantén la contracción máxima en la parte alta durante un segundo\
  \ apretando el deltoides anterior.\n3. Desciende la barra lentamente a la posición\
  \ inicial manteniendo la tensión muscular continua.\n\nConsejos:\nNo te balancees\
  \ ni arquees la zona lumbar para subir el peso."
