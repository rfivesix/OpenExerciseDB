name: Elevación frontal en polea con barra corta
description: 'Coloca una barra recta corta en la polea baja. Ponte de espaldas a la máquina, con el cable
  entre las piernas, y sujeta la barra con agarre prono al ancho de los hombros delante de los muslos.
  Mantente erguido, con el pecho arriba, hombros bajos y rodillas ligeramente flexionadas.


  1. Con los codos casi extendidos, eleva la barra hacia delante en un arco suave hasta que las manos
  lleguen a la altura de los hombros.

  2. Haz una pausa de un segundo y concéntrate en contraer los deltoides anteriores.

  3. Baja la barra despacio y con control, manteniendo la tensión en los hombros.


  No balancees el torso ni arquees en exceso la zona lumbar.'
search_terms:
