name: Círculos de cuello en sentido antihorario
description: 'Posición inicial:

  Siéntate o ponte de pie con la espalda recta y los hombros relajados. Baja el mentón suavemente hacia
  el pecho.


  Ejecución:

  1. Realiza un movimiento circular lento y continuo en sentido contrario a las agujas del reloj: inclina
  la cabeza hacia el hombro izquierdo, llévala suavemente hacia atrás, pasa por el hombro derecho y regresa
  al pecho.

  2. Mantén el movimiento fluido y sin tirones bruscos.

  3. Repite de manera controlada durante el tiempo o repeticiones pautadas.'
