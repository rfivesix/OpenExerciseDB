name: Jalón al pecho a un brazo cruzado
description: |-
  Siéntate en la máquina de jalón al pecho con el cuerpo en ángulo diagonal, de modo que solo una pierna quede bajo el soporte. Tira del cable hacia abajo con el brazo contrario. Esto hará que el cable cruce tu cuerpo mientras tiras hacia abajo. Pone énfasis en el estiramiento del dorsal.
