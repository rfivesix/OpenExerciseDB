name: Estiramiento de zancada con rotación
description: 'Posición inicial: Da un paso hacia delante en una zancada, con el pie delantero apoyado
  y la rodilla trasera sobre la esterilla o justo por encima del suelo.


  Ejecución: Mantén el torso erguido y extiende los brazos al frente o junta las manos ante el pecho.
  Gira lentamente el torso hacia el lado de la pierna delantera.


  Consejos: Mantén la rodilla delantera alineada con los dedos del pie. Sostén unos segundos o haz 5–8
  rotaciones controladas por lado antes de cambiar de pierna.'
