name: Plancha con alcance de brazo
description: 'Adopta una plancha sobre los antebrazos, con los codos bajo los hombros y los pies algo
  más separados que las caderas para dar estabilidad. Activa el abdomen y los glúteos para formar una
  línea recta de la cabeza a los talones.


  1. Levanta lentamente un brazo y extiéndelo hacia delante a la altura del hombro.

  2. Mantén la posición 1–2 segundos y evita que las caderas giren o se inclinen.

  3. Vuelve a apoyar el antebrazo con control y repite con el otro lado. Alterna los lados.


  Mantén las caderas y los hombros orientados al suelo.'
search_terms:
