name: Plancha con extensión de brazo
description: "Posición inicial:\nColócate en posición de plancha sobre los antebrazos,\
  \ con los codos alineados bajo los hombros y los pies ligeramente más anchos que\
  \ las caderas para mayor estabilidad. Mantén el cuerpo en una línea recta de la\
  \ cabeza a los talones activando glúteos y abdomen.\n\nEjecución:\n1. Levanta un\
  \ brazo del suelo lentamente y extiéndelo recto hacia adelante a la altura del hombro.\n\
  2. Mantén la posición de extensión durante 1 o 2 segundos, evitando cualquier rotación\
  \ o balanceo de la cadera.\n3. Vuelve a apoyar el antebrazo con control y repite\
  \ con el brazo opuesto, alternando de manera fluida.\n\nConsejos:\nEnfócate en la\
  \ antirrotación: mantén caderas y hombros estrictamente paralelos al suelo."
