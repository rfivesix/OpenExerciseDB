name: Remo con TRX
description: 'Posición inicial: mira al punto de anclaje, sujeta las asas TRX con agarre neutro e inclínate
  hacia atrás con los brazos extendidos. Adelanta los pies para ajustar la inclinación del cuerpo y mantén
  una línea recta de plancha de la cabeza a los talones. Ejecución: lleva el pecho hacia las asas, llevando
  los codos atrás y juntando los omóplatos. Vuelta: baja el cuerpo con control hasta extender los brazos,
  manteniendo el abdomen tenso. Indicaciones: cuanto más horizontal esté el cuerpo, mayor será la dificultad.
  No dejes caer las caderas.'
