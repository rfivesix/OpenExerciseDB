name: Arabesco
description: 'Posición inicial:

  Ponte erguido y apoya todo el peso en una pierna. Mantén una ligera flexión en la rodilla de apoyo y
  las caderas niveladas y orientadas al frente. Conserva la columna neutra y el abdomen activo.


  Ejecución:

  1. Inclínate desde las caderas mientras extiendes la pierna libre recta hacia atrás y arriba.

  2. Baja el torso y eleva la pierna hasta que formen una línea horizontal.

  3. Contrae glúteos e isquiotibiales de la pierna de apoyo para volver lentamente al inicio.'
