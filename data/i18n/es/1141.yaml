exercise_id: '1141'
language: es
status: ai_reviewed
name: Arabesco
description: |-
  Posición inicial:
  • Ponte de pie erguido y traslada todo tu peso sobre una pierna de apoyo.
  • Mantén una ligera flexión en la rodilla de la pierna de apoyo y la pelvis totalmente nivelada.
  • Conserva la columna en posición neutra y activa el abdomen.

  Ejecución:
  • Inclina el torso hacia delante desde la cadera mientras extiendes la otra pierna recta hacia atrás y arriba.
  • Desciende hasta que el tronco y la pierna elevada queden casi paralelos al suelo.
  • Contrae con fuerza los glúteos y los isquiotibiales de la pierna de apoyo para volver lentamente a la posición inicial.
