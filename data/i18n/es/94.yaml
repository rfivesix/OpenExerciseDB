name: Curl de bíceps con barra EZ
description: 'Sujeta la barra EZ al ancho de los hombros. Mantén la espalda recta, los hombros ligeramente
  hacia atrás y los brazos extendidos. Flexiona los brazos y sube el peso con un movimiento rápido. Sin
  hacer una pausa, baja la barra despacio y de forma controlada.

  No balancees el cuerpo durante el ejercicio: el trabajo lo hacen los bíceps y solo deben moverse los
  brazos (presta atención a los codos).'
