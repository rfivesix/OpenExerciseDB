name: Elevación posterior de hombros sentado con mancuernas
description: Siéntate en el extremo de un banco plano con los pies apoyados en el suelo y una mancuerna
  en cada mano. Inclínate hacia delante desde las caderas y acerca el torso a los muslos. Con los codos
  ligeramente flexionados, eleva las mancuernas hacia los lados hasta que los brazos queden paralelos
  al suelo y contrae los deltoides posteriores. Baja las pesas lentamente y de forma controlada.
search_terms:
- Elevaciones de deltoides posteriores
- Apertura inversa sentado
