name: Sentadilla búlgara (derecha)
description: Colócate a unos 60 cm delante de un banco o una silla estable. Apoya el empeine del pie izquierdo
  detrás de ti sobre el banco y planta firmemente el pie derecho delante. Flexiona la rodilla derecha
  y baja la cadera hasta que el muslo derecho quede aproximadamente paralelo al suelo y la rodilla izquierda
  justo por encima del suelo. Empuja con el talón y la parte media del pie derecho para volver a erguirte.
  Inclina ligeramente el torso desde la cadera, con la espalda recta, y evita que la rodilla delantera
  se cierre hacia dentro.
