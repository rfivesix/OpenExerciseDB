name: Elevaciones de rodilla de pie
description: 'Posición inicial:

  Ponte de pie erguido con los pies a la anchura de las caderas y el abdomen activado.


  Ejecución:

  Eleva una rodilla hacia el pecho hasta que el muslo quede como mínimo paralelo al suelo, manteniendo el equilibrio sobre la pierna de apoyo. Baja el pie con control e inmediatamente eleva la rodilla contraria, alternando los lados de manera rítmica.


  Consejos:

  No te eches hacia atrás al levantar la pierna; conserva la verticalidad del tronco trabajando desde los flexores de cadera y el core.'
