name: Entrenamiento de boxeo con saco pesado
description: 'Posición inicial:

  Colócate aproximadamente a un brazo del saco, en una postura de boxeo equilibrada. Mantén la mano adelantada
  un poco al frente, la otra protegiendo la barbilla, las rodillas relajadas y el peso sobre la parte
  delantera de los pies.


  Ejecución:

  1. Lanza golpes rápidos y potentes —jab, directo, gancho y uppercut— hacia el centro del saco.

  2. Gira las caderas y el torso y pivota sobre los pies con cada golpe.

  3. Devuelve enseguida las manos a la guardia y muévete activamente alrededor del saco.

  4. Trabaja en asaltos cronometrados, combinando golpes, acondicionamiento y resistencia de los hombros.'
