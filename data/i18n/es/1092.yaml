exercise_id: '1092'
language: es
status: ai_authored
name: Entrenamiento con saco de boxeo
description: |-
  Posición inicial:
  Colócate a la distancia de un brazo del saco en guardia de boxeo: pies separados, rodillas ligeramente flexionadas y manos arriba protegiendo el rostro.

  Ejecución:
  1. Lanza combinaciones de golpes directos (jab, cross) y ganchos con potencia y precisión al centro del saco.
  2. Gira las caderas y el torso con cada golpe para transferir la fuerza desde las piernas.
  3. Recupera rápidamente la guardia tras cada impacto y mantén un juego de pies activo alrededor del saco.
  4. Trabaja en asaltos cronometrados para desarrollar resistencia cardiovascular, fuerza explosiva y definición muscular.
