name: Press por encima de la cabeza
description: Saca la barra del soporte a la altura de los hombros con agarre prono algo más ancho que
  los hombros y apóyala sobre los deltoides anteriores. Tensa el abdomen y los glúteos, inclina ligeramente
  la cabeza hacia atrás y empuja la barra verticalmente en línea recta. Cuando pase la frente, lleva la
  cabeza ligeramente hacia delante y extiende los brazos por encima de la cabeza, sobre el mediopié. Baja
  la barra con control hasta la parte superior del pecho y los hombros.
