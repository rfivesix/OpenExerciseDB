name: Press de banca declinado con barra
description: Túmbate en un banco declinado; la barra debe quedar justo encima de los ojos. Mantén las
  rodillas algo flexionadas y los pies firmes en el suelo. Concéntrate, respira hondo y sujeta la barra
  con las manos más separadas que los hombros. Bájala lentamente hasta que toque brevemente el pecho a
  la altura de los pezones y vuelve a empujarla hacia arriba.
