name: Encogimiento abdominal
description: 'Posición inicial:

  Túmbate boca arriba sobre una esterilla con las rodillas flexionadas y los pies apoyados al ancho de
  las caderas. Coloca las manos suavemente detrás de la cabeza, sin entrelazar los dedos, o crúzalas sobre
  el pecho.


  Ejecución:

  1. Contrae los abdominales para flexionar la parte superior de la columna y elevar los omóplatos del
  suelo hacia la pelvis.

  2. Espira y mantén la contracción máxima durante un segundo arriba.

  3. Baja lentamente la parte superior de la espalda de forma controlada, manteniendo la tensión abdominal.


  Notas:

  No tires del cuello con las manos. Mantén la zona lumbar en contacto con la esterilla; se trata de flexionar
  la columna, no de hacer una incorporación completa.'
