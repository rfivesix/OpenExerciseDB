name: Puente lateral
description: |-
  Para realizar correctamente el puente o plancha lateral, apóyate sobre un antebrazo y coloca los pies uno encima del otro. Luego, eleva la cadera hasta formar una línea recta de cabeza a pies, manteniendo la posición antes de cambiar de lado al terminar. Como claves esenciales para cuidar la postura, no dejes caer la cadera, mantén el cuerpo alineado, el cuello neutro y aprieta el abdomen y los glúteos durante todo el ejercicio.
