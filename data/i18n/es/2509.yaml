name: Plancha lateral
description: |-
  Posición inicial:
  Túmbate de lado en el suelo sobre una esterilla con las piernas estiradas y los pies apilados o ligeramente escalonados. Apóyate sobre el antebrazo inferior con el codo colocado directamente bajo el hombro.

  Ejecución:
  1. Activa el abdomen y eleva la cadera del suelo hasta que tu cuerpo dibuje una línea recta desde la cabeza hasta los pies.
  2. Mantén el cuello neutro y el brazo superior apoyado sobre la cadera o extendido hacia el techo.
  3. Sostén esta postura isométrica durante el tiempo prescrito respirando de manera controlada.
  4. Desciende la cadera suavemente y repite el ejercicio sobre el otro lado.

  Consejos:
  No permitas que la cadera caiga hacia el suelo ni que el torso rote hacia adelante; mantén la contracción en oblicuos y glúteos.
