exercise_id: '1185'
language: es
status: ai_reviewed
name: Extensión de tríceps en polea alta
description: |-
  Posición inicial:
  • Colócate de pie frente a la polea alta equipada con una barra o cuerda.
  • Sujeta el accesorio manteniendo los codos pegados a los costados y flexionados a unos 90 grados.
  • Inclina ligeramente el torso hacia delante con la espalda recta y el abdomen firme.

  Ejecución:
  • Empuja la carga hacia abajo extendiendo los codos hasta estirar los brazos por completo.
  • Mantén los brazos superiores inmóviles y fijos a los lados del torso durante todo el recorrido.
  • Contrae intensamente los tríceps en la posición inferior durante un instante.
  • Regresa de manera lenta y controlada hasta la altura del pecho sin mover los codos.
