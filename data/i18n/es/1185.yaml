name: Extensión de tríceps en polea alta
description: 'Posición inicial:

  Ponte frente a una polea alta con una barra recta, barra EZ o cuerda. Sujeta el accesorio con agarre
  prono y los codos flexionados y pegados a las costillas. Inclínate ligeramente desde las caderas con
  la espalda recta y el abdomen firme.


  Ejecución:

  1. Empuja la barra hacia abajo extendiendo los codos hasta estirar los brazos hacia los muslos.

  2. Mantén inmóviles los brazos superiores junto a los costados.

  3. Contrae los tríceps abajo durante una breve pausa.

  4. Deja que la barra vuelva de forma controlada hasta aproximadamente la altura del pecho.'
