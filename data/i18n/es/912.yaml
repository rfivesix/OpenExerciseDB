name: Curl de bíceps en polea con barra recta
description: Ponte erguido frente a una polea baja y sujeta la barra recta con agarre supino, aproximadamente
  al ancho de los hombros. Mantén los codos pegados a los costados y el torso estable. Flexiona los codos
  y contrae los bíceps para llevar la barra hacia el pecho, sin mover la parte superior de los brazos.
  Aprieta los bíceps arriba y baja la barra lentamente con control hasta extender los brazos.
