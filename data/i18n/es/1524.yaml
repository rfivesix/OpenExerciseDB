name: Cuerdas de batalla
description: 'Sujeta los extremos de la cuerda con los brazos extendidos delante de
  las caderas, con las manos a la anchura de los hombros.

  Activa el core y empieza a subir y bajar cada brazo de forma alterna y explosiva.

  Sigue alternando los brazos durante tres o cuatro series de 1 a 2 minutos.'
