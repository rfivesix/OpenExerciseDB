name: Cuerdas de batalla
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de los hombros, en una media sentadilla atlética. Sujeta firmemente
  los agarres con las palmas enfrentadas delante de las caderas.


  Ejecución:

  1. Mueve los brazos arriba y abajo de forma alterna o simultánea, con un ritmo explosivo, para crear
  ondas que lleguen hasta el anclaje.

  2. Mantén el abdomen firme y la columna neutra mientras absorbes el impulso.

  3. Mantén un ritmo rápido e intenso durante el intervalo previsto.


  Indicaciones:

  El ejercicio proporciona trabajo cardiovascular de alta intensidad y también implica deltoides, dorsales
  y estabilizadores del torso.'
