name: Palmadas por encima de la cabeza
description: 'Posición inicial:

  • Ponte de pie con los pies separados a la anchura de los hombros y los brazos relajados a los lados.

  • Mantén el pecho erguido y los hombros relajados.


  Ejecución:

  • Eleva los brazos extendidos hacia los lados en un arco amplio hasta juntar las manos con una palmada
  por encima de la cabeza.

  • Baja los brazos suavemente por el mismo recorrido lateral hasta la posición inicial.

  • Repite con un ritmo fluido como calentamiento dinámico para activar los deltoides y movilizar la cintura
  escapular.'
