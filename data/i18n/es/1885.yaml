name: Ejercicio YTWL
description: "Objetivo: Mejora la estabilidad del hombro, la postura y el control\
  \ escapular (de los omóplatos). Se usa a menudo en fisioterapia y en los calentamientos.\n\
  Posición inicial:\nPonte de pie con los pies separados al ancho de los hombros.\
  \ Flexiona hacia adelante desde las caderas (como en un\npeso muerto) manteniendo\
  \ la espalda recta, o túmbate boca abajo sobre un banco inclinado.\nMantén los pulgares\
  \ apuntando hacia arriba durante todo el ejercicio.\nY (brazos arriba):\nExtiende\
  \ ambos brazos rectos hacia adelante y arriba en un ángulo de 135 grados respecto\
  \ a\ntu cuerpo, formando una \"Y\". Junta los omóplatos en\nla parte alta.\nT (brazos\
  \ hacia los lados): Abre los brazos rectos hacia los lados, perpendiculares a tu\
  \ cuerpo, formando una \"T\". Concéntrate en juntar los omóplatos.\nW (brazos flexionados):\
  \ Lleva los codos hacia atrás, flexionándolos a 90 grados, y junta los omóplatos\
  \ para formar una \"W\". Mantén las muñecas firmes.\nL (brazos rotados):\nComienza\
  \ con los codos flexionados a 90 grados y pegados al cuerpo. Rota\nlos antebrazos\
  \ hacia afuera (rotación externa) como un poste de portería, formando una\n\"L\"\
  \ o una verja.\nEnfoque clave:\nLos movimientos deben ser lentos y controlados.\
  \ Lidera siempre con los pulgares\ny piensa en mover los omóplatos, no solo los\
  \ brazos."
