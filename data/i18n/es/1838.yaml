name: Ejercicios de hombro con banda
description: 'Posición inicial: Sujeta una banda elástica a un punto firme a la altura del hombro o del
  pecho. Agárrala con una mano y aléjate hasta que tenga una tensión ligera o moderada.


  Ejecución: Realiza movimientos circulares y rotacionales controlados del brazo en varios planos para
  movilizar el hombro y calentar el manguito rotador.


  Consejos: Mantén una postura erguida y el core activo. Muévete con fluidez, sin tirones ni prisas.'
