name: Elevación en Y de hombros en polea
description: 'Coloca asas en D en las poleas bajas de una estación doble. Ponte en el centro y sujeta
  las asas con los brazos cruzados (mano derecha en el cable izquierdo y mano izquierda en el derecho).
  Empieza con las manos cruzadas delante de la cintura.


  1. Eleva ambos brazos en diagonal hacia fuera hasta formar una Y por encima de los hombros.

  2. Retrae y baja los omóplatos en la parte superior, concentrándote en el trapecio inferior y los deltoides
  laterales.

  3. Baja lentamente los brazos por el mismo recorrido hasta la posición inicial.


  Mantén los codos ligeramente flexionados y no arquees la zona lumbar.'
