name: Estiramiento con pulsos en zancada larga
description: 'Posición inicial: Da un paso adelante y adopta una zancada larga. Baja las caderas hasta
  que el muslo delantero quede paralelo al suelo y la rodilla trasera suspendida justo por encima del
  suelo. De forma opcional, sujeta una banda tensa por encima de la cabeza con los brazos extendidos.


  Ejecución: Mantén el torso erguido, las caderas orientadas hacia delante y el abdomen activo. Haz pulsos
  suaves y controlados con las caderas en un recorrido corto de unos 2,5 a 5 cm. Mantén un ritmo constante
  durante el tiempo o las repeticiones indicados. Impúlsate con el pie delantero para volver a la posición
  de pie y repite con la otra pierna.


  Indicaciones: Haz los pulsos de forma fluida, sin movimientos bruscos; busca alargar los flexores de
  la cadera y activar dinámicamente los aductores.'
