name: Curls de bíceps abiertos con mancuernas
description: |-
  Posición inicial:
  • Ponte de pie erguido con una mancuerna en cada mano y las palmas hacia delante.
  • Abre los antebrazos ligeramente hacia afuera más allá de la anchura de los hombros, con los codos fijos a los lados.

  Ejecución:
  • Flexiona los codos elevando las mancuernas en esa trayectoria abierta hacia la parte externa de los hombros.
  • Este ángulo enfatiza la cabeza corta (interna) del bíceps braquial.
  • Aprieta en el punto más alto y desciende de forma controlada.
