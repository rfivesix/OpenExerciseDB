name: Giro ruso con mancuerna
description: 'Posición inicial:

  Siéntate en una colchoneta con las rodillas flexionadas y los talones en el suelo (o elevados para aumentar
  la dificultad). Sujeta horizontalmente una mancuerna con ambas manos frente al pecho. Inclina el torso
  unos 45 grados hacia atrás, con la espalda recta y el abdomen firme.


  Ejecución:

  1. Rota suavemente el torso a la derecha y lleva la mancuerna hacia el suelo junto a la cadera.

  2. Haz una breve pausa y rota de forma controlada por el centro hacia la izquierda.

  3. Gira la caja torácica y activa los oblicuos, manteniendo las caderas y la parte inferior del cuerpo
  lo más estables posible.'
