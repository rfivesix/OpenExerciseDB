language: es
status: ai_authored
name: Giro ruso con mancuerna
description: |-
  Posición inicial:
  • Siéntate en una colchoneta con las rodillas flexionadas y los talones apoyados en el suelo (o suspendidos para mayor intensidad).
  • Sostén una mancuerna con ambas manos frente a tu pecho.
  • Inclina el torso hacia atrás aproximadamente 45 grados manteniendo la espalda recta y el abdomen contraído.

  Ejecución:
  • Rota el torso hacia la derecha llevando la mancuerna hacia el suelo cerca de tu cadera.
  • Haz una breve pausa y rota de manera fluida hacia el lado izquierdo.
  • Asegúrate de que la rotación se origine en el tronco y los oblicuos, manteniendo las piernas lo más estables posible.
