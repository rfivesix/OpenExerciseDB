exercise_id: '1186'
language: es
name: Remo inclinado a una mano en polea
description: Fija un agarre individual en D a la polea baja. Ponte frente a la máquina con una postura
  escalonada o atlética e inclínate desde las caderas con la espalda recta. Sujeta el agarre con una mano
  y deja el brazo extendido hacia la polea. Tira hacia la cadera o cintura manteniendo el codo cerca del
  torso. Retrae la escápula y contrae el dorsal; vuelve a extender el brazo hacia delante con control.
