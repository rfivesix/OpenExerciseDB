name: Sentadilla pistol
description: 'Ponte de pie con los pies al ancho de las caderas, las puntas hacia delante y el pecho erguido.

  Extiende una pierna recta delante de ti y los dos brazos a la altura de los hombros. Afianza el tronco
  y mira al frente.

  Baja lentamente en una sentadilla.

  (Opcional) Haz una pausa abajo.

  Mantén la pierna libre y los brazos extendidos durante todo el movimiento.'
