name: Elevación lateral en polea cruzando por delante
description: 'Colócate de lado junto a una polea baja. Sujeta el agarre con la mano exterior, cruzada
  por delante del cuerpo. Mantén el torso quieto y las rodillas ligeramente flexionadas.


  1. Con el codo algo flexionado, eleva el brazo hacia el lado hasta que la mano alcance la altura del
  hombro.

  2. Haz una breve pausa arriba para contraer el deltoides lateral.

  3. Baja el brazo cruzándolo por delante del cuerpo de forma lenta y controlada, manteniendo la tensión.


  Concéntrate en el deltoides lateral; no encojas los trapecios ni te inclines alejándote de la polea.'
