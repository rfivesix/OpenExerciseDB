name: Remo Meadows
description: El remo Meadows es un remo unilateral que se realiza con una configuración de landmine, agarre prono y postura
  escalonada. Inclina el torso hacia delante y agarra la barra. Apoya el otro antebrazo sobre la pierna adelantada. Inicia
  el movimiento llevando el codo hacia atrás mientras retraes el omóplato. Mantén el hombro que trabaja hacia abajo. Tira
  en dirección a tu cadera trasera hasta que el codo quede a la altura de tu torso.
