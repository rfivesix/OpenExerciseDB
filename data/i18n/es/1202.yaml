exercise_id: '1202'
language: es
status: ai_authored
name: Abducción de cadera en decúbito lateral
description: |-
  Posición inicial:
  • Túmbate de lado sobre una colchoneta.
  • Flexiona ligeramente la pierna inferior para ganar estabilidad y mantén la pierna superior completamente estirada.
  • Apoya la cabeza sobre el brazo inferior y coloca la mano superior en el suelo delante del pecho para equilibrarte.

  Ejecución:
  • Eleva la pierna superior de forma controlada hacia arriba, con la punta del pie mirando al frente o ligeramente hacia abajo.
  • Mantén la pelvis perpendicular al suelo sin dejar que ruede hacia atrás.
  • Siente la contracción en el glúteo medio arriba durante un instante y baja la pierna lentamente.
