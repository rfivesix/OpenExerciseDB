name: Jalón al pecho con agarre en V
description: Conecta un agarre en V cerrado a la máquina de jalón y ajusta el soporte para fijar los muslos.
  Sujeta las asas con las palmas enfrentadas y siéntate erguido con el pecho elevado. Lleva el agarre
  suavemente hacia la parte superior del pecho, bajando los codos junto a las costillas. Contrae los dorsales
  abajo y vuelve lentamente hasta extender los brazos por completo con control.
