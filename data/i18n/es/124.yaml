name: Sentadilla con peso delante
description: 'Ponte de pie con los pies algo más separados que los hombros y estírate todo lo posible.

  Sujeta un disco delante del cuerpo con los brazos extendidos. Mantén el tronco firme y la curva natural
  de la espalda.

  Lleva las caderas hacia atrás y flexiona las rodillas para bajar en sentadilla todo lo que puedas. Mantén
  la posición unos instantes y vuelve a la posición inicial.'
