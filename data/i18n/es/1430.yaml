name: Sujeción de discos con pinza
description: Elige uno o dos discos (mejor si tienen el borde liso) y sujétalos juntos entre el pulgar
  y los dedos. Mantén el brazo recto junto al cuerpo o ligeramente extendido delante. Aguanta todo el
  tiempo que puedas, con los hombros relajados y un agarre firme. Puede hacerse por tiempo o repeticiones.
