name: Sostén con pellizco de disco
description: |-
  El sostén con pellizco de disco es un ejercicio para mejorar la fuerza de agarre y la resistencia en los antebrazos. Selecciona uno o dos discos de pesas (los discos de bordes lisos son ideales) y pínzalos entre el pulgar y los dedos. Mantén los discos con el brazo recto hacia abajo a tu lado o ligeramente extendido frente a ti. Sostén la posición el mayor tiempo posible, manteniendo los hombros relajados y el agarre firme. Este ejercicio puede realizarse por tiempo o repeticiones.
