name: Peso muerto sumo
description: 'Empieza con una barra cargada en el suelo. Acércate a ella de modo que pase por el centro de los pies.
  Coloca los pies muy separados, cerca de los cierres de la barra. Flexiona la cadera para sujetarla. Los brazos
  deben quedar justo debajo de los hombros y por dentro de las piernas; puedes usar agarre prono, mixto o de gancho.
  Relaja los hombros para alargar los brazos.

  Respira, baja las caderas, mira al frente y eleva el pecho. Empuja el suelo separando los pies, con el peso sobre
  la mitad posterior de los pies. Extiende las caderas y las rodillas.

  Cuando la barra pase las rodillas, inclínate hacia atrás y lleva las caderas hacia la barra mientras juntas los
  omóplatos.

  Devuelve el peso al suelo flexionando la cadera y controlando el descenso.'
