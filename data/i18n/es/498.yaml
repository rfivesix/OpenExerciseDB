name: Press de banca con agarre inverso
description: 'Túmbate en un banco con los pies firmemente apoyados en el suelo. Sujeta la barra con un
  agarre inverso (supino) ligeramente más ancho que los hombros y mantén las muñecas alineadas.

  Saca la barra del soporte y bájala de forma controlada hasta la parte inferior del pecho, manteniendo
  los codos en un ángulo cómodo y cerca del cuerpo. Empuja la barra hasta extender los brazos, activando
  con fuerza la parte superior del pecho (porción clavicular) y los tríceps.'
