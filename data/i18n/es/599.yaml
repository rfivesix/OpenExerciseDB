name: Arrancada
description: Colócate con los pies a la anchura de las caderas y las espinillas junto a la barra. Sujeta la barra
  con un agarre dos veces más ancho que los hombros y, manteniendo la zona lumbar recta, empuja el suelo con los
  talones para empezar a levantarla. Cuando la barra supere las rodillas, extiende las caderas de forma explosiva
  y encoge los hombros. Deja que el impulso lleve el peso por encima de la cabeza.
