name: Arrancada (Snatch)
description: Colócate de pie con los pies a la anchura de la cadera y las espinillas contra la barra. Agarra la barra al doble
  del ancho de los hombros y, manteniendo la zona lumbar recta, empuja los talones contra el suelo para empezar a levantar
  la barra. Cuando esté por encima de las rodillas, extiende la cadera de forma explosiva y encoge los hombros. Deja que el
  impulso lleve el peso por encima de la cabeza.
