name: Extensión de tríceps con balanceo en polea
description: 'Posición inicial:

  Colócate frente a una polea alta con una cuerda, en posición escalonada. Sujeta la cuerda con agarre
  neutro e inclina ligeramente el torso hacia delante, con el peso sobre el pie adelantado.


  Ejecución:

  1. Empuja la cuerda hacia abajo y desplaza ligeramente el peso hacia el pie trasero, dejando que las
  manos pasen detrás del torso.

  2. Separa los extremos de la cuerda abajo para contraer los tríceps.

  3. Deja que la cuerda suba lentamente mientras vuelves a cargar el peso sobre el pie delantero.'
