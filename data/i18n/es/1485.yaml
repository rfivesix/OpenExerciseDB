exercise_id: '1485'
language: es
status: human
name: Rocking triceps pushdown
description: |-
  Coloca los pies debajo de la cuerda e inclina el torso hacia la cuerda. Lleva un pie hacia atrás. Empuja la cuerda hacia abajo e inclina todo el cuerpo hacia atrás sobre el pie trasero mientras empujas para llevar las manos por detrás del cuerpo. No olvides llevar el pecho hacia delante durante el empuje. Al soltar la cuerda lentamente, inclina el cuerpo de nuevo sobre el pie delantero.
