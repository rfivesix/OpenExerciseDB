language: es
status: ai_reviewed
name: Pushdown de tríceps con balanceo (Rocking Triceps Pushdown)
description: |-
  Posición inicial:
  Ponte de pie frente a una polea alta con cuerda, en postura de pies escalonada. Sujeta los extremos de la cuerda con agarre neutro e inclina el torso hacia delante, con el peso sobre el pie delantero.

  Ejecución:
  1. Empuja la cuerda hacia abajo mientras trasladas el peso corporal hacia el pie trasero, permitiendo que las manos lleguen detrás de la línea del cuerpo.
  2. Separa las puntas de la cuerda al final del recorrido para una contracción máxima de los tríceps.
  3. Regresa lentamente con control mientras vuelves a apoyar el peso en el pie delantero.

  Consejos:
  El ligero balanceo amplía el rango de recorrido final y potencia la contracción de la cabeza larga del tríceps.
