name: Zancadas caminando con mancuernas
description: 'Posición inicial: Colócate con los pies a la anchura de las caderas y las manos en las caderas
  o con mancuernas a los lados.

  Paso: Da una zancada amplia hacia delante con la pierna derecha.

  Descenso: Baja las caderas hasta que ambas rodillas estén flexionadas aproximadamente 90 grados.

  Transición: Impúlsate con el talón delantero para ponerte de pie y lleva el pie trasero hacia delante,
  entrando directamente en la siguiente zancada.'
