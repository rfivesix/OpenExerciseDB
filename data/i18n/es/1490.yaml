exercise_id: '1490'
language: es
status: ai_reviewed
name: Patada de tríceps en banco inclinado con mancuernas
description: |-
  Posición inicial:
  Ajusta un banco inclinable a unos 60 grados. Colócate boca abajo apoyando el pecho contra el respaldo inclinado y los pies en el suelo. Sujeta una mancuerna en cada mano, junta los omóplatos y eleva los brazos de modo que queden paralelos al suelo junto al torso.

  Ejecución:
  1. Manteniendo los brazos fijos y los codos pegados a los costados, extiende los codos hacia atrás hasta que los brazos queden completamente rectos.
  2. Aprieta con fuerza los tríceps en el bloqueo superior durante un segundo.
  3. Flexiona los codos de forma lenta y controlada de vuelta a un ángulo de 90 grados.

  Consejos:
  El apoyo del pecho en el banco evita cualquier balanceo corporal y asegura un aislamiento riguroso de los tríceps.
