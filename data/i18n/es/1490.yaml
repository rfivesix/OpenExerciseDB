exercise_id: '1490'
language: es
status: human
name: Patada de tríceps tumbado
description: |-
  Ajusta el banco a un ángulo de 60 grados. Mantente quieto y apoya el torso sobre el banco inclinado, asegurando una línea casi recta de todo el cuerpo. Junta los omóplatos, de modo que los codos queden por detrás del torso con los brazos casi paralelos al suelo. Levanta las mancuernas hasta que los brazos formen una línea recta. Baja lentamente las mancuernas a la posición inicial. La posición inicial corresponde a una posición en ángulo recto entre el brazo y el antebrazo.
