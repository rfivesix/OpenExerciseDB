name: Patada de tríceps con mancuernas en banco inclinado
description: 'Posición inicial:

  Ajusta el banco a unos 60°. Túmbate boca abajo con el pecho apoyado y los pies en el suelo. Sujeta una
  mancuerna en cada mano, junta las escápulas y eleva los brazos superiores junto al torso, aproximadamente
  paralelos al suelo.


  Ejecución:

  1. Mantén quietos los brazos superiores y extiende los codos hacia atrás hasta estirar los brazos.

  2. Contrae los tríceps durante un segundo arriba.

  3. Baja los antebrazos lentamente hasta que los codos formen unos 90°.


  Indicaciones:

  El apoyo del pecho reduce el impulso.'
