name: Patada de tríceps con mancuerna
description: La patada de tríceps con mancuerna es un ejercicio de fuerza que trabaja los tríceps, situados
  en la parte posterior de los brazos. Ayuda a fortalecer y tonificar los tríceps y contribuye a la fuerza
  general de los brazos. La patada y sus variantes se pueden realizar con mancuernas, cables o bandas
  de resistencia.
