name: Elevación lateral sentado con mancuernas
description: Siéntate en el borde de un banco plano con los pies firmes en el suelo y una mancuerna a
  cada lado. Inclina ligeramente el torso hacia delante y mantén los codos ligeramente flexionados y fijos.
  Eleva las mancuernas hacia los lados en un arco amplio hasta que los codos y las pesas alcancen la altura
  de los hombros. Haz una pausa breve y bájalas despacio y con control, sin balancearte.
