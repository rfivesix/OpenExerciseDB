name: Remo Pendlay
description: 'Ejercicio de espalda con barra realizado inclinado, con el torso paralelo al suelo. La barra
  parte del suelo y se detiene allí en cada repetición.

  Sujeta la barra con agarre prono y a la anchura de los hombros, afianza el tronco y tira de forma explosiva
  hacia la parte inferior del pecho o la parte superior del abdomen, sin cambiar el ángulo de las caderas.
  Baja la barra por completo al suelo antes de empezar la siguiente repetición.'
