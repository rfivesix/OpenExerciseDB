exercise_id: '1196'
language: es
status: ai_authored
name: Ejercicios contra la pared (Wall Drills)
description: |-
  Posición inicial:
  • Colócate frente a una pared firme a una distancia aproximada de un paso grande.
  • Apoya las manos en la pared a la altura de los hombros e inclina todo el cuerpo hacia delante en un ángulo de unos 45 grados.
  • Forma una línea recta desde la cabeza hasta los talones con el abdomen apretado.

  Ejecución:
  • Eleva una rodilla de forma explosiva hacia el pecho hasta que el muslo quede paralelo al suelo, con la punta del pie apuntando hacia arriba (dorsiflexión).
  • Mantén la postura isométrica o alterna las piernas en un ritmo dinámico de marcha o carrera.
  • Mantén la pierna de apoyo firme y la cadera totalmente extendida.
