name: Dominadas en Tabla de Multipresas
description: '1- Calentamiento: Antes de empezar, es crucial haber calentado adecuadamente
  los dedos, muñecas, codos y hombros. No intentes este ejercicio en frío.

  2- Selección del Agarre: Elige un par de presas o regletas simétricas en la tabla
  de multipresas. Comienza con las más grandes y cómodas antes de progresar a otras
  más pequeñas.

  3- Ejecución: Cuélgate de las presas seleccionadas con los brazos extendidos y los
  hombros activos (lejos de las orejas). Realiza una dominada estricta jalando con
  la espalda y los brazos hasta que la barbilla supere las manos.

  4- Descenso Controlado: Desciende de forma lenta y controlada (2-3 segundos) hasta
  la posición inicial sin dejarte caer bruscamente.'
