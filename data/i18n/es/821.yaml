name: Dominada en fingerboard
description: Sujeta un canto o agarre simétrico adecuado del fingerboard con agarre abierto o semiarqueado.
  Cuélgate con los brazos extendidos y los hombros activos. Tira del cuerpo suavemente hacia arriba usando
  dorsales y brazos hasta que la barbilla supere la altura de las manos. Baja despacio y con control (en
  2–3 segundos) hasta la posición inicial, sin dejarte caer de golpe.
