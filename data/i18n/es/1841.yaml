name: Estiramiento de extensión de hombro sentado
description: "Posición inicial: Siéntate en el suelo con las manos apoyadas detrás\
  \ de ti, separadas al ancho de los hombros y con los dedos apuntando hacia atrás\
  \ o ligeramente hacia afuera.\nEjecución: Mantén los brazos extendidos y desliza\
  \ la pelvis y los pies hacia adelante, llevando los hombros a extensión hasta sentir\
  \ un estiramiento cómodo en la parte frontal de los hombros y el pecho.\nConsejos:\
  \ Avanza solo hasta donde resulte cómodo sin dolor. Mantén la posición durante 20-30\
  \ segundos respirando de forma continua."
