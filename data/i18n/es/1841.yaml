name: Estiramiento sentado de extensión del hombro
description: 'Posición inicial: Siéntate en el suelo con las manos detrás de ti, separadas al ancho de
  los hombros y los dedos hacia atrás o ligeramente hacia fuera.


  Ejecución: Mantén los brazos extendidos y desliza las caderas y los pies hacia delante, llevando los
  hombros a extensión hasta sentir un estiramiento cómodo en los deltoides anteriores y el pecho.


  Consejos: Avanza solo hasta donde resulte cómodo y sin dolor. Mantén el estiramiento 20–30 segundos
  respirando de forma constante.'
