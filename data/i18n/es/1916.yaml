name: Tuck planche
description: 'Posición inicial: Coloca las manos a la anchura de los hombros en el
  suelo o sobre paralelas, con los dedos hacia delante o ligeramente hacia fuera.


  Ejecución: Empuja con fuerza manteniendo los brazos completamente rectos e inclina
  los hombros por delante de las muñecas. Recoge las rodillas hacia el pecho en una
  posición compacta, elevando del suelo toda la parte inferior del cuerpo. Protrae
  activamente las escápulas para redondear la espalda alta y activa intensamente el
  tronco. Mantén esta posición isométrica durante el tiempo indicado.


  Consejos: Mantén los codos bloqueados y rectos. Genera la presión principalmente
  con los deltoides anteriores y el serrato anterior.'
