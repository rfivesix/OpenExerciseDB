exercise_id: '1266'
language: es
status: ai_authored
name: Extensiones de tríceps con TRX
description: Fija el TRX u otro sistema de suspensión por encima de ti, con las asas a la altura del pecho
  o un poco más abajo. Prueba qué altura te permite colocarte mejor. Ponte frente a las asas y agárralas
  con las palmas hacia abajo. Activa el abdomen, aprieta los glúteos, inspira e inclínate hacia delante
  levantando los talones, con los codos extendidos. Vuelve a inspirar y baja lentamente flexionando los
  codos hasta formar un ángulo de 90 grados, con las muñecas por encima de los codos. Mantén un instante.
  Extiende los brazos contrayendo los tríceps y vuelve a la posición inicial al exhalar.
