name: Limpiaparabrisas colgado
description: 'Cuélgate de una barra con agarre prono algo más ancho que los hombros. Activa dorsales y
  hombros, inclina ligeramente el torso hacia atrás y eleva las piernas rectas hasta acercar los pies
  a la barra o al techo.


  1. Mantén las piernas rectas y juntas y gira lentamente las caderas y las piernas hacia un lado, describiendo
  un arco como un limpiaparabrisas.

  2. Invierte la dirección contrayendo los oblicuos y el abdomen, y lleva las piernas por el centro.

  3. Baja las piernas hacia el lado opuesto con control y alterna continuamente.


  Evita balancearte. Si mantener las piernas rectas dificulta el control, flexiona las rodillas y acerca
  las piernas al pecho.'
