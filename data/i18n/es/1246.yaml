name: Rollout en TRX
description: 'Posición inicial:

  Ponte de rodillas o de pie dando la espalda al punto de anclaje, sujetando los agarres del TRX con los brazos estirados
  hacia adelante a la altura del pecho.


  Ejecución:

  1. Manteniendo el core y los glúteos firmemente contraídos, inclina el cuerpo hacia adelante extendiendo los brazos por
  encima de la cabeza.

  2. Desciende de forma controlada hasta el punto donde puedas mantener la alineación sin arquear la zona lumbar.

  3. Tira con los dorsales y el abdomen para volver a la posición inicial.'
