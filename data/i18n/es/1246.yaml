name: Rollout en TRX
description: 'Posición inicial:

  Arrodíllate o ponte de pie de espaldas al anclaje y sujeta las asas del TRX con los brazos extendidos
  hacia delante a la altura del pecho.


  Ejecución:

  1. Mantén el abdomen firme y el cuerpo en línea recta mientras te inclinas hacia delante y extiendes
  los brazos por encima de la cabeza.

  2. Desciende hacia delante con control hasta donde puedas mantener la tensión sin que la zona lumbar
  ceda.

  3. Activa los abdominales y los dorsales para tirar de los brazos hacia abajo y regresar a la posición
  inicial.


  Consejos:

  Mantén activos los glúteos y los abdominales para proteger la zona lumbar y evitar la hiperextensión.'
