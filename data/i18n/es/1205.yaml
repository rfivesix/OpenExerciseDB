exercise_id: '1205'
language: es
status: ai_reviewed
name: Curl de muñeca con mancuernas
description: |-
  Posición inicial:
  • Siéntate en un banco sosteniendo dos mancuernas con las palmas mirando hacia arriba (agarre supino).
  • Apoya los antebrazos sobre los muslos o sobre el borde del banco, dejando que las muñecas sobresalgan por encima de las rodillas.

  Ejecución:
  • Deja descender las mancuernas lentamente extendiendo las muñecas hacia el suelo.
  • Flexiona las muñecas con fuerza llevando las mancuernas hacia arriba en dirección a los antebrazos.
  • Aprieta los flexores del antebrazo en la parte superior y baja de manera suave y controlada.
