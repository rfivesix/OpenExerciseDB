name: Curl de muñeca con mancuernas
search_terms:
- Curl de muñeca con mancuernas
description: Siéntate en un banco y sujeta la mancuerna con la palma hacia arriba y las manos separadas
  a la anchura de los hombros. Apoya los antebrazos sobre los muslos y deja que las muñecas cuelguen por
  encima de las rodillas. Flexiona las palmas y las muñecas hacia la cara. (Opcional/variable) Haz una
  pausa arriba. Vuelve lentamente a la posición inicial.
