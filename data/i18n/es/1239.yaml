name: Estiramiento de gemelos de pie
search_terms:
- "Estiramiento de pantorrilla contra la pared"
- "Estiramiento de pie del gastrocnemio"
description: 'Posición inicial:

  • Colócate de pie de cara a una pared a un paso de distancia y apoya las manos en la pared a la altura
  de los hombros.

  • Da un paso amplio hacia atrás con una pierna.


  Ejecución:

  • Mantén la pierna trasera completamente extendida con el talón apoyado firmemente en el suelo.

  • Flexiona la rodilla delantera e inclina el peso del cuerpo hacia delante hasta notar un estiramiento
  claro en el gemelo (gastrocnemio).

  • Mantén la posición durante 20 a 30 segundos respirando con normalidad y cambia de pierna.'
