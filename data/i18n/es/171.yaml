name: Encogimiento abdominal en banco declinado
description: Túmbate boca arriba en un banco inclinado, con los pies sujetos en un extremo del banco.
  Pide a un compañero que los sujete o usa otra ayuda (por ejemplo, una barra); coloca las manos detrás
  de la cabeza. Desde esta posición, eleva el torso hasta que la cabeza o los codos toquen las rodillas.
  Haz el movimiento enrollando la espalda hacia arriba.
