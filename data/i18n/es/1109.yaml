name: Curl de bíceps concentrado en polea
description: |-
  Posición inicial:
  Coloca un banco frente a una polea baja. Siéntate con las piernas abiertas, sujeta el agarre individual con una toma en supinación (palma hacia arriba) y apoya la parte posterior del brazo en la cara interna del muslo correspondiente.

  Ejecución:
  1. Flexiona el codo levantando el maneral hacia el hombro manteniendo el brazo firmemente apoyado contra el muslo para aislar el bíceps.
  2. Aprieta intensamente el bíceps en el punto de máxima contracción contra la tensión continua del cable.
  3. Desciende lentamente el peso de forma controlada hasta que el brazo quede casi completamente estirado.
  4. Realiza todas las repeticiones y repite con el otro brazo.
