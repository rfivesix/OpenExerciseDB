name: Hollow body hold
description: 'Posición inicial:

  Túmbate boca arriba sobre una esterilla con las piernas juntas y estiradas y los brazos por encima de
  la cabeza, alineados con las orejas.


  Ejecución:

  1. Activa el abdomen y presiona la zona lumbar contra el suelo con una inclinación pélvica posterior.

  2. Eleva a la vez los omóplatos, la cabeza y las piernas estiradas unos 10–15 cm del suelo, formando
  una curva suave como una banana.

  3. Mantén todo el cuerpo tenso, los dedos de los pies extendidos y los glúteos contraídos.

  4. Aguanta la posición durante el tiempo indicado mientras respiras de forma superficial pero continua.

  5. Vuelve a bajar al suelo con control.


  Consejos:

  Si la zona lumbar se arquea y se separa del suelo, flexiona las rodillas o lleva los brazos junto a
  las caderas para facilitar el ejercicio.'
