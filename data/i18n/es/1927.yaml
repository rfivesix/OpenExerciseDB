name: Jalón al pecho con agarre supino
description: |-
  El jalón al pecho con agarre supino (más conocido como jalón con agarre invertido) es una variante del ejercicio estándar que utiliza un agarre supino con las manos a la anchura de los hombros. Esta posición traslada más énfasis a la parte baja de los dorsales e incrementa la participación del bíceps, permitiendo a menudo un mayor rango de movimiento y una contracción más profunda en la parte baja del movimiento.
