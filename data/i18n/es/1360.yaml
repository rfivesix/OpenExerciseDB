exercise_id: '1360'
language: es
status: ai_reviewed
name: Clean and press con doble kettlebell
description: |-
  Posición inicial:
  Ponte de pie con los pies a la anchura de los hombros y dos pesas rusas (kettlebells) colocadas entre tus pies. Flexiona la cadera manteniendo la espalda recta y sujeta las asas.

  Ejecución:
  1. Cargada (Clean): Extiende explosivamente caderas y rodillas para impulsar las kettlebells cerca del cuerpo hacia la posición de rack sobre el pecho.
  2. Press: Con el core y los glúteos firmemente activados, empuja las kettlebells verticalmente por encima de la cabeza hasta bloquear los codos.
  3. Baja las kettlebells con control a la posición de rack y luego devuélvelas al punto de partida.

  Consejos:
  Mantén el tronco rígido y evita arquear la espalda lumbar al presionar las cargas hacia arriba.
