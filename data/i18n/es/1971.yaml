name: Jalón Mentzer
description: |-
  Posición inicial:
  Siéntate en la máquina de jalón dorsal y ajusta las almohadillas para asegurar firmemente los muslos. Sujeta la barra con un agarre supino cerrado (palmas hacia ti), a la anchura de los hombros o ligeramente más estrecho.

  Ejecución:
  1. Mantén el pecho erguido y tira de la barra hacia la parte superior del pecho dirigiendo los codos hacia abajo y atrás.
  2. Contrae fuertemente los dorsales y bíceps en el punto más bajo durante 1 o 2 segundos.
  3. Regresa la barra de manera lenta y controlada hasta extender los brazos casi por completo para un estiramiento total.

  Consejos:
  Evita balancear el torso o utilizar el impulso de la espalda baja; controla la fase excéntrica.
