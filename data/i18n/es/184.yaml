name: Peso muerto convencional
description: 'Posición inicial:

  Ponte de pie con los pies al ancho de las caderas y la barra sobre la parte media de los pies (a unos
  2,5 cm de las espinillas). Lleva las caderas hacia atrás y flexiona las rodillas hasta poder agarrar
  la barra justo por fuera de las piernas, con agarre prono o mixto. Mantén la espalda recta, el pecho
  elevado y los hombros ligeramente por delante de la barra.


  Ejecución:

  1. Inspira profundamente hacia el abdomen y fija el tronco. Empuja el suelo con la parte media de los
  pies y los talones, extendiendo a la vez las rodillas y las caderas.

  2. Mantén la barra cerca de las espinillas y los muslos mientras sube.

  3. Termina erguido y contrae los glúteos, con la columna neutra, sin inclinarte hacia atrás ni hiperextender
  la zona lumbar.

  4. Devuelve la barra al suelo de forma controlada, llevando primero las caderas hacia atrás y flexionando
  las rodillas cuando la barra las haya superado.


  Notas:

  No redondees la columna bajo carga. Mantén los dorsales activos para que la barra permanezca cerca del
  cuerpo durante todo el levantamiento.'
