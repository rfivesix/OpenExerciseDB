exercise_id: '1584'
language: es
status: ai_authored
name: Marcha o trote en el lugar
description: |-
  Posición inicial:
  Ponte de pie con los pies separados al ancho de las caderas, las rodillas relajadas, el pecho erguido y el abdomen ligeramente activo. Dobla los codos a 90 grados a los lados del cuerpo.

  Ejecución:
  Comienza levantando una rodilla hacia la altura de la cadera y bájala apoyando suavemente la parte delantera del pie mientras elevas la rodilla contraria. Mueve los brazos rítmicamente en coordinación cruzada con las piernas. Mantén un ritmo de marcha constante y controlado, o auméntalo progresivamente a un trote suave en el sitio.

  Consejos:
  - Aterriza con suavidad sobre la bola del pie para minimizar el impacto en las articulaciones.
  - Mantén una postura erguida durante todo el ejercicio.
