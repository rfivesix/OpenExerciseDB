- "Trote en el sitio"
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de las caderas, las rodillas relajadas, el pecho erguido
  y el core suavemente activado. Mantén los brazos relajados y flexionados a 90 grados junto a los costados.


  Ejecución:

  Eleva una rodilla hacia la altura de la cadera y bájala con suavidad mientras elevas la otra. Coordina
  los brazos con las piernas opuestas, como al correr. Mantén un ritmo constante y de bajo impacto al
  marchar, o aumenta el ritmo para trotar suavemente en el sitio.


  Indicaciones:

  Aterriza suavemente sobre la parte delantera del pie y rueda hacia el talón. Mantén una postura erguida,
  sin inclinarte hacia delante ni hacia atrás.'
