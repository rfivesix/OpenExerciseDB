name: Sentadilla hindú
description: 'Empieza con los pies a la anchura de los hombros y los brazos ligeramente por detrás del
  cuerpo.

  Al bajar, eleva los talones del suelo y mantén la espalda lo más vertical posible.

  Cuando llegues abajo, toca los talones con las manos.

  Después, ponte de pie apoyando los talones en el suelo y extendiendo los brazos delante del pecho; rema
  con los brazos para volver a la posición inicial.'
