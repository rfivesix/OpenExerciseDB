name: Máquina de rotación del torso
description: 'Beginpositie:

  Siéntate en la máquina de rotación de torso y ajusta los apoyos del pecho y las rodillas para mantener
  cómodamente fija la parte inferior del cuerpo. Sujeta las asas y siéntate erguido con la columna recta.


  Beweging:

  Gira el torso hacia un lado usando los oblicuos. Haz una breve pausa al final del recorrido manteniendo
  la contracción y vuelve lentamente a la posición inicial contra la resistencia del bloque de pesas.


  Opmerkingen:

  Elige un peso moderado para controlar la rotación con suavidad. No fuerces el giro ni uses el impulso
  de los hombros o los brazos.'
