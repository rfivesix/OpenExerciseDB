name: Encogimiento abdominal en máquina
description: El procedimiento es muy parecido al crunch normal, pero con el peso adicional de la máquina.
  Siéntate en la máquina y apoya bien ambos pies en el suelo. Sujeta las pesas, los cables u otros elementos
  y flexiona el tronco hacia delante en un movimiento de enrollamiento (idealmente, la columna se despega
  vértebra a vértebra). Vuelve lentamente a la posición inicial.
