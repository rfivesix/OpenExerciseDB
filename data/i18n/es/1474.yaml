name: Elevación en W (W-Raise)
description: |-
  Posición inicial:
  Túmbate boca arriba sobre una colchoneta con los brazos extendidos a los lados para dar estabilidad. Mantén las piernas juntas y estiradas, despegándolas ligeramente del suelo.

  Ejecución:
  1. Manteniendo el core activo y las piernas rectas, eleva las piernas en diagonal hacia la izquierda despegando las caderas del suelo (primer trazo de la W invertida).
  2. Desciende las piernas hasta la mitad de forma controlada, llévalas al centro y elévalas verticalmente hacia arriba despegando de nuevo las caderas.
  3. Baja de nuevo hasta la mitad y elévalas en diagonal hacia la derecha.
  4. Invierte la trayectoria para completar el dibujo de la W y repetir.

  Consejos:
  No utilices el impulso de las piernas; la elevación de las caderas debe realizarse exclusivamente por la contracción del abdomen inferior y los oblicuos.
