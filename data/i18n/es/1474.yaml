name: Elevación en W
description: Esta variante de crunch inverso consta de tres partes y dibuja una W invertida con las piernas.
  Túmbate boca arriba, con las piernas extendidas en el punto bajo del extremo de la W. Manteniendo las
  piernas rectas y el abdomen firme, elévalas, levanta las caderas y bájalas lentamente hasta la mitad.
  Vuelve a elevar las piernas y las caderas, manteniendo el cuerpo alineado, y baja hasta el otro extremo
  de la W. Invierte el recorrido para volver al inicio.
