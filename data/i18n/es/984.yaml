name: Zancada con peso corporal
description: Ponte de pie con los pies separados al ancho de las caderas, el pecho elevado y las manos
  en las caderas o juntas frente al pecho. Da un paso amplio y controlado hacia delante. Baja la pelvis
  hasta flexionar ambas rodillas aproximadamente 90 grados, con la rodilla trasera justo por encima del
  suelo. Empuja con el talón delantero para volver a la posición inicial. Mantén el torso erguido y la
  rodilla delantera alineada con los dedos del pie.
