name: Curl Zottman
description: |-
  Con las palmas mirando hacia delante, lleva los pesos hacia tus hombros con un curl. Gira las manos de modo que las palmas miren hacia abajo y baja lentamente los pesos. Por último, vuelve a girar las palmas hacia delante.
