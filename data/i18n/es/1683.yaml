name: Curl Zottman
description: 'Posición inicial: Ponte de pie con una mancuerna en cada mano a los lados y las palmas hacia
  delante (agarre supino).


  Movimiento:

  1. Flexiona los codos y lleva las pesas hacia los hombros de forma suave y controlada.

  2. En la parte superior, gira las muñecas para que las palmas miren hacia abajo (agarre prono).

  3. Baja lentamente las mancuernas con control en esa posición.

  4. Abajo, vuelve a girar las palmas hacia delante.


  Consejos: Mantén los codos junto a los costados y evita balancearte. La fase descendente controlada
  con agarre prono implica especialmente el braquiorradial y los músculos del antebrazo.'
