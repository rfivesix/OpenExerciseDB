name: Burpees
description: 'Posición inicial:

  Ponte de pie con los pies al ancho de los hombros y los brazos a los lados.


  Ejecución:

  1. Lleva las caderas hacia atrás en una sentadilla y apoya las manos en el suelo delante de los pies.

  2. Salta con ambos pies hacia atrás a la vez hasta quedar en plancha alta.

  3. Baja el cuerpo y haz una flexión completa, tocando el suelo con el pecho.

  4. Empuja hacia arriba y salta con los pies hacia las manos para volver a la sentadilla profunda.

  5. Salta explosivamente hacia arriba, extendiendo los brazos sobre la cabeza. Aterriza suavemente sobre
  la parte delantera de los pies y comienza enseguida la siguiente repetición.


  Notas:

  Mantén el tronco firme durante la plancha y la flexión para evitar que las caderas se hundan.'
