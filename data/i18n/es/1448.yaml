name: Curl en W sentado con mancuernas
description: Siéntate contra un banco inclinado a unos 60 grados y deja los brazos a los lados con las
  palmas hacia fuera. Flexiona los codos para subir las mancuernas y ligeramente hacia fuera, formando
  una «W» en la parte alta. Aprieta los bíceps arriba sin llevar los codos hacia delante y baja lentamente
  hasta estirar los brazos.
