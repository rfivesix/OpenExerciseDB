exercise_id: '1448'
language: es
status: ai_reviewed
name: Curl en W sentado con mancuernas
description: |-
  Posición inicial:
  • Siéntate en un banco inclinado a unos 60 grados con la espalda bien apoyada.
  • Deja colgar los brazos a los lados con las palmas orientadas hacia fuera.

  Ejecución:
  • Flexiona los codos levantando las mancuernas en diagonal hacia el exterior, formando una W con los brazos al contraer.
  • Aprieta los bíceps en la parte superior sin mover los codos hacia delante.
  • Desciende las mancuernas de forma lenta y controlada hasta estirar los brazos completamente.
