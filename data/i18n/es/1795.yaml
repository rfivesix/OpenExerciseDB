name: Jalón cruzado unilateral en polea
description: "Posición inicial:\nAjusta la polea a la posición más alta. Colócate\
  \ ligeramente desfasado de la torre de modo que el cable cruce diagonalmente frente\
  \ a tu torso. Sujeta el agarre con la mano contraria, inclina el torso levemente\
  \ hacia adelante y permite que el brazo se estire en línea con el cable.\n\nEjecución:\n\
  1. Tira del cable en un arco diagonal descendente hacia tu cadera, manteniendo el\
  \ codo casi recto con una mínima flexión fija.\n2. Conduce el codo pegado al costado\
  \ apretando con fuerza el dorsal ancho en el punto de máxima contracción.\n3. Regresa\
  \ lentamente a lo largo de la misma trayectoria diagonal hasta sentir el estiramiento\
  \ completo del dorsal.\n\nConsejos:\nLa trayectoria diagonal en polea coincide con\
  \ la dirección de las fibras del dorsal ancho para un estímulo óptimo."
