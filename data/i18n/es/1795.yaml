name: Jalón unilateral cruzado en polea
description: 'Coloca la polea en la posición más alta. Sitúate ligeramente desplazado para que el cable
  cruce en diagonal por la parte superior del torso. Sujeta el agarre con la mano alejada y flexiona ligeramente
  las caderas; deja que el brazo se extienda por encima de la cabeza siguiendo el cable.


  1. Tira del cable en diagonal hacia abajo y hacia dentro, cruzando el torso hasta la cadera, con el
  codo ligeramente flexionado y fijo.

  2. Lleva el codo hacia las costillas y contrae el dorsal ancho y el redondo mayor al final.

  3. Deja que el cable lleve lentamente el brazo hacia arriba por la diagonal hasta estirar el dorsal.'
