name: Sentadilla con barra desde topes
description: Ajusta los topes de seguridad del rack a la profundidad deseada (por ejemplo, a la altura
  del paralelo o justo por encima del punto difícil). Coloca la barra sobre la parte superior de la espalda,
  adopta tu postura habitual de sentadilla y activa el abdomen. Baja de forma controlada hasta que la
  barra repose suavemente sobre los topes. Haz una pausa completa de 1 a 2 segundos manteniendo la tensión
  del torso y las piernas; después, empuja con fuerza desde el mediopié y los talones para volver a ponerte
  de pie. No pierdas la tensión del abdomen mientras la barra descansa en los topes.
