name: Estiramiento de rodilla al pecho
description: |-
  Posición inicial:
  • Túmbate boca arriba en una esterilla con las piernas extendidas y los hombros apoyados.

  Ejecución:
  • Flexiona una rodilla, sujétala con ambas manos por la espinilla o detrás del muslo y llévala suavemente hacia el pecho.
  • Mantén la otra pierna estirada en el suelo para maximizar el estiramiento del glúteo y la zona lumbar.
  • Mantén la posición entre 20 y 30 segundos respirando con calma, y luego cambia de pierna.
