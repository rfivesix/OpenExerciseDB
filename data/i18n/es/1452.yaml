name: Estiramiento de rodilla al pecho
description: Túmbate boca arriba en una colchoneta con las piernas extendidas y la cabeza relajada. Flexiona
  una rodilla y sujeta la espinilla o la parte posterior del muslo con ambas manos. Acércala suavemente
  al pecho hasta notar un estiramiento cómodo en los glúteos y la zona lumbar. Mantén la otra pierna relajada
  y extendida en el suelo. Aguanta de 20 a 30 segundos respirando con calma y repite con la otra pierna.
  También puedes acercar ambas rodillas a la vez.
