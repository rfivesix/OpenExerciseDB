name: Combinación hiperextensión Y-W con discos
description: |-
  Posición inicial:
  Colócate en un banco de hiperextensiones con los tobillos asegurados y la pelvis apoyada en el acolchado. Sujeta un disco ligero en cada mano.

  Ejecución:
  1. Eleva el torso hasta formar una línea recta con las piernas activando los erectores espinales y los glúteos.
  2. Eleva los brazos diagonalmente hacia arriba formando una „Y“ con el cuerpo para activar el trapecio inferior.
  3. Luego flexiona y lleva los codos hacia atrás formando una „W“ y juntando fuertemente los omóplatos para trabajar el manguito rotador y trapecio medio.
  4. Desciende lentamente el torso para volver a la posición de partida.

  Consejos:
  Utiliza discos ligeros para priorizar la técnica escapular y la estabilidad postural en lugar de la carga.
