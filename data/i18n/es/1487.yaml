name: Combinación Y-W en banco de hiperextensiones con discos
description: 'Posición inicial:

  Colócate en un banco de hiperextensiones, silla romana o GHD, con las caderas apoyadas y los pies sujetos.
  Sujeta un disco ligero en cada mano y deja colgar los brazos.


  Ejecución:

  1. Eleva el torso hasta alinearlo con las piernas, activando glúteos y erectores espinales.

  2. Eleva los brazos en diagonal por encima de la cabeza formando una Y y contrae la parte inferior del
  trapecio.

  3. Lleva los codos abajo y atrás formando una W y junta las escápulas.

  4. Baja los brazos y el torso con control.


  Indicaciones:

  Usa discos ligeros y céntrate en la retracción escapular y el control de la columna.'
