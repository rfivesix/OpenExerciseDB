name: Deslizamiento del serrato en pared
description: 'Posición inicial:

  Ponte de pie frente a una pared lisa, con los pies a la anchura de las caderas. Apoya los antebrazos
  en vertical contra la pared, manteniendo en contacto ambos codos y muñecas; coloca los codos aproximadamente
  a la altura y anchura de los hombros.


  Ejecución:

  1. Presiona activamente los antebrazos contra la pared para separar los omóplatos sobre la parte superior
  de la espalda.

  2. Desliza lentamente los antebrazos hacia arriba en forma de V suave hasta que los codos alcancen la
  altura de los ojos o la frente.

  3. Haz una pausa de 1–2 segundos arriba y mantén la presión hacia fuera y arriba para activar el serrato
  anterior.

  4. Desliza los antebrazos de vuelta a la posición inicial con control.


  Consejos:

  Mantén la presión contra la pared durante todo el movimiento y no arquees la zona lumbar al subir los
  brazos.'
