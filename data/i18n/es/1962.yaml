name: Step Jack (Jumping jack de bajo impacto)
description: 'Posición inicial:

  Ponte de pie erguido con los pies juntos y los brazos relajados a los lados. Mantén el core firme.


  Ejecución:

  Da un paso amplio lateral hacia la derecha mientras subes simultáneamente ambos brazos por encima de la cabeza en un arco fluido. Regresa el pie al centro bajando los brazos y repite de inmediato dando el paso lateral hacia la izquierda. Continúa alternando ambos lados a un ritmo continuo.


  Consejos:

  Variante de bajo impacto del jumping jack tradicional; eleva las pulsaciones sin someter las articulaciones al impacto del salto.'
