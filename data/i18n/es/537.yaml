name: Press de banca inclinado con mancuernas
description: 'Esta variante del press de banca plano busca dar énfasis a la cabeza clavicular del pectoral mayor
  (la parte superior). Al inclinar el torso cambia el ángulo del empuje y se desplaza más tensión hacia la parte
  superior del pecho y los hombros, lo que contribuye a un desarrollo equilibrado del torso.


  Ajuste y preparación del banco: Coloca el banco en una inclinación de entre 30 y 45 grados (una inclinación superior
  a 45° carga demasiado los hombros y reduce el estímulo para el pecho). Siéntate con una mancuerna sobre cada muslo.


  Posición inicial: Reclínate con la espalda apoyada en el banco y usa las rodillas, una después de la otra, para
  llevar las mancuernas a la altura de los hombros.


  Estabilización: Apoya firmemente los pies en el suelo. Retrae las escápulas (junta los omóplatos y presiónalos
  contra el banco) para proteger los hombros y estabilizar la carga.


  Fase excéntrica (descenso): Baja las mancuernas lentamente y de forma controlada hacia la parte superior del pecho.
  No abras los codos 90° hacia los lados; mantenlos a unos 45–60° respecto al torso.


  Fase concéntrica (empuje): Empuja las mancuernas verticalmente hacia arriba al exhalar. Sigue una trayectoria
  ligeramente convergente, sin que se toquen arriba. Detente justo antes de bloquear los codos para mantener la
  tensión en la parte superior del pecho.'
