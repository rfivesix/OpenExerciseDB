name: Push press
description: De pie, con los pies al ancho de las caderas o los hombros, apoya la barra sobre los deltoides
  delanteros y las clavículas. Mantén los codos algo hacia delante y el abdomen firme. Flexiona las rodillas
  unos centímetros en vertical con el torso erguido. Extiende explosivamente las rodillas y las caderas
  para impulsar la barra; termina el movimiento con los brazos y extiéndelos por encima de la cabeza.
  Baja la barra con control a la posición frontal.
