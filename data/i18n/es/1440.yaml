exercise_id: '1440'
language: es
status: ai_reviewed
name: Push Press (press con impulso)
description: |-
  Posición inicial:
  • Colócate de pie con los pies a la anchura de los hombros y apoya la barra sobre la parte delantera de los hombros (posición de front rack).
  • Mantén los codos ligeramente adelantados y la zona media bien activa y firme.

  Ejecución:
  • Realiza una flexión rápida y corta de rodillas (dip) manteniendo el torso completamente erguido.
  • Extiende las piernas y caderas de forma explosiva para transmitir la fuerza a la barra hacia arriba.
  • Completa la trayectoria con los hombros y brazos empujando la barra por encima de la cabeza hasta el bloqueo completo.
  • Desciende la barra de manera controlada de vuelta a los hombros.
