name: Hiperextensiones
description: Túmbate sobre el cojín del banco de hiperextensiones, con el ombligo en el borde delantero,
  y deja que el torso cuelgue libremente. Tensa los músculos de la espalda y eleva el torso hasta quedar
  horizontal, pero no más arriba. Baja lentamente manteniendo la tensión muscular.
