name: Paseo del maletín
description: 'Levanta del suelo una mancuerna o kettlebell pesada con una mano, como si fuera un maletín.
  Ponte erguido, con los pies al ancho de las caderas, los hombros estables y el torso vertical. Activa
  el abdomen y los oblicuos.


  1. Camina hacia delante en línea recta con pasos lentos y controlados.

  2. Resiste la tracción del peso: mantén los hombros nivelados y evita inclinar el torso hacia la carga.

  3. Continúa la distancia o el tiempo indicado, deja el peso en el suelo con cuidado y cambia de mano.


  Mantente erguido; no te inclines hacia el peso ni eleves la cadera contraria.'
