exercise_id: '1218'
language: es
status: ai_reviewed
name: Flexiones de rodillas
description: |-
  Posición inicial:
  • Arrodíllate en el suelo y apoya las manos delante de ti, ligeramente más anchas que los hombros.
  • Forma una línea recta continua desde las rodillas hasta la cabeza con el abdomen activo.
  • Mantén las rodillas apoyadas de manera constante en el suelo.

  Ejecución:
  • Flexiona los codos descendiendo el pecho hacia el suelo de forma suave y controlada.
  • Mantén los codos en un ángulo de unos 45 grados respecto al cuerpo.
  • Empuja a través de las palmas de las manos para regresar a la posición inicial contrayendo el pecho.
