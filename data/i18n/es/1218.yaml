name: Flexiones de rodillas
description: Empieza arrodillado en el suelo con las rodillas juntas. Coloca las manos delante de ti,
  ligeramente más separadas que la anchura de los hombros. Mantén el cuerpo en línea recta desde la cabeza
  hasta las rodillas y las manos debajo de los hombros. Baja el torso hacia el suelo flexionando los codos
  y manteniendo estable el tronco; las rodillas siguen apoyadas. Empuja con las manos para volver a la
  posición inicial. En la parte superior, mantén la contracción de los músculos del pecho, los hombros
  y los brazos. Completa las repeticiones deseadas con control.
