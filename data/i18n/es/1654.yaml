name: Elevación lateral en máquina
description: La elevación lateral en máquina es un ejercicio de aislamiento que trabaja la parte media
  (lateral) del deltoides para conseguir unos hombros más anchos y definidos. La trayectoria fija de la
  máquina aporta mayor estabilidad que las mancuernas, lo que la hace ideal para principiantes o para
  quienes quieren centrarse únicamente en la activación muscular.
