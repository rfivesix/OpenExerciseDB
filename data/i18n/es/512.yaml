name: Remo Gironda
description: Coloca la polea en el peldaño más bajo de la máquina. Coloque los pies en los soportes disponibles, si no hay
  soporte, busca un step y colócalo delante de la máquina antes de colocar los pies en ella. Comienza con los brazos completamente
  extendidos, ya que este movimiento se dirige a los dorsales y esta posición es la que mejor compromete la zona. Mantén la
  cabeza, la espalda y la columna vertebral alineadas de forma neutra, con el pecho elevado y el núcleo comprometido. Con
  una pequeña flexión de las rodillas, tira del accesorio hacia tu cuerpo hasta justo debajo del ombligo, iniciando el movimiento
  llevando los codos hacia las caderas, manteniendo los codos dentro. Cuando el agarre (accesorio) llegue a tu torso, aprieta
  los dorsales y los omóplatos, manteniendo la contracción durante 1-2 segundos. Vuelve al principio y repite el número de
  repeticiones deseado.
