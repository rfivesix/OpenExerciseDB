name: Aperturas con mancuernas
description: Toma dos mancuernas y túmbate en un banco. Asegúrate de tener los pies firmes en el suelo
  y la espalda bien apoyada, sin arquearla. Extiende los brazos delante de ti, aproximadamente a la anchura
  de los hombros. Flexiona ligeramente los codos y baja los brazos hacia los lados describiendo un semicírculo.
  Sin cambiar el ángulo de los codos, vuelve a juntarlos arriba con un movimiento fluido.
