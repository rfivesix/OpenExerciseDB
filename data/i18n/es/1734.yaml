name: Zancada con kettlebell a una pierna
description: 'Cómo hacer la zancada unilateral con kettlebell:

  Preparación: Ponte de pie con los pies juntos. Sujeta la kettlebell por el asa con ambas manos cerca
  del pecho, o con una mano del mismo lado de la pierna que trabaja.

  Paso y descenso: Da un paso largo hacia delante —o hacia atrás, que la fuente señala como opción más
  segura para las rodillas— y baja las caderas hasta que ambas rodillas formen un ángulo de 90 grados.

  Enfoque: Carga el peso sobre la pierna adelantada o flexionada, mantén la espalda recta y el torso erguido.

  Vuelta: Impúlsate con la pierna adelantada para regresar al inicio.'
