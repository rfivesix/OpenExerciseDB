name: Estiramiento del elevador de la escápula derecho
description: 'Posición inicial:

  Siéntate o ponte de pie con la espalda recta. Gira la cabeza unos 45 grados hacia la derecha. Coloca
  la mano izquierda detrás de la espalda o siéntate sobre ella para fijar el hombro izquierdo hacia abajo.
  Coloca la mano derecha en la parte posterior de la cabeza.


  Ejecución:

  1. Inclina suavemente el mentón en diagonal hacia abajo, en dirección a tu axila derecha, hasta sentir
  el estiramiento en la parte posterior del cuello y hacia el omóplato izquierdo.

  2. Aplica una presión muy suave con la mano derecha para guiar el estiramiento sin forzar.

  3. Mantén la posición de 20 a 30 segundos respirando con tranquilidad y regresa despacio al centro.'
