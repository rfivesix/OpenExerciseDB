name: Estiramiento mariposa
description: 'Posición inicial: Siéntate erguido en el suelo y junta las plantas de los pies, dejando
  caer las rodillas hacia los lados.


  Ejecución: Sujeta los pies o los tobillos y acerca suavemente los talones a la ingle. Alarga la columna
  y deja que las rodillas se acerquen al suelo.


  Consejos: Mantén 20–30 segundos respirando con regularidad. Evita los rebotes bruscos.'
