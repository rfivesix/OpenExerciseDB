name: Fondos en el suelo
description: Siéntate en el suelo con las rodillas flexionadas y los pies apoyados. Coloca las manos justo
  detrás de las caderas, con los dedos orientados hacia los pies, y eleva las caderas unos centímetros.
  Flexiona los codos para bajar las caderas hacia el suelo, manteniéndolos dirigidos hacia atrás y cerca
  del cuerpo. Empuja con las palmas para extender los brazos y elevar de nuevo las caderas. La flexión
  debe producirse en los codos, no solo balanceando las caderas.
