name: Peso muerto desde soportes
description: 'Variante de peso muerto realizada desde los soportes de seguridad de un rack de potencia
  o de una máquina Smith, normalmente con la barra colocada justo por debajo de las rodillas o a su altura.

  Ponte de pie con los pies al ancho de las caderas, lleva las caderas hacia atrás y sujeta la barra justo
  por fuera de las piernas. Tira extendiendo las caderas y las rodillas, empuja con los talones y contrae
  los glúteos al terminar. Baja la barra de forma controlada hasta los soportes. Este ejercicio enfatiza
  la parte superior e inferior de la espalda y los glúteos.'
