name: Plancha Alta
description: Colócate en la posición inicial de una flexión de pecho (push-up), con las manos directamente
  debajo de los hombros y los brazos extendidos. Aprieta con fuerza el abdomen y los glúteos para mantener
  tu cuerpo en una línea completamente recta desde la cabeza hasta los talones. Sostén la posición por
  el tiempo deseado sin dejar que la cadera se caiga.
