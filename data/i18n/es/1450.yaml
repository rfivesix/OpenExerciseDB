name: Estiramiento de cobra
description: Túmbate boca abajo en una colchoneta con las piernas extendidas y los empeines apoyados.
  Coloca las manos debajo o ligeramente delante de los hombros, con los codos cerca de las costillas.
  Empuja suavemente con las palmas para elevar el pecho y el torso mientras la pelvis y las caderas permanecen
  apoyadas. Lleva los hombros abajo y atrás para alargar el cuello y abrir el pecho. Mantén el estiramiento
  de 15 a 30 segundos respirando con calma; baja lentamente.
