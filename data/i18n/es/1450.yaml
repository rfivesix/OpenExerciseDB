exercise_id: '1450'
language: es
status: ai_reviewed
name: Postura de la cobra (Cobra Stretch)
description: |-
  Posición inicial:
  • Túmbate boca abajo sobre una esterilla con las piernas extendidas hacia atrás y los empeines apoyados en el suelo.
  • Coloca las palmas de las manos en el suelo a los lados del pecho, debajo de los hombros, con los codos pegados al cuerpo.

  Ejecución:
  • Presiona con las manos contra el suelo para elevar lentamente el pecho y la cabeza, manteniendo la pelvis en contacto con el suelo.
  • Aleja los hombros de las orejas abriendo el pecho y alargando la columna.
  • Mantén la postura durante 15 a 30 segundos respirando de manera fluida y relajada.
  • Desciende el torso lentamente hacia el suelo con control.
