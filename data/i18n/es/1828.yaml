name: Maniobra de retracción abdominal (ADIM)
description: 'Posición inicial: Túmbate boca arriba en una esterilla, con las rodillas flexionadas y los
  pies apoyados; también se puede hacer en cuadrupedia o sentado. Coloca las yemas de los dedos en la
  parte baja del abdomen, justo dentro de los huesos de la cadera, para notar la activación.


  Ejecución:

  1. Exhala por completo por la boca.

  2. Lleva suavemente el ombligo hacia dentro y arriba, hacia la columna, como si cerraras una cremallera.

  3. Mantén la columna neutra y la pelvis estable, sin aplastar la zona lumbar contra el suelo.

  4. Sostén la contracción profunda 10–15 segundos mientras respiras de forma superficial y constante.

  5. Relaja lentamente y respira con normalidad antes de repetir.


  Indicaciones: Este ejercicio aísla específicamente el transverso abdominal, el estabilizador profundo
  del core responsable de la estabilidad y el control del contorno de la cintura.'
