name: Activación del transverso abdominal (Vacuum)
description: "Posición inicial:\nTúmbate boca arriba en una colchoneta con las rodillas\
  \ dobladas y los pies planos en el suelo. Apoya las yemas de los dedos sobre el\
  \ abdomen inferior para sentir la contracción muscular.\n\nEjecución:\n1. Exhala\
  \ completamente por la boca expulsando todo el aire.\n2. Lleva suavemente el ombligo\
  \ hacia adentro y hacia arriba en dirección a la columna, como abrochando un pantalón\
  \ ajustado.\n3. Mantén la pelvis neutra y respira de forma suave y controlada mientras\
  \ sostienes el ombligo hundido durante 10 a 15 segundos.\n4. Relaja la contracción\
  \ suavemente e inhala con normalidad.\n\nConsejos:\nAísla la musculatura profunda\
  \ del transverso del abdomen sin curvar la espalda baja."
