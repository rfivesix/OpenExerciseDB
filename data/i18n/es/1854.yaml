name: Foam Roller Gemelos
description: "Posición inicial: Siéntate en el suelo y coloca el rodillo de espuma\
  \ (foam roller) debajo de las pantorrillas, entre el tendón de Aquiles y el hueco\
  \ poplíteo. Apoya las manos detrás de ti y eleva ligeramente la pelvis.\nEjecución:\
  \ Rueda lentamente hacia adelante y hacia atrás desde los tobillos hasta justo debajo\
  \ de las rodillas. Gira las piernas ligeramente hacia dentro y hacia fuera para\
  \ masajear toda la musculatura del gemelo.\nConsejos: Detente en los puntos de mayor\
  \ tensión durante 15-20 segundos manteniendo una respiración fluida."
