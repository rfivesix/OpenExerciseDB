name: Rodillo de espuma para pantorrillas
description: 'Posición inicial: Siéntate en el suelo y coloca el rodillo horizontal bajo las pantorrillas,
  entre el tendón de Aquiles y la parte posterior de las rodillas. Apóyate en las manos detrás de ti y
  eleva ligeramente las caderas.


  Ejecución: Rueda lentamente hacia delante y atrás desde justo encima de los tobillos hasta debajo de
  las rodillas. Gira las piernas ligeramente hacia dentro y fuera para trabajar la cara interna y externa
  de las pantorrillas.


  Consejos: Haz una pausa de 15–20 segundos en los puntos sensibles mientras respiras hondo.'
