name: Ejercicio de aducción Copenhagen
description: |-
  Túmbate de lado con el codo colocado justo debajo del hombro, similar a la posición de una plancha lateral. Apoya la pierna superior sobre un banco, con la cara interna del pie o el tobillo descansando sobre él. Levanta las caderas y mantén el cuerpo en línea recta mientras la pierna inferior se mantiene separada del suelo. El ejercicio activa con fuerza los aductores de la pierna superior y, a la vez, exige al core y a los estabilizadores de la cadera.
