name: Jalón unilateral en media rodilla
search_terms:
- "Jalón unilateral en media rodilla"
- "Jalón de dorsales en media rodilla"
description: 'Posición inicial:

  Coloca una polea alta con una empuñadura individual. Arrodíllate sobre la rodilla del lado que trabaja
  y adelanta el pie contrario para mantener el equilibrio. Sujeta el agarre con el brazo extendido por
  encima de la cabeza.


  Ejecución:

  1. Lleva el agarre hacia el hombro y dirige el codo hacia abajo, en dirección a la cadera.

  2. Contrae el dorsal al final del movimiento.

  3. Deja que el brazo vuelva lentamente por encima de la cabeza y siente el estiramiento en el costado
  de la espalda.


  Consejos:

  Mantén el torso erguido y el abdomen activo. La posición de media rodilla limita el balanceo del tren
  inferior y aísla el dorsal ancho.'
