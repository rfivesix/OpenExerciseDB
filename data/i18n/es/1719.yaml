name: Jalón unilateral en postura de caballero
description: |-
  Posición inicial:
  Ajusta la polea en posición alta con un agarre individual. Adopta una postura de caballero (apoyando en el suelo la rodilla del mismo lado que realiza la fuerza y la otra pierna adelantada). Sujeta el agarre con el brazo extendido hacia arriba.
  
  Ejecución:
  1. Tira del agarre hacia abajo en dirección al hombro, llevando el codo hacia la cadera.
  2. Contrae intensamente el dorsal en la parte inferior del movimiento.
  3. Permite que el brazo vuelva a extenderse lentamente hacia arriba, sintiendo el estiramiento del dorsal.
  
  Consejos:
  Mantén el tronco erguido y el core firme durante todo el recorrido.
