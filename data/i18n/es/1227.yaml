name: Remo para deltoides posterior con mancuernas
description: 'Posición inicial:

  • Sujeta una mancuerna en cada mano e inclina el torso hacia delante desde la cadera con la espalda
  recta hasta quedar casi paralelo al suelo.

  • Deja que los brazos cuelguen verticalmente con las palmas mirando hacia atrás (agarre prono).


  Ejecución:

  • Rema elevando los codos bien abiertos hacia los lados en un ángulo de unos 90 grados respecto al torso.

  • Sube hasta que los brazos queden paralelos al suelo contrayendo con fuerza el deltoides posterior.

  • Desciende lentamente de forma controlada sin perder la posición neutral de la columna.'
