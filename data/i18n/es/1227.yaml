name: Remo para deltoides posterior con mancuernas
description: |-
  Sujeta una mancuerna en cada mano. Flexiónate por la cadera hasta que la espalda quede casi paralela al suelo. Deja que los brazos cuelguen hacia abajo. Mantén los brazos en línea con los hombros. Flexiona y eleva los codos hacia los lados hasta que los brazos queden paralelos al suelo. Vuelve lentamente y repite.
