name: Press de pecho en polea inclinado
description: Press de pecho a un brazo realizado con la máquina de poleas. Usa el otro brazo para apoyar
  el peso corporal y centrarte en la fuerza del empuje, en lugar de en el equilibrio del cuerpo. Empieza
  con la mano lo más cerca posible del pecho y después empuja contra el cable con una ligera inclinación,
  dirigiéndote hacia el centro de tu pecho.
