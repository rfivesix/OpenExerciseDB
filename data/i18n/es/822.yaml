name: Aperturas posteriores con polea
description: Ajusta las poleas aproximadamente a la altura de la cabeza o de los ojos. Sujeta el cable
  izquierdo con la mano derecha y el derecho con la izquierda, cruzándolos delante del cuerpo. Abre y
  lleva los brazos hacia atrás en un arco horizontal amplio, manteniendo una ligera flexión fija en los
  codos. Contrae los deltoides posteriores al final del recorrido y devuelve lentamente las asas cruzadas
  delante del pecho con control.
