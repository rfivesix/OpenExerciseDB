name: Aperturas Posteriores en Polea
description: '- Ajusta las poleas a una posición alta, aproximadamente a la altura
  de los ojos o de la cabeza.

  - Con la mano derecha agarra la polea izquierda y con la mano izquierda la polea
  derecha, cruzando los cables frente a ti.

  - Abre los brazos hacia los lados y hacia atrás en un arco amplio manteniendo una
  ligera flexión fija en los codos.

  - Aprieta los deltoides posteriores en el punto de máxima contracción y regresa
  lentamente a la posición inicial con control.'
