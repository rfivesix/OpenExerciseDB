name: Arrancada olímpica
search_terms:
- "Arrancada olímpica"
- "Arrancada"
description: Colócate sobre la barra con los pies al ancho de las caderas y un agarre amplio. Mantén la
  espalda recta, el pecho elevado y los hombros algo por delante de la barra. Levántala suavemente desde
  el suelo y mantenla cerca de las espinillas y los muslos. Al llegar al pliegue de la cadera, extiende
  explosivamente caderas, rodillas y tobillos para acelerar la barra. Métete rápidamente debajo en una
  sentadilla profunda y recíbela por encima de la cabeza con los brazos extendidos. Estabilízala y ponte
  de pie manteniéndola sobre el centro de gravedad.
