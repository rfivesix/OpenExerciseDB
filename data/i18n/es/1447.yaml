exercise_id: '1447'
language: es
status: ai_reviewed
name: Arrancada olímpica (Snatch)
description: |-
  Posición inicial:
  • Colócate frente a la barra con los pies a la anchura de las caderas y toma un agarre ancho (agarre de arrancada / hook grip).
  • Mantén la espalda recta, el pecho alto y los hombros ligeramente por delante de la barra.

  Ejecución:
  • Levanta la barra del suelo de forma controlada manteniéndola pegada a las piernas.
  • Al llegar a la cadera, extiende de forma explosiva cadera, rodillas y tobillos (triple extensión).
  • Desciende con rapidez debajo de la barra para recibirla en una sentadilla profunda con los brazos bloqueados sobre la cabeza.
  • Ponte de pie de manera firme y controlada manteniendo la barra por encima de la cabeza hasta completar el levantamiento.
