name: Estiramiento Lateral Derecho de Cuello
description: 'Este ejercicio busca alargar los músculos del costado del cuello, principalmente el trapecio
  superior y escalenos.

  Instrucciones:

  Sentado o de pie, con la espalda recta y los hombros relajados, inclina suavemente tu oreja derecha
  hacia tu hombro derecho.

  Para profundizar el estiramiento, coloca tu mano derecha sobre el costado izquierdo de la cabeza y aplica
  una presión muy suave y gentil para ayudar a bajar un poco más. Mantén el estiramiento de 15 a 30 segundos
  sin forzar ni rebotar.'
