name: Sentadilla dividida en máquina Smith
description: La sentadilla dividida en máquina Smith es un ejercicio de fuerza realizado en la máquina
  Smith, adecuado para trabajar las piernas y los glúteos. Coloca un pie delante y el otro detrás y baja
  el cuerpo hasta que el muslo delantero quede paralelo al suelo, mientras la barra se desplaza verticalmente
  por la máquina. El ejercicio ayuda a mejorar la estabilidad y corregir desequilibrios musculares, y
  reduce la tensión en la espalda al ofrecer un entorno estable para entrenar fuerza.
