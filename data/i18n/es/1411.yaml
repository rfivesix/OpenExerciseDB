name: Toques de talón
description: Túmbate boca arriba en una colchoneta, con las rodillas flexionadas, los pies apoyados al
  ancho de las caderas y los brazos a los lados, con las palmas hacia dentro y separadas del suelo. Eleva
  ligeramente la cabeza, los hombros y la parte superior de la espalda; mantén el cuello neutro y la barbilla
  algo recogida. Flexiona el tronco hacia la derecha y acerca la mano derecha al talón derecho. Vuelve
  al centro y repite hacia la izquierda, alternando de forma controlada. Espira al alcanzar el talón e
  inspira al volver al centro.
