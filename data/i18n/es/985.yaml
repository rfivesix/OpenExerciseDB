name: Flexión con rotación
description: Colócate en posición de plancha alta, con las manos algo más separadas que los hombros y
  el cuerpo alineado. Baja el pecho hacia el suelo como en una flexión. Al empujar para subir, gira el
  torso y eleva un brazo recto hacia el techo, formando una T. Vuelve a apoyar la mano de forma controlada,
  haz otra flexión y gira hacia el lado contrario. Mantén el tronco firme y evita que la zona lumbar se
  hunda.
