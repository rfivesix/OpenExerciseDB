name: Toes to bar (pies a la barra)
description: 'El nombre „Toes to bar" lo dice todo: en este ejercicio, en el que cuelgas de una barra
  de dominadas, llevas los dedos de los pies hacia la barra, apuntando hacia tu cara. Esto trabaja de
  verdad los abdominales. „Toes to bar" es popular en programas de fitness funcional como Freeletics y
  CrossFit, y es un ejercicio eficaz para entrenar el six-pack.'
