name: Estiramiento intenso del pecho
description: 'Posición inicial: Túmbate boca arriba en un banco plano con mancuernas
  ligeras, o ponte junto a un marco de puerta o poste firme con el brazo apoyado a
  la altura del hombro.


  Ejecución: Deja que los brazos desciendan lentamente hacia fuera, hasta una posición
  profunda de apertura de pecho y un estiramiento intenso y sostenido de los pectorales.
  Respira profundamente hacia las costillas y mantén la postura con control durante
  30–60 segundos, sin rebotes.


  Consejos: Debes sentir un estiramiento muscular marcado, no una molestia aguda en
  el hombro. El texto fuente la propone al final del entrenamiento para trabajar la
  flexibilidad y la recuperación del tejido.'
