name: Press de banca
description: 'Túmbate en un banco; la barra debe quedar justo encima de los ojos. Mantén las rodillas
  algo flexionadas y los pies firmes en el suelo. Concéntrate, respira hondo y sujeta la barra con las
  manos más separadas que los hombros. Bájala lentamente hasta que toque brevemente el pecho a la altura
  de los pezones y vuelve a empujarla hacia arriba.

  Si entrenas con mucho peso, es aconsejable contar con un compañero que pueda ayudarte si no logras levantarlo
  por tu cuenta.

  La anchura del agarre también permite cambiar qué zona del pecho se trabaja más:

  agarre ancho: músculos pectorales externos;

  agarre estrecho: músculos pectorales internos y tríceps.'
