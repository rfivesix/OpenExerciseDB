name: Jalón al pecho con agarre ancho
description: El jalón al pecho es un ejercicio de tracción que trabaja principalmente el dorsal ancho
  (comúnmente llamado dorsal). Consiste en tirar hacia el pecho de una barra o agarre unido a un cable,
  sentado en una máquina diseñada para este ejercicio. Suele hacerse con agarre ancho, aunque también
  puede usarse un agarre estrecho o supino para enfatizar otros músculos de la espalda y los brazos. Es
  un ejercicio popular para desarrollar la fuerza del tren superior y mejorar la postura.
