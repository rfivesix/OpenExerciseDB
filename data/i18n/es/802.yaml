name: Zancadas Caminando con Barra
description: '- Coloca una barra sobre la parte alta de la espalda (trapecios) y mantén
  una postura erguida con los pies al ancho de las caderas.

  - Da un paso amplio hacia adelante con una pierna y desciende flexionando ambas
  rodillas a 90 grados.

  - Empuja con el talón de la pierna adelantada para elevarte y lleva directamente
  la pierna trasera hacia adelante para la siguiente zancada.

  - Avanza de forma fluida y alterna manteniendo siempre el torso recto y el abdomen
  firme.'
