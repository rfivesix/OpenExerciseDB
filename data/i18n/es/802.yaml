name: Zancada caminando con barra
search_terms:
- Zancadas caminando con barra
description: Apoya la barra sobre la parte superior de la espalda, en los trapecios, y ponte erguido con
  los pies al ancho de las caderas. Da un paso controlado hacia delante con una pierna y baja las caderas
  hasta flexionar ambas rodillas aproximadamente 90 grados. Empuja con el talón delantero para levantarte
  y da inmediatamente un paso hacia delante con la pierna que queda atrás para iniciar la siguiente zancada.
  Sigue avanzando con un ritmo fluido y alterno, manteniendo el torso erguido y el abdomen activo.
