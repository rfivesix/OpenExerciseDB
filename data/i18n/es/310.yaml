name: Remo inclinado con mancuernas
description: 'Apóyate sobre un banco inclinado y usa un agarre neutro.

  Sujeta una mancuerna en cada mano con agarre neutro y empieza con los brazos rectos. Esta es la posición
  inicial.

  Retrasa las escápulas y flexiona los codos para llevar las mancuernas hacia los costados.

  Haz una pausa arriba y vuelve a la posición inicial.'
