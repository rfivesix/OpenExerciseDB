name: Snap Down
description: 'Posición inicial:

  Ponte de pie con los brazos extendidos sobre la cabeza y elévate sobre las puntas
  de los pies para estirar el cuerpo al máximo.


  Ejecución:

  1. Baja los brazos de forma rápida y explosiva hacia los costados mientras flexionas
  caderas y rodillas para descender a una posición atlética baja.

  2. Absorbe el aterrizaje con toda la planta del pie, manteniendo el pecho erguido
  y el core firme.

  3. Mantén la posición un segundo antes de incorporarte.'
