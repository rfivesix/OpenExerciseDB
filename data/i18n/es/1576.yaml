name: Snap Down
description: 'Posición inicial:

  Ponte de pie con los pies separados al ancho de los hombros. Extiende los brazos sobre la cabeza y elévate
  sobre las puntas de los pies, alargando el cuerpo todo lo posible.


  Ejecución:

  1. Baja los brazos de forma explosiva mientras desciendes rápidamente las caderas y flexionas las rodillas
  hasta una postura atlética firme.

  2. Aterriza suavemente apoyando todo el pie y absorbe la fuerza con el pecho erguido, las caderas hacia
  atrás y el core contraído.

  3. Mantén brevemente la posición estable antes de reiniciar.


  Indicaciones:

  Desarrolla la desaceleración rápida, la mecánica de aterrizaje y el control excéntrico como preparación
  para saltos explosivos y cambios de dirección.'
