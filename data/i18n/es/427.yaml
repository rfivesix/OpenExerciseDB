name: Crunch declinado
description: Siéntate en el banco declinado y fija las piernas. Cruza los brazos sobre el pecho y eleva
  el torso con un movimiento de enrollamiento. Después, bájalo lentamente sin hacer una pausa. No muevas
  la cabeza durante el ejercicio.
