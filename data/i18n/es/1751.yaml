name: Pull-through en polea
description: 'Coloca una cuerda en la posición más baja de la polea. Ponte de espaldas a la máquina, pasa
  el cable entre las piernas y sujeta los extremos con ambas manos. Da dos pasos hacia delante para tensar
  el cable y separa los pies algo más que el ancho de los hombros, con las rodillas ligeramente flexionadas.


  1. Lleva las caderas hacia atrás manteniendo la espalda recta y los hombros estables.

  2. Deja que la cuerda pase entre las piernas hasta notar un estiramiento profundo en los isquiotibiales.

  3. Impulsa las caderas hacia delante para ponerte erguido y contrae los glúteos arriba.


  Es una bisagra de cadera, no una sentadilla. Mantén los brazos relajados y rectos; no tires del peso
  con la parte superior del cuerpo.'
