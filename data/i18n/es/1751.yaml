name: Pull-through en polea
description: "Posición inicial:\nColoca una cuerda en la polea más baja. Ponte de\
  \ espaldas a la máquina con el cable pasando entre tus piernas. Sujeta los extremos\
  \ de la cuerda, da un par de pasos adelante para generar tensión y adopta una postura\
  \ con los pies un poco más anchos que los hombros.\n\nEjecución:\n1. Empuja la cadera\
  \ hacia atrás flexionando las caderas (patrón de bisagra) con la espalda recta y\
  \ las rodillas apenas flexionadas.\n2. Permite que la cuerda se desplace hacia atrás\
  \ hasta sentir un estiramiento marcado en los isquiotibiales.\n3. Extiende la cadera\
  \ hacia adelante con fuerza apretando los glúteos al máximo al llegar arriba.\n\n\
  Consejos:\nNo conviertas el ejercicio en una sentadilla; los brazos actúan únicamente\
  \ como ganchos mientras la fuerza proviene de las caderas."
