name: Empuje de tríceps con cuerda en polea
description: '- Sujeta la cuerda en la polea alta, de pie con los pies al ancho de
  los hombros y el torso ligeramente inclinado hacia delante.

  - Con los codos fijos pegados al cuerpo, empuja la cuerda hacia abajo estirando
  los brazos.

  - Separa los extremos de la cuerda hacia fuera en la parte más baja para maximizar
  la contracción de los tríceps.

  - Regresa de forma controlada a la posición inicial sin dejar que los codos se desplacen
  hacia delante.'
