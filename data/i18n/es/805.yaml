name: Extensión de tríceps con cuerda en polea
description: La extensión de tríceps con cuerda en polea es un ejercicio popular para trabajar los tríceps.
  Es fácil de aprender y realizar, por lo que gusta tanto a principiantes como a personas avanzadas. Suele
  hacerse con un número moderado o alto de repeticiones, por ejemplo 8–12 o más por serie, como parte
  de un entrenamiento de tren superior o centrado en los brazos.
