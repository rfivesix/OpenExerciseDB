name: Curl de bíceps con mancuernas
description: 'Sujeta dos mancuernas con los brazos extendidos a los lados y las palmas hacia dentro. Flexiona
  los brazos y sube las pesas con un movimiento rápido. Al iniciar el movimiento, gira los brazos 90 grados.
  En el punto más alto, gira las pesas un poco más hacia fuera. Sin pausa, bájalas lentamente.

  No balancees el cuerpo durante el ejercicio: el trabajo lo hacen los bíceps y solo deben moverse los
  brazos (presta atención a los codos).'
