name: Elevación lateral y frontal con mancuernas
description: 'De pie con los pies al ancho de los hombros, sujeta las mancuernas a los lados y flexiona
  ligeramente los codos. Eleva los brazos lateralmente hasta la altura de los hombros; manteniéndolos
  a esa altura, llévalos horizontalmente hacia delante hasta juntar las mancuernas frente al pecho. Baja
  lentamente por delante de los muslos. En repeticiones alternas, invierte la secuencia: eleva primero
  al frente, abre hacia los lados y baja.'
