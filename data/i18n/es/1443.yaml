name: Elevación combinada lateral y frontal con mancuernas
description: |-
  Posición inicial:
  • De pie con los pies a la anchura de los hombros, sujeta un par de mancuernas a los lados del cuerpo con los codos ligeramente flexionados.

  Ejecución:
  • Eleva las mancuernas lateralmente sin balanceo hasta la altura de los hombros (elevación lateral).
  • Manteniendo los brazos a la altura de los hombros, desplázalos horizontalmente hacia el frente hasta juntar las mancuernas delante del pecho.
  • Desciende las mancuernas de forma controlada por delante de los muslos.
  • Puedes alternar el orden subiendo por el frente, abriendo hacia los lados y descendiendo.
