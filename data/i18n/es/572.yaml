name: Encogimiento de hombros con mancuernas
description: 'Ponte de pie con el cuerpo recto y los brazos colgando a los lados, con una mancuerna en cada mano.
  Eleva los hombros lo máximo posible sin flexionar los brazos. En el punto más alto, haz una pausa breve de 1 o
  2 segundos y vuelve lentamente a la posición inicial.

  Si entrenas con más peso, asegúrate de realizar todo el recorrido.'
