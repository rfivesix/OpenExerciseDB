name: Sentadilla al cajón
description: Coloca el cajón detrás de ti, a unos 90 cm de un soporte para sentadillas si vas a usar una
  barra. Elige una altura que te permita bajar con la espalda recta y tocar suavemente el cajón con los
  glúteos. Ponte de pie con los pies separados al ancho de los hombros y las puntas ligeramente hacia
  fuera; activa el tronco y mantén la espalda neutra. Si usas barra, colócala a la altura de los hombros.
  Lleva las caderas hacia atrás como si fueras a sentarte y baja de forma controlada hasta tocar suavemente
  el cajón, sin dejarte caer. Haz una pausa breve y empuja con los talones para volver a la posición inicial.
  El texto fuente menciona mejoras en coordinación, equilibrio y resistencia, tonificación de las piernas
  y los glúteos, y un aumento general de la densidad ósea que eliminaría el riesgo de osteoporosis.
