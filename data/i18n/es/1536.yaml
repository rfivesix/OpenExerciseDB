name: Estiramiento de hombro cruzado
description: 'Posición inicial:

  Ponte de pie o siéntate erguido, con los hombros relajados y la columna en posición neutra.


  Ejecución:

  1. Lleva un brazo horizontalmente por delante del pecho, a la altura del hombro.

  2. Con la mano contraria, presiona suavemente la parte superior del brazo o el codo para acercarlo al
  torso, hasta notar un estiramiento cómodo en la parte posterior del hombro.

  3. Mantén la posición entre 20 y 30 segundos mientras respiras con regularidad.

  4. Suelta lentamente y repite con el otro brazo.


  Indicaciones:

  Estira eficazmente el deltoides posterior y los rotadores externos. Evita elevar el hombro hacia la
  oreja.'
