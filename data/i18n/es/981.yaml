name: Subida al cajón
description: Colócate erguido frente a un banco, cajón o escalón estable, con los pies separados al ancho
  de las caderas. Apoya todo el pie derecho sobre la superficie y empuja con el talón hasta extender la
  pierna derecha. Toca la superficie con el pie izquierdo o eleva la rodilla izquierda. Baja de forma
  controlada, primero con el pie izquierdo y luego con el derecho. Mantén el torso erguido y no te impulses
  demasiado con la pierna que queda atrás.
