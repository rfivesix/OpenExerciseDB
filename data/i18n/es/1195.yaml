exercise_id: '1195'
language: es
status: ai_reviewed
name: Desplazamientos laterales con sentadillas
description: |-
  Posición inicial:
  • Colócate en una postura atlética baja con los pies un poco más separados que el ancho de los hombros.
  • Mantén las rodillas flexionadas y el centro de gravedad bajo.

  Ejecución:
  • Realiza tres deslizamientos o pasos laterales rápidos en una dirección empujando con la pierna trasera.
  • Tras el tercer paso, frena en seco y ejecuta una sentadilla profunda y controlada.
  • Gira 180 grados sobre la pierna exterior o invierte el sentido para repetir la secuencia hacia el lado opuesto.
