name: Golpes de puño
description: Adopta una postura de boxeo equilibrada con un pie delante y las rodillas ligeramente flexionadas.
  Lleva las manos a la altura de la barbilla con los codos cerca de las costillas. Lanza puñetazos rectos
  alternos (jab y cruzado) hacia delante a un ritmo rápido y constante. Gira las caderas y el torso en
  cada golpe y rota el puño al extender el brazo. Devuelve rápidamente cada mano a la guardia y mantén
  el abdomen activo, espirando con cada golpe.
