name: Aperturas con banda elástica (Band Pull-Apart)
description: |-
  Posición inicial:
  Ponte de pie erguido con los pies al ancho de las caderas. Sujeta una banda elástica con ambas manos a la anchura de los hombros frente a ti a la altura del pecho, con los brazos extendidos y los codos ligeramente desbloqueados.

  Ejecución:
  Separa la banda abriendo los brazos horizontalmente hacia los lados y hacia atrás, juntando firmemente las escápulas hasta que la banda toque el pecho. Mantén la contracción en la parte posterior del hombro y la espalda alta durante un segundo y regresa despacio a la posición inicial.

  Consejos:
  No encojas los hombros hacia las orejas ni arquees la espalda lumbar. Mantén el movimiento estrictamente controlado.
