exercise_id: '1224'
language: es
status: ai_reviewed
name: Drag curls con mancuernas
description: |-
  Posición inicial:
  • Ponte de pie erguido sosteniendo una mancuerna en cada mano con agarre supino (palmas hacia delante).
  • Deja que los brazos cuelguen por delante de los muslos con el pecho elevado.

  Ejecución:
  • Desliza o arrastra las mancuernas verticalmente hacia arriba pegadas al torso llevando los codos hacia atrás.
  • Eleva las mancuernas hasta la altura del pecho manteniendo la cercanía al cuerpo para aislar los bíceps.
  • Contrae al máximo los bíceps arriba y desciende lentamente por el mismo recorrido.
