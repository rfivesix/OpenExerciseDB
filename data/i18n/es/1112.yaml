name: Flexiones declinadas con pies elevados
description: 'Posición inicial:

  Coloca los pies sobre un banco o cajón firme y las manos en el suelo, directamente debajo o algo más
  separadas que los hombros. Mantén el cuerpo en una línea diagonal firme desde los talones hasta la cabeza.


  Ejecución:

  1. Flexiona los codos y baja el pecho hacia el suelo con control, manteniendo el abdomen firme y las
  caderas elevadas.

  2. Desciende hasta que la nariz o la parte superior del pecho casi rocen el suelo.

  3. Empuja el suelo y extiende los brazos para volver arriba.

  4. Esta variante aumenta la carga sobre la parte superior del pectoral y los deltoides anteriores.'
