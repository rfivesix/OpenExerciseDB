exercise_id: '1112'
language: es
status: ai_reviewed
name: Flexiones declinadas con pies elevados
description: |-
  Posición inicial:
  Coloca los pies sobre un banco o cajón resistente y apoya las manos en el suelo a la anchura de los hombros. El cuerpo debe formar una línea recta diagonal desde los talones hasta la cabeza.

  Ejecución:
  1. Flexiona los codos y baja el pecho de forma controlada hacia el suelo.
  2. Mantén el abdomen contraído para que las caderas no se hundan ni se eleven en exceso.
  3. Desciende hasta que el pecho o la nariz casi toquen el suelo.
  4. Empuja fuertemente contra el suelo extendiendo los brazos hasta la posición de inicio.
  5. Este ejercicio enfatiza la porción clavicular superior del pectoral mayor y los deltoides anteriores.
