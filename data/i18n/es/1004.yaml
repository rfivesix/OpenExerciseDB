name: Rotación de Hombros Hacia Adelante
description: 'Este ejercicio es ideal para la movilidad y el calentamiento de la articulación del hombro.

  Descripción:

  De pie o sentado con la espalda recta, coloca las yemas de tus dedos sobre tus hombros. Desde esa posición,
  dibuja círculos amplios y controlados con tus codos.

  Para la rotación hacia adelante, lleva los codos hacia el frente (buscando que se toquen), luego hacia
  arriba, hacia atrás y finalmente hacia abajo para completar el círculo.'
