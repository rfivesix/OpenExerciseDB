exercise_id: '1022'
language: es
status: upstream_unreviewed
name: Remo en Plancha con un Brazo
description: |-
  Comienza en una posición de plancha alta (como para hacer una flexión), pero con las manos agarrando unas mancuernas que están apoyadas en el suelo. Separa los pies un poco más que el ancho de tus caderas para tener una base más estable. Desde ahí, manteniendo el abdomen y los glúteos apretados para que tu cuerpo no se gire, jala una mancuerna hacia tu costado, llevando el codo hacia el techo. Haz una pausa arriba, baja la mancuerna de forma controlada y repite el movimiento. Completa todas las repeticiones de un lado antes de cambiar al otro.
