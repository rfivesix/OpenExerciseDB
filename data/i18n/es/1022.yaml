name: Remo en plancha con mancuerna a un brazo
description: |-
  Posición inicial:
  Colócate en posición de plancha alta (apoyando las manos sobre mancuernas en el suelo o una mano en el suelo y la otra sobre la mancuerna). Coloca los pies separados al ancho de los hombros o un poco más para tener una base estable.

  Ejecución:
  1. Activa fuertemente el abdomen y los glúteos para evitar que la cadera rote o se desplace hacia los lados.
  2. Tira de la mancuerna hacia tu cadera con un movimiento de remo controlado, llevando el codo pegado al costado.
  3. Pausa brevemente en la parte superior para contraer el dorsal y la espalda alta.
  4. Baja la mancuerna de forma lenta y controlada hasta el suelo.
  5. Completa todas las repeticiones de un lado antes de cambiar de brazo.
