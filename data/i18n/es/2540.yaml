name: Jalón al pecho isométrico
description: 'Posición inicial: Siéntate en una máquina de jalón al pecho y ajusta el apoyo para que los
  muslos queden bien sujetos. Sujeta la barra ancha con agarre prono, más abierto que los hombros. Siéntate
  erguido, con el pecho elevado, las escápulas retraídas y deprimidas, y el torso ligeramente inclinado
  hacia atrás.


  Ejecución: Tira de la barra suavemente hasta justo debajo de la barbilla o a la altura de la parte superior
  del pecho. Mantén esta posición de máxima contracción completamente inmóvil durante el tiempo indicado,
  llevando los codos hacia abajo y contrayendo al máximo los dorsales y la zona media de la espalda. Al
  terminar, suelta y guía la barra hacia arriba despacio y con control.


  Indicaciones: No dejes que la pila de pesas tire bruscamente de tus brazos al final de la serie. Mantén
  el pecho elevado y evita redondear los hombros hacia delante durante la pausa.'
