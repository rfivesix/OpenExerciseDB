name: Flexiones de Pino
description: '- Colócate en posición de pino (handstand) apoyando los pies contra
  una pared sólida, con las manos a la anchura de los hombros y el core firme.

  - Flexiona los codos de forma controlada descendiendo el cuerpo hasta que la coronilla
  roce suavemente el suelo o colchoneta.

  - Empuja con fuerza a través de los hombros y tríceps para volver a extender los
  brazos por completo en la posición inicial.'
