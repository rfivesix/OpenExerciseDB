name: Curl Nórdico
description: '- Arrodíllate sobre una colchoneta y asegura firmemente los tobillos
  bajo una barra fija o con la ayuda de un compañero.

  - Mantén el torso y las caderas completamente alineados en una línea recta desde
  las rodillas hasta la cabeza.

  - Desciende el cuerpo hacia adelante de la forma más lenta y controlada posible
  frenando la caída con los isquiotibiales.

  - Apoya suavemente las manos en el suelo en el punto más bajo y empuja ligeramente
  para ayudar a regresar a la posición vertical inicial.'
