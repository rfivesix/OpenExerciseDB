name: Curl nórdico
description: Arrodíllate sobre una superficie acolchada y fija los tobillos bajo una barra inmóvil o pide
  a un compañero que los sujete. Mantén el torso erguido y tensa glúteos y abdomen para formar una línea
  rígida de las rodillas a la cabeza. Inclina el torso hacia el suelo tan despacio y con tanto control
  como puedas, resistiendo la gravedad únicamente con los isquiotibiales. Apóyate suavemente con las manos
  al llegar abajo y empuja con cuidado para ayudar a los isquiotibiales a volver a la posición erguida
  inicial.
