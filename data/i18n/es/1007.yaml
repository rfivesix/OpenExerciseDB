name: Rotación de Cabeza
description: 'Este ejercicio mejora la movilidad y ayuda a aliviar la rigidez del cuello.

  Instrucciones:

  Sentado o de pie, con la espalda recta y los hombros relajados, gira lentamente tu cabeza hacia un lado
  como si intentaras mirar sobre tu hombro.

  Avanza solo hasta sentir un estiramiento suave, sin forzar el movimiento. Sostén esa posición por 5
  segundos, regresa al centro con control y repite hacia el otro lado.'
