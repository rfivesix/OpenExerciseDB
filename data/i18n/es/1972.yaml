exercise_id: '1972'
language: es
status: upstream_unreviewed
name: Jalón al pecho a un brazo
description: |-
  Siéntate en la máquina de jalón y agarra el asa individual con un agarre neutro. Mantén el torso estable, el pecho elevado y las escápulas ligeramente retraídas. Comienza con el brazo completamente extendido por encima de la cabeza y luego tira del asa hacia la parte alta del pecho siguiendo una trayectoria controlada y ligeramente diagonal. Concéntrate en activar el dorsal ancho mientras mantienes el hombro deprimido y evitas cualquier rotación del torso. Vuelve lentamente a la posición inicial, manteniendo el control total durante todo el movimiento.
