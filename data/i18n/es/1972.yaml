name: Jalón al pecho con un brazo
description: 'Posición inicial:

  Siéntate en la máquina de jalón dorsal y sujeta el asa individual con agarre neutro (palma hacia el
  interior). Mantén el torso erguido, el pecho hacia arriba y el abdomen activo.


  Ejecución:

  1. Tira del asa hacia la parte alta del pecho guiando el codo hacia abajo y pegado al costado.

  2. Contrae conscientemente el dorsal en la posición final durante 1 segundo.

  3. Regresa de manera lenta y controlada hacia la posición inicial hasta extender completamente el brazo
  para sentir el estiramiento del dorsal.

  4. Completa las repeticiones deseadas y repite con el otro brazo.


  Consejos:

  Evita rotar o ladear el torso para levantar el peso; mantén los hombros alineados.'
