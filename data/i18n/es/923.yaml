name: Remo con mancuernas tumbado y encogimiento sentado
description: 'Posición inicial: túmbate boca abajo en un banco ligeramente inclinado (30–45 grados) con
  un par de mancuernas colgando hacia el suelo y agarre neutro. Ejecución: 1. Remo tumbado: tira de las
  mancuernas llevando los codos más allá del torso y contrae dorsales y zona media de la espalda arriba.
  Baja con control y completa las repeticiones indicadas. 2. Encogimiento sentado: siéntate inmediatamente
  erguido y encoge los hombros con las mancuernas, elevándolos hacia las orejas para trabajar los trapecios
  superiores y medios. Vuelta: baja las mancuernas suavemente y con control después de cada repetición.'
