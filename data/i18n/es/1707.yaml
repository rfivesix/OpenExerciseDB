name: Elevación lateral en polea
description: 'Posición inicial: Ponte de lado junto a una polea baja. Sujeta el agarre individual con
  la mano más alejada, cruzándola por delante del cuerpo. Mantén el pecho erguido y el codo ligeramente
  flexionado.


  Movimiento:

  1. Eleva el agarre lateralmente, guiando con el codo, hasta que el brazo quede paralelo al suelo a la
  altura del hombro.

  2. Haz una breve pausa arriba para enfatizar la contracción del deltoides lateral.

  3. Baja el peso lentamente y con control hasta la posición inicial.


  Consejos: Evita encoger los trapecios o usar el impulso del torso. La polea proporciona una tensión
  continua y uniforme durante todo el movimiento.'
