name: Elevación lateral en polea
description: |-
  Colócate de pie de lado a la polea baja, sosteniendo el agarre con la mano contraria. Manteniendo una ligera flexión en el codo, eleva el brazo lateralmente hasta la altura del hombro y desciende de forma controlada.
