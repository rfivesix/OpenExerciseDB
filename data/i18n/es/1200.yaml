name: Elevación de tibial anterior
description: 'Posición inicial:

  • Apoya la espalda contra una pared manteniéndote erguido.

  • Coloca los talones a unos 30-40 cm de distancia de la pared con las piernas rectas.


  Ejecución:

  • Levanta las puntas de los pies y los metatarsos lo más alto posible hacia las espinillas (dorsiflexión).

  • Mantén la contracción máxima del músculo tibial anterior durante 1 o 2 segundos arriba.

  • Baja los pies lentamente bajo control hasta tocar el suelo con suavidad.'
