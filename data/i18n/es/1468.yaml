name: Extensión de tríceps con barra EZ tumbado en el suelo
description: 'Posición inicial:

  Túmbate boca arriba en el suelo o en una esterilla. Sujeta una barra EZ con agarre estrecho en pronación
  por las curvas interiores y elévala hasta extender los brazos, ligeramente inclinados hacia atrás respecto
  a la vertical.


  Ejecución:

  1. Mantén los brazos superiores fijos y flexiona los codos para bajar la barra detrás de la cabeza hasta
  que los discos toquen suavemente el suelo.

  2. Haz una pausa breve para eliminar el rebote.

  3. Extiende los codos y vuelve a subir la barra, contrayendo los tríceps arriba.


  Indicaciones:

  Apoyar la barra en el suelo entre repeticiones evita el impulso.'
