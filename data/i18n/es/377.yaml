name: Elevación de piernas tumbado
description: Túmbate en un banco y sujeta el respaldo con las manos para estabilizarte. Mantén las piernas
  rectas y elévalas hasta formar un ángulo de unos 45 grados. Haz una pausa breve de 1 segundo y bájalas
  lentamente hasta la posición inicial. Para aumentar la intensidad, puedes hacer una pausa más larga,
  de 7 segundos, cada quinta repetición.
