name: Rodillo de espuma para aductores
description: 'Posición inicial: Túmbate boca abajo apoyado en los antebrazos. Coloca el rodillo paralelo
  al cuerpo. Flexiona una pierna hacia un lado unos 90° y apoya la cara interna del muslo sobre el rodillo.


  Ejecución: Rueda lentamente desde justo encima de la rodilla interna hacia la ingle y vuelve.


  Consejos: Regula cuánto peso aplicas al rodillo con los brazos y la pierna de apoyo. Respira con regularidad.'
