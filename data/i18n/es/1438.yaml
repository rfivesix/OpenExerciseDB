name: Cargada con barra
description: 'Colócate sobre la barra con los pies al ancho de las caderas y las espinillas cerca. Inclínate
  y agarra la barra justo por fuera de las rodillas con agarre de gancho; mantén la espalda recta, el
  pecho elevado y los hombros algo por delante de la barra. Primera fase: empuja el suelo con las piernas
  y pasa la barra por las rodillas manteniendo el ángulo del torso. Segunda fase: extiende explosivamente
  caderas, rodillas y tobillos y encoge los hombros para impulsar la barra cerca del cuerpo. Métete rápidamente
  debajo, gira los codos hacia delante y arriba, y recibe la barra sobre los deltoides delanteros en posición
  de sentadilla frontal. Ponte de pie. Mantén la barra cerca del cuerpo; el giro rápido de los codos permite
  una posición frontal estable.'
