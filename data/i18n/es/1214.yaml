exercise_id: '1214'
language: es
status: ai_authored
name: Front Lever en posición agrupada (Tuck)
description: |-
  Posición inicial:
  • Cuélgate de una barra de dominadas con agarre prono a la anchura de los hombros.
  • Agrupa las rodillas pegándolas firmemente al pecho (posición tuck) y activa el core.

  Ejecución:
  • Tira hacia abajo con los brazos estirados usando la fuerza de los dorsales y deltoides posteriores para elevar el torso.
  • Coloca el tronco completamente paralelo al suelo en posición horizontal mientras mantienes las rodillas flexionadas al pecho.
  • Mantén la postura isométrica durante el tiempo fijado (p. ej., 5 a 15 segundos).
  • Desciende de manera controlada hasta volver a quedar suspendido.
