name: Rodillo de espuma para tibial anterior
description: 'Posición inicial: Colócate en cuadrupedia y pon el rodillo bajo la parte anterior externa
  de la espinilla, sobre el tibial anterior y no directamente sobre el hueso.


  Ejecución: Rueda lentamente desde justo encima del tobillo hasta debajo de la rodilla. Ajusta la presión
  con las manos y la rodilla de apoyo.


  Consejos: Evita presionar directamente la cresta ósea de la tibia. Trabaja el vientre muscular blando
  de la parte externa de la pierna.'
