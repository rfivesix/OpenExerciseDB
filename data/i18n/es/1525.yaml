name: Lanzamiento de balón medicinal al suelo
description: 'Posición inicial:

  Ponte de pie con los pies a la anchura de los hombros, las rodillas y caderas ligeramente flexionadas
  y un balón medicinal sujeto con ambas manos a la altura del pecho. Contrae el abdomen.


  Ejecución:

  1. Extiende caderas y rodillas con explosividad mientras elevas el balón por encima de la cabeza y te
  pones de puntillas.

  2. Usa el abdomen, los dorsales y los brazos para lanzar el balón con fuerza al suelo entre los pies.

  3. Flexiona las caderas y rodillas para acompañar el movimiento.

  4. Agáchate para recoger el balón y enlaza con la siguiente repetición.'
