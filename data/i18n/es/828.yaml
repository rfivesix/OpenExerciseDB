name: Aperturas inversas en banco inclinado
description: Túmbate boca abajo en un banco inclinado a 30–45 grados y sujeta una mancuerna en cada mano,
  con los brazos colgando y las palmas enfrentadas. Mantén los codos ligeramente flexionados y eleva las
  mancuernas hacia los lados en un arco amplio hasta que los brazos queden a la altura de los hombros.
  Contrae con fuerza los deltoides posteriores y la parte superior de la espalda arriba. Baja las mancuernas
  lentamente y con control, sin usar impulso.
