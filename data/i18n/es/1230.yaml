exercise_id: '1230'
language: es
status: ai_reviewed
name: Estiramiento de tríceps sobre la cabeza (izquierdo)
description: |-
  Posición inicial:
  • Colócate de pie o sentado con la espalda recta.
  • Eleva el brazo izquierdo por encima de la cabeza, flexiona el codo y deja caer la mano izquierda detrás del cuello o entre las escápulas.

  Ejecución:
  • Sujeta el codo izquierdo con la mano derecha y tira suavemente de él hacia atrás y hacia abajo.
  • Siente un estiramiento agradable en el tríceps izquierdo durante 20 a 30 segundos.
  • Respira de manera fluida sin arquear la zona lumbar.
