name: Plancha del gato (Cat Plank)
description: 'Posición inicial:

  Colócate en cuadrupedia sobre las manos y las puntas de los pies. Eleva las rodillas apenas unos centímetros del suelo manteniéndolas en el aire.


  Ejecución:

  Empuja el suelo con fuerza desde los hombros para redondear la espalda hacia el techo, semejante a un gato enfadado. Bascula ligeramente la pelvis y contrae fuertemente los abdominales. Mantén esta postura estática durante el tiempo indicado.


  Consejos:

  Conserva las rodillas flotando a ras de suelo y respira de forma constante sin perder la activación del core.'
