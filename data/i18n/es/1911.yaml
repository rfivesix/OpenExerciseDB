name: Plancha del gato (Cat Plank)
description: 'Posición inicial: Colócate a cuatro apoyos sobre una colchoneta, con
  las manos debajo de los hombros y los dedos de los pies apoyados. Eleva las rodillas
  apenas unos centímetros para sostenerte sobre las manos y los pies.


  Ejecución: Empuja el suelo activamente con los hombros y redondea la espalda alta
  y media hacia el techo, como un gato arqueando el lomo. Mete ligeramente la pelvis
  y lleva el ombligo hacia la columna para contraer al máximo los abdominales y el
  serrato anterior. Mantén la posición durante el tiempo indicado y respira de forma
  constante.


  Consejos: Mantén las rodillas apenas separadas de la colchoneta; no las eleves demasiado
  ni las apoyes.'
