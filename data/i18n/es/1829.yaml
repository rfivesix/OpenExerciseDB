name: Sentadilla y press con landmine
description: 'Posición inicial: Ancla un extremo de la barra en un accesorio landmine o una esquina. Ponte
  frente a ella con los pies algo más separados que los hombros y las puntas giradas 15–30°. Sujeta con
  ambas manos entrelazadas el manguito del extremo libre y mantenlo a la altura media del pecho, debajo
  de las clavículas.


  Ejecución:

  1. Activa el core y baja a una sentadilla profunda con el pecho erguido y los talones apoyados, hasta
  que los muslos queden paralelos al suelo.

  2. Empuja con fuerza desde los talones para levantarte y usa el impulso de las piernas para elevar la
  barra.

  3. En un movimiento fluido, presiona la barra sobre la cabeza hasta extender los brazos.

  4. Inclínate ligeramente hacia la barra arriba para permitir la rotación natural ascendente de los omóplatos.

  5. Baja la barra con control al pecho y enlaza con la siguiente sentadilla.


  Indicaciones: Une la sentadilla y el press en un movimiento explosivo, coordinado y de cuerpo completo.'
