name: Sentadilla con barra landmine y press
description: "Posición inicial:\nAncla un extremo de la barra en un soporte landmine.\
  \ Colócate frente a la barra con los pies al ancho de los hombros, puntas ligeramente\
  \ hacia afuera. Sujeta el extremo libre con ambas manos entrelazadas a la altura\
  \ del pecho.\n\nEjecución:\n1. Desciende en sentadilla profunda con el pecho erguido\
  \ hasta que los muslos queden paralelos al suelo.\n2. Empuja con fuerza a través\
  \ de los talones para incorporarte de forma explosiva.\n3. Aprovecha el impulso\
  \ de las piernas para presionar la barra hacia arriba por encima de la cabeza en\
  \ un movimiento continuo.\n4. Baja la barra con control al pecho e inicia la siguiente\
  \ sentadilla de manera fluida.\n\nConsejos:\nSincroniza la subida de la sentadilla\
  \ con el empuje de brazos en un movimiento unificado."
