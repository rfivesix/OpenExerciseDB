name: Aperturas en máquina pec deck
description: 'Posición inicial: Siéntate en la máquina pec deck con la espalda y la
  cabeza firmemente apoyadas en el respaldo. Ajusta la altura del asiento para que
  las almohadillas o las asas queden a la altura del centro del pecho.


  Ejecución: Sujeta las asas o apoya los antebrazos en las almohadillas, manteniendo
  los codos ligeramente flexionados. Junta los brazos delante del pecho describiendo
  un arco fluido y contrae los pectorales durante 1–2 segundos en la posición de máxima
  contracción.


  Consejos: Controla la vuelta mientras los pectorales se estiran suavemente; evita
  que los codos pasen demasiado detrás de los hombros.'
