name: Sentadilla shrimp
search_terms:
- "Sentadilla shrimp"
description: 'Posición inicial:

  Mantente erguido sobre una pierna. Flexiona la pierna libre por detrás y sujeta el tobillo o el pie
  con la mano del mismo lado o del lado contrario.


  Ejecución:

  1. Lleva las caderas hacia atrás y flexiona la rodilla de apoyo para bajar en una sentadilla unilateral
  controlada.

  2. Desciende hasta que la rodilla de la pierna sujeta toque suavemente el suelo detrás de ti.

  3. Empuja con firmeza el pie de apoyo para extender la pierna y volver a la posición erguida.


  Consejos:

  Inclina ligeramente el torso hacia delante para mantener el equilibrio. Controla el descenso.'
