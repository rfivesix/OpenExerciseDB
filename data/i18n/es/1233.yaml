exercise_id: '1233'
language: es
status: ai_reviewed
name: Estiramiento de bíceps de pie (derecho)
description: |-
  Posición inicial:
  • Ponte de pie con tu costado derecho junto a una pared.
  • Extiende el brazo derecho hacia atrás y apoya la palma de la mano plana contra la pared a la altura del hombro.

  Ejecución:
  • Gira suavemente el torso y los pies hacia la izquierda alejándote de la pared.
  • Detente al notar un estiramiento agradable en el bíceps derecho y el pecho.
  • Mantén la postura durante 20 a 30 segundos respirando con tranquilidad.
