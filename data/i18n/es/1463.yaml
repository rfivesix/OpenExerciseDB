name: Remo con mancuernas en supinación desde parada muerta
description: |-
  Posición inicial:
  • De pie con los pies a la anchura de los hombros, sujeta dos mancuernas con agarre supino (palmas hacia delante).
  • Flexiona las caderas e inclina el torso hacia delante hasta quedar casi paralelo al suelo, con la espalda recta.

  Ejecución:
  • Rema las mancuernas hacia los costados llevando los codos hacia atrás pegados al cuerpo.
  • Contrae con fuerza los dorsales y la espalda en la parte alta del movimiento.
  • Desciende las mancuernas hasta apoyarlas brevemente en el suelo (parada muerta), eliminando el rebote antes de iniciar la siguiente repetición.
