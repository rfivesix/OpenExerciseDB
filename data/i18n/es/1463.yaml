name: Remo muerto con mancuernas y agarre supino
description: De pie con los pies al ancho de los hombros, sujeta las mancuernas con agarre supino. Inclina
  el torso desde las caderas hasta casi dejarlo paralelo al suelo, manteniendo la espalda recta. Lleva
  las mancuernas hacia las costillas y las caderas con los codos cerca de los costados. Aprieta dorsales
  y espalda alta arriba. Baja hasta que las mancuernas toquen suavemente el suelo y se detengan antes
  de la siguiente repetición.
