name: Jalón con agarre ancho
description: '- Siéntate en la máquina de jalón con los muslos bien sujetos bajo los
  rodillos de apoyo.

  - Sujeta la barra con un agarre prono significativamente más ancho que los hombros.

  - Tira de la barra hacia la parte alta del pecho dirigiendo los codos hacia abajo
  y atrás, manteniendo el pecho erguido.

  - Aprieta las escápulas en la parte baja y regresa la barra lentamente hasta extender
  por completo los brazos.'
