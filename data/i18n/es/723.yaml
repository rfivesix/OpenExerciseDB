name: Jalón al pecho con agarre amplio
search_terms:
- Jalón al pecho con agarre ancho
description: Siéntate en la máquina de jalón y fija bien los muslos bajo los rodillos acolchados. Sujeta
  la barra amplia con agarre prono, más separado que los hombros. Lleva la barra suavemente hasta la parte
  superior del pecho, bajando y llevando atrás los codos mientras mantienes el pecho elevado. Junta los
  omóplatos abajo y extiende lentamente los brazos hasta la posición inicial con control.
