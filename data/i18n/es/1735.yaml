name: Prensa lateral de glúteo a una pierna
description: 'Variación de prensa de piernas: siéntate de lado en la máquina, coloca un pie alto en la
  plataforma y oriéntalo ligeramente hacia fuera o delante. Mantén alineados cadera, rodilla y tobillo,
  y la zona lumbar apoyada. Baja el peso despacio, flexionando la rodilla y notando el estiramiento en
  glúteos e isquiotibiales. Empuja con el talón para volver, contrayendo glúteos e isquiotibiales y sin
  bloquear del todo la pierna. Evita rebotar o despegar la zona lumbar del respaldo; mantén la tensión
  y el control.'
