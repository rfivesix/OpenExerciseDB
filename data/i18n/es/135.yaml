name: Aperturas en máquina (pec deck)
description: Siéntate en la máquina de aperturas, con los pies bien apoyados en el suelo y la parte superior
  de los brazos paralela al suelo. Junta los brazos hasta que las empuñaduras casi se toquen, pero sin
  llegar a hacerlo. Vuelve lentamente. Las pesas deben permanecer suspendidas durante todo el ejercicio.
