name: Extensión de tríceps con barra recta en polea
description: Sujeta la barra y ponte de pie con los pies al ancho de los hombros. Mantén la espalda recta
  e inclínate ligeramente hacia delante. Empuja la barra hacia abajo sin mover los codos. Sin hacer una
  pausa, vuelve a la posición inicial.
