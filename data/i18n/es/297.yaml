name: Hollow hold
description: Túmbate boca arriba sobre una colchoneta. Contrae los abdominales, extiende los brazos y
  las piernas y elévalos; también levanta la cabeza y los hombros. Asegúrate de que la zona lumbar permanezca
  en contacto con la colchoneta.
