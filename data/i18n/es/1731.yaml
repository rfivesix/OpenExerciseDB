name: Elevación frontal en polea
description: 'Posición inicial:

  Colócate de espaldas o de frente a una polea baja. Sujeta el agarre delante de los muslos con las palmas
  hacia abajo. Flexiona ligeramente el codo y activa el abdomen.


  Ejecución:

  1. Eleva el agarre hacia delante y arriba, describiendo un arco suave, hasta la altura del hombro.

  2. Haz una pausa breve arriba para contraer el deltoides anterior.

  3. Baja despacio y con control hasta el inicio.


  Consejos:

  Mantén una postura estable; no te inclines hacia atrás ni balancees el torso para iniciar la repetición.'
