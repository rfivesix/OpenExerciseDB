name: Flexión diamante
description: 'Inicio: Colócate en plancha alta. Pon las manos juntas justo debajo del pecho, de modo que
  los pulgares y los índices formen un diamante.

  Descenso: Flexiona los codos para acercar el pecho a las manos. Mantén los codos cerca de las costillas
  y el tronco firme.

  Empuje: Empuja con las palmas para volver a extender completamente los brazos.'
