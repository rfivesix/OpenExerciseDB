name: Plancha
description: 'Colócate en el suelo apoyando el peso sobre los antebrazos y las puntas de los pies. Los
  brazos están flexionados y directamente debajo de los hombros.

  Mantén el cuerpo recto en todo momento y sostén esta posición tanto como puedas. Para aumentar la dificultad,
  puedes levantar un brazo o una pierna durante el ejercicio.'
