name: Sentadilla en máquina Smith
description: "Posición inicial:\nColócate bajo la barra guiada de la máquina Smith\
  \ apoyándola sobre la parte superior del trapecio. Sitúa los pies al ancho de los\
  \ hombros, ligeramente adelantados respecto a la línea vertical de la barra. Gira\
  \ las muñecas para desbloquear la barra de los soportes de seguridad.\n\nEjecución:\n\
  1. Inhala profundamente, aprieta el abdomen y desciende flexionando caderas y rodillas\
  \ de forma controlada.\n2. Baja hasta que los muslos queden al menos paralelos al\
  \ suelo.\n3. Empuja con fuerza a través de los talones y toda la planta del pie\
  \ para regresar a la posición erguida.\n4. Mantén una ligera flexión en las rodillas\
  \ al llegar arriba antes de iniciar la siguiente repetición.\n\nConsejos:\nMantén\
  \ el pecho levantado y la espalda alineada durante todo el recorrido guiado."
