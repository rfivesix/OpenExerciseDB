name: Sentadilla en máquina Smith
description: 'Colócate bajo la barra de la máquina Smith, apoyada sobre los trapecios superiores. Separa
  los pies al ancho de los hombros y sitúalos ligeramente por delante del plano vertical de la barra.
  Desbloquea la barra girando las muñecas.


  1. Inhala y activa el abdomen; flexiona caderas y rodillas siguiendo el recorrido guiado.

  2. Baja con control hasta que los muslos queden al menos paralelos al suelo.

  3. Empuja con toda la planta del pie y los talones para volver al inicio.

  4. En la parte superior, evita bloquear las rodillas por completo.


  Mantén el pecho erguido y la columna neutra. La fuente sugiere adelantar los pies si se desea reducir
  el desplazamiento de las rodillas y enfatizar glúteos y cuádriceps.'
