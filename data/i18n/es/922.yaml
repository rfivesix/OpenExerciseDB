name: Encogimiento escapular sentado con polea para trapecio medio
description: 'Posición inicial: siéntate erguido en una estación de remo con cable y apoya los pies en
  los soportes. Sujeta el accesorio con los brazos extendidos delante. Ejecución: sin flexionar los codos,
  lleva los omóplatos directamente hacia atrás y júntalos. Contrae con firmeza los trapecios medios y
  los romboides durante 1–2 segundos. Vuelta: deja que los omóplatos avancen lentamente y con control
  hasta el inicio. Indicaciones: mantén el torso quieto y erguido; no te inclines hacia atrás para mover
  el peso.'
