name: Encogimiento de rodillas con balón suizo
description: 'Posición inicial:

  Adopta una posición de plancha alta o flexión, con las manos al ancho de los hombros y las espinillas
  apoyadas sobre un balón suizo. Mantén el cuerpo en línea recta desde los hombros hasta los tobillos
  y el tronco firme.


  Ejecución:

  1. Contrae los abdominales y los flexores de la cadera para llevar las rodillas hacia el pecho y hacer
  rodar el balón hacia delante hasta los dedos de los pies.

  2. Mantén la contracción del tronco un segundo en el punto máximo.

  3. Extiende lentamente las piernas y rueda el balón hacia atrás hasta volver a la plancha recta.


  Notas:

  No dejes que la zona lumbar se hunda ni que las caderas bajen por debajo de la línea del cuerpo. Mantén
  los hombros justo encima de las muñecas.'
