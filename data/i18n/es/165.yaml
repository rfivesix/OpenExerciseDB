name: Encogimientos en balón suizo (Knee Tuck)
search_terms:
- Abdominales en Bola de Estabilidad
- Jackknife en balón suizo
description: |-
  Posición inicial:
  Colócate en posición de flexión (plancha alta) con las manos en el suelo separadas al ancho de los hombros y las espinillas apoyadas sobre la parte superior de una pelota suiza (fitball). Tu cuerpo debe formar una línea recta.

  Ejecución:
  1. Contrae los abdominales y flexores de cadera para llevar las rodillas hacia el pecho, haciendo rodar la pelota hacia adelante.
  2. Aprieta el core en el punto de máxima flexión durante un segundo.
  3. Extiende lentamente las piernas hacia atrás para regresar a la posición inicial de plancha de forma controlada.

  Notas:
  Evita que la pelvis caiga hacia abajo arqueando la espalda baja. Mantén los hombros estables sobre las muñecas.
