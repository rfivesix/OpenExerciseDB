name: Press de hombros con mancuernas
description: Siéntate en un banco con el respaldo casi vertical. Toma dos mancuernas y llévalas a la altura de los
  hombros; durante todo el ejercicio, las palmas y los codos apuntan hacia delante. Empuja las pesas hacia arriba;
  en el punto más alto deben quedar muy cerca, pero sin tocarse. Baja lentamente y repite.
