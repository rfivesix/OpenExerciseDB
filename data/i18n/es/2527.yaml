name: Estiramiento de apertura frontal
description: 'Posición inicial: Colócate en media rodilla sobre una colchoneta. Pon las manos sobre bloques
  de yoga o en el suelo, a ambos lados de las caderas, para mantener el equilibrio y apoyar el peso.


  Ejecución: Desliza lentamente el talón delantero hacia delante mientras extiendes la pierna y la cadera
  traseras detrás de ti. Baja la pelvis de forma controlada hacia el suelo y mantén las caderas orientadas
  al frente. Detente cuando notes una tensión muscular profunda pero manejable en los isquiotibiales y
  los flexores de la cadera. Mantén el estiramiento estático durante el tiempo indicado (20 a 30 segundos)
  respirando de forma tranquila y profunda con el diafragma. Apóyate con cuidado en las manos para salir
  de la apertura y repite al otro lado.


  Indicaciones: No rebotes ni fuerces más allá de tu rango de movimiento actual; apoya el peso con las
  manos o coloca un bloque debajo del muslo delantero.'
