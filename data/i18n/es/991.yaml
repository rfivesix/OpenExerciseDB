name: Sentadilla dividida (izquierda)
description: Da un paso largo hacia delante con la pierna izquierda y separa los pies al ancho de las
  caderas para mantener el equilibrio. Mantén el torso erguido y el peso repartido entre ambos pies. Flexiona
  las dos rodillas y baja las caderas hasta que el muslo izquierdo quede paralelo al suelo y la rodilla
  derecha justo por encima del suelo. Empuja con el talón delantero izquierdo y el antepié derecho para
  volver a la posición inicial. Mantén el torso vertical, evita inclinarte hacia delante y no dejes que
  la rodilla delantera sobrepase los dedos del pie.
