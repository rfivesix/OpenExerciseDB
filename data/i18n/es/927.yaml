name: Aperturas de pecho con suspensión
description: 'Posición inicial: sujeta las asas de la suspensión con agarre neutro e inclínate hacia delante
  en una plancha inclinada, con los brazos extendidos delante del pecho y el cuerpo en línea recta de
  la cabeza a los talones. Ejecución: con los codos ligeramente flexionados, abre los brazos hacia los
  lados en un arco amplio hasta notar un estiramiento profundo pero cómodo en los pectorales. Vuelta:
  activa el pecho para juntar las asas delante del cuerpo, manteniendo el abdomen tenso y las caderas
  alineadas. Indicaciones: ajusta la inclinación del cuerpo respecto al suelo para regular la dificultad;
  cuanto más horizontal, mayor resistencia.'
