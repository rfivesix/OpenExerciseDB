name: Aperturas en TRX
description: 'Posición inicial: Sujeta los agarres del TRX e inclina el cuerpo hacia
  adelante, manteniendo el core firme en una línea recta de la cabeza a los talones
  y los brazos extendidos frente al pecho.

  Ejecución: Con una ligera flexión en los codos, abre los brazos hacia los lados
  en un arco amplio hasta sentir un buen estiramiento en los pectorales.

  Retorno: Aprieta el pecho para juntar los agarres nuevamente frente a ti de forma
  lenta y controlada.'
