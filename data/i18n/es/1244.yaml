name: Gato-Vaca (movilidad espinal)
description: 'Colócate primero a cuatro patas, con las manos debajo de los hombros, los dedos bien abiertos
  y las piernas a la anchura de las caderas. Los muslos quedan verticales bajo las caderas y el peso se
  distribuye por igual entre manos y rodillas. Mantén la cabeza como prolongación de la columna, la mirada
  hacia la esterilla y la espalda neutra. Inhala profundamente y empieza con la postura del gato. Al exhalar,
  redondea la espalda vértebra a vértebra hacia el techo, acerca la cabeza al pecho e inclina la pelvis.
  Inhala y pasa a la postura de la vaca: arquea la espalda hacia abajo, lleva ligeramente los hombros
  atrás y eleva la cabeza hasta donde te resulte cómodo, mirando hacia arriba. Exhala conscientemente
  y vuelve al gato. En la siguiente exhalación, cambia de nuevo a la vaca. Repite varias veces y mantén
  un movimiento fluido.'
