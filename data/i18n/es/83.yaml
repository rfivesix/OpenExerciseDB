name: Remo inclinado con barra
description: 'Sujeta una barra con agarre prono (palmas hacia abajo). Flexiona ligeramente las rodillas
  e inclina el torso desde la cintura, manteniendo la espalda recta, hasta que quede casi paralelo al
  suelo. Mantén la cabeza elevada. La barra cuelga justo delante de ti y los brazos quedan perpendiculares
  al suelo y al torso; esta es la posición inicial.

  Sin mover el torso, espira y tira de la barra hacia ti. Mantén los codos cerca del cuerpo y usa los
  antebrazos únicamente para sujetar el peso. Arriba, contrae la espalda y haz una breve pausa.

  Inspira y baja lentamente la barra a la posición inicial. Repite las repeticiones indicadas.'
