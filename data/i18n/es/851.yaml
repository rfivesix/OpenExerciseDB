name: Extensión de cuádriceps
description: '- Siéntate en la máquina de extensión de piernas y ajusta el respaldo
  para que tus rodillas queden alineadas con el eje de rotación de la máquina.

  - Sujeta las manijas laterales y extiende las piernas hacia arriba contrayendo fuertemente
  los cuádriceps.

  - Mantén la contracción un instante en la parte alta sin bloquear bruscamente las
  rodillas.

  - Baja el peso de forma lenta y controlada a la posición inicial.'
