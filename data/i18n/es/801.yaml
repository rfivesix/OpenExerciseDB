name: Flexión con mancuernas
description: Coloca dos mancuernas de lados planos en el suelo, separadas aproximadamente al ancho de
  los hombros, y sujeta las asas con agarre neutro. Adopta la posición de plancha para flexiones, con
  el cuerpo recto y firme de la cabeza a los talones. Baja el pecho entre las mancuernas; su altura permite
  un mayor recorrido. Empuja con firmeza con el pecho y los tríceps para volver a la plancha inicial.
