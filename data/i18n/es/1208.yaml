exercise_id: '1208'
language: es
status: ai_reviewed
name: Sentadilla del prisionero
description: |-
  Posición inicial:
  • Ponte de pie con los pies a la anchura de los hombros y las puntas ligeramente hacia afuera.
  • Coloca las manos detrás de la cabeza con los dedos entrelazados y abre los codos hacia los lados.
  • Mantén el pecho erguido y las escápulas activadas.

  Ejecución:
  • Empuja la cadera hacia atrás y flexiona las rodillas hasta que los muslos queden al menos paralelos al suelo.
  • Mantén el torso lo más erguido posible y los codos bien abiertos en todo momento.
  • Empuja a través de los talones para regresar a la posición erguida contrayendo los glúteos.
