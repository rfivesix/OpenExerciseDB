name: Sentadilla del prisionero
description: Ponte de pie con el pecho ligeramente elevado, los pies a la anchura de las caderas y las
  puntas hacia delante. Lleva las manos detrás de la cabeza, con los dedos ligeramente entrelazados y
  los codos hacia los lados. Lleva las caderas hacia atrás y flexiona las rodillas, manteniendo el torso
  lo más erguido posible. Empuja las rodillas hacia fuera; no dejes que se orienten una hacia la otra.
  Si el torso se inclina ligeramente hacia delante, mantén la espalda recta. Mantén los codos a la altura
  de las orejas activando los músculos entre los omóplatos. Si tienes suficiente flexibilidad, baja hasta
  que los glúteos toquen las pantorrillas, pero no flexiones la columna. Antes de llegar a ese punto,
  invierte el movimiento y empuja con los talones y los glúteos con suficiente impulso para despegar brevemente
  los pies y dar un pequeño salto. Si es necesario, corrige la posición de los pies, brazos y torso antes
  de la siguiente repetición.
