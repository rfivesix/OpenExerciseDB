name: Curl inclinado con mancuernas
description: 'Ajuste: Coloca un banco ajustable en una inclinación aproximada de 45 a 60 grados.

  Posición inicial: Siéntate con la espalda apoyada en el banco y una mancuerna en cada mano. Deja los
  brazos colgando rectos hacia el suelo, con las palmas hacia delante (agarre supino).

  Curl: Mantén inmóviles los brazos y los hombros apoyados contra el banco. Espira y flexiona los codos
  para llevar las pesas hacia los hombros.

  Contracción máxima: Aprieta los bíceps arriba y evita que los codos se desplacen hacia delante.

  Descenso: Inspira y baja lentamente las mancuernas a la posición inicial, con control y sintiendo el
  estiramiento de los bíceps.'
