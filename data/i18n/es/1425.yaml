name: Toques de pie alternados
description: |-
  Los toques de pie son un ejercicio enfocado en el core que se realiza acostado de espaldas. Acuéstate con los brazos a los lados y las piernas elevadas en posición de mesa (rodillas dobladas a 90 grados). Baja lentamente un pie para tocar el suelo suavemente, manteniendo el core activado y la espalda baja presionada contra el suelo. Regresa a la posición inicial y alterna las piernas. Este ejercicio fortalece el core mientras reduce la tensión en la parte baja de la espalda.
