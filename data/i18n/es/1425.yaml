name: Toques de punta
description: Los toques de punta son un ejercicio de tronco que se realiza tumbado boca arriba. Túmbate
  con los brazos a los lados y las piernas en posición de mesa, con las rodillas flexionadas a 90 grados.
  Baja lentamente un pie hasta tocar suavemente el suelo, manteniendo el abdomen activo y la zona lumbar
  apoyada. Vuelve a la posición inicial y alterna las piernas. El ejercicio fortalece el tronco reduciendo
  la carga sobre la zona lumbar.
