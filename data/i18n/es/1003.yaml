name: Peso muerto con kettlebell
description: Colócate con los pies separados al ancho de las caderas o los hombros y la kettlebell centrada
  entre los pies, a la altura de los tobillos. Lleva las caderas hacia atrás y flexiona ligeramente las
  rodillas, manteniendo la espalda recta. Sujeta el asa con ambas manos. Empuja con los pies y lleva las
  caderas hacia delante para ponerte de pie; contrae los glúteos arriba. Invierte el movimiento desde
  la cadera y baja la kettlebell con control. Mantén los hombros bajos y la columna neutra.
