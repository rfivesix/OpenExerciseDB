description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù sul pavimento con le gambe divaricate oltre la larghezza delle spalle e le punte dei piedi sollevate. Distendi le braccia lateralmente a formare una T con il busto, con i palmi rivolti a terra.

  Esecuzione:
  1. Solleva il tronco, le braccia e le gambe il più in alto possibile mantenendo il corpo in tensione costante.
  2. Ruota i pollici verso il soffitto e adduci con forza le scapole.
  3. Mantenendo il petto e gli arti costantemente sospesi da terra, unisci le gambe tese e poi riaprile lateralmente.
  4. Continua aprendo e chiudendo le gambe a ritmo controllato senza toccare terra.
