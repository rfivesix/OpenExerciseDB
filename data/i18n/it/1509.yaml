description: |-
  Posizione di partenza:
  Afferra la maniglia del cavo basso, fletti il busto in avanti e solleva il gomito verso l'alto mantenendo il braccio superiore parallelo al suolo.

  Esecuzione:
  1. Estendi il gomito spingendo il cavo all'indietro contraendo con forza il tricipite.
  2. Riporta lentamente la maniglia in avanti controllando la discesa.
