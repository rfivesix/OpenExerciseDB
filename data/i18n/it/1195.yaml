description: |-
  Posizione di partenza:
  In piedi con i piedi leggermente più larghi delle spalle in posizione atletica ribassata.

  Esecuzione:
  1. Fai scivolare lateralmente la gamba guida spingendo con forza sul piede d'appoggio.
  2. Dopo tre scivolamenti, ruota il corpo di 180 gradi sul piede perno ed esegui uno squat profondo, continuando l'esercizio in direzione opposta.
