name: Scrollate Silverback a busto flesso con bilanciere
upstream:
  license: CC-BY-SA-4.0
  source_id: '3074'
description: |-
  Posizionati in piedi con i piedi alla larghezza delle spalle, impugnando il bilanciere con entrambe le mani poco oltre la larghezza spalle. Fletti il busto in avanti dalle anche sbloccando le ginocchia e mantenendo la schiena piatta. Attiva le scapole sollevando e adducendo le spalle verso l'alto e indietro come se volessi unirle. Rilascia lentamente il carico controllando l'allungamento prima della ripetizione successiva.
