description: |-
  Posizione di partenza:
  In piedi con un manubrio in ciascuna mano con presa supina (palmi rivolti in avanti) e braccia distese lungo i fianchi.

  Esecuzione:
  1. Fletti le braccia sollevando i manubri verso l'alto mentre allontani leggermente i gomiti dal corpo e li spingi leggermente in avanti, creando una convergenza delle mani davanti alla parte alta del petto.
  2. Spremi con decisione i bicipiti nel punto di massimo accorciamento.
  3. Abbassa lentamente i manubri tornando con controllo alla posizione di partenza a braccia distese.
