description: |-
  Impugna l'elastico con le braccia distese davanti a te all'altezza delle spalle. Mantieni i gomiti leggermente flessi ma bloccati durante tutto l'esercizio. Allarga le braccia aprendole verso l'esterno fino a portare l'elastico a contatto con il petto, addducendo le scapole. Riporta lentamente le braccia in avanti controllando la tensione elastica.
