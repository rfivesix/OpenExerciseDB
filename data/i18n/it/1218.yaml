name: Piegamenti sulle ginocchia
description: |-
  Posizione di partenza:
  Inginocchiati a terra tenendo le ginocchia unite. Appoggia le mani sul pavimento davanti a te, a una larghezza leggermente superiore a quella delle spalle. Allinea il corpo in linea retta dalle ginocchia alla testa, con il core contratto.

  Esecuzione:
  1. Abbassa il busto verso il pavimento piegando i gomiti e mantenendo la schiena dritta. Le ginocchia rimangono costantemente a contatto con il suolo.
  2. Spingi attraverso i palmi delle mani per tornare alla posizione iniziale, contraendo pettorali, deltoidi e tricipiti nel punto più alto.
  3. Esegui le ripetizioni previste con movimento fluido e controllato.
