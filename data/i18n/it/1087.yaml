description: |-
  Posizione di partenza:
  In piedi con due manubri tenuti all'altezza delle cosce a mezz'aria, busto inclinato in avanti con le anche leggermente flesse.

  Esecuzione:
  1. Estendi esplosivamente le anche e porta i manubri verso l'alto ruotando i polsi per riceverli all'altezza delle spalle in mezzo squat.
