name: Curl bicipiti alternato con manubri
description: |-
  Posizione di partenza:
  • In piedi con i piedi alla larghezza delle spalle, impugna un manubrio per mano lungo i fianchi con braccia distese e palmi rivolti verso l'interno (presa neutra).
  • Mantieni il petto aperto, le spalle rilassate e i gomiti bloccati vicino ai fianchi.

  Esecuzione:
  • Fletti un braccio sollevando il manubrio e ruotando l'avambraccio verso l'esterno (supinazione) in modo che il palmo guardi la spalla nel punto più alto.
  • Contrai energicamente il bicipite al vertice del movimento per un istante.
  • Riabbassa lentamente il manubrio in modo controllato mentre esegui il curl con l'altro braccio.
  • Evita ogni oscillazione del busto durante l'esercizio.
