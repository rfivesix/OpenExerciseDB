description: |-
  Posizione di partenza:
  Posiziona due panche piane parallele tra loro. Appoggia i palmi delle mani sul bordo di una panca e i talloni sul bordo dell'altra panca di fronte a te.

  Esecuzione:
  1. Abbassa lentamente il busto flettendo i gomiti finché la parte superiore delle braccia non è parallela al pavimento.
  2. Mantieni la schiena vicina alla panca posteriore durante la discesa.
  3. Spingi con forza sui palmi estendendo i gomiti per ritornare alla posizione di partenza.
