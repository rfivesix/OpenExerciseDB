exercise_id: '1214'
language: it
status: ai_authored
name: Front lever tuck (raggruppato)
description: |-
  Posizione di partenza:
  • Appenditi a una sbarra per trazioni con presa prona a larghezza delle spalle.
  • Raccogli le ginocchia vicine al petto in posizione raggruppata (tuck) e attiva saldamente il core.

  Esecuzione:
  • Tira verso il basso mantenendo le braccia tese mediante una forte estensione delle spalle e contrazione del gran dorsale.
  • Solleva il tronco fino a portarlo perfettamente orizzontale e parallelo al pavimento.
  • Mantieni la tenuta isometrica per il tempo stabilito (es. 5-15 secondi) respirando in modo controllato.
  • Riabbassa il corpo lentamente fino alla distensione completa delle braccia.
