description: |-
  Il lat pulldown è un esercizio fondamentale di trazione che bersaglia principalmente il gran dorsale nella schiena. Si esegue seduti all'apposita macchina trazionando la sbarra del cavo verso la parte superiore del petto. Viene comunemente svolto con una presa larga per massimizzare il reclutamento del dorso, ma può essere variato con presa stretta o supina per stimolare angolazioni differenti e il bicipite brachiale. È un esercizio eccellente per sviluppare ampiezza muscolare nella parte superiore del corpo e supportare una corretta postura della colonna.
