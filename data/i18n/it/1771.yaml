name: Wrist curl al cavo
description: |-
  Posizione di partenza:
  Posizionati davanti alla carrucola bassa, afferra la sbarra con presa supina (palmi rivolti verso l'alto) e lascia le braccia distese lungo i fianchi.

  Esecuzione:
  1. Fletti i polsi verso l'alto sollevando la sbarra con la forza dei muscoli flessori dell'avambraccio.
  2. Mantieni la massima contrazione per un istante in cima.
  3. Rilascia lentamente il carico tornando alla posizione iniziale.
