name: Plank laterale destro
description: |-
  Posizione di partenza:
  Sdraiati sul fianco destro con le gambe tese e i piedi sovrapposti o sfalsati. Posiziona il gomito destro esattamente sotto la spalla destra con l'avambraccio appoggiato al suolo.

  Esecuzione:
  1. Contrai gli addominali obliqui e i glutei, quindi solleva il bacino da terra fino a formare una linea retta dalla testa ai piedi.
  2. Mantieni il petto aperto e il collo allineato alla colonna vertebrale.
  3. Tieni la posizione per il tempo prestabilito evitando che il bacino ceda verso il pavimento.
