name: Split squat a destra
description: 'Posizione di partenza: Stai in piedi con la schiena dritta e fai un
  grande passo in avanti con la gamba destra.

  Esecuzione: Abbassa il bacino verticalmente piegando entrambe le ginocchia fino
  a sfiorare quasi il pavimento con il ginocchio sinistro.

  Ritorno: Risali spingendo sul tallone destro fino alla posizione di partenza.'
