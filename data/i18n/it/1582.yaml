description: |-
  Sdraiati su un fianco utilizzando il braccio inferiore (a contatto con la superficie). Con il gomito piegato a 90 gradi, lascia scendere lentamente il manubrio verso il pavimento. Risolleva il peso ruotando internamente la spalla verso il busto, isolando il muscolo sottoscapolare in piena sicurezza articolare.
