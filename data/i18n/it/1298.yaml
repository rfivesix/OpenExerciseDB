name: Estensioni per tricipiti ai cavi alti incrociati
description: |-
  Posizione di partenza:
  Posizionati al centro di due carrucole alte senza impugnature o con maniglie singole. Afferra il cavo sinistro con la mano destra e il cavo destro con la mano sinistra, incrociando i cavi davanti a te.

  Esecuzione:
  1. Mantenendo i gomiti alti e stabili all'altezza delle spalle, estendi contemporaneamente le braccia diagonalmente verso l'esterno e verso il basso.
  2. Contrai intensamente il capo lungo dei tricipiti nel punto di massima estensione.
  3. Ritorna lentamente alla posizione iniziale flettendo i gomiti con pieno controllo.
