description: |-
  Distensione singola al cavo con traiettoria inclinata verso l'alto. Utilizza l'altro braccio per sostenere la postura. Partendo con la mano vicina al petto, spingi la maniglia verso l'alto e verso il centro del torace focalizzando il carico sulla parte alta del gran pettorale.
