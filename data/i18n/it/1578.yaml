description: |-
  Posizione di partenza:
  In piedi in posizione eretta con i piedi alla larghezza dei fianchi e le punte leggermente rivolte verso l'esterno. Posiziona le mani sulle pieghe delle anche o stendile leggermente in avanti, mantenendo le spalle addotte e il petto aperto.

  Esecuzione:
  1. Mantenendo una leggera flessione morbida nelle ginocchia (senza piegarle ulteriormente), spingi il bacino direttamente all'indietro come se volessi toccare una parete dietro di te con i glutei.
  2. Fletti il busto in avanti mantenendo la schiena rigorosamente dritta e piatta, finché il tronco non raggiunge un angolo di circa 45 gradi o finché avverti una decisa tensione nei muscoli ischiocrurali (femorali).
  3. Fermati un momento mantenendo il collo in linea neutra con la colonna.
  4. Spingi le anche in avanti contraendo con forza i glutei per ritornare alla posizione eretta di partenza.
