  license_author: Croak6728
  source_id: '2834'
description: |-
  Sdraiati su un fianco in modo che il peso corporeo stabilizzi la scapola inferiore. Distendi il braccio a 90 gradi davanti a te sul pavimento, piegando il gomito a 90 gradi con le dita rivolte al soffitto. Mantenendo il gomito fermo, usa l'altra mano per premere delicatamente l'avambraccio verso il pavimento in rotazione interna, avvertendo un allungamento profondo nella capsula posteriore della spalla.
