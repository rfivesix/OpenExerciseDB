description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza dei fianchi e un bilanciere tenuto con presa prona davanti alle cosce.

  Esecuzione:
  1. Mantenendo le ginocchia quasi completamente distese e la schiena rigorosamente dritta, fletti le anche e abbassa il bilanciere verso i piedi.
  2. Scendi finché senti un intenso allungamento nei muscoli ischiocrurali (femorali).
  3. Risali spingendo il bacino in avanti e contraendo con forza i glutei.
