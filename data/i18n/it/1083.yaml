description: |-
  Posizione di partenza: sdraiati a pancia in giù su un tappetino. Distendi le braccia sopra la testa formando una "Y" a circa 45 gradi con i pollici rivolti verso l'alto. Esecuzione: solleva leggermente il petto dal pavimento creando tensione verso l'alto con le braccia e mantieni la posizione a Y per 15-30 secondi. Mantenendo il petto sollevato, fletti i gomiti per passare alla posizione a "W", tirando i gomiti verso i fianchi e mantenendo le braccia sollevate dal pavimento per la stessa durata. Raddrizza poi le braccia lateralmente formando una "T", perpendicolare al tronco, trattenendo sempre la contrazione scapolare. Ritorna infine passando dalla T alla W e poi alla Y prima di ripetere la sequenza completa.
