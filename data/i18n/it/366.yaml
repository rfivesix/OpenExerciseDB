description: |-
  Posizione di partenza:
  Siediti sulla macchina leg curl regolando lo schienale e posiziona le gambe sopra il cuscinetto mobile dietro le caviglie.

  Esecuzione:
  1. Fletti le ginocchia spingendo il cuscinetto verso il basso e indietro con i femorali.
  2. Ritorna lentamente alla posizione iniziale controllando il carico.
