description: |-
  Afferra la barra della lat machine con una presa supinata (palmi rivolti verso di te) a una larghezza leggermente inferiore a quella delle spalle. Inclinati appena all'indietro mantenendo la schiena dritta. Tira la barra verso il petto guidando i gomiti verso il basso e adducendo le scapole nella parte conclusiva del movimento.
