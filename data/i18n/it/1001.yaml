name: High Plank (Plank a braccia tese)
description: 'Posizione di partenza: Mettiti a terra con le mani direttamente sotto
  le spalle e le braccia tese. Appoggia le dita dei piedi a terra mantenendo il corpo
  allineato dalla testa ai talloni.

  Esecuzione: Mantieni la posizione isometrica contraendo addominali e glutei senza
  inarcare la schiena né sollevare il bacino.'
