description: |-
  Sdraiati su una panca reclinata con i piedi saldi e la testa appoggiata. Impugna due manubri all'altezza dei pettorali e spingili verso l'alto fino a distendere le braccia senza bloccare i gomiti. Abbassa i pesi lentamente e in modo controllato tornando alla posizione iniziale prima della successiva ripetizione.
