name: Alzate laterali al cavo a un braccio
description: |-
  Posizione di partenza:
  Posizionati in piedi di fianco alla torretta del cavo regolata in basso. Con la mano interna afferra il montante per stabilizzarti, mentre con l'altra mano impugni la maniglia a braccio disteso lungo il corpo.

  Esecuzione:
  1. Solleva lateralmente il braccio verso l'esterno fino all'altezza della spalla, mantenendo il gomito leggermente flesso e guidando il movimento con il gomito stesso.
  2. Non utilizzare lo slancio del corpo e non ruotare il busto.
  3. Mantieni la contrazione in cima per un secondo, poi abbassa lentamente il cavo senza far toccare i pesi prima della ripetizione successiva.
