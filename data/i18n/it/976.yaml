name: Crunch a libretto con palla medica
description: 'Posizione di partenza: Sdraiati a pancia in su con gambe distese e braccia
  tese oltre la testa tenendo una palla medica tra le mani.

  Esecuzione: Solleva contemporaneamente il busto e le gambe distese verso l''alto
  a formare una "V", portando la palla medica verso le caviglie e contraendo intensamente
  l''addome.

  Ritorno: Torna lentamente alla posizione iniziale controllando la discesa senza
  inarcare la zona lombare.'
