name: Scrollate con manubri
description: |-
  In piedi con la schiena dritta e i piedi alla larghezza delle spalle, tieni un manubrio in ciascuna mano lasciando pendere le braccia lungo i fianchi. Da questa posizione, solleva le spalle verso le orecchie il più in alto possibile, mantenendo le braccia tese senza piegare i gomiti. Nel punto di massima elevazione, mantieni una contrazione isometrica per uno o due secondi prima di abbassare lentamente i manubri alla posizione iniziale. Anche con carichi pesanti, cura l'intera ampiezza di movimento.
