description: |-
  Le alzate frontali al cavo con sbarra corta isolano in modo eccellente il deltoide anteriore garantendo una tensione muscolare continua ed uniforme lungo l'intero raggio di movimento.

  Posizione di partenza:
  Collega una sbarra dritta corta a una carrucola bassa. Posizionati con la schiena rivolta verso la macchina e la colonna dei cavi, tenendo la sbarra tra le gambe con una presa prona alla larghezza delle spalle all'altezza del bacino. Mantieni le gambe leggermente piegate, il core contratto e le spalle basse e rilassate.

  Esecuzione:
  1. Espirando, solleva lentamente la sbarra davanti a te mantenendo i gomiti quasi del tutto distesi ma non rigidi, fino a quando le mani raggiungono l'altezza delle spalle o degli occhi.
  2. Trattieni la contrazione di picco in cima per un secondo per massimizzare il lavoro sul deltoide anteriore.
  3. Inspirando, abbassa la sbarra lentamente e con pieno controllo fino alla posizione iniziale senza far toccare i pesi tra le ripetizioni. Evita di oscillare il busto o di sfruttare l'inerzia.
