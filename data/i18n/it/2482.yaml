  license_author: Imported from swim plan
  source_id: '4959'
description: |-
  Posizione di partenza:
  Posizionati in piedi in acqua con livello all'altezza del petto.

  Esecuzione:
  1. Inspira profondamente sopra la superficie, immergi completamente il viso ed espira lentamente e continuamente sott'acqua attraverso naso e bocca soffiando bolle.
  2. Riemergi dalla superficie e inspira ritmicamente.
  3. Ripeti l'esercizio a cadenza rilassata e regolare per sviluppare un controllo ottimale della respirazione in ambiente acquatico.
