name: Posa del bambino
description: |-
  Posizione di partenza:
  Iniziare a quattro zampe, con le ginocchia, le dita dei piedi e le mani che toccano terra. I tuoi due alluci dovrebbero toccarsi.
  Passi:

  Spostare le ginocchia in modo che siano alla larghezza delle anche.
  Espirando, sposta il bacino indietro per sederti sui talloni. Le mani devono ancora toccare il suolo.
  Rilassate la parte superiore del corpo, abbassando la fronte verso il pavimento e lasciando che le mani si muovano in avanti in modo naturale.
  Rimanete in questa posa.

  Suggerimenti:

  Per lasciare la posa, porta le braccia indietro sotto le spalle e sposta la parte superiore del corpo in una posizione seduta.
