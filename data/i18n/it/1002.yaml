name: Posizione del bambino (Balasana)
description: 'Posizione di partenza: Inginocchiati sul tappetino con le ginocchia
  leggermente aperte e gli alluci a contatto. Siediti sui talloni.

  Esecuzione: Fletti il busto in avanti appoggiando la fronte a terra e distendi le
  braccia in avanti sul pavimento. Respira profondamente rilassando la schiena e le
  spalle.'
