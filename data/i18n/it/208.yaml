description: |-
  Posizione di partenza:
  Siediti alla panca Scott appoggiando saldamente la parte posteriore delle braccia sul cuscinetto inclinato e afferra un manubrio in ciascuna mano.

  Esecuzione:
  1. Fletti i gomiti portando i manubri verso le spalle contraendo i bicipiti.
  2. Abbassa i manubri lentamente e con controllo fino alla quasi completa distensione delle braccia.
