description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù su un tappetino. Appoggia gli avambracci sul pavimento con i gomiti allineati esattamente sotto le spalle e solleva il corpo sulle punte dei piedi.

  Esecuzione:
  1. Allinea il corpo in una linea retta perfetta dalla testa ai talloni, evitando di sollevare troppo il bacino o di farlo cedere verso il suolo.
  2. Contrai con forza il retto dell'addome, i muscoli obliqui e i glutei per mantenere la colonna vertebrale stabile e neutra.
  3. Mantieni la posizione statica respirando regolarmente per tutta la durata prevista della serie.
