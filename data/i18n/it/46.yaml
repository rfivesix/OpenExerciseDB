name: Affondi sul posto con bilanciere
description: |-
  Posizione di partenza:
  In piedi, posiziona un bilanciere sulla parte superiore dei trapezi, tenendo il busto eretto e il core contratto.

  Esecuzione:
  1. Fai un ampio passo in avanti con una gamba e abbassa il bacino verticalmente fino a piegare entrambe le ginocchia a circa 90 gradi.
  2. Il ginocchio posteriore deve sfiorare il pavimento senza toccarlo.
  3. Spingi attraverso il tallone della gamba anteriore per ritornare alla posizione eretta.
