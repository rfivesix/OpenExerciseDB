description: |-
  Posizione di partenza:
  In piedi davanti al cavo alto, tieni la maniglia vicino al petto con il gomito flesso e aperto verso l'esterno.

  Esecuzione:
  1. Spingi in avanti e verso il basso estendendo completamente il gomito.
  2. Ritorna lentamente al petto.
