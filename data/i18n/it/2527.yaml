description: |-
  Inizia in ginocchio, distendi una gamba completamente in avanti e lascia scivolare l'altra all'indietro. Abbassa delicatamente il bacino verso il pavimento fino al tuo limite confortevole e mantieni l'allungamento respirando regolarmente.
