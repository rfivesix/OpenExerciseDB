description: |-
  Posizione di partenza:
  In piedi a piedi uniti o leggermente ravvicinati con la colonna vertebrale allungata.

  Esecuzione:
  1. Fletti il busto in avanti a partire dalle anche mantenendo le gambe tese.
  2. Allunga le mani verso il basso cercando di toccare le dita dei piedi o il suolo in modo confortevole.
