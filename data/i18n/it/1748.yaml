description: |-
  Posizione di partenza:
  Siediti sulla macchina per abduzioni con la schiena saldamente appoggiata allo schienale. Posiziona la parte esterna delle cosce e delle ginocchia contro i cuscinetti imbottiti e appoggia i piedi sui supporti dedicati. Impugna le maniglie laterali per mantenere il bacino stabile e neutrale.

  Esecuzione:
  1. Espira e spingi i cuscinetti verso l'esterno allontanando le gambe con la forza del medio gluteo e del piccolo gluteo.
  2. Raggiungi la massima apertura delle cosce e mantieni la contrazione di picco per circa un secondo.
  3. Inspira e controlla la fase eccentrica di ritorno senza far toccare i pesi della pila, conservando una tensione costante sui muscoli abduttori dell'anca durante l'intera serie.
