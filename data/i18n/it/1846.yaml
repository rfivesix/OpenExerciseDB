description: |-
  Posizionati in piedi a gambe molto divaricate con le punte rivolte verso l'esterno. Scendi in un'accosciata ampia e profonda con le anche sotto il livello delle ginocchia, mantieni la posizione statica per 3-5 secondi e risali con controllo.
