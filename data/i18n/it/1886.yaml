name: Abduzione dell'anca in posizione supina
description: "Posizione iniziale:\nSdraiati sulla schiena (supini) su un tappetino,\
  \ con le gambe distese e\nrilassate. Le braccia possono essere lungo i fianchi o\
  \ aperte per\nmaggiore stabilità.\nIl movimento:\nSolleva leggermente una gamba\
  \ da terra (mantenendola tesa o con una\nleggera flessione). Spostala lateralmente\
  \ verso l'esterno,\nallontanandola dall'altra gamba, come se dovessi scavalcare\
  \ un piccolo\nostacolo.\nAmpiezza:\nPorta la gamba più in là possibile senza sollevare\
  \ il bacino o ruotare\nil busto, sentendo un allungamento nella parte interna della\
  \ coscia e\ndell'anca.\nRitorno: Riporta lentamente la gamba alla posizione iniziale,\
  \ controllando il movimento.\nObiettivo: Migliora la mobilità laterale dell'anca\
  \ (abduzione) e allena i muscoli stabilizzatori del bacino."
