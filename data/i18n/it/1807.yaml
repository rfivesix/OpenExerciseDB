description: |-
  Esegui un'alzata laterale al cavo singolo facendo passare il cavo dietro la schiena. Questa variante mantiene una tensione costante sul deltoide laterale lungo l'intero raggio di movimento, favorendo una crescita muscolare equilibrata e completa.
