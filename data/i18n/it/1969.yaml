description: |-
  Posizione di partenza:
  In piedi davanti alla carrucola alta, afferra la maniglia singola o l'estremità del cavo con una sola mano. Posiziona il gomito vicino al fianco piegato a 90 gradi con il busto leggermente inclinato in avanti.

  Esecuzione:
  1. Mantenendo il braccio superiore e il gomito perfettamente stabili e fermi lungo il tronco, spingi verso il basso estendendo completamente il tricipite.
  2. Contrai intensamente il muscolo tricipite nella parte inferiore del movimento per un secondo.
  3. Riporta lentamente e con pieno controllo la mano verso l'alto alla posizione di partenza.
  4. Questo movimento unilaterale corregge gli squilibri muscolari e garantisce una stimolazione isolata e simmetrica.
