description: |-
  Posizione di partenza:
  Regola il bilanciere della Smith machine all'altezza delle spalle e posizionati sotto di esso con i piedi a passo stretto.

  Esecuzione:
  1. Scendi in squat controllato flettendo ginocchia e anche.
  2. Spingi sui piedi per risalire alla posizione eretta.
