description: |-
  Posizione di partenza:
  In piedi con un bilanciere tenuto alle cosce.

  Esecuzione:
  1. Fletti le anche spingendo il bacino all'indietro con ginocchia morbide.
  2. Abbassa il bilanciere lungo le tibie mantenendo la colonna neutra e la sbarra vicina al corpo prima di risalire.
