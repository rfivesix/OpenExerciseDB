name: Wrist curl con manubri
description: |-
  Posizione di partenza:
  Siediti su una panca e afferra i manubri con le mani rivolte verso l'alto alla larghezza delle spalle. Appoggia gli avambracci sulle cosce con i polsi che sporgono oltre le ginocchia.

  Esecuzione:
  1. Fletti i polsi verso l'alto sollevando i manubri verso il viso.
  2. Mantieni brevemente la contrazione al vertice del movimento.
  3. Riabbassa lentamente i carichi tornando alla posizione iniziale.
