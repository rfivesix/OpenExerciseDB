description: |-
  Posizione di partenza:
  Sdraiati su un fianco in appoggio sull'avambraccio e sul bordo esterno del piede, formando una linea retta con il corpo.

  Esecuzione:
  1. Abbassa lentamente i fianchi verso il pavimento sfiorando il suolo.
  2. Risali sollevando il bacino verso l'alto oltre la linea retta contraendo l'obliquo inferiore.
