description: |-
  Posizione di partenza:
  In piedi con i piedi posizionati alla larghezza delle spalle e il busto eretto. Posiziona la mano destra dietro la testa e tieni la mano sinistra distesa lungo il fianco.

  Esecuzione:
  1. Sposta il peso sulla gamba sinistra e solleva lateralmente il ginocchio destro verso l'alto.
  2. Contemporaneamente, fletti il busto verso destra portando il gomito destro verso il ginocchio che sale per avvicinarli.
  3. Contrai con decisione gli obliqui sul lato destro.
  4. Abbassa il piede a terra in modo controllato e completa le ripetizioni prima di cambiare lato.
