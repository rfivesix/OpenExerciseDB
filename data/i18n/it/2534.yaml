description: |-
  Posizione di partenza:
  Sdraiati supino con ginocchia piegate e piedi piatti al suolo.

  Esecuzione:
  1. Solleva il bacino da terra contraendo con decisione i glutei finché il corpo forma una linea retta dalle ginocchia alle spalle.
  2. Mantieni la contrazione in cima prima di riabbassare lentamente il bacino.
  3. Per aumentare l'intensità puoi appoggiare un bilanciere sul bacino o posizionare i piedi su un rialzo come uno step.
