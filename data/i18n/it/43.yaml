name: Hack squat con bilanciere
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, posiziona un bilanciere a terra subito dietro i talloni.

  Esecuzione:
  1. Scendi in accosciata flettendo ginocchia e anche fino ad afferrare il bilanciere con presa prona.
  2. Mantenendo la schiena dritta e il petto in fuori, spingi sui talloni per sollevare il bilanciere guidando con i quadricipiti.
  3. Raggiungi la posizione eretta e riabbassa il bilanciere in modo controllato.
