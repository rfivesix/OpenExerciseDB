description: |-
  Posizione di partenza:
  In piedi, trasferisci tutto il peso su una gamba mantenendo il bacino e le anche perfettamente allineati e orizzontali.

  Esecuzione:
  1. Fletti il busto in avanti mantenendo la colonna vertebrale neutra, estendendo contemporaneamente l'altra gamba indietro e verso l'alto.
  2. Ritorna lentamente alla posizione eretta contraendo con forza il grande gluteo della gamba d'appoggio.
