name: Rotazioni del capo (Torsione del collo)
description: 'Posizione di partenza: Siediti o stai in piedi con la schiena dritta
  e le spalle rilassate.

  Esecuzione: Gira lentamente la testa verso un lato fino a percepire un leggero allungamento,
  mantieni per 1-2 secondi, quindi torna al centro e ripeti dall''altro lato.'
