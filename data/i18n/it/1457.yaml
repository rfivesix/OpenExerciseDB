description: |-
  Posizione di partenza:
  Posizionati di fianco alla colonna dei cavi, in modo che la linea del cavo passi dietro la tua schiena. Fai passare il braccio che lavora attraverso il cavo e afferra la maniglia.

  Esecuzione:
  1. Spingi la maniglia in avanti e leggermente attraverso il corpo, descrivendo un arco che avvolge il torace.
  2. Questa traiettoria consente di seguire l'orientamento delle fibre del gran pettorale, massimizzando l'accorciamento muscolare nel punto di picco.
  3. Mantieni il busto stabile senza ruotare la colonna vertebrale e controlla la fase eccentrica lasciando allungare il pettorale prima della successiva ripetizione.
