name: Rematore da seduto al cavo a presa stretta
description: |-
  L'esercizio segue la biomeccanica del pulley tradizionale, ma con un'impugnatura a presa stretta. Siediti alla macchina, appoggia i piedi sui supporti e afferra la maniglia a V. Tira il peso con un movimento fluido e deciso verso l'ombelico, mantenendo la schiena eretta e il petto in fuori. Tieni braccia e gomiti vicini ai fianchi e adduci le scapole al culmine della trazione. Rilascia lentamente il carico fino alla completa distensione delle braccia.
