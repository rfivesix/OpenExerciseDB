name: Rematore a un braccio in plank (Renegade Row)
description: |-
  Posizione di partenza:
  Assumi una posizione di plank alto a braccia distese con le mani in appoggio su manubri a terra (o una mano a terra e l'altra che impugna un manubrio). Posiziona i piedi a larghezza spalle o leggermente più larghi per garantire stabilità.

  Esecuzione:
  1. Contrai intensamente addominali e glutei per mantenere il bacino parallelo al pavimento ed evitare rotazioni del tronco.
  2. Esegui una tirata di rematore sollevando il manubrio verso il fianco, conducendo il gomito vicino al corpo.
  3. Trattieni la contrazione del gran dorsale per un istante in cima.
  4. Abbassa il manubrio al pavimento con pieno controllo e ripeti prima di passare all'altro braccio.
