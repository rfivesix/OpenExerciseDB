description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, tieni un manubrio in una mano lungo il fianco e l'altra mano dietro la testa.

  Esecuzione:
  1. Fletti lentamente il busto lateralmente verso il lato del peso.
  2. Risali contraendo gli addominali obliqui opposti fino alla posizione eretta.
