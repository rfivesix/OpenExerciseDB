description: |-
  Posizione di partenza:
  In piedi davanti a una panca o un box pliometrico con un manubrio in ciascuna mano lungo i fianchi.

  Esecuzione:
  1. Appoggia l'intera pianta di un piede sul rialzo.
  2. Spingi con decisione sul tallone della gamba anteriore per sollevare il corpo fino alla completa estensione dell'anca.
  3. Ritorna a terra in modo controllato e ripeti o alterna le gambe.
