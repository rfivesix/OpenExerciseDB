name: Spingere su burpees
description: |-
  Posizione di partenza:
  Stare dritti, piedi alla larghezza delle anche.
  Passi:

  Accovacciarsi in basso e appoggiarsi al pavimento con le mani tra le ginocchia e davanti ai piedi, la schiena dritta.
  Tenendo le mani sul pavimento, saltate le gambe all'indietro in posizione di plank alto.
  Eseguire un push-up.
  Saltate i piedi in avanti per tornare alla posizione di squat.
  Ripetere.
