name: 'Esercizio di yoga: Mucca-gatto'
description: |-
  Iniziare assumendo la posizione a quattro piedi. Le mani sono sotto le spalle. Le dita sono aperte a ventaglio e assicurano una posizione stabile. È meglio appoggiare il peso anteriore del corpo sui pollici e sugli indici. Ora posizionate le gambe alla larghezza dei fianchi sul tappetino da yoga. Le cosce devono trovarsi verticalmente sotto i fianchi. Assicuratevi che il peso sia distribuito uniformemente tra le mani e le ginocchia. La testa è un prolungamento della colonna vertebrale e lo sguardo è rivolto verso il tappetino. La schiena è in posizione neutra. Inspirate profondamente e iniziate con il gatto. Con l'espirazione successiva, arrotondate la schiena vertebra per vertebra. Cercate di tirarvi il più possibile verso il soffitto. Tirate la testa verso il petto e inclinate il bacino. Ora inspirate profondamente e passate alla posizione opposta, quella della mucca. Piegate la schiena verso il basso, tirate leggermente indietro le spalle e sollevate la testa quanto più vi è comodo. Lo sguardo è rivolto verso l'alto. Espirate consapevolmente e tornate alla posizione del gatto. Con l'espirazione successiva, tornate alla mucca. Ripetete l'esercizio alcune volte e assicuratevi di essere nel flusso
