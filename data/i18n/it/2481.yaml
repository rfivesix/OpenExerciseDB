description: |-
  Impugna una tavoletta da nuoto con entrambe le mani a braccia distese in avanti e il viso in acqua. Esegui una battuta di gambe costante e compatta che parte dalle anche, con ginocchia morbide, respirando sollevando il capo in avanti per sviluppare la resistenza degli arti inferiori.
