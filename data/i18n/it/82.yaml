name: Alzate laterali a busto flesso con manubri
description: |-
  Posizione di partenza:
  In piedi, con i piedi distanziati alla larghezza dei fianchi e le ginocchia leggermente flesse, piega il busto in avanti mantenendo la schiena dritta e parallela o quasi al suolo. Impugna i manubri con le braccia rivolte verso il basso e i gomiti leggermente piegati.

  Esecuzione:
  1. Solleva lateralmente i manubri verso l'alto fino a quando le braccia non risultano parallele al pavimento, mantenendo i gomiti fissi e i palmi rivolti verso il basso.
  2. Non oscillare il tronco e non muovere le braccia in avanti o indietro: concentrati sulla contrazione dei deltoidi posteriori.
  3. Abbassa lentamente i manubri in modo controllato fino alla posizione di partenza.
