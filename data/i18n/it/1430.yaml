description: |-
  Posizione di partenza:
  In piedi in posizione eretta con i piedi alla larghezza delle anche. Posiziona uno o due dischi lisci uniti tra loro davanti a te.

  Esecuzione:
  1. Afferra i bordi dei dischi con una sola mano utilizzando una presa a pinza, con il pollice su un lato e le altre quattro dita sul lato opposto.
  2. Solleva i dischi da terra mantenendo il braccio disteso lungo il fianco e la schiena dritta.
  3. Mantieni la presa isometrica per il tempo prestabilito senza lasciare scivolare i dischi, poi ripeti con l'altra mano.
