name: Skip a ginocchia alte
description: |-
  Posizione di partenza:
  In piedi in postura atletica, con il core contratto e le spalle rilassate.

  Esecuzione:
  1. Salta ritmicamente da un piede all'altro sollevando in modo esplosivo un ginocchio verso il petto fino a formare un angolo di 90 gradi con l'anca.
  2. Coordina il movimento con il braccio opposto che sale piegato a 90 gradi.
  3. Mantieni un ritmo dinamico e rimbalza con reattività sull'avampiede a ogni passo, tenendo il busto alto.
