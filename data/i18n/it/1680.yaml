name: Allungamento a figura di 4 da seduto
description: |-
  Siediti su una panca con i piedi piatti a terra. Incrocia la caviglia sinistra sopra il ginocchio destro, mantieni la schiena dritta e premi delicatamente il ginocchio sinistro verso il basso.
