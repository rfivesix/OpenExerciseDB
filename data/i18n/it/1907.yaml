description: 'Posizione di partenza:

  Posizionati in affondo con un piede avanti ben piantato a terra e il piede posteriore appoggiato sull''avampiede. Mani sui fianchi e busto eretto.


  Esecuzione:

  1. Scendi verticalmente piegando entrambe le ginocchia fino a sfiorare il suolo con il ginocchio posteriore.

  2. Spingi con decisione attraverso il tallone anteriore per risalire senza fare pause in alto.

  3. Esegui tutte le ripetizioni previste su un lato prima di invertire la posizione delle gambe.


  Consigli:

  Mantieni il busto perpendicolare al pavimento e controlla che il ginocchio anteriore non collassi verso l''interno.'
