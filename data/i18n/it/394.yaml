name: Pulley basso
description: |-
  Sedersi, appoggiare i piedi sui punti di appoggio e afferrare la sbarra con una presa larga. Tirate il peso con un movimento rapido verso l'ombelico, non in alto. Durante il movimento, tenere le braccia e i gomiti vicini al corpo. Le spalle sono unite. Lasciare scendere lentamente il peso finché le braccia non sono completamente distese.
