description: |-
  Esercizio dinamico per rafforzare spalle, pettorali e core.
  Inizia nella posizione yoga del cane a testa in giù, con i fianchi sollevati verso l'alto e le braccia distese. Fletti i gomiti scendendo in avanti con il petto a sfiorare il suolo, per poi risalire estendendo le braccia e aprendo il torace nella posizione del cane a testa in su (o cobra). Risolleva i fianchi tornando alla posizione di partenza.
