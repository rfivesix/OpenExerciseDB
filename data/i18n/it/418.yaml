name: Military press con bilanciere EZ
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, impugna il bilanciere EZ sulle curvature esterne con presa prona. Porta il bilanciere all'altezza delle clavicole, con i gomiti posizionati direttamente sotto i polsi e il core contratto.

  Esecuzione:
  1. Spingi il bilanciere verticalmente verso l'alto sopra la testa fino alla completa estensione delle braccia, evitando di inarcare la zona lombare.
  2. Fermati un istante al vertice del movimento, mantenendo la stabilità delle spalle.
  3. Abbassa lentamente il bilanciere riportandolo con controllo alla parte alta del petto e ripeti.
