description: |-
  Inginocchiati a terra e unisci i palmi delle mani. Appoggia i gomiti flessi su una panca posta davanti a te e abbassa lentamente il torace verso il pavimento. Mantieni i gomiti piegati con le mani dietro la nuca, cura l'allineamento della schiena e respira profondamente mantenendo la posizione.
