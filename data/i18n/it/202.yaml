description: |-
  Posizione di partenza:
  Siediti su una panca a gambe divaricate. Afferra un manubrio e appoggia il gomito e la parte posteriore del braccio contro l'interno della coscia.

  Esecuzione:
  1. Fletti l'avambraccio sollevando il manubrio verso la spalla.
  2. Contrai intensamente il bicipite in cima e abbassa il peso in modo controllato.
