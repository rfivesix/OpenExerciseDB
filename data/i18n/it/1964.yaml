description: |-
  Variante dei piegamenti con posizionamento delle mani più largo rispetto alle spalle per accentuare il lavoro sui pettorali e sui deltoidi anteriori.
  Posiziona le mani a terra a larghezza ampia. Abbassa il corpo fino a sfiorare il suolo con il petto mantenendo il core contratto e la schiena piatta. Spingi con decisione attraverso i palmi tornando alla posizione di partenza senza lasciar cadere il bacino.
