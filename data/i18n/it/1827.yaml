description: |-
  Posizione di partenza:
  Sdraiati supino sul pavimento con le ginocchia e le anche flesse a 90 gradi in posizione a tavolino. Appoggia i palmi delle mani sulle cosce appena sopra le ginocchia.

  Esecuzione:
  1. Spingi con forza le mani contro le cosce e contemporaneamente resisti spingendo le cosce contro le mani.
  2. Mantieni questa contrazione isometrica intensa per alcuni respiri profondi, poi rilascia lentamente.
