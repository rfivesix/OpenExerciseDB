name: Affondo laterale con pattina
description: |-
  n piedi, piedi alla larghezza delle anche, tieni un kettlebell vicino al petto in posizione goblet. Posiziona un piede su una pattina/disco scorrevole. Mantieni il busto eretto e il core attivo. Fai scivolare lentamente il piede verso l’esterno piegando il ginocchio della gamba opposta, abbassando i fianchi in un affondo laterale. Mantieni il ginocchio della gamba di lavoro allineato con le dita del piede, evitando che collassi verso l’interno. La gamba non in appoggio resta distesa e scivola fluidamente sul pavimento. Spingi con il tallone della gamba piegata per tornare alla posizione iniziale, mantenendo il controllo del kettlebell.
