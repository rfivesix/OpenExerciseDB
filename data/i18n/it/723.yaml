description: |-
  Posizione di partenza: braccia completamente distese in alto per sentire l'allungamento del gran dorsale, mantenendo le spalle depresse senza incassare il collo. Esecuzione: tira la sbarra verso la parte superiore del petto o le clavicole guidando con i gomiti verso il basso e all'indietro. Mantieni il petto alto e stringi forte le scapole al termine della trazione.
