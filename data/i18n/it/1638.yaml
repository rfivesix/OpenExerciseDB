description: |-
  Esercizio fondamentale multiarticolare: solleva il bilanciere da terra portandolo con una girata esplosiva (clean) fino alle spalle, quindi spingilo con decisione sopra la testa in completa distensione (overhead press). Coinvolge contemporaneamente gambe, schiena, spalle e braccia, sviluppando grande potenza atletica.
