description: |-
  Assumi la posizione di piegamento a terra con le mani leggermente più larghe delle spalle. Sposta il peso del corpo il più possibile su un lato piegando il gomito corrispondente. Scorri fluidamente verso il lato opposto rimanendo basso, quindi torna al centro ed esegui le ripetizioni desiderate.
