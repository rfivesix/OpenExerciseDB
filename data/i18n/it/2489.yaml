name: Rematore al macchinario (Low Row)
description: |-
  Posizione di partenza:
  Siediti al macchinario per rematore (Low Row) con supporto per il petto. Regola l'altezza del sedile in modo che le impugnature siano all'altezza dell'addome. Appoggia saldamente i piedi sulle pedane e il petto contro il cuscino d'appoggio.

  Esecuzione:
  1. Tira le impugnature verso il bacino mantenendo i gomiti vicini al tronco.
  2. Adduci le scapole al termine del movimento e mantieni la contrazione dorsale per un secondo.
  3. Ritorna in avanti in modo lento e controllato fino alla completa estensione delle braccia.

  Consigli:
  Mantieni il busto aderente al supporto per tutta la durata dell'esercizio senza staccare il petto.
