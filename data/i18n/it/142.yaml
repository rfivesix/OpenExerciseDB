description: |-
  Posizione di partenza:
  Posiziona la carrucola del cavo all'altezza del gomito. Mettiti di lato rispetto alla torre e afferra l'impugnatura con la mano più lontana dal cavo. Fletti il gomito a 90 gradi e tienilo aderente al fianco, eventualmente interponendo un piccolo asciugamano arrotolato.

  Esecuzione:
  1. Ruota lentamente l'avambraccio verso l'esterno allontanandolo dal corpo, mantenendo il gomito fisso contro il fianco per isolare i muscoli della cuffia dei rotatori.
  2. Arriva fino alla massima escursione articolare confortevole senza ruotare il busto.
  3. Mantieni la posizione di picco per un secondo, poi rilascia lentamente tornando alla posizione iniziale.
  4. Completa le ripetizioni previste prima di cambiare lato.
