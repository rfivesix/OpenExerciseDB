description: |-
  Posizione di partenza:
  Assumi una posizione di plank alto sulle mani con i piedi appoggiati su dischi di scivolamento (sliders) o calzini su pavimento liscio.

  Esecuzione:
  1. Fletti un ginocchio portandolo in diagonale sotto il corpo e fallo scivolare in avanti fino a toccare il gomito opposto, sollevando leggermente il bacino e contraendo gli addominali obliqui.
  2. Fai scivolare la gamba all'indietro tornando in plank.
  3. Ripeti immediatamente il movimento con la gamba opposta in modo fluido e alternato.
