name: Allungamento dell'elevatore della scapola destra
upstream:
  license: CC-BY-SA-4.0
  source_id: '1911'
description: |-
  Posizione di partenza:
  In piedi o seduto con la schiena ben dritta. Ruota la testa verso destra di circa 45 gradi. Appoggia la mano sinistra sulla sommità del capo e rilassa la spalla destra mantenendola bassa.

  Esecuzione:
  1. Esercita una trazione delicata verso il basso portando il mento verso il torace, fino ad avvertire una tensione controllata sul lato posteriore destro del collo.
  2. Mantieni l'allungamento in modo confortevole per 20-30 secondi respirando regolarmente, quindi rilascia lentamente la presa.
