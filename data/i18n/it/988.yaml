name: Affondo bulgaro (sinistra)
description: 'Posizione di partenza: Mettiti in piedi a circa due passi da una panca
  o sedia. Appoggia il collo del piede destro sulla panca dietro di te, mantenendo
  il piede sinistro ben saldo a terra in avanti.

  Esecuzione: Fletti il ginocchio anteriore sinistro scendendo fino a quando la coscia
  è quasi parallela al pavimento.

  Ritorno: Spingi sul tallone sinistro per tornare alla posizione iniziale.'
