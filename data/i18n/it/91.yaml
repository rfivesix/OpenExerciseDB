name: Curl con bilanciere
description: |-
  Posizione di partenza:
  In piedi con le gambe alla larghezza delle spalle e le ginocchia leggermente sbloccate. Impugna il bilanciere con presa supina (palmi rivolti in avanti) alla larghezza delle spalle, con le braccia distese lungo i fianchi.

  Esecuzione:
  1. Fletti i gomiti sollevando il bilanciere verso la parte alta del petto con un movimento fluido e controllato.
  2. Mantieni i gomiti fermi e stabili lungo i fianchi durante l'alzata.
  3. Contrai fortemente i bicipiti in alto per un istante, poi abbassa lentamente il bilanciere fino alla distensione completa delle braccia.

  Note:
  Non oscillare con la schiena né sfruttare lo slancio del bacino per sollevare il carico.
