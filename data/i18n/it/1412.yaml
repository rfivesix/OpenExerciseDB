name: Bicycle Crunch a terra
description: |-
  Posizione di partenza:
  Sdraiati supino sul pavimento con le mani appoggiate delicatamente dietro la nuca e le gambe sollevate con le ginocchia piegate a 90 gradi.

  Esecuzione:
  1. Fletti e ruota il tronco portando il gomito destro verso il ginocchio sinistro mentre distendi la gamba destra in avanti.
  2. Inverti contemporaneamente il movimento portando il gomito sinistro verso il ginocchio destro piegato, distendendo la gamba opposta.
  3. Ripeti il movimento a pedale in modo continuo e controllato.
