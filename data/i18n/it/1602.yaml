  license_author: zdelko
  source_id: '2571'
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, impugna due manubri leggeri con presa neutra e i pollici rivolti verso l'alto. Mantieni le spalle rilassate, le scapole addotte e i gomiti leggermente flessi, con il core attivo.

  Esecuzione:
  1. Solleva lentamente i manubri verso l'alto e l'esterno a un angolo di circa 30-45 gradi rispetto al busto, seguendo il piano fisiologico della scapola.
  2. Fermati quando le braccia raggiungono l'altezza delle spalle, evitando di salire oltre per non comprimere l'articolazione.
  3. Trattieni la contrazione in cima per un secondo per attivare il dentato anteriore e i deltoidi.
  4. Abbassa i pesi in modo lento e controllato fino ai fianchi. Questo movimento migliora la stabilità e la salute della cuffia dei rotatori.
