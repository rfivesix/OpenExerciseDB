name: Curl per bicipiti con bilanciere EZ
description: |-
  Posizione di partenza:
  Impugna il bilanciere EZ alla larghezza delle spalle. Mantieni la schiena dritta, le spalle leggermente arretrate e le braccia distese.

  Esecuzione:
  1. Fletti le braccia sollevando il peso in modo dinamico e controllato.
  2. Senza pause in cima, abbassa il bilanciere con un movimento lento e costante.
  3. Non oscillare con il busto: il lavoro deve essere svolto esclusivamente dai bicipiti, mantenendo i gomiti fermi lungo i fianchi.
