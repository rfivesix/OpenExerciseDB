description: |-
  Posizione di partenza:
  Prendi il bilanciere dal rack e posizionati con un passo ampio, più largo dei fianchi, davanti a un box basso che ti porti sotto il parallelo.

  Esecuzione:
  1. Spingi il bacino indietro e siediti completamente sul box senza rimbalzare.
  2. Mantieni la massima tensione nel tronco e nella parte superiore della schiena.
  3. Rialzati in modo esplosivo spingendo con forza sui talloni.
