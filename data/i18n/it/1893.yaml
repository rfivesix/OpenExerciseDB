description: |-
  In piedi con i piedi alla larghezza delle spalle e il core contratto. Impugna il bilanciere sulle clavicole con presa prona. Spingi il bilanciere verticalmente sopra la testa fino alla completa estensione delle braccia, evitando di inarcare la schiena, quindi riabbassalo con controllo.
