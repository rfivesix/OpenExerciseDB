description: |-
  Posizione di partenza:
  In piedi con un manubrio in ciascuna mano lungo i fianchi con presa neutra.

  Esecuzione:
  1. Fletti i gomiti sollevando i manubri e ruota gli avambracci in supinazione verso l'alto.
  2. Contrai i bicipiti in cima e abbassa i manubri con controllo tornando alla presa neutra.
