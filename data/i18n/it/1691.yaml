  source_id: '2810'
description: |-
  Posizione di partenza:
  Regola i cavi in alto. Apri le braccia verso l'alto e l'esterno a forma di Y, con una leggera flessione dei gomiti e il petto in allungamento.

  Esecuzione:
  1. Con una traiettoria ad arco fluido, porta le mani verso il basso e verso il centro davanti alla parte inferiore del petto o all'addome superiore.
  2. Spremi con forza i pettorali inferiori nel punto di massima chiusura per 1-2 secondi.
  3. Risali lentamente lungo la stessa traiettoria controllando la discesa dei pesi.
