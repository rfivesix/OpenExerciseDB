description: |-
  Posizione di partenza:
  In piedi davanti alla macchina, regola il cuscinetto all'altezza della parte inferiore del polpaccio di una gamba e afferra le impugnature per stabilizzarti.

  Esecuzione:
  1. Fletti la gamba portando il tallone verso il gluteo fino a formare un angolo retto al ginocchio.
  2. Abbassa il peso lentamente e in modo controllato prima di cambiare gamba.
