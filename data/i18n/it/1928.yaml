description: |-
  Il rematore da seduto con presa a V è un esercizio multiarticolare di trazione eseguito al cavo con un'impugnatura stretta a V. Seduto con i piedi ben piantati sui supporti e il busto eretto, tira la maniglia verso l'addome concentrandoti sullo spessore del gran dorsale e dei romboidi.
