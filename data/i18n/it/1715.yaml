description: |-
  Sdraiati su un fianco tenendo un manubrio con la mano del braccio superiore. Posiziona il gomito aderente al costato piegato a 90 gradi e ruota la spalla sollevando la mano verso il soffitto, poi abbassala lentamente tornando alla posizione iniziale.
