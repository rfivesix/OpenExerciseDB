name: Adduzioni alla macchina per interno coscia
description: |-
  Posizione di partenza:
  Siediti alla macchina per adduttori con la schiena appoggiata. Regola l'apertura delle leve a un raggio confortevole con i cuscinetti posti all'interno delle cosce.

  Esecuzione:
  1. Spingi le cosce verso l'interno chiudendo le gambe fino a toccare il centro.
  2. Contrai fortemente gli adduttori nella posizione di chiusura per 1-2 secondi.
  3. Riapri lentamente le gambe controllando la fase eccentrica.

  Consigli:
  Evita movimenti a scatto per preservare l'articolazione dell'anca e gli adduttori.
