description: |-
  Impugna un manubrio per mano. Fletti il busto in avanti all'altezza delle anche fino a portare la schiena quasi parallela al suolo, lasciando cadere le braccia verso il basso in linea con le spalle. Tira i gomiti verso l'alto e l'esterno aprendo le braccia fino a portare gli omeri paralleli al pavimento. Ritorna lentamente indietro e ripeti.
