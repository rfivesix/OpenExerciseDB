name: Plank to Push-up (estensione gomiti)
description: |-
  Posizione di partenza:
  Inizia in posizione di plank sugli avambracci con i gomiti allineati sotto le spalle, gli avambracci paralleli al suolo e il corpo che forma una linea retta dai talloni alla testa.

  Esecuzione:
  1. Appoggia una mano a terra sotto la spalla e spingi verso l'alto, seguita dall'altra mano, raggiungendo la posizione di plank alto a braccia tese.
  2. Riscendi con controllo prima su un avambraccio e poi sull'altro tornando al plank basso.
  3. Alterna il braccio guida a ogni ripetizione per uno stimolo equilibrato.

  Note:
  Contrai saldamente i glutei e l'addome per evitare oscillazioni del bacino durante la transizione.
