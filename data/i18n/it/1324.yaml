name: Affondi a corpo libero
description: |-
  Posizione di partenza:
  In piedi con le mani sui fianchi e i piedi alla larghezza delle spalle.

  Esecuzione:
  1. Fai un lungo passo in avanti e scendi piegando entrambe le ginocchia a 90 gradi.
  2. Spingi sul tallone anteriore per ritornare alla posizione iniziale e ripeti alternando.
