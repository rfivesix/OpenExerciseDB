name: Sollevamento del bacino da supini
description: |-
  Posizione di partenza:
  Sdraiati sulla schiena sul tappetino con i piedi piatti a terra e le ginocchia piegate.

  Esecuzione:
  1. Solleva il bacino in modo uniforme contraendo con decisione i glutei fino alla massima estensione.
  2. Mantieni la posizione in alto per il tempo stabilito e riabbassa con controllo.
