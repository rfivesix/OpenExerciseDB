name: Leg curl a una gamba a terra
description: 'Posizione di partenza:

  Sdraiati supino su un tappetino con un tallone appoggiato al suolo (o su un supporto scorrevole) e l''altra gamba sollevata
  verso l''alto.


  Esecuzione:

  1. Solleva il bacino formando una linea retta tra ginocchia e spalle.

  2. Fletti energicamente il ginocchio trazionando il tallone verso i glutei per isolare i muscoli ischiocrurali.

  3. Estendi nuovamente la gamba in modo lento e controllato mantenendo il bacino sollevato.'
