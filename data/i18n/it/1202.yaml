description: |-
  Posizione di partenza:
  Sdraiati su un fianco sul tappetino con la gamba inferiore piegata per dare stabilità e la gamba superiore distesa.

  Esecuzione:
  1. Solleva la gamba superiore verso l'alto contraendo il medio gluteo.
  2. Mantieni brevemente la posizione in cima e riabbassa con controllo.
