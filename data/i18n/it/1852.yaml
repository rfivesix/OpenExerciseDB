description: |-
  Posizione di partenza:
  Siediti sul pavimento o posizionati sulle parallele con le gambe unite e le mani accanto ai fianchi.

  Esecuzione:
  1. Spingi sulle mani sollevando l'intero corpo dal suolo a braccia distese.
  2. Mantieni le gambe perfettamente tese e orizzontali a 90 gradi rispetto al busto, contraendo con decisione il core.
