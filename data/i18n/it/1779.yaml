description: |-
  Posizione di partenza:
  Impugna l'estremità del bilanciere inserito nel landmine con entrambe le mani a braccia tese sopra la testa.

  Esecuzione:
  1. Ruota il bilanciere con un arco controllato verso un fianco, ruotando il tronco.
  2. Riporta il bilanciere in alto e ripeti la discesa verso il lato opposto.
