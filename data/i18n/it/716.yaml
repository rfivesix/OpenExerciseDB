name: Wall Slides (Scivolamenti al muro)
description: '- Posizionati con la schiena contro una parete, mantenendo talloni,
  bacino, parte alta della schiena e nuca a contatto con il muro.

  - Posiziona le braccia a ''W'' con i gomiti a 90 gradi e appoggia gomiti e dorso
  delle mani alla parete.

  - Fai scorrere lentamente le braccia verso l''alto formando una ''Y'', senza staccare
  le braccia e senza inarcare la zona lombare.

  - Riporta con controllo le braccia verso il basso contraendo i muscoli peri-scapolari.'
