description: |-
  Posizione di partenza:
  In piedi a passo ampio, più largo delle spalle, con le mani sui fianchi o dietro la nuca.

  Esecuzione:
  1. Fletti le anche spingendo il bacino all'indietro mantenendo la schiena dritta.
  2. Scendi con il busto fin quasi al parallelo e poi risali contraendo i glutei.
