description: |-
  Posizione di partenza:
  Seduto a terra con la schiena contro una panca e un manubrio posizionato sul bacino.

  Esecuzione:
  1. Spingi sui talloni sollevando le anche verso l'alto.
  2. Contrai energicamente i glutei nella massima estensione prima di scendere.
