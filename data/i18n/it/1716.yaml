description: |-
  Appoggia le mani su una panca inclinata in posizione di piegamento. A braccia costantemente tese, spingi il petto lontano dalla panca allontanando le scapole tra loro (protrazione). Quindi lascia scendere il petto verso la panca avvicinando le scapole tra loro (adduzione), poi rispingi via il petto per completare la ripetizione.
