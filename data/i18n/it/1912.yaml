description: |-
  Posizione di partenza:
  Siediti sul tappetino, inclina il busto all'indietro e solleva i piedi da terra con le ginocchia piegate.

  Esecuzione:
  1. Ruota il busto alternativamente a sinistra e a destra.
  2. Mantieni il core attivo ed espira a ogni cambio di lato per stimolare gli addominali obliqui.
