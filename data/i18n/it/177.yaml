name: Bicicletta
description: Il ciclismo, chiamato anche andare in bicicletta o andare in bicicletta, è l'uso di biciclette per il trasporto,
  la ricreazione, l'esercizio o lo sport. Le persone impegnate nel ciclismo sono indicate come ciclisti, ciclisti o motociclisti.
  Oltre alle biciclette a due ruote, il ciclismo comprende anche la guida di monocicli, tricicli, quadricicli, veicoli reclinati
  e simili a propulsione umana.
