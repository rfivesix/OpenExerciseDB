  license_author: Tierrasverdes
  source_id: '2865'
description: |-
  Posizione di partenza:
  In piedi in equilibrio su una gamba, impugnando un manubrio nella mano opposta (o nella stessa mano) con le braccia distese verso il basso. Mantieni il core contratto, le spalle addotte e il petto aperto.

  Esecuzione:
  1. Fletti l'anca della gamba di supporto spingendo il bacino all'indietro, mantenendo il ginocchio d'appoggio leggermente sbloccato.
  2. Inclina il busto in avanti in linea retta mentre la gamba libera si estende all'indietro come prolungamento del tronco.
  3. Fai scendere il manubrio verso la tibia della gamba a terra mantenendo la schiena piatta e le anche perfettamente orizzontali senza ruotare il bacino verso l'esterno.
  4. Quando avverti un forte allungamento nei muscoli ischiocrurali (femorali) e nel gluteo, inverti il movimento premendo con forza sul pavimento con il tallone d'appoggio.
  5. Risali alla posizione iniziale contraendo saldamente il gluteo in cima per ritrovare la stabilità posturale prima della ripetizione successiva.
  6. Esegui la serie completa e ripeti sull'altra gamba.
