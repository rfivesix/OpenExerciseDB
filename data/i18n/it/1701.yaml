  license_author: daiben
  source_id: '2820'
description: |-
  Fase concentrica di remata: solleva il manubrio pesante verso la parte inferiore del torace o il fianco, guidando il movimento con il gomito. Mantieni il tronco rigorosamente stabile, evitando torsioni o rotazioni del busto. Fermati un istante in cima alla salita e contrai al massimo il gran dorsale.
