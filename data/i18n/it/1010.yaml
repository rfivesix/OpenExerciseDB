name: Stretching della nuca
description: 'Posizione di partenza: Siediti in posizione eretta con le spalle rilassate
  e metti le mani dietro la testa.

  Esecuzione: Espira e inclina delicatamente la testa in avanti, portando il mento
  verso il petto fino a sentire un allungamento piacevole dietro al collo.

  Ritorno: Mantieni per 15-30 secondi, quindi rilascia lentamente.'
