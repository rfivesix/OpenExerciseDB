name: Stiramento della nuca
description: |-
  Posizione di partenza:
  Sedersi in posizione eretta su una sedia o un cuscino solido.
  Passi:

  Espirare e inclinare la testa in avanti, mento al petto, mettendo le mani dietro la testa.
  Usa le mani per tirare la testa verso il basso molto leggermente. Tenere per 5 secondi.
  Tira le spalle indietro e in basso usando i muscoli della schiena. Questo dovrebbe aumentare l'allungamento del collo. Tenere per 5 secondi.
  Ora spingi delicatamente la testa verso l'alto, mentre la tiri verso il basso con le mani. Bilanciare entrambe le forze in modo che la testa non si muova. Tenere per almeno 5 secondi.
  Porta le dita alla fronte e usale per spostare delicatamente la testa nella posizione originale.
