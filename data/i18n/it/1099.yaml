description: |-
  Posizione di partenza:
  Fissa un elastico attorno a una kettlebell e sollevala tenendola dall'elastico lungo un fianco.

  Esecuzione:
  1. Solleva un piede da terra rimanendo in equilibrio monopodalico.
  2. Mantieni il corpo stabile contrastando le oscillazioni della kettlebell sospesa all'elastico grazie alla contrazione dei muscoli stabilizzatori del core.
