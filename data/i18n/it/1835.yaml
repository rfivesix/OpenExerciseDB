description: |-
  Posizione di partenza ed esecuzione:
  Siediti a terra a gambe piegate con le piante dei piedi a contatto, sollevando un ginocchio verso l'esterno del corpo. Appoggia il gomito sul ginocchio sollevato flesso a 90 gradi, tenendo un manubrio leggero con la mano orientata in avanti. Mantenendo la spalla abbassata e le scapole retratte, ruota l'avambraccio verso l'alto fino alla posizione verticale. Abbassa quindi lentamente la mano tornando alla posizione orizzontale di partenza e ripeti controllando l'allungamento dei rotatori esterni.
