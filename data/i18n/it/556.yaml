description: |-
  Posizione di partenza:
  Posizionati lateralmente sulla sedia romana con il fianco appoggiato al cuscinetto e i piedi bloccati, mantenendo il corpo dritto e le mani dietro la nuca o al petto.

  Esecuzione:
  1. Fletti il busto lateralmente verso il pavimento finché non è approssimativamente parallelo al suolo.
  2. Risali contraendo i muscoli obliqui tornando alla linea di partenza.
