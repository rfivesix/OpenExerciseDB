name: Croci in sospensione (TRX)
description: 'Posizione di partenza: Afferra le maniglie del TRX e inclinati in avanti
  con il corpo disteso e il core contratto, le braccia tese davanti al petto.

  Esecuzione: Mantenendo i gomiti leggermente flessi, apri le braccia verso l''esterno
  in un arco ampio fino a sentire un profondo allungamento sui pettorali.

  Ritorno: Contrai i pettorali per riportare le impugnature davanti al torace, controllando
  il movimento.'
