name: Clamshell (Esercizio della conchiglia)
description: "Posizione di partenza:\nSdraiati sul fianco su un tappetino con le anche\
  \ flesse a 45 gradi e le ginocchia piegate a 90 gradi. Tieni le gambe sovrapposte\
  \ con i talloni a contatto.\n\nEsecuzione:\n1. Mantenendo i talloni uniti, solleva\
  \ il ginocchio superiore verso l'alto come una conchiglia che si apre.\n2. Raggiungi\
  \ la massima apertura senza ruotare il bacino all'indietro.\n3. Contrai il medio\
  \ gluteo per 1-2 secondi in cima.\n4. Riabbassa lentamente il ginocchio alla posizione\
  \ di partenza con controllo.\n\nConsigli:\nMantieni il bacino stabile e perpendicolare\
  \ al suolo durante l'intera esecuzione."
