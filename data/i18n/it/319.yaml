description: |-
  Posizione di partenza:
  In piedi con abbigliamento comodo e scarpe da corsa adeguate.

  Esecuzione:
  1. Inizia a correre all'aperto o sul tapis roulant a un ritmo aerobico moderato e costante.
  2. Mantieni la respirazione regolare, il busto leggermente inclinato in avanti e le spalle rilassate.
