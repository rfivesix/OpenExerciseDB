name: Lat machine unilaterale con maniglia
description: |-
  Posizione di partenza:
  Siediti alla lat machine e afferra la maniglia singola con una presa neutra. Mantieni il busto eretto, il petto sollevato e le scapole stabilizzate verso il basso.

  Esecuzione:
  1. Tira la maniglia verso la parte alta del petto guidando il gomito verso il basso e vicino al costato.
  2. Contrai intensamente il gran dorsale nella posizione di massima contrazione per un secondo.
  3. Risali lentamente verso l'alto con pieno controllo fino alla completa estensione del braccio per allungare il dorsale.
  4. Completa le ripetizioni previste e ripeti con l'altro lato.

  Consigli:
  Mantieni le spalle allineate evitando qualsiasi torsione o compensazione con il tronco.
