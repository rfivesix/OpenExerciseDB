description: 'Posizione di partenza:

  Sostieniti sopra gli anelli da ginnastica a braccia completamente distese e con
  il corpo stabile.


  Esecuzione:

  1. Abbassa il corpo piegando i gomiti finché le spalle non scendono leggermente
  sotto i gomiti.

  2. Spingi con forza verso l''alto tornando alla posizione di supporto a braccia
  tese.'
