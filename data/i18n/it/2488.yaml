description: |-
  Posizione di partenza:
  Sdraiati supino con le ginocchia flesse e i piedi ben appoggiati a terra.

  Esecuzione:
  1. Appiattisci la parte bassa della schiena contro il pavimento ruotando il bacino all'indietro (retroversione).
  2. Contrai i muscoli addominali e i glutei per mantenere la posizione per qualche secondo, poi rilascia delicatamente.
