description: |-
  Posizionati supino sotto una sbarra o un bilanciere regolato a un'altezza adeguata da terra. Afferra la sbarra con una presa supina (palmi rivolti verso di te) a larghezza delle spalle. Allinea il corpo in modo da formare una linea retta perfetta dalla testa ai talloni, mantenendo i glutei e il core attivi. Con le braccia inizialmente distese e le scapole stabilizzate, piega i gomiti e tira il petto verso la sbarra contraendo con forza la muscolatura dorsale e adducendo le scapole. Mantieni la contrazione per un istante nel punto più alto del movimento per massimizzare l'attivazione muscolare, quindi ritorna lentamente e in pieno controllo alla posizione di partenza distendendo le braccia.
