  license_author: painDpice
  source_id: '2254'
description: |-
  Posizione di partenza:
  Sdraiati supino sulla schiena con le ginocchia flesse, i piedi appoggiati a terra e le braccia distese verso l'alto in direzione del soffitto.

  Esecuzione:
  1. Contrai con forza i muscoli addominali e solleva le spalle e la parte superiore del tronco dal pavimento, allungando le mani verticalmente verso l'alto come per raggiungere il soffitto.
  2. Fermati un momento nel punto di massima contrazione in cima.
  3. Abbassa lentamente il busto verso il suolo tornando alla posizione di partenza e ripeti.
