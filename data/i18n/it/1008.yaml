name: Stretching del collo a sinistra
description: 'Posizione di partenza: Siediti o stai in piedi con la schiena dritta
  e le spalle rilassate.

  Esecuzione: Inclina delicatamente la testa verso destra per allungare il lato sinistro
  del collo e il trapezio superiore.

  Ritorno: Mantieni per 15-30 secondi respirando profondamente, quindi torna al centro.'
