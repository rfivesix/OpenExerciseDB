description: |-
  Posizione di partenza:
  Tieni un manubrio sopra la testa afferrandolo con entrambe le mani sotto il disco superiore (presa a coppa).

  Esecuzione:
  1. Mantenendo i gomiti alti e vicini alla testa, fletti le braccia per abbassare il manubrio dietro la nuca in modo lento e controllato.
  2. Fletti leggermente i polsi al punto inferiore per garantire una traiettoria sicura.
  3. Estendi i gomiti spingendo il peso verso l'alto fino a distendere le braccia sopra la testa.
  4. Ripeti per le ripetizioni previste.
