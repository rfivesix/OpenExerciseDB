description: |-
  La trazione dell'arciere (Archer Pull-up) è un esercizio avanzato a corpo libero che rinforza schiena e bicipiti, fungendo da propedeutica fondamentale per la trazione a un braccio. Prende il nome dalla postura simile a quella di un arciere che tende la corda dell'arco nel punto più alto. Esecuzione: impugna una sbarra per trazioni con una presa prona molto più larga delle spalle. Posizione di partenza: rimani appeso con le braccia completamente distese, il core ben saldo e le scapole depresse e attive. La trazione: solleva il corpo tirando principalmente verso una mano; contemporaneamente distendi l'altro braccio lateralmente lungo la sbarra, mantenendolo il più dritto possibile, portando il mento vicino alla mano che tira. Tenuta e discesa: mantieni brevemente la posizione apicale con un braccio piegato e l'altro teso in assistenza, poi abbassati lentamente con pieno controllo fino alla posizione iniziale. Alterna il movimento trazionando verso la mano opposta. Il segreto dell'esercizio consiste nel mantenere il braccio di supporto quasi del tutto disteso per massimizzare il carico sul braccio di trazione primario.
