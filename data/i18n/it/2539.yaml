name: Curl su panca Scott isometrico
description: |-
  Posizione di partenza:
  Siediti alla panca Scott regolando l'altezza del sedile affinché il bordo superiore del cuscino sia a contatto con le ascelle. Appoggia la parte posteriore del braccio sul piano inclinato, impugnando un manubrio in supinazione.

  Esecuzione:
  1. Fletti il gomito sollevando il manubrio fino a circa metà traiettoria (con un angolo del gomito a 90 gradi).
  2. Trattieni il manubrio in posizione perfettamente statica contro la gravità per il tempo prescritto, mantenendo la massima contrazione nel bicipite.
  3. Abbassa lentamente il manubrio con pieno controllo una volta terminato il tempo.

  Note:
  Non sollevare il braccio o il gomito dal supporto durante la tenuta. Mantieni il polso rigido e neutro evitando torsioni articolari.
