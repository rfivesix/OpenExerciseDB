description: |-
  Posizione di partenza:
  Siediti su una panca e afferra un bilanciere con una presa supina (palmi rivolti verso l'alto) alla larghezza delle spalle. Appoggia gli avambracci sulle cosce, lasciando che i polsi sporgano oltre le ginocchia.

  Esecuzione:
  1. Fletti i polsi verso l'alto sollevando il carico verso di te.
  2. Fermati per un momento nel punto di massima contrazione.
  3. Rilascia lentamente il bilanciere tornando alla posizione di partenza.
