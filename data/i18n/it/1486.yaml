  license_author: Moffi
  source_id: '2449'
description: |-
  Inizia posizionando la puleggia del cavo in alto e arretra di circa un metro dalla stazione. Afferra la maniglia del cavo con la mano sinistra all'altezza della testa tenendo il gomito leggermente piegato, quindi fai un passo indietro con il piede sinistro in posizione sfalsata. Tira il gomito verso il tronco ruotando leggermente il busto ed esegui un rematore a un braccio, focalizzandoti sulla contrazione del gran dorsale. Ritorna in modo controllato alla posizione iniziale, cambia mano afferrando la maniglia con la destra e fai un passo indietro con il piede destro per ripetere il movimento dal lato opposto.
