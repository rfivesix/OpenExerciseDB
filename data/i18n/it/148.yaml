name: Calf raise alla macchina Hack Squat
description: |-
  Posizione di partenza:
  Posizionati sulla macchina Hack Squat appoggiando le spalle ai cuscinetti. Posiziona gli avampiedi sul bordo inferiore della pedana con i talloni liberi di scendere.

  Esecuzione:
  1. Abbassa lentamente i talloni per ottenere un allungamento completo dei polpacci.
  2. Spingi energicamente sugli avampiedi sollevandoti il più possibile sulle punte.
  3. Mantieni la contrazione in cima per un secondo prima di scendere in modo controllato.
