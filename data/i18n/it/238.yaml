name: Croci con manubri su panca piana
search_terms:
  - Croci su panca Inclinata
  - Croci con manubri
description: |-
  Sdraiati su una panca piana con i piedi ben saldi a terra e la schiena a contatto con lo schienale. Impugna due manubri sopra il petto con le braccia leggermente flesse ai gomiti e i palmi rivolti l'uno verso l'altro.
  Abbassa lentamente i manubri verso l'esterno compiendo un arco ampio, fino a sentire un buon allungamento a livello dei muscoli pettorali.
  Senza modificare l'angolo dei gomiti, riporta i pesi verso l'alto con un movimento fluido e controllato, contraendo il petto.
