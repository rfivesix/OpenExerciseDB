description: |-
  Fletti i gomiti eseguendo un curl per portare i manubri all'altezza delle spalle. Da qui, spingi i manubri verso l'alto sopra la testa ruotando le braccia in modo che i palmi siano rivolti in avanti. Inverti il movimento per abbassare i pesi e ripeti.
