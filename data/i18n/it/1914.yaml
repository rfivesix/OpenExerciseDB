description: |-
  Posizione di partenza:
  Posizionati alle parallele per dip afferrando le impugnature.

  Esecuzione:
  1. Spingi verso il basso per sostenere il peso del corpo a braccia completamente tese senza oscillare.
  2. Mantieni le spalle depresse, il petto aperto e l'addome contratto per tutta la durata dell'esercizio statico.
