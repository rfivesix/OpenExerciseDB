name: Alzate posteriori su panca inclinata
description: '- Posizionati prono su una panca inclinata a 30-45 gradi con il petto
  ben adeso al cuscinetto e un manubrio per mano.

  - Mantenendo i gomiti leggermente piegati, solleva i manubri verso l''esterno fino
  all''altezza delle spalle.

  - Contrai i deltoidi posteriori e la parte alta della schiena nel punto di massima
  apertura.

  - Abbassa i pesi lentamente e con controllo tornando alla posizione di partenza.'
