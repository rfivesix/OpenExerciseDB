description: |-
  Posizione di partenza:
  Inginocchiati su un tappetino e posiziona un bilanciere a terra davanti a te. Afferra il bilanciere con una presa prona alla larghezza delle spalle.

  Esecuzione:
  1. Con un movimento lento e controllato, fai rotolare la barra in avanti finché il corpo non è disteso e la schiena dritta.
  2. Contrai i muscoli addominali e tira indietro il bilanciere per ritornare alla posizione di partenza.
