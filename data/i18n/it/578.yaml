  license_author: apeschel
  source_id: '422'
description: |-
  Sdraiati su un fianco con le ginocchia leggermente flesse, tenendo un manubrio leggero nella mano superiore. Mantieni il gomito piegato a 90 gradi e ben aderente al fianco, con l'avambraccio posizionato davanti a te. Mantenendo il gomito fisso contro il costato, ruota l'avambraccio verso l'alto di circa 90 gradi fino alla verticale. Fermati un momento e riabbassa lentamente. Un asciugamano arrotolato sotto l'ascella e un supporto per la testa favoriscono un'esecuzione corretta.
