name: Walkout a terra con le mani (Walking Bridge)
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle anche. Piega leggermente le ginocchia e fletti il busto in avanti appoggiando le mani sul pavimento.

  Esecuzione:
  1. Avanza in avanti con le mani passo dopo passo mantenendo addominali e glutei contratti.
  2. Prosegui fino a raggiungere una posizione di plank avanzato con le mani oltre la linea delle spalle, senza inarcare la zona lombare.
  3. Tieni la tensione addominale per un istante.
  4. Ritorna indietro camminando con le mani verso i piedi e ripeti.
