description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, tieni un disco davanti al petto a braccia tese in avanti.

  Esecuzione:
  1. Scendi in uno squat controllato spingendo il bacino all'indietro e flettendo le ginocchia fino a portare le cosce parallele al pavimento.
  2. Il disco serve da contrappeso per mantenere il busto eretto e il core contratto.
  3. Spingi sui talloni per tornare in posizione eretta.
