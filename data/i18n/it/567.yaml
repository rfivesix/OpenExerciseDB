name: Lento avanti da seduto con manubri
description: |-
  Siediti su una panca con schienale quasi verticale. Porta due manubri all'altezza delle spalle, con palmi e gomiti rivolti in avanti. Spingi i pesi verso l'alto avvicinandoli in cima senza farli toccare. Abbassa lentamente e ripeti il movimento.
