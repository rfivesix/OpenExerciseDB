name: Rematore a un braccio con manubrio
description: |-
  Posizione di partenza:
  Appoggia un ginocchio e la mano omolaterale su una panca piana (oppure assumi una posizione a gambe sfalsate con busto flesso in avanti). Mantieni la schiena dritta e parallela al pavimento. Impugna il manubrio con la mano libera a braccio disteso.

  Esecuzione:
  1. Tira il manubrio verso il fianco guidando il gomito indietro vicino al busto.
  2. Contrai il gran dorsale e adduci la scapola nel punto più alto per un secondo.
  3. Rilascia lentamente il manubrio verso il basso fino alla completa distensione del braccio.
  4. Completa la serie e ripeti dall'altro lato.

  Consigli:
  Mantieni le spalle allineate al pavimento senza ruotare il busto durante la tirata.
