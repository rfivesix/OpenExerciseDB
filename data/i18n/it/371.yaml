description: |-
  Posizione di partenza:
  Siediti sulla macchina leg press con la schiena e il bacino ben aderenti allo schienale. Posiziona i piedi sulla pedana a una larghezza leggermente superiore a quella delle spalle, con le punte leggermente ruotate all'esterno.

  Esecuzione:
  1. Sblocca il carico e abbassa la pedana piegando le ginocchia fino a raggiungere un angolo di circa 90 gradi.
  2. Spingi immediatamente la pedana verso l'alto senza pause, mantenendo le ginocchia allineate con i piedi.
  3. Non bloccare mai completamente le articolazioni delle ginocchia in alto per preservare la tensione muscolare e la sicurezza articolare.
