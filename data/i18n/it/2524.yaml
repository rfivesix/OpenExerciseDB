description: |-
  Posiziona il bilanciere sulle spalle come per uno squat. Fai un mezzo passo in avanti con una gamba mantenendola distesa, mentre la gamba posteriore resta leggermente flessa. Fletti il busto in avanti in modo controllato spingendo il bacino indietro per allungare i muscoli ischiocrurali (femorali) della gamba avanzata, quindi ritorna alla posizione eretta.
