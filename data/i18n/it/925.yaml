description: |-
  Posizione di partenza:
  Sgancia la sbarra dal multipower e tienila sopra la parte alta del petto a braccia distese. Mantieni le scapole addotte e premute contro lo schienale leggermente inclinato.

  Fase eccentrica:
  Abbassa lentamente la sbarra fin quasi a sfiorare la parte superiore del petto o le clavicole, mantenendo il pieno controllo senza far rimbalzare il peso.

  Fase concentrica:
  Spingi la sbarra verso l'alto lungo le guide fino alla quasi completa estensione delle braccia, concentrandoti sulla contrazione dei pettorali alti, poi riaggancia la sbarra al termine della serie.
