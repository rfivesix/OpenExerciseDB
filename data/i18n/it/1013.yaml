name: Allungamento dell'elevatore della scapola sinistra
upstream:
  license: CC-BY-SA-4.0
  source_id: '1909'
description: |-
  Posizione di partenza:
  In piedi o seduto con la schiena dritta. Ruota la testa verso sinistra di circa 45 gradi. Appoggia la mano destra sulla parte superiore del capo e rilassa la spalla sinistra lasciandola cadere verso il basso.

  Esecuzione:
  1. Tira delicatamente la testa verso il basso in direzione diagonale, avvicinando il mento verso il petto fino a percepire un allungamento lungo il lato sinistro del collo.
  2. Mantieni la posizione respirando profondamente per circa 20-30 secondi, poi rilascia lentamente la tensione tornando al centro.
