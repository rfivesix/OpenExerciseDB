description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù sul pavimento tenendo un asciugamano teso tra le mani a braccia distese davanti a te.

  Esecuzione:
  1. Tira l'asciugamano verso l'esterno per creare una tensione costante sulle spalle e sulla parte alta della schiena.
  2. Solleva contemporaneamente il petto, le braccia e le gambe da terra contraendo i lombari e i glutei.
  3. Mantieni la posizione per qualche istante, poi abbassati lentamente sul tappetino.
