name: Woodchopper frontale a corpo libero
description: |-
  Posizione di partenza: In piedi con i piedi alla larghezza dei fianchi e le braccia tese sopra la testa.
  Esecuzione: Estendi la colonna vertebrale e le braccia verso l'alto e leggermente indietro sollevando alternativamente una gamba all'indietro per attivare i muscoli erettori spinali e i glutei. Ritorna in posizione controllata e alterna le gambe.
