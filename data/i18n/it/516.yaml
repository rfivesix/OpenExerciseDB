description: 'Posizione di partenza:

  In piedi con i piedi leggermente più larghi delle spalle e le ginocchia flesse,
  unisci le mani in alto sopra una spalla.


  Esecuzione:

  1. Con un movimento diagonale e potente, abbassa le braccia tagliando verso il ginocchio
  opposto mentre ruoti il busto e le anche.

  2. Ritorna controllando la risalita alla posizione iniziale.'
