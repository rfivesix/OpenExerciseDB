description: |-
  Posizione di partenza:
  Regola lo schienale della macchina in modo che le ginocchia siano allineate con l'asse di rotazione. Posiziona il cuscinetto inferiore dietro le caviglie e abbassa il supporto superiore sulle cosce per bloccare le gambe.

  Esecuzione:
  1. Fletti le ginocchia tirando i talloni verso i glutei per contrarre i femorali.
  2. Ritorna lentamente con movimento controllato.
