  license_author: cybro
  source_id: '3058'
description: |-
  Posizione di partenza:
  Posizionati a quattro zampe e solleva appena le ginocchia da terra sulle punte dei piedi.

  Esecuzione:
  1. Arrotonda la colonna vertebrale verso l'alto spingendo con forza attraverso le spalle.
  2. Risucchia l'ombelico verso la spina dorsale e mantieni la posizione contraendo al massimo il core.
