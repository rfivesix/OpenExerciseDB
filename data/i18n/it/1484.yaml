description: |-
  Regola i carichi in base all'angolo di lavoro: quando tiri dall'alto verso il basso puoi aumentare il peso del 20-40% rispetto al movimento dal basso verso l'alto, poiché la porzione inferiore del gran pettorale è naturalmente più forte rispetto a quella superiore.

  Posiziona una carrucola in alto e l'altra nella posizione più bassa. Mettiti in posizione a piedi sfalsati tra le torrette.
  Con il cavo basso, tira verso l'alto e diagonalmente attraverso il corpo per stimolare i fasci clavicolari del petto.
  Con il cavo alto, tira verso il basso e diagonalmente per reclutare i fasci sterno-costali inferiori.
  Una volta completata la serie, inverti l'altezza delle carrucole e ripeti per stimolare entrambi i lati in modo completo ed equilibrato.
