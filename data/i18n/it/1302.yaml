description: |-
  Posizione di partenza:
  Sdraiati su una panca piana impugnando un bilanciere a presa stretta direttamente sopra il petto.

  Esecuzione:
  1. Abbassa la barra verso il collo o la parte alta del torace flettendo i gomiti e lasciandoli avanzare leggermente.
  2. Spingi con forza il bilanciere verso l'alto estendendo i gomiti con i tricipiti.
  3. Mantieni il movimento controllato ed evita oscillazioni con le spalle.
