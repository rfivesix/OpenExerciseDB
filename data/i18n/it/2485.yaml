description: |-
  Datti una spinta dal bordo, esegui alcune bracciate e a ogni respirazione ruota completamente sul dorso per due o tre atti respiratori prima di ritornare in assetto a stile libero. Questo esercizio insegna a ruotare il corpo come un blocco unico e riduce l'ansia di mantenere il viso immerso.
