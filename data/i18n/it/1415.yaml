description: |-
  Posizione di partenza:
  Sdraiati sulla schiena con le ginocchia flesse e i piedi ben appoggiati a terra. Tieni un manubrio sul petto con entrambe le mani o distendilo leggermente verso l'alto con le braccia stabili.

  Esecuzione:
  1. Solleva le spalle e la parte superiore della schiena dal pavimento contraendo intensamente il retto dell'addome contro il peso aggiuntivo del manubrio.
  2. Fermati un momento nel punto di massima contrazione in cima.
  3. Riscendi lentamente e con pieno controllo sul tappetino senza rilassare completamente la tensione.
