description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù su una panca con il bacino sul bordo e le gambe sospese.

  Esecuzione:
  1. Estendi le gambe all'indietro verso l'alto contraendo con decisione glutei ed erettori spinali fino all'allineamento con il tronco.
  2. Riabbassa le gambe con controllo verso la posizione iniziale.
