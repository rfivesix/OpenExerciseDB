name: Kreis press con manubri su panca inclinata
upstream:
  license: CC-BY-SA-4.0
  license_author: M9
  source_id: '2406'
description: |-
  Siediti su una panca inclinata a 45 gradi tenendo i manubri sopra la testa. Abbassa i manubri come in un normale lento per spalle. Ruota i manubri portando i palmi verso l'alto ed estendi le braccia davanti al corpo. Unisci le mani finché i manubri non si toccano a braccia tese, quindi inverti l'intera traiettoria tornando sopra la testa per completare una ripetizione.
