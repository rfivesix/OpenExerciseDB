description: |-
  Posizione di partenza:
  In piedi con i piedi posizionati alla larghezza delle spalle e le ginocchia morbide, oppure seduto eretto su una sedia con i piedi piatti sul pavimento.

  Esecuzione:
  1. Posiziona le mani sui fianchi oppure unisci i palmi davanti al petto.
  2. Ruota lentamente la parte superiore del busto verso destra mantenendo il bacino e le anche ben stabili e rivolti in avanti.
  3. Mantieni la posizione di allungamento per alcuni secondi respirando regolarmente e rilassando la schiena.
  4. Ritorna al centro con calma e ripeti la torsione verso sinistra con la stessa gradualità.
