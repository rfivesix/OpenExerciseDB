description: |-
  Esercizio base: migliora la mobilità della colonna toracica e la flessibilità segmentale della schiena, aprendo spalle e gabbia toracica. Posizione: inginocchiati a terra con il fianco destro rivolto verso una parete. Il bacino è stabile e perpendicolare, con il ginocchio destro a terra e il piede sinistro avanti. Allunga la colonna vertebrale e allinea comodamente la testa. Inizia con le braccia distese davanti al petto, i palmi rivolti l'uno verso l'altro. Inspira per avviare il movimento e apri il braccio sinistro (quello più lontano dalla parete) verso l'esterno e all'indietro. Guida la rotazione a partire dalla gabbia toracica ruotando gradualmente la parte superiore della schiena, mantenendo il bacino perfettamente fermo. Espira completando la rotazione e avvicinando la mano sinistra alla parete, seguendo il movimento con lo sguardo. Inspirando ritorna in avanti, riavvolgendo la colonna segmento dopo segmento, poi ripeti sull'altro lato. Variante avanzata: inginocchiati con il fianco destro alla parete, ginocchio sinistro a terra e piede destro avanti. Prima della rotazione base, inspira ed espira compiendo una circonduzione del braccio radente alla parete verso l'alto e indietro, inspirando al ritorno, per poi eseguire l'esercizio completo su entrambi i lati.
