  license_author: wger.de
  source_id: '110'
description: |-
  Simile al rematore tradizionale, ma eseguito con impugnatura inversa a presa supina (palmi rivolti in avanti). Afferra il bilanciere con una presa leggermente più ampia delle spalle e inclina il busto in avanti fino a formare un angolo poco sopra l'orizzontale. Mantieni il petto in fuori e la schiena dritta per tutta la durata dell'esercizio. Tira il bilanciere con un movimento rapido e controllato verso l'ombelico, tenendo i gomiti vicini ai fianchi. Discendi lentamente fino alla posizione iniziale senza oscillare con il tronco.
