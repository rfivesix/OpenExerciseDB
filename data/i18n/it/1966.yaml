description: |-
  Posizione di partenza:
  Posizionati in affondo a terra con un ginocchio al suolo vicino a una parete, stabilizzando una palla contro il muro con il ginocchio avanzato.

  Esecuzione:
  1. Con le braccia distese davanti a te, ruota lentamente il torace e il braccio esterno aprendoti lateralmente.
  2. Mantieni il bacino completamente immobile per isolare la mobilità della colonna toracica.
