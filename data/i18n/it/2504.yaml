name: Curl a martello con manubri
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle anche, impugna i manubri lungo i fianchi con una presa neutra (palmi rivolti l'uno verso l'altro). Gomiti stabili e spalle basse.

  Esecuzione:
  1. Mantenendo la presa a martello, fletti i gomiti sollevando i manubri verso le spalle.
  2. Contrai intensamente il muscolo brachiale e i flessori dell'avambraccio per un secondo in cima.
  3. Abbassa lentamente i manubri fino alla completa estensione con movimento controllato.

  Consigli:
  Mantieni i gomiti fermi lungo i fianchi evitando oscillazioni del busto.
