description: |-
  Posizione di partenza:
  In piedi con un manubrio in ciascuna mano, tieni le braccia leggermente più larghe delle spalle con i palmi rivolti in avanti.

  Esecuzione:
  1. Fletti i gomiti sollevando contemporaneamente entrambi i manubri verso le spalle.
  2. Mantieni la contrazione un istante in alto e abbassa lentamente i pesi.
