  license_author: lxmx
  source_id: '2170'
description: |-
  Posizione di partenza:
  In piedi con il petto in fuori, piedi alla larghezza dei fianchi e punte leggermente rivolte in avanti. Posiziona le mani dietro la nuca con le dita intrecciate e i gomiti aperti lateralmente all'altezza delle orecchie.

  Esecuzione:
  1. Spingi il bacino all'indietro e fletti le ginocchia mantenendo il busto il più eretto possibile.
  2. Spingi le ginocchia verso l'esterno lungo la linea dei piedi, senza mai farle cedere verso l'interno.
  3. Mantieni le scapole addotte e i gomiti sempre aperti; scendi fino a portare le cosce parallele al pavimento o a contatto con i polpacci, purché la colonna vertebrale rimanga neutrale.
  4. Inverti il movimento spingendo energicamente attraverso i talloni e contraendo i glutei per risalire, eventualmente effettuando un piccolo rimbalzo esplosivo.
  5. Controlla la postura prima di eseguire la ripetizione successiva.
