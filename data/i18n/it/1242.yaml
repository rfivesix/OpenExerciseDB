description: |-
  Posizione di partenza:
  Siediti a terra a gamba tesa con una fascia elastica avvolta intorno all'avampiede, tenendo le estremità con le mani.

  Esecuzione:
  1. Spingi la punta del piede in avanti contro la resistenza dell'elastico per rinforzare polpacci e tendine d'Achille.
