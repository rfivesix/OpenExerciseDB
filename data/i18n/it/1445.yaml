description: |-
  Slancio olimpico:
  Tieni il bilanciere in appoggio sulle clavicole. Fletti rapidamente le ginocchia ed estendile con esplosività per spingere il bilanciere verso l'alto, infilandoti velocemente sotto la sbarra. Raccogli il bilanciere a braccia tese sopra la testa atterrando in posizione di affondo (split). Riporta i piedi paralleli mantenendo il blocco delle braccia prima di riabbassare il carico.
