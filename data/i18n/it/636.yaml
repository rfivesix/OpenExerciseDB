description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù sul pavimento con le braccia distese in avanti oltre la testa e le gambe allungate e distese.

  Esecuzione:
  1. Solleva contemporaneamente da terra le braccia, il petto e le gambe, inarcando leggermente la schiena come se stessi volando.
  2. Contrai intensamente i muscoli lombari e i glutei nel punto più alto.
  3. Mantieni la posizione isometrica respirando regolarmente per 2-5 secondi per ripetizione, poi abbassati lentamente sul tappetino.
