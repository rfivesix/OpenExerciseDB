name: Piegamenti sui polpastrelli (Finger Push-ups)
upstream:
  license: CC-BY-SA-4.0
  source_id: '2183'
description: |-
  Posizione delle mani:
  Assumi una posizione di plank con le mani sotto le spalle. Allarga bene le dita e appoggia saldamente i polpastrelli e i pollici al suolo, sollevando i palmi da terra per scaricare tutto il peso sulle dita.

  Allineamento corporeo:
  Mantieni una linea retta dalla testa ai talloni contraendo con forza addominali e glutei per garantire massima stabilità.

  Discesa:
  Piega lentamente i gomiti abbassando il petto verso il pavimento in modo rigorosamente controllato, mantenendo la tensione stabile sulle dita.

  Salita:
  Spingi con forza attraverso i polpastrelli per distendere le braccia e tornare alla posizione di partenza, mantenendo le dita solide e attive durante l'intera ripetizione.
