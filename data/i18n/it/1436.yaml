description: |-
  Regola i perni di sicurezza del rack all'altezza del tuo punto critico (sticking point). Abbassa il bilanciere fino ad appoggiarlo sui supporti per un secondo mantenendo la tensione attiva, quindi spingilo verso l'alto con la massima forza esplosiva.
