description: |-
  Sdraiati a terra tenendo un manubrio in una mano e solleva i fianchi in posizione di ponte glutei stabile. Con il bacino fermo e il braccio teso sopra il petto, abbassa lentamente il manubrio finché il gomito sfiora il suolo a 45 gradi, poi spingi verso l'alto.
