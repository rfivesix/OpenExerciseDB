name: Distensioni su panca declinata alla macchina Hammer Strength
upstream:
  license: CC-BY-SA-4.0
  source_id: '2966'
description: |-
  Posizione di partenza:
  Siediti sulla macchina Hammer Strength per spinte declinate con le scapole addotte e i piedi ben saldi a terra sotto le ginocchia. Schiena, spalle e glutei restano sempre aderenti allo schienale. Afferra le maniglie con presa prona poco più larga delle spalle, appena sotto il livello del petto.

  Esecuzione:
  1. Contrai il core e spingi attraverso i palmi per distendere i gomiti, mantenendoli a circa 45 gradi rispetto al busto.
  2. Raggiunta la quasi completa estensione delle braccia, contrai i fasci inferiori del gran pettorale.
  3. Ritorna lentamente alla posizione iniziale controllando la fase di discesa.
