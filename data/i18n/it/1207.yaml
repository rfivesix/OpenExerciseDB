description: |-
  Posizione di partenza:
  Assumi la posizione di piegamento a braccia tese con le mani direttamente sotto le spalle e i piedi alla larghezza dei fianchi. Assicurati che il corpo formi una linea retta dalla testa ai talloni.

  Esecuzione:
  1. Porta il ginocchio destro verso il petto, poi, mantenendolo piegato, solleva la gamba destra il più in alto possibile con il piede rivolto verso l'alto.
  2. Ruota le anche in modo da far oscillare il piede destro sopra la gamba sinistra distesa.
  3. Continua la torsione portando il piede destro verso il pavimento, ruotando sull'esterno del piede sinistro d'appoggio senza ruotare la parte superiore del busto.
  4. Ritorna alla posizione di partenza con controllo e ripeti il movimento con la gamba sinistra.
