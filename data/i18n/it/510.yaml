name: Rematore prono su panca con bilanciere
description: |-
  Sdraiati a pancia in giù su una panca piana orizzontale e afferra il bilanciere. Tira il bilanciere verso la parte superiore dell'addome guidando i gomiti all'indietro e stringendo le scapole, poi abbassalo con movimento controllato.
