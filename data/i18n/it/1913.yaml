description: 'Posizione di partenza:

  Sdraiati supino su un tappetino con un ginocchio piegato e il piede ben piantato a terra vicino ai glutei. Distendi l''altra gamba in avanti in linea con la coscia. Braccia a terra lungo i fianchi.


  Esecuzione:

  1. Spingi attraverso il tallone del piede d''appoggio per sollevare il bacino fino ad allineare coscia e busto.

  2. Contrai intensamente il gluteo in cima per un secondo mantenendo il bacino perfettamente orizzontale.

  3. Abbassa lentamente il bacino senza toccare completamente il suolo e ripeti prima di cambiare gamba.


  Consigli:

  Mantieni il core attivo per non inarcare la zona lombare ed evita oscillazioni del bacino.'
