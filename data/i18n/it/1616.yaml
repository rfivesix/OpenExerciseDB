description: |-
  Posizione di partenza:
  Posizionati a quattro zampe su un tappetino con le mani direttamente sotto le spalle e le ginocchia posizionate sotto le anche. Inserisci un manubrio leggero nell'incavo del ginocchio della gamba attiva (cavo popliteo), serrando saldamente il polpaccio contro la parte posteriore della coscia per bloccare il carico in posizione.

  Esecuzione:
  1. Contrai saldamente i muscoli addominali e stabilizza il bacino affinché rimanga parallelo al pavimento durante l'intero esercizio, evitando torsioni del tronco o inarcamenti della zona lombare.
  2. Mantenendo il ginocchio piegato a 90 gradi, solleva la gamba all'indietro e verso l'alto, spingendo la pianta del piede verso il soffitto finché la coscia non risulta allineata con il busto.
  3. Nel punto più alto della traiettoria, stringi con la massima forza il grande gluteo per un secondo completo, focalizzando la contrazione.
  4. Abbassa lentamente il ginocchio verso il pavimento con un movimento controllato e fluido, senza farlo poggiare a terra prima della ripetizione successiva.
  5. Esegui il numero stabilito di ripetizioni prima di trasferire con cura il manubrio all'altra gamba.
