description: |-
  Posizione di partenza:
  Impugna il bilanciere con una presa prona (palmi rivolti verso il basso) all'incirca alla larghezza delle spalle. Assicurati che la schiena sia dritta, le spalle leggermente arretrate e le braccia completamente distese.

  Esecuzione:
  1. Fletti le braccia sollevando il bilanciere verso il petto con un movimento controllato, mantenendo i gomiti vicini ai fianchi senza usare lo slancio del corpo.
  2. Quando il bilanciere raggiunge il livello del petto, fermati brevemente per massimizzare la contrazione dei bicipiti e degli avambracci.
  3. Abbassa lentamente il bilanciere tornando alla posizione di partenza con un movimento controllato, distendendo completamente le braccia.
