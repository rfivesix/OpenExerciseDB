description: |-
  Posizione di partenza:
  Sdraiati supino sul tappetino con le mani appoggiate sul pavimento vicino o sotto i glutei. Solleva le gambe con le ginocchia leggermente piegate.

  Esecuzione:
  1. Contrai l'addome e solleva il bacino e i glutei dal pavimento portando le ginocchia verso il petto.
  2. Abbassa lentamente il bacino senza toccare bruscamente terra.
