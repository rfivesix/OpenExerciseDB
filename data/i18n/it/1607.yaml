description: |-
  Afferra la sbarra per trazioni con una presa prona leggermente più ampia della larghezza delle spalle. Esegui una trazione verso l'alto finché il mento non oltrepassa la sbarra. Nel punto più alto, invece di scendere direttamente, sposta il corpo orizzontalmente verso un lato distendendo un braccio e mantenendo l'altro completamente flesso. Trasla fluidamente da una parte all'altra lungo la sbarra, imitando il carrello di una macchina da scrivere, prima di riabbassarti al centro in modo controllato. Questo esercizio incrementa il tempo sotto tensione, sviluppa la forza di trazione unilaterale e stimola potentemente gran dorsale, bicipiti e deltoidi.
