description: |-
  Posizione di partenza:
  Regola le carrucole dei cavi nella posizione più bassa e applica le maniglie singole. Afferra le maniglie con presa neutra o supina e fai uno o due piccoli passi in avanti per mettere i cavi in tensione, con le ginocchia leggermente flesse e il core contratto.

  Esecuzione:
  1. Mantenendo i gomiti leggermente piegati e fissi, porta le mani verso l'alto e verso il centro davanti al petto con un movimento ad arco, come in un grande abbraccio.
  2. Focalizzati sulla contrazione del gran pettorale (in particolare dei fasci clavicolari) evitando di tirare con le braccia.
  3. Fermati per un secondo al culmine della salita per una contrazione massimale a mani unite.
  4. Ritorna lentamente e con controllo alla posizione iniziale aprendo le braccia, senza far toccare il pacco pesi.
