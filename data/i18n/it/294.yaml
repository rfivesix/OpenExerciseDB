description: |-
  Posizione di partenza:
  Siediti a terra con la parte centrale della schiena appoggiata a una panca, piedi piatti sul pavimento alla larghezza delle spalle. Posiziona un bilanciere sopra il bacino, preferibilmente con un cuscinetto protettivo.

  Esecuzione:
  1. Spingi forte sui talloni estendendo le anche verso l'alto fino a portare il busto e le cosce paralleli al pavimento.
  2. Contrai al massimo i glutei in cima mantenendo lo sguardo in avanti e il mento raccolto.
  3. Abbassa lentamente il bacino in modo controllato senza perdere la tensione muscolare.
