description: |-
  Posizione di partenza:
  Fissa una corda a una carrucola bassa. Mettiti in piedi di spalle al cavo con i piedi leggermente più larghi delle spalle. Afferra le estremità della corda tra le gambe con entrambe le mani, fai qualche passo in avanti per mettere in tensione il cavo e mantieni il petto aperto con le spalle addotte.

  Esecuzione:
  1. Esegui un movimento di hip hinge flettendo le anche e spingendo indietro il bacino, lasciando che il cavo tiri le mani verso l'indietro tra le cosce, con ginocchia morbide e schiena rigorosamente dritta.
  2. Quando senti un intenso allungamento nei muscoli ischiocrurali (femorali), inverti la direzione spingendo con forza i talloni a terra.
  3. Estendi le anche in avanti fino alla completa distensione del bacino, contraendo con decisione i glutei in cima senza iperestendere la colonna lombare, quindi controlla il ritorno.
