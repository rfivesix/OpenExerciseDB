description: |-
  Posizione di partenza:
  Sdraiati a terra sulla schiena con un bilanciere sagomato EZ appoggiato a terra dietro la testa.

  Esecuzione:
  1. Impugna la sbarra a presa stretta e distendi le braccia verso l'alto.
  2. Fletti solo i gomiti abbassando il bilanciere fino a toccare il pavimento dietro la nuca, poi spingi verso l'alto estendendo i tricipiti.
