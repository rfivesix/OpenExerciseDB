description: |-
  Posizione di partenza:
  Fissa la carrucola alla base della macchina e afferra il cavo senza impugnatura con una mano. Posizionati con la schiena al cavo e distendi il braccio verso l'alto sopra la testa.

  Esecuzione:
  1. Mantenendo il gomito puntato in alto vicino alla testa, fletti il braccio abbassando la mano dietro la nuca.
  2. Estendi il gomito spingendo verso l'alto fino alla completa distensione del tricipite.
