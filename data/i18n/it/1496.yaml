description: |-
  Impugna il manubrio con presa supina e inclina leggermente il corpo verso il braccio attivo. Guida il manubrio verso l'alto attraverso il petto fino all'altezza della testa, attivando contemporaneamente i fasci clavicolari del pettorale e il deltoide anteriore, poi riabbassa con controllo.
