description: |-
  Utilizza un dispositivo landmine con il bilanciere orientato perpendicolarmente al corpo a 90 gradi. Fletti leggermente le anche mantenendo la schiena piatta e afferra il collare di caricamento del bilanciere. Solleva la sbarra fino all'altezza del petto guidando con il gomito all'infuori, in modo che l'omero sia parallelo al terreno nel punto apicale, quindi riabbassa con controllo.
