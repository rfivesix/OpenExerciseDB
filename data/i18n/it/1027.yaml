description: |-
  Posizione di partenza: inginocchiati di fronte a una panca a una distanza sufficiente affinché il busto possa scendere tra le ginocchia e la panca. Con la schiena dritta, appoggia i gomiti sulla panca con i palmi uniti e le mani rivolte verso l'alto. Esecuzione: espirando, spingi il petto verso il pavimento senza inarcare o muovere la zona lombare. Contemporaneamente porta le mani verso le spalle, mantenendo i gomiti sulla panca e i palmi a contatto. Trattieni l'allungamento per qualche secondo. Inspirando, rilassa la schiena per ritornare alla posizione iniziale e ripeti.
