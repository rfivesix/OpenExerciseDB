name: Affondo bulgaro (destra)
description: 'Posizione di partenza: Mettiti in piedi a circa due passi da una panca
  o sedia. Appoggia il collo del piede sinistro sulla panca dietro di te, mantenendo
  il piede destro ben saldo a terra in avanti.

  Esecuzione: Fletti il ginocchio anteriore destro scendendo fino a quando la coscia
  è quasi parallela al pavimento.

  Ritorno: Spingi sul tallone destro per tornare alla posizione iniziale.'
