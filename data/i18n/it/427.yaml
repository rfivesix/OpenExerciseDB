description: |-
  Posizione di partenza:
  Siediti su una panca declinata fissando le gambe agli appositi supporti. Incrocia le braccia davanti al petto.

  Esecuzione:
  1. Solleva il busto con un movimento di flessione della colonna vertebrale verso le ginocchia.
  2. Senza soste prolungate in cima, abbassa il busto molto lentamente controllando la fase negativa.
  3. Mantieni il capo fermo e allineato per tutta la durata dell'esercizio.
