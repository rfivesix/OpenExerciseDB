description: |-
  Posiziona la mano sinistra dietro la parte alta della schiena. Con la mano destra afferra il gomito sinistro e tiralo delicatamente all'indietro e verso il basso. Mantieni la posizione di allungamento per alcuni secondi respirando regolarmente.
