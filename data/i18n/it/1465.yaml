name: Spider curl con manubri su panca inclinata
upstream:
  license: CC-BY-SA-4.0
  license_author: Moffi
  source_id: '2428'
description: |-
  Posizione di partenza:
  Regola una panca inclinata a circa 45 gradi. Sdraiati a pancia in giù appoggiando il petto e il busto contro lo schienale inclinato, con la testa che sporge leggermente oltre il bordo superiore e le punte dei piedi appoggiate saldamente a terra. Afferra un manubrio in ciascuna mano lasciando pendere le braccia perpendicolari al pavimento, con i palmi rivolti in avanti (presa supina).

  Esecuzione:
  1. Mantenendo la parte superiore delle braccia verticale e perfettamente immobile, fletti i gomiti per sollevare i manubri verso l'alto verso le spalle.
  2. La posizione inclinata del busto elimina ogni slancio corporeo e massimizza la tensione sui bicipiti in tutto il raggio di movimento.
  3. Spremi intensamente i bicipiti nella parte superiore del movimento per un secondo completo.
  4. Abbassa lentamente i manubri tornando con controllo alla posizione di massima distensione prima di iniziare la ripetizione successiva.
