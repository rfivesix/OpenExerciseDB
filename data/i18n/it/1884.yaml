name: Shinbox IR stretch
description: "Posizione di partenza: Seduti a terra con entrambe le anche e le ginocchia\
  \ piegate a 90 gradi.\nPosizione delle gambe:\nUna gamba è posizionata davanti (rotazione\
  \ esterna), l'altra è\nposizionata di lato/dietro (rotazione interna). Tibie e ginocchia\
  \ devono\nrimanere appoggiate a terra.\nIl movimento:\nMantenendo il bacino dritto,\
  \ inclinare il busto in avanti o\nlateralmente (da un lato all'altro) verso la gamba\
  \ anteriore per\nintensificare l'allungamento.\nAree coinvolte:\nAllunga i glutei\
  \ e il piriforme (gamba anteriore) e i flessori\ndell'anca e i quadricipiti (gamba\
  \ posteriore). Attiva il core e gli\nobliqui durante la flessione laterale.\nObiettivo:\
  \ Migliora la mobilità dell'anca (rotazione interna ed esterna) e allevia la tensione\
  \ nella zona lombare."
