description: |-
  Posizione di partenza:
  Posizionati sulla sedia romana con i piedi ben bloccati nei rulli di supporto e il busto allineato.

  Esecuzione:
  1. Fletti il tronco in avanti contraendo con forza i muscoli addominali.
  2. Ritorna in modo controllato alla posizione di partenza senza iperestendere la schiena.
