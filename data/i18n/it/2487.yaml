description: |-
  Nuota a un'andatura lenta e rilassata a stile libero, a dorso o alternando scivolamenti senza curare la tecnica. L'unico obiettivo è abbassare gradualmente la frequenza cardiaca e distendere la muscolatura prima di uscire dalla vasca.
