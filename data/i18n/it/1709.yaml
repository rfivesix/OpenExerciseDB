  license_author: Croak6728
  source_id: '2832'
description: |-
  In piedi con postura eretta, afferra i cavi incrociati davanti a te all'altezza del petto.
  Esecuzione:
  1. Apri le braccia lateralmente a forma di T con i gomiti quasi tesi, contraendo i deltoidi posteriori.
  2. Rilascia lentamente in avanti fino alla posizione di partenza.
  3. Ripeti il movimento variando le angolazioni: verso l'alto a forma di Y, a forma di W flettendo i gomiti, e infine a forma di L lungo i fianchi per stimolare tutte le fibre posteriori della spalla.
