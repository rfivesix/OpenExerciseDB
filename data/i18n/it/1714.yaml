description: |-
  Fletti il busto in avanti appoggiando una mano a una sedia o a un tavolo per supporto. Con l'altro braccio rilassato verso il basso che impugna un manubrio leggero, esegui delicati movimenti circolari a pendolo per decomprimere l'articolazione della spalla.
