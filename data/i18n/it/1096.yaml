description: |-
  Allenare una postura stabile in appoggio monopodalico è fondamentale per prevenire fastidi e creare una base solida. Assumi la normale posizione eretta e, mantenendo il busto perfettamente stabile e il core contratto, solleva ripetutamente la gamba di scarico verso l'esterno flettendola leggermente all'anca e al ginocchio, per poi riabbassarla con controllo. Ripeti l'esercizio anche sul lato opposto per rinforzare la muscolatura stabilizzatrice delle anche.
