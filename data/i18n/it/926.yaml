name: Pectoral Machine (Pec Deck)
description: 'Posizione di partenza: Siediti alla macchina con la schiena ben appoggiata
  allo schienale. Regola l''altezza del sedile in modo che le impugnature siano all''altezza
  del petto.

  Esecuzione: Con i gomiti leggermente piegati, porta le impugnature a toccarsi davanti
  al torace con un movimento ad arco lento e controllato, contraendo intensamente
  i pettorali.

  Ritorno: Torna lentamente alla posizione di partenza senza far toccare i pesi tra
  le ripetizioni.'
