description: |-
  Siediti su una panca con schienale verticale, impugnando due manubri all'altezza del petto con i palmi rivolti verso di te. Spingi i manubri verso l'alto allargando i gomiti e ruotando i polsi finché in cima i palmi non sono rivolti in avanti. Una volta estese le braccia, inverti il movimento tornando con controllo alla posizione di partenza.
