description: |-
  Posizione di partenza:
  Siediti sulla leg press e appoggia i piedi al centro della pedana con una distanza ridotta, lasciando solo pochi centimetri tra un piede e l'altro, con le punte parallele e rivolte verso l'alto.

  Esecuzione:
  1. Abbassa la pedana in modo controllato fino a flettere le ginocchia a 90 gradi.
  2. Spingi con decisione attraverso i piedi per riportare la pedana in alto senza effettuare pause.
  3. Mantieni il movimento fluido e continuo, evitando di iperestendere le ginocchia nel punto finale.
