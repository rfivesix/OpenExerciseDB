name: Retrazione del mento (Chin Tuck)
description: 'Posizione di partenza: Siediti o stai in piedi con la schiena dritta
  e lo sguardo in avanti.

  Esecuzione: Ritrai il mento orizzontalmente all''indietro (come a formare un doppio
  mento) per allineare le orecchie alle spalle.

  Ritorno: Mantieni per 3-5 secondi, quindi rilascia lentamente alla posizione neutra.'
