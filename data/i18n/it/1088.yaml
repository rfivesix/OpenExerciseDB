description: |-
  Posizione di partenza:
  In piedi con un passo largo e le punte ruotate a 45 gradi, tenendo un manubrio pesante in verticale tra le gambe.

  Esecuzione:
  1. Fletti ginocchia e anche fino a sfiorare il suolo con il manubrio, quindi risali spingendo sui talloni con glutei e adduttori.
