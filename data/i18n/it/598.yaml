description: |-
  Posizione di partenza:
  Sdraiati supino sulla panca posizionata sotto il bilanciere della Smith machine (multipower). Afferra la barra con una presa a larghezza spalle.

  Esecuzione:
  1. Abbassa la barra verso la parte bassa del petto mantenendo i gomiti vicini al busto.
  2. Spingi la barra verso l'alto distendendo le braccia per attivare i tricipiti.
