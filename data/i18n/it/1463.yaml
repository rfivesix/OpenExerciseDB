description: |-
  Il rematore a presa supina con manubri da terra coinvolge fortemente la schiena e i bicipiti, consentendo di utilizzare un carico consistente a patto di controllarlo perfettamente in ogni ripetizione. Posizione di partenza: posizionati in piedi impugnando due manubri con presa supina (palmi rivolti in avanti), piedi alla larghezza delle spalle e ginocchia leggermente piegate. Fletti le anche portando il busto in avanti finché non è quasi parallelo al pavimento, mantenendo la schiena rigorosamente piatta e il core solido. Esecuzione: espira mentre remi i manubri verso i fianchi all'altezza della gabbia toracica, guidando il movimento con i gomiti fino a oltrepassare il busto. Abbassa lentamente i manubri fino alla posizione iniziale prima di iniziare la ripetizione successiva, preservando l'allineamento della colonna.
