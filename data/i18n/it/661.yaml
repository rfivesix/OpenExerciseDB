description: |-
  Posizione di partenza:
  Siediti sulla macchina per tricipiti regolando l'altezza del sedile e afferra saldamente le impugnature con i gomiti appoggiati ai cuscinetti.

  Esecuzione:
  1. Spingi le impugnature verso il basso estendendo gli avambracci senza bloccare bruscamente i gomiti a fine corsa.
  2. Rilascia lentamente il peso tornando alla posizione di partenza, mantenendo i gomiti stabili e senza muovere le braccia superiori.
