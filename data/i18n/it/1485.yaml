description: |-
  Posizione di partenza:
  In piedi davanti alla carrucola alta impugnando la corda, inclina il busto in avanti verso il cavo posizionando un piede arretrato per maggiore stabilità.

  Esecuzione:
  1. Spingi la corda verso il basso estendendo i gomiti e contemporaneamente inclina leggermente il busto all'indietro per allungare il raggio di movimento e incrementare la tensione sul capo lungo del tricipite.
  2. Ritorna controllando la risalita mentre inclini di nuovo il busto in avanti.
