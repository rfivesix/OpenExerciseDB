name: Abduzioni alla macchina per glutei
description: |-
  Posizione di partenza:
  Siediti alla macchina per abduzioni con la schiena ben appoggiata allo schienale. Posiziona i cuscinetti contro la parte esterna delle ginocchia o delle cosce e i piedi sui supporti.

  Esecuzione:
  1. Spingi le gambe verso l'esterno aprendole il più possibile contro la resistenza della macchina.
  2. Sostieni la contrazione massima sui glutei per 1-2 secondi.
  3. Richiudi lentamente le gambe in modo controllato prima di iniziare la ripetizione successiva.

  Consigli:
  Mantieni la schiena sempre aderente allo schienale evitando di scattare con il busto.
