description: |-
  Inizia con i cavi a circa l'altezza delle spalle, tenendo una maniglia per mano. Fai un passo avanti a piedi sfalsati per garantire stabilità e mettere i cavi in tensione. Porta le mani a convergere davanti a te, incrociandole leggermente di pochi centimetri per massimizzare la contrazione dei pettorali, poi ritorna lentamente indietro.
