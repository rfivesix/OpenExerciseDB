description: |-
  Posizione di partenza:
  Posizionati tra le barre parallele con una mano su ciascun montante.

  Esecuzione:
  1. Spingi con forza sulle mani per sollevare il corpo a braccia completamente distese.
  2. Mantieni le spalle depresse e lontane dalle orecchie, il petto aperto e le gambe unite, sostenendo la posizione statica.
