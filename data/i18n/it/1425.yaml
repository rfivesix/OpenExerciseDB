description: |-
  Posizione di partenza:
  Sdraiati sulla schiena con le braccia lungo i fianchi. Solleva le gambe piegando anche e ginocchia a 90 gradi nella classica posizione da tavolino (tabletop), con la zona lombare ben aderente al suolo.

  Esecuzione:
  1. Mantenendo il ginocchio piegato a 90 gradi, abbassa lentamente una gamba dall'anca fino a toccare delicatamente il suolo con la punta del piede.
  2. Riporta la gamba in alto e ripeti il movimento con la gamba opposta.
  3. Mantieni l'addome sempre attivo per non inarcare la schiena.
