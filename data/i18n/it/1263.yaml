description: |-
  Posizione di partenza:
  Sdraiati supino a terra con le ginocchia flesse e i piedi piatti sul pavimento, a circa venti centimetri dai glutei. Posiziona i palmi delle mani sul pavimento accanto alla testa, con le dita rivolte verso le spalle e i gomiti puntati verso il soffitto.

  Esecuzione:
  1. Spingendo contemporaneamente con forza sui piedi e sui palmi delle mani, solleva i fianchi, il bacino e la schiena dal suolo estendendo la colonna vertebrale e le braccia fino a formare un arco dorsale.
  2. Distendi le braccia e le gambe per quanto consentito dalla tua mobilità articolare, aprendo il petto e lasciando rilassato il collo.
  3. Mantieni la posizione per alcuni secondi respirando in modo fluido.
  4. Per scendere, piega lentamente braccia e ginocchia abbassando con cura prima la parte superiore della schiena, poi il bacino fino a toccare il pavimento.
  5. Riposa brevemente prima di eseguire una nuova ripetizione, evitando carichi eccessivi sul collo.
