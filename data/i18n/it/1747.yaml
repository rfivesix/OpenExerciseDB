description: |-
  Posizione di partenza:
  Posizionati sotto la sbarra della Smith machine appoggiando il bilanciere guidato sulla parte superiore dei trapezi. Posiziona i piedi alla larghezza delle spalle, leggermente avanzati rispetto alla verticale della sbarra per ridurre lo stress sul ginocchio e concentrare il lavoro sui quadricipiti e sui glutei. Sblocca la sbarra ruotando i polsi.

  Esecuzione:
  1. Inspira profondamente, mantieni la schiena dritta e il petto aperto, quindi avvia la discesa flettendo anche e ginocchia lungo la traiettoria vincolata dei binari.
  2. Scendi in modo fluido e controllato finché le cosce sono almeno parallele al pavimento, mantenendo i talloni ben saldi a terra.
  3. Espira e spingi energicamente attraverso tutta la pianta del piede per risalire alla posizione iniziale.
  4. Mantieni una leggera flessione articolare in alto senza bloccare bruscamente le ginocchia per preservare la tensione muscolare continua prima di effettuare la ripetizione successiva.
