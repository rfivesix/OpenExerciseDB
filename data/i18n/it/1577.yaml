description: |-
  Posizione di partenza:
  Sdraiati sul fianco destro sul tappetino. Fletti il ginocchio superiore (sinistro) a circa 90 gradi e portalo in avanti sul pavimento, bloccandolo saldamente a terra con la mano destra. Piega poi il ginocchio della gamba inferiore (destra) all'indietro e afferra la caviglia o il piede destro con la mano sinistra, tenendo la coscia allineata con il tronco.

  Esecuzione:
  1. Inspira profondamente per allungare la colonna vertebrale.
  2. Espirando, ruota lentamente le spalle e la parte superiore del tronco verso sinistra, cercando di avvicinare la scapola sinistra al pavimento.
  3. Mantieni il ginocchio superiore costantemente a contatto con il suolo per non perdere la tensione.
  4. Questo allungamento combinato mobilizza la colonna toracica, distende il quadricipite e i flessori dell'anca della gamba inferiore e allunga il grande gluteo e il medio gluteo della gamba superiore.
  5. Rimani in questa posizione per alcuni cicli respiratori profondi, quindi inverti i lati con delicatezza.
