description: |-
  Variante dello squat a corpo libero basata sul controllo del tempo per aumentare la tensione muscolare e la stabilità:

  1. Discesa: scendi lentamente flettendo ginocchia e anche per 3 secondi.
  2. Pausa: fermati in accosciata per 1 secondo mantenendo il core contratto.
  3. Risalita: spingi sui talloni e risali a velocità normale.
