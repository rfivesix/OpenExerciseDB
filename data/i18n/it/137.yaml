description: |-
  Esecuzione identica al butterfly classico, ma con un'impugnatura più stretta:
  Siediti alla macchina per butterfly con la schiena aderente allo schienale e i piedi ben saldi a terra. Chiudi le braccia davanti al petto fino a far quasi avvicinare le maniglie, contraendo intensamente i pettorali, poi torna lentamente indietro mantenendo i pesi in sospensione.
