description: |-
  Posizione di partenza:
  In piedi con un manubrio in ciascuna mano lungo i fianchi.

  Esecuzione:
  1. Fletti le braccia sollevando i manubri verso le spalle con presa supina (palmi verso l'alto).
  2. In cima, ruota i polsi portando i palmi verso il basso (presa prona).
  3. Abbassa i manubri lentamente in pronazione, poi ruota di nuovo i polsi alla base.
