description: |-
  Posizione di partenza:
  Inserisci i piedi nelle staffe del TRX e assumi una posizione di plank alto con le mani a terra sotto le spalle.

  Esecuzione:
  1. Fletti le ginocchia portandole insieme verso il gomito destro contraendo gli obliqui.
  2. Ritorna in plank e ripeti portando le ginocchia verso il gomito sinistro.
