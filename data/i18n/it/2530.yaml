description: |-
  Inizia in posizione di piegamento con mani leggermente più larghe delle spalle. Abbassa il petto verso terra, poi sposta il corpo all'indietro scendendo sugli avambracci a raso terra. Ritorna in avanti sui palmi e spingi verso l'alto distendendo le braccia. Mantieni il core saldo per tutta la durata dell'esercizio.
