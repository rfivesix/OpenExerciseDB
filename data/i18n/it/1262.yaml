description: |-
  Posizione di partenza:
  In piedi di fronte al TRX, afferra la maniglia con una mano con presa supina. Inclina il corpo all'indietro sostenendo il peso del corpo sul braccio teso, mantenendo l'allineamento da testa a piedi.

  Esecuzione:
  1. Mantenendo il gomito alto e stabile, fletti il braccio per tirare il corpo verso la maniglia contraendo il bicipite.
  2. Abbassati lentamente e con controllo tornando a braccio disteso.
  3. Completa le ripetizioni e ripeti sull'altro lato.
