description: |-
  Impugna le estremità delle funi davanti ai fianchi con i piedi alla larghezza delle spalle e le ginocchia leggermente flesse. Attiva il core e muovi le braccia alternativamente su e giù in modo rapido ed esplosivo creando onde continue lungo le corde, mantenendo il ritmo per l'intera durata della serie.
