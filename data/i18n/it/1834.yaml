description: |-
  Fletti il busto in avanti partendo dalle anche e piega leggermente le ginocchia. Deprimi e ritrai la scapola del braccio attivo, appoggiando l'altra mano sul ginocchio per supporto. Solleva il braccio teso in diagonale a circa 15 gradi oltre la linea del capo, mantenendo la scapola saldamente bloccata in contrazione per attivare il trapezio inferiore.
