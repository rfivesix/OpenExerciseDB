description: |-
  Spingiti dalla parete nuotando sul fianco con un braccio disteso in avanti sulla tavoletta e battuta di gambe continua. Mantieni la testa neutra guardando il fondo della vasca e, quando hai bisogno di respirare, ruota lateralmente il capo mantenendo un orecchio in acqua, per poi tornare alla posizione neutra. Nuota una vasca intera prima di cambiare lato per apprendere la corretta coordinazione respiratoria nel nuoto.
