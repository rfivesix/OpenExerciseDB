description: |-
  I piegamenti declinati sono una variante avanzata dei classici piegamenti che pone maggiore enfasi sulle spalle, sulla parte alta del petto e sui tricipiti.
  Posizione di partenza:
  Posiziona i piedi su una superficie rialzata (come una panca, una sedia o un gradino) e appoggia le mani a terra a una larghezza leggermente superiore a quella delle spalle. Mantieni il corpo in una linea retta perfetta dalla testa ai talloni attivando core e glutei.

  Esecuzione:
  1. Abbassa il corpo piegando i gomiti finché il petto non sfiora quasi il pavimento, mantenendo i gomiti a circa 45 gradi rispetto al busto.
  2. Spingi con forza attraverso i palmi per risalire alla posizione di partenza.
  L'elevazione dei piedi sposta una percentuale maggiore del peso corporeo sulla parte superiore del corpo, aumentando notevolmente l'intensità dello sforzo.
