name: Pike Push-Up
search_terms:
  - Flessioni del luccio
  - Piegamenti a V
description: |-
  Posizione di partenza:
  Assumi la posizione a V rovesciata (cane a testa in giù) con bacino alto in aria, braccia, gambe e schiena distese. Le mani sono leggermente più larghe delle spalle.
  Esecuzione:
  1. Fletti i gomiti controllando il movimento, portando la sommità della testa in avanti verso il pavimento.
  2. Spingi con forza attraverso i palmi per tornare alla posizione di partenza estendendo completamente le braccia.
  3. Ripeti per il numero desiderato di ripetizioni.
