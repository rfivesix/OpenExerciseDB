  license_author: Croak6728
  source_id: '4995'
description: |-
  Posizione di partenza:
  Impugna un elastico o una fune a braccia distese sopra la testa. Esegui un affondo molto lungo in avanti con il busto eretto.

  Esecuzione:
  1. Abbassa il bacino verso il pavimento fino a sentire una decisa estensione sull'anca della gamba posteriore.
  2. Esegui piccoli molleggi controllati verso il basso mantenendo il busto verticale e le braccia tese verso l'alto.
  3. Ripeti il movimento per le ripetizioni indicate e cambia gamba.
