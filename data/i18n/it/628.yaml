description: |-
  Fissa una sbarra dritta a una puleggia alta del cavo. Afferra le estremità della barra con presa prona (palmi verso il basso) e tieni le braccia distese davanti a te. Con il busto leggermente inclinato e il core compatto, tira la barra verso il basso in direzione delle cosce mantenendo le braccia tese, quindi risali lentamente controllando la fase eccentrica.
