name: Dip per tricipiti a terra
description: |-
  Posizione di partenza:
  Siediti sul pavimento con le ginocchia flesse e i piedi piatti a terra. Posiziona i palmi delle mani sul pavimento dietro i fianchi alla larghezza delle spalle, con le dita rivolte in avanti verso i piedi.

  Esecuzione:
  1. Spingi sui palmi delle mani per sollevare i glutei da terra distendendo le braccia.
  2. Fletti i gomiti per abbassare lentamente il bacino verso il pavimento fino a quando le braccia non formano un angolo di circa 90 gradi.
  3. Spingi con forza attraverso i palmi per ritornare in alto estendendo i tricipiti.
