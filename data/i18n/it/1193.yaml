description: |-
  Posizione di partenza:
  Siediti su un tappetino tenendo un manubrio o un disco con entrambe le mani davanti al petto. Fletti le ginocchia a circa 90 gradi e solleva i piedi da terra, inclinando il busto all'indietro per attivare il core.

  Esecuzione:
  1. Ruota il busto verso destra portando il peso vicino al pavimento al tuo fianco.
  2. Fermati un secondo, poi ruota fluidamente il tronco verso sinistra portando il peso sul lato opposto.
  3. Mantieni le ginocchia e le gambe il più possibile stabili durante le torsioni.
  4. Continua alternando i lati in modo ritmico e controllato.
