description: |-
  Posizione di partenza:
  Siediti su un tappetino appoggiando le mani leggermente dietro di te per supporto.

  Esecuzione:
  1. Solleva i piedi da terra distendendo le gambe in avanti.
  2. Fletti le ginocchia tirandole verso il petto contraendo l'addome, poi ridistendile controllando il movimento.
