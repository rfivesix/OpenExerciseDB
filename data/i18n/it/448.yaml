description: |-
  Esercizio per la schiena con bilanciere in cui la posizione di partenza prevede il busto flesso in avanti, perfettamente parallelo al pavimento. Il bilanciere poggia a terra sotto il petto. Afferra la sbarra con presa prona a larghezza spalle e tirala esplosivamente verso il petto senza muovere il busto o le gambe. Riporta il bilanciere a terra a ogni ripetizione.
