description: |-
  Sostieniti in appoggio sugli anelli da ginnastica a braccia completamente distese lungo i fianchi. Ruota gli anelli leggermente verso l'esterno e mantieni la posizione a barchetta (hollow body), sviluppando stabilità isometrica in pettorali, spalle e tricipiti.
