description: |-
  Posizione di partenza:
  Posiziona una panca tra due torrette dei cavi con le carrucole regolate all'altezza delle spalle. Siediti con la schiena appoggiata allo schienale e impugna le maniglie con presa neutra.

  Esecuzione:
  1. Chiudi le braccia davanti al petto con un movimento fluido e controllato, mantenendo i gomiti leggermente piegati.
  2. Contrai intensamente i pettorali per un momento nel punto di massima chiusura.
  3. Riapri lentamente le braccia sentendo l'allungamento del petto prima di ripetere.
