name: Lento avanti da seduto con bilanciere
description: |-
  Siediti su una panca con schienale quasi verticale. Impugna il bilanciere con presa alla larghezza delle spalle e portalo all'altezza del petto. Spingi il peso verso l'alto senza distendere completamente le braccia, poi scendi lentamente e ripeti.
