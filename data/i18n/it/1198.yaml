name: Trazioni orizzontali (Inverted Row)
description: |-
  Posizione di partenza:
  • Posiziona un bilanciere all'altezza dei fianchi in un rack o multipower.
  • Posizionati supino sotto la sbarra e afferrala con presa prona leggermente più ampia delle spalle.
  • Appoggia i talloni al pavimento formando una linea retta rigida dalla testa ai piedi.

  Esecuzione:
  • Tira il petto verso la sbarra portando indietro i gomiti e adducendo con forza le scapole.
  • Mantieni il core e i glutei contratti per evitare cedimenti del bacino.
  • Ridiscendi lentamente e sotto controllo fino a distendere completamente le braccia.
