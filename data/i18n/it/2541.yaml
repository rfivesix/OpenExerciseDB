name: Pushdown per tricipiti isometrico a un braccio
description: |-
  Posizione di partenza:
  In piedi davanti a una carrucola alta, impugna una maniglia singola con una mano. Blocca la parte superiore del braccio contro il fianco con il gomito flesso a circa 90 gradi. Inclina leggermente il busto in avanti e contrai l'addome per dare stabilità.

  Esecuzione:
  1. Spingi la maniglia verso il basso estendendo il gomito fino a raggiungere la quasi completa estensione (o l'angolo prescelto).
  2. Trattieni la posizione solida e immobile contro il carico del cavo per il tempo prestabilito, contraendo intensamente il tricipite.
  3. Ritorna lentamente e con controllo alla posizione di partenza prima di cambiare braccio.

  Note:
  Mantieni il gomito fisso lungo il busto senza farlo avanzare o arretrare durante la tenuta isometrica. Spalle basse e rilassate.
