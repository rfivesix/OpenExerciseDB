name: Croci inverse al cavo a un braccio
upstream:
  license: CC-BY-SA-4.0
  license_author: Dulive
  source_id: '3085'
description: |-
  In piedi di lato alla colonna dei cavi con la maniglia all'altezza della spalla. Con il braccio opposto leggermente piegato al gomito, tira la maniglia verso l'esterno e all'indietro lungo un ampio arco orizzontale, allontanando il braccio dal corpo. Mantieni il tronco perfettamente fermo e focalizza lo sforzo sul deltoide posteriore, usando carichi moderati e ripetizioni controllate.
