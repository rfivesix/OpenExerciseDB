description: |-
  Posizione di partenza:
  Posizionati di spalle a una panca, un divano o una parete. Piega un ginocchio a terra appoggiando il collo del piede e lo stinco contro la superficie verticale, mentre porti l'altro piede in avanti in affondo a 90 gradi.

  Esecuzione:
  1. Solleva gradualmente il busto mantenendolo eretto e contrai il gluteo della gamba posteriore.
  2. Spingi delicatamente il bacino in avanti fino ad avvertire un allungamento intenso sul quadricipite e sui flessori dell'anca.
  3. Mantieni la posizione respirando profondamente.
