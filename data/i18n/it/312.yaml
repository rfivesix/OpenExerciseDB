  source_id: '165'
description: |-
  Posizione di partenza:
  Assumi la posizione di plank sugli avambracci appoggiando i piedi sopra una palla da ginnastica (Swiss ball).

  Esecuzione:
  1. Una volta trovata la stabilità, muovi lentamente un piede lateralmente facendolo scendere dalla palla fino a toccare brevemente il pavimento.
  2. Riporta il piede sulla palla tornando alla posizione di partenza e ripeti il movimento con l'altro piede in modo alternato.
