name: Croci su panca piana
description: |-
  Afferra un manubrio di peso moderato in modo che i palmi delle mani siano piatti contro la parte inferiore delle piastre superiori e i pollici siano attorno alla barra. Sdraiati sulla schiena su una panca piana in modo che solo la parte superiore della schiena e le spalle siano a contatto con la panca. I tuoi piedi dovrebbero essere posizionati alla larghezza delle spalle e la tua testa dovrebbe pendere leggermente verso il basso. Con il manubrio appoggiato a distanza di un braccio direttamente sul petto, piega le braccia di circa 15 gradi e tienile piegate per tutto il movimento. Abbassa lentamente il manubrio all'indietro e verso il basso in un arco di semicerchio nella posizione più bassa possibile. Sollevalo lentamente lungo lo stesso arco fino al punto di partenza e ripeti per il numero richiesto di ripetizioni.
