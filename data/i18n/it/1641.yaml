description: |-
  Posizione di partenza:
  In piedi su una gamba tenendo una kettlebell nella mano opposta.

  Esecuzione:
  1. Fletti l'anca inclinando il busto in avanti verso il suolo ed estendendo la gamba libera all'indietro.
  2. Risali contraendo femorali e glutei, migliorando l'equilibrio.
