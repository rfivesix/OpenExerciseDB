description: |-
  Posizionati in piedi con il fianco sinistro vicino a una parete. Distendi il braccio sinistro all'indietro appoggiando il palmo della mano al muro, quindi ruota delicatamente il busto verso destra fino a percepire l'allungamento del bicipite.
