description: |-
  Posizione di partenza:
  Posizionati a quattro zampe con le mani sotto le spalle e le ginocchia sotto le anche.

  Esecuzione:
  1. Fai scivolare una gamba all'indietro fino a distenderla completamente e sollevala mantenendo il piede alto.
  2. Estendi contemporaneamente il braccio opposto in avanti allineato al tronco.
  3. Mantieni la tensione sui lombari e sui glutei prima di rientrare con controllo.
