description: |-
  Posiziona i piedi sulle cinghie del TRX oppure sopra una palla da ginnastica e appoggia le mani a terra sotto le spalle in posizione di plank. Da qui, fletti le ginocchia portandole verso il petto contraendo gli addominali, poi distendi nuovamente le gambe.
