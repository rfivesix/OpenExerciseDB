  license_author: daiben
  source_id: '2809'
description: |-
  Posizione di partenza:
  Regola i cavi in basso. Tieni le braccia verso il basso e leggermente dietro il corpo con i gomiti leggermente piegati, avvertendo un leggero allungamento nel petto.

  Esecuzione:
  1. Solleva le mani verso l'alto e l'interno davanti alla parte alta del petto, all'altezza delle clavicole.
  2. Esegui un movimento fluido e contrai i fasci clavicolari del pettorale per 1-2 secondi in cima.
  3. Ritorna lentamente e con controllo alla posizione di partenza.
