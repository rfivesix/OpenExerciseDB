name: Stacco sumo con kettlebell
description: |-
  Posizione di partenza:
  In piedi con i piedi molto divaricati e le punte ruotate a 45 gradi, posiziona una kettlebell tra i piedi.

  Esecuzione:
  1. Fletti le anche e le ginocchia mantenendo la schiena dritta e afferra la maniglia con entrambe le mani.
  2. Spingi sui talloni ed estendi le anche per sollevare la kettlebell contraendo glutei e adduttori.
