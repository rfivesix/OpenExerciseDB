name: Allenamento al sacco da boxe
description: |-
  Posizione di partenza:
  Posizionati a circa un braccio di distanza dal sacco pesante in guardia da combattimento: gambe leggermente piegate, baricentro basso e pugni a protezione del viso.

  Esecuzione:
  1. Sferra combinazioni di colpi diretti (jab, cross) e ganci con ritmo, precisione ed esplosività.
  2. Ruota il bacino e il tronco a ogni colpo per trasferire l'energia da tutto il corpo all'impatto.
  3. Richiama prontamente le braccia in guardia difensiva dopo ogni colpo e mantieni un continuo lavoro di gambe.
  4. Esegui round a tempo per potenziare la resistenza cardiovascolare e la muscolatura della parte superiore.
