description: |-
  I piegamenti con battuta di mani sono un esercizio pliometrico avanzato progettato per sviluppare forza esplosiva nella parte superiore del corpo.

  Esecuzione:
  1. Assumi una solida posizione di piegamento a terra con le mani posizionate poco oltre la larghezza delle spalle e il core ben compatto.
  2. Abbassa il petto verso il suolo e spingi verso l'alto con la massima esplosività possibile, in modo che le mani si stacchino nettamente dal pavimento.
  3. Batti rapidamente le mani davanti al petto mentre sei in aria, quindi riposizionale velocemente a terra.
  4. Atterra ammortizzando l'impatto con i gomiti leggermente piegati e scendi direttamente nella ripetizione successiva.
