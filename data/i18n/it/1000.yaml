name: Dip a terra
description: 'Posizione di partenza: Siediti a terra con le ginocchia piegate e i
  piedi ben piantati. Posiziona le mani a terra dietro i fianchi con le dita rivolte
  in avanti. Solleva i fianchi di qualche centimetro da terra.

  Esecuzione: Piega i gomiti all''indietro per abbassare il bacino verso il pavimento.

  Ritorno: Spingi sui palmi delle mani per distendere le braccia e contrarre i tricipiti.'
