description: |-
  Distensione unilaterale al cavo eseguita con traiettoria declinata. Usa il braccio libero per stabilizzare il corpo e concentrare tutta la forza sulla spinta. Inizia con la mano vicina al petto e spingi contro il cavo verso il basso e verso il centro del petto, tornando lentamente indietro.
