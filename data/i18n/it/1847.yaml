description: |-
  Posizione di partenza:
  Siediti a terra con le gambe divaricate e distese, posizionando i palmi delle mani sul pavimento tra le cosce.

  Esecuzione:
  1. Spingi con forza sui palmi estendendo le braccia e solleva il bacino e le gambe da terra.
  2. Mantieni le gambe orizzontali e tese sostenendo la posizione con gli addominali.
