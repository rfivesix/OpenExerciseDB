name: Tirate al mento al multipower (Smith Machine)
description: |-
  In piedi con la schiena dritta e i piedi alla larghezza delle spalle davanti alla multipower. Impugna la sbarra sulle cosce con presa prona a braccia distese. Solleva la sbarra vicino al corpo fin sotto il mento, aprendo i gomiti a formare una V. Fai una breve pausa in alto prima di scendere lentamente e ripetere.
