description: |-
  Esercizio di tirata orizzontale con elastico ancorato ad altezza occhi. Afferra la fascia ed esegui una trazione portando i gomiti alti e larghi verso il viso mentre adduci le scapole. Rinforza i deltoidi posteriori, la parte alta della schiena e favorisce una postura corretta.
