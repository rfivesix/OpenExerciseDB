description: |-
  Posizione di partenza:
  In ginocchio su un tappetino con il busto eretto e le anche completamente estese.

  Esecuzione:
  1. Mantenendo una linea retta tra ginocchia e spalle, inclinati lentamente all'indietro flettendo solo le articolazioni delle ginocchia.
  2. Contrai energicamente i quadricipiti femorali per frenare la discesa e ritornare alla posizione iniziale.
