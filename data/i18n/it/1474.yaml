description: |-
  Posizione di partenza:
  Sdraiati supino su un tappetino con le braccia lungo i fianchi per supporto e le gambe unite e distese.

  Esecuzione:
  1. Questo esercizio di crunch inverso avanzato si sviluppa in tre traiettorie per disegnare una W con le gambe.
  2. Per la prima parte, solleva le gambe e il bacino verso l'alto e diagonalmente verso sinistra, staccando l'osso sacro dal pavimento.
  3. Abbassa lentamente le gambe al centro senza toccare terra, quindi sollevale dritto verso l'alto nella parte centrale della W.
  4. Riscendi al centro e solleva infine gambe e bacino verso l'alto e verso destra.
  5. Continua alternando le tre direzioni con movimento controllato del core.
