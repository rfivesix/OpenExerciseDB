description: |-
  Posizione di partenza:
  In piedi di fronte a una carrucola alta, impugna le estremità della corda con presa neutra e i piedi posizionati alla larghezza delle spalle.

  Esecuzione:
  1. Invece di tenere i gomiti fissi sui fianchi, fai scorrere i gomiti leggermente all'indietro mentre spingi la corda verso il basso mantenendola molto vicina al busto.
  2. Estendi completamente i gomiti in basso aprendo le estremità della corda verso l'esterno per massimizzare la contrazione dei tricipiti.
  3. Riporta la corda verso l'alto con un movimento inverso lento e controllato.
