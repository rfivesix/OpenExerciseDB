description: |-
  Posizione di partenza:
  Sdraiati supino sulla schiena e solleva entrambe le gambe distese leggermente dal pavimento.

  Esecuzione:
  1. Muovi le gambe alternativamente su e giù con movimenti brevi e rapidi a forbice (come una pedalata orizzontale), senza toccare il suolo.
  2. Mantieni il core saldamente contratto e la parte bassa della schiena costantemente premuta contro il tappetino durante tutto l'esercizio.
