name: Tirate al mento con bilanciere EZ
description: |-
  In piedi con la schiena dritta e i piedi alla larghezza delle spalle. Impugna il bilanciere EZ con presa prona a braccia distese sulle cosce. Solleva il bilanciere vicino al corpo fino al mento, con i gomiti alti e allargati. Fai una breve pausa in cima e abbassa lentamente.
