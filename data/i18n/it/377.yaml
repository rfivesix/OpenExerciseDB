name: Sollevamento gambe da sdraiato su panca
description: |-
  Posizione di partenza:
  Sdraiati in posizione supina su una panca piana e afferra saldamente i bordi della panca dietro la testa con le mani per stabilizzare il tronco.

  Esecuzione:
  1. Tenendo le gambe distese e unite, sollevale fino a formare un angolo di circa 45 gradi con il pavimento.
  2. Esegui una breve pausa di un secondo nel punto più alto contraendo l'addome.
  3. Abbassa lentamente le gambe tornando alla posizione di partenza senza inarcare la zona lombare.
