description: |-
  Nel sollevamento pesi, il rematore è un esercizio fondamentale multiarticolare volto a rafforzare i muscoli che tirano le braccia verso il tronco (gran dorsale), i muscoli che retraggono le scapole (trapezio e romboidi) e le strutture che stabilizzano la colonna vertebrale (erettori spinali). Inclinando il busto in avanti e sbloccando le ginocchia, afferra il bilanciere e tiralo verso la parte inferiore dell'addome guidando con i gomiti verso l'alto e all'indietro. In ogni fase dell'alzata è fondamentale mantenere l'addome e i lombari compatti per proteggere la schiena e prevenire infortuni.
