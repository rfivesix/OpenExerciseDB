description: |-
  Variante dello squat eseguita collegando una cintura zavorrata a una macchina o a una piattaforma di carico. Il peso viene applicato direttamente sul bacino, consentendo di allenare intensamente quadricipiti e glutei senza comprimere la colonna vertebrale.
