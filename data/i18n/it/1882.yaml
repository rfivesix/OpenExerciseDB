name: Alzate laterali al cavo alto
upstream:
  license: CC-BY-SA-4.0
  license_author: Deflation
  source_id: '3026'
description: |-
  Fissa una maniglia a D alla carrucola posizionata all'altezza della vita o delle spalle. Mettiti di fianco alla torretta con il braccio esterno che afferra la maniglia. Mantieni il busto eretto, il core saldo e il braccio leggermente piegato al gomito. Solleva il braccio lateralmente verso l'alto fino all'altezza della spalla o poco oltre, guidando il movimento con il gomito. Fermati un momento nel punto di massima contrazione del deltoide laterale, quindi riabbassa il cavo lentamente controllando la tensione lungo tutta la discesa.
