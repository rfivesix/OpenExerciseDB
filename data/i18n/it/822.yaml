description: |-
  Le croci inverse ai cavi sono uno dei migliori esercizi di isolamento per rinforzare i deltoidi posteriori e la parte alta della schiena.
  Regola le carrucole dei cavi a un'altezza leggermente superiore a quella della testa.
  Afferra il cavo sinistro con la mano destra e il cavo destro con la mano sinistra, incrociando i cavi davanti a te.
  Inizia il movimento allargando le braccia indietro e all'esterno mantenendo i gomiti leggermente piegati ma fissi.
  Fermati un istante nel punto di massima contrazione dei deltoidi posteriori, poi riporta lentamente le maniglie alla posizione iniziale controllando il carico.
