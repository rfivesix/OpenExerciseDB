description: |-
  Questo esercizio per la cuffia dei rotatori coinvolge principalmente il sottospinato e il piccolo rotondo. Sdraiati su un fianco, tieni il gomito a 90 gradi aderente al busto e ruota l'avambraccio verso l'alto allontanandolo dall'addome, poi riabbassa lentamente.
