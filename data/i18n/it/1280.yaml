description: |-
  Posizione di partenza:
  Siediti alla lat machine con le cosce bloccate sotto i rulli di supporto. Afferra la sbarra con una presa supina stretta (palmi rivolti verso di te), a una distanza inferiore alla larghezza delle spalle.

  Esecuzione:
  1. Mantenendo il busto eretto con il petto in fuori, fletti i gomiti tirando la sbarra verso la parte alta del petto.
  2. Contrai i bicipiti e la parte centrale della schiena in basso.
  3. Rilascia la sbarra verso l'alto con un movimento lento e controllato fino alla completa distensione delle braccia.
