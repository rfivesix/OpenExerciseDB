name: Rematore seduto al cavo
description: |-
  Posizione di partenza:
  Siediti alla postazione pulley con i piedi saldamente appoggiati alle pedane e le ginocchia leggermente flesse. Fletti il busto in avanti mantenendo la schiena piatta per afferrare la maniglia a V, poi raddrizza il busto a 90 gradi.

  Esecuzione:
  1. Tira la maniglia verso l'addome portando i gomiti indietro vicino ai fianchi.
  2. Stringi con decisione le scapole al termine della trazione per attivare il gran dorsale e i romboidi.
  3. Mantieni il tronco stabile evitando oscillazioni con la schiena.
  4. Ritorna in avanti controllando il movimento fino a distendere le braccia e allungare i dorsali.
