description: |-
  Posizione di partenza:
  Posizionati con la schiena rivolta alla carrucola del cavo e impugna la corda dietro la testa.

  Esecuzione:
  1. Estendi le braccia in avanti e verso l'alto sopra la testa fino alla completa estensione dei gomiti.
  2. Controlla la fase negativa opponendo resistenza durante il ritorno.
