  license_author: wger.de
  source_id: '113'
description: |-
  Posizione di partenza:
  In piedi con le braccia distese lungo i fianchi impugnando un manubrio per mano e il core contratto.

  Esecuzione:
  1. Fai un passo in avanti e scendi in affondo finché entrambe le ginocchia formano un angolo di 90 gradi.
  2. Spingi sul tallone anteriore per risalire portando direttamente la gamba posteriore in avanti nel passo successivo.
  3. Continua ad avanzare alternando le gambe in modo fluido e mantenendo sempre il busto eretto.
