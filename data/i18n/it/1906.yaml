description: 'Posizione di partenza:

  Sdraiati supino con le ginocchia flesse e i piedi a terra appoggiati sui talloni a larghezza bacino. Braccia distese lungo i fianchi.


  Esecuzione:

  1. Solleva il bacino contraendo con forza i glutei fino a formare una linea retta con il busto.

  2. Mantenendo il bacino alto e perfettamente orizzontale, distendi una gamba in avanti in linea con la coscia opposta.

  3. Riporta il piede a terra e distendi l''altra gamba, alternando i lati in modo fluido e controllato.


  Consigli:

  Mantieni il core compatto per evitare che le anche oscillino o cedano verso il basso durante l''estensione.'
