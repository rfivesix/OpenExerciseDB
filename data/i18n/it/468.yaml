description: |-
  Sdraiati a pancia in giù su un tappetino appoggiando la fronte su un asciugamano. Distendi le braccia dritte lungo i fianchi. Solleva lentamente le braccia adducendo attivamente le scapole verso la colonna vertebrale e mantieni la contrazione isometrica per 3 secondi prima di scendere.
