description: |-
  Posizione di partenza:
  In piedi con due manubri appoggiati a terra davanti a te.

  Esecuzione:
  1. Scendi rapidamente afferrando le impugnature dei manubri, lancia i piedi indietro ed esegui un burpee toccando il pavimento con il petto.
  2. Con un balzo richiudi i piedi all'esterno dei manubri in posizione di stacco.
  3. Con un unico movimento esplosivo di hip hinge, fai oscillare i manubri tra le gambe e sollevali direttamente sopra la testa con uno snatch fluido, distendendo completamente le anche e le braccia.
