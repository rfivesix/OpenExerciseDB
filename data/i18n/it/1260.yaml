description: |-
  Posizione di partenza:
  Afferra le maniglie del TRX con presa neutra mantenendo i palmi rivolti l'uno verso l'altro. Distendi le braccia in avanti e inclina il corpo all'indietro a gambe tese, sostenendo il peso corporeo sui talloni con il corpo allineato.

  Esecuzione:
  1. Fletti le braccia portando le mani verso le tempie mantenendo i gomiti alti e fermi.
  2. Abbassa il corpo lentamente estendendo le braccia fino alla posizione di partenza.
