  license_author: Moffi
  source_id: '2488'
description: |-
  Posizione di partenza:
  Afferra un manubrio in ciascuna mano e sdraiati supino su una panca piana. Lascia pendere le braccia distese lateralmente verso il pavimento.

  Esecuzione:
  1. Mantenendo i gomiti stabili, fletti le braccia sollevando i manubri verso l'alto contraendo i bicipiti.
  2. Fermati un momento nel punto di massima contrazione in cima.
  3. Abbassa lentamente i manubri con pieno controllo tornando alla distensione iniziale.
