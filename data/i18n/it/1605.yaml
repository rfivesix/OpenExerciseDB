name: Copenhagen Plank
description: |-
  Sdraiati su un fianco con il gomito appoggiato sotto la spalla, in posizione simile a una plank laterale. Appoggia la gamba superiore su una panca con il lato interno del piede o della caviglia. Solleva i fianchi e mantieni il corpo in linea retta tenendo la gamba inferiore sollevata da terra. L’esercizio attiva intensamente gli adduttori della gamba in appoggio e coinvolge anche il core e i muscoli stabilizzatori dell’anca.
