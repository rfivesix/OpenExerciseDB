description: |-
  Posizione di partenza:
  In piedi con un manubrio in ciascuna mano e i palmi rivolti in avanti.

  Esecuzione:
  1. Tira indietro i gomiti facendo scorrere i manubri vicini al busto fino all'altezza del petto.
  2. Abbassa lentamente i manubri lungo la stessa traiettoria controllando la discesa.
