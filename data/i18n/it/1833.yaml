  source_id: '2968'
description: |-
  Posizione di partenza:
  Sdraiati sulla schiena con i talloni appoggiati su dischi scivolanti (sliders) o su un asciugamano.

  Esecuzione:
  1. Solleva il bacino in una posizione di ponte per glutei.
  2. Fai scivolare i talloni verso i glutei flettendo le ginocchia e mantenendo il bacino alto.
  3. Ritorna lentamente distendendo le gambe senza far toccare i glutei al suolo.
