description: |-
  Appoggia l'avambraccio verticalmente contro lo stipite di una porta all'altezza della testa con il gomito a 90 gradi. Fai un passo in avanti con una gamba mantenendo il braccio fermo, allungando dolcemente i muscoli pettorali.
