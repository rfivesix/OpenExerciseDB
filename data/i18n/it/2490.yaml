name: Rematore al cavo basso con triangolo
description: |-
  Posizione di partenza:
  Siediti alla stazione per pulley basso e aggancia la maniglia a triangolo (V-bar). Appoggia i piedi sulle pedane con ginocchia leggermente flesse e afferra la maniglia con la schiena diritta e il petto aperto.

  Esecuzione:
  1. Tira la maniglia verso l'ombelico guidando i gomiti indietro vicini ai fianchi.
  2. Stringi le scapole nel punto di massima contrazione per un secondo.
  3. Rilascia lentamente il peso in avanti controllando il movimento senza inarcare la colonna vertebrale.

  Consigli:
  Evita oscillazioni eccessive del busto; mantieni il core solido per isolare i muscoli dorsali.
