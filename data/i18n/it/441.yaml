description: |-
  Posizione di partenza:
  In piedi con il bilanciere bloccato saldamente sopra la testa con presa molto larga (strappo).

  Esecuzione:
  1. Scendi in accosciata controllata mantenendo la sbarra perfettamente perpendicolare al baricentro.
  2. Risali con forza spingendo attraverso i piedi.
