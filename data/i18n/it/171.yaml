name: Addominali su panca inclinata
description: |-
  Sdraiarsi sulla schiena su una panca inclinata, i piedi sono su un'estremità della panca. Chiedete a un compagno o utilizzate un altro aiuto (bilanciere, ecc.) per tenerli fissi, le mani sono dietro la testa. Da questa posizione, muovete il busto verso l'alto finché la testa o i gomiti non toccano le ginocchia. Eseguire questo movimento arrotolando la schiena.
