name: Circonduzioni articolari dei polsi
description: |-
  Posizione di partenza:
  Siediti o posizionati in piedi con la schiena dritta e le spalle rilassate. Intreccia le dita di entrambe le mani davanti al petto, oppure chiudi le mani a pugno morbido con i gomiti comodamente flessi.

  Esecuzione:
  1. Ruota i polsi compiendo cerchi ampi e fluidi in senso orario attraverso l'intero raggio di movimento naturale e senza dolore.
  2. Inverti il senso di rotazione compiendo cerchi in senso antiorario per la restante durata dell'esercizio.
  3. Mantieni una velocità controllata percependo il progressivo riscaldamento di flessori ed estensori dell'avambraccio.

  Note:
  Esegui il movimento in maniera fluida senza scatti. È un esercizio eccellente di riscaldamento prima di piegamenti, trazioni, verticali o sollevamento pesi.
