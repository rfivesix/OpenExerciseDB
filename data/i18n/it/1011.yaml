name: Allungamento anteriore del collo
description: |-
  Posizione di partenza:
  Siediti o mantieni la posizione eretta con la schiena dritta e le spalle rilassate.

  Esecuzione:
  1. Apri bene la bocca.
  2. Inclina lentamente la testa all'indietro a bocca aperta fino ad avvertire un allungamento confortevole sulla parte anteriore del collo.
  3. Chiudi e apri molto lentamente la bocca alcune volte per intensificare la distensione del platisma e dei flessori del collo.
  4. Riporta con calma il capo nella posizione neutra iniziale.
