  license_author: daiben
  source_id: '2815'
description: |-
  Esecuzione della fase concentrica: tira i gomiti verso il basso e indietro, portando il petto verso le impugnature a presa neutra della sbarra. Mantieni le spalle depresse e addotte, senza alzare le spalle verso le orecchie. Focalizzati sullo strizzare il gran dorsale e i muscoli della parte alta della schiena. Posizione apicale: il mento deve raggiungere o superare l'altezza delle mani; mantieni una pausa per contrarre intensamente il dorso prima della discesa.
