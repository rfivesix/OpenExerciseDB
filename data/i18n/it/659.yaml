description: |-
  Posizione di partenza:
  Posizionati in piedi davanti alla carrucola alta con i piedi alla larghezza delle spalle, fletti leggermente il busto in avanti e impugna la corda con presa neutra.

  Esecuzione:
  1. Spingi la corda verso il basso mantenendo i gomiti stretti e bloccati lungo i fianchi.
  2. A braccia completamente distese in basso, divarica leggermente le estremità della corda verso l'esterno per massimizzare la contrazione dei tricipiti.
  3. Ritorna alla posizione di partenza con un movimento lento e controllato.
