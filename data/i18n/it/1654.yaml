description: |-
  Esercizio di isolamento mirato per il deltoide laterale. La traiettoria guidata della macchina offre una tensione costante e una stabilità ottimale lungo tutto l'arco di movimento, consentendo di focalizzarsi interamente sulla contrazione dei deltoidi senza oscillazioni del busto.
