name: Pulldown a un braccio incrociato al cavo
description: |-
  Posiziona la puleggia del cavo in alto ed esegui una trazione a braccio teso tirando diagonalmente dall'alto verso il basso attraverso il tronco, concentrandoti sulla contrazione del gran dorsale e del deltoide posteriore.
