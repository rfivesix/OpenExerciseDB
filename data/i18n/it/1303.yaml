name: Rematore Helms con manubri su panca
upstream:
  license: CC-BY-SA-4.0
  license_author: carlos3c
  source_id: '2266'
description: |-
  Posizione di partenza: posiziona la parte superiore del petto all'estremità di una panca inclinata a circa 45 gradi, proteggendo il torace con un asciugamano. Il contatto con la panca deve avvenire all'altezza dei pettorali e la schiena deve rimanere quasi parallela al pavimento. Esecuzione: inizia il movimento tirando i gomiti all'indietro fino a percepire la massima tensione nel gran dorsale. Per coinvolgere maggiormente il trapezio e i romboidi, lascia allungare le scapole quando i manubri pendono in basso e ritraile attivamente prima di remare con le braccia verso i fianchi.
