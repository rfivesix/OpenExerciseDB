description: |-
  Posizione di partenza:
  Posizionati davanti alla carrucola alta con i piedi alla larghezza delle spalle e il busto leggermente inclinato in avanti. Impugna la corda con presa neutra (palmi rivolti l'uno verso l'altro).

  Esecuzione:
  1. Spingi la corda verso il basso mantenendo i gomiti stretti lungo i fianchi.
  2. Allarga le estremità della corda verso l'esterno nel punto di massima estensione.
  3. Ritorna lentamente alla posizione iniziale.
