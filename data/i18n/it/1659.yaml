description: |-
  Siediti alla lat machine posizionando il corpo in diagonale rispetto al cavo, con una sola gamba bloccata sotto il cuscino. Tira la maniglia del cavo con il braccio opposto, facendo scendere la linea di trazione diagonalmente attraverso il corpo per enfatizzare l'allungamento e la contrazione anatomica del gran dorsale.
