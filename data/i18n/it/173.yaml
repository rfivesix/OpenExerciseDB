description: |-
  Posizione di partenza:
  Afferra la corda fissata alla carrucola alta con entrambe le mani e posizionala ai lati delle tempie. Inginocchiati rivolto verso il cavo o con le spalle ad esso.

  Esecuzione:
  1. Fletti il busto verso il basso e in avanti, portando i gomiti verso le cosce contraendo con forza l'addome.
  2. Mantieni i fianchi fermi per evitare di scaricare la tensione.
  3. Ritorna lentamente alla posizione di partenza senza muovere le anche.
