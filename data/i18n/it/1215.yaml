description: |-
  Sdraiati a pancia in giù sul pavimento con gambe distese e braccia tese in avanti. Solleva entrambe le braccia da terra contraendo i muscoli della parte alta della schiena e falle scorrere lentamente a semicerchio verso i fianchi, per poi ritornare in modo controllato alla posizione di partenza.
