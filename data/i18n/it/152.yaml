name: Trazioni alla sbarra in supinazione (Chin-up)
search_terms:
- Trazioni alla sbarra
- Chin Up
description: |-
  Posizione di partenza:
  Appenditi a una sbarra per trazioni con una presa supina (palmi rivolti verso di te) alla larghezza delle spalle. Braccia completamente distese e core contratto.

  Esecuzione:
  1. Tira il corpo verso l'alto guidando con i gomiti verso il basso e indietro, finché il mento non supera l'altezza della sbarra.
  2. Mantieni la contrazione massima per un istante contraendo dorsali e bicipiti.
  3. Riscendi lentamente e in modo controllato fino alla distensione completa delle braccia prima di ripetere.

  Note:
  Evita di darti slancio con le gambe e controlla sempre la discesa.
