name: Trazioni alla sbarra
description: |-
  Il chin-up (noto anche come mento o chinup) è un esercizio di allenamento della forza. Le persone spesso eseguono questo esercizio con l'intenzione di rafforzare muscoli come il gran dorsale e il bicipite, che rispettivamente estendono la spalla e flettono il gomito. In questa manovra, i palmi sono rivolti verso il corpo. È una forma di pull-up in cui il range di movimento è stabilito in relazione al mento di una persona.
