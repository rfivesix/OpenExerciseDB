description: |-
  Posizione di partenza:
  In piedi in posizione eretta con un manubrio in ciascuna mano lungo i fianchi, piedi alla larghezza dei fianchi.

  Esecuzione:
  1. Esegui un passo lungo in avanti con una gamba e abbassa il bacino in linea retta verso il pavimento.
  2. Entrambe le ginocchia devono piegarsi a circa 90 gradi; il ginocchio anteriore deve rimanere sopra la caviglia senza superare la punta del piede.
  3. Spingi attraverso il tallone della gamba avanzata per tornare alla posizione iniziale e ripeti con la gamba opposta.
