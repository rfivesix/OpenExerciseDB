description: |-
  Posizione di partenza:
  In piedi con postura eretta, piedi alla larghezza delle spalle e petto in fuori. Impugna l'elastico con entrambe le mani tenendo i gomiti flessi a 90 gradi e incollati ai fianchi, con le mani davanti all'addome e una leggera tensione iniziale sulla banda.

  Esecuzione:
  1. Mantenendo i gomiti strettamente aderenti al tronco, allontana lentamente le mani l'una dall'altra ruotando gli avambracci verso l'esterno ed estendendo l'elastico.
  2. Adduci e abbassa le scapole durante la rotazione esterna delle spalle.
  3. Raggiungi la massima escursione articolare confortevole senza staccare i gomiti dai fianchi.
  4. Trattieni la contrazione di picco per 1-2 secondi per massimizzare il reclutamento della cuffia dei rotatori e dei romboidi.
  5. Riporta lentamente e con controllo le mani alla posizione di partenza.
