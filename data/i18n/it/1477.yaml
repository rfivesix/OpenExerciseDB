description: |-
  Posizione di partenza:
  Siediti a terra con le mani appoggiate sul pavimento dietro il busto per supporto. Piega le ginocchia e sollevale verso il petto con i piedi staccati dal suolo.

  Esecuzione:
  1. Distendi le gambe in avanti e contemporaneamente ruota le ginocchia e i piedi verso destra eseguendo una torsione controllata del bacino per attivare gli obliqui.
  2. Richiama le ginocchia al petto flettendo le gambe.
  3. Distendi nuovamente le gambe ruotando questa volta verso sinistra.
  4. Alterna continuamente le torsioni da un lato all'altro mantenendo il busto stabile.
