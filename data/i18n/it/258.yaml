description: |-
  Siediti o posizionati di fronte a un cavo alto e afferra la barra con un'impugnatura larga. Tira la barra verso la parte alta del petto guidando il movimento con i gomiti verso il basso. Rilascia lentamente e con controllo fino alla completa distensione delle braccia.
