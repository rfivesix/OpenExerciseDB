name: Trazioni orizzontali al TRX (TRX Row)
description: 'Posizione di partenza: Afferra le maniglie del TRX con presa neutra
  e inclinati all''indietro a braccia tese, mantenendo il corpo dritto come una tavola.

  Esecuzione: Tira il torace verso le maniglie guidando i gomiti all''indietro e contraendo
  dorsali e bicipiti.

  Ritorno: Scendi in modo controllato fino alla distensione completa delle braccia.'
