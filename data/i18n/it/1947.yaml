name: Strappo con manubrio (Dumbbell Snatch)
description: |-
  Posizione di partenza:
  In piedi con i piedi leggermente più larghi delle spalle e un manubrio posizionato a terra tra i piedi.

  Esecuzione:
  1. Scendi flettendo ginocchia e anche con la schiena dritta e afferra il manubrio con una presa prona.
  2. Solleva il manubrio in modo estremamente esplosivo spingendo con forza attraverso i talloni ed estendendo completamente anche, ginocchia e caviglie (triplice estensione).
  3. Tira il manubrio vicino al corpo guidando il movimento con il gomito alto, sfruttando l'inerzia verticale generata dagli arti inferiori.
  4. Quando il manubrio supera il petto, ruota rapidamente il polso e infilati sotto il carico, distendendo completamente il braccio sopra la testa mentre ricevi il peso in un quarto di squat ammortizzato.
  5. Rialzati in posizione eretta con il braccio bloccato sopra la testa, poi riabbassa il manubrio a terra con controllo.
