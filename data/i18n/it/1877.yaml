description: |-
  Fissa un'estremità dell'elastico di resistenza a un supporto o al muro all'altezza delle spalle. Inserisci il braccio nell'asola all'altezza del tricipite e fai qualche passo indietro fino a tendere l'elastico. Tira indietro il gomito e la spalla contro la resistenza elastica, adducendo attivamente la scapola.
