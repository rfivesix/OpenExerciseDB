description: |-
  Siediti alla macchina per reverse butterfly con il petto aderente al cuscinetto. Tira le maniglie all'indietro allargando le braccia lateralmente per contrarre i deltoidi posteriori, poi ritorna alla posizione di partenza con movimento lento e controllato.
