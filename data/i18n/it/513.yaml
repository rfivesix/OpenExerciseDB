name: Rematore con bilanciere a T a presa larga
description: |-
  L'esecuzione di questo esercizio è simile al classico rematore con bilanciere a busto flesso, ma sfrutta un punto d'appoggio fisso a terra. Afferra la barra a T con una presa larga, leggermente superiore alla larghezza delle spalle, e fletti il busto in avanti mantenendo un angolo leggermente sopra il parallelo al pavimento. Mantieni il petto aperto e la schiena piatta durante tutta la serie. Tira la barra con un movimento deciso verso l'ombelico, tenendo i gomiti aperti e allineati. Scendi lentamente alla posizione di partenza senza dondolare con il corpo.
