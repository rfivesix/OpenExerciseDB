name: Circonduzioni del collo in senso antiorario
upstream:
  license: CC-BY-SA-4.0
  source_id: '1915'
description: |-
  Posizione di partenza:
  Siediti o posizionati in piedi mantenendo una postura eretta e rilassata. Inclina la testa in avanti portando il mento verso il petto senza comprimere.

  Esecuzione:
  1. Ruota lentamente la testa in cerchio partendo verso la spalla sinistra con un movimento dolce e controllato.
  2. Continua inclinando la testa all'indietro senza forzare eccessivamente la nuca, passa sopra la spalla destra e ritorna con il mento al petto in senso antiorario.
  3. Esegui le ripetizioni mantenendo le spalle basse e la respirazione regolare.
