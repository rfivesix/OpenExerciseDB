name: Lento avanti al multipower (Smith Machine)
description: |-
  Esecuzione simile alla versione con bilanciere libero. Siediti su una panca con schienale quasi verticale e impugna la sbarra guidata poco più larga delle spalle. Spingila verso l'alto senza bloccare i gomiti, poi abbassa lentamente fin sopra la parte alta del petto e ripeti.
