description: |-
  Posizione di partenza:
  Posiziona un manubrio a terra all'altezza delle anche e assumi la posizione di bear crawl a quattro zampe con le ginocchia sollevate a pochi centimetri dal suolo.

  Esecuzione:
  1. Stacca una mano da terra, afferra il manubrio sotto il corpo e trascinalo verso il lato opposto.
  2. Mantieni il bacino perfettamente stabile senza oscillare, poi ripeti con l'altra mano.
