description: |-
  Posizione di partenza: Posiziona il bilanciere sul rack appena sotto l'altezza delle spalle. Infilati sotto la sbarra appoggiandola sulla parte superiore dei trapezi e afferrala con presa salda. Fai uno o due passi indietro e posiziona i piedi alla larghezza delle spalle con le punte leggermente ruotate all'esterno.
  Esecuzione: Inspira, compatta l'addome e fletti contemporaneamente anche e ginocchia spingendo il bacino all'indietro e verso il basso finché le anche non scendono al di sotto del parallelo rispetto alle ginocchia.
  Ritorno: Spingi con forza attraverso l'intero piede ed estendi le gambe per tornare alla posizione eretta espirando.
