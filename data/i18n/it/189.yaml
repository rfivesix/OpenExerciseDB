  license_author: bobbyprince89
  source_id: '381'
description: |-
  Posizione di partenza:
  Posizionati in piedi su una superficie rialzata, come un disco o una pedana bassa, con i piedi alla larghezza dei fianchi e il bilanciere carico posizionato davanti alle tibie. Scendi flettendo anche e ginocchia, mantenendo la schiena dritta e le spalle sopra la sbarra, e afferra il bilanciere con una presa prona o mista alla larghezza delle spalle.

  Esecuzione:
  1. Inspira profondamente, contrai saldamente il core e spingi con forza attraverso i talloni contro la pedana per sollevare il bilanciere.
  2. Mantieni il bilanciere molto vicino al corpo durante tutta la salita; estendi contemporaneamente le ginocchia e le anche fino a raggiungere l'estensione completa in posizione eretta, adducendo le scapole senza iperestendere la zona lombare.
  3. Riabbassa il carico a terra con un movimento controllato, spingendo il bacino all'indietro e flettendo gradualmente le ginocchia una volta superata l'altezza rotulea.

  Note e consigli:
  Il deficit aumenta l'escursione articolare nella parte iniziale del sollevamento, imponendo un maggiore reclutamento a quadricipiti, glutei ed erettori spinali. Mantieni le spalle alte e le braccia rilassate come ganci per tutta l'alzata.
