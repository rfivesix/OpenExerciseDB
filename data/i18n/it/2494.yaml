description: |-
  Esercizio per rinforzare gli estensori del ginocchio nell'arco terminale di movimento. Fissa un elastico di resistenza davanti a te e avvolgilo dietro il cavo popliteo di un ginocchio. In posizione di split stance con il ginocchio fasciato leggermente flesso, distendi la gamba spingendo contro la resistenza dell'elastico e mantieni la contrazione del quadricipite per 3-5 secondi prima di rilasciare.
