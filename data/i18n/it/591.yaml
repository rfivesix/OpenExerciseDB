name: Sits-ups
description: |-
  Siediti su una stuoia, i polpacci sono appoggiati su una panca, le ginocchia formano un angolo retto. Tieni le mani dietro la nuca. Sali ora con un movimento rotatorio della schiena, dovresti sentire come le singole vertebre perdono contatto con il tappetino. Nel punto più alto, contrai gli addominali il più possibile e mantieni la posizione per 2 secondi. Ora scendi, srotolando la schiena.
