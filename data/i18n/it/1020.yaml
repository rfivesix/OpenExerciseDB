exercise_id: '1020'
language: it
status: ai_authored
name: Pistol squat gamba destra
description: |-
  Posizione di partenza:
  Rimani in piedi in equilibrio sulla sola gamba destra, con la gamba sinistra distesa in avanti sollevata dal pavimento. Tendi le braccia in avanti per favorire l'equilibrio.

  Esecuzione:
  1. Piega lentamente il ginocchio e l'anca destra, scendendo in un profondo squat monopodalico.
  2. Mantieni la schiena dritta, il petto alto e la gamba sinistra tesa senza toccare terra.
  3. Raggiungi la massima profondità consentita dalla mobilità della caviglia e dell'anca.
  4. Spingi con forza attraverso il tallone destro per risalire fino alla distensione completa della gamba.
