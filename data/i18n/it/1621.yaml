description: |-
  Posiziona una panca con schienale verticale di fronte alla stazione del cavo. Sistemati in modo da isolare un lato alla volta ed esegui tirate lente e controllate, focalizzandoti sul gran dorsale e mantenendo costante la tensione muscolare anche nella fase di massimo allungamento.
