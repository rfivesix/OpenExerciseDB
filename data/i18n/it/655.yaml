description: |-
  Posizione di partenza:
  Afferra un manubrio in ciascuna mano con presa neutra (palmi rivolti verso il busto). Mantieni la schiena dritta con le ginocchia leggermente flesse e fletti il busto in avanti fino a renderlo quasi parallelo al pavimento. Porta la parte superiore delle braccia aderente ai fianchi e parallela al terreno, con i gomiti flessi a 90 gradi e gli avambracci puntati verso il suolo.

  Esecuzione:
  1. Mantenendo le braccia superiori perfettamente immobili lungo il tronco, espira ed estendi i gomiti spingendo i manubri all'indietro finché le braccia non sono completamente distese. Concentra il movimento esclusivamente sugli avambracci.
  2. Mantieni la contrazione massima sui tricipiti per un breve istante in cima.
  3. Inspira e abbassa lentamente e con controllo i manubri tornando alla posizione di partenza con i gomiti a 90 gradi.
  4. Ripeti per il numero prescritto di ripetizioni senza oscillare con il busto. L'esercizio può essere eseguito anche a un braccio alla volta o al cavo basso per una tensione continua.
