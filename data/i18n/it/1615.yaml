description: |-
  Posizione di partenza:
  Sali sulla pedana del tapis roulant, allaccia la clip di sicurezza agli indumenti e imposta il programma desiderato regolando velocità e inclinazione.

  Esecuzione:
  1. Inizia con una fase di riscaldamento a camminata svelta per preparare muscoli e articolazioni per circa cinque minuti.
  2. Passa alla corsa continua o a un allenamento a intervalli mantenendo una postura eretta, le spalle rilassate e il core leggermente attivo.
  3. Appoggia il piede con una rullata fluida dal mesopiede o dall'avampiede, evitando di impattare duramente con il tallone.
  4. Mantieni le braccia piegate a 90 gradi facendole oscillare avanti e indietro in sincronia naturale con le gambe, senza aggrapparti ai corrimano laterali per preservare la corretta meccanica di corsa.
  5. Al termine della sessione, esegui una fase di defaticamento graduale riducendo la velocità per riportare la frequenza cardiaca ai livelli di riposo.

  Benefici:
  Il tapis roulant permette un lavoro cardiovascolare controllato, stimolando la resistenza aerobica, favorendo il consumo calorico e rinforzando l'intera catena cinetica inferiore di quadricipiti, femorali e polpacci.
