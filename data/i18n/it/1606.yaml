  license_author: WiNNiE
  source_id: '2580'
description: |-
  In piedi con i piedi alla larghezza dei fianchi e il core contratto, esegui tre differenti alzate consecutive per stimolare i deltoidi e la parte superiore della schiena:

  Alzate a T: solleva le braccia lateralmente parallele al pavimento formando una lettera T.
  Alzate a Y: solleva le braccia verso l'alto con un angolo di circa 45 gradi formando una Y.
  Alzate a I: distendi le braccia verticalmente sopra la testa vicine tra loro a formare una I.

  Mantieni la colonna vertebrale in posizione neutra senza inarcare la schiena, muovendoti lentamente e concentrandoti sull'adduzione delle scapole e sull'abbassamento delle spalle lontano dalle orecchie.
