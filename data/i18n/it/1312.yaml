name: Squat a corpo libero
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle o leggermente più larghi, punte ruotate lievemente verso l'esterno e braccia distese in avanti per favorire l'equilibrio.

  Esecuzione:
  1. Inspira e avvia il movimento flettendo contemporaneamente anche e ginocchia, spingendo il bacino indietro come per sederti su una sedia invisibile.
  2. Mantieni il petto aperto, la schiena dritta e le ginocchia allineate con le punte dei piedi.
  3. Scendi fino a quando le cosce sono parallele al pavimento o leggermente al di sotto.
  4. Spingi con forza attraverso i talloni e la pianta del piede per risalire alla posizione eretta, contraendo con decisione i glutei in cima.
