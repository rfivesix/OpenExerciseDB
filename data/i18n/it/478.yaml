description: |-
  Porta i manubri alle spalle con una girata, tenendo i palmi rivolti verso l'interno. Inspira e attiva il core. Fletti leggermente le ginocchia e sfrutta la spinta esplosiva delle gambe per spingere i manubri sopra la testa. Abbassali con controllo fino alle spalle e ripeti il movimento.
