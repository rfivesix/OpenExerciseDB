name: Calf raise a una gamba (destra)
description: |-
  Posizione di partenza:
  Posizionati in piedi sul solo piede destro, appoggiando l'avampiede a terra o sul bordo di un gradino. Tieni il piede sinistro sollevato e sfiora una parete con la mano per l'equilibrio.

  Esecuzione:
  1. Abbassa lentamente il tallone destro verso il basso per allungare il polpaccio.
  2. Spingi con forza sull'avampiede sollevando il tallone il più in alto possibile.
  3. Mantieni la massima contrazione per 1-2 secondi all'apice del movimento.
  4. Ritorna verso il basso in modo controllato senza rimbalzare.
