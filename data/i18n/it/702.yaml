name: Calf raise a una gamba
description: '- Posiziona l''avampiede di una gamba sul bordo di uno scalino o di
  un rialzo solido, mantenendo l''altra gamba sollevata.

  - Mantieni una mano su una parete o su un supporto stabile per garantire l''equilibrio.

  - Abbassa lentamente il tallone verso il basso fino ad avvertire un completo allungamento
  del polpaccio.

  - Spingi con forza sulla punta del piede sollevando il tallone il più in alto possibile.

  - Mantieni la massima contrazione per un secondo, quindi scendi in modo controllato
  e ripeti prima di cambiare gamba.'
