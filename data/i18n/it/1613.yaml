name: Slanci posteriori per glutei con elastico
description: |-
  Posizione di partenza:
  Mettiti a quattro zampe con un elastico di resistenza attorno alle caviglie o sotto il ginocchio d'appoggio.

  Esecuzione:
  1. Estendi una gamba all'indietro verso l'alto contro la tensione dell'elastico, contraendo intensamente il grande gluteo.
  2. Riabbassa lentamente la gamba controllando il movimento prima di eseguire la ripetizione successiva.
