description: |-
  Posizione di partenza:
  In piedi a piedi uniti impugnando le maniglie della corda per saltare all'altezza dei fianchi.

  Esecuzione:
  1. Fai oscillare la corda e salta ritmicamente a piedi pari rimbalzando sugli avampiedi con movimento generato dai polsi.
