description: |-
  Posizione di partenza:
  Appoggia un ginocchio e una mano su una panca piana con il busto parallelo al pavimento. Tieni un manubrio con l'altra mano, portando il gomito in alto vicino al fianco.

  Esecuzione:
  1. Estendi il gomito spingendo il manubrio all'indietro fino a distendere completamente il braccio.
  2. Contrai il tricipite in cima per un istante.
  3. Riporta il manubrio in avanti flettendo il gomito a 90 gradi.
