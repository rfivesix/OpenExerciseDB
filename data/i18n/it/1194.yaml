description: |-
  Posizione di partenza:
  In piedi perpendicolare alla carrucola del cavo ad altezza petto, afferra la maniglia con entrambe le mani vicino allo sterno.

  Esecuzione:
  1. Distendi le braccia dritte in avanti resistendo alla torsione del tronco.
  2. Mantieni la posizione per un secondo e ritorna con controllo al petto.
