description: |-
  Posizione di partenza:
  Regola l'altezza della sella della cyclette in modo che la gamba sia quasi completamente distesa nel punto inferiore della pedalata.

  Esecuzione:
  1. Pedala a ritmo costante con una cadenza fluida mantenendo la schiena dritta.
