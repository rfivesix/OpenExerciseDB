name: Jumping Jack
description: |-
  Posizione di partenza:
  In piedi a piedi uniti con le braccia distese lungo i fianchi e il busto eretto.

  Esecuzione:
  1. Salta divaricando contemporaneamente i piedi oltre la larghezza delle spalle e aprendo le braccia lateralmente fino a unire le mani sopra la testa.
  2. Con un secondo salto immediato, richiudi i piedi e riporta le braccia lungo i fianchi.
  3. Continua ritmicamente ammortizzando ogni atterraggio sugli avampiedi.
