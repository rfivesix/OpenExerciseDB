name: Scrollate alla Smith machine (Multipower)
description: |-
  Afferra la sbarra della Smith machine con i piedi alla larghezza delle spalle e le ginocchia leggermente sbloccate, mantenendo lo sguardo in avanti e le braccia distese. Da questa posizione iniziale solleva il carico tirando le spalle verso l'alto senza flettere i gomiti. Al culmine della contrazione trattieni la posizione per uno o due secondi per stimolare a fondo il trapezio superiore, quindi abbassa lentamente le spalle fino a completo allungamento.
