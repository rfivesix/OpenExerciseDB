description: |-
  Posizione di partenza:
  Appenditi a una sbarra per trazioni con presa prona a braccia distese e corpo rilassato.

  Esecuzione:
  1. Attiva il core e fletti il bacino sollevando le gambe tese in avanti e verso l'alto.
  2. Porta le punte dei piedi a toccare la sbarra tra le mani.
  3. Abbassa le gambe lentamente e con pieno controllo senza dondolare.
