description: |-
  Questa variante si può eseguire con i piedi paralleli o sfalsati. Impugna l'estremità caricata del bilanciere inserito nel supporto Landmine e spingila verso l'alto e in avanti senza deviare verso il centro del corpo. Mantieni il busto dritto, il core contratto e abbassa lentamente il carico.
