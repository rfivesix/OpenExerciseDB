name: Dips
description: |-
  È un esercizio di forza della parte superiore del corpo. Dip stretti, alla larghezza delle spalle, allenano principalmente i tricipiti, con i principali sinergici che sono il deltoide anteriore, i muscoli pettorali (sternale, clavicolare e minore) e i muscoli romboidali della schiena (in quest'ordine).[1] L'allenamento con le braccia larghe pone ulteriore enfasi sui muscoli pettorali, in modo simile al modo in cui una panca con presa larga si concentrerebbe maggiormente sui pettorali e meno sui tricipiti.
