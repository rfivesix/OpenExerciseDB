description: |-
  Posizione di partenza:
  Sdraiati supino su una panca declinata posizionando la testa verso l'estremità più alta e afferra saldamente le impugnature o i bordi della panca per stabilizzarti.

  Esecuzione:
  1. Distendi completamente le gambe sollevandole leggermente dalla panca.
  2. Solleva le gambe tese verso l'alto fino alla verticale, staccando leggermente il bacino per contrarre l'addome.
  3. Abbassa lentamente le gambe fino alla posizione di partenza controllando la discesa.
