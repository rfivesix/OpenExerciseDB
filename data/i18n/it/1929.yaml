description: |-
  Le trazioni assistite sono un esercizio multiarticolare di tirata verticale eseguito alla macchina con pedana a contrappeso oppure utilizzando elastici di resistenza. Riproducono fedelmente la biomeccanica del pull-up standard riducendo il carico effettivo sollevato, risultando uno strumento ideale per sviluppare forza funzionale e perfezionare la tecnica dorsale.
