name: Piegamenti esplosivi (Explosive Push-ups)
description: |-
  Dalla normale posizione di piegamento a terra, abbassa il petto e spingi verso l'alto con massima forza esplosiva staccando le mani dal pavimento. Atterra morbidamente sui palmi ammortizzando l'impatto e ripeti subito.
