description: |-
  I piegamenti in verticale sono un esercizio avanzato a corpo libero in cui il corpo è capovolto in appoggio sulle mani, eseguibile in forma libera o con i piedi appoggiati a una parete per favorire l'equilibrio.

  Esecuzione:
  1. Dalla posizione di verticale, mantieni il core saldo e il corpo perfettamente allineato.
  2. Fletti i gomiti controllando la discesa finché la testa non sfiora delicatamente il pavimento.
  3. Spingi con forza attraverso i palmi estendendo le braccia per ritornare nella verticale completa. Questo movimento sviluppa notevole forza nei deltoidi anteriori, nei tricipiti e nei muscoli stabilizzatori del tronco.
