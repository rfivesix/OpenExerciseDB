description: |-
  Il Meadows Row è un esercizio di remata unilaterale eseguito con un supporto landmine per bilanciere, impugnatura prona e una posizione dei piedi sfalsata a passo d'affondo. Inclina il busto in avanti e afferra l'estremità spessa del bilanciere, appoggiando l'altro avambraccio sul ginocchio anteriore per supporto. Inizia la trazione spingendo il gomito all'indietro e adducendo la scapola, mantenendo la spalla bassa lontana dall'orecchio. Tira la barra verso il fianco posteriore finché il gomito non supera la linea del busto, poi rilascia lentamente.
