name: Panca declinata con bilanciere
description: |-
  Sdraiatevi su una panca declinata, il bilanciere deve trovarsi direttamente sopra gli occhi, le ginocchia sono leggermente angolate e i piedi sono ben saldi sul pavimento. Concentratevi, respirate profondamente e afferrate la sbarra a più della larghezza delle spalle. Portatela lentamente verso il basso fino a sfiorare brevemente il petto all'altezza dei capezzoli. Spingere il bilanciere verso l'alto.
