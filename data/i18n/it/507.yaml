description: |-
  Posizione di partenza:
  In piedi con bilanciere all'altezza delle cosce, schiena dritta e spalle addotte.

  Esecuzione:
  1. Fletti le anche spingendo il bacino indietro con ginocchia leggermente piegate.
  2. Scendi con il bilanciere vicino alle gambe fino a sentire allungare i femorali, quindi risali contraendo i glutei.
