name: Calf raise a una gamba (sinistra)
description: |-
  Posizione di partenza:
  In piedi su un gradino con l'avampiede sinistro sul bordo e il tallone libero, sollevando la gamba destra.

  Esecuzione:
  1. Spingi sull'avampiede sollevando il tallone fino alla massima contrazione sulla punta.
  2. Mantieni la posizione in cima per due o tre secondi.
  3. Abbassa lentamente il tallone sotto il livello dello scalino prima di risalire.
