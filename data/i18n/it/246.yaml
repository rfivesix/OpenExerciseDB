name: French press con bilanciere EZ (Skull crusher)
description: |-
  Posizione di partenza:
  Sdraiati su una panca piana impugnando un bilanciere EZ a presa stretta, con le braccia distese verso l'alto perpendicolari o leggermente inclinate all'indietro rispetto al tronco.

  Esecuzione:
  1. Fletti i gomiti abbassando lentamente il bilanciere con controllo verso la fronte o appena sopra la testa.
  2. Appena prima di toccare la fronte, spingi il bilanciere verso l'alto estendendo completamente i gomiti.
  3. Mantieni le braccia e i gomiti fermi e stabili durante tutto il movimento, focalizzando la spinta sui tricipiti.
