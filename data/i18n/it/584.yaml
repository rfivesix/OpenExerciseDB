  license_author: tuckerm
  source_id: '205'
description: |-
  Posizione di partenza:
  Siediti alla panca Scott appoggiando la parte posteriore del braccio sul cuscinetto e impugna un manubrio con presa supina.

  Esecuzione:
  1. Fletti il gomito sollevando il manubrio verso la spalla.
  2. Abbassa il peso lentamente e con pieno controllo fino alla distensione quasi completa del braccio.
