name: Push-down ai cavi con corda
description: '- Posizionati davanti alla carrucola alta con attacco a corda, piedi
  alla larghezza delle spalle e busto leggermente flesso in avanti.

  - Mantenendo i gomiti bloccati lungo i fianchi, spingi la corda verso il basso estendendo
  le braccia.

  - Separa le estremità della corda verso l''esterno nel punto più basso per massimizzare
  la contrazione dei tricipiti.

  - Risali lentamente e con pieno controllo alla posizione di partenza senza muovere
  i gomiti.'
