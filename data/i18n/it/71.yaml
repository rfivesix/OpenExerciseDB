description: |-
  Posizione di partenza:
  Siediti sulla macchina leg extension e posiziona il cuscinetto sopra la caviglia della gamba attiva. L'altra gamba rimane rilassata a terra.

  Esecuzione:
  1. Estendi la gamba fino a raggiungere la completa distensione del ginocchio, contraendo fortemente il quadricipite femorale.
  2. Mantieni la posizione in alto per un secondo.
  3. Abbassa lentamente il peso in modo controllato senza farlo appoggiare prima di ripetere.
