description: |-
  Nuota a stile libero a un ritmo rilassato e costante senza interruzioni, pensando a un'intensità moderata. Concentrati su bracciate fluide e regolari anziché sulla velocità; l'obiettivo è attivare la circolazione e riscaldare gradualmente la muscolatura.
