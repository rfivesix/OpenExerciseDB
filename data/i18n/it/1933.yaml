description: |-
  Posizione di partenza:
  Sdraiati supino con le ginocchia flesse, i piedi piatti a terra e le mani dietro la nuca.

  Esecuzione:
  1. Fletti la colonna sollevando le scapole dal pavimento senza tirare il collo.
  2. Contrai intensamente gli addominali espirando in cima.
  3. Abbassa lentamente le spalle senza appoggiarle completamente.
