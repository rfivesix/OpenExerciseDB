name: Curl per bicipiti al cavo
description: |-
  Posizione di partenza:
  Posizionati in piedi a circa 30-40 cm dalla carrucola del cavo basso, con i piedi ben saldi a terra.

  Esecuzione:
  1. Afferra la sbarra con presa supina e fletti le braccia sollevando il peso verso il petto con un movimento fluido.
  2. Abbassa la sbarra in modo lento e controllato, mantenendo i gomiti stabili lungo i fianchi.
