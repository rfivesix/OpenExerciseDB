description: |-
  Esecuzione della fase di trazione concentrica: guida i gomiti verso il basso e leggermente all'indietro, trazionando il petto verso la sbarra. Concentrati sul portare il torace verso l'alto senza protendere il mento. Mantieni le spalle depresse e lontane dalle orecchie, evitando di incassarle. Posizione apicale: il mento deve superare la sbarra (o almeno arrivare alla sua altezza). Trattieni brevemente la contrazione per spremere al massimo il gran dorsale prima di ridiscendere con controllo.
