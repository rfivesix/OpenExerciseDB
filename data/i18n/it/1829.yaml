description: |-
  Posizione di partenza:
  Inserisci un'estremità del bilanciere nel giunto landmine o in un angolo stabile. Posizionati di fronte alla sbarra con i piedi a una larghezza leggermente superiore a quella delle spalle e le punte ruotate di 10-35 gradi all'esterno per consentire una buona mobilità del bacino. Afferra l'estremità libera del bilanciere con entrambe le mani a dita incrociate e tienila davanti al petto, subito sotto le clavicole.

  Esecuzione:
  1. Contrai il core, mantieni il busto dritto e scendi in un'accosciata profonda spingendo il bacino indietro con il peso sui talloni.
  2. Scendi finché le cosce sono parallele al pavimento, idealmente fino a sfiorare con i gomiti la parte interna delle ginocchia.
  3. Mantieni la schiena piatta e la colonna vertebrale in assetto neutrale lungo tutta la traiettoria.
  4. Spingi con forza sui talloni risalendo in modo esplosivo e sfruttando la spinta delle gambe per proiettare il bilanciere verso l'alto.
  5. Distendi fluidamente le braccia sopra la testa fino al blocco completo dei gomiti, con i bicipiti vicini alle orecchie.
  6. Nel punto massimo della spinta, inclinati leggermente in avanti verso il bilanciere per favorire la corretta rotazione delle scapole ed evitare l'inarcamento lombare.
  7. Abbassa la sbarra con controllo al petto prima di avviare immediatamente la ripetizione seguente.
