name: Slanci posteriori a quattro zampe (Glute Kickback)
description: 'Posizione di partenza: Posizionati a quattro zampe su un tappetino,
  con le mani sotto le spalle e le ginocchia sotto le anche.

  Esecuzione: Spingi un piede all''indietro e verso l''alto contraendo con forza i
  muscoli glutei.

  Ritorno: Mantieni la contrazione per un secondo e torna lentamente alla posizione
  iniziale.'
