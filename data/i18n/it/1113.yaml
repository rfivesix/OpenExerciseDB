description: |-
  I piegamenti sulle parallettes sono una variante efficace dei tradizionali piegamenti che consente una maggiore escursione articolare proteggendo al contempo le articolazioni dei polsi grazie a una presa neutra confortevole.

  Posizione di partenza:
  Afferra le parallele posizionate alla larghezza delle spalle con le braccia distese e i piedi uniti a terra, allineando perfettamente il tronco in posizione di plank e attivando con forza addominali e glutei.

  Esecuzione:
  1. Abbassa il corpo in modo lento e controllato piegando i gomiti e mantenendoli vicini ai fianchi a circa 45 gradi. Grazie al rialzo delle maniglie puoi scendere più in profondità rispetto ai piegamenti tradizionali a terra, ottenendo un profondo e benefico allungamento del gran pettorale e dei deltoidi anteriori.
  2. Spingi con decisione e potenza attraverso le mani per ritornare alla distensione completa delle braccia, mantenendo la massima stabilità articolare delle spalle.
  L'instabilità dell'attrezzo richiede un notevole controllo motorio e un continuo reclutamento attivo dei muscoli stabilizzatori del core e della cuffia dei rotatori.
