name: Slam a terra con palla medica
upstream:
  license: CC-BY-SA-4.0
  license_author: flanny
  source_id: '2481'
description: |-
  Posizionati in piedi con i piedi alla larghezza delle spalle, ginocchia e anche leggermente piegate, tenendo la palla medica con entrambe le mani al petto. Attiva i muscoli del core e mantieni una postura impeccabile. Estendi con forza le ginocchia e spingi le anche in avanti sollevando contemporaneamente la palla verso l'alto; estenditi al massimo portando la palla sopra la testa a braccia tese e sollevandoti sugli avampiedi. Sfrutta l'energia dei muscoli addominali, del dorso e delle braccia per scagliare con la massima potenza la palla medica dritto verso terra tra i piedi. Spingi le anche all'indietro e piega le ginocchia per assecondare il movimento con tutto il corpo ed espira durante lo slam. Scendi in accosciata per raccogliere la palla da terra e passa immediatamente alla ripetizione successiva.
