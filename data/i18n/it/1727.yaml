description: |-
  Mantieni il busto ben saldo e tira la maniglia del cavo verso il basso lungo il fianco a braccio disteso, focalizzandoti sulle fibre laterali del gran dorsale. Non ruotare il tronco né inclinarti lateralmente per facilitare la ripetizione.
