description: |-
  Posizione di partenza:
  Siediti sulla macchina leg press posizionandoti leggermente ruotato su un fianco, appoggiando la parte laterale della schiena allo schienale. Posiziona il piede della gamba attiva sulla parte superiore della pedana, con la punta ruotata leggermente verso l'esterno per indirizzare la linea di forza direttamente sul grande gluteo e sul medio gluteo.

  Esecuzione:
  1. Sblocca con cautela il carrello della macchina mantenendo una presa salda sui maniglioni di sicurezza per stabilizzare il bacino.
  2. Abbassa lentamente la pedana flettendo l'anca e il ginocchio in modo controllato, portando il ginocchio verso la spalla esterna senza sollevare il bacino dal sedile.
  3. Raggiungi una flessione profonda fino a circa 90 gradi al ginocchio, sentendo un marcato allungamento nei muscoli glutei.
  4. Spingi con decisione attraverso l'intero piede focalizzando la spinta sul tallone per riportare il carico verso l'alto.
  5. Fermati poco prima del blocco articolare completo del ginocchio per conservare la tensione muscolare continua sul gluteo prima di ricominciare la discesa controllata.
  6. Completa tutte le ripetizioni previste su un lato prima di ruotare e ripetere sulla gamba opposta.
