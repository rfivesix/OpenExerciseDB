description: |-
  Posizione di partenza:
  Sali sulla macchina simulatore di scale mantenendo una postura eretta e afferrando leggermente i corrimano per l'equilibrio.

  Esecuzione:
  1. Sali i gradini in continuo movimento rullando il piede su ogni scalino e attivando quadricipiti e glutei.
  2. Regola la velocità in base al tuo livello di allenamento, migliorando l'efficienza cardiovascolare e la resistenza muscolare delle gambe.
