description: |-
  Posizione di partenza:
  Sdraiati supino su una panca piana tenendo un manubrio in ciascuna mano. Distendi le braccia verso l'alto con i manubri a contatto tra loro e i palmi rivolti l'uno verso l'altro.

  Esecuzione:
  1. Abbassa i manubri verso il petto mantenendoli uniti e tenendo i gomiti stretti vicino al corpo.
  2. Spingi con forza i manubri verso l'alto estendendo i tricipiti.
