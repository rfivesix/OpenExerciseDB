description: |-
  Posizione di partenza:
  Posizionati in piedi davanti alla macchina a cavo con la carrucola impostata verso il basso. Fissa la cavigliera alla caviglia della gamba attiva. Mantieni il busto eretto con la schiena dritta e afferra la struttura della macchina per garantire un equilibrio ottimale.

  Esecuzione:
  1. Con la gamba collegata al cavo, esegui una distensione lenta e controllata all'indietro senza piegare eccessivamente il ginocchio.
  2. Contrai energicamente la parte superiore del grande gluteo nel punto di massima estensione dell'anca.
  3. Riporta la gamba lentamente alla posizione iniziale contrastando la trazione del cavo senza toccare i pesi.
