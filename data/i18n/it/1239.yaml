description: |-
  Posizione di partenza:
  In piedi di fronte a una parete, posiziona una gamba dietro di te mantenendola tesa con il tallone a terra.

  Esecuzione:
  1. Piegati in avanti verso il muro fino a sentire un allungamento nel gastrocnemio del polpaccio posteriore.
