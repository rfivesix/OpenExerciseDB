description: |-
  Posizione di partenza:
  Sdraiati a pancia in giù sul pavimento con le gambe distese e posiziona le mani a terra direttamente sotto le spalle con le dita rivolte in avanti.

  Esecuzione:
  1. Premi i palmi sul pavimento ed estendi gradualmente le braccia sollevando il petto e le spalle, mantenendo il bacino e le cosce a contatto con il suolo.
  2. Tieni i gomiti leggermente piegati e le spalle rilassate e lontane dalle orecchie.
  3. Mantieni la distensione per alcuni respiri profondi avvertendo l'apertura dell'addome e la decompressione lombare, poi riscendi lentamente a terra.
