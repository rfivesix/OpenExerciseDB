name: Rematore presa neutra con bilanciere
description: |-
  Impugnando un bilanciere con presa in pronazione (palmi rivolti verso il basso), piegare leggermente le ginocchia e portare il busto in avanti, piegando in vita, mantenendo la schiena dritta fino a portarla quasi parallela al pavimento. Suggerimento: assicurati di tenere la testa alta. Il bilanciere dovrebbe pendere direttamente davanti a te mentre le tue braccia pendono perpendicolarmente al pavimento e al busto. Questa è la tua posizione di partenza.&nbsp;&nbsp;&nbsp;&nbsp; Ora, mantenendo fermo il busto, espira e solleva il bilanciere verso di te. Tieni i gomiti vicini al corpo e usa solo gli avambracci per sostenere il peso. Nella posizione contratta in alto, contrai i muscoli della schiena e mantieni la posizione per una breve pausa.&nbsp;&nbsp;&nbsp;&nbsp; Quindi inspira e abbassa lentamente il bilanciere nella posizione iniziale.&nbsp;&nbsp;&nbsp;&nbsp; Ripeti per la quantità consigliata di ripetizioni.
