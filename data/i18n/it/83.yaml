name: Rematore con bilanciere a busto flesso
search_terms:
- Rematore presa neutra con bilanciere
- Rematore bilanciere
description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza delle spalle, impugna un bilanciere con presa prona (palmi verso il basso). Fletti leggermente le ginocchia e inclina il busto in avanti flettendo le anche, mantenendo la schiena dritta a circa 45 gradi o quasi parallela al pavimento. Il bilanciere pende verticalmente davanti a te con le braccia distese.

  Esecuzione:
  1. Mantenendo il busto immobile, tira il bilanciere verso la parte bassa dell'addome/ombelico portando i gomiti verso l'alto e vicino ai fianchi.
  2. Contrai intensamente i muscoli della schiena e adduci le scapole in cima, facendo una breve pausa.
  3. Abbassa lentamente il bilanciere fino alla posizione di partenza con pieno controllo.

  Note:
  Mantieni la colonna vertebrale in posizione neutra durante tutto l'esercizio. Non strappare con le gambe o la schiena.
