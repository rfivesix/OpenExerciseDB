description: |-
  Siediti o posizionati di fronte a un cavo alto e afferra la maniglia con presa stretta. Tira il carico verso la parte superiore del petto conducendo i gomiti verso il basso e indietro. Riporta lentamente il carico in alto in modo controllato.
