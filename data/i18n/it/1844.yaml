description: |-
  Posizionati a quattro zampe e allarga le ginocchia il più possibile appoggiandoti sugli avambracci. Senza muovere i gomiti, oscilla lentamente il bacino all'indietro verso i talloni per allungare intensamente gli adduttori dell'anca.
