description: |-
  Posizione di partenza:
  Regola la carrucola del cavo poco sotto l'altezza del petto. Mantieni il corpo orientato in avanti e il bacino stabile.

  Esecuzione:
  1. Afferra l'impugnatura con entrambe le braccia distese e ruota il busto tirando il cavo diagonalmente verso il lato opposto.
  2. Mantieni la posizione per un secondo nel punto finale.
  3. Ritorna lentamente e in modo controllato alla posizione di partenza.
