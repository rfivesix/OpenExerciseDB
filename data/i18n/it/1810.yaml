description: |-
  Posizione di partenza:
  Sdraiati prono a terra con le gambe distese e il dorso dei piedi a contatto con il pavimento. Posiziona gli avambracci sul suolo con i gomiti allineati direttamente sotto le spalle e i palmi rivolti verso il basso.

  Esecuzione:
  1. Premi gli avambracci a terra e solleva delicatamente il petto e la testa inarcando la colonna toracica.
  2. Mantieni le spalle rilassate e lo sguardo in avanti respirando profondamente.
