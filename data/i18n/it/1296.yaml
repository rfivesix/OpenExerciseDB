name: Croci ai cavi dal basso (Low Cable Crossover)
description: |-
  Le croci ai cavi dal basso sono un esercizio di isolamento eccellente per stimolare i fasci superiori del gran pettorale. Da una carrucola bassa, porta le maniglie verso l'alto e in avanti a braccia semidistese, contraendo intensamente la parte alta del petto in chiusura.
