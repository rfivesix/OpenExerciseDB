description: |-
  Posizione di partenza:
  Posizionati tra due parallele, su parallettes o con le mani a terra a braccia completamente distese.

  Esecuzione:
  1. Spingi con forza sulle mani deprimendo le spalle e solleva il corpo dal pavimento.
  2. Richiama le ginocchia verso il petto mantenendole flesse a 90 gradi o raccolte al torace, con le cosce parallele al pavimento.
  3. Mantieni la posizione isometrica respirando regolarmente e senza piegare i gomiti.
  4. Per facilitare l'esercizio puoi appoggiare le punte dei piedi a terra.
