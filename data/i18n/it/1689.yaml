description: |-
  Posizione di partenza:
  Posizionati tra i cavi regolati all'altezza del petto, con le braccia aperte lateralmente a forma di T e una piacevole tensione nei pettorali.

  Esecuzione:
  1. Con i gomiti leggermente flessi, porta le mani a convergere davanti al centro del petto come in un ampio abbraccio.
  2. Contrai intensamente il gran pettorale nel punto di incontro.
  3. Riapri lentamente le braccia tornando alla posizione iniziale controllando la tensione.
