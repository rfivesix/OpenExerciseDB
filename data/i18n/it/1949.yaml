description: |-
  La routine Limber 11 è una celebre sequenza di mobilità e riscaldamento articolare per la parte inferiore del corpo composta da 11 esercizi mirati:
  1. Rullata con foam roller sulla bandelletta ileotibiale.
  2. Rullata sugli adduttori.
  3. Massaggio miofasciale sui glutei con pallina da lacrosse.
  4. Croce di ferro a ginocchia flesse.
  5. Rotolata a terra con salita a V-sit.
  6. Circonduzioni dell'anca a idrante (fire hydrant circles).
  7. Esercizio del cavaliere con mobilità delle anche.
  8. Mobilizzazione a rana (frog stretch).
  9. Allungamento del piriforme da seduto.
  10. Squat profondo con torsione toracica.
  11. Trazione dei flessori dell'anca in affondo.
