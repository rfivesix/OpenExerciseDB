description: |-
  Posizione di partenza:
  Assumi una solida posizione di plank a terra con il corpo ben allineato. Avvicina le mani fino a far quasi toccare i pollici e gli indici.

  Esecuzione:
  1. Fletti i gomiti mantenendoli molto stretti lungo i fianchi, abbassando il petto verso le mani.
  2. Mantieni il core saldo e la schiena dritta durante la discesa.
  3. Spingi con forza sui palmi tornando in estensione completa.
