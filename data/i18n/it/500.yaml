description: 'Posizione di partenza:

  Siediti a terra ed estendi le braccia dietro di te con le mani rivolte in avanti.


  Esecuzione:

  1. Solleva il bacino dal pavimento spingendo sui palmi e sui talloni, fino a formare
  una linea retta dalle caviglie alle spalle.

  2. Contrai i glutei e l''addome mantenendo la posizione statica.'
