description: |-
  Posizione di partenza:
  Siediti su una panca inclinata a circa 60 gradi. Tieni i manubri lungo i fianchi con le braccia distese e i palmi ruotati verso l'esterno.

  Esecuzione:
  1. Fletti i gomiti sollevando i manubri diagonalmente verso l'esterno a formare una W con le braccia.
  2. Contrai i bicipiti e abbassa i manubri lentamente tornando a braccia distese.
