description: |-
  Siediti alla macchina per butterfly con la schiena aderente allo schienale e i piedi a terra. Spingi le braccia l'una verso l'altra contraendo i pettorali fino a far quasi toccare le impugnature. Ritorna lentamente indietro mantenendo sempre i pesi sollevati per preservare la tensione muscolare.
