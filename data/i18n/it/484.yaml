description: |-
  Posizione di partenza:
  Regola i supporti del rack in modo che il bilanciere sia posizionato appena sotto le rotule. Posizionati con i piedi alla larghezza dei fianchi e afferra la sbarra con presa prona.

  Esecuzione:
  1. Estendi le anche e le ginocchia spingendo sui talloni e contraendo fortemente glutei ed erettori spinali per sollevare il carico.
  2. Riabbassa il bilanciere sui supporti con una discesa controllata di circa due secondi.
