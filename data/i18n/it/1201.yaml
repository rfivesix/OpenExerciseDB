description: |-
  Posizione di partenza:
  In piedi con i piedi alla larghezza dei fianchi.

  Esecuzione:
  1. Incrocia il piede destro dietro di te verso l'angolo opposto flettendo entrambe le ginocchia in un affondo profondo.
  2. Mantieni spalle e bacino rivolti in avanti, quindi risali spingendo sul piede anteriore e alterna i lati.
