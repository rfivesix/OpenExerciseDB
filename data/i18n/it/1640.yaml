description: |-
  Posizione di partenza:
  In piedi sostenendo due manubri all'altezza delle spalle con i gomiti alti.

  Esecuzione:
  1. Scendi in accosciata profonda con il busto eretto.
  2. Spingi sui talloni per risalire, allenando intensamente quadricipiti, glutei e muscoli del core.
