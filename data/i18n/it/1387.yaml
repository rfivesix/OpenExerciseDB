description: |-
  Posizione di partenza:
  A quattro zampe o in piedi con appoggio, mantieni il busto stabile.

  Esecuzione:
  1. Fletti la gamba ed estendi l'anca spingendo il tallone verso l'alto e indietro.
  2. Contrai intensamente i femorali e i glutei al culmine del movimento prima di riabbassare la gamba.
