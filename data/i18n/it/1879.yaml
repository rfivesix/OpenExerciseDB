  license_author: Deflation
  source_id: '3023'
description: |-
  Posizione di partenza:
  Regola una panca inclinata a circa 30-45 gradi. Sdraiati prono con il torace ben appoggiato contro lo schienale e il collo allineato in posizione neutra, evitando tensioni cervicali. Impugna due manubri leggeri con presa neutra o con i pollici rivolti verso il soffitto.

  Esecuzione:
  1. Con le braccia quasi tese o i gomiti leggermente piegati, solleva lentamente i manubri verso l'alto e l'esterno disegnando una Y con il corpo.
  2. Concentrati sul movimento attivo delle spalle e sull'adduzione delle scapole, evitando slanci del busto.
  3. Nella posizione superiore, contrai intensamente il trapezio inferiore, i romboidi e i deltoidi posteriori per un secondo intero.
  4. Abbassa i manubri con movimento lento e controllato tornando alla posizione iniziale prima di iniziare la ripetizione successiva.
