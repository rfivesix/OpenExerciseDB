  license_author: carlos3c
  source_id: '2199'
description: |-
  Posizione di partenza:
  Appoggia la parte superiore della schiena su una panca, posiziona un manubrio sul bacino e solleva una gamba piegata da terra.

  Esecuzione:
  1. Spingi attraverso il tallone della gamba a terra estendendo completamente l'anca fino a contrarre isolatamente il grande gluteo.
  2. Abbassa il bacino in modo controllato prima di ripetere sull'altro lato.
