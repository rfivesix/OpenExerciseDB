  license_author: tuckerm
  source_id: '215'
description: |-
  Posizionati in piedi di fronte al cavo alto con piedi a larghezza spalle e ginocchia leggermente piegate. Afferra le estremità della corda dall'alto con le braccia distese davanti a te. Mantenendo la schiena dritta e il core contratto, abbassa la corda verso le cosce e i fianchi con le braccia quasi completamente distese, aprendo leggermente le estremità della corda in basso prima di ritornare lentamente alla posizione di partenza.
