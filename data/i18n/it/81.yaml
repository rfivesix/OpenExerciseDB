name: Rematore a un braccio con manubrio
description: |-
  Posiziona il ginocchio di una gamba su un'estremità di una panca piana e tieni l'altra gamba a terra leggermente piegata. Fletti il busto in avanti e appoggia la mano sulla panca per sostenerti, mantenendo una leggera lordosi fisiologica nella schiena. Con la mano libera afferra il manubrio e sollevalo verso il fianco tenendolo vicino al corpo, guidando il movimento con il gomito. Abbassa lentamente il peso in modo controllato e ripeti la tirata; al termine della serie, cambia lato.
