name: Curl inverso con bilanciere
search_terms:
  - Curl inversi con bilanciere
description: |-
  In piedi con il busto eretto, impugna un bilanciere con una presa prona alla larghezza delle spalle (palmi rivolti verso il basso). Mantenendo i gomiti fermi vicino ai fianchi, fletti le braccia portando la sbarra verso il petto per stimolare il brachioradiale e il brachiale. Abbassa lentamente il bilanciere tornando alla posizione di partenza.
