  license_author: tinman
  source_id: '2032'
description: |-
  Posizione di partenza:
  In piedi davanti a un supporto o panca, fletti il busto in avanti mantenendo la schiena piatta e le braccia che pendono verticalmente verso il pavimento.

  Esecuzione:
  1. Tira i gomiti verso l'alto all'altezza delle spalle, mantenendo gli avambracci perpendicolari ai bicipiti e rivolti verso il basso.
  2. Mantieni la posizione per un istante.
  3. Ruota gli avambracci sui gomiti portando le mani verso l'alto il più possibile in rotazione esterna.
  4. Trattieni la contrazione della cuffia dei rotatori e dei deltoidi posteriori.
  5. Ruota nuovamente le braccia verso il basso e distendile tornando alla posizione di partenza.
