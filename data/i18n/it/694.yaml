description: |-
  Impugna un manubrio per mano davanti alle cosce con i palmi rivolti verso il corpo. Solleva i manubri verticalmente verso l'alto guidando con i gomiti fin sotto il mento, poi abbassali lentamente tornando alla posizione di partenza e ripeti.
