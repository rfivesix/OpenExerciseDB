description: |-
  Posizione di partenza:
  Sdraiati supino sul tappetino e solleva le gambe verticalmente a 90 gradi verso il soffitto con le ginocchia unite.

  Esecuzione:
  1. Inizia a disegnare piccoli cerchi controllati nell'aria con entrambe le gambe unite.
  2. Mantieni la zona lombare ben adesa al pavimento e il core contratto durante tutte le rotazioni.
