name: Wyciskanie leżąc
description: |-
  Połóż się na ławce, sztanga powinna znajdować się bezpośrednio nad twoimi oczami, kolana są ugięte, nogi w lekkim rozkroku a stopy mocno oparte na podłodze. Skoncentruj się, oddychaj prawidłowo i chwyć drążek szerzej niż na szerokość barków. Opuść go powoli, aż na chwilę dotknie klatki piersiowej na wysokości sutków. Popchnij sztangę&nbsp;do góry.
  Jeśli trenujesz z dużymi ciężarami, wskazane jest posiadanie asekuranta, który pomoże Ci podnieść sztangę, jeśli nie jesteś w stanie samodzielnie unieść ciężaru.
  Dzięki szerokości chwytu możesz także kontrolować, która część klatki piersiowej jest bardziej trenowana:

  szeroki chwyt: zewnętrzne mięśnie klatki piersiowej
  wąski chwyt: wewnętrzne mięśnie klatki piersiowej i triceps
