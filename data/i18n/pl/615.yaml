name: Przysiad
description: |-
  Umieść sztangę na stojaku tuż poniżej wysokości ramion. Zanurz się pod sztangą, aby umieścić ją za karkiem, na górnej części pleców, i chwyć sztangę dłońmi rozstawionymi szerzej niż na szerokość ramion. Unieś klatkę piersiową i ściśnij łopatki, aby utrzymać proste plecy przez cały ruch. Wstań, aby zdjąć sztangę ze stojaka i zrób krok do tyłu, a następnie rozstaw stopy nieco szerzej niż na szerokość ramion. Usiądź prosto w biodrach i utrzymuj proste plecy, a klatkę piersiową uniesioną, przysiadając tak, aby biodra znalazły się poniżej kolan. Od dołu przysiadu dociśnij stopy do podłoża i wypchnij biodra do przodu, aby powrócić do pozycji stojącej.
