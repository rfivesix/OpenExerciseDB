name: Wiosłowanie sztangą Pendelay
description: |-
  Ćwiczenie pleców ze sztangą w pozycji wyjściowej w pochyleniu, z plecami równolegle do podłoża. Sztanga leży na podłodze na wysokości klatki piersiowej. Aby wykonać ćwiczenie, chwyć sztangę nachwytem na szerokość barków i pociągnij ją w kierunku klatki piersiowej, nie zmieniając pozycji pochylonej i nie poruszając niczym poza ramionami.
