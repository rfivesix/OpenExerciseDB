name: 右侧平板支撑
description: |-
  起始姿势：
  身体向右侧卧，双腿伸直，双脚叠放或前后微微分开。右肘置于右肩正下方，小臂平贴地面支撑。

  动作步骤：
  1. 收紧核心肌群、腹斜肌和臀部，发力将骨盆抬离地面，使身体从头到脚呈一条笔直的斜线。
  2. 保持颈椎自然延展，胸腔打开，避免髋部下沉或身体扭转。
  3. 在规定时间内保持该静态姿势，平稳呼吸。
