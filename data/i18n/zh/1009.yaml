name: 右颈部拉伸
description: |-
  起始姿势：坐位或站位，背部挺直。
  步骤：

  头向一侧倾斜。
  用离头较近的那只手从另一侧抓住头部。
  手顶着头，头顶着手推动，使力量平衡，头部保持静止。
  保持这种张力直到练习结束。
