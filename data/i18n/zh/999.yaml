name: 反向弓步
description: |-
  起始姿势：站直，双脚分开与臀部同宽。
  步骤：

  一条腿向后迈步，使膝盖能舒适地弯曲成90度角。
  慢慢弯曲双膝，双膝均成 90 度角。
  回到起始位置。
  换腿，重复。
