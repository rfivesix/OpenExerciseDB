name: 单腿提踵 (右腿)
description: |-
  起始姿势：
  右脚前脚掌站立在地面或台阶边缘上，左腿屈膝悬空。单手可轻扶墙面以保持平衡。

  动作步骤：
  1. 缓慢下沉右脚脚后跟，充分拉伸小腿三头肌。
  2. 前脚掌发力蹬地，将身体垂直向上推起，至脚尖最高点。
  3. 在最高顶峰收缩位置停留1–2秒。
  4. 有控制地下落脚后跟回到起始位置。
