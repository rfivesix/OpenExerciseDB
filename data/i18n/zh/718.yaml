name: 直角坐墙
description: '- 背部平贴墙壁站立，双脚分开与肩同宽，距离墙壁约50至60厘米。

  - 顺着墙壁缓慢下蹲，直到大腿与地面平行，膝盖呈90度角且位于脚踝正上方。

