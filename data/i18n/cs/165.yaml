name: Přítahy kolen na gymnastickém míči (Knee Tuck)
search_terms:
- Zkracovačky s Medicinbalem
description: |-
  Výchozí pozice:
  Zaujměte pozici vzporu ležmo (vysokého prkna) s dlaněmi na šířku ramen a holeněmi opřenými o vrchol gymnastického míče. Tělo tvoří pevnou přímou linii.

  Provedení:
  1. Kontrakcí břišních svalů a ohybačů kyčlí přitáhněte kolena směrem k hrudníku, čímž míč přikoulíte k rukám.
  2. V maximálním zkrácení břicha na sekundu setrvejte.
  3. Pomalu a kontrolovaně nohy natáhněte zpět do výchozí pozice vzporu.

  Upozornění:
  Vyvarujte se prohýbání v bedrech a udržujte ramena stabilní přímo nad zápěstími.
