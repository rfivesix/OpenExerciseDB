name: Zkracovačky se zvednutýma nohama
search_terms:
- Obrácené Zkracovačky
- Vertical Leg Crunch
description: |-
  Výchozí pozice:
  Lehněte si na záda na podložku a zvedněte nohy kolmo k zemi (směrem ke stropu) s mírně pokrčenými nebo nataženými koleny. Paže natáhněte nahoru směrem ke špičkám.

  Provedení:
  1. Kontrakcí přímého břišního svalu odlepte lopatky a horní část zad od země a natahujte se rukama k prstům u nohou.
  2. V horní poloze na moment podržte maximální kontrakci břicha.
  3. Pomalu a kontrolovaně se spusťte zpět dolů, aniž byste zcela uvolnili napětí v břiše.

  Upozornění:
  Udržujte nohy stabilně ve vertikální poloze a bedra pevně přitisknutá k podložce.
