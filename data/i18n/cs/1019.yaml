name: Boční prkno na pravém boku
description: |-
  Výchozí poloha:
  Lehněte si na pravý bok s nataženýma nohama. Pravý loket opřete o zem přímo pod ramenem, předloktí směřuje dopředu.

  Provedení:
  1. Zpevněte střed těla a zvedněte boky ze země tak, aby tělo tvořilo přímku od hlavy až k patám.
  2. Udržujte pánev stabilní a zabraňte jejímu klesání k zemi.
  3. Držte tuto pozici po stanovenou dobu za stálého dýchání.
