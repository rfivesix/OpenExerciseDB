name: Výpony na jedné noze (pravá)
description: |-
  Výchozí poloha:
  Postavte se na pravou nohu na rovnou zem nebo na okraj stupínku. Levou nohu pokrčte v koleni a držte nad zemí. Rukou se lehce přidržujte stěny pro rovnováhu.

  Provedení:
  1. Spusťte pravou patu dolů a protáhněte lýtkový sval.
  2. Silou bříška chodidla se vytlačte co nejvýše na špičku.
  3. V horní poloze na 1–2 sekundy zadržte maximální kontrakci.
  4. Pomalým a kontrolovaným pohybem se vraťte do výchozí polohy.
