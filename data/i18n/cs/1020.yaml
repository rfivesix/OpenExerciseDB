name: Pistol dřep na pravé noze
description: |-
  Výchozí poloha:
  Postavte se na pravou nohu, levá noha je natažená dopředu nad zemí. Ruce předpažte pro udržení rovnováhy.

  Provedení:
  1. Pomalu ohýbejte pravé koleno a kyčel a klesejte do hlubokého dřepu na jedné noze.
  2. Udržujte rovná záda, zvednutý hrudník a volnou nohu držte neustále nad podlahou.
  3. Klesněte do maximální kontrolované hloubky.
  4. Zatlačením do pravé paty se zvedněte zpět do vzpřímeného stoje.
