name: כפיפות בטן
description: |-
  עמדת מוצא:
  שכב על הגב על גבי מזרן כאשר הברכיים כפופות וכפות הרגליים מונחות שטוחות על הרצפה ברוחב האגן. הנח את הידיים בקלילות מאחורי הראש או שלב אותן על החזה.

  ביצוע:
  1. כווץ את שרירי הבטן וגלגל את פלג הגוף העליון קדימה, תוך הרמת השכמות והגב העליון מהרצפה.
  2. החזק את הכיווץ המרבי לשנייה אחת בשיא התנועה תוך כדי הוצאת אוויר.
  3. רד באיטיות ובאופן מבוקר בחזרה לעמדת המוצא מבלי לנתק את הגב התחתון מהקרקע.

  דגשים:
  הימנע ממשיכת הצוואר בעזרת הידיים ושמור על מבט באלכסון למעלה.
