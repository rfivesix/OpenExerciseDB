exercise_id: '91'
language: pt
status: ai_authored
name: Rosca direta com barra reta
description: |-
  Posição inicial:
  Fique em pé com os pés afastados na largura dos ombros, coluna ereta e abdômen contraído. Segure a barra com pegada supinada (palmas das mãos para a frente) na largura dos ombros, braços totalmente estendidos.

  Execução:
  1. Flexione os cotovelos levantando a barra em direção à parte superior do peito em um movimento contínuo.
  2. Mantenha os cotovelos fixos ao lado do corpo, sem projetá-los para a frente.
  3. Contraia os bíceps no topo da repetição e desça a barra de forma lenta e controlada até a extensão quase completa dos braços.

  Dicas:
  Não balance o corpo nem use impulso lombar para subir o peso; o esforço deve vir exclusivamente dos bíceps.
