name: Elevação de panturrilha unilateral (direita)
description: |-
  Posição inicial:
  Fique em pé sobre o pé direito, apoiando a ponta do pé no chão ou na borda de um degrau. Mantenha o pé esquerdo elevado e apoie a mão levemente em uma parede para o equilíbrio.

  Execução:
  1. Abaixe o calcanhar direito de forma controlada para alongar a panturrilha.
  2. Empurre com força sobre a ponta do pé, elevando o calcanhar o mais alto possível.
  3. Segure a contração máxima no topo por 1 a 2 segundos.
  4. Desça devagar e com controle sem tocar o calcanhar bruscamente no chão.
