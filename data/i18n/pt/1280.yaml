name: Puxada de Biceps
description: |-
  Na máquina de puxada de costas, segure a barra com as mãos relativamente próximas. Use uma pegada pronada (P.ex.: o dorso das suas mãos vão ficar voltados para a máquina). Então puxe a barra em uma linha reta, como se fosse em direção ao chão. Garanta que seus bíceps sejam a força motriz do movimento. Você provavelmente sentirá seus ombros e latíssimo trabalhando, mas garanta que seus bíceps sejam os músculos mais afetados.
