name: Tríceps na máquina
description: '- Sente-se na máquina de tríceps e ajuste a altura do assento para que
  os cotovelos fiquem alinhados com o eixo de rotação da máquina.

  - Segure as manoplas firmemente e apoie a parte superior dos braços no suporte acolchoado.

  - Empurre as manoplas para baixo estendendo os cotovelos de forma controlada até
  contrair os tríceps.

  - Retorne lentamente à posição inicial, mantendo os braços sempre apoiados no suporte.'
