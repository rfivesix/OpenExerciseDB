name: Alongamento frontal do pescoço
description: |-
  Posição inicial:
  Sente-se ou fique em pé com a postura ereta e os ombros relaxados.

  Execução:
  1. Abra bem a boca.
  2. Incline lentamente a cabeça para trás com a boca aberta até sentir um alongamento suave na frente do pescoço.
  3. Feche e abra a boca muito devagar várias vezes para intensificar o alongamento da musculatura anterior do pescoço.
  4. Retorne devagar à posição inicial e feche a boca.
