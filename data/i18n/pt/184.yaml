language: pt
status: ai_reviewed
name: Levantamento terra
description: |-
  Posição inicial:
  Fique em pé com os pés na largura do quadril, com a barra sobre o meio dos pés (a cerca de 2 a 3 cm das canelas). Dobre os quadris para trás e flexione os joelhos mantendo as costas retas e o peito erguido. Segure a barra logo por fora das pernas com pegada pronada ou mista.

  Execução:
  1. Respire fundo, trave o abdômen e empurre o chão com os calcanhares, estendendo joelhos e quadris simultaneamente.
  2. Mantenha a barra deslizando rente às canelas e coxas durante toda a subida.
  3. Finalize o movimento ficando totalmente ereto e contraindo os glúteos, com a coluna em posição neutra (sem hiperextender a lombar para trás).
  4. Retorne a barra ao chão de forma controlada invertendo o movimento.

  Dicas:
  Mantenha as costas retas durante toda a execução para proteger a coluna.
