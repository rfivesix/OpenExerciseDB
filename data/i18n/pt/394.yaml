name: Remada baixa
description: |-
  Sente-se, coloque os pés nos pontos de apoio e agarre a barra com uma pegada larga. Puxe o peso com um movimento rápido em direção ao umbigo, não para cima. Mantenha os braços e cotovelos durante o movimento próximos ao corpo. Seus ombros são puxados juntos. Deixe o peso cair lentamente até que seus braços estejam completamente esticados.
