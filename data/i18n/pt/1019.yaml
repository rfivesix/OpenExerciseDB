name: Prancha lateral direita
description: |-
  Posição inicial:
  Deite-se sobre o lado direito com as pernas estendidas e os pés alinhados. Apoie o cotovelo direito diretamente sob o ombro direito, com o antebraço apoiado no chão.

  Execução:
  1. Contraia o abdômen, oblíquos e glúteos e eleve o quadril do solo até que o corpo forme uma linha reta da cabeça aos calcanhares.
  2. Mantenha a postura estável sem deixar a pelve cair em direção ao chão.
  3. Sustente a posição durante o tempo determinado mantendo a respiração controlada.
