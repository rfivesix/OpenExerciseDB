name: Pistol squat perna direita
description: |-
  Posição inicial:
  Fique em pé equilibrando-se sobre a perna direita, com a perna esquerda estendida à frente fora do chão. Estenda os braços para a frente para manter o equilíbrio.

  Execução:
  1. Dobre lentamente o joelho e quadril direitos, descendo em um agachamento unilateral profundo.
  2. Mantenha as costas retas, o peito aberto e a perna esquerda estendida sem encostar no chão.
  3. Desça até a máxima amplitude confortável.
  4. Empurre pelo calcanhar direito para subir de volta à posição inicial.
