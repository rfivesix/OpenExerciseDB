name: High Knees (Kniehebellauf)
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand, der Blick ist
  nach vorne gerichtet.

  Ausführung: Laufe auf der Stelle und ziehe abwechselnd die Knie zügig nach oben,
  bis die Oberschenkel mindestens waagerecht zum Boden stehen. Schwinge die Arme im
  Laufrhythmus aktiv mit.

  Hinweis: Lande federnd auf den Fußballen und halte den Rumpf aufrecht und stabil.'
