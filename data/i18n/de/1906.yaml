name: Beckenheben mit abwechselnder Beinstreckung
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Matte, winkle die Knie an und stelle die Füße hüftbreit auf die Fersen. Lege die Arme entspannt neben den Körper.


  Ausführung:

  Drücke die Hüfte über die Fersen kraftvoll nach oben in die Schulterbrücke, bis Oberschenkel und Rumpf eine gerade Linie bilden. Strecke nun abwechselnd ein Bein kontrolliert nach vorne in Verlängerung des Oberschenkels aus, während das Gesäß das Becken oben hält. Setze den Fuß wieder ab und strecke direkt das andere Bein.


  Hinweise:

  Halte das Becken während des gesamten Beinwechsels waagerecht und stabil; spanne das Gesäß und die Bauchmuskeln fest an, um ein Absinken der Hüfte zu verhindern.'
