name: Sitzende Schulter-Außenrotation mit Kurzhantel
description: "Ausgangsposition:\nSetze dich auf eine Trainingsmatte oder Hantelbank.\
  \ Winkle ein Knie an und stelle den Fuß auf, sodass das Knie nach oben ragt. Platziere\
  \ den gleichseitigen Ellenbogen auf der Oberseite des Knies, gebeugt im 90-Grad-Winkel.\
  \ Halte eine leichte Kurzhantel in der Hand, Unterarm waagerecht nach vorne gerichtet.\n\
  \nAusführung:\n1. Halte das Schulterblatt aktiv nach hinten-unten gezogen und fixiert.\n\
  2. Rotiere den Unterarm über das Ellenbogengelenk kontrolliert nach oben, bis er\
  \ senkrecht zum Boden steht.\n3. Halte die Kontraktion der Außenrotatoren (Infraspinatus,\
  \ Teres minor) für 1 Sekunde am höchsten Punkt.\n4. Senke die Kurzhantel langsam\
  \ und kontrolliert wieder in die Waagerechte ab, wobei du die Dehnung am Umkehrpunkt\
  \ mitnimmst.\n\nHinweise:\nVerwende ein leichtes Gewicht; die Übung dient der selektiven\
  \ Stärkung und Mobilisation der Außenrotatoren der Schulter."
