name: Cable Pull-Through
description: "Ausgangsposition:\nBefestige ein Tauseil an der untersten Position eines\
  \ Kabelzugs. Stelle dich mit dem Rücken zur Maschine über das Kabel, sodass das\
  \ Seil zwischen deinen Beinen hindurchläuft. Greife die Seilenden mit beiden Händen\
  \ im neutralen Griff, mache ein bis zwei Schritte nach vorne, um Grundspannung aufzubauen,\
  \ und nimm einen etwas mehr als hüftbreiten Stand ein. Die Knie sind minimal gebeugt.\n\
  \nAusführung:\n1. Leite die Bewegung durch ein Zurückschieben der Hüfte ein (Hip\
  \ Hinge), während dein Rücken vollkommen gerade bleibt und die Arme entspannt das\
  \ Seil nach hinten führen.\n2. Beuge dich vor, bis du eine deutliche Dehnung in\
  \ den Beinbeugern (Hamstrings) spürst; die Knie bleiben dabei nur leicht angewinkelt\
  \ (keine Kniebeuge).\n3. Strecke die Hüfte kraftvoll nach vorne durch und spanne\
  \ am obersten Punkt dein Gesäß maximal an.\n\nHinweise:\nDie Arme fungieren nur\
  \ als Halteelemente; die gesamte Zugkraft stammt aus der Hüftstreckung von Gesäß\
  \ und Beinbeugern."
