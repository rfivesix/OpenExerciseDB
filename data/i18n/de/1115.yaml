name: 3D-Ausfallschritte zum Aufwärmen
description: |-
  Ausgangsposition:
  Stehe aufrecht mit hüftbreitem Stand. Halte für das Aufwärmen entweder zwei sehr leichte Kurzhanteln in den Händen oder nutze rein das eigene Körpergewicht. Die Hände ruhen an den Hüften oder vor der Brust.

  Ausführung:
  1. Vorwärts-Ausfallschritt: Mache einen Ausfallschritt gerade nach vorne, senke das Becken ab und drücke dich wieder in den Stand zurück.
  2. Seitlicher Ausfallschritt: Mache mit demselben Bein einen Schritt weit zur Seite, beuge das Knie der Schrittseite bei gestrecktem Gegenbein und drücke dich zurück.
  3. Diagonaler/Rotatorischer Ausfallschritt: Mache einen Schritt diagonal nach hinten außen (ca. 45 Grad), senke das Becken ab und kehre zurück.
  4. Wiederhole die Dreidimensionale-Sequenz (Sagittal-, Frontal- und Transversalebene) mit beiden Beinen, um Hüfte, Knie und Gesäßmuskulatur umfassend zu mobilisieren.
