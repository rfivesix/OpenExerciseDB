name: Faszienmassage Gesäß mit Lacrosseball
description: 'Ausgangsposition:

  Setze dich auf den Boden und platziere einen festen Massage- oder Lacrosseball unter einer Gesäßhälfte. Stütze dich mit den Händen hinter dem Rücken ab und stelle die Füße auf. Optional kannst du das Sprunggelenk der behandelten Seite auf das gegenüberliegende Knie legen (Vierer-Position), um die Gesäßmuskeln vorzudehnen.


  Ausführung:

  Rolle mit kleinen, langsamen Bewegungen über die Gesäßmuskulatur (Gluteus maximus, Gluteus medius und Piriformis), um Verspannungen und Triggerpunkte aufzuspüren. Verweile auf verhärteten Stellen für 20–30 Sekunden bei tiefer, gleichmäßiger Atmung, bis der Spannungsschmerz spürbar nachlässt. Bearbeite jede Seite für etwa 30 Sekunden bis 2 Minuten.


  Hinweise:

  Teil der Limber-11-Routine von Joe DeFranco. Atme ruhig und entspanne die Muskulatur bewusst in den Druck des Balls hinein; rolle nicht direkt über knöcherne Strukturen wie das Steißbein.'
