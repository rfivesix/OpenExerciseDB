name: Ring-Dips
description: |-
  Ausgangsposition: Gehe an die Turnringe in den Stütz mit vollständig gestreckten Armen. Halte den Körper stabil, die Bauchmuskeln angespannt und drehe die Ringe leicht nach außen (Support Hold).
  Ausführung: Senke den Körper kontrolliert ab, indem du die Ellenbogen beugst, bis die Schultern leicht unter die Ellenbogen sinken (etwa 90 Grad). Halte die Ringe eng am Körper.
  Rückkehr: Drücke dich kraftvoll nach oben zurück in die Ausgangsposition, bis die Arme wieder voll gestreckt sind.
  Hinweis: Stabilisiere die Ringe über den gesamten Bewegungsablauf aktiv, um ein Zittern oder Weggleiten zu verhindern.
