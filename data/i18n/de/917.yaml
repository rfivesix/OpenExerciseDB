name: Kabelzug-Frontheben mit gerader Stange
description: '- Befestige eine gerade Stange am unteren Kabelzug. Stelle dich mit
  dem Rücken zum Kabelturm auf, das Kabel verläuft zwischen deinen Beinen.

  - Greife die Stange mit beiden Händen im schulterbreiten Obergriff vor deinen Oberschenkeln.

  - Hebe die Arme mit leicht gebeugten Ellenbogen kontrolliert nach vorne an, bis
  sich die Stange auf Schulter- bzw. Augenhöhe befindet.

  - Halte die Spannung kurz am obersten Punkt und senke das Gewicht langsam und kontrolliert
  wieder ab, ohne Schwung aus der Hüfte zu holen.'
