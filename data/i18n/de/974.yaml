name: Beidhändiger Kettlebell-Curl
description: 'Ausgangsposition: Stehe aufrecht mit schulterbreitem Stand. Greife die
  Kettlebell an den Hörnern (seitlichen Griffstücken) mit beiden Händen vor den Oberschenkeln
  bei gestreckten Armen.

  Ausführung: Halte die Ellbogen fest an den Körperseiten und beuge die Arme, um die
  Kettlebell kontrolliert in Richtung Brust anzuheben. Spanne den Bizeps am höchsten
  Punkt an.

  Rückkehr: Senke die Kettlebell langsam und kontrolliert wieder in die Ausgangsposition
  ab.

  Hinweis: Hole keinen Schwung aus dem Rücken oder der Hüfte; die Bewegung erfolgt
  rein aus dem Ellbogengelenk.'
