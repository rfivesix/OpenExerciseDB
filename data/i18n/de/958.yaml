name: TRX-Bizepscurl
description: 'Ausgangsposition: Greife die Griffe des TRX im Untergriff (Handflächen
  zeigen nach oben) und lehne deinen Körper mit gestreckten Armen nach hinten. Die
  Fersen stehen stabil auf dem Boden und der Körper bildet von Kopf bis Fuß eine gerade
  Linie.

  Ausführung: Halte die Ellbogen hoch auf Schulterhöhe fixiert und beuge die Arme,
  um deine Stirn zu den Händen zu ziehen. Spanne die Bizepsmuskulatur am Endpunkt
  fest an.

  Rückkehr: Senke den Körper langsam und kontrolliert wieder ab, bis die Arme vollständig
  gestreckt sind.

  Hinweis: Lasse die Ellbogen nicht nach unten absinken und hole keinen Schwung aus
  der Hüfte.'
