name: Stehende seitliche Crunches
description: |-
  Stehende seitliche Crunches sind eine dynamische Übung, die die seitliche Bauchmuskulatur beansprucht und zugleich Gleichgewicht und Stabilität verbessert. Stelle dich aufrecht hin, die Füße schulterbreit auseinander und die Hände hinter dem Kopf oder mit einer Kurzhantel in einer Hand. Neige deinen Oberkörper zu einer Seite, spanne dabei deine seitliche Bauchmuskulatur an und führe deinen Ellbogen in Richtung deiner Hüfte (oder crunche in Richtung des Gewichts, wenn du eine Kurzhantel verwendest). Kehre in die Startposition zurück und wechsle die Seiten ab oder führe alle Wiederholungen auf einer Seite aus, bevor du wechselst.
