exercise_id: '1239'
language: de
status: ai_authored
name: Stehende Wadendehnung
description: |-
  Ausgangsposition:
  • Stelle dich etwa einen Schritt entfernt vor eine Wand und stütze dich mit beiden Händen auf Schulterhöhe ab.
  • Mache mit einem Bein einen großen Schritt nach hinten.

  Ausführung:
  • Halte das hintere Bein vollständig gestreckt und drücke die hintere Ferse fest und flach in den Boden.
  • Beuge das vordere Knie und verlagere dein Körpergewicht nach vorne in Richtung Wand, bis du eine deutliche Dehnung im zweiköpfigen Wadenmuskel (M. gastrocnemius) spürst.
  • Halte die Dehnung für 20 bis 30 Sekunden bei ruhiger Atmung und wechsle anschließend das Bein.
