exercise_id: '1080'
language: de
status: ai_reviewed
name: Hindu-Liegestütze
description: |-
  Ausgangsposition:
  Beginne im herabschauenden Hund mit den Füßen hüftbreit und den Händen etwas mehr als schulterbreit auf dem Boden. Das Gesäß ist nach oben gestreckt, sodass der Körper ein umgekehrtes 'V' bildet.

  Ausführung:
  1. Beuge die Ellenbogen und tauche mit der Brust in einer wellenförmigen Bewegung knapp über dem Boden nach vorne unten ab.
  2. Drücke dich nach vorne oben durch die Hände aufrecht in die Kobra- bzw. heraufschauende Hund-Position, wobei die Brust stolz geöffnet ist.
  3. Schiebe das Gesäß kontrolliert wieder nach hinten oben zurück in das umgekehrte 'V'.
  4. Wiederhole diesen flüssigen Zyklus in kontinuierlicher Bewegung.
