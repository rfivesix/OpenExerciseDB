name: Hindu-Liegestütze
description: |-
  Übung zur Kräftigung der Schultern und der Brustmuskulatur. Ihr Name rührt daher, dass sie in der Yoga-Position "herabschauender Hund" beginnt, in die "Kobra" übergeht, jedoch ohne die Beine oder den Oberkörper auf dem Boden abzulegen, um schließlich mit einem normalen Liegestütz zu enden. Die Übung kann auch rückwärts ausgeführt werden (zurück in die Ausgangsposition). Als Variation kann nach dem Liegestütz die Hüfte angehoben werden, um in den herabschauenden Hund zurückzukehren.
