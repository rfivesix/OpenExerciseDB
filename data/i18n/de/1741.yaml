name: L-Sit-Klimmzüge
description: "Ausgangsposition:\nUmfasse eine Klimmzugstange im schulterbreiten Obergriff\
  \ (Pronation). Hänge dich mit gestreckten Armen an die Stange und hebe deine gestreckten\
  \ Beine im 90-Grad-Winkel nach vorne an, sodass dein Körper ein „L“ bildet. Spanne\
  \ Rumpf und Hüftbeuger fest an.\n\nAusführung:\n1. Halte die L-Position der Beine\
  \ stabil und ziehe deinen Körper kontrolliert nach oben, indem du die Ellenbogen\
  \ nach unten und hinten führst, bis dein Kinn die Stange passiert.\n2. Halte die\
  \ Kontraktion am oberen Punkt kurz und halte die Beine weiterhin exakt waagerecht.\n\
  3. Senke dich langsam und kontrolliert wieder in die vollständige Armstreckung ab,\
  \ ohne die Beine absinken zu lassen.\n\nHinweise:\nVermeide Schwung und halte die\
  \ Knie durchgedrückt und die Zehenspitzen gestreckt."
