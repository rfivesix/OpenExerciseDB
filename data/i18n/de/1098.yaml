name: Vorgebeugtes Seitheben sitzend (Reverse Fly)
description: |-
  Ausgangsposition:
  Setze dich auf das vordere Ende einer Trainingsbank, die Füße stehen fest auf dem Boden. Halte in jeder Hand eine leichte Kurzhantel. Beuge den Oberkörper mit geradem Rücken weit nach vorne, sodass die Brust nahe an den Oberschenkeln ruht. Die Hanteln hängen unter den Oberschenkeln nach unten.

  Ausführung:
  1. Hebe beide Arme mit leicht angewinkelten Ellenbogen seitlich in einem weiten Bogen nach oben, bis die Oberarme etwa auf Schulterhöhe sind.
  2. Ziehe dabei bewusst die hinteren Schultermuskeln und die Schulterblätter zusammen.
  3. Halte die Kontraktion am obersten Punkt für eine Sekunde.
  4. Senke die Kurzhanteln langsam und kontrolliert wieder in die Ausgangsposition ab, ohne Schwung zu holen.
