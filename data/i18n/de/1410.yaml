name: Plank mit alternierendem Beinheben
description: |-
  Ausgangsposition:
  Beginne im Unterarmstütz (Plank): Die Ellbogen befinden sich unter den Schultern, der Körper bildet von Kopf bis Fersen eine gerade Linie, der Rumpf und das Gesäß sind fest angespannt.

  Ausführung:
  Hebe ein Bein mit gestrecktem Knie kontrolliert einige Zentimeter vom Boden nach oben an, indem du die Gesäßmuskulatur aktiv anspannst. Halte die Position für einen kurzen Moment am obersten Punkt, senke das Bein langsam wieder ab und wiederhole die Bewegung mit dem anderen Bein.

  Hinweise:
  Halte die Hüfte parallel zum Boden und vermeide ein Verdrehen oder Durchhängen des Beckens. Die Wirbelsäule bleibt während der gesamten Übung stabil.
