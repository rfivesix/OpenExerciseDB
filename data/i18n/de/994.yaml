name: Armkreisen vorwärts
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand. Strecke beide
  Arme seitlich auf Schulterhöhe aus, die Handflächen zeigen nach unten.

  Ausführung: Kreise die gestreckten Arme in kontrollierten, gleichmäßigen Kreisbewegungen
  nach vorne. Die Kreisgröße kann allmählich vergrößert werden.

  Hinweis: Halte die Schultern unten und entspannt; spanne den Rumpf leicht an, um
  Ausweichbewegungen zu vermeiden.'
