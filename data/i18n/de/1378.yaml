name: Seitheben am Kabelzug (einarmig)
description: |-
  Ausgangsposition:
  Stelle dich seitlich neben einen Kabelzugturm, dessen Seilrolle auf die unterste Stufe eingestellt ist. Greife den Einhandgriff mit der dem Turm abgewandten Hand (Kabel verläuft hinter oder vor dem Körper). Halte dich mit der freien Hand am Pfosten fest und neige den Oberkörper minimal zur Seite.

  Ausführung:
  Hebe den Arm mit leicht gebeugtem Ellbogen in einem weiten Bogen seitlich nach oben, bis die Hand sich etwa auf Schulterhöhe befindet. Halte die Kontraktion im seitlichen Deltamuskel kurz und senke den Griff anschließend langsam und kontrolliert gegen den kontinuierlichen Kabelzug wieder ab.

  Hinweise:
  Führe die Bewegung ohne Schwung aus dem Oberkörper aus. Der Kabelzug sorgt im Gegensatz zu Kurzhanteln für eine gleichmäßige Spannung über den gesamten Bewegungsradius.
