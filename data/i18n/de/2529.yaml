name: Explosive Liegestütze
description: |-
  Ausgangsposition:
  Nimm eine klassische Liegestützposition auf dem Boden ein. Die Hände stehen etwas weiter als schulterbreit, die Finger zeigen leicht nach vorne außen. Der Körper bildet von den Fersen bis zum Kopf eine feste, gerade Linie.

  Ausführung:
  1. Senke deinen Oberkörper kontrolliert ab, bis deine Brust fast den Boden berührt.
  2. Drücke dich explosiv und maximal kraftvoll mit Händen und Brust vom Boden ab, sodass deine Hände für einen Moment vollständig den Boden verlassen.
  3. Fange deinen Körper beim Landen mit weich nachgebenden Armen federnd ab und gehe direkt fließend in die nächste Wiederholung über.

  Hinweise:
  Halte den Rumpf während des Abdrückens und Landens bretthart gespannt, um ein Durchhängen der Lendenwirbelsäule zu verhindern.
