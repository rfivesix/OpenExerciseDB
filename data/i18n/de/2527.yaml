name: Spagat-Dehnung (Front Split)
description: |-
  Ausgangsposition:
  Beginne im halben Kniestand auf einer weichen Matte. Stütze deine Hände seitlich auf Yogablöcken oder dem Boden ab.

  Ausführung:
  1. Schiebe die Ferse des vorderen Beins langsam nach vorne, während das hintere Knie und der Fuß nach hinten gleiten.
  2. Senke dein Becken behutsam und kontrolliert in Richtung Boden ab, während beide Beine sich zunehmend strecken.
  3. Halte das vordere Knie nach oben und die Hüfte möglichst gerade nach vorne ausgerichtet.
  4. Verweile an deiner persönlichen Dehngrenze (ohne stechenden Schmerz) und atme für 20 bis 30 Sekunden ruhig weiter.
  5. Drücke dich vorsichtig über die Hände nach oben heraus und wechsle die Seite.

  Hinweise:
  Forciere die Dehnung niemals ruckartig; nutze Kissen oder Blöcke unter dem vorderen Oberschenkel zur progressiven Annäherung.
