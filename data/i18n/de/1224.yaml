name: Kurzhantel-Drag-Curls
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin mit einer Kurzhantel in jeder Hand im Untergriff (Handflächen nach vorne gerichtet).
  • Die Arme hängen gestreckt vor den Oberschenkeln, der Oberkörper ist aufgerichtet.

  Ausführung:
  • Ziehe die Kurzhanteln senkrecht eng an deinem Oberkörper nach oben („draggen“), indem du die Ellbogen aktiv nach hinten führst.
  • Ziehe die Hanteln bis etwa auf Brusthöhe und spanne den Bizeps am höchsten Punkt maximal an.
  • Senke die Hanteln langsam entlang derselben engen Bahn wieder nach unten ab.
