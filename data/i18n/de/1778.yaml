name: Schrägbankdrücken mit Langhantel
description: "Ausgangsposition:\nLege dich auf eine Schrägbank, die auf einen Winkel\
  \ von 30 bis 45 Grad eingestellt ist. Platziere deine Augen unter der Langhantel,\
  \ ziehe die Schulterblätter zusammen und drücke die Füße fest in den Boden. Greife\
  \ die Langhantel etwas mehr als schulterbreit im festen Obergriff und hebe sie aus\
  \ der Halterung über deine obere Brust.\n\nAusführung:\n1. Atme ein, halte die Körperspannung\
  \ und senke die Hantelstange kontrolliert zur oberen Brust (unterhalb des Schlüsselbeins)\
  \ ab, während die Ellenbogen in einem 45- bis 70-Grad-Winkel zum Körper geführt\
  \ werden.\n2. Berühre die obere Brust sanft ohne abzufedern.\n3. Drücke die Stange\
  \ kraftvoll nach oben zurück in die Ausgangsposition, während du ausatmest.\n\n\
  Hinweise:\nDer Neigungswinkel von 30 bis 45 Grad betont den oberen Anteil der Brustmuskulatur\
  \ (Pars clavicularis). Ein steilerer Winkel (über 60 Grad) verlagert die Last zu\
  \ stark auf die vordere Schulter."
