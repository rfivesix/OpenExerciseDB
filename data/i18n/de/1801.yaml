name: Tiefe Kniebeuge mit Langhantel
description: "Ausgangsposition:\nPlatziere die Langhantel im Rack auf Schulterhöhe.\
  \ Tritt unter die Hantel und lege sie fest auf den oberen Trapezmuskel (High-Bar).\
  \ Greife die Stange mit beiden Händen, hebe sie heraus und mache zwei Schritte nach\
  \ hinten. Nimm einen schulterbreiten oder leicht weiteren Stand ein, die Fußspitzen\
  \ zeigen etwa 15 bis 30 Grad nach außen. Brust raus, Rumpf unter maximale Spannung\
  \ bringen (Bauchpresse).\n\nAusführung:\n1. Leite die Kniebeuge ein, indem du Knie\
  \ und Hüfte gleichzeitig beugst und die Knie in Richtung der Zehenspitzen nach außen\
  \ führst.\n2. Senke dich kontrolliert und tief ab, bis deine Oberschenkel deutlich\
  \ unter die Parallele zum Boden absinken (Full Depth).\n3. Halte den Rumpf aufrecht\
  \ und die Fersen fest am Boden.\n4. Drücke dich aus der tiefsten Position kraftvoll\
  \ und explosiv über den gesamten Fuß nach oben zurück in den Stand.\n\nHinweise:\n\
  Eine volle Kniebeuge erfordert gute Sprunggelenks- und Hüftbeweglichkeit. Gehe nur\
  \ so tief, wie die Lendenwirbelsäule stabil neutral gehalten werden kann (ohne starken\
  \ Butt-Wink)."
