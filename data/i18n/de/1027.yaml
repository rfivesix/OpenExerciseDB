name: Erhöhter Prayer-Stretch (Gebetshaltung auf einer Bank)
description: |-
  Ausgangsposition:
  Knie dich vor eine Flachbank oder eine stabile Erhöhung. Platziere beide Ellenbogen schulterbreit auf der Bankkante und lege die Handflächen wie zum Gebet zusammen (oder halte einen leichten Stab).

  Ausführung:
  1. Schiebe die Hüfte nach hinten und senke die Brust kontrolliert in Richtung Boden ab, sodass der Kopf zwischen die Oberarme sinkt.
  2. Beuge die Ellenbogen, sodass die Hände in Richtung Nacken/oberer Rücken wandern.
  3. Spüre eine intensive Dehnung im Latissimus, im Trizeps und in der Brustwirbelsäule.
  4. Halte die Position für 20–40 Sekunden unter ruhiger, tiefer Atmung und richte dich anschließend sanft wieder auf.
