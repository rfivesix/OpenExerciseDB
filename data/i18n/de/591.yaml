name: Sit-ups mit abgelegten Beinen
description: |-
  Lege dich auf eine Matte, winkle die Knie rechtwinklig an und lege die Unterschenkel auf einer Flachbank ab. Platziere die Hände hinter dem Kopf oder an den Schläfen. Rolle den Oberkörper Wirbel für Wirbel kontrolliert nach oben auf. Halte am höchsten Punkt für etwa zwei Sekunden die maximale Spannung in der Bauchmuskulatur, bevor du den Oberkörper langsam wieder abrollst. Ein Hohlkreuz ist stets zu vermeiden.
