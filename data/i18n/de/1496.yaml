name: Kurzhantel-Frontheben supiniert für die obere Brust
description: |-
  Ausgangsposition:
  Stehe aufrecht oder setze dich leicht geneigt hin. Halte eine Kurzhantel in einer Hand mit nach oben zeigender Handfläche (Supination) auf Hüfthöhe, der Ellenbogen ist leicht angewinkelt. Lehne den Oberkörper minimal in Richtung des arbeitenden Arms.

  Ausführung:
  1. Hebe die Kurzhantel in einem leichten Bogen diagonal nach oben und innen vor das Gesicht bzw. über die obere Brust.
  2. Führe die Bewegung entlang des Faserverlaufs des Schlüsselbeinteils des großen Brustmuskels (obere Brust) und des vorderen Deltamuskels aus.
  3. Spanne die obere Brust am höchsten Punkt für eine Sekunde maximal an.
  4. Senke die Kurzhantel langsam und kontrolliert wieder in die Ausgangsposition ab.

  Hinweise:
  Die Supination des Unterarms in Kombination mit der diagonalen Vorwärts-Aufwärts-Bewegung aktiviert gezielt die klavikulären Fasern der Brustmuskulatur.
