name: TRX Hammer-Curl
description: |-
  Positioniere die Griffe so, als wären sie eine Verlängerung der Bänder. Wir positionieren unsere Arme nach vorne gestreckt und unseren Körper nach hinten geneigt, vollkommen gerade. Die Bizepsmuskeln aktivieren sich, wenn du deine Ellbogen beugst, um deinen Körper in Richtung der Bänder zu ziehen. Die Kontraktionsbewegung endet mit einer leichten Auswärtsbewegung der Hände, bedingt durch den verwendeten Griff.
