name: Burpees ohne Liegestütz
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand.

  Ausführung: Gehe in die Kniebeuge und setze die Hände flach vor dir auf den Boden.
  Springe mit den Füßen nach hinten in die Liegestützposition, ohne einen Liegestütz
  auszuführen. Springe sofort mit den Füßen wieder nach vorne an die Hände heran und
  springe anschließend explosiv mit erhobenen Armen nach oben.

  Rückkehr: Lande weich mit leicht gebeugten Knien und gehe direkt in die nächste
  Wiederholung über.

  Hinweis: Halte die Rumpfspannung beim Nach-hinten-Springen, damit der untere Rücken
  stabil bleibt.'
