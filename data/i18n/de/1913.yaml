name: Einbeiniges Beckenheben (Single-Leg Glute Bridge)
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Trainingsmatte. Stelle einen Fuß mit gebeugtem Knie flach und fest auf den Boden nahe am Gesäß auf. Strecke das andere Bein gerade nach vorne in Verlängerung des Oberschenkels oder senkrecht nach oben aus. Die Arme liegen entspannt neben dem Körper.


  Ausführung:

  Drücke die Hüfte über die Ferse des gebeugten Standbeins kraftvoll nach oben, bis Oberschenkel und Rumpf eine gerade Linie bilden. Spanne das Gesäß am höchsten Punkt fest an und halte die Position für eine Sekunde. Senke das Becken langsam und kontrolliert wieder ab, ohne es komplett auf dem Boden abzulegen, und wiederhole die Bewegung. Absolviere alle Wiederholungen auf einer Seite, bevor du das Bein wechselst.


  Hinweise:

  Halte das Becken waagerecht und vermeide ein Abkippen zur Seite des angehobenen Beins.'
