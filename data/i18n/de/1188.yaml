exercise_id: '1188'
language: de
status: ai_authored
name: Seitbeugen mit Kurzhantel
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht und hüftbreit hin.
  • Halte eine Kurzhantel in einer Hand mit lang gestrecktem Arm seitlich am Oberschenkel.
  • Lege die freie Hand an den Kopf oder stemme sie in die Hüfte.

  Ausführung:
  • Neige deinen Oberkörper kontrolliert rein seitlich in der Frontalebene zur Seite mit der Hantel, bis du eine Dehnung in den gegenüberliegenden schrägen Bauchmuskeln spürst. Wichtig: Den Oberkörper keinesfalls drehen oder nach vorne beugen!
  • Richte dich aus der Kraft der gegenüberliegenden seitlichen Rumpf- und Bauchmuskeln wieder auf und ziehe leicht über die Mitte hinaus.
  • Führe alle Wiederholungen kontrolliert aus und wechsle anschließend die Seite.
