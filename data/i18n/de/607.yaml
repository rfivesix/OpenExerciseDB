name: Splinter Sit-ups
description: |-
  Lege dich auf den Rücken, die Beine gestreckt und die Arme an den Seiten, wobei du die Ellenbogen im 90-Grad-Winkel gebeugt hältst. Während du dich aufsetzt, drehe deinen Oberkörper nach rechts und führe dein linkes Knie in Richtung deines rechten Ellenbogens, während du deinen linken Arm nach hinten schwingst. Senke deinen Körper in die Ausgangsposition ab und wiederhole das Ganze zur rechten Seite. Das ist 1 Wiederholung.
