name: Umgekehrte Hyperextension (Reverse Hyperextension)
description: "Ausgangsposition:\nLege dich bauchlings auf eine Flachbank oder eine\
  \ Reverse-Hyper-Maschine, sodass dein Becken genau an der Kante abschließt und deine\
  \ Beine frei nach unten hängen. Halte dich mit den Händen an der Bank oder an den\
  \ Griffen der Maschine fest, um den Oberkörper zu fixieren.\n\nAusführung:\n1. Spanne\
  \ Gesäß und Beinbeuger fest an und hebe die gestreckten (oder minimal angewinkelten)\
  \ Beine kontrolliert nach hinten oben an.\n2. Hebe die Beine an, bis sie eine gerade\
  \ Linie mit deinem Oberkörper bilden, und spanne die Gesäßmuskulatur am obersten\
  \ Punkt für 1 Sekunde maximal an.\n3. Senke die Beine langsam und kontrolliert wieder\
  \ ab, ohne ins Schwingen zu geraten.\n\nHinweise:\nÜberstrecke die Lendenwirbelsäule\
  \ am obersten Punkt nicht übermäßig; die Bewegung soll gezielt aus der Hüftstreckung\
  \ von Gesäß und Beinbeugern kommen."
