name: Bizeps-Curls-Trifecta
description: |-
  Ausgangsposition:
  Stehe aufrecht mit schulterbreitem Stand, in jeder Hand eine Kurzhantel.

  Ausführung:
  Diese Übung kombiniert drei verschiedene Curl-Varianten hintereinander in einem einzigen Satz:
  1. Supinated Cross Body Curl: Führe die Kurzhantel mit der Handfläche nach oben (Supination) quer vor dem Oberkörper zur gegenüberliegenden Schulter.
  2. Pronated Cross Body Curl: Führe die Kurzhantel mit der Handfläche nach unten (Pronation/Obergriff) quer vor dem Oberkörper zur gegenüberliegenden Schulter, um Brachialis und Brachioradialis zu treffen.
  3. No Money Curl: Curle beide Hanteln nach oben, während du die Unterarme und Schultern nach außen rotierst, um den kurzen Bizepskopf maximal zu kontrahieren.

  Hinweise:
  Führe jede Wiederholung kontrolliert und ohne Schwung aus. Die Kombination hält die Muskulatur über eine hohe Wiederholungszahl unter konstanter Spannung.
