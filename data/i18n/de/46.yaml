name: Stehende Ausfallschritte mit Langhantel
description: |-
  Ausgangsposition:
  Platziere eine Langhantel auf dem oberen Rücken (Trapezmuskel), wie bei einer Kniebeuge. Stelle dich aufrecht hin, die Füße stehen hüftbreit und der Rumpf ist fest angespannt.

  Bewegung:
  1. Mache mit einem Bein einen weiten Ausfallschritt nach vorne.
  2. Senke die Hüfte kontrolliert senkrecht ab, bis beide Knie etwa einen 90-Grad-Winkel bilden und das hintere Knie kurz vor dem Boden ist.
  3. Drücke dich über die Ferse des vorderen Fußes kräftig zurück in den aufrechten Stand.
  4. Wiederhole die Bewegung mit dem anderen Bein (oder wechsle nach Beendigung des Satzes).

  Hinweise:
  Halte den Oberkörper während der gesamten Bewegung aufrecht und stabil. Das vordere Knie sollte stabil in einer Linie mit dem Fuß bleiben.
