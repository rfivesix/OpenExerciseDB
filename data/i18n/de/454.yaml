name: Pike-Liegestütze
description: |-
  Ausgangsposition:
  Der herabschauende Hund: Dein Körper sollte eine V-Form bilden, mit geradem Rücken, Armen und Beinen. Deine Hüfte sollte in der Luft sein. Du kannst diese Position erreichen, indem du die Hände aus einem hohen Liegestütz nach hinten führst.
  Ausführung:
  Beuge die Ellbogen, halte Rücken und Beine gerade und bringe den Kopf kontrolliert Richtung Boden.
  Strecke die Arme durch, drücke die Hüfte wieder nach oben und halte Rücken und Beine gerade.
  Wiederhole die Bewegung.
