name: Beinbeugen sitzend an der Maschine
description: |-
  Ausgangsposition:
  Setze dich auf die sitzende Beinbeugemaschine. Stelle die Rückenlehne so ein, dass deine Kniegelenke genau auf Höhe der Drehachse der Maschine liegen. Positioniere das untere Rollenpolster an der Rückseite deiner unteren Waden, knapp oberhalb der Fersen. Senke das Oberschenkel-Gegenpolster fest auf deine Oberschenkel ab.

  Ausführung:
  1. Fasse die Handgriffe seitlich am Sitz. Beuge deine Knie kraftvoll und ziehe die Fersen in einem weiten Bogen unter den Sitz nach hinten unten.
  2. Halte die maximale Beugung am tiefsten Punkt für 1 Sekunde und spanne die Beinbeuger (Hamstrings) maximal an.
  3. Führe das Polster langsam und kontrolliert wieder nach oben, bis deine Beine fast vollständig gestreckt sind.

  Hinweise:
  Lasse die Gewichte zwischen den Wiederholungen nicht aufsetzen, um die Spannung in den Hamstrings aufrechtzuerhalten.
