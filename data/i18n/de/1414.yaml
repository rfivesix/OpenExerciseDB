exercise_id: '1414'
language: de
status: human
name: Hack Squats
description: |-
  Hack Squats beanspruchen den Unterkörper und werden an einer Hackenschmidt-Maschine oder mit einer Langhantel ausgeführt. Für die Maschinen-Variante positionierst du dich auf der Plattform mit den Schultern unter den Polstern und den Füßen leicht nach vorne. Drücke durch die Fersen, um das Gewicht anzuheben, und beuge dann die Knie, um die Plattform in einer kontrollierten Bewegung abzusenken, bis deine Oberschenkel parallel zum Boden sind. Drücke dich zurück in die Startposition hoch. Für die Langhantel-Variante hältst du die Stange mit gestreckten Armen hinter deinen Beinen und führst eine kniebeugenähnliche Bewegung aus.
