name: Hackenschmidt-Kniebeuge (Maschine)
description: |-
  Ausgangsposition:
  Positioniere dich in der Hackenschmidt-Maschine (Hack Squat) mit dem Rücken und Kopf flach an der Rückenlehne und den Schultern fest unter den gepolsterten Schulterstützen. Platziere die Füße etwa schulterbreit und leicht nach vorne versetzt auf der Fußplatte. Löse die Sicherheitshebel.

  Ausführung:
  Beuge die Knie und senke die Plattform kontrolliert ab, bis deine Oberschenkel mindestens parallel zur Fußplatte sind (oder tiefer, sofern die Beweglichkeit es erlaubt). Halte die Knie stabil in Richtung der Zehenspitzen. Drücke dich über den Mittelfuß und die Fersen kraftvoll wieder nach oben, ohne die Knie am obersten Punkt komplett durchzuschlagen.

  Hinweise:
  Halte den unteren Rücken während der gesamten Bewegung fest an die Rückenlehne gepresst. Hebe die Fersen nicht von der Plattform ab.
