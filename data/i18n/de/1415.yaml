name: Kurzhantel-Crunches
description: |-
  Kurzhantel-Crunches sind eine gewichtete Variante der klassischen Crunches, die darauf ausgelegt ist, die Bauchmuskulatur intensiver zu beanspruchen. Lege dich flach auf den Rücken, die Knie gebeugt und die Füße flach auf dem Boden. Halte eine Kurzhantel mit beiden Händen nahe an deiner Brust oder über deinem Kopf. Hebe deine Schultern und deinen oberen Rücken in einer Crunch-Bewegung vom Boden ab und spanne dabei deinen Rumpf an. Senke dich langsam zurück in die Startposition. Achte während der gesamten Übung auf kontrollierte Bewegungen, um Verletzungen zu vermeiden.
