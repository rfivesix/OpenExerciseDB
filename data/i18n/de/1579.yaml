name: Bronco-Test (Shuttle Run)
description: 'Ausgangsposition:

  Stelle Markierungshütchen bei 0 m (Startlinie), 20 m, 40 m und 60 m auf einem Sportplatz
  oder einer Laufbahn auf.


  Ausführung:

  1. Sprinte von der Startlinie zur 20-m-Marke, berühre die Linie und sprinte zurück
  zur Startlinie.

  2. Drehe sofort um, sprinte zur 40-m-Marke und zurück zur Startlinie.

  3. Drehe erneut um, sprinte zur 60-m-Marke und zurück zur Startlinie (damit ist
  1 Durchgang über 240 m abgeschlossen).

  4. Absolviere insgesamt 5 Durchgänge (insgesamt 1.200 m) ohne Pause so schnell wie
  möglich.


  Hinweise:

  Ein renommierter Ausdauer- und Laktattoleranz-Fitnesstest aus dem Rugby zur Überprüfung
  der anaeroben und aeroben Leistungsfähigkeit.'
