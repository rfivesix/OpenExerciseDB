name: Butterfly Sit-up
description: |-
  Bei dieser Übung im mittleren Bewegungsbereich verleihen dir deine Armmuskeln ein wenig Schwung, der dir hilft, vom Boden hochzukommen. Du öffnest sie außerdem in der Überkopf-Position, was den oberen Rücken aktiviert.
  Beginne liegend mit flach auf dem Boden stehenden Füßen, die Knie angewinkelt, die Arme vor der Brust gekreuzt. Hebe mit deiner Bauchmuskulatur deinen Oberkörper vom Boden ab, während du deine Arme in die Goalpost-Position öffnest, und senke dich dann langsam wieder ab, um in die Ausgangsposition zurückzukehren.
