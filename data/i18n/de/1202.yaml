name: Hüftabduktion in Seitenlage
description: |-
  Ausgangsposition:
  • Lege dich seitlich auf eine Trainingsmatte.
  • Das untere Bein ist zur besseren Stabilität leicht gebeugt, das obere Bein ist vollständig gestreckt.
  • Stütze deinen Kopf mit dem unteren Arm ab und platziere die obere Hand stabilisierend vor der Brust auf dem Boden.

  Ausführung:
  • Hebe das obere, gestreckte Bein kontrolliert nach oben an, wobei die Fußspitze leicht nach unten oder parallel zum Boden zeigt.
  • Achte darauf, dass das Becken senkrecht zum Boden bleibt und nicht nach hinten abkippt.
  • Halte die Spannung im mittleren Gesäßmuskel (M. gluteus medius) am höchsten Punkt kurz und senke das Bein kontrolliert wieder ab.
