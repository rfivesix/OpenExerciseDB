name: Shinbox-Innenrotations-Dehnung
description: "Ausgangsposition: Setze dich auf den Boden, mit Hüften und Knien im\
  \ 90-Grad-Winkel gebeugt.\nBeinstellung:\nLege ein Bein vor dich (Außenrotation)\
  \ und das andere Bein zur Seite\nbzw. hinter dich (Innenrotation). Die Unterschenkel\
  \ und Knie sollten\nflach auf dem Boden bleiben.\nDie Bewegung:\nHalte deine Hüften\
  \ gerade und beuge deinen Oberkörper nach vorne oder neige ihn seitlich\n(von Seite\
  \ zu Seite) in Richtung des vorderen Beins, um die Dehnung zu vertiefen.\nZielbereiche:\n\
  Dehnt die Gesäßmuskulatur und den Piriformis (vorderes Bein) sowie die Hüftbeuger\
  \ und\ndie vordere Oberschenkelmuskulatur (hinteres Bein). Beansprucht bei der seitlichen\
  \ Beugung den Rumpf und die schrägen Bauchmuskeln.\nZiel: Verbessert die Hüftbeweglichkeit,\
  \ insbesondere die Innen- und Außenrotation, und löst Verspannungen im unteren Rücken."
