name: Bear Crawl Pull Through
description: |-
  Ausgangsposition:
  In den Vierfüßlerstand gehen (Hände unter den Schultern, Knie unter den Hüften) und eine Kurzhantel knapp hinter einer Hand auf Hüfthöhe platzieren. Die Knie wenige Zentimeter vom Boden anheben und die Position stabil halten (Bear-Crawl-Haltung).
  
  Ausführung:
  1. Mit der gegenüberliegenden Hand unter dem Körper hindurchgreifen und die Kurzhantel fassen.
  2. Die Hantel kontrolliert auf die andere Seite ziehen und dort absetzen.
  3. Die Hand wieder auf dem Boden platzieren und die Bewegung spiegelbildlich mit der anderen Hand wiederholen.
  
  Hinweise:
  Den Rumpf maximal stabilisieren. Becken und Schultern dürfen während des Ziehens nicht zur Seite rotieren oder kippen.
