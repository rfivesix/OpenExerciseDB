name: Drachen-Kniebeuge (Dragon Squat)
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin, die Füße stehen etwa hüftbreit auseinander.
  • Halte die Brust aufgerichtet und den Rumpf angespannt.

  Ausführung:
  • Führe ein Bein weit hinter und schräg über das Standbein zur gegenüberliegenden Seite (gekreuzter Ausfallschritt/Curtsy Squat).
  • Beuge beide Knie und senke die Hüfte tief ab, während Schultern und Becken möglichst gerade nach vorne ausgerichtet bleiben.
  • Drücke dich über die Ferse des vorderen Standbeins kraftvoll wieder nach oben in die Ausgangsposition zurück.
  • Führe die Wiederholungen abwechselnd oder seitenweise aus.
