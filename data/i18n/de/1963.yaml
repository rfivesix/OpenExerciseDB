name: Langsame Kniebeuge (Tempo Squat)
description: 'Ausgangsposition:

  Stelle dich schulterbreit hin, die Zehenspitzen leicht nach außen gedreht. Halte den Oberkörper aufrecht, die Brust stolz und die Arme vor der Brust verschränkt oder nach vorne ausgestreckt.


  Ausführung:

  Senke das Gesäß langsam und kontrolliert über 3 Sekunden nach hinten unten ab, bis die Oberschenkel mindestens parallel zum Boden sind. Halte die tiefste Position für 2 Sekunden unter voller Körperspannung. Drücke dich anschließend zügig über die Fersen und den Mittelfuß in 1 Sekunde wieder nach oben in den aufrechten Stand. Wiederhole die Bewegung für die gewünschte Anzahl an Wiederholungen.


  Hinweise:

  Das kontrollierte Tempo (3 Sekunden abwärts, 2 Sekunden Pause, 1 Sekunde aufwärts) erhöht die muskuläre Spannung drastisch, verbessert die Bewegungskontrolle und stärkt Sehnen und Bänder.'
