name: High Plank (Liegestützposition)
description: 'Ausgangsposition: Nimm die Liegestützposition (High Plank) ein: Platziere
  die Hände senkrecht unter den Schultern auf dem Boden und stütze dich auf die Zehenballen.
  Der Körper bildet von Kopf bis Fuß eine feste gerade Linie.

  Ausführung: Halte diese Position statisch: Spanne Bauch- und Gesäßmuskulatur intensiv
  an und drücke dich aktiv vom Boden weg, sodass die Schulterblätter stabil am Brustkorb
  anliegen.

  Hinweis: Achte darauf, dass das Becken weder durchhängt noch nach oben geschoben
  wird. Der Nacken bleibt in Verlängerung der Wirbelsäule.'
