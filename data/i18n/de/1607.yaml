name: Typewriter-Klimmzüge
description: |-
  Hänge dich mit einem Obergriff, etwas weiter als schulterbreit, an eine Klimmzugstange. Ziehe dich hoch, bis dein Kinn über der Stange ist. Verlagere am höchsten Punkt deinen Körper zu einer Seite, indem du einen Arm streckst, während der andere Arm gebeugt bleibt, anstatt direkt nach unten zu gehen. Bewege dich gleichmäßig von einer Seite zur anderen, ähnlich der Bewegung einer Schreibmaschine, bevor du dich wieder herablässt. Diese Übung erhöht die Zeit unter Spannung und stärkt Latissimus, Bizeps und Schultern, während sie einseitige Zugkraft aufbaut.
