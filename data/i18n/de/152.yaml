name: Klimmzug im Untergriff (Chin-up)
description: |-
  Ausgangsposition:
  Hänge dich an eine Klimmzugstange mit schulterbreitem Untergriff (Kammgriff / Supination), sodass deine Handflächen zu deinem Gesicht zeigen. Die Arme sind vollständig gestreckt, der Rumpf ist angespannt und die Schulterblätter sind leicht nach unten gezogen.

  Bewegung:
  1. Ziehe deinen Körper kraftvoll nach oben, indem du die Ellbogen nach unten und hinten führst, bis sich dein Kinn deutlich über der Stange befindet.
  2. Halte die Kontraktion am obersten Punkt für einen kurzen Moment und spanne Bizeps und Latissimus an.
  3. Senke dich langsam und kontrolliert wieder in die vollständige Streckung (Deadhang) ab.

  Hinweise:
  Vermeide Schwungholen oder Treten mit den Beinen. Der Untergriff beansprucht neben dem Latissimus besonders stark den Bizeps.
