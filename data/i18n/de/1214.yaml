name: Tuck Front Lever
description: |-
  Ausgangsposition:
  • Hänge dich mit schulterbreitem Obergriff (Pronation) an eine stabile Klimmzugstange.
  • Spanne den Rumpf an und ziehe die Knie eng an die Brust in eine kompakte Hocke (Tuck-Position).

  Ausführung:
  • Ziehe die gestreckten Arme durch Kraft des Latissimus und der oberen Rückenmuskulatur nach unten, um den gesamten Oberkörper anzuheben.
  • Bringe den Rumpf in eine horizontale Linie parallel zum Boden, während die Knie fest an der Brust gehalten werden.
  • Halte diese isometrische Position für die vorgegebene Zeitspanne (z. B. 5 bis 15 Sekunden).
  • Senke den Körper kontrolliert wieder in den Hang ab.
