name: YWT-Hebungen in Bauchlage
description: |-
  Ausgangsposition:
  Lege dich flach auf den Bauch auf eine Matte. Der Kopf bleibt in neutraler Verlängerung der Wirbelsäule, der Blick geht zum Boden.

  Ausführung:
  1. Y-Position: Strecke die Arme diagonal nach vorne in eine 'Y'-Form (ca. 45 Grad), Daumen zeigen zur Decke. Hebe die Arme und die Brust leicht an, ziehe die Schulterblätter nach hinten unten und halte für 10–20 Sekunden.
  2. W-Position: Ziehe die Ellenbogen gebeugt nah an den Körper heran, sodass Arme und Kopf ein 'W' bilden. Halte die Arme angehoben und spanne den oberen Rücken aktiv an.
  3. T-Position: Strecke die Arme seitlich rechtwinklig zum Rumpf in eine 'T'-Form aus, Daumen nach oben. Ziehe die Schulterblätter intensiv zusammen und halte die Spannung.
  4. Führe die Sequenz ruhig und kontrolliert durch, um Haltung und Schultergesundheit zu stärken.
