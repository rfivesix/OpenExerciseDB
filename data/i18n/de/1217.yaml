name: Finger-Liegestütze
description: |-
  Ausgangsposition:
  • Begib dich in die Liegestützposition, stütze dich jedoch ausschließlich auf den gespreizten Fingerspitzen und Daumen ab.
  • Die Handflächen berühren den Boden nicht.
  • Spanne Bauch und Gesäß an, sodass der Körper von Kopf bis Fuß eine feste, gerade Linie bildet.

  Ausführung:
  • Beuge die Ellbogen langsam und kontrolliert, um die Brust in Richtung Boden abzusenken.
  • Halte die Finger stabil und fest aufgestellt, ohne dass sie wegknicken.
  • Drücke dich mit Kraft aus den Fingerspitzen, der Brust und dem Trizeps wieder nach oben in die Ausgangsposition zurück.
