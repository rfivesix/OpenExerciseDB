name: 4-Count Burpees (Burpees mit 4 Zählzeiten)
description: 'Ausgangsposition: Stehe aufrecht mit schulterbreitem Stand und locker
  herabhängenden Armen.

  Ausführung:

  1. Gehe in eine tiefe Kniebeuge und setze die Hände flach vor deinen Füßen auf den
  Boden.

  2. Springe mit beiden Füßen dynamisch nach hinten in die hohe Liegestützposition
  (Plank).

  3. Springe mit den Füßen wieder nach vorne neben deine Hände in die Kniebeuge.

  4. Richte dich kraftvoll wieder in den aufrechten Stand auf.

  Hinweis: Halte den Rumpf in der Plank-Position fest angespannt, um ein Durchhängen
  der Hüfte zu verhindern.'
