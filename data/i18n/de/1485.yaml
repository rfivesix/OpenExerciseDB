name: Rocking Triceps Pushdown (Trizepsdrücken mit Gewichtsverlagerung)
description: |-
  Ausgangsposition:
  Stelle dich mit leichtem Ausfallschritt vor einen hohen Kabelzug mit Seilaufsatz. Greife die Seilenden im neutralen Griff und lehne den Oberkörper leicht nach vorne in Richtung des Seils, das Körpergewicht liegt auf dem vorderen Fuß.

  Ausführung:
  1. Drücke das Seil nach unten und verlagere dabei gleichzeitig deinen Oberkörper leicht nach hinten auf den hinteren Fuß, sodass deine Hände hinter deinen Körper gelangen.
  2. Öffne die Seilenden am tiefsten Punkt nach außen und spanne den Trizeps maximal an.
  3. Führe das Seil langsam wieder nach oben und verlagere dein Körpergewicht zurück auf den vorderen Fuß.

  Hinweise:
  Die leichte dynamische Gewichtsverlagerung vergrößert den Bewegungsumfang in der Endkontraktion und sorgt für eine besonders intensive Beanspruchung des langen Trizepskopfs.
