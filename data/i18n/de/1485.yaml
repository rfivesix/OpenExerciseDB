name: Rocking Triceps Pushdown
description: |-
  Stelle deine Füße unter das Seil und lehne deinen Oberkörper zum Seil hin. Stelle einen Fuß nach hinten. Drücke das Seil herunter und lehne deinen gesamten Körper auf den hinteren Fuß zurück, während du herunterdrückst, um deine Hände hinter deinen Körper zu bringen. Vergiss nicht, beim Herunterdrücken die Brust nach vorne zu bringen. Während du das Seil langsam zurücklässt, lehne deinen Körper zurück auf den vorderen Fuß.
