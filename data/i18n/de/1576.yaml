name: Snap Down
description: 'Ausgangsposition:

  Stelle dich aufrecht mit schulterbreitem Stand hin. Strecke beide Arme senkrecht
  über den Kopf und hebe die Fersen an, sodass du auf den Zehenspitzen stehst und
  deinen Körper maximal lang machst.


  Ausführung:

  1. Reiße die Arme explosiv nach unten und sinke gleichzeitig blitzschnell durch
  Beugen von Hüfte und Knien in eine tiefe, stabile athletische Position (Quarter
  Squat) ab.

  2. Fange das Körpergewicht sanft auf den ganzen Fußsohlen ab, spanne den Rumpf fest
  an und halte die Brust aufrecht.

  3. Friere in der tiefen Position für einen kurzen Moment stabil ein, bevor du dich
  wieder aufrichtest.


  Hinweise:

  Trainiert die schnelle Abbremsung (Deceleration) und Landemechanik für reaktive
  Schnellkraft und Verletzungsprävention.'
