name: Hyper Y-W-Kombination (Hyperextensionen mit Gewichtsscheiben)
description: |-
  Ausgangsposition:
  Positioniere dich auf einer Hyperextensionsbank (45°-Bank oder Glute-Ham-Developer) mit den Fersen fixiert und dem Becken am Polster. Halte in jeder Hand eine leichte Gewichtsscheibe.

  Ausführung:
  1. Richte den Oberkörper auf, bis er eine gerade Linie mit den Beinen bildet.
  2. Hebe die Arme mit den Scheiben schräg nach vorne-oben in eine „Y“-Form, um den unteren Trapezius zu aktivieren, und halte kurz.
  3. Ziehe die Ellenbogen anschließend nach hinten-unten in eine „W“-Form, ziehe die Schulterblätter fest zusammen und aktiviere die Außenrotatoren.
  4. Senke den Oberkörper langsam und kontrolliert wieder in die Ausgangsposition ab.

  Hinweise:
  Wähle bewusst sehr leichte Scheiben (1,25–2,5 kg); die Qualität und Kontrolle der Schulterblattführung steht im Vordergrund.
