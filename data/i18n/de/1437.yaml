name: Pin-Kniebeuge (Pin Squat)
description: |-
  Ausgangsposition:
  Stelle die Sicherheitsablagen (Pins) im Power Rack auf die Höhe deines Sticking Points oder des Umkehrpunkts deiner Kniebeuge ein. Tritt unter die Hantelstange, platziere sie auf dem Trapezmuskel (High-Bar oder Low-Bar), hebe sie heraus und begib dich in deine reguläre Kniebeugenposition.

  Ausführung:
  Gehe kontrolliert in die Kniebeuge, bis die Langhantel sanft auf den Sicherheitsablagen aufsetzt. Halte die Position für 1 bis 2 Sekunden in voller Rumpf- und Beinspannung, ohne das Gewicht komplett abzuladen. Drücke dich anschließend aus dem Ruhezustand explosiv über die Fersen und den Mittelfuß wieder nach oben in den Stand.

  Hinweise:
  Verliere auf den Ablagen keinesfalls die Körperspannung. Das Pin-Squatting stärkt gezielt die Anfangskraft und die Rumpfstabilität am Umkehrpunkt.
