name: Kabelzug-Fliegende
description: |-
  Ausgangsposition: Stelle dich mittig zwischen zwei Kabelzüge und greife die Griffe auf Brust- bis Schulterhöhe. Mache einen Ausfallschritt nach vorne für stabilen Stand, sodass bereits in der Ausgangsstellung Spannung auf den Kabeln liegt. Der Oberkörper ist minimal nach vorne geneigt.
  Ausführung: Führe die Griffe mit leicht gebeugten Ellenbogen in einer weiten Halbkreisbewegung kontrolliert vor der Brust zusammen. Spanne die Brustmuskulatur im Umkehrpunkt kurz intensiv an.
  Rückkehr: Öffne die Arme langsam und kontrolliert zurück in die Ausgangsstellung, bis du eine angenehme Dehnung in der Brust spürst.
