name: Liegestütz mit Rotation (T-Push-up)
description: 'Ausgangsposition: Nimm die Liegestützposition ein: Hände etwas weiter
  als schulterbreit auf dem Boden, der Körper bildet eine feste gerade Linie von den
  Fersen bis zum Kopf.

  Ausführung: Führe einen Liegestütz aus, indem du die Brust zum Boden absenkst. Drücke
  dich wieder nach oben und rotiere den Oberkörper zur Seite auf, während du einen
  Arm senkrecht zur Decke streckst (T-Position).

  Rückkehr: Führe die Hand kontrolliert zum Boden zurück und wiederhole die Bewegung
  mit Rotation zur anderen Seite.

  Hinweis: Halte das Becken stabil und lasse die Hüfte während der Drehung nicht durchhängen.'
