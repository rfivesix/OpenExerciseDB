name: Good Morning in Schrittstellung
description: |-
  Ausgangsposition:
  Platziere eine Langhantel wie bei einer Kniebeuge sicher auf deiner oberen Nackenmuskulatur (Trapezius). Mache mit einem Fuß einen halben Schritt nach vorne in eine versetzte Schrittstellung (Staggered Stance). Das vordere Bein ist fast gestreckt, das hintere Bein leicht gebeugt als Stütze.

  Ausführung:
  1. Beuge deinen Oberkörper mit geradem Rücken aus der Hüfte kontrolliert nach vorne unten (Hip Hinge), während du das Gesäß nach hinten schiebst.
  2. Gehe so weit nach unten, bis du eine deutliche Dehnung in der Beinrückseite (Hamstrings) des vorderen Beins spürst (etwa bis der Oberkörper fast parallel zum Boden ist).
  3. Richte den Oberkörper kraftvoll durch Kontraktion von Gesäß und Beinbeugern wieder in die aufrechte Schrittstellung auf.
  4. Absolviere die Wiederholungszahl und wechsle anschließend die Beinstellung.

  Hinweise:
  Halte die Wirbelsäule stets in einer neutralen, stabilen Position und runde den unteren Rücken zu keinem Zeitpunkt ab.
