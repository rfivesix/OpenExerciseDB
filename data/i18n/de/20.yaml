name: Arnold Press
description: |-
  Ausgangsposition:
  Setze dich aufrecht auf eine Bank mit Rückenlehne. Halte zwei Kurzhanteln auf Schulterhöhe vor deiner Brust, die Handflächen zeigen zum Körper (Untergriff), die Ellbogen sind gebeugt direkt unter den Handgelenken.

  Bewegung:
  1. Drücke die Hanteln über den Kopf nach oben und drehe dabei gleichzeitig die Arme und Handgelenke nach außen.
  2. Am obersten Punkt sind die Arme fast ganz gestreckt und die Handflächen zeigen nach vorne (Obergriff).
  3. Senke die Kurzhanteln kontrolliert ab und drehe die Handgelenke wieder kontinuierlich zurück in die Ausgangsposition.

  Hinweise:
  Die Drehung erfolgt fließend während der gesamten Drückbewegung. Halte den Rumpf fest angespannt, um ein Überstrecken im unteren Rücken zu vermeiden.
