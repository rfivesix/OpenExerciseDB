name: Intensive Brustdehnung
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Flachbank und halte leichte Kurzhanteln (oder nutze alternativ einen stabilen Türrahmen bzw. Pfosten im Stehen mit angewinkeltem Unterarm an der Kante).


  Ausführung:

  Lasse die Arme langsam und kontrolliert seitlich nach unten sinken, sodass eine tiefe Dehnung über der gesamten Brustmuskulatur entsteht. Halte die Dehnposition statisch für 30 bis 60 Sekunden und atme tief und gleichmäßig durch die Nase in den Brustkorb ein und aus.


  Hinweise:

  Die Dehnung sollte intensiv, aber schmerzfrei sein; federe nicht nach. Ideal als gezielte Mobilitäts- und Regenerationsübung nach schweren Drückeinheiten.'
