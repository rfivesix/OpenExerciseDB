name: Außenrotation am Kabelzug
description: |-
  Ausgangsposition:
  Stelle die Umlenkrolle des Kabelzugs auf Ellbogenhöhe ein. Stelle dich seitlich zum Kabelturm. Greife den D-Griff mit der weiter entfernten Hand (äußerer Arm). Beuge den Ellbogen im 90-Grad-Winkel und halte ihn fest an der Taille (optional ein kleines gerolltes Handtuch zwischen Ellbogen und Rippen klemmen).

  Bewegung:
  1. Rotiere den Unterarm langsam und kontrolliert nach außen vom Körper weg, während der Ellbogen fest am Körper fixiert bleibt.
  2. Halte die Kontraktion in der Rotatorenmanschette für einen kurzen Moment am Punkt der maximalen Auslenkung.
  3. Führe den Griff langsam und kontrolliert wieder vor den Bauch zurück in die Ausgangsposition.

  Hinweise:
  Drehe nicht den gesamten Rumpf mit; die Bewegung erfolgt isoliert aus dem Schultergelenk (Infraspinatus, Teres minor).
