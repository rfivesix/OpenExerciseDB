name: Kopf drehen (Halswirbelsäulen-Rotation)
description: 'Ausgangsposition: Sitze oder stehe aufrecht mit geradem Rücken und gesenkten,
  entspannten Schultern. Der Blick geht geradeaus.

  Ausführung: Drehe deinen Kopf langsam und kontrolliert zu einer Seite, bis eine
  sanfte Dehnung im Nacken spürbar ist. Halte die Position für 1–2 Sekunden, kehre
  zur Mitte zurück und drehe den Kopf zur Gegenseite.

  Hinweis: Bewege dich schmerzfrei und ohne Rucken; die Schultern bleiben ruhig und
  drehen sich nicht mit.'
