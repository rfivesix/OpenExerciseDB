name: Einarmiger Überzug am Kabelzug über Kreuz
description: "Ausgangsposition:\nStelle die Umlenkrolle eines Kabelzugs auf die höchste\
  \ Position und befestige einen D-Griff oder nutze das nackte Kugelende. Stelle dich\
  \ seitlich versetzt zur Station, sodass das Kabel diagonal über deinen Oberkörper\
  \ verläuft. Greife den Griff mit der entfernteren Hand, neige den Oberkörper leicht\
  \ nach vorne und halte den Rumpf stabil. Der Arbeitsarm ist schräg nach oben gestreckt.\n\
  \nAusführung:\n1. Ziehe den Griff mit fast gestrecktem Arm in einem weiten diagonalen\
  \ Bogen von oben außen nach unten zur gleichseitigen Hüfte.\n2. Führe den Ellenbogen\
  \ eng an den Rippenbogen heran und spanne den Latissimus und den Teres major am\
  \ unteren Punkt für 1 Sekunde maximal an.\n3. Führe den Arm langsam und kontrolliert\
  \ entlang derselben diagonalen Bahn wieder nach oben, bis du eine intensive Dehnung\
  \ im Latissimus spürst.\n\nHinweise:\nDer diagonale Zugwinkel über Kreuz folgt optimal\
  \ dem Faserverlauf des Musculus latissimus dorsi."
