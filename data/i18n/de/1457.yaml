name: Brustdrücken am Kabelzug eingedreht (Cable Press Around)
description: |-
  Ausgangsposition:
  • Stelle die Rolle des Kabelzugs auf Brusthöhe ein und befestige einen D-Griff.
  • Greife den Griff im neutralen Griff, drehe dich leicht schräg (ca. 45°) von der Station weg und gehe in einen stabilen Ausfallschritt.
  • Der arbeitende Arm ist gebeugt, die Hand befindet sich neben der Brust.

  Ausführung:
  • Drücke den Griff mit der Brustmuskulatur in einem leichten Bogen über die Körpermitte nach vorne-innen.
  • Spanne die Brustmuskulatur am Endpunkt der Bewegung (stärkste Kontraktion) intensiv für 1 Sekunde an.
  • Führe den Griff langsam und kontrolliert zurück, bis du eine angenehme Dehnung im großen Brustmuskel spürst.
