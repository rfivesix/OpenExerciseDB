name: Einarmiger Latzug im halben Kniestand
description: |-
  Ausgangsposition:
  Befestige einen D-Griff an einem hohen Kabelzug. Gehe vor dem Kabelzug in den halben Kniestand (das Knie auf der Seite des ziehenden Arms ist am Boden). Greife den Griff mit ausgestrecktem Arm, sodass der Latissimus in der Ausgangsposition voll gedehnt wird. Halte den Rumpf aufrecht und stabil.

  Ausführung:
  1. Ziehe den Griff kontrolliert nach unten in Richtung Schulter/Schlüsselbein, indem du den Ellenbogen nach unten und leicht nach hinten zur Hüfte führst.
  2. Halte die Kontraktion im Latissimus am tiefsten Punkt für eine Sekunde.
  3. Führe das Gewicht langsam und kontrolliert wieder nach oben in die Ausgangsstreckung zurück.

  Hinweise:
  Der halbe Kniestand fixiert das Becken und verhindert ein Ausweichen oder Mitschwingen des Rumpfes, was eine optimale Isolation des Lats gewährleistet.
