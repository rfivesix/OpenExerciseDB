name: YTW-Heben (Schulterblatt-Aktivierung)
description: |-
  Ausgangsposition:
  Lege dich bäuchlings auf eine Trainingsmatte (oder neige den Oberkörper im Stand mit geradem Rücken weit nach vorne). Strecke die Arme nach vorne aus, Daumen zeigen nach oben zur Decke.

  Ausführung:
  1. Y-Position: Hebe die gestreckten Arme diagonal nach vorne oben (ca. 45 Grad), sodass der Körper ein 'Y' bildet. Ziehe die Schulterblätter nach hinten unten und halte 2 Sekunden.
  2. T-Position: Führe die gestreckten Arme im 90-Grad-Winkel seitlich aus, sodass der Körper ein 'T' bildet. Ziehe die Schulterblätter kraftvoll zusammen und halte 2 Sekunden.
  3. W-Position: Beuge die Ellbogen an und ziehe sie dicht an die Rippen, während die Hände nach oben außen zeigen ('W'-Form). Ziehe die Schulterblattmuskeln maximal zusammen.

  Hinweise:
  Führe jede Position kontrolliert und ohne Schwung aus. Die Übung stärkt gezielt den mittleren und unteren Trapezius sowie die Rautenmuskeln für eine aufrechte Körperhaltung.
