name: Dorsalflexion mit Widerstandsband
description: |-
  Ausgangsposition:
  • Setze dich mit ausgestreckten Beinen auf den Boden.
  • Befestige ein Widerstandsband an einem stabilen Verankerungspunkt vor dir und lege die Schlaufe um deinen Vorfuß/die Zehenspitzen.
  • Rutsche so weit zurück, dass das Band bereits bei lockerer Fußhaltung auf Zug ist.

  Ausführung:
  • Ziehe die Fußspitze und die Zehen gegen den Widerstand des Bandes kraftvoll in Richtung deines Schienbeins heran (Dorsalflexion).
  • Halte die maximale Anspannung des vorderen Schienbeinmuskels (M. tibialis anterior) am Endpunkt für 1 bis 2 Sekunden.
  • Führe den Fuß langsam und kontrolliert wieder nach vorne in die gestreckte Position zurück.
