name: Reverse Nordic Curl
description: '- Knie dich auf eine weiche Matte, strecke die Hüfte vollständig durch
  und halte den Körper von den Knien bis zum Kopf in einer geraden Linie.

  - Lehne deinen Oberkörper langsam und kontrolliert nach hinten, indem du ausschließlich
  in den Kniegelenken nachgibst.

  - Halte die Oberschenkelmuskeln (insbesondere den geraden Oberschenkelmuskel) unter
  maximaler Spannung, um die Abwärtsbewegung zu bremsen.

  - Ziehe dich aus der Kraft des Quadrizeps wieder nach vorne in die aufrechte Kniestand-Position
  zurück, ohne in der Hüfte einzuknicken.'
