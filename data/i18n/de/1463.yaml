name: Kurzhantel-Rudern im Untergriff aus dem Dead Stop
description: |-
  Ausgangsposition:
  • Stehe mit den Füßen schulterbreit und halte zwei Kurzhanteln im Untergriff (Handflächen nach vorne gerichtet).
  • Beuge dich mit geradem Rücken in den Hüften nach vorne, bis der Oberkörper fast parallel zum Boden ist.

  Ausführung:
  • Rudere die Kurzhanteln kraftvoll nach oben in Richtung Hüfte, indem du die Ellbogen eng am Körper nach hinten-oben führst.
  • Ziehe die Schulterblätter am höchsten Punkt zusammen und spanne den Latissimus fest an.
  • Senke die Hanteln langsam und kontrolliert vollständig ab, bis sie am Boden kurz im Dead Stop ruhen, bevor die nächste Wiederholung ohne Schwung beginnt.
