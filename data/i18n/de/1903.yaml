name: Ausfallschritte im Gehen
description: "Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand. Die Hände liegen\
  \ entweder auf den Hüften oder halten Kurzhanteln seitlich am Körper.\nSchritt:\
  \ Mache einen weiten Schritt nach vorne.\nAbsenken: Senke die Hüfte kontrolliert\
  \ ab, bis beide Knie in einem Winkel von etwa 90 Grad gebeugt sind. Das hintere\
  \ Knie stoppt knapp über dem Boden.\nÜbergang: Drücke dich kraftvoll über die vordere\
  \ Ferse nach oben ab, führe das hintere Bein nach vorne und setze direkt zum nächsten\
  \ Ausfallschritt an."
