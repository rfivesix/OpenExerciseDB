name: Liegestütze an Parallettes
description: |-
  Ausgangsposition:
  Platziere zwei Parallettes-Griffe schulterbreit parallel zueinander auf dem Boden. Umfasse die Griffe fest im neutralen Griff (Handflächen zeigen zueinander) und gehe in die Liegestützposition mit gestrecktem Körper.

  Ausführung:
  1. Beuge die Ellenbogen und senke deine Brust tief zwischen die Parallettes-Holme ab.
  2. Nutze den erweiterten Bewegungsumfang (Defizit), um eine spürbare, kontrollierte Dehnung im großen Brustmuskel zu erzielen.
  3. Drücke dich kraftvoll durch die Handgelenke nach oben ab und strecke die Arme wieder durch.
  4. Der neutrale Griff schont die Handgelenke und ermöglicht eine tiefere und gelenkschonendere Liegestütz-Ausführung.
