exercise_id: '418'
language: de
status: human
name: Military Press mit SZ-Stange
description: |-
  Greife bei einer SZ-Stange mit den Händen jeweils an der Außenseite der Biegungen und stehe mit gerade nach unten hängenden Armen, die Handflächen zu den Beinen gerichtet. Ziehe die Stange (indem du die Arme im Ellenbogen beugst) zur Brust und drücke die Stange dann über den Kopf (Arme so gerade wie möglich). Führe die Stange zurück zur Brust, indem du die Arme im Ellenbogen absenkst. Bringe die Stange in ihre Ausgangsposition zurück (stehe mit gerade nach unten hängenden Armen, die Handflächen zu den Beinen gerichtet).
