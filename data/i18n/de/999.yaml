name: Reverse Lunges (Ausfallschritte nach hinten)
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand und aufgerichtetem
  Oberkörper.

  Ausführung: Mache mit einem Bein einen kontrollierten Schritt nach hinten und senke
  das Becken ab, bis beide Knie etwa im 90-Grad-Winkel gebeugt sind und das hintere
  Knie knapp über dem Boden schwebt.

  Rückkehr: Drücke dich über die Ferse des vorderen Fußes kraftvoll zurück in den
  aufrechten Stand.

  Hinweis: Der Oberkörper bleibt während der gesamten Ausführung aufrecht und gerade.'
