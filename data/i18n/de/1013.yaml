name: Dehnung des linken Musculus levator scapulae
description: |-
  Ausgangsposition:
  Nimm eine aufrechte Haltung im Stehen oder Sitzen ein. Drehe den Kopf um etwa 45 Grad nach links. Lege die rechte Hand hinter den Rücken (oder fixiere sie unter dem Oberschenkel). Fasse mit der linken Hand an den Hinterkopf und neige das Kinn sanft nach unten in Richtung der linken Achselhöhle.
  Schritte:

  Baue aus dieser Position einen leichten isometrischen Druck mit dem Kopf gegen die linke Hand auf, während die Hand mit gleicher Kraft gegenhält, sodass der Kopf fixiert bleibt. Halte diese Position.
