name: Body-Ups
description: |-
  Nimm eine Unterarmstütz-Position (Plank) auf dem Boden ein. Stütze dein Körpergewicht auf Zehen und Unterarmen ab und halte deinen Oberkörper gerade. Deine Unterarme sollten schulterbreit auseinanderliegen. Dies ist deine Ausgangsposition.
  Drücke deine Handflächen fest in den Boden und strecke die Ellbogen durch, um deinen Körper vom Boden anzuheben. Halte deinen Oberkörper während der gesamten Bewegung stabil und gerade.
  Senke deine Unterarme langsam wieder auf den Boden ab, indem du die Ellbogen beugst.
  Wiederhole die Bewegung nach Bedarf.
