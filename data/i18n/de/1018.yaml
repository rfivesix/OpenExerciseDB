name: Kopfneigen
description: |-
  Ausgangsposition:
  Sitze oder stehe mit aufrechtem Rücken.
  Schritte:

  Neige den Kopf langsam zu einer Seite und halte die Dehnung kurz.
  Bringe den Kopf in die neutrale Ausgangsposition zurück.
  Neige den Kopf zur anderen Seite und halte die Dehnung kurz.
  Bringe den Kopf wieder in die neutrale Position zurück.
  Wiederhole die Bewegung.
