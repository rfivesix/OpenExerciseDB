name: Sitzendes Rudern am Kabelzug mit V-Griff
description: 'Ausgangsposition:

  Setze dich an die Ruderzugstation, platziere die Füße fest auf den Trittflächen und beuge die Knie leicht. Greife den V-Griff im neutralen Griff, richte den Oberkörper aufrecht aus und halte den Rücken gerade mit leicht herausgedrückter Brust.


  Ausführung:

  Ziehe den V-Griff kontrolliert zum unteren Bauch / Bauchnabel heran, während du die Ellbogen eng am Körper nach hinten führst. Ziehe die Schulterblätter hinten fest zusammen und halte die Spitzenkontraktion für eine Sekunde. Führe das Gewicht langsam und mit gestreckten Armen wieder nach vorne zurück, bis du eine angenehme Dehnung im breiten Rückenmuskel spürst.


  Hinweise:

  Vermeide es, mit dem Oberkörper weit vor- und zurückzuschaukeln; halte den Rumpf stabil und ziehe rein aus der Rücken- und Armmuskulatur.'
