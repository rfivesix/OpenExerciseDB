name: Kindhaltung (Child's Pose)
description: 'Ausgangsposition: Knie dich auf eine Matte, öffne die Knie mattenbreit
  und lasse die großen Zehen sich berühren. Setze dein Gesäß auf den Fersen ab.

  Ausführung: Beuge den Oberkörper mit der Ausatmung nach vorne, lege den Bauch zwischen
  den Oberschenkeln ab und lege die Stirn sanft auf der Matte ab. Strecke die Arme
  weit nach vorne aus, Handflächen auf dem Boden.

  Hinweis: Atme tief in den Bauch und Rücken ein und lasse den Rücken, die Hüfte und
  die Schultern mit jeder Ausatmung entspannen und lang werden.'
