name: Einarmiger Latzug
description: |-
  Ausgangsposition:
  Setze dich an die Latzugmaschine und greife den Einzelgriff im neutralen Griff (Handfläche nach innen). Richte deinen Oberkörper auf, hebe die Brust an und fixiere die Schulterblätter stabil nach unten.

  Ausführung:
  1. Ziehe den Griff mit nach unten geführtem Ellbogen in einer kontrollierten Bahn zur oberen Brust bzw. zum Schlüsselbein herab.
  2. Halte die Kontraktion am tiefsten Punkt für 1 Sekunde und fokussiere dich auf die Anspannung im Latissimus.
  3. Führe den Griff langsam und kontrolliert wieder nach oben, bis dein Arm vollständig gestreckt ist und der Latissimus spürbar gedehnt wird.
  4. Absolviere alle Wiederholungen auf einer Seite und wechsle anschließend zum anderen Arm.

  Hinweise:
  Vermeide es, den Oberkörper zur Seite zu neigen oder zu verdrehen; halte die Schultern parallel.
