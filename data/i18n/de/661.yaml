name: Trizepsmaschine
description: '- Setze dich an die Trizepsmaschine und passe die Sitzhöhe so an, dass
  deine Ellenbogen auf Höhe des Drehgelenks der Maschine liegen.

  - Greife die Griffe fest und lege die Oberarme stabil auf das Polster.

  - Drücke die Griffe durch Streckung der Ellenbogen kontrolliert nach unten, ohne
  die Ellenbogen am Endpunkt ruckartig zu blockieren.

  - Führe das Gewicht langsam und kontrolliert wieder zurück, während die Oberarme
  fixiert auf dem Polster bleiben.'
