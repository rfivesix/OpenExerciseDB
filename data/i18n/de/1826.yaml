name: Band Pull-Apart mit Außenrotation
description: "Ausgangsposition:\nStehe aufrecht mit schulterbreitem Stand, Brust aufgerichtet\
  \ und Schultern nach hinten-unten gezogen. Halte ein leichtes Widerstandsband mit\
  \ beiden Händen im Untergriff (Handflächen nach oben) vor deinem Bauch. Beuge die\
  \ Ellenbogen im 90-Grad-Winkel und fixiere deine Oberarme eng an den Rippen.\n\n\
  Ausführung:\n1. Halte die Ellenbogen fest an deinen Körperseiten und drehe deine\
  \ Hände und Unterarme langsam nach außen voneinander weg, während du das Band spannst\
  \ (Außenrotation im Schultergelenk).\n2. Ziehe deine Schulterblätter am Endpunkt\
  \ aktiv nach hinten und unten zusammen.\n3. Halte die Endposition für 1 bis 2 Sekunden,\
  \ um die Muskeln der Rotatorenmanschette maximal zu aktivieren.\n4. Führe die Hände\
  \ langsam und kontrolliert wieder vor den Bauch zurück.\n\nHinweise:\nLass die Ellenbogen\
  \ stets fest am Oberkörper anliegen; die Bewegung stammt rein aus der Außenrotation\
  \ des Oberarmkopfes in der Schulterpfanne."
