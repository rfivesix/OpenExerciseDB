name: Knieheben im Stand (Standing Knee Raise)
description: 'Ausgangsposition:

  Stelle dich aufrecht hin, die Füße hüftbreit und die Arme locker an den Seiten oder zur Unterstützung im 90-Grad-Winkel vor dem Körper gehalten. Spanne die Bauchmuskeln leicht an.


  Ausführung:

  Hebe ein Knie kontrolliert nach oben, bis der Oberschenkel mindestens parallel zum Boden steht oder Hüfthöhe erreicht. Halte den Oberkörper dabei aufrecht und stabil auf dem Standbein. Senke den Fuß kontrolliert ab und hebe direkt das andere Knie. Führe die Bewegung im zügigen Wechsel aus.


  Hinweise:

  Vermeide es, dich beim Heben des Knies nach hinten zu lehnen oder den Rücken einzurunden; die Kraft kommt aus den Hüftbeugern und den unteren Bauchmuskeln.'
