name: Hantelscheiben-Crunch
description: |-
  Der Hantelscheiben-Crunch ist eine Variante des klassischen Crunchs, bei der eine Hantelscheibe als zusätzlicher Widerstand genutzt wird, um die Intensität zu steigern.

  Lege dich mit dem Rücken flach auf eine Matte, beuge die Knie und stelle die Füße flach auf den Boden.
  Halte eine Hantelscheibe sicher vor der Brust oder über dem Oberkörper.
  Hebe Schultern und oberen Rücken durch Beugen der Wirbelsäule vom Boden ab und spanne die Bauchmuskeln fest an.
  Senke den Oberkörper langsam wieder in die Ausgangsposition ab und wiederhole die Bewegung.
