name: Kabelzug-Seitheben
description: |-
  Ausgangsposition:
  Stelle dich seitlich neben einen niedrigen Kabelzug. Greife den Einhandgriff mit der abgewandten Hand vor dem Körper. Halte den Rumpf aufrecht und den Ellbogen leicht gebeugt.
  
  Ausführung:
  1. Hebe den Arm seitlich an, geführt durch den Ellbogen, bis die Hand etwa auf Schulterhöhe ist.
  2. Halte die Kontraktion am obersten Punkt kurz, ohne die Schulter nach oben zu den Ohren zu ziehen.
  3. Senke den Griff langsam und kontrolliert wieder in die Ausgangsposition ab.
  
  Hinweise:
  Führe die Bewegung mit dem Ellbogen an und ziehe die Schultern nicht hoch; halte den oberen Trapezmuskel ruhig.
