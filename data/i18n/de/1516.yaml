name: Handstand
description: 'Ausgangsposition:

  Gehe in die Hocke oder den Ausfallschritt und setze beide Hände schulterbreit mit
  gespreizten Fingern fest auf den Boden auf. Spanne den Rumpf an und fixiere den
  Blick zwischen deinen Händen.


  Ausführung:

  1. Schwinge ein Bein kontrolliert nach oben und drücke dich mit dem anderen Bein
  vom Boden ab, um in den Handstand zu gelangen.

  2. Drücke den Boden aktiv mit Händen und Schultern weg, spanne Bauch, Gesäß und
  Beine fest an und bilde von den Handgelenken bis zu den Zehenspitzen eine gerade
  Linie.

  3. Steuere die Balance über minimale Druckverlagerungen in den Fingerkuppen und
  Handballen.


  Hinweise:

  Vermeide ein extremes Hohlkreuz (Bananenform). Halte die Rippen eingezogen und den
  Rumpf fest auf Spannung.'
