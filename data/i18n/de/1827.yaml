name: Bauchpresse mit beiden Beinen
description: "Ausgangsposition:\nLege dich rücklings auf eine Matte. Hebe beide Beine\
  \ an und bringe Hüfte und Knie in einen 90-Grad-Winkel (Stufenbett- bzw. Tabletop-Position).\
  \ Drücke deinen unteren Rücken fest in die Matte. Lege deine Handflächen auf deine\
  \ Oberschenkel, unmittelbar oberhalb der Knie.\n\nAusführung:\n1. Drücke deine Hände\
  \ mit maximaler Kraft gegen deine Oberschenkel, während du gleichzeitig mit deinen\
  \ Oberschenkeln mit gleicher Kraft gegen die Hände drückst.\n2. Erzeuge eine intensive\
  \ isometrische Spannung in der gesamten Bauchmuskulatur (gerader und tiefer querer\
  \ Bauchmuskel).\n3. Halte diesen maximalen isometrischen Druck für 10 bis 15 Sekunden\
  \ aufrecht, während du ruhig und gleichmäßig weiteratmest.\n4. Löse die Spannung\
  \ langsam auf, pausiere kurz und wiederhole den Durchgang.\n\nHinweise:\nDer untere\
  \ Rücken darf sich zu keinem Zeitpunkt von der Matte abheben."
