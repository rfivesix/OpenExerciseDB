name: Sitzender Korkenzieher (Seated Corkscrew)
description: |-
  Ausgangsposition:
  Setze dich auf den Boden und stütze dich mit den Händen hinter dem Körper ab. Lehne den Oberkörper leicht zurück, hebe die Füße vom Boden ab und winkle die Knie leicht an.

  Ausführung:
  1. Ziehe die Knie kontrolliert heran und drehe sie dabei zur Seite ein, um die schrägen Bauchmuskeln maximal anzuspannen.
  2. Strecke die Beine wieder nach vorne aus, ohne die Füße auf dem Boden abzusetzen.
  3. Ziehe die Knie erneut heran und drehe sie zur gegenüberliegenden Seite ein.
  4. Wiederhole die Bewegung abwechselnd und flüssig von Seite zu Seite.

  Hinweise:
  Halte die Spannung in der Körpermitte während des gesamten Satzes aufrecht. Die kontrollierte Rotation des Beckens aktiviert gezielt die schräge Bauchmuskulatur.
