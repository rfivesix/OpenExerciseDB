name: Kabelrudern sitzend mit Dreiecksgriff
description: |-
  Ausgangsposition:
  Setze dich an die Kabelruderstation (Kabelzug unten) und befestige einen engen Parallelgriff (Dreiecksgriff / V-Bar). Stelle deine Füße auf die Fußstützen mit leicht gebeugten Knien. Greife den Griff, richte den Oberkörper auf und halte den Rücken gerade.

  Ausführung:
  1. Ziehe den Dreiecksgriff mit eng am Körper geführten Ellbogen in Richtung Bauchnabel.
  2. Führe die Schultern nach hinten unten und ziehe die Schulterblätter am Endpunkt maximal zusammen; halte für 1 Sekunde.
  3. Lasse das Gewicht langsam und kontrolliert nach vorne gleiten, bis die Arme gestreckt sind, ohne mit dem Oberkörper nach vorne einzusacken.

  Hinweise:
  Vermeide starkes Vor- und Zurückwippen des Oberkörpers; halte die Rumpfmuskulatur stabil.
