name: Reverse Plank
description: |-
  Setze dich auf den Boden und strecke die Beine nach vorne aus. Platziere die Hände hinter deinen Hüften mit den Fingern nach vorne zeigend auf dem Boden.
  Drücke dich über Handflächen und Fersen nach oben, sodass der Körper von den Schultern bis zu den Fersen eine gerade Linie bildet. Halte die Brust stolz, spanne Gesäß und Rumpf fest an und halte diese Position statisch.
