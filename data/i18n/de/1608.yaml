exercise_id: '1608'
language: de
status: ai_reviewed
name: Bizeps-Curl mit dem eigenen Körpergewicht
description: |-
  Positioniere dich unter einer geraden Stange (etwa auf Hüft- oder Brusthöhe). Greife die Stange mit den Handflächen zu dir zeigend (Untergriff), die Hände etwa schulterbreit auseinander. Lehne dich mit gestreckten Armen zurück, sodass dein Körper im Winkel zum Boden steht. Halte deine Ellbogen hoch und nah an der Stange und ziehe deinen Oberkörper zur Stange, indem du die Ellbogen beugst, ähnlich wie bei einem Bizeps-Curl. Senke dich kontrolliert wieder ab. Halte deinen Rumpf angespannt und die Bewegung langsam, um die Spannung auf den Bizeps zu maximieren.
