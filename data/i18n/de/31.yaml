language: de
status: ai_authored
name: Axe Hold
description: |-
  Ausgangsposition:
  Stelle dich aufrecht mit etwa schulterbreitem Stand hin. Spanne Bauch und Gesäß fest an. Halte in jeder Hand eine Kurzhantel seitlich am Körper.

  Bewegung:
  1. Hebe beide Kurzhanteln mit gestreckten (nur minimal im Ellbogen gebeugten) Armen seitlich an, bis die Arme parallel zum Boden auf Schulterhöhe sind.
  2. Halte diese isometrische Position (Axe Hold) so lange wie möglich, während du die seitliche Schultermuskulatur anspannst.
  3. Senke die Gewichte anschließend langsam und kontrolliert wieder ab.

  Hinweise:
  Ziehe die Schultern nicht zu den Ohren und halte den Oberkörper absolut aufrecht, ohne ins Hohlkreuz zu fallen.
