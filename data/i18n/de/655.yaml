name: Kurzhantel-Kickbacks
description: |-
  Positioniere dich an einer Flachbank wie beim einarmigen Kurzhantelrudern: Platziere ein Knie und eine Hand auf der Bank, während das andere Bein stabil auf dem Boden steht. Nimm die Kurzhantel in die freie Hand, sodass der Oberarm parallel zum Oberkörper anliegt und der Unterarm im 90-Grad-Winkel nach unten zeigt. Strecke nun den Arm ausschließlich über das Ellbogengelenk nach hinten durch und bringe das Gewicht kontrolliert nach oben.
