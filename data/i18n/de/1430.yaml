name: Plate Pinch Hold
description: |-
  Der Plate Pinch Hold ist eine Übung für die Griffkraft, die darauf ausgelegt ist, die Unterarme zu beanspruchen und die Griffausdauer zu verbessern. Wähle eine oder zwei Hantelscheiben aus (Scheiben mit glatten Kanten eignen sich am besten) und klemme sie zwischen deinem Daumen und deinen Fingern zusammen. Halte die Scheiben mit gestrecktem Arm seitlich an deinem Körper oder leicht nach vorne ausgestreckt. Halte den Griff so lange wie möglich, halte dabei deine Schultern entspannt und deinen Griff fest. Diese Übung kann auf Zeit oder auf Wiederholungen ausgeführt werden.
