name: Wandliegestütze
description: |-
  Ausgangsposition:
  Stelle dich etwa armlang vor eine stabile Wand. Platziere deine Hände flach an der Wand, etwas weiter als schulterbreit und auf Brusthöhe. Trete mit den Füßen einen Schritt nach hinten, sodass dein Körper von Kopf bis Fuß eine leichte Schräglage und eine feste gerade Linie bildet.

  Ausführung:
  1. Beuge die Ellbogen kontrolliert im ca. 45-Grad-Winkel zum Körper und senke die Brust langsam zur Wand ab, bis die Nase oder Brust die Wand fast berührt.
  2. Drücke dich kraftvoll und kontrolliert über die Handflächen von der Wand ab, bis die Arme wieder fast gestreckt sind.
  3. Halte während der gesamten Bewegung die Bauch- und Gesäßmuskulatur angespannt.

  Hinweise:
  Eine ideale Einsteiger-Progression zur Kräftigung von Brust, Schultern und Trizeps sowie zum Erlernen des Liegestütz-Bewegungsmusters.
