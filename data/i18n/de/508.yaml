name: Rudern
description: |-
  Im Krafttraining ist das Rudern (engl. "row", meist mit einem näher bestimmenden Adjektiv versehen, zum Beispiel sitzendes Rudern) eine Übung, deren Zweck es ist, die Muskeln zu stärken, die die Arme zum Körper ziehen (Latissimus), sowie jene, die die Schulterblätter zurückziehen (Trapezmuskel und Rhomboiden), und jene, die die Wirbelsäule stützen (Rückenstrecker). Wird das Rudern an einer Rudermaschine ausgeführt, trainiert es zusätzlich die Muskeln, die die Beine strecken und beugen (Quadrizeps und Beinbeuger). In allen Fällen müssen die Bauch- und unteren Rückenmuskeln eingesetzt werden, um den Körper zu stützen und Rückenverletzungen zu vermeiden.
