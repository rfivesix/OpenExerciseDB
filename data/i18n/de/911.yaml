name: Schrägbank-Skullcrusher
description: '- Setze dich auf eine etwa 30 bis 45 Grad geneigte Schrägbank und halte
  zwei Kurzhanteln mit gestreckten Armen senkrecht über deiner Brust.

  - Halte die Oberarme leicht nach hinten geneigt fixiert und beuge kontrolliert die
  Ellenbogen, um die Hanteln seitlich am Kopf vorbei abzusenken.

  - Spanne den Trizeps am tiefsten Punkt an und strecke die Ellenbogen wieder kraftvoll
  in die Ausgangsposition, ohne die Oberarme zu bewegen.'
