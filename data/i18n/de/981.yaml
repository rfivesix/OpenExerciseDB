name: Step-ups (Aufsteiger)
description: 'Ausgangsposition: Stehe aufrecht vor einer stabilen Bank, Box oder Stufe
  mit hüftbreitem Stand.

  Ausführung: Setze den gesamten rechten Fuß auf die Erhöhung. Drücke dich kraftvoll
  über die rechte Ferse nach oben, bis das rechte Bein gestreckt ist.

  Rückkehr: Steige kontrolliert mit dem linken Fuß zuerst und danach mit dem rechten
  Fuß wieder auf den Boden ab.

  Hinweis: Halte den Oberkörper aufrecht und hole so wenig Schwung wie möglich mit
  dem hinteren Bein.'
