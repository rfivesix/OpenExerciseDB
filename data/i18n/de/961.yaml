name: 50m-Schwimmsprints
description: 'Ausgangsposition: Starte an der Beckenwand mit Vorbereitung auf einen
  kraftvollen Abstoß.

  Ausführung: Schwimme 50 Meter im maximalen Sprinttempo (üblicherweise Kraulschwimmen)
  mit hoher Zugfrequenz und starkem Beinschlag.

  Ablauf: Die Sprints werden im festen Intervall ausgeführt (z. B. auf 1 Minute Abgang).
  Die verbleibende Zeit des Intervalls nach Anschlag dient als Erholungspause vor
  dem nächsten Sprint.

  Hinweis: Halte die Wasserlage auch bei maximaler Anstrengung so stromlinienförmig
  wie möglich.'
