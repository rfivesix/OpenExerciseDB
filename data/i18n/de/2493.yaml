name: Adduktoren-Seitstütz
description: |-
  Lege dich im 90°-Winkel zur Bank auf die Seite. Platziere das obere Bein mit der Wadeninnenseite auf der Bank. Führe das untere Bein unter die Bank. Stütze dich auf den bodennahen Unterarm im 90°-Winkel (Unterarmstütz). Drücke dich vom Boden ab, sodass der gesamte Körper eine gerade Linie bildet, auf einer Höhe mit der Bank. Halte diese Position.
