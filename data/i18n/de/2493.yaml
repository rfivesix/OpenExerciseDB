name: Adduktoren-Seitstütz (Copenhagen Plank)
description: |-
  Ausgangsposition:
  Lege dich seitlich neben eine Flachbank. Lege das obere Bein mit der Innenseite des Unterschenkels bzw. Fußes flach auf die Bank. Das untere Bein liegt frei unterhalb der Bank. Stütze deinen Oberkörper auf den bodennahen Unterarm im 90-Grad-Winkel unter der Schulter ab.

  Ausführung:
  1. Drücke dich über den Unterarm und die Oberschenkelinnenseite des oberen Beins kraftvoll vom Boden ab.
  2. Hebe das Becken an, bis dein gesamter Körper von Kopf bis Fuß eine gerade Linie bildet, genau auf Höhe der Bank.
  3. Hebe das untere Bein leicht an, sodass es parallel knapp unter der Bank schwebt.
  4. Halte diese isometrische Position für die angegebene Zeit stabil und wechsle anschließend die Seite.

  Hinweise:
  Halte das Becken aufgerichtet und lasse die Hüfte nicht nach unten durchhängen. Eine der effektivsten Übungen zur Kräftigung der Adduktoren und lateralen Rumpfstabilität.
