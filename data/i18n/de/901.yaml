name: Hip Thrust mit Langhantel
description: '- Setze dich mit dem oberen Rücken gegen eine stabile Hantelbank und
  platziere eine gepolsterte Langhantel über deiner Hüftfalte.

  - Stelle deine Füße etwa schulterbreit flach auf den Boden, sodass die Schienbeine
  am obersten Punkt senkrecht zum Boden stehen.

  - Drücke die Hüfte explosiv über die Fersen nach oben, indem du die Gesäßmuskeln
  fest anspannst, bis Oberschenkel und Oberkörper eine gerade Linie bilden.

  - Halte die Kontraktion am oberen Punkt für eine Sekunde und senke das Becken kontrolliert
  wieder ab.'
