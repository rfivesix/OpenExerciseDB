name: Crunches an Negativbank
description: |-
  Der Ablauf der Übung ist im Prinzip wie bei normalen Crunches, nur legst du dich auf eine Negativbank. Fixiere deine Beine in den Polstern, um nicht abzurutschen. Halte die Hände an den Schläfen oder hinter dem Kopf. Hebe aus dieser Position den Oberkörper mit einer rollenden Bewegung kontrolliert an, bis sich die Schulterblätter und der obere Rücken von der Bank lösen.
  Senke den Oberkörper langsam wieder ab. Ein Hohlkreuz ist stets zu vermeiden.
