name: Deadbug
description: |-
  Lege dich auf den Rücken, die Hüfte und Knie im 90°-Winkel gebeugt und die Arme zur Decke gestreckt. Drücke deinen unteren Rücken fest in den Boden. Senke langsam ein Bein nach vorne ab und tippe mit der Ferse kurz auf den Boden, während der untere Rücken stabil am Boden bleibt. Führe das Knie kontrolliert zurück in die Ausgangsposition und wechsle die Seite. Erschwere die Übung, indem du den gegenüberliegenden Arm und das Bein gleichzeitig absenkst.
