name: Deadbug
description: |-
  Lege dich auf den Rücken, Hüfte und Knie um 90° gebeugt. Hebe beide Arme zur Decke. Drücke deinen unteren Rücken in den Boden, um den Spalt zu schließen. Beginne, indem du ein Bein nach vorne ausstreckst und die Ferse auf dem Boden auftippst. „Während du ein Bein streckst, atme so weit wie möglich aus und halte deinen unteren Rücken fest am Boden“, sagt Dunham. Wenn du nicht weiter ausatmen kannst, ziehe das Knie zurück in die Ausgangsposition. Erschwere die Übung, indem du Gewicht in den Händen hältst oder den gegenüberliegenden Arm und das gegenüberliegende Bein absenkst.
