name: Kettlebell-Kreuzheben
description: 'Ausgangsposition: Stelle dich hüft- bis schulterbreit hin, die Kettlebell
  steht mittig zwischen deinen Füßen auf Höhe der Knöchel.

  Ausführung: Schiebe die Hüfte nach hinten, beuge die Knie leicht und greife den
  Kettlebell-Griff mit beiden Händen bei geradem Rücken. Drücke dich kraftvoll über
  die Fersen ab und strecke die Hüfte nach vorne, um dich vollständig aufzurichten.
  Spanne das Gesäß am höchsten Punkt fest an.

  Rückkehr: Schiebe die Hüfte wieder nach hinten und senke die Kettlebell kontrolliert
  am Körper entlang auf den Boden ab.

  Hinweis: Halte die Wirbelsäule während der gesamten Bewegung neutral und vermeide
  einen Rundrücken.'
