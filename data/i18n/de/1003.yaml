name: Kettlebell Kreuzheben
description: |-
  Ausgangsposition:
  Stelle dich hüftbreit hin, die Kettlebell befindet sich mittig zwischen deinen Knöcheln. Der Rücken ist gerade, der Blick nach vorne gerichtet.
  Schritte:

  Beuge dich in der Hüfte und gehe leicht in die Knie, um die Hände an den Kettlebell-Griff zu legen. Der Rücken bleibt während der Ausführung gerade.
  Greife den Griff der Kettlebell und baue Spannung im Oberkörper auf.
  Spanne Bauch und Gesäß an und richte dich kontrolliert auf.
  Beuge dich wieder in der Hüfte, um die Kettlebell wieder kontrolliert nach unten zu führen.
  Wiederhole den Vorgang ab Schritt 3.

  Tipps:

  Achte auf eine korrekte Bewegungsausführung, um Verletzungen zu vermeiden: Führe die Bewegung aus der Hüfte aus (Hinge) statt einer reinen Kniebeuge, runde den Rücken nicht beim Greifen der Kettlebell und überstrecke die Wirbelsäule beim Aufstehen nicht nach hinten.
