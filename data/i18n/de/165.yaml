name: Knee Tuck auf dem Gymnastikball
search_terms:
- Crunch am TRX Oder Auf Ball
- Ball Roll-in
- Swiss Ball Jackknife
description: |-
  Ausgangsposition:
  Begib dich in eine Liegestützposition (Plank) mit den Händen schulterbreit flach auf dem Boden und platziere deine Schienbeine oder Fußrücken oben auf einem Gymnastikball (oder in TRX-Schlingen). Der Körper bildet eine stabile, gerade Linie.

  Bewegung:
  1. Ziehe die Knie kontrolliert nach vorne in Richtung deiner Brust, indem du die Bauchmuskeln anspannst und das Becken leicht einrollst, sodass der Ball nach vorne rollt.
  2. Halte die maximale Kontraktion im Bauch für eine Sekunde.
  3. Rolle den Ball langsam und kontrolliert wieder nach hinten zurück, bis dein Körper wieder in der gestreckten Plank-Position ist.

  Hinweise:
  Lasse die Hüfte in der Ausgangsposition nicht durchhängen und halte die Schultern stabil direkt über den Händen.
