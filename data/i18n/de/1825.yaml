name: Reverse Flys auf Schrägbank mit Brustauflage
description: "Ausgangsposition:\nStelle eine verstellbare Hantelbank auf eine Schrägstellung\
  \ von etwa 30 bis 45 Grad ein. Lege dich mit der Brust flach auf das Polster, sodass\
  \ der Kopf über das Kopfende ragt und die Füße stabil auf dem Boden stehen. Halte\
  \ in jeder Hand eine leichte Kurzhantel mit neutralem oder leicht pronierendem Griff\
  \ (Daumen leicht nach oben gedreht), Arme hängen senkrecht nach unten.\n\nAusführung:\n\
  1. Hebe die Kurzhanteln mit fast gestreckten Armen (minimale Ellenbogenbeugung)\
  \ in einem weiten Bogen nach oben und schräg außen an (Y-Form).\n2. Führe die Bewegung\
  \ über die hintere Schultermuskulatur (Deltamuskel Pars posterior) und ziehe am\
  \ obersten Punkt die Schulterblätter zusammen.\n3. Halte die Spitzenkontraktion\
  \ für 1 Sekunde auf Schulterhöhe.\n4. Senke die Hanteln langsam und kontrolliert\
  \ wieder ab, ohne Schwung zu nutzen.\n\nHinweise:\nDurch die Brustauflage wird jeglicher\
  \ Schwung aus den Beinen und dem unteren Rücken eliminiert, was eine optimale Isolation\
  \ der hinteren Schulter ermöglicht."
