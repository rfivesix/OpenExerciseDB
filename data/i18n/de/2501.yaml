name: Tisch-Körpergewichtsrudern (Inverted Row)
description: |-
  Ausgangsposition:
  Lege dich rücklings unter einen stabilen, schweren Tisch. Fasse die Tischkante mit beiden Händen etwa schulterbreit im Obergriff oder neutralen Griff. Setze deine Fersen auf den Boden und spanne Gesäß und Bauch fest an, sodass der Körper eine gerade Linie bildet.

  Ausführung:
  1. Ziehe deinen Brustkorb kraftvoll nach oben zur Unterkante der Tischplatte, indem du die Ellbogen nach hinten führst.
  2. Ziehe am höchsten Punkt die Schulterblätter aktiv zusammen und halte die Spannung für 1 Sekunde.
  3. Senke den Körper langsam und kontrolliert wieder ab, bis deine Arme fast vollständig gestreckt sind.

  Hinweise:
  Stelle unbedingt sicher, dass der Tisch standsicher und ausreichend schwer ist, um ein Umkippen auszuschließen. Mit gebeugten Knien und flachen Füßen lässt sich die Intensität verringern.
