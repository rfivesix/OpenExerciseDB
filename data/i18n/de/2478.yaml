name: Glute-Ham-Raise (GHR)
description: |-
  Ausgangsposition:
  Positioniere dich auf einem Glute-Ham-Developer (GHD). Platziere deine Knie auf dem halbrunden Polster und fixiere deine Fersen und Knöchel sicher zwischen den Rollen und der Fußplatte. Der Oberkörper ist aufgerichtet und bildet mit den Oberschenkeln eine gerade Linie.

  Ausführung:
  1. Senke deinen Oberkörper langsam und mit voller Kontrolle nach vorne ab, indem du die Knie streckst, bis dein Körper parallel zum Boden ist.
  2. Spanne deine Beinbeuger (Hamstrings) und die Gesäßmuskulatur kraftvoll an, um die Knie zu beugen und den Oberkörper wieder in die Ausgangsposition nach oben zu ziehen.
  3. Halte die Hüfte während der gesamten Bewegung gestreckt und vermeide ein Abknicken im Becken.

  Hinweise:
  Nutze die Hände bei Bedarf für eine leichte Unterstützung am tiefsten Punkt, falls die Kraft der Beinbeuger noch nicht für den vollen Bewegungsradius ausreicht.
