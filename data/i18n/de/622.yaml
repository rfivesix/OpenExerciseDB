name: Stehendes Wadenheben
description: |-
  Platziere deine Fußballen auf der Trittfläche des Geräts, sodass du deine Fersen für eine volle Dehnung der Wadenmuskulatur weit nach unten absenken kannst. Halte den Körper aufrecht, vermeide ein Hohlkreuz und halte die Beine fast gestreckt.
  Drücke dich über die Fußballen so weit wie möglich nach oben. Halte am obersten Punkt für 1–2 Sekunden die Spannung und senke die Fersen langsam wieder ab.
