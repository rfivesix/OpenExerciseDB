name: Beinheben an der Klimmzugstange
description: 'Ausgangsposition: Hänge dich mit gestreckten Armen im festen Griff an
  die Klimmzugstange. Die Schultern sind aktiv stabilisiert und der Körper hängt ruhig.

  Ausführung: Hebe die ausgestreckten Beine kontrolliert an, bis sie mindestens einen
  90°-Winkel mit dem Oberkörper bilden oder höher reichen. Ziehe das Becken aktiv
  nach oben ein.

  Rückkehr: Senke die Beine langsam und kontrolliert wieder ab, ohne in ein Hohlkreuz
  zu verfallen oder Schwung aufzubauen.

  Hinweis: Vermeide jegliches Pendeln des Körpers; die Bewegung wird rein aus der
  Bauchmuskulatur gesteuert.'
