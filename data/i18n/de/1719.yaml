name: Einarmiger Latzug im halben Kniestand
description: |-
  Ausgangsposition:
  Bringe den Kabelzug in eine hohe Position und befestige einen Einhandgriff. Gehe vor dem Gerät in den halben Kniestand (das Knie der ziehenden Seite ist am Boden, das andere Bein vorne aufgestellt). Greife den Griff mit nach oben gestrecktem Arm.
  
  Ausführung:
  1. Ziehe den Griff kontrolliert nach unten zur Schulter, indem du den Ellbogen senkrecht nach unten zur Hüfte führst.
  2. Spanne den Latissimus am tiefsten Punkt intensiv an.
  3. Lasse den Arm langsam und kontrolliert wieder nach oben steigen, bis eine angenehme Dehnung im Rücken spürbar ist.
  
  Hinweise:
  Halte den Oberkörper aufrecht und fest angespannt. Der halbe Kniestand stabilisiert das Becken und verhindert Ausweichbewegungen.
