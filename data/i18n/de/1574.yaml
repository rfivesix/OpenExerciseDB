name: Schwimmen
description: 'Ausgangsposition:

  Begib dich ins Wasser und richte dich für das Bahnenschwimmen im gewünschten Schwimmstil
  (z. B. Kraulschwimmen oder Brustschwimmen) ein.


  Ausführung:

  1. Schwimme kontinuierlich in einem gleichmäßigen, rhythmischen Tempo über die festgelegte
  Distanz oder Zeit.

  2. Nutze einen sauberen Armzug aus Latissimus und Schultern sowie einen kontinuierlichen
  Beinschlag für den Vortrieb.

  3. Halte eine stromlinienförmige Wasserlage und atme rhythmisch im Takt der Schwimmzüge.


  Hinweise:

  Hervorragendes, extrem gelenkschonendes Herz-Kreislauf- und Ausdauertraining, das
  die gesamte Rücken-, Schulter- und Rumpfmuskulatur beansprucht.'
