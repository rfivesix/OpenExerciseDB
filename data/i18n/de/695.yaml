name: Latzug mit V-Griff
description: '- Befestige einen engen V-Griff am Latzug und stelle das Oberschenkelpolster
  so ein, dass du festen Halt hast.

  - Fasse den V-Griff im neutralen Griff (Handflächen zueinander) und richte deinen
  Oberkörper auf, die Brust leicht gehoben.

  - Ziehe den Griff kontrolliert zur oberen Brust, indem du die Ellenbogen eng am
  Körper nach unten und hinten führst.

  - Spanne den Latissimus am tiefsten Punkt kräftig an und führe das Gewicht langsam
  wieder in die vollständige Streckung zurück.'
