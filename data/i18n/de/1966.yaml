name: Brustwirbelsäulen-Rotation im halben Kniestand
description: 'Ausgangsposition:

  Begib dich seitlich neben eine Wand in den halben Kniestand. Das wandnahe Bein ist vorne im 90-Grad-Winkel aufgestellt, das hintere Knie ruht auf einer Matte. Klemme optional einen Schaumstoffball oder eine Faszienrolle zwischen das vordere Knie und die Wand, um das Becken zu fixieren. Strecke beide Arme auf Schulterhöhe nach vorne aus.


  Ausführung:

  Führe den wandfernen Arm in einem weiten horizontalen Bogen nach hinten auf, während du den Kopf und den Brustkorb mitdrehst. Die Hüfte und das vordere Knie bleiben dabei vollkommen unverändert nach vorne ausgerichtet. Halte die maximale Dehnposition in der Brustwirbelsäule für 1–2 Sekunden und führe den Arm langsam wieder nach vorne. Absolviere alle Wiederholungen auf einer Seite und wechsle dann.


  Hinweise:

  Durch die Fixierung des vorderen Knies an der Wand kann die Lendenwirbelsäule nicht kompensieren, sodass die Rotation gezielt und sicher in der Brustwirbelsäule stattfindet.'
