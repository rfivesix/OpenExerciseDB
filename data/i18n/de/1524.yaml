name: Battle Ropes
description: 'Ausgangsposition:

  Stelle dich schulterbreit hin, beuge Knie und Hüfte leicht in eine stabile sportliche
  Grundhaltung. Halte die Enden der Battle Ropes mit neutralem Griff vor den Hüften.


  Ausführung:

  1. Bewege die Arme abwechselnd (oder gleichzeitig) explosiv auf und ab, sodass sich
  gleichmäßige Wellen durch die Seile bis zur Verankerung fortsetzen.

  2. Halte den Rumpf fest angespannt und den Oberkörper stabil, ohne ins Hohlkreuz
  zu fallen.

  3. Führe die Bewegung über die vorgegebene Zeitdauer mit hoher Frequenz und maximalem
  Krafteinsatz aus.


  Hinweise:

  Intensives Ganzkörper-Konditionstraining zur Stärkung der Schultermuskulatur, der
  Rumpfstabilität und des Herz-Kreislauf-Systems.'
