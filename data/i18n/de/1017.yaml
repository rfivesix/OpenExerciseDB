exercise_id: '1017'
language: de
status: ai_reviewed
name: Nacken-Halbkreise
description: |-
  Ausgangsposition:
  Sitze oder stehe aufrecht mit entspannten Schultern. Neige den Kopf sanft zu einer Schulter (z. B. rechtes Ohr zur rechten Schulter).

  Ausführung:
  1. Rolle den Kopf langsam nach vorne unten, sodass das Kinn in einem Halbkreis vor der Brust zur linken Schulter wandert.
  2. Kehre auf demselben Weg langsam und kontrolliert über die Brust zurück zur rechten Schulter.
  3. Führe diese pendelnde Halbkreisbewegung fließend und ohne Rucken durch. Der Kopf wird dabei nicht nach hinten überstreckt.
