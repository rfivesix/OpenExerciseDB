name: Beinstrecker (Leg Extension)
description: |-
  Der Beinstrecker ist eine Krafttrainingsübung mit Widerstand, die auf die vordere Oberschenkelmuskulatur (Quadrizeps) abzielt. Die Übung wird an einer Maschine namens Beinstrecker-Maschine ausgeführt. Es gibt verschiedene Hersteller dieser Maschinen und jede ist ein wenig anders. Die meisten Fitnessstudios und Krafträume haben die Maschine in ihrer Einrichtung. Der Beinstrecker ist eine isolierte Übung, die auf eine spezifische Muskelgruppe abzielt, den Quadrizeps. Er sollte nicht als komplettes Beintraining betrachtet werden, wie etwa die Kniebeuge oder das Kreuzheben. Die Übung besteht darin, das Bein im Knie zu beugen und die Beine zu strecken und sie anschließend wieder in die Ausgangsposition abzusenken.
