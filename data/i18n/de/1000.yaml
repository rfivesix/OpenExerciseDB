name: Dips am Boden
description: 'Ausgangsposition: Setze dich auf den Boden, stelle die Füße flach auf
  und winkle die Knie an. Platziere die Hände knapp hinter deinen Hüften auf dem Boden,
  die Finger zeigen nach vorne zu den Füßen. Hebe das Gesäß einige Zentimeter vom
  Boden an.

  Ausführung: Beuge die Ellbogen kontrolliert nach hinten und senke das Gesäß in Richtung
  Boden ab.

  Rückkehr: Drücke dich kraftvoll über die Handflächen wieder nach oben, bis die Arme
  gestreckt sind, und spanne den Trizeps intensiv an.

  Hinweis: Die Bewegung erfolgt primär aus den Ellbogengelenken und dem Trizeps, nicht
  durch ein Heben und Senken der Hüfte.'
