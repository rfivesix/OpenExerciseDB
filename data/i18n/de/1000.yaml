name: Dips am Boden
description: |-
  Ausgangsposition:
  Setze dich auf den Boden und stütze dich mit den Händen hinter dem Körper ab. Die Finger zeigen nach vorne. Die Knie sind gebeugt, die Füße stehen nebeneinander auf dem Boden.
  Schritte:

  Hanthalte Körperspannung, hebe die Hüfte leicht vom Boden ab und strecke die Arme.
  Beuge die Ellbogen kontrolliert nach hinten und senke die Hüfte ab.
  Drücke dich über den Trizeps wieder nach oben in die Ausgangsposition.
  Wiederhole die Bewegung.

  Hinweis:
  Der Schwierigkeitsgrad lässt sich darüber variieren, wie weit die Hüfte angehoben wird.
