name: Schulterbreite Dreipunkt-Liegestütze
description: |-
  Geh in die Liegestützposition, deine Schultern befinden sich direkt über den Händen, deine Füße sind hüftbreit voneinander entfernt. Zieh den Bauchnabel in Richtung Wirbelsäule und spann die Bauchmuskulatur an. Hebe deinen linken Fuß etwa fünf Zentimeter vom Boden an. Die Zehen zeigen gerade nach unten. Bewege dabei nicht deine Hüften. Dein Körper bildet während der ganzen Übung eine gerade Linie vom Kopf bis zu den Fersen. Nun beuge die Ellbogen, senke deinen Brustkorb bis zum Boden ab und drück dich wieder nach oben. Wiederhole die Übung auf der anderen Seite.
