name: Dreipunkt-Liegestütze
description: |-
  Ausgangsposition:
  • Begib dich in die reguläre Liegestützposition mit den Händen direkt unter den Schultern.
  • Hebe einen Fuß etwa fünf bis zehn Zentimeter vom Boden ab, sodass du den Körper auf drei Punkten abstützt.
  • Halte das Becken waagerecht und die Bauchmuskeln fest angespannt.

  Ausführung:
  • Beuge die Ellbogen und senke die Brust kontrolliert in Richtung Boden ab.
  • Halte den gesamten Körper wie ein Brett stabil, ohne das Becken zur Seite wegzudrehen.
  • Drücke dich über die Hände kraftvoll wieder nach oben in die Ausgangsposition zurück.
  • Wiederhole die gewünschte Anzahl an Wiederholungen und wechsle das angehobene Bein.
