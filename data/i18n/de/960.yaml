name: Kettlebell Swing
description: 'Ausgangsposition: Stehe etwas mehr als schulterbreit mit der Kettlebell
  etwa einen Fuß vor dir auf dem Boden. Beuge die Hüfte nach hinten bei geradem Rücken
  und greife den Griff mit beiden Händen.

  Ausführung: Schwinge die Kettlebell nach hinten zwischen die Beine durch. Strecke
  die Hüfte explosionsartig nach vorne, spanne Gesäß und Oberschenkel maximal an und
  lasse die Kugel durch den Hüftimpuls bis auf Brusthöhe steigen.

  Rückkehr: Lasse die Kettlebell kontrolliert zurückschwingen, fange das Gewicht durch
  ein Beugen in der Hüfte ab und gehe fließend in die nächste Wiederholung über.

  Hinweis: Die Kraft kommt ausschließlich aus dem Hüftstoß (Hip Hinge) und dem Gesäß,
  nicht aus den Armen oder Schultern.'
