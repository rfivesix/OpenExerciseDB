name: Kniebeuge an der Multipresse
description: "Ausgangsposition:\nStelle dich unter die geführte Stange der Multipresse\
  \ und lege sie auf den oberen Trapezmuskel. Positioniere die Füße schulterbreit\
  \ und platziere sie einige Zentimeter vor der vertikalen Stangenlinie, um den Druck\
  \ auf die Knie zu minimieren und die Belastung optimal auf Quadrizeps und Gesäß\
  \ zu verteilen. Entriegele die Stange durch eine leichte Drehung der Handgelenke.\n\
  \nAusführung:\n1. Atme tief ein, halte den Rumpf stabil und beuge Hüfte und Knie\
  \ kontrolliert, um den Körper abzusenken.\n2. Gehe so tief, bis die Oberschenkel\
  \ mindestens parallel zum Boden sind.\n3. Drücke dich kraftvoll über die gesamte\
  \ Fußfläche, vor allem über die Fersen, wieder nach oben in den aufrechten Stand.\n\
  4. Halte die Knie am obersten Punkt leicht gebeugt und wiederhole die Bewegung.\n\
  \nHinweise:\nDurch die vorgegebene Bewegungsbahn kannst du deine Fußposition variieren,\
  \ um unterschiedliche Schwerpunkte auf Quadrizeps oder Gesäß zu setzen."
