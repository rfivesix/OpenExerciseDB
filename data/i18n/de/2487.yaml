name: Ausschwimmen (Cool-Down)
description: |-
  Ausgangsposition:
  Bleibe nach Abschluss der Trainingseinheit im Wasser und bereite dich auf ein lockeres Ausklingen vor.

  Ausführung:
  1. Schwimme in einem sehr leichten, völlig unbeschwerten Tempo eine lockere Distanz (z. B. 100 bis 200 Meter).
  2. Wechsle beliebig zwischen Kraul, Rückenschwimmen oder entspanntem Brustschwimmen ab.
  3. Konzentriere dich auf lange Züge, entspanntes Gleiten und eine tiefe, beruhigende Atmung.

  Hinweise:
  Verzichte komplett auf Technikdrills oder Tempovorgaben; das Ziel ist der Abbau von Stoffwechselprodukten und die schrittweise Senkung der Herzfrequenz.
