exercise_id: '1582'
language: de
status: ai_reviewed
name: Innenrotation in Seitenlage
description: |-
  Ausgangsposition:
  Lege dich seitlich auf eine Flachbank. Verwende den unteren Arm (der der Bank am nächsten ist). Platziere den Oberarm stabil am Körper oder auf der Bank und beuge den Ellbogen im 90-Grad-Winkel. Halte eine leichte Kurzhantel in der Hand.

  Ausführung:
  Lasse das Gewicht kontrolliert an der Bank vorbei nach unten in Richtung Boden sinken, soweit es die Schultermobilität schmerzfrei erlaubt. Rotiere den Unterarm anschließend über die Schulterinnenrotation wieder nach oben in Richtung Bauch bzw. gegenüberliegende Schulter.

  Hinweise:
  - Führe die Bewegung langsam und mit geringem Gewicht aus, um die Muskeln der Rotatorenmanschette gezielt anzusteuern.
  - Halte den Ellbogen während der gesamten Ausführung stabil gebeugt.
