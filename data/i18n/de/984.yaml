name: Ausfallschritte (Lunges)
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand und aufgerichtetem
  Oberkörper. Die Hände können in die Hüften gestützt oder vor der Brust gehalten
  werden.

  Ausführung: Mache einen weiten Schritt nach vorne. Senke das Becken kontrolliert
  ab, bis beide Knie etwa einen 90-Grad-Winkel bilden und das hintere Knie kurz über
  dem Boden schwebt.

  Rückkehr: Drücke dich über die Ferse des vorderen Fußes kraftvoll zurück in den
  aufrechten Stand.

  Hinweis: Halte den Oberkörper gerade und achte darauf, dass das vordere Knie nicht
  nach innen kippt.'
