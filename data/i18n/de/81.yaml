name: Einarmiges Kurzhantelrudern
search_terms:
- KH Rudern
- Rudern Einarmig KH
- Einarmiges Rudern mit Kurzhantel
description: |-
  Ausgangsposition:
  Platziere das Knie und die Hand einer Körperseite auf einer Flachbank, sodass der Oberkörper etwa parallel zum Boden ausgerichtet ist. Das andere Bein steht seitlich stabil auf dem Boden. Halte in der freien Hand eine Kurzhantel mit gestrecktem Arm nach unten.

  Bewegung:
  1. Ziehe die Kurzhantel eng am Körper entlang nach oben in Richtung Hüfte, indem du den Ellbogen nach hinten oben führst.
  2. Ziehe am obersten Punkt das Schulterblatt aktiv zur Wirbelsäule und halte die Kontraktion kurz.
  3. Senke das Gewicht langsam und kontrolliert wieder nach unten ab, bis der Latissimus voll gedehnt ist.

  Hinweise:
  Halte den Rücken gerade und verdrehe den Oberkörper während des Zugs nicht. Nach Beendigung des Satzes Seite wechseln.
