- Indoor Cycling
- Ergometer
description: |-
  Ausgangsposition:
  Stelle die Sattelhöhe deines Fahrrads oder Ergometers so ein, dass das Knie am tiefsten Punkt der Kurbelumdrehung noch leicht gebeugt ist (ca. 25–35 Grad). Halte den Lenker mit entspannten Schultern und geradem Rücken.

  Bewegung:
  1. Trete gleichmäßig und rhythmisch in die Pedale.
  2. Achte auf einen runden Tritt, bei dem du sowohl nach unten drückst als auch aktiv über den Totpunkt führst.
  3. Halte eine gleichmäßige Trittfrequenz (Kadenz) und wähle den Widerstand entsprechend deinem Trainingsziel.

  Hinweise:
  Vermeide es, im Sattel von Seite zu Seite zu wiegen. Halte den Rumpf stabil und atme gleichmäßig.
