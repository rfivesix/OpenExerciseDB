language: de
status: ai_reviewed
name: Prisoner Squat
description: |-
  Ausgangsposition:
  • Stelle dich schulterbreit hin, die Fußspitzen zeigen leicht nach außen.
  • Lege deine Hände an den Hinterkopf mit verschränkten Fingern und ziehe die Ellbogen weit nach außen.
  • Richte den Oberkörper auf, hebe das Brustbein an und ziehe die Schulterblätter zusammen.

  Ausführung:
  • Schiebe die Hüfte nach hinten-unten und beuge die Knie, bis die Oberschenkel mindestens parallel zum Boden sind.
  • Halte den Oberkörper so aufrecht wie möglich und die Ellbogen konsequent weit nach hinten geöffnet.
  • Drücke dich über die Fersen kraftvoll wieder nach oben in den aufrechten Stand und spanne das Gesäß an.
