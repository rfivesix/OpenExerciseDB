name: Schulter-Dislokationen (mit Band oder Stab)
description: |-
  Ausgangsposition:
  Stehe aufrecht mit schulterbreitem Stand. Halte ein Widerstandsband, ein Handtuch oder einen Besenstiel mit weitem Obergriff vor deinem Körper mit gestreckten Armen.

  Ausführung:
  1. Führe die gestreckten Arme in einem weiten Bogen kontrolliert nach oben über den Kopf.
  2. Rotiere die Schultern weiter nach hinten, bis das Band oder der Stab hinter dem Rücken die Gesäßhöhe erreicht.
  3. Halte die Ellenbogen durchgestreckt und überstrecke die Lendenwirbelsäule nicht.
  4. Führe die Arme auf demselben Weg kontrolliert über den Kopf zurück nach vorne vor den Körper.
  5. Wähle den Griff so weit, dass die Bewegung schmerzfrei und ohne Abknicken der Ellenbogen gelingt.
