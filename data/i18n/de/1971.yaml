name: Mentzer-Latzug
description: |-
  Ausgangsposition:
  Setze dich an die Latzugstation und stelle das Oberschenkelpolster so ein, dass deine Oberschenkel fest fixiert sind. Greife die Latzugstange im engen Untergriff (Kammgriff/supiniert, Handflächen zum Gesicht), etwa schulterbreit oder etwas enger.

  Ausführung:
  1. Ziehe die Stange mit aufrechter Brust und nach unten gezogenen Schulterblättern kontrolliert nach unten zur oberen Brust.
  2. Halte die Spitzenkontraktion am tiefsten Punkt für 1 bis 2 Sekunden und spanne Latissimus und Bizeps maximal an.
  3. Führe die Stange langsam und kontrolliert über die volle Bewegungsamplitude wieder nach oben, bis deine Arme gestreckt sind.

  Hinweise:
  Nutze den engen Untergriff gezielt für eine starke Kraftübertragung über den Bizeps, um den Latissimus ohne Schwung intensiv zu belasten.
