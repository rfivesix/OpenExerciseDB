name: Latzug mit Rücklage
description: |-
  Setze dich an den Latzugturm, fixiere die Oberschenkel unter den Polstern und greife die Latzugstange etwas mehr als schulterbreit. Lehne den Oberkörper leicht nach hinten (ca. 20–30 Grad) und ziehe die Stange kontrolliert zum oberen Brustbereich, während du die Schulterblätter aktiv nach hinten-unten ziehst. Führe das Gewicht langsam wieder nach oben zurück.
