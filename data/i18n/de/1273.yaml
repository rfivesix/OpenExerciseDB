name: Kurzhantel-Überzug
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Flachbank (entweder längs oder quer mit dem oberen Rücken). Platziere deine Füße stabil auf
  dem Boden. Halte eine Kurzhantel mit beiden Händen an der Innenseite der oberen Gewichtsscheibe mit leicht angewinkelten
  Armen senkrecht über deiner Brust.


  Ausführung:

  1. Senke die Kurzhantel bei unverändert leicht angewinkelten Ellbogen langsam in einem weiten Bogen hinter deinen Kopf ab,
  bis du eine angenehme Dehnung in Brust und Latissimus spürst.

  2. Führe die Hantel aus der Kraft der Brust- und Latissimusmuskeln auf demselben Weg kontrolliert zurück über deine Brust.

  3. Halte die Kontraktion oben kurz an und wiederhole die Bewegung.


  Hinweise:

  Vermeide es, die Ellbogen während der Bewegung weiter zu beugen (keine Trizeps-Streckung). Halte die Rumpfspannung stabil,
  um ein Überstrecken der Lendenwirbelsäule zu verhindern.'
