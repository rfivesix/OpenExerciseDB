name: Bizepscurl-Maschine
description: |-
  Die Bizepscurl-Maschine ist darauf ausgelegt, die Bizepsmuskulatur zu isolieren und einen kontrollierten Bewegungsumfang zu ermöglichen. Setze dich an die Maschine, den Rücken gegen das Polster gelehnt, und stelle den Sitz so ein, dass deine Arme mit den Griffen oder Polstern der Maschine ausgerichtet sind. Greife die Griffe fest, halte deine Ellbogen fixiert und curle die Griffe nach oben, indem du deinen Bizeps anspannst. Senke die Griffe langsam in die Startposition ab und behalte während der gesamten Bewegung die Kontrolle.
