name: Einbeiniger Beinstrecker
search_terms:
- Beinstrecker Einbeinig
- Einbeiniges Beinstrecken
description: |-
  Ausgangsposition:
  Setze dich in die Beinstreckermaschine und stelle die Rückenlehne so ein, dass deine Kniekehle an der Sitzkante anliegt und der Rücken fest abgestützt ist. Platziere das Polster am unteren Schienbein knapp über dem Sprunggelenk des aktiven Beins. Das andere Bein bleibt entspannt am Boden oder auf der Fußraste.

  Bewegung:
  1. Strecke das Bein über die Kraft des Quadrizeps kontrolliert nach oben, bis das Knie fast vollständig gestreckt ist.
  2. Halte die Kontraktion am obersten Punkt für eine Sekunde.
  3. Senke das Gewicht langsam und kontrolliert wieder ab, ohne dass die Gewichtsplatten aufsetzen, und wiederhole die Bewegung.

  Hinweise:
  Führe erst alle Wiederholungen mit einem Bein aus, bevor du zum anderen Bein wechselst. Das einbeinige Training hilft, muskuläre Dysbalancen auszugleichen.
