exercise_id: '351'
language: de
status: ai_reviewed
name: Seitheben zum Frontheben
description: |-
  - Führe ein Seitheben bis auf Schulterhöhe aus und halte kurz die Position.
  - Anstatt das Gewicht abzusenken, führe die Hanteln bei gestreckten Armen vor deinem Körper zusammen in die obere Position des Fronthebens.
  - Senke die Kurzhanteln nun kontrolliert vor deinen Oberschenkeln ab.
  - Kehre die Bewegung um: Hebe die Hanteln im Frontheben nach oben, öffne die Arme auf Schulterhöhe nach außen in die obere Position des Seithebens und senke sie seitlich wieder ab. Das ist eine Wiederholung.
