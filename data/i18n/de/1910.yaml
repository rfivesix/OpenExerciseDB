name: Kniender Superman (Bird Dog)
description: 'Ausgangsposition:

  Begib dich auf einer Matte in den Vierfüßlerstand. Platziere die Hände direkt unter den Schultern und die Knie hüftbreit unter den Hüften. Halte den Rücken gerade und den Rumpf angespannt.


  Ausführung:

  Strecke gleichzeitig einen Arm gerade nach vorne und das diagonal gegenüberliegende Bein gerade nach hinten aus, bis Arm, Rumpf und Bein eine waagerechte Linie bilden. Halte diese Position für 2–3 Sekunden unter voller Körperspannung. Führe Hand und Knie kontrolliert zurück zur Matte und wiederhole die Übung auf der Gegenseite.


  Hinweise:

  Vermeide es, das Becken zu verdrehen oder ins Hohlkreuz zu fallen; die Bewegung erfolgt rein aus Schulter-, Gesäß- und Rückenmuskulatur bei stabiler Körpermitte.'
