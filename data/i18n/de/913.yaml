name: Reverser Preacher Curl (enger Griff)
description: '- Setze dich an die Preacher-Curl-Bank (Bizepsbank) und lege die Oberarme
  flach auf das Schrägpolster.

  - Greife die SZ-Stange im engen Obergriff (Pronation, Handflächen nach unten).

  - Beuge die Ellenbogen und hebe die Stange kontrolliert nach oben an, wobei der
  Fokus auf dem Oberarmspeichenmuskel (Brachioradialis) und dem Armbeuger (Brachialis)
  liegt.

  - Senke das Gewicht langsam und kontrolliert wieder ab, ohne die Ellenbogengelenke
  am tiefsten Punkt ruckartig durchzustrecken.'
