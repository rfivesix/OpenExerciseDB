exercise_id: '1137'
language: de
status: ai_authored
name: Überzüge am Kabelzug
description: |-
  Ausgangsposition:
  • Stelle dich schulterbreit vor den hohen Kabelzug mit Blick zum Gerät.
  • Greife die Stange im Obergriff (Pronation) etwa schulterbreit mit fast gestreckten Armen.
  • Beuge die Knie leicht und neige den geraden Oberkörper minimal nach vorne.

  Ausführung:
  • Ziehe die Stange mit fast gestreckten Armen in einem weiten Bogen nach unten in Richtung der Oberschenkel.
  • Spanne am Endpunkt den Latissimus und die Brustmuskeln intensiv an.
  • Führe die Stange langsam und kontrolliert wieder auf Schulter- bzw. Augenhöhe nach oben zurück, während die Arme stabil gestreckt bleiben.
