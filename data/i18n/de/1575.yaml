name: Schulterdrücken mit Holzstab im Stand
description: 'Ausgangsposition:

  Stehe aufrecht im schulterbreiten Stand mit stabiler Rumpfspannung. Halte einen
  leichten Holzstab (oder Besenstiel / PVC-Rohr) im schulterbreiten Obergriff vor
  der oberen Brust.


  Ausführung:

  1. Drücke den Stab kontrolliert senkrecht nach oben über den Kopf, bis die Arme
  vollkommen gestreckt sind.

  2. Senke den Stab anschließend langsam wahlweise vor die Brust oder hinter den Nacken
  ab und wechsle zwischen beiden Positionen.

  3. Halte den Bewegungsfluss gleichmäßig und kontrolliert.


  Hinweise:

  Effektive Mobilisations- und Aufwärmübung für Schultergelenke, Schulterblattmuskeln
  und die Brustwirbelsäule.'
