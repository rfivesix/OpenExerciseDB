name: Isometrischer Klimmzughang / Ruderzug
description: |-
  Ausgangsposition:
  Greife eine Klimmzugstange im Ober- oder Untergriff oder die Griffe eines Schlingentrainers/einer Schrägliegestange.

  Ausführung:
  1. Ziehe dich nach oben in die oberste Position (Kinn über der Stange bzw. Brust an den Griffen/der Stange).
  2. Halte diese Position statisch gegen die Schwerkraft: Ziehe die Schulterblätter aktiv nach hinten unten und kontrahiere den Latissimus und die Armbeuger maximal.
  3. Vermeide es abzusacken oder die Schultern zu den Ohren wandern zu lassen.
  4. Halte die isometrische Kontraktion für die vorgegebene Zeitdauer (z. B. 10–30 Sekunden) bei gleichmäßiger Atmung.
