name: 'Seilspringen: Grundsprünge'
description: 'Ausgangsposition: Stehe mit geschlossenen Füßen und halte in jeder Hand
  einen Griff des Springseils, das Seil liegt hinter deinen Fersen. Die Ellbogen bleiben
  nah am Oberkörper.

  Ausführung: Schwinge das Seil mit einer lockeren Bewegung aus den Handgelenken über
  den Kopf nach vorne. Springe nur wenige Zentimeter hoch ab, sodass das Seil gerade
  unter deinen Füßen durchgleiten kann, und lande federnd auf den Fußballen.

  Hinweis: Halte die Knie leicht gebeugt und die Bewegung rhythmisch und ökonomisch.'
