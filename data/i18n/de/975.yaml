name: Einarmiger Kettlebell-Curl
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand. Halte die Kettlebell
  mit einer Hand am Griff neben dem Oberschenkel bei ausgestrecktem Arm.

  Ausführung: Beuge den Arm im Ellbogengelenk und ziehe die Kettlebell kontrolliert
  nach oben auf Schulterhöhe, während der Rumpf aufrecht und stabil bleibt.

  Rückkehr: Senke das Gewicht langsam und kontrolliert wieder vollständig ab.

  Hinweis: Halte den Ellbogen eng am Oberkörper fixiert und vermeide es, den Oberkörper
  zur Seite zu neigen oder Schwung zu holen.'
