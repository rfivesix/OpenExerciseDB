name: Latzug auf der Schrägbank
description: |-
  Ausgangsposition:
  • Stelle eine Schrägbank (ca. 30 bis 45 Grad Neigung) vor einen hohen Kabelzug auf.
  • Lege dich bauchlings auf die Bank, sodass deine Brust gestützt ist und dein Kopf frei bleibt.
  • Greife die Stange oder Griffe an der hohen Rolle mit ausgestreckten Armen.

  Ausführung:
  • Ziehe die Stange oder Griffe kontrolliert nach unten zur oberen Brust, indem du die Ellbogen nach hinten-unten führst.
  • Da dein Oberkörper auf der Bank abgestützt ist, kannst du keinen Schwung aus dem Rumpf holen und isolierst den Latissimus optimal.
  • Spanne am tiefsten Punkt die Rückenmuskeln fest an und kehre kontrolliert nach oben zurück.
