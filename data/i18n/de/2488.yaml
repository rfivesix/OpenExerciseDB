name: Hintere Beckenkippung (Posterior Pelvic Tilt)
description: |-
  Ausgangsposition:
  Lege dich rücklings auf eine Matte. Stelle die Füße hüftbreit flach auf den Boden und beuge die Knie um ca. 90 Grad. Die Arme ruhen entspannt seitlich neben dem Körper. In der neutralen Position besteht eine leichte natürliche Lendenlordose (Hohlkreuz).

  Ausführung:
  1. Spanne Bauchmuskeln und Gesäßmuskulatur aktiv an.
  2. Kippe das Becken nach hinten, sodass deine Lendenwirbelsäule komplett flach auf den Boden gedrückt wird und kein Zwischenraum mehr bleibt.
  3. Halte diesen Druck für 5 Sekunden fest aufrecht, während du ruhig weiteratmest.
  4. Löse die Anspannung kontrolliert und kehre in die neutrale Beckenposition zurück.

  Hinweise:
  Dies schult die bewusste Rumpf- und Beckenkontrolle und hilft effektiv, einer übermäßigen vorderen Beckenkippung (Hohlkreuz) entgegenzuwirken.
