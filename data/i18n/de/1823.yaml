name: Clamshell (Muschel)
description: "Ausgangsposition:\nLege dich seitlich auf eine Trainingsmatte. Winkle\
  \ die Hüften etwa 45 Grad und die Knie etwa 90 Grad an. Lege die Beine exakt aufeinander,\
  \ sodass die Fersen fest zusammenbleiben. Stütze deinen Kopf entspannt mit dem unteren\
  \ Arm ab und lege die obere Hand zur Stabilisierung vor deinem Bauch auf den Boden.\n\
  \nAusführung:\n1. Halte deine Fersen fest zusammen und öffne das obere Knie langsam\
  \ nach oben zur Decke, wie eine sich öffnende Muschel.\n2. Rotiere das Knie so weit\
  \ nach oben, wie es geht, ohne dass dein Becken nach hinten wegdreht.\n3. Spanne\
  \ die seitliche Gesäßmuskulatur (Gluteus medius) am obersten Punkt für 1 bis 2 Sekunden\
  \ fest an.\n4. Senke das Knie langsam und kontrolliert wieder ab, bis es das untere\
  \ Knie fast berührt, und starte die nächste Wiederholung.\n\nHinweise:\nHalte das\
  \ Becken vollkommen stabil und senkrecht zum Boden; drehe die Hüfte nicht nach hinten\
  \ auf. (Als fortgeschrittene Variante kann die Übung auch im seitlichen Unterarmstütz\
  \ ausgeführt werden)."
