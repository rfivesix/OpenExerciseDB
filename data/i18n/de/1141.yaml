exercise_id: '1141'
language: de
status: ai_reviewed
name: Arabeske
description: |-
  Ausgangsposition:
  • Stehe aufrecht und verlagere dein gesamtes Körpergewicht auf ein Standbein.
  • Das Knie des Standbeins ist minimal gebeugt, die Hüfte und das Becken stehen parallel zum Boden.
  • Richte die Wirbelsäule neutral auf und spanne die Bauchmuskeln an.

  Ausführung:
  • Neige deinen geraden Oberkörper aus der Hüfte nach vorne und strecke gleichzeitig das andere Bein nach hinten-oben aus.
  • Bringe Oberkörper und Spielbein möglichst in eine waagerechte Linie zum Boden.
  • Richte dich mit der Kraft von Gesäß und hinterem Oberschenkel des Standbeins kontrolliert wieder in den aufrechten Stand auf.
