exercise_id: '1451'
language: de
status: ai_reviewed
name: Rumpfrotations-Dehnung
description: |-
  Ausgangsposition:
  • Stehe aufrecht mit schulterbreitem Stand und leicht gebeugten Knien (oder setze dich aufrecht auf eine Matte/Bank).
  • Lege die Hände an die Hüften oder verschränke die Arme vor der Brust.

  Ausführung:
  • Drehe den Oberkörper langsam und kontrolliert zu einer Seite, während das Becken stabil nach vorne ausgerichtet bleibt.
  • Halte die erreichte Dehnung in den seitlichen Bauchmuskeln und der Brustwirbelsäule für 15 bis 30 Sekunden.
  • Kehre kontrolliert zur Mitte zurück und wiederhole die Drehung zur Gegenseite.
