name: Außenrotation im Seitliegen mit Kurzhantel
search_terms:
  - Rotatorenmanschette im Liegen
description: |-
  Lege dich seitlich auf eine Matte. Halte eine leichte Kurzhantel in der oberen Hand, beuge den Ellbogen im 90°-Winkel und halte ihn fest an der Hüfte bzw. Taille fixiert. Rotiere den Unterarm gegen die Schwerkraft langsam nach oben außen, um die Außenrotatoren der Schulter (insbesondere Infraspinatus und Teres minor) zu stärken. Senke das Gewicht kontrolliert wieder ab.
