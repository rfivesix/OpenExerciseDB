name: Landmine-Rotation
description: "Ausgangsposition:\nVerankere ein Ende einer Langhantel in einer Landmine-Hülse.\
  \ Stelle dich mit dem Gesicht zur Hantel schulterbreit auf. Greife das freie Hantelende\
  \ mit beiden Händen verschränkt und strecke die Arme vor deiner Brust nach oben\
  \ aus. Die Knie sind leicht gebeugt, der Rumpf ist maximal angespannt.\n\nAusführung:\n\
  1. Führe die Hantel mit fast gestreckten Armen in einem weiten Bogen kontrolliert\
  \ zu einer Hüftseite nach unten.\n2. Rotiere dabei deinen Rumpf kontrolliert mit\
  \ und drehe den hinteren Fuß leicht auf dem Fußballen ein, während deine Bauchmuskeln\
  \ (vor allem die schrägen Bauchmuskeln) gegen die Drehkraft arbeiten.\n3. Führe\
  \ die Stange über denselben Bogen kraftvoll zurück nach oben zur Mitte und senke\
  \ sie im Anschluss zur gegenüberliegenden Hüfte ab.\n\nHinweise:\nLass die Arme\
  \ gestreckt; die Drehung und Abbremsung erfolgt primär über die Rumpf- und Bauchmuskulatur."
