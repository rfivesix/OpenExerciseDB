name: Hängender Scheibenwischer
description: "Ausgangsposition:\nHänge dich an eine Klimmzugstange im schulterbreiten\
  \ Obergriff. Ziehe deinen Oberkörper leicht nach hinten und hebe deine gestreckten\
  \ Beine kontrolliert an, bis deine Füße senkrecht nach oben zur Stange zeigen.\n\
  \nAusführung:\n1. Halte die Schultern und den Latissimus aktiv fixiert und führe\
  \ die geschlossenen, gestreckten Beine langsam und kontrolliert in einem Bogen zur\
  \ linken Seite nach unten.\n2. Halte die Bewegung kurz vor der Waagerechten an und\
  \ ziehe die Beine durch kraftvolle Kontraktion der seitlichen Bauchmuskeln (Obliquus)\
  \ zurück zur Mitte nach oben.\n3. Führe die Beine anschließend im gleichen Bogen\
  \ zur rechten Seite und wiederhole die Scheibenwischer-Bewegung kontinuierlich im\
  \ Wechsel.\n\nHinweise:\nVermeide Schwung und unkontrolliertes Pendeln. Wenn die\
  \ gestreckte Variante zu schwer ist, winkle die Knie leicht an."
