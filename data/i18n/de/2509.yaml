name: Seitstütz (Side Plank)
description: |-
  Ausgangsposition:
  Lege dich auf die Seite auf eine Matte. Stütze deinen Oberkörper auf den unteren Unterarm, wobei der Ellbogen direkt unter der Schulter platziert ist. Die Beine sind gestreckt und die Füße übereinander oder leicht versetzt hintereinander abgelegt.

  Ausführung:
  1. Spanne deinen Rumpf fest an und hebe die Hüfte kraftvoll vom Boden ab, bis dein gesamter Körper von Kopf bis Fuß eine gerade Linie bildet.
  2. Der freie obere Arm kann an die Hüfte gelegt oder senkrecht zur Decke gestreckt werden.
  3. Halte diese Position stabil für die vorgegebene Zeit, ohne die Hüfte nach unten durchhängen zu lassen.
  4. Senke die Hüfte langsam ab und wiederhole die Übung auf der anderen Seite.

  Hinweise:
  Achte darauf, dass die Schulter des Stützarms aktiv nach unten gedrückt bleibt und der Kopf in Verlängerung der Wirbelsäule gehalten wird.
