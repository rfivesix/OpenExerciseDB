name: Nackendehnung (links)
description: 'Ausgangsposition: Sitze oder stehe aufrecht mit geradem Rücken und entspannten,
  tiefen Schultern.

  Ausführung: Neige den Kopf sanft zur rechten Seite, sodass das rechte Ohr in Richtung
  der rechten Schulter wandert. Spüre die Dehnung auf der linken Seite des Nackens
  und oberen Trapezmuskels. Du kannst die rechte Hand leicht auf den Kopf legen, um
  die Dehnung sanft zu unterstützen.

  Rückkehr: Halte die Dehnung für 15–30 Sekunden bei ruhiger Atmung und richte den
  Kopf langsam wieder auf.

  Hinweis: Ziehe die linke Schulter aktiv nach unten und reiße niemals am Kopf.'
