name: Linke Nackendehnung
description: |-
  Ausgangsposition:
  Sitze oder stehe mit aufrechtem Rücken.
  Schritte:

  Neige den Kopf zur Seite.
  Führe die linke Hand über den Kopf an die rechte Schläfe.
  Übe mit der Hand leichten Druck gegen den Kopf und mit dem Kopf isometrisch Gegendruck gegen die Hand aus, sodass der Kopf stabil bleibt.
  Halte diese Spannung für die vorgegebene Dauer aufrecht.
