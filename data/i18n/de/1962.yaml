name: Step Jack (Hampelmann ohne Springen)
description: 'Ausgangsposition:

  Stehe aufrecht mit geschlossenen Füßen und locker an den Seiten liegenden Armen. Spanne den Rumpf leicht an.


  Ausführung:

  Mache mit dem rechten Fuß einen weiten Schritt zur Seite, während du gleichzeitig beide Arme in einem weiten Bogen seitlich über den Kopf führst. Führe den Fuß zurück zur Mitte und senke die Arme ab. Wiederhole die Bewegung direkt mit dem linken Fuß zur anderen Seite. Wechsle kontinuierlich und rhythmisch zwischen beiden Seiten.


  Hinweise:

  Der Step Jack ist die gelenkschonende Low-Impact-Alternative zum klassischen Jumping Jack (Hampelmann). Er bringt das Herz-Kreislauf-System in Schwung, ohne Sprungbelastung auf Knie und Sprunggelenke auszuüben.'
