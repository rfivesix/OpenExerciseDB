name: Dips am Stuhl
description: "Ausgangsposition:\nSetze dich auf die Vorderkante eines stabilen Stuhls\
  \ oder einer Hantelbank. Platziere deine Hände direkt neben den Hüften an der Kante,\
  \ Finger nach vorne zeigend. Hebe dein Gesäß an, strecke die Arme und wandere mit\
  \ den Füßen einige Schritte nach vorne, sodass dein Gesäß frei vor der Sitzfläche\
  \ schwebt. Die Beine sind entweder angewinkelt (einfacher) oder gestreckt (schwerer).\n\
  \nAusführung:\n1. Beuge die Ellenbogen kontrolliert nach hinten (nicht nach außen\
  \ spreizen), um den Körper abzusenken.\n2. Gehe so tief, bis Ober- und Unterarm\
  \ etwa einen 90-Grad-Winkel bilden und dein Gesäß nah am Stuhl bleibt.\n3. Drücke\
  \ dich aus der Kraft des Trizeps kraftvoll nach oben zurück in die Ausgangsposition,\
  \ bis die Arme gestreckt sind.\n\nHinweise:\nHalte deinen Rücken nah an der Stuhlkante,\
  \ um eine übermäßige Schulterbelastung zu vermeiden."
