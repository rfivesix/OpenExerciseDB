name: Couch-Stretch (Hüftbeuger-Dehnung)
description: |-
  Ausgangsposition:
  Knie dich mit dem Rücken vor eine Wand, eine Hantelbank oder ein Sofa. Platziere das hintere Knie nahe an der Wand bzw. Bank und lege den Fußspann senkrecht an der Kante oder Wand nach oben ab. Setze den vorderen Fuß im 90-Grad-Winkel stabil auf den Boden (Ausfallschritt).

  Ausführung:
  1. Spanne die Gesäßmuskulatur der hinteren Seite und deine Bauchmuskeln fest an (hintere Beckenkippung).
  2. Richte deinen Oberkörper langsam und kontrolliert in die Senkrechte auf, bis du eine intensive Dehnung im Hüftbeuger (Psoas) und Quadrizeps des hinteren Beins spürst.
  3. Halte die aufrechte Dehnposition ruhig für die vorgegebene Zeit und atme tief ein und aus.
  4. Löse die Dehnung achtsam und wechsle das Bein.

  Hinweise:
  Vermeide ein Ausweichen ins Hohlkreuz; die Beckenaufrichtung ist der Schlüssel zur Dehnung des Hüftbeugers.
