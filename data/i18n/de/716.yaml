name: Wandgleiten
description: '- Stelle dich mit dem Rücken an eine Wand, sodass Fersen, Gesäß, oberer
  Rücken und Hinterkopf leichten Kontakt zur Wand haben.

  - Hebe die Arme seitlich an, beuge die Ellenbogen im 90-Grad-Winkel (W-Position)
  und drücke Ellenbogen und Handrücken gegen die Wand.

  - Gleite mit den Armen kontrolliert an der Wand nach oben in eine Y-Form, ohne den
  Kontakt zur Wand zu verlieren oder im unteren Rücken ins Hohlkreuz zu fallen.

  - Ziehe die Arme langsam wieder nach unten in die 90-Grad-Position und ziehe dabei
  die Schulterblätter bewusst nach unten.'
