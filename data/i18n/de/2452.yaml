name: Handgelenkcurls mit Langhantel
description: |-
  Ausgangsposition:
  Knie dich vor eine Flachbank oder setze dich auf eine Bank. Lege deine Unterarme flach auf die Bank (oder auf deine Oberschenkel), sodass die Handgelenke knapp über die Kante hinausragen. Greife eine Langhantel im Untergriff (Handflächen nach oben) etwa schulterbreit.

  Ausführung:
  1. Senke die Hantel langsam und kontrolliert ab, indem du die Handgelenke nach unten abknickst. Lasse die Hantel am tiefsten Punkt leicht in die Finger rollen, um die Unterarmbeuger maximal zu dehnen.
  2. Schließe die Finger und curle das Handgelenk kraftvoll nach oben, bis die Unterarme maximal kontrahiert sind.
  3. Halte die Kontraktion am obersten Punkt für 1 Sekunde und senke die Hantel wieder kontrolliert ab.

  Hinweise:
  Halte die Unterarme während der gesamten Bewegung fest auf der Unterlage fixiert; bewege ausschließlich Handgelenke und Finger.
