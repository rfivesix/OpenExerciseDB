name: Buch aufschlagen (Open Book)
description: "Ausgangsposition:\nLege dich in Seitlage auf eine Trainingsmatte (oder\
  \ nimm den halbknienden Stand mit einer Körperseite zur Wand ein). Beuge Hüfte und\
  \ Knie im 90-Grad-Winkel nach vorne an, um die Lendenwirbelsäule und das Becken\
  \ zu stabilisieren. Strecke beide Arme auf Schulterhöhe gerade nach vorne aus und\
  \ lege die Handflächen aufeinander.\n\nAusführung:\n1. Atme ein und hebe den oberen\
  \ Arm kontrolliert an. Führe ihn in einem weiten Bogen nach oben und hinten zur\
  \ Gegenseite, als würdest du ein Buch aufschlagen.\n2. Drehe deinen Kopf und den\
  \ oberen Brustkorb mit und folge deiner Hand mit den Augen. Das Becken und beide\
  \ Knie bleiben fest aufeinander und bewegen sich nicht.\n3. Atme am Ende der Bewegung\
  \ tief aus, halte die Dehnung im Brustkorb und der Brustwirbelsäule für 1 bis 2\
  \ Sekunden.\n4. Führe den Arm langsam mit der Einatmung wieder nach vorne und schließe\
  \ das Buch.\n\nHinweise:\nHervorragende Mobilitätsübung zur Verbesserung der Brustwirbelsäulen-Rotation\
  \ (Thoraxmobilität) und Öffnung der vorderen Schulter."
