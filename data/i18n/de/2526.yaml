name: Tiefer Ausfallschritt mit Federn
description: |-
  Ausgangsposition:
  Optional: Halte ein Band oder Seil mit gestreckten Armen über dem Kopf straff auseinander. Mache einen weiten Ausfallschritt nach vorne und senke das Becken tief ab, bis das hintere Knie fast den Boden berührt und die Hüfte maximal geöffnet ist.

  Ausführung:
  1. Halte den Oberkörper aufrecht und die Rumpfmuskulatur fest angespannt.
  2. Wippe im tiefsten Punkt des Ausfallschritts langsam und kontrolliert mit dem Becken um etwa 2 bis 3 cm auf und ab (pulsieren).
  3. Führe die federnden Bewegungen für die vorgeschriebene Anzahl an Wiederholungen oder Sekunden durch.
  4. Drücke dich über die vordere Ferse zurück in den Stand und wiederhole die Übung mit dem anderen Bein.

  Hinweise:
  Bewege dich sanft und rhythmisch ohne ruckartiges Federn; dies mobilisiert Hüftbeuger und Gesäßmuskulatur dynamisch.
