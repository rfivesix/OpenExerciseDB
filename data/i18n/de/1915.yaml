name: Hüftabduktion im Vierfüßlerstand (Fire Hydrant)
description: 'Ausgangsposition:

  Gehe auf einer Matte in den Vierfüßlerstand, die Hände unter den Schultern und die Knie unter den Hüften. Platziere optional ein kurzes Widerstandsband oberhalb der Knie, um den Trainingsreiz zu erhöhen. Spanne den Rumpf fest an.


  Ausführung:

  Hebe ein Bein bei konstant 90 Grad gebeugtem Knie kontrolliert seitlich nach außen an, bis der Oberschenkel etwa parallel zum Boden steht. Halte das Becken waagerecht und vermeide ein Aufdrehen der Hüfte. Senke das Bein langsam wieder ab, ohne das Knie vollständig abzusetzen. Führe alle Wiederholungen auf einer Seite durch und wechsle dann das Bein.


  Hinweise:

  Konzentriere dich auf die Anspannung im mittleren Gesäßmuskel und halte den unteren Rücken absolut stabil (Vorstellung: ein Glas Wasser auf dem Rücken darf nicht verschüttet werden).'
