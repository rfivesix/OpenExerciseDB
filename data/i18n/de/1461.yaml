name: Kurzhantel-Brustdrücken ohne Beineinsatz
description: |-
  Ausgangsposition:
  • Lege dich mit zwei Kurzhanteln auf eine Flachbank.
  • Platziere die Beine ausgestreckt auf der Bank oder hebe die Füße mit gebeugten Knien vom Boden ab, um jeden Beineinsatz (Leg Drive) vollständig auszuschließen.
  • Halte die Hanteln auf Brusthöhe, die Ellbogen in einem 45°-Winkel zum Oberkörper.

  Ausführung:
  • Drücke die Kurzhanteln ausschließlich aus der Kraft der Brustmuskeln und des Trizeps kontrolliert nach oben.
  • Senke die Gewichte langsam wieder auf Brusthöhe ab, bis du eine angenehme Dehnung im großen Brustmuskel spürst.
  • Halte die Wirbelsäule und das Becken während der gesamten Bewegung absolut stabil auf der Bank.
