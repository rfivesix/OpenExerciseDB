name: Fliegende am Schlingentrainer (TRX Chest Fly)
description: 'Ausgangsposition: Greife die Schlaufen des Schlingentrainers (TRX) im
  neutralen Griff und beuge den Körper in Schräglage gestreckt nach vorne. Dein Körper
  bildet eine feste Linie von Kopf bis Fuß, die Arme sind vor der Brust gestreckt.

  Ausführung: Öffne die Arme mit leicht gebeugten Ellbogen kontrolliert in einem weiten
  Bogen zur Seite, bis du eine deutliche Dehnung in der Brustmuskulatur spürst.

  Rückkehr: Führe die Hände über die Kraft der Brustmuskeln wieder vor dem Körper
  zusammen und halte dabei die Rumpfspannung aufrecht.

  Hinweis: Die Übungsintensität lässt sich einfach über den Neigungswinkel des Körpers
  variieren.'
