name: Kurzhantel-Bankdrücken mit engem Griff
description: |-
  Ausgangsposition:
  • Lege dich rücklings auf eine Flachbank und halte in jeder Hand eine Kurzhantel über deiner Brust.
  • Die Handflächen zeigen zueinander (neutraler Griff), und die Kurzhanteln werden während der gesamten Übung fest aneinandergedrückt.

  Ausführung:
  • Senke die aneinandergepressten Hanteln kontrolliert zur Mitte deiner Brust ab, während die Ellbogen eng am Körper nach unten geführt werden.
  • Drücke die Hanteln kraftvoll nach oben aus, indem du den Trizeps und die innere Brustmuskulatur anspannst.
  • Halte die Hanteln oben für eine Sekunde unter voller Körperspannung und wiederhole die Übung.
