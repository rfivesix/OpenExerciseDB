name: Tuck Planche (eingehockte Planche)
description: 'Ausgangsposition:

  Platziere deine Hände etwa schulterbreit auf dem Boden oder auf stabilen Parallettes. Die Finger zeigen leicht nach außen oder nach vorne.


  Ausführung:

  Drücke dich mit vollkommen gestreckten Armen kraftvoll vom Boden ab und verlagere dein Körpergewicht nach vorne über die Handgelenke. Ziehe die Knie eng an die Brust (Tuck-Haltung) und hebe die Füße und den Unterkörper vollständig vom Boden ab. Runde den oberen Rücken bewusst durch Protraktion der Schulterblätter und baue maximale Spannung im Rumpf auf. Halte diese statische Position für die vorgegebene Zeitspanne.


  Hinweise:

  Halte die Arme während des gesamten Haltens absolut gestreckt (kein Einknicken der Ellbogen); die Hauptlast tragen die vordere Schultermuskulatur, der Sägemuskel und der Core.'
