name: Fliegende am Kabelzug
description: 'Ausgangsposition: Stelle dich zwischen die beiden Kabeltürme, greife
  die Griffe und trete zwei Schritte nach vorne in eine stabile Schrittstellung. Der
  Rücken ist gerade und leicht nach vorne geneigt.

  Ausführung: Führe die Griffe in einem weiten bogenförmigen Schwung vor der Brust
  zusammen und spanne die Brustmuskulatur kraftvoll an.

  Rückkehr: Öffne die Arme kontrolliert wieder nach außen, bis eine Dehnung in den
  Brustmuskeln spürbar ist.

  Hinweis: Diese Übung ist veraltet (deprecated).'
