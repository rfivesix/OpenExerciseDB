name: Kabelzug-Frontheben
description: |-
  Ausgangsposition:
  Stelle dich mit Blick zum niedrigen Kabelzug (oder mit dem Rücken dazu) hin. Greife den Einhandgriff im Obergriff vor deinen Oberschenkeln. Die Knie sind leicht gebeugt, der Rumpf ist fest angespannt.
  
  Ausführung:
  1. Hebe den Griff mit leicht gebeugtem Arm in einem weiten Bogen kontrolliert nach vorne bis auf Schulterhöhe an.
  2. Halte die Kontraktion am höchsten Punkt kurz und spüre die Spannung im vorderen Deltamuskel.
  3. Senke den Griff langsam und kontrolliert wieder ab.
  
  Hinweise:
  Hole keinen Schwung aus den Beinen oder dem Oberkörper; der Rumpf bleibt während des gesamten Hebevorgangs stabil.
