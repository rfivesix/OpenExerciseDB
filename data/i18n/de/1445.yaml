exercise_id: '1445'
language: de
status: ai_reviewed
name: Stoßen (Jerk)
description: |-
  Ausgangsposition:
  • Halte die Langhantel im schulterbreiten Obergriff fest auf den vorderen Schultern und dem oberen Schlüsselbeinbereich abgelegt (Front-Rack-Position).
  • Der Stand ist hüftbreit, der Oberkörper vollkommen aufgerichtet und die Rumpfmuskulatur angespannt.

  Ausführung:
  • Führe eine kurze, vertikale Kniebeugung von wenigen Zentimetern durch (Dip), ohne den Oberkörper nach vorne zu neigen.
  • Strecke die Beine explosiv durch (Drive) und nutze diesen Aufwärtsimpuls, um dich blitzschnell unter die aufsteigende Stange zu katapultieren.
  • Fange die Hantel mit gestreckten, verriegelten Armen über dem Kopf im Ausfallschritt (Split Jerk) oder in einer Kniebeuge ab.
  • Führe den vorderen und hinteren Fuß schrittweise wieder parallel zusammen, während die Hantel stabil im Überkopf-Lockout fixiert bleibt.
