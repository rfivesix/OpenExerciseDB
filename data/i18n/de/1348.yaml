name: Rückenstrecken (Hyperextensions)
description: |-
  Ausgangsposition:
  Positioniere dich bäuchlings auf der Hyperextension-Bank (Römische Liege). Die Oberschenkel liegen stabil auf den Polstern auf, während die Hüfte frei beweglich bleibt. Die Fersen sind unter den hinteren Polstern fixiert. Verschränke die Arme vor der Brust oder lege die Hände an die Schläfen.

  Ausführung:
  Senke den Oberkörper langsam und kontrolliert aus der Hüfte nach vorne ab, bis eine leichte Dehnung in den Beinbeugern spürbar ist. Halte die Wirbelsäule dabei gerade. Richte den Oberkörper über die Kraft der Rückenstrecker und des Gesäßes wieder auf, bis der Körper eine gerade Linie bildet.

  Hinweise:
  Überstrecke die Wirbelsäule am obersten Punkt nicht nach hinten (kein Hohlkreuz bilden). Führe die gesamte Bewegung ohne Schwung aus.
