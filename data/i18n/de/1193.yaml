name: Russian Twist mit Kurzhantel
description: |-
  Ausgangsposition:
  • Setze dich auf eine Trainingsmatte, winkle die Knie an und stelle die Fersen auf den Boden (oder hebe die Füße für höhere Intensität leicht an).
  • Halte eine Kurzhantel mit beiden Händen vor der Brust.
  • Neige den geraden Oberkörper um etwa 45 Grad nach hinten, sodass die Bauchmuskulatur unter Spannung steht.

  Ausführung:
  • Rotiere deinen Oberkörper kontrolliert nach rechts und führe die Kurzhantel seitlich neben die Hüfte in Richtung Boden.
  • Halte kurz inne, drehe den Rumpf dann fließend zur linken Seite und führe die Hantel dort Richtung Boden.
  • Achte darauf, dass die Drehung aus der Brustwirbelsäule und den schrägen Bauchmuskeln kommt und die Knie möglichst stabil bleiben.
