name: Decline-Liegestütze (Füße erhöht)
description: |-
  Ausgangsposition:
  Platziere deine Füße auf einer stabilen Flachbank oder Box und stütze deine Hände schulterbreit auf den Boden unter deiner Brust. Der Körper bildet eine schräge, gerade Linie vom Kopf bis zu den Fersen.

  Ausführung:
  1. Beuge die Ellenbogen und senke deine Brust kontrolliert in Richtung Boden ab.
  2. Halte die Rumpf- und Gesäßmuskeln unter voller Körperspannung, um ein Durchhängen der Hüfte zu verhindern.
  3. Stoppe kurz vor dem Boden, wenn die Nase oder die obere Brust den Boden fast berührt.
  4. Drücke dich explosiv und kraftvoll durch die Hände nach oben in die Ausgangsposition zurück.
  5. Diese Variante verlagert den Trainingsfokus intensiv auf den oberen Teil der Brustmuskulatur (Pars clavicularis) und die vorderen Schultern.
