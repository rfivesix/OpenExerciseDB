name: Sitzender W-Curl mit Kurzhanteln
description: |-
  Ausgangsposition:
  • Setze dich auf eine Schrägbank (ca. 60° Neigung) und nimm in jede Hand eine Kurzhantel.
  • Lasse die Arme seitlich herabhängen, die Handflächen zeigen nach außen/vorne.

  Ausführung:
  • Beuge die Ellbogen und curle die Kurzhanteln diagonal nach außen in einer W-Form nach oben.
  • Spanne den inneren Kopf des Bizeps (kurzer Kopf) am oberen Umkehrpunkt intensiv an.
  • Senke die Hanteln langsam und kontrolliert wieder in die Ausgangsposition ab, ohne mit den Armen zu schwingen.
