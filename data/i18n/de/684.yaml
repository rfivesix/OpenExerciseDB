name: Latzug im Untergriff
description: '- Setze dich an die Latzugstation und stelle das Oberschenkelpolster
  so ein, dass deine Beine fest fixiert sind.

  - Greife die Stange im Untergriff (Handflächen zeigen zu dir) etwa schulterbreit
  oder etwas enger.

  - Ziehe die Stange kontrolliert zum oberen Brustbereich, indem du die Ellenbogen
  nach unten und hinten führst und den Latissimus anspannst.

  - Führe die Stange langsam wieder nach oben in die vollständige Streckung zurück,
  ohne die Spannung im Rücken zu verlieren.'
