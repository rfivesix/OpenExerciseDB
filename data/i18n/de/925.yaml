name: Schrägbankdrücken an der Multipresse
description: 'Ausgangsposition: Lege dich auf eine leicht schräg eingestellte Bank
  (ca. 15–30°) unter der Multipresse. Greife die Hantelstange etwas mehr als schulterbreit
  im Obergriff. Entriegele die Stange und halte sie mit gestreckten Armen über der
  oberen Brust.

  Ausführung: Senke die Stange langsam und kontrolliert zur oberen Brust bzw. den
  Schlüsselbeinen ab. Halte die Schulterblätter zusammengezogen und die Ellbogen leicht
  angewinkelt.

  Rückkehr: Drücke die Stange entlang der Führungsschienen kraftvoll nach oben, bis
  die Arme fast vollständig gestreckt sind, und spanne die obere Brustmuskulatur an.

  Hinweis: Nutze die feste Führung der Multipresse für eine saubere, kontrollierte
  Bewegung ohne Abfedern auf der Brust.'
