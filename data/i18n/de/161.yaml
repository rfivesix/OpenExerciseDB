name: Kurzhantel-Überzüge
search_terms:
- KH Überzüge
description: |-
  Ausgangsposition:
  Lege dich rücklings quer über eine Flachbank, sodass nur der obere Rücken und die Schultern auf dem Polster aufliegen. Die Füße stehen fest und schulterbreit am Boden, das Becken wird leicht abgesenkt gehalten. Halte eine Kurzhantel mit beiden Händen direkt über deiner Brust: Die Handflächen liegen flach an der Innenseite der oberen Hantelscheibe an.

  Bewegung:
  1. Lasse die Hantel mit leicht gebeugten Ellbogen (ca. 15 Grad Beugung) in einem weiten Bogen langsam hinter den Kopf absinken, bis du eine intensive Dehnung in Brust und Latissimus spürst.
  2. Atme während des Absenkens tief ein, um den Brustkorb zu weiten.
  3. Ziehe die Hantel auf demselben Bogen kontrolliert wieder nach oben über die Brust und atme dabei aus.

  Hinweise:
  Verändere den Beugewinkel der Ellbogen während der Bewegung nicht, um die Übung nicht in ein Trizepsdrücken zu verwandeln.
