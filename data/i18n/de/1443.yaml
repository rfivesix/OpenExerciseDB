name: Kombiniertes Seit- und Frontheben mit Kurzhanteln
description: |-
  Ausgangsposition:
  • Stehe aufrecht, Füße schulterbreit, und halte in jeder Hand eine Kurzhantel seitlich am Körper mit leicht gebeugten Ellbogen.

  Ausführung:
  • Hebe die Kurzhanteln seitlich ohne Schwung bis auf Schulterhöhe an (klassisches Seitheben).
  • Führe die Hanteln auf Schulterhöhe in einer horizontalen Bewegung nach vorne zusammen.
  • Senke die Kurzhanteln vor den Oberschenkeln kontrolliert nach unten ab.
  • Führe die nächste Wiederholung umgekehrt aus: Hebe die Hanteln nach vorne an (Frontheben), öffne sie zur Seite und senke sie seitlich ab.
