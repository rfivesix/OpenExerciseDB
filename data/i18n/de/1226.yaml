name: Kurzhantel-Bizeps-Curl mit Schulterdrücken
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin, die Füße stehen hüftbreit auseinander.
  • Halte in jeder Hand eine Kurzhantel mit ausgestreckten Armen seitlich am Körper.

  Ausführung:
  • Führe zunächst einen kontrollierten Bizeps-Curl aus und hebe die Hanteln bis auf Schulterhöhe an.
  • Drehe die Handgelenke fließend nach vorne und drücke die Hanteln in einer Überkopfbewegung gerade nach oben aus.
  • Senke die Hanteln kontrolliert wieder auf Schulterhöhe ab und führe sie über den umgekehrten Curl-Weg zurück in die Ausgangsposition.
