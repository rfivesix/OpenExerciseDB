exercise_id: '1218'
language: de
status: ai_reviewed
name: Liegestütze auf den Knien
description: |-
  Ausgangsposition:
  • Knie dich auf den Boden und setze die Hände etwas weiter als schulterbreit auf den Boden.
  • Bilde eine gerade Linie von den Knien über die Hüfte bis zum Kopf und spanne den Rumpf fest an.
  • Die Knie bleiben während der gesamten Übung am Boden.

  Ausführung:
  • Beuge die Ellbogen kontrolliert und senke die Brust bis kurz vor den Boden ab.
  • Halte die Ellbogen in einem Winkel von ca. 45 Grad zum Oberkörper.
  • Drücke dich über die Handflächen kraftvoll wieder nach oben in die Ausgangsposition zurück.
