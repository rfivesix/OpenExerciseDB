exercise_id: '1452'
language: de
status: ai_reviewed
name: Knie-zur-Brust-Dehnung
description: |-
  Ausgangsposition:
  • Lege dich rücklings flach auf eine Trainingsmatte, die Beine sind ausgestreckt und der Kopf liegt entspannt auf.

  Ausführung:
  • Beuge ein Knie, umfasse das Schienbein oder die Kniekehle mit beiden Händen und ziehe das Knie sanft in Richtung Brust.
  • Halte das andere Bein flach auf dem Boden ausgestreckt, um eine angenehme Dehnung in Gesäß und unterem Rücken zu spüren.
  • Halte die Position für 20 bis 30 Sekunden, atme tief ein und aus und wechsle anschließend das Bein.
  • Die Übung kann auch mit beiden Knien gleichzeitig ausgeführt werden.
