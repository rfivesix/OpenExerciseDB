name: Knie-zur-Brust-Dehnung
description: |-
  Die Knie-zur-Brust-Dehnung ist eine einfache, aber effektive Übung, um Verspannungen im unteren Rücken zu lösen und die Hüftbeweglichkeit zu verbessern. Lege dich dazu flach auf den Rücken mit gestreckten Beinen. Ziehe ein Knie zur Brust und umfasse mit den Händen das Schienbein oder die Rückseite des Oberschenkels. Ziehe das Knie sanft näher zur Brust, während du das andere Bein gestreckt auf dem Boden lässt. Halte die Dehnung 15–30 Sekunden und wechsle dann die Seite. Für eine intensivere Dehnung können beide Knie gleichzeitig zur Brust gezogen werden.
