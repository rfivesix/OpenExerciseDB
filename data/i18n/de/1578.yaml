name: Hip Hinge
description: 'Ausgangsposition:

  Stelle dich aufrecht mit hüftbreitem Stand hin. Lege die Hände an die Hüftbeuge
  (Leiste) oder halte sie vor der Brust. Die Knie sind minimal gebeugt (weich), aber
  nicht durchgestreckt.


  Ausführung:

  1. Schiebe dein Gesäß geradlinig nach hinten, als ob du eine Wand hinter dir mit
  dem Gesäß berühren wolltest.

  2. Beuge den Oberkörper mit vollkommen geradem Rücken aus der Hüfte nach vorne.

  3. Gehe so tief, bis eine spürbare Dehnung in der hinteren Oberschenkelmuskulatur
  (Hamstrings) entsteht.

  4. Drücke die Hüfte durch kraftvolle Anspannung von Gesäß und Oberschenkelrückseite
  wieder nach vorne in den aufrechten Stand.


  Hinweise:

  Das fundamentale Grundbewegungsmuster für Kreuzheben, Kettlebell Swings und Good
  Mornings. Der Rücken bleibt während der gesamten Bewegung neutral.'
