name: Devil's Press
description: 'Ausgangsposition:

  Platziere zwei Kurzhanteln schulterbreit vor dir auf dem Boden und stelle dich hüftbreit
  dahinter auf.


  Ausführung:

  1. Gehe in die Hocke, greife die Hantelgriffe, springe mit den Füßen nach hinten
  in den Liegestütz und senke die Brust bis auf den Boden zwischen die Hanteln ab
  (Burpee).

  2. Springe mit den Füßen explosiv nach vorne außen neben die Hanteln in einen breiten
  Stand.

  3. Schwinge die Kurzhanteln mit einem kraftvollen Hüftstoß (Hip Hinge) zwischen
  den Beinen an und reiße sie in einer flüssigen Snatch-Bewegung direkt über den Kopf.

  4. Führe die Hanteln kontrolliert zum Boden zurück und gehe direkt in die nächste
  Wiederholung über.


  Hinweise:

  Hochintensive Ganzkörperübung, die Kraftausdauer, Schnellkraft und kardiovaskuläre
  Fitness maximal fordert.'
