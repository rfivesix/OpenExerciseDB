name: Trap-3-Raise (Heben für den unteren Trapez)
description: "Ausgangsposition:\nStelle dich hin, beuge die Knie leicht und kippe\
  \ deinen geraden Oberkörper aus der Hüfte um etwa 45 Grad nach vorne (Hip Hinge).\
  \ Stütze eine Hand auf deinem Oberschenkel oder einer Hantelbank ab. Lasse den freien\
  \ Arbeitsarm locker nach unten hängen, Schulterblatt nach unten gezogen (Depression).\n\
  \nAusführung:\n1. Hebe den gestreckten Arbeitsarm mit nach oben zeigendem Daumen\
  \ diagonal nach vorne-oben an (in einem Winkel von etwa 15 bis 30 Grad über Kopfhöhe).\n\
  2. Fokussiere dich darauf, die Bewegung rein aus dem unteren Anteil des Trapezmuskels\
  \ (Pars ascendens / Trap 3) einzuleiten, ohne die Schulter zum Ohr hochzuziehen.\n\
  3. Halte die Kontraktion am oberen Punkt für 1 bis 2 Sekunden.\n4. Senke den Arm\
  \ langsam und kontrolliert wieder ab.\n\nHinweise:\nEine fundamentale Reha- und\
  \ Haltungsübung zur Kräftigung des unteren Trapezmuskels und zur Optimierung der\
  \ Schulterblattaufwärtsrotation."
