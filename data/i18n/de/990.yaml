name: Glute Kickback im Vierfüßlerstand
description: 'Ausgangsposition: Begib dich in den Vierfüßlerstand auf einer Matte.
  Die Hände befinden sich unter den Schultern, die Knie unter den Hüften und die Wirbelsäule
  ist neutral.

  Ausführung: Hebe ein Bein an und führe die Ferse kontrolliert nach hinten oben in
  Richtung Decke. Spanne die Gesäßmuskulatur am höchsten Punkt maximal an.

  Rückkehr: Halte die Kontraktion für einen kurzen Moment und senke das Knie langsam
  wieder in Richtung Boden ab, ohne es ganz abzusetzen.

  Hinweis: Halte das Becken waagerecht und vermeide ein Hohlkreuz im unteren Rücken.'
