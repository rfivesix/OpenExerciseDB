name: Einarmiges Kurzhantelrudern im Stütz (Plank to Row)
description: |-
  Ausgangsposition:
  Begib dich in eine hohe Liegestütz- bzw. Plank-Position. Die Hände stützen sich auf Kurzhanteln ab (oder eine Hand stützt am Boden, die andere hält eine Hantel). Die Füße stehen etwa schulterbreit für eine stabile Basis.

  Ausführung:
  1. Spanne Rumpf und Gesäß fest an, damit das Becken stabil bleibt und nicht zur Seite rotiert.
  2. Ziehe die Kurzhantel mit einer Hand kontrolliert nach oben in Richtung Hüfte, wobei der Ellenbogen eng am Oberkörper entlanggeführt wird.
  3. Halte am obersten Punkt kurz die Kontraktion im breiten Rückenmuskel (Latissimus).
  4. Senke die Kurzhantel langsam wieder zum Boden ab.
  5. Führe die Wiederholungen kontrolliert aus und wechsle anschließend die Seite.
