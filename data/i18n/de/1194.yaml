status: ai_reviewed
name: Pallof Press am Kabelzug
description: |-
  Ausgangsposition:
  • Stelle dich seitlich zum Kabelturm auf, die Füße stehen etwa schulterbreit mit leicht gebeugten Knien.
  • Fasse den D-Griff mit beiden Händen und ziehe ihn mittig vor dein Brustbein.
  • Spanne Gesäß, Rumpf und Bauchmuskeln fest an.

  Ausführung:
  • Drücke die Hände mit dem Griff geradlinig und kontrolliert nach vorne, bis deine Arme fast vollständig gestreckt sind.
  • Widerstehe aktiv dem Rotationszug des Kabels – deine Schultern und Hüften bleiben exakt parallel nach vorne ausgerichtet.
  • Halte die gestreckte Position für 1 bis 2 Sekunden und führe die Hände dann langsam wieder kontrolliert zurück zur Brust.
