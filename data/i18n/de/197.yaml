name: Dips zwischen zwei Bänken
description: |-
  Stelle zwei Flachbänke parallel zueinander auf, sodass du dich mit den Händen auf der einen Bank abstützen und die Fersen auf die andere Bank auflegen kannst. Die Beine bleiben während der Übung gestreckt.
  Beuge die Arme kontrolliert, bis die Oberarme etwa parallel zum Boden sind, wobei die Ellbogen nach hinten zeigen.
