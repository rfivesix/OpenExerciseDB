name: Unterarm-Curls im Untergriff
description: 'Ausgangsposition:

  Setze dich auf eine Trainingsbank und lege deine Unterarme so auf die Oberschenkel oder die Bankkante, dass die Handgelenke
  frei nach vorne ragen. Halte in beiden Händen Kurzhanteln im Untergriff (Handflächen nach oben).


  Ausführung:

  1. Senke die Kurzhanteln kontrolliert ab, indem du die Handgelenke nach unten streckst.

  2. Beuge die Handgelenke kraftvoll nach oben, um die Kurzhanteln anzuheben und die Unterarmbeugemuskulatur maximal anzuspannen.

  3. Halte die Kontraktion oben kurz an und senke das Gewicht langsam und kontrolliert wieder ab.


  Hinweise:

  Bewege ausschließlich die Handgelenke und vermeide jeglichen Schwung aus Armen oder Rumpf.'
