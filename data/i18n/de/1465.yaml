name: Spider Curls mit Kurzhanteln
description: |-
  Ausgangsposition:
  Stelle eine verstellbare Hantelbank auf eine Schrägstellung von etwa 45 Grad ein. Lege dich mit der Brust flach und stabil auf das Polster, sodass der Kopf über das obere Ende ragt und die Füße fest auf dem Boden stehen. Halte in jeder Hand eine Kurzhantel, die Arme hängen senkrecht nach unten, Handflächen nach vorne (Supination).

  Ausführung:
  1. Beuge die Ellenbogen und curle die Kurzhanteln kontrolliert in Richtung der Schultern, ohne dass die Oberarme nach hinten ausweichen.
  2. Spanne den Bizeps am obersten Punkt für 1 bis 2 Sekunden maximal an.
  3. Senke die Kurzhanteln langsam und kontrolliert über 3 bis 4 Sekunden wieder in die vollständige Dehnung ab.

  Hinweise:
  Durch das Aufliegen auf der Bank wird jeglicher Schwung aus dem Körper eliminiert und der Bizeps isoliert gefordert.
