name: Donkey Kicks mit Kurzhantel
description: |-
  Donkey Kicks mit Kurzhantel sind eine effektive Übung, um die Gesäßmuskulatur und die hintere Oberschenkelmuskulatur zu trainieren. Diese Übung wird im Vierfüßlerstand ausgeführt, wobei eine Kurzhantel in der Kniekehle für zusätzlichen Widerstand sorgt.
  Ausgangsposition: Begib dich auf einer Matte in den Vierfüßlerstand, wobei sich deine Hände unter den Schultern und deine Knie unter den Hüften befinden.
  Platzierung der Kurzhantel: Klemme eine Kurzhantel in die Kniekehle des Beins ein, das du anheben möchtest. Halte das Knie gebeugt, um die Hantel sicher zu fixieren.
  Ausführung:
  Hebe das gebeugte Bein nach oben an, wobei das Knie im 90-Grad-Winkel gebeugt bleibt.
  Führe die Ferse nach oben, bis der Oberschenkel etwa parallel zum Boden steht, und spanne die Gesäßmuskulatur am höchsten Punkt an.
  Halte die Kontraktion kurz und senke das Bein langsam und kontrolliert wieder in die Ausgangsposition ab.
