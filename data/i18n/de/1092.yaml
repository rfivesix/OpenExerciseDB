name: Boxsacktraining (Heavy Bag)
description: |-
  Ausgangsposition:
  Stelle dich in einer stabilen Boxstellung etwa eine Armlänge vor den Boxsack. Die Führhand ist vorne, die Schlaghand schützt das Kinn, die Knie sind leicht gebeugt und das Gewicht ist auf den Fußballen verteilt.

  Ausführung:
  1. Schlage präzise und kraftvoll mit geraden Schlägen (Jab, Cross) sowie Haken (Hooks) auf den Sandsack.
  2. Rotiere Hüfte und Rumpf bei jedem Schlag aktiv mit, um Schlagkraft aus dem gesamten Körper zu generieren.
  3. Halte die Deckung nach jedem Schlag sofort wieder oben und bewege dich auf leichten Füßen um den Sack herum.
  4. Trainiere in intensiven Intervallen (z. B. 2–3 Minuten Runden), um Schlagkraft, Koordination und kardiovaskuläre Ausdauer aufzubauen.
