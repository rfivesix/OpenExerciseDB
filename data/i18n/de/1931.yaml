name: Spider-Curls mit Kurzhanteln
description: 'Ausgangsposition:

  Lege dich bauchlings auf eine etwa 45 Grad eingestellte Schrägbank, sodass deine Brust oben auf der Lehne aufliegt und deine Füße hinten stabil aufgestellt sind. Greife in jede Hand eine Kurzhantel im Untergriff (Handflächen nach vorne) und lasse die Arme senkrecht nach unten hängen.


  Ausführung:

  Beuge die Ellbogen und curle die Kurzhanteln kontrolliert nach oben in Richtung deiner Schultern. Halte die Oberarme dabei absolut senkrecht und unbeweglich. Spanne den Bizeps am obersten Punkt für eine Sekunde maximal an. Senke die Hanteln langsam und kontrolliert wieder vollständig ab.


  Hinweise:

  Durch die Bauchlage auf der Bank wird jeglicher Schwung aus dem Körper eliminiert; die Bewegung isoliert den kurzen Kopf des Bizeps optimal.'
