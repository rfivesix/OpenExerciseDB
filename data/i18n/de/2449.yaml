name: Clamshell zu Reverse Clamshell
description: |-
  Ausgangsposition:
  Lege dich in Seitlage auf die Matte. Beuge Hüfte und Knie in einen 90-Grad-Winkel und lagere die Beine übereinander. Hebe das obere Bein leicht an, sodass es während der gesamten Übung in der Luft bleibt.

  Ausführung:
  1. Halte die Fersen beieinander und öffne das obere Knie nach oben (klassische Clamshell / Außenrotation).
  2. Führe das Knie wieder nach unten, bringe die Knie zusammen und hebe gleichzeitig den Fuß nach oben (Reverse Clamshell / Innenrotation).
  3. Wechsle fließend und kontrolliert zwischen beiden Positionen ab, ohne das obere Bein zwischen den Wiederholungen abzulegen.

  Hinweise:
  Halte das Becken stabil und aufgerichtet; die Rotation findet ausschließlich im Hüftgelenk statt.
