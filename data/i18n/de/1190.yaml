name: Bizepscurl im Obergriff
description: |-
  Ausgangsposition:
  Wähle ein passendes Gewicht an der Hantelstange. Stehe aufrecht und greife die Stange im schulterbreiten Obergriff (Handrücken nach oben). Rumpf anspannen und Brust aufgerichtet halten.
  Ausführung:
  Beuge die Ellbogen und hebe die Stange kontrolliert nach oben, ohne Schwung aus dem Körper zu holen. Senke das Gewicht langsam und kontrolliert wieder ab.
