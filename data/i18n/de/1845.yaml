name: Sitzendes Good Morning mit weitem Stand (Pancake)
description: "Ausgangsposition: Setze dich mit aufrechtem Oberkörper auf den Boden\
  \ und grätsche die Beine weit auseinander (Pancake-Position). Die Knie bleiben gestreckt\
  \ und die Zehen zeigen nach oben. Lege die Hände an den Hinterkopf.\nAusführung:\
  \ Beuge den Oberkörper mit geradem Rücken aus den Hüftgelenken nach vorne (Hüftbeuge),\
  \ bis eine spürbare Dehnung in den Adduktoren und der Oberschenkelrückseite entsteht.\n\
  Hinweise: Richte den Oberkörper über die Kraft der Gesäß- und Beinbeugermuskulatur\
  \ wieder auf. Vermeide es, die Wirbelsäule stark einzurunden."
