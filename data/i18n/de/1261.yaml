name: TRX Gorilla-Bizeps-Curl
description: |-
  Wir stellen uns mit Blick zu den TRX-Bändern und greifen sie mit den Fäusten zueinander gerichtet, nach vorne zeigend, mit vollständig gestreckten Armen etwa schulterbreit auseinander. Wir halten unseren Körper gerade, nach hinten geneigt, wie in den vorherigen Übungen, da wir unseren Körper durch die Aktivierung des Bizeps in Richtung der TRX-Bänder heben. Unser Körper ist gerade, mit flach auf dem Boden stehenden Füßen. Diesmal positionieren wir unsere Arme seitlich geöffnet und auf Brusthöhe. Die Bewegung, die wir ausführen, ist eine Kontraktion in Richtung unserer Brust. Um das zu erreichen, beugen wir unsere Ellbogen, sodass wir durch die Aktivierung des Bizeps unseren Körper zu den Bändern ziehen können.
