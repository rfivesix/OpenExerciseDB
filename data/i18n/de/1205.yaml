exercise_id: '1205'
language: de
status: ai_reviewed
name: Handgelenk-Curls mit Kurzhanteln
description: |-
  Ausgangsposition:
  • Setze dich auf eine Trainingsbank und greife zwei Kurzhanteln im Untergriff (Handflächen zeigen nach oben).
  • Lege deine Unterarme flach auf die Oberschenkel oder die Kante der Bank, sodass die Handgelenke frei über die Knie hinausragen.

  Ausführung:
  • Lasse die Hanteln kontrolliert nach unten absinken und rolle sie leicht in die Finger ab.
  • Rolle die Hanteln über die Handflächen wieder nach oben und beuge die Handgelenke kraftvoll nach oben in Richtung der Unterarme.
  • Halte die Kontraktion der Unterarmbeuger am obersten Punkt kurz und senke die Hanteln langsam wieder ab.
