name: Bizepscurls am Kabelzug
description: 'Ausgangsposition:

  Stelle dich aufrecht vor den unteren Kabelzug (oder setze dich davor). Greife die
  gerade Stange oder SZ-Stange im schulterbreiten Untergriff (Handflächen nach oben).
  Fixiere die Ellbogen eng an den Körperseiten.


  Ausführung:

  1. Halte die Oberarme stabil und beuge die Unterarme kontrolliert nach oben in Richtung
  der Schultern.

  2. Kontrahiere den Bizeps am obersten Punkt für einen Moment maximal.

  3. Senke das Gewicht langsam und kontrolliert ab, bis die Arme fast vollständig
  gestreckt sind.


  Hinweise:

  Der Kabelzug sorgt im Gegensatz zu Hanteln für eine gleichmäßige, ununterbrochene
  Muskelspannung über die gesamte Bewegungsamplitude.'
