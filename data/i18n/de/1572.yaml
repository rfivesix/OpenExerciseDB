name: Bird Dog
description: 'Ausgangsposition:

  Gehe in den Vierfüßlerstand auf eine Matte. Die Hände stehen direkt unter den Schultern,
  die Knie unter den Hüften. Die Wirbelsäule ist in neutraler Position, der Blick
  zum Boden gerichtet.


  Ausführung:

  1. Strecke gleichzeitig den rechten Arm gerade nach vorne und das linke Bein gerade
  nach hinten aus, bis beide eine waagerechte Linie mit dem Rumpf bilden.

  2. Halte die Endposition für 1–2 Sekunden unter voller Anspannung von Gesäß und
  Rückenstreckern.

  3. Führe Arm und Bein kontrolliert zurück in die Ausgangsposition und wiederhole
  die Bewegung auf der Gegenseite.


  Hinweise:

  Achte darauf, das Becken nicht aufzudrehen und kein Hohlkreuz zu bilden. Eine fundamentale
  Stabilitätsübung für Rumpf und hintere Kette.'
