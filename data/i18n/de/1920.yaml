name: Intensive Schulterdehnung
description: 'Ausgangsposition:

  Stelle dich aufrecht mit dem Rücken zu einer hüfthohen Bank oder Stange. Platziere beide Hände hinter dem Rücken auf der Kante oder greife mit einer Hand einen festen Pfeiler hinter dir.


  Ausführung:

  Senke die Hüfte kontrolliert leicht ab oder trete sanft einen Schritt nach vorne, sodass die Arme hinter den Rumpf in die Streckung geführt werden. Halte die Brust aufgerichtet und die Schultern nach hinten unten gezogen, bis eine deutliche Dehnung im vorderen und seitlichen Deltamuskel spürbar wird. Halte diese Position ruhig für 30 bis 60 Sekunden.


  Hinweise:

  Vermeide es, die Schultern nach vorne oben zu ziehen. Atme gleichmäßig und entspanne die Schultermuskulatur in die Dehnung hinein.'
