name: Rückenstrecken an der Maschine
description: |-
  Ausgangsposition:
  • Setze dich in die Rückenstrecker-Maschine und stelle das Rückenpolster auf Höhe der Schulterblätter oder des oberen Rückens ein.
  • Fixiere deine Beine unter den Haltepolstern und halte den Rücken gerade.

  Ausführung:
  • Drücke das Polster mit der Kraft deiner Rückenstrecker (unterer Rücken) und des Gesäßes langsam nach hinten.
  • Halte die gestreckte Position kurz, ohne die Lendenwirbelsäule zu überstrecken.
  • Führe den Oberkörper langsam und kontrolliert wieder nach vorne in die Ausgangsposition zurück.
