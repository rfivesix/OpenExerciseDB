name: Split Squat (rechts)
description: 'Ausgangsposition: Stehe aufrecht und mache einen weiten Ausfallschritt
  nach vorne mit dem rechten Bein. Die Füße bleiben hüftbreit versetzt für sicheren
  Stand.

  Ausführung: Senke das Becken senkrecht nach unten ab, indem du beide Knie beugst,
  bis der rechte Oberschenkel waagerecht steht und das linke Knie knapp über dem Boden
  stoppt.

  Rückkehr: Drücke dich kraftvoll über die rechte Ferse wieder nach oben in die Ausgangsstellung,
  ohne die Fußposition zu verändern.

  Hinweis: Der Oberkörper bleibt während der gesamten Übung aufrecht.'
