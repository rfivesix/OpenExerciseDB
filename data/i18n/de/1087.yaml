name: Hang Power Cleans mit Kurzhanteln
description: |-
  Stehe aufrecht auf deinen Füßen mit deinen Kurzhanteln und halte sie an den Seiten. Beuge dich in der Hüfte, um sie bis zu den Knien abzusenken (Bild 1). Richte dich mit einem leichten Sprung wieder auf und nutze den Schwung, um die Kurzhanteln auf deine Schultern zu ziehen (Bild 2). Stelle dich gerade hin, senke sie dann kontrolliert wieder an die Seiten und wiederhole. Halte dies schnell und explosiv; wenn dein Puls nicht in die Höhe schießt, machst du sie falsch.
