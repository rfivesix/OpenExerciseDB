name: Hang Power Cleans mit Kurzhanteln
description: |-
  Ausgangsposition:
  Stehe aufrecht mit hüftbreitem Stand und halte zwei Kurzhanteln mit neutralem Griff seitlich am Körper. Beuge leicht die Knie und schiebe die Hüfte nach hinten, um die Hanteln knapp über Kniehöhe in die Hang-Position zu senken.

  Ausführung:
  1. Strecke Hüfte und Knie explosiv und führe einen kräftigen Schulterzug (Shrug) aus.
  2. Nutze den Schwung der Hüftstreckung, führe die Hanteln nah am Körper nach oben, bringe die Ellenbogen schnell nach vorne durch und fange die Hanteln auf Schulterhöhe in einer leichten Kniebeuge (Viertelkniebeuge) ab.
  3. Richte dich vollständig auf und senke die Hanteln anschließend kontrolliert wieder in die Hang-Position ab.
  4. Führe die Bewegung dynamisch und kraftvoll aus.
