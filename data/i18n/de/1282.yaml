name: Isometrischer Klimmzug im Untergriff
description: 'Ausgangsposition:

  Umgreife die Klimmzugstange im schulterbreiten Untergriff (Handflächen zum Gesicht) und ziehe dich nach oben, bis sich dein
  Kinn deutlich über der Stange befindet.


  Ausführung:

  1. Halte diese oberste Position mit maximal angewinkelten Armen und eng am Körper geführten Ellbogen statisch.

  2. Spanne den Latissimus, die Bizepsmuskeln und den gesamten Rumpf fest an.

  3. Halte die Position für die vorgegebene Zeitdauer und senke dich anschließend kontrolliert ab.'
