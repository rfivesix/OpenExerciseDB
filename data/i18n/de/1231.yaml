name: Trizepsdehnung rechts
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin oder setze dich mit geradem Rücken auf eine Bank.
  • Hebe deinen rechten Arm über den Kopf, beuge den Ellbogen und lasse die rechte Hand hinter deinen Nacken bzw. zwischen die Schulterblätter sinken.

  Ausführung:
  • Greife mit der linken Hand deinen rechten Ellbogen und ziehe ihn sanft nach hinten und leicht nach unten.
  • Spüre eine angenehme Dehnung im rechten Trizeps.
  • Halte die Dehnung für 20 bis 30 Sekunden bei ruhiger, gleichmäßiger Atmung, ohne ins Hohlkreuz zu verfallen.
