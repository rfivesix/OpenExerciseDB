name: Brustpresse im Sitzen (Chest Press)
description: |-
  Ausgangsposition:
  Stelle den Sitz der Brustpressmaschine so ein, dass sich die Griffe auf Höhe der mittleren bis unteren Brust befinden. Setze dich aufrecht hin, drücke den Rücken und den Kopf fest an das Rückenpolster und stelle die Füße flach auf den Boden.

  Ausführung:
  1. Greife die Griffe mit festem Griff und ziehe die Schulterblätter nach hinten unten an das Polster.
  2. Drücke die Griffe kontrolliert und kraftvoll nach vorne, bis die Arme fast gestreckt sind (die Ellenbogen nicht ganz durchdrücken).
  3. Halte die Kontraktion in den Brustmuskeln am vorderen Umkehrpunkt für eine Sekunde.
  4. Führe die Griffe langsam und kontrolliert zurück, bis eine angenehme Dehnung in der Brust spürbar ist, ohne das Gewicht ganz abzusetzen.
