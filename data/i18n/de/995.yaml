name: Armkreisen rückwärts
description: 'Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand. Strecke beide
  Arme seitlich auf Schulterhöhe aus, die Handflächen zeigen nach unten.

  Ausführung: Kreise die gestreckten Arme in gleichmäßigen, fließenden Kreisbewegungen
  nach hinten und öffne dabei den Brustkorb.

  Hinweis: Halte den Rumpf stabil und vermeide ein Hohlkreuz während des Kreisens.'
