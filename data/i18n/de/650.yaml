name: Thruster
description: '- Halte die Langhantel in der Front-Rack-Position auf den vorderen Schultern
  und stehe etwa schulterbreit.

  - Führe eine tiefe Kniebeuge (Front Squat) aus, bis die Oberschenkel mindestens
  parallel zum Boden sind.

  - Drücke dich dynamisch nach oben und nutze den Schwung aus den Beinen, um die Hantel
  in einer flüssigen Bewegung über den Kopf zu drücken (Push Press).

  - Senke die Stange kontrolliert wieder auf die Schultern ab und gehe fließend in
  die nächste Kniebeuge über.'
