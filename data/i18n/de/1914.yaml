name: Stützhalten am Barren (Support Hold)
description: 'Ausgangsposition:

  Begib dich zwischen die Holme eines Parallelbarrens (Dip-Station). Greife die Griffe im neutralen Griff und drücke dich mit gestreckten Armen nach oben, sodass die Füße den Boden verlassen.


  Ausführung:

  Halte diese Stützposition mit vollständig gestreckten, aber nicht überstreckten Armen statisch. Drücke die Schultern aktiv nach unten (Depression der Schulterblätter), öffne die Brust und spanne Bauch und Gesäß fest an, um eine stabile Körperlinie zu bilden. Halte die Position für die vorgegebene Zeitspanne.


  Hinweise:

  Vermeide es, in den Schultern einzusinken; die Schultern bleiben weit von den Ohren entfernt und der Körper voll unter Spannung.'
