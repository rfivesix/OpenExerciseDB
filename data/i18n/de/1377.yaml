name: Rumpfdrehung
description: |-
  Rumpfdrehung im Stehen: Beanspruche deinen Rumpf und verbessere deine Beweglichkeit mit dieser dynamischen Übung im Stehen! Bei der Rumpfdrehung im Stehen drehst du deinen Oberkörper, während du Füße und Hüfte stabil hältst, deine schrägen Bauchmuskeln anspannst und deinen gesamten Oberkörper dehnst. Diese Bewegung hilft dabei: die Rumpfmuskulatur zu kräftigen, die Beweglichkeit von Wirbelsäule und Oberkörper zu erhöhen, die Haltung und das Gleichgewicht zu verbessern und die allgemeine sportliche Leistung zu steigern. Führe 3 Sätze mit je 10-15 Wiederholungen aus, indem du dich zu jeder Seite drehst, um die Vorteile dieser wirksamen und effizienten Übung zu spüren!
