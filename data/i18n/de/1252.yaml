name: Front-Lever-Klimmzug
description: 'Ausgangsposition:

  Begib dich an der Klimmzugstange in eine stabile Front-Lever-Position (mit gestreckten Beinen oder in der Tuck-Variante),
  sodass dein Körper waagerecht unter der Stange schwebt.


  Ausführung:

  1. Ziehe deine Brust kraftvoll zur Stange, indem du die Ellbogen beugst und nah am Körper nach hinten-unten führst.

  2. Halte die Rumpfspannung aufrecht, sodass der Körper während des gesamten Zuges horizontal bleibt.

  3. Senke dich langsam und kontrolliert wieder in die Ausgangsposition des Front Levers ab.'
