name: Klimmzüge im Untergriff
description: 'Ausgangsposition:

  Hänge dich im etwa schulterbreiten Untergriff (Handflächen zum Körper gerichtet) an eine Klimmzugstange. Die Arme sind vollständig
  gestreckt.


  Ausführung:

  1. Ziehe deinen Körper kontrolliert nach oben, indem du die Ellbogen nach unten und hinten führst, bis dein Kinn die Stange
  passiert hat.

  2. Halte die Kontraktion am obersten Punkt für einen kurzen Moment und spanne Latissimus und Bizeps maximal an.

  3. Senke deinen Körper langsam und kontrolliert wieder in den vollen Hang ab.'
