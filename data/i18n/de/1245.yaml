name: Front Lever
description: 'Ausgangsposition:

  Hänge dich im schulterbreiten Obergriff an eine stabile Klimmzugstange.


  Ausführung:

  1. Ziehe die Schulterblätter aktiv nach hinten-unten und spanne den Rumpf, das Gesäß und den Latissimus maximal an.

  2. Hebe den gesamten Körper mit vollständig gestreckten Armen nach oben, bis er sich in einer geraden Linie waagerecht parallel
  zum Boden befindet.

  3. Halte diese statische Position stabil für die angestrebte Zeitdauer.


  Hinweise:

  Vermeide ein Durchhängen der Hüfte oder ein Hohlkreuz. Eine der anspruchsvollsten Eigengewichtsübungen für Oberkörper und
  Rumpfstabilität.'
