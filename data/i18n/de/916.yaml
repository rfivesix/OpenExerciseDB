name: Schulterdrücken an der Multipresse
description: '- Platziere eine Trainingsbank mit etwa 80 bis 85 Grad aufgestellter
  Rückenlehne in der Multipresse.

  - Setze dich hin, greife die geführte Stange im Obergriff etwas weiter als schulterbreit
  und entriegele sie auf Kinnhöhe.

  - Drücke die Stange kraftvoll über den Kopf nach oben, ohne die Ellenbogen am obersten
  Punkt ganz durchzudrücken.

  - Senke die Stange langsam und kontrolliert wieder bis knapp vor das Kinn bzw. den
  oberen Schlüsselbeinbereich ab.'
