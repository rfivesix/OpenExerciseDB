exercise_id: '1117'
language: de
status: ai_reviewed
name: Sitzendes Rudern am Kabelzug
description: |-
  Ausgangsposition:
  Setze dich auf die Sitzbank des Kabelruders und platziere deine Füße fest auf den Fußrasten mit leicht gebeugten Knien. Beuge dich mit geradem Rücken leicht nach vorne, greife den V-Griff (oder die Stange) und richte den Oberkörper senkrecht auf. Ziehe die Schultern nach hinten unten.

  Ausführung:
  1. Ziehe den Griff kontrolliert zum unteren Bauch/Bauchnabel, während du die Ellenbogen eng am Körper nach hinten führst.
  2. Ziehe am Ende des Zugs die Schulterblätter aktiv zusammen und spüre die Kontraktion im Latissimus und Rhomboiden.
  3. Halte den Oberkörper stabil aufrecht (kein extremes Vor- und Zurückwippen des Torsos).
  4. Führe das Gewicht langsam und kontrolliert zurück, bis die Arme gestreckt sind und die Schulterblätter sich sanft nach vorne öffnen.
