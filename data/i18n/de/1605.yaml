name: Copenhagen-Adduktion
description: |-
  Lege dich auf die Seite, mit dem Ellbogen direkt unter der Schulter, ähnlich wie bei einem seitlichen Unterarmstütz. Lege das obere Bein auf eine Bank, sodass die Innenseite des Fußes oder Knöchels darauf ruht. Hebe deine Hüften und halte deinen Körper in einer geraden Linie, während du das untere Bein vom Boden abhebst. Die Übung aktiviert die Adduktoren des oberen Beins stark und fordert gleichzeitig den Rumpf und die Hüftstabilisatoren.
