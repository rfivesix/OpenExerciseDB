name: Serratus-Wandgleiten (Wall Slide)
description: |-
  Ausgangsposition:
  Stelle dich aufrecht mit dem Gesicht zu einer glatten Wand. Lege deine Unterarme senkrecht flach an die Wand, sodass sowohl Ellbogen als auch Handgelenke Wandkontakt haben. Die Ellbogen stehen etwa auf Schulterhöhe und schulterbreit auseinander.

  Ausführung:
  1. Drücke deine Unterarme aktiv gegen die Wand, um die Schulterblätter nach vorne außen zu schieben (Protraction).
  2. Lasse deine Unterarme langsam und kontrolliert an der Wand nach oben gleiten, bis die Ellbogen sich auf Stirn- oder Augenhöhe befinden.
  3. Halte die Dehnung und Aktivierung im vorderen Sägemuskel (Serratus anterior) am höchsten Punkt für 1 bis 2 Sekunden.
  4. Gleite mit den Unterarmen kontrolliert wieder in die Ausgangsposition nach unten zurück.

  Hinweise:
  Halte während des gesamten Gleitens ständigen Druck gegen die Wand aufrecht und vermeide ein Hohlkreuz.
