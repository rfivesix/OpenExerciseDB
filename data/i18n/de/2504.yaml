name: Kurzhantel-Hammercurls
description: |-
  Ausgangsposition:
  Stelle dich aufrecht mit hüftbreitem Stand hin (oder setze dich auf eine Bank). Halte in jeder Hand eine Kurzhantel im neutralen Griff (Handflächen zeigen zueinander). Die Arme hängen seitlich am Körper herab, die Schultern sind nach hinten unten fixiert.

  Ausführung:
  1. Beuge die Ellbogen und curle die Hanteln kontrolliert nach oben in Richtung Schultern, während die Handflächen während der gesamten Bewegung zueinander gerichtet bleiben.
  2. Halte die Kontraktion am obersten Punkt für 1 Sekunde und spanne Brachialis und Brachioradialis fest an.
  3. Senke die Kurzhanteln langsam und kontrolliert wieder vollständig nach unten ab.

  Hinweise:
  Halte die Ellbogen fest an den Seiten des Oberkörpers fixiert und vermeide jeglichen Schwung aus den Schultern oder dem Rumpf.
