name: Gesäßstrecken am Kabelzug
description: |-
  Ausgangsposition:
  • Befestige eine Fußschlaufe an der tiefen Rolle des Kabelzugs und lege sie um dein Fußgelenk.
  • Stelle dich mit dem Gesicht zum Kabelturm, halte dich mit beiden Händen stabil am Rahmen fest und beuge den Oberkörper leicht nach vorne.
  • Das Standbein ist minimal gebeugt, die Hüfte bleibt parallel zum Kabelzug.

  Ausführung:
  • Führe das Arbeitsbein mit fast gestrecktem Knie kontrolliert nach hinten oben, indem du die Gesäßmuskulatur anspannst.
  • Halte die maximale Kontraktion am obersten Punkt für einen kurzen Moment.
  • Führe das Bein langsam und kontrolliert gegen den Zug des Kabels wieder nach vorne, ohne das Gewicht ganz abzusetzen.
