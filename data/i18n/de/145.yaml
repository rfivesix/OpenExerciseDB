name: Holzhacker am Kabelzug
description: |-
  Stelle die Kabelrolle etwas niedriger als auf Brusthöhe ein. Halte den Körper nach vorne gerichtet und die Hüfte stabil. Greife den Griff der Rolle, strecke deine Arme vollständig und führe sie nach vorne und diagonal über deinen Körper. Halte am Ende der Bewegung 1 Sekunde lang inne und kehre langsam in die Ausgangsposition zurück.
