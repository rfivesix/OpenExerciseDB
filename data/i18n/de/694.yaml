name: Aufrechtes Rudern mit Kurzhanteln
description: '- Stelle dich aufrecht hin, die Füße etwa schulterbreit. Halte in jeder
  Hand eine Kurzhantel vor den Oberschenkeln, die Handflächen zeigen zum Körper.

  - Ziehe die Kurzhanteln nah am Körper nach oben, wobei die Ellenbogen die Bewegung
  anführen und stets höher als die Hanteln bleiben.

  - Hebe die Gewichte bis auf Brusthöhe an, pausiere kurz und senke sie kontrolliert
  wieder in die Ausgangsposition ab.'
