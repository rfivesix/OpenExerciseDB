name: Vordere Halsdehnung
description: |-
  Ausgangsposition:
  Sitze oder stehe mit aufrechtem Rücken und entspannten Schultern.

  Ausführung:
  1. Öffne den Mund leicht oder weit.
  2. Neige den Kopf mit geöffnetem Mund langsam nach hinten, bis eine sanfte Dehnung an der Halsvorderseite spürbar ist. Bei Bedarf können die Hände zur Unterstützung leicht an den Hinterkopf gelegt werden.
  3. Schließe und öffne den Mund mehrmals sehr langsam, um die Dehnung der vorderen Hals- und Zungenbeinmuskulatur sowie des Platysmas zu vertiefen.
  4. Kehre langsam und kontrolliert in die neutrale Ausgangsposition zurück.
