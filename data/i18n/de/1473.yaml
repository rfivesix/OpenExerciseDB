name: Reverse Kabelzug-Fliegende
description: |-
  Ausgangsposition:
  Stelle zwei Seilzüge auf Schulter- oder Kopfhöhe ein. Greife die Kabel über Kreuz (den linken Zug mit der rechten Hand und den rechten Zug mit der linken Hand), vorzugsweise direkt am Karabiner oder mit Griffen. Stelle dich mittig hin, halte die Arme vor der Brust gestreckt mit minimal gebeugten Ellenbogen.

  Ausführung:
  1. Führe beide Arme gleichzeitig in einer weiten Bogenbewegung horizontal nach hinten und außen, bis die Ellenbogen auf Höhe der Schultern sind.
  2. Spanne die hintere Schulter (hinterer Deltamuskel) und den oberen Rücken am Ende der Bewegung maximal an.
  3. Führe die Arme langsam und kontrolliert wieder vor den Körper zurück, ohne dass sich die Gewichte absetzen.

  Hinweise:
  Halte die Ellenbogen während der gesamten Bewegung in einem leichten, festen Winkel. Vermeide Schwung aus dem Rumpf.
