name: Schulterdrücken mit Kurzhanteln im Sitzen
description: 'Ausgangsposition:

  Setze dich auf eine Trainingsbank mit steil aufgerichteter Rückenlehne (ca. 75–85 Grad). Hebe zwei Kurzhanteln auf Schulterhöhe, sodass deine Handflächen nach vorne zeigen und deine Ellbogen etwa im 90-Grad-Winkel gebeugt sind. Die Füße stehen fest auf dem Boden, die Schulterblätter sind fixiert.


  Ausführung:

  Drücke die Kurzhanteln kontrolliert senkrecht nach oben, bis deine Arme fast vollständig gestreckt sind, ohne die Ellbogen durchzudrücken. Führe die Hanteln am obersten Punkt leicht zueinander, ohne sie aneinanderzustoßen. Halte die Kontraktion für einen Moment und senke die Hanteln langsam und kontrolliert zurück auf Schulterhöhe ab.


  Hinweise:

  Halte den Rücken flach am Polster und vermeide ein starkes Hohlkreuz beim Hochdrücken des Gewichts.'
