name: Skilanglauf-Ergometer (SkiErg)
description: 'Ausgangsposition:

  Stelle dich mit den Füßen hüftbreit auf die Plattform des SkiErg-Geräts. Greife
  die Griffe über Kopf mit den Handflächen nach innen.


  Ausführung:

  1. Beuge leicht die Knie, schiebe das Gesäß nach hinten und ziehe beide Arme mit
  der Kraft von Latissimus, Trizeps und Rumpf explosiv nach unten an den Hüften vorbei.

  2. Die Hände passieren die Oberschenkel seitlich der Knie am tiefsten Punkt des
  Zugs.

  3. Richte den Körper durch Hüftstreckung wieder auf und führe die Griffe kontrolliert
  zurück nach oben über den Kopf.


  Hinweise:

  Simuliert die Doppelstock-Technik des Skilanglaufs und bietet ein hocheffektives,
  gelenkschonendes Ganzkörper-Ausdauertraining.'
