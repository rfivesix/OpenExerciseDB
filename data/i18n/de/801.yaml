name: Liegestütz auf Kurzhanteln
description: '- Platziere zwei Kurzhanteln mit flachen Kanten oder Kurzhantelgriffe
  schulterbreit auf dem Boden und greife sie im neutralen Griff.

  - Begib dich in die Liegestützposition mit fest angespanntem Rumpf und gestrecktem
  Körper von Kopf bis Fuß.

  - Senke deine Brust kontrolliert zwischen die Kurzhanteln ab, um den vergrößerten
  Bewegungsumfang (Defizit) optimal zu nutzen.

  - Drücke dich kraftvoll aus der Brust und den Armen wieder nach oben in die Ausgangsposition
  zurück.'
