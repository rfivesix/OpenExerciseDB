name: Soleus-Dehnung stehend
description: |-
  Ausgangsposition:
  • Stelle dich vor eine Wand und stütze dich mit beiden Händen auf Schulterhöhe ab.
  • Mache mit einem Bein einen kurzen Schritt nach hinten (kürzerer Schritt als bei der normalen Wadendehnung).

  Ausführung:
  • Im Gegensatz zur normalen Wadendehnung beugst du nun auch das hintere Knie leicht an, während die hintere Ferse fest auf dem Boden bleibt.
  • Verlagere dein Körpergewicht nach unten und leicht nach vorne, um die Dehnung tief im unteren Wadenbereich (M. soleus) und oberhalb der Achillessehne zu spüren.
  • Halte die Dehnung für 20 bis 30 Sekunden und wiederhole sie auf der anderen Seite.
