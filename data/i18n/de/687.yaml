name: Schulterdrücken stehend
description: '- Nimm die Langhantel im schulterbreiten Obergriff aus dem Rack und
  lege sie stabil auf den vorderen Schultern und oberen Schlüsselbeinen ab.

  - Spanne Bauch und Gesäß fest an, neige den Kopf minimal zurück und drücke die Hantel
  vertikal nach oben.

  - Sobald die Stange die Stirn passiert hat, schiebe den Kopf wieder leicht nach
  vorne und strecke die Arme über dem Kopf vollständig aus.

  - Senke die Langhantel langsam und kontrolliert wieder auf die vordere Schulter
  ab.'
