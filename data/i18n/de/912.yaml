name: Kabelzug-Curls mit gerader Stange
description: '- Stelle dich aufrecht vor den unteren Kabelzug und greife die gerade
  Stange im schulterbreiten Untergriff.

  - Halte die Ellenbogen eng an den Körperseiten fixiert und die Schultern nach hinten
  unten gezogen.

  - Beuge die Arme und curle die Stange kontrolliert nach oben Richtung Brust, während
  die Oberarme unbewegt bleiben.

  - Halte die Kontraktion im Bizeps am obersten Punkt kurz und senke das Gewicht langsam
  wieder ab.'
