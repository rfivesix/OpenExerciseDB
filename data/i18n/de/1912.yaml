name: Rumpfrotation im Sitzen (Russian Twist)
description: 'Ausgangsposition:

  Setze dich auf eine Matte, beuge die Knie und stelle die Fersen auf. Lehne den geraden Oberkörper leicht nach hinten (ca. 45 Grad), bis die Bauchmuskeln spürbar arbeiten. Hebe die Füße knapp vom Boden ab, um auf den Sitzbeinhöckern zu balancieren.


  Ausführung:

  Rotiere den Oberkörper kontrolliert von Seite zu Seite und berühre mit den Händen jeweils neben der Hüfte kurz den Boden. Führe die Bewegung flüssig und kontrolliert aus der Bauch- und Rumpfmuskulatur aus.


  Hinweise:

  Halte die Brust stolz und die Wirbelsäule gestreckt; vermeide ein Einrunden des unteren Rückens oder reines Hin- und Herschwingen der Arme.'
