name: Nackenkreisen im Uhrzeigersinn
description: |-
  Ausgangsposition:
  Sitze oder stehe mit aufrechtem Rücken, entspannten und tiefen Schultern. Senke das Kinn sanft in Richtung Brustbein ab.

  Ausführung:
  1. Führe den Kopf in einer langsamen, kontrollierten und kreisenden Bewegung im Uhrzeigersinn: Zuerst zur rechten Schulter neigen, dann behutsam nach hinten führen, weiter zur linken Schulter und zurück zur Brust.
  2. Bewege den Kopf gleichmäßig und ohne ruckartige Bewegungen oder Überstreckung der Halswirbelsäule.
  3. Wiederhole die Kreisbewegung für die gewünschte Anzahl an Wiederholungen.
