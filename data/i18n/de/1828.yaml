name: Stomach Vacuum (Bauchnabel einziehen)
description: "Ausgangsposition:\nLege dich rücklings auf eine Matte, winkle deine\
  \ Knie an und stelle die Füße flach auf den Boden (alternativ im Vierfüßlerstand\
  \ oder aufrechten Sitz). Lege deine Hände auf den Unterbauch, um die Muskelaktivierung\
  \ zu ertasten.\n\nAusführung:\n1. Atme vollständig durch den Mund aus und entleere\
  \ deine Lungen komplett.\n2. Ziehe deinen Bauchnabel sanft und kontrolliert nach\
  \ innen und oben in Richtung deiner Wirbelsäule, als wolltest du eine zu enge Hose\
  \ schließen.\n3. Halte das Becken und die Lendenwirbelsäule ruhig (keine Beckenkippung).\n\
  4. Halte die eingezogene Spannung für 10 bis 15 Sekunden, während du flach und kontrolliert\
  \ weiteratmest.\n5. Löse die Kontraktion langsam auf und atme normal ein.\n\nHinweise:\n\
  Diese Übung (Abdominal Draw-In Maneuver) aktiviert gezielt den Musculus transversus\
  \ abdominis, den tiefsten Bauchmuskel für eine schlanke Taille und Wirbelsäulenstabilität."
