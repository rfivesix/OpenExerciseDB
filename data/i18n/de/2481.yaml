name: Beinschlag mit Schwimmbrett
description: |-
  Ausgangsposition:
  Halte ein Schwimmbrett (Kickboard) mit beiden Händen am vorderen oder hinteren Ende fest. Stoße dich von der Wand ab und nimm eine flache, waagerechte Bauchlage im Wasser ein, Arme nach vorne ausgestreckt.

  Ausführung:
  1. Schlage abwechselnd mit fast gestreckten Beinen locker und kontinuierlich aus der Hüfte (Kraulbeinschlag).
  2. Halte das Gesicht im Wasser, Blick zum Beckenboden gerichtet, und hebe oder drehe den Kopf nur kurz zum Einatmen an.
  3. Halte die Fußspitzen gestreckt und erzeuge eine kleine, rhythmische Wasserfontäne an der Oberfläche.

  Hinweise:
  Knicke die Knie nicht übermäßig ein; der Impuls kommt aus der Gesäßmuskulatur und den Hüftbeugern. Dies stärkt die Beinausdauer und schult die stabile Wasserlage.
