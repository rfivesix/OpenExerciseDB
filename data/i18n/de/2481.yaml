name: Beinschlag mit Schwimmbrett
description: |-
  Halte ein Schwimmbrett mit beiden Händen und strecke die Arme vor dir aus; das Gesicht ist im Wasser (hebe zum Atmen bei Bedarf den Kopf nach vorn). Der Beinschlag kommt aus der Hüfte, nicht aus den Knien; halte die Beine überwiegend gestreckt, mit leichter Beugung und einem gleichmäßigen, kompakten Kraulbeinschlag. Das stärkt die Ausdauer der Beine und hält den Körper horizontal, ohne dass du dich um die Arme kümmern musst.
