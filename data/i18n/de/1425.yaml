name: Toe Taps
description: |-
  Toe Taps sind eine rumpforientierte Übung, die in Rückenlage ausgeführt wird. Lege dich flach hin, die Arme seitlich neben deinem Körper und die Beine in eine Tabletop-Position angehoben (Knie im 90-Grad-Winkel gebeugt). Senke langsam einen Fuß ab, um kurz den Boden anzutippen. Halte dabei deinen Rumpf angespannt und deinen unteren Rücken in den Boden gedrückt. Kehre in die Ausgangsposition zurück und wechsle das Bein ab. Diese Übung stärkt den Rumpf, während sie die Belastung des unteren Rückens minimiert.
