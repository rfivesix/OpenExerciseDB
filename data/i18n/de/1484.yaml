name: Kabelzug-Crossover kombiniert (Omni Cable Crossover)
description: |-
  Ausgangsposition:
  Stelle an einer Doppel-Kabelzugstation eine Umlenkrolle auf die höchste Position und die andere auf die niedrigste Position ein. Stelle dich mit leicht versetzten Füßen mittig zwischen die Türme und greife beide Griffe.

  Ausführung:
  1. Führe den tief eingestellten Kabelzug in einer Bogenbewegung nach oben und diagonal über den Körper, um die obere (klavikuläre) Brust anzusprechen.
  2. Führe den hoch eingestellten Kabelzug in einer Bogenbewegung nach unten und diagonal über den Körper, um die untere (sternokostale) Brust zu fordern.
  3. Nach Abschluss des Satzes wechselst du die Höheneinstellungen der beiden Kabelzüge und wiederholst die Übung für die andere Seite.

  Hinweise:
  Passe die Gewichte an den Zugwinkel an: Bei der Bewegung von oben nach unten ist die Brustmuskulatur meist stärker (ca. 20–40 % mehr Gewicht möglich) als bei der Bewegung von unten nach oben.
