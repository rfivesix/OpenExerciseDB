name: Hüftabduktion im Stand
description: |-
  Ausgangsposition:
  Stelle dich aufrecht hin, die Hände können zur Unterstützung an einer Wand oder Stuhllehne abgestützt werden. Verlagere das Körpergewicht stabil auf das Standbein, halte das Becken waagerecht und den Rumpf aufgerichtet.

  Ausführung:
  1. Hebe das unbelastete Bein mit gestrecktem oder leicht gebeugtem Knie kontrolliert seitlich nach außen ab (Abduktion).
  2. Führe das Bein nur so weit nach oben, wie das Becken gerade und der Oberkörper aufrecht bleiben kann (kein Ausweichen des Oberkörpers zur Gegenseite).
  3. Spanne am obersten Punkt die Gesäßmuskulatur (insbesondere Musculus gluteus medius) für eine Sekunde an.
  4. Senke das Bein langsam und kontrolliert wieder ab, ohne das Gewicht ganz abzusetzen.
  5. Führe alle Wiederholungen durch und wechsle anschließend das Bein.
