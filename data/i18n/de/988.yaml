name: Bulgarian Split Squat (links)
description: 'Ausgangsposition: Stehe etwa zwei Fußlängen vor einer stabilen Bank
  oder einem Stuhl. Lege den Fußrücken des rechten Fußes hinter dir auf der Bank ab,
  der linke Fuß steht fest vorne auf dem Boden.

  Ausführung: Senke das Becken kontrolliert ab, indem du das vordere linke Knie beugst,
  bis der linke Oberschenkel etwa waagerecht zum Boden steht und das hintere Knie
  kurz über dem Boden schwebt.

  Rückkehr: Drücke dich über die Ferse des linken Beins kraftvoll wieder nach oben
  in die Ausgangsposition.

  Hinweis: Der Oberkörper bleibt stabil und leicht nach vorne geneigt; halte das Becken
  gerade.'
