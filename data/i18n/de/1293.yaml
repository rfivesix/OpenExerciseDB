name: Einarmige Liegestütze
description: 'Ausgangsposition:

  Gehe in eine Liegestützposition und platziere die stützende Hand mittig unter der Brust. Öffne deine Beine deutlich breiter
  als hüftbreit, um das Gleichgewicht zu sichern. Die freie Hand ruht auf dem Rücken.


  Ausführung:

  1. Beuge den stützenden Arm und senke die Brust langsam und kontrolliert zum Boden ab.

  2. Halte deine Rumpf- und Gesäßmuskulatur fest angespannt, um ein Verdrehen des Körpers zu minimieren.

  3. Drücke dich kraftvoll wieder nach oben in die Ausgangsposition. Wechsle nach dem Satz den Arm.'
