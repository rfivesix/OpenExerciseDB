name: Bauchcrunch
description: |-
  Der Bauchcrunch ist eine klassische Isolationsübung für den Rumpf, die auf dem Boden oder einer Matte ausgeführt wird. Anders als bei einem vollständigen Sit-up ist der Bewegungsumfang kleiner: Du hebst nur die Schultern und den oberen Rücken vom Boden ab und drückst den unteren Rücken fest gegen den Boden.
