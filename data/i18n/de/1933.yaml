name: Umgekehrte Crunches (Reverse Crunches)
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Matte. Platziere die Arme stabilisierend neben dem Körper und hebe die Beine an, wobei Hüfte und Knie etwa im 90-Grad-Winkel gebeugt sind.


  Ausführung:

  Spanne die Bauchmuskeln fest an und ziehe die Knie kontrolliert in Richtung Brust, während du das Becken wenige Zentimeter vom Boden abhebst und einrollst. Halte die maximale Kontraktion kurz fest. Senke das Becken langsam und kontrolliert wieder ab, ohne dass die Beine den Boden berühren oder die Spannung im unteren Bauch verloren geht.


  Hinweise:

  Rolle die Wirbelsäule wirbelweise ein und vermeide es, mit den Beinen Schwung zu holen oder dich mit den Händen stark vom Boden abzudrücken.'
