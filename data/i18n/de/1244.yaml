name: 'Yoga-Übung: Katze-Kuh'
description: |-
  Gehe zuerst in den Vierfüßlerstand. Die Hände sind unter den Schultern. Die Finger sind weit gespreizt und sorgen für einen stabilen Stand. Am besten verlagerst du dein vorderes Körpergewicht auf deine Daumen und Zeigefinger. Setze nun deine Beine hüftbreit auf der Yogamatte ab. Deine Oberschenkel sollten senkrecht unter deinen Hüften sein. Achte darauf, dass dein Gewicht gleichmäßig zwischen deinen Händen und Knien verteilt ist. Dein Kopf ist eine Verlängerung deiner Wirbelsäule und du blickst nach unten auf deine Matte. Dein Rücken ist in einer neutralen Position. Atme tief ein und beginne mit der Katze. Mit der nächsten Ausatmung rundest du deinen Rücken Wirbel für Wirbel. Versuche, dich so weit wie möglich zur Decke zu ziehen. Ziehe deinen Kopf zur Brust und kippe dein Becken. Atme nun tief ein und gehe in die Gegenposition, die Kuh-Haltung. Beuge deinen Rücken nach unten, ziehe deine Schultern leicht zurück und hebe deinen Kopf so weit an, wie es für dich angenehm ist. Dein Blick ist nach oben gerichtet. Atme bewusst aus und wechsle zurück zur Katze. Mit der nächsten Ausatmung wechselst du zurück zur Kuh. Wiederhole die Übung einige Male und achte darauf, dass du im Fluss bist.
