name: Isometrisches Bankdrücken
description: |-
  Ausgangsposition:
  Lege dich rücklings auf eine Flachbank unter eine Langhantel. Platziere die Augen direkt unter der Hantelstange. Ziehe die Schulterblätter zusammen, stelle die Füße flach auf den Boden und greife die Hantel etwas weiter als schulterbreit im Obergriff. Hebe die Hantel aus der Ablage und bringe sie stabil über die Brust.

  Ausführung:
  1. Senke die Hantel kontrolliert bis zum gewünschten Punkt der Bewegung ab (z. B. wenige Zentimeter über der Brust oder am persönlichen Sticking Point). Alternativ drückst du die Stange von unten gegen fest eingestellte Sicherheitsablagen (Pins) im Rack.
  2. Halte die Hantelstange an dieser Position völlig bewegungslos für die vorgegebene Zeitspanne und spanne Brust, vordere Schultern und Trizeps maximal an.
  3. Drücke das Gewicht nach Ablauf der Haltezeit kraftvoll nach oben in die Ausgangsposition aus (bzw. setze es sicher auf den Ablagen ab).

  Hinweise:
  Halte die Körperspannung und die Fußposition während des gesamten Haltens aufrecht. Vermeide es, die Hantel auf dem Brustkorb abzulegen oder einsinken zu lassen.
