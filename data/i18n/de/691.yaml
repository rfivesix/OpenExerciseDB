name: Aufrechtes Rudern an der Multipresse
description: |-
  Der Bewegungsablauf ist derselbe wie bei der Ausführung mit einer SZ-Stange.
  Stelle dich aufrecht hin, die Füße etwa schulterbreit. Halte die Stange im Obergriff vor den Oberschenkeln mit gestreckten Armen. Ziehe die Stange dicht am Körper nach oben bis etwa zum Kinn. Die Ellenbogen führen die Bewegung nach oben an, sodass die Arme am höchsten Punkt ein V bilden. Halte kurz inne und senke die Stange langsam wieder ab.
