name: Trizepsdehnung links
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin oder setze dich mit geradem Rücken auf eine Bank.
  • Hebe deinen linken Arm über den Kopf, beuge den Ellbogen und lasse die linke Hand hinter deinen Nacken bzw. zwischen die Schulterblätter sinken.

  Ausführung:
  • Greife mit der rechten Hand deinen linken Ellbogen und ziehe ihn sanft nach hinten und leicht nach unten.
  • Spüre eine angenehme Dehnung im linken Trizeps.
  • Halte die Dehnung für 20 bis 30 Sekunden bei ruhiger, gleichmäßiger Atmung, ohne ins Hohlkreuz zu fallen.
