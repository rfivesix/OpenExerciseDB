description: |-
  Ausgangsposition:
  • Befestige einen Einzelgriff an der tiefen Rolle eines Kabelzugs.
  • Stelle dich mit leicht gebeugten Knien und nach vorne geneigtem, geradem Oberkörper vor den Kabelturm (Ausfallschritt oder paralleler Stand).
