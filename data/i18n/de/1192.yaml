name: Alternierende Bizeps-Curls mit Kurzhanteln
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin, die Füße hüftbreit platziert.
  • Halte in jeder Hand eine Kurzhantel mit ausgestreckten Armen seitlich am Körper, Handflächen zeigen zueinander (neutraler Griff).
  • Brust anheben, Schultern nach hinten-unten ziehen und Ellbogen eng am Körper fixieren.

  Ausführung:
  • Beuge einen Arm kontrolliert und drehe den Unterarm während des Hebens nach außen (Supination), sodass die Handfläche oben zur Schulter zeigt.
  • Spanne den Bizeps am höchsten Punkt für einen Moment maximal an.
  • Senke die Hantel langsam und kontrolliert ab, während du den anderen Arm nach oben beugst.
  • Vermeide jegliches Mitschwingen des Oberkörpers.
