name: Reverse Butterfly am Kabel
description: '- Stelle die Umlenkrollen an den Kabeltürmen auf etwa Augen- bis Kopfhöhe
  ein.

  - Greife über Kreuz das linke Kabel mit der rechten Hand und das rechte Kabel mit
  der linken Hand, sodass sich die Seile vor dir kreuzen.

  - Führe deine Arme mit leicht gebeugten, aber fixierten Ellenbogen in einem weiten
  horizontalen Bogen nach außen und hinten.

  - Halte die Kontraktion im hinteren Deltamuskel kurz am Endpunkt und führe die Hände
  langsam wieder vor die Brust zurück.'
