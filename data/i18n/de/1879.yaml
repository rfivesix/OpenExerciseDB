name: Y-Raise mit Kurzhanteln auf der Schrägbank
description: "Stelle\neine Schrägbank auf einen 45-Grad-Winkel ein und setze dich\
  \ mit dem Gesicht\nzur Bank, die Brust gegen das Polster, mit einer Kurzhantel in\
  \ jeder Hand, die Handflächen einander zugewandt.\nStelle deine Füße fest auf den\
  \ Boden, um Stabilität zu haben, und lass deine Arme natürlich nach unten hängen,\
  \ mit einer leichten Beugung in den Ellenbogen.\nSpanne deinen Rumpf an und halte\
  \ deinen Rücken während der gesamten Bewegung gerade.\nHebe deine Arme nach vorne\
  \ und außen an, sodass sie eine Y-Form bilden, und halte die Bewegung kontrolliert\
  \ sowie die Ellenbogen leicht gebeugt.\nHebe an, bis deine Arme etwa parallel zum\
  \ Boden und auf einer Linie mit deinen Ohren sind.\nHalte\nam obersten Punkt der\
  \ Bewegung kurz inne, um deine Schultermuskulatur\nvollständig zu aktivieren, und\
  \ senke dann deine Arme langsam in die Ausgangsposition zurück.\nAchte darauf,\n\
  dass die Bewegung sowohl beim Anheben als auch beim Absenken langsam und kontrolliert\
  \ ist,\num die Beanspruchung des Deltamuskels und der unterstützenden Muskulatur\
  \ zu maximieren.\nWiederhole für die gewünschte Anzahl an Wiederholungen und behalte\
  \ dabei stets die korrekte Form bei."
