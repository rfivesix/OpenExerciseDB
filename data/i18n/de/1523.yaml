name: Schlitten schieben
description: 'Ausgangsposition:

  Belade den Gewichtsschlitten mit dem gewünschten Trainingsgewicht. Stelle dich hinter
  den Schlitten und greife die Holme im oberen oder mittleren Bereich mit gestreckten
  oder leicht angewinkelten Armen. Neige den Oberkörper in einem ca. 45-Grad-Winkel
  nach vorne.


  Ausführung:

  1. Drücke dich kraftvoll über die Fußballen ab und schiebe den Schlitten mit kraftvollen,
  gleichmäßigen Schritten nach vorne.

  2. Halte den Rumpf stabil und den Körper von Kopf bis Fuß in einer geraden diagonalen
  Linie.

  3. Schiebe den Schlitten über die vorgegebene Distanz oder Zeit ohne Unterbrechung.


  Hinweise:

  Hervorragende Übung für Beinkraft, Sprintfähigkeit und kardiovaskuläre Konditionierung
  ohne exzentrische Muskelbelastung.'
