name: Glute Bridge
description: |-
  Lege dich mit angewinkelten Knien auf den Rücken, die Füße stehen flach und etwa hüftbreit auf dem Boden.
  Drücke deine Fersen in den Boden und hebe dein Becken an, bis Oberschenkel und Oberkörper eine gerade Linie bilden. Spanne am höchsten Punkt die Gesäßmuskulatur fest an.
  Senke das Becken anschließend langsam und kontrolliert wieder in Richtung Boden ab.
