name: Dragon Flag
description: |-
  In Rückenlage, mit den Händen über dem Kopf an etwas festhalten (Kopfpolster der Hantelbank, unterste Sprosse der Sprossenwand...), sodass der Oberkörper möglichst unbeweglich wird. Dann die Beine in Richtung Decke heben, dabei auch das Becken abheben (ähnlich wie die "Kerze" aus Gymnastik/Yoga). Die Beine langsam wieder ablassen, möglichst viel Widerstand aus dem Bauch heraus. Beine seitlich drehen ist auch möglich.
