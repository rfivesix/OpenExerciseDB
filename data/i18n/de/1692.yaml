name: Schrägbankdrücken an der Smith-Maschine
description: |-
  Ausgangsposition:
  Lege dich auf eine um etwa 30 bis 45 Grad geneigte Schrägbank unter die geführte Langhantel der Smith-Maschine. Greife die Stange im schulterweiten Obergriff, entriegele sie und halte sie mit gestreckten Armen über der oberen Brust. Die Schulterblätter bleiben nach hinten unten fixiert.
  
  Ausführung:
  1. Senke die Stange langsam und kontrolliert ab, bis sie knapp oberhalb des Schlüsselbeins bzw. der oberen Brust ankommt.
  2. Drücke die Stange kraftvoll entlang der Schienen nach oben zurück, bis die Arme gestreckt sind, ohne die Ellbogen zu überstrecken.
  3. Fokussiere dich am obersten Punkt auf eine intensive Kontraktion der oberen Brustmuskulatur.
  4. Nach Beendigung des Satzes die Stange sicher in den Haltehaken der Führung verriegeln.
