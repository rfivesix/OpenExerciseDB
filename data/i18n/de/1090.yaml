name: V-Liegestütz (Pike Push-Up)
description: |-
  Ausgangsposition:
  Stütze die Hände und Füße schulterbreit auf den Boden. Wandere mit den Füßen etwas heran und schiebe das Gesäß weit nach oben, sodass der Körper ein umgekehrtes 'V' bildet (Pike-Position).

  Ausführung:
  1. Beuge die Ellenbogen kontrolliert und senke den Kopf diagonal nach vorne unten zwischen deine Hände ab.
  2. Gehe so tief, bis deine Scheitelhöhe fast den Boden berührt.
  3. Drücke dich kraftvoll über Schultern und Trizeps wieder nach oben und hinten in das umgekehrte 'V'.
  4. Halte den Rumpf stabil und den Kopf in neutraler Verlängerung der Wirbelsäule.
