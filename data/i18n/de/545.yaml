name: Schere
description: |-
  Die Schere ist eine Bauchübung, die den queren Bauchmuskel (Transversus abdominis) stärkt und so hilft, den Bauch zu straffen und den gesamten Rumpf zu kräftigen. Die Schere ist nicht nur eine Kraftübung für den Rumpf, sondern auch eine hervorragende Dehnung für deine hintere Oberschenkelmuskulatur und deinen unteren Rücken. Jeder sucht nach neuen Wegen, den Rumpf zu trainieren, den Bauch zu straffen und die Beweglichkeit zu verbessern. Wenn du lernst, die Schere auszuführen, bekommst du all das in einer einzigen Übung vereint.
