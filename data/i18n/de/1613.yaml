name: Glute Kickback mit Widerstandsband
description: |-
  Der Glute Kickback mit Widerstandsband ist eine Übung, die im Vierfüßlerstand ausgeführt wird. Dabei befestigst du ein Widerstandsband an deinem Fuß und drückst deine Ferse nach hinten und oben, wobei du am höchsten Punkt der Bewegung deine Gesäßmuskulatur anspannst. Gleichzeitig hältst du den Rumpf stabil und den Rücken gerade, um gezielt die Gesäßmuskulatur zu beanspruchen und zu stärken.
