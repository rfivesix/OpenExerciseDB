name: Sitzende Piriformis-Dehnung
description: 'Ausgangsposition:

  Setze dich aufrecht auf einen Stuhl oder eine Trainingsbank. Lege den Außenknöchel eines Beins auf das Knie des gegenüberliegenden Standbeins, sodass der Oberschenkel quer liegt (Vierer-Position).


  Ausführung:

  Richte die Wirbelsäule aufrecht aus und beuge den geraden Oberkörper mit stolzer Brust langsam aus der Hüfte nach vorne. Halte die Position an dem Punkt, an dem du eine tiefe Dehnung im tiefen Gesäßbereich (Piriformis) spürst. Halte diese Dehnung statisch für 20–30 Sekunden unter ruhiger Atmung und wechsle anschließend die Seite.


  Hinweise:

  Teil der Limber-11-Routine von Joe DeFranco. Vermeide ein Einrunden des Rückens; die Dehnung intensiviert sich, wenn die Vorbeuge rein aus der Hüfte mit geradem Rücken erfolgt.'
