name: Hydrantenkreisen (Fire Hydrant Circles)
description: 'Ausgangsposition:

  Gehe auf einer Matte in den stabilen Vierfüßlerstand, Hände unter den Schultern, Knie unter den Hüften, der Rumpf angespannt und die Wirbelsäule neutral.


  Ausführung:

  Hebe ein Knie bei 90 Grad gebeugtem Bein seitlich an und führe mit dem Oberschenkel große, kontrollierte Kreise in der Hüfte aus. Beschreibe zunächst 10 Kreise in Vorwärtsrichtung und anschließend direkt 10 Kreise in Rückwärtsrichtung. Halte dabei das Becken und den Rücken weitgehend waagerecht und stabil. Wiederhole die Übung mit dem anderen Bein.


  Hinweise:

  Teil der Limber-11-Routine von Joe DeFranco. Die Bewegung mobilisiert das Hüftgelenk über den gesamten Bewegungsumfang und aktiviert intensiv die Gesäßmuskulatur vor dem Beintraining.'
