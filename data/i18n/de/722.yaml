name: Step-ups mit Zusatzgewicht
description: '- Nimm eine Langhantel auf den oberen Rücken (Trapez) oder halte zwei
  Kurzhanteln seitlich am Körper und stelle dich aufrecht vor eine stabile Box oder
  Trainingsbank.

  - Setze einen Fuß vollständig auf die Box, sodass die gesamte Fußsohle stabil aufliegt.

  - Drücke dich kraftvoll über die Ferse dieses Standbeins nach oben, bis Hüfte und
  Knie vollständig gestreckt sind und du auf der Box stehst.

  - Senke das hintere Bein langsam und kontrolliert wieder zum Boden ab, ohne dich
  beim Aufsteigen übermäßig mit dem Bodenbein abzustoßen.'
