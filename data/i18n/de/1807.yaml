name: Seitheben am Kabelzug hinter dem Rücken
description: "Ausgangsposition:\nStelle dich seitlich neben einen niedrigen Kabelzug.\
  \ Führe den D-Griff mit der äußeren Hand hinter deinem Gesäß vorbei. Halte dich\
  \ mit der inneren Hand stabil am Pfosten des Kabelturms fest. Stehe aufrecht mit\
  \ leicht nach vorne geneigtem Oberkörper.\n\nAusführung:\n1. Hebe den Arm mit leichter\
  \ Ellenbogenbeugung seitlich in einem weiten Bogen nach oben, bis deine Hand Schulterhöhe\
  \ erreicht.\n2. Spanne den seitlichen Deltamuskel am obersten Punkt für 1 Sekunde\
  \ intensiv an.\n3. Senke das Kabel langsam und kontrolliert wieder hinter deinem\
  \ Körper ab, um die konstante Dehnungsspannung voll mitzunehmen.\n\nHinweise:\n\
  Die Führung des Kabels hinter dem Rücken verhindert jegliches Reiben an Oberschenkel\
  \ oder Hüfte und sorgt für eine isolierte Beanspruchung des mittleren Deltamuskels\
  \ ohne Schwung."
