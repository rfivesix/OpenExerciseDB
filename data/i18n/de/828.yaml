exercise_id: '828'
language: de
status: ai_authored
name: Reverse Fly auf der Schrägbank
description: '- Lege dich bauchlings auf eine auf 30 bis 45 Grad eingestellte Schrägbank
  und halte in jeder Hand eine Kurzhantel mit nach unten hängenden Armen.

  - Hebe die Kurzhanteln mit leicht angewinkelten, stabilen Ellenbogen seitlich in
  einem weiten Bogen an, bis sich die Oberarme auf Schulterhöhe befinden.

  - Spanne am obersten Punkt die hinteren Deltamuskeln und oberen Rückenmuskeln fest
  an.

  - Senke die Kurzhanteln langsam und kontrolliert wieder nach unten ab, ohne Schwung
  aus dem Körper zu nutzen.'
