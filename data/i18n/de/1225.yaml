name: Breite Bizeps-Curls mit Kurzhanteln
description: |-
  Ausgangsposition:
  • Stelle dich aufrecht hin, halte in jeder Hand eine Kurzhantel im Untergriff.
  • Öffne die Unterarme und Hände leicht nach außen, sodass sie etwas weiter als schulterbreit stehen.
  • Die Ellbogen bleiben stabil an den Flanken fixiert.

  Ausführung:
  • Beuge die Ellbogen und führe die Kurzhanteln auf einer leicht nach außen ausgestellten Bahn nach oben zu den Schultern.
  • Durch den weiteren Winkel wird der kurze (innere) Kopf des Bizeps gezielt beansprucht.
  • Halte die Kontraktion am obersten Punkt kurz und senke die Hanteln langsam wieder ab.
