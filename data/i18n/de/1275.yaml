name: Plantarflexions-Dehnung mit Band
description: 'Ausgangsposition:

  Setze dich auf den Boden mit ausgestreckten Beinen. Lege ein elastisches Band über den Fußrücken (Spann) des zu dehnenden
  Fußes und fixiere das Band mit den Händen oder an einem festen Punkt.


  Ausführung:

  1. Drücke die Fußspitze vorsichtig nach vorne unten (Plantarflexion), sodass die Vorderseite des Sprunggelenks und der vordere
  Schienbeinmuskel (Tibialis anterior) sanft gedehnt werden.

  2. Halte die angenehme Dehnposition für 20 bis 30 Sekunden.

  3. Lasse den Fuß langsam wieder in die Neutralposition zurückkehren und wechsle das Bein.'
