name: Seitliche Shuffles mit Kniebeuge
description: |-
  Ausgangsposition:
  • Stelle dich in eine aufrechte, athletische Haltung mit leicht gebeugten Knien und Hüften (tiefer Schwerpunkt).
  • Die Füße stehen etwas weiter als schulterbreit auseinander.

  Ausführung:
  • Mache drei dynamische Seitwärtsschritte (Side Slides/Shuffles) in eine Richtung, indem du mit dem Standbein abdrückst.
  • Stoppe die Bewegung, richte dich aus und führe eine saubere, tiefe Kniebeuge (Squat) aus.
  • Drehe dich nach der Kniebeuge um 180 Grad oder wechsle direkt die Richtung für die nächsten Shuffles.
