name: Seitheben sitzend mit Kurzhanteln
description: '- Setze dich auf das Ende einer Hantelbank, stelle die Füße fest auf
  den Boden und halte in jeder Hand eine Kurzhantel seitlich neben den Oberschenkeln.

  - Beuge den Oberkörper minimal nach vorne und halte eine leichte, feste Beugung
  in den Ellenbogen.

  - Hebe die Kurzhanteln seitlich in einem weiten Bogen an, bis sich die Ellenbogen
  und Hanteln auf Schulterhöhe befinden.

  - Halte die Kontraktion im seitlichen Deltamuskel kurz und senke die Gewichte langsam
  und kontrolliert wieder ab.'
