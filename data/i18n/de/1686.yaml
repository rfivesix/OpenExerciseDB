name: Glute Bridge mit einarmigem Drücken
description: |-
  Halte eine Kurzhantel in einer Hand und führe eine Glute Bridge aus. Halte nun die Kurzhantel über deiner Brust, das ist die Startposition der Wiederholung. Senke die Kurzhantel ab, sodass dein Ellbogen den Boden berührt oder sich etwa 45 Grad unterhalb deiner Schulter befindet, wenn du eine Bank verwendest. Drücke die Kurzhantel zurück in die Startposition.
