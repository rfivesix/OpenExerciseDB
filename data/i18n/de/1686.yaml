name: Glute Bridge mit einarmigem Drücken
description: |-
  Ausgangsposition:
  Auf den Rücken legen, die Knie anwinkeln und die Füße flach auf den Boden stellen. Eine Kurzhantel in einer Hand halten. Das Gesäß anheben, bis Oberschenkel und Oberkörper eine gerade Linie bilden (Glute Bridge), und die Hantel mit gestrecktem Arm senkrecht über der Brust halten.
  
  Ausführung:
  1. Die Kurzhantel kontrolliert absenken, bis der Oberarm in etwa einem 45-Grad-Winkel zum Oberkörper den Boden berührt.
  2. Die Hantel kraftvoll wieder nach oben in die Ausgangsposition drücken, während die Hüfte konstant oben gehalten wird.
  3. Nach Beendigung des Satzes die Seite wechseln.
  
  Hinweise:
  Gesäß und Rumpf während der gesamten Übung fest anspannen, um ein Absinken oder Verdrehen des Beckens zu verhindern.
