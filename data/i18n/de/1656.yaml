name: Brustdrücken am Kabelzug - negativ geneigt
description: |-
  Einarmiges Brustdrücken am Kabelzug. Nutze den anderen Arm, um das Körpergewicht abzustützen, damit du dich auf die Kraft des Drückens konzentrieren kannst und nicht auf das Ausbalancieren des Körpers. Beginne mit der Hand so nah wie möglich an der Brust und drücke dann gegen den Kabelzug in einer leicht abfallenden Linie und in Richtung der Mitte deiner Brust.
