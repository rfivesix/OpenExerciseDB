name: Erhöhte Liegestütze (Incline)
description: |-
  Ausgangsposition:
  Stütze deine Hände etwas weiter als schulterbreit auf eine Hantelbank, eine Box oder eine stabile Erhöhung. Die Beine sind nach hinten gestreckt, der Körper bildet von den Fersen bis zum Kopf eine gerade, feste Linie.

  Ausführung:
  1. Beuge die Ellenbogen kontrolliert und senke deine Brust in Richtung der Kante der Erhöhung ab. Die Ellenbogen zeigen im ca. 45-Grad-Winkel nach hinten außen.
  2. Gehe so tief, bis die Brust die Kante fast berührt.
  3. Drücke dich kraftvoll aus der Brust und dem Trizeps wieder nach oben in die Ausgangsposition.
  4. Halte die Bauch- und Gesäßmuskeln während des gesamten Satzes fest angespannt.
