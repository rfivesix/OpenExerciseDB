name: Wall Balls (Medizinball-Wandwurf)
description: |-
  Ausgangsposition:
  Stelle dich etwa eine Armlänge vor eine stabile Wand. Nimm einen etwas mehr als schulterbreiten Stand ein. Halte einen Medizinball mit beiden Händen auf Kinnhöhe eng vor der Brust.

  Ausführung:
  1. Gehe in eine kontrollierte, tiefe Kniebeuge, bis die Oberschenkel mindestens parallel zum Boden sind. Die Brust bleibt aufrecht.
  2. Drücke dich explosiv aus den Beinen nach oben und nutze den Schwung der Aufwärtsbewegung, um den Ball nach oben gegen ein Ziel an der Wand (ca. 2,7 bis 3 Meter Höhe) zu werfen.
  3. Fange den abprallenden Ball auf Kinnhöhe wieder ab und gehe direkt fließend in die nächste Kniebeuge über.
  4. Führe die Bewegung rhythmisch und kraftvoll durch.
