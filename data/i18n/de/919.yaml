name: T-Bar-Rudern
description: 'Ausgangsposition: Stelle dich rittlings über die T-Bar-Hantelstange.
  Beuge die Knie leicht und neige den Oberkörper mit geradem Rücken in einem Winkel
  von etwa 45 Grad nach vorne. Greife den V-Griff (Dreiecksgriff) mit gestreckten
  Armen.

  Ausführung: Ziehe das Gewicht kontrolliert zum oberen Bauch bzw. unteren Brustkorb.
  Führe die Ellbogen eng am Körper nach hinten und ziehe die Schulterblätter am höchsten
  Punkt kraftvoll zusammen.

  Rückkehr: Senke das Gewicht langsam und kontrolliert ab, bis die Arme wieder gestreckt
  sind. Halte den Rücken während der gesamten Bewegung stabil.

  Hinweis: Vermeide Schwung aus den Beinen oder dem unteren Rücken.'
