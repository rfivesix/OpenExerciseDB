name: Pause-Bankdrücken
description: |-
  Senke die Hantelstange auf deine Brust und pausiere dort für 2 Sekunden (ohne das Gewicht abzulegen). Drücke sie wieder nach oben. Verwende das gleiche Gewicht wie beim normalen Bankdrücken, führe jedoch nur Einzelwiederholungen aus. Mache insgesamt so viele Wiederholungen, wie du in einem regulären Satz Bankdrücken machen würdest (wenn du 3 Sätze à 8 Wiederholungen machst, führe 8 Einzelwiederholungen mit Pause aus).
