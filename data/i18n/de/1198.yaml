name: Körpergewichtsrudern (Inverted Row)
description: |-
  Ausgangsposition:
  • Befestige eine Langhantel in einem Rack auf etwa Hüfthöhe oder nutze eine feste Stange bzw. Schlingentrainer.
  • Lege dich rücklings unter die Stange und greife sie im Obergriff etwas weiter als schulterbreit.
  • Der Körper bildet von Kopf bis zu den Fersen eine vollkommen gerade Linie, Fersen stehen fest auf dem Boden.

  Ausführung:
  • Ziehe deine Brust kontrolliert nach oben zur Stange, indem du die Ellbogen nach hinten führst und die Schulterblätter aktiv zusammenziehst.
  • Halte den Körper durch Anspannen von Gesäß und Bauchmuskeln brettsteif, ohne mit der Hüfte durchzuhängen.
  • Senke dich langsam und kontrolliert wieder ab, bis die Arme gestreckt sind.
