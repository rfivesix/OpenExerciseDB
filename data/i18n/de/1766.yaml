name: Unterarmstütz mit Armheben
description: "Ausgangsposition:\nBegib dich in den Unterarmstütz (Plank): Die Unterarme\
  \ liegen parallel auf dem Boden, Ellenbogen direkt unter den Schultern, Beine gestreckt,\
  \ Füße etwas weiter als hüftbreit für eine stabile Basis. Spanne Rumpf und Gesäß\
  \ fest an, sodass der Körper eine gerade Linie bildet.\n\nAusführung:\n1. Löse einen\
  \ Arm langsam vom Boden und strecke ihn gerade nach vorne auf Schulterhöhe aus.\n\
  2. Halte die Endposition für 1 bis 2 Sekunden, während du Becken und Schultern vollkommen\
  \ parallel zum Boden hältst (kein Eindrehen oder Kippen der Hüfte).\n3. Setze den\
  \ Unterarm kontrolliert wieder ab und wiederhole die Bewegung mit dem anderen Arm\
  \ im Wechsel.\n\nHinweise:\nDies ist eine anspruchsvolle Anti-Rotations-Übung. Fokussiere\
  \ dich auf maximale Stabilität der Hüfte."
