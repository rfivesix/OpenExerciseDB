name: TRX-Rudern
description: 'Ausgangsposition: Stelle dich mit Blick zum Aufhängepunkt des Schlingentrainers,
  greife die Griffe im neutralen Griff und lehne dich mit gestreckten Armen nach hinten.
  Der Körper bildet eine feste, gerade Linie von den Fersen bis zum Kopf.

  Ausführung: Ziehe die Brust zu den Griffen heran, indem du die Ellbogen eng am Körper
  nach hinten führst und die Schulterblätter aktiv zusammenziehst.

  Rückkehr: Senke den Körper langsam und kontrolliert wieder ab, bis die Arme vollständig
  gestreckt sind.

  Hinweis: Je flacher der Körper zum Boden geneigt ist, desto anspruchsvoller ist
  die Übung.'
