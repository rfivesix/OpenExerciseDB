name: Hüftabduktion an der Maschine
description: "Ausgangsposition:\nSetze dich auf das Polster der Abduktionsmaschine\
  \ mit dem Rücken fest an der Rückenlehne. Platziere die Außenseiten der Oberschenkel\
  \ bzw. Knie an den gepolsterten Hebelarmen. Stelle die Füße auf die Fußrasten und\
  \ greife die seitlichen Griffe zur Stabilisierung des Beckens.\n\nAusführung:\n\
  1. Drücke die Beine mit der Kraft der seitlichen Gesäßmuskulatur (Gluteus medius\
  \ und minimus) kraftvoll gegen den Widerstand nach außen auseinander.\n2. Spreize\
  \ die Beine so weit wie möglich und halte die maximale Kontraktion für 1 bis 2 Sekunden.\n\
  3. Führe die Beine langsam und kontrolliert wieder zusammen, ohne dass die Gewichtsplatten\
  \ aufeinanderschlagen, und halte die Grundspannung aufrecht.\n\nHinweise:\nHalte\
  \ den Oberkörper ruhig und vermeide ein Ausweichen durch Schwungholen aus dem Rumpf."
