exercise_id: '1380'
language: de
status: ai_reviewed
name: Band Pull-Aparts
description: |-
  Ausgangsposition:
  Stelle dich aufrecht mit hüftbreitem Stand hin. Halte ein geschlossenes oder offenes Widerstandsband mit beiden Händen etwa schulterbreit vor dir auf Brusthöhe, die Handflächen zeigen nach unten oder zueinander, die Arme sind fast gestreckt.

  Ausführung:
  Ziehe das Band auseinander, indem du die Arme seitlich nach hinten führst und die Schulterblätter aktiv zusammenziehst, bis das Band deine Brust berührt. Halte die maximale Kontraktion im oberen Rücken und der hinteren Schulter für einen kurzen Moment und führe die Arme langsam und kontrolliert wieder nach vorne.

  Hinweise:
  Ziehe die Schultern nicht zu den Ohren nach oben. Halte den Rumpf angespannt und vermeide ein Ausweichen ins Hohlkreuz.
