name: Kettlebell Sumo High Pull
description: 'Ausgangsposition:

  Stelle dich in einen weiten Sumo-Stand über die Kettlebell, die Füße deutlich breiter als schulterbreit und die Zehenspitzen leicht nach außen gedreht. Schiebe die Hüfte nach hinten, beuge die Knie und greife den Griff der Kettlebell mit beiden Händen im festen Obergriff bei aufgerichteter Brust und geradem Rücken.


  Ausführung:

  Strecke Hüfte und Knie explosionsartig und kraftvoll aus der Gesäß- und Oberschenkelmuskulatur. Nutze den erzeugten Schwung, um die Kettlebell nah am Körper senkrecht nach oben zu ziehen, wobei die Ellbogen stets über Hantelhöhe nach oben außen geführt werden, bis die Kugel etwa Brust- bis Schlüsselbeinhöhe erreicht. Senke die Kettlebell kontrolliert entlang des Körpers wieder ab und gehe fließend in die nächste Wiederholung über.


  Hinweise:

  Die Hebeenergie stammt primär aus der explosiven Hüftstreckung der hinteren Kette; der Zug der Arme und des oberen Trapezes vollendet die Bewegung flüssig.'
