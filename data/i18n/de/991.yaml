name: Split Squat (links)
description: 'Ausgangsposition: Stehe aufrecht und mache einen weiten Ausfallschritt
  nach vorne mit dem linken Bein. Die Füße bleiben hüftbreit versetzt für sicheren
  Stand.

  Ausführung: Senke das Becken senkrecht nach unten ab, indem du beide Knie beugst,
  bis der linke Oberschenkel waagerecht steht und das rechte Knie knapp über dem Boden
  stoppt.

  Rückkehr: Drücke dich kraftvoll über die linke Ferse wieder nach oben in die Ausgangsstellung,
  ohne die Fußposition zu verändern.

  Hinweis: Der Oberkörper bleibt während der gesamten Übung aufrecht.'
