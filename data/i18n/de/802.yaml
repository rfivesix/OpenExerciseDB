name: Gehende Ausfallschritte mit Langhantel
description: '- Platziere eine Langhantel sicher auf deinem oberen Rücken (Trapez)
  und stehe aufrecht im hüftbreiten Stand.

  - Mache mit einem Bein einen weiten Ausfallschritt nach vorne und senke die Hüfte
  ab, bis beide Knie etwa im 90-Grad-Winkel gebeugt sind.

  - Drücke dich über die Ferse des vorderen Fußes nach oben und ziehe das hintere
  Bein direkt in den nächsten Ausfallschritt nach vorne durch.

  - Bewege dich so flüssig Schritt für Schritt vorwärts, während dein Oberkörper stets
  aufrecht und stabil bleibt.'
