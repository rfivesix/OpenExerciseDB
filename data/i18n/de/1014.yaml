name: Dehnung des rechten Musculus levator scapulae
description: |-
  Ausgangsposition:
  Nimm eine aufrechte Haltung im Stehen oder Sitzen ein. Drehe den Kopf um etwa 45 Grad nach rechts. Lege die linke Hand hinter den Rücken (oder fixiere sie unter dem Oberschenkel). Fasse mit der rechten Hand an den Hinterkopf und neige das Kinn sanft nach unten in Richtung der rechten Achselhöhle.
  Schritte:

  Baue aus dieser Position einen leichten isometrischen Druck mit dem Kopf gegen die rechte Hand auf, während die Hand mit gleicher Kraft gegenhält, sodass der Kopf fixiert bleibt. Halte diese Position.
