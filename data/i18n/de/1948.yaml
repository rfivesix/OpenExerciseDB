name: Kosaken-Kniebeuge (Cossack Squat)
description: 'Ausgangsposition:

  Stelle dich in einen sehr breiten Grätschstand, die Zehenspitzen leicht nach außen gedreht. Halte den Oberkörper aufrecht und die Hände vor der Brust verschränkt.


  Ausführung:

  Verlagere dein Körpergewicht auf eine Seite und beuge das Knie tief, während das andere Bein vollständig gestreckt zur Seite bleibt. Drehe den Fuß des gestreckten Beins so auf, dass die Zehen zur Decke zeigen und die Ferse auf dem Boden bleibt. Gehe so tief wie möglich in die Hocke, während die Ferse des gebeugten Standbeins flach auf dem Boden bleibt und der Rücken gerade ist. Drücke dich kraftvoll wieder nach oben und wechsle fließend auf die Gegenseite.


  Hinweise:

  Teil der Limber-11-Routine von Joe DeFranco (5–10 Wiederholungen pro Seite). Trainiert Kraft in Quadrizeps und Gesäß bei gleichzeitiger Dehnung der Adduktoren und Verbesserung der Sprunggelenksbeweglichkeit.'
