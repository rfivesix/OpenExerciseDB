name: Einbeinige Box-Kniebeuge
description: |-
  Für diese Übung benötigst du eine stabile Box oder einen Stuhl. Stelle dich einfach etwa 15 cm davor und balanciere auf einem Bein. Beginne von hier aus in einer gleichmäßigen, kontrollierten Bewegung herunterzugehen, während du dein anderes Bein zur Balance gerade vor dir ausstreckst. Setze dich langsam auf die Box, halte eine Sekunde inne und drücke dich mit dem arbeitenden Bein wieder hoch, ohne dass dein anderes Bein jemals den Boden berührt.
