name: Frontheben mit Kurzhanteln
description: 'Ausgangsposition:

  Stelle dich aufrecht mit hüftbreit geöffneten Füßen hin. Halte in jeder Hand eine Kurzhantel vor deinen Oberschenkeln im
  Obergriff (Handflächen zum Körper).


  Ausführung:

  1. Hebe die Hanteln mit leicht gebeugten Ellbogen kontrolliert vor dem Körper nach oben, bis sie sich auf Schulter- bzw.
  Augenhöhe befinden.

  2. Halte die Kontraktion im vorderen Deltamuskel kurz an.

  3. Senke die Kurzhanteln langsam und kontrolliert wieder ab.


  Hinweise:

  Hole keinen Schwung aus den Beinen oder dem Oberkörper. Halte die Arme während der gesamten Übung minimal angewinkelt.'
