name: Reißen (Snatch)
description: |-
  Stelle dich mit hüftbreitem Stand und den Schienbeinen an der Stange auf. Greife die Stange im doppelten Schulterbreiten-Abstand und drücke, während du den unteren Rücken gerade hältst, die Fersen in den Boden, um die Stange anzuheben. Wenn sie über deinen Knien ist, streckst du explosiv die Hüfte und ziehst die Schultern hoch. Lass den Schwung das Gewicht über den Kopf tragen.
