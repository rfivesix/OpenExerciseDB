exercise_id: '1447'
language: de
status: ai_reviewed
name: Reißen (Snatch)
description: |-
  Ausgangsposition:
  • Stelle dich mit hüftbreitem Stand vor die Hantel und greife die Stange mit weitem Haken-Obergriff (Snatch-Grip).
  • Brust aufgerichtet, Rücken gerade, Schultern leicht vor der Hantelstange.

  Ausführung:
  • Hebe die Hantel kontrolliert vom Boden an den Schienbeinen entlang nach oben.
  • Sobald die Stange die Oberschenkel/Hüfte erreicht, strecke Hüfte, Knie und Sprunggelenke explosiv durch (Triple Extension).
  • Tauche blitzschnell unter die aufsteigende Stange in eine tiefe Überkopf-Kniebeuge (Overhead Squat) ab und fange die Hantel mit vollständig verriegelten Armen über dem Kopf auf.
  • Stabilisiere die Hocke und richte dich kraftvoll in den aufrechten Stand auf, während die Hantel über dem Kopf fixiert bleibt.
