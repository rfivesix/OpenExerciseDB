name: Schienbeinheben (Tibialis Raise)
description: |-
  Ausgangsposition:
  • Stelle dich mit dem Rücken an eine Wand gelehnt auf.
  • Platziere deine Fersen etwa einen bis zwei Fuß breit von der Wand entfernt auf dem Boden.
  • Halte deine Beine gestreckt und den Rücken stabil an die Wand angelehnt.

  Ausführung:
  • Hebe deine Fußspitzen und Ballen so weit wie möglich kontrolliert nach oben in Richtung der Schienbeine an (Dorsalflexion).
  • Halte die maximale Kontraktion des vorderen Schienbeinmuskels (M. tibialis anterior) am höchsten Punkt für 1 bis 2 Sekunden.
  • Senke die Vorfüße langsam und kontrolliert wieder ab, ohne die Fersen zu bewegen.
