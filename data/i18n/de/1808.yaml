name: Stützhalt am Barren
description: "Ausgangsposition:\nStelle dich zwischen die Holme eines Barrens oder\
  \ Dip-Ständers. Umfasse die Holme im neutralen Griff, Handgelenke gerade und stabil.\
  \ Springe oder drücke dich nach oben, bis deine Arme vollständig gestreckt sind.\n\
  \nAusführung:\n1. Drücke deine Schultern aktiv nach unten (Depression der Schulterblätter),\
  \ sodass der Hals lang bleibt und die Schultern weit weg von den Ohren sind.\n2.\
  \ Spanne Rumpf und Gesäß fest an, strecke die Beine durch und halte die Füße geschlossen\
  \ (Hollow-Body-Position).\n3. Halte diese statische Stützposition stabil für die\
  \ vorgegebene Zeitdauer, während du ruhig und gleichmäßig atmest.\n4. Senke dich\
  \ nach Ablauf der Haltezeit kontrolliert wieder auf den Boden ab.\n\nHinweise:\n\
  Lass dich nicht in die Schultern einsinken; die aktive Körperspannung und Schulterblattdepression\
  \ ist die Basis für sichere Dips und Barrenübungen."
