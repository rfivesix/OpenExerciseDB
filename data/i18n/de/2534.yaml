name: Glute Bridge (Beckenheben)
description: |-
  Ausgangsposition:
  Lege dich rücklings auf eine Matte. Winkle die Knie an und stelle die Füße hüftbreit flach auf den Boden, etwa eine Handbreite vom Gesäß entfernt. Die Arme liegen entspannt seitlich neben dem Körper.

  Ausführung:
  1. Spanne deine Bauch- und Gesäßmuskulatur an.
  2. Drücke dich über die Fersen kraftvoll nach oben, bis Oberschenkel, Becken und Oberkörper eine gerade Diagonale bilden.
  3. Halte die Kontraktion am obersten Punkt für 1 bis 2 Sekunden und spanne das Gesäß maximal an.
  4. Senke das Becken langsam und kontrolliert wieder ab, bis es den Boden fast berührt, und starte sofort die nächste Wiederholung.

  Hinweise:
  Drücke das Becken nicht ins Hohlkreuz über; die Streckung erfolgt rein aus der Hüfte. Zur Steigerung kann eine Hantel auf die Hüfte gelegt oder die Füße auf eine Erhöhung gestellt werden.
