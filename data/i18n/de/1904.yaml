name: Pec Deck (Butterfly)
description: "Ausgangsposition: Setze dich auf das Polster der Pec-Deck-Maschine (Butterfly)\
  \ und drücke den Rücken sowie den Kopf fest an das Rückenpolster. Stelle die Sitzhöhe\
  \ so ein, dass sich die Ellbogen bzw. Griffe auf Brusthöhe befinden.\nAusführung:\
  \ Führe die Hebelarme mit leicht gebeugten Ellbogen in einem weiten Bogen vor deiner\
  \ Brust zusammen. Halte am Punkt der maximalen Kontraktion für 1–2 Sekunden inne\
  \ und spanne die Brustmuskeln aktiv an.\nHinweise: Führe das Gewicht langsam und\
  \ kontrolliert zurück, bis eine angenehme Dehnung in der Brustmuskulatur spürbar\
  \ ist, ohne die Schultergelenke zu überdehnen."
