name: Lenkrad-Drehen (Bus Drivers)
description: '- Setze dich aufrecht auf eine Bank oder den Boden und halte eine Hantelscheibe
  mit beiden Händen seitlich (9- und 3-Uhr-Position).

  - Hebe die Scheibe mit leicht gebeugten Armen vor deinem Körper auf knapp unter
  Augenhöhe an.

  - Rotiere die Hantelscheibe kontrolliert abwechselnd nach links und rechts, ähnlich
  wie beim Drehen eines großen Lenkrads.

  - Halte die Arme während der gesamten Übung auf Höhe und den Rumpf stabil angespannt.'
