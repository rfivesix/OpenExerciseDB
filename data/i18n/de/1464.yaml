name: Hackenschmidt-Kniebeuge mit Pause (Pause Hack Squat)
description: |-
  Ausgangsposition:
  • Stelle dich in die Hackenschmidt-Maschine, die Schultern unter den Polstern und der Rücken fest an der Rückenlehne angelehnt.
  • Platziere die Füße etwa schulterbreit auf der Fußplatte.

  Ausführung:
  • Beuge kontrolliert die Knie und senke den Schlitten ab, bis die Oberschenkel mindestens parallel zur Fußplatte sind.
  • Halte am tiefsten Punkt für 1 bis 2 Sekunden eine absolute Pause (kein Wippen, kein Federn), um elastische Energie vollständig abzubauen.
  • Drücke den Schlitten kraftvoll aus den Oberschenkeln und dem Gesäß wieder nach oben in die Ausgangsposition zurück, ohne die Knie oben durchzuschlagen.
