name: TRX Roll-out
description: |-
  Halte die Griffe mit den Händen, strecke die Arme aus und halte sie parallel auf Brusthöhe. Die Bewegung, die du ausführen sollst, ist ein Öffnen der Arme in einer Linie mit den Schultern, während du den Körper nach vorne neigst. Versuche, keine Schulterstreckung über 90° hinaus auszuführen, und halte die Bauchmuskulatur und die Gesäßmuskulatur angespannt. Beteiligte Muskeln: Transversus, gerader Bauchmuskel und Rückenstrecker
