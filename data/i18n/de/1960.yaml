name: Hüftbeuger-Dehnung mit erhöhtem hinterem Fuß
description: 'Ausgangsposition:

  Begib dich vor einer Bank, einem Kasten oder einer Wand in den halben Kniestand. Platziere den Fußrücken des hinteren Beins erhöht auf der Bank, während das vordere Bein im 90-Grad-Winkel aufgestellt ist. Richte den Oberkörper aufrecht aus.


  Ausführung:

  Kippe das Becken aktiv nach hinten (Gesäßmuskel der hinteren Seite fest anspannen) und schiebe die Hüfte sanft nach vorne, während der Oberkörper aufrecht bleibt. Halte die Dehnposition in der Vorderseite des Oberschenkels und im Hüftbeuger für 3 Sekunden dynamisch fest, entspanne die Spannung kurz und wiederhole die Bewegung für 5–10 Wiederholungen pro Seite.


  Hinweise:

  Teil der Limber-11-Routine von Joe DeFranco. Gehe nicht ins Hohlkreuz; die Gesäßkontraktion ist entscheidend, um den Hüftbeuger (Iliopsoas und Rectus femoris) gezielt zu öffnen.'
