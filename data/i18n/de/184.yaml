name: Kreuzheben
search_terms:
- Deadlift
- Konventionelles Kreuzheben
description: |-
  Ausgangsposition:
  Stelle dich hüftbreit vor die Langhantel, sodass die Stange über der Mitte deiner Füße liegt (ca. 2–3 cm vor den Schienbeinen), die Fußspitzen zeigen leicht nach außen. Beuge die Hüfte nach hinten und gehe in die Knie, während der Rücken vollkommen gerade bleibt. Greife die Stange knapp außerhalb deiner Beine im Obergriff oder Kreuzgriff.

  Bewegung:
  1. Baue Körperspannung und Atemdruck (Valsalva-Manöver) auf. Drücke die Füße fest in den Boden und hebe die Hantel, indem du Knie und Hüfte gleichzeitig streckst.
  2. Führe die Hantelstange während des gesamten Hebens eng am Körper (Schienbeine und Oberschenkel) entlang.
  3. Richte dich ganz auf und spanne oben Gesäß und Oberschenkel an. Halte die Wirbelsäule neutral und überstrecke den unteren Rücken keinesfalls nach hinten (kein Hohlkreuz!).
  4. Senke das Gewicht auf demselben Weg kontrolliert wieder ab, indem du zuerst die Hüfte nach hinten schiebst.

  Hinweise:
  Der Rücken muss während der gesamten Übung gerade bleiben; ein Einrunden der Wirbelsäule ist unbedingt zu vermeiden.
