name: Floor Skull Crusher mit der SZ-Stange
description: |-
  Ausgangsposition:
  Lege dich mit dem Rücken flach auf den Boden bzw. eine Trainingsmatte. Die SZ-Stange liegt auf dem Boden hinter deinem Kopf. Greife die Stange im engen Obergriff an den Innenbiegungen und hebe sie so an, dass deine Oberarme etwa senkrecht zum Boden stehen und leicht nach hinten geneigt sind.

  Ausführung:
  1. Beuge die Ellenbogen kontrolliert und senke die Stange hinter den Kopf ab, bis die Gewichtsscheiben sanft den Boden berühren (Dead-Stop).
  2. Pausiere kurz auf dem Boden, um jeglichen Dehnungsreflex und Schwung zu neutralisieren.
  3. Drücke die Stange kraftvoll durch Streckung des Trizeps wieder nach oben in die Ausgangsposition.

  Hinweise:
  Die Bodenablage entlastet die Ellenbogengelenke im Umkehrpunkt und erlaubt eine sichere Belastung des Trizeps ohne Partner.
