exercise_id: '1196'
language: de
status: ai_authored
name: Wand-Drills (Sprintmechanik)
description: |-
  Ausgangsposition:
  • Stelle dich etwa einen Schritt von einer stabilen Wand entfernt auf.
  • Stütze dich mit beiden Händen auf Schulterhöhe an der Wand ab und neige deinen gesamten Körper in einem Winkel von ca. 45 Grad nach vorne.
  • Bilde eine gerade Linie von den Fersen über die Hüfte bis zum Kopf und spanne den Rumpf fest an.

  Ausführung:
  • Hebe ein Knie explosiv nach vorne oben in Richtung Brust (Hüftbeugung), sodass der Oberschenkel parallel zum Boden ist und die Fußspitze angezogen ist (Dorsalflexion).
  • Halte die Position für das Kniehub-Training kurz oder marschiere/wechsle die Beine dynamisch im Rhythmus (Marching/Switch Drills).
  • Das Standbein bleibt stabil gestreckt und überträgt die Kraft über den Vorfuß in den Boden.
