name: Pike-Liegestütze
description: |-
  Ausgangsposition:
  Beginne in einer Liegestützposition und wandere mit den Füßen in Richtung der Hände, während du das Gesäß zur Decke schiebst. Dein Körper bildet ein umgekehrtes 'V' (Pike-Position). Die Hände stehen etwas weiter als schulterbreit, die Beine und der Rücken sind möglichst gerade gestreckt.

  Ausführung:
  1. Beuge die Ellbogen kontrolliert und senke den Kopf diagonal nach vorne unten ab, bis dein Scheitel knapp vor den Händen den Boden berührt.
  2. Drücke dich kraftvoll durch die Schultern und den Trizeps nach hinten oben zurück in die spitze Ausgangs-V-Position.
  3. Halte den Rumpf während der gesamten Bewegung stabil unter Spannung.

  Hinweise:
  Pike-Liegestütze sind eine hervorragende Körpergewichtsübung zur Stärkung der Schultermuskulatur und Vorbereitung auf den Handstand-Liegestütz.
