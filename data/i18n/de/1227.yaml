name: Vorgebeugtes Kurzhantelrudern für die hintere Schulter
description: |-
  Ausgangsposition:
  • Halte in jeder Hand eine Kurzhantel und beuge dich aus der Hüfte mit geradem Rücken nach vorne, bis der Oberkörper fast parallel zum Boden ist.
  • Lasse die Arme locker nach unten hängen, die Handflächen zeigen nach hinten (Obergriff).

  Ausführung:
  • Ziehe die Kurzhanteln nach oben, indem du die Ellbogen weit nach außen und oben führst (ca. 90-Grad-Winkel zum Oberkörper).
  • Ziehe so weit nach oben, bis die Oberarme parallel zum Boden sind, und spanne den hinteren Deltamuskel und die Rhomboiden intensiv an.
  • Senke die Hanteln langsam und kontrolliert wieder ab, ohne den geraden Rücken zu verändern.
