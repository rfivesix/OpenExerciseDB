name: Kurzhantel-Rudern für die hintere Schulter
description: |-
  Halte in jeder Hand eine Kurzhantel. Beuge dich in der Hüfte nach vorne, bis dein Rücken nahezu parallel zum Boden ist. Lass deine Arme nach unten hängen. Halte die Arme in einer Linie mit deinen Schultern. Beuge und hebe die Ellbogen seitlich nach außen, bis deine Oberarme parallel zum Boden sind. Kehre langsam zurück und wiederhole die Bewegung.
