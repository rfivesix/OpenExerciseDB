name: Australischer Klimmzug (Inverted Row)
description: |-
  Ausgangsposition:
  • Lege dich rücklings unter eine hüfthohe Stange und greife sie im schulterbreiten Untergriff (Handflächen zeigen zum Gesicht).
  • Bilde eine vollkommen gerade Linie von den Fersen bis zum Kopf und spanne den gesamten Körper an.

  Ausführung:
  • Beuge die Ellbogen und ziehe deine Brust kontrolliert nach oben an die Stange.
  • Ziehe die Schulterblätter aktiv zusammen und kontrahiere Rücken und Bizeps im obersten Punkt spürbar.
  • Senke dich langsam und kontrolliert wieder ab, bis die Arme gestreckt sind.
