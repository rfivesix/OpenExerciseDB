name: Mountain Climbers (Bergsteiger)
description: 'Ausgangsposition: Gehe in die Liegestützposition (High Plank). Die Hände
  stehen senkrecht unter den Schultern und der Körper bildet eine feste gerade Linie.

  Ausführung: Ziehe ein Knie zügig und kraftvoll in Richtung Brust, während das andere
  Bein gestreckt bleibt. Wechsle die Beine in einer dynamischen, laufenden Bewegung
  flüssig ab.

  Hinweis: Halte die Hüfte tief und stabil; das Gesäß sollte nicht nach oben ausweichen.'
