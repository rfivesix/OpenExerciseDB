exercise_id: '1216'
language: de
status: ai_reviewed
name: Recruitment Pulls am Hangboard
description: |-
  Ausgangsposition:
  • Stelle dich unter ein Hangboard (Trainingsboard für Kletterer) und wähle eine spezifische Leistengröße.
  • Fasse die Leiste mit einer Hand, während die Füße auf dem Boden oder einer Trittunterlage bleiben.
  • Stelle einen Ellbogenwinkel von ca. 120 bis 150 Grad ein (nicht in voller Streckung hängen).

  Ausführung:
  • Baue mit maximaler willentlicher Anstrengung für 3 bis 5 Sekunden Zugkraft nach oben auf (isometrischer Maximalkraft-Zug).
  • Halte Schulter und Rumpf stabil und arretiert.
  • Mache nach jedem Zug ausreichend Pause und führe die Übung mit dem anderen Arm durch.
