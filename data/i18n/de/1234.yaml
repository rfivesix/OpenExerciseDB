exercise_id: '1234'
language: de
status: ai_reviewed
name: Einbeiniger Hip Thrust mit Kurzhantel
description: |-
  Ausgangsposition:
  • Setze dich mit dem Rücken vor eine Flachbank und platziere deine Schulterblätter/den oberen Rücken an der Kante der Bank.
  • Lege eine Kurzhantel mittig auf das Becken und sichere sie mit den Händen.
  • Stelle einen Fuß fest auf den Boden (Standbein, Knie ca. 90 Grad gebeugt) und hebe das andere Bein leicht angewinkelt vom Boden ab.

  Ausführung:
  • Drücke dich kraftvoll über die Ferse des Standbeins nach oben, bis Oberschenkel und Oberkörper eine waagerechte Linie bilden.
  • Spanne die Gesäßmuskulatur des Standbeins am obersten Punkt für 1 bis 2 Sekunden maximal an.
  • Senke das Becken langsam und kontrolliert wieder ab, ohne das Gewicht ganz am Boden abzulegen.
  • Absolviere alle Wiederholungen und wechsle das Bein.
