name: Kurzhantel-Scapular-Press (Trapez-Press)
search_terms:
  - Trapez-Press
  - Serratus Punch mit Kurzhantel
  - Schulterblattdrücken
description: |-
  Ausgangsposition:
  Lege dich mit dem Rücken flach auf eine Flachbank und halte eine Kurzhantel in einer Hand. Strecke den Arm senkrecht nach oben zur Decke direkt über deine Schulter, wobei der Ellbogen gestreckt bleibt.

  Ausführung:
  Drücke das Gewicht ausschließlich über die Vorwärtsbewegung deines Schulterblatts (Protraktion) so weit wie möglich senkrecht nach oben, ohne den Ellbogen zu beugen. Halte die Kontraktion im Sägezahnmuskel (Serratus anterior) kurz und ziehe das Schulterblatt anschließend kontrolliert wieder nach hinten unten auf die Bank zurück.

  Hinweise:
  - Die Bewegung erfolgt rein aus dem Schulterblatt; der Arm bleibt während der gesamten Übung gestreckt.
  - Halte den Rücken flach auf der Bank und vermeide Ausweichbewegungen des Rumpfes.
