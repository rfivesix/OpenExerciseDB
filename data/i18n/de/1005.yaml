name: Schulterkreisen rückwärts
description: 'Ausgangsposition: Sitze oder stehe aufrecht mit geradem Rücken und entspannten
  Schultern. Lege deine Fingerspitzen locker auf die jeweilige Schulter.

  Ausführung: Ziehe mit den Ellbogen gleichmäßige, weite Kreise nach hinten oben und
  öffne dabei den Brustkorb, während die Schulterblätter zusammengeführt werden.

  Hinweis: Halte die Bewegung flüssig und entspannt ohne Verkrampfung im Nacken.'
