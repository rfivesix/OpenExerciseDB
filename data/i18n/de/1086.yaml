name: Liegestütze mit engem Griff
description: |-
  Begib dich in eine stabile Plank-Position und bringe deine Hände nah zusammen, bis sie sich fast berühren. (Bild 1) Beuge deine Ellbogen, um deine Brust langsam zum Boden zu bringen (Bild 2). Halte deine Ellbogen nah am Körper, während du dich explosiv wieder nach oben drückst. Wiederhole. Achte darauf, dass du dir beim Absenken jeder Wiederholung Zeit lässt und deine Ausführung sauber hältst.
