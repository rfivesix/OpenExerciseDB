exercise_id: '1086'
language: de
status: ai_reviewed
name: Liegestütze mit engem Griff
description: |-
  Ausgangsposition:
  Begib dich in eine Liegestützposition (hohe Plank). Platziere deine Hände nah beieinander unter der Brust (schmaler als Schulterbreite, sodass sich Daumen und Zeigefinger fast berühren). Der Körper bildet von Kopf bis Fersen eine gerade Linie.

  Ausführung:
  1. Senke deinen Körper kontrolliert ab, indem du die Ellenbogen beugst und diese eng am Oberkörper nach hinten führst.
  2. Gehe so tief, bis deine Brust fast deine Hände berührt.
  3. Drücke dich kraftvoll durch die Kraft des Trizeps und der Brust wieder nach oben in die gestreckte Ausgangsposition.
  4. Halte die Bauch- und Gesäßmuskeln während der gesamten Bewegung fest angespannt.
