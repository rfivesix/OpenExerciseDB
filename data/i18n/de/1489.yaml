name: Plank Jacks (Unterarmstütz mit Grätschsprüngen)
description: |-
  Ausgangsposition:
  Begib dich in eine stabile Unterarmstütz-Position (Plank auf den Unterarmen) oder eine hohe Plank auf den Händen. Der Körper bildet von Kopf bis Fersen eine gerade Linie, die Füße stehen eng zusammen.

  Ausführung:
  1. Halte den Rumpf maximal fest angespannt und springe mit beiden Füßen gleichzeitig leicht nach außen in eine gegrätschte Position.
  2. Lande sanft auf den Fußballen und springe sofort wieder kontrolliert in die geschlossene Ausgangsposition zurück.
  3. Führe die Sprünge in einem gleichmäßigen, rhythmischen Tempo durch.

  Hinweise:
  Halte die Hüfte auf einer stabilen Höhe; vermeide es, das Becken hochschnellen oder durchhängen zu lassen.
