exercise_id: '1488'
language: de
status: ai_authored
name: Kurzhantel-Überzüge
description: |-
  Ausgangsposition:
  Lege dich quer über eine Flachbank, sodass dein oberer Rücken auf dem Polster aufliegt und deine Füße stabil und flach auf dem Boden stehen. Halte eine Kurzhantel mit beiden Händen (Handflächen an der Innenseite der oberen Hantelscheibe) mit gestreckten Armen über der Brust.

  Ausführung:
  1. Senke die Kurzhantel mit leicht gebeugten Ellenbogen in einem weiten Bogen langsam hinter den Kopf ab, bis du eine deutliche Dehnung im Latissimus und im Brustkorb spürst.
  2. Führe das Gewicht über denselben Bogen aktiv durch Kontraktion des Latissimus und der Brustmuskeln zurück nach oben über die Brust.
  3. Halte die Hüfte stabil und leicht abgesenkt, spanne den Rumpf fest an und überstrecke die Lendenwirbelsäule nicht.

  Hinweise:
  Halte die Beugung in den Ellenbogen während der gesamten Bewegung konstant, um die Belastung gezielt auf Rücken und Brust zu halten und den Trizeps zu entlasten.
