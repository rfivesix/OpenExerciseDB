name: Beinheben auf der Negativbank
description: |-
  Aufbau: Lege dich auf eine Negativbank, mit dem Kopf am oberen Ende, und halte dich an den Griffen fest.
  Der Start: Strecke die Beine vollständig und halte sie leicht angehoben, um deinen Rumpf zu aktivieren.
  Das Anheben: Hebe deine Beine in Richtung Decke, indem du die Bauchmuskulatur einsetzt, nicht den Schwung.
  Das Anspannen: Halte kurz inne und spanne die Bauchmuskulatur oben fest an.
  Die Rückführung: Senke deine Beine langsam und kontrolliert in die Ausgangsposition ab.
