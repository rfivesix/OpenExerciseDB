name: Katzen-Plank
description: 'Ausgangsposition:

  Gehe auf die Hände und Zehenspitzen in einen Vierfüßlerstand. Hebe die Knie nur wenige Zentimeter vom Boden ab, sodass sie knapp über der Matte schweben.


  Ausführung:

  Runde den oberen und mittleren Rücken aktiv nach oben (wie ein Katzenbuckel), indem du dich kraftvoll über die Schultern vom Boden wegdrückst und das Becken leicht nach hinten kippst. Ziehe den Bauchnabel fest zur Wirbelsäule und spanne die Bauchmuskeln maximal an. Halte diese Position statisch für die vorgegebene Zeitdauer.


  Hinweise:

  Halte die Knie durchgehend knapp über dem Boden und atme ruhig weiter, während die Schultern aktiv protrahiert bleiben.'
