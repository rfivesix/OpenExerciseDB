name: Crosstrainer
description: 'Ausgangsposition: Steige auf die Trittflächen und greife die beweglichen
  Griffe. Stehe aufrecht mit aufgerichteter Brust und leicht angespanntem Rumpf.

  Ausführung: Trete gleichmäßig in einer fließenden, elliptischen Gleitbewegung in
  die Pedale und bewege die Griffe synchron gegengleich mit den Armen.

  Hinweis: Halte den gesamten Fuß auf der Trittfläche, um Wadenkrämpfe zu vermeiden
  und Gesäß und Beinbeuger optimal zu aktivieren. Aufrechte Körperhaltung bewahren.'
