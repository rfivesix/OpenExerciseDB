name: Schrägbankdrücken an der LeverEdge-Maschine
description: "Ausgangsposition:\nSetze dich in die Schrägbank der Legend LeverEdge-Maschine.\
  \ Stelle die Sitzhöhe so ein, dass sich die Griffe auf Höhe der oberen Brustmuskulatur\
  \ befinden. Drücke deinen oberen Rücken, die Schultern und das Gesäß fest an die\
  \ Rückenlehne und stelle deine Füße stabil auf den Boden. Greife die Hebelgriffe\
  \ fest im Obergriff.\n\nAusführung:\n1. Drücke die Hebelarme kraftvoll und synchron\
  \ nach oben und leicht zusammen (konvergierende Bewegung), bis die Arme fast vollständig\
  \ gestreckt sind.\n2. Spanne die obere Brustmuskulatur (Pars clavicularis) am obersten\
  \ Punkt für einen Moment maximal an.\n3. Senke die Hebelarme langsam und kontrolliert\
  \ ab, bis du eine angenehme Dehnung in der Brustmuskulatur spürst, bevor du die\
  \ nächste Wiederholung einleitest.\n\nHinweise:\nNutze die geführte konvergierende\
  \ Bewegungsbahn der Maschine, um hohe Lasten ohne instabile Ausweichbewegungen sicher\
  \ zu bewegen."
