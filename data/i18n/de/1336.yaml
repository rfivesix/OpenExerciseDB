name: Trizepsdrücken über Kopf mit Kurzhantel
description: 'Ausgangsposition:

  Setze dich aufrecht auf eine Bank oder stelle dich hüftbreit hin. Hebe eine Kurzhantel mit beiden Händen senkrecht über
  den Kopf, sodass die Arme fast vollständig gestreckt sind.


  Ausführung:

  1. Beuge langsam die Ellbogen und senke die Hantel hinter den Kopf ab, bis deine Waden und Unterarme einen Winkel von etwa
  90 Grad bilden.

  2. Halte die Ellbogen eng am Kopf und stabil an ihrer Position.

  3. Drücke die Hantel durch Kontraktion des Trizeps kontrolliert wieder nach oben über den Kopf.


  Hinweise:

  Halte die Ellbogen fixiert und vermeide ein Hohlkreuz, indem du die Rumpfmuskulatur fest anspannst.'
