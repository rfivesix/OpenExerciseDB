name: Brustwirbelsäulen-Rotation im Vierfüßlerstand rechts
description: |-
  Ausgangsposition:
  Begib dich in den Vierfüßlerstand auf Hände und Knie. Die Knie stehen unter den Hüften, die linke Hand stützt unter der linken Schulter am Boden. Platziere die rechte Hand an den Hinterkopf, der rechte Ellenbogen zeigt nach außen.

  Ausführung:
  1. Rotiere beim Einatmen den Oberkörper kontrolliert nach unten und führe den rechten Ellenbogen in Richtung der linken Stützhand.
  2. Drehe beim Ausatmen die Brustwirbelsäule weit nach rechts oben auf und zeige mit dem rechten Ellenbogen zur Decke.
  3. Halte das Becken stabil und waagerecht.
  4. Wiederhole die Bewegung gleichmäßig und kontrolliert.
