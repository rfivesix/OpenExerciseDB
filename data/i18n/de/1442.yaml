name: Kreisdrücken mit Kurzhanteln (Kreis Press)
description: |-
  Ausgangsposition:
  • Setze dich auf eine Schrägbank mit etwa 45° Neigung und halte zwei Kurzhanteln mit gestreckten Armen über dem Kopf.
  • Halte die Bauchmuskeln angespannt und den Rücken an der Lehne stabilisiert.

  Ausführung:
  • Senke die Kurzhanteln in einer weiten Kreisbahn nach außen und unten auf Schulterhöhe ab.
  • Führe die Hanteln am unteren Umkehrpunkt wieder zusammen und drücke sie auf konzentrischer Kreisbahn kraftvoll nach oben über den Kopf.
  • Halte die Bewegung flüssig und kontrolliert, um die vordere Schultermuskulatur unter stetiger Spannung zu halten.
