name: Seitheben am Kabel, Einarmig
description: |-
  Stelle dich aufrecht neben einem Kabelzug und halte dich mit der einen Hand fest, mit der anderen nimmst du den Kabelgriff. Hebe nun den Arm mit dem Gewicht seitlich, strecke ihn aber nicht aus. Bewege während der Übung nur diesen Arm, schwinge nicht mit und drehe deinen Rumpf auch nicht mit. Auf dem höchsten Punkt machst du 1sek. Pause und gehst dann langsam runter. Wenn deine Hand kurz vor deinem Körper ist, bringst du das Gewicht wieder rauf.
