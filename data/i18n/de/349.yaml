name: Einarmiges Seitheben am Kabelzug
description: |-
  Stelle dich aufrecht neben einen Kabelzug und halte dich mit einer Hand fest, mit der anderen greifst du den Griff. Hebe nun den Arm mit dem Gewicht seitlich an, ohne ihn ganz durchzustrecken. Bewege während der Übung nur den arbeitenden Arm, ohne Schwung und ohne den Rumpf zu verdrehen. Halte am höchsten Punkt für eine Sekunde inne und senke das Gewicht langsam wieder ab. Bevor die Spannung nachlässt, hebst du das Gewicht erneut an.
