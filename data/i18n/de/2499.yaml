name: Erhöhte Liegestütze (Incline Push-Ups)
description: |-
  Ausgangsposition:
  Stelle deine Hände etwas weiter als schulterbreit auf eine stabile erhöhte Fläche (z. B. Hantelbank, Tisch oder Stufe). Trete mit den Füßen nach hinten, sodass dein Körper von Kopf bis Fersen eine vollkommen gerade Linie bildet.

  Ausführung:
  1. Senke die Brust langsam und kontrolliert ab, indem du die Ellbogen im 45-Grad-Winkel beugst, bis deine Brust die Kante der Erhöhung fast berührt.
  2. Halte die Rumpf- und Gesäßmuskulatur fest angespannt, ohne im unteren Rücken durchzuhängen.
  3. Drücke dich kraftvoll über die Hände zurück nach oben in die gestreckte Ausgangsposition.

  Hinweise:
  Je höher die gewählte Auflagefläche, desto leichter fällt die Übung. Ideal als fließende Progression zwischen Wandliegestützen und regulären Bodenliegestützen.
