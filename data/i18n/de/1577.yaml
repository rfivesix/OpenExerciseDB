name: Bretzel-Dehnung
description: 'Ausgangsposition:

  Lege dich in Seitenlage auf eine Matte. Führe das obere Knie im 90-Grad-Winkel nach
  vorne auf den Boden und halte es mit der unteren Hand fest am Boden verankert.


  Ausführung:

  1. Beuge das untere Knie nach hinten und greife den unteren Fuß oder Knöchel mit
  der oberen Hand.

  2. Atme tief ein, um die Wirbelsäule zu längen.

  3. Drehe beim Ausatmen die obere Schulter und den Brustkorb langsam auf in Richtung
  Boden, während das vordere Knie fest am Boden fixiert bleibt.

  4. Halte diese kombinierte Dehnung für 20–30 Sekunden bei ruhiger, tiefer Atmung
  und wechsle anschließend die Seite.


  Hinweise:

  Eine ganzheitliche Mobilitätsübung: Mobilisiert die Brustwirbelsäule in der Rotation,
  dehnt Quadrizeps und Hüftbeuger des hinteren Beins sowie die Gesäßmuskulatur des
  vorderen Beins.'
