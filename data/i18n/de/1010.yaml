name: Nackendehnung (hinten)
description: 'Ausgangsposition: Setze dich aufrecht auf einen Stuhl oder stehe mit
  geradem Rücken. Lege beide Hände mit verschränkten Fingern locker an den Hinterkopf.

  Ausführung: Atme aus und neige den Kopf behutsam nach vorne, indem du das Kinn sanft
  in Richtung Brustbein führst. Das Eigengewicht der Hände unterstützt die sanfte
  Dehnung der Nackenstrecker und des oberen Rückens.

  Rückkehr: Halte die Dehnung für 15–30 Sekunden bei gleichmäßiger Atmung und richte
  den Kopf anschließend langsam wieder auf.

  Hinweis: Ziehe nicht ruckartig am Kopf; die Dehnung soll angenehm und schmerzfrei
  bleiben.'
