name: Einarmiges Kurzhantelrudern
description: |-
  Ausgangsposition:
  Stütze dich mit einer Hand und dem gleichseitigen Knie auf einer Flachbank ab (oder stelle dich in Schrittstellung auf und stütze dich auf einem Oberschenkel oder Tisch ab). Halte den Rücken gerade und parallel zum Boden. Fasse eine Kurzhantel mit der freien Hand mit gestrecktem Arm im neutralen Griff.

  Ausführung:
  1. Ziehe die Kurzhantel kontrolliert nach oben in Richtung Hüfte, indem du den Ellbogen eng am Körper nach hinten oben führst.
  2. Ziehe das Schulterblatt am obersten Punkt aktiv heran und halte die Kontraktion im Latissimus für 1 Sekunde.
  3. Senke die Hantel langsam und kontrolliert wieder ab, bis der Arm gestreckt ist und der Rückenmuskel sanft gedehnt wird.
  4. Wiederhole die Bewegung für die gewünschte Wiederholungszahl und wechsle die Seite.

  Hinweise:
  Vermeide es, den Oberkörper bei der Zugbewegung aufzudrehen; halte die Schultern parallel zum Boden.
