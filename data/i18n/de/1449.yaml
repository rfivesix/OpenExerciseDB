name: Treppensteiger (ClimbMill)
description: |-
  Ausgangsposition:
  • Steige auf die Trittstufen des Treppensteigers (ClimbMill) und nimm eine aufrechte Körperhaltung ein.
  • Lege die Hände locker auf die Handläufe zur Unterstützung der Balance, ohne das Körpergewicht darauf abzustützen.

  Ausführung:
  • Steige kontinuierlich im gleichmäßigen Rhythmus Stufe für Stufe nach oben, indem du die gesamte Fußsohle aufsetzt.
  • Halte den Rumpf stabil und den Blick nach vorne gerichtet.
  • Passe die Stufengeschwindigkeit und die Trainingsdauer an dein Ausdauerlevel an.
