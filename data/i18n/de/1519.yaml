name: Trizepsstrecken über Kopf mit der SZ-Stange
description: 'Ausgangsposition:

  Setze dich auf eine Bank (idealerweise mit kurzer Rückenlehne) oder stehe aufrecht.
  Greife eine SZ-Stange im engen Obergriff und drücke sie mit gestreckten Armen senkrecht
  über den Kopf. Der Rumpf ist angespannt, der Rücken gerade.


  Ausführung:

  1. Senke die SZ-Stange kontrolliert hinter den Kopf ab, indem du die Ellbogen beugst,
  bis diese einen Winkel von etwa 90 Grad erreichen.

  2. Halte die Ellbogen eng beieinander und lasse sie nicht nach außen wandern.

  3. Drücke die Stange kraftvoll aus dem Trizeps wieder nach oben in die Ausgangsposition
  zurück, ohne die Ellbogen zu überstrecken.


  Hinweise:

  Die Überkopfposition dehnt den langen Kopf des Trizeps intensiv unter Last. Verwende
  ein moderates Gewicht, um die Schultergelenke zu schonen.'
