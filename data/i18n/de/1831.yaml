name: Hammer-Strength-Bankdrücken negativ (Decline)
description: "Ausgangsposition:\nSetze dich auf die Hammer-Strength-Negativ-Brustpresse.\
  \ Stelle die Sitzhöhe so ein, dass sich die Griffe auf Höhe deiner unteren Brust\
  \ befinden. Drücke deinen oberen Rücken, die Schultern und das Gesäß an das Rückenpolster\
  \ und stelle die Füße flach unter den Knien auf den Boden. Greife die Handgriffe\
  \ im Obergriff etwas mehr als schulterbreit.\n\nAusführung:\n1. Spanne den Rumpf\
  \ an und drücke die Griffe kraftvoll über die Handflächen nach vorne-unten, während\
  \ deine Ellenbogen in einem 45-Grad-Winkel zum Oberkörper geführt werden.\n2. Strecke\
  \ die Arme fast vollständig durch und spanne den unteren Anteil der Brustmuskulatur\
  \ (Pars sternocostalis) am Endpunkt maximal an.\n3. Führe die Hebelarme langsam\
  \ und kontrolliert wieder zurück, bis du eine Dehnung in der Brust spürst.\n\nHinweise:\n\
  Der negative Drückwinkel betont die unteren Brustmuskelfasern bei minimaler Belastung\
  \ der Schultergelenke."
