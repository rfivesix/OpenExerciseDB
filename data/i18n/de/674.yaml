name: TRX-Rudern
description: '- Greife die Griffe des Schlingentrainers (TRX) im neutralen Griff und
  lehne dich mit gestreckten Armen nach hinten.

  - Halte deinen Körper in einer geraden Linie vom Kopf bis zu den Fersen und spanne
  Bauch und Gesäß fest an.

  - Ziehe deine Brust zu den Griffen heran, indem du die Ellenbogen nach hinten führst
  und die Schulterblätter zusammenziehst.

  - Senke deinen Körper kontrolliert wieder ab, bis die Arme vollständig gestreckt
  sind.'
