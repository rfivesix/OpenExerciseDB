name: Plank to Push-up (Trizepsstrecken)
description: |-
  Ausgangsposition:
  Starte in der Unterarmstütz-Position (Plank auf den Unterarmen): Die Ellbogen befinden sich direkt unter den Schultern, die Unterarme liegen parallel auf dem Boden und der Körper bildet von Kopf bis Fersen eine gerade, feste Linie.

  Ausführung:
  Platziere nacheinander eine Hand flach auf den Boden und drücke dich nach oben in die Liegestützposition (High Plank mit gestreckten Armen). Halte den Rumpf stabil und senke dich anschließend kontrolliert Arm für Arm wieder auf die Unterarme ab. Wechsle bei jeder Wiederholung den führenden Arm ab.

  Hinweise:
  Halte das Becken möglichst ruhig und vermeide ein starkes Hin- und Herkippen der Hüfte. Spanne Bauch und Gesäß während des gesamten Bewegungsablaufs fest an.
