name: Reach-ups
description: |-
  Um diese Übung auszuführen, lege dich auf den Rücken, die Arme über dem Kopf gestreckt. Spanne dann deine Bauchmuskeln an und hebe deinen Oberkörper vom Boden, indem du die Arme zur Decke streckst, um so hoch wie möglich zu "reichen". Kehre langsam und kontrolliert in die Ausgangsposition zurück. Die Reach-ups stärken die Bauchmuskeln und verbessern die Beweglichkeit der Wirbelsäule. Sie lassen sich in vielfältige Trainingsroutinen einbauen, um Kraft und Stabilität des Rumpfes zu trainieren.
