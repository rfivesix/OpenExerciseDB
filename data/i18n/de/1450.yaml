name: Kobra-Dehnung
description: |-
  Die Kobra-Dehnung ist eine Rückenstreckungsübung, die hilft, die Flexibilität der Wirbelsäule zu verbessern und Verspannungen im unteren Rücken zu lösen. Lege dich dazu mit dem Gesicht nach unten auf den Boden und platziere deine Hände unter den Schultern. Drücke die Handflächen in den Boden und hebe die Brust an, während du die Hüften am Boden lässt. Halte die Ellbogen leicht gebeugt und die Schultern entspannt. Halte die Dehnung für ein paar Sekunden und senke dich dann langsam wieder ab. Diese Übung ist hilfreich, um die Haltung zu verbessern und Steifheit im unteren Rücken zu verringern.
