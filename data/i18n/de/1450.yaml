name: Kobra-Dehnung (Cobra Stretch)
description: |-
  Ausgangsposition:
  • Lege dich bäuchlings flach auf eine Trainingsmatte, die Beine sind hüftbreit nach hinten ausgestreckt und die Fußrücken liegen auf.
  • Platziere die Handflächen flach auf Brusthöhe unterhalb der Schultern, die Ellbogen eng am Körper.

  Ausführung:
  • Drücke den Boden sanft mit den Händen nach unten und hebe Brust und Kopf langsam nach oben an, während das Becken und die Oberschenkel fest am Boden bleiben.
  • Ziehe die Schultern nach hinten-unten weg von den Ohren und öffne den Brustkorb.
  • Halte die Dehnung für 15 bis 30 Sekunden bei ruhiger, gleichmäßiger Atmung.
  • Senke den Oberkörper kontrolliert wieder ab.
