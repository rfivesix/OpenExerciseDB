name: Sitzende Schulterextensions-Dehnung
description: "Ausgangsposition: Setze dich auf den Boden und platziere deine Hände\
  \ schulterbreit hinter deinem Körper mit den Fingern nach hinten oder leicht zur\
  \ Seite gerichtet.\nAusführung: Halte die Arme gestreckt und schiebe dein Gesäß\
  \ und deine Füße langsam nach vorne, sodass sich die Schultern in eine Extension\
  \ nach hinten bewegen und eine Dehnung in den vorderen Schultern und der Brust entsteht.\n\
  Hinweise: Gehe nur so weit, wie es schmerzfrei möglich ist. Halte die Dehnung für\
  \ 20–30 Sekunden bei gleichmäßiger Atmung."
