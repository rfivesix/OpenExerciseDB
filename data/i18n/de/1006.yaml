name: Kinn einziehen (Chin Tuck)
description: 'Ausgangsposition: Sitze oder stehe aufrecht, die Schultern sind entspannt
  nach hinten-unten gezogen und der Blick geht geradeaus.

  Ausführung: Ziehe dein Kinn waagerecht nach hinten-unten (wie zur Bildung eines
  leichten Doppelkinns), sodass die Ohren direkt über die Schultern wandern.

  Rückkehr: Halte die Position für 3–5 Sekunden und spüre die Aufrichtung der Halswirbelsäule,
  danach entspannt in die Ausgangsposition zurückkehren.

  Hinweis: Nicke nicht mit dem Kopf nach unten; die Bewegung erfolgt rein horizontal
  nach hinten.'
