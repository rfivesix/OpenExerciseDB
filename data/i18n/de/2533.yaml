name: Bogenhang (Arch Hang)
description: |-
  Ausgangsposition:
  Hänge dich mit beiden Händen im Obergriff schulterbreit an eine Klimmzugstange. Beginne in einem passiven Hang, aktiviere dann deine Schultern, indem du die Schulterblätter nach unten ziehst (aktiver Hang).

  Ausführung:
  1. Halte die Arme während der gesamten Übung komplett gestreckt.
  2. Ziehe deine Schulterblätter kraftvoll nach hinten unten zusammen und überstrecke die Brustwirbelsäule, sodass dein Brustkorb nach oben zur Stange zeigt.
  3. Bringe deinen Oberkörper in einen 45- bis 90-Grad-Winkel zur Senkrechten und bilde einen stabilen dorsalen Bogen (Arch).
  4. Halte die isometrische Bogenposition für 2 bis 5 Sekunden unter maximaler Anspannung im Latissimus und unteren Trapez.
  5. Lasse dich langsam wieder in den aktiven Hang absinken und wiederhole die Bewegung.

  Hinweise:
  Beuge nicht die Ellbogen; die Bewegung stammt rein aus der Retraktion und Depression der Schulterblätter sowie der Thoraxstreckung.
