name: Glute Drive (Beckenheben an der Maschine)
description: 'Ausgangsposition:

  Setze dich in die Glute-Drive-Maschine, lehne den oberen Rücken an das Rückenpolster
  und schnalle den gepolsterten Hüftgurt fest über deiner Beckenfalte an. Platziere
  die Füße etwa schulterbreit flach auf der Fußplatte.


  Ausführung:

  1. Löse den Sicherheitshebel und drücke dein Becken über die Fersen kraftvoll nach
  oben gegen den Gurtwiderstand.

  2. Hebe das Becken an, bis Oberschenkel und Oberkörper eine horizontale Linie bilden,
  und spanne das Gesäß am höchsten Punkt 1–2 Sekunden maximal an.

  3. Senke das Becken langsam und kontrolliert wieder ab, ohne dass die Gewichte komplett
  aufsetzen.


  Hinweise:

  Erlaubt ein sicheres, stabiles und schweres Training der Gesäßmuskulatur mit einfacherem
  Setup als beim klassischen Langhantel-Hip-Thrust.'
