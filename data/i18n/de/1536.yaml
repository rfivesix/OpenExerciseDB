name: Schulterdehnung im Stand (Deltamuskel-Dehnung)
description: 'Ausgangsposition:

  Stehe oder sitze aufrecht mit entspannten Schultern und neutraler Wirbelsäule.


  Ausführung:

  1. Führe einen gestreckten Arm auf Schulterhöhe horizontal quer über deine Brust.

  2. Greife mit der anderen Hand den Oberarm oder Ellbogen des gestreckten Arms und
  ziehe ihn sanft näher an den Brustkorb heran.

  3. Halte die Dehnung für 20 bis 30 Sekunden, während du gleichmäßig weiteratmest.

  4. Löse die Dehnung langsam und wiederhole die Übung auf der Gegenseite.


  Hinweise:

  Dehnt gezielt die hintere Schultermuskulatur (Pars posterior des Deltamuskels) und
  die Außenrotatoren. Ziehe die Schulter dabei nicht nach oben in Richtung Ohr.'
