name: Reverse Kabelzug-Curls mit SZ-Stange
description: '- Befestige eine SZ-Stange am unteren Kabelzug und stelle dich aufrecht
  davor hin.

  - Greife die SZ-Stange im Obergriff (Handflächen nach unten) an den inneren Biegungen
  der Stange.

  - Halte die Ellenbogen eng am Körper und curle die Stange nach oben, bis die Unterarme
  fast senkrecht stehen.

  - Senke das Gewicht langsam wieder in die Ausgangsposition ab und halte die Spannung
  in Unterarmen und Bizeps.'
