name: Box Squat mit weitem Stand
description: |-
  Nimm die Stange aus der Ablage und nimm einen weiten Stand ein, breiter als deine Hüfte. Schiebe die Hüfte nach hinten und setze dich auf eine Box, die dich unter die Parallele bringt. Setze dich vollständig hin, kein Touch-and-go. Stehe dann explosiv auf. Bleibe während der gesamten Bewegung im oberen Rücken und Oberkörper fest angespannt.
