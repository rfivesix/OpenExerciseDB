name: Y-Heben über Kreuz am Kabelzug
description: |-
  Ausgangsposition:
  • Befestige zwei D-Griffe an den unteren Umlenkrollen eines Kabelzugs.
  • Greife die Kabel über Kreuz (rechter Arm greift linkes Kabel, linker Arm greift rechtes Kabel).
  • Stehe aufrecht und stabil im hüftbreiten Stand mit leicht vorgebeugtem Rumpf.

  Ausführung:
  • Hebe beide Arme diagonal nach oben und außen an, sodass dein Körper und deine Arme am oberen Punkt ein weites „Y“ bilden.
  • Spanne die hintere Schultermuskulatur und den unteren Trapezmuskel am höchsten Punkt fest an.
  • Senke die Griffe kontrolliert über Kreuz vor den Oberschenkeln wieder ab.
