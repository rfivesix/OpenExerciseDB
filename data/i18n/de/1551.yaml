name: Liegestütz
description: 'Der Liegestütz ist eine grundlegende Körpergewichtsübung, die Brust,
  Arme und Schultern beansprucht und gleichzeitig den Rumpf zur Stabilisierung aktiviert.
  Sie erfordert keine Ausrüstung und eignet sich hervorragend zum Aufbau der Oberkörperkraft.

  Anleitung:


  Beginne in einer Liegestützposition mit den Händen etwas weiter als schulterbreit,
  die Füße zusammen und der Körper in einer geraden Linie von Kopf bis Fersen.

  Spanne deinen Rumpf an und senke deinen Körper, indem du die Ellbogen beugst und
  sie nah am Körper hältst oder leicht nach außen abspreizt.

  Senke dich ab, bis deine Brust fast den Boden berührt, während du eine neutrale
  Wirbelsäule beibehältst.

  Drücke dich über die Handflächen in die Ausgangsposition zurück und strecke die
  Arme vollständig durch.'
