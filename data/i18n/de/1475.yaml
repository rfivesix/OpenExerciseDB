name: Black Widow Knee Slides
description: |-
  Ausgangsposition:
  Gehe in die hohe Liegestützposition (Plank auf Händen), Hände direkt unter den Schultern platziert, der Körper bildet von Kopf bis Fersen eine gerade Linie.

  Ausführung:
  1. Ziehe ein Knie diagonal unter dem Oberkörper nach vorne in Richtung des gegenüberliegenden Ellenbogens.
  2. Schiebe das Knie am Unterarm nach oben, während du das Becken leicht nach hinten kippst, um die schrägen und geraden Bauchmuskeln maximal zu kontrahieren.
  3. Führe das Bein kontrolliert zurück in die Ausgangsposition und wiederhole die Bewegung mit der anderen Seite.

  Hinweise:
  Achte auf eine aktive Rumpfspannung und lass die Hüfte nicht durchhängen.
