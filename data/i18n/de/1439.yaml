  Stelle die Sicherheitsablagen (Pins) im Power Rack auf etwa Kinnhöhe ein und lege die Langhantel darauf ab. Stelle dich mit den Füßen schulterbreit hin, greife die Stange etwas außerhalb der Schultern im Obergriff und begib dich mit aufrechtem Oberkörper unter die Stange.

  Ausführung:
