description: 'Ausgangsposition: Setze dich an die Kabelrudermaschine, stelle die Füße
  fest auf die Fußstützen und halte die Knie leicht gebeugt. Halte den Rücken gerade.

  Ausführung: Halte den Oberkörper leicht nach vorne geneigt und ziehe den Griff zum
  Bauch, während die Ellbogen in der Rückholphase kontrolliert eng am Körper geführt
  werden.

  Hinweis: Diese Übung wurde mit Übung 1117 (Kabelrudern sitzend) zusammengeführt.'
