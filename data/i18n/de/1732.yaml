name: Face Pulls mit Widerstandsband
description: |-
  Face Pulls mit Band – stehender horizontaler Zug. Greife das Band auf Gesichtshöhe, ziehe die Ellbogen hoch und weit nach außen in Richtung deines Gesichts und ziehe dabei die Schulterblätter zusammen. Trainiert den oberen Rücken und die hintere Schultermuskulatur und verbessert die Haltung.
