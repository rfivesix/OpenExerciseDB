name: Klappmesser-Crunch mit Medizinball
description: 'Ausgangsposition: Lege dich rücklings auf eine Matte. Die Beine sind
  ausgestreckt und die Arme halten den Medizinball mit beiden Händen über dem Kopf
  gestreckt am Boden.

  Ausführung: Hebe gleichzeitig den Oberkörper und die gestreckten Beine vom Boden
  an und führe den Medizinball in Richtung der Schienbeine oder Füße, sodass der Körper
  eine "V"-Form bildet. Kontrahiere die Bauchmuskeln maximal.

  Rückkehr: Senke Beine und Oberkörper langsam und kontrolliert wieder in die Ausgangslage
  ab, ohne die Grundspannung im Bauch zu verlieren.

  Hinweis: Führe die Bewegung gleichmäßig ohne übermäßigen Schwung aus.'
