name: Hüftadduktion an der Maschine
description: |-
  Ausgangsposition:
  Setze dich auf die Adduktorenmaschine mit dem Rücken fest am Rückenpolster. Stelle die Hebelarme auf eine komfortable, weite Spreizung ein, bei der deine Oberschenkelinnenseiten an den Polstern anliegen. Platziere die Füße auf den Fußstützen.

  Ausführung:
  1. Drücke deine Beine gegen den Widerstand kraftvoll nach innen zusammen, bis sich die Polster fast oder ganz berühren.
  2. Spanne die Adduktoren (Oberschenkelinnenseite) am Endpunkt für 1 bis 2 Sekunden fest an.
  3. Öffne die Beine langsam und kontrolliert wieder in die Ausgangsdehnung zurück, ohne das Gewicht ganz abzusetzen.

  Hinweise:
  Bewege dich in einem kontrollierten Tempo und vermeide ruckartiges Aufschlagen der Gewichte.
