name: Planche-Lean (Halten)
description: |-
  Ausgangsposition:
  Begib dich in eine hohe Liegestützposition (Liegestützstütz) auf den Boden. Drehe die Hände leicht nach außen, um die Handgelenke zu entlasten. Die Arme sind vollständig durchgestreckt.

  Ausführung:
  1. Drücke deine Hände fest in den Boden, um die Schulterblätter maximal nach vorne außen zu schieben (Scapular Protraction / Runder oberer Rücken).
  2. Spanne Bauch und Gesäß fest in einer Schiffchen-Position (Hollow Body) an.
  3. Lehne deine Schultern langsam so weit wie möglich nach vorne über die Handgelenke hinaus, während deine Zehenspitzen am Boden bleiben.
  4. Halte diese maximale Vorlage statisch für die angegebene Zeit, während die Arme komplett gestreckt bleiben.

  Hinweise:
  Knicke in den Ellbogen zu keinem Zeitpunkt ein; die Vorlage baut spezifische Kraft in den vorderen Schultern und der Bizepssehne für die spätere Planche auf.
