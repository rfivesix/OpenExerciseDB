name: Burpees
description: |-
  Aus dem aufrechten Stand in die Hocke gehen, Hände auf den Boden setzen, Beine nach hinten in die Liegestützposition springen, eine Liegestütze ausführen, mit den Füßen wieder nach vorne springen und mit einem Strecksprung aufrichten. Wiederholen.
