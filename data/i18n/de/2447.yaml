name: Hip Airplane (Standwaage-Hüftrotation)
description: |-
  Ausgangsposition:
  Stelle dich auf ein Bein und halte dich bei Bedarf mit einer Hand an einer Wand oder Stange fest. Neige den Oberkörper mit geradem Rücken nach vorne und strecke das freie Bein nach hinten aus, bis Oberkörper und Bein etwa eine waagerechte Linie bilden (Standwaage).

  Ausführung:
  1. Drehe dein Becken langsam und kontrolliert nach innen zum Standbein hin (Hüftinnenrotation), sodass sich die Hüfte schließt.
  2. Drehe das Becken anschließend weit nach außen auf (Hüftaußenrotation), sodass sich die freie Hüftseite zur Decke öffnet.
  3. Kehre kontrolliert in die neutrale Ausgangslage zurück und wiederhole die Bewegung für die gewünschte Wiederholungszahl, bevor du das Standbein wechselst.

  Hinweise:
  Die Bewegung erfolgt rein aus der Hüfte des Standbeins. Das Standbein bleibt stabil und das Knie minimal gebeugt, ohne nach innen einzuknicken.
