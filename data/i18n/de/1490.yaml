name: Trizeps-Kickback auf der Schrägbank
description: |-
  Ausgangsposition:
  Stelle eine Schrägbank auf einen Winkel von ca. 60 Grad ein. Lege dich mit der Brust und dem Oberkörper bauchlings gegen die Schrägbank, die Beine stabil nach hinten gestützt. Halte in jeder Hand eine Kurzhantel. Ziehe die Schulterblätter zusammen und hebe die Oberarme an, sodass sie etwa parallel zum Boden und nah am Oberkörper liegen.

  Ausführung:
  1. Halte die Oberarme vollkommen ruhig und strecke die Ellenbogen nach hinten durch, bis die Arme eine gerade Linie bilden.
  2. Spanne den Trizeps am obersten Punkt für eine Sekunde maximal an.
  3. Senke die Unterarme kontrolliert wieder in den 90-Grad-Winkel der Ausgangsposition ab.

  Hinweise:
  Durch die feste Auflage auf der Schrägbank wird jeglicher Schwung aus dem Rumpf eliminiert, was eine optimale Isolation des langen Trizepskopfs bewirkt.
