name: Liegender Trizeps-Kickback
description: |-
  Stelle die Bank auf einen Winkel von 60 Grad ein. Stehe still und lege deinen Oberkörper auf die geneigte Bank, sodass dein gesamter Körper eine nahezu gerade Linie bildet. Ziehe die Schulterblätter zusammen, sodass sich deine Ellbogen hinter deinem Oberkörper befinden und deine Oberarme nahezu parallel zum Boden sind. Hebe die Kurzhanteln an, bis deine Arme eine gerade Linie bilden. Senke die Kurzhanteln langsam wieder in die Ausgangsposition ab. Die Ausgangsposition entspricht einer rechtwinkligen Position von Ober- und Unterarm.
