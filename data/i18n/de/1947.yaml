name: Kurzhantel-Reißen (Dumbbell Snatch)
description: 'Ausgangsposition:

  Stelle dich hüft- bis schulterbreit hin und platziere eine Kurzhantel auf dem Boden zwischen deinen Füßen. Beuge Hüfte und Knie mit geradem Rücken und aufgerichteter Brust und greife die Kurzhantel im Obergriff.


  Ausführung:

  Strecke Hüfte, Knie und Sprunggelenke explosionsartig (Dreifachstreckung), um die Kurzhantel senkrecht nach oben zu katapultieren. Führe die Hantel mit hohem Ellbogen eng am Körper entlang. Sobald die Hantel Brusthöhe erreicht, tauche blitzschnell unter das Gewicht ab, fange die Hantel mit voll gestrecktem Arm über Kopf in einer leichten Kniebeuge auf und richte dich vollständig auf. Führe die Hantel kontrolliert wieder zum Boden zurück.


  Hinweise:

  Die Kraft kommt ausschließlich aus der Hüftstreckung und den Beinen, nicht aus dem Arm; beginne mit moderatem Gewicht, um die Technik präzise einzuschleifen.'
