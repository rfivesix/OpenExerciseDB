description: |-
  Nimm die Kurzhanteln in die Hand, lege dich auf eine Bank, sodass ca. 1/4 deines Kopfes über das Bankende hinausragt. Strecke die Arme nach oben aus und senke die Gewichte in einem Bogen kontrolliert ab. Wenn die Kurzhanteln knapp über der Stirn sind, drücke sie wieder nach oben.
