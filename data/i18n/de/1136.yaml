name: Latzug zur Brust mit neutralem Griff
description: |-
  Ausgangsposition:
  • Setze dich an die Latzugmaschine (oder knie vor einem Kabelturm) und fixiere die Oberschenkel unter den Polstern.
  • Fasse den Parallelgriff (V-Griff oder Multigriff) im neutralen Griff, sodass die Handflächen zueinander zeigen.
  • Richte den Oberkörper auf, hebe die Brust an und halte die Wirbelsäule stabil.

  Ausführung:
  • Ziehe den Griff kontrolliert nach unten in Richtung oberer Brustbereich, indem du die Ellbogen nach unten und hinten führst.
  • Ziehe die Schulterblätter aktiv nach hinten-unten zusammen und halte die Endposition kurz für maximale Muskelspannung.
  • Führe den Griff langsam und kontrolliert wieder nach oben, bis deine Arme gestreckt und die Rückenmuskeln sanft gedehnt sind.
