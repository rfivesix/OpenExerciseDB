name: Knieheben an der Klimmzugstange
description: 'Ausgangsposition: Hänge dich mit gestreckten Armen im Obergriff an eine
  Klimmzugstange. Die Schultern sind aktiv stabilisiert und die Beine geschlossen.

  Ausführung: Spanne die Bauchmuskeln fest an und ziehe die gebeugten Knie kontrolliert
  nach oben in Richtung Brust. Rolle dabei das Becken leicht ein, um die Bauchmuskeln
  maximal zu kontrahieren.

  Rückkehr: Senke die Beine langsam und kontrolliert wieder ab, ohne den Körper in
  Schwingung zu versetzen.

  Hinweis: Führe die Wiederholungen strikt ohne Schwungholen aus den Beinen aus.'
