name: Latzug mit gestreckten Armen am Widerstandsband
description: 'Ausgangsposition:

  Befestige ein Widerstandsband an einem hohen Punkt (z. B. einer Klimmzugstange). Stelle dich hüftbreit hin, greife das Band mit beiden Händen im Obergriff und trete einen Schritt zurück, bis das Band unter Spannung steht. Neige den geraden Oberkörper leicht nach vorne und halte die Arme fast vollständig gestreckt mit minimal gebeugten Ellbogen.


  Ausführung:

  Ziehe das Band in einem weiten Bogen nach unten und hinten in Richtung der Oberschenkel, indem du die Kraft rein aus dem Latissimus erzeugst. Halte die Ellbogenposition konstant und spanne den Latissimus am Ende der Bewegung für eine Sekunde maximal an. Führe das Band langsam und kontrolliert wieder nach oben zurück, bis der Rücken vollständig gedehnt ist.


  Hinweise:

  Die Bewegung erfolgt ausschließlich im Schultergelenk; beuge oder strecke die Ellbogen während des Zuges nicht, um die Last gezielt auf dem breiten Rückenmuskel zu halten.'
