name: Unterstützter Klimmzug
description: |-
  Der unterstützte Klimmzug ist eine mehrgelenkige vertikale Zugübung, die an einer Maschine mit Gegengewichtsplattform oder mithilfe von Widerstandsbändern ausgeführt wird. Sie ahmt die Mechanik eines normalen Klimmzugs nach, reduziert aber das Gesamtgewicht, das du heben musst, und ist damit ein hervorragendes Mittel, um funktionelle Kraft aufzubauen und deine Technik zu perfektionieren.
