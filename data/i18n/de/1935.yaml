name: Belt Squat
description: |-
  Belt Squat: eine Kniebeuge-Variante, die mit einem Gürtel ausgeführt wird, der an einer Lademaschine oder Plattform befestigt ist, sodass das Gewicht an der Hüfte statt auf der Wirbelsäule getragen wird. Sie trainiert vor allem die vordere Oberschenkelmuskulatur und die Gesäßmuskulatur, mit deutlich weniger Belastung für den unteren Rücken als eine Langhantel-Kniebeuge. Nutze den vollen Bewegungsumfang, halte den Oberkörper aufrecht und drücke über den Mittelfuß.
