name: Belt Squat an der Maschine
description: 'Ausgangsposition:

  Stelle dich auf die Plattform der Belt-Squat-Maschine und lege den Trainingsgürtel um deine Hüfte. Befestige den Gürtel an der Ladehaken-Kette der Maschine, stelle die Füße schulterbreit auf und halte dich leicht an den Haltegriffen fest.


  Ausführung:

  Entriegle das Gewicht und beuge Knie und Hüfte kontrolliert, um in eine tiefe Kniebeuge abzusinken, bis die Oberschenkel mindestens parallel zum Boden stehen. Halte den Oberkörper aufrecht. Drücke dich kraftvoll über die gesamte Fußsohle wieder nach oben in den Stand, ohne die Knie am Umkehrpunkt zu überstrecken.


  Hinweise:

  Da das Gewicht direkt an der Hüfte zieht, entlastet die Belt Squat die Wirbelsäule vollständig und eignet sich hervorragend für Personen mit Rückenbeschwerden oder zur gezielten Beinbelastung.'
