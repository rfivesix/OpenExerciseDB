name: Liegestütz an der Wand
description: '- Stelle dich etwa eine Armlänge von einer stabilen Wand entfernt auf,
  die Füße hüftbreit.

  - Lege deine Hände flach auf Schulterhöhe und etwas weiter als schulterbreit an
  die Wand.

  - Halte den Körper von Kopf bis Fuß in einer geraden Linie und beuge kontrolliert
  die Ellenbogen, um deine Brust der Wand zu nähern.

  - Drücke dich kraftvoll aus der Brust und den Armen wieder in die Ausgangsposition
  zurück, ohne die Hüfte einknicken zu lassen.'
