name: Zottman-Curl
description: |-
  Ausgangsposition:
  Aufrecht stehen, in jeder Hand eine Kurzhantel im Untergriff (Handflächen zeigen nach vorne) seitlich am Körper halten.
  
  Ausführung:
  1. Die Kurzhanteln kontrolliert nach oben zu den Schultern curlen.
  2. Am obersten Punkt die Handgelenke nach innen drehen, sodass die Handflächen nach unten zeigen (Obergriff).
  3. Die Kurzhanteln langsam und kontrolliert im Obergriff absenken.
  4. Am tiefsten Punkt die Handflächen wieder nach vorne drehen.
  
  Hinweise:
  Die Ellbogen eng am Körper halten. Die betonte exzentrische Phase im Obergriff stärkt gezielt den Brachioradialis und die Unterarmmuskulatur.
