name: Trizepsdrücken mit Widerstandsband
description: |-
  Ausgangsposition:
  Befestige ein elastisches Widerstandsband sicher an einem hohen Ankerpunkt über dir (z. B. Klimmzugstange oder Türanker). Stelle dich hüftbreit mit leicht gebeugten Knien vor das Band. Greife die Bandenden mit neutralem Griff oder Obergriff und halte die Ellbogen eng an den Flanken deines Oberkörpers fixiert.

  Ausführung:
  1. Strecke deine Unterarme kraftvoll nach unten durch, bis die Arme vollständig gestreckt sind und deine Hände neben den Oberschenkeln stehen.
  2. Spanne den Trizeps am tiefsten Punkt für 1 bis 2 Sekunden maximal an.
  3. Führe die Unterarme langsam und kontrolliert gegen den Bandzug wieder nach oben in etwa 90 Grad Beugung zurück.

  Hinweise:
  Die Oberarme und Ellbogen bleiben während der gesamten Übung unbeweglich an den Rippen fixiert; bewege ausschließlich die Unterarme.
