name: Nackendehnung (rechts)
description: 'Ausgangsposition: Sitze oder stehe aufrecht mit geradem Rücken und entspannten,
  tiefen Schultern.

  Ausführung: Neige den Kopf sanft zur linken Seite, sodass das linke Ohr in Richtung
  der linken Schulter wandert. Spüre die Dehnung auf der rechten Seite des Nackens
  und oberen Trapezmuskels. Du kannst die linke Hand leicht auf den Kopf legen, um
  die Dehnung sanft zu unterstützen.

  Rückkehr: Halte die Dehnung für 15–30 Sekunden bei ruhiger Atmung und richte den
  Kopf langsam wieder auf.

  Hinweis: Ziehe die rechte Schulter aktiv nach unten und reiße niemals am Kopf.'
