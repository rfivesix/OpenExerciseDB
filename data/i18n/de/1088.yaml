name: Sumo-Kreuzheben mit Kurzhantel
description: |-
  Ausgangsposition:
  Nimm einen breiten Stand ein (etwa 1,5-fache bis doppelte Schulterbreite), die Fußspitzen zeigen in einem 45-Grad-Winkel nach außen. Platziere eine schwere Kurzhantel senkrecht zwischen deinen Beinen auf dem Boden.

  Ausführung:
  1. Beuge die Knie und schiebe die Hüfte nach hinten, halte die Brust aufrecht und den Rücken neutral.
  2. Greife das obere Ende der aufrecht stehenden Kurzhantel mit beiden Händen.
  3. Drücke den Boden über die Fersen kraftvoll weg und ziehe dich nach oben in den aufrechten Stand, wobei du die Adduktoren und das Gesäß anspannst.
  4. Senke die Kurzhantel kontrolliert wieder zum Boden ab, indem du Knie und Hüfte synchron beugst.
