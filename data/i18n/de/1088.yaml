name: Sumo-Kreuzheben mit Kurzhantel
description: |-
  Senke deine Kurzhantel zwischen deinen Beinen zum Boden. Nimm eine breite Standposition ein und gehe mit geradem Rücken in die Kniebeuge. Greife die aufrecht stehende Kurzhantel an der Oberseite des "Kopfes" (Bild 1). Halte deine Brust aufrecht und deinen Rumpf angespannt, drücke dich vom Boden ab und treibe dich wieder nach oben in den Stand (Bild 2). Wiederhole. Wenn du problemlos 20-30 Wiederholungen schaffst, verwende zwei Kurzhanteln.
