name: L-Sit (fußunterstützt)
description: "Ausgangsposition: Setze dich mit aufrechtem Oberkörper und gestreckten\
  \ Beinen auf den Boden oder zwischen Parallettes. Platziere die Hände neben den\
  \ Hüften auf dem Boden.\nAusführung: Drücke dich über die Hände nach oben und hebe\
  \ das Gesäß vom Boden ab. Die Fersen bleiben auf dem Boden aufgestellt, um einen\
  \ Teil des Beingewichts zu tragen und die Belastung zu reduzieren.\nHinweise: Halte\
  \ die Schultern tief (weg von den Ohren) und spanne Bauch- und Trizepsmuskulatur\
  \ fest an. Halte die Position für die vorgegebene Zeit."
