name: Tiefe Kniebeuge mit Rotation (Sky Reach)
description: |-
  Ausgangsposition:
  Stelle dich schulterbreit hin und gehe in eine tiefe Kniebeuge (Deep Squat). Umfasse mit deiner linken Hand deinen rechten Knöchel oder Fuß. Winkle den rechten Arm an oder lege die Hand an die Brust.

  Ausführung:
  1. Halte die tiefe Hocke stabil und drehe deinen Oberkörper nach rechts auf.
  2. Führe den rechten Ellbogen und Arm in einer weiten Drehbewegung nach oben hinten, bis die Hand oder der Ellbogen zur Decke zeigt.
  3. Folge der Hand mit dem Blick und spüre die Mobilisation in der Brustwirbelsäule und Hüfte.
  4. Halte die Position für 1 bis 2 Sekunden und kehre kontrolliert in die mittige Hocke zurück.
  5. Wiederhole die Drehung für die gewünschten Wiederholungen und wechsle zur anderen Seite.

  Hinweise:
  Halte die Fersen flach auf dem Boden und die Knie nach außen gedrückt; die Rotation soll hauptsächlich aus der Brustwirbelsäule erfolgen.
