name: Isometrisches Schulterdrücken am Kabelzug
description: |-
  Ausgangsposition:
  Stelle dich mittig in eine Kabelzugstation, deren Griffe auf die unterste Position eingestellt sind. Greife die Griffe im Obergriff und bringe sie kontrolliert auf Schulterhöhe, die Ellbogen unter den Händen positioniert. Nimm einen schulterbreiten, stabilen Stand ein und spanne Rumpf und Gesäß fest an.

  Ausführung:
  1. Drücke die Griffe gegen den Kabelzug nach oben, bis sie sich auf Stirnhöhe oder kurz vor der vollständigen Streckung der Arme über dem Kopf befinden.
  2. Halte die Arme in dieser Position für die vorgegebene Zeitspanne völlig ruhig und spanne die vordere Schultermuskulatur und den Trizeps unter dem kontinuierlichen Kabelzugwiderstand maximal an.
  3. Senke die Griffe nach Ablauf der Haltezeit langsam und kontrolliert wieder auf Schulterhöhe ab.

  Hinweise:
  Halte die Wirbelsäule neutral und vermeide es, ins Hohlkreuz zu fallen. Der Kabelzug sorgt für eine durchgehende Zugspannung, die eine hohe Rumpfstabilität erfordert.
