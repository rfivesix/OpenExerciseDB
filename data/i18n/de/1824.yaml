name: Tate Press mit Kurzhanteln
description: "Ausgangsposition:\nLege dich rücklings auf eine Flachbank und halte\
  \ in jeder Hand eine Kurzhantel. Strecke die Arme über deiner Brust nach oben aus.\
  \ Drehe die Handgelenke in einen pronierten Obergriff, sodass deine Handflächen\
  \ in Richtung der Füße und deine Daumen zueinander zeigen. Die Hantelscheiben berühren\
  \ sich oder sind dicht beieinander.\n\nAusführung:\n1. Halte deine Oberarme stabil\
  \ in Position und beuge die Ellenbogen kontrolliert nach außen zur Seite.\n2. Senke\
  \ die inneren Köpfe der Kurzhanteln zur Mitte deiner Brust ab, bis sie die Brust\
  \ ganz leicht berühren, ohne das Gewicht abzulegen.\n3. Strecke die Ellenbogen kraftvoll\
  \ wieder durch und drücke die Kurzhanteln nach oben in die Ausgangsposition; konzentriere\
  \ dich darauf, die kleinen Finger zur Decke zu drücken.\n4. Halte die maximale Trizepskontraktion\
  \ am obersten Punkt für 1 Sekunde.\n\nHinweise:\nEine hochwirksame Isolationsübung\
  \ für den Trizeps (insbesondere den lateralen und medialen Kopf), entwickelt vom\
  \ Powerlifter Dave Tate."
