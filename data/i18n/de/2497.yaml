name: Einarmiges Kurzhantel-Bodendrücken
description: |-
  Ausgangsposition:
  Lege dich rücklings auf den Boden oder eine Trainingsmatte. Stelle die Füße flach auf den Boden mit gebeugten Knien. Halte eine Kurzhantel in einer Hand senkrecht über der Brust mit gestrecktem Arm. Der freie Arm ruht zur Stabilisierung seitlich auf dem Boden.

  Ausführung:
  1. Senke die Kurzhantel kontrolliert ab, indem du den Ellbogen im 45- bis 60-Grad-Winkel zum Oberkörper nach unten führst, bis dein Oberarm sanft den Boden berührt.
  2. Pausiere für einen kurzen Moment am Boden, ohne die Spannung in der Muskulatur zu verlieren.
  3. Drücke die Hantel kraftvoll und geradlinig nach oben in die Ausgangsposition zurück.
  4. Absolviere die Wiederholungen und wechsle die Seite.

  Hinweise:
  Spanne den Rumpf fest an, um einer Rotation des Oberkörpers entgegenzuwirken (Anti-Rotation). Das Bodendrücken schont die Schultergelenke durch die begrenzte Tiefe.
