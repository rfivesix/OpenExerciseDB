name: Abwechselnde Kurzhantel-Bizepscurls
description: |-
  Ausgangsposition:
  Stehe aufrecht mit den Füßen hüftbreit auseinander. Halte in jeder Hand eine Kurzhantel mit gestreckten Armen neben dem Körper, Handflächen zeigen zueinander (neutraler Griff). Die Knie sind minimal gebeugt, der Rumpf angespannt und die Schultern nach hinten unten gezogen.

  Ausführung:
  1. Beuge einen Arm kontrolliert im Ellenbogen und drehe dabei den Unterarm nach außen (Supination), sodass die Handfläche in Richtung Schulter zeigt.
  2. Führe die Hantel nach oben, bis der Bizeps maximal kontrahiert ist. Der Oberarm bleibt dabei eng am Körper fixiert.
  3. Senke das Gewicht langsam und kontrolliert wieder in die Ausgangsposition ab.
  4. Wiederhole die Bewegung mit dem anderen Arm und wechsle die Seiten im flüssigen Rhythmus ab.
