name: Lockeres Dauerschwimmen (Kraul)
description: |-
  Ausgangsposition:
  Begib dich ins Schwimmbecken und stoße dich sanft von der Beckenwand in eine gestreckte, waagerechte Wasserlage (Streamline-Position) ab.

  Ausführung:
  1. Schwimme Kraul in einem gleichmäßigen, entspannten Wohlfühltempo, bei dem du dich theoretisch noch unterhalten könntest.
  2. Führe lange, saubere Armzüge aus und atme ruhig und rhythmisch zu beiden Seiten (Dreieratmung) oder zur bevorzugten Seite.
  3. Halte den Beinschlag locker und ökonomisch aus der Hüfte.
  4. Schwimme kontinuierlich über die geplante Distanz oder Dauer ohne Zwischenstopps.

  Hinweise:
  Konzentriere dich auf Gleitphasen und Wassergefühl statt auf Tempo; die Übung dient dem lockeren Herz-Kreislauf-Training und der Ausdauerbasis.
