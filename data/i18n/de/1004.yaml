name: Schulterkreisen vorwärts
description: 'Ausgangsposition: Sitze oder stehe aufrecht mit geradem Rücken und entspannten
  Schultern. Lege deine Fingerspitzen locker auf die jeweilige Schulter.

  Ausführung: Ziehe mit den Ellbogen gleichmäßige, weite Kreise nach vorne, um das
  Schultergelenk und die Schulterblätter mobilisierend zu durchbewegen.

  Hinweis: Führe die Bewegung ruhig und ohne Hast aus. Der Nacken bleibt locker und
  entspannt.'
