name: Pullback am Kabelzug
description: 'Ausgangsposition:

  Stelle die Seilzüge der Kabelstation auf etwa Hüft- bis Brusthöhe ein und befestige passende Griffe. Greife die Griffe, tritt einige Schritte zurück, beuge die Knie leicht und neige den geraden Oberkörper aus der Hüfte nach vorne. Die Arme sind nach vorne gestreckt.


  Ausführung:

  Ziehe die Griffe kontrolliert zum Körper heran und richte gleichzeitig den Oberkörper durch Streckung im unteren Rücken auf. Ziehe die Schulterblätter zusammen und halte die maximale Kontraktion für einen Moment. Kehre langsam und kontrolliert in die vorgebeugte Ausgangsposition zurück.


  Hinweise:

  Halte den Rücken während des gesamten Bewegungsablaufs stabil und führe das Ziehen und Aufrichten fließend und ohne Schwung aus.'
