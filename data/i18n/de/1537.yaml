name: Isometrisches Halten am Klimmzug
description: 'Ausgangsposition:

  Greife eine Klimmzugstange im schulterbreiten Obergriff. Ziehe deinen Körper nach
  oben in die gewünschte Zielposition (z. B. Kinn über der Stange oder im 90-Grad-Winkel
  der Ellbogen).


  Ausführung:

  1. Fixiere deinen Körper in dieser Position völlig regungslos.

  2. Ziehe die Schulterblätter nach hinten-unten und spanne Latissimus, Rhomboiden
  und Bizeps kontinuierlich maximal an.

  3. Halte die Position für die vorgegebene Zeitspanne (z. B. 10–30 Sekunden), bevor
  du dich kontrolliert herablässt.


  Hinweise:

  Hervorragend geeignet zum Überwinden von Kraftplateaus am Klimmzug und zur Steigerung
  der statischen Zug- und Griffkraft.'
