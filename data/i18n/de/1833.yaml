name: Beinbeuger am Boden mit Glidern
description: "Ausgangsposition:\nLege dich rücklings flach auf den Boden. Platziere\
  \ deine Fersen mittig auf Gliding-Discs (oder Handtüchern auf glattem Boden). Die\
  \ Arme liegen seitlich zur Stabilisierung auf dem Boden. Hebe deine Hüfte in eine\
  \ Gesäßbrücke an, sodass Oberschenkel und Oberkörper eine gerade Linie bilden.\n\
  \nAusführung:\n1. Halte das Becken angehoben und lasse deine Fersen langsam und\
  \ kontrolliert nach vorne gleiten, bis deine Beine fast vollständig gestreckt sind.\n\
  2. Halte die Dehnung in den Beinbeugern am weitesten Punkt kurz an, ohne das Gesäß\
  \ auf dem Boden abzulegen.\n3. Ziehe die Fersen durch eine kraftvolle Beugung der\
  \ Knie und Kontraktion der Beinbeuger (Hamstrings) wieder energisch unter den Körper\
  \ in Richtung deines Gesäßes, während du die Hüfte hochdrückst.\n4. Wiederhole die\
  \ Gleitbewegung flüssig.\n\nHinweise:\nEine hervorragende Körpergewichtsübung für\
  \ die Beinbeuger, die sowohl die exzentrische als auch die konzentrische Phase intensiv\
  \ beansprucht."
