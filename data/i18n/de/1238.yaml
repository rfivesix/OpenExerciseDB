exercise_id: '1238'
language: de
status: ai_reviewed
name: Froschstand (Frog Stand)
description: |-
  Ausgangsposition:
  • Gehe in eine tiefe Hocke und setze deine Hände schulterbreit mit weit gespreizten Fingern fest vor dir auf den Boden.
  • Drehe die Ellbogen leicht nach außen und platziere deine Knie an die Außenseite deiner Ellbogen bzw. auf die Rückseite deiner Oberarme (Trizeps).

  Ausführung:
  • Verlagere dein Körpergewicht langsam und kontrolliert nach vorne auf die Hände.
  • Hebe die Füße nacheinander vom Boden ab, bis du frei auf den Händen balancierst.
  • Halte die Arme leicht gebeugt, die Bauchmuskeln fest angespannt und den Blick leicht nach vorne auf den Boden gerichtet.
  • Halte diese isometrische Balanceposition für die gewünschte Dauer (z. B. 10 bis 30 Sekunden) und setze die Füße sanft wieder ab.
