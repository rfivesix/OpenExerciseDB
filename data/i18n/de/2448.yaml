name: Reverse Clamshell (Umgekehrte Muschel)
description: |-
  Ausgangsposition:
  Lege dich in Seitlage auf eine Trainingsmatte. Beuge Hüfte und Knie in einen Winkel von etwa 90 Grad und lagere die Beine übereinander. Stütze deinen Kopf entspannt mit dem unteren Arm ab.

  Ausführung:
  1. Halte die Knie fest aneinander gepresst und hebe nur den oberen Fuß bzw. Knöchel langsam und kontrolliert nach oben zur Decke (Hüftinnenrotation).
  2. Pausiere am obersten Punkt für einen kurzen Moment und spüre die Kontraktion in den tiefen Hüftrotatoren und Gesäßmuskeln.
  3. Senke den Fuß langsam wieder ab, bis er den unteren Fuß leicht berührt.
  4. Absolviere die Wiederholungszahl und wechsle die Seite.

  Hinweise:
  Das Becken bleibt während der gesamten Übung stabil senkrecht zum Boden; kippe mit den Hüftknochen nicht nach vorne oder hinten weg.
