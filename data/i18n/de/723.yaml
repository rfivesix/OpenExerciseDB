name: Latzug mit weitem Griff
description: '- Setze dich an den Latzug und stelle die Oberschenkelpolster so ein,
  dass du festen Halt hast.

  - Greife die Latzugstange im weiten Obergriff (deutlich weiter als schulterbreit).

  - Ziehe die Stange mit aufgerichtetem Brustkorb kontrolliert vor dem Kopf nach unten
  zum oberen Brustbein bzw. Schlüsselbein.

  - Führe dabei die Ellenbogen nach unten und hinten und spanne die Schulterblätter
  zusammen.

  - Führe die Stange langsam wieder nach oben zurück, bis die Arme gestreckt sind.'
