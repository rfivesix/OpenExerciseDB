name: Medizinball-Slams
description: 'Ausgangsposition:

  Stelle dich schulterbreit hin, die Knie und Hüften leicht gebeugt. Halte einen Medizinball
  mit beiden Händen vor der Brust. Spanne deine Rumpfmuskulatur an.


  Ausführung:

  1. Strecke Knie und Hüfte explosiv und hebe den Ball über den Kopf, während du dich
  auf die Zehenspitzen aufrichtest.

  2. Schmettere den Ball mit voller Kraft aus Rumpf, Latissimus und Armen senkrecht
  vor deinen Füßen auf den Boden.

  3. Beuge die Knie und schiebe die Hüfte nach hinten, um die Wurfbewegung dynamisch
  abzufedern.

  4. Gehe in die Hocke, nimm den Ball auf und führe die nächste Wiederholung flüssig
  aus.


  Hinweise:

  Explosive Ganzkörperübung für Schnellkraft, Rumpfstabilität und metabolische Ausdauer.'
