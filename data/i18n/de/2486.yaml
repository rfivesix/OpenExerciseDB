name: Erholungs-Bobbing im Tiefwasser
description: |-
  Ausgangsposition:
  Begib dich in etwas tieferes Wasser, in dem deine Füße den Boden nicht berühren (oder nur ganz leicht tippen). Halte deinen Körper aufrecht und entspannt.

  Ausführung:
  1. Atme an der Oberfläche ruhig und tief durch den Mund ein.
  2. Lasse dich sanft unter Wasser sinken und atme langsam, gleichmäßig und vollständig durch die Nase oder den Mund aus.
  3. Führe eine sanfte Paddelbewegung mit den Händen oder einen leichten Beinschlag aus, um ruhig und ohne Hast wieder an die Oberfläche zu gleiten.
  4. Atme an der Oberfläche entspannt ein und sinke direkt wieder ab.

  Hinweise:
  Nutze diese Übung als aktive Erholungspause zwischen anstrengenden Schwimmabschnitten, um Herzfrequenz und Atmung wieder zu harmonisieren.
