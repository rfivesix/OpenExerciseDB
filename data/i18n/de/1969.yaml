name: Einarmiges Trizepsdrücken am Kabelzug
description: 'Ausgangsposition:

  Stelle dich mit Blick zur Kabelzugstation, die Füße schulterbreit aufgestellt. Befestige einen Einzelgriff (oder greife direkt das Kugelende des Seils) an der oberen Seilrolle. Greife den Griff im Obergriff (Handfläche nach unten), beuge den Ellbogen um ca. 90 Grad und halte ihn eng am Oberkörper fixiert. Spanne den Rumpf an und neige den Oberkörper minimal nach vorne.


  Ausführung:

  Drücke den Griff kraftvoll nach unten, indem du ausschließlich den Ellbogen streckst, bis der Arm vollständig durchgestreckt ist. Halte die Spitzenkontraktion im Trizeps für 1 Sekunde fest. Führe den Griff langsam und kontrolliert wieder nach oben, bis der Unterarm wieder etwa einen 90-Grad-Winkel zum Oberarm bildet.


  Hinweise:

  Der Oberarm und der Ellbogen bleiben während der gesamten Wiederholung wie an der Hüfte festgetackert; vermeide jegliches Vor- und Zurückschwingen des Arms.'
