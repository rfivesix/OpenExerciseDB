name: Liegendes Trizepsstrecken mit Langhantel
description: |-
  Die Ausgangsposition für diese praktische Trizepsübung ist liegend auf einer normalen Bank, mit einer Langhantel in beiden Händen im Obergriff, die Hände schulterbreit auseinander.
  Beginne mit den Armen über deiner oberen Brust und den Ellbogen in einem Winkel von etwa 45 Grad nach hinten gebeugt.
  Beuge zuerst die Ellbogen und lasse dann die Oberarme nach hinten sinken, sodass die Langhantel hinter deinen Kopf und nach unten Richtung Boden geführt wird. Was die Oberarmposition betrifft, sollte sich die Langhantel nie vollständig über deinem Kopf befinden, sondern hinter ihm, um sicherzustellen, dass du den Trizeps optimal triffst.
  Halte die Schulterblätter zusammengezogen, die Ellbogen eng am Kopf und deine Rumpfmuskulatur während der gesamten Bewegung aktiv.
