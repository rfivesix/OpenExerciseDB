name: Kurzhantel-Bodendrücken
description: |-
  Nimm deine Kurzhanteln und lege dich flach auf den Rücken, die Knie angewinkelt und die Füße flach auf dem Boden (benutze eine Bank, falls du eine hast). Drücke die Gewichte nach oben und strecke die Ellbogen durch (A). Senke sie langsam ab, bis deine Oberarme nah am Körper auf dem Boden ruhen (B). Halte hier kurz inne, bevor du sie explosiv wieder nach oben drückst. Spanne die Brust kräftig an und wiederhole.
