name: Kurzhantel-Bodendrücken (Floor Press)
description: |-
  Ausgangsposition:
  Lege dich mit dem Rücken flach auf den Boden und stelle die Beine mit angewinkelten Knien und flach aufgesetzten Füßen auf. Halte zwei Kurzhanteln mit angewinkelten Armen über der Brust. Die Oberarme liegen mit den Ellenbogen in einem ca. 45-Grad-Winkel zum Körper auf dem Boden.

  Ausführung:
  1. Drücke beide Kurzhanteln kraftvoll und kontrolliert nach oben, bis die Arme fast vollständig gestreckt sind.
  2. Spanne die Brustmuskeln am obersten Punkt für eine Sekunde intensiv an.
  3. Senke die Kurzhanteln kontrolliert wieder ab, bis die Rückseite der Oberarme sanft den Boden berührt.
  4. Halte am Boden kurz inne, ohne das Gewicht komplett abzulegen, und starte die nächste Wiederholung.
