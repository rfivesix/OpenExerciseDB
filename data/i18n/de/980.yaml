name: Commando Pull-up
description: 'Ausgangsposition: Stelle dich längs unter die Klimmzugstange. Greife
  die Stange versetzt, sodass eine Hand im Obergriff und die andere im Untergriff
  eng hintereinander greift.

  Ausführung: Ziehe deinen Körper kontrolliert nach oben, ohne den Oberkörper zu verdrehen,
  und führe den Kopf an einer Seite der Stange vorbei, bis die Schulter die Stange
  fast berührt.

  Rückkehr: Senke dich kontrolliert wieder vollständig ab und ziehe dich bei der nächsten
  Wiederholung auf der anderen Seite der Stange hoch.

  Hinweis: Halte die Rumpfmuskulatur fest angespannt, um der Drehung entgegenzuwirken.
  Wechsle nach jedem Satz die Handanordnung.'
