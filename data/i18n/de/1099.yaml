name: Einbeiniges seitliches Halten mit Kettlebell am Band
description: |-
  Ausgangsposition:
  Schlinge ein elastisches Widerstandsband um den Griff einer Kettlebell und greife das Band mit einer Hand. Stehe aufrecht, sodass die Kettlebell frei an der Bandaufhängung seitlich neben dem Körper hängt.

  Ausführung:
  1. Hebe einen Fuß vom Boden ab und balanciere stabil auf einem Bein.
  2. Halte den Oberkörper kerzengerade und spanne die seitlichen Bauchmuskeln (Obliquen) sowie das Gesäß intensiv an, um den Schwingungen der Kettlebell entgegenzuwirken.
  3. Halte die Position für die vorgegebene Zeit oder wechsle während des Haltens kontrolliert das Standbein.
  4. Wechsle anschließend die Hand und trainiere die Gegenseite.
