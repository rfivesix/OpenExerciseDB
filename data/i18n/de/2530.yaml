description: |-
  Russische Liegestütze
  Beginne in einer normalen Liegestützposition, die Hände etwas weiter als schulterbreit auseinander. Senke die Brust zum Boden ab und verlagere dann den Körper nach vorn, während die Brust nah am Boden bleibt. Strecke die Arme, um in die Ausgangsposition zurückzukehren, und kehre die Bewegung dann fließend um. Halte den Rumpf angespannt und führe die Bewegung während der gesamten Übung kontrolliert aus.
