name: Russische Liegestütze (Russian Push-Ups)
description: |-
  Ausgangsposition:
  Gehe in eine klassische Liegestützposition auf einer rutschfesten Matte. Die Hände stehen etwas weiter als schulterbreit, der gesamte Körper ist von Kopf bis Fuß angespannt.

  Ausführung:
  1. Senke deinen Oberkörper wie bei einem normalen Liegestütz ab, bis die Brust kurz vor dem Boden ist.
  2. Verlagere dein Körpergewicht im tiefsten Punkt nach hinten, indem du die Unterarme und Ellbogen kontrolliert flach auf dem Boden ablegst.
  3. Schiebe deinen Körper wieder nach vorne auf deine Handflächen, sodass die Ellbogen sich vom Boden lösen.
  4. Drücke dich kraftvoll aus der Brust und dem Trizeps zurück nach oben in die Ausgangsposition.

  Hinweise:
  Halte die Bauch- und Gesäßmuskulatur während der gesamten horizontalen Verlagerung unter maximaler Spannung. Dies ist eine anspruchsvolle Calisthenics-Übung für Trizeps und Schultern.
