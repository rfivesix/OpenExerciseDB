name: Liegende Kurzhantel-Curls
description: 'Ausgangsposition:

  Nimm in jede Hand eine Kurzhantel und lege dich rücklings flach auf eine Hantelbank.
  Lasse die Arme seitlich senkrecht nach unten in Richtung Boden hängen.


  Ausführung:

  1. Halte die Ellbogen fixiert und curle die Kurzhanteln durch Beugung im Ellbogengelenk
  kontrolliert nach oben.

  2. Spanne die Bizepsmuskeln am obersten Punkt maximal an, wenn die Unterarme senkrecht
  stehen.

  3. Senke die Kurzhanteln langsam über 2–3 Sekunden wieder ab, bis die Arme wieder
  fast vollständig hängen.


  Hinweise:

  Durch die liegende Position wird Schwungnehmen komplett verhindert und der lange
  Kopf des Bizeps erfährt in der Ausgangslage eine außergewöhnlich starke Dehnung.'
