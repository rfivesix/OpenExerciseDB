name: Liegende Kurzhantel-Curls
description: |-
  Nimm eine Kurzhantel in jede Hand und lege dich rücklings auf eine Bank, ähnlich wie beim klassischen Bankdrücken. Lass deine Arme seitlich nach unten hängen, sodass die Kurzhanteln möglicherweise den Boden berühren. Beginne nun, die Kurzhanteln nach oben zu heben, bis deine Unterarme senkrecht zur Decke stehen. Senke die Kurzhanteln langsam ab, bis sie fast wieder den Boden berühren. Halte deine Ellenbogen an Ort und Stelle, um Schummeln zu minimieren.
