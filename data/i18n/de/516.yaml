name: Rückenstrecker im Stehen
search_terms:
- Rückenstrecken im Stehen
description: |-
  Ausgangsposition: Stehe aufrecht mit hüftbreitem Stand. Halte die Arme gestreckt über den Kopf (optional mit einem Handtuch oder leichten Ball zwischen den Händen auf Zug).
  Ausführung: Ziehe die Arme nach oben-hinten und hebe gleichzeitig abwechselnd ein Bein nach hinten an, um die Rückenstrecker und das Gesäß anzuspannen. Der Oberkörper streckt sich aktiv in die Länge.
  Rückkehr: Senke das Bein kontrolliert wieder ab und wiederhole die Bewegung mit dem anderen Bein.
  Hinweis: Die Bewegung kräftigt die aufrichtende Muskulatur der Wirbelsäule und schult die Rumpfstabilität im Stand.
