name: Seitlicher Ausfallschritt (links)
description: 'Ausgangsposition: Stehe in einer weiten Grätschstellung mit geradem
  Oberkörper, die Fußspitzen zeigen leicht nach außen.

  Ausführung: Verlagere dein Gewicht nach links, beuge das linke Knie und schiebe
  die Hüfte nach hinten-unten. Das rechte Bein bleibt gestreckt und der rechte Fuß
  behält Bodenkontakt.

  Rückkehr: Drücke dich über die linke Ferse kraftvoll zurück in die Ausgangsstellung.

  Hinweis: Halte die Brust aufgerichtet und achte darauf, dass das linke Knie in Richtung
  der Zehenspitzen zeigt.'
