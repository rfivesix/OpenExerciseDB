name: Kurzhantel-Thruster
description: |-
  Ausgangsposition:
  Aufrecht stehen, die Füße etwa schulterbreit auseinander. Die Kurzhanteln auf Schulterhöhe halten, die Ellbogen leicht nach vorne gerichtet.
  
  Ausführung:
  1. In eine kontrollierte Kniebeuge absenken, bis die Oberschenkel mindestens parallel zum Boden sind.
  2. Kraftvoll aus den Beinen nach oben drücken und den Bewegungsschwung nutzen, um die Kurzhanteln in einer fließenden Bewegung über den Kopf zu drücken.
  3. Die Kurzhanteln kontrolliert wieder auf Schulterhöhe absenken und direkt in die nächste Kniebeuge übergehen.
  
  Hinweise:
  Kniebeuge und Überkopfdrücken gehen nahtlos ineinander über. Den Rumpf während der gesamten Bewegung fest anspannen.
