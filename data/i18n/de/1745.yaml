name: Frontheben am Kabelzug mit kurzer Stange
description: "Ausgangsposition:\nBefestige eine kurze gerade Stange an der untersten\
  \ Position eines Kabelzugs. Stelle dich mit dem Rücken zur Maschine über das Kabel,\
  \ sodass das Kabel zwischen deinen Beinen hindurchläuft. Greife die Stange im Obergriff\
  \ (Handflächen nach unten) etwa schulterbreit vor deinen Oberschenkeln. Stehe aufrecht,\
  \ Knie leicht gebeugt, Schultern nach hinten-unten fixiert.\n\nAusführung:\n1. Hebe\
  \ die Stange mit fast gestreckten Armen (minimale Ellenbogenbeugung) in einem weiten\
  \ Bogen kontrolliert nach vorne oben bis auf Schulterhöhe an.\n2. Halte die Kontraktion\
  \ am obersten Punkt für 1 Sekunde und spüre die Spannung im vorderen Deltamuskel.\n\
  3. Senke die Stange langsam und kontrolliert wieder vor die Oberschenkel ab, ohne\
  \ das Gewicht ganz abzusetzen.\n\nHinweise:\nVermeide Schwungholen aus dem Rumpf\
  \ oder ein Überstrecken des unteren Rückens."
