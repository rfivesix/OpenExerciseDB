name: Latzug im Untergriff (Reverse Grip Lat Pulldown)
description: 'Ausgangsposition:

  Setze dich an die Latzugstation und stelle das Oberschenkelpolster so ein, dass deine Beine fest fixiert sind. Greife die Latzugstange im schulterbreiten Untergriff (Handflächen zeigen zu dir). Richte die Brust auf und bilde ein leichtes Hohlkreuz im oberen Rücken.


  Ausführung:

  Ziehe die Stange kontrolliert nach unten in Richtung des oberen Brustbeins, indem du die Ellbogen nach unten und leicht nach hinten führst. Ziehe die Schulterblätter zusammen und halte die maximale Kontraktion im unteren Latissimus und Bizeps für einen Moment. Führe die Stange langsam und kontrolliert nach oben zurück, bis Arme und Latissimus vollständig gestreckt sind.


  Hinweise:

  Vermeide starkes Zurücklehnen des Oberkörpers; halte den Oberkörper stabil, um die Last gezielt auf dem Latissimus zu halten.'
