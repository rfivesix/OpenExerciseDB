name: Latzug mit Untergriff
description: |-
  Der Latzug mit Untergriff (am häufigsten als Reverse-Grip-Latzug bekannt) ist eine Variante der Standardübung, die einen supinierten Untergriff mit schulterbreiter Handhaltung verwendet. Diese Position verlagert mehr Betonung auf den unteren Latissimus und steigert die Beteiligung des Bizeps, was oft einen größeren Bewegungsumfang und ein tieferes Zusammenziehen am unteren Punkt der Bewegung ermöglicht.
