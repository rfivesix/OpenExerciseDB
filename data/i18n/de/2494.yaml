name: Endgradige Kniestreckung mit Band (TKE)
description: |-
  Ausgangsposition:
  Befestige ein elastisches Widerstandsband an einem festen Pfosten auf Kniehöhe. Stelle dich frontal zum Ankerpunkt und lege die Schlaufe um die Kniekehle eines Beins. Gehe in eine leichte Schrittstellung, wobei das trainierte Bein vorne steht und das Knie leicht gebeugt ist.

  Ausführung:
  1. Drücke die Ferse fest in den Boden und strecke das Knie gegen den Zug des Bandes kraftvoll nach hinten durch.
  2. Spanne den Quadrizeps (insbesondere den Vastus medialis) am Punkt der vollständigen Streckung für 2 bis 3 Sekunden maximal an.
  3. Beuge das Knie langsam und kontrolliert wieder gegen den Bandwiderstand leicht nach vorne.
  4. Wiederhole die Bewegung für die gewünschte Wiederholungszahl und wechsle das Bein.

  Hinweise:
  Halte den Oberkörper aufrecht; die Bewegung findet isoliert im Kniegelenk statt. Ideal zur Rehabilitation und Stabilisierung des Knies.
