name: Stützhalt an den Turnringen
description: "Ausgangsposition:\nStelle dich zwischen zwei frei hängende Turnringe.\
  \ Greife die Ringe im festen neutralen Griff. Springe oder drücke dich nach oben\
  \ in den Stütz mit vollkommen gestreckten Armen.\n\nAusführung:\n1. Drehe die Ringe\
  \ aktiv leicht nach außen (Rings Turned Out / RTO), sodass die Daumen nach außen\
  \ zeigen und die Unterarme die Ringgurte nicht berühren.\n2. Drücke die Schultern\
  \ kraftvoll nach unten (Depression der Schulterblätter) und fixiere die Ellenbogen\
  \ in voller Streckung.\n3. Nimm eine Hollow-Body-Position ein: Spanne Bauch und\
  \ Gesäß maximal an, halte die Beine geschlossen und die Zehen gestreckt.\n4. Halte\
  \ diese Position ruhig und stabil für die angegebene Zeitdauer.\n\nHinweise:\nEine\
  \ fundamentale gymnastische Kraft- und Stabilisationsübung. Die frei schwingenden\
  \ Ringe verlangen maximale Gelenkstabilität in Schultern, Brust und Trizeps."
