name: Brustdrücken am Kabelzug auf der Schrägbank
description: |-
  Einarmiges Brustdrücken am Kabelzug. Nutze den anderen Arm, um den Körper abzustützen, damit du dich auf die Kraft beim Drücken konzentrieren kannst und nicht auf das Ausbalancieren des Körpers. Beginne mit der Hand so nah wie möglich an der Brust und drücke dann gegen das Kabel in einem leichten Schrägwinkel, wobei du zur Mitte deiner Brust hin zielst.
