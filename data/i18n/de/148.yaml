name: Wadenheben an der Hackenschmidt-Maschine
description: |-
  Positioniere dich in der Hackenschmidt-Maschine mit dem Rücken fest an der Rückenlehne und platziere die Fußballen etwa schulterbreit auf dem Rand der Plattform, sodass deine Fersen frei beweglich sind.
  Drücke dich mit fast gestreckten Knien über die Fußballen so weit wie möglich nach oben. Senke die Fersen langsam wieder kontrolliert ab, bis die Wadenmuskeln voll gedehnt sind, und wiederhole die Bewegung.
