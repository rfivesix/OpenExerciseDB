name: Kurzhantel-Kreuzheben
description: |-
  Ausgangsposition:
  Stelle dich hüftbreit hin und halte in jeder Hand eine Kurzhantel vor deinen Oberschenkeln im Obergriff (oder seitlich im neutralen Griff). Die Knie sind leicht gebeugt, die Schultern nach hinten-unten gezogen und die Brust aufgerichtet.

  Ausführung:
  Schiebe das Gesäß nach hinten und beuge den Oberkörper mit geradem Rücken nach vorne ab. Führe die Kurzhanteln eng an den Beinen entlang bis etwa auf Schienbeinhöhe abwärts. Wenn du eine deutliche Dehnung in Gesäß und Beinbeugern spürst, richte dich durch kraftvolles Vorschieben der Hüfte wieder auf.

  Hinweise:
  Halte den Rücken während der gesamten Bewegung absolut gerade. Die Bewegung erfolgt primär aus der Hüfte (Hip Hinge), nicht aus den Knien.
