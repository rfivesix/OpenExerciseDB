name: Ausfallschritt nach hinten mit Langhantel
description: "Ausgangsposition:\nNimm eine Langhantel im oberen Rückenbereich auf\
  \ (High-Bar). Stehe aufrecht mit hüftbreitem Stand, Brust angehoben und Rumpf fest\
  \ angespannt.\n\nAusführung:\n1. Mache mit einem Bein einen weiten, kontrollierten\
  \ Schritt nach hinten und senke dein Becken senkrecht ab.\n2. Beuge beide Knie,\
  \ bis der vordere Oberschenkel parallel zum Boden ist und das hintere Knie kurz\
  \ über dem Boden schwebt (beide Knie etwa im 90-Grad-Winkel).\n3. Drücke dich kraftvoll\
  \ über die Ferse des VORDEREN Fußes ab, um in den aufrechten Stand zurückzukehren.\n\
  4. Wiederhole die Bewegung mit dem anderen Bein im Wechsel oder absolviere zunächst\
  \ alle Wiederholungen auf einer Seite.\n\nHinweise:\nDer Ausfallschritt nach hinten\
  \ (Reverse Lunge) ist knieschonender als der Ausfallschritt nach vorne und fordert\
  \ Gesäß und Oberschenkel intensiv."
