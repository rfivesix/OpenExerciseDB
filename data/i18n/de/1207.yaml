name: Skorpion-Kick
description: |-
  Ausgangsposition:
  • Gehe in die Liegestützposition (hohe Plank) mit den Händen direkt unter den Schultern und den Füßen etwa hüftbreit.
  • Bilde eine gerade, feste Linie vom Kopf bis zu den Fersen und spanne den Bauch an.

  Ausführung:
  • Ziehe das rechte Knie kurz nach vorne Richtung Brust, hebe dann das angewinkelte rechte Bein nach hinten-oben.
  • Rotiere die Hüfte und führe den rechten Fuß in einem weiten Bogen über das linke Standbein nach links-hinten in Richtung Boden.
  • Halte den Oberkörper und die Schultern dabei möglichst stabil und parallel zum Boden.
  • Kehre kontrolliert in die Ausgangsposition zurück und wiederhole die Bewegung mit dem anderen Bein.
