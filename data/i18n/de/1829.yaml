name: Landmine Kniebeuge mit Überkopfdrücken
description: "Ausgangsposition:\nVerankere ein Ende einer Langhantel in einer Landmine-Hülse.\
  \ Stelle dich mit dem Gesicht zur Hantel schulterbreit bis etwas weiter auf, die\
  \ Fußspitzen leicht nach außen gedreht. Umfasse das freie Hantelende mit beiden\
  \ Händen verschränkt vor deiner oberen Brust, knapp unterhalb der Schlüsselbeine.\
  \ Die Ellenbogen zeigen nach unten.\n\nAusführung:\n1. Spanne den Rumpf fest an\
  \ und gehe in eine tiefe Kniebeuge (Squat), bis deine Oberschenkel mindestens parallel\
  \ zum Boden sind.\n2. Drücke dich kraftvoll und explosiv über die Fersen und die\
  \ gesamte Fußfläche nach oben.\n3. Nutze den Schwung aus den Beinen, um die Hantel\
  \ in einer flüssigen Bewegung mit beiden Armen schräg nach vorne oben über den Kopf\
  \ zu drücken (Press).\n4. Lehne dich am obersten Punkt leicht in die Hantel hinein,\
  \ um die Schulterblattrotation zu unterstützen.\n5. Senke die Hantel kontrolliert\
  \ wieder vor die Brust ab und leite direkt die nächste Kniebeuge ein.\n\nHinweise:\n\
  Eine hocheffektive Ganzkörper-Verbundübung, die Kraft und Power von Unter- und Oberkörper\
  \ synchronisiert."
