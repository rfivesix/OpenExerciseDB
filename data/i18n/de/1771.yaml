name: Handgelenk-Curl am Kabelzug
description: "Ausgangsposition:\nBefestige eine gerade Stange an der untersten Position\
  \ eines Kabelzugs. Knie dich vor den Kabelturm oder setze dich auf eine Hantelbank\
  \ und lege deine Unterarme stabil auf deinen Oberschenkeln (oder auf dem Bankpolster)\
  \ ab, sodass die Handgelenke frei über die Knie ragen. Greife die Stange im Untergriff\
  \ (Supination, Handflächen nach oben).\n\nAusführung:\n1. Öffne die Finger leicht\
  \ und lasse die Hantelstange kontrolliert bis in die Fingerspitzen nach unten rollen,\
  \ sodass eine Dehnung in den Unterarmbeugern spürbar wird.\n2. Rolle die Stange\
  \ über die Finger wieder in die Handfläche und beuge deine Handgelenke kraftvoll\
  \ so weit wie möglich nach oben.\n3. Halte die Spitzenkontraktion für eine Sekunde\
  \ und senke die Handgelenke anschließend langsam und kontrolliert wieder ab.\n\n\
  Hinweise:\nHalte die Unterarme fest auf der Unterlage fixiert, damit die Arbeit\
  \ isoliert aus den Handgelenksbeugern erfolgt."
