name: Limber-11-Mobilitätsroutine
description: 'Die Limber-11-Routine nach Coach Joe DeFranco ist ein hocheffektives Aufwärm- und Mobilitätsprogramm für den Unterkörper und die Hüfte. Sie kombiniert myofasziale Selbstmassage (SMR) mit dynamischen und statischen Dehnübungen:


  1. Faszienrolle IT-Band (10–15 Durchgänge pro Seite)

  2. Faszienrolle Adduktoren (10–15 Durchgänge pro Seite)

  3. Faszienmassage Gesäß mit Lacrosseball (30 Sek.–2 Min. pro Seite)

  4. Eisernes Kreuz mit angewinkelten Beinen (5–10 Wdh. pro Seite)

  5. Rollen in den V-Sitz (10 Wiederholungen)

  6. Wippende Frosch-Dehnung (10 Wiederholungen)

  7. Hydrantenkreisen (10 vorwärts / 10 rückwärts pro Seite)

  8. Mountain Climbers (10 Wiederholungen pro Bein)

  9. Kosaken-Kniebeuge (5–10 Wiederholungen pro Seite)

  10. Sitzende Piriformis-Dehnung (20–30 Sek. pro Seite)

  11. Hüftbeuger-Dehnung mit erhöhtem hinteren Fuß (5–10 Wdh. inkl. 3s Halten pro Seite)'
