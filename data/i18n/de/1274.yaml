name: Wadendehnung sitzend
description: 'Ausgangsposition:

  Setze dich mit aufrechtem Oberkörper auf den Boden oder eine Matte und strecke ein Bein gerade nach vorne aus. Das andere
  Bein kann angewinkelt bleiben.


  Ausführung:

  1. Ziehe die Fußspitze des ausgestreckten Beins aktiv in Richtung Schienbein heran (Dorsalflexion).

  2. Greife bei Bedarf mit der Hand oder einem Handtuch um den Fußballen, um die Dehnung in der Wade und der Achillessehne
  sanft zu verstärken.

  3. Halte die Dehnposition ruhig für 20 bis 30 Sekunden und atme gleichmäßig.

  4. Löse die Dehnung langsam und wechsle die Seite.


  Hinweise:

  Hervorragend geeignet für die Rehabilitation und die Beweglichkeit des Sprunggelenks.'
