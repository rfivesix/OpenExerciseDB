name: Einarmiges Trizepsdrücken am Kabelzug
description: '- Stelle dich seitlich oder frontal vor den hohen Kabelzug und greife
  den Einzelgriff oder das Seilende mit einer Hand.

  - Halte den Oberarm eng am Körper fixiert und beginne mit im 90-Grad-Winkel gebeugtem
  Ellenbogen.

  - Drücke den Griff durch Streckung des Ellenbogens nach unten, bis der Trizeps maximal
  kontrahiert ist.

  - Führe den Arm langsam und kontrolliert wieder nach oben, ohne den Oberarm oder
  die Schulter mitzubewegen.'
