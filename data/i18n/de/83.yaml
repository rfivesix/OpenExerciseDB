name: Vorgebeugtes Langhantelrudern
description: |-
  Greife die Langhantel mit breitem (etwas mehr als schulterbreitem) Griff und beuge dich nach vorne. Dabei ist der Oberkörper nicht ganz waagerecht, sondern ein bisschen steiler, der Kopf schaut nach vorn und die Brust ist herausgestreckt.
  Ziehe nun das Gewicht in Richtung Bauchnabel. Schwinge während der Bewegung den Oberkörper nicht und halte die Arme dicht am Körper, wenn du sie hochziehst. Bringe die Langhantel langsam wieder nach unten.
