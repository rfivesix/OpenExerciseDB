description: "Ausgangsposition: Begib dich in den Vierfüßlerstand und spreize die\
  \ Knie weit nach außen. Die Unterschenkel zeigen nach hinten und die Fußinnenseiten\
  \ liegen flach auf der Matte. Stütze dich auf die Unterarme ab.\nAusführung: Schiebe\
  \ dein Gesäß mit geradem Rücken langsam nach hinten in Richtung Fersen, bis eine\
  \ intensive Dehnung in den Hüftadduktoren entsteht.\nHinweise: Wippe sanft und kontrolliert\
  \ vor und zurück oder halte die tiefste Dehnung für 20–30 Sekunden. Atme gleichmäßig\
  \ weiter."
