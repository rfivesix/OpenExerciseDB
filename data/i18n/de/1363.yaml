name: Faszienrolle (Blackroll)
description: |-
  Ausgangsposition:
  Platziere die Faszienrolle (Blackroll / Foam Roller) auf einer Matte und lege die zu behandelnde Muskelgruppe (z. B. Oberschenkel, Gesäß, Waden oder oberer Rücken) darauf ab. Stütze dich mit den Armen und dem freien Bein ab, um den Druck zu regulieren.

  Ausführung:
  Rolle langsam und kontrolliert mit gleichmäßigem Druck über den Muskelstrang vor und zurück. Verweile auf besonders verspannten Triggerpunkten für 20 bis 30 Sekunden und atme ruhig weiter, bis das Gewebe spürbar nachgibt.

  Hinweise:
  Rolle nicht direkt über Gelenke oder die freie Lendenwirbelsäule. Halte die Rumpfmuskulatur leicht angespannt.
