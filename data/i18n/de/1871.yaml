exercise_id: '1871'
language: de
status: ai_reviewed
name: Knie-zur-Brust-Dehnung in Rückenlage
description: "Ausgangsposition: Lege dich flach auf den Rücken auf eine Matte, die\
  \ Beine sind lang ausgestreckt.\nAusführung: Ziehe ein Knie mit beiden Händen heran\
  \ und umfasse das Schienbein oder die Kniekehle. Ziehe das Knie sanft in Richtung\
  \ Brustkorb, während das andere Bein lang am Boden liegen bleibt.\nHinweise: Halte\
  \ die Schultern und den Kopf entspannt am Boden. Atme tief aus, halte die Dehnung\
  \ für 20–30 Sekunden und wechsle die Seite."
