name: Umsetzen und Stoßen (Clean and Jerk)
description: |-
  Ausgangsposition:
  • Tritt mit hüftbreitem Stand an die Langhantel heran, greife die Stange etwas breiter als schulterbreit im Haken-Obergriff (Hook-Grip).
  • Der Rücken ist gestreckt, die Schultern befinden sich leicht vor der Stange.

  Ausführung:
  1. Umsetzen (Clean): Ziehe die Hantel kontrolliert vom Boden nach oben, strecke in Hüfthöhe explosiv Knie und Hüfte (Triple Extension) und tauche blitzschnell unter die Stange ab. Fange die Hantel in der tiefen Kniebeuge auf den Schultern (Front Rack) auf und richte dich auf.
  2. Stoßen (Jerk): Führe aus dem aufrechten Stand einen kurzen vertikalen Dip aus, stoße die Stange mit Beinkraft nach oben und springe in den Ausfallschritt (Split), um die Hantel mit durchgestreckten Armen über dem Kopf zu fixieren.
  3. Stabilisierung: Bringe beide Füße parallel nebeneinander, bevor die Hantel kontrolliert abgelassen wird.
