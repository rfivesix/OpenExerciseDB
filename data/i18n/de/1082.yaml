exercise_id: '1082'
language: de
status: ai_reviewed
name: Vorgebeugtes Rudern mit Außenrotation
description: |-
  Ausgangsposition:
  Stelle dich hüftbreit hin und beuge den Oberkörper mit geradem Rücken in der Hüfte nach vorne (ca. 45–60 Grad Neigung). Die Arme hängen senkrecht nach unten, die Daumen zeigen zueinander.

  Ausführung:
  1. Ziehe beide Ellenbogen kontrolliert auf Schulterhöhe nach oben, sodass die Oberarme senkrecht zum Torso stehen und die Unterarme im 90-Grad-Winkel nach unten zeigen.
  2. Halte die Ellenbogen stabil auf Schulterhöhe und rotiere nun die Unterarme um die Ellenbogenachse nach oben, bis die Hände auf Kopfhöhe sind (externe Schulterrotation).
  3. Halte kurz die Spannung in der Rotatorenmanschette und den Schulterblättern.
  4. Rotiere die Unterarme kontrolliert wieder nach unten und senke die Arme in die Ausgangsposition ab.
