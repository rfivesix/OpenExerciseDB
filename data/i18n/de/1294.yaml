name: Einbeiniges Beinbeugen
description: 'Ausgangsposition:

  Lege dich rücklings auf eine Matte. Ein Bein ist angewinkelt und steht mit der Ferse auf dem Boden (oder auf einem Gleiter/Handtuch),
  das andere Bein ist leicht angehoben.


  Ausführung:

  1. Hebe das Becken an, sodass Oberschenkel und Oberkörper eine gerade Linie bilden.

  2. Ziehe die Ferse über die Beugung des Knies kraftvoll heran, um die ischiocrurale Muskulatur (Beinbeuger) maximal anzuspannen.

  3. Führe das Bein bzw. die Ferse kontrolliert wieder nach vorne in die Ausgangsposition zurück.


  Hinweise:

  Isolierte Eigengewichtsübung zur unilateralen Kräftigung der hinteren Oberschenkelmuskulatur (Bizeps femoris, Semimembranosus,
  Semitendinosus).'
