name: Ellbogenhebel (Elbow Lever)
description: |-
  Ausgangsposition:
  Knie dich auf den Boden und setze die Hände mit nach hinten oder zur Seite gedrehten Fingern schulterbreit auf die Matte. Lehne deinen Oberkörper nach vorne und platziere beide Ellbogen fest an den Seiten deines Bauches oder an den vorderen Beckenknochen (Darmbeinkämmen).

  Ausführung:
  1. Lehne deinen Schwerpunkt langsam weiter nach vorne über die Hände, bis der Kopf sich leicht absenkt und die Beine vom Boden abheben.
  2. Spanne Rückenstrecker, Gesäß und Rumpf maximal an, um den gesamten Körper waagerecht und parallel zum Boden in einer geraden Linie zu halten.
  3. Balanciere das Körpergewicht ausschließlich auf deinen Händen und den in den Bauch gestützten Ellbogen aus.
  4. Halte diese statische Calisthenics-Position für die vorgegebene Dauer und setze die Füße sanft wieder ab.

  Hinweise:
  Die Position erfordert Handgelenkbeweglichkeit und Balance; je weiter die Ellbogen in Richtung Beckenknochen wandern, desto günstiger ist die Hebelwirkung.
