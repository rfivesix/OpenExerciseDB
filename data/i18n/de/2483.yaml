name: Rumpfdrehung am Beckenrand
description: |-
  Halte die Beckenwand oder den Beckenrand mit einer Hand, den Körper waagerecht an der Oberfläche, während die Beine sanft hinter dir schlagen. Halte das Gesicht im Wasser und atme kontinuierlich aus. Drehe dann den Kopf zur Seite — hebe ihn nicht an — sodass eine Schwimmbrille im Wasser bleibt, während die andere die Oberfläche verlässt. Atme kurz ein und drehe das Gesicht dann wieder nach unten in die neutrale Position. Dies isoliert die Kopfdrehung, ohne dass du an Armzüge denken musst.
