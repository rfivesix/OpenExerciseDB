name: Kopfdrehung am Beckenrand (Atemübung)
description: |-
  Ausgangsposition:
  Halte dich mit einer Hand am Beckenrand fest. Nimm eine waagerechte Wasserlage an der Oberfläche ein, der freie Arm liegt locker am Körper oder wird gestreckt. Schlage mit den Beinen locker, um den Körper oben zu halten.

  Ausführung:
  1. Lege das Gesicht ins Wasser mit Blick zum Beckenboden und atme ruhig unter Wasser aus.
  2. Drehe den Kopf zur Seite – ohne ihn nach oben aus dem Wasser zu heben –, sodass eine Brillenhälfte im Wasser bleibt, während die andere die Oberfläche durchbricht.
  3. Atme rasch durch den Mund ein und drehe das Gesicht sofort wieder kontrolliert nach unten ins Wasser.
  4. Wiederhole die rhythmische Drehung und wechsle nach einigen Wiederholungen die Seite.

  Hinweise:
  Halte den Kopf flach; das Ohr ruht wie auf einem Kissen auf dem Wasser. Diese Übung isoliert die seitliche Atemrotation beim Kraulschwimmen.
