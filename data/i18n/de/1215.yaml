exercise_id: '1215'
language: de
status: ai_reviewed
name: Reverse Snow Angel
description: |-
  Ausgangsposition:
  • Lege dich flach auf den Bauch auf eine Trainingsmatte mit nach vorne ausgestreckten Armen und neutraler Wirbelsäule.
  • Die Beine liegen gestreckt auf dem Boden, der Blick ist nach unten gerichtet.

  Ausführung:
  • Hebe beide Arme und den oberen Brustkorb leicht vom Boden ab.
  • Führe die gestreckten Arme in einem weiten, langsamen Bogen seitlich nach hinten bis zu den Oberschenkeln (wie ein Schneeengel auf dem Bauch).
  • Ziehe am Endpunkt die Schulterblätter fest zusammen und spanne den oberen Rücken maximal an.
  • Führe die Arme in derselben Bogenbewegung kontrolliert wieder über den Kopf nach vorne.
