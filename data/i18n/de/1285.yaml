description: 'Ausgangsposition:

  Stelle dich aufrecht mit hüftbreit geöffneten Füßen hin und spanne die Rumpfmuskulatur leicht an.


  Ausführung:

  1. Laufe auf der Stelle oder in Vorwärtsbewegung in einem lockeren, dynamischen Rhythmus.

  2. Führe bei jedem Schritt die Fersen abwechselnd und schwungvoll nach hinten-oben in Richtung Gesäß.

  3. Halte die Oberschenkel weitgehend senkrecht und nimm die Arme synchron zur Laufbewegung mit.


  Hinweise:

  Hervorragend geeignet als dynamisches Aufwärmen zur Aktivierung der hinteren Oberschenkelmuskulatur (Ischiocrurale) und
  der Waden.'
