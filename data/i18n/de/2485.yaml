name: Armzug-Roll-Übung (Kraul-Rücken-Wechsel)
description: |-
  Ausgangsposition:
  Stoße dich in Bauchlage von der Beckenwand ab und beginne mit einem normalen Kraulzug.

  Ausführung:
  1. Schwimme zwei bis drei Kraulzüge mit gleichmäßigem Beinschlag.
  2. Statt einer gewöhnlichen seitlichen Kopfdrehung zur Atmung rollst du deinen gesamten Körper als feste Einheit auf den Rücken.
  3. Nimm auf dem Rücken liegend 2 bis 3 ruhige Atemzüge, während du mit den Beinen weiterschlägst.
  4. Rolle den Körper kontrolliert wieder auf den Bauch zurück und setze den Kraulzug nahtlos fort.

  Hinweise:
  Die Übung schult die ganzheitliche Körperrotation um die Längsachse (Body Roll) und baut Atemhektik beim Kraulschwimmen ab.
