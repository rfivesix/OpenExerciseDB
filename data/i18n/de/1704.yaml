name: Tuck-L-Sit
description: |-
  Der Tuck L-Sit ist ein Halt mit dem eigenen Körpergewicht, bei dem du dich auf Barren, Parallettes oder dem Boden mit gestreckten Armen abstützt, während du deine Knie zur Brust ziehst. Deine Hüfte bleibt angehoben, deine Wirbelsäule bleibt aufrecht, und deine Füße schweben über dem Boden. Ziel ist es, deine Rumpfmuskulatur angespannt, deine Schultern nach unten gedrückt und deine Arme durchgestreckt zu halten, während du die angezogene Position beibehältst. Es ist ein rumpfintensiver, schulterstabilisierender statischer Halt, der oft als Vorstufe zum vollständigen L-Sit genutzt wird.
