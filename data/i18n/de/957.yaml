name: Arm- und Beinheben im Vierfüßlerstand (Bird Dog)
description: 'Ausgangsposition: Begib dich in den Vierfüßlerstand auf einer Matte.
  Platziere die Hände senkrecht unter den Schultern und die Knie senkrecht unter den
  Hüften. Der Kopf bildet die Verlängerung der Wirbelsäule.

  Ausführung: Hebe gleichzeitig den rechten Arm nach vorne und das linke Bein nach
  hinten an, bis beide mit dem Rumpf eine gerade Linie parallel zum Boden bilden.
  Spanne Bauch und Gesäß fest an.

  Rückkehr: Halte die gestreckte Position für 1–2 Sekunden und senke Hand und Knie
  langsam wieder ab. Führe die Bewegung anschließend mit der Gegenseite aus.

  Hinweis: Halte das Becken stabil und waagerecht; vermeide ein Durchhängen ins Hohlkreuz
  oder Aufdrehen der Hüfte.'
