name: Deadhang (Aushängen)
description: |-
  Ausgangsposition:
  Greife eine Klimmzugstange oder Hangboard-Kante im etwa schulterbreiten Obergriff. Löse die Füße vom Boden und lasse den Körper frei hängen.

  Bewegung:
  1. Halte die Hängeposition mit festem Griff.
  2. Der Deadhang kann passiv (vollständig entspannte Schultern zur Dekompression der Wirbelsäule) oder aktiv (Schulterblätter leicht nach hinten und unten gezogen zur Aktivierung der Rumpf- und Schultermuskulatur) ausgeführt werden.
  3. Halte die Position für die vorgegebene Zeitdauer.

  Hinweise:
  Atme ruhig und gleichmäßig. Vermeide Pendelbewegungen des Körpers. Die Übung stärkt intensiv die Griffkraft und Unterarmmuskulatur.
