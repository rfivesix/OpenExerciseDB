name: Enges Schrägbankdrücken mit Langhantel
description: |-
  Ausgangsposition:
  Lege dich auf eine Schrägbank (ca. 30° bis 45° Neigung). Greife die Langhantel im Obergriff mit einem engen Handabstand (etwa schulterbreit oder minimal enger). Hebe die Hantel aus der Ablage und halte sie mit gestreckten Armen über der oberen Brust.

  Ausführung:
  1. Senke die Langhantel langsam und kontrolliert zur oberen Brust oder zum Brustbein ab, wobei die Ellenbogen nah am Körper geführt werden (ca. 30–45 Grad zum Rumpf).
  2. Drücke die Hantel kraftvoll durch Streckung der Ellenbogen wieder nach oben, wobei Trizeps und obere Brustmuskulatur arbeiten.
  3. Am obersten Punkt kurz pausieren, ohne die Ellenbogen ruckartig durchzuschlagen.

  Hinweise:
  Greife nicht zu eng (nicht unter Schulterbreite), um die Handgelenke nicht unnötig zu belasten. Die enge Ellenbogenführung verlagert den Schwerpunkt stark auf den Trizeps.
