name: Stehende Bizepsdehnung rechts
description: |-
  Ausgangsposition:
  • Stelle dich seitlich mit der rechten Körperseite neben eine Wand.
  • Strecke deinen rechten Arm nach hinten-oben aus und lege die rechte Handfläche auf Schulterhöhe flach an die Wand (Finger zeigen leicht nach hinten).

  Ausführung:
  • Drehe deinen Oberkörper und deine Füße sanft und langsam nach links weg von der Wand.
  • Spüre die Dehnung im rechten Bizeps, der vorderen Schulter und der Brustmuskulatur.
  • Halte die Position für 20 bis 30 Sekunden ohne ruckartige Bewegungen bei gleichmäßiger Atmung.
