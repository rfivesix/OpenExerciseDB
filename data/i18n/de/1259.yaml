name: TRX Knee Tuck zum Ellbogen
description: 'Ausgangsposition:

  Platziere deine Füße in den Fußschlaufen des Schlingentrainers und gehe in eine Liegestützposition (hohe Plank) mit den
  Händen direkt unter den Schultern.


  Ausführung:

  1. Spanne deinen Rumpf fest an und ziehe beide Knie kontrolliert diagonal nach vorne in Richtung des rechten Ellbogens.

  2. Halte die Kontraktion in den schrägen Bauchmuskeln für einen kurzen Moment.

  3. Strecke die Beine kontrolliert wieder nach hinten in die Plank-Position und wiederhole die Bewegung zur linken Seite.'
