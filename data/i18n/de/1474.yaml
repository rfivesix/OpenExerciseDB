name: W-Raise (W-Beinheben)
description: |-
  Ausgangsposition:
  Lege dich flach auf den Rücken auf eine Matte. Die Beine sind ausgestreckt, die Arme liegen zur Stabilisierung flach seitlich neben dem Körper. Hebe die Beine leicht vom Boden ab.

  Ausführung:
  1. Führe die Beine mit angespannter Bauchmuskulatur nach oben und diagonal nach links außen, hebe die Hüfte vom Boden ab (erster Schenkel des umgedrehten „W“).
  2. Senke die Beine kontrolliert bis zur halben Höhe ab, führe sie in die Mitte und hebe sie wieder gerade nach oben, wobei die Hüfte erneut abhebt (Mittelteil des „W“).
  3. Senke wieder halb ab und hebe die Beine diagonal nach rechts oben, bevor du sie kontrolliert zum Ausgangspunkt zurückführst.
  4. Durchlaufe die Bewegung anschließend in umgekehrter Richtung.

  Hinweise:
  Halte die Lendenwirbelsäule und den Rumpf während der gesamten Bewegung unter Spannung. Die Bewegung erfolgt kontrolliert und ohne Schwung.
