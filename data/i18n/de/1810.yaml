name: Sphinx-Haltung (Sphinx Pose)
description: "Ausgangsposition:\nLege dich bauchlings flach auf eine Matte, Beine\
  \ hüftbreit ausgestreckt, Fußrücken am Boden. Platziere deine Unterarme parallel\
  \ auf dem Boden, mit den Ellenbogen direkt unter den Schultern und den Handflächen\
  \ nach unten gerichtet.\n\nAusführung:\n1. Drücke deine Unterarme und Handflächen\
  \ sanft in den Boden und hebe deinen Brustkorb und Kopf kontrolliert an.\n2. Ziehe\
  \ die Schulterblätter nach hinten-unten zusammen, öffne die Schlüsselbeine und richte\
  \ den Blick entspannt geradeaus.\n3. Drücke das Schambein sanft in die Matte und\
  \ halte die Gesäßmuskulatur leicht aktiv, während der untere Rücken lang und spannungsfrei\
  \ bleibt.\n4. Halte diese Haltung für mehrere ruhige, tiefe Atemzüge.\n\nHinweise:\n\
  Eine wohltuende Yoga- und Mobilitätsübung zur sanften Streckung der Brustwirbelsäule\
  \ und Entlastung nach vielem Sitzen."
