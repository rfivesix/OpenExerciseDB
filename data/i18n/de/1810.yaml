name: Sphinx
description: |-
  Flach auf den Bauch legen, Beine gestreckt und Fußrücken am Boden. Bringe die Unterarme unter die Schultern, Ellenbogen direkt darunter. Dann drücke die Hände auf den Fußboden um den Brustkorb anzuheben. Ziehe die Schulterblätter zusammen, öffne die Schlüsselbeine und richte den Blick nach vorn, während der untere Rücken entspannt bleibt.
