name: Einarmiges hohes Kabelrudern
description: |-
  Ausgangsposition:
  Stelle den Kabelzug auf eine hohe Position ein und befestige einen Einhandgriff. Stelle dich mit versetzten Beinen vor den Turm, stütze dich mit der freien Hand am Rahmen ab und greife den Griff mit ausgestrecktem Arm.
  
  Ausführung:
  1. Ziehe den Griff diagonal nach hinten unten in Richtung oberer Brustkorb, indem du den Ellbogen kraftvoll nach hinten führst.
  2. Ziehe am Ende der Bewegung das Schulterblatt intensiv nach hinten und spanne den oberen Rücken an.
  3. Führe den Arm kontrolliert und langsam wieder nach vorne in die Ausgangsposition.
  
  Hinweise:
  Halte den Oberkörper ruhig und vermeide ein Verdrehen der Wirbelsäule beim Ziehen.
