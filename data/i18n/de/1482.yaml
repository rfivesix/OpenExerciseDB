name: Kurzhantel-Cheat-Curl
description: |-
  Ausgangsposition:
  Stehe aufrecht mit schulterbreitem Stand. Halte in jeder Hand eine schwere Kurzhantel mit gestreckten Armen im Untergriff (Handflächen nach vorne).

  Ausführung:
  1. Nutze einen leichten, kontrollierten Schwung aus Hüfte und Oberkörper, um den Totpunkt der Bewegung zu überwinden und die schweren Kurzhanteln nach oben zu curlen.
  2. Spanne den Bizeps am obersten Punkt für einen Moment maximal an.
  3. Senke die Hanteln betont langsam und streng kontrolliert über 3 bis 4 Sekunden ab (exzentrische Überlastung), ohne dabei mit dem Körper zu schwingen.

  Hinweise:
  Das kontrollierte „Mogeln“ (Cheat) dient ausschließlich dazu, die konzentrische Phase mit einem höheren Gewicht zu bewältigen, um in der negativen (exzentrischen) Phase einen maximalen Wachstumsreiz zu setzen.
