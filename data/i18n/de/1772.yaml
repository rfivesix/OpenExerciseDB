name: Reverse Crunch
description: "Ausgangsposition:\nLege dich rücklings auf eine Trainingsmatte. Die\
  \ Arme liegen flach neben dem Körper, die Handflächen drücken zur Unterstützung\
  \ leicht in den Boden. Hebe die Beine an und winkle Knie und Hüfte jeweils in einem\
  \ 90-Grad-Winkel an.\n\nAusführung:\n1. Spanne die Bauchmuskeln fest an und ziehe\
  \ deine Knie in Richtung Brustkorb.\n2. Rolle am Ende der Bewegung das Becken und\
  \ das Steißbein aktiv einige Zentimeter vom Boden nach oben auf.\n3. Halte die Kontraktion\
  \ am oberen Punkt für 1 bis 2 Sekunden.\n4. Senke das Becken langsam und kontrolliert\
  \ wieder ab, bis die Oberschenkel wieder senkrecht stehen, ohne den Kontakt des\
  \ unteren Rückens zum Boden komplett zu verlieren.\n\nHinweise:\nVermeide Schwung\
  \ aus den Beinen; die Hubkraft muss rein aus der Aufrollbewegung der Bauchmuskulatur\
  \ kommen."
