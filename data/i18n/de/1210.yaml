name: Fallschirmspringer in T-Position
description: |-
  Ausgangsposition:
  • Lege dich bauchlings auf eine Trainingsmatte.
  • Strecke deine Arme seitlich auf Schulterhöhe aus, sodass sie mit dem Rumpf ein T bilden.
  • Die Beine liegen mehr als schulterbreit auseinander.

  Ausführung:
  • Hebe Brust, Arme und Beine gleichzeitig unter Anspannung der gesamten Körperrückseite vom Boden ab.
  • Drehe die Daumen nach oben zur Decke und ziehe die Schulterblätter aktiv zusammen.
  • Führe die schwebenden Beine kontrolliert zusammen und öffne sie wieder, während Oberkörper und Arme stabil in der Luft gehalten werden.
  • Senke dich nach Ablauf der Wiederholungen langsam wieder ab.
