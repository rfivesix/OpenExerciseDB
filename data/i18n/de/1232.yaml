name: Stehende Bizepsdehnung links
description: |-
  Ausgangsposition:
  • Stelle dich seitlich mit der linken Körperseite neben eine Wand.
  • Strecke deinen linken Arm nach hinten-oben aus und lege die linke Handfläche auf Schulterhöhe flach an die Wand (Finger zeigen leicht nach hinten).

  Ausführung:
  • Drehe deinen Oberkörper und deine Füße sanft und langsam nach rechts weg von der Wand.
  • Spüre die Dehnung im linken Bizeps, der vorderen Schulter und der Brustmuskulatur.
  • Halte die Position für 20 bis 30 Sekunden ohne ruckartige Bewegungen bei gleichmäßiger Atmung.
