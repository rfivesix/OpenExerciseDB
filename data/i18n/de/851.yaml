name: Beinstrecker
description: '- Setze dich an die Beinstreckmaschine und passe Rückenlehne und Schienbeinpolster
  so an, dass das Kniegelenk auf Höhe der Drehachse liegt und das Polster knapp über
  den Sprunggelenken aufliegt.

  - Umfasse die Haltegriffe seitlich am Sitz und drücke das Polster durch Streckung
  der Beine kontrolliert nach oben.

  - Halte die maximale Kontraktion im Quadrizeps am obersten Punkt für einen Moment,
  ohne die Knie ruckartig zu überstrecken.

  - Senke das Gewicht langsam und kontrolliert wieder in die Ausgangsposition ab.'
