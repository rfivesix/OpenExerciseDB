language: de
status: ai_authored
name: Chin-ups
description: |-
  Ausgangsposition:
  Hänge dich an eine Klimmzugstange mit schulterbreitem Untergriff (Kammgriff / Supination), sodass deine Handflächen zu deinem Gesicht zeigen.

  Bewegung:
  1. Ziehe deinen Körper kontrolliert nach oben, bis das Kinn über die Stange reicht.
  2. Senke dich langsam wieder ab in die gestreckte Hangposition.

  Hinweis:
  Übung wurde in Übung 152 (Chin-up) zusammengeführt.
