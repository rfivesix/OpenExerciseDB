exercise_id: '1455'
language: de
status: ai_authored
name: Handtuch-Superman
description: |-
  Ausgangsposition:
  • Lege dich flach auf den Bauch auf eine Matte.
  • Halte ein Handtuch mit beiden Händen auf Zug vor dem Kopf schulterbreit mit ausgestreckten Armen.

  Ausführung:
  • Hebe Brust, Arme und Beine gleichzeitig leicht vom Boden ab, indem du Rückenstrecker und Gesäß anspannst.
  • Ziehe das auf Spannung gehaltene Handtuch kontrolliert zur oberen Brust heran, während du die Ellbogen nach hinten-unten ziehst.
  • Strecke die Arme wieder nach vorne aus, ohne den Oberkörper ganz abzulegen.
  • Wiederhole die Bewegung flüssig und kontrolliert.
