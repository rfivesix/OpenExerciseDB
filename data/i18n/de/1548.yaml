name: Treppensteiger (StairMaster)
description: 'Ausgangsposition:

  Stelle dich aufrecht auf die Stufen des StairMaster-Geräts. Greife die Griffe nur
  leicht zur Sicherung des Gleichgewichts, ohne dein Körpergewicht auf die Arme zu
  stützen.


  Ausführung:

  1. Steige in einem gleichmäßigen, kontrollierten Rhythmus Stufe für Stufe nach oben.

  2. Tritt mit dem gesamten Fuß auf die jeweilige Stufe auf und drücke dich aktiv
  über Ferse und Mittelfuß ab, um Gesäß und Quadrizeps optimal zu aktivieren.

  3. Halte den Oberkörper aufrecht, die Schultern zurückgezogen und vermeide ein Vorüberbeugen
  auf die Handläufe.


  Hinweise:

  Gelenkschonendes, hochintensives Herz-Kreislauf- und Kraftausdauertraining für die
  Bein- und Gesäßmuskulatur.'
