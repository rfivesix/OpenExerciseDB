name: Clamshell mit Band
description: "Ausgangsposition: Lege dich in Seitlage (oder in einen seitlichen Unterarmstütz)\
  \ mit gebeugten Knien und übereinanderliegenden Beinen. Platziere ein Miniband knapp\
  \ oberhalb beider Knie um die Oberschenkel.\nAusführung: Hebe das obere Knie gegen\
  \ den Widerstand des Bandes an, während die Füße aneinander bleiben, wie eine sich\
  \ öffnende Muschel. Senke das Knie langsam wieder ab.\nHinweise: Halte das Becken\
  \ stabil und nach vorne ausgerichtet; kippe mit der Hüfte nicht nach hinten weg."
