name: Nackenkreisen gegen den Uhrzeigersinn
description: |-
  Ausgangsposition:
  Sitze oder stehe mit aufrechtem Rücken, entspannten und tiefen Schultern. Senke das Kinn sanft in Richtung Brustbein ab.

  Ausführung:
  1. Führe den Kopf in einer langsamen, kontrollierten Kreisbewegung gegen den Uhrzeigersinn: Zuerst zur linken Schulter neigen, behutsam nach hinten führen, weiter zur rechten Schulter und zurück zur Brust.
  2. Bewege den Kopf gleichmäßig und ohne Überstreckung der Halswirbelsäule.
  3. Wiederhole die flüssige Bewegung für die gewünschte Dauer oder Wiederholungszahl.
