name: Seitheben an der Maschine
description: |-
  Das Seitheben an der Maschine ist eine Isolationsübung, die den mittleren (seitlichen) Anteil des Deltamuskels trainiert, um breitere und definiertere Schultern aufzubauen. Die feste Bewegungsbahn der Maschine bietet mehr Stabilität als Kurzhanteln und macht sie ideal für Einsteiger oder alle, die sich ganz auf die Muskelaktivierung konzentrieren möchten.
