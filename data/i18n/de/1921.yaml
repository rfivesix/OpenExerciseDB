name: Intensive Latissimusdehnung
description: 'Ausgangsposition:

  Stelle dich vor einen stabilen Pfosten oder eine Klimmzugstange. Greife den Haltepunkt mit einer oder beiden Händen über Kopfhöhe fest im Obergriff.


  Ausführung:

  Trete einen Schritt zurück, beuge die Knie leicht und schiebe die Hüfte nach hinten unten, während der Oberkörper nach vorne absinkt. Verlagere dein Körpergewicht nach hinten, sodass ein starker Dehnungszug entlang der Flanke und des Latissimus von der Achselhöhle bis zum Becken entsteht. Halte diese Position ruhig für 30 bis 60 Sekunden und atme tief in die Flanke ein.


  Hinweise:

  Lasse den Kopf entspannt zwischen den Armen und vermeide plötzliche Ruckbewegungen; wechsle nach der Haltezeit gegebenenfalls die Seite.'
