name: Einarmiges Schulterdrücken mit Kurzhantel
description: 'Ausgangsposition:

  Stelle dich schulterbreit und aufrecht hin (oder sitze aufrecht auf einer Bank). Halte eine Kurzhantel auf Schulterhöhe mit dem Ellbogen unter dem Handgelenk, die Handfläche zeigt nach vorne oder leicht nach innen (halber Neutralgriff). Platziere die freie Hand an der Hüfte oder zur Stabilisierung seitlich.


  Ausführung:

  Drücke die Kurzhantel in einer gleichmäßigen, kontrollierten Bewegung senkrecht nach oben über den Kopf, bis der Arm fast vollständig gestreckt ist, ohne den Ellbogen einzurasten. Spanne den Rumpf fest an, um ein seitliches Ausweichen des Körpers zu verhindern. Senke die Kurzhantel langsam und kontrolliert zurück auf Schulterhöhe ab. Führe alle Wiederholungen durch und wechsle dann den Arm.


  Hinweise:

  Das einseitige Schulterdrücken beansprucht intensiv die Rumpf- und Bauchmuskulatur zur Anti-Lateralflexion und gleicht muskuläre Dysbalancen zwischen den Schultern aus.'
