name: Kabelzug-Flyes im Sitzen
description: |-
  Stelle eine Bank zwischen zwei Kabeltürme und stelle die Seilrollen so ein, dass sie sich im Sitzen auf Brust- bzw. Schulterhöhe befinden.
  Greife die Griffe im neutralen Griff und lehne dich an die aufrechte Rückenlehne.
  Führe deine Arme in einer kontrollierten Bewegung vor der Brust zusammen und konzentriere dich darauf, deine Brustmuskeln zusammenzudrücken. Halte deine Ellbogen während der gesamten Bewegung leicht gebeugt.
  Halte kurz in der Endposition inne.
  Senke deine Arme langsam und kontrolliert wieder in die Ausgangsposition ab.
  Wiederhole die Bewegung für die gewünschte Anzahl an Wiederholungen.
