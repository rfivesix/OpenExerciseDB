name: Klimmzug mit breitem Griff
description: 'Ausgangsposition:

  Hänge dich an eine Klimmzugstange mit einem Überhandgriff, der deutlich breiter
  als schulterbreit ist. Der Körper hängt lang gestreckt, die Schulterblätter sind
  aktiv fixiert.


  Ausführung:

  1. Ziehe deinen Körper kraftvoll nach oben, indem du die Ellbogen nach unten und
  außen führst, bis das Kinn die Stange passiert.

  2. Spanne den Latissimus am obersten Punkt maximal an.

  3. Senke dich langsam und kontrolliert wieder in den vollen Hang ab.


  Hinweise:

  Der breite Griff betont vor allem die oberen Fasern des Musculus latissimus dorsi
  und den Musculus teres major für mehr Rückenbreite.'
