name: Ausatmungsübung im Wasser (Bobbing)
description: |-
  Ausgangsposition:
  Stelle dich in brusttiefes Wasser mit etwa schulterbreitem Stand. Halte dich bei Bedarf leicht am Beckenrand fest.

  Ausführung:
  1. Atme an der Wasseroberfläche tief durch den Mund ein.
  2. Gehe in die Knie und tauche dein Gesicht vollständig unter Wasser.
  3. Atme langsam, gleichmäßig und vollständig durch die Nase (oder Nase und Mund) unter Wasser aus. Ein leises Summen kann helfen, den Luftstrom zu kontrollieren.
  4. Sobald die Lunge leer ist, drücke dich mit den Beinen nach oben, bringe den Kopf aus dem Wasser, atme sofort frisch ein und tauche direkt wieder unter.
  5. Führe die Bewegung rhythmisch und ohne Unterbrechung für die vorgegebene Wiederholungszahl durch.

  Hinweise:
  Trainiere deinen Körper darauf, die gesamte Ausatmung unter Wasser zu vollenden, sodass über Wasser nur kurz eingeatmet werden muss.
