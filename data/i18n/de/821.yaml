name: Klimmzug am Fingerboard
description: '- Greife eine ausgewählte Leiste oder Kante des Fingerboards symmetrisch
  mit beiden Händen im offenen Griff oder Halb-Crimp.

  - Hänge dich mit gestreckten Armen und aktiven Schultern frei an das Board.

  - Ziehe deinen Körper kontrolliert nach oben, bis sich dein Kinn mindestens auf
  Höhe der Leiste bzw. deiner Hände befindet.

  - Senke dich langsam und kontrolliert (2-3 Sekunden) wieder in die Ausgangsposition
  ab, ohne in die Gelenke zu fallen.'
