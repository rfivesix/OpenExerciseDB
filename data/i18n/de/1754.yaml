name: 45°-Seitheben (Skapuläres Seitheben)
description: "Ausgangsposition:\nStehe aufrecht mit hüftbreitem Stand und halte in\
  \ jeder Hand eine Kurzhantel vor deinen Oberschenkeln mit neutralem bis leicht proniertem\
  \ Griff. Die Schultern sind nach hinten-unten fixiert.\n\nAusführung:\n1. Hebe die\
  \ Kurzhanteln in einem Winkel von etwa 30 bis 45 Grad vor der reinen Seithebene\
  \ nach oben (in der Skapularebene).\n2. Führe die Hanteln bis auf Schulterhöhe,\
  \ wobei die Daumen minimal höher als die kleinen Finger stehen.\n3. Halte die Kontraktion\
  \ am höchsten Punkt kurz und senke die Gewichte anschließend langsam und kontrolliert\
  \ wieder ab.\n\nHinweise:\nDie Bewegung in der Skapularebene schont das Schultergelenk,\
  \ vermeidet ein Impingement und aktiviert gleichzeitig den mittleren und vorderen\
  \ Deltamuskel sowie den Trapezius optimal."
