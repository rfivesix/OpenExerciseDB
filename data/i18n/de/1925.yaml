name: Silverback-Shrugs mit der Langhantel
description: 'Ausgangsposition:

  Stelle dich etwa schulterbreit hin und greife die Langhantel im Obergriff etwas breiter als schulterbreit. Beuge die Knie leicht und kippe den geraden Oberkörper aus der Hüfte in eine stabile Vorbeuge (ca. 45 Grad). Die Hantel hängt mit gestreckten Armen senkrecht nach unten.


  Ausführung:

  Ziehe die Schultern kraftvoll nach oben und hinten zusammen, als wolltest du deine Schulterblätter in der Rückenmitte berühren. Halte die Arme währenddessen gestreckt. Halte die Kontraktion im oberen und mittleren Trapez für eine Sekunde und senke die Hantel langsam und kontrolliert wieder in die Ausgangslage ab.


  Hinweise:

  Die Vorbeuge verlagert den Schwerpunkt von der oberen Nackenmuskulatur auf den mittleren Trapez und die Rautenmuskeln; halte die Lendenwirbelsäule stabil und hole keinen Schwung aus den Beinen.'
