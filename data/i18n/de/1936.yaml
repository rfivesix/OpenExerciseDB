name: Einarmige Reverse Flys am Kabelzug
description: 'Ausgangsposition:

  Stelle dich seitlich vor einen Kabelzugturm, dessen Seilrolle auf Schulterhöhe eingestellt ist. Greife das Kabel (oder eine Einhand-Schlaufe) mit der maschinenfernen Hand vor der Brust. Halte den Arm fast gestreckt mit leicht gebeugtem Ellbogen und spanne den Rumpf an.


  Ausführung:

  Ziehe das Kabel in einem weiten horizontalen Bogen nach außen und hinten, bis sich der Arm auf einer Linie mit der Schulter befindet. Spanne den hinteren Deltamuskel und die Schulterblattmuskeln am Endpunkt für eine Sekunde maximal an. Führe den Arm langsam und kontrolliert wieder vor die Brust zurück.


  Hinweise:

  Halte den Oberkörper stabil und vermeide ein Mitdrehen des Rumpfes; die Bewegung soll isoliert im Schultergelenk stattfinden.'
