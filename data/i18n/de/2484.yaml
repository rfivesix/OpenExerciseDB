name: Seitlicher Beinschlag mit Schwimmbrett (Atmung)
description: |-
  Ausgangsposition:
  Stoße dich in Seitenlage von der Beckenwand ab. Der untere Arm ist nach vorne ausgestreckt und hält das Schwimmbrett, der obere Arm liegt flach an der Hüfte an. Der Körper liegt exakt auf der Seite im Wasser.

  Ausführung:
  1. Führe kontinuierliche Beinschläge aus, um den Vortrieb und die Seitenlage stabil zu halten.
  2. Halte den Kopf zunächst neutral mit Blick nach unten zum Beckenboden.
  3. Wenn du einatmen möchtest, drehe den Kopf seitlich nach oben (das untere Ohr bleibt im Wasser, das obere zeigt zur Decke) und atme ein.
  4. Drehe den Kopf ruhig zurück in die neutrale Blickposition und schwimme eine Bahn, bevor du die Seite wechselst.

  Hinweise:
  Vermeide es, den Kopf anzuheben; die Drehbewegung erfolgt rein um die Längsachse.
