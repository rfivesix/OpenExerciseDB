name: Seitliches Kicken mit Brett (Atmung)
description: |-
  Stoße dich seitlich von der Wand ab (nicht flach auf dem Bauch); halte dabei einen Arm nach vorn ausgestreckt am Brett oder strecke ihn einfach aus und schlage durchgehend mit den Beinen. Halte den Kopf neutral und schaue zum Beckenboden; wenn du Luft brauchst, drehe den Kopf seitlich zum Atmen (ein Ohr bleibt im Wasser, das andere zeigt nach oben), dann drehe ihn zurück in die neutrale Position. Schwimme so eine Bahnlänge und wiederhole es dann auf der anderen Seite. Das vermittelt genau die Kopfposition und Drehung, die du nutzt, sobald die Atmung beim vollständigen Armzug hinzukommt.
