name: Seitlicher Ausfallschritt (rechts)
description: 'Ausgangsposition: Stehe in einer weiten Grätschstellung mit geradem
  Oberkörper, die Fußspitzen zeigen leicht nach außen.

  Ausführung: Verlagere dein Gewicht nach rechts, beuge das rechte Knie und schiebe
  die Hüfte nach hinten-unten. Das linke Bein bleibt gestreckt und der linke Fuß behält
  Bodenkontakt.

  Rückkehr: Drücke dich über die rechte Ferse kraftvoll zurück in die Ausgangsstellung.

  Hinweis: Halte die Brust aufgerichtet und achte darauf, dass das rechte Knie in
  Richtung der Zehenspitzen zeigt.'
