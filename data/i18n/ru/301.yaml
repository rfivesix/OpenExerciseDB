name: Гиперэкстензия
description: |-
  Гиперэкстензия – это упражнение, преимущественно на разгибание в поясничной области. Начните с того, что лягте на живот на специальный тренажёр, закрепив ноги в замках у его основания. Ваши бёдра должны лежать на подушечке, а тело свисать вниз. Руки можно положить на грудь или за голову. Разгибайте тело вверх, поднимая верхнюю часть тела до тех пор, пока оно не будет в одной линии с бедрами. Затем медленно вернитесь в исходное положение. Главное – делать движение аккуратно, избегая резких движений и перегибов в пояснице.
