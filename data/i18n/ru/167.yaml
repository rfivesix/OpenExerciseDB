name: Скручивания
description: |-
  Исходное положение:
  Лягте на спину на гимнастический коврик, согните ноги в коленях под углом 90 градусов, стопы стоят на полу на ширине таза. Руки расположите за головой (не сцепляя в замок) или скрестите на груди.

  Выполнение:
  1. На выдохе силой мышц брюшного пресса оторвите лопатки и верхнюю часть спины от пола, скругляя грудной отдел по направлению к тазу.
  2. Задержитесь в точке пикового сокращения на одну секунду.
  3. На вдохе плавно и подконтрольно опуститесь обратно, сохраняя постоянное напряжение в мышцах живота.

  Примечания:
  Не тяните себя за шею руками и держите поясницу плотно прижатой к полу на протяжении всего движения.
