name: Велотренажёр / Велоспорт
search_terms:
- Велотренажор
- Езда на велосипеде
- Сайклинг
description: |-
  Исходное положение:
  Отрегулируйте высоту седла велосипеда или велотренажёра так, чтобы в нижней точке педали нога оставалась слегка согнутой в колене (угол 25–35 градусов). Спина прямая, плечи опущены, руки свободно лежат на руле.

  Выполнение:
  1. Вращайте педали плавно и непрерывно по круговой траектории, соблюдая стабильный ритм и каденс.
  2. Оказывайте давление на педаль подушечками стоп, избегая резких рывков.
  3. Поддерживайте ровный темп в соответствии с тренировочным планом.

  Примечания:
  Держите корпус и таз стабильными, не раскачиваясь в седле из стороны в сторону.
