  Dalam gerakan melompat cepat, meluruskan kaki membungkuk keluar dan menarik lutut lainnya ke arah tubuh Anda.
  Terus mengulangi Langkah 2, bolak kaki.

  Catatan:
  Sepanjang latihan punggung harus tetap lurus mungkin-menghindari punuk atau seonggok punggung.
