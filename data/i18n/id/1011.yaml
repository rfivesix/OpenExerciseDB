name: Peregangan leher depan
description: |-
  Posisi awal:
  Duduk atau berdiri tegak dengan punggung lurus dan bahu rileks.

  Langkah pelaksanaan:
  1. Buka mulut lebar-lebar.
  2. Perlahan tengadahkan kepala ke belakang dengan mulut terbuka hingga merasakan regangan lembut di bagian depan leher.
  3. Buka dan tutup mulut secara perlahan beberapa kali untuk memperdalam peregangan otot leher bagian depan.
  4. Kembalikan kepala secara perlahan ke posisi awal dan tutup mulut.
