name: Pose anak
description: |-
  Posisi awal:
  Mulailah merangkak, lutut, jari kaki, dan tangan menyentuh tanah. Kedua jari kaki besar Anda harus bersentuhan.
  Langkah:

  Gerakkan lutut Anda sehingga mereka sekitar selebar pinggul.
  Saat menghembuskan napas, gerakkan panggul ke belakang untuk duduk di atas tumit. Tangan Anda harus tetap menyentuh tanah.
  Rilekskan tubuh bagian atas Anda, turunkan dahi ke lantai dan biarkan tangan Anda bergerak maju secara alami.
  Tetap dalam pose ini.

  Tips:

  Untuk meninggalkan pose, berjalan lengan Anda kembali di bawah bahu Anda dan memindahkan tubuh bagian atas Anda ke posisi duduk.
