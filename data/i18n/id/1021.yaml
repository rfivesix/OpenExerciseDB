name: Calf raise satu kaki (kanan)
description: |-
  Posisi awal:
  Berdiri pada kaki kanan di lantai atau tepi undakan dengan kaki kiri terangkat. Sentuh dinding dengan ringan untuk menjaga keseimbangan.

  Langkah pelaksanaan:
  1. Turunkan tumit kanan ke bawah untuk meregangkan otot betis.
  2. Dorong kuat-kuat melalui bantalan telapak kaki kanan hingga berdiri setinggi mungkin di atas jari kaki.
  3. Tahan kontraksi di puncak gerakan selama 1-2 detik.
  4. Turunkan tumit kembali secara perlahan dan terkontrol.
