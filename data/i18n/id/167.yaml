name: Crunch
description: |-
  Posisi awal:
  Berbaring telentang di atas matras dengan lutut ditekuk dan telapak kaki menapak rata di lantai selebar pinggul. Letakkan tangan dengan ringan di belakang kepala atau menyilang di dada.

  Pelaksanaan:
  1. Kontraksikan otot perut untuk mengangkat bahu dan punggung atas dari lantai, menggulung tulang belakang ke arah panggul.
  2. Tahan kontraksi puncak selama satu detik sambil menghembuskan napas.
  3. Turunkan kembali tubuh secara perlahan dan terkontrol tanpa membiarkan punggung bawah terangkat dari lantai.

  Catatan:
  Jangan menarik leher dengan tangan. Fokuskan gerakan pada pengerutan otot perut.
