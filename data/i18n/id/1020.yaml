name: Pistol squat kaki kanan
description: |-
  Posisi awal:
  Berdiri dengan kaki kanan, luruskan kaki kiri ke depan terangkat dari lantai. Rentangkan kedua lengan ke depan untuk menjaga keseimbangan.

  Langkah pelaksanaan:
  1. Tekuk lutut kanan secara perlahan dan turun ke posisi squat satu kaki yang dalam.
  2. Jaga punggung tetap lurus dan kaki kiri tetap terangkat tanpa menyentuh lantai.
  3. Turun serendah mungkin dengan kontrol penuh.
  4. Dorong melalui tumit kanan untuk berdiri kembali ke posisi awal.
