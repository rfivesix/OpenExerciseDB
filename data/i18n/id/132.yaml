name: Burpe Push-up
description: |-
  Posisi awal:
  Berdiri tegak, kaki selebar pinggul.
  Langkah:

  Jongkok rendah dan dukung diri anda di lantai dengan tangan di antara lutut dan di depan kaki, punggung lurus.
  Menjaga tangan Anda di lantai, melompat kaki Anda ke belakang ke posisi papan tinggi.
  Lakukan push-up.
  Lompat kaki Anda ke depan untuk kembali ke posisi jongkok.
  Ulangi.
