name: Plank samping kanan
description: |-
  Posisi awal:
  Berbaring miring ke sisi kanan dengan kaki lurus bertumpuk. Letakkan siku kanan tepat di bawah bahu kanan dengan lengan bawah menempel di lantai.

  Langkah pelaksanaan:
  1. Kencangkan otot inti dan pinggul, lalu angkat panggul dari lantai hingga tubuh membentuk garis lurus dari kepala hingga kaki.
  2. Pertahankan posisi tubuh tetap lurus dan jangan biarkan pinggul merosot ke bawah.
  3. Tahan posisi ini selama durasi yang ditentukan dengan pernapasan teratur.
