name: Devil's Press
description: 'Le Devil''s Press est un mouvement hybride combinant un burpee avec
  haltères et un arraché à deux haltères. C''est un exercice complet et de haute intensité
  qui développe la force, la puissance et le conditionnement métabolique.


  Commencez avec un haltère dans chaque main et réalisez un burpee, en laissant votre
  poitrine toucher le sol tout en tenant les haltères.

  Ramenez vos pieds vers l''avant d''un saut explosif et balancez les haltères entre
  vos jambes.

  Propulsez les haltères au-dessus de la tête en un seul mouvement continu, en verrouillant
  vos bras.

  Abaissez les haltères avec contrôle pour revenir à la position de départ et répétez'
