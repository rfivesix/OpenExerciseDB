name: Élévations frontales avec haltères
description: 'Position de départ :

  Debout, pieds à la largeur des hanches, tenez un haltère dans chaque main devant les cuisses, paumes tournées vers vous.


  Exécution :

  1. En gardant les coudes très légèrement fléchis, montez les haltères vers l''avant jusqu''à la hauteur des épaules ou des
  yeux.

  2. Marquez un court arrêt en haut pour contracter le deltoïde antérieur.

  3. Redescendez lentement sous contrôle sans balancer le buste.'
