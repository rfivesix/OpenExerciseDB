name: Step Jack (Jumping jack à faible impact)
description: 'Position de départ :

  Debout, pieds joints et bras relâchés le long du corps, sangle abdominale légèrement engagée.


  Exécution :

  Faites un pas latéral sur la droite tout en levant simultanément les deux bras en arc de cercle au-dessus de la tête. Ramenez le pied au centre en abaissant les bras, puis enchaînez immédiatement en faisant un pas latéral sur la gauche. Poursuivez en alternant de façon rythmée.


  Conseils :

  Excellente alternative sans saut aux jumping jacks traditionnels; stimule le système cardiovasculaire sans choc articulaire.'
