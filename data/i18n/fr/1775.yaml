name: Oiseau à la machine pec deck
description: "Position de départ :\nAsseyez-vous face au dossier de la machine pec\
  \ deck. Réglez le siège pour que les poignées soient à la hauteur de vos épaules.\
  \ Plaquez le buste contre le coussin et saisissez les poignées, coudes légèrement\
  \ déverrouillés.\n\nExécution :\n1. Écartez les bras vers l'arrière dans un plan\
  \ horizontal en contractant l'arrière des épaules (deltoïde postérieur).\n2. Marquez\
  \ un temps d'arrêt en contraction maximale lorsque les bras sont alignés avec le\
  \ torse.\n3. Revenez lentement à la position de départ en résistant à la charge.\n\
  \nConseils :\nGardez les épaules basses et concentrez-vous sur l'effort du deltoïde\
  \ postérieur plutôt que sur un pincement excessif des omoplates."
