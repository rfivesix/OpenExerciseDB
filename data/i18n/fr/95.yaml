name: Curl biceps à la poulie
description: Tenez-vous à environ 30 à 40 cm de la poulie, les pieds fermement posés au sol. Saisissez la barre et soulevez
  la charge d'un mouvement rapide. Abaissez la charge lentement et de façon contrôlée, comme pour les curls avec haltères.
