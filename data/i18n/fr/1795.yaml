name: Tirage croisé unilatéral à la poulie
description: "Position de départ :\nRéglez la poulie en position haute. Placez-vous\
  \ légèrement de biais pour que le câble traverse votre buste en diagonale. Saisissez\
  \ la poignée avec la main opposée, inclinez légèrement le buste et laissez le bras\
  \ s'étirer dans l'alignement du câble.\n\nExécution :\n1. Tirez le câble en diagonale\
  \ vers le bas et l'intérieur en direction de la hanche, le coude légèrement déverrouillé.\n\
  2. Amenez le coude près des côtes en contractant intensément le grand dorsal en\
  \ bas du mouvement.\n3. Laissez remonter la charge avec contrôle le long de la même\
  \ trajectoire pour obtenir un étirement complet du grand dorsal.\n\nConseils :\n\
  L'angle diagonal de tirage respecte l'orientation anatomique des fibres du grand\
  \ dorsal pour une isolation maximale."
