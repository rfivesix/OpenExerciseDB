name: Développé couché aux haltères sans impulsion des jambes
description: |-
  Position de départ :
  • Allongez-vous sur un banc plat avec une paire d'haltères au niveau de la poitrine.
  • Posez les pieds sur le banc ou levez les jambes en l'air pour éliminer totalement l'appui et l'impulsion des jambes.

  Exécution :
  • Développez les haltères verticalement au-dessus de la poitrine en utilisant uniquement la force des pectoraux et des triceps.
  • Marquez une pause en haut du mouvement puis redescendez lentement les haltères au niveau de la poitrine.
  • Conservez le bassin et la colonne vertébrale bien stables sur le banc tout au long de la série.
