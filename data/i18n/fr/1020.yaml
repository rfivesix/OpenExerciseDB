name: Pistol squat jambe droite
description: |-
  Position de départ :
  Tenez-vous en équilibre sur la jambe droite, la jambe gauche tendue vers l'avant au-dessus du sol. Tendez les bras devant vous pour équilibrer le corps.

  Étapes :
  1. Fléchissez lentement le genou et la hanche droite pour descendre en squat complet sur une jambe.
  2. Gardez le buste fier, le dos droit et la jambe gauche tendue sans toucher le sol.
  3. Descendez de manière contrôlée aussi bas que votre mobilité le permet.
  4. Poussez fermement sur le talon droit pour remonter en position debout.
