exercise_id: '1228'
language: fr
status: ai_reviewed
name: Développé couché serré aux haltères
description: |-
  Position de départ :
  • Allongez-vous sur un banc plat avec un haltère dans chaque main au-dessus de la poitrine, bras tendus.
  • Adoptez une prise neutre (paumes face à face) et pressez fermement les deux haltères l'un contre l'autre.

  Exécution :
  • Abaissez les haltères vers le milieu de la poitrine en gardant les coudes bien serrés le long du corps.
  • Développez les haltères vers le haut en contractant puissamment les triceps et les pectoraux.
  • Conservez la pression constante entre les haltères au sommet du mouvement avant d'entamer la répétition suivante.
