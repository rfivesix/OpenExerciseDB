name: Exercices d'épaules à l'élastique
description: "Position de départ : Fixez un élastique à hauteur d'épaule ou de poitrine\
  \ à un support solide. Tenez l'élastique en main et reculez jusqu'à obtenir une\
  \ tension légère à modérée.\nExécution : Effectuez des mouvements circulaires et\
  \ de rotation contrôlés du bras dans différents plans pour échauffer et mobiliser\
  \ l'articulation de l'épaule et la coiffe des rotateurs.\nConseils : Gardez une\
  \ posture droite et gainez la sangle abdominale tout au long de l'exercice, sans\
  \ donner d'à-coups."
