name: Développé décliné sur machine Hammer Strength
description: "Position de départ :\nAsseyez-vous sur la machine Hammer Strength pour\
  \ développé décliné, les omoplates bien plaquées contre le dossier et les pieds\
  \ au sol. Réglez le siège pour que les poignées arrivent au niveau du bas des pectoraux.\
  \ Saisissez les poignées en pronation.\n\nExécution :\n1. Gainez la sangle abdominale\
  \ et poussez fermement sur les poignées vers l'avant et le bas, coudes orientés\
  \ à 45 degrés du buste.\n2. Tendez les bras presque complètement en contractant\
  \ fortement le faisceau inférieur des pectoraux.\n3. Revenez lentement à la position\
  \ de départ en contrôlant la phase excentrique.\n\nConseils :\nGardez le dos et\
  \ la tête calés contre le dossier tout au long de la série."
