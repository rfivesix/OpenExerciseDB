name: Rotation thoracique à quatre pattes à droite
description: |-
  Position de départ :
  Mettez-vous à quatre pattes, genoux sous les hanches et main gauche en appui au sol sous l'épaule gauche. Placez la main droite derrière la tête, coude ouvert.

  Étapes :
  1. À l'inspiration, amenez le coude droit vers le bras gauche en enroulant légèrement le torse.
  2. À l'expiration, pivotez le haut du corps vers la droite en pointant le coude droit vers le haut.
  3. Maintenez le bassin fixe et les hanches au même niveau.
  4. Répétez le mouvement pour le nombre de répétitions indiqué.
