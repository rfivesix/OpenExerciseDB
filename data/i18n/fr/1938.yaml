description: 'Position de départ :

  Installez-vous à quatre pattes sur un tapis de sol, mains sous les épaules et genoux sous les hanches. Colonne vertébrale en position neutre.


  Exécution :

  Inspirez en laissant le ventre descendre doucement vers le sol, relevez la poitrine et le regard vers l''avant dans la posture de la vache. Expirez profondément en rentrant le coccyx et en arrondissant tout le dos vers le plafond comme un chat qui s''étire, menton vers la poitrine. Alternez avec fluidité pendant 8 à 12 respirations.


  Conseils :

  Coordonnez chaque mouvement avec le souffle et mobilisez la colonne vertébrale vertèbre par vertèbre.'
