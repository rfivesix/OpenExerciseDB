name: Pompes prise large (Wide Push-Up)
description: 'Position de départ :

  Placez-vous en planche haute, les mains écartées plus largement que la largeur des épaules (environ 1,5 fois la largeur des épaules), doigts légèrement orientés vers l''extérieur. Corps parfaitement aligné de la tête aux talons.


  Exécution :

  Descendez la poitrine vers le sol de façon contrôlée en fléchissant les coudes jusqu''à ce que le torse frôle le sol. Marquez une courte pause, puis poussez puissamment sur les paumes pour remonter en position initiale.


  Conseils :

  Cette prise large accentue le recrutement du grand pectoral et des épaules antérieures tout en diminuant l''intervention des triceps. Gardez le bassin gainé.'
