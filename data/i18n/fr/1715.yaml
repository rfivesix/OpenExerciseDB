name: Rotation externe de l'épaule avec haltère
description: |-
  Allongez-vous sur le côté en tenant un haltère dans votre main supérieure
  Calez votre coude contre votre flanc et posez la main devant vous
  Faites pivoter l'épaule de sorte que la main se relève
  Redescendez la main
