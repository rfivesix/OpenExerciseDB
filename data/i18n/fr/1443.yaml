name: Élévation combinée latérale et frontale aux haltères
description: |-
  Position de départ :
  • Tenez-vous debout, pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main le long du corps, coudes très légèrement fléchis.

  Exécution :
  • Élevez les haltères sur les côtés jusqu'à la hauteur des épaules (élévation latérale).
  • En gardant les bras à hauteur d'épaules, amenez-les horizontalement vers l'avant devant la poitrine.
  • Redescendez lentement les haltères devant les cuisses.
  • Vous pouvez alterner en montant vers l'avant, en ouvrant sur les côtés puis en redescendant.
