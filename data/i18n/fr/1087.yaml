name: Hang Power Clean avec haltères
description: |-
  Position de départ :
  Debout, pieds écartés de la largeur des hanches, tenez un haltère dans chaque main le long du corps. Basculez légèrement les hanches vers l'arrière en fléchissant les genoux pour amener les haltères juste au-dessus des genoux (position suspendue 'hang').

  Étapes :
  1. Déployez de façon explosive les hanches et les genoux tout en effectuant un puissant haussement d'épaules.
  2. Tirez les haltères verticalement le long du corps et projetez rapidement les coudes vers l'avant.
  3. Réceptionnez les haltères sur les épaules en quart de squat pour amortir la charge.
  4. Redressez-vous complètement en tendant les jambes, puis redescendez les haltères de manière contrôlée vers la position suspendue.
search_terms:
