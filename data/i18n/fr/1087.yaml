name: Épaulés-jetés en puissance avec haltères depuis la suspension
description: |-
  Debout, tenez-vous bien droit avec vos haltères, en les maintenant le long du corps. Effectuez une charnière au niveau des hanches pour les abaisser jusqu'aux genoux (image 1). Redressez-vous avec un léger saut, en utilisant l'élan pour tirer les haltères jusqu'à vos épaules (image 2). Tenez-vous bien droit, puis redescendez les haltères le long du corps de façon contrôlée et répétez. Gardez le mouvement rapide et explosif ; si votre fréquence cardiaque ne grimpe pas en flèche, c'est que vous les exécutez mal.
