name: Pull-through à la poulie
description: "Position de départ :\nAttachez une corde à la poulie la plus basse.\
  \ Placez-vous dos à la poulie, la corde passant entre vos jambes. Saisissez les\
  \ extrémités de la corde, avancez de deux pas pour créer une tension continue et\
  \ écartez les pieds un peu plus que la largeur des épaules.\n\nExécution :\n1. Poussez\
  \ les hanches vers l'arrière en charnière tout en gardant le dos plat et les genoux\
  \ très légèrement fléchis.\n2. Laissez la corde reculer entre vos cuisses jusqu'à\
  \ sentir un étirement marqué dans les ischio-jambiers.\n3. Poussez puissamment les\
  \ hanches vers l'avant pour revenir debout en contractant fortement les fessiers\
  \ en haut.\n\nConseils :\nCe n'est pas un squat mais une charnière de hanches ;\
  \ gardez les bras relâchés et laissez les hanches générer toute la force."
