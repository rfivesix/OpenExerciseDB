name: Élévations vers le plafond
description: Pour réaliser cet exercice, allongez-vous sur le dos, les bras tendus au-dessus de la tête. Contractez ensuite
  vos abdominaux et décollez votre torse du sol tout en tendant vos bras vers le plafond afin d'atteindre le plus haut possible.
  Revenez lentement à la position de départ en contrôlant le mouvement. Ces élévations renforcent les muscles abdominaux et
  améliorent la souplesse de la colonne vertébrale. Elles peuvent être intégrées à diverses routines d'entraînement pour travailler
  la force et la stabilité de la sangle abdominale.
