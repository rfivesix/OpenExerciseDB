exercise_id: '1475'
language: fr
status: human
name: Black widow knee slides (glissements de genou)
description: |-
  Dans ce mouvement de rotation de bas en haut, vous croisez le genou et le ramenez vers le coude opposé. Commencez en position de planche haute (ou en position de table) avec les mains directement sous les épaules. Levez le genou gauche vers le bras droit et faites-le glisser le long de l'avant-bras pour accentuer la bascule postérieure du bassin et l'engagement des muscles abdominaux. Faites ensuite l'autre côté, en ramenant votre genou droit vers votre main gauche.
