name: Glissements de genoux Black Widow
description: |-
  Position de départ :
  Commencez en position de planche haute, les mains directement sous les épaules et le corps formant une ligne droite de la tête aux talons.

  Exécution :
  1. Amenez un genou en diagonale sous le tronc en direction du coude opposé.
  2. Faites glisser le genou vers le haut le long de l'avant-bras tout en accentuant la bascule postérieure du bassin pour contracter fortement les obliques et les abdominaux.
  3. Revenez avec contrôle en position de planche de départ.
  4. Répétez le mouvement avec le genou opposé, en alternant les côtés.

  Conseils :
  Gardez le bassin stable et le ventre rentré sans laisser le bas du dos se creuser.
