name: Tirage haut sumo à la kettlebell (Sumo High Pull)
description: 'Position de départ :

  Placez-vous au-dessus d''une kettlebell en position sumo (pieds plus larges que les épaules, pointes ouvertes vers l''extérieur). Poussez les hanches en arrière et fléchissez les genoux avec le dos plat pour saisir la poignée à deux mains en prise pronation.


  Exécution :

  Déployez une extension explosive des hanches et des genoux en poussant fort sur les talons. Utilisez cette propulsion pour amener la kettlebell verticalement vers le haut du buste en gardant les coudes hauts et écartés, la charge restant près du corps. Redescendez de manière fluide vers la position de départ.


  Conseils :

  La puissance motrice est produite par la chaîne postérieure (fessiers et ischio-jambiers); les bras ne font qu''accompagner la montée de la charge.'
