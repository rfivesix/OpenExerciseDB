name: Pression abdominale à deux jambes
description: "Position de départ :\nAllongez-vous sur le dos, les hanches et les genoux\
  \ fléchis à 90 degrés en position de table. Plaquez fermement le bas du dos contre\
  \ le sol. Posez vos paumes de mains sur vos cuisses, juste au-dessus des genoux.\n\
  \nExécution :\n1. Poussez de toutes vos forces avec vos mains contre vos cuisses\
  \ tout en poussant simultanément vos cuisses contre vos mains.\n2. Créez un gainage\
  \ isométrique intense sur l'ensemble de la sangle abdominale.\n3. Maintenez cette\
  \ poussée maximale pendant 10 à 15 secondes sans bloquer votre respiration.\n4.\
  \ Relâchez doucement la pression avant d'enchaîner la répétition suivante.\n\nConseils\
  \ :\nLe bas du dos doit rester en contact continu avec le tapis tout au long de\
  \ l'effort."
