name: Arraché avec haltère (Dumbbell Snatch)
description: 'Position de départ :

  Debout, pieds à la largeur des épaules, haltère posé au sol entre les pieds. Fléchissez les hanches et les genoux avec le dos droit et saisissez l''haltère en prise pronation.


  Exécution :

  Déployez une triple extension explosive des chevilles, genoux et hanches pour propulser l''haltère vers le haut en gardant le coude haut et la charge près du corps. Chutez rapidement sous l''haltère pour le verrouiller bras tendu au-dessus de la tête en position de demi-squat, puis redressez-vous complètement debout.


  Conseils :

  La force motrice provient exclusivement de la poussée des jambes et de l''extension de hanche, non de la traction du bras.'
