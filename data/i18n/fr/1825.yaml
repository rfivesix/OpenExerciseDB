name: Élévation des deltoïdes postérieurs sur banc incliné
description: "Position de départ :\nRéglez un banc incliné à 30-45 degrés. Allongez-vous\
  \ à plat ventre, la poitrine fermement calée contre le dossier et le cou neutre.\
  \ Tenez des haltères légers les bras ballants, en prise neutre ou pouces vers le\
  \ haut.\n\nExécution :\n1. Les coudes très légèrement déverrouillés, levez les haltères\
  \ vers le haut et l'extérieur en formant un « Y ».\n2. Tirez avec l'arrière des\
  \ épaules et rapprochez les omoplates au sommet du mouvement.\n3. Marquez un temps\
  \ d'arrêt d'une seconde en contraction maximale à hauteur d'épaules.\n4. Redescendez\
  \ lentement les haltères sous contrôle jusqu'à la position de départ.\n\nConseils\
  \ :\nL'appui pectoral sur le banc supprime tout élan du bas du dos pour une isolation\
  \ parfaite."
