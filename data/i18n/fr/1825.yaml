name: Élévation des deltoïdes postérieurs avec appui sur la poitrine
description: |-
  « Le Y »Position : Réglez un banc incliné à 30-45 degrés. Allongez-vous à plat ventre, la poitrine en appui, en gardant la tête neutre ou le regard légèrement vers le bas pour éviter de forcer sur la nuque.Prise : Tenez des haltères légers en prise neutre ou pouces vers le haut (le pouce pointant vers le plafond).Mouvement : Les coudes tendus ou légèrement fléchis, levez les haltères vers le haut et vers l'extérieur en formant un « Y ». Concentrez-vous sur le mouvement des épaules et des omoplates plutôt que sur le simple fait de lever les bras.Position haute : Rapprochez les omoplates et étirez-vous bien haut, en veillant à ce que les bras soient orientés de façon à former un « Y ».Contrôle : Abaissez lentement les haltères jusqu'à la position de départ.
