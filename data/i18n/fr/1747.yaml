name: Squat à la machine Smith
description: "Position de départ :\nPlacez-vous sous la barre guidée de la machine\
  \ Smith en la reposant sur le haut des trapèzes. Placez vos pieds à la largeur des\
  \ épaules, légèrement en avant de la barre pour préserver les genoux et cibler les\
  \ quadriceps et fessiers. Déverrouillez la barre en pivotant les poignets.\n\nExécution\
  \ :\n1. Inspirez, gainez le tronc et descendez en fléchissant les genoux et les\
  \ hanches le long des rails verticaux.\n2. Descendez de façon contrôlée jusqu'à\
  \ ce que les cuisses soient au moins parallèles au sol.\n3. Poussez fortement à\
  \ travers les talons pour remonter en position debout.\n4. Gardez un léger déverrouillage\
  \ des genoux en haut pour conserver la tension musculaire.\n\nConseils :\nGardez\
  \ le torse fier et le dos bien droit tout au long du mouvement guidé."
