name: Clamshell inversé
description: |-
  Position de départ :
  Allongez-vous sur le côté, les hanches et les genoux fléchis à environ 90 degrés, les jambes superposées. Reposez votre tête sur votre bras inférieur.

  Exécution :
  1. En maintenant les genoux collés l'un contre l'autre, levez le pied supérieur vers le haut en rotation interne de la hanche.
  2. Marquez un arrêt d'une seconde en haut du mouvement pour bien ressentir la contraction des fessiers et rotateurs profonds.
  3. Redescendez lentement le pied jusqu'à la position de départ.
  4. Effectuez toutes les répétitions puis changez de côté.

  Conseils :
  Gardez le bassin bien fixe et perpendiculaire au sol ; ne laissez pas les hanches basculer vers l'avant ou l'arrière.
