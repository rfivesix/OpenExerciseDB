name: Rowing Meadows
description: |-
  Le rowing Meadows est un tirage unilatéral réalisé avec un montage landmine, en prise pronation et avec une position décalée des pieds. Penchez votre torse vers l'avant et saisissez la barre. Posez l'autre avant-bras sur la jambe avant. Amorcez le mouvement en poussant le coude vers l'arrière tout en rétractant l'omoplate. Gardez l'épaule qui travaille basse. Tirez en direction de votre hanche arrière jusqu'à ce que le coude arrive au niveau de votre torse.
