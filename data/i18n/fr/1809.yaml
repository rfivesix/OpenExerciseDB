name: Hyperextension inversée
description: "Position de départ :\nAllongez-vous à plat ventre sur un banc plat ou\
  \ une machine à hyperextensions inversées, les hanches au bord du banc et les jambes\
  \ pendantes vers le sol. Tenez fermement le banc avec les mains pour stabiliser\
  \ le haut du corps.\n\nExécution :\n1. Contractez les fessiers et les ischio-jambiers\
  \ pour soulever les jambes vers l'arrière et le haut avec contrôle.\n2. Montez jusqu'à\
  \ ce que les jambes soient alignées avec le tronc en serrant fort les fessiers en\
  \ haut.\n3. Redescendez lentement les jambes vers la position de départ sans à-coups.\n\
  \nConseils :\nNe cambrez pas exagérément les lombaires ; le mouvement doit résulter\
  \ d'une pure extension de hanche."
