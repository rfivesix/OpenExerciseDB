exercise_id: '1205'
language: fr
status: ai_reviewed
name: Curl des poignets avec haltères
description: |-
  Position de départ :
  • Asseyez-vous sur un banc, un haltère dans chaque main en prise supination (paumes vers le haut).
  • Posez vos avant-bras à plat sur vos cuisses, les poignets dépassant au-delà des genoux.

  Exécution :
  • Laissez descendre lentement les haltères en étendant les poignets vers le bas.
  • Enroulez vos poignets vers le haut avec puissance pour solliciter les fléchisseurs de l'avant-bras.
  • Marquez une courte pause en haut de la contraction puis redescendez lentement à la position de départ.
