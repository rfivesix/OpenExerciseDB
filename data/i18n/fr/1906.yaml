name: Pont fessier avec extension alternée des jambes
description: 'Position de départ :

  Allongez-vous sur le dos sur un tapis, les genoux fléchis et les pieds posés sur les talons à la largeur du bassin. Placez les bras le long du corps.


  Exécution :

  Poussez sur les talons pour soulever le bassin jusqu''à aligner les cuisses et le tronc. En maintenant le bassin en position haute, tendez une jambe vers l''avant dans le prolongement de la cuisse. Reposez le pied au sol et effectuez immédiatement la même extension avec l''autre jambe.


  Conseils :

  Gardez les fessiers et les abdominaux contractés en continu pour éviter que le bassin ne s''affaisse ou ne pivote lors des changements de jambe.'
