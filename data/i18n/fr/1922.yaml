name: Écarté à la poulie assis (pectoraux)
description: 'Position de départ :

  Installez un banc vertical centré entre deux poulies réglées à hauteur de poitrine. Asseyez-vous le dos bien calé contre le dossier et saisissez les poignées en prise neutre.


  Exécution :

  Ramenez les mains l''une vers l''autre devant la poitrine dans un mouvement d''étreinte circulaire, coudes légèrement fléchis. Contractez puissamment les pectoraux au centre, puis ouvrez lentement les bras avec contrôle jusqu''à sentir un étirement complet de la poitrine avant d''enchaîner.


  Conseils :

  Conservez le même angle de flexion au niveau des coudes et gardez les omoplates bien plaquées contre le dossier.'
