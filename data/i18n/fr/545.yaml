description: |-
  Les ciseaux sont un exercice abdominal qui renforce le transverse de l'abdomen, ce qui aide à aplatir le ventre et à renforcer toute la sangle abdominale. Les ciseaux ne sont pas seulement un mouvement de renforcement du tronc, c'est aussi un excellent étirement pour vos ischio-jambiers et votre bas du dos. Tout le monde cherche de nouvelles façons de travailler le tronc, d'aplatir le ventre et d'améliorer la souplesse. Si vous apprenez à faire les ciseaux, vous obtiendrez tout cela réuni en un seul mouvement.
