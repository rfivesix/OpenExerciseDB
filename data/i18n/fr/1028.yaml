name: Rotation thoracique à quatre pattes à gauche
description: |-
  Position de départ :
  Mettez-vous à quatre pattes, les mains sous les épaules et les genoux sous les hanches. Main droite fermement appuyée au sol, placez la main gauche derrière la nuque, coude ouvert sur le côté.

  Étapes :
  1. À l'inspiration, tournez le haut du buste vers le bas en amenant le coude gauche vers le bras d'appui droit.
  2. À l'expiration, ouvrez la poitrine vers la gauche en dirigeant le coude gauche vers le haut en direction du plafond.
  3. Gardez le bassin stable et horizontal sans déhancher.
  4. Répétez le mouvement avec fluidité et contrôle.
