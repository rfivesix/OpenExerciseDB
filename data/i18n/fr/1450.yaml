name: Étirement du cobra
description: |-
  L'étirement du cobra est un exercice d'extension du dos qui aide à améliorer la souplesse de la colonne vertébrale et à soulager les tensions dans le bas du dos. Pour le réaliser, allongez-vous à plat ventre sur le sol, mains placées sous les épaules. Appuyez les paumes contre le sol et soulevez la poitrine tout en gardant les hanches au sol. Gardez les coudes légèrement fléchis et les épaules détendues. Maintenez l'étirement pendant quelques secondes, puis redescendez lentement. Cet exercice est bénéfique pour améliorer la posture et réduire la raideur du bas du dos.
