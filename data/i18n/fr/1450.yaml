name: Étirement du cobra (Cobra Stretch)
description: |-
  Position de départ :
  • Allongez-vous à plat ventre sur un tapis, jambes tendues vers l'arrière et dessus des pieds au sol.
  • Placez vos mains à plat sous les épaules, coudes serrés le long du buste.

  Exécution :
  • Poussez doucement sur vos paumes pour redresser le buste et décoller la poitrine, tout en gardant le bassin et les cuisses plaqués au sol.
  • Baissez les épaules vers l'arrière, loin des oreilles, en ouvrant la cage thoracique.
  • Maintenez la position pendant 15 à 30 secondes en respirant profondément.
  • Redescendez lentement la poitrine sur le tapis avec contrôle.
