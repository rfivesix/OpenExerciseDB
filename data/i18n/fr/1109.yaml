exercise_id: '1109'
language: fr
status: ai_authored
name: Curl concentration à la poulie
description: |-
  Position de départ :
  Placez un banc devant une poulie basse. Asseyez-vous, saisissez la poignée simple en prise supination (paume vers le haut) et calez l'arrière du bras contre la face interne de la cuisse.

  Étapes :
  1. Fléchissez le coude pour monter la poignée vers l'épaule en maintenant le haut du bras strictement fixe contre la cuisse.
  2. Marquez une contraction maximale du biceps en haut du mouvement sous la tension continue du câble.
  3. Contrôlez la descente en retenant la charge jusqu'à l'extension quasi-complète du bras.
  4. Complétez la série avant de passer à l'autre bras.
