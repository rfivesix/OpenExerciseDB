name: Crunchs bicyclette
description: |-
  Les crunchs bicyclette sont un exercice de gainage réalisé au sol. Allongez-vous sur le dos, les mains derrière la tête et les jambes tendues. Décollez les épaules du sol, ramenez un genou vers la poitrine et faites pivoter le torse de sorte que le coude opposé rejoigne le genou. Alternez les côtés dans un mouvement de pédalage, en veillant à garder des mouvements contrôlés et à solliciter la sangle abdominale tout au long de l'exercice.
