name: Développé scapulaire aux haltères (Trap press)
search_terms:
  - Trap press
  - Développé trapèzes
  - Serratus punch aux haltères
  - Protraction scapulaire avec haltère
description: |-
  Position de départ:
  Allongez-vous sur le dos sur un banc plat en tenant un haltère d'une main. Tendez le bras verticalement vers le plafond directement au-dessus de votre épaule, le coude verrouillé ou presque tendu.

  Exécution:
  En gardant le bras parfaitement tendu sans fléchir le coude, poussez l'haltère vers le haut par une protraction de l'omoplate (en décollant l'omoplate du banc). Maintenez la contraction du grand dentelé (serratus anterior) un instant, puis rétractez lentement l'omoplate pour revenir en appui sur le banc.

  Conseils:
  - Le mouvement doit provenir exclusivement de l'omoplate et non d'une flexion ou extension du coude.
  - Gardez le buste stable et le dos bien plaqué contre le banc durant toute la répétition.
