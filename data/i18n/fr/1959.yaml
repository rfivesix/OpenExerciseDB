name: Étirement du piriforme assis
description: 'Position de départ :

  Asseyez-vous bien droit sur le bord d''une chaise ou d''un banc, pieds à plat sur le sol. Posez la cheville d''une jambe sur le genou opposé en formant un quatre.


  Exécution :

  En gardant le dos bien droit et la poitrine fière, penchez-vous lentement vers l''avant à partir des hanches jusqu''à ressentir un étirement profond dans le fessier et le muscle piriforme. Maintenez la position de manière statique pendant 20 à 30 secondes en respirant calmement, puis changez de côté.


  Conseils :

  Fait partie de la routine Limber 11. Ne courbez pas le bas du dos; l''inclinaison doit se faire depuis le bassin pour cibler efficacement les rotateurs profonds de hanche.'
