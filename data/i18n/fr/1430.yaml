name: Maintien de disques en pince
description: |-
  Le maintien de disques en pince est un exercice de force de préhension conçu pour solliciter les avant-bras et améliorer l'endurance de la prise. Choisissez un ou deux disques (les disques à bords lisses conviennent le mieux) et serrez-les ensemble entre votre pouce et vos doigts. Tenez les disques avec le bras tendu le long du corps ou légèrement avancé devant vous. Maintenez la prise aussi longtemps que possible, en gardant les épaules relâchées et la prise ferme. Cet exercice peut se faire pour une durée donnée ou un nombre de répétitions.
