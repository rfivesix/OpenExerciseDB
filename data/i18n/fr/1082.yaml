name: Rowing penché avec rotation externe
description: |-
  Position de départ :
  Penchez le buste vers l'avant à partir des hanches en gardant le dos bien plat et les genoux légèrement fléchis. Laissez pendre vos bras verticalement vers le sol.

  Étapes :
  1. Tirez les coudes vers le haut jusqu'à hauteur d'épaules, les avant-bras restant orientés vers le sol à angle droit.
  2. En maintenant les coudes stables à hauteur d'épaules, pivotez les avant-bras vers le haut en rotation externe jusqu'à ce que les mains soient au niveau de la tête.
  3. Marquez une brève pause pour contracter la coiffe des rotateurs et les deltoïdes postérieurs.
  4. Contrôlez la descente des avant-bras puis tendez à nouveau les bras vers le bas.
