name: Pompes | Inclinées
description: |-
  Les pompes inclinées ciblent principalement les muscles de la poitrine (grand et petit pectoral), mais sollicitent aussi, dans une moindre mesure, les triceps, les épaules et la sangle abdominale. Comme le haut du corps est surélevé, la pompe inclinée sollicite moins les triceps que les pompes classiques, ce qui peut être bénéfique pour les personnes souhaitant cibler spécifiquement les muscles de la poitrine.
