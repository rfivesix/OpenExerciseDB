exercise_id: '1111'
language: fr
status: ai_reviewed
name: Pompes inclinées avec mains surélevées
description: |-
  Position de départ :
  Placez les mains un peu plus larges que les épaules sur un banc, une marche ou une surface stable surélevée. Reculez les pieds de façon à ce que le corps forme une ligne droite des talons à la tête.

  Étapes :
  1. Fléchissez les coudes et descendez la poitrine de manière contrôlée vers le bord de la surface surélevée.
  2. Descendez jusqu'à ce que la poitrine frôle le support en gardant les coudes orientés à 45 degrés du buste.
  3. Repoussez fermement à l'aide des pectoraux et des triceps pour revenir en position haute.
  4. Conservez un gainage abdominal solide tout au long de la répétition.
