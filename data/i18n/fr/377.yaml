name: Relevés de jambes, allongé
description: |-
  Allongez-vous sur un banc et tenez-vous au dossier avec les mains pour rester stable. Gardez vos jambes tendues et levez-les jusqu'à ce qu'elles forment un angle d'environ 45°. Marquez une courte pause d'une seconde et redescendez lentement à la position initiale. Pour augmenter l'intensité, vous pouvez marquer une pause plus longue de 7 secondes toutes les 5 répétitions.
