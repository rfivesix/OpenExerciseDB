exercise_id: '83'
language: fr
status: human
name: Rowing buste penché
description: |-
  En tenant une barre en prise pronation (paumes tournées vers le bas), fléchissez légèrement les genoux et penchez le buste vers l'avant en vous inclinant au niveau de la taille, tout en gardant le dos droit, jusqu'à ce qu'il soit presque parallèle au sol. Conseil : veillez à garder la tête relevée. La barre doit pendre directement devant vous, vos bras étant perpendiculaires au sol et à votre buste. C'est votre position de départ.
  Maintenant, en gardant le buste immobile, expirez et tirez la barre vers vous. Gardez les coudes près du corps et n'utilisez que les avant-bras pour tenir la charge. En position de contraction maximale, en haut, contractez les muscles du dos et maintenez une brève pause.
  Inspirez ensuite et abaissez lentement la barre vers la position de départ.
  Répétez pour le nombre de répétitions recommandé.
