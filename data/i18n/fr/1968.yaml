name: Développé épaules unilatéral avec haltère
description: 'Position de départ :

  Debout, pieds à la largeur des épaules, tenez un haltère à hauteur d''épaule avec le coude sous le poignet. Posez la main libre sur la hanche pour stabiliser le tronc.


  Exécution :

  Développez l''haltère verticalement au-dessus de la tête dans un mouvement fluide jusqu''à tendre le bras sans verrouiller brutalement le coude. Gardez la sangle abdominale solide pour empêcher le buste de pencher. Redescendez lentement à hauteur d''épaule et effectuez toutes les répétitions avant de changer de bras.


  Conseils :

  Ce travail unilatéral renforce la stabilité du tronc (anti-inclinaison) et équilibre la force entre les deux épaules.'
