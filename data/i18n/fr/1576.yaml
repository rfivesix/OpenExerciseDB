name: Snap Down
description: 'Position de départ :

  Debout, tendez les deux bras au-dessus de la tête et montez sur la pointe des pieds
  en vous grandissant au maximum.


  Exécution :

  1. Abaissez les bras de façon explosive tout en fléchissant instantanément hanches
  et genoux pour vous immobiliser en position athlétique basse.

  2. Amortissez la réception sur toute la surface des pieds, torse droit et abdominaux
  gainés.

  3. Marquez un temps d''arrêt stable avant de vous redresser.'
