name: Pompes déclinées avec pieds surélevés
description: |-
  Position de départ :
  Posez les pieds sur un banc ou une boîte solide et placez les mains au sol à la largeur des épaules. Le corps forme une ligne droite inclinée de la tête aux talons.

  Étapes :
  1. Fléchissez les coudes et descendez le torse de manière contrôlée vers le sol.
  2. Gardez la sangle abdominale fermement gainée pour empêcher le bassin de s'affaisser.
  3. Descendez jusqu'à ce que le haut de la poitrine frôle le sol.
  4. Repoussez puissamment avec les pectoraux et les triceps pour remonter en position haute.
  5. Cette variante cible préférentiellement le faisceau claviculaire (haut des pectoraux).
