exercise_id: '1224'
language: fr
status: ai_reviewed
name: Drag curls aux haltères
description: |-
  Position de départ :
  • Tenez-vous debout, un haltère dans chaque main en prise supination (paumes vers l'avant).
  • Bras tendus devant les cuisses, épaules basses et torse bombé.

  Exécution :
  • Tirez les haltères verticalement vers le haut en les faisant glisser le long de votre torse tout en reculant les coudes.
  • Montez les charges jusqu'au niveau de la poitrine en les gardant au plus près du corps pour isoler les biceps.
  • Contractez fortement les biceps au sommet puis redescendez lentement le long du même trajet.
