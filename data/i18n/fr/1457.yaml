name: Développé convergent à la poulie (Press around)
description: |-
  Position de départ :
  • Réglez la poulie à hauteur de poitrine et attachez une poignée simple en D.
  • Saisissez la poignée en prise neutre près de la poitrine et orientez le buste à environ 45 degrés par rapport à la poulie en fente stable.

  Exécution :
  • Développez la poignée vers l'avant en travers de la ligne médiane du buste en décrivant une trajectoire convergente.
  • Contractez vigoureusement le grand pectoral au sommet de la course.
  • Revenez lentement sous contrôle en laissant le muscle pectoral s'étirer complètement avant la répétition suivante.
