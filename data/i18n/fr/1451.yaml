exercise_id: '1451'
language: fr
status: ai_reviewed
name: Étirement en rotation du tronc
description: |-
  Position de départ :
  • Tenez-vous debout, pieds à la largeur des épaules et genoux déverrouillés (ou assis le dos bien droit).
  • Croisez les bras sur la poitrine ou posez les mains sur les hanches.

  Exécution :
  • Tournez lentement le haut du corps vers un côté en maintenant le bassin et les hanches orientés droit devant.
  • Maintenez la rotation pendant 15 à 30 secondes en respirant calmement.
  • Revenez au centre avec contrôle et répétez de l'autre côté.
