name: Crunchs latéraux debout
description: |-
  Les crunchs latéraux debout sont un exercice dynamique qui cible les obliques tout en améliorant l'équilibre et la stabilité. Tenez-vous bien droit, les pieds écartés de la largeur des épaules et les mains derrière la tête, ou un haltère dans une main. Inclinez le torse d'un côté en contractant les obliques, tout en ramenant le coude vers la hanche (ou en crunchant vers la charge si vous utilisez un haltère). Revenez à la position de départ et alternez les côtés, ou effectuez toutes les répétitions d'un côté avant de changer.
