name: Hip Airplane (rotation de hanche)
description: |-
  Position de départ :
  Mettez-vous en équilibre sur une jambe (aidez-vous d'un appui fixe avec la main si nécessaire). Penchez le buste vers l'avant avec le dos droit tout en tendant l'autre jambe derrière vous, jusqu'à ce que le torse et la jambe soient parallèles au sol.

  Exécution :
  1. Faites pivoter lentement le bassin vers l'intérieur (rotation interne de hanche), en refermant la hanche libre vers le sol.
  2. Pivotez ensuite le bassin vers l'extérieur et le haut (rotation externe de hanche), en ouvrant largement la hanche vers le plafond.
  3. Revenez en position neutre de manière fluide et contrôlée, puis enchaînez les répétitions avant de changer de jambe.

  Conseils :
  Le mouvement doit provenir exclusivement de la hanche de la jambe d'appui. Gardez le pied bien ancré et le genou d'appui stable sans affaissement intérieur.
