name: Étirement du cou à droite
upstream:
  license: CC-BY-SA-4.0
  source_id: '1873'
translated_from: en
description: |-
  Position de départ :
  Assis ou debout, le dos bien droit.

  Étapes :
  1. Inclinez lentement la tête vers la droite en rapprochant l'oreille droite de l'épaule droite.
  2. Vous pouvez poser délicatement la main droite sur la tête pour accentuer légèrement l'étirement sans tirer.
  3. Maintenez la position quelques secondes en respirant profondément.
