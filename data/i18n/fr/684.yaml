name: Tirage vertical en supination
description: '- Asseyez-vous au poste de tirage vertical avec les cuisses calées sous
  les boudins de maintien.

  - Saisissez la barre en prise supination (paumes vers vous) à largeur d''épaules
  ou légèrement plus serré.

  - Tirez la barre vers le haut de la poitrine en ramenant les coudes vers le bas
  et l''arrière tout en contractant les dorsaux.

  - Remontez lentement la charge sous contrôle jusqu''à l''extension complète des
  bras.'
