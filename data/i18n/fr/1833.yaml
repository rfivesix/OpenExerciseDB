name: Curl des ischio-jambiers avec sliders au sol
description: "Position de départ :\nAllongez-vous sur le dos, les talons posés sur\
  \ des disques glissants (sliders) ou des serviettes. Montez le bassin en pont fessier\
  \ pour aligner les genoux, le bassin et les épaules.\n\nExécution :\n1. En gardant\
  \ le bassin surélevé, faites glisser lentement les talons vers l'avant jusqu'à ce\
  \ que les jambes soient presque entièrement tendues.\n2. Sans poser les fessiers\
  \ au sol, tirez vigoureusement sur les talons pour les ramener vers les fessiers\
  \ en contractant les ischio-jambiers.\n3. Poussez le bassin vers le haut au retour\
  \ sous les genoux.\n\nConseils :\nConservez les hanches hautes tout au long du mouvement\
  \ pour maintenir une tension constante sur les ischio-jambiers."
