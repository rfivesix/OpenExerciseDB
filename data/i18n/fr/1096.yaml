exercise_id: '1096'
language: fr
status: human
name: Abduction debout
description: |-
  Travailler une posture stable, principalement sur une seule jambe, est essentiel pour les deux côtés. D'une part, cela prévient les inconforts et, d'autre part, cela établit une base solide. Le pratiquant adopte la position debout habituelle et, le haut du corps stable, tente de lever à plusieurs reprises la jambe non chargée, de la fléchir au niveau de la hanche et du genou, puis de la rabaisser. Le mouvement est également répété de l'autre côté. L'exercice travaille la stabilité des muscles entourant la hanche.
