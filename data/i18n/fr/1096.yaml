name: Abduction de hanche debout
description: |-
  Position de départ :
  Tenez-vous debout le dos droit, une main posée sur un mur ou un support pour l'équilibre. Prenez appui fermement sur la jambe de soutien en gardant le bassin de niveau.

  Étapes :
  1. Décollez la jambe active et levez-la latéralement vers l'extérieur de manière contrôlée sans pencher le buste.
  2. Gardez la pointe de pied orientée vers l'avant pour solliciter le moyen fessier.
  3. Marquez une brève pause au sommet du mouvement en serrant la partie externe de la hanche.
  4. Redescendez la jambe lentement sans reposer complètement le pied au sol.
  5. Répétez le mouvement puis changez de côté.
