name: Développé couché avec pause
description: |-
  Abaissez la barre vers votre poitrine et marquez une pause (sans relâcher) de 2 secondes. Repoussez vers le haut. Utilisez le même poids que pour le développé couché classique, mais n'effectuez que des répétitions isolées. Faites au total le nombre de répétitions que vous feriez en une série de développé couché (si vous faisiez 3 séries de 8, faites 8 répétitions isolées de développé couché avec pause).
