name: Cercles avec les jambes au sol
description: 'Position de départ :

  Allongez-vous sur le dos sur un tapis et levez les jambes à la verticale en gardant les genoux et les pieds serrés. Bras posés au sol le long du corps.


  Exécution :

  Dessinez de petits cercles réguliers et contrôlés dans une direction avec les deux jambes réunies, sur une amplitude modérée en sollicitant intensément les abdominaux. Réalisez les répétitions prévues puis inversez le sens de rotation.


  Conseils :

  Gardez le bas du dos fermement plaqué contre le sol tout au long de l''exercice pour protéger les lombaires.'
