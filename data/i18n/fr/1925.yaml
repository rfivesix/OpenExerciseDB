name: Haussement d'épaules Silverback à la barre
description: 'Position de départ :

  Debout, pieds à la largeur des épaules, tenez la barre en prise pronation légèrement plus large que les épaules. Fléchissez légèrement les genoux et penchez le buste droit vers l''avant à environ 45 degrés. La barre pend verticalement à bras tendus.


  Exécution :

  Sans plier les coudes, haussez et resserrez les omoplates vers le haut et l''arrière en direction de la colonne vertébrale. Maintenez la contraction du trapèze moyen et des rhomboïdes pendant une seconde au sommet, puis redescendez la barre lentement sous contrôle.


  Conseils :

  Gardez le dos parfaitement plat et ne donnez pas d''élan avec les jambes ou les hanches.'
