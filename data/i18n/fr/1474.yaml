name: Relevé en W (W-Raise)
description: |-
  Position de départ :
  Allongez-vous sur le dos sur un tapis, les bras le long du corps pour la stabilité. Gardez les jambes tendues et légèrement décollées du sol.

  Exécution :
  1. En maintenant le gainage abdominal, levez les jambes en diagonale vers la gauche en décollant le bassin du sol (première branche du W inversé).
  2. Redescendez les jambes à mi-hauteur de manière contrôlée, amenez-les au centre et levez-les droit vers le haut en soulevant à nouveau les hanches.
  3. Redescendez à mi-hauteur puis levez les jambes en diagonale vers la droite.
  4. Inversez le parcours pour revenir au point de départ et continuez la séquence.

  Conseils :
  Gardez les abdominaux sous tension continue et évitez tout élan des jambes pour protéger le bas du dos.
