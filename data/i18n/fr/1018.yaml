name: Inclinaisons latérales de la tête
description: |-
  Position de départ :
  Asseyez-vous ou tenez-vous debout le dos droit, les épaules basses et détendues.

  Étapes :
  1. Inclinez lentement la tête sur le côté en rapprochant l'oreille de l'épaule, jusqu'à sentir un étirement modéré sur le côté opposé du cou.
  2. Maintenez la position pendant 15 à 30 secondes sans hausser les épaules.
  3. Revenez doucement au centre, puis répétez de l'autre côté.
