name: Étirement des épaules en extension assis
description: "Position de départ : Asseyez-vous au sol avec les mains posées derrière\
  \ vous, écartées de la largeur des épaules, doigts pointant vers l'arrière ou légèrement\
  \ vers l'extérieur.\nExécution : Gardez les bras tendus et faites glisser le bassin\
  \ et les pieds vers l'avant, amenant les épaules en extension jusqu'à ressentir\
  \ un étirement confortable dans les deltoïdes antérieurs et la poitrine.\nConseils\
  \ : Avancez uniquement jusqu'à une amplitude confortable sans douleur. Maintenez\
  \ la position pendant 20 à 30 secondes en respirant calmement."
