name: Parachutiste bras en T
description: |-
  Position de départ :
  • Allongez-vous à plat ventre sur un tapis avec les jambes plus écartées que la largeur des épaules.
  • Tendez les bras sur les côtés à hauteur des épaules pour former un T avec le torse.

  Exécution :
  • Décollez simultanément la poitrine, les bras et les jambes du sol en contractant toute la chaîne postérieure.
  • Tournez les pouces vers le plafond et serrez fortement les omoplates.
  • En maintenant le torse et les membres suspendus en l'air, resserrez puis écartez les jambes de façon continue et contrôlée.
  • Reposez le corps au sol avec contrôle à la fin de la série.
