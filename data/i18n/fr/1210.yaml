name: Superman avec bras en position T
description: |-
  Allongez-vous sur le ventre, les jambes plus écartées que la largeur des épaules et les pieds relevés. Vos bras sont tendus sur les côtés et forment un T avec le haut de votre corps, les paumes au sol. Soulevez maintenant le haut de votre corps, vos bras et vos jambes aussi haut que possible tout en gardant votre corps sous tension. Tournez vos pouces vers le plafond et rapprochez vos omoplates. Tout en gardant le haut de votre corps et tous vos membres en l'air, rapprochez vos jambes puis écartez-les de nouveau, en les maintenant constamment en l'air. Pour les répétitions restantes, ne bougez que vos jambes, en les ouvrant et en les fermant.
