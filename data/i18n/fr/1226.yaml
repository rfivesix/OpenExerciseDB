language: fr
status: ai_reviewed
name: Curl biceps et développé épaules aux haltères
description: |-
  Position de départ :
  • Tenez-vous debout avec les pieds à largeur de hanches, un haltère dans chaque main le long du corps.
  • Gardez le dos droit et la sangle abdominale bien engagée.

  Exécution :
  • Fléchissez les coudes pour exécuter un curl biceps et monter les haltères jusqu'aux épaules.
  • Enchaînez en tournant les paumes vers l'avant et développez les haltères au-dessus de la tête jusqu'à extension complète des bras.
  • Redescendez les haltères sous contrôle aux épaules, puis déroulez le curl pour revenir à la position de départ.
