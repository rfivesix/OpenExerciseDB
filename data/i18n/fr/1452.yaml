name: Étirement genou-poitrine
description: |-
  L'étirement genou-poitrine est un exercice simple mais efficace pour soulager les tensions du bas du dos et améliorer la mobilité des hanches. Pour le réaliser, allongez-vous à plat sur le dos, jambes tendues. Ramenez un genou vers la poitrine en enroulant les mains autour du tibia ou derrière la cuisse. Tirez doucement le genou plus près de la poitrine tout en gardant l'autre jambe tendue au sol. Maintenez l'étirement pendant 15 à 30 secondes, puis changez de côté. Pour un étirement plus profond, vous pouvez ramener les deux genoux vers la poitrine en même temps.
