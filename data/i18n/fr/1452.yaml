name: Étirement genou-poitrine
description: |-
  Position de départ :
  • Allongez-vous sur le dos sur un tapis de sol, jambes étendues et tête relâchée.

  Exécution :
  • Fléchissez un genou, saisissez le tibia ou l'arrière de la cuisse à deux mains et ramenez doucement le genou vers la poitrine.
  • Gardez l'autre jambe allongée au sol pour ressentir l'étirement au niveau du fessier et du bas du dos.
  • Maintenez la position pendant 20 à 30 secondes en respirant profondément, puis changez de jambe.
