name: Pas chassés latéraux avec squats
description: |-
  Position de départ :
  • Tenez-vous debout en position athlétique basse, pieds légèrement plus larges que les épaules.
  • Fléchissez les genoux et gardez le centre de gravité bas.

  Exécution :
  • Effectuez trois pas chassés latéraux rapides et contrôlés vers un côté en poussant avec la jambe d'appui.
  • Bloquez la position et réalisez un squat complet en gardant le dos droit.
  • Pivotez à 180 degrés ou changez immédiatement de direction pour répéter l'exercice de l'autre côté.
