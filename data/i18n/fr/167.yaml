name: Abdominaux
description: |-
  Position de départ :
  Allongez-vous sur le dos sur un tapis de sol, les genoux pliés à 90 degrés et les pieds à plat sur le sol à largeur de hanches. Placez les mains derrière la tête ou croisées sur la poitrine.

  Exécution :
  1. Enroulez la colonne vertébrale en décollant les épaules et le haut du dos du sol, en rapprochant les côtes du bassin.
  2. Contractez fortement les abdominaux au sommet du mouvement pendant une seconde.
  3. Redescendez lentement et sous contrôle sans relâcher complètement la tension abdominale, puis répétez.

  Conseils :
  Ne tirez pas sur la nuque avec les mains et gardez le bas du dos bien plaqué contre le sol.
