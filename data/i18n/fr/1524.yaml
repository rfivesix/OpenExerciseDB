name: Cordes ondulatoires
description: 'Tenez les extrémités de la corde à bout de bras devant vos hanches,
  les mains écartées de la largeur des épaules.

  Gainez vos abdominaux et commencez à lever et abaisser chaque bras en alternance,
  de manière explosive.

  Continuez à alterner les bras pendant trois à quatre séries de 1 à 2 minutes.'
