description: Le cyclisme, aussi appelé vélo, désigne l'utilisation de la bicyclette pour le transport, les loisirs, l'exercice
  ou le sport. Les personnes qui pratiquent le cyclisme sont appelées cyclistes. Outre les bicyclettes à deux roues, le cyclisme
  inclut également la pratique du monocycle, du tricycle, du quadricycle, du vélo couché et d'autres véhicules à propulsion
  humaine similaires.
