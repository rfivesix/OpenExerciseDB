exercise_id: '1198'
language: fr
status: ai_authored
name: Rowing inversé
description: |-
  Position de départ :
  • Réglez une barre à hauteur de hanches dans un rack ou utilisez un appareil guidé.
  • Placez-vous sur le dos sous la barre et saisissez-la en pronation à une largeur supérieure à celle des épaules.
  • Gardez les talons au sol et le corps parfaitement gainé et aligné de la tête aux pieds.

  Exécution :
  • Tirez votre poitrine vers la barre en tirant les coudes vers l'arrière et en resserrant les omoplates.
  • Gardez les fessiers et les abdominaux contractés pour maintenir le corps rigide.
  • Redescendez lentement sous contrôle jusqu'à extension complète des bras.
