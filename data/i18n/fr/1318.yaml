name: Montées de genoux sautées
description: 'Vous pouvez utiliser cet exercice aussi bien comme échauffement dynamique avant l''entraînement que l''ajouter
  à votre routine de cardio pour brûler des graisses.

  Les montées de genoux sautées sont un exercice pliométrique. La pliométrie regroupe des mouvements aérobiques explosifs
  qui augmentent la vitesse, la rapidité et la puissance, et qui sollicitent l''ensemble du corps.

  Les montées de genoux sautées ciblent les obliques, les muscles des jambes, les muscles des hanches et les fléchisseurs
  de hanche, et font aussi travailler les cuisses, les tendons du genou, les quadriceps et les épaules.

  Les sauts sont bénéfiques pour la santé car ils associent travail cardiovasculaire et renforcement musculaire. Comme les
  sauts font monter le rythme cardiaque, ils peuvent aussi améliorer votre condition cardiovasculaire.'
