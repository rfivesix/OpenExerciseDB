name: Maintien en appui aux barres parallèles
description: "Position de départ :\nPlacez-vous entre les barres parallèles. Saisissez\
  \ les barres en prise neutre et poussez sur les bras pour vous soulever en appui,\
  \ bras tendus.\n\nExécution :\n1. Poussez activement dans les barres pour abaisser\
  \ les épaules loin des oreilles (dépression des omoplates).\n2. Gainez les abdominaux\
  \ et les fessiers, jambes tendues et jointes.\n3. Maintenez cette position isométrique\
  \ stable pendant la durée requise avec une respiration contrôlée.\n4. Redescendez\
  \ au sol avec précaution une fois le temps écoulé.\n\nConseils :\nNe vous affaissez\
  \ pas dans les épaules ; maintenez un verrouillage solide des triceps et une posture\
  \ fière."
