name: Curl à la kettlebell à deux mains
description: |-
  Tenez-vous debout bien droit et saisissez la kettlebell à deux mains. Effectuez le mouvement de flexion du coude, en partant d'une position complètement tendue jusqu'à ce que votre main atteigne la hauteur des épaules. Écartez un peu les jambes pour la stabilité et, pour réaliser l'exercice correctement, essayez de ne pas pousser avec le dos ni avec le corps en général. Changez le poids de la kettlebell pour ajuster la difficulté.
