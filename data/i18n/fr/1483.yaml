name: Curl biceps trifecta
description: |-
  Position de départ :
  Tenez-vous debout, pieds à la largeur des épaules, en tenant un haltère dans chaque main, bras tendus le long du corps.

  Exécution :
  Cet exercice enchaîne trois variantes de curl au cours d'une même série :
  1. Curl en supination en travers du corps : Tournez la paume vers le haut et montez l'haltère en diagonale vers l'épaule opposée.
  2. Curl en pronation en travers du corps : Tournez la paume vers le bas (prise pronation) et montez l'haltère vers l'épaule opposée pour solliciter le brachial et le long supinateur.
  3. No Money Curl : Effectuez le curl en réalisant une rotation externe des épaules et en écartant les mains vers l'extérieur pour un pic de contraction optimal.

  Conseils :
  Enchaînez les répétitions avec régularité et contrôle pour maintenir une tension continue sur les fléchisseurs du bras.
