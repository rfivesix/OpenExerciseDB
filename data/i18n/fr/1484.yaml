name: Écarté à la poulie vis-à-vis omni (Omni Cable Crossover)
description: |-
  Position de départ :
  Réglez une poulie en position haute et l'autre en position basse sur la double tour de câbles. Placez-vous au centre avec les pieds décalés pour la stabilité et tenez les deux poignées.

  Exécution :
  1. Pour le câble bas, tirez vers le haut et en diagonale à travers le buste pour solliciter le haut des pectoraux.
  2. Pour le câble haut, ramenez-le vers le bas et en diagonale vers l'avant pour recruter le bas des pectoraux.
  3. En fin de série, inversez la hauteur des poulies pour équilibrer le travail de chaque côté de la poitrine.

  Conseils :
  Adaptez la charge à l'angle : la trajectoire descendante permet généralement de charger 20 à 40 % de plus que la trajectoire ascendante.
