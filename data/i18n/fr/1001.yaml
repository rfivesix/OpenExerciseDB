translated_from: en
description: |-
  Position de départ :
  Placez-vous en position de planche haute : les mains au sol directement sous les épaules et les orteils en appui. Les pieds sont joints et les bras tendus.

  Étapes :
  1. Maintenez le corps parfaitement aligné de la tête aux talons en contractant les abdominaux et les fessiers.
  2. Respirez régulièrement sans laisser le bassin s'affaisser ni monter.
  3. Conservez la position pendant la durée prévue.
