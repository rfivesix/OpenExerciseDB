exercise_id: '161'
language: fr
status: upstream_unreviewed
name: Pullover avec haltère en travers du banc
description: |-
  Saisissez un haltère de poids modéré de manière à ce que vos paumes soient à plat contre la face inférieure des disques supérieurs et que vos pouces entourent la barre. Allongez-vous sur le dos en travers d'un banc plat, de sorte que seuls le haut de votre dos et vos épaules soient en contact avec le banc. Vos pieds doivent être écartés d'environ la largeur des épaules et votre tête doit pendre légèrement vers le bas. L'haltère étant tenu à bout de bras directement au-dessus de votre poitrine, fléchissez les bras d'environ 15 degrés et gardez-les fléchis pendant tout le mouvement. Abaissez lentement l'haltère vers l'arrière et vers le bas en décrivant un arc de cercle, jusqu'à la position la plus basse confortablement possible. Relevez-le lentement le long du même arc jusqu'au point de départ, puis répétez le nombre de répétitions requis.
