name: Rowing assis à la poulie basse
description: |-
  Position de départ :
  Installez-vous sur le banc de tirage assis et calez fermement les pieds sur les repose-pieds, genoux légèrement fléchis. Penchez-vous en avant dos droit pour saisir la poignée en V, puis redressez le buste à la verticale.

  Étapes :
  1. Tirez la poignée vers le bas du ventre en gardant les coudes près du corps et en les menant vers l'arrière.
  2. Resserrez fortement les omoplates en fin de course pour engager les grands dorsaux et les rhomboïdes.
  3. Gardez le buste stable sans vous balancer excessivement vers l'avant ou l'arrière.
  4. Laissez les bras s'allonger lentement avec contrôle pour ressentir l'étirement dorsal avant la répétition suivante.
