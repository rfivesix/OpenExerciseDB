name: Thruster
description: '- Tenez la barre en position de rack avant sur les clavicules et les
  épaules, debout pieds à la largeur des épaules.

  - Descendez en squat avant complet jusqu''à ce que les cuisses soient au moins parallèles
  au sol.

  - Remontez de manière explosive en utilisant la poussée des jambes pour développer
  la barre au-dessus de la tête en un mouvement fluide continu.

  - Redescendez la barre sous contrôle sur les épaules et enchaînez immédiatement
  avec la répétition suivante.'
