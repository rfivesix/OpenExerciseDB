name: Abduction des hanches à la machine
description: "Position de départ :\nAsseyez-vous sur la machine à abductions avec\
  \ le dos fermement calé contre le dossier. Placez la face externe de vos cuisses\
  \ et de vos genoux contre les coussins d'appui. Posez vos pieds sur les repose-pieds\
  \ et tenez les poignées latérales pour fixer le bassin.\n\nExécution :\n1. Écartez\
  \ puissamment les jambes vers l'extérieur en poussant contre les coussins avec la\
  \ force du moyen fessier.\n2. Atteignez l'écartement maximal et maintenez la contraction\
  \ de pointe pendant 1 à 2 secondes.\n3. Revenez lentement et sous contrôle vers\
  \ la position centrale sans laisser les plaques de poids se reposer.\n\nConseils\
  \ :\nGardez le dos et les hanches plaqués contre le siège sans balancer le buste."
