name: Développé incliné à la Smith machine
description: 'Position de départ : Allongez-vous sur un banc légèrement incliné (15
  à 30 degrés) placé dans la Smith machine. Saisissez la barre avec une prise supérieure
  à la largeur des épaules, déverrouillez-la et maintenez-la au-dessus du haut de
  la poitrine.

  Exécution : Descendez la barre de façon lente et contrôlée jusqu''à effleurer le
  haut des pectoraux ou les clavicules.

  Retour : Poussez la barre vers le haut le long des guides jusqu''à l''extension
  presque complète des bras, en concentrant la contraction sur le haut de la poitrine.'
