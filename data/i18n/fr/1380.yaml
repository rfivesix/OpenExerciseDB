exercise_id: '1380'
language: fr
status: ai_reviewed
name: Pull-apart avec élastique
description: |-
  Position de départ :
  Tenez-vous debout, les pieds écartés de la largeur des hanches. Tenez un élastique à deux mains à largeur d'épaules devant votre poitrine, les bras tendus avec les coudes très légèrement fléchis et les paumes tournées vers le sol ou face à face.

  Mouvement :
  Écartez l'élastique en ouvrant les bras latéralement vers l'arrière et en resserrant fermement les omoplates jusqu'à ce que l'élastique touche votre poitrine. Maintenez la contraction du haut du dos et de l'arrière de l'épaule un court instant, puis revenez lentement à la position de départ.

  Conseils :
  Ne haussez pas les épaules vers les oreilles et ne cambrez pas le dos. Gardez le tronc gainé tout au long du mouvement.
