exercise_id: '1017'
language: fr
status: ai_reviewed
name: Demi-cercles du cou
description: |-
  Position de départ :
  Asseyez-vous ou tenez-vous debout le dos droit, épaules basses et relâchées. Inclinez délicatement la tête vers une épaule.

  Étapes :
  1. Faites rouler doucement la tête vers l'avant, le menton descendant vers la poitrine pour décrire un demi-cercle jusqu'à l'épaule opposée.
  2. Inversez le mouvement en faisant repasser le menton devant le buste pour revenir au côté initial.
  3. Répétez ce mouvement de balancier fluide sans jamais rejeter la tête en arrière.
