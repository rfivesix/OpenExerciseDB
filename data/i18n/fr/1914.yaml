name: Maintien isométrique aux barres parallèles (Support Hold)
description: 'Position de départ :

  Placez-vous entre les barres parallèles à dips. Saisissez les poignées et poussez fermement vers le bas pour tendre les bras et décoller les pieds du sol.


  Exécution :

  Maintenez cette position de suspension statique les bras tendus sans verrouillage excessif des coudes. Abaissez activement les épaules en les éloignant des oreilles, bombez le torse et gainez les abdominaux et les fessiers. Tenez la position pendant la durée prévue.


  Conseils :

  Ne laissez pas les épaules remonter vers les oreilles; gardez une dépression scapulaire forte et continue.'
