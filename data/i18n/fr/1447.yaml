name: "Arraché d'haltérophilie (Snatch)"
description: |-
  Position de départ :
  • Placez-vous devant la barre, pieds à largeur de hanches, et prenez une prise très large (prise crochetée / snatch grip).
  • Dos droit, poitrine ouverte, épaules légèrement en avant de la barre.

  Exécution :
  • Décollez la barre du sol avec régularité en la maintenant au plus près des tibias et des cuisses.
  • Dès que la barre atteint le pli de l'aine, effectuez une triple extension explosive pour projeter la charge vers le haut.
  • Chutez instantanément sous la barre en squat complet overhead pour la verrouiller bras tendus au-dessus de la tête.
  • Stabilisez l'assise puis redressez-vous jusqu'à l'extension complète du corps en maintenant la barre verrouillée.
