name: Étirement du cou à gauche
upstream:
  license: CC-BY-SA-4.0
  source_id: '1861'
translated_from: en
description: |-
  Position de départ :
  Assis ou debout, le dos bien droit.

  Étapes :
  1. Inclinez lentement la tête vers la gauche en rapprochant l'oreille gauche de l'épaule gauche.
  2. Vous pouvez poser délicatement la main gauche sur la tête pour accentuer légèrement l'étirement sans tirer.
  3. Maintenez la position quelques secondes en respirant profondément.
