exercise_id: '1442'
language: fr
status: ai_reviewed
name: Kreis Press aux haltères
description: |-
  Position de départ :
  • Asseyez-vous sur un banc incliné à 45 degrés et tenez deux haltères bras tendus au-dessus de la tête.

  Exécution :
  • Abaissez les haltères en décrivant un arc de cercle vers l'extérieur jusqu'au niveau des épaules.
  • Repoussez les haltères vers le haut en décrivant un mouvement circulaire régulier pour les ramener au-dessus de la tête.
  • Conservez une trajectoire fluide et sous contrôle pour maintenir la tension sur les deltoïdes antérieurs et latéraux.
