name: Pompes prise serrée
description: |-
  Placez-vous dans une position de planche solide, en rapprochant les mains jusqu'à ce qu'elles se touchent presque (image 1). Pliez les coudes pour amener lentement votre poitrine vers le sol (image 2). Gardez les coudes près du corps tout en poussant de manière explosive pour remonter. Répétez. Veillez à prendre votre temps à la descente de chaque répétition, en gardant une exécution irréprochable.
