name: Pompes en prise serrée
description: |-
  Position de départ :
  Installez-vous en position de planche haute avec les mains rapprochées sous la poitrine (largeur inférieure à celle des épaules). Le corps est parfaitement aligné de la tête aux talons.

  Étapes :
  1. Fléchissez les coudes en les gardant collés le long des côtes et descendez le corps de manière contrôlée.
  2. Descendez jusqu'à ce que la poitrine frôle les mains.
  3. Repoussez le sol avec force en engageant principalement les triceps pour remonter en position initiale.
  4. Conservez un gainage ferme sans cambrer le dos.
