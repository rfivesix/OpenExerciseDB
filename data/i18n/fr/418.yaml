name: Développé militaire à la barre EZ
description: |-
  Sur une barre EZ, placez vos mains à l'extérieur de chaque courbure et tenez-vous debout, les bras tendus vers le bas, paumes tournées vers vos jambes. Tirez la barre vers votre poitrine (en pliant les bras au niveau des coudes), puis poussez la barre au-dessus de votre tête (bras aussi tendus que possible). Ramenez la barre vers votre poitrine en abaissant vos bras par les coudes. Ramenez la barre à sa position d'origine (debout, les bras tendus vers le bas, paumes tournées vers vos jambes).
