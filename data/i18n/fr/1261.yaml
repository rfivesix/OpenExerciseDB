name: Curl biceps gorille au TRX
description: |-
  Nous nous tiendrons face aux sangles du TRX et les saisirons les poings se faisant face, dirigés vers l'avant, les bras complètement tendus et écartés d'environ la largeur des épaules. Nous garderons notre corps droit, incliné vers l'arrière, comme dans les exercices précédents, puisque nous soulèverons notre corps vers les sangles du TRX en activant nos biceps. Notre corps sera droit, les pieds à plat sur le sol. Cette fois, nous placerons nos bras ouverts sur les côtés et à hauteur de poitrine. Le mouvement à réaliser est une contraction vers la poitrine. Pour cela, nous plierons les coudes afin que, en activant nos biceps, nous puissions tirer notre corps vers les sangles.
