name: Rotation externe à la poulie
description: |-
  Position de départ :
  Réglez la poulie à hauteur de coude. Placez-vous de profil par rapport à la tour de poulies et saisissez la poignée avec la main la plus éloignée (bras extérieur). Fléchissez le coude à 90 degrés et gardez-le bien calé contre le flanc.

  Exécution :
  1. En gardant le coude fixe contre le corps, pivotez l'avant-bras vers l'extérieur de manière à effectuer une rotation externe de l'épaule.
  2. Marquez un temps d'arrêt en fin de mouvement en contractant la coiffe des rotateurs.
  3. Revenez lentement à la position de départ en contrôlant le retour.

  Conseils :
  Ne tournez pas le buste ; le mouvement doit provenir exclusivement de l'articulation de l'épaule.
