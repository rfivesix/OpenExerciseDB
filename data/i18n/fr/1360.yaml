exercise_id: '1360'
language: fr
status: ai_reviewed
name: Épaulé-développé avec deux kettlebells
description: |-
  Position de départ :
  Debout, pieds écartés de la largeur des épaules, placez deux kettlebells entre vos pieds. Fléchissez les hanches en gardant le dos droit et saisissez les poignées.

  Mouvement :
  1. Épaulé (Clean) : Déployez les hanches de manière explosive pour amener les kettlebells le long du corps en position de rack contre la poitrine.
  2. Développé (Press) : Gainez fermement le tronc et les fessiers, puis poussez les kettlebells au-dessus de la tête jusqu'à l'extension complète des bras.
  3. Redescendez les kettlebells avec contrôle en rack, puis vers le sol.

  Conseils :
  Ne cambrez pas le bas du dos lors de la poussée au-dessus de la tête. La force de l'épaulé doit provenir de la poussée des hanches.
