name: Tirage vertical en supination (prise inversée)
description: 'Position de départ :

  Asseyez-vous au tirage vertical, les cuisses bien calées sous les boudins. Saisissez la barre en prise supination (paumes vers vous) à la largeur des épaules. Bombez le torse avec une légère cambrure naturelle.


  Exécution :

  Tirez la barre de façon fluide vers le haut de la poitrine en amenant les coudes vers le bas et légèrement vers l''arrière. Resserrez les omoplates et contractez le grand dorsal et les biceps en bas, puis laissez remonter la barre lentement jusqu''à extension complète des bras.


  Conseils :

  Ne balancez pas le buste vers l''arrière pour faciliter le tirage; conservez une posture solide et stable.'
