name: Tirage vertical en prise inversée
description: |-
  Le tirage vertical en prise inversée (plus connu sous le nom de tirage vertical en supination) est une variante de l'exercice classique qui utilise une prise en supination, mains écartées à la largeur des épaules. Cette position met davantage l'accent sur le bas du grand dorsal et sollicite davantage les biceps, permettant souvent une plus grande amplitude de mouvement et une contraction plus profonde en bas du mouvement.
