language: fr
status: ai_reviewed
name: Tirage vertical prise serrée
description: Saisissez la barre de tirage, les mains plus rapprochées que la largeur des épaules, les paumes tournées vers
  l'extérieur. Penchez-vous légèrement en arrière. Tirez la barre vers votre poitrine en gardant les coudes près des flancs
  pendant la descente. Rapprochez vos épaules en arrière à la fin du mouvement.
