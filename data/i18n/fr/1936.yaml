name: Oiseau à la poulie à un bras
description: 'Position de départ :

  Placez-vous de profil par rapport à la poulie réglée à hauteur d''épaule. Saisissez le câble avec la main extérieure en croisant devant le torse. Gardez le coude légèrement déverrouillé.


  Exécution :

  Tirez le câble vers l''extérieur et l''arrière dans un arc de cercle horizontal jusqu''à ce que le bras soit aligné avec l''épaule. Contractez fermement le deltoïde postérieur pendant une seconde, puis revenez lentement à la position de départ.


  Conseils :

  Gardez le buste immobile et les hanches de face pour éviter toute rotation compensatoire du tronc.'
