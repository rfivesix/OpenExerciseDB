name: Sit-up avec coup de coude (Sit Up Elbow Thrust)
description: |-
  Position de départ :
  Allongez-vous sur le dos sur un tapis, genoux fléchis, pieds au sol et mains en garde près du visage.

  Exécution :
  1. Relevez le buste de manière dynamique et explosive grâce à la contraction des abdominaux.
  2. Au sommet du relevé, effectuez une rotation du tronc et projetez énergiquement le coude vers l'avant et en diagonale.
  3. Revenez au centre et redescendez le dos au sol avec contrôle.
  4. Répétez en alternant le coup de coude du côté opposé à chaque répétition.

  Conseils :
  Liez la montée du buste à la frappe du coude pour combiner flexion et rotation du tronc.
