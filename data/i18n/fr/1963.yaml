name: Squat lent au tempo (Tempo Squat)
description: 'Position de départ :

  Debout, pieds écartés à la largeur des épaules, pointes légèrement ouvertes vers l''extérieur. Buste droit et bras tendus devant vous pour l''équilibre.


  Exécution :

  Descendez lentement en squat pendant 3 secondes en poussant les fesses vers l''arrière jusqu''à ce que les cuisses soient parallèles au sol. Marquez une pause isométrique de 2 secondes en bas sans relâcher la tension, puis remontez avec puissance en 1 seconde en poussant sur les talons.


  Conseils :

  Ce tempo strict (3 secondes de descente, 2 de pause, 1 de montée) décuple le temps sous tension et renforce la stabilité articulaire.'
