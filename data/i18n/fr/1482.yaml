name: Cheat curl aux haltères
description: |-
  Position de départ :
  Tenez-vous debout, pieds écartés à la largeur des épaules, en tenant un haltère lourd dans chaque main, bras tendus le long du corps en prise supination (paumes vers l'avant).

  Exécution :
  1. Utilisez un léger élan contrôlé des hanches et du torse pour amorcer le curl et franchir le point de blocage, amenant les haltères vers les épaules.
  2. Contractez fortement les biceps au sommet pendant un instant.
  3. Redescendez la charge de façon très lente et contrôlée (3 à 4 secondes) pour maximiser la surcharge excentrique.

  Conseils :
  L'élan contrôlé ne sert qu'à passer la montée afin d'imposer une tension maximale sur la phase négative du mouvement.
