name: Extensions du dos au banc à lombaires
description: |-
  Position de départ :
  Installez-vous face contre le banc à lombaires (chaise romaine), le haut des cuisses en appui sur les coussins et le bassin libre pour permettre la flexion. Calez bien vos chevilles sous les boudins. Croisez les bras sur la poitrine ou placez vos mains près des oreilles.

  Mouvement :
  Fléchissez le buste vers l'avant à partir des hanches en gardant la colonne vertébrale neutre. Redressez le buste de façon contrôlée en contractant les lombaires, les fessiers et les ischio-jambiers jusqu'à ce que votre corps forme une ligne droite.

  Conseils :
  N'hypercambrisez pas le dos en fin de mouvement. Effectuez la répétition sans à-coup.
