name: Russian Twist avec médecine-ball
description: |-
  Position de départ :
  Asseyez-vous sur un tapis, genoux fléchis, talons posés au sol ou pieds décollés pour plus d'intensité. Tenez un médecine-ball à deux mains devant la poitrine et inclinez le buste en arrière à environ 45 degrés en gardant le dos droit.

  Étapes :
  1. Engagez la sangle abdominale et pivotez le torse vers la droite pour amener le médecine-ball près de la hanche droite sans toucher le sol brutalement.
  2. Tournez de façon fluide de l'autre côté en passant par le centre pour amener la balle vers la hanche gauche.
  3. Gardez les jambes et le bassin stables afin que la rotation provienne des abdominaux obliques.
  4. Répétez le mouvement en alternance à un rythme régulier.
