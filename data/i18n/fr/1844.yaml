name: Étirement de la grenouille
description: "Position de départ : Mettez-vous à quatre pattes et écartez les genoux\
  \ vers l'extérieur autant que possible. Descendez en appui sur les avant-bras, dos\
  \ droit.\nExécution : En gardant la colonne vertébrale neutre, balancez lentement\
  \ le bassin vers l'arrière en direction des talons jusqu'à ressentir un étirement\
  \ profond dans les adducteurs.\nConseils : Effectuez un mouvement d'oscillation\
  \ lent et contrôlé ou maintenez la position basse pendant 20 à 30 secondes en respirant\
  \ calmement."
