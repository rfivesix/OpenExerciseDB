exercise_id: '1709'
language: fr
status: ai_reviewed
name: Oiseau debout
description: |-
  Tenez-vous debout avec une bonne posture, une poignée de poulie dans chaque main, face à la machine
  En partant les mains devant la poitrine, écartez les bras sur les côtés pour former un T, les coudes presque tendus
  Ramenez lentement les bras vers l'avant jusqu'à la position de départ
  Répétez en amenant les bras en forme de Y
  Répétez en amenant les bras en forme de W
  Répétez en amenant les bras en forme de L le long du corps
