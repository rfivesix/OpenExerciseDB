exercise_id: '369'
language: fr
status: upstream_unreviewed
name: Extension des jambes (leg extension)
description: |-
  L'extension des jambes est un exercice de musculation avec résistance qui cible les quadriceps des jambes. L'exercice se réalise à l'aide d'une machine appelée machine à extension des jambes. Il existe différents fabricants de ces machines et chacune est légèrement différente. La plupart des salles de sport et de musculation disposent de cette machine dans leurs installations. L'extension des jambes est un exercice isolé qui cible un groupe musculaire spécifique, les quadriceps. Il ne doit pas être considéré comme un entraînement complet des jambes, comme le squat ou le soulevé de terre. L'exercice consiste à fléchir la jambe au niveau du genou et à tendre les jambes, puis à les redescendre à la position initiale.
