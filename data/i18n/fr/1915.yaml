name: Abduction de hanche à quatre pattes (Fire Hydrant)
description: 'Position de départ :

  Positionnez-vous à quatre pattes sur un tapis, mains sous les épaules et genoux sous les hanches. Vous pouvez placer un élastique court juste au-dessus des genoux pour plus de résistance. Gainez le tronc.


  Exécution :

  En maintenant le genou plié à 90 degrés, levez une jambe vers l''extérieur jusqu''à ce que la cuisse soit presque parallèle au sol. Contractez le moyen fessier en haut sans tourner le bassin. Redescendez lentement sans reposer le genou au sol et enchaînez vos répétitions avant de changer de côté.


  Conseils :

  Gardez le dos parfaitement plat et horizontal pendant tout le mouvement sans incliner le buste.'
