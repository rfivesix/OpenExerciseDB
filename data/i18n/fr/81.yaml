name: Rowing avec haltères buste penché
description: |-
  Des haltères en main, penchez-vous au niveau des hanches jusqu'à ce que les mains pendent juste en dessous des genoux (position semblable à celle de départ du soulevé de terre jambes tendues). Gardez l'angle du haut du corps constant tout en contractant le grand dorsal pour tirer les coudes vers l'arrière, en rapprochant les omoplates en haut du mouvement. Essayez de ne pas vous redresser à chaque répétition, et vérifiez que les mains descendent bien sous les genoux à chaque répétition.
