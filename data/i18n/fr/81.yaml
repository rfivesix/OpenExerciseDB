name: Rowing à un bras avec haltère sur banc
search_terms:
- Rowing avec haltères buste penché
- Rowing unilatéral haltère
description: |-
  Position de départ :
  Posez un genou et la main du même côté sur un banc plat, le buste parallèle au sol et le dos droit. Posez le pied opposé fermement au sol. Saisissez un haltère avec le bras libre, bras tendu vers le bas.

  Exécution :
  1. Tirez l'haltère vers la hanche en guidant le mouvement avec le coude, près du corps.
  2. Contractez fortement le grand dorsal et serrez l'omoplate en haut du mouvement.
  3. Redescendez l'haltère lentement et de manière contrôlée jusqu'à l'étirement complet du dos.

  Conseils :
  Gardez le buste stable sans pivoter les épaules lors du tirage. Terminez la série d'un côté avant de changer.
