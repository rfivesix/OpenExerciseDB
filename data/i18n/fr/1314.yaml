name: Jumping Jack
description: 'Le jumping jack est un exercice pliométrique. La pliométrie regroupe des mouvements aérobiques explosifs qui
  augmentent la vitesse, la rapidité et la puissance, et qui sollicitent l''ensemble du corps.

  Le jumping jack cible les bras, les épaules, les abdominaux, les muscles des hanches et les fléchisseurs de hanche, et fait
  aussi travailler les cuisses, les tendons du genou et les quadriceps.

  Les sauts sont bénéfiques pour la santé car ils associent travail cardiovasculaire et renforcement musculaire. Comme les
  sauts font monter le rythme cardiaque, ils peuvent aussi améliorer votre condition cardiovasculaire.'
