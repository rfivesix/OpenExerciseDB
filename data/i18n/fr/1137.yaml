name: Pullover à la poulie haute
description: |-
  Position de départ :
  • Tenez-vous debout face à la poulie haute, pieds écartés à largeur d'épaules.
  • Saisissez la barre en pronation à largeur d'épaules, bras presque tendus avec les coudes très légèrement fléchis.
  • Inclinez légèrement le buste vers l'avant en gardant le dos bien droit et la sangle abdominale gainée.

  Exécution :
  • Abaissez la barre vers vos cuisses selon une trajectoire en arc de cercle en tirant avec le grand dorsal.
  • Marquez une pause en bas en contractant fortement les dorsaux contre les cuisses.
  • Remontez lentement jusqu'au niveau des yeux en contrôlant la trajectoire.
