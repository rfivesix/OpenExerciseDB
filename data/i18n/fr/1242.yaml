name: Flexion plantaire avec élastique
description: 'Position de départ :

  Asseyez-vous au sol, jambes tendues devant vous. Placez le milieu d''une bande élastique autour de l''avant-pied et tenez
  fermement les extrémités avec les mains pour créer une résistance.


  Exécution :

  1. Poussez la pointe du pied vers l''avant contre la résistance de l''élastique (flexion plantaire), en contractant fermement
  les mollets.

  2. Maintenez brièvement la contraction au point maximal.

  3. Revenez lentement et sous contrôle à la position de départ.'
