exercise_id: '1080'
language: fr
status: ai_reviewed
name: Pompes hindoues
description: |-
  Position de départ :
  Commencez en position de 'V' inversé (chien tête en bas), fesses levées vers le haut, mains légèrement plus larges que les épaules et pieds écartés de la largeur des hanches.

  Étapes :
  1. Fléchissez les coudes et plongez vers l'avant en rasant le sol avec le visage et la poitrine dans un mouvement d'arc circulaire.
  2. Repoussez le sol avec les bras pour redresser le buste en posture de cobra / chien tête en haut, la poitrine fière.
  3. Renvoyez les hanches vers l'arrière et vers le haut pour retrouver la position de départ en V inversé.
  4. Répétez ce cycle de manière fluide et rythmée.
