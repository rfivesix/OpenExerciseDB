exercise_id: '1080'
language: fr
status: human
name: Pompes hindoues
description: |-
  Exercice destiné à renforcer les épaules et les pectoraux. Son nom vient du fait qu'il débute dans la posture de yoga « chien tête en bas », passe à la posture du « cobra » mais sans poser les jambes ni le buste au sol, pour finir enfin par une pompe classique. L'exercice peut aussi être exécuté en sens inverse (retour à la position de départ). Comme variante, après avoir réalisé la pompe, on peut lever les hanches pour revenir à la posture du chien tête en bas.
