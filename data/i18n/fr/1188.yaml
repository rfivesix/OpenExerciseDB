exercise_id: '1188'
language: fr
status: ai_reviewed
name: Flexion latérale du buste avec haltère
description: |-
  Position de départ :
  • Tenez-vous debout, les pieds à largeur des hanches, un haltère dans une main le long de la cuisse.
  • Placez votre main libre derrière la tête ou sur la hanche opposée.
  • Gardez le dos droit et la sangle abdominale engagée.

  Exécution :
  • Inclinez lentement le buste strictement sur le côté vers le bras tenant l'haltère. Ne faites aucune rotation du torse vers l'avant ou l'arrière !
  • Utilisez la force des obliques du côté opposé pour redresser le buste jusqu'à la position verticale.
  • Effectuez toutes les répétitions de manière fluide, puis changez de côté.
