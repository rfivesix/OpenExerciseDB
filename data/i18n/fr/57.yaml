name: Marche de l'ours
search_terms:
- Marche de l'ours 2
description: |-
  Position de départ :
  Mettez-vous à quatre pattes, les mains sous les épaules et les genoux sous les hanches. Décollez les genoux du sol de quelques centimètres en gardant le dos bien plat et la sangle abdominale engagée.

  Exécution :
  1. Avancez simultanément la main droite et le pied gauche.
  2. Enchaînez en avançant la main gauche et le pied droit dans un mouvement controlatéral coordonné.
  3. Progressez à un rythme régulier sur une distance définie ou pendant un temps imparti.

  Conseils :
  Gardez le bassin bas et parallèle au sol, sans vous balancer excessivement de gauche à droite.
