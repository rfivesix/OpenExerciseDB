name: Pompes lestées
description: "Mise en place : Commencez en position de planche classique avec un disque\
  \ de poids posé de façon stable sur le haut du dos.\nAlignement : Maintenez une\
  \ ligne droite de la tête aux talons, en engageant la sangle abdominale pour éviter\
  \ que le dos ne s'affaisse.\nExécution : Abaissez votre corps jusqu'à ce que la\
  \ poitrine touche presque le sol, en gardant les coudes à quarante-cinq degrés.\n\
  Montée : Poussez à travers les paumes pour revenir à la position de départ, en tendant\
  \ complètement les bras."
