name: Rotation du torse
description: |-
  Exercice de rotation du torse debout. Ciblez vos abdominaux et améliorez votre souplesse avec cet exercice dynamique debout ! L'exercice de rotation du torse debout consiste à faire pivoter votre torse tout en gardant les pieds et les hanches stables, en sollicitant vos obliques et en étirant l'ensemble du haut de votre corps. Ce mouvement permet de : renforcer la sangle abdominale ; augmenter la souplesse de la colonne vertébrale et du torse ; améliorer la posture et l'équilibre ; améliorer les performances athlétiques globales. Réalisez 3 séries de 10 à 15 répétitions, en pivotant de chaque côté, pour ressentir les bienfaits de cet exercice efficace et complet !
