name: Rotation du buste debout
description: |-
  Position de départ :
  Debout, pieds écartés de la largeur des épaules et genoux légèrement déverrouillés. Gardez le bassin stable face vers l'avant et croisez les bras sur la poitrine ou placez les mains derrière la tête.

  Mouvement :
  Faites pivoter votre buste de manière fluide d'un côté en engageant les obliques, tout en maintenant les hanches et le bas du corps immobiles. Marquez un temps d'arrêt en fin de course, revenez au centre, puis pivotez du côté opposé à un rythme régulier.

  Conseils :
  La rotation doit être guidée par la cage thoracique et les abdominaux, sans torsion excessive de la colonne lombaire ni mouvement des hanches.
