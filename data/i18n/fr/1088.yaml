name: Soulevé de terre sumo avec haltère
description: |-
  Position de départ :
  Prenez une position très large (1,5 à 2 fois la largeur des épaules) avec les pointes de pieds orientées à environ 45 degrés vers l'extérieur. Placez un haltère lourd posé à la verticale sur le sol entre vos pieds.

  Étapes :
  1. Fléchissez les hanches et les genoux en gardant le torse fier et le dos plat pour saisir la tête supérieure de l'haltère à deux mains.
  2. Poussez fort dans le sol à travers les talons pour vous redresser complètement en position debout.
  3. Contractez puissamment les fessiers et les adducteurs au sommet du mouvement.
  4. Redescendez l'haltère de façon contrôlée jusqu'à effleurer le sol avant d'enchaîner.
