name: Soulevé de terre sumo avec haltère
description: |-
  Abaissez votre haltère au sol entre vos jambes. Adoptez une position large et, le dos droit, accroupissez-vous. L'haltère posé à la verticale, saisissez-le par le haut de la « tête » (image 1). En gardant la poitrine relevée et la sangle abdominale gainée, repoussez le sol pour vous redresser jusqu'à la position debout (image 2). Répétez. Si vous atteignez facilement 20 à 30 répétitions, utilisez deux haltères.
