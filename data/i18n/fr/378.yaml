name: Relevés de jambes, debout
description: |-
  Placez vos avant-bras sur les coussinets de la machine à relevés de jambes, le corps est suspendu librement. Levez maintenant vos jambes par un mouvement rapide aussi haut que possible, marquez une courte pause d'une seconde en haut, puis redescendez-les. Assurez-vous que votre corps ne se balance pas pendant l'exercice, seules les jambes doivent bouger.
