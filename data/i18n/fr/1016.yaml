exercise_id: '1016'
language: fr
status: ai_reviewed
name: Cercles du cou dans le sens antihoraire
description: |-
  Position de départ :
  Asseyez-vous ou tenez-vous debout le dos droit, les épaules détendues. Amenez le menton doucement vers la poitrine.

  Étapes :
  1. Décrivez un cercle lent et régulier dans le sens antihoraire : inclinez la tête vers l'épaule gauche, passez avec précaution vers l'arrière, inclinez vers l'épaule droite et ramenez au menton.
  2. Gardez les muscles détendus et respirez naturellement.
  3. Répétez le mouvement pour le nombre de répétitions prévu.
