name: Rollout abdominal à la barre
description: |-
  Position de départ :
  À genoux sur un tapis, placez une barre chargée de disques devant vous au sol. Saisissez la barre en prise pronation avec les mains écartées à la largeur des épaules.

  Exécution :
  1. En maintenant les abdominaux et les fessiers fermement gainés, faites rouler la barre lentement vers l'avant jusqu'à ce que votre corps soit étiré en ligne droite.
  2. Marquez une brève pause au point d'extension maximale sans cambrer le bas du dos.
  3. Utilisez la force de vos abdominaux pour ramener la barre vers vos genoux et revenir à la position de départ.

  Conseils :
  Ne laissez jamais votre bassin s'affaisser et gardez les bras tendus sans verrouiller excessivement les coudes.
