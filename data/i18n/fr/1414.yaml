exercise_id: '1414'
language: fr
status: human
name: Hack squats
description: |-
  Les hack squats ciblent le bas du corps et se réalisent sur une machine à hack squat ou avec une barre. Pour la variante à la machine, placez-vous sur la plateforme, les épaules sous les coussinets et les pieds légèrement avancés. Poussez sur vos talons pour soulever la charge, puis fléchissez les genoux pour abaisser la plateforme de manière contrôlée jusqu'à ce que vos cuisses soient parallèles au sol. Remontez à la position de départ. Pour la variante à la barre, tenez la barre derrière vos jambes, les bras tendus, et effectuez un mouvement semblable à un squat.
