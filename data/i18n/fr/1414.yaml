name: Hack squat à la machine
description: |-
  Position de départ :
  Installez-vous sur la machine à hack squat avec le dos et la tête bien plaqués contre le dossier et les épaules calées sous les boudins rembourrés. Placez les pieds écartés de la largeur des épaules sur le plateau. Désengagez les butées de sécurité.

  Mouvement :
  Fléchissez les genoux et descendez le plateau de manière contrôlée jusqu'à ce que vos cuisses soient au moins parallèles au plateau. Poussez puissamment sur les talons pour remonter à la position initiale, sans verrouiller brutalement les genoux en haut.

  Conseils :
  Gardez le bas du dos constamment plaqué contre le dossier. Ne décollez pas les talons du plateau pendant la descente.
