description: 'Position de départ :

  Debout ou assis bien droit, abaissez activement les épaules vers l''arrière et gainez le buste pour éviter toute compensation corporelle.


  Exécution :

  Rentrez le menton vers la poitrine. Faites glisser le menton le long de la clavicule droite, inclinez l''oreille droite vers l''épaule droite, puis basculez la tête vers l''arrière en décrivant un arc fluide sans pincer les cervicales. Poursuivez vers l''épaule gauche, ramenez le menton le long de la clavicule gauche et terminez au centre. Faites 3 cercles lents d''un côté puis inversez.


  Conseils :

  Restez strictement dans une amplitude non douloureuse et veillez à ne bouger que le cou sans bouger le buste.'
