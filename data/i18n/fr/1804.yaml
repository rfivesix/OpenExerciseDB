name: Bascules en dorsiflexion de la cheville
description: "Position de départ :\nPlacez-vous en position de fente basse (un genou\
  \ au sol et le pied avant bien à plat sur le sol).\n\nExécution :\n1. Poussez lentement\
  \ le genou avant vers l'avant au-dessus des orteils en veillant à garder le talon\
  \ fermement collé au sol.\n2. Atteignez l'amplitude maximale de flexion de la cheville\
  \ et maintenez la position pendant 2 à 3 secondes.\n3. Revenez doucement en arrière\
  \ et répétez ce mouvement de balancement avant de changer de jambe.\n\nConseils\
  \ :\nLe talon ne doit jamais décoller du sol pour garantir une véritable mobilisation\
  \ de l'articulation de la cheville."
