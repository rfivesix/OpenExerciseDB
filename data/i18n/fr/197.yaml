name: Dips entre deux bancs
description: |-
  Disposez deux bancs suffisamment éloignés l'un de l'autre pour que vous puissiez vous appuyer sur l'un avec les mains tout en parvenant tout juste à atteindre l'autre avec les pieds. Les jambes restent complètement tendues pendant l'exercice. Les coudes orientés vers l'arrière, fléchissez-les autant que possible. Repoussez-vous vers le haut, mais sans tendre complètement les bras.
