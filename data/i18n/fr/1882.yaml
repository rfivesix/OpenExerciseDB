name: Élévation latérale à la poulie à hauteur de taille
description: "Tenez-vous à côté d'une machine à poulie réglée à hauteur de taille.\n\
  Saisissez la poignée du côté opposé avec la main la plus éloignée de la poulie,\
  \ en gardant la paume tournée vers l'intérieur.\nGardez la sangle abdominale engagée,\
  \ la poitrine ouverte et les épaules détendues. Maintenez une légère flexion du\
  \ coude pendant toute la montée.\nLevez le bras sur le côté jusqu'à ce que votre\
  \ coude atteigne la hauteur de l'épaule, en gardant le poignet aligné avec le coude.\n\
  Marquez une brève pause en haut, puis abaissez lentement la poignée le long de votre\
  \ corps de façon contrôlée. Répétez pour le nombre de répétitions souhaité."
