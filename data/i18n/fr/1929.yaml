name: Tirage bras tendus avec bande élastique
description: 'Position de départ :

  Accrochez un élastique en hauteur (sur une barre de traction). Saisissez l''élastique à deux mains en prise pronation et reculez pour créer de la tension. Penchez légèrement le buste vers l''avant avec le dos plat, bras tendus au-dessus de la tête avec les coudes quasi verrouillés.


  Exécution :

  Tirez l''élastique vers le bas dans un large arc de cercle en direction des cuisses en initiant le mouvement avec le grand dorsal. Marquez un temps d''arrêt en serrant fort les dorsaux en bas, puis laissez remonter lentement avec contrôle jusqu''à étirement complet.


  Conseils :

  Ne fléchissez pas les coudes pendant la descente afin d''isoler le grand dorsal sans solliciter les triceps.'
