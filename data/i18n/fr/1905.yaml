name: Tirage arrière à la poulie avec extension lombaire
description: 'Position de départ :

  Réglez les poulies à hauteur des hanches ou de la poitrine et fixez les poignées adaptées. Saisissez les poignées, reculez de quelques pas, fléchissez légèrement les genoux et penchez le buste droit vers l''avant à partir des hanches, bras tendus devant vous.


  Exécution :

  Tirez les poignées vers le torse tout en étendant simultanément le bas du dos pour redresser le buste. Resserrez fermement les omoplates en fin de mouvement, puis revenez lentement et avec contrôle à la position initiale penchée.


  Conseils :

  Gardez la sangle abdominale gainée et coordonnez le tirage horizontal avec l''extension de la colonne sans mouvement brusque.'
