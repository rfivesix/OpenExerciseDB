name: Squat-développé au landmine
description: "Position de départ :\nFixez une extrémité d'une barre dans un landmine.\
  \ Tenez-vous face à la barre, pieds un peu plus larges que les épaules, pointes\
  \ légèrement ouvertes. Saisissez l'extrémité libre à deux mains devant la poitrine,\
  \ coudes vers le bas.\n\nExécution :\n1. Descendez en squat complet en gardant le\
  \ torse fier jusqu'à ce que les cuisses soient parallèles au sol.\n2. Poussez puissamment\
  \ sur les talons pour vous relever avec explosivité.\n3. Utilisez l'élan des jambes\
  \ pour développer la barre au-dessus de la tête bras tendus dans un mouvement fluide.\n\
  4. Redescendez la barre à la poitrine avec contrôle et enchaînez directement avec\
  \ le squat suivant.\n\nConseils :\nCoordonnez l'extension des jambes et la poussée\
  \ des épaules en un seul mouvement continu."
