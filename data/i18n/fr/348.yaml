name: Élévations latérales
description: |-
  Cet exercice sollicite le deltoïde de l'épaule. Le mouvement débute bras tendus, les mains tenant des poids le long du corps ou devant le corps. Le corps est légèrement penché vers l'avant, les hanches et les genoux un peu fléchis. Les bras sont gardés tendus ou légèrement fléchis, et montés selon un arc de mouvement dans le plan frontal qui se termine lorsque les mains arrivent approximativement à hauteur des épaules. Les poids sont redescendus à la position de départ, ce qui complète une répétition. Avec une poulie, le pratiquant se place de manière à ce que son plan frontal soit aligné avec la poulie, qui se trouve au niveau du sol ou à proximité.[9] L'exercice peut être réalisé une épaule à la fois (l'autre main servant à stabiliser le corps contre la charge déplacée), ou des deux mains simultanément si deux poulies parallèles sont disponibles.
