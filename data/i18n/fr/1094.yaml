name: Développé couché assis
description: |-
  Réglez la machine de développé pectoral de sorte que les poignées soient alignées avec le bas de votre poitrine lorsque vous êtes assis. Veillez à être assis le dos bien plaqué contre le dossier. Saisissez une poignée dans chaque main, sortez la poitrine et gardez la tête appuyée contre l'appui-tête. Respirez profondément et poussez lentement les poignées vers l'avant jusqu'à ce que vos bras soient presque complètement tendus. Marquez une pause juste avant le verrouillage des coudes, puis ramenez lentement les poignées à la position de départ. Marquez une pause juste avant que les poignées ne s'immobilisent complètement, puis effectuez une autre répétition.
