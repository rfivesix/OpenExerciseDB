name: Presse pectorale assise
description: |-
  Position de départ :
  Réglez la hauteur du siège de façon à ce que les poignées soient alignées avec le milieu ou le bas de la poitrine. Asseyez-vous le dos et la tête bien calés contre le dossier, pieds à plat au sol.

  Étapes :
  1. Saisissez les poignées fermement, serrez les omoplates contre le dossier et bombez le torse.
  2. Poussez les poignées vers l'avant de manière explosive et contrôlée jusqu'à extension quasi-complète des bras sans verrouiller les coudes.
  3. Marquez une brève contraction des pectoraux en fin de poussée.
  4. Revenez lentement à la position initiale en retenant la charge jusqu'à sentir un étirement modéré.
