name: Curl biceps au poids du corps
description: |-
  Placez-vous sous une barre droite (à hauteur de taille ou de poitrine environ). Saisissez la barre paumes tournées vers vous (prise supination), les mains écartées d'environ la largeur des épaules. Penchez-vous en arrière, bras tendus, de sorte que votre corps forme un angle avec le sol. En gardant les coudes hauts et près de la barre, tirez le haut du corps vers la barre en fléchissant les coudes, comme pour un curl biceps. Redescendez de manière contrôlée. Gardez les abdominaux contractés et le mouvement lent pour maximiser la tension sur les biceps.
