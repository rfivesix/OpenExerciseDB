exercise_id: '12'
language: fr
status: ai_reviewed
name: Adduction de hanche assise
description: |-
  Position de départ :
  Asseyez-vous sur la machine, le dos bien calé contre le dossier, avec les coussinets placés contre l'intérieur des cuisses ou des genoux. Saisissez les poignées latérales pour stabiliser le buste.

  Exécution :
  1. Resserrez les cuisses de manière lente et contrôlée en contractant les adducteurs jusqu'à ce que les coussinets se rejoignent presque.
  2. Marquez une brève pause en position de contraction maximale.
  3. Ouvrez lentement les jambes pour revenir à la position de départ en retenant la charge.

  Conseils :
  Gardez le dos fermement plaqué contre le dossier et évitez tout mouvement d'élan avec le torse.
