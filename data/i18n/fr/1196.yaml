name: Exercices au mur (Wall Drills)
description: |-
  Position de départ :
  • Placez-vous debout face à un mur solide à environ un grand pas de distance.
  • Posez les mains à plat sur le mur à hauteur d'épaules et inclinez votre corps vers l'avant à un angle d'environ 45 degrés.
  • Gardez le corps parfaitement aligné de la tête aux talons avec un gainage abdominal maximal.

  Exécution :
  • Montez explosivement un genou vers la poitrine jusqu'à ce que la cuisse soit parallèle au sol, orteils relevés vers le haut.
  • Maintenez la position ou alternez rapidement les montées de genoux sur un rythme de marche ou de course athlétique.
  • Poussez fermement dans le sol avec l'avant du pied d'appui en gardant le bassin stable.
