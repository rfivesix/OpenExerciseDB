name: Curls biceps alternés avec haltères
description: |-
  Position de départ :
  Tenez-vous debout, les pieds écartés de la largeur des hanches, le dos droit et les abdominaux gainés. Tenez un haltère dans chaque main, bras le long du corps, paumes tournées vers l'intérieur.

  Étapes :
  1. Fléchissez un coude en effectuant une rotation de l'avant-bras vers l'extérieur (supination), paume orientée vers l'épaule en haut du mouvement.
  2. Montez l'haltère jusqu'à la contraction maximale du biceps, sans bouger le coude ni le haut du bras.
  3. Contrôlez la descente pour ramener le bras en position initiale.
  4. Répétez le mouvement avec l'autre bras en alternant de manière fluide.
