name: Flexion des poignets à la poulie
description: "Position de départ :\nAttachez une barre droite à la poulie basse. À\
  \ genoux ou assis devant la poulie, posez vos avant-bras à plat sur vos cuisses\
  \ ou sur un banc, les poignets dépassant du bord. Saisissez la barre avec une prise\
  \ en supination (paumes vers le haut).\n\nExécution :\n1. Laissez la barre descendre\
  \ doucement en déroulant légèrement les doigts pour bien étirer les fléchisseurs\
  \ de l'avant-bras.\n2. Refermez la prise et fléchissez vigoureusement les poignets\
  \ vers le haut au maximum de l'amplitude.\n3. Marquez une seconde d'arrêt en contraction\
  \ maximale en haut, puis redescendez avec contrôle.\n\nConseils :\nGardez les avant-bras\
  \ parfaitement immobiles et plaqués sur le support pour isoler les poignets."
