name: Soulevés de terre
description: |-
  Position de départ :
  Placez-vous debout, les pieds écartés de la largeur du bassin, avec la barre au-dessus du milieu des pieds (à environ 2-3 cm des tibias). Fléchissez les hanches vers l'arrière et pliez les genoux en gardant le dos droit. Saisissez la barre juste à l'extérieur des jambes en prise pronation ou inversée.

  Exécution :
  1. Prenez une grande inspiration et gainez fermement la sangle abdominale. Poussez fort dans le sol avec les talons pour tendre simultanément les genoux et les hanches.
  2. Gardez la barre au plus près des tibias et des cuisses tout au long de la montée.
  3. Terminez l'extension en vous redressant complètement et en contractant les fessiers, sans cambrer excessivement le bas du dos vers l'arrière.
  4. Redescendez la charge au sol de manière contrôlée en inversant le mouvement.

  Conseils :
  Gardez le dos parfaitement rectiligne pendant toute la durée du mouvement pour protéger votre colonne vertébrale.
