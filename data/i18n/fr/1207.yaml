name: Coup de pied du scorpion
description: |-
  Position de départ :
  • Placez-vous en planche haute, mains sous les épaules et pieds écartés à la largeur des hanches.
  • Gardez le corps bien aligné de la tête aux talons avec un bon gainage abdominal.

  Exécution :
  • Ramenez un genou vers la poitrine puis levez la jambe fléchie vers le haut et l'arrière.
  • Pivotez le bassin pour faire passer le pied au-dessus de la jambe d'appui en direction du sol du côté opposé.
  • Conservez les épaules parallèles au sol pour obtenir une excellente rotation du tronc et étirement de la hanche.
  • Revenez sous contrôle en position de planche et changez de jambe.
