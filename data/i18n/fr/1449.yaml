description: |-
  Position de départ :
  • Montez sur les marches mobiles du simulateur d'escalier (ClimbMill) en adoptant une posture bien droite.
  • Posez légèrement les mains sur les rampes pour conserver l'équilibre sans vous appuyer lourdement dessus.

  Exécution :
  • Montez les marches à un rythme régulier en posant le pied bien à plat sur chaque marche successive.
  • Gardez la colonne vertébrale allongée et le gainage abdominal actif.
  • Ajustez la vitesse des marches et la durée selon vos objectifs d'endurance cardiovasculaire.
