name: Triceps à la machine
description: '- Asseyez-vous sur la machine à triceps et réglez le siège afin d''aligner
  vos coudes avec l''axe de rotation de la machine.

  - Saisissez fermement les poignées et calez vos bras contre le coussin d''appui.

  - Poussez les poignées vers le bas en tendant les coudes pour contracter les triceps,
  sans bloquer brutalement l''articulation.

  - Revenez lentement et sous contrôle à la position de départ sans décoller les bras
  du support.'
