name: Sit-outs complets
description: |-
  (A) Mettez-vous en position de planche haute, sur les mains et la pointe des pieds.(B) Reportez votre poids sur votre main gauche en tournant votre corps vers la droite ; fléchissez votre jambe droite derrière vous et tendez votre bras droit vers le haut. Revenez au centre et répétez de l'autre côté. Continuez en alternant les côtés.Pour faciliter : ne levez pas le bras après avoir fléchi la jambe derrière vous.Pour intensifier : tenez en équilibre, bras et jambe tendus, pendant deux temps.
