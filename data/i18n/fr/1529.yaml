name: Pointes de pieds à la barre (toes to bar)
description: |-
  Le nom « toes to bar » (pointes de pieds à la barre) dit tout : cet exercice, dans lequel vous êtes suspendu à une barre de traction, consiste à amener vos pointes de pieds vers la barre, en direction de votre visage. Cela sollicite vraiment vos abdominaux. Le « toes to bar » est populaire dans les programmes de fitness fonctionnel comme Freeletics et CrossFit, et c'est un exercice efficace pour travailler la tablette de chocolat.
