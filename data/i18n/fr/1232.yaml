name: Étirement du biceps debout au mur (gauche)
description: |-
  Position de départ :
  • Tenez-vous debout avec le flanc gauche près d'un mur.
  • Tendez le bras gauche vers l'arrière et posez la paume de la main gauche à plat contre le mur à hauteur d'épaule.

  Exécution :
  • Tournez doucement le torse et les pieds vers la droite en vous détournant du mur.
  • Maintenez la position dès que vous ressentez un bon étirement dans le biceps gauche et l'avant de l'épaule.
  • Gardez la posture pendant 20 à 30 secondes en respirant profondément.
