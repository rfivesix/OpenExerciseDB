name: Routine de mobilité Limber 11
description: 'La routine Limber 11 conçue par le coach Joe DeFranco est un circuit complet d''échauffement et de mobilité pour le bas du corps combinant automassage et étirements ciblés :


  1. Rouleau de massage sur le tractus ilio-tibial (10 à 15 passages)

  2. Rouleau de massage sur les adducteurs (10 à 15 passages)

  3. Automassage des fessiers à la balle de crosse (30 s à 2 min)

  4. Croix de fer genoux fléchis (5 à 10 répétitions par côté)

  5. Roulades vers le V-sit (10 répétitions)

  6. Étirement de la grenouille avec balancement (10 répétitions)

  7. Cercles de hanche à quatre pattes / Fire Hydrant (10 vers l''avant / 10 vers l''arrière)

  8. Mountain climbers (10 répétitions par jambe)

  9. Squats cosaques (5 à 10 répétitions par côté)

  10. Étirement du piriforme assis (20 à 30 s par côté)

  11. Étirement des fléchisseurs de hanche pied arrière surélevé (5 à 10 répétitions avec maintien de 3 s)'
