name: Box squat bas - position large
description: |-
  Sortez la barre du support et adoptez une position large, au-delà de la largeur des hanches. Poussez les hanches vers l'arrière et asseyez-vous sur une box qui vous amène sous la parallèle. Asseyez-vous complètement, ne touchez pas pour rebondir aussitôt. Relevez-vous ensuite de manière explosive. Gardez le haut du dos et le tronc bien gainés pendant tout le mouvement.
