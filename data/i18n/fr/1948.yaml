exercise_id: '1948'
language: fr
status: human
name: Squat sur boîte à une jambe
description: |-
  Cet exercice nécessite une boîte solide ou une chaise. Tenez-vous simplement à environ 15 cm devant elle et tenez-vous en équilibre sur une jambe. À partir de là, commencez à descendre en squat par un mouvement fluide et contrôlé, tout en gardant l'autre jambe tendue devant vous pour l'équilibre. Asseyez-vous lentement sur la boîte, marquez une pause d'une seconde, puis remontez en poussant avec la jambe active, sans jamais laisser l'autre jambe toucher le sol.
