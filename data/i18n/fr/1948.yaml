name: Squat cosaque (Cossack Squat)
description: 'Position de départ :

  Écartez largement les jambes bien au-delà de la largeur des épaules, pointes de pieds légèrement tournées vers l''extérieur. Buste droit et mains jointes devant la poitrine.


  Exécution :

  Transférez le poids du corps sur une jambe et descendez en squat profond tout en gardant l''autre jambe tendue sur le côté. Faites pivoter le pied de la jambe tendue pour orienter les orteils vers le plafond en appui sur le talon. Descendez le plus bas possible en gardant le talon d''appui au sol et le dos droit. Poussez sur la jambe pour revenir au centre et enchaînez directement de l''autre côté.


  Conseils :

  Fait partie de la routine Limber 11 (5 à 10 répétitions de chaque côté). Développe la mobilité des hanches, des chevilles et la souplesse des adducteurs.'
