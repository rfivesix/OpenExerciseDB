name: Hack squat avec pause
description: |-
  Position de départ :
  • Installez-vous dans la machine de hack squat, les épaules sous les manchons et le dos bien plaqué contre le dossier.
  • Placez vos pieds à la largeur des épaules sur la plateforme.

  Exécution :
  • Fléchissez les genoux pour descendre le chariot jusqu'à ce que les cuisses soient au moins parallèles à la plateforme.
  • Marquez un arrêt complet de 1 à 2 secondes au point bas sans aucun rebond pour dissiper l'énergie élastique.
  • Poussez puissamment avec les quadriceps et les fessiers pour remonter à la position de départ sans verrouiller sèchement les genoux.
