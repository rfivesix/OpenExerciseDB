name: Bûcheron frontal (Wood Chop)
description: Debout, tenez les bras tendus au-dessus de la tête. Effectuez une extension du tronc vers le haut et l'arrière
  en levant alternativement une jambe vers l'arrière pour contracter les muscles érecteurs du rachis et les fessiers. Revenez
  en position initiale avec contrôle.
