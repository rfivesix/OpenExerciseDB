name: L-sit groupé (tuck L-sit)
description: |-
  Le tuck L-sit est un maintien au poids du corps où vous vous soutenez sur des barres parallèles, des parallettes ou le sol avec les bras tendus, tout en ramenant vos genoux vers votre poitrine. Vos hanches restent levées, votre colonne reste droite et vos pieds flottent au-dessus du sol. L'objectif est de garder la sangle abdominale gainée, les épaules abaissées et les bras verrouillés tout en maintenant la position groupée. C'est un maintien statique très exigeant pour les abdominaux et stabilisateur pour les épaules, souvent utilisé comme progression vers le L-sit complet.
