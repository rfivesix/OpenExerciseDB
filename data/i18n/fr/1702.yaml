name: Tirage vertical à la poulie en prise large
description: |-
  Le tirage vertical à la poulie est un exercice de tirage qui cible principalement le grand dorsal (souvent appelé « dorsaux ») dans le dos. Il consiste à tirer une barre ou une poignée fixée à un câble vers la poitrine, assis sur une machine spécialement conçue à cet effet. Le tirage vertical se réalise généralement en prise large, mais peut aussi se faire en prise serrée ou en supination pour cibler différents groupes musculaires du dos et des bras. C'est un exercice populaire pour développer la force du haut du corps et améliorer la posture.
