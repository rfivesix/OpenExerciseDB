name: Développé épaules incliné aux haltères
description: |-
  Position de départ :
  • Asseyez-vous sur un banc incliné à angle prononcé (environ 60° à 75°), le dos bien calé contre le dossier.
  • Tenez les haltères au niveau des épaules, paumes tournées vers l'avant.

  Exécution :
  • Développez les haltères vers le haut au-dessus de la tête jusqu'à extension complète des bras sans verrouiller brutalement les coudes.
  • Marquez une brève pause en haut du mouvement puis redescendez lentement les haltères au niveau des épaules.
  • Gardez les coudes légèrement orientés vers l'avant (à 45 degrés) pour préserver les articulations.
