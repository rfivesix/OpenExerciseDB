name: Extension des triceps à la poulie avec corde
description: '- Attachez une corde à la poulie haute, tenez-vous debout les pieds
  écartés de la largeur des épaules, le buste légèrement penché en avant.

  - Gardez les coudes collés au buste et poussez la corde vers le bas jusqu''à l''extension
  complète des bras.

  - Écartez les extrémités de la corde vers l''extérieur en bas du mouvement pour
  maximiser la contraction des triceps.

  - Revenez lentement à la position de départ de manière contrôlée sans avancer les
  coudes.'
