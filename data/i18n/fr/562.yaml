exercise_id: '562'
language: fr
status: ai_reviewed
name: Shotgun row
description: |-
  Fixez une poignée simple à une poulie basse.
  Après avoir choisi le poids approprié, tenez-vous reculé de quelques dizaines de centimètres avec une position en fente large. Votre bras doit être tendu et votre épaule projetée vers l'avant. Ce sera votre position de départ.
  Effectuez le mouvement en rétractant l'épaule et en fléchissant le coude. Pendant que vous tirez, faites une supination du poignet, en tournant la paume vers le haut au fur et à mesure.
  Après une brève pause, revenez à la position de départ.
