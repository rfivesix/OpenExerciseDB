name: Montées de genou debout
description: 'Position de départ :

  Debout, pieds écartés à la largeur du bassin, buste droit et bras fléchis à 90 degrés devant vous.


  Exécution :

  Montez un genou vers la poitrine jusqu''à ce que la cuisse soit au moins parallèle au sol, en restant stable sur la jambe d''appui. Redescendez le pied sous contrôle et montez aussitôt l''autre genou de manière alternée et rythmée.


  Conseils :

  Ne penchez pas le buste vers l''arrière lors de la montée du genou; engagez les fléchisseurs de la hanche et les abdominaux pour guider l''élévation.'
