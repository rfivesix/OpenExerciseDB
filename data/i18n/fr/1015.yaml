exercise_id: '1015'
language: fr
status: ai_reviewed
name: Cercles du cou dans le sens horaire
description: |-
  Position de départ :
  Asseyez-vous ou tenez-vous debout avec le dos bien droit et les épaules relâchées vers le bas. Abaissez doucement le menton vers la poitrine.

  Étapes :
  1. Décrivez un cercle lent et fluide dans le sens des aiguilles d'une montre : inclinez la tête vers l'épaule droite, passez doucement vers l'arrière, inclinez vers l'épaule gauche et revenez au centre.
  2. Ne forcez pas sur la nuque lors du passage vers l'arrière et gardez une respiration régulière.
  3. Répétez le mouvement pour le nombre de répétitions souhaité.
