description: 'Position de départ :

  Mettez-vous à l''eau et préparez-vous pour une séance de natation en continu dans
  la nage de votre choix (crawl, brasse).


  Exécution :

  1. Nagez à une cadence régulière et soutenue sur la distance ou durée programmée.

  2. Engagez les grands dorsaux, les épaules et la sangle abdominale pour propulser
  le corps vers l''avant.

  3. Maintenez un alignement hydrodynamique constant et une respiration rythmée.'
