exercise_id: '1141'
language: fr
status: ai_reviewed
name: Arabesque
description: |-
  Position de départ :
  • Tenez-vous debout et reportez tout votre poids sur une jambe d'appui.
  • Gardez le genou de la jambe d'appui très légèrement déverrouillé et le bassin bien aligné à l'horizontale.
  • Maintenez la colonne vertébrale neutre et gainez la sangle abdominale.

  Exécution :
  • Basculez le buste vers l'avant à partir des hanches tout en tendant l'autre jambe vers l'arrière et le haut.
  • Alignez le buste et la jambe levée parallèlement au sol en conservant l'équilibre.
  • Contractez fermement les fessiers et les ischio-jambiers de la jambe d'appui pour revenir lentement debout.
