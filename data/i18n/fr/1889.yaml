name: Relevé de jambes sur banc décliné
description: "Installation : Allongez-vous sur un banc décliné, la tête en haut, et\
  \ saisissez les poignées.\nLe départ : Tendez complètement les jambes en les gardant\
  \ légèrement surélevées pour engager la sangle abdominale.\nLa montée : Soulevez\
  \ vos jambes vers le plafond à l'aide des abdominaux, sans utiliser l'élan.\nLa\
  \ contraction : Marquez une pause et contractez le bas des abdominaux en position\
  \ haute.\nLe retour : Abaissez lentement vos jambes vers la position de départ en\
  \ gardant le contrôle."
