name: Poussée de traîneau
description: 'Chargez le traîneau avec 25 % de votre charge maximale. Si vous ne la
  connaissez pas, choisissez un poids que vous pouvez pousser pendant 10 minutes avec
  de courtes pauses. Les débutants peuvent choisir de pousser le traîneau sans poids.

  Tenez-vous derrière le traîneau et saisissez les barres avec une prise haute.

  Contractez vos abdominaux et commencez à pousser le traîneau vers l''avant aussi
  vite que possible, en exploitant toute la force de vos jambes. Étendez les hanches
  et les genoux à mesure que vous faites avancer le traîneau. Votre position de pied
  doit ressembler à votre foulée naturelle de course.'
