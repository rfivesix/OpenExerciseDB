name: Presse Pallof à la poulie
description: |-
  Position de départ :
  • Tenez-vous debout de profil par rapport à la poulie réglée à hauteur de poitrine.
  • Saisissez la poignée à deux mains et tenez-la contre le centre de votre poitrine.
  • Écartez les pieds à largeur d'épaules, genoux légèrement déverrouillés et abdos fermement gainés.

  Exécution :
  • Poussez les mains droit devant vous jusqu'à tendre les bras.
  • Résistez avec force à la rotation imposée par le câble en gardant les épaules et le bassin orientés droit devant.
  • Maintenez l'extension pendant 1 à 2 secondes puis ramenez lentement vos mains contre la poitrine.
