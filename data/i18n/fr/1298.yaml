description: L'extension des triceps croisée à la poulie haute est un exercice d'isolation destiné à cibler les triceps, en
  particulier le chef long. Elle utilise des câbles et des poignées saisies avec les mains croisées, ce qui permet un mouvement
  de poussée particulier, efficace pour développer la force des triceps. Contrairement aux exercices qui utilisent une barre
