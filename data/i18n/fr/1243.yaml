name: Extension des mollets sur deux jambes
description: 'Position de départ :

  Tenez-vous debout, les pieds écartés de la largeur des hanches. Placez vos mains contre un mur ou un support stable pour
  l''équilibre si nécessaire.


  Exécution :

  1. Poussez sur la pointe des pieds pour décoller les talons le plus haut possible.

  2. Marquez une pause d''une à deux secondes au sommet en contractant fermement les mollets.

  3. Redescendez lentement les talons au sol de manière contrôlée.'
