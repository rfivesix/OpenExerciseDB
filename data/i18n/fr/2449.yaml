name: Clamshell combiné avec clamshell inversé
description: |-
  Position de départ :
  Allongez-vous sur le côté, hanches et genoux fléchis à 90 degrés. Gardez la jambe supérieure légèrement surélevée tout au long du mouvement.

  Exécution :
  1. En gardant les talons en contact, ouvrez le genou supérieur vers le haut en rotation externe (clamshell standard).
  2. Refermez le genou, collez les deux genoux et levez le pied supérieur vers le haut en rotation interne (clamshell inversé).
  3. Enchaînez les deux mouvements en alternance de façon fluide et rythmée sans reposer la jambe.

  Conseils :
  Gardez le bassin verrouillé pour que le mouvement vienne exclusivement de la hanche.
search_terms:
- Clamshell vers clamshell inversé
- Clamshell to Reverse Clamshell
