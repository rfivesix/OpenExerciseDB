name: Squat du dragon
description: |-
  Position de départ :
  • Tenez-vous debout, les pieds écartés à la largeur des hanches, mains devant la poitrine.
  • Bombez le torse et engagez le centre du corps.

  Exécution :
  • Croisez une jambe loin derrière la jambe opposée en diagonale tout en fléchissant les deux genoux dans un squat croisé profond.
  • Descendez le bassin tout en maintenant les épaules et les hanches orientées vers l'avant.
  • Poussez sur le talon de la jambe avant pour remonter à la position de départ, puis répétez de l'autre côté.
