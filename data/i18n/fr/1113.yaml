name: Pompes sur parallettes
description: |-
  Position de départ :
  Disposez deux barres parallettes parallèles au sol à la largeur des épaules. Saisissez fermement les barres en prise neutre (paumes face à face) et tendez les jambes en arrière en position de planche.

  Étapes :
  1. Fléchissez les coudes et descendez profondément la poitrine entre les barres de manière contrôlée.
  2. Profitez du déficit pour obtenir un étirement optimal des pectoraux en bas du mouvement.
  3. Repoussez avec puissance pour revenir en position initiale bras tendus.
  4. La prise neutre soulage les poignets tout en accentuant le travail musculaire.
