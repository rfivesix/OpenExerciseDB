name: Charnière de hanche
description: |-
  Description de l'exercice de charnière de hancheLa charnière de hanche est un schéma de mouvement fondamental qui consiste à se pencher au niveau des hanches tout en gardant la colonne en position neutre. Elle est couramment utilisée dans des exercices comme le soulevé de terre, le swing avec kettlebell et le good morning. Pour effectuer une charnière de hanche :    Position de départ : Tenez-vous debout, les pieds écartés de la largeur des hanches et les genoux légèrement fléchis.    Basculez au niveau des hanches : Poussez les hanches vers l'arrière tout en gardant le dos droit. Votre buste doit s'incliner vers l'avant et votre poitrine doit rester relevée.    Phase de descente : Continuez à basculer jusqu'à ce que votre buste soit presque parallèle au sol, ou jusqu'à ce que vous ressentiez un étirement dans les ischio-jambiers.    Retour à la position debout : Poussez dans les talons et propulsez les hanches vers l'avant pour revenir à la position de départ.
