name: Kickback pour triceps avec haltères
description: '- Tenez un haltère dans chaque main en prise neutre, inclinez le buste
  vers l''avant avec le dos plat et les genoux légèrement fléchis.

  - Amenez le haut des bras le long du buste, parallèles au sol, les coudes pliés
  à 90 degrés.

  - En gardant le haut des bras parfaitement immobile, étendez les avant-bras vers
  l''arrière en contractant fortement les triceps.

  - Marquez une courte pause au sommet de la contraction, puis redescendez lentement
  les haltères à la position de départ.'
