name: Squat à la machine avec ceinture (Belt Squat)
description: 'Position de départ :

  Montez sur la plateforme de la machine de belt squat et fixez la ceinture de lest autour des hanches. Raccordez la chaîne au bras de charge, écartez les pieds à la largeur des épaules et tenez légèrement les poignées d''équilibre.


  Exécution :

  Déverrouillez la sécurité et descendez en squat profond en fléchissant les genoux et les hanches jusqu''à ce que les cuisses soient parallèles au sol. Poussez fermement à travers les talons et le milieu du pied pour remonter en position debout avec le buste droit.


  Conseils :

  La charge étant appliquée sur les hanches, la colonne vertébrale est totalement déchargée de toute pression axiale.'
