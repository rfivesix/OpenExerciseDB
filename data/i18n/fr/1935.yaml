name: Squat à la ceinture
description: |-
  Squat à la ceinture : une variante du squat réalisée avec une ceinture fixée à une machine à charge ou à une plateforme, de sorte que le poids soit supporté au niveau des hanches plutôt que sur la colonne vertébrale. Il sollicite principalement les quadriceps et les fessiers, avec beaucoup moins de fatigue pour le bas du dos qu'un squat à la barre. Utilisez une amplitude de mouvement complète, gardez le tronc droit et poussez à travers le milieu du pied.
