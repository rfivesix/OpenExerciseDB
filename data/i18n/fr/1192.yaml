name: Curls biceps alternés avec haltères
description: |-
  Position de départ :
  • Tenez-vous debout pieds à largeur d'épaules avec un haltère dans chaque main le long du corps, paumes tournées vers l'intérieur (prise neutre).
  • Gardez les épaules basses et les coudes calés contre les côtes.

  Exécution :
  • Fléchissez un coude pour monter l'haltère tout en effectuant une rotation (supination) de l'avant-bras pour que la paume soit dirigée vers l'épaule en haut.
  • Contractez fortement le biceps au sommet du mouvement pendant une seconde.
  • Redescendez lentement sous contrôle tout en démarrant la répétition sur l'autre bras.
  • Gardez le buste parfaitement immobile sans aucun élan.
