name: Extension des mollets sur une jambe (gauche)
description: |-
  Position de départ :
  • Tenez-vous debout sur une marche en posant l'avant-pied gauche sur le bord, le talon dans le vide.
  • Levez la jambe droite pour travailler uniquement sur la jambe gauche.
  • Tenez-vous légèrement à un mur pour stabiliser votre équilibre.

  Exécution :
  • Laissez descendre le talon gauche sous le niveau de la marche pour bien étirer le mollet.
  • Poussez puissamment sur l'avant du pied pour monter le talon le plus haut possible sur la pointe des pieds.
  • Maintenez la contraction au sommet pendant deux à trois secondes puis redescendez lentement.
