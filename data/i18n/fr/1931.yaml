name: Spider curl avec haltères
description: 'Position de départ :

  Allongez-vous à plat ventre sur un banc incliné à environ 45 degrés, la poitrine calée sur le haut du dossier. Tenez une paire d''haltères en prise supination, bras relâchés à la verticale vers le sol.


  Exécution :

  Fléchissez les coudes pour monter les haltères vers les épaules en gardant les bras immobiles et strictement verticaux. Contractez les biceps fermement pendant une seconde en position haute, puis redescendez lentement jusqu''à extension complète des bras.


  Conseils :

  L''appui sur le banc empêche tout élan avec le corps; concentrez-vous sur l''isolation pure des biceps.'
