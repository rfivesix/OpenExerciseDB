name: Développé avec impulsion (Push Press)
description: |-
  Position de départ :
  • Debout, pieds à la largeur des épaules, reposez la barre sur l'avant des épaules et les clavicules en position de rack avant.
  • Gardez les coudes légèrement pointés vers l'avant et la sangle abdominale gainée.

  Exécution :
  • Fléchissez brièvement les genoux de quelques centimètres en gardant le buste strictement vertical.
  • Déployez explosivement les jambes pour propulser la barre vers le haut grâce à l'impulsion du bas du corps.
  • Terminez la poussée avec les épaules et les triceps jusqu'au verrouillage complet des bras au-dessus de la tête.
  • Redescendez la barre sous contrôle sur l'avant des épaules.
