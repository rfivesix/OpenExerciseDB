name: Rentrée du ventre (Stomach Vacuum)
description: "Position de départ :\nAllongez-vous sur le dos, genoux pliés et pieds\
  \ à plat sur le tapis. Posez vos doigts sur le bas-ventre pour ressentir le travail\
  \ musculaire profond.\n\nExécution :\n1. Expirez complètement par la bouche pour\
  \ vider l'air des poumons.\n2. Rentrez doucement votre nombril vers l'intérieur\
  \ et le haut en direction de la colonne vertébrale.\n3. Gardez le bassin neutre\
  \ et respirez superficiellement tout en maintenant le ventre rentré pendant 10 à\
  \ 15 secondes.\n4. Relâchez progressivement et inspirez normalement avant de répéter.\n\
  \nConseils :\nCe mouvement isole le muscle transverse de l'abdomen, garantissant\
  \ un maintien viscéral optimal et un gainage profond."
