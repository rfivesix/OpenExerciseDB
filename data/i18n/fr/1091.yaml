exercise_id: '1091'
language: fr
status: ai_reviewed
name: Touchers d'épaules en planche (Shoulder Taps)
description: |-
  Position de départ :
  Placez-vous en position de planche haute, mains sous les épaules et pieds écartés un peu plus largement que les hanches pour assurer une base stable.

  Étapes :
  1. Verrouillez la sangle abdominale et les fessiers pour empêcher le bassin de basculer ou d'osciller.
  2. Décollez la main droite et venez toucher doucement l'épaule gauche.
  3. Reposez la main droite au sol puis touchez l'épaule droite avec la main gauche.
  4. Enchaînez les répétitions en alternant les côtés de manière fluide et contrôlée.
