name: Pont fessier
description: |-
  Allongez-vous sur le dos, les hanches et les genoux fléchis, les pieds au sol. À partir de cette position, soulevez les fessiers du sol jusqu'à ce que votre corps forme une ligne droite des genoux aux épaules. Pour rendre l'exercice plus intense, vous pouvez ajouter du poids en laissant reposer une barre sur vos hanches pendant que vous effectuez le mouvement, ou vous pouvez poser vos pieds sur une surface légèrement plus haute, comme une marche ou un banc.
