name: Élévation latérale à la poulie derrière le dos
description: "Position de départ :\nPlacez-vous de profil à côté d'une poulie basse.\
  \ Attrapez la poignée avec votre main extérieure en faisant passer le câble derrière\
  \ vos fessiers. Tenez le montant de la poulie avec la main intérieure pour vous\
  \ stabiliser et penchez très légèrement le buste en avant.\n\nExécution :\n1. Levez\
  \ le bras latéralement avec le coude très légèrement déverrouillé jusqu'à hauteur\
  \ de l'épaule.\n2. Maintenez la contraction du deltoïde latéral pendant une seconde\
  \ au sommet.\n3. Redescendez lentement la charge derrière le dos en résistant continuellement\
  \ à la tension du câble.\n\nConseils :\nLe passage du câble derrière le dos assure\
  \ une tension d'étirement continue et élimine tout frottement sur la hanche."
