name: Abduction de hanche en décubitus latéral
description: |-
  Position de départ :
  • Allongez-vous sur le côté sur un tapis de sol.
  • Fléchissez légèrement la jambe du dessous pour stabiliser le corps et gardez la jambe du dessus bien tendue.
  • Posez votre tête sur votre bras inférieur et placez votre main supérieure au sol devant vous pour l'équilibre.

  Exécution :
  • Levez la jambe supérieure vers le haut de façon contrôlée, les orteils pointant droit devant ou légèrement vers le bas.
  • Veillez à ce que le bassin reste parfaitement perpendiculaire au sol sans basculer vers l'arrière.
  • Marquez un temps d'arrêt en haut pour bien contracter le moyen fessier, puis redescendez lentement.
