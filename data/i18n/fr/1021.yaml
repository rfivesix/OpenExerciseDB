name: Élévation du mollet droit (sur une jambe)
description: |-
  Position de départ :
  Tenez-vous debout sur le pied droit, sur le sol ou sur le bord d'une marche pour augmenter l'amplitude. Le pied gauche est légèrement décollé du sol. Prenez un appui léger avec une main sur un mur pour garder l'équilibre.

  Étapes :
  1. Descendez le talon droit vers le bas pour ressentir un étirement complet du mollet.
  2. Poussez puissamment sur la pointe du pied droit pour monter le plus haut possible.
  3. Marquez une pause d'une seconde en haut de la contraction.
  4. Redescendez lentement de manière contrôlée.
