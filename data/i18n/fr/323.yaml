name: Écarté à la poulie (cable cross-over)
description: |-
  Commencez avec les câbles à environ hauteur d'épaules, un dans chaque main. Faites un pas en avant de manière à ce qu'un pied soit devant l'autre, pour la stabilité et pour que les câbles soient sous tension. Amenez les mains l'une vers l'autre devant vous. Essayez de faire en sorte que vos mains se chevauchent (de façon à ce que les câbles se croisent) de quelques centimètres.
