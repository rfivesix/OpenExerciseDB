name: Pushdown triceps à la corde à la poulie
description: '- Attachez une corde à la poulie haute, placez-vous debout pieds à la
  largeur des épaules avec le buste légèrement penché en avant.

  - Coudes collés aux flancs, poussez la corde vers le bas jusqu''à tendre complètement
  les bras.

  - Écartez les pointes de la corde vers l''extérieur en bas du mouvement pour une
  contraction maximale des triceps.

  - Remontez lentement la charge sous contrôle en maintenant les coudes fixes.'
