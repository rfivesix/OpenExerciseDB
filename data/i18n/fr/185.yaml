name: Développé couché décliné à la barre
description: |-
  Allongez-vous sur un banc décliné, la barre doit se trouver directement au-dessus de vos yeux, les genoux légèrement fléchis et les pieds fermement posés au sol. Concentrez-vous, respirez profondément et saisissez la barre un peu plus large que la largeur des épaules. Abaissez-la lentement jusqu'à ce qu'elle effleure brièvement votre poitrine à la hauteur des mamelons. Poussez la barre vers le haut.
