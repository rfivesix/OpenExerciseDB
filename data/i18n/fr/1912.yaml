name: Rotation du tronc assis (Russian Twist)
description: 'Position de départ :

  Asseyez-vous sur un tapis, genoux pliés. Penchez le torse vers l''arrière à environ 45 degrés en gardant le dos droit, puis décollez légèrement les pieds du sol pour trouver l''équilibre sur les fessiers.


  Exécution :

  Pivotez le buste de manière fluide d''un côté à l''autre en touchant le sol avec les mains près des hanches à chaque mouvement.


  Conseils :

  Gardez la poitrine haute et engagez les obliques à chaque torsion en évitant d''arrondir la colonne lombaire.'
