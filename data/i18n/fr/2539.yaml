name: Curl pupitre Larry Scott isométrique
description: |-
  Position de départ :
  Installez-vous sur un pupitre Larry Scott en ajustant le siège pour que les aisselles reposent confortablement contre le haut du support incliné. Posez l'arrière du bras à plat sur le coussin en tenant un haltère en supination.

  Exécution :
  1. Fléchissez le coude pour amener l'haltère à mi-course (angle de coude d'environ 90 degrés), zone où le bras de levier et la tension sont maximaux.
  2. Maintenez cette position de manière strictement immobile contre la gravité pendant la durée fixée, en contractant intensément le biceps.
  3. Redescendez l'haltère avec retenue et contrôle jusqu'à la position de départ.

  Conseils :
  Gardez le coude et le bras bien calés sur le pupitre sans décoller le buste. Évitez de casser le poignet pendant le maintien.
