name: Élévation trapèze inférieur (Trap-3)
description: "Position de départ :\nPenchez le buste en avant depuis les hanches à\
  \ environ 45 degrés avec le dos plat. Posez une main sur votre genou ou un banc\
  \ d'appui. Laissez pendre le bras actif vers le bas, pouce vers le haut, omoplate\
  \ abaissée.\n\nExécution :\n1. En gardant le coude verrouillé tendu, levez le bras\
  \ en diagonale vers l'avant et le haut à environ 15 à 30 degrés au-dessus de la\
  \ tête.\n2. Gardez l'épaule basse loin de l'oreille pour recruter spécifiquement\
  \ le trapèze inférieur (Trap-3).\n3. Marquez une pause d'une à deux secondes en\
  \ contraction maximale en haut.\n4. Redescendez le bras lentement et avec contrôle\
  \ à la position de départ.\n\nConseils :\nNe haussez pas l'épaule ; le mouvement\
  \ doit cibler l'abaissement et la rotation supérieure de l'omoplate."
