name: Planche du chat (Cat Plank)
description: 'Position de départ :

  Placez-vous à quatre pattes en appui sur les mains et les orteils. Décollez légèrement les genoux de quelques centimètres du sol.


  Exécution :

  Poussez fort dans le sol avec les épaules pour arrondir le haut et le milieu du dos vers le plafond, à la manière d''un chat qui fait le gros dos. Rentrez le nombril et serrez puissamment la sangle abdominale. Maintenez cette position isométrique pendant la durée requise.


  Conseils :

  Gardez les genoux au ras du sol pendant tout le maintien et conservez une poussée constante des omoplates.'
