name: Dips sur chaise
description: "Position de départ :\nAsseyez-vous sur le bord avant d'une chaise robuste\
  \ ou d'un banc. Placez vos mains de part et d'autre des hanches en agrippant le\
  \ bord, doigts vers l'avant. Tendez les bras et avancez le bassin dans le vide devant\
  \ l'assise. Gardez les genoux pliés (facile) ou les jambes tendues devant vous (plus\
  \ difficile).\n\nExécution :\n1. Fléchissez les coudes vers l'arrière pour descendre\
  \ lentement le corps verticalement.\n2. Descendez jusqu'à ce que les bras forment\
  \ un angle d'environ 90 degrés, en gardant le dos très proche de la chaise.\n3.\
  \ Poussez sur la paume des mains avec la force des triceps pour remonter en extension\
  \ complète.\n\nConseils :\nGardez le dos près du bord de la chaise pour éviter une\
  \ contrainte excessive sur les épaules."
