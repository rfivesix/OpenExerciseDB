name: Crunch en lévitation
description: |-
  Position de départ :
  Allongez-vous sur le dos, les genoux fléchis et les pieds à plat sur le sol. Croisez les bras sur la poitrine ou placez les mains légèrement derrière la tête sans tirer sur la nuque.

  Exécution :
  1. Décollez le haut du torse et les omoplates du sol en contractant intensément le haut des abdominaux.
  2. Maintenez le bas du tronc et le bassin parfaitement immobiles et plaqués au sol.
  3. Marquez une pause en contraction maximale au sommet pendant 1 à 2 temps.
  4. Redescendez lentement avec contrôle avant d'enchaîner la répétition suivante.

  Conseils :
  Le mouvement doit être court et vertical, sans tirer avec le cou, en concentrant tout l'effort sur les abdominaux.
