name: Crunch en lévitation
description: |-
  Pour ce mouvement de haut en bas, nous cherchons à déplacer le haut du tronc sans bouger le bas du tronc. Commencez allongé au sol, les pieds à plat sur le sol et les bras croisés au-dessus de la tête, mains derrière la tête. Soulevez le haut du corps et décollez les omoplates du sol, puis maintenez et marquez une pause au sommet pendant un ou deux temps. Cherchez à faire travailler le haut des abdominaux et à tenir cette contraction pendant 10 répétitions de bonne qualité.
