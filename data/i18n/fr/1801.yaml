name: Squat complet à la barre
description: "Position de départ :\nDécrochez la barre du rack sur le haut des trapèzes.\
  \ Reculez de deux pas et adoptez un écartement des pieds à la largeur des épaules\
  \ ou légèrement plus large, pointes de pieds ouvertes à 15-30 degrés. Prenez une\
  \ inspiration profonde pour verrouiller le gainage abdominal, poitrine haute.\n\n\
  Exécution :\n1. Fléchissez simultanément les hanches et les genoux en ouvrant les\
  \ genoux dans l'axe des orteils.\n2. Descendez de manière fluide sous la ligne parallèle\
  \ pour atteindre la pleine amplitude (squat complet).\n3. Poussez fermement à travers\
  \ l'ensemble du pied pour remonter de manière explosive en position de départ.\n\
  \nConseils :\nLa profondeur complète recrute au maximum quadriceps et grands fessiers\
  \ ; veillez à conserver le dos droit sans rétroversion pelvienne excessive en bas."
