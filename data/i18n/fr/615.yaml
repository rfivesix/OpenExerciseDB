name: Squat avec barre
search_terms:
- Accroupi
- Squat à la barre
- Back Squat
description: |-
  Position de départ: Placez une barre sur un rack juste en dessous de la hauteur des épaules. Placez-vous sous la barre en la reposant sur le haut des trapèzes, mains fermement serrées. Reculez d'un pas, pieds à largeur d'épaules, pointes légèrement ouvertes.
  Exécution: Inspirez, gantez la sangle abdominale et descendez en fléchissant les hanches et les genoux jusqu'à ce que les cuisses soient au moins parallèles au sol.
  Retour: Poussez fort sur vos talons et le milieu du pied pour remonter en position debout en expirant.
