name: Tate press avec haltères
description: "Position de départ :\nAllongez-vous sur un banc plat avec un haltère\
  \ dans chaque main. Tendez les bras au-dessus de la poitrine. Adoptez une prise\
  \ en pronation (paumes vers les pieds et pouces face à face), les extrémités intérieures\
  \ des haltères en contact.\n\nExécution :\n1. Sans bouger le haut des bras, fléchissez\
  \ les coudes en les écartant vers l'extérieur pour amener les têtes intérieures\
  \ des haltères vers le centre de la poitrine.\n2. Effleurez légèrement le torse\
  \ sans relâcher la tension musculaire.\n3. Poussez puissamment en tendant les coudes\
  \ pour ramener les haltères en position haute, en contractant fort les triceps.\n\
  \nConseils :\nGardez les coudes pointés vers l'extérieur tout au long du mouvement\
  \ pour isoler le travail des triceps."
