name: Traction en supination
description: |-
  La traction en supination est un exercice de musculation. On le pratique fréquemment dans le but de renforcer des muscles comme le grand dorsal et les biceps, qui assurent respectivement l'extension de l'épaule et la flexion du coude. Dans ce mouvement, les paumes sont tournées vers le corps. Il s'agit d'une forme de traction dont l'amplitude de mouvement est définie par rapport au menton de la personne.
