description: |-
  Position de départ:
  Allongez-vous sur un banc plat, les pieds bien ancrés au sol. Saisissez la barre avec une prise serrée en pronation (largeur d'épaules environ) et décrochez-la avec les bras tendus à la verticale au-dessus de la poitrine.

  Exécution:
  Descendez la barre de façon contrôlée vers le bas de la poitrine en gardant les coudes près du corps (angle d'environ 30 à 45 degrés). Effleurez la poitrine sans rebondir, puis poussez fermement vers le haut jusqu'à extension complète des coudes en contractant les triceps et les pectoraux.

  Conseils:
  - N'adoptez pas une prise trop étroite pour préserver vos poignets et vos coudes.
  - Gardez les poignets droits dans l'alignement des avant-bras.
