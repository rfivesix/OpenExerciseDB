exercise_id: '1215'
language: fr
status: ai_reviewed
name: Ange de neige inversé
description: |-
  Position de départ :
  • Allongez-vous à plat ventre sur un tapis, jambes tendues et bras tendus devant vous au-dessus de la tête.
  • Gardez la tête en position neutre, regard vers le sol.

  Exécution :
  • Décollez légèrement les bras et le haut du torse du sol en activant les muscles du haut du dos.
  • Décrivez un grand arc de cercle avec les bras sur les côtés vers l'arrière jusqu'à effleurer vos cuisses.
  • Serrez fermement les omoplates l'une contre l'autre en fin de trajectoire.
  • Ramenez lentement les bras vers l'avant au-dessus de la tête sans toucher le sol.
