name: Coquille à l'élastique
description: "Position de départ : Allongez-vous sur le côté, genoux fléchis et jambes\
  \ superposées. Placez un élastique autour des cuisses, juste au-dessus des genoux.\n\
  Exécution : En gardant les pieds joints, levez le genou supérieur vers le haut contre\
  \ la résistance de l'élastique comme une coquille qui s'ouvre. Revenez lentement\
  \ à la position de départ.\nConseils : Gardez le bassin stable et orienté vers l'avant\
  \ sans basculer les hanches vers l'arrière."
