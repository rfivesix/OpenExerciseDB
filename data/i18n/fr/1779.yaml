name: Rotation au landmine
description: "Position de départ :\nFixez une extrémité de la barre dans un support\
  \ landmine. Tenez-vous debout face à la barre, pieds à la largeur des épaules. Saisissez\
  \ l'extrémité libre à deux mains, doigts croisés, bras tendus devant la poitrine.\
  \ Fléchissez légèrement les genoux et gainez fermement la sangle abdominale.\n\n\
  Exécution :\n1. Abaissez la barre dans un arc de cercle large et contrôlé vers une\
  \ hanche en gardant les bras presque tendus.\n2. Laissez le buste pivoter et le\
  \ pied arrière tourner légèrement tout en freinant la charge avec les obliques.\n\
  3. Remontez la barre puissamment vers le haut au centre, puis enchaînez vers la\
  \ hanche opposée.\n\nConseils :\nGardez les bras presque droits pour que la force\
  \ rotationnelle provienne principalement de la sangle abdominale."
