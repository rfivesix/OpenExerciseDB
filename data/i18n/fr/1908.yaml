description: 'Position de départ :

  Allongez-vous à plat ventre sur un tapis de sol, jambes tendues. Entrecroisez les doigts derrière la tête en ouvrant largement les coudes vers l''extérieur.


  Exécution :

  Décollez simultanément la tête, la poitrine et les coudes du sol en contractant les érecteurs du rachis et le haut du dos. Rapprochez activement les omoplates et montez les coudes le plus haut possible. Maintenez la contraction pendant 1 à 2 secondes, puis redescendez lentement avec contrôle.


  Conseils :

  Gardez le regard vers le sol pour maintenir la nuque alignée avec la colonne sans forcer sur les cervicales.'
