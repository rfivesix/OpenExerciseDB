name: Crunch inversé
description: "Position de départ :\nAllongez-vous sur le dos sur un tapis, les bras\
  \ le long du corps et les paumes au sol pour vous stabiliser. Levez les jambes avec\
  \ les genoux et les hanches fléchis à 90 degrés.\n\nExécution :\n1. Contractez les\
  \ abdominaux pour ramener les genoux vers la poitrine.\n2. En fin de mouvement,\
  \ enroulez le bassin pour décoller les fessiers et le bas du dos de quelques centimètres\
  \ du sol.\n3. Marquez une pause d'une à deux secondes en contraction maximale en\
  \ haut.\n4. Redescendez lentement et avec contrôle le bassin jusqu'à la position\
  \ de départ.\n\nConseils :\nN'utilisez aucun élan des jambes ; concentrez-vous sur\
  \ l'enroulement de la colonne par les abdominaux."
