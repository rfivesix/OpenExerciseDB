name: Équilibre de la grenouille (Frog Stand)
description: |-
  Position de départ :
  • Accroupissez-vous au sol, pieds serrés, et posez les mains à plat à la largeur des épaules avec les doigts bien écartés.
  • Placez vos genoux contre l'extérieur des coudes ou en appui sur l'arrière de vos bras (triceps).

  Exécution :
  • Transférez lentement le poids de votre corps vers l'avant sur vos mains.
  • Décollez les pieds du sol l'un après l'autre jusqu'à tenir en équilibre sur vos mains avec les coudes fléchis.
  • Gainez le tronc, fixez le sol légèrement vers l'avant et stabilisez la posture grâce à la force des épaules et des doigts.
  • Maintenez cette position isométrique pendant la durée prévue (ex. 10 à 30 secondes) puis reposez doucement les pieds.
