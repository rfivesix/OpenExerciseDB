name: Haussements d'épaules au cadre guidé (Smith machine shrug)
description: |-
  Debout face à la barre guidée de la machine Smith, tenez la barre devant ou derrière les cuisses et haussez les épaules verticalement vers le haut sans rouler vers l'avant.
