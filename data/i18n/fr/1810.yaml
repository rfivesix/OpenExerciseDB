name: Posture du sphinx
description: "Position de départ :\nAllongez-vous à plat ventre sur un tapis, jambes\
  \ tendues à la largeur des hanches et dessus des pieds au sol. Placez vos avant-bras\
  \ parallèles au sol, les coudes alignés directement sous les épaules et les paumes\
  \ vers le bas.\n\nExécution :\n1. Pressez délicatement les avant-bras dans le sol\
  \ pour décoller la poitrine et la tête dans une douce extension dorsale.\n2. Rapprochez\
  \ les omoplates vers l'arrière et le bas, ouvrez la cage thoracique et regardez\
  \ devant vous.\n3. Ancrez le pubis dans le sol et respirez profondément et calmement.\n\
  4. Maintenez la posture pendant plusieurs respirations complètes avant de vous allonger\
  \ doucement.\n\nConseils :\nCherchez l'ouverture et l'extension au niveau de la\
  \ colonne thoracique plutôt qu'un pincement lombaire."
