name: Sphinx
description: |-
  Allongez-vous à plat ventre, les jambes tendues et le dessus des pieds posé au sol. Amenez vos avant-bras sous vos épaules, les coudes juste en dessous. Puis poussez vos mains dans le sol pour soulever la poitrine. Rapprochez vos omoplates, ouvrez les clavicules et dirigez votre regard vers l'avant, tout en gardant le bas du dos détendu.
