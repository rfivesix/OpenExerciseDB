name: Butterfly
description: Asseyez-vous sur la machine à butterfly, les pieds bien en contact avec le sol, les bras en position parallèle
  au sol. Rapprochez vos bras jusqu'à ce que les poignées soient pratiquement jointes (mais sans qu'elles se touchent !).
  Revenez lentement. Les poids doivent rester en permanence en suspension.
