name: Tirage assis à la poulie avec poignée en V
description: 'Position de départ :

  Asseyez-vous au tirage horizontal avec les pieds calés sur les repose-pieds et les genoux légèrement déverrouillés. Saisissez la poignée en V en prise neutre, buste droit et poitrine sortie.


  Exécution :

  Tirez la poignée vers le bas de l''abdomen en gardant les coudes près du corps. Resserrez fermement les omoplates au point de contraction maximale. Revenez lentement vers l''avant à bras tendus en contrôlant la charge jusqu''à sentir un bon étirement des dorsaux.


  Conseils :

  Évitez de balancer le buste d''avant en arrière; gardez le tronc stable pour cibler efficacement l''épaisseur du dos.'
