name: Crunchs à la poulie
description: Prenez le câble dans vos mains et tenez-le près de vos tempes. Mettez-vous à genoux, gardez le haut du corps
  droit et penchez-vous vers l'avant. Descendez d'un mouvement rapide en enroulant le dos (vos coudes pointent vers vos genoux).
  Une fois en bas, revenez lentement à la position initiale.
