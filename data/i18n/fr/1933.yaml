name: Crunch inversé
description: 'Position de départ :

  Allongez-vous sur le dos sur un tapis de sol avec les bras le long du corps pour stabiliser la posture. Levez les jambes avec les hanches et les genoux fléchis à 90 degrés.


  Exécution :

  Contractez la sangle abdominale pour décoller le bassin du sol et enrouler les genoux vers la poitrine avec fluidité. Marquez un temps d''arrêt en haut pour accentuer la contraction, puis redescendez le bassin lentement sous contrôle sans poser les pieds par terre.


  Conseils :

  Enroulez la colonne vertébrale sans donner d''à-coups avec les jambes et sans pousser excessivement sur les mains.'
