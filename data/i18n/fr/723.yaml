name: Tirage vertical en prise large
description: '- Asseyez-vous au poste de tirage vertical avec les cuisses bien calées
  sous les boudins de protection.

  - Saisissez la barre longue avec une prise pronation bien plus large que la largeur
  des épaules.

  - Tirez la barre vers le haut de la poitrine en ramenant les coudes vers le bas
  et l''arrière, tout en maintenant le torse bombé.

  - Resserrez bien les omoplates en fin de mouvement, puis contrôlez la remontée de
  la barre jusqu''à l''extension complète des bras.'
