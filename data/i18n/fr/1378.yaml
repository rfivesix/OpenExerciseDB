name: Élévations latérales à la poulie (un bras)
description: |-
  Position de départ :
  Placez-vous de profil à côté d'une poulie basse réglée au niveau du sol. Saisissez la poignée simple avec la main la plus éloignée de la machine (le câble passant devant ou derrière le corps). Tenez le montant de la poulie avec l'autre main pour vous stabiliser et inclinez légèrement le buste vers l'extérieur.

  Mouvement :
  En gardant le coude légèrement fléchi, élevez le bras latéralement dans un arc de cercle large jusqu'à ce que la main arrive à hauteur de l'épaule. Marquez un court arrêt pour contracter le deltoïde latéral, puis redescendez lentement la poignée sous tension continue.

  Conseils :
  Ne haussez pas les épaules et n'utilisez pas l'élan du buste. Concentrez l'effort sur le faisceau latéral de l'épaule.
