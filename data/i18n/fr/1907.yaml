description: 'Position de départ :

  Placez-vous en fente avec le pied avant à plat sur le sol et le pied arrière en appui sur la pointe des pieds. Mains sur les hanches, buste bien droit.


  Exécution :

  Fléchissez les deux genoux pour descendre verticalement jusqu''à ce que le genou arrière effleure le sol. Poussez sur le talon du pied avant pour remonter de manière fluide sans verrouiller l''articulation en haut. Enchaînez toutes les répétitions sur une jambe avant de changer de côté.


  Conseils :

  Gardez la sangle abdominale gainée et le buste vertical; le genou avant doit rester aligné avec la pointe du pied.'
