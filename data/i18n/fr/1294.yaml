name: Flexion des ischios sur une jambe au sol
description: 'Position de départ :

  Allongé sur le dos sur un tapis de sol, placez le talon d''une jambe sur le sol (ou sur un linge glissant) avec le genou
  légèrement plié, l''autre jambe étant relevée.


  Exécution :

  1. Décollez le bassin du sol en position de pont fessier unipodal.

  2. Tirez vigoureusement le talon vers les fessiers en fléchissant le genou pour contracter l''ischio-jambier.

  3. Revenez lentement à la position de départ en contrôlant l''extension de la jambe.'
