exercise_id: '1607'
language: fr
status: upstream_unreviewed
name: Tractions typewriter
description: |-
  Suspendez-vous à une barre de traction en prise pronation, légèrement plus large que la largeur des épaules. Tirez-vous vers le haut jusqu'à ce que votre menton dépasse la barre. En position haute, au lieu de redescendre tout droit, déplacez votre corps d'un côté en tendant un bras tout en gardant l'autre bras fléchi. Passez en douceur d'un côté à l'autre, comme le mouvement d'une machine à écrire, avant de redescendre. Cet exercice augmente le temps sous tension et renforce le grand dorsal, les biceps et les épaules tout en développant la force de tirage unilatérale.
