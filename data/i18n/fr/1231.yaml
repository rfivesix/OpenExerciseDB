name: Étirement du triceps au-dessus de la tête (droit)
description: |-
  Position de départ :
  • Tenez-vous debout ou assis, le dos bien droit.
  • Levez le bras droit au-dessus de la tête, pliez le coude et laissez descendre la main droite derrière la nuque entre les omoplates.

  Exécution :
  • Avec la main gauche, saisissez le coude droit et tirez-le doucement vers l'arrière et le bas.
  • Maintenez l'étirement confortable dans le triceps droit pendant 20 à 30 secondes.
  • Respirez profondément sans cambrer la colonne vertébrale.
