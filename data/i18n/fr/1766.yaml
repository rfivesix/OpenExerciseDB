name: Planche avec extension du bras
description: "Position de départ :\nInstallez-vous en planche sur les avant-bras,\
  \ les coudes sous les épaules et les pieds légèrement plus écartés que les hanches\
  \ pour assurer une base stable. Gainez fermement la sangle abdominale et les fessiers\
  \ pour maintenir le corps en ligne droite.\n\nExécution :\n1. Décollez un bras du\
  \ sol lentement et tendez-le droit devant vous à hauteur d'épaule.\n2. Maintenez\
  \ l'extension pendant 1 à 2 secondes en empêchant toute rotation ou inclinaison\
  \ du bassin.\n3. Reposez l'avant-bras avec contrôle et répétez immédiatement avec\
  \ l'autre bras en alternance.\n\nConseils :\nCet exercice cible l'anti-rotation\
  \ : conservez les hanches et les épaules parfaitement parallèles au sol."
