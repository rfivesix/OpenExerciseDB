name: Kickback triceps sur banc incliné aux haltères
description: |-
  Position de départ :
  Réglez un banc inclinable à environ 60 degrés. Allongez-vous à plat ventre, poitrine fermement appuyée contre le dossier et pieds au sol pour assurer la stabilité. Tenez un haltère dans chaque main, resserrez les omoplates et relevez les bras pour qu'ils soient parallèles au sol le long des côtes.

  Exécution :
  1. En gardant les bras immobiles, étendez les coudes vers l'arrière jusqu'à ce que les bras soient complètement tendus.
  2. Contractez fermement les triceps au sommet pendant une seconde complète.
  3. Fléchissez lentement les coudes avec contrôle pour revenir à l'angle droit de départ.

  Conseils :
  Le maintien du buste sur le banc supprime tout élan parasite et optimise le travail du chef long du triceps.
