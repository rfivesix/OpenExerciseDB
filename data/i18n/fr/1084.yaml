name: Développé au sol avec haltères (Floor Press)
description: |-
  Position de départ :
  Allongez-vous sur le dos au sol, genoux pliés et pieds à plat sur le sol. Tenez un haltère dans chaque main au niveau de la poitrine, l'arrière des bras posé au sol avec les coudes à environ 45 degrés du buste.

  Étapes :
  1. Développez les haltères vers le haut de façon explosive et contrôlée jusqu'à extension quasi-complète des bras.
  2. Contractez vigoureusement les pectoraux au sommet du mouvement.
  3. Redescendez lentement les haltères jusqu'à ce que les bras effleurent le sol.
  4. Marquez une courte pause au sol pour éliminer l'élan avant de repousser vers le haut.
