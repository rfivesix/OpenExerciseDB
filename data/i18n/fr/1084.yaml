name: Développé au sol avec haltères
description: |-
  Prenez vos haltères et allongez-vous à plat sur le dos, les genoux fléchis et les pieds bien à plat au sol (utilisez un banc si vous en avez un). Poussez les poids vers le haut en verrouillant les coudes (A). Abaissez-les lentement jusqu'à ce que le haut de vos bras repose au sol (B), près du corps. Marquez une pause ici avant de pousser à nouveau vers le haut de manière explosive. Contractez fortement les pectoraux et répétez.
