name: Planche dynamique
description: Commencez en position de planche, avec vos mains directement sous vos épaules et vos pieds écartés à la largeur
  des hanches. 2. Contractez vos abdominaux pour maintenir votre corps en ligne droite de la tête aux pieds. 3. À partir de
  cette position, pliez légèrement les genoux et sautez avec les deux pieds vers l'intérieur, en les rapprochant de votre
  tronc autant que possible. 4. Dès que vos pieds touchent le sol, poussez avec force pour sauter à nouveau et revenir à la
  position de planche initiale. 5. Continuez à répéter ce mouvement de saut, en gardant le contrôle et en maintenant la stabilité
  de votre tronc tout au long de l'exercice. 6. Assurez-vous de garder une respiration régulière pendant que vous sautez,
  en respirant profondément et en contrôlant votre respiration. 7. Gardez votre regard fixé sur le sol pour maintenir un bon
  alignement de la colonne vertébrale. 8. Répétez les sauts pendant la durée souhaitée ou selon le nombre de répétitions recommandé
  pour votre programme d'entraînement. 9. Pour terminer l'exercice, reposez-vous en relâchant la position de planche, puis
  étirez-vous si nécessaire pour détendre vos muscles.
