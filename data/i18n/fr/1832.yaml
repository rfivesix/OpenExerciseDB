name: Maintien en appui aux anneaux
description: "Position de départ :\nPlacez-vous entre les anneaux de gymnastique.\
  \ Agrippez les anneaux et poussez sur les bras pour vous hisser en appui tendu au-dessus\
  \ des anneaux.\n\nExécution :\n1. Tournez activement les anneaux vers l'extérieur\
  \ (RTO) de façon à ce que les paumes pointent vers l'avant.\n2. Abaissez fermement\
  \ les épaules loin des oreilles et verrouillez les coudes tendus.\n3. Adoptez une\
  \ posture de hollow body en gainant fortement abdominaux et fessiers, jambes jointes.\n\
  4. Maintenez cette position isométrique le temps indiqué avec une respiration calme.\n\
  \nConseils :\nLa rotation externe des anneaux empêche les avant-bras de s'appuyer\
  \ sur les sangles et décuple le recrutement stabilisateur."
