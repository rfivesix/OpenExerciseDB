name: Exercice du livre ouvert (Open Book)
description: "Position de départ :\nAllongez-vous sur le côté sur un tapis de sol,\
  \ les hanches et les genoux fléchis à 90 degrés l'un sur l'autre pour verrouiller\
  \ le bassin. Tendez les deux bras droit devant vous à hauteur de poitrine, paumes\
  \ l'une contre l'autre.\n\nExécution :\n1. Inspirez et levez le bras supérieur vers\
  \ le haut et l'arrière en décrivant un large arc de cercle, comme pour ouvrir un\
  \ livre.\n2. Faites pivoter la colonne thoracique en suivant la main du regard,\
  \ sans décoller les genoux l'un de l'autre.\n3. Expirez en fin de course pour ressentir\
  \ l'ouverture de la cage thoracique et de l'épaule pendant 1 à 2 secondes.\n4. Inspirez\
  \ et ramenez lentement le bras vers l'avant jusqu'à réunir les paumes.\n\nConseils\
  \ :\nLa rotation doit s'effectuer exclusivement au niveau du haut du dos sans mouvement\
  \ du bassin."
