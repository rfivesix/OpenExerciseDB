name: Relevé de buste papillon
description: |-
  Dans cet exercice à mi-amplitude, les muscles de vos bras vous fournissent un peu d'élan pour vous aider à décoller du sol. Vous les ouvrez également en position au-dessus de la tête, ce qui sollicite le haut du dos. Commencez allongé, les pieds à plat sur le sol, les genoux fléchis, les bras croisés contre la poitrine. En utilisant vos abdominaux, soulevez le haut du corps du sol tout en ouvrant les bras en position de cage (bras en « poteaux de but »), puis redescendez lentement pour revenir à la position de départ.
