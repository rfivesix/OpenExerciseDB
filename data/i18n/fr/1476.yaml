name: Sit-up papillon (Butterfly Sit-up)
description: |-
  Position de départ :
  Allongez-vous sur le dos sur un tapis, les plantes de pieds l'une contre l'autre et les genoux ouverts vers l'extérieur en papillon. Tendez les bras derrière la tête en touchant le sol avec les mains.

  Exécution :
  1. Contractez les abdominaux et utilisez un léger élan contrôlé des bras pour relever le torse.
  2. Montez jusqu'à la position assise complète en venant toucher le sol avec les mains devant vos pieds.
  3. Redescendez lentement en déroulant la colonne vertébrale jusqu'à retrouver la position de départ au sol.

  Conseils :
  L'ouverture des hanches désactive en partie les fléchisseurs de la hanche, concentrant ainsi l'effort sur les abdominaux.
