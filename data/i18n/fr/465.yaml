name: Curls au pupitre
description: |-
  Placez la barre EZ sur les supports devant le banc Larry Scott. Penchez-vous au-dessus du banc et saisissez la barre EZ, paumes vers le haut. Asseyez-vous sur le siège du banc Larry Scott de sorte que vos bras reposent sur le coussin et que votre poitrine soit appuyée contre le coussin. Abaissez le poids jusqu'à ce que vos coudes soient déployés et vos bras tendus. Remontez le poids jusqu'au point de départ en contractant les biceps. Répétez.
