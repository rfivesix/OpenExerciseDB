exercise_id: '178'
language: fr
status: ai_reviewed
name: Deadbug
description: Allongez-vous sur le dos, les hanches et les genoux fléchis à 90°. Levez les deux bras vers le plafond. Plaquez
  le bas de votre dos contre le sol pour supprimer tout espace. Commencez en tendant une jambe et en touchant le sol avec
  le talon. À mesure que vous tendez une jambe, expirez autant que possible en gardant le bas du dos collé au sol. Lorsque
  vous ne pouvez plus expirer, ramenez votre genou vers la position de départ. Rendez l'exercice plus difficile en tenant
  un poids dans les mains, ou en abaissant simultanément le bras et la jambe opposés.
