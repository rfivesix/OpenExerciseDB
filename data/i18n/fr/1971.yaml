name: Tirage Mentzer
description: |-
  Position de départ :
  Asseyez-vous à la machine de tirage vertical et ajustez le boudin pour caler fermement vos cuisses. Saisissez la barre avec une prise supination serrée (paumes tournées vers vous), à la largeur des épaules ou légèrement moins.

  Exécution :
  1. En gardant le buste droit et la cage thoracique ouverte, tirez la barre vers le haut de la poitrine en ramenant les coudes vers le bas et l'arrière.
  2. Marquez une pause d'une à deux secondes en bas du mouvement en contractant intensément les dorsaux et les biceps.
  3. Remontez lentement et sous contrôle jusqu'à l'extension complète des bras pour profiter d'un étirement maximal.

  Conseils :
  Ne donnez pas d'élan avec le dos ; concentrez-vous sur la tension continue et le contrôle du mouvement.
