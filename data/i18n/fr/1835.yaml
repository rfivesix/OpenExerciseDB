name: Rotation externe assise avec haltère
description: "Position de départ :\nAsseyez-vous sur un tapis ou un banc avec un genou\
  \ relevé, pied à plat. Posez le coude du bras actif sur le genou relevé, fléchi\
  \ à 90 degrés. Tenez un haltère léger avec l'avant-bras orienté horizontalement\
  \ vers l'avant.\n\nExécution :\n1. Gardez l'épaule basse et les omoplates bien fixées.\n\
  2. Faites pivoter l'avant-bras vers le haut jusqu'à ce qu'il soit vertical par rapport\
  \ au sol.\n3. Marquez une seconde d'arrêt en contraction maximale des rotateurs\
  \ externes.\n4. Redescendez lentement l'haltère à l'horizontale en contrôlant l'étirement.\n\
  \nConseils :\nEmployez une charge légère pour préserver et renforcer la coiffe des\
  \ rotateurs avec une technique stricte."
