name: "Jeté d'haltérophilie (Jerk)"
description: |-
  Position de départ :
  • Tenez la barre en position de rack avant, en appui sur les clavicules et les deltoïdes antérieurs.
  • Gardez le buste parfaitement vertical et gainé, pieds écartés à la largeur du bassin.

  Exécution :
  • Effectuez une flexion courte et verticale des genoux (dip) en gardant le torse droit.
  • Poussez de façon explosive avec les jambes pour projeter la barre vers le haut.
  • Glissez-vous instantanément sous la barre pour la verrouiller bras tendus au-dessus de la tête en position de fente (split).
  • Rapprochez les pieds parallèlement l'un à l'autre en stabilisant la barre au-dessus de la tête avant de la redescendre.
