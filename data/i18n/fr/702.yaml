name: Élévation des mollets sur une jambe
description: '- Placez l''avant d''un pied sur le bord d''une marche ou d''un bloc
  surélevé, l''autre jambe fléchie sans contact avec le sol.

  - Prenez appui avec une main contre un mur ou une rampe pour stabiliser votre équilibre.

  - Laissez descendre le talon aussi bas que possible pour bien étirer le mollet.

  - Poussez fermement sur l''avant du pied pour hisser le corps au point le plus haut
  en extension complète.

  - Marquez une pause au sommet, redescendez lentement et répétez avant de changer
  de jambe.'
