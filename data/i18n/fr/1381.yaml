name: Tirage assis à la machine pour le haut du dos
description: |-
  Position de départ :
  Asseyez-vous sur la machine de tirage horizontal, la poitrine bien calée contre le coussin d'appui. Réglez la hauteur du siège pour que les poignées soient au niveau du haut du buste. Saisissez les poignées en prise large ou neutre.

  Mouvement :
  Tirez les poignées vers vous en ouvrant les coudes vers l'extérieur et l'arrière. Resserrez fermement les omoplates en fin de course pour solliciter le haut du dos (trapèzes moyens et rhomboïdes). Revenez lentement à la position de départ en contrôlant la charge.

  Conseils :
  Gardez le buste plaqué contre le support tout au long du mouvement et évitez tout élan avec le bas du dos.
