name: Étirement des mollets debout
description: |-
  Position de départ :
  • Tenez-vous debout face à un mur à environ une longueur de bras et posez vos mains au mur à hauteur d'épaules.
  • Reculez une jambe vers l'arrière en fente.

  Exécution :
  • Gardez la jambe arrière parfaitement tendue avec le talon plaqué au sol.
  • Fléchissez le genou avant et avancez le bassin vers le mur jusqu'à ressentir un étirement net dans le mollet arrière (gastrocnémien).
  • Maintenez la position pendant 20 à 30 secondes puis changez de côté.
