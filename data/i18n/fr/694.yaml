name: Tirage menton avec haltères
description: '- Debout les pieds écartés à la largeur des épaules, tenez un haltère
  dans chaque main devant les cuisses, paumes vers le corps.

  - Montez les haltères verticalement le long du buste en menant avec les coudes vers
  le haut et l''extérieur jusqu''au niveau de la poitrine.

  - Marquez un temps d''arrêt en haut, puis redescendez lentement les charges avec
  contrôle.'
