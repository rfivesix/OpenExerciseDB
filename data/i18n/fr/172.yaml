name: Crunchs à la machine
description: La procédure est très semblable à celle des crunchs classiques, avec en plus la charge de la machine. Asseyez-vous
  sur la machine et posez fermement les deux pieds au sol. Saisissez les poids, les câbles, etc., et effectuez un mouvement
  d'enroulement vers l'avant (la colonne vertébrale doit idéalement se dérouler vertèbre par vertèbre). Revenez lentement
  à la position de départ.
