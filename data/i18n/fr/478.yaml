description: |-
  Amenez vos haltères sur vos épaules, paumes tournées vers l'intérieur ou légèrement vers l'avant. Inspirez et gainez votre sangle abdominale. Fléchissez légèrement les genoux et poussez de manière explosive avec les jambes pour vous aider à propulser les haltères au-dessus de la tête jusqu'à extension complète des bras. Redescendez les poids sous contrôle jusqu'à vos épaules, puis répétez.
