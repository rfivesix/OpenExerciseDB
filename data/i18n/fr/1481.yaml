name: Drag pushdown à la poulie
description: |-
  Position de départ :
  Tenez-vous debout face à une poulie haute équipée d'une corde. Saisissez les extrémités de la corde en prise neutre, pieds écartés à la largeur des épaules, buste légèrement incliné vers l'avant et cage thoracique sortie.

  Exécution :
  1. Laissez les coudes reculer légèrement tout en poussant la corde vers le bas le long du corps, au plus près du tronc.
  2. Tendez complètement les coudes en bas et écartez les extrémités de la corde pour contracter au maximum le chef long du triceps.
  3. Remontez lentement la corde de façon contrôlée en la gardant proche du corps.

  Conseils :
  Faire glisser la corde au ras du corps maximise le pic de contraction du triceps en fin de mouvement.
