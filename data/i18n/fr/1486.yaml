name: Tirage à la poulie haute en alternance
description: |-
  Position de départ :
  Fixez une poignée en position haute sur la poulie et reculez d'environ un mètre. Saisissez la poignée d'une main à hauteur de tête avec le coude légèrement fléchi, et reculez le pied du même côté en position décalée.

  Exécution :
  1. Tirez le coude vers le tronc en amorçant une légère rotation contrôlée pour engager le grand dorsal et le dos.
  2. Maintenez la contraction pendant une seconde au point d'effort maximal.
  3. Revenez avec contrôle à la position initiale, changez de main et de pied d'appui, et effectuez le mouvement de l'autre côté.

  Conseils :
  L'alternance permet de travailler le gainage anti-rotationnel tout en corrigeant les déséquilibres musculaires du dos.
