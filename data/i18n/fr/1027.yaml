name: Étirement de la prière sur banc surélevé
description: |-
  Position de départ :
  Mettez-vous à genoux devant un banc plat ou une surface surélevée. Posez les deux coudes sur le bord du banc écartés de la largeur des épaules et joignez les paumes de mains en position de prière.

  Étapes :
  1. Reculez le bassin vers les talons et laissez la poitrine descendre vers le sol, la tête passant entre les bras.
  2. Fléchissez les coudes pour amener les mains jointes vers la nuque.
  3. Maintenez l'étirement ressenti dans les grands dorsaux, les triceps et la cage thoracique pendant 20 à 40 secondes en respirant profondément.
  4. Relâchez doucement la posture.
