language: fr
status: ai_reviewed
name: Tractions de recrutement sur poutre
description: |-
  Position de départ :
  • Installez-vous sous une poutre d'escalade (hangboard) et sélectionnez une réglette adaptée.
  • Saisissez la réglette d'une seule main en gardant les pieds en appui au sol ou sur un support.
  • Adoptez un angle de coude ouvert entre 120 et 150 degrés (jamais en extension complète passive).

  Exécution :
  • Tirez vers le haut avec un effort isométrique maximal pendant 3 à 5 secondes pour recruter un maximum de fibres motrices.
  • Gardez l'épaule fermement engagée et verrouillée.
  • Prenez un repos complet avant de répéter le tirage sur le bras opposé.
