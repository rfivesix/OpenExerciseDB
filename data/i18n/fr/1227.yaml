name: Rowing pour deltoïdes postérieurs aux haltères
description: |-
  Position de départ :
  • Tenez un haltère dans chaque main et penchez-vous vers l'avant à partir des hanches avec le dos plat jusqu'à être presque parallèle au sol.
  • Laissez pendre vos bras verticalement sous les épaules, paumes orientées vers l'arrière (prise pronation).

  Exécution :
  • Tirez les coudes vers le haut et largement écartés sur les côtés à un angle d'environ 90 degrés par rapport au buste.
  • Montez jusqu'à ce que les bras soient parallèles au sol en contractant l'arrière de l'épaule (deltoïde postérieur).
  • Redescendez lentement sous contrôle sans arrondir le dos.
