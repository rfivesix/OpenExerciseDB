name: Rowing pour deltoïdes postérieurs aux haltères
description: |-
  Tenez un haltère dans chaque main. Penchez-vous au niveau des hanches pour rendre votre dos presque parallèle au sol. Laissez vos bras pendre vers le bas. Gardez vos bras dans l'alignement de vos épaules. Fléchissez et levez vos coudes vers les côtés jusqu'à ce que vos bras soient parallèles au sol. Redescendez lentement et répétez.
