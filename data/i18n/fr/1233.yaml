name: Étirement du biceps debout au mur (droit)
description: |-
  Position de départ :
  • Tenez-vous debout avec le flanc droit près d'un mur.
  • Tendez le bras droit vers l'arrière et posez la paume de la main droite à plat contre le mur à hauteur d'épaule.

  Exécution :
  • Tournez doucement le torse et les pieds vers la gauche en vous détournant du mur.
  • Maintenez la position dès que vous ressentez un bon étirement dans le biceps droit et l'avant de l'épaule.
  • Gardez la posture pendant 20 à 30 secondes en respirant calmement.
