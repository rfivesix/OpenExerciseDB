exercise_id: '1219'
language: fr
status: ai_reviewed
name: Tractions australiennes
description: |-
  Position de départ :
  • Installez-vous sur le dos sous une barre basse réglée à hauteur de taille et saisissez-la en supination (paumes vers vous).
  • Gardez le corps bien droit et gainé de la tête aux talons.

  Exécution :
  • Fléchissez les coudes et hissez votre poitrine vers la barre en resserrant les omoplates.
  • Maintenez la contraction au sommet une seconde pour solliciter au maximum les dorsaux et les biceps.
  • Redescendez lentement sous contrôle jusqu'à l'extension complète des bras.
