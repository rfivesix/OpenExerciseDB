name: Étirement en flexion horizontale de l'épaule
description: |-
  Levez le bras sur le côté en posant la main sur un mur ou un encadrement de porte à côté de vous, à hauteur d'épaule
  Tournez le corps à l'opposé du bras pour étirer les pectoraux, aussi loin que possible sans inconfort
