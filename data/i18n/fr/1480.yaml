name: Extensions des triceps allongé à la barre
description: |-
  Position de départ :
  Allongez-vous sur un banc plat, en tenant une barre avec une prise pronation à la largeur des épaules. Tendez les bras vers le haut, perpendiculaires au corps ou légèrement inclinés vers l'arrière.

  Exécution :
  1. En gardant les bras immobiles et les coudes serrés vers l'avant, fléchissez uniquement les coudes pour descendre la barre avec contrôle vers le front ou juste au-dessus de la tête.
  2. Ne laissez pas les coudes s'écarter vers l'extérieur.
  3. Poussez à travers les triceps pour tendre à nouveau les bras et ramener la barre en position de départ.

  Conseils :
  Gardez les coudes stables pendant toute la durée du mouvement pour cibler précisément les trois chefs du triceps.
