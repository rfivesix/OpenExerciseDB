name: Hip thrust à une jambe avec haltère
description: |-
  Position de départ :
  • Asseyez-vous au sol, le haut du dos calé contre le bord d'un banc stable.
  • Placez un haltère sur le bassin en le maintenant fermement avec vos mains.
  • Posez un pied à plat au sol (jambe active) avec le genou à 90 degrés et décollez l'autre jambe du sol genou fléchi.

  Exécution :
  • Poussez puissamment sur le talon d'appui pour étendre la hanche jusqu'à ce que le torse et la cuisse forment une ligne horizontale droite.
  • Contractez au maximum le grand fessier en haut pendant 1 à 2 secondes.
  • Redescendez le bassin sous contrôle et enchaînez la série avant de passer à l'autre jambe.
