name: Extension des triceps à la corde avec balancement
description: |-
  Placez vos pieds sous la corde et inclinez le haut du corps vers la corde. Reculez un pied. Poussez la corde vers le bas et basculez tout votre corps en arrière sur le pied arrière au moment de la poussée afin d'amener vos mains derrière le corps. N'oubliez pas de ramener la poitrine vers l'avant pendant la poussée. Lorsque vous relâchez lentement la corde, ramenez votre corps en avant sur le pied avant.
