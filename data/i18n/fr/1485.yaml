name: Extension des triceps à la corde avec balancement (Rocking Pushdown)
description: |-
  Position de départ :
  Tenez-vous debout face à une poulie haute avec corde, pieds en fente décalée. Saisissez la corde en prise neutre et inclinez le haut du corps vers l'avant, le poids reposant sur le pied avant.

  Exécution :
  1. Poussez la corde vers le bas en transférant le poids de votre corps vers l'arrière sur le pied arrière pour amener les mains derrière la ligne du buste.
  2. Écartez les extrémités de la corde en bas pour contracter au maximum les triceps.
  3. Remontez la corde lentement avec contrôle tout en revenant en appui sur le pied avant.

  Conseils :
  Ce léger mouvement de bascule augmente l'amplitude en fin de poussée et sollicite intensément le chef long du triceps.
