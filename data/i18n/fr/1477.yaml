name: Tire-bouchon assis (Seated Corkscrew)
description: |-
  Position de départ :
  Asseyez-vous au sol en plaçant vos mains derrière vous pour vous stabiliser. Inclinez légèrement le buste vers l'arrière, décollez les pieds du sol et fléchissez légèrement les genoux.

  Exécution :
  1. Ramenez les genoux vers la poitrine tout en effectuant une rotation vers un côté pour engager intensément les obliques.
  2. Tendez à nouveau les jambes vers l'avant sans poser les pieds au sol.
  3. Ramenez ensuite les genoux vers la poitrine en effectuant la rotation vers le côté opposé.
  4. Alternez ainsi de manière fluide et rythmée.

  Conseils :
  Gardez le gainage abdominal actif pendant toute la série et contrôlez l'extension des jambes.
