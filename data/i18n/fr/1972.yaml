name: Tirage vertical à un bras
description: |-
  Asseyez-vous à la machine de tirage vertical et saisissez la poignée individuelle en prise neutre. Gardez le torse stable, la poitrine ouverte et les omoplates légèrement rétractées. Commencez bras complètement tendu au-dessus de la tête, puis tirez la poignée vers le haut de la poitrine en suivant une trajectoire contrôlée et légèrement diagonale. Concentrez-vous sur l'engagement du grand dorsal tout en gardant l'épaule basse et en évitant toute rotation du torse. Revenez lentement à la position de départ, en gardant le contrôle tout au long du mouvement.
