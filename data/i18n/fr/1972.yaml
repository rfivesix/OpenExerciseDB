name: Tirage vertical à un bras
description: |-
  Position de départ :
  Asseyez-vous à la machine de tirage vertical et saisissez la poignée simple en prise neutre (paume vers l'intérieur). Gardez le buste stable, la poitrine haute et les abdominaux gainés.

  Exécution :
  1. Tirez la poignée vers le haut de la poitrine en guidant le coude vers le bas et le côté de la cage thoracique.
  2. Maintenez la contraction maximale du grand dorsal pendant 1 seconde en bas du mouvement.
  3. Laissez la poignée remonter lentement et sous contrôle jusqu'à l'extension complète du bras pour étirer le dorsal.
  4. Effectuez la série complète puis changez de côté.

  Conseils :
  Évitez toute rotation ou inclinaison du torse pendant la traction ; concentrez-vous sur le travail du dos.
