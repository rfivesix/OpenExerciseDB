name: Exercice d'adduction de Copenhague
description: |-
  Allongez-vous sur le côté, le coude placé directement sous l'épaule, comme dans une position de planche latérale. Posez la jambe supérieure sur un banc, l'intérieur du pied ou de la cheville reposant dessus. Soulevez les hanches et maintenez le corps en ligne droite tout en gardant la jambe inférieure décollée du sol. Cet exercice active fortement les adducteurs de la jambe supérieure tout en sollicitant également le tronc et les stabilisateurs de la hanche.
