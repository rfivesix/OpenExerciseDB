name: Élévations au sol en Y-W-T
description: |-
  Position de départ :
  Allongez-vous à plat ventre sur un tapis, la nuque alignée avec la colonne et le regard vers le sol.

  Étapes :
  1. Position Y : Tendez les bras vers l'avant à 45 degrés pour former un 'Y', pouces vers le plafond. Décollez la poitrine et les bras du sol en resserrant les omoplates pendant 10 à 20 secondes.
  2. Position W : Tirez les coudes vers le bas et les côtes pour former un 'W', en maintenant les bras surélevés et le haut du dos contracté.
  3. Position T : Ouvrez les bras tendus sur les côtés perpendiculairement au tronc pour former un 'T', pouces vers le haut, en pinçant fortement les omoplates.
  4. Enchaînez les positions avec contrôle pour renforcer les fixateurs d'omoplates.
