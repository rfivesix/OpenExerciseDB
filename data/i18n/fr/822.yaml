name: Oiseau à la poulie
description: '- Réglez les poulies à hauteur des yeux ou légèrement au-dessus de la
  tête.

  - Saisissez la poulie gauche avec la main droite et la poulie droite avec la main
  gauche, en croisant les câbles devant vous.

  - Écartez les bras vers l''extérieur et l''arrière en décrivant un large arc de
  cercle horizontal, coudes légèrement fléchis mais fixes.

  - Marquez un arrêt au point de contraction maximale des deltoïdes postérieurs, puis
  revenez lentement à la position de départ.'
