description: |-
  Allongez-vous sur le côté sur un tapis avec un haltère léger dans la main supérieure. Gardez le coude plié à 90° et plaqué contre le flanc. Effectuez une rotation externe de l'avant-bras vers le haut, en éloignant la charge de l'abdomen pour cibler l'infra-épineux et le petit rond, puis redescendez lentement sous contrôle.
