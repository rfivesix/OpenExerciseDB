name: Glissements muraux (Wall Slides)
description: '- Tenez-vous debout le dos contre un mur, talons, fessiers, haut du
  dos et arrière de la tête en contact léger avec le mur.

  - Placez vos bras en ''W'' avec les coudes pliés à 90 degrés, les coudes et le dos
  des mains collés au mur.

  - Faites glisser les bras vers le haut le long du mur en forme de ''Y'', sans cambrer
  le bas du dos ni décoller les bras.

  - Redescendez lentement à la position de départ en abaissant activement les omoplates.'
