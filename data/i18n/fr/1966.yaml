name: Rotation thoracique en fente basse contre un mur
description: 'Position de départ :

  Placez-vous en position de chevalier servant (un genou au sol) à côté d''un mur, la jambe avant fléchie à 90 degrés du côté du mur. Vous pouvez coincer un ballon en mousse entre votre genou avant et le mur pour stabiliser le bassin. Tendez les deux bras devant vous à hauteur d''épaules.


  Exécution :

  Ouvrez le bras extérieur vers l''arrière dans un grand mouvement circulaire en tournant le haut du buste et le regard. Gardez le genou avant et les hanches orientés droit devant sans bouger. Maintenez l''ouverture maximale pendant 1 à 2 secondes puis ramenez le bras vers l''avant.


  Conseils :

  Ce calage contre le mur isole la rotation dans la colonne thoracique sans laisser la région lombaire compenser.'
