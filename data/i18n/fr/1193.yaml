name: Russian twist avec haltère
description: |-
  Position de départ :
  • Asseyez-vous sur un tapis, genoux pliés et talons posés au sol (ou pieds décollés pour plus d'intensité).
  • Tenez un haltère à deux mains devant votre poitrine.
  • Inclinez le buste vers l'arrière à environ 45 degrés en gardant le dos droit et la sangle abdominale engagée.

  Exécution :
  • Faites pivoter votre torse vers la droite en amenant l'haltère près du sol à côté de votre hanche.
  • Marquez un arrêt puis tournez le buste vers la gauche de manière fluide et contrôlée.
  • Concentrez la rotation au niveau des obliques en maintenant les genoux et les hanches les plus stables possible.
