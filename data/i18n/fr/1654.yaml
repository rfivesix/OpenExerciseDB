name: Élévation latérale à la machine
description: |-
  L'élévation latérale à la machine est un exercice d'isolation qui cible le faisceau moyen (latéral) du deltoïde afin de développer des épaules plus larges et plus dessinées. La trajectoire fixe de la machine offre une plus grande stabilité que les haltères, ce qui la rend idéale pour les débutants ou pour ceux qui souhaitent se concentrer uniquement sur l'activation musculaire.
