name: Maintien latéral dynamique sur une jambe avec kettlebell
description: |-
  Position de départ :
  Enroulez un élastique autour de la poignée d'une kettlebell et tenez l'élastique d'une main pour laisser pendre la charge à côté du corps. Tenez-vous debout, colonne bien droite.

  Étapes :
  1. Décollez un pied du sol pour vous placer en équilibre sur une seule jambe.
  2. Gainez puissamment les abdominaux obliques et la hanche pour résister aux mouvements oscillatoires de la kettlebell.
  3. Maintenez la posture stable pendant la durée ciblée, en changeant éventuellement de jambe d'appui en cours de série.
  4. Répétez l'exercice avec l'autre main.
