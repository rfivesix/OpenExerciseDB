exercise_id: '1580'
language: fr
status: ai_reviewed
name: Rowing landmine unilatéral perpendiculaire
description: |-
  Position de départ:
  Installez une barre dans un support landmine de façon à ce qu'elle soit perpendiculaire (à 90 degrés) par rapport à votre corps. Tenez-vous debout à côté du manchon de chargement, inclinez le buste vers l'avant à partir des hanches en gardant le dos droit, et saisissez le manchon de la barre à une main.

  Exécution:
  Gaine la sangle abdominale et tirez la barre vers le côté de la poitrine ou le bas des côtes. Conduisez le coude vers l'arrière et le haut sans tourner le torse. Contractez fermement le grand dorsal au sommet du mouvement, puis redescendez la barre de façon contrôlée jusqu'à extension complète du bras.

  Conseils:
  - Gardez le dos neutre et résistez à toute rotation du buste lors du tirage.
  - Tirez en initiant le mouvement par le coude pour maximiser le recrutement du dos.
