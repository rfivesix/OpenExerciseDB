name: Étirement des fléchisseurs de hanche avec pied arrière surélevé
description: 'Position de départ :

  Placez-vous en fente devant un banc ou un support, le cou-de-pied de la jambe arrière posé sur le support et le genou au sol sur un tapis. La jambe avant est fléchie à 90 degrés, buste droit.


  Exécution :

  Basculez le bassin en rétroversion et contractez puissamment le fessier de la jambe arrière en avançant légèrement les hanches. Maintenez l''étirement intense du psoas et du quadriceps pendant 3 secondes, relâchez légèrement et répétez 5 à 10 fois par côté de manière dynamique.


  Conseils :

  Fait partie de la routine Limber 11. Ne cambrez pas le bas du dos; l''activation du grand fessier est indispensable pour étirer les fléchisseurs de hanche en toute sécurité.'
