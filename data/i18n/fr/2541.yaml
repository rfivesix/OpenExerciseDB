name: Extension triceps unilatérale isométrique à la poulie
description: |-
  Position de départ :
  Debout face à une poulie haute, saisissez une poignée simple d'une main. Plaquez fermement le haut du bras contre le flanc, le coude fléchi à 90 degrés. Inclinez légèrement le buste vers l'avant et gainez la sangle abdominale.

  Exécution :
  1. Poussez la poignée vers le bas en tendant le bras jusqu'à extension quasi-complète (ou à l'angle ciblé).
  2. Maintenez cette contraction de manière strictement statique contre la résistance du câble pendant la durée fixée, en contractant le triceps au maximum.
  3. Laissez remonter la poignée avec lenteur et contrôle jusqu'à 90 degrés, puis répétez de l'autre bras.

  Conseils :
  Le coude doit rester immobile et collé aux côtes pendant tout le maintien. Ne compensez pas en penchant le poids du corps sur la charge.
