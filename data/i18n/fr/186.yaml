name: Développé couché décliné aux haltères
description: |-
  Prenez deux haltères et asseyez-vous sur un banc décliné, les pieds fermement posés au sol, la tête reposant sur le banc. Tenez les poids près de la poitrine, à la hauteur des mamelons, et poussez-les vers le haut jusqu'à ce que les bras soient tendus. Redescendez la charge lentement et de façon contrôlée.
