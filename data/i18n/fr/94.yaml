name: Curl biceps avec barre SZ
description: |-
  Tenez la barre SZ à la largeur des épaules, le dos droit, les épaules légèrement en arrière, les bras tendus. Fléchissez les bras en montant la charge d'un mouvement rapide. Sans marquer de pause, redescendez la barre d'un mouvement lent et contrôlé.
  Ne laissez pas votre corps se balancer pendant l'exercice : tout le travail est effectué par les biceps, qui sont les seuls muscles qui doivent bouger (faites attention aux coudes).
