name: Rotations du tronc à la poulie
description: Réglez la poulie à câble légèrement en dessous de la hauteur de la poitrine. Gardez le corps tourné vers l'avant
  et les hanches stables. Saisissez la poignée de la poulie, tendez complètement les bras et amenez-les vers l'avant en traversant
  votre corps. Maintenez la position pendant 1 seconde à la fin du mouvement, puis revenez lentement à la position de départ.
