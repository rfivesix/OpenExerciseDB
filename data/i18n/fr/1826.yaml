name: Écarté à l'élastique avec rotation externe
description: "Position de départ :\nTenez-vous debout, pieds à la largeur des épaules\
  \ et buste droit. Tenez un élastique léger dans vos deux mains en prise supination\
  \ (paumes vers le haut) devant le nombril. Fléchissez les coudes à 90 degrés et\
  \ serrez les bras contre les flancs.\n\nExécution :\n1. En gardant les coudes plaqués\
  \ contre vos côtes, ouvrez les avant-bras vers l'extérieur en étirant l'élastique.\n\
  2. Resserrez et abaissez les omoplates à la fin du mouvement de rotation externe.\n\
  3. Marquez une pause d'une à deux secondes en contraction maximale des rotateurs\
  \ externes.\n4. Ramenez lentement les mains vers l'avant à la position de départ.\n\
  \nConseils :\nNe décollez jamais les coudes des côtes afin d'isoler parfaitement\
  \ la coiffe des rotateurs."
