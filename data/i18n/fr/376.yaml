translated_from: de
description: |-
  Position de départ :
  Allongez-vous sur le dos, les pieds joints et les bras le long du corps.

  Étapes :
  1. Fléchissez légèrement les genoux puis tendez les jambes vers le haut.
  2. Gardez les jambes tendues et descendez-les ensemble de manière contrôlée sans toucher le sol. Plus la descente est basse, plus l'effort est intense.
  3. Remontez les deux jambes ensemble jusqu'à la verticale.
  4. Répétez à partir de l'étape 2.
