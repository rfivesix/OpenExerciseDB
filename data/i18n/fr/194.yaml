name: Dips
description: |-
  Le dip est un exercice de musculation pour le haut du corps. Les dips à prise serrée, à largeur d'épaules, sollicitent principalement les triceps, les principaux muscles synergistes étant le deltoïde antérieur, les muscles pectoraux (sternal, claviculaire et petit pectoral) et les rhomboïdes du dos (dans cet ordre).[1] Un entraînement bras écartés met davantage l'accent sur les pectoraux, de la même manière qu'un développé couché à prise large sollicite davantage les pectoraux et moins les triceps.
