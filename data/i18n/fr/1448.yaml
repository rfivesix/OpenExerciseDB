name: Curl en W assis avec haltères
description: |-
  Position de départ :
  • Asseyez-vous sur un banc incliné à environ 60 degrés, le dos bien calé.
  • Laissez pendre les bras le long du corps avec les paumes orientées vers l'extérieur.

  Exécution :
  • Fléchissez les coudes en montant les haltères vers le haut et l'extérieur pour former un « W » avec vos bras.
  • Contractez vigoureusement le chef court du biceps au sommet du mouvement.
  • Redescendez lentement les charges sous contrôle jusqu'à l'extension complète des bras.
