name: Combo hyperextension Y-W avec disques
description: |-
  Position de départ :
  Installez-vous sur un banc à lombaires (banc à hyperextensions ou chaise romaine), les chevilles calées et le bassin contre le coussin. Tenez un petit disque de poids dans chaque main.

  Exécution :
  1. Redressez le torse dans l'alignement des jambes en contractant les érecteurs du rachis et les fessiers.
  2. Levez les bras vers l'avant et le haut en formant un « Y » pour activer le bas des trapèzes.
  3. Ramenez ensuite les coudes vers le bas et l'arrière pour dessiner un « W », en serrant fermement les omoplates.
  4. Redescendez le torse de façon contrôlée avant d'entamer la répétition suivante.

  Conseils :
  Utilisez des disques très légers afin de privilégier un contrôle strict des omoplates et de la coiffe des rotateurs.
