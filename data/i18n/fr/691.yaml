name: Tirage menton, à la Smith machine
description: '- Debout face à la barre du cadre guidé, pieds à largeur d''épaules,
  saisissez la barre en pronation avec un écartement légèrement inférieur à la largeur
  des épaules.

  - Tirez la barre verticalement le long du torse en guidant avec les coudes vers
  le haut et l''extérieur jusqu''au haut de la poitrine.

  - Marquez un court temps d''arrêt au sommet, puis redescendez la charge de manière
  lente et maîtrisée.'
