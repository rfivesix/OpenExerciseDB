name: Machine à curl biceps
description: |-
  La machine à curl biceps est conçue pour isoler les muscles biceps et offrir une amplitude de mouvement contrôlée. Asseyez-vous sur la machine, le dos contre le dossier, et réglez le siège de sorte que vos bras soient alignés avec les poignées ou les coussinets de la machine. Saisissez fermement les poignées, en gardant les coudes fixes, et remontez les poignées en contractant vos biceps. Abaissez lentement les poignées vers la position de départ en gardant le contrôle tout au long du mouvement.
