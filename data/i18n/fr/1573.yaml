name: Roue abdominale
description: 'Position de départ : Agenouillez-vous au sol avec la roue abdominale
  placée devant vous.

  Saisissez la roue : Tenez fermement les poignées.

  Déroulez : Faites rouler lentement la roue vers l''avant en tendant le corps tout
  en gardant les abdominaux contractés.

  Revenez : Ramenez la roue vers vos genoux en maintenant la tension dans les abdominaux.'
