name: Leg curl (allongé)
description: |-
  Allongez-vous sur un banc et placez vos mollets derrière le rouleau (de préférence en appui autour du bas des mollets). Maintenez une prise sur les poignées pour bien stabiliser le corps. Fléchissez vos jambes en montant la charge, puis revenez lentement. Pendant l'exercice, le corps ne doit pas bouger, tout le travail est effectué par les jambes.
