name: Développé épaules isométrique à la poulie
description: |-
  Position de départ :
  Positionnez-vous au centre d'une station de poulies basses en tenant les poignées à hauteur d'épaules, paumes vers l'avant et coudes placés sous les poignets. Adoptez une posture stable, pieds écartés à la largeur des épaules, en gainant les abdominaux et les fessiers.

  Exécution :
  1. Poussez les poignées vers le haut jusqu'à hauteur du front ou à bout de bras juste avant le verrouillage des coudes.
  2. Maintenez cette position statique sous la tension constante du câble pendant la durée indiquée, en contractant fermement les deltoïdes antérieurs et les triceps.
  3. Redescendez les poignées lentement et avec contrôle à hauteur des clavicules à la fin du maintien.

  Conseils :
  Gardez la colonne vertébrale neutre et évitez de cambrer le bas du dos. Respirez calmement pendant toute la phase de contraction isométrique.
