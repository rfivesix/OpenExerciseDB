exercise_id: '1225'
language: fr
status: ai_reviewed
name: Curls biceps larges aux haltères
description: |-
  Position de départ :
  • Tenez-vous debout avec un haltère dans chaque main, paumes tournées vers l'avant.
  • Écartez légèrement les avant-bras vers l'extérieur au-delà de la largeur des épaules, coudes fixés le long du buste.

  Exécution :
  • Fléchissez les coudes pour monter les haltères selon cette trajectoire ouverte vers les épaules afin de cibler le chef court du biceps.
  • Marquez une contraction marquée en haut puis redescendez lentement sous contrôle.
