name: Coquille (Clamshell)
description: "Position de départ :\nAllongez-vous sur le côté sur un tapis, les hanches\
  \ fléchies à 45 degrés et les genoux pliés à 90 degrés l'un sur l'autre, talons\
  \ joints. Reposez votre tête sur le bras du bas et placez la main du haut sur votre\
  \ hanche.\n\nExécution :\n1. En gardant les talons collés ensemble, ouvrez lentement\
  \ le genou supérieur vers le haut comme une coquille qui s'ouvre.\n2. Montez le\
  \ genou au maximum sans laisser le bassin basculer vers l'arrière.\n3. Contractez\
  \ le moyen fessier pendant 1 à 2 secondes au sommet.\n4. Redescendez lentement le\
  \ genou jusqu'à la position de départ.\n\nConseils :\nGardez le bassin bien vertical\
  \ et perpendiculaire au sol tout au long du mouvement."
