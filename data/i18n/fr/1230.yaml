name: Étirement du triceps au-dessus de la tête (gauche)
description: |-
  Position de départ :
  • Tenez-vous debout ou assis, le dos bien droit.
  • Levez le bras gauche au-dessus de la tête, pliez le coude et laissez descendre la main gauche derrière la nuque entre les omoplates.

  Exécution :
  • Avec la main droite, saisissez le coude gauche et tirez-le doucement vers l'arrière et le bas.
  • Maintenez l'étirement confortable dans le triceps gauche pendant 20 à 30 secondes.
  • Respirez régulièrement sans cambrer le bas du dos.
