name: Superman à genoux (Bird Dog)
description: 'Position de départ :

  Placez-vous à quatre pattes sur un tapis, mains sous les épaules et genoux sous les hanches. Dos plat et sangle abdominale engagée.


  Exécution :

  Tendez simultanément un bras vers l''avant et la jambe opposée vers l''arrière jusqu''à ce qu''ils soient alignés avec le tronc. Maintenez la position pendant 2 à 3 secondes en stabilisant le bassin. Revenez avec contrôle puis répétez du côté opposé.


  Conseils :

  Ne cambrez pas le bas du dos et veillez à ce que les hanches restent bien parallèles au sol.'
