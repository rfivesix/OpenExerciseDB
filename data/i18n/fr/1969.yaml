name: Extension triceps unilatérale à la poulie
description: 'Position de départ :

  Debout face à la poulie haute, pieds écartés à la largeur des épaules. Fixez une poignée simple et tenez-la en prise pronation, coude fléchi à 90 degrés et collé contre le flanc. Buste légèrement penché vers l''avant et gainé.


  Exécution :

  Poussez la poignée vers le bas en tendant l''avant-bras jusqu''à extension complète du triceps. Marquez un temps d''arrêt d''une seconde en contraction maximale, puis laissez remonter la charge lentement sous contrôle jusqu''à 90 degrés.


  Conseils :

  Gardez le bras et le coude parfaitement immobiles contre les côtes; n''utilisez aucun élan du haut du corps.'
