name: Extension des fessiers au GHD
description: |-
  Position de départ :
  • Installez-vous à plat ventre sur le banc GHD (ou banc à lombaires), les chevilles fermement calées sous les rouleaux.
  • Positionnez le bassin juste au bord du coussin pour permettre une libre flexion des hanches.
  • Croisez les bras sur la poitrine ou placez les mains derrière la tête.

  Exécution :
  • Penchez le buste vers le bas en fléchissant au niveau des hanches tout en gardant le dos droit.
  • Contractez puissamment les fessiers et les ischio-jambiers pour redresser le buste jusqu'à l'alignement avec les cuisses.
  • Marquez un temps d'arrêt en serrant les fessiers, puis redescendez de manière contrôlée.
