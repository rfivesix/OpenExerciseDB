name: Fente arrière à la barre
description: "Position de départ :\nPlacez une barre sur le haut du dos. Tenez-vous\
  \ debout, pieds à la largeur des hanches, poitrine fière et sangle abdominale engagée.\n\
  \nExécution :\n1. Faites un pas en arrière contrôlé avec une jambe en maintenant\
  \ les hanches bien droites.\n2. Abaissez le bassin jusqu'à ce que la cuisse avant\
  \ soit parallèle au sol et le genou arrière effleure le sol.\n3. Poussez fortement\
  \ à travers le talon de la jambe AVANT pour remonter en position debout.\n4. Répétez\
  \ en alternant les jambes ou effectuez toutes les répétitions d'un côté.\n\nConseils\
  \ :\nPoussez bien à travers le talon avant et n'utilisez pas le pied arrière comme\
  \ tremplin."
