name: Épaulé-développé (clean and press)
description: "Le premier tirage : Soulevez la barre du sol jusqu'à hauteur des genoux\
  \ en poussant avec les jambes, en gardant l'angle de votre dos constant.\nLa position\
  \ de « puissance » : Lorsque la barre atteint le milieu des cuisses, haussez explosivement\
  \ les épaules et étendez les hanches pour créer une impulsion verticale.\nLe passage\
  \ rapide des coudes : Pendant la phase de réception, faites pivoter rapidement vos\
  \ coudes sous la barre pour créer une « tablette » sur vos deltoïdes antérieurs.\n\
  La poussée verticale : Poussez la barre en ligne droite ; votre tête doit se décaler\
  \ légèrement vers l'avant une fois que la barre dépasse votre front afin d'atteindre\
  \ le verrouillage complet."
