name: Oiseau sur banc incliné
description: '- Allongez-vous à plat ventre sur un banc incliné à 30-45 degrés, un
  haltère dans chaque main, bras pendants vers le sol.

  - En gardant les coudes légèrement fléchis mais fixes, élevez les haltères sur les
  côtés jusqu''à ce qu''ils atteignent la hauteur des épaules.

  - Contractez fortement les deltoïdes postérieurs et le haut du dos en haut du mouvement.

  - Redescendez lentement les haltères de manière contrôlée sans à-coups.'
