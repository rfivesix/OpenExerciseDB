name: Curl avec haltères allongé
description: Prenez un haltère dans chaque main et allongez-vous sur le dos sur un
  banc, comme pour un développé couché classique. Laissez vos bras pendre sur les
  côtés, les haltères touchant éventuellement le sol. Commencez maintenant à soulever
  les haltères vers le haut jusqu'à ce que vos avant-bras soient perpendiculaires
  au plafond. Abaissez lentement les haltères jusqu'à ce qu'ils touchent presque à
  nouveau le sol. Gardez les coudes en place pour minimiser la triche.
