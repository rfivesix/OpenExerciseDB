name: Étirement de l'élévateur de la scapula gauche
description: |-
  Position de départ :
  Asseyez-vous ou tenez-vous debout le dos droit. Tournez la tête d'environ 45 degrés vers la gauche. Placez la main droite dans le bas du dos ou sous la cuisse pour abaisser l'épaule droite. Posez la main gauche sur l'arrière de la tête.

  Étapes :
  1. Inclinez doucement le menton vers le bas en direction de l'aisselle gauche jusqu'à ressentir un étirement confortable à l'arrière du cou et vers l'omoplate.
  2. Maintenez une légère traction avec la main gauche sans forcer.
  3. Conservez la posture pendant 20 à 30 secondes en respirant calmement, puis relâchez lentement.
search_terms:
