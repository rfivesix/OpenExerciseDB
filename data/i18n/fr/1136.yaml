name: Tirage vertical en prise neutre
description: |-
  Position de départ :
  • Asseyez-vous au tirage vertical et ajustez les boudins pour bien caler vos cuisses.
  • Saisissez la poignée de tirage en prise neutre (paumes face à face).
  • Bombez le torse et gardez le dos droit avec une légère inclinaison naturelle vers l'arrière.

  Exécution :
  • Tirez la poignée vers le haut de votre poitrine en guidant le mouvement avec les coudes vers le bas et l'arrière.
  • Resserrez les omoplates et contractez fortement les dorsaux en bas du mouvement pendant une seconde.
  • Laissez remonter la charge lentement et sous contrôle jusqu'à extension complète des bras.
