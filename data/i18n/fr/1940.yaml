  source_id: '3090'
description: 'Position de départ :

  Allongez-vous confortablement sur le dos sur un tapis, genoux pliés et pieds à plat. Posez une main sur la poitrine et l''autre sur l''abdomen juste sous les côtes.


  Exécution :

  Inspirez lentement et profondément par le nez en gonflant le ventre, de sorte que la main sur l''abdomen se soulève tandis que la main sur la poitrine reste quasiment immobile. Marquez une courte pause, puis expirez calmement et complètement par la bouche ou le nez en laissant le ventre redescendre. Effectuez 8 à 10 cycles respiratoires lents.


  Conseils :

  Relâchez totalement les tensions dans les épaules et le cou; cette respiration active le système nerveux parasympathique et favorise la récupération.'
