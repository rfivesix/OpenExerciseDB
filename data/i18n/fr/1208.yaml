name: Squat du prisonnier
description: |-
  Position de départ :
  • Tenez-vous debout, pieds à largeur d'épaules et pointes légèrement ouvertes.
  • Placez vos mains derrière la tête, doigts croisés, et ouvrez largement les coudes vers l'arrière.
  • Bombez le torse et maintenez les omoplates resserrées.

  Exécution :
  • Poussez les hanches vers l'arrière et fléchissez les genoux jusqu'à ce que les cuisses soient au moins parallèles au sol.
  • Gardez le buste le plus vertical possible et les coudes ouverts sans tirer sur la nuque.
  • Poussez sur les talons pour remonter à la position de départ en contractant les fessiers.
