name: Pompes sur le bout des doigts
description: |-
  Position de départ :
  • Mettez-vous en position de pompe en appui uniquement sur le bout des doigts et des pouces largement écartés.
  • Les paumes de mains restent surélevées sans toucher le sol.
  • Gardez le corps bien droit et gainé de la tête aux talons.

  Exécution :
  • Fléchissez lentement les coudes en descendant la poitrine vers le sol de manière contrôlée.
  • Maintenez une tension solide et stable dans les doigts tout au long du mouvement.
  • Poussez fermement sur le bout des doigts pour remonter à la position de départ.
