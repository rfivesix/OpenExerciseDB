exercise_id: '1582'
language: fr
status: ai_reviewed
name: Rotation interne en décubitus latéral
description: |-
  Position de départ:
  Allongez-vous de côté sur un banc plat. Utilisez le bras du dessous (le plus proche du banc). Gardez le coude fléchi à 90 degrés et le bras bien calé en tenant un haltère léger.

  Exécution:
  Laissez descendre le poids de manière contrôlée vers le sol au-delà du bord du banc, aussi bas que possible sans douleur. Remontez ensuite le poids en effectuant une rotation interne de l'épaule vers votre buste et l'épaule opposée.

  Conseils:
  - Utilisez une charge légère pour préserver et renforcer les rotateurs internes sans compensation.
  - Conservez l'angle de 90 degrés au niveau du coude durant toute l'amplitude.
