name: Traction isométrique (maintien statique)
description: |-
  Position de départ :
  Saisissez une barre de traction (en pronation ou supination) ou les poignées d'un système de suspension.

  Étapes :
  1. Tirez le corps vers le haut jusqu'à la position haute (menton au-dessus de la barre ou poitrine aux poignées).
  2. Bloquez la position en contraction statique en resserrant les omoplates vers le bas et l'arrière.
  3. Gardez la cage thoracique ouverte et les dorsaux engagés sans laisser les épaules remonter vers les oreilles.
  4. Maintenez ce blocage isométrique pendant la durée cible (10 à 30 secondes) en respirant régulièrement.
search_terms:
