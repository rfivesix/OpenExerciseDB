description: |-
  Position de départ :
  • Fixez une poignée simple à la poulie basse de l'appareil à câble.
  • Placez-vous face à la poulie, genoux fléchis et buste penché en avant avec le dos plat et gainé.
  • Saisissez la poignée d'une main, le bras tendu vers le bas.

  Exécution :
  • Tirez la poignée vers votre hanche en guidant le coude près du corps vers l'arrière.
  • Resserrez l'omoplate et contractez fermement le grand dorsal en fin de mouvement.
  • Redescendez lentement la charge sous contrôle jusqu'à sentir un bon étirement du dos.
