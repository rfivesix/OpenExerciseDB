name: Relevés de buste
description: |-
  Asseyez-vous sur un tapis, les mollets reposant sur un banc, les genoux formant un angle droit. Tenez vos mains derrière la nuque. Montez maintenant par un mouvement d'enroulement du dos, vous devriez sentir comment les vertèbres se décollent une à une du tapis. Au point le plus haut, contractez vos abdominaux autant que possible et maintenez 2 secondes. Redescendez maintenant en déroulant le dos.
