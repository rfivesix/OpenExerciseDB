name: Extension des fessiers à la poulie
description: |-
  Position de départ :
  • Fixez une sangle de cheville à la poulie basse et attachez-la à votre cheville.
  • Placez-vous face à la poulie, inclinez légèrement le buste vers l'avant et tenez fermement le montant de la machine.
  • Gardez la jambe d'appui légèrement fléchie et le bassin stable.

  Exécution :
  • Poussez la jambe équipée de la sangle vers l'arrière et le haut en contractant puissamment le grand fessier.
  • Maintenez la contraction une seconde au point le plus haut sans cambrer excessivement le bas du dos.
  • Contrôlez le retour vers l'avant sans laisser les plaques de poids toucher le support.
