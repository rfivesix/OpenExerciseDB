name: Toe taps
description: |-
  Les toe taps sont un exercice de gainage réalisé allongé sur le dos. Allongez-vous à plat, les bras le long du corps et les jambes levées en position de table (genoux fléchis à 90 degrés). Abaissez lentement un pied pour toucher délicatement le sol, en gardant la sangle abdominale gainée et le bas du dos plaqué contre le sol. Revenez à la position de départ et alternez les jambes. Cet exercice renforce la sangle abdominale tout en minimisant les tensions sur le bas du dos.
