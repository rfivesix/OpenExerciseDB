name: Élévations latérales buste penché
description: Asseyez-vous sur un banc en tenant des charges. Penchez-vous vers l'avant aussi loin que possible, les bras légèrement
  fléchis au niveau des coudes. Effectuez une élévation latérale tout en conservant la flexion de vos coudes.
