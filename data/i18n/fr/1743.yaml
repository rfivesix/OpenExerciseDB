name: Essuie-glaces suspendu
description: "Position de départ :\nSuspendez-vous à une barre de traction avec une\
  \ prise en pronation à la largeur des épaules. Engagez les dorsaux et la sangle\
  \ abdominale, puis levez les jambes tendues jusqu'à ce que vos pieds pointent vers\
  \ la barre ou le plafond.\n\nExécution :\n1. En gardant les jambes jointes et tendues,\
  \ faites-les pivoter lentement vers la gauche selon un arc de cercle contrôlé, à\
  \ la manière d'un essuie-glace.\n2. Revenez au centre vertical en contractant puissamment\
  \ les obliques et les abdominaux.\n3. Basculez ensuite les jambes vers la droite\
  \ avec le même contrôle et continuez d'alterner de façon rythmée.\n\nConseils :\n\
  Contrôlez chaque répétition sans utiliser d'élan ; fléchissez légèrement les genoux\
  \ si la version jambes tendues est trop difficile."
