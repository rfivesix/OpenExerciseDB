exercise_id: '1415'
language: fr
status: ai_reviewed
name: Crunchs avec haltère
description: |-
  Les crunchs avec haltère sont une variante lestée des crunchs classiques, conçue pour solliciter plus intensément les muscles abdominaux. Allongez-vous sur le dos, les genoux fléchis et les pieds à plat au sol. Tenez un haltère à deux mains près de votre poitrine ou au-dessus de votre tête. Décollez les épaules et le haut du dos du sol dans un mouvement de crunch en contractant la sangle abdominale. Redescendez lentement à la position de départ. Veillez à garder des mouvements contrôlés tout au long de l'exercice pour éviter toute tension.
