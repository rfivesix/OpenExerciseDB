name: Étirement Bretzel
description: 'Position de départ :

  Allongez-vous sur le côté sur un tapis. Fléchissez la jambe supérieure à 90 degrés
  vers l''avant au sol et maintenez-la plaquée avec la main inférieure.


  Exécution :

  1. Pliez le genou inférieur vers l''arrière et attrapez la cheville ou le pied avec
  la main supérieure.

  2. En expirant, faites pivoter lentement les épaules et le haut du dos vers le sol
  pour ouvrir la cage thoracique.

  3. Gardez le genou supérieur en contact permanent avec le sol.

  4. Maintenez la position 20 à 30 secondes en respirant profondément, puis changez
  de côté.'
