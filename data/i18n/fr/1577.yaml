name: Étirement Bretzel
description: |-
  Comment réaliser l'étirement Bretzel    Position de départ :        Allongez-vous sur le dos sur une surface plane, comme un tapis.        Fléchissez les genoux et posez les pieds à plat sur le sol.    Placement des jambes :        Levez la jambe droite et croisez-la par-dessus la jambe gauche, en posant le pied droit à l'extérieur du genou gauche.        La jambe gauche doit rester à plat sur le sol.    Placement des bras :        Tendez le bras gauche sur le côté à hauteur d'épaule, en le gardant droit.        Avec la main droite, tirez doucement le genou droit vers le sol, du côté gauche de votre corps.    Étirement :        En tirant le genou vers le bas, essayez de garder l'épaule gauche à plat sur le sol.        Vous devez ressentir un étirement dans la hanche, le bas du dos et éventuellement les pectoraux.    Maintenez la position :        Tenez cette position pendant 20 à 30 secondes, en respirant profondément et en vous relâchant dans l'étirement.        Changez de côté et répétez le mouvement.
