name: Relevés de buste croisés
description: |-
  Allongez-vous sur le dos, jambes tendues et bras le long du corps, en gardant les coudes pliés à 90 degrés. En vous redressant, faites pivoter le haut du corps vers la droite et amenez votre genou gauche vers votre coude droit pendant que vous ramenez votre bras gauche vers l'arrière. Redescendez votre corps à la position de départ, et répétez vers la droite. Cela fait 1 répétition.
