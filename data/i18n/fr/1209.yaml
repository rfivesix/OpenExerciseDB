name: Pompe trois points à largeur d'épaules
description: |-
  Mettez-vous en position de pompe, les épaules directement au-dessus des mains et les pieds écartés de la largeur des hanches. Rentrez votre nombril vers votre colonne vertébrale et contractez vos abdominaux. Levez votre pied gauche d'environ cinq centimètres du sol. Pointez vos orteils vers le bas. Ne bougez pas vos hanches. Votre corps forme une ligne droite de la tête aux talons pendant tout l'exercice. Pliez maintenant les coudes, abaissez votre poitrine vers le sol et repoussez-vous vers le haut. Répétez l'exercice de l'autre côté.
