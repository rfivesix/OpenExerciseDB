exercise_id: '1209'
language: fr
status: ai_reviewed
name: Pompe trois points
description: |-
  Position de départ :
  • Mettez-vous en position de pompe classique, mains à largeur d'épaules sous la poitrine.
  • Décollez un pied d'environ 5 à 10 cm du sol pour être en appui sur trois points.
  • Gardez le bassin horizontal et le tronc fermement gainé.

  Exécution :
  • Fléchissez les coudes pour abaisser la poitrine vers le sol de manière contrôlée.
  • Résistez à la rotation du bassin en conservant une ligne parfaite de la tête au talon d'appui.
  • Poussez sur vos mains pour remonter à la position de départ puis changez de jambe.
