name: Élévation frontale à la poulie avec barre courte
description: "Position de départ :\nFixez une petite barre droite à la poulie basse.\
  \ Tenez-vous debout, dos à la machine, le câble passant entre vos jambes. Saisissez\
  \ la barre en pronation à la largeur des épaules devant vos cuisses, buste droit\
  \ et coudes légèrement déverrouillés.\n\nExécution :\n1. Levez la barre droit devant\
  \ vous dans un arc de cercle contrôlé jusqu'à la hauteur des épaules.\n2. Marquez\
  \ une seconde de pause en haut en contractant le faisceau antérieur du deltoïde.\n\
  3. Redescendez lentement la barre jusqu'à la position de départ en résistant à la\
  \ charge.\n\nConseils :\nGardez le torse parfaitement stable sans utiliser d'élan\
  \ du bassin ou du dos."
