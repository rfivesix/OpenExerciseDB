name: Dislocations d'épaules (avec élastique ou bâton)
description: |-
  Position de départ :
  Tenez-vous debout le dos droit, pieds écartés de la largeur des épaules. Tenez un élastique, un bâton ou un manche à balai devant le corps avec une prise large en pronation, bras tendus.

  Étapes :
  1. En gardant les coudes parfaitement tendus, levez les bras au-dessus de la tête dans un mouvement circulaire ample.
  2. Poursuivez la rotation vers l'arrière jusqu'à amener le bâton ou l'élastique derrière les fessiers.
  3. Veillez à ne pas cambrer le bas du dos ni fléchir les coudes ; écartez davantage les mains si nécessaire.
  4. Ramenez les bras par le même chemin au-dessus de la tête jusqu'à la position initiale devant vous.
  5. Répétez le geste avec fluidité et contrôle.
