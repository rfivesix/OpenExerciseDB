name: Planche latérale droite
description: |-
  Position de départ :
  Allongez-vous sur le côté droit, jambes tendues et pieds superposés ou décalés. Placez votre coude droit directement sous l'épaule droite, l'avant-bras posé à plat sur le sol.

  Étapes :
  1. Décollez le bassin du sol en contractant les abdominaux, les obliques et les fessiers, jusqu'à ce que votre corps forme une ligne droite de la tête aux pieds.
  2. Gardez la nuque dans l'alignement de la colonne et le regard vers l'avant.
  3. Maintenez cette position de gainage pendant la durée prévue sans laisser les hanches s'affaisser.
