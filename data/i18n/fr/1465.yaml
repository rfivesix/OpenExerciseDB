name: Spider curl aux haltères
description: |-
  Position de départ :
  Réglez un banc inclinable à environ 45 degrés. Allongez-vous à plat ventre, la poitrine bien calée contre le dossier, la tête dépassant le bord supérieur et les pieds ancrés au sol pour assurer la stabilité. Tenez un haltère dans chaque main, les bras pendant verticalement vers le sol et les paumes orientées vers l'avant (prise en supination).

  Exécution :
  1. En gardant les bras immobiles et perpendiculaires au sol, fléchissez les coudes pour monter les haltères vers les épaules.
  2. Contractez intensément les biceps au sommet du mouvement pendant 1 à 2 secondes.
  3. Redescendez les haltères lentement et avec contrôle (en 3 à 4 secondes) jusqu'à la position d'extension complète des bras.

  Conseils :
  L'appui ventral élimine tout élan du torse et permet une isolation maximale des biceps sur toute l'amplitude.
