name: Flexion du cou
upstream:
  license: CC-BY-SA-4.0
  source_id: '1885'
translated_from: de
description: |-
  Position de départ :
  Asseyez-vous bien droit sur une chaise ou au sol.

  Étapes :
  1. Placez délicatement les mains derrière la tête.
  2. Inclinez lentement la tête vers l'avant, le menton vers la poitrine, en exerçant une légère pression avec les mains.
  3. Maintenez l'étirement à l'arrière du cou pendant plusieurs secondes sans forcer.
