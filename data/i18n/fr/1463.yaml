name: Rowing aux haltères en prise supination depuis le sol
description: |-
  Position de départ :
  • Tenez-vous debout pieds à largeur d'épaules, tenant deux haltères en prise supination (paumes vers l'avant).
  • Basculez le buste vers l'avant au niveau des hanches pour l'amener presque parallèle au sol, dos plat.

  Exécution :
  • Tirez les haltères vers les hanches en gardant les coudes près du corps.
  • Resserrez les omoplates et contractez le grand dorsal au sommet du mouvement.
  • Redescendez lentement jusqu'à poser brièvement les haltères au sol (dead stop) pour supprimer l'inertie avant la répétition suivante.
