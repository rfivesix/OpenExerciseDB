name: Étirement des pectoraux dans l'encadrement de porte
description: |-
  Placez l'avant-bras à la verticale contre un encadrement de porte ou un objet fixe, à hauteur de la tête
  Avancez d'un pas au-delà du bras, en le maintenant immobile contre l'objet, afin d'étirer les pectoraux
