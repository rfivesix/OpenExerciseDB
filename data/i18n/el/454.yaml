name: Κάμψεις σε σχήμα Λ
description: |-
  Θέση εκκίνησης:
  Σκύλος που κοιτάζει προς τα κάτω:Το σώμα πρέπει να έχει σχήμα Λ, με ίσια πλάτη, χέρια και πόδια. Οι γοφοί πρέπει να είναι στον αέρα.Μπορείτε να πάρετε αυτή τη θέση μετακινώντας τα χέρια προς τα πίσω, από μια θέση υψηλής σανίδας.
  Βήματα:

  Λυγίστε τους αγκώνες στο πλάι, κρατώντας την πλάτη και τα πόδια ίσια και μετακινώντας το κεφάλι πιο κοντά στο πάτωμα.
  Τεντώστε τα χέρια, σπρώχνοντας τους γοφούς προς τα πάνω και κρατώντας την πλάτη και τα πόδια ίσια.
  Επαναλάβετε.
