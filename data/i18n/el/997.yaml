name: Βατραχάκια σε 4-χρόνους
description: |-
  Θέση εκκίνησης:
  Σταθείτε ίσια, με τα πόδια ανοιχτά στο πλάτος των γοφών.
  Βήματα:

  Κάντε βαθύ κάθισμα και στηριχτείτε στο πάτωμα με τα χέρια ανάμεσα στα γόνατα και μπροστά από τα πόδια, με την πλάτη ίσια.
  Διατηρώντας τα χέρια στο πάτωμα, πηδήξτε με τα πόδια προς τα πίσω, σε θέση υψηλής σανίδας.
  Πηδήξτε με τα πόδια σας προς τα εμπρός για να επιστρέψετε στη θέση βαθύ καθίσματος.
  Επαναλάβετε.
