name: Διάταση λαιμού αριστερά
description: |-
  Θέση εκκίνησης:
  Κάθισε ή στάσου όρθιος με την πλάτη ίσια.
  Βήματα:

  Γείρετε το κεφάλι σας προς το πλάι και κρατήστε το για 8 δευτερόλεπτα για να τεντώσετε την πλευρά του αυχένα σας.
  Με το πιο κοντινό χέρι στην κορυφή του κεφαλιού σας, τραβήξτε απαλά για να τεντώσετε περισσότερο. Κρατήστε το για 8 δευτερόλεπτα.
  Γυρίστε το πηγούνι προς τον ώμο. Κρατήστε το για 8 δευτερόλεπτα.
  Απελευθερώστε και επιστρέψτε στην αρχική θέση.
