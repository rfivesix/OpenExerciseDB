name: Ανυψώσεις γάμπας στο ένα πόδι (δεξιά)
description: |-
  Θέση εκκίνησης:
  Σταθείτε στο δεξί πόδι στο πάτωμα ή στην άκρη ενός σκαλοπατιού. Κρατήστε το αριστερό πόδι στον αέρα και ακουμπήστε ελαφρά έναν τοίχο για ισορροπία.

  Εκτέλεση:
  1. Κατεβάστε αργά τη δεξιά φτέρνα προς τα κάτω για να τεντώσετε τη γάμπα.
  2. Σπρώξτε δυνατά στο μπροστινό μέρος του πέλματος και ανεβείτε ψηλά στα δάχτυλα.
  3. Κρατήστε τη σύσπαση στην κορυφή για 1-2 δευτερόλεπτα.
  4. Επιστρέψτε ελεγχόμενα προς τα κάτω.
