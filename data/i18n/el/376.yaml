name: Ανυψώσεις ποδιών
description: |-
  Θέση εκκίνησης:
  Ξαπλώστε ανάσκελα, τα πόδια ενωμένα, τα χέρια στο πλάι.
  Βήματα:

  Λυγίστε τα γόνατά σας και στη συνέχεια ισιώστε τα ώστε να δείχνουν ευθεία προς τα πάνω.
  Κρατώντας τα πόδια σας ίσια, κατεβάστε τα μαζί χωρίς να αγγίξετε το πάτωμα. Όσο πιο χαμηλά πηγαίνετε, τόσο πιο έντονη είναι η άσκηση.
  Σηκώστε και τα δύο πόδια μαζί για να δείξετε ξανά ευθεία προς τα επάνω.
  Επαναλάβετε από το βήμα 2.
