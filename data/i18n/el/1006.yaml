name: Πίεση πηγουνιού
description: |-
  Θέση εκκίνησης:
  Καθίστε ή σταθείτε με την πλάτη σας ίσια.
  Βήματα:

  Χρησιμοποιήστε τα δάχτυλά σας στο πηγούνι σας για να πιέσετε αργά το πηγούνι σας προς τα μέσα, μετακινώντας το κεφάλι σας προς τα πίσω για να το ευθυγραμμίσετε με τη σπονδυλική σας στήλη.
  Κρατήστε για 5 δευτερόλεπτα.
  Επιστρέψτε στην κανονική θέση του κεφαλιού και επαναλάβετε.
