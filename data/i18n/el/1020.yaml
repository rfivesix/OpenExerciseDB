name: Pistol squat δεξί πόδι
description: |-
  Θέση εκκίνησης:
  Σταθείτε στο δεξί πόδι με το αριστερό πόδι τεντωμένο μπροστά στον αέρα. Τεντώστε τα χέρια εμπρός για ισορροπία.

  Εκτέλεση:
  1. Λυγίστε αργά το δεξί γόνατο και κατεβείτε σε ένα βαθύ κάθισμα στο ένα πόδι.
  2. Κρατήστε την πλάτη ίσια και το αριστερό πόδι ψηλά χωρίς να ακουμπήσει στο έδαφος.
  3. Φτάστε στο χαμηλότερο σημείο με πλήρη έλεγχο.
  4. Πιέστε δυνατά μέσω της δεξιάς φτέρνας για να σηκωθείτε ξανά στην όρθια θέση.
