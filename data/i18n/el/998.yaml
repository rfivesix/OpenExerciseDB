name: Βατραχάκια χωρίς κάμψεις
description: |-
  Θέση εκκίνησης:
  Στάσου ίσια, με τα πόδια ανοιχτά στο πλάτος των γοφών.
  Βήματα:

  Κάντε βαθύ κάθισμα και στηριχτείτε στο πάτωμα, με τα χέρια ανάμεσα στα γόνατα και μπροστά από τα πόδια, με ίσια πλάτη.
  Διατηρώντας τα χέρια στο πάτωμα, πηδήξτε με τα πόδια προς τα πίσω σε θέση υψηλής σανίδας.
  Πηδήξτε με τα πόδια προς τα εμπρός για να επιστρέψετε στη θέση βαθύ καθίσματος.
  Πηδήξτε προς τα πάνω.
  Επαναλάβετε.
