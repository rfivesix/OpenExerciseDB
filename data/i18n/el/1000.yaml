name: Βυθίσεις δαπέδου
description: |-
  Θέση εκκίνησης:
  Καθίστε με τα χέρια σας πίσω σας, στηρίζοντας την πλάτη σας.Τα δάχτυλά σας πρέπει να δείχνουν προς τα εμπρός.Τα γόνατά σας πρέπει να είναι λυγισμένα, τα πόδια ενωμένα.
  Βήματα:

  Σηκώστε τους γοφούς σας από το έδαφος, ισιώνοντας τα χέρια σας.
  Λυγίστε τους αγκώνες σας, φέρνοντας τους γοφούς σας προς τα κάτω.
  Ισιώστε τα χέρια σας, επιστρέφοντας στην προηγούμενη θέση.
  Επαναλάβετε τα βήματα 2 και 3.

  Σημειώσεις:
  Η δυσκολία της άσκησης εξαρτάται από το πόσο ψηλά φέρετε τους γοφούς σας.
