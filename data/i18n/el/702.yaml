name: Ανυψώσεις αριστερής γάμπας
description: |-
  Σταθείτε στο πάτωμα ή στην άκρη ενός σκαλοπατιού για να αυξήσετε το εύρος της κίνησης. Σηκώστε το ένα πόδι, τοποθετώντας το πάνω μέρος στη γάμπα σας.
  Σηκώστε τις φτέρνες σας μέχρι να σταθείτε στα δάχτυλα των ποδιών.
  Μείνετε σε αυτή τη θέση για τρία δευτερόλεπτα και, στη συνέχεια, χαμηλώστε το πόδι σας χωρίς να ακουμπήσετε το έδαφος με τη φτέρνα σας.
