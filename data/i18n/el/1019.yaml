name: Πλάγια σανίδα (δεξιά)
description: |-
  Θέση εκκίνησης:
  Ξαπλώστε στη δεξιά σας πλευρά με τα πόδια τεντωμένα. Τοποθετήστε τον δεξιό αγκώνα ακριβώς κάτω από τον δεξιό ώμο με τον πήχη στο έδαφος.

  Εκτέλεση:
  1. Σφίξτε τον κορμό και σηκώστε τη λεκάνη από το έδαφος μέχρι το σώμα να σχηματίσει μια ευθεία γραμμή από το κεφάλι ως τα πόδια.
  2. Κρατήστε τη θέση σταθερή χωρίς να αφήνετε τους γοφούς να πέσουν.
  3. Διατηρήστε τη στάση για τον επιθυμητό χρόνο αναπνέοντας ομαλά.
