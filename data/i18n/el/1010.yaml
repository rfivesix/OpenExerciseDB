name: Διάταση αυχένα πίσω
description: |-
  Θέση εκκίνησης:
  Καθίστε όρθιοι σε μια καρέκλα ή ένα σταθερό μαξιλάρι.
  Βήματα:

  Εκπνεύστε και γείρετε το κεφάλι προς τα εμπρός, το πηγούνι στο στήθος, βάζοντας τα χέρια πίσω από το κεφάλι.
  Χρησιμοποιήστε τα χέρια για να τραβήξετε το κεφάλι προς τα κάτω πολύ ελαφρά. Κρατήστε το για 5 δευτερόλεπτα.
  Τραβήξτε τους ώμους πίσω και κάτω χρησιμοποιώντας τους μυς στην πλάτη σας. Αυτό θα πρέπει να αυξήσει το τέντωμα του λαιμού. Κρατήστε το για 5 δευτερόλεπτα.
  Τώρα σπρώξτε απαλά το κεφάλι σας προς τα πάνω, ενώ το τραβάτε επίσης προς τα κάτω με τα χέρια σας. Ισορροπήστε και τις δύο δυνάμεις έτσι ώστε το κεφάλι σας να μην κινείται. Κρατήστε το για τουλάχιστον 5 δευτερόλεπτα.
  Φέρτε τα δάχτυλά σας στο μέτωπό σας και χρησιμοποιήστε τα για να μετακινήσετε απαλά το κεφάλι σας πίσω στην αρχική του θέση.
