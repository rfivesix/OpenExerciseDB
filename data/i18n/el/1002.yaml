name: Παιδική στάση
description: |-
  Θέση εκκίνησης:
  Ξεκινήστε στα τέσσερα, γόνατα, δάχτυλα των ποδιών και χέρια να ακουμπάνε το έδαφος. Τα δύο μεγάλα δάχτυλα των ποδιών σας πρέπει να εφάπτονται.
  Βήματα:

  Μετακινήστε τα γόνατά σας έτσι ώστε να απέχουν περίπου όσο το πλάτος των γοφών.
  Σε μια εκπνοή, μετακινήστε τη λεκάνη σας προς τα πίσω για να καθίσετε στις φτέρνες σας. Τα χέρια σας θα πρέπει να αγγίζουν ακόμα το έδαφος.
  Χαλαρώστε το πάνω μέρος του σώματός σας, χαμηλώνοντας το μέτωπό σας στο πάτωμα και αφήνοντας τα χέρια σας να κινούνται φυσικά μπροστά.
  Μείνε σε αυτή τη στάση.

  Συμβουλές:

  Για να αφήσετε τη στάση, οδηγήστε τα χέρια σας πίσω κάτω από τους ώμους και μετακινήστε το πάνω μέρος του σώματος σε καθιστή θέση.
