description: |-
  Θέση εκκίνησης:
  Κάθισε ή στάσου όρθιος με την πλάτη ίσια.
  Βήματα:

  Γείρετε το κεφάλι σας προς το πλάι και κρατήστε το για 8 δευτερόλεπτα για να τεντώσετε την πλευρά του αυχένα σας.
