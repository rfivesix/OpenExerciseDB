description: |-
  Θέση εκκίνησης:
  Καθίστε ή σταθείτε όρθιοι με την πλάτη ίσια και τους ώμους χαλαρούς.

  Εκτέλεση:
  1. Ανοίξτε διάπλατα το στόμα.
  2. Γείρετε αργά το κεφάλι προς τα πίσω με το στόμα ανοιχτό μέχρι να νιώσετε μια ήπια διάταση μπροστά στο λαιμό.
  3. Πολύ αργά κλείστε και ανοίξτε το στόμα σας μερικές φορές για να βαθύνετε τη διάταση.
  4. Επιστρέψτε αργά στην αρχική θέση και κλείστε το στόμα.
