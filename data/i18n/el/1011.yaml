description: |-
  Θέση εκκίνησης:
  Κάθισε ή στάσου όρθιος με την πλάτη ίσια.
  Βήματα:

  Ανοίξτε διάπλατα το στόμα.
  Γείρετε αργά το κεφάλι προς τα πίσω με το στόμα ανοιχτό. Αν νιώθετε την ανάγκη για στήριξη, σφίξτε τα χέρια σας πίσω από το κεφάλι σας.
  Πολύ αργά κλείστε και ανοίξτε το στόμα σας.
