name: Άρση δραμιών
description: |-
  Θέση εκκίνησης:
  Σταθείτε με τα πόδια στο πλάτος των γοφών, με το δράμι σας στο κέντρο ανάμεσα στους αστραγάλους. Η πλάτη πρέπει να είναι ίσια, το κεφάλι προς τα εμπρός.
  Βήματα:

  Κάμψτε το σώμα στους γοφούς και λυγίστε ελαφρώς τα γόνατα για να τοποθετήσετε τα χέρια σας στις λαβές του δραμιού. Η πλάτη πρέπει να είναι ευθεία καθώς εκτελείτε την κίνηση.
  Πιάστε τις λαβές του δραμιού, με τα χέρια να πιέζουν προς αντίθετες κατευθύνσεις σαν να θέλετε να σκίσετε τη λαβή.
  Καθώς χρησιμοποιείτε τους κοιλιακούς και τους γλουτούς, σταθείτε όρθιοι.
  Κάμψτε ξανά το σώμα στους γοφούς για να επαναφέρετε το δράμι ξανά κάτω, όπως στο βήμα 1.
  Επαναλάβετε από το βήμα 3.

  Συμβουλές:

  Βεβαιωθείτε ότι εκτελείτε τις κινήσεις σωστά, καθώς διαφορετικός τρόπος μπορεί να οδηγήσει σε τραυματισμό. Για παράδειγμα, μην κάνετε βαθύ κάθισμα αντί να κάμπτετε τους γοφούς, μην στρογγυλεύετε την πλάτη σας ενώ πιάνετε το δράμι και μην γέρνετε προς τα πίσω ενώ στέκεστε όρθιοι.
