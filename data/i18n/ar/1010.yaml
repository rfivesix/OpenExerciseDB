name: تمتد الرقبة الخلفية
description: |-
  وضع البداية:
  اجلس منتصبًا على كرسي أو وسادة ثابتة.
  خطوات:

  أخرج الزفير وقم بإمالة رأسك للأمام ، والذقن إلى الصدر ، ووضع يديك خلف رأسك.
  استخدم يديك لسحب رأسك لأسفل بخفة شديدة. استمر لمدة 5 ثوان.
  اسحب الكتفين للخلف والأسفل باستخدام عضلات ظهرك. هذا يجب أن يزيد من شد الرقبة. استمر لمدة 5 ثوان.
  الآن ادفع رأسك بلطف للخلف ، بينما اسحبه لأسفل بيديك. وازن بين القوتين بحيث لا يتحرك رأسك. استمر لمدة 5 ثوان على الأقل.
  اجلب أصابعك إلى جبهتك واستخدمها لتحريك رأسك برفق إلى الموضع الأصلي.
