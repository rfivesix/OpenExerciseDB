name: تمرين القرفصاء بساق واحدة (اليمين)
description: |-
  وضعية البداية:
  قف على ساقك اليمنى مع مد الساق اليسرى للأمام في الهواء. افرد ذراعيك للأمام لتحقيق التوازن.

  خطوات التنفيذ:
  1. اثنِ ركبتك اليمنى ببطء وانزل في وضعية قرفصاء عميقة على ساق واحدة.
  2. حافظ على استقامة الظهر ورفع الصدر وبقاء الساق اليسرى مرفوعة دون ملامسة الأرض.
  3. انزل بأقصى مدى حركي مريح يمكنك التحكم به.
  4. ادفع بقوة من خلال كعب القدم اليمنى للعودة إلى وضعية الوقوف الكاملة.
