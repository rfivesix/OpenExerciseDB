description: |-
  قم بتمرين الضغط القياسي:

  1.a الاستلقاء على بطنك1.b ضع يديك بالقرب من أذنيك1.c استخدم ذراعيك لرفع معدتك حتى تصبح الذراعين مستقيمين ، مع الحفاظ على استقامة الظهر1.d ثني الذراعين حتى يلمس الصدر الأرض تقريبًا ، مع التأكد من أن الظهر مستقيم1.e ارفع معدتك مرة أخرى ، والعودة إلى الخطوة 3

  قم بتدوير جسمك إلى الجانب بحيث يكون الظهر مستقيمًا ، ويتم تمديد اليد السفلية التي تدعم الجسم بالكامل ، ولا تلمس الأرض سوى اليد السفلية والقدم
  كرر مع تغيير الجوانب في الخطوة 2 في كل مرة
