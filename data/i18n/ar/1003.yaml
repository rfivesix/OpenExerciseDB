name: كيتلبيل رفع الأثقال
description: |-
  وضع البداية:
  قف متباعدًا بمقدار عرض الورك ، مع وضع الثقل في المنتصف بين كاحليك. يجب أن يكون ظهرك مستقيمًا ورأسك متجهًا للأمام.
  خطوات:

  قم بمفصلة الوركين وانحني قليلاً عند الركبتين لوضع يديك على مقابض الثقل. يجب أن يكون ظهرك مستقيمًا أثناء أداء الحركة.
  أمسك بمقبض الثقل ، مع دفع يديك في اتجاهين متعاكسين كما لو كنت تبتعد عن المقبض.
  أثناء ملامسة عضلات البطن والألوية ، قف بشكل مستقيم.
  قم بمفصلة الوركين مرة أخرى لإخراج الجرس إلى أسفل ، على غرار الخطوة 1.
  كرر من الخطوة 3.

  نصائح:

  تأكد من أداء الحركات بشكل صحيح ، لأن القيام بخلاف ذلك قد يؤدي إلى الإصابة. على سبيل المثال ، لا تقم بالقرفصاء بدلًا من التوقف عند الوركين ، ولا تلف ظهرك أثناء الوصول إلى الثقل ، ولا تميل للخلف أثناء الوقوف.
