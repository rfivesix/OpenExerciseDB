name: وضعية الطفل
description: |-
  وضع البداية:
  ابدأ في ملامسة الأرض من جميع الجهات والركب وأصابع القدم واليدين. يجب أن تكون أصابع قدميك الكبيرة ملامسة للارض.
  خطوات:

  حرك ركبتيك بحيث يكونا متباعدين بعرض الورك.
  عند الزفير ، حرك حوضك للخلف للجلوس على كعبيك. يجب أن تظل يداك تلمس الأرض.
  استرخِ الجزء العلوي من جسمك ، وأنزل جبهتك على الأرض واترك يديك تتحرك بشكل طبيعي إلى الأمام.
  ابق في هذا الوضع.

  نصائح:

  لترك الوضع ، حرك ذراعيك للخلف تحت كتفيك وحرك الجزء العلوي من جسمك إلى وضع الجلوس.
