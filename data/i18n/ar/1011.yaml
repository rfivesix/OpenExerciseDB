name: إطالة الرقبة الأمامية
description: |-
  وضعية البداية:
  اجلس أو قف بظهر مستقيم وأكتاف مسترخية.

  خطوات التنفيذ:
  1. افتح فمك بشكل واسع.
  2. قم بإمالة رأسك ببطء للخلف مع إبقاء الفم مفتوحاً حتى تشعر بإطالة خفيفة في مقدمة الرقبة.
  3. أغلق وافتح فمك ببطء شديد عدة مرات لتعميق الإطالة في العضلات الأمامية للرقبة.
  4. أعد رأسك ببطء إلى وضعية البداية المحايدة وأغلق فمك.
