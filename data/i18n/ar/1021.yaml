name: رفع ربلة الساق بساق واحدة (اليمنى)
description: |-
  وضعية البداية:
  قف على قدمك اليمنى على الأرض أو على حافة درجة، مع إبقاء القدم اليسرى مرفوعة في الهواء والاتكاء بخفة على الحائط للتوازن.

  خطوات التنفيذ:
  1. انزل بكعب القدم اليمنى ببطء للشعور بإطالة في عضلة ربلة الساق (السمانة).
  2. ادفع بقوة عبر مشط القدم اليمنى للارتفاع على أطراف الأصابع إلى أقصى حد.
  3. اثبت في أعلى نقطة انقباض لمدة ثانية أو ثانيتين.
  4. انزل بكعبك ببطء وتحكم كامل للعودة إلى وضعية البداية.
