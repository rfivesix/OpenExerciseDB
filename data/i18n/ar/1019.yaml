name: اللوح الجانبي (الأيمن)
description: |-
  وضعية البداية:
  استلقِ على جانبك الأيمن مع مد ساقيك بشكل مستقيم. ضع مرفقك الأيمن مباشرة أسفل كتفك الأيمن مع تثبيت الساعد على الأرض.

  خطوات التنفيذ:
  1. شد عضلات الجذع والبطن، ثم ارفع وركيك عن الأرض حتى يشكل جسمك خطاً مستقيماً من رأسك إلى قدميك.
  2. حافظ على ثبات الوركين وتجنب هبوطهما نحو الأرض.
  3. اثبت في هذه الوضعية للمدة المحددة مع التنفس بانتظام.
