name: Clamshell met band
description: 'Beginpositie: Ga op je zij liggen (of neem een zijplank aan) met gebogen knieën en gestapelde
  benen. Plaats een miniband om je dijen, net boven de knieën.


  Uitvoering: Houd je voeten bij elkaar en til je bovenste knie tegen de weerstand van de band omhoog,
  als een openende schelp. Keer langzaam terug naar de beginpositie.


  Tips: Houd je bekken stabiel en recht; laat je heupen niet naar achteren rollen wanneer je je knie optilt.'
