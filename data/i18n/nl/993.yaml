name: Touwtjespringen (basissprongen)
description: Sta met je voeten dicht bij elkaar en houd in elke hand een handvat. Laat het touw achter
  je hielen liggen en houd je ellebogen dicht bij je ribben. Draai het touw met kleine, beheerste polsbewegingen
  en spring ongeveer 2,5–5 cm omhoog wanneer het onder je voeten doorgaat. Land zacht op de bal van je
  voeten. Houd je knieën licht gebogen en spring ritmisch; draai vanuit je polsen, niet vanuit je hele
  armen.
