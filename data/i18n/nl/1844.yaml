name: Kikkerstretch
description: 'Beginpositie: Begin op handen en knieën en spreid je knieën zo ver als comfortabel is. Zak
  op je onderarmen, houd je schenen parallel en laat de binnenkant van je voeten op de mat rusten.


  Uitvoering: Houd je wervelkolom neutraal en beweeg je heupen langzaam naar je hielen tot je een diepe
  rek voelt in je heupadductoren en lies.


  Tips: Beweeg je heupen rustig en gecontroleerd naar voren en achteren of houd de diepe rek 20–30 seconden
  vast terwijl je diep ademt.'
