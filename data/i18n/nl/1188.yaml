name: Zijwaartse buiging met dumbbell
description: Sta rechtop met voeten op heupbreedte en houd een dumbbell in één hand naast je. Leg de andere
  hand licht achter het hoofd of op de tegenoverliggende heup. Houd borst open en romp aangespannen. Buig
  de romp langzaam zijwaarts in het frontale vlak naar de dumbbell, zonder te draaien. Gebruik de schuine
  buikspieren aan de andere zijde om terug rechtop te komen. Herhaal beheerst en wissel dan van kant.
