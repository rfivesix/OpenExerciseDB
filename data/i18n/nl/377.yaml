name: Liggende beenheffing
description: Ga op een bank liggen en houd de rugleuning met je handen vast om stabiel te blijven. Houd
  je benen gestrekt en hef ze tot een hoek van ongeveer 45 graden. Pauzeer kort, 1 seconde, en laat je
  benen langzaam zakken naar de beginpositie. Voor meer intensiteit kun je bij elke vijfde herhaling 7
  seconden pauzeren.
