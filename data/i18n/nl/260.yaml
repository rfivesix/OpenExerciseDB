name: Full sit-out
description: '(A) Kom in een hoge plank op je handen en tenen. (B) Verplaats je gewicht naar je linkerhand
  terwijl je je lichaam naar rechts draait; buig je rechterbeen achter je en strek je rechterarm omhoog.
  Keer terug naar het midden en herhaal aan de andere kant. Wissel de kanten af. Maak het makkelijker:
  til je arm niet op nadat je je been achter je hebt gebogen. Maak het moeilijker: houd je arm en been
  twee tellen gestrekt terwijl je balanceert.'
