name: Vloerdips
description: Ga op de vloer zitten met gebogen knieën en je voeten plat op de grond. Plaats je handen
  net achter je heupen, met de vingers naar je voeten gericht, en til je heupen enkele centimeters op.
  Buig je ellebogen om je heupen richting de vloer te laten zakken; houd je ellebogen naar achteren en
  dicht bij je lichaam. Duw via je handpalmen om je armen te strekken en je heupen weer op te tillen.
  Laat de beweging vanuit je ellebogen komen, niet alleen door je heupen op en neer te bewegen.
