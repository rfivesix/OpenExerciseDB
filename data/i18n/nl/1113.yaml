name: Push-ups op parallettes
description: Zet twee parallettes parallel op de vloer, ongeveer op schouderbreedte. Pak ze stevig met
  neutrale greep en strek de benen naar achteren tot plank. Buig de ellebogen en laat de borst gecontroleerd
  diep tussen de parallettes zakken. Gebruik de grotere bewegingsuitslag voor rek op de borstspieren.
  Duw via de handpalmen terug tot de armen gestrekt zijn. De neutrale polsstand vermindert de belasting
  van de polsgewrichten.
