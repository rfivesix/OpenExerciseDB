name: Foamroller voor tibialis anterior
description: 'Beginpositie: Begin op handen en knieën en plaats de foamroller onder de buitenkant van
  de voorkant van je scheen, op de tibialis anterior en niet direct op het scheenbeen.


  Uitvoering: Rol langzaam van net boven je enkel tot net onder je knie. Pas de druk aan met je handen
  en steunende knie.


  Tips: Druk niet rechtstreeks op de benige rand van je scheen. Richt je op het zachte spierweefsel aan
  de buitenkant van je onderbeen.'
