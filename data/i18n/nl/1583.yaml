name: Bankdrukken met halter en smalle greep
description: 'Beginpositie:

  Ga plat op een bank liggen met je voeten stevig op de vloer. Pak de halter bovenhands en smal vast (ongeveer
  op schouderbreedte). Haal de stang met gestrekte armen uit de steunen en houd hem boven je bovenborst.


  Uitvoering:

  Adem in en laat de halter gecontroleerd naar je onderborst of borstbeen zakken. Houd je ellebogen relatief
  dicht bij je romp (ongeveer 30–45 graden). Raak je borst licht aan zonder te stuiteren en duw de halter
  krachtig terug omhoog tot je ellebogen gestrekt zijn, door je triceps en borstspieren aan te spannen.


  Aandachtspunten:

  Houd je polsen recht boven je onderarmen en ellebogen. Pak de stang niet extreem smal vast en laat je
  handen elkaar niet raken; zo voorkom je overmatige belasting van polsen en ellebogen.'
