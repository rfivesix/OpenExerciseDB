name: Triceps pushdown met kabel en touw
description: Sta met je gezicht naar de kabel, voeten op schouderbreedte en romp licht voorover. Houd
  het touw vast met de handpalmen naar elkaar en de ellebogen tegen je zij. Duw het touw omlaag tot je
  armen gestrekt zijn en spreid de uiteinden onderaan. Houd je bovenarmen stil en keer langzaam terug.
