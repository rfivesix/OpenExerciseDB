name: Diagonal shoulder press
description: Ga op het bankdrukapparaat zitten met je rug iets naar achteren geleund. De stang hoort ongeveer
  20 cm voor je te staan. Duw de stang weg en breng hem weer terug, zoals bij bankdrukken. In deze houding
  belast je de borstspieren veel minder; dat kan prettig zijn als je wilt trainen terwijl je borst nog
  niet is hersteld.
