name: Australische pull-up
description: Ga onder een hoge stang of suspensionstang liggen die op een geschikte hoogte is geplaatst.
  Pak de stang onderhands vast, met je handpalmen naar je toe. Stel je positie zo in dat je lichaam recht
  ligt van hoofd tot tenen. Strek je armen volledig, stabiliseer je schouders en houd je benen in lijn
  met je lichaam. Buig je ellebogen en trek je borst naar de stang terwijl je je rugspieren aanspant;
  probeer je schouderbladen naar elkaar toe te brengen. Houd de aanspanning bovenaan kort vast. Keer langzaam
  terug naar de startpositie door je ellebogen te strekken.
