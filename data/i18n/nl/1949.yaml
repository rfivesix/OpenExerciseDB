name: Limber 11-mobiliteitsroutine
description: 'Deze routine van coach Joe DeFranco wordt beschreven als warming-up
  en mobiliteitscircuit voor het onderlichaam. De elf onderdelen zijn: foamrollen
  van IT-band en adductoren; bilspieren losmaken met een lacrossebal; bent-knee iron
  cross; roll-overs naar V-sit; rocking frog stretch; fire-hydrantcirkels; mountain
  climbers; Cossack squats; zittende piriformisstretch; en heupflexorstretch met de
  achtervoet verhoogd. De bron geeft per onderdeel herhalingen, tijd of passages aan.'
