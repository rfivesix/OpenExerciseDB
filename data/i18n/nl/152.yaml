name: Chin-up
description: De chin-up (ook chin of chinup genoemd) is een krachtoefening. De oefening wordt vaak gedaan
  om onder meer de latissimus dorsi en biceps te versterken, die respectievelijk de schouder strekken
  en de elleboog buigen. Bij deze beweging wijzen de handpalmen naar het lichaam. Het is een variant van
  de pull-up waarbij de bewegingsuitslag wordt bepaald door de kin.
