name: Kuitstretch met steun
description: 'Beginpositie: Sta op armlengte van een muur en plaats beide handpalmen op schouderhoogte
  tegen de muur.


  Uitvoering: Stap met één been naar achteren, houd dat been gestrekt en druk de hiel stevig in de vloer.
  Buig je voorste knie en beweeg je heupen naar de muur tot je een sterke rek in je achterste kuit voelt.


  Tips: Zorg dat beide voeten recht naar voren wijzen. Houd 20–30 seconden vast en wissel van been.'
