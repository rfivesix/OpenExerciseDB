name: Glute kickback op de machine
description: 'Startpositie:

  Neem plaats op de glute-kickbackmachine en laat je bovenlichaam tegen het steunpad rusten. Zet de zool
  van je voet, vooral je hiel, stevig tegen de voetplaat.


  Uitvoering:

  1. Duw de plaat met je hiel naar achteren en omhoog tot je heup gestrekt is.

  2. Span je bilspier aan op het hoogste punt.

  3. Breng het pedaal langzaam en gecontroleerd terug naar de beginpositie.


  Tips:

  Duw vanuit je hiel in plaats van je tenen om de gluteus maximus te benadrukken. Overstrek je onderrug
  niet bovenaan de beweging.'
