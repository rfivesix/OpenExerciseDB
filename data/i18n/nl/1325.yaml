name: Laterale afzet
description: 'Beginpositie:

  Begin in een atletische, stabiele houding met je knieën licht gebogen en je romp aangespannen.


  Uitvoering:

  1. Zet je explosief zijwaarts af met je standbeen.

  2. Land zacht op het andere been en vang de impact op via je knie en heup.

  3. Herstel kort je balans en zet je weer af naar de andere kant.'
