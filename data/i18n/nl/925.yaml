name: Lichte incline press in de Smith-machine
description: 'Beginpositie: ga op een licht schuine bank (15–30 graden) in de Smith-machine liggen. Pak
  de stang met een bovenhandse greep iets breder dan schouderbreedte vast, haal hem uit het rek en houd
  hem met gestrekte armen boven je bovenborst. Uitvoering: laat de stang soepel naar je bovenborst en
  sleutelbeenderen zakken; houd je schouderbladen ingetrokken en je ellebogen ongeveer 45–60 graden van
  je romp. Terugkeer: druk de stang recht langs de geleider omhoog tot je armen bijna gestrekt zijn en
  richt je op het bovenste, claviculair deel van je borstspieren. Aanwijzingen: houd je voeten op de vloer
  en een stabiele holling in je bovenrug; til je billen niet van de bank.'
