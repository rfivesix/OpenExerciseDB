name: Hangen aan een 20mm-rand
description: Pak met beide handen de 20mm-rand van het vingerbord vast met een open greep of half-crimp.
  Span je schouders actief aan door ze omlaag, weg van je oren, te trekken en houd je ellebogen licht
  gebogen. Til je voeten van de vloer en hang stabiel gedurende de voorgeschreven tijd (bijvoorbeeld 10
  seconden), met spanning in je hele lichaam.
