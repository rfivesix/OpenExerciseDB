name: Sleeper stretch
description: Ga op je zij liggen en laat wat gewicht op je schouderblad rusten om dit stil te houden.
  Strek je arm 90 graden voor je uit en laat deze op de vloer of mat rusten. Til je hand met je elleboog
  op zodat je vingers naar het plafond wijzen en je handpalm naar je voeten. Houd je elleboog stil en
  laat je handpalm voorzichtig naar de vloer zakken.
