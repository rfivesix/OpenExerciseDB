name: Laterale heffing in het scapulaire vlak op 45°
description: 'Sta met je voeten op heupbreedte en houd dumbbells voor je dijen met een neutrale of half-geproneerde
  greep. Houd je borst omhoog en je schouders naar achteren en omlaag.


  1. Hef de dumbbells in het scapulaire vlak, ongeveer 30–45 graden vóór de lijn recht naar opzij.

  2. Hef tot schouderhoogte met licht gebogen ellebogen en je duimen iets omhoog gericht.

  3. Pauzeer kort bovenaan en laat de dumbbells langzaam en gecontroleerd zakken.


  De bron beschrijft deze baan als ergonomisch gunstig voor het schoudergewricht en als een oefening die
  de laterale deltaspier belast.'
