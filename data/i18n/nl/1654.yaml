name: Laterale raise op machine
description: De laterale raise op een machine is een isolatieoefening voor het middelste (laterale) deel
  van de deltaspier, gericht op bredere en duidelijker gevormde schouders. Het vaste bewegingspad van
  de machine biedt meer stabiliteit dan dumbbells, waardoor je je op de spieractivatie kunt concentreren.
