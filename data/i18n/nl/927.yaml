name: Chest fly met suspension trainer
description: 'Beginpositie: pak de handgrepen van de suspension trainer met een neutrale greep vast en
  leun naar voren in een schuine plank, met je armen voor je borst gestrekt en je lichaam recht van hoofd
  tot hielen. Uitvoering: houd je ellebogen licht gebogen en open je armen in een brede boog zijwaarts
  tot je een diepe maar comfortabele rek over je borst voelt. Terugkeer: span je borst aan en breng de
  handgrepen voor je lichaam bij elkaar; houd je romp aangespannen en je heupen in lijn. Aanwijzingen:
  pas de moeilijkheid aan door je lichaamshoek ten opzichte van de vloer te veranderen; hoe horizontaler
  je lichaam, hoe groter de weerstand.'
