name: Polskrul met halterstang
description: 'Ga op een bank zitten en pak een halterstang vast met je handpalmen omhoog en je handen
  op schouderbreedte. Laat je onderarmen op je dijen rusten en je polsen voorbij je knieën hangen. Buig
  je handpalmen en polsen naar je gezicht toe.

  Pauzeer kort bovenaan en keer langzaam terug naar de beginpositie.'
