name: Inwendige rotatie op de zij
description: Ga op je zij liggen en gebruik de arm die het dichtst bij de bank ligt. Houd je elleboog
  90 graden gebogen en laat het gewicht naast de bank zo ver zakken als comfortabel is. Breng het gewicht
  vervolgens naar de tegenoverliggende schouder door alleen je schouder te roteren.
