name: Reverse hyperextension
description: 'Ga met je buik op een vlakke bank of reverse-hypermachine liggen, met je heupen bij de achterrand
  en je benen vrij naar de vloer hangend. Pak de bank of handgrepen stevig vast om je bovenlichaam te
  verankeren.


  1. Span je bilspieren en hamstrings aan en til je benen in een vloeiende, gecontroleerde boog naar achteren
  en omhoog.

  2. Til tot je benen parallel aan je romp zijn en je bilspieren en rugstrekkers aanspannen.

  3. Pauzeer kort bovenaan zonder je onderrug te overstrekken.

  4. Laat je benen langzaam en gecontroleerd zakken voor de volgende herhaling.


  Richt je op heupextensie vanuit bilspieren en hamstrings; zwaai niet met je benen en overstrek je onderrug
  niet.'
