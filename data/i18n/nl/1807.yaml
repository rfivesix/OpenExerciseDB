name: Laterale kabelheffing achter de rug
description: 'Ga zijwaarts naast een lage kabelmachine staan. Reik met je buitenste hand achter je billen
  en pak het D-handvat vast. Houd met je binnenste hand de kabeltoren vast en leun iets voorover met je
  borst omhoog.


  1. Hef je arm met een licht gebogen, vaste elleboog zijwaarts en omhoog tot je hand op schouderhoogte
  komt.

  2. Span bovenaan je laterale deltaspier stevig aan en pauzeer één seconde.

  3. Laat het handvat langzaam achter je lichaam zakken en houd spanning op je schouder.


  De bron zegt dat de kabelroute achter de rug voorkomt dat het handvat tegen je heupen stoot en spanning
  geeft in de gestrekte positie.'
