name: Russian twist met dumbbell
description: Ga op een mat zitten met gebogen knieën en hielen op de vloer (of opgetild voor meer uitdaging).
  Houd een dumbbell horizontaal voor de borst en leun ongeveer 45 graden achterover met rechte rug en
  aangespannen romp. Draai soepel naar rechts en breng de dumbbell naast de heup richting vloer. Pauzeer
  kort en draai beheerst via het midden naar links. Draai vanuit de ribbenkast en houd heupen en onderlichaam
  zo stil mogelijk.
