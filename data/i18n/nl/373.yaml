name: Leg press met smalle stand
description: 'Ga op de leg press zitten met je rug stevig tegen de rugleuning. Zet je voeten dicht bij
  elkaar op het platform, enkele centimeters uit elkaar, ongeveer op heupbreedte of smaller. Richt je
  tenen iets naar buiten of naar voren.

  Ontgrendel de veiligheidsvergrendeling en laat het platform gecontroleerd zakken tot je knieën ongeveer
  90 graden gebogen zijn. Duw met je hele voet het platform terug zonder je knieën bovenaan op slot te
  zetten.'
