name: Eenbenige lunge met kettlebell
description: 'Een eenbenige kettlebelllunge uitvoeren:

  Voorbereiding: Sta met je voeten bij elkaar. Houd de kettlebell met beide handen bij het handvat dicht
  bij je borst, of houd hem met één hand aan dezelfde kant als het werkende been.

  Stap en zak: Zet met één been een grote stap naar voren (of naar achteren, volgens de bron veiliger
  voor de knieën) en laat je heupen zakken tot beide knieën een hoek van 90 graden maken.

  Focus: Verplaats je gewicht naar je voorste of gebogen been. Houd je rug recht en romp rechtop.

  Terugkeren: Duw af met je voorste been om terug te keren naar de beginpositie.'
