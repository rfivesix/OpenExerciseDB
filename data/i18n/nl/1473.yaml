name: Omgekeerde cable fly
description: 'Startpositie:

  Zet beide kabels op borst- of ooghoogte. Pak de kabels gekruist vast: linker kabel met je rechterhand
  en rechter kabel met je linkerhand. Ga in het midden staan met je voeten op schouderbreedte en houd
  je armen voor je borst, ellebogen licht gebogen.


  Uitvoering:

  1. Beweeg beide armen tegelijk in een brede horizontale boog naar buiten en achteren tot je handen op
  één lijn met je schouders zijn.

  2. Span je achterste schouders en romboïden bovenaan één seconde aan.

  3. Breng je armen langzaam en gecontroleerd terug naar de gekruiste beginpositie.


  Aandachtspunten:

  Houd je ellebogen licht gebogen en je romp stil; maak er geen tricepsstrekking of row van.'
