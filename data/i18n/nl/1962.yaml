name: Step Jack (low-impact jumping jack)
description: 'Startpositie:

  Sta rechtop met je voeten bij elkaar en je armen langs je lichaam. Span je romp licht aan.


  Uitvoering:

  Stap met je rechtervoet opzij terwijl je beide armen in een wijde boog naar buiten en boven je hoofd
  zwaait. Stap terug naar het midden en laat je armen zakken. Herhaal meteen met de linkervoet en wissel
  in een vlot, ritmisch tempo af.


  Tips:

  Deze step jack geeft cardiovasculaire training zonder de gewrichtsbelasting van springen met hoge impact
  en is geschikt als warming-up of voor een training met weinig impact.'
