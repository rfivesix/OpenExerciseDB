name: Liggende figure-four-stretch
description: 'Beginpositie: Ga op je rug op een mat liggen met gebogen knieën en voeten plat op de vloer.


  Uitvoering: Kruis je rechterenkel over je linkerknie in een figure-four. Reik erdoorheen en pak met
  beide handen de achterkant van je linkerdij vast. Trek het been rustig naar je borst tot je een diepe
  rek in je rechterbil en piriformis voelt.


  Tips: Houd je hoofd, nek en schouders ontspannen op de vloer. Houd 20–30 seconden vast terwijl je rustig
  ademt en herhaal aan de andere kant.'
