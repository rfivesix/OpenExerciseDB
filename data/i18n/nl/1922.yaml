name: Zittende cable chest fly
description: Plaats een rechte bank tussen twee kabelkatrollen op borst- of schouderhoogte.
  Ga met je rug tegen de leuning zitten, voeten plat, en pak de grepen neutraal vast.
  Breng je handen in een brede omhelzingsbeweging voor je borst samen met licht gebogen
  ellebogen en span je borst aan. Open de armen langzaam tot je een comfortabele rek
  voelt. Houd je rug gesteund en de ellebooghoek gelijk.
