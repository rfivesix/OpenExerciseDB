name: Hammer curls
description: 'Begin: Houd de dumbbells naast je lichaam met je handpalmen naar je romp.

  Curl: Breng de gewichten naar je schouders terwijl je de neutrale greep behoudt, alsof je een hamer
  vasthoudt.

  Span aan: Span bovenaan je biceps aan zonder je ellebogen naar voren te bewegen.

  Laat zakken: Keer langzaam en gecontroleerd terug naar de beginpositie.'
