name: Tuck planche
description: Plaats je handen op schouderbreedte op de vloer of parallettes, met je
  vingers naar voren of iets naar buiten. Duw met gestrekte armen stevig in de vloer
  en leun met je schouders voorbij je polsen. Trek je knieën naar je borst en til
  je onderlichaam van de grond. Spreid je schouderbladen, span je romp aan en houd
  de statische positie vast.
