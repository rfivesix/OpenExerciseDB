description: 'Beginpositie:

  Sta recht, voeten op heupbreedte uit elkaar.

  Stappen:


  Hurk laag en ondersteun jezelf op de vloer met je handen tussen de knieën en voor je voeten, je rug
  recht.

  Houd je handen op de vloer, spring je benen naar achteren in een hoge plankpositie.

  Spring met je voeten naar voren om terug te keren naar de squat positie.

  Herhaal.'
