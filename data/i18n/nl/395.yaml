name: Zittende kabelroei met smalle greep
description: 'Dit is dezelfde oefening als de gewone zittende kabelroei, maar met een smalle greep:

  Ga zitten, plaats je voeten op de steunen en pak het handvat smal vast. Trek het gewicht vlot naar je
  navel, niet naar je bovenbuik. Houd je armen en ellebogen dicht bij je lichaam en trek je schouderbladen
  naar elkaar toe. Laat het gewicht langzaam teruggaan tot je armen volledig gestrekt zijn.'
