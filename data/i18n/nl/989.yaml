name: Bulgaarse split squat (rechts)
description: Sta ongeveer 60 cm voor een stevige bank of stoel. Leg de bovenkant van je linkervoet achter
  je op de bank en zet je rechtervoet stevig voor je neer. Buig je rechterknie en laat je heupen zakken
  tot je rechterbovenbeen ongeveer parallel aan de vloer is en je linkerknie net boven de vloer hangt.
  Duw via de hiel en middenvoet van je rechterbeen terug omhoog. Houd je rug vlak en laat je voorste knie
  niet naar binnen vallen.
