name: Reverse crunch
description: Ga plat op je rug liggen met je armen naast je heupen. Hef je benen met
  heupen en knieën ongeveer 90 graden gebogen. Span je buikspieren aan en rol je bekken
  van de vloer zodat je knieën naar je borst bewegen. Pauzeer kort en rol je bekken
  langzaam terug naar de vloer. Begin vanuit het bekken, niet door je benen te zwaaien.
