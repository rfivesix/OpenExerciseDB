name: Voorwaarts heffen met halterschijf
description: 'De front raise met halterschijf is een variant op de front raise met dumbbells: je houdt
  een halterschijf met beide handen vast in plaats van een dumbbell, halterstang of ander gewicht. Deze
  variant kan afwisseling bieden in een training gericht op de schouders of in een circuit voor het bovenlichaam
  of het hele lichaam.

  Sta rechtop en houd een halterschijf met beide handen vast op de posities van 3 en 9 uur. Je handpalmen
  wijzen naar elkaar. Strek je armen en houd ze vrijwel gestrekt met een lichte buiging in de ellebogen.
  Houd de schijf voor je middel, zo laag als je kunt. Dit is de beginpositie; houd je armen gedurende
  de oefening in deze houding.

  Adem uit en til de schijf langzaam tot iets boven schouderhoogte. Houd de aanspanning één seconde vast.
  Adem in en laat de schijf langzaam zakken naar de beginpositie. Herhaal het aanbevolen aantal herhalingen.'
