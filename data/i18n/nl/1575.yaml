description: 'Beginpositie:

  Sta rechtop met je voeten op schouderbreedte en je romp aangespannen. Pak op borsthoogte een lichte
  houten stok (of pvc-buis/bezemsteel) bovenhands vast, iets breder dan schouderbreedte.


  Uitvoering:

  1. Duw de stok soepel boven je hoofd tot je armen gestrekt zijn. Haal je schouders iets op om ruimte
  te maken onder het schouderdak.

  2. Laat de stok gecontroleerd zakken, vóór je lichaam naar je sleutelbeenderen of achter je nek. Wissel
  af tussen de voorste en achterste positie.

  3. Richt je op beweeglijkheid van schouders en bovenrug, niet op weerstand.


  Aandachtspunt:

  Dit is een warming-up- en mobiliteitsoefening voor de schoudergordel en borstwervelkolom. Beweeg alleen
  binnen een pijnvrij bewegingsbereik.'
