name: Runners-lungestretch
description: 'Beginpositie: Stap diep naar voren in een lunge en plaats beide handen plat op de vloer
  naast of aan de binnenkant van je voorste voet.


  Uitvoering: Duw via de bal van je achterste voet en strek je achterste been naar achteren terwijl je
  heupen naar de vloer zakken. Houd je voorste knie recht boven je enkel.


  Tips: Houd je borst omhoog en je wervelkolom lang in plaats van je rug rond te maken. Voel de rek in
  de heupbuiger van je achterste been en de voorkant van je bovenbeen. Houd 20–30 seconden vast en wissel
  van been.'
