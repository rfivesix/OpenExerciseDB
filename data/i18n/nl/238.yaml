name: Dumbbell fly
description: Pak twee dumbbells en ga op een bank liggen. Zet je voeten stevig op de vloer en houd je
  rug goed tegen de bank zonder deze hol te trekken. Strek je armen voor je uit, ongeveer op schouderbreedte.
  Buig je ellebogen licht en laat je armen in een halve cirkel naar de zijkanten zakken. Houd de hoek
  van je ellebogen gelijk en breng je armen vloeiend weer boven je samen.
