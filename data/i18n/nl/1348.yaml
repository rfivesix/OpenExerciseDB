name: Rugextensie
description: 'Beginpositie:

  Ga met je gezicht omlaag op de Romeinse stoel of hyperextensiebank liggen, met je dijen op de kussens
  en je heupen vrij om te scharnieren. Zet je hielen stevig onder de voetsteunen vast. Kruis je armen
  voor je borst of leg je handen licht bij je oren.


  Beweging:

  Buig langzaam vanuit je heupen om je romp richting de vloer te laten zakken en houd je wervelkolom neutraal.
  Til je bovenlichaam op door je rugstrekkers, bilspieren en hamstrings aan te spannen, totdat je lichaam
  van hielen tot hoofd een rechte lijn vormt.


  Opmerkingen:

  Hol je onderrug bovenaan niet verder dan de rechte lijn. Beweeg gecontroleerd en gebruik geen momentum.'
