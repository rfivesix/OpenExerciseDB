name: Statische dumbbell hold op inclinebank
description: 'Uitvoering


  Vasthouden: Laat de dumbbells zakken tot enkele centimeters boven je borst, ongeveer halverwege een
  normale incline press. In deze positie staat je bovenborst onder maximale spanning.


  Statische hold: Houd de positie 20–45 seconden vast en houd je borst aangespannen. Adem rustig, maar
  blijf aangespannen; ontspan je borst of schouders niet.


  Einde van de set: Breng de dumbbells na de hold voorzichtig omlaag en rust uit.'
