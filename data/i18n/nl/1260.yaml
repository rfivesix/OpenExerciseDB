name: TRX-hammercurl
description: Plaats de handgrepen alsof ze het verlengde van de banden vormen. Strek je armen naar voren
  en leun met je lichaam recht naar achteren. Buig je ellebogen om je lichaam naar de banden toe te trekken
  en je biceps te activeren. Aan het einde van de samentrekking bewegen je handen door de gebruikte greep
  iets naar buiten.
