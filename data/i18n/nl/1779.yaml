name: Landmine rotatie
description: 'Zet één uiteinde van een halterstang vast in een landminebevestiging of hoek. Ga met je
  gezicht naar de stang staan, voeten op schouderbreedte. Houd het vrije uiteinde met beide handen en
  verstrengelde vingers voor je borst, met gestrekte armen. Buig je knieën licht en span je core aan.


  1. Laat de stang gecontroleerd in een brede boog naar één heup zakken, met je armen bijna gestrekt.

  2. Laat je romp draaien en je achterste voet iets meedraaien; rem het gewicht af met je schuine buikspieren
  en core.

  3. Span je core aan en breng de stang terug naar het midden en daarna naar de andere heup.

  4. Wissel vloeiend af.


  Buig je ellebogen niet sterk. De rotatie en controle komen vanuit je romp.'
