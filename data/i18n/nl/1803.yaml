name: Trap-bar squat
description: 'Ga in het midden van een trap bar (hex bar) staan met je voeten op schouderbreedte. Zak
  met een rechte romp omlaag en pak de neutrale handgrepen stevig vast. Trek je schouders naar achteren,
  houd je borst omhoog en span je core aan.


  1. Duw krachtig vanuit je hielen en middenvoet in de vloer en strek knieën en heupen tegelijk.

  2. Houd je borst omhoog tijdens het opstaan.

  3. Sta volledig rechtop en span je bilspieren en quadriceps aan.

  4. Laat het gewicht gecontroleerd zakken door je heupen en knieën te buigen tot de schijven de vloer
  raken.


  Houd je romp rechterop dan bij een conventionele deadlift om volgens de bron de knieflexie en quadriceps
  te benadrukken en de onderrug te ontzien.'
