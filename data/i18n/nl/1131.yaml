name: Heupextensie aan kabel
description: Bevestig een enkelband aan de lage kabelkatrol en om de werkende enkel. Sta naar de machine
  gericht, buig licht vanuit de heupen en houd het frame vast; standbeen licht gebogen en bekken recht
  naar voren. Strek het werkbeen recht naar achteren en omhoog door de bilspier aan te spannen, met een
  lichte kniebuiging. Span bovenaan kort aan zonder de onderrug hol te trekken. Laat het been beheerst
  zakken.
