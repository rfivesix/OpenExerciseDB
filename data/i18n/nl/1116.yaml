name: Dumbbell farmer’s carry
description: Til twee zware dumbbells met een heupscharnier van de vloer en houd ze naast je vast met
  gestrekte armen. Sta lang met borst omhoog, schouders naar achteren en omlaag en romp aangespannen.
  Wandel vooruit met korte, beheerste passen. Blijf rechtop zonder voorover te leunen of zijwaarts te
  zwaaien; knijp de handgrepen stevig vast en laat de gewichten niet slingeren. Wandel de voorgeschreven
  afstand of tijd en zet de gewichten met rechte rug neer.
