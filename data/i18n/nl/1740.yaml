name: Eenbenige glute bridge
description: 'Ga op je rug liggen met gebogen knieën en je voeten plat op de vloer, ongeveer op heupbreedte.
  Til één been van de vloer, gestrekt in lijn met het andere bovenbeen of met de knie naar je borst. Laat
  je armen naast je lichaam liggen voor stabiliteit.


  1. Duw vanuit de hiel van je steunvoet en til je heupen op tot je bovenbenen, heupen en romp één rechte
  lijn vormen.

  2. Span je bilspier bovenaan aan en houd 1–2 seconden vast.

  3. Laat je heupen langzaam en gecontroleerd zakken zonder volledig te rusten en begin de volgende herhaling.


  Houd je bekken horizontaal; laat de niet-werkende zijde niet zakken of draaien.'
