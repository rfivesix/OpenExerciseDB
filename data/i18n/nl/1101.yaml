name: Isometrische pull-up-/roeihold
description: 'Pak een optrekstang (boven- of onderhandse greep) of stel een suspension trainer/stang in
  voor omgekeerd roeien. Trek jezelf naar de bovenste positie: kin boven de stang of borst bij de grepen/stang.
  Houd statisch vast, trek de schouderbladen omlaag en naar elkaar en span brede rugspieren, rhomboïden
  en biceps aan. Adem rustig, laat de schouders niet optrekken en de borst niet inzakken. Houd de voorgeschreven
  tijd vast en laat gecontroleerd zakken.'
