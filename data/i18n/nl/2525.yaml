name: Couch stretch
description: 'Startpositie:

  Kniel op een mat met je rug naar een muur, bank of bankje. Plaats je achterste knie dicht bij de voet
  van de steun en laat je scheen verticaal rusten, met de wreef tegen de steun. Zet je andere voet naar
  voren in een uitvalshouding van 90 graden.


  Uitvoering:

  1. Span je romp aan en knijp de bilspier van je achterste been samen zodat je bekken achterover kantelt.

  2. Breng je romp langzaam rechtop tot je een duidelijke rek voelt in de heupbuigers en quadriceps van
  je achterste been.

  3. Houd de rechte rek gedurende de voorgeschreven tijd vast en adem diep en gelijkmatig.

  4. Kom voorzichtig uit de houding en wissel van been.


  Aandachtspunten:

  Trek je onderrug niet hol om rechtop te komen. Houd je ribben laag en je bilspieren aangespannen om
  de rek op de heupbuiger te richten.'
