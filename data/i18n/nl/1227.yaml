name: Rear-delt-row met dumbbells
description: 'Startpositie:

  • Houd in elke hand een dumbbell en buig vanuit je heupen tot je romp bijna evenwijdig aan de vloer
  is; houd je rug recht.

  • Laat je armen recht onder je schouders hangen met een bovenhandse greep en je handpalmen naar achteren.


  Uitvoering:

  • Roei de dumbbells omhoog door je ellebogen wijd naar buiten te bewegen, ongeveer 90 graden ten opzichte
  van je romp.

  • Trek tot je bovenarmen op één lijn liggen met je schouders en span je achterste deltaspieren en bovenrug
  aan.

  • Laat de dumbbells gecontroleerd zakken zonder je wervelkolom rond te maken.'
