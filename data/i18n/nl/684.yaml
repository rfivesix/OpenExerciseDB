name: Lat pulldown met onderhandse greep
description: Ga bij het lat-pulldownstation zitten en stel de dijsteunen zo af dat je onderlichaam stevig
  vastzit. Pak de stang met een onderhandse greep op schouderbreedte of iets smaller vast. Trek de stang
  soepel naar je bovenborst door je ellebogen omlaag en naar achteren te bewegen; span je lats en biceps
  aan. Strek je armen langzaam en volledig terug omhoog terwijl je de spanning in je rug behoudt.
