name: YTW-heffingen
description: 'Startpositie:

  Ga met je gezicht naar beneden op een mat liggen of buig vanuit je heupen voorover met een rechte rug.
  Strek je armen opzij met je duimen naar het plafond.


  Uitvoering:

  1. Y-heffing: til je gestrekte armen diagonaal ongeveer 45 graden naar voren tot ze met je romp een
  Y vormen. Span je onderste en middelste trapezius aan en houd 1–2 seconden vast.

  2. T-heffing: beweeg je armen recht opzij, loodrecht op je lichaam, tot ze een T vormen. Trek je schouderbladen
  krachtig naar elkaar toe en pauzeer.

  3. W-heffing: buig je ellebogen en trek ze naar je ribben terwijl je je onderarmen naar achteren draait,
  tot je armen een W vormen. Span je ruitvormige spieren en achterste schouderspieren stevig aan.


  Aandachtspunten:

  Beweeg beheerst en trek je schouders niet op. Begin elke beweging door je schouderbladen naar elkaar
  toe te trekken.'
