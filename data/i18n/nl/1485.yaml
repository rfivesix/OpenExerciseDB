name: Rocking triceps pushdown
description: 'Startpositie:

  Ga in een gespreide stand voor een hoge kabel met touw staan. Pak het touw neutraal vast en leun iets
  naar voren, met je gewicht boven je voorste voet.


  Uitvoering:

  1. Duw het touw omlaag terwijl je je gewicht iets naar je achterste voet verplaatst; laat je handen
  achter je romp komen.

  2. Spreid onderaan de touweinden om je triceps krachtig aan te spannen.

  3. Laat het touw gecontroleerd omhoogkomen terwijl je je gewicht weer naar voren verplaatst.'
