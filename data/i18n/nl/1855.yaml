name: Foamroller voor hamstrings
description: 'Beginpositie: Zit op de vloer met de foamroller onder de achterkant van je dijen. Steun
  met je handen achter je en til je heupen op.


  Uitvoering: Rol langzaam van net onder je billen tot net boven de achterkant van je knieën. Draai je
  voeten licht naar binnen en buiten om de hele hamstringsgroep te behandelen.


  Tips: Beweeg gecontroleerd en pauzeer op gespannen plekken om myofasciale ontspanning te bevorderen.'
