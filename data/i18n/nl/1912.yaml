name: Zittende romprotatie (Russian twist)
description: Ga zitten met gebogen knieën en aanvankelijk je hielen op de vloer. Leun
  ongeveer 45 graden achterover en til je voeten iets op om op je zitbotten te balanceren.
  Draai je romp gecontroleerd van links naar rechts en breng je handen naast elke
  heup naar de vloer. Houd je heupen stabiel en draai met je romp, niet alleen met
  je armen.
