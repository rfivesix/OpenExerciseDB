name: Tuck L-sit
description: De tuck L-sit is een statische oefening met lichaamsgewicht. Steun met gestrekte armen op
  parallelle stangen, parallettes of de vloer en trek je knieën naar je borst. Houd je heupen omhoog,
  je wervelkolom recht en je voeten van de vloer. Span je romp aan, houd je schouders laag en je armen
  gestrekt terwijl je de ingetrokken positie vasthoudt. Deze statische houding vraagt veel van de romp
  en stabiliseert de schouders; ze wordt vaak gebruikt als voorbereiding op de volledige L-sit.
