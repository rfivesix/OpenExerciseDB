name: Hoge knieën
description: Sta rechtop met je voeten op heupbreedte en je armen ontspannen langs je lichaam. Ren ter
  plaatse en breng afwisselend één knie tot ongeveer heuphoogte, zodat je bovenbeen parallel aan de vloer
  komt. Beweeg je armen mee op het ritme. Blijf licht op de bal van je voeten landen, houd je romp rechtop
  en beweeg snel en ritmisch.
