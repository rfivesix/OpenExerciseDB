name: Intense borststretch
description: Ga op je rug op een vlakke bank liggen met lichte dumbbells, of sta naast
  een stevig deurkozijn of rack met je arm op schouderhoogte ertegen. Laat je armen
  langzaam zijwaarts en omlaag zakken tot je een aanhoudende rek in je borstspieren
  voelt. Adem diep en houd 30–60 seconden vast zonder te veren. Een scherpe schouderpijn
  hoort niet bij de stretch.
