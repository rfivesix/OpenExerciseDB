name: Staande iliotibiale-bandstretch
description: 'Beginpositie: Sta zijwaarts naast een muur of stevige steun. Kruis het buitenste been dat
  je wilt rekken achter je voorste been en zet je voet plat neer.


  Uitvoering: Steun met je binnenste hand tegen de muur en duw je heupen rustig naar de muur (tegenovergesteld
  aan de richting van je zijwaartse buiging). Buig je romp de andere kant op tot je een duidelijke rek
  voelt in je buitenste heup en dij.


  Tips: Houd je bekken naar voren gericht zonder te draaien. Houd 20–30 seconden vast terwijl je rustig
  ademt en herhaal aan de andere kant.'
