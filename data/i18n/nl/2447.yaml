name: Hip airplane
description: 'Startpositie:

  Sta op één been en raak zo nodig licht een muur of stevige steun aan voor je evenwicht. Buig vanuit
  je heupen met een rechte rug voorover en strek je vrije been recht naar achteren, tot je romp en achterste
  been ongeveer horizontaal zijn.


  Uitvoering:

  1. Draai je bekken langzaam naar binnen richting je standbeen en laat je vrije heup naar de vloer zakken.

  2. Draai vervolgens je bekken naar buiten en omhoog richting het plafond, zodat je heupen openen.

  3. Keer vloeiend terug naar de neutrale startpositie. Herhaal het gewenste aantal keren en wissel dan
  van kant.


  Aandachtspunten:

  Laat de beweging uitsluitend vanuit het heupgewricht van je standbeen komen. Houd je standvoet stevig
  op de grond en voorkom dat je standknie naar binnen zakt.'
