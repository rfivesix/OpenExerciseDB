name: Incline dumbbell row
description: 'Leun met een neutrale greep tegen een schuine bank.

  Houd in elke hand een dumbbell met neutrale greep vast en begin met gestrekte armen. Dit is de beginpositie.

  Trek je schouderbladen naar achteren en buig je ellebogen om de dumbbells naar je zij te roeien.

  Pauzeer bovenaan en keer terug naar de beginpositie.'
