name: Trapklimmen op een machine
description: Stap op de draaiende treden van de trapklimmachine en houd je lichaam rechtop. Leg je handen
  licht op de leuningen voor je evenwicht, zonder erop te leunen. Stap soepel en beheerst van trede naar
  trede en plaats je hele voet op elke trede. Houd je borst omhoog, schouders naar achteren en romp aangespannen.
  Stel de snelheid af op je conditie.
