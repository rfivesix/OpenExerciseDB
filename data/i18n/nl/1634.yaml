name: Pullover-row met kabel en touw
description: Zet een schuine bank voor een lage kabelkatrol met een touwbevestiging. Leun voorover over
  de rugleuning. Begin door het touw in een zwaaiende pulloverboog naar je heupen te trekken en maak de
  beweging af als een row door je ellebogen naar achteren te bewegen en je brede rugspieren volledig aan
  te spannen.
