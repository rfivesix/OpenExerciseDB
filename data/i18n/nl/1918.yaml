name: Chest press op plate-loaded machine
description: Stel de zitting zo in dat de handgrepen ter hoogte van je middenborst
  staan. Ga met hoofd en rug tegen de leuning zitten, pak de handgrepen en trek je
  schouderbladen naar achteren en omlaag. Duw de handgrepen vloeiend naar voren tot
  je armen bijna gestrekt zijn, span je borst aan en laat langzaam terugzakken tot
  je een rek voelt.
