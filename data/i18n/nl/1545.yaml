name: Archer pull-up
description: 'Een archer pull-up is een geavanceerde oefening met het eigen lichaamsgewicht die de rug
  en biceps versterkt en een stap vormt richting een eenarmige pull-up. Bovenaan neemt het lichaam een
  houding aan die lijkt op het spannen van een boog.


  Grip: Pak de optrekstang bovenhands vast, wijder dan schouderbreedte.

  Startpositie: Hang met gestrekte armen, span je romp aan en houd je schouderbladen omlaag.

  Trekken: Trek jezelf richting één hand, zoals bij een gewone pull-up. Strek tegelijkertijd de andere
  arm zijwaarts en houd die zo recht mogelijk. Breng je kin naar de hand waarmee je trekt.

  Vasthouden en zakken: Houd de bovenste positie kort vast, met één arm gebogen en de andere gestrekt.
  Zak langzaam en gecontroleerd terug.

  Wisselen: Herhaal naar de andere hand. Houd de ondersteunende arm zo recht mogelijk om de belasting
  op de werkende arm te vergroten. Dit maakt de oefening uitdagend en effectief voor eenzijdige trekkracht.'
