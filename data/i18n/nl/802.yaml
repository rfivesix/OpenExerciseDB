name: Walking lunge met halterstang
search_terms:
- Walking lunge met halterstang
description: Leg de halterstang op je bovenrug, op je trapezius, en sta rechtop met je voeten op heupbreedte.
  Zet gecontroleerd een stap naar voren en laat je heupen zakken tot beide knieën ongeveer 90 graden gebogen
  zijn. Duw via je voorste hiel omhoog en stap meteen met je achterste been naar voren in de volgende
  lunge. Blijf in een vloeiend afwisselend ritme vooruitlopen met je romp rechtop en aangespannen.
