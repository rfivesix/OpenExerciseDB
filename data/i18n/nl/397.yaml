name: Lage box squat met brede stand
description: Haal de stang uit het rek en zet je voeten breed, verder uit elkaar dan je heupen. Duw je
  heupen naar achteren en zak naar een box die je onder parallel laat komen. Ga helemaal zitten; raak
  de box niet alleen even aan om meteen terug te veren. Sta daarna explosief op. Houd je bovenrug en romp
  gedurende de hele beweging aangespannen.
