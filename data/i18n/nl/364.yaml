name: Leg curl
description: De leg curl, ook wel hamstringcurl genoemd, is een isolatieoefening voor de hamstrings. Je
  buigt het onderbeen tegen weerstand richting de billen. Andere oefeningen om de hamstrings te versterken
  zijn de glute-ham raise en de deadlift.
