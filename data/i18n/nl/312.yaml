name: Declineplank met voeten op een fitnessbal en afwisselend zijwaarts aantikken
description: 'Voer een plank uit met je benen omhoog en je voeten op een fitnessbal. Verplaats, zodra
  je stabiel bent, langzaam één voet zijwaarts van de bal, raak de vloer ermee aan en keer terug naar
  de beginpositie. Wissel af met de andere voet.

  Dit is een oefening voor de romp.'
