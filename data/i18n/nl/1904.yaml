name: Pec deck
description: Ga met je rug en hoofd tegen de rugleuning van de pec-deckmachine zitten en stel de zitting
  zo in dat de kussens of handgrepen ter hoogte van je middenborst staan. Houd de handgrepen vast of plaats
  je onderarmen op de kussens, met licht gebogen ellebogen. Breng je armen in een vloeiende boog voor
  je borst samen en span je borstspieren 1–2 seconden aan. Laat het gewicht gecontroleerd teruggaan; laat
  je ellebogen niet ver achter je schouders komen.
