name: Incline Y-raise met dumbbells
description: 'Zet een schuine bank op 45° en zit met je borst tegen de steun, met je gezicht naar de bank.
  Houd in elke hand een dumbbell met de handpalmen naar elkaar. Zet je voeten stevig neer en laat je armen
  met licht gebogen ellebogen omlaag hangen. Span je core aan en houd je rug recht.


  Til je armen gecontroleerd naar voren en naar buiten in een Y-vorm, met je ellebogen licht gebogen,
  tot je armen ongeveer parallel aan de vloer en in lijn met je oren zijn. Pauzeer kort bovenaan om je
  schouders aan te spannen en laat je armen langzaam terugzakken. Houd zowel de opwaartse als neerwaartse
  beweging langzaam en gecontroleerd om de deltaspieren en ondersteunende spieren te trainen. Herhaal
  het gewenste aantal keren met behoud van de techniek.'
