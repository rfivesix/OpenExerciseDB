name: Cossack squat
description: Sta breed met tenen iets naar buiten en houd je romp rechtop, handen
  voor je borst. Verplaats je gewicht naar één been en zak diep terwijl het andere
  been gestrekt zijwaarts blijft. Draai de voet van het gestrekte been omhoog zodat
  de tenen naar het plafond wijzen en houd de hiel op de vloer. Zak zo ver als je
  mobiliteit toelaat, duw via de werkende hiel terug naar het midden en wissel van
  kant.
