name: Eenarmige tricepsstrekking aan kabel
description: Ga recht voor of iets schuin naar een hoge kabelkatrol staan en houd met één hand een handgreep
  of het uiteinde van een touw vast. Houd je bovenarm tegen je zij met je elleboog ongeveer 90 graden
  gebogen. Duw het hulpstuk omlaag door je elleboog te strekken tot je triceps volledig is aangespannen.
  Breng de greep langzaam en gecontroleerd omhoog zonder je elleboog of schouder te verplaatsen.
