name: T-bar row
description: 'Beginpositie: ga schrijlings over de T-bar of landmine staan met je voeten op schouderbreedte.
  Buig vanuit je heupen ongeveer 45 graden voorover met een rechte rug en licht gebogen knieën. Pak de
  V-grepen met gestrekte armen vast. Uitvoering: trek het gewicht soepel naar je bovenbuik, beweeg je
  ellebogen naar achteren en knijp bovenaan je schouderbladen samen. Terugkeer: laat het gewicht gecontroleerd
  zakken tot je armen gestrekt zijn en houd je wervelkolom neutraal. Aanwijzingen: houd je borst omhoog
  en gebruik niet te veel momentum; rond je onderrug niet.'
