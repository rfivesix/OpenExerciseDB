name: Tate press met dumbbells
description: 'Beginpositie: Ga op je rug op een vlakke bank liggen met twee dumbbells. Strek je armen
  boven je borst zoals bij de lock-out van een bankdruk. Draai je handen in pronatie, handpalmen naar
  je voeten en duimen naar elkaar; houd de binnenste koppen van de dumbbells tegen elkaar of dicht bij
  elkaar.


  Uitvoering:

  1. Houd je bovenarmen stil en je ellebogen naar buiten gericht terwijl je ze buigt en de binnenste dumbbellkoppen
  naar het midden van je borst laat zakken.

  2. Raak je borstbeen licht aan zonder het gewicht op je lichaam te laten rusten.

  3. Strek je ellebogen krachtig om terug te drukken; denk eraan je pinken naar het plafond te duwen om
  je triceps te benadrukken.

  4. Span je triceps bovenaan aan voordat je de volgende herhaling begint.


  Aanwijzing: Beweeg alleen vanuit de ellebogen; laat je schouders of bovenarmen niet meezwaaien.'
