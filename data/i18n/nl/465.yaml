name: Preacher curl met EZ-stang
description: 'Leg een EZ-stang op de steunen voor de preacherbank. Leun over de bank en pak de binnenste
  schuine grepen onderhands vast. Ga stevig op de zitting zitten, met je triceps tegen het schuine kussen
  en je borst er comfortabel tegenaan.

  Laat de stang langzaam en gecontroleerd zakken tot je ellebogen gestrekt zijn, zonder ze te overstrekken.
  Buig je ellebogen en span je biceps aan om het gewicht omhoog te curlen. Stop net vóór de verticale
  positie om spanning te houden. Herhaal.'
