name: Voorovergebogen cable fly
description: 'Startpositie:

  Zet de kabels van een cable crossover op middelhoge tot hoge stand en bevestig D-handgrepen. Ga met
  één voet voor de andere in het midden staan en buig vanuit je heupen ongeveer 45–60° voorover met een
  rechte rug. Houd je armen zijwaarts gestrekt met je ellebogen licht gebogen.


  Uitvoering:

  1. Breng de grepen in een brede boog naar voren en omlaag tot je handen voor je onderborst samenkomen.

  2. Span je borstspieren bovenaan één seconde aan.

  3. Keer langzaam en gecontroleerd terug naar de beginpositie met dezelfde lichte elleboogbuiging.


  Aandachtspunten:

  Houd je romp stil en zwaai niet heen en weer. De beweging komt vanuit je schouders.'
