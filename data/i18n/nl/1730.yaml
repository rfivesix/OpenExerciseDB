name: Laterale kabelheffing
description: 'Startpositie:

  Ga zijwaarts naast een lage kabelkatrol staan. Pak het handvat met je buitenste hand vast, gekruist
  voor je lichaam. Houd je romp rechtop en je elleboog licht gebogen.


  Uitvoering:

  1. Hef je arm zijwaarts en leid de beweging met je elleboog tot schouderhoogte.

  2. Pauzeer kort bovenaan om je laterale deltaspier aan te spannen.

  3. Laat het handvat langzaam en gecontroleerd zakken naar de beginpositie.


  Tips:

  Leid met je elleboog, niet met je hand. Haal je schouder niet op en houd je bovenste trapezius ontspannen.'
