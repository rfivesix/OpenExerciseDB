name: Sprinter sit-up
description: Ga op je rug liggen met je benen gestrekt en je armen langs je lichaam; houd je ellebogen 90 graden
  gebogen. Draai tijdens het omhoogkomen je bovenlichaam naar rechts en breng je linkerknie naar je rechterelleboog
  terwijl je je linkerarm naar achteren zwaait. Laat je lichaam zakken naar de startpositie en herhaal naar rechts.
  Dat is één herhaling.
