name: TRX-row
description: 'Beginpositie: kijk naar het ankerpunt, pak de TRX-handgrepen met een neutrale greep vast
  en leun achterover met gestrekte armen. Zet je voeten verder naar voren voor de gewenste hellingshoek
  en houd je lichaam recht in een planklijn van hoofd tot hielen. Uitvoering: trek je borst naar de handgrepen
  door je ellebogen naar achteren te bewegen en je schouderbladen samen te knijpen. Terugkeer: laat je
  lichaam gecontroleerd zakken tot je armen gestrekt zijn en houd je romp aangespannen. Aanwijzingen:
  hoe horizontaler je lichaam, hoe zwaarder de oefening. Laat je heupen niet doorzakken.'
