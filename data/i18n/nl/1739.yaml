name: Shrimp squat
search_terms:
- "Shrimp squat"
description: 'Startpositie:

  Sta rechtop op één been. Buig je vrije been achter je bij de knie en pak je enkel of voet vast met de
  hand aan dezelfde of de andere kant.


  Uitvoering:

  1. Duw je heupen naar achteren en buig je standknie om gecontroleerd in een eenbenige squat te zakken.

  2. Zak tot de knie van je vastgehouden been de vloer achter je licht aantikt.

  3. Duw stevig vanuit je standvoet om je been te strekken en rechtop terug te keren.


  Tips:

  Leun licht naar voren om je balans te houden. Controleer de neerwaartse beweging.'
