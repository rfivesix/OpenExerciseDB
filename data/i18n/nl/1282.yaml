name: Isometrische chin-up met onderhandse greep
description: 'Beginpositie:

  Pak de optrekstang op schouderbreedte vast met een onderhandse greep en trek jezelf omhoog tot je kin
  boven de stang is.


  Uitvoering:

  1. Houd deze bovenste positie stil vast, met je ellebogen volledig gebogen en dicht langs je lichaam.

  2. Span je lats, biceps en romp gedurende de hele houding stevig aan.

  3. Laat jezelf langzaam en gecontroleerd zakken zodra de ingestelde tijd is bereikt.'
