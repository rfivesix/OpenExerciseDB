name: Voorwaartse armcirkels
description: Sta met je voeten op schouderbreedte en strek je armen zijwaarts op schouderhoogte, handpalmen
  omlaag. Maak kleine, beheerste cirkels met je armen naar voren. Vergroot de cirkels geleidelijk terwijl
  je schouders opwarmen. Houd je schouderbladen naar achteren en trek je schouders niet op richting je
  oren.
