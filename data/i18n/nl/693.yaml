name: Upright row met EZ-stang
description: Sta met je voeten op schouderbreedte. Houd de EZ-stang met een bovenhandse greep voor je
  dijen en strek je armen. Trek de stang dicht langs je lichaam tot je kin. Je ellebogen wijzen naar buiten
  en vormen bovenaan een V. Pauzeer kort en laat de stang langzaam zakken voordat je herhaalt.
