name: Onderarmplank met afwisselende beenlift
description: Begin in een onderarmplank, met je ellebogen onder je schouders en je lichaam in een rechte
  lijn. Houd één been gestrekt, span je bilspieren aan en til één voet beheerst enkele centimeters op.
  Houd kort vast zonder je gewicht sterk te verplaatsen, laat je voet zakken en herhaal met het andere
  been. Laat je heupen niet draaien, omhoogkomen of doorzakken; span je romp aan.
