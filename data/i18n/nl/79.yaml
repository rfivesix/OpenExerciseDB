name: Gebogen high pull
description: 'Beginpositie:

  Sta met je voeten op schouderbreedte en houd in elke hand een dumbbell voor je dijen. Buig vanuit je
  heupen, met licht gebogen knieën en een rechte rug, tot je romp voorover helt en je armen recht omlaag
  hangen.


  Uitvoering:

  1. Trek de dumbbells recht omhoog naar je borst of oksels en beweeg je ellebogen hoog en wijd naar buiten.

  2. Span bovenaan je achterste deltaspieren en bovenrug aan.

  3. Laat de dumbbells langzaam en beheerst zakken tot je armen weer hangen.


  Opmerkingen:

  Houd je rug recht en je romp aangespannen. De beweging komt vanuit het hoog optrekken van je ellebogen.'
