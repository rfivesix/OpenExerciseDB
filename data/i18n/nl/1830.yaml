name: Reverse lunge met halterstang
description: 'Beginpositie: Leg een halterstang op je bovenste trapezius. Sta rechtop met je voeten op
  heupbreedte, borst vooruit en core aangespannen.


  Uitvoering:

  1. Zet gecontroleerd een duidelijke stap naar achteren met één been en houd je heupen recht.

  2. Laat je heupen verticaal zakken tot je voorste dij parallel aan de vloer is en je achterste knie
  net boven de mat hangt (beide knieën ongeveer 90°).

  3. Duw stevig via de hiel en middenvoet van je voorste been om terug te staan.

  4. Herhaal met het andere been, wissel af of voltooi eerst alle herhalingen aan één kant.


  Aanwijzing: Duw via de voorste hiel in plaats van af te zetten met de achterste voet, zodat de spanning
  op de voorste bilspier en quadriceps blijft.'
