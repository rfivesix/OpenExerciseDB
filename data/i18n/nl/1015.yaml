name: Nekcirkels met de klok mee
description: 'Ga rechtop zitten of staan, ontspan je schouders en breng je kin licht naar je borst. Rol
  je hoofd langzaam met de klok mee: naar je rechterschouder, voorzichtig naar achteren, naar je linkerschouder
  en terug naar je borst. Houd je nek ontspannen en maak vloeiende cirkels.'
