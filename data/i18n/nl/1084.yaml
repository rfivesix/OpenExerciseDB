name: Dumbbell floor press
description: Lig op de rug op de vloer met gebogen knieën en voeten plat. Houd in elke hand een dumbbell
  boven de borst; bovenarmen rusten op de vloer en ellebogen staan ongeveer 45 graden van de romp. Druk
  de dumbbells gecontroleerd omhoog tot de armen boven de borst gestrekt zijn en span bovenaan de borstspieren
  aan. Laat zakken tot de achterkant van de bovenarmen zacht de vloer raakt. Pauzeer kort en druk opnieuw.
