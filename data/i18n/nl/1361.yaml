name: Front squat met twee kettlebells
description: 'Beginpositie:

  Clean twee kettlebells naar de rackpositie op borsthoogte: houd je ellebogen dicht bij je ribben, je
  polsen neutraal en de bollen van de kettlebells in de driehoek tussen je onderarmen en biceps. Zet je
  voeten op schouderbreedte.


  Beweging:

  Adem in en span je romp stevig aan. Beweeg je heupen naar achteren en buig je knieën om diep te squatten,
  terwijl je je romp zo rechtop mogelijk houdt. Duw via je middenvoet en hielen terug naar een volledig
  staande positie.


  Opmerkingen:

  Houd je borst omhoog en je ellebogen hoog om te voorkomen dat het gewicht je bovenrug naar voren rondt.'
