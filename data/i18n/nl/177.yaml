name: Fietsen
description: 'Beginpositie:

  Stel het zadel van je fiets of hometrainer zo in dat je knie licht gebogen is (ongeveer 25–35 graden)
  wanneer het pedaal onderaan staat. Stel het stuur zo af dat je het comfortabel kunt vasthouden, met
  ontspannen schouders en een neutrale wervelkolom.


  Uitvoering:

  1. Trap in vloeiende, ononderbroken cirkels met een gelijkmatig ritme.

  2. Duw met de bal van je voeten omlaag en trek mee tijdens de omwenteling.

  3. Houd een gelijkmatig tempo aan en pas de weerstand aan het doel van de training aan.


  Opmerkingen:

  Houd je romp stabiel zodat je heupen niet heen en weer bewegen op het zadel. Adem regelmatig en ritmisch.'
