name: Gecontroleerde articulaire nekrotaties (neck CARs)
description: Sta of zit rechtop, trek je schouderbladen omlaag en naar achteren en
  span je romp licht aan. Breng je kin langzaam naar je borst, beweeg langs je rechter
  sleutelbeen naar je schouder, kantel je oor en maak gecontroleerd een boog naar
  achteren zonder je nek te beknellen. Ga via de andere schouder langs je sleutelbeen
  terug naar het midden. Doe drie langzame cirkels en herhaal andersom; houd schouders
  en romp stil.
