name: Roll-overs naar V-sit
description: Ga rechtop zitten met gestrekte benen. Rond je rug en rol soepel achterover
  op je bovenrug, til je heupen op en breng je benen boven je hoofd. Gebruik gecontroleerd
  voorwaarts momentum om weer rechtop te komen, spreid je benen in een V en reik tussen
  je benen naar voren om hamstrings en liezen te rekken. Herhaal 10 keer vloeiend.
  Houd je nek ontspannen en steun op bovenrug en schouders.
