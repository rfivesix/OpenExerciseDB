name: Schouderophalen
description: Schouderophalen is een krachtoefening om het bovenste deel van de monnikskapspier te trainen. Sta rechtop
  met je handen ongeveer op schouderbreedte en haal je schouders zo hoog mogelijk op. Laat ze daarna zakken zonder
  je ellebogen te buigen of je lichaam te bewegen. De bewegingsuitslag kan kleiner zijn dan bij een normale shrug
  voor actieve mobiliteit. Een horizontale schouderlijn in de opgehaalde positie wordt doorgaans als goede uitvoering
  beschouwd.
