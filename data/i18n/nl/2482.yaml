name: Oefening voor uitblazen onder water
description: 'Startpositie:

  Sta in water tot borsthoogte met je voeten op schouderbreedte. Raak zo nodig licht de rand van het zwembad
  aan voor houvast.


  Uitvoering:

  1. Adem boven het water diep in door je mond.

  2. Buig je knieën en dompel je hoofd helemaal onder.

  3. Adem onder water langzaam, onafgebroken en volledig uit door je neus en/of mond; zacht neuriën kan
  de luchtstroom helpen regelen.

  4. Duw je af van de bodem om boven te komen, haal snel adem door je mond en zak meteen opnieuw onder.

  5. Blijf rustig en onafgebroken op en neer bewegen.


  Aandachtspunten:

  Oefen om al je uitademing onder water te doen; boven water haal je alleen adem in.'
