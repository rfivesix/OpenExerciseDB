name: Zijwaartse rompflexie met dumbbell
description: Ook bekend als zijwaartse buiging met dumbbell. Sta rechtop met je heupen op één lijn en je knieën
  licht gebogen. Behoud de natuurlijke kromming van je wervelkolom. Laat één arm langs je lichaam hangen en houd
  met die hand een dumbbell vast. Buig je romp langzaam en gecontroleerd zijwaarts tot ongeveer 45°.
