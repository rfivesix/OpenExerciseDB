name: Step-ups met gewicht
description: Leg een halterstang op je bovenrug of houd in elke hand een dumbbell en ga rechtop voor een
  stevige box of bank staan. Stap stevig met één voet op het platform en zorg dat je hele voet erop staat.
  Duw via je voorste hiel, strek je heup en knie en stap omhoog tot je rechtop staat. Stap gecontroleerd
  terug omlaag en behoud de spanning tijdens het zakken; herhaal of wissel van been.
