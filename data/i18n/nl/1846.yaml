name: Horse stance (zijwaartse spagaat)
description: 'Ga staan zoals voor een squat, met je voeten wijd en tenen iets naar buiten.

  Zak rustig in een diepe, brede squat; je heupen komen onder je knieën.

  Houd 3–5 seconden vast.

  Kom gecontroleerd omhoog en herhaal indien nodig.'
