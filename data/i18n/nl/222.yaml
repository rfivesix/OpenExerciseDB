name: Face pull
description: 'Bevestig een touw aan een kabelstation, ongeveer op borsthoogte.

  Stap naar achteren tot je het gewicht met volledig gestrekte armen draagt en ga in een gespreide stand
  staan, met één voet voor. Buig je knieën licht voor een stabiele basis.

  Trek je schouderbladen naar elkaar toe en trek het midden van het touw iets omhoog richting je gezicht.
  Denk eraan de uiteinden van het touw uit elkaar te trekken, niet alleen naar achteren.

  Draai je armen naar buiten wanneer het touw je gezicht nadert, zodat je knokkels naar het plafond wijzen.
  Houd de bovenste positie één seconde vast en laat langzaam zakken.'
