name: Halve nekcirkels
description: Ga rechtop zitten of staan en kantel je hoofd naar één schouder. Rol je hoofd langzaam voorwaarts
  en omlaag, waarbij je kin over je borst naar de andere schouder beweegt. Keer de beweging terug naar
  de beginzijde en wissel rustig heen en weer; rol je hoofd niet naar achteren.
