name: TRX-tricepsstrekking
description: Bevestig de TRX of een ander suspension-systeem boven je, met de handgrepen op borsthoogte
  of iets lager. Kijk welke hoogte je een goede startpositie geeft. Ga voor de handgrepen staan en pak
  ze met je handpalmen omlaag vast. Span je buikspieren aan, knijp je bilspieren samen, adem in en leun
  naar voren terwijl je je hielen van de vloer tilt. Houd je ellebogen gestrekt. Adem opnieuw in en laat
  jezelf langzaam zakken door je ellebogen te buigen. Zak tot je ellebogen een hoek van 90 graden maken,
  waarbij je polsen boven je ellebogen zijn. Houd dit even vast. Strek je armen door je triceps aan te
  spannen en keer uitademend terug naar de startpositie.
