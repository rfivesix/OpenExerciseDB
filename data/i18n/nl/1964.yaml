name: Brede push-up
description: 'Startpositie:

  Neem een hoge plankpositie aan. Plaats je handen duidelijk wijder dan schouderbreedte (ongeveer anderhalf
  keer die breedte), met je vingers iets naar buiten gericht. Houd je lichaam van hoofd tot hielen in
  een rechte lijn en span je romp en bilspieren aan.


  Uitvoering:

  Buig je ellebogen ongeveer 45–60 graden naar buiten en laat je borst gecontroleerd zakken tot net boven
  de mat. Pauzeer kort en duw via je handpalmen krachtig terug naar de plank.


  Tips:

  De brede handpositie legt meer nadruk op de buitenkant van de borst en de voorste schouderspieren en
  vermindert de hefboomwerking van de triceps. Laat je onderrug niet doorzakken.'
