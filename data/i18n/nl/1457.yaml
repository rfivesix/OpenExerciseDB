name: Cable press around
description: Stel de kabelkatrol op borsthoogte in en bevestig één handgreep. Houd de greep met een neutrale
  grip bij je borst, met je elleboog tegen je zij. Draai ongeveer 45 graden van de katrol af en neem een
  stabiele spreidstand aan. Duw de greep in een boog naar voren en iets voorbij de middellijn van je lichaam,
  volgens de hoek van je borstspieren. Span je borst aan zonder je heupen of onderrug te draaien. Keer
  langzaam terug en laat je borst diep rekken voordat je de volgende herhaling begint.
