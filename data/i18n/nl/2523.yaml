name: Serratus wall slide
description: 'Startpositie:

  Sta met je gezicht naar een gladde muur en je voeten op heupbreedte. Plaats je onderarmen verticaal
  tegen de muur, met beide ellebogen en polsen stevig in contact. Houd je ellebogen ongeveer op schouderhoogte
  en schouderbreedte.


  Uitvoering:

  1. Duw je onderarmen actief tegen de muur zodat je schouderbladen uit elkaar bewegen over je bovenrug.

  2. Schuif je onderarmen langzaam in een lichte V-vorm omhoog tot je ellebogen oog- of voorhoofdhoogte
  bereiken.

  3. Pauzeer bovenaan 1–2 seconden en blijf naar buiten en omhoog drukken om de serratus anterior te activeren.

  4. Schuif je onderarmen gecontroleerd terug naar de startpositie.


  Aandachtspunten:

  Houd voortdurend druk tegen de muur en trek je onderrug niet hol terwijl je armen omhoog glijden.'
