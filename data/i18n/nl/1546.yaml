name: Larsen-press
description: 'Beginpositie:

  Ga op een vlakke bank onder de halter liggen. Strek je benen recht voor je uit en houd ze boven de vloer
  (of leg ze op een aangrenzende bank), zodat je voeten de vloer niet raken. Pak de halter iets breder
  dan schouderbreedte vast en trek je schouderbladen naar achteren.


  Uitvoering:

  1. Haal de halter uit de steunen en laat hem beheerst naar het midden van je borst zakken. Houd je romp
  aangespannen voor je evenwicht.

  2. Duw de halter met kracht van je bovenlichaam recht omhoog tot je armen volledig gestrekt zijn, zonder
  afzet van je benen.

  3. Pauzeer kort bovenaan en begin dan aan de volgende herhaling.


  Aandachtspunt:

  Doordat je geen beenafzet gebruikt, worden borst en triceps sterk geïsoleerd belast en moeten je romp
  en schouderbladen stabiel blijven.'
