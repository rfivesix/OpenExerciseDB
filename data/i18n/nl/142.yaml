name: Externe rotatie aan de kabel
description: 'Beginpositie:

  Stel de kabelkatrol in op ellebooghoogte. Ga met je zij naar de kabeltoren staan en pak de handgreep
  met je buitenste hand vast (de hand die het verst van de kabel is). Buig je elleboog 90 graden en houd
  hem tegen je zij; je kunt een klein opgerold handdoekje tussen je elleboog en romp plaatsen.


  Uitvoering:

  1. Houd je elleboog tegen je zij en draai je onderarm zo ver als comfortabel naar buiten, weg van je
  lichaam.

  2. Span aan het einde van de bewegingsuitslag je rotator cuff aan en pauzeer één seconde.

  3. Breng de handgreep langzaam en beheerst voor je romp terug naar de beginpositie.


  Opmerkingen:

  Houd je romp stil en draai je wervelkolom of heupen niet. De rotatie komt uitsluitend uit het schoudergewricht.'
