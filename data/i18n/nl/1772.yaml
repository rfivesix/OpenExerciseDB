name: Reverse crunch
description: 'Ga op je rug op een mat liggen met je armen naast je lichaam en je handpalmen op de vloer.
  Til je benen op met heupen en knieën ongeveer 90 graden gebogen.


  1. Span je buikspieren aan en breng je knieën naar je borst.

  2. Rol bovenaan je bekken en onderrug enkele centimeters van de mat.

  3. Houd de aanspanning 1–2 seconden vast terwijl je uitademt.

  4. Laat je bekken langzaam en gecontroleerd zakken tot je bovenbenen weer verticaal staan, terwijl je
  buikspieren aangespannen blijven.


  Schop niet en gebruik geen momentum; de beweging komt uit het oprollen van je wervelkolom met je buikspieren.'
