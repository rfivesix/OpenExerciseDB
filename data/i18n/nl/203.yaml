name: Dumbbell goblet squat
description: 'Houd een dumbbell met beide handen aan de zijkanten van de bovenste schijven vast. Houd
  hem voor je borst, dicht bij je romp. Zet je voeten ongeveer op schouderbreedte en houd je knieën licht
  gebogen.

  Zak door je knieën tot je bovenbenen evenwijdig aan de vloer zijn. Houd je rug recht en beweeg je heupen
  naar achteren zodat je knieën boven je voeten blijven. Kom weer omhoog en houd je knieën licht gebogen.
  Herhaal.

  Verdeel je lichaamsgewicht over je hielen en kijk recht vooruit of iets omhoog om je rug recht te houden.'
