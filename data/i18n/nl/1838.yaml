name: Schouderoefeningen met band
description: 'Beginpositie: Bevestig een weerstandsband aan een stevig anker op schouder- of borsthoogte.
  Pak de band met één hand vast en stap achteruit tot er lichte tot matige spanning op staat.


  Uitvoering: Maak gecontroleerde cirkel- en draaibewegingen met je arm in verschillende bewegingsvlakken
  om het schoudergewricht te mobiliseren en de rotator cuff op te warmen.


  Tips: Houd een rechte houding en span je core aan. Beweeg soepel, zonder rukken of haasten.'
