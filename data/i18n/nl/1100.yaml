name: Wall balls
description: Sta op ongeveer armlengte van een stevige muur of doel, voeten iets wijder dan schouderbreedte.
  Houd een medicinebal op borsthoogte met ellebogen dicht bij het lichaam. Zak diep in een squat met borst
  omhoog en knieën in lijn met de tenen. Duw explosief omhoog via hielen en heupen en stoot de bal naar
  het doel aan de muur. Vang de terugkaatsende bal op borsthoogte en zak direct gecontroleerd in de volgende
  squat.
