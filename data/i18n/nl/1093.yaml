name: Indoor roeimachine
description: 'Ga rechtop op de schuifzitting zitten en zet de voeten vast. Schuif naar de catch: knieën
  gebogen, schenen verticaal, romp licht voorover vanuit de heupen en armen gestrekt aan het handvat.
  Duw voor de drive krachtig met de benen; leun daarna licht achterover en trek het handvat naar de onderste
  ribben. Eindig met gestrekte benen, aangespannen romp en schouders laag. Strek voor herstel de armen,
  buig vanuit de heupen voorover en buig daarna de knieën om terug te schuiven. Houd de drive krachtig
  en het herstel ontspannen en gecontroleerd.'
