name: Eenarmige push-up
description: 'Beginpositie:

  Neem een push-uphouding aan en spreid je voeten voor meer balans. Plaats je steunhand op de vloer recht
  onder je borst en leg je vrije arm op je onderrug.


  Uitvoering:

  1. Buig je steunarm en laat je borst gecontroleerd naar de vloer zakken.

  2. Span je romp en bilspieren stevig aan om draaien van je romp te beperken.

  3. Duw via je handpalm terug naar de plankpositie. Voltooi alle herhalingen aan één kant voordat je
  van arm wisselt.'
