name: Band pull-aparts
description: 'Beginpositie:

  Sta rechtop met je voeten op heupbreedte. Houd een weerstandsband met beide handen ongeveer op schouderbreedte
  vóór je borst. Strek je armen met je ellebogen licht ontspannen; je handpalmen wijzen omlaag of naar
  elkaar.


  Beweging:

  Trek de band uit elkaar door je handen horizontaal naar buiten en naar achteren te bewegen. Knijp je
  schouderbladen stevig samen totdat de band je borst raakt. Pauzeer kort en breng je armen vervolgens
  langzaam en gecontroleerd terug naar voren.


  Opmerkingen:

  Haal je schouders niet op richting je oren en hol je onderrug niet. Houd de beweging soepel en doorlopend.'
