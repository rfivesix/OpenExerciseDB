name: Lat pulldown met achteroverleunende romp
description: Ga zitten bij het latpulldownstation en zet je bovenbenen vast onder de steunen. Pak de stang
  breder dan schouderbreedte vast. Leun met je romp licht naar achteren (ongeveer 20–30 graden) en trek
  de stang naar je bovenborst. Denk eraan je ellebogen omlaag te bewegen en je lats samen te trekken.
  Laat de stang gecontroleerd omhooggaan tot je armen volledig gestrekt zijn.
