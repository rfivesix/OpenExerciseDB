name: Glute bridge
description: Ga op je rug liggen met gebogen heupen en knieën en je voeten op de vloer. Til vanuit deze
  positie je billen op tot je lichaam een rechte lijn vormt van je knieën tot je schouders. Je kunt de
  oefening zwaarder maken door tijdens de beweging een halterstang op je heupen te laten rusten of je
  voeten op een iets hoger oppervlak te zetten, zoals een opstapje of bank.
