name: Voorovergebogen roeien met halterstang
description: 'Pak een halterstang met een bovenhandse greep (handpalmen omlaag). Buig je knieën licht
  en kantel je romp vanuit je heupen naar voren, met een rechte rug, tot die bijna parallel aan de vloer
  is. Houd je hoofd omhoog. De stang hangt recht voor je en je armen staan loodrecht op de vloer en je
  romp; dit is de beginpositie.

  Houd je romp stil, adem uit en trek de stang naar je toe. Houd je ellebogen dicht bij je lichaam en
  gebruik je onderarmen alleen om het gewicht vast te houden. Span bovenaan je rug aan en pauzeer kort.

  Adem in en laat de stang langzaam zakken naar de beginpositie. Herhaal het voorgeschreven aantal keer.'
