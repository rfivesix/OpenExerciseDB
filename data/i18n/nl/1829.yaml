name: Landmine squat to press
description: 'Beginpositie: Veranker één uiteinde van de halterstang in een landminebevestiging of hoek.
  Ga voor de stang staan met je voeten iets wijder dan schouderbreedte en tenen 15–30° naar buiten. Omvat
  met beide handen de huls van het vrije uiteinde en houd die op borsthoogte, net onder je sleutelbeenderen.


  Uitvoering:

  1. Span je core aan en zak in een diepe squat; houd je borst opgericht en hielen op de vloer tot je
  dijen parallel zijn.

  2. Duw krachtig vanuit je hielen omhoog en gebruik de beenstrekking om de stang omhoog te stuwen.

  3. Druk de stang in één vloeiende beweging boven je hoofd tot je armen gestrekt zijn.

  4. Leun bovenaan iets naar de stang om de natuurlijke opwaartse rotatie van je schouderbladen te ondersteunen.

  5. Laat de stang gecontroleerd naar borsthoogte zakken en ga direct over in de volgende squat.


  Aanwijzing: Verbind de squat en press tot één explosieve, gecoördineerde full-bodybeweging.'
