name: Clamshell naar omgekeerde clamshell
description: 'Startpositie:

  Ga op je zij liggen met je heupen en knieën 90 graden gebogen en je benen op elkaar. Til je bovenste
  been iets op en houd het tijdens de hele oefening zwevend.


  Uitvoering:

  1. Houd je hielen tegen elkaar en open je bovenste knie omhoog door je heup naar buiten te draaien (de
  gewone clamshell).

  2. Laat je knie zakken tot beide knieën elkaar raken en draai tegelijk je heup zodat je bovenste voet
  omhoog komt (de omgekeerde clamshell).

  3. Wissel vloeiend en gecontroleerd tussen de draaiing naar buiten en naar binnen.


  Aandachtspunten:

  Houd je bekken stabiel en naar voren gericht. Laat je bovenste been tussen herhalingen niet op je onderste
  been rusten.'
