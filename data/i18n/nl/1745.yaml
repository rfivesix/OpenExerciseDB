name: Cable front raise met korte stang
description: 'Bevestig een korte rechte stang aan de lage katrol. Ga met je rug naar de machine staan,
  met de kabel tussen je benen. Pak de stang voor je dijen met een bovenhandse greep op schouderbreedte.
  Sta rechtop met je borst omhoog, schouders laag en knieën licht gebogen.


  1. Hef de stang met bijna gestrekte ellebogen in een vloeiende boog naar voren tot je handen op schouderhoogte
  zijn.

  2. Pauzeer een seconde en focus op de aanspanning van je voorste deltaspieren.

  3. Laat de stang langzaam en gecontroleerd zakken en houd spanning op je schouders.


  Schommel niet met je romp en hol je onderrug niet overdreven om het gewicht omhoog te krijgen.'
