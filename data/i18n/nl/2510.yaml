name: Hollow-body-houding
description: 'Startpositie:

  Ga plat op je rug op een mat liggen met je benen gestrekt en bij elkaar en je armen boven je hoofd,
  in lijn met je oren.


  Uitvoering:

  1. Span je romp aan en druk je onderrug volledig tegen de vloer door je bekken achterover te kantelen.

  2. Til tegelijk je schouderbladen, hoofd en gestrekte benen ongeveer 10–15 cm van de vloer, zodat je
  lichaam een ondiepe gebogen bananenvorm krijgt.

  3. Houd je hele lichaam aangespannen, je tenen gestrekt en je bilspieren aangespannen.

  4. Houd de isometrische positie gedurende de voorgeschreven tijd vast en blijf oppervlakkig maar onafgebroken
  ademen.

  5. Laat jezelf gecontroleerd terugzakken.


  Aandachtspunten:

  Als je onderrug loskomt van de vloer, maak de oefening lichter door je knieën te buigen of je armen
  naast je heupen te brengen.'
