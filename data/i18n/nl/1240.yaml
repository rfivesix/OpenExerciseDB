name: Soleusstretch staand
search_terms:
- "Kuitstretch met gebogen knie"
- "Soleusstretch"
description: 'Startpositie:

  • Sta met je gezicht naar een muur en je handen op borsthoogte tegen de muur.

  • Zet één voet iets naar achteren in een kortere gespreide stand dan bij een gewone kuitstretch.


  Uitvoering:

  • Houd beide hielen op de vloer en buig beide knieën tegelijk, met nadruk op de achterste knie.

  • Laat je heupen zakken om de soleus onder de gastrocnemius, net boven de achillespees, te rekken.

  • Houd 20 tot 30 seconden vast met een rustige ademhaling en wissel dan van been.'
