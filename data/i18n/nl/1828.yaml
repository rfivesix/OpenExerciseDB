name: Abdominale intrekmanoeuvre (ADIM)
description: 'Beginpositie: Ga op je rug op een mat liggen met gebogen knieën en voeten plat; de oefening
  kan ook in handen-knieënstand of zittend. Plaats je vingertoppen op je onderbuik, net binnen je heupbeenderen,
  om de spieractiviteit te voelen.


  Uitvoering:

  1. Adem volledig uit door je mond.

  2. Trek je navel zacht naar binnen en omhoog richting je wervelkolom, alsof je een strakke broek dicht
  ritst.

  3. Houd je wervelkolom neutraal en bekken stabiel; druk je onderrug niet plat tegen de vloer.

  4. Houd de diepe aanspanning 10–15 seconden vast en blijf rustig, oppervlakkig ademen.

  5. Ontspan langzaam en adem normaal voordat je herhaalt.


  Aanwijzing: Deze oefening isoleert specifiek de transversus abdominis, de diepste buikstabilisator die
  verantwoordelijk is voor corestabiliteit en taillecontrole.'
