name: Hamstringstretch met gebogen knie
description: 'Beginpositie: Ga op je rug liggen of zit rechtop. Pak met beide handen de achterkant van
  je dij vast.


  Uitvoering: Trek je dij naar je borst terwijl je knie licht gebogen blijft. Strek je onderbeen net ver
  genoeg om een comfortabele rek in de hamstrings te voelen.


  Tips: Houd 20–30 seconden vast, adem rustig en wissel van kant. Een licht gebogen knie beschermt de
  heupzenuw en richt de rek op het spierweefsel.'
