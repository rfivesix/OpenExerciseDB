name: French Press Dumbbells
description: 'Houd de dumbbells vast en ga zo op een vlakke bank liggen dat ongeveer een kwart van je
  hoofd over de rand steekt. Strek je armen omhoog en houd de dumbbells daarna 10 tot 20 graden van je
  voeten af gericht. Houd je bovenarmen gedurende de hele oefening in deze hoek. Richt de dumbbells niet
  op je hoofd, maar boven en achter je hoofd; zo blijven de triceps tijdens de hele beweging belast.

  Let op je ellebogen en armen: alleen je triceps werken; de rest van je armen beweegt niet.'
