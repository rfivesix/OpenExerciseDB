name: Zittende lateral raise met dumbbells
description: Ga op de rand van een vlakke bank zitten met je voeten stevig op de vloer en in elke hand
  een dumbbell naast je. Leun iets naar voren en houd je ellebogen licht gebogen en stil. Hef de dumbbells
  in een brede boog zijwaarts tot je ellebogen en de gewichten op schouderhoogte zijn. Pauzeer kort en
  laat ze langzaam en gecontroleerd zakken zonder te zwaaien.
