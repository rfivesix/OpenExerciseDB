name: Unilaterale cross-body kabel pulldown
description: 'Stel de kabelkatrol op de hoogste stand in. Ga iets uit het midden staan zodat de kabel
  diagonaal over je bovenlichaam loopt. Pak het handvat met je verste hand vast en kantel iets vanuit
  je heupen; strek je arm boven je hoofd in de lijn van de kabel.


  1. Trek de kabel diagonaal omlaag en naar binnen, over je romp naar je heup, met je elleboog licht en
  vast gebogen.

  2. Beweeg je elleboog strak naar je ribben en span je latissimus dorsi en teres major bovenaan aan.

  3. Laat de kabel je arm langzaam langs dezelfde diagonale baan omhoog brengen tot je lats volledig rekken.'
