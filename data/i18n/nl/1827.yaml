name: Buikdruk met beide benen
description: 'Beginpositie: Ga op je rug op een mat liggen. Breng je benen in tafelpositie met heupen
  en knieën 90° gebogen. Druk je onderrug stevig tegen de vloer en plaats beide handpalmen op je dijen,
  net boven je knieën.


  Uitvoering:

  1. Duw je handen zo krachtig mogelijk tegen je dijen en duw je dijen tegelijk met gelijke kracht tegen
  je handen.

  2. Houd een maximale isometrische aanspanning van de gehele buikwand en diepe core (transversus abdominis).

  3. Houd de spanning 10–15 seconden vast terwijl je oppervlakkig en ritmisch blijft ademen.

  4. Ontspan geleidelijk, rust even en herhaal.


  Aanwijzing: Houd je onderrug tegen de vloer en houd je adem niet in.'
