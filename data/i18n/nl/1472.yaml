name: Inwaartse kabel shrug
description: 'Startpositie:

  Bevestig twee D-handgrepen aan de laagste standen van een dubbele kabelmachine. Ga rechtop tussen de
  torens staan met je voeten op schouderbreedte. Houd de grepen met gestrekte armen naast je vast, in
  de richting van de kabels.


  Uitvoering:

  1. Houd je armen recht en haal je schouders omhoog en iets naar binnen, richting je oren.

  2. Span bovenaan je bovenste trapezius één seconde aan.

  3. Laat je schouders langzaam en gecontroleerd zakken tot een volledige rek.


  Aandachtspunten:

  Houd je ellebogen tijdens de hele beweging gestrekt.'
