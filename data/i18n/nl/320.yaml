name: Jumping Jacks
description: Een jumping jack of sterrensprong, in het Amerikaanse leger ook «side-straddle hop» genoemd,
  is een sprong waarbij je je benen wijd uit elkaar zet en je armen boven je hoofd brengt, soms met een
  klap. Daarna keer je terug naar de positie met je voeten bij elkaar en je armen langs je lichaam.
