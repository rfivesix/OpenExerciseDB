name: Omgekeerde sneeuwengel
description: 'Startpositie:

  • Ga met je gezicht naar beneden op een mat liggen, met gestrekte benen en je armen boven je hoofd uitgestrekt.

  • Houd je nek neutraal en kijk naar de vloer.


  Uitvoering:

  • Til je armen en bovenborst licht van de vloer door je bovenrug aan te spannen.

  • Beweeg je armen in een brede boog zijwaarts en omlaag tot je handen bij je dijen komen.

  • Trek onderaan je schouderbladen naar elkaar toe.

  • Beweeg je armen langzaam in de omgekeerde boog terug boven je hoofd en houd ze daarbij van de vloer.'
