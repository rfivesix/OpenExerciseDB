name: Decline-bankdrukken met halterstang
description: Ga op een decline-bank liggen; de stang hoort recht boven je ogen te zijn. Houd je knieën
  licht gebogen en je voeten stevig op de vloer. Concentreer je, adem diep in en pak de stang wijder dan
  schouderbreedte vast. Laat hem langzaam zakken tot hij je borst ter hoogte van de tepels kort raakt
  en duw hem weer omhoog.
