name: Prisoner squat
description: Sta rechtop met je borst iets omhoog, je voeten op heupbreedte en je tenen naar voren. Plaats
  je handen achter je hoofd, de vingers licht in elkaar gehaakt en de ellebogen naar buiten. Duw je heupen
  naar achteren en buig je knieën; houd je bovenlichaam zo rechtop mogelijk. Duw je knieën naar buiten
  en laat ze niet naar elkaar wijzen. Als je bovenlichaam iets naar voren beweegt, houd je rug dan recht.
  Houd je ellebogen op oorhoogte door de spieren tussen je schouderbladen aan te spannen. Als je voldoende
  lenig bent, zak je tot je billen je kuiten raken, maar buig je wervelkolom niet. Keer de beweging om
  voordat dat gebeurt en duw met je hielen en bilspieren omhoog, met voldoende vaart om je voeten kort
  van de vloer te laten komen in een kleine sprong. Corrigeer zo nodig je voet-, arm- en bovenlichaampositie
  voordat je de volgende herhaling doet.
