name: Straight-arm band pulldown
description: Bevestig een weerstandsband hoog aan een optrekstang of ander ankerpunt.
  Ga ernaar toe staan, pak de band bovenhands met beide handen en stap achteruit tot
  er spanning staat. Buig licht vanuit je heupen met rechte rug en strek je armen
  boven je hoofd met een kleine elleboogbuiging. Trek de band in een boog naar je
  dijen vanuit je lats; houd je ellebogen vrijwel vast en laat de band gecontroleerd
  teruggaan.
