name: Sumo squat
description: 'Sta met je voeten wijder dan je schouders en je tenen ongeveer 45 graden naar buiten gericht.

  Houd je rug recht en zak langzaam door je knieën en heupen alsof je gaat zitten.

  Zak tot je dijen evenwijdig aan de vloer zijn.

  Duw jezelf omhoog en strek je benen om terug te keren naar de startpositie. Verdeel je gewicht gelijk over de
  bal van je voet en je hiel.'
