name: Plank op de onderarmen
description: 'Startpositie:

  Ga met je gezicht naar beneden op een mat liggen. Plaats je onderarmen parallel op de vloer, met je
  ellebogen recht onder je schouders. Zet je tenen op de vloer.


  Uitvoering:

  1. Span je romp aan en til je heupen, dijen en knieën van de vloer tot je lichaam van hoofd tot hielen
  een rechte, stevige lijn vormt.

  2. Span actief je bilspieren, quadriceps en buikspieren aan.

  3. Houd je nek neutraal en kijk recht tussen je onderarmen.

  4. Houd de isometrische positie gedurende de voorgeschreven tijd vast en blijf rustig en gelijkmatig
  ademen.


  Aandachtspunten:

  Laat je heupen niet doorzakken en duw ze niet te hoog omhoog; houd je bekken actief achterover gekanteld.'
