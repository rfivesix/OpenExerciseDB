name: Terminale knie-extensie met weerstandsband (TKE)
description: 'Startpositie:

  Bevestig een weerstandsband op kniehoogte aan een stevige paal. Lus het andere uiteinde achter de knieplooi
  van één been. Ga met je gezicht naar het ankerpunt in een gespreide stand staan, met het werkende been
  voor en de knie licht gebogen.


  Uitvoering:

  1. Duw je hiel in de vloer en strek je knie tegen de weerstand van de band volledig naar achteren.

  2. Span je quadriceps (vooral de VMO) bij volledige strekking 2–3 seconden stevig aan.

  3. Laat je knie gecontroleerd licht naar voren buigen tegen de trekkracht van de band.

  4. Maak de herhalingen af en wissel van been.


  Aandachtspunten:

  Houd je heupen recht en je romp rechtop. Strek je knie niet hard door; concentreer je op een beheerste
  aanspanning van de quadriceps.'
