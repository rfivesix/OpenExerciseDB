name: Walking Lunges
description: 'Uitgangspositie: Zet je voeten op heupbreedte en plaats je handen op je heupen of houd dumbbells
  naast je lichaam.

  Stap: Zet met je rechterbeen een grote stap naar voren.

  Zak: Laat je heupen zakken tot beide knieën ongeveer 90 graden gebogen zijn.

  Overgang: Duw via je voorste hiel af om rechtop te komen en breng je achterste voet naar voren, direct
  in de volgende lunge.'
