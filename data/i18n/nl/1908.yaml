name: Butterfly Superman
description: Ga met je gezicht naar beneden op een mat liggen, benen gestrekt. Verstrengel
  je vingers achter je hoofd en houd je ellebogen wijd. Til tegelijk je hoofd, borst
  en ellebogen op door je rug- en bovenrugspieren aan te spannen. Trek je schouderbladen
  naar elkaar en houd de bovenste positie 1–2 seconden vast; laat gecontroleerd zakken.
  Kijk naar de mat om je nek neutraal te houden.
