name: Intense schouderstretch
description: Sta met je rug naar een vlakke bank of stang op taillehoogte. Zet beide
  handen achter je op de rand met de handpalmen omlaag, of houd een stevig steunpunt
  vast. Laat je heupen voorzichtig zakken of stap iets naar voren zodat je armen achter
  je romp komen. Houd je borst omhoog en schouderbladen samen; houd de rek 30–60 seconden
  vast en adem rustig.
