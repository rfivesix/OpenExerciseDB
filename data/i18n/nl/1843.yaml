name: Vlinderstretch
description: 'Beginpositie: Zit rechtop op de vloer en zet je voetzolen tegen elkaar, met je knieën naar
  buiten.


  Uitvoering: Pak je voeten of enkels vast en trek je hielen voorzichtig naar je lies. Houd je wervelkolom
  lang en laat je knieën rustig richting de vloer zakken.


  Tips: Houd 20–30 seconden vast terwijl je rustig ademt. Veer niet krachtig op en neer.'
