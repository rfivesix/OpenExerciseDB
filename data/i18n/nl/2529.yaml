name: Explosieve push-ups
description: 'Beginpositie: Neem de gebruikelijke push-uphouding aan op de vloer, met je handen iets wijder
  dan schouderbreedte en je lichaam als een rechte plank van hoofd tot hielen.


  Uitvoering: Laat je borst gecontroleerd zakken tot ongeveer 2,5 cm boven de vloer. Duw met maximale
  kracht via je handpalmen en borst omhoog, snel genoeg om je handen helemaal van de vloer te krijgen.
  Land zacht met licht gebogen ellebogen, vang de landing gecontroleerd op en zak meteen weer voor de
  volgende herhaling.


  Aanwijzingen: Houd je romp stevig tijdens de sprong en landing; laat je onderrug bij de landing niet
  doorzakken.'
