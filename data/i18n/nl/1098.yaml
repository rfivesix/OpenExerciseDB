name: Zittende rear-delt raise
description: Ga op de rand van een bank zitten met voeten bij elkaar. Houd lichte dumbbells vast, buig
  vanuit de heupen voorover en laat de borst dicht bij de dijen komen; gewichten hangen onder de benen,
  ellebogen licht gebogen. Hef beide armen in een ruime boog zijwaarts, leidend met de ellebogen, tot
  de bovenarmen ongeveer evenwijdig aan de vloer zijn. Span achterste schouders en schouderbladen aan,
  pauzeer kort zonder momentum en laat gecontroleerd zakken.
