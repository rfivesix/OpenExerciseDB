name: Glute drive-machine
description: 'Startpositie:

  Ga in de glute drive-machine zitten en plaats je bovenrug tegen het draaikussen. Maak de gevoerde band
  stevig vast over je heupen. Zet je voeten op schouderbreedte op het voetplateau, met je tenen iets naar
  buiten.


  Uitvoering:

  1. Ontgrendel de veiligheidsvergrendeling en duw via je hielen je heupen omhoog tegen de band.

  2. Kom omhoog tot je romp en bovenbenen een rechte horizontale lijn vormen; span je bilspieren bovenaan
  1–2 seconden aan.

  3. Laat je heupen langzaam en gecontroleerd zakken voordat je herhaalt.'
