name: Sled push
description: 'Startpositie:

  Laad de slee met het gewenste gewicht. Ga erachter staan en pak de verticale stangen vast met gestrekte
  of licht gebogen armen. Leun met je romp ongeveer 45° naar voren.


  Uitvoering:

  1. Duw krachtig via de bal van je voeten en verplaats de slee met stevige, doorlopende passen.

  2. Houd je core aangespannen en je lichaam in een rechte lijn van hoofd via rug naar het afzettende
  been.

  3. Duw de opgegeven afstand of tijd met een gelijkmatig tempo en hoge intensiteit.


  Aandachtspunten:

  De sled push traint krachtige beenaandrijving en conditie met weinig excentrische spierbelasting.'
