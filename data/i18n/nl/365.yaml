name: Liggende leg curl
description: Ga op de bank liggen en plaats je kuiten achter de beenrol, bij voorkeur ter hoogte van het
  onderste deel van je kuiten. Houd de handgrepen vast zodat je lichaam stevig blijft liggen. Buig je
  benen om het gewicht op te tillen en laat het langzaam zakken. Je lichaam blijft tijdens de oefening
  stil; alleen je benen bewegen.
