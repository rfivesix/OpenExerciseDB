name: Split squat met dumbbells
description: 'Beginpositie:

  Sta met een dumbbell in elke hand naast je lichaam en je armen gestrekt. Zet één voet naar voren in
  een gespreide stand; houd je voeten op heupbreedte voor balans. Houd je voorste voet plat op de vloer
  en je achterste hiel omhoog.


  Beweging:

  Laat je heupen recht omlaag zakken door beide knieën te buigen, totdat je achterste knie bijna de vloer
  raakt en je voorste dij ongeveer parallel aan de vloer is. Duw via de hiel van je voorste voet terug
  naar de rechtopstaande beginpositie zonder je voeten te verplaatsen.


  Opmerkingen:

  Houd je romp rechtop en aangespannen. Voltooi alle herhalingen met één been vóór je van kant wisselt.'
