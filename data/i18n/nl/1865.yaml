name: Enkelmobiliteit met band
description: 'Beginpositie: Veranker een sterke weerstandsband laag achter je. Neem een halfknielende
  positie met je voorste voet in de lus; plaats de band net onder de enkelknobbels over de talus, zodat
  hij naar achteren en omlaag trekt.


  Uitvoering: Duw je voorste knie langzaam voorbij je tenen terwijl je hiel stevig op de vloer blijft.
  Pauzeer 2–3 seconden aan het einde van de dorsiflexie en laat los.


  Tips: De achterwaartse bandspanning mobiliseert de talus en verbetert de enkeldorsiflexie zonder gewrichtsbeknelling.
  Doe 10–15 gecontroleerde herhalingen per been.'
