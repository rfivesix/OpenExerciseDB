name: Kabel-laterale hefbeweging vanaf heuphoogte
description: Ga naast een kabelstation staan met de katrol op heuphoogte. Pak met
  de hand die het verst van de katrol is de tegenoverliggende handgreep, met de handpalm
  naar binnen. Houd je romp aangespannen, borst omhoog en schouders ontspannen; houd
  de elleboog licht gebogen. Hef je arm zijwaarts tot ellebooghoogte, pauzeer kort
  en laat gecontroleerd zakken.
