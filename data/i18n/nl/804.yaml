name: Hangen aan een sloper
description: Coloca ambas manos abiertas y planas sobre las presas romas de un hangboard o tabla de dedos.
  Activa los hombros llevándolos hacia abajo y atrás, y mantén los codos ligeramente flexionados. Levanta
  los pies del suelo y cuélgate de forma estable durante el tiempo indicado, usando el agarre abierto
  y la fuerza de los flexores del antebrazo. Mantén el abdomen activo y el cuerpo sin balanceos.
