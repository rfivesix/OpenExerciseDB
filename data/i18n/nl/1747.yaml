name: Smith-machine squat
description: 'Ga onder de Smith-machine-stang staan, die over je bovenste trapezius rust. Zet je voeten
  op schouderbreedte en iets voor het verticale vlak van de stang. Haal de stang uit het rek door je polsen
  te draaien.


  1. Adem in, span je core aan en buig je heupen en knieën langs het vaste spoor.

  2. Zak gecontroleerd tot je bovenbenen minstens parallel aan de vloer zijn.

  3. Duw vanuit je hele voet en hielen terug naar de beginpositie.

  4. Strek je knieën bovenaan niet volledig op slot.


  Houd je borst omhoog en je wervelkolom neutraal. De bron suggereert je voeten verder naar voren te zetten
  als je de voorwaartse beweging van de knieën wilt verkleinen en bilspieren en quadriceps meer wilt benadrukken.'
