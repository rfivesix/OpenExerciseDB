name: W-raise
description: Deze uitdagende variant van de reverse crunch bestaat uit drie delen; met je benen teken
  je als het ware een omgekeerde W. Ga plat op je rug liggen met je benen gestrekt in de lage positie
  aan de buitenkant van de W. Houd je core aangespannen en je benen recht. Breng je benen omhoog, til
  je heupen op en laat je benen langzaam halverwege zakken. Til je benen weer naar de bovenste positie
  en hef je heupen opnieuw, met je lichaam in één lijn. Gebruik je core om helemaal omlaag te komen naar
  de andere buitenkant van de W. Keer de W om om terug te keren naar de start.
