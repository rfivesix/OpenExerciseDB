name: Duifstretch
description: 'Beginpositie: Begin in plank- of handen-knieënstand. Schuif één knie naar voren achter je
  pols en plaats je scheen schuin over de mat. Strek je andere been naar achteren met de bovenkant van
  je voet op de vloer.


  Uitvoering: Richt je heupen naar de vloer en laat je bekken zakken. Blijf rechtop met je handen op de
  mat of leun op je onderarmen voor een diepere rek in de buitenste bil en heup van je voorste been.


  Tips: Houd je heupen gelijk en kantel niet sterk naar één kant. Houd 30 seconden vast terwijl je diep
  ademt en wissel van kant.'
