name: Chest fly op de machine
description: 'Beginpositie: ga op het chest-flyapparaat zitten met je rug en hoofd stevig tegen de rugleuning.
  Stel de zitting zo in dat de handgrepen of kussens op middenborsthoogte staan. Pak de handgrepen vast
  met je ellebogen licht gebogen en houd die hoek vast. Uitvoering: span je borstspieren aan en breng
  de handgrepen in een vloeiende knuffelboog voor je borst bij elkaar. Knijp samen op het punt van maximale
  aanspanning. Terugkeer: beweeg langzaam terug en laat je borst gecontroleerd op rek komen; laat de gewichtstapel
  tussen herhalingen niet neerkomen. Aanwijzingen: houd je schouders laag en naar achteren; laat ze niet
  naar voren rollen.'
