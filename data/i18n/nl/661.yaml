name: Tricepsstrekking op de machine
description: Ga op de tricepsmachine zitten en stel de zithoogte zo in dat je ellebogen op één lijn staan
  met het draaipunt. Pak de handgrepen stevig vast en plaats je bovenarmen stevig op het kussen. Duw de
  handgrepen omlaag door je ellebogen te strekken en span je triceps volledig aan zonder je gewrichten
  hard op slot te zetten. Breng het gewicht langzaam en gecontroleerd terug; houd je bovenarmen stil tegen
  het kussen.
