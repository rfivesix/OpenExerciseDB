name: TRX-row
description: Pak de handgrepen van de suspension trainer met een neutrale greep vast en leun achterover
  met volledig gestrekte armen. Houd je lichaam recht van hoofd tot hielen door je romp- en bilspieren
  aan te spannen. Trek je borst naar de handgrepen, beweeg je ellebogen naar achteren en knijp je schouderbladen
  samen. Laat jezelf gecontroleerd terugzakken tot je armen volledig gestrekt zijn.
