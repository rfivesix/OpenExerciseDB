name: Hammer Strength decline chest press
description: 'Beginpositie: Ga op een Hammer Strength decline chest press zitten met je schouderbladen
  naar elkaar en omlaag tegen de rugleuning. Stel de zitting zo in dat de handgrepen ter hoogte van je
  onderborst zijn. Zet je voeten stevig neer en pak de handgrepen bovenhands, iets wijder dan schouderbreedte.


  Uitvoering:

  1. Span je core aan en duw de handgrepen naar voren en iets omlaag; houd je ellebogen ongeveer 45° gebogen.

  2. Strek je armen bijna volledig en span de onderste (sternocostale) vezels van je borstspieren krachtig
  aan.

  3. Laat de beweegarmen langzaam en gecontroleerd zakken tot je een comfortabele rek over je borst voelt.


  Aanwijzing: Houd je hoofd, bovenrug en heupen tijdens de hele set stevig tegen de rugleuning.'
