name: Muscle-up
description: 'Hang aan een optrekstang en trek je lichaam explosief in een boog omhoog. Zodra je borst
  boven de stang komt, leun je met je romp naar voren over de stang en draai je tijdens de overgang je
  polsen en onderarmen eroverheen. Duw met je handpalmen en strek je ellebogen tot je boven de stang staat
  met gestrekte armen en de stang ter hoogte van je middel.

  Zak gecontroleerd via de dip- en optrekfasen terug naar een hangpositie. Gevorderde sporters voeren
  de beweging strikt uit zonder kip; wie de techniek opbouwt, gebruikt vaak een gematigde zwaai voor momentum.'
