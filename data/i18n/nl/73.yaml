name: Bankdrukken
description: 'Ga op een bank liggen; de stang hoort recht boven je ogen te zijn. Houd je knieën licht
  gebogen en je voeten stevig op de vloer. Concentreer je, adem diep in en pak de stang wijder dan schouderbreedte
  vast. Laat hem langzaam zakken tot hij je borst ter hoogte van de tepels kort raakt en duw hem weer
  omhoog.

  Als je met veel gewicht traint, is een trainingspartner aan te raden die je kan helpen als je het gewicht
  niet zelf kunt tillen.

  Met de greepbreedte kun je ook bepalen welk deel van de borst meer wordt belast:

  brede greep: buitenste borstspieren;

  smalle greep: binnenste borstspieren en triceps.'
