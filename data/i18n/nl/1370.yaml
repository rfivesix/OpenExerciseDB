name: Deadlift met dumbbells
description: 'Beginpositie:

  Sta met je voeten op heupbreedte en houd een dumbbell in elke hand vóór je dijen of naast je lichaam.
  Houd je schouders naar achteren, je borst omhoog en je knieën licht gebogen.


  Beweging:

  Scharnier vanuit je heupen door je billen naar achteren te bewegen. Laat je romp voorover komen en houd
  je wervelkolom recht en neutraal. Laat de dumbbells dicht langs je schenen zakken totdat je je hamstrings
  sterk voelt rekken. Duw via je hielen en strek je heupen om weer rechtop te staan; span bovenaan je
  bilspieren aan.


  Opmerkingen:

  Rond je onderrug niet. Houd de dumbbells gedurende de hele beweging dicht bij je benen.'
