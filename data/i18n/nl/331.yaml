name: Kettlebell swings
description: 'Houd de kettlebell stevig met beide handen vast. Houd je rug tijdens de hele beweging recht
  en voorkom dat je wervelkolom bol wordt. Houd je knieën licht gebogen, beweeg je heupen naar achteren
  en laat de kettlebell tussen je knieën door zwaaien.

  Buig vanuit je heupen zo ver als je kunt zonder je rug bol te maken. Duw je heupen daarna snel naar
  voren en kom rechtop.

  Door de snelheid zwaaien je armen en de kettlebell naar voren. Probeer de kettlebell niet met je armen
  op te tillen; de heupbeweging brengt hem naar voren. Afhankelijk van het gewicht en de snelheid van
  je heupbeweging zwaaien je armen ongeveer tot schouderhoogte. Beweeg op het hoogste punt je heupen weer
  naar achteren terwijl de kettlebell tussen je benen terugzwaait voor de volgende herhaling.'
