name: Staande knieheffing
description: 'Startpositie:

  Sta rechtop met je voeten op heupbreedte en je armen ontspannen langs je lichaam, of houd je ellebogen
  90 graden gebogen voor je borst. Span je romp aan.


  Uitvoering:

  Breng één knie vloeiend naar je borst tot je bovenbeen minstens parallel aan de vloer is, terwijl je
  stevig op je standbeen balanceert. Zet je voet gecontroleerd neer en hef meteen de andere knie. Wissel
  in een gelijkmatig, ritmisch marcheertempo af.


  Tips:

  Houd je borst rechtop en leun niet achterover wanneer je je knie heft. Zet de beweging in vanuit je
  heupbuigers en onderste buikspieren.'
