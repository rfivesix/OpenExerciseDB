name: Oefening voor armslag en rotatie
description: 'Startpositie:

  Zet je af van de wand en zwem op je zij met één arm voor je uitgestrekt en de andere langs je zij.


  Uitvoering:

  1. Kick rustig en houd je lichaam in een gestapelde zijpositie.

  2. Draai je romp en schouder naar beneden terwijl je je voorste arm naar voren steekt.

  3. Maak een armslag en rol je romp daarna naar de andere zij terwijl je de arm herstelt.

  4. Herhaal de afwisselende rolbeweging en ademhaling in een vloeiend ritme.


  Aandachtspunten:

  Houd je hoofd in lijn met je romp en draai mee vanuit je lichaam in plaats van je hoofd op te tillen.'
