name: Arch hang
description: 'Beginpositie: Hang aan een optrekstang met een bovenhandse greep iets wijder dan schouderbreedte.
  Ga van een passieve naar een actieve hang door je schouderbladen weg van je oren te drukken.


  Uitvoering: Houd je ellebogen volledig gestrekt, trek je schouderbladen krachtig naar elkaar toe en
  strek je borstwervelkolom. Trek je borst omhoog richting het plafond en kantel je romp ongeveer 45 tot
  90 graden ten opzichte van de vloer naar achteren, zodat een lichte boog ontstaat. Span bovenaan je
  lats en onderste trapezius krachtig aan en houd de isometrische positie 2 tot 5 seconden vast. Laat
  jezelf langzaam en gecontroleerd terugzakken naar een actieve hang.


  Aanwijzingen: Buig je ellebogen niet om jezelf omhoog te trekken; de beweging moet volledig vanuit het
  naar elkaar toe trekken van de schouderbladen en het aanspannen van de lats komen.'
