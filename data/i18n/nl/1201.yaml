name: Dragon squat
description: 'Startpositie:

  • Sta rechtop met je voeten op heupbreedte en je handen voor je borst gevouwen voor je evenwicht.

  • Span je romp aan en houd je borst omhoog.


  Uitvoering:

  • Stap met één voet diagonaal achter je andere been langs en buig beide knieën in een diepe gekruiste
  squat.

  • Laat je heupen zakken tot je voorste bovenbeen bijna evenwijdig aan de vloer is; houd je schouders
  en heupen naar voren gericht.

  • Duw via de hiel van je voorste voet terug naar de startpositie en herhaal aan de andere kant.'
