name: Glute-ham raise (GHR)
description: 'Startpositie:

  Neem plaats op een glute-ham developer (GHD). Laat je knieën op de gebogen dijsteun rusten en zet je
  enkels stevig vast tussen de rollen en de voetplaat. Begin rechtop met je romp in lijn met je bovenbenen.


  Uitvoering:

  1. Laat je romp volledig gecontroleerd voor- en omlaag zakken door je knieën te strekken. Houd een rechte
  lijn van je knieën tot je hoofd.

  2. Span je hamstrings en bilspieren actief aan en buig je knieën om je lichaam terug naar de verticale
  startpositie te trekken.

  3. Houd je heupen gestrekt en je wervelkolom neutraal tijdens de hele herhaling.


  Aandachtspunten:

  Buig niet vanuit je heupen. Gebruik zo nodig een lichte afzet van de vloer of een weerstandsband als
  ondersteuning tot je hamstrings sterker zijn.'
