name: Drop curl
description: Drop curls in een aangepaste houding en langzaam tempo trainen de brachialis. Begin met een
  dumbbell in elke hand, beide armen licht naar elkaar gericht op borsthoogte. Laat één dumbbell langzaam
  zakken tot je arm bijna gestrekt is en curl hem terug terwijl de andere dumbbell op de beginhoogte blijft.
  Laat daarna de andere dumbbell zakken. Zo blijft spanning op de brachialis; onder de 90° neemt de biceps
  het werk over.
