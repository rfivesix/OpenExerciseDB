name: Pendlay row
description: 'Rugoefening met een halter, uitgevoerd vanuit een voorovergebogen houding met de romp evenwijdig
  aan de grond. De halter begint bij elke herhaling stil op de vloer.

  Pak de halter op schouderbreedte met een bovenhandse greep vast, span je romp aan en trek de halter
  explosief naar je onderborst of bovenbuik zonder de hoek van je heupen te veranderen. Laat de halter
  volledig op de vloer zakken voordat je aan de volgende herhaling begint.'
