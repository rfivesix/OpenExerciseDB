name: Stretch voor plantairflexie met weerstandsband
description: 'Beginpositie:

  Ga op de vloer zitten met je benen voor je uit. Leg een lichte weerstandsband over de wreef van je voet
  en houd de uiteinden vast om de stretch te sturen.


  Uitvoering:

  1. Strek je tenen voorzichtig naar voren en omlaag (plantairflexie), zodat je de voorkant van je enkel
  en de tibialis anterior licht voelt rekken.

  2. Houd de stretch 20–30 seconden comfortabel vast.

  3. Laat langzaam los en wissel van voet.'
