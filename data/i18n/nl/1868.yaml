name: Lungestretch met rotatie
description: 'Beginpositie: Stap naar voren in een lunge met je voorste voet plat en je achterste knie
  op de mat of net boven de vloer.


  Uitvoering: Houd je romp rechtop en strek je armen naar voren of plaats je handen voor je borst. Draai
  je romp langzaam naar de kant van je voorste been.


  Tips: Houd je voorste knie in lijn met je tenen. Houd de rek enkele seconden vast of maak 5–8 gecontroleerde
  rotaties per kant voordat je van been wisselt.'
