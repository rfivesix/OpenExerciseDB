name: Intense latstretch
description: Sta tegenover een stevige paal of powerrack en pak het steunpunt boven
  je hoofd met één of beide handen vast. Stap naar achteren, beweeg je heupen naar
  achter en laat je borst richting de vloer zakken. Verplaats je gewicht naar achteren
  tot je een rek langs de zijkant van je rug voelt, van oksel tot heup. Houd 30–60
  seconden vast, adem diep en ruk niet.
