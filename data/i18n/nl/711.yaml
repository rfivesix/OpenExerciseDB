name: Handstand tegen de muur
description: Kom met een zwaai of door met je voeten tegen een stevige muur omhoog te lopen in een handstand,
  met je handen op schouderbreedte op de vloer. Houd je armen gestrekt en duw actief de vloer weg met
  je schouders; span je romp en bilspieren aan. Houd je lichaam recht en stevig zonder je onderrug hol
  te trekken, en blijf rustig ademen tijdens de isometrische houding.
