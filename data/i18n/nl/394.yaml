name: Zittende kabelroei met brede greep
description: Ga zitten, plaats je voeten op de steunen en pak de stang breed vast. Trek het gewicht vlot
  naar je navel, niet naar je bovenbuik. Houd je armen en ellebogen dicht bij je lichaam en trek je schouderbladen
  naar elkaar toe. Laat het gewicht langzaam teruggaan tot je armen volledig gestrekt zijn.
