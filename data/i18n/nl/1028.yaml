name: Thoracale rotatie in quadrupedie links
description: Begin op handen en knieën, knieën onder de heupen. Steun met de rechterhand onder de rechterschouder
  en plaats de linkerhand licht achter het hoofd, elleboog naar buiten. Draai bij inademing de borstkas
  omlaag en breng de linkerelleboog richting de steunarm/pols. Draai bij uitademing de borst en bovenrug
  omhoog naar links en richt de elleboog naar het plafond. Houd heupen en bekken stabiel en voer de herhalingen
  gecontroleerd uit.
