name: Superman met handdoek
description: Ga op je buik liggen met je benen gestrekt. Houd een kleine handdoek strak tussen beide handen,
  met je armen op schouderbreedte voor je. Til je borst, armen en benen tegelijk iets van de vloer door
  je onderrug, bilspieren en bovenrug aan te spannen. Houd de handdoek strak, buig je ellebogen en trek
  de handdoek naar je bovenborst alsof je een lat pulldown doet. Strek je armen weer beheerst zonder je
  romp volledig op de vloer te laten zakken.
