name: Thoracale rotatie in halfknielende positie
description: Begin in een halfknielende positie. Stabiliseer het been dat van de muur af staat tegen de
  muur met een bal. Houd beide handen recht voor je. Draai één arm open en probeer de muur achter je te
  bereiken. Adem uit terwijl je draait en adem in wanneer je terugkeert naar de neutrale positie. Herhaal.
