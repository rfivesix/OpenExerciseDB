name: Renegade row
description: Neem een hoge plank- of push-uphouding aan met je handen op een paar zeshoekige dumbbells
  op de vloer. Zet je voeten iets breder dan schouderbreedte voor stabiliteit. Doe een push-up en roei
  daarna één dumbbell omhoog door je elleboog naar je ribben te bewegen; houd je heupen recht. Laat de
  dumbbell gecontroleerd zakken, doe nog een push-up en roei met de andere arm om één herhaling te voltooien.
