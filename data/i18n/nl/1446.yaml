description: 'Sta met je voeten op heupbreedte boven de stang en pak hem iets breder dan schouderbreedte
  vast. Houd je rug neutraal, heupen naar achteren en borst omhoog. Clean: trek de stang van de vloer;
  strek je heupen en knieën explosief zodra de stang je dijen passeert en trek jezelf eronder om hem in
  een diepe front squat op te vangen. Sta op. Jerk: begin in de front rack-positie, buig je knieën recht
  omlaag en stuw de stang explosief omhoog. Zak in een splitstand onder de stang en strek je armen boven
  je hoofd. Herstel door je voeten weer naast elkaar te zetten terwijl je de stang boven je hoofd houdt.'
