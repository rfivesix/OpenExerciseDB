name: Geassisteerde chin-up
description: 'Startpositie:

  Kies het juiste contragewicht op de geassisteerde optrekmachine. Zet je knieën op het kussen en pak
  de stang op schouderbreedte met onderhandse greep vast. Laat jezelf gecontroleerd hangen met gestrekte
  armen.


  Uitvoering:

  1. Trek je lichaam omhoog door je ellebogen omlaag en naar achteren te bewegen, tot je kin boven de
  stang komt.

  2. Span je lats en biceps bovenaan stevig aan.

  3. Laat jezelf langzaam en gecontroleerd zakken tot je armen bijna volledig gestrekt zijn.


  Tips:

  Gebruik de machinehulp om je op een volledige bewegingsuitslag en gecontroleerde uitvoering te richten,
  zonder zwaaien of schoppen.'
