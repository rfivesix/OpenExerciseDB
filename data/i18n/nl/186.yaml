name: Decline dumbbell bench press
description: Neem twee dumbbells en ga op een declinebank zitten. Zet je voeten stevig op de vloer en
  laat je hoofd op de bank rusten. Houd de gewichten naast je borst, ter hoogte van je tepels, en duw
  ze omhoog tot je armen gestrekt zijn. Laat de gewichten langzaam en gecontroleerd zakken.
