name: Split squat (rechts)
description: Zet je rechterbeen met een lange pas naar voren en houd je voeten op heupbreedte voor je
  balans. Houd je romp rechtop en verdeel je gewicht over beide voeten. Buig beide knieën en laat je heupen
  recht omlaag zakken tot je rechterbovenbeen parallel aan de vloer is en je linkerknie net boven de vloer
  hangt. Duw via je rechterhiel en linkervoorvoet omhoog naar de startpositie. Houd je romp verticaal,
  leun niet voorover en laat je voorste knie niet voorbij je tenen bewegen.
