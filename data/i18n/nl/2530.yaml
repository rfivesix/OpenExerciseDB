name: Russische push-ups
description: 'Beginpositie: Neem op een mat de gebruikelijke push-uphouding aan, met je handen iets wijder
  dan schouderbreedte, vingers naar voren en je romp strak in een rechte lijn.


  Uitvoering: Laat je borst naar de vloer zakken zoals bij een gewone push-up. Verplaats onderaan je gewicht
  naar achteren en laat je ellebogen en onderarmen plat op de vloer zakken tot een plank op je ellebogen.
  Beweeg krachtig naar voren terug op je handen en til je ellebogen van de vloer. Duw met je borst en
  triceps recht omhoog tot je armen bovenaan gestrekt zijn.


  Aanwijzingen: Houd je lichaam recht tijdens het naar achteren en voren bewegen; laat je heupen niet
  doorzakken wanneer je op je onderarmen komt.'
