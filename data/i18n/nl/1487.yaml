name: Hyperextensie Y-W-combinatie met halterschijven
description: 'Startpositie:

  Ga op een hyperextensiebank, roman chair of GHD liggen met je heupen tegen het kussen en je voeten vast.
  Houd in elke hand een lichte halterschijf en laat je armen hangen.


  Uitvoering:

  1. Til je romp op tot deze één lijn vormt met je benen; span je bilspieren en rugstrekkers aan.

  2. Breng je armen schuin boven je hoofd in een Y-positie, span je onderste trapezius aan en houd kort
  vast.

  3. Trek je ellebogen omlaag en naar achteren in een W-positie en trek je schouderbladen naar elkaar
  toe.

  4. Laat je armen en romp gecontroleerd zakken.


  Aandachtspunten:

  Gebruik lichte schijven en focus op het intrekken van je schouderbladen en controle van je rug.'
