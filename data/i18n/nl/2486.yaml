name: Herstelbewegingen in diep water
description: 'Startpositie:

  Ga in diep water staan waar je niet kunt staan, eventueel met een drijfmiddel.


  Uitvoering:

  1. Haal boven water adem in.

  2. Zak onder water en adem rustig uit.

  3. Duw jezelf vanaf de bodem omhoog om boven te komen en adem in.

  4. Herhaal de gecontroleerde beweging op en neer.


  Aandachtspunten:

  Houd een rustig ritme aan en blijf ontspannen tijdens het uitademen onder water.'
