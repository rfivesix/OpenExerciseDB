name: Tenen aantikken
description: Ga op je rug liggen met je armen langs je zij en je benen in tafelpositie, met je knieën
  90 graden gebogen. Laat één voet langzaam zakken tot hij de vloer zacht aantikt; span je romp aan en
  houd je onderrug op de grond. Keer terug naar de beginpositie en wissel van been.
