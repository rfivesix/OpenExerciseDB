name: Reverse curl met halterstang
description: Houd de halterstang ongeveer op schouderbreedte vast met een bovenhandse greep (handpalmen
  omlaag). Houd je rug recht, je schouders licht naar achteren en je armen volledig gestrekt. Krul de
  stang gecontroleerd richting je borst en houd je ellebogen dicht bij je lichaam. Beweeg vloeiend, zonder
  te zwaaien of momentum te gebruiken. Pauzeer kort wanneer de stang op borsthoogte is om de biceps en
  onderarmen maximaal aan te spannen. Laat de stang vervolgens langzaam en gecontroleerd terugzakken naar
  de beginpositie en strek je armen volledig.
