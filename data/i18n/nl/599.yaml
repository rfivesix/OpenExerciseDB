name: Snatch
description: Sta met je voeten op heupbreedte en je schenen tegen de stang. Pak de stang met een greep die twee
  keer zo breed is als je schouders. Houd je onderrug recht en duw je hielen in de vloer om de stang op te tillen.
  Zodra de stang boven je knieën is, strek je je heupen explosief en haal je je schouders op. Laat het momentum
  het gewicht boven je hoofd brengen.
