name: Eenarmige lat pulldown in halfknielende houding
description: 'Startpositie:

  Bevestig een D-handgreep aan een hoge kabel. Kniel recht voor of iets schuin naar de machine, met de
  knie aan de werkende kant op de vloer of mat. Pak de greep met je arm boven je uitgestrekt vast. Houd
  je romp rechtop en je core aangespannen.


  Uitvoering:

  1. Trek de greep omlaag door je elleboog naar beneden en iets naar achteren richting je heup te bewegen,
  tot je hand op borsthoogte is.

  2. Span onderaan je lat één seconde aan.

  3. Laat de kabel langzaam en gecontroleerd teruggaan, zodat je lat volledig rekt voor de volgende herhaling.


  Aandachtspunten:

  De halfknielende houding helpt je bekken en romp stabiel te houden.'
