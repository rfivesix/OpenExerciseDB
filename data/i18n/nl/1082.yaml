name: Voorovergebogen roeien met externe rotatie
description: Buig vanuit de heupen voorover met rechte rug en licht gebogen knieën; laat de armen hangen.
  Roei de ellebogen tot schouderhoogte, bovenarmen haaks op de romp en onderarmen gebogen tot 90 graden
  omlaag. Houd de ellebogen daar en draai de schouders naar buiten door de onderarmen en handen tot hoofdhoogte
  te heffen. Pauzeer kort, laat de onderarmen beheerst zakken en strek de armen terug naar beginpositie.
