name: Isometrische bankdruk
description: 'Beginpositie: Ga op een bank liggen met je ogen recht onder de halterstang. Trek je schouderbladen
  naar elkaar toe en omlaag, zet je voeten stevig op de vloer en pak de stang bovenhands iets wijder dan
  schouderbreedte vast. Haal de stang uit het rek en stabiliseer deze met gestrekte armen boven je borst.


  Uitvoering: Laat de stang gecontroleerd zakken tot de doelhoogte (bijvoorbeeld 2,5 tot 5 cm boven je
  borst of bij je sticking point). Je kunt ook tegen onbeweeglijke veiligheidssteunen in een power rack
  duwen. Houd de stang gedurende de voorgeschreven tijd volledig stil en bouw maximale spanning op in
  je borst, voorste deltaspieren en triceps. Duw de stang na afloop terug naar de beginpositie met gestrekte
  armen of leg hem voorzichtig terug in het rek.


  Aanwijzingen: Houd je hele lichaam aangespannen en blijf via je voeten druk geven. Laat de stang tijdens
  een hold met vrije gewichten niet op je ribben rusten en laat hem daar niet op stuiteren.'
