name: Cable crossover vanuit meerdere hoeken
description: 'Startpositie:

  Zet één kabel op de hoogste en de andere op de laagste stand van een dubbele kabelmachine. Ga in het
  midden staan met één voet voor, en pak beide handgrepen vast.


  Uitvoering:

  1. Trek de lage kabel omhoog en schuin voor je romp langs.

  2. Trek tegelijk of na elkaar de hoge kabel omlaag en voor je lichaam langs.

  3. Wissel na de set de hoogte van de kabels om beide kanten van de borst te trainen.


  Aandachtspunten:

  Stem het gewicht af op de trekrichting.'
