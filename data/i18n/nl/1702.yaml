name: Lat pulldown met brede greep
description: De lat pulldown is een trekoefening die vooral de brede rugspieren (lats) traint. Je trekt
  een stang of handgreep aan een kabel omlaag naar je borst terwijl je zit op een speciaal daarvoor ontworpen
  machine. Meestal gebruik je een brede greep; een smalle of onderhandse greep kan andere spieren van
  de rug en armen benadrukken. De oefening wordt veel gebruikt om kracht in het bovenlichaam op te bouwen
  en de houding te verbeteren.
