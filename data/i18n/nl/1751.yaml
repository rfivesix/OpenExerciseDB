name: Cable pull-through
description: 'Bevestig een touw aan de laagste stand van de kabelkatrol. Ga met je rug naar de machine
  staan, laat de kabel tussen je benen lopen en pak de uiteinden met beide handen vast. Zet twee stappen
  naar voren om spanning op de kabel te brengen. Zet je voeten iets breder dan schouderbreedte en houd
  je knieën licht gebogen.


  1. Scharnier vanuit je heupen en duw je billen naar achteren; houd je rug vlak en schouders stabiel.

  2. Laat het touw tussen je benen naar achteren bewegen tot je een diepe rek in je hamstrings voelt.

  3. Duw je heupen krachtig naar voren tot je rechtop staat en span je bilspieren bovenaan aan.


  Dit is een heupscharnier, geen squat. Houd je armen ontspannen en recht; trek het gewicht niet met je
  bovenlichaam.'
