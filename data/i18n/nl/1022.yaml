name: Eenarmige plankroeibeweging (renegade row)
description: Neem een hoge plankpositie aan met dumbbells in beide handen of één hand op de vloer en de
  andere aan een dumbbell. Zet je voeten op schouderbreedte of iets wijder. Span romp, bilspieren en heupen
  aan zodat je bekken niet draait. Trek één dumbbell gecontroleerd naar je heup met je elleboog langs
  je zij, pauzeer kort en laat hem zakken. Doe alle herhalingen aan één kant of wissel af.
