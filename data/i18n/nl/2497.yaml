name: Eenarmige dumbbell floor press
description: 'Startpositie:

  Ga op je rug op de vloer of een mat liggen met gebogen knieën en je voeten plat. Houd één dumbbell met
  gestrekte arm boven je borst. Laat je andere arm op de vloer rusten voor zijwaartse stabiliteit.


  Uitvoering:

  1. Laat de dumbbell langzaam zakken met je elleboog ongeveer 45–60 graden van je romp tot je triceps
  de vloer zacht raken.

  2. Pauzeer kort onderaan zonder het gewicht volledig op de vloer te laten rusten.

  3. Duw de dumbbell door je borst- en tricepsspieren recht omhoog tot je arm gestrekt is.

  4. Maak de herhalingen af en wissel dan van hand.


  Aandachtspunten:

  Span je romp stevig aan om draaien tegen te gaan. De vloer beperkt de schouderstrekking vanzelf.'
