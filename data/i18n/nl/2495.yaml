name: Zittende leg curl op machine
description: 'Startpositie:

  Ga op de zittende leg-curlmachine zitten met je rug tegen de rugleuning. Stel de rugsteun zo af dat
  je knieën op één lijn liggen met het draaipunt van de machine. Plaats de onderste rol tegen de achterkant
  van je onderbenen, net boven je hielen. Zet je benen stevig vast met de dijsteun.


  Uitvoering:

  1. Pak de handgrepen vast voor stabiliteit. Buig je knieën en trek de rol omlaag en naar achteren onder
  de zitting.

  2. Span je hamstrings bij maximale kniebuiging stevig aan en houd 1 seconde vast.

  3. Strek je benen langzaam en volledig gecontroleerd weer omhoog. Weersta de gewichtstapel tot je benen
  bijna recht zijn.


  Aandachtspunten:

  Houd je tenen licht omhooggetrokken of neutraal. Til je heupen tijdens de beweging niet van de zitting.'
