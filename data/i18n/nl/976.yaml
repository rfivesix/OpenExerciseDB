name: V-up-crunch met medicijnbal
description: Ga op je rug liggen met je benen gestrekt en houd een medicijnbal met beide handen boven
  je hoofd. Til je benen en romp tegelijk van de vloer en breng de bal richting je schenen of voeten,
  zodat je lichaam een V vormt. Span bovenaan je buikspieren aan. Laat romp en benen beheerst zakken zonder
  je onderrug hol te trekken. Beweeg vloeiend en gooi de bal niet.
