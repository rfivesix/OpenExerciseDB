name: Split squat (links)
description: Zet je linkerbeen met een lange pas naar voren en houd je voeten op heupbreedte voor je balans.
  Houd je romp rechtop en verdeel je gewicht over beide voeten. Buig beide knieën en laat je heupen recht
  omlaag zakken tot je linkerbovenbeen parallel aan de vloer is en je rechterknie net boven de vloer hangt.
  Duw via je linkerhiel en rechtervoorvoet omhoog naar de startpositie. Houd je romp verticaal, leun niet
  voorover en laat je voorste knie niet voorbij je tenen bewegen.
