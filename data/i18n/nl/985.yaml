name: Opdrukken met rotatie
description: Neem de hoge plankpositie aan met je handen iets breder dan je schouders en je lichaam in
  een rechte lijn. Laat je borst naar de vloer zakken in een push-up. Duw jezelf omhoog, draai je romp
  en strek één arm naar het plafond zodat je lichaam een T vormt. Zet je hand gecontroleerd terug, doe
  nog een push-up en draai naar de andere kant. Houd je romp aangespannen en laat je onderrug niet doorzakken.
