name: Buikstabilisatie
description: 'Beginpositie:

  Ga in de lengte op een foamroller liggen die onder je wervelkolom ligt, zodat je hoofd, rug en stuitje
  worden ondersteund. Buig je knieën en zet je voeten op heupbreedte plat op de vloer.


  Uitvoering:

  1. Span je diepe rompspieren (de transversus abdominis) aan door je onderrug voorzichtig naar de roller
  te drukken.

  2. Bewaar je evenwicht en stabiliteit door je romp aan te spannen. Laat je vingertoppen licht op de
  vloer rusten of kruis je armen over je borst om de oefening moeilijker te maken.

  3. Houd de positie de voorgeschreven tijd vast en adem langzaam en diep.


  Opmerkingen:

  Laat je onderrug niet van de roller afkomen. Houd je bekken neutraal en stabiel.'
