name: Lat pulldown met neutrale greep
description: Ga bij een lat pulldown zitten (of kniel voor een hoge kabelkatrol) en zet de dijen vast
  onder de steunkussens. Pak een parallelhandvat neutraal, handpalmen naar elkaar. Zit rechtop met borst
  omhoog en natuurlijke holling in de onderrug. Trek het handvat soepel naar de bovenborst, leid met de
  ellebogen omlaag en naar achteren. Knijp de schouderbladen samen, pauzeer onderaan en laat gecontroleerd
  omhoog tot de armen gestrekt zijn.
