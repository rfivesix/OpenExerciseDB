name: Isometrische preacher curl met dumbbell
description: 'Beginpositie: Ga op een preacherbank zitten en stel de zitting zo af dat de bovenkant van
  het schuine kussen goed onder je oksels past. Laat de achterkant van je bovenarm volledig op het kussen
  rusten en houd een dumbbell met onderhandse (gesupineerde) greep vast.


  Uitvoering: Buig je elleboog om de dumbbell tot halverwege omhoog te curlen (ongeveer 90 graden elleboogflexie),
  waar de hefboomwerking de grootste spanning geeft. Houd deze positie gedurende de voorgeschreven tijd
  volledig stil tegen de zwaartekracht in en span je biceps en brachialis maximaal aan. Laat de dumbbell
  daarna langzaam en gecontroleerd zakken.


  Aanwijzingen: Houd je arm en borst tegen het kussen zonder achterover te leunen of je schouder te verplaatsen.
  Houd je pols stevig en blijf rustig ademen.'
