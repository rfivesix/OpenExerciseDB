name: Schuine bench press in de Smith-machine
description: 'Startpositie: Zet een schuine bank van 30–45 graden in de Smith-machine. Ga zitten met je rug stevig
  tegen de leuning en je voeten plat op de vloer. Pak de stang iets breder dan schouderbreedte vast en maak de veiligheidshaken
  los.

  Uitvoering: Laat de stang soepel zakken tot deze je bovenborst licht raakt.

  Terugkeer: Duw de stang omhoog met je bovenborstspieren tot je armen gestrekt zijn, zonder je ellebogen te vergrendelen.'
