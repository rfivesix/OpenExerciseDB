name: Split squat in de Smith-machine
description: De split squat in de Smith-machine is een krachtoefening op de Smith-machine die geschikt
  is om benen en bilspieren te trainen. Zet één voet naar voren en de andere naar achteren en laat je
  lichaam zakken tot je voorste bovenbeen evenwijdig aan de vloer is, terwijl de stang verticaal langs
  de machine beweegt. De oefening helpt de stabiliteit te verbeteren en spieronevenwichtigheden te corrigeren.
  De machine vermindert de belasting van de rug en biedt een stabiele omgeving voor krachttraining.
