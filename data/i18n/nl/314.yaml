name: Isometric wipers
description: 'Kom in de push-uphouding met je handen iets breder dan schouderbreedte.

  Verplaats je lichaamsgewicht zo ver mogelijk naar één kant en buig de elleboog aan die kant.

  Keer de beweging om en verplaats je gewicht helemaal naar de andere kant.

  Keer terug naar de beginpositie en herhaal het gewenste aantal herhalingen.'
