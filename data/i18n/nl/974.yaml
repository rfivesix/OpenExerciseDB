name: Kettlebellcurl met twee handen
description: Sta rechtop met de voeten op schouderbreedte en houd de hoorns van de kettlebell met beide
  handen voor je dijen vast, armen gestrekt. Houd je ellebogen naast je lichaam en buig ze om de kettlebell
  tot borsthoogte te brengen. Laat het gewicht langzaam en soepel zakken. Gebruik geen zwaai vanuit je
  romp of heupen.
