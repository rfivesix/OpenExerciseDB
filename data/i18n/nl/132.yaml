name: Burpees
description: 'Beginpositie:

  Sta rechtop met je voeten op schouderbreedte en je armen langs je lichaam.


  Uitvoering:

  1. Duw je heupen naar achteren in een squat en plaats je handen voor je voeten op de vloer.

  2. Spring met beide voeten tegelijk naar achteren in een hoge plank.

  3. Laat je lichaam zakken en voer een volledige push-up uit, waarbij je borst de vloer raakt.

  4. Duw jezelf omhoog en spring met je voeten naar je handen om terug te keren naar de diepe squat.

  5. Spring explosief recht omhoog en strek je armen boven je hoofd. Land zacht op de bal van je voeten
  en begin meteen aan de volgende herhaling.


  Opmerkingen:

  Span je romp aan tijdens de plank en push-up zodat je heupen niet doorzakken.'
