name: Tricepsstretch boven het hoofd (rechts)
description: 'Startpositie:

  • Sta of zit rechtop met je wervelkolom in een neutrale houding.

  • Breng je rechterarm boven je hoofd, buig je elleboog en laat je rechterhand achter je nek of tussen
  je schouderbladen zakken.


  Uitvoering:

  • Pak je rechterelleboog met je linkerhand vast en trek hem voorzichtig naar achteren en iets omlaag.

  • Houd 20 tot 30 seconden een lichte, comfortabele rek in je rechtertriceps vast.

  • Adem diep en span je romp licht aan om te voorkomen dat je je onderrug overdreven hol trekt.'
