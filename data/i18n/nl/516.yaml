name: Woodchop voorwaarts
description: 'Startpositie: Sta rechtop met je voeten op heupbreedte. Strek je armen recht boven je hoofd (je kunt
  eventueel een handdoek of lichte bal met lichte spanning vasthouden).

  Uitvoering: Strek je wervelkolom en schouders omhoog en iets naar achteren terwijl je tegelijk één been naar achteren
  tilt; span daarbij je rugstrekkers en grote bilspier aan.

  Terugkeer: Zet je been gecontroleerd terug op de vloer en wissel bij elke herhaling van been.

  Aandachtspunten: Richt je op strekking van de wervelkolom en balans. Houd je romp stabiel en voorkom dat je onderrug
  overdreven hol trekt.'
