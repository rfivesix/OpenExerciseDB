name: Polskrul met halterstang
description: 'Startpositie:

  Pak een halterstang op schouderbreedte vast in onderhandse greep (handpalmen omhoog).


  Positie op de bank:

  Kniel voor een vlakke bank en laat de achterkant van je onderarmen erop rusten. Je polsen en handen
  steken iets over de rand zodat je de volledige bewegingsuitslag kunt maken.


  Excentrische fase (zakken):

  Laat de stang gecontroleerd zakken door je polsen naar de vloer te strekken. Spreid onderaan je vingers
  iets zodat de stang een stukje kan afrollen en de rek groter wordt.


  Concentrische fase (heffen):

  Sluit eerst je vingers om de stang weer stevig vast te pakken. Buig daarna je polsen explosief maar
  gecontroleerd omhoog en breng de stang zo hoog mogelijk. Span je onderarmen bovenaan 1 seconde stevig
  aan.


  Vorm:

  Houd je onderarmen gedurende de oefening stevig tegen de bank; alleen je polsen en vingers bewegen.'
