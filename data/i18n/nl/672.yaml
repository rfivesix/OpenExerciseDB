name: Romprotatie met kabel
description: Ga rechtop staan of zitten met je zij naar een kabelkatrol op borsthoogte en houd het handvat
  met beide handen vast. Houd je armen licht gebogen en draai je romp soepel over je lichaam, waarbij
  je je schuine buikspieren aanspant. Houd je heupen en bekken naar voren gericht en stabiel. Keer langzaam
  en gecontroleerd terug naar de beginpositie.
