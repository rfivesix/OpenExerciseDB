name: Snap-down
description: 'Beginpositie:

  Sta rechtop met je voeten op schouderbreedte. Strek je armen recht boven je hoofd en kom op je tenen,
  zodat je lichaam zo lang mogelijk is.


  Uitvoering:

  1. Breng je armen explosief omlaag en laat je heupen snel zakken terwijl je knieën buigt tot een stabiele
  atletische houding.

  2. Land zacht op je hele voet. Vang de kracht op met je borst omhoog, je heupen naar achteren en je
  romp aangespannen.

  3. Houd de stabiele landingspositie kort vast voordat je opnieuw begint.


  Aandachtspunt:

  De oefening ontwikkelt snelle afremming, landingstechniek en excentrische controle ter voorbereiding
  op explosieve sprongen en richtingsveranderingen.'
