name: Lat pulldown met brede onderhandse greep
description: Ga bij de lat pulldown zitten en stel de dijsteun zo in dat de dijen vastzitten. Pak de stang
  breed onderhands, ongeveer op of breder dan schouderbreedte, en houd de borst omhoog met de romp licht
  achterover. Trek de stang soepel langs de kin naar de bovenborst en beweeg de ellebogen omlaag en iets
  naar achteren. Houd de romp stabiel. Laat de stang beheerst terugkeren tot de armen gestrekt zijn en
  de brede rugspieren rekken.
