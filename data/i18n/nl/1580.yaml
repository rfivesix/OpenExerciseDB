name: Eenzijdige landmine-row dwars op het lichaam
description: 'Beginpositie:

  Plaats een halter in een landminebevestiging, zodat de stang loodrecht (90 graden) op je lichaam staat.
  Ga naast het uiteinde staan in een gespreide of atletische houding. Buig vanuit je heupen met een rechte
  rug voorover en pak met één hand het uiteinde of de kraag vast.


  Uitvoering:

  Span je romp aan en trek de halter naar de zijkant van je borst of onderste ribben. Beweeg je elleboog
  naar achteren en omhoog en houd je romp recht naar voren gericht en stil. Span bovenaan je brede rugspieren
  en middenrug aan. Laat de halter gecontroleerd zakken tot je arm gestrekt is.


  Aandachtspunten:

  Houd je wervelkolom neutraal en weersta het draaien van je romp. Trek vanuit je elleboog in plaats van
  je hand om de brede en bovenste rugspieren optimaal aan te spreken.'
