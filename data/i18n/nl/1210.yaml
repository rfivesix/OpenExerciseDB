name: Skydiver met armen in T-positie
description: 'Startpositie:

  • Ga op je buik op een mat liggen met je benen wijder dan schouderbreedte.

  • Strek je armen op schouderhoogte zijwaarts uit zodat ze met je bovenlichaam een T vormen.


  Uitvoering:

  • Til je borst, armen en benen tegelijk van de vloer door je achterste spierketen aan te spannen.

  • Draai je duimen naar het plafond en trek je schouderbladen stevig naar elkaar toe.

  • Houd je romp, armen en dijen in de lucht en beweeg je benen herhaaldelijk naar elkaar toe en weer
  uit elkaar.

  • Laat jezelf na de herhalingen gecontroleerd zakken.'
