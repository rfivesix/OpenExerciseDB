name: Armelevaties (T/Y/I)
description: 'Sta rechtop met je voeten op heupbreedte, je romp aangespannen en je armen ontspannen langs
  je zij. Voer vanuit deze positie drie armheffingen uit om de schouders en bovenrug te trainen:


  T-heffing: Hef je armen recht zijwaarts tot ze evenwijdig aan de vloer zijn en een T vormen.

  Y-heffing: Hef je armen in een hoek van ongeveer 45 graden ten opzichte van je lichaam om een Y te vormen.

  I-heffing: Hef je armen recht boven je hoofd en houd ze dicht bij elkaar om een I te vormen.


  Houd je wervelkolom neutraal, trek je onderrug niet hol en beweeg langzaam en gecontroleerd. Knijp je
  schouderbladen naar elkaar en houd je schouders laag.'
