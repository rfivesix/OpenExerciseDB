name: Bicepscurl op de machine
description: Met de bicepscurlmachine train je de biceps door een gecontroleerde bewegingsuitslag. Ga
  zitten met je rug tegen de steun en stel de zitting zo af dat je armen op één lijn staan met de handgrepen
  of kussens. Pak de grepen vast, houd je ellebogen op hun plaats en buig je armen om de grepen omhoog
  te brengen. Laat ze beheerst zakken naar de beginpositie.
