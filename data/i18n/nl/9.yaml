name: Kettlebellzwaai met twee armen
description: 'Beginpositie:

  Sta met je voeten iets wijder dan schouderbreedte en plaats de kettlebell op de vloer, ongeveer dertig
  centimeter voor je. Beweeg je heupen naar achteren met een rechte rug en pak het handvat stevig met
  beide handen vast.


  Uitvoering:

  1. Zwaai de kettlebell tussen je benen naar achteren, zoals bij een football-snap.

  2. Stoot je heupen explosief naar voren en span je bilspieren en hamstrings aan om de kettlebell tot
  borst- of ooghoogte te zwaaien.

  3. Begeleid de kettlebell omlaag, vang het gewicht op met je heupen en herhaal in een vloeiend ritme.


  Opmerkingen:

  Dit is een explosieve heupscharnierbeweging, geen squat. Til het gewicht niet met je armen of schouders.'
