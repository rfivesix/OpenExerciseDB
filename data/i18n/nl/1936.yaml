name: Eenarmige kabel rear-delt fly
description: Sta zijwaarts bij een kabeltoren met de katrol op schouderhoogte. Reik
  met de buitenste hand voor je borst langs en pak de kabel of handgreep. Houd je
  elleboog licht gebogen en romp aangespannen. Trek de kabel in een brede horizontale
  boog over je lichaam tot je arm zijwaarts gestrekt is; span je achterste schouder
  aan en keer gecontroleerd terug zonder je romp te draaien.
