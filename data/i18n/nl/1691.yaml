name: Cable fly voor de onderborst
description: 'Uitvoering


  Beginpositie: Strek je armen zijwaarts in een Y-vorm en voel de rek in je borst. Houd je ellebogen licht
  gebogen.


  Beweging: Breng je handen in een vloeiende boog omlaag en bij elkaar voor je onderborst of bovenbuik.
  Span onderaan je borst 1–2 seconden stevig aan.


  Terugkeer: Breng je armen langzaam langs hetzelfde pad omhoog tot je een goede rek voelt. Houd de beweging
  onder controle en laat de gewichten je niet te snel terugtrekken.'
