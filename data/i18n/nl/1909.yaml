name: Beencirkels in ruglig
description: Ga op je rug liggen en til je benen recht omhoog, met je knieën bij elkaar. Maak met beide
  knieën kleine cirkels in één richting. Houd de bewegingsuitslag klein, span je buikspieren aan en houd
  je rug tegen de vloer.
