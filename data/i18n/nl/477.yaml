name: Geassisteerde pull-up op een machine
description: 'Stel het contragewicht van de geassisteerde pull-upmachine in op de gewenste ondersteuning.
  Plaats je knieën of voeten op het platform en pak de handgrepen boven je met een bovenhandse greep die
  iets breder is dan schouderbreedte.

  Trek jezelf omhoog tot je kin boven de stang komt en beweeg je ellebogen omlaag en naar achteren. Laat
  jezelf langzaam en gecontroleerd zakken tot je armen volledig gestrekt zijn en herhaal.'
