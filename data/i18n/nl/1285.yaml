name: Butt kicks
description: 'Beginpositie:

  Sta rechtop met je voeten op heupbreedte en span je romp licht aan.


  Uitvoering:

  1. Begin ter plaatse te joggen of beweeg in een gelijkmatig tempo vooruit.

  2. Buig bij elke pas je knie zodat je hiel richting je bil komt.

  3. Houd je bovenbenen grotendeels omlaag gericht en beweeg je armen op natuurlijke wijze mee.


  Tips:

  Een dynamische warming-up om de hamstrings en kuiten te activeren vóór intensieve training van het onderlichaam.'
