name: Box squat
description: Zet de box achter je, ongeveer 90 cm van een squat rack als je een halter gebruikt. Kies
  een hoogte waarop je met rechte rug kunt zakken en je bilspieren de box zacht kunt aantikken. Sta met
  je voeten op schouderbreedte, tenen iets naar buiten, span je romp aan en houd je rug neutraal. Zet
  de halter zo nodig op schouderhoogte. Beweeg je heupen naar achteren alsof je op een stoel gaat zitten
  en zak gecontroleerd tot je de box licht raakt; laat je niet vallen. Pauzeer kort en duw via je hielen
  terug naar de startpositie. De brontekst noemt verbeteringen in coördinatie, balans en uithoudingsvermogen,
  versteviging van been- en bilspieren en een toename van botdichtheid die osteoporose zou voorkomen.
