name: Zittende kabelrow met V-greep
description: Ga bij een lage kabelroeimachine zitten met voeten stevig op de steunen
  en knieën licht gebogen. Pak de V-greep neutraal vast, zit rechtop met rechte rug
  en borst omhoog. Trek de greep naar je onderbuik met je ellebogen dicht langs je
  zij en trek je schouderbladen samen. Strek je armen gecontroleerd naar voren. Beweeg
  je romp niet heen en weer.
