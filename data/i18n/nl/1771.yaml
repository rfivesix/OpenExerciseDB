name: Kabel polscurl
description: Strek je arm omlaag en til je onderarm daarna iets op. Draai je onderarm zodat je handpalm
  omhoog wijst. Stel de kabelhoogte zo in dat je het handvat met een onderhandse greep vasthoudt. Buig
  je pols en handpalm omhoog. Pauzeer eventueel bovenaan en keer langzaam terug naar de beginpositie.
