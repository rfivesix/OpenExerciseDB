name: Kindhouding
description: |-
  Beginpositie:
  Begin op handen en voeten, knieën, tenen en handen raken de grond. Je twee grote tenen moeten elkaar raken.
  Stappen:

  Beweeg je knieën zo dat ze op heupbreedte uit elkaar staan.
  Op een uitademing, beweeg je bekken naar achteren om op je hielen te zitten. Je handen moeten nog steeds de grond raken.


  Ontspan uw bovenlichaam, laat uw voorhoofd naar de grond zakken en laat uw handen op een natuurlijke manier naar voren bewegen.


  Blijf in deze houding.

  Tips:

  Om de houding te verlaten, loop je armen terug onder je schouders en beweeg je bovenlichaam omhoog in een zittende positie.
