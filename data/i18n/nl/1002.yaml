name: Kindhouding
description: Kniel op een mat met je knieën wijd, je grote tenen tegen elkaar en je billen op je hielen.
  Buig vanuit je heupen naar voren en laat je romp tussen je bovenbenen rusten. Strek je armen voor je
  uit op de mat met de handpalmen omlaag en laat je voorhoofd rustig naar de vloer zakken. Adem diep naar
  je rug en ribben en ontspan je wervelkolom, heupen en schouders bij elke uitademing.
