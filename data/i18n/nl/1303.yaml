name: Helms row
description: 'Plaats je borst op het uiteinde van een bank en gebruik een handdoek of iets zachts ter
  bescherming. Laat je borst ongeveer ter hoogte van je tepels contact maken met de bank. Je rug moet
  bijna parallel aan de vloer zijn.


  Richt je bij de start van de oefening op het naar achteren trekken van je ellebogen totdat je maximale
  spanning in je lats voelt. Wil je ook je trapezius activeren, laat dan je schouderbladen ontspannen
  wanneer de gewichten omlaag hangen en trek ze in wanneer je met de herhaling begint.'
