name: Zijwaartse stretch
description: 'Beginpositie: Sta met je voeten op heup- tot schouderbreedte en span je core licht aan.


  Uitvoering: Breng één arm boven je hoofd en buig je romp langzaam naar de andere kant, terwijl je andere
  hand langs je dij omlaag glijdt. Voel de rek langs je ribben, schuine buikspieren en latissimus dorsi.


  Tips: Houd je heupen recht en draai je romp niet naar voren of achteren. Houd 20–30 seconden vast en
  wissel van kant.'
