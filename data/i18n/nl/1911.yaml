name: Cat plank
description: Begin op handen en tenen, met je handen onder je schouders. Til je knieën
  enkele centimeters van de vloer. Duw de vloer actief weg en rond je boven- en middenrug;
  kantel je bekken licht en trek je navel naar je wervelkolom. Houd de positie vast
  en adem rustig. Laat je knieën laag zweven zonder de mat te raken.
