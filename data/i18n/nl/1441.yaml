name: Overhead press met halters op een schuine bank
description: Ga tegen een schuin bankje zitten dat op ongeveer 60–75 graden staat, met je rug tegen de
  leuning. Houd in elke hand een halter op schouderhoogte, met je handpalmen naar voren of iets naar binnen.
  Duw de halters in een vloeiende, beheerste boog omhoog tot je armen gestrekt zijn, zonder ze hard op
  slot te zetten. Laat ze beheerst zakken tot je bovenarmen parallel aan de vloer zijn en je rek voelt
  in je voorste schouderspieren.
