name: Laterale en front raise met halters
description: 'Sta met je voeten op schouderbreedte en houd de halters naast je met licht gebogen ellebogen.
  Til je armen zijwaarts tot schouderhoogte. Houd ze op die hoogte en beweeg ze horizontaal naar voren
  tot de halters voor je borst samenkomen. Laat ze langzaam recht voor je dijen zakken. Wissel de volgorde
  bij volgende herhalingen af: eerst naar voren heffen, dan naar buiten bewegen en zakken.'
