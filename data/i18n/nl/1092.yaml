name: Bokstraining met bokszak
description: 'Sta op ongeveer armlengte van de bokszak in een gebalanceerde bokshouding: voorste hand
  iets naar voren, achterste hand bij de kin, knieën licht gebogen en gewicht op de voorvoeten. Stoot
  scherp en krachtig, bijvoorbeeld jabs, crosses, hooks en uppercuts, naar het midden van de zak. Draai
  heupen en romp en pivot met de voeten. Breng de handen na elke stoot terug naar de dekking en beweeg
  actief rond de zak. Werk in getimede rondes.'
