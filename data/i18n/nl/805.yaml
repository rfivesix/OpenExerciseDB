name: Triceps pushdown met kabeltouw
description: De triceps pushdown met kabeltouw is een populaire oefening voor de triceps. De oefening
  is eenvoudig te leren en uit te voeren en is daardoor geliefd bij zowel beginners als gevorderde sporters.
  Meestal doe je matig tot veel herhalingen, bijvoorbeeld 8–12 of meer per set, als onderdeel van een
  training voor het bovenlichaam of de armen.
