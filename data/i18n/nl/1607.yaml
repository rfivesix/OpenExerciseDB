name: Typewriter pull-up
description: Hang bovenhands aan een optrekstang, iets breder dan schouderbreedte. Trek jezelf op tot
  je kin boven de stang is. Verplaats je lichaam bovenaan naar één kant door de ene arm te strekken en
  de andere gebogen te houden. Beweeg soepel van de ene kant naar de andere, als een typemachine, en laat
  jezelf daarna zakken. De oefening verlengt de tijd onder spanning, versterkt brede rugspieren, biceps
  en schouders en ontwikkelt eenzijdige trekkracht.
