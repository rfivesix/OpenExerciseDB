name: Bird dog
description: 'Startpositie:

  Begin op handen en knieën in tafelpositie op een mat. Plaats je polsen recht onder je schouders en je
  knieën recht onder je heupen. Houd je wervelkolom neutraal.


  Uitvoering:

  1. Strek langzaam je rechterarm recht naar voren en je linkerbeen recht naar achteren tot beide parallel
  aan de vloer zijn.

  2. Richt je duim omhoog en duw je achterste hiel naar achteren zonder je heupen te draaien of je onderrug
  hol te trekken.

  3. Pauzeer 1–2 seconden in de gestrekte positie en houd je romp stabiel tegen rotatie.

  4. Breng hand en knie langzaam terug naar tafelpositie.

  5. Herhaal met de linkerarm en het rechterbeen en wissel vloeiend af.


  Aandachtspunten:

  Stel je voor dat er een glas water op je onderrug staat. Houd je bekken horizontaal en draai je romp
  niet.'
