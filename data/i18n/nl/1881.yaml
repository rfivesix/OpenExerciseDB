name: Polsextensie met dumbbells
description: Begin zittend op een bank en houd twee dumbbells met de handpalmen naar beneden vast. Laat
  je onderarmen op je dijen rusten, met je polsen voorbij je knieën. Laat de dumbbells zakken door je
  polsen naar beneden te buigen en strek je polsen daarna omhoog zo ver als comfortabel is. Houd je onderarmen
  stil.
