name: Devil’s press
description: 'Beginpositie:

  Leg twee dumbbells op schouderbreedte op de vloer en ga erachter staan.


  Uitvoering:

  1. Zak naar de dumbbells, pak de handgrepen vast, spring met je voeten naar achteren in een plank en
  laat je borst tussen de gewichten naar de vloer zakken (een burpee met dumbbells).

  2. Spring je voeten explosief naar voren, net buiten de dumbbells, in een brede heupscharnierhouding.

  3. Zwaai de dumbbells in één vloeiende heupscharnierbeweging iets tussen je benen naar achteren en breng
  ze vervolgens met een snatch rechtstreeks boven je hoofd tot je armen gestrekt zijn.

  4. Laat de dumbbells gecontroleerd naar de vloer zakken en begin meteen aan de volgende herhaling.


  Aandachtspunt:

  Deze veeleisende conditieoefening combineert een burpee met een snatch van twee dumbbells. Houd je rug
  recht tijdens de heupstoot.'
