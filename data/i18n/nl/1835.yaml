name: Zittende externe rotatie met dumbbell
description: 'Beginpositie: Ga op een mat of vlakke bank zitten met één knie omhoog en voet plat. Plaats
  je werkelleboog, 90° gebogen, op die knie. Houd een lichte dumbbell vast met je onderarm horizontaal
  naar voren.


  Uitvoering:

  1. Houd je schouderblad naar achteren en omlaag, weg van je oor.

  2. Draai je onderarm in een verticale boog omhoog tot die loodrecht op de vloer staat.

  3. Pauzeer een seconde bovenaan en voel je externe rotatoren (infraspinatus en teres minor) aanspannen.

  4. Laat de dumbbell gecontroleerd zakken tot de horizontale positie en voel onderaan een lichte rek.


  Aanwijzing: Gebruik een lichte dumbbell om compenserende bewegingen te voorkomen en houd je elleboog
  stevig op je knie.'
