name: Nordic curl
description: Kniel op een gevoerde ondergrond en zet je enkels stevig vast onder een stilstaande halterstang
  of laat een trainingspartner ze vasthouden. Houd je romp rechtop en span je bilspieren en buik aan,
  zodat je lichaam van knieën tot hoofd één stevige lijn vormt. Laat je romp zo langzaam en gecontroleerd
  mogelijk naar de vloer zakken en rem de zwaartekracht uitsluitend met je hamstrings. Vang jezelf onderaan
  licht op met je handen en duw voorzichtig af om je hamstrings te helpen terugkeren naar de rechte knielpositie.
