name: Heupabductie in zijlig
description: 'Startpositie:

  • Ga op je zij op een fitnessmat liggen.

  • Buig je onderste been licht voor stabiliteit en houd je bovenste been gestrekt in het verlengde van
  je romp.

  • Laat je hoofd op je onderste arm rusten en zet je bovenste hand voor je op de vloer voor evenwicht.


  Uitvoering:

  • Til je bovenste been soepel omhoog; richt je tenen naar voren of iets omlaag.

  • Houd je heupen boven elkaar en voorkom dat je bekken naar achteren rolt.

  • Span bovenaan kort je gluteus medius aan en laat je been langzaam en gecontroleerd zakken.'
