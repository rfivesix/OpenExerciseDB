name: Eenarmige triceps pushdown aan kabel
description: 'De eenarmige pushdown aan de kabel is een unilaterale isolatieoefening voor de triceps.
  Door één arm tegelijk te trainen, kun je krachtverschillen tussen beide kanten aanpakken; de romp helpt
  bij de stabiliteit.


  Startpositie:

  Sta met je voeten op schouderbreedte naar het kabelstation gericht. Bevestig één handgreep aan de hoge
  katrol. Pak die met één hand in bovenhandse (geproneerde) greep vast. Buig je elleboog ongeveer 90 graden
  en houd hem dicht bij je lichaam. Span je romp aan en houd je rug recht.


  Uitvoering:

  Duw de handgreep gecontroleerd omlaag door je elleboog te strekken tot je arm volledig gestrekt is.
  Houd de aanspanning onderaan 1 seconde vast en keer langzaam terug naar de startpositie.'
