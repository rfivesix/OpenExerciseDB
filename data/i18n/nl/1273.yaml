name: Dumbbell-pullover
description: 'Startpositie:

  Ga plat of dwars over een bank liggen, waarbij alleen je bovenrug wordt ondersteund als je dwars ligt;
  zet je voeten plat op de vloer. Pak met beide handen een dumbbell vast met een diamantgreep onder de
  binnenste halterschijf en houd deze recht boven je borst, met je ellebogen licht gebogen.


  Uitvoering:

  1. Houd je ellebogen licht gebogen en stil. Laat de dumbbell langzaam in een boog achter je hoofd zakken
  tot je een diepe rek in je lats en borst voelt.

  2. Trek de dumbbell via dezelfde boog terug boven je borst en span je borst- en latspieren aan.

  3. Pauzeer kort bovenaan en herhaal.


  Tips:

  Maak er geen tricepsstrekking van door je ellebogen verder te buigen. Houd je heupen stabiel en voorkom
  dat je onderrug overdreven hol trekt.'
