name: Omgekeerde woodchop met band
description: Bevestig een lusvormige weerstandsband aan een rek onder kniehoogte. Pak het andere uiteinde
  met beide handen vast alsof je een honkbalknuppel vasthoudt en kijk naar de band. Begin met je handen
  naast je heup en je knieën gebogen. Draai je heupen terwijl je je handen boven de tegenoverliggende
  schouder beweegt, alsof je slaat.
