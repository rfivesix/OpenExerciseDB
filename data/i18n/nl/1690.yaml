name: Cable fly voor de bovenborst
description: 'Uitvoering


  Beginpositie: Houd je armen omlaag en iets achter je lichaam, met licht gebogen ellebogen. Voel een
  lichte rek over je borst.


  Beweging: Breng je handen in een gecontroleerde beweging omhoog en bij elkaar voor je bovenborst, ongeveer
  ter hoogte van je kin tot sleutelbeen. Vermijd rukken. Span bovenaan je borst 1–2 seconden aan.


  Terugkeer: Laat je armen langzaam omlaag en opzij bewegen, met controle en spanning.'
