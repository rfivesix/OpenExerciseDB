name: Laterale kabelheffing achter de rug
description: 'Ga zijwaarts naast een lage kabelkatrol staan. Pak met je buitenste hand het D-handvat vast,
  waarbij de kabel achter je heupen en rug loopt. Houd met je binnenste hand de kabeltoren vast en leun
  iets voorover voor balans.


  1. Hef je arm met een licht gebogen elleboog zijwaarts tot je bovenarm parallel aan de vloer is.

  2. Span bovenaan je laterale deltaspier aan.

  3. Laat het handvat langzaam achter je lichaam zakken en houd spanning op je zijschouder.


  Volgens de bron voorkomt de kabelroute achter de rug wrijving met je heupen.'
