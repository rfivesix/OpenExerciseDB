name: Liggende dumbbell row en zittende shrug
description: 'Beginpositie: ga met je borst omlaag op een licht schuine bank (30–45 graden) liggen en
  houd een paar dumbbells met neutrale greep, hangend naar de vloer. Uitvoering: 1. Liggende row: trek
  de dumbbells omhoog door je ellebogen voorbij je romp naar achteren te bewegen en span bovenaan je lats
  en middenrug aan. Laat gecontroleerd zakken en voltooi het voorgeschreven aantal herhalingen. 2. Zittende
  shrug: ga meteen rechtop zitten en voer dumbbell shrugs uit door je schouders recht omhoog naar je oren
  te trekken; richt je op de bovenste en middelste trapezius. Terugkeer: laat de dumbbells na elke herhaling
  soepel en gecontroleerd zakken.'
