name: Kneeling Superman (bird dog)
description: Begin op handen en knieën op een mat, met je handen onder je schouders
  en knieën onder je heupen. Houd je rug neutraal en span je romp aan. Strek tegelijk
  één arm naar voren en het andere been naar achteren tot beide in lijn met je romp
  zijn. Houd 2–3 seconden vast, keer langzaam terug en wissel van kant. Laat je heupen
  niet draaien en houd je nek neutraal.
