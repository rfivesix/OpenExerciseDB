name: Clamshell
description: 'Beginpositie: Ga op je zij liggen met je heupen ongeveer 45° en knieën 90° gebogen. Stapel
  je benen met je hielen tegen elkaar. Ondersteun je hoofd met je onderste arm en plaats je bovenste hand
  op de vloer of je heup voor stabiliteit.


  Uitvoering:

  1. Houd je voeten en hielen tegen elkaar en til je bovenste knie langzaam naar het plafond, als een
  openende schelp.

  2. Til zo ver als comfortabel is zonder je heupen of bekken naar achteren te draaien.

  3. Span je buitenste heup en gluteus medius 1–2 seconden aan op het hoogste punt.

  4. Laat je knie langzaam en gecontroleerd zakken en herhaal.


  Aanwijzing: Houd je bekken gestapeld en loodrecht op de vloer; rol niet naar achteren. De clamshell
  in zijplank kan als gevorderde variant worden gebruikt.'
