name: Schuin bankdrukken met halterstang
description: 'Ga op een schuine bank liggen die op 30–45 graden staat. Plaats je ogen onder de halter,
  trek je schouderbladen naar achteren en omlaag tegen de bank en zet je voeten plat neer. Pak de halter
  bovenhands iets breder dan schouderbreedte vast, haal hem uit het rek en stabiliseer hem met gestrekte
  armen boven je bovenborst.


  1. Adem in, span je core aan en laat de halter gecontroleerd naar je bovenborst zakken, net onder je
  sleutelbeenderen. Houd je ellebogen ongeveer 45–70 graden ten opzichte van je romp.

  2. Raak je borst licht aan zonder het gewicht te laten stuiteren.

  3. Duw de halter krachtig in een lichte boog omhoog tot je armen gestrekt zijn.


  Volgens de bron benadrukt een hoek van 30–45 graden het bovenste, claviculaire deel van de borst en
  beperkt dit overmatige belasting van de voorste deltaspier.'
