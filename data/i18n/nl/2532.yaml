name: Planche lean hold
description: 'Beginpositie: Neem een hoge plank met gestrekte armen aan, met je handen ongeveer op schouderbreedte
  en je vingers iets naar buiten gedraaid om de belasting van je polsen te verminderen.


  Uitvoering: Duw stevig tegen de vloer om je schouderbladen naar voren te spreiden (je bovenrug rond
  te maken) en kantel je bekken naar achteren tot een hollow-bodypositie. Houd je ellebogen volledig gestrekt
  en leun je schouders langzaam zo ver mogelijk voorbij je polsen. Steun op je tenen en handen en houd
  deze voorwaartse isometrische positie de voorgeschreven tijd vast. Breng je schouders terug naar neutraal
  om te rusten.


  Aanwijzingen: Laat je ellebogen niet buigen en hol je onderrug niet; hoe verder je naar voren leunt,
  hoe groter de belasting op je schouders.'
