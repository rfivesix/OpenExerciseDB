name: Recruitment pulls op hangboard
description: 'Startpositie:

  • Ga onder een klimhangbord staan en kies een specifieke rand.

  • Pak de rand met één hand vast en houd je voeten op de vloer of op een klein opstapje.

  • Houd je elleboog open in een hoek van ongeveer 120 tot 150 graden; hang niet met een volledig gestrekte
  elleboog.


  Uitvoering:

  • Trek 3 tot 5 seconden met maximale isometrische inspanning omhoog om de vingers, onderarmbuigers en
  rug maximaal te activeren.

  • Houd je schouder tijdens de trekbeweging geactiveerd en stabiel.

  • Rust voldoende tussen pogingen en herhaal met de andere arm.'
