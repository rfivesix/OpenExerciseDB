name: Kuitheffen op één been
description: Plaats de bal van één voet op een trede of stevig verhoogd platform en houd je andere voet
  van de vloer. Houd een muur of leuning licht vast voor je evenwicht. Laat je hiel zo ver zakken als
  comfortabel is om je kuit te strekken. Duw krachtig via de bal van je voet en hef je hiel zo hoog mogelijk.
  Pauzeer kort, laat langzaam en gecontroleerd zakken en wissel van been.
