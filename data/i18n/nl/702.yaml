name: Eenbenig kuitheffen
description: '- Ga met de bal van één voet op de rand van een verhoging of traptrede
  staan en houd de andere voet van de grond.

  - Houd je voor balans licht vast aan een muur of leuning.

  - Laat je hiel gecontroleerd zo ver mogelijk zakken voor een volledige rek in de
  kuitspier.

  - Duw krachtig omhoog vanuit de bal van je voet tot maximale contractie op je tenen.

  - Houd even vast bovenaan, zak langzaam terug en wissel na de set van been.'
