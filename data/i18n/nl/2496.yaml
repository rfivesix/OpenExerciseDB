name: Push-ups tegen de muur
description: 'Startpositie:

  Sta op armlengte afstand voor een vlakke muur. Plaats je handpalmen op borsthoogte iets wijder dan schouderbreedte
  tegen de muur. Stap met je voeten naar achteren zodat je lichaam een rechte diagonale lijn vormt.


  Uitvoering:

  1. Buig je ellebogen ongeveer 45 graden en laat je borst gecontroleerd naar de muur zakken tot je neus
  of borst die bijna raakt.

  2. Duw stevig met je handpalmen en beweeg je lichaam terug naar de startpositie.

  3. Houd je romp aangespannen en je wervelkolom neutraal.


  Aandachtspunten:

  Laat je onderrug niet doorzakken en spreid je ellebogen niet overdreven. Dit is een geschikte lichtere
  variant voor beginners om duwkracht op te bouwen.'
