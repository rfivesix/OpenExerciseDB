name: Ring dips
description: 'Beginpositie: Steun op de ringen met je armen volledig gestrekt. Span je romp aan, houd
  je lichaam stabiel en draai de ringen licht naar buiten (steunpositie).

  Uitvoering: Laat je lichaam gecontroleerd zakken door je ellebogen te buigen tot je schouders iets lager
  zijn dan je ellebogen (ongeveer 90 graden), met de ringen dicht bij je zij.

  Terug: Duw krachtig terug naar de beginpositie tot je armen weer gestrekt zijn.

  Aandachtspunt: Stabiliseer de ringen actief tijdens de hele beweging, zodat ze niet naar buiten afdrijven.'
