name: Arm- en beenstrekking in quadruped (bird dog)
description: 'Beginpositie: kom op handen en knieën met je handen recht onder je schouders en je knieën
  recht onder je heupen. Houd je hoofd en wervelkolom neutraal. Uitvoering: strek tegelijk je rechterarm
  naar voren en je linkerbeen naar achteren tot beide evenwijdig aan de vloer zijn en span je bilspieren
  en onderrug aan. Terugkeer: houd de volledige strekking 1–2 seconden vast en laat je hand en knie langzaam
  zakken. Wissel per herhaling van kant. Aanwijzingen: houd je romp aangespannen en je heupen recht naar
  de vloer; laat je bekken niet draaien en hol je onderrug niet te ver.'
