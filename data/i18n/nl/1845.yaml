name: Zittende pancake good morning
description: 'Beginpositie: Zit rechtop op de vloer in een brede straddle (pancake), met gestrekte knieën
  en tenen omhoog. Plaats je handen losjes achter je hoofd.


  Uitvoering: Houd je rug vlak en borst open; scharnier vanuit je heupen naar voren tot je een sterke
  rek voelt aan de binnenkant van je dijen en in je hamstrings.


  Tips: Span je bilspieren en hamstrings aan om soepel rechtop terug te komen. Bol je bovenrug niet.'
