name: Crunch op een decline-bank
description: Ga op je rug op een decline-bank liggen met je voeten aan één uiteinde vastgezet. Laat een
  trainingspartner je voeten vasthouden of gebruik een andere steun (bijvoorbeeld een halterstang); plaats
  je handen achter je hoofd. Til vanuit deze positie je bovenlichaam op tot je hoofd of ellebogen je knieën
  raken. Rol je rug tijdens de beweging omhoog.
