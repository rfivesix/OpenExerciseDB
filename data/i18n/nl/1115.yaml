name: 3D-lungewarming-up
description: Sta rechtop met voeten op heupbreedte; gebruik lichte dumbbells of alleen lichaamsgewicht.
  Stap voorwaarts en zak tot beide knieën ongeveer 90 graden gebogen zijn, duw terug naar het midden.
  Stap daarna zijwaarts in een side lunge, buig de stappende knie en houd het andere been gestrekt; keer
  terug. Stap diagonaal achterwaarts, open de heupen ongeveer 45 graden, zak in de lunge en keer terug.
  Herhaal de reeks in alle richtingen met beide benen.
