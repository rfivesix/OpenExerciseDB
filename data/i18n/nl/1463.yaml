name: Dead-stop dumbbell row met onderhandse grip
description: Sta met je voeten op schouderbreedte en houd de halters met een onderhandse grip vast. Buig
  vanuit je heupen voorover tot je romp bijna parallel aan de vloer is en houd je rug vlak. Roei de halters
  naar je ribben en heupen met je ellebogen dicht bij je zij. Span bovenaan je brede rugspieren en bovenrug
  aan. Laat de halters zakken tot ze de vloer licht raken en volledig stilstaan voordat je de volgende
  herhaling begint.
