name: Clean met halterstang
description: 'Sta met je voeten op heupbreedte boven de stang en je schenen dicht erbij. Buig voorover
  en pak de stang net buiten je knieën met een hookgrip; houd je rug vlak, borst omhoog en schouders iets
  voor de stang. Eerste trek: duw met je benen tegen de vloer en beweeg de stang soepel voorbij je knieën,
  met dezelfde romphoek. Tweede trek: strek heupen, knieën en enkels explosief en haal je schouders op
  om de stang dicht langs je lichaam omhoog te brengen. Trek jezelf er snel onder, draai je ellebogen
  naar voren en omhoog en vang de stang op je voorste schouders in een front squat. Sta vervolgens op.
  Houd de stang dicht bij je lichaam; een snelle elleboogdraai helpt om hem stabiel op te vangen.'
