name: Kreis press met halters
description: Ga op een schuine bank zitten die ongeveer 45 graden staat. Houd twee halters boven je hoofd
  met gestrekte armen. Laat de halters via een cirkelboog naar buiten en omlaag zakken tot schouderhoogte.
  Keer de boog om en duw ze in een vloeiende cirkel terug boven je hoofd. Houd spanning op je voorste
  en middelste schouderspieren en gebruik geen momentum.
