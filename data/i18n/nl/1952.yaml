name: SMR van de bilspieren met een lacrossebal
description: Ga zitten en plaats een stevige massage- of lacrossebal onder één bil;
  steun met je handen achter je. Voor meer druk kun je de enkel van die kant over
  de andere knie leggen. Verplaats je gewicht en rol met kleine beheerste bewegingen
  over de bilspieren en piriformis. Pauzeer 20–30 seconden op gevoelige plekken terwijl
  je rustig ademt; besteed 30 seconden tot 2 minuten per kant. Vermijd het stuitje.
