name: Kuitheffen met halterstang
description: 'Beginpositie:

  Leg een halterstang op je bovenste trapeziusspieren zoals bij een back squat. Sta rechtop met je voeten
  op heupbreedte. Je kunt de bal van je voeten op een kuitblok of gewichtsschijf plaatsen voor een grotere
  rek.


  Beweging:

  Duw via de bal van je voeten en til je hielen zo hoog mogelijk op om je kuiten maximaal aan te spannen.
  Pauzeer kort bovenaan en laat je hielen daarna langzaam en gecontroleerd zakken totdat je een lichte
  rek in je kuiten voelt.


  Opmerkingen:

  Houd je knieën licht gebogen maar stil. Veer onderaan niet en gebruik geen momentum vanuit je heupen.'
