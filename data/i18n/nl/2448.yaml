name: Omgekeerde clamshell
description: 'Startpositie:

  Ga op je zij op een mat liggen met je heupen en knieën ongeveer 90 graden gebogen en je benen op elkaar.
  Ondersteun je hoofd comfortabel met je onderste arm.


  Uitvoering:

  1. Houd je knieën tegen elkaar en til je bovenste voet en enkel omhoog richting het plafond door je
  heup naar binnen te draaien.

  2. Pauzeer bovenaan 1 seconde en voel de aanspanning rond je heuprotatoren en bilspieren.

  3. Laat je voet langzaam en gecontroleerd terugzakken.

  4. Maak de herhalingen af en wissel van kant.


  Aandachtspunten:

  Houd je bekken stabiel en loodrecht op de vloer; laat je heupen niet naar voren of achteren rollen.'
