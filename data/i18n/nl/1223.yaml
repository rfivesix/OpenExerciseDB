name: Bovenhandse klappen
description: 'Startpositie:

  • Sta rechtop met je voeten op schouderbreedte en je armen ontspannen langs je lichaam.

  • Houd je borst omhoog en je schouders ontspannen.


  Uitvoering:

  • Hef je gestrekte armen in een brede boog zijwaarts tot je handen boven je hoofd tegen elkaar klappen.

  • Laat je armen via dezelfde zijwaartse baan soepel zakken naar de startpositie.

  • Herhaal in een vloeiend ritme als dynamische warming-up om de deltaspieren te activeren en de schoudergordel
  te mobiliseren.'
