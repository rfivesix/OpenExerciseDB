name: Glijdende zijwaartse lunge
description: Sta met je voeten op heupbreedte en houd een kettlebell dicht bij je borst in gobletpositie.
  Zet één voet op een slider, glijschijf of handdoek. Houd je borst omhoog en je romp aangespannen. Schuif
  die voet langzaam zijwaarts terwijl je de andere knie buigt en je heupen laat zakken in een zijwaartse
  lunge. Houd de knie van het gebogen been in lijn met je tenen en laat die niet naar binnen vallen. Het
  andere been blijft gestrekt en glijdt over de vloer. Duw via de hiel van het gebogen been terug naar
  de beginpositie en houd de kettlebell onder controle.
