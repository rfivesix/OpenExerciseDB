name: Schorpioentrap
description: 'Startpositie:

  • Begin in een hoge plank met je handen recht onder je schouders en je voeten op heupbreedte.

  • Houd je lichaam recht van hoofd tot hielen en span je romp aan.


  Uitvoering:

  • Breng je rechterknie iets naar je borst en til je gebogen rechterbeen omhoog en naar achteren.

  • Draai je heupen en zwaai je rechtervoet over je linkerbeen naar de vloer aan de andere kant.

  • Houd je schouders zo veel mogelijk naar de vloer gericht terwijl je je wervelkolom dynamisch draait
  en je heupen strekt.

  • Keer soepel terug naar de hoge plank en herhaal met je linkerbeen.'
