name: Quadricepsstretch
description: 'Beginpositie: Sta op één been en houd zo nodig licht een muur of stevig voorwerp vast voor
  je evenwicht.


  Uitvoering: Buig je andere knie achter je, pak de bovenkant van je voet of enkel vast en trek je hiel
  rustig naar je bil. Houd je knieën dicht bij elkaar en op één lijn.


  Tips: Span je bilspier aan en kantel je bekken licht in om de quadricepsstretch te vergroten en holtrekken
  van je onderrug te voorkomen. Houd 20–30 seconden vast en wissel van been.'
