name: Tricepsstrekking boven het hoofd met dumbbell
description: 'Beginpositie:

  Ga rechtop op een bank zitten of sta met je voeten op schouderbreedte. Houd een dumbbell met beide handen
  boven je hoofd en strek je armen.


  Uitvoering:

  1. Houd je bovenarmen stil en je ellebogen naar voren, dicht bij je hoofd. Laat de dumbbell langzaam
  achter je hoofd zakken door je ellebogen te buigen.

  2. Laat zakken totdat je triceps volledig op rek zijn.

  3. Duw de dumbbell door je ellebogen te strekken weer boven je hoofd en span bovenaan je triceps aan.


  Tips:

  Houd je ellebogen gedurende de hele beweging op hun plek en hol je onderrug niet overdreven.'
