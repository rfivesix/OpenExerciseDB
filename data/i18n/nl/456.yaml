name: Pistol squat
description: 'Sta met je voeten op heupbreedte, je tenen naar voren en je borst omhoog.

  Strek één been recht voor je uit en strek beide armen op schouderhoogte. Span je romp aan en kijk recht
  vooruit.

  Zak langzaam in een squat.

  (Optioneel) Pauzeer onderaan.

  Houd je vrije been en armen gedurende de hele beweging gestrekt.'
