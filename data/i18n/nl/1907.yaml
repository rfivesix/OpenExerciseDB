name: Unilaterale lunge (split squat)
description: Sta in een gespreide houding met je voorste voet plat en je achterste
  voet op de bal van je voet; houd je romp rechtop en je handen op je heupen. Buig
  beide knieën en laat je achterste knie tot vlak boven de vloer zakken, ongeveer
  tot beide knieën 90 graden gebogen zijn. Duw via de hiel van je voorste voet terug
  omhoog. Doe alle herhalingen aan één kant en wissel dan. Houd je romp aangespannen
  en laat je voorste knie in lijn met je tenen bewegen.
