name: Straddle L-sit
description: 'Beginpositie: Zit op de vloer met je benen gestrekt en gespreid. Plaats je handen op de
  vloer tussen je dijen.


  Uitvoering: Duw stevig met je handpalmen, strek je ellebogen en til je heupen en gestrekte benen van
  de vloer, met je benen horizontaal.


  Tips: Houd de voorgeschreven tijd isometrische spanning in je core, heupbuigers en triceps.'
