name: Triceps kickback met dumbbells
description: 'Begin met een dumbbell in elke hand en je handpalmen naar je romp gericht. Houd je rug recht, buig
  je knieën licht en buig vanuit je heupen naar voren. Je romp staat bijna evenwijdig aan de vloer. Houd je hoofd
  omhoog. Houd je bovenarmen dicht bij je romp en evenwijdig aan de vloer. Je onderarmen wijzen omlaag terwijl je
  de gewichten vasthoudt; de hoek tussen je boven- en onderarm is 90 graden. Dit is de startpositie.

  Houd je bovenarmen stil, adem uit en gebruik je triceps om de gewichten op te tillen tot je armen gestrekt zijn.
  Richt je op de beweging van je onderarmen.

  Pauzeer kort bovenaan en adem in terwijl je de dumbbells langzaam laat zakken naar de startpositie.

  Herhaal het voorgeschreven aantal herhalingen.


  Variaties: Je kunt deze oefening ook arm voor arm uitvoeren, vergelijkbaar met een eenarmige row. Voor die variant
  kun je ook een handgreep aan een lage kabel gebruiken in plaats van een dumbbell, voor een sterkere piekcontractie.
  Houd in dat geval je handpalmen omhoog (gesupineerde greep) in plaats van naar je romp (neutrale greep).'
