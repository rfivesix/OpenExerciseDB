name: Nekstretch voorzijde
description: 'Beginpositie:

  Zit of sta met een rechte rug en ontspannen schouders.


  Uitvoering:

  1. Doe je mond wijd open.

  2. Kantel je hoofd langzaam naar achteren met geopende mond tot je een lichte stretch voelt aan de voorkant
  van je hals.

  3. Sluit en open je mond heel langzaam een aantal keren om de stretch in de halsspieren te verdiepen.

  4. Breng je hoofd rustig terug naar de beginpositie en sluit je mond.'
