name: Vingertop-push-up
description: 'Startpositie:

  • Begin in plankhouding met je handen recht onder je schouders.

  • Spreid je vingers en zet alleen je vingertoppen en duimen stevig op de grond; houd je handpalmen ervan
  af.

  • Houd je lichaam recht van hoofd tot hielen en span je romp aan.


  Uitvoering:

  • Buig je ellebogen langzaam en laat je borst gecontroleerd naar de vloer zakken.

  • Houd je vingertoppen stevig aangespannen en voorkom dat je vingergewrichten inzakken.

  • Duw via je vingertoppen en duimen om je armen te strekken en terug te keren naar de startpositie.'
