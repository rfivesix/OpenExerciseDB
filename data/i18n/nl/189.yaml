name: Deficit deadlift
description: 'Voorbereiding: Ga op een halterschijf, bumperplaat of laag platform staan, met de geladen
  halterstang boven je voeten. Zak door je knieën en pak de stang ongeveer op schouderbreedte of iets
  breder vast, met een bovenhandse of gemengde greep.

  Uitvoering: Til de stang door je heupen en knieën te strekken tot je rechtop staat. Trek je schouders
  bovenaan naar achteren als ze bol stonden. Breng de gewichten terug naar de vloer door je heupen naar
  achteren te bewegen en je knieën te buigen. Houd je rug recht en je knieën in de richting van je voeten.
  Herhaal.

  Opmerkingen: Houd tijdens het tillen je heupen laag, schouders hoog en armen en rug recht. Je knieën
  wijzen steeds in dezelfde richting als je voeten. Houd de stang dicht bij je lichaam. Gripkracht en
  gripuithoudingsvermogen kunnen het aantal herhalingen met zware gewichten beperken. Magnesium, straps,
  griptraining of een gemengde greep kunnen helpen. Bij een gemengde greep houdt één hand de stang bovenhands
  en de andere onderhands vast. Een halterlift kan het laden en lossen van schijven vergemakkelijken.
  De deadlift vanaf een verhoging met halterstang traint kracht in het laagste deel van de deadlift. De
  doelspier werkt isometrisch. Zware deadlifts met halterstang belasten de brede rugspier aanzienlijk.
  Zie ook «deadlift met halterstang vanaf verhoging» onder «Gluteus Maximus» en de analyse van de deadlift.'
