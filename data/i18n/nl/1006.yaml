name: Kin intrekken
description: Zit of sta rechtop met je schouders laag en naar achteren, en kijk recht vooruit op ooghoogte.
  Trek je kin horizontaal naar achteren zonder je hoofd omlaag te kantelen, alsof je een lichte onderkin
  maakt; breng je oren boven je schouders. Houd deze positie 3–5 seconden vast en voel een lichte rek
  aan de basis van je schedel. Ontspan daarna terug naar neutraal. Buig je nek niet naar je borst; de
  beweging is alleen horizontaal.
