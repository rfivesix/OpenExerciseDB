name: Dumbbell pullover dwars over de bank
description: Pak een dumbbell met een gemiddeld gewicht vast met je handpalmen tegen de onderkant van
  de bovenste schijven en je duimen om de stang. Ga dwars over een vlakke bank liggen, zodat alleen je
  bovenrug en schouders op de bank steunen. Zet je voeten ongeveer op schouderbreedte en laat je hoofd
  iets naar beneden hangen. Houd de dumbbell met gestrekte armen recht boven je borst, buig je armen ongeveer
  15 graden en houd die buiging gedurende de beweging aan. Laat de dumbbell langzaam in een halve cirkel
  naar achteren en omlaag zakken, zo ver als comfortabel is. Breng hem langzaam langs dezelfde boog terug
  omhoog en herhaal het gewenste aantal keer.
