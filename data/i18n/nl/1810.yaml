name: Sfinxhouding
description: 'Beginpositie: Ga op je buik op een mat liggen, met je benen op heupbreedte en de bovenkanten
  van je voeten op de vloer. Plaats je onderarmen parallel op de mat, met je ellebogen recht onder je
  schouders en je handpalmen omlaag.


  Uitvoering:

  1. Duw je onderarmen en handpalmen zacht in de vloer en til je borst en hoofd op in een lichte achteroverbuiging.

  2. Trek je schouderbladen naar elkaar en omlaag, verbreed je sleutelbeenderen en kijk ontspannen naar
  voren.

  3. Veranker je schaambeen licht in de mat en span je bilspieren een beetje aan; houd je onderrug lang
  en ontspannen.

  4. Houd de positie enkele langzame, diepe ademhalingen vast en laat jezelf langzaam zakken.


  Aanwijzing: Richt de beweging op de borstwervelkolom en borst, zonder in je onderrug te hangen.'
