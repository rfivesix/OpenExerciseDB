name: Y-W-T-heffingen in buiklig
description: Lig op de buik op een mat, benen gestrekt en nek neutraal. Voor de Y strek je de armen schuin
  boven het hoofd, duimen omhoog; til armen en borst iets op, trek de schouderbladen samen en houd 10–20
  seconden vast. Trek voor de W de ellebogen naar de ribben terwijl de armen geheven blijven en span de
  middenrug aan. Strek voor de T de armen zijwaarts, duimen omhoog, en trek de schouderbladen samen. Wissel
  vloeiend tussen de posities.
