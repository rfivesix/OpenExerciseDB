name: Eenarmige overhead tricepsstrekking aan de kabel
search_terms:
- "Nekextensie"
description: 'Startpositie:

  Ga met je rug naar een hoge kabelkatrol staan. Pak met één hand boven je hoofd een enkel handvat of
  een touw vast. Buig je elleboog en houd die naar voren naast je hoofd.


  Uitvoering:

  1. Houd je bovenarm stil en strek je elleboog zodat je de kabel naar voren en iets omlaag duwt, tot
  je arm gestrekt is.

  2. Span je triceps stevig aan aan het einde van de beweging.

  3. Buig je elleboog langzaam en gecontroleerd om terug te keren naar de gestrekte beginpositie.


  Tips:

  Span je romp aan en houd je wervelkolom neutraal. De kabelhoek boven het hoofd rekt de lange kop van
  de triceps.'
