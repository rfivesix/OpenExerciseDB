name: Schouderdrukken in de Smith-machine
description: 'De oefening is in principe hetzelfde als met een losse halterstang:

  Ga op een bank zitten waarvan de rugleuning bijna verticaal staat. Pak de stang op schouderbreedte vast en breng
  hem naar borsthoogte. Duw het gewicht omhoog, maar strek je armen niet volledig. Laat de stang langzaam zakken
  en herhaal.'
