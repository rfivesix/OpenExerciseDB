name: Cat-cow stretch
description: Begin op handen en knieën, handen onder de schouders en knieën onder
  de heupen, met een neutrale rug. Adem in en kantel je bekken naar voren, laat je
  buik zakken en breng borst en blik omhoog (cow). Adem uit, kantel je bekken naar
  binnen, trek je navel naar je rug en rond je rug omhoog (cat), terwijl je hoofd
  ontspant. Wissel 8–12 ademcycli af en forceer de beweging niet.
