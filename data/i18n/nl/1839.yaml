name: Zelfstandig uitgevoerde heupbuigerstretch
description: 'Beginpositie: Kniel in een halfknielende lunge met één knie op de vloer, je voorste been
  90° gebogen en de voet plat. Houd je romp rechtop.


  Uitvoering: Kantel je bekken licht, span de bilspier van je achterste been aan en beweeg je heupen rustig
  naar voren tot je een diepe rek voelt aan de voorkant van je achterste heup (heupbuigers/psoas).


  Tips: Houd 20–30 seconden vast terwijl je rustig ademt en wissel dan van kant. Hol je onderrug niet.'
