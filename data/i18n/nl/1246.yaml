name: TRX-rollout
description: 'Startpositie:

  Kniel of sta met je rug naar het ankerpunt en houd de TRX-handgrepen met gestrekte armen voor je op
  borsthoogte.


  Uitvoering:

  1. Span je romp aan en houd je lichaam recht terwijl je naar voren leunt en je armen boven je hoofd
  strekt.

  2. Laat jezelf gecontroleerd voorwaarts zakken tot het punt waarop je spanning kunt houden zonder dat
  je onderrug inzakt.

  3. Span je buikspieren en lats aan en trek je armen omlaag om terug te keren naar de startpositie.


  Tips:

  Houd je bilspieren en buikspieren aangespannen om je onderrug te beschermen en overstrekking te voorkomen.'
