name: Overhead press
description: Haal de halter op schouderhoogte uit het rek met een bovenhandse greep iets breder dan schouderbreedte
  en laat hem op je voorste schouders rusten. Span je romp en bilspieren aan, kantel je hoofd iets naar
  achteren en druk de stang recht omhoog. Beweeg je hoofd iets naar voren zodra de stang je voorhoofd
  passeert en strek je armen boven je hoofd, boven je middenvoet. Laat de stang gecontroleerd terugzakken
  naar je bovenborst en schouders.
