name: Zittende corkscrew
description: 'Begin voor deze oefening voor buik- en schuine buikspieren met je handen achter je lichaam
  op de vloer. Trek je knieën naar je toe en beweeg ze naar één kant, waarbij je je schuine buikspieren
  aanspant. Strek je benen terug naar de start en herhaal aan de andere kant. Beginners halen soms de
  eerste 45 seconden van deze uitdagende variant van de reverse crunch niet. Dat is niet erg: het geeft
  een startpunt om op voort te bouwen.'
