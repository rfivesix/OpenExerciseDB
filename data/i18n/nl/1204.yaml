name: Cardiosessie op de hometrainer
description: 'Startpositie:

  • Stel het zadel van de hometrainer in op heuphoogte, zodat je knie onderaan de pedaalslag licht gebogen
  is.

  • Stel het stuur zo in dat je rechtop of licht voorover kunt zitten zonder je nek te belasten.


  Uitvoering:

  • Trap soepel en houd doorgaans een cadans van 70 tot 90 omwentelingen per minuut aan.

  • Stel de weerstand in op de beoogde aerobe hartslagzone voor de geplande duur.

  • Houd je bovenlichaam ontspannen en stabiel op het zadel en laat je heupen niet heen en weer schommelen.'
