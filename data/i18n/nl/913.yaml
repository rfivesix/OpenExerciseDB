name: Reverse preacher curl met smalle greep
description: Ga op een preacherbank zitten en leg je bovenarmen plat op het schuine kussen. Pak een EZ-stang
  met een smalle bovenhandse greep en je knokkels omhoog. Buig je ellebogen om de stang omhoog te curlen,
  houd je bovenarmen stevig op het kussen en richt je op de brachioradialis en brachialis. Laat de stang
  langzaam en gecontroleerd zakken tot je armen bijna gestrekt zijn; overstrek je ellebogen onderaan niet.
