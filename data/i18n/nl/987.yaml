name: Laterale uitvalspas (rechts)
description: Sta met je voeten wijder dan schouderbreedte en je tenen naar voren of iets naar buiten.
  Verplaats je gewicht naar rechts, buig je rechterknie en beweeg je heupen naar achteren. Houd je linkerbeen
  gestrekt en je linkervoet plat op de vloer. Zak tot je rechterbovenbeen bijna parallel aan de vloer
  is en duw via je rechterhiel terug naar de brede stand. Houd je borst omhoog en je rechterknie in lijn
  met je voet.
