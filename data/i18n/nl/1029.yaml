name: Thoracale rotatie in quadrupedie rechts
description: Begin op handen en knieën, knieën onder de heupen. Steun met de linkerhand onder de linkerschouder
  en plaats de rechterhand licht achter het hoofd, elleboog naar buiten. Draai bij inademing de borstkas
  omlaag en breng de rechterelleboog richting de steunarm/pols. Draai bij uitademing de borst en bovenrug
  omhoog naar rechts en richt de elleboog naar het plafond. Houd heupen en bekken stabiel en voer de herhalingen
  gecontroleerd uit.
