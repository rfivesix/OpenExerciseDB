name: Zijplank
description: 'Startpositie: Ga op je zij liggen met gestrekte benen en je onderarm recht onder je schouder, loodrecht
  op je lichaam.

  Uitvoering: Span je schuine buikspieren aan en til je heupen van de vloer tot je lichaam een rechte lijn vormt
  van je hoofd tot je enkels.

  Terugkeer / vasthouden: Houd deze stevige positie gedurende de voorgeschreven tijd vast en houd je heupen hoog
  zonder ze te laten doorzakken.'
