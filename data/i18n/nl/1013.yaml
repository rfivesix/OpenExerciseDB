name: Rek voor de linker schouderbladheffer
description: Ga rechtop zitten of staan en draai je hoofd ongeveer 45 graden naar links. Houd je rechterschouder
  omlaag met je rechterhand achter je rug of onder je dij. Leg je linkerhand achter op je hoofd en begeleid
  je kin zachtjes richting je linkeroksel tot je de rek aan de achterkant en rechterkant van je nek voelt.
  Houd 20–30 seconden vast en adem rustig.
