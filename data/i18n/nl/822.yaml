name: Cable rear delt fly
description: Stel de kabelkatrollen ongeveer op hoofd- of ooghoogte in. Pak de linkerkabel met je rechterhand
  en de rechterkabel met je linkerhand vast, zodat de kabels voor je kruisen. Beweeg je armen in een brede
  horizontale boog naar buiten en naar achteren met je ellebogen licht gebogen. Span achteraan je achterste
  schouders aan en breng de handgrepen langzaam en gecontroleerd gekruist voor je borst terug.
