name: Tricepsstrekking met kabeltouw
description: Pak het touw aan de kabel vast en sta met je voeten op schouderbreedte. Houd je rug recht en leun iets
  naar voren. Duw het touw omlaag en houd je ellebogen tijdens de oefening stil. Draai je handen helemaal onderaan
  naar buiten en keer gecontroleerd terug naar de startpositie.
