name: Zittende piriformisstretch
description: Ga rechtop op de rand van een stoel of bank zitten met je voeten plat
  op de vloer. Leg één enkel over de andere knie in een vierpositie en laat de gebogen
  knie naar buiten zakken. Houd je borst omhoog en rug vlak, buig vanuit je heupen
  naar voren tot je de rek in bil en piriformis voelt. Houd 20–30 seconden vast en
  adem rustig; wissel van kant.
