name: Parallel-bar support hold
description: 'Ga tussen twee parallelle stangen of een dipstation staan. Pak de stangen neutraal vast
  en spring of duw jezelf omhoog naar de bovenste steunpositie met gestrekte armen.


  1. Duw je schouderbladen actief omlaag en houd je borst omhoog.

  2. Span je core en bilspieren aan en houd je benen bij elkaar met gestrekte tenen in een hollow-bodyhouding.

  3. Houd deze isometrische positie de voorgeschreven tijd vast en adem beheerst.

  4. Stap gecontroleerd omlaag wanneer je klaar bent.


  Laat je schouders niet naar je oren optrekken of je onderrug inzakken; houd je schouderbladen actief
  omlaag.'
