name: Conventionele deadlift
description: 'Beginpositie:

  Sta met je voeten op heupbreedte en de halterstang boven het midden van je voeten (ongeveer 2,5 cm van
  je schenen). Beweeg je heupen naar achteren en buig je knieën tot je de stang net buiten je benen kunt
  pakken met een bovenhandse of gemengde greep. Houd je rug recht, borst omhoog en schouders iets vóór
  de stang.


  Uitvoering:

  1. Adem diep naar je buik in en span je romp aan. Duw de vloer weg via het midden van je voeten en je
  hielen en strek tegelijk je knieën en heupen.

  2. Houd de stang tijdens het optillen dicht langs je schenen en dijen.

  3. Eindig rechtop en span je bilspieren aan. Houd je wervelkolom neutraal en leun niet achterover of
  hol je onderrug niet overdreven.

  4. Breng de stang beheerst terug naar de vloer door eerst je heupen naar achteren te bewegen en je knieën
  te buigen zodra de stang ze voorbij is.


  Opmerkingen:

  Rond je wervelkolom niet af onder belasting. Span je lats aan zodat de stang tijdens de hele lift dicht
  bij je lichaam blijft.'
