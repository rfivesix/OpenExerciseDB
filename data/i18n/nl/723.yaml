name: Lat pulldown met brede greep
search_terms:
- Lat pulldown met brede greep
description: Ga bij het lat-pulldownstation zitten en zet je dijen stevig vast onder de gevoerde rollen.
  Pak de brede stang met een bovenhandse greep vast, breder dan schouderbreedte. Trek de stang soepel
  naar je bovenborst, beweeg je ellebogen omlaag en naar achteren en houd je borst omhoog. Knijp onderaan
  je schouderbladen samen en strek je armen langzaam en gecontroleerd terug naar de beginpositie.
