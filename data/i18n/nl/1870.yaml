name: Liggende hamstringstretch met band
description: 'Beginpositie: Ga op je rug liggen en lus een weerstandsband of riem om de bal van één voet.
  Houd de uiteinden stevig met beide handen vast. Je andere been ligt gestrekt of gebogen op de vloer.


  Uitvoering: Strek het been met de band naar het plafond en trek de band rustig naar je borst tot je
  een duidelijke rek in je hamstrings voelt.


  Tips: Zet je knie niet op slot in hyperextensie; houd zo nodig een kleine buiging. Houd 20–30 seconden
  vast met rustige ademhaling en wissel van been.'
