name: Belt squat machine
description: Ga op de voetplatforms staan en bevestig de dipriem rond je heupen. Maak
  de ketting vast aan de machine, zet je voeten op schouderbreedte en houd de balansgrepen
  licht vast. Ontgrendel de veiligheid en zak door heupen en knieën in een squat tot
  je dijen parallel zijn of lager. Houd je romp rechtop en duw via middenvoet en hielen
  terug omhoog.
