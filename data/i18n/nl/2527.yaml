name: Frontsplitstretch
description: 'Beginpositie: Begin in een halfgeknielde houding op een mat. Plaats je handen op yogablokken
  of op de vloer naast je heupen voor balans en ondersteuning.


  Uitvoering: Schuif je voorste hiel langzaam naar voren terwijl je je achterste been en heup recht naar
  achteren strekt. Laat je bekken gecontroleerd zakken en houd je heupen recht naar voren gericht. Stop
  zodra je een diepe maar beheersbare spierspanning in je hamstrings en heupbuigers voelt. Houd de stretch
  gedurende de voorgeschreven tijd (20 tot 30 seconden) statisch vast en adem rustig en diep met je middenrif.
  Duw voorzichtig met je handen om uit de split te komen en herhaal aan de andere kant.


  Aanwijzingen: Veer niet en forceer je huidige bewegingsbereik niet; ondersteun je lichaamsgewicht met
  je handen of plaats een blok onder je voorste bovenbeen.'
