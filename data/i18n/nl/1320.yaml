name: Tricepsdips op de vloer
description: Tricepsdips op de vloer zijn een samengestelde oefening waarbij meerdere spiergroepen tegelijk
  werken. Deze oefening met lichaamsgewicht richt zich vooral op de triceps, maar traint ook de borst
  en voorkant van de schouders. De oefening kan de armkracht vergroten en spiermassa in de bovenarmen
  opbouwen. Het is een gesloten-keten-oefening, waarbij je rond een vast punt beweegt. Volgens de brontekst
  vergroot dit de compressiekracht op de gewrichten en daarmee de stabiliteit.
