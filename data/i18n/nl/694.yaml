name: Upright row met dumbbells
description: Sta rechtop met in elke hand een dumbbell voor je dijen en je handpalmen naar je lichaam
  gericht. Trek de dumbbells verticaal langs je romp omhoog, leid met je ellebogen en houd de gewichten
  dicht bij je lichaam. Til ze tot halverwege je borst met je ellebogen omhoog en laat ze langzaam en
  gecontroleerd zakken.
