name: Afwisselende reverse lunges
description: Sta rechtop met voeten op heupbreedte en romp aangespannen; handen op de heupen of voor de
  borst. Stap gecontroleerd met één voet ver naar achteren en land op de bal van de achterste voet. Laat
  de heupen recht omlaag zakken tot beide knieën ongeveer 90 graden gebogen zijn; achterste knie net boven
  de vloer, voorste knie boven de enkel. Duw via hiel en middenvoet van het voorste been terug omhoog.
  Herhaal met het andere been en wissel af.
