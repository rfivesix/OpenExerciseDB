name: Isometrische optrekhouding
description: 'Beginpositie:

  Pak een optrekstang bovenhands vast, iets breder dan schouderbreedte. Trek jezelf omhoog naar de gewenste
  positie, bijvoorbeeld met je kin boven de stang of je ellebogen in een hoek van 90 graden.


  Uitvoering:

  1. Houd je lichaam volledig stil in die gewrichtshoek.

  2. Trek je schouderbladen naar achteren en omlaag en span je brede rugspieren, bovenrug en biceps maximaal
  statisch aan.

  3. Houd de voorgeschreven tijd vast (bijvoorbeeld 10 tot 30 seconden) en laat jezelf daarna gecontroleerd
  zakken.


  Aandachtspunt:

  De oefening ontwikkelt isometrische trekkracht, ondersteunt de stabiliteit van de schouderbladen en
  kan helpen bij lastige punten in de optrekbeweging.'
