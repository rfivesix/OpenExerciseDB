name: Zittende kuitstretch (dorsiflexie)
description: 'Beginpositie:

  Ga rechtop op de vloer of een trainingsmat zitten met één been recht voor je uit.


  Uitvoering:

  1. Trek je tenen naar je scheenbeen door je enkel te buigen (dorsiflexie).

  2. Reik met je hand naar voren of sla een handdoek om de bal van je voet om de stretch van je kuiten
  en achillespees voorzichtig te verdiepen.

  3. Houd de stretch 20–30 seconden comfortabel vast en adem rustig door.

  4. Laat langzaam los en herhaal aan de andere kant.


  Tips:

  Houd je knie gestrekt zonder deze te forceren. Dit is een rustige stretch voor de enkelmobiliteit en
  het herstel van de kuit.'
