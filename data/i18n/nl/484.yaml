name: Rack pull
description: 'Deadliftvariant die je uitvoert vanaf de veiligheidspennen van een powerrack of Smith-machine,
  meestal met de halter net onder of ter hoogte van de knieën.

  Sta met je voeten op heupbreedte, duw je heupen naar achteren en pak de halter net buiten je benen vast.
  Trek door je heupen en knieën te strekken, duw via je hielen en span je billen aan bovenaan. Laat de
  halter gecontroleerd terugzakken op de pennen. Deze oefening benadrukt de boven- en onderrug en de bilspieren.'
