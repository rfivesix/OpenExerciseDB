name: Dumbbell push press
description: Breng twee dumbbells naar schouderhoogte met je handpalmen naar elkaar toe (neutrale greep)
  of iets naar voren. Adem in en span je romp aan. Buig je knieën en heupen licht; strek daarna explosief
  je benen en duw via je hielen om de dumbbells boven je hoofd tot volledige armstrekking te stuwen. Laat
  de gewichten gecontroleerd terugzakken naar je schouders en herhaal.
