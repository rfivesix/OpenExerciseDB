name: Bayesian cable curl
description: 'Startpositie:

  Bevestig een D-handgreep aan een lage kabel. Ga met je rug naar de kabeltoren staan, één voet naar voren,
  en houd de greep achter je romp vast met je arm naar achteren gestrekt.


  Uitvoering:

  1. Houd je bovenarm achter je lichaam stil en buig je elleboog om de greep naar je schouder te curlen.

  2. Span bovenaan je biceps één seconde aan.

  3. Laat de greep in 2–3 seconden langzaam achter je zakken tot je de biceps voelt rekken.'
