name: Drag curl met dumbbells
description: 'Startpositie:

  • Sta rechtop met in elke hand een dumbbell, met een onderhandse greep en je handpalmen naar voren.

  • Laat je armen voor je dijen hangen; houd je schouders naar achteren en je borst omhoog.


  Uitvoering:

  • Trek de dumbbells recht omhoog langs je romp door je ellebogen naar achteren te bewegen.

  • Breng de gewichten dicht langs je lichaam tot borsthoogte om je biceps te isoleren.

  • Span je biceps bovenaan stevig aan en laat de dumbbells langzaam via dezelfde baan zakken.'
