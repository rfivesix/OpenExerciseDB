name: Scapularetractie met band
description: Bevestig één uiteinde van een weerstandsband op schouderhoogte aan een muur, paal of ander
  verticaal steunpunt. Plaats je arm in de lus ter hoogte van je triceps. Stap achteruit tot de band strak
  staat en trek je elleboog en schouder tegen de weerstand naar achteren.
