description: 'Startpositie:

  • Sta met je rechterzij naast een vlakke muur.

  • Strek je rechterarm recht naar achteren en plaats je rechterhand plat tegen de muur op schouderhoogte,
  met je vingers naar achteren.


  Uitvoering:

  • Draai je romp en heupen langzaam van de muur af naar links.

  • Stop zodra je een comfortabele rek voelt in je rechterbiceps, voorste deltaspier en borst.

  • Houd de rek 20 tot 30 seconden vast terwijl je rustig ademt.'
