name: Squat met voorwaarts gehouden gewicht
description: 'Sta zo recht mogelijk met je voeten iets wijder dan schouderbreedte.

  Houd een gewichtsschijf met gestrekte armen voor je lichaam. Span je romp aan en behoud de natuurlijke
  kromming van je rug.

  Duw je heupen naar achteren en buig je knieën om zo diep mogelijk in een squat te zakken. Houd de positie
  even vast en kom terug naar de beginpositie.'
