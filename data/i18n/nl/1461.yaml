name: Dumbbell chest press zonder leg drive
description: Ga op een vlakke bank liggen met een halter in elke hand bij je borst. Til je voeten van
  de vloer (strek je benen op de bank of houd ze in de lucht) om de aandrijving vanuit je benen uit te
  schakelen. Houd je ellebogen ongeveer 45 graden van je romp. Duw de halters recht omhoog boven je borst,
  span bovenaan aan zonder je ellebogen hard op slot te zetten en laat ze langzaam zakken tot je bovenarmen
  op bankhoogte zijn.
