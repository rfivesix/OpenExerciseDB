name: Optrekken aan vingerbord
description: Pak een geschikte symmetrische rand of greep op het vingerbord vast met een open greep of
  half-crimp. Hang met gestrekte armen en actief aangespannen schouders. Trek je lichaam soepel omhoog
  met je lats en armen tot je kin boven je handen komt. Laat jezelf langzaam en volledig gecontroleerd
  (in 2–3 seconden) zakken naar de beginpositie; laat je niet plotseling vallen.
