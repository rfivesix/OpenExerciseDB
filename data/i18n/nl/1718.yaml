name: Eenarmige hoge kabelroe
description: 'Startpositie:

  Stel de kabelkatrol hoog in en bevestig een enkel handvat. Ga in een gespreide stand naar de machine
  staan, steun met je vrije hand op het frame en pak het handvat met een gestrekte arm vast.


  Uitvoering:

  1. Trek het handvat diagonaal naar je bovenborst of ribben en beweeg je elleboog naar achteren.

  2. Span je schouderblad en bovenrug aan aan het einde van de trekbeweging.

  3. Strek je arm langzaam en gecontroleerd om terug te keren naar de beginpositie.


  Tips:

  Houd je romp stil en draai je heupen of wervelkolom niet tijdens het roeien.'
