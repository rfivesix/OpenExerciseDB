translated_from: en
name: Shoulder fly; Side raises
description: 'Deze oefening traint de deltaspier van de schouder. Begin met gestrekte armen en houd de
  gewichten naast of voor je lichaam vast. Leun licht naar voren en buig je heupen en knieën een beetje.
  Houd je armen gestrekt of licht gebogen en til ze in een boog in het frontale vlak op tot je handen
  ongeveer op schouderhoogte zijn. Laat de gewichten zakken naar de beginpositie om één herhaling af te
  maken.

  Ga bij gebruik van een kabelmachine zo staan dat het frontale vlak op één lijn staat met de kabelkatrol,
  die op of dicht bij de vloer staat. Je kunt de oefening met één arm tegelijk uitvoeren en de andere
  hand gebruiken om je lichaam te stabiliseren tegen het verplaatste gewicht, of met beide armen tegelijk
  als er twee parallelle kabelkatrollen zijn.'
search_terms:
- Elevación lateral
- elevaciones laterales
