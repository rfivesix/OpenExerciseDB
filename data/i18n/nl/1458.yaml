name: Gekruiste cable Y-raise
description: 'Bevestig twee losse handgrepen aan de lage katrollen van een dubbele kabelmachine. Kruis
  de kabels voor je lichaam: linkerhand aan de rechter kabel en rechterhand aan de linker kabel. Sta met
  je voeten op heupbreedte en je armen gekruist voor je heupen. Hef beide armen diagonaal naar buiten
  tot ze boven je hoofd een brede Y vormen. Span bovenaan je achterste schouderspieren en onderste trapezius
  aan. Laat je armen langzaam zakken naar de gekruiste beginpositie.'
