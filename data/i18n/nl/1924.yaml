name: gym80 3008 buikspiermachine
description: Ga op de gym80 3008 crunchmachine zitten. Stel zitting en beensteunen
  zo af dat het draaipunt bij je onderrug ligt. Laat je bovenlichaam tegen het borstkussen
  rusten en houd de grepen licht vast. Adem uit en krul je romp voorwaarts en omlaag
  door je wervelkolom te buigen. Span je buik een seconde aan en keer langzaam rechtop
  terug zonder de gewichtstapel te laten vallen. Trek niet met je armen of voeten.
