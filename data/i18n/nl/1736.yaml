name: Eenbenige dumbbell deadlift
description: 'Startpositie: Sta rechtop met licht gebogen knieën en houd één of twee dumbbells vast. Verplaats
  je gewicht naar je standbeen en til je andere voet iets van de vloer.

  Heupscharnier: Houd je rug recht en romp aangespannen, duw je heupen naar achteren en strek je vrije
  been achter je uit voor balans. Houd je heupen naar de vloer gericht. Laat de dumbbell(s) langs je standbeen
  richting de grond zakken.

  Bewegingsbereik: Laat je romp zakken tot die bijna parallel aan de vloer is of tot je een sterke rek
  in de hamstring van je standbeen voelt, terwijl je rug neutraal blijft.

  Terug naar start: Pauzeer onderaan en span je bilspieren en hamstrings aan om langzaam weer rechtop
  te komen. Breng je vrije been terug in lijn met je standbeen. Wissel na het gewenste aantal herhalingen
  van kant.'
