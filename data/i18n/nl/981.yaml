name: Opstap
description: Ga rechtop voor een stevige bank, box of trede staan, met je voeten op heupbreedte. Zet je
  hele rechtervoet stevig op de verhoging en duw via je rechterhiel tot je rechterbeen gestrekt is. Tik
  met je linkervoet op de verhoging of breng je linkerknie omhoog. Stap gecontroleerd terug, eerst met
  links en daarna met rechts. Houd je romp rechtop en zet niet te veel af met het achterste been.
