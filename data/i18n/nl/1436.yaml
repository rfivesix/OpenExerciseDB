name: Bankdrukken met halter vanaf pinnen
description: Plaats een vlakke bank in een powerrack en stel de veiligheidssteunen op de gewenste hoogte
  in (meestal enkele centimeters boven je borst of bij het knelpunt). Ga liggen, pak de halterstang iets
  breder dan schouderbreedte vast en zet je voeten stevig neer. Laat de stang beheerst zakken tot hij
  volledig op de steunen rust. Pauzeer 1 tot 2 seconden met aangespannen bovenlichaam en duw de stang
  vervolgens omhoog tot je armen gestrekt zijn; laat de stang niet van de steunen stuiteren. Verlies je
  spierspanning niet terwijl de stang op de steunen rust.
