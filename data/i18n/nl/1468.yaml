name: EZ-stang triceps strekken op de vloer
description: 'Startpositie:

  Ga op je rug op de vloer of een mat liggen. Pak een EZ-stang met een smalle bovenhandse greep aan de
  binnenste bochten en druk hem omhoog tot je armen gestrekt zijn, iets achter de verticale lijn.


  Uitvoering:

  1. Houd je bovenarmen stil en buig je ellebogen om de stang achter je hoofd te laten zakken tot de schijven
  zacht de vloer raken.

  2. Pauzeer kort om de terugverende beweging te stoppen.

  3. Strek je ellebogen en druk de stang omhoog; span bovenaan je triceps aan.


  Aandachtspunten:

  Laat de stang tussen herhalingen op de vloer rusten om momentum te voorkomen.'
