name: Kabel pullback met rugstrekking
description: Stel de katrollen in op heup- tot borsthoogte en bevestig handgrepen.
  Pak ze vast, stap enkele passen achteruit, buig je knieën licht en kantel vanuit
  je heupen met een rechte rug voorover; strek je armen naar voren. Trek de handgrepen
  naar je romp terwijl je je rug strekt en je borst omhoog brengt. Knijp je schouderbladen
  samen en keer beheerst terug. Houd je romp aangespannen en ruk niet.
