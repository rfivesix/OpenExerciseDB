name: Kuitheffing met rechterbeen
description: Ga op de vloer staan of op de rand van een trede om de bewegingsuitslag te vergroten. Til
  één voet op. Hef je hiel tot je op je tenen staat en houd deze positie drie seconden vast. Laat je hiel
  langzaam zakken tot hij de vloer bijna raakt; laat je voet niet hard neerkomen.
