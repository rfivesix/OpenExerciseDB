name: Eénbenig kuitheffen (rechts)
description: |-
  Beginpositie:
  Ga op je rechtervoet staan op de vloer of op de rand van een verhoging. Houd je linkervoet van de grond en zoek lichte steun aan een muur voor je balans.

  Uitvoering:
  1. Laat je rechterhiel gecontroleerd zakken om de kuitspier te strekken.
  2. Duw krachtig omhoog vanuit de bal van je rechtervoet tot je zo hoog mogelijk op je tenen staat.
  3. Houd de kuitspanning bovenin 1-2 seconden vast.
  4. Laat je hiel rustig weer zakken en herhaal.
