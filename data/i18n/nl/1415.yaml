name: Crunch met halter
description: Ga op je rug liggen met gebogen knieën en je voeten op de vloer. Houd een halter met beide
  handen dicht bij je borst of boven je hoofd. Til je schouders en bovenrug in een crunch van de vloer
  terwijl je je romp aanspant. Laat jezelf langzaam zakken naar de beginpositie en beweeg beheerst.
