name: Hoge kniesprongen
description: 'Je kunt deze oefening gebruiken als dynamische warming-up vóór de training en als onderdeel
  van je cardiotraining. High knee skips zijn plyometrisch: explosieve aerobe bewegingen die snelheid,
  wendbaarheid en kracht vergroten en het hele lichaam trainen. Ze richten zich op de schuine buikspieren,
  been- en heupspieren en heupbuigers, en trainen ook de dijen, kniepezen, quadriceps en schouders. Sprongen
  combineren conditietraining met krachtwerk en kunnen je cardiovasculaire conditie verbeteren doordat
  je hartslag stijgt.'
