name: Kettlebellzwaai
description: 'Beginpositie: sta met je voeten iets wijder dan schouderbreedte en plaats de kettlebell
  ongeveer dertig centimeter voor je op de vloer. Beweeg je heupen naar achteren met een rechte rug en
  pak het handvat met beide handen vast. Uitvoering: zwaai de kettlebell tussen je benen naar achteren,
  zoals bij een football-snap. Stoot je heupen explosief naar voren, duw via je hielen en span je bilspieren
  aan om de kettlebell tot borsthoogte te zwaaien. Terugkeer: laat de kettlebell omlaag komen en beweeg
  je heupen naar achteren om hem tussen je benen te begeleiden; ga meteen door met de volgende herhaling.
  Aanwijzingen: dit is een heupscharnier, geen squat. De kracht komt uit je heupen en bilspieren, niet
  uit je schouders of armen.'
