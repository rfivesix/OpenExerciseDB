name: Staande heupabductie
description: Sta rechtop met gewicht op het standbeen en houd voor balans een muur of stevige stang vast.
  Houd romp rechtop, bekken vlak en romp aangespannen. Til het werkbeen gecontroleerd zijwaarts zonder
  de romp naar de andere kant te kantelen. Breng het zo hoog als comfortabel is, tenen naar voren en heupen
  recht. Pauzeer en span de buitenste heup/bil aan; laat langzaam zakken zonder tussen herhalingen op
  het been te rusten. Wissel daarna van been.
