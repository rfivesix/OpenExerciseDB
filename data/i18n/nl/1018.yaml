name: Zijwaartse nekkanteling
description: Ga rechtop zitten of staan met een neutrale rug en ontspannen, lage schouders. Kantel je
  hoofd langzaam naar één kant tot je een lichte rek voelt aan de andere kant van je nek. Houd 15–30 seconden
  vast, houd beide schouders laag en keer terug naar het midden. Herhaal aan de andere kant.
