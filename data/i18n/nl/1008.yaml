name: Linker nekrekking
description: 'Beginpositie:

  Zit of sta met rechte rug.

  Stappen:


  Kantel uw hoofd naar de zijkant en houd 8 seconden vast om de zijkant van uw nek te strekken.

  Trek met de dichtstbijzijnde hand boven op uw hoofd zachtjes om verder te strekken. Houd 8 seconden
  vast.

  Draai uw kin naar uw schouder. Houd 8 seconden vast.

  Laat los en keer terug naar de beginpositie.'
