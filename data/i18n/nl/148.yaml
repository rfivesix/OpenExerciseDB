name: Kuitheffing op de hack-squatmachine
description: 'Neem plaats op de machine met je rug stevig tegen de leuning en je voeten op het platform
  voor kuitheffingen. Zorg dat de helft van je voeten vrij over de rand hangt, zodat je kuiten volledig
  omlaag kunnen rekken.

  Houd je knieën gestrekt en til het gewicht zo hoog mogelijk op. Laat het vloeiend zakken tot je kuiten
  volledig rekken. Herhaal.'
