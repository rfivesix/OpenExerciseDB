name: Hanging leg raise
description: Hang aan een optrekstang met een bovenhandse greep en gestrekte armen. Span je romp aan en
  til je benen op tot ze evenwijdig aan de vloer zijn of hoger; je knieën kunnen gestrekt of licht gebogen
  zijn. Laat je benen daarna langzaam en gecontroleerd zakken.
