name: Flutterkick met kickboard
description: 'Startpositie:

  Houd een kickboard met beide handen vast en strek je armen voor je uit. Zet je af van de zwembadwand
  en kom horizontaal met je gezicht naar beneden te liggen.


  Uitvoering:

  1. Begin een gelijkmatige, compacte flutterkick vanuit je heupen; buig je knieën niet overdreven.

  2. Houd je benen relatief recht, je knieën ontspannen en je tenen losjes gestrekt.

  3. Kijk met je gezicht in het water naar de bodem. Til je hoofd soepel naar voren wanneer je moet inademen.

  4. Houd de voortstuwende kick aan terwijl je het zwembad oversteekt.


  Aandachtspunten:

  Maak geen fietsbeweging met je benen. Kick vooral vanuit je bilspieren en romp om je heupen hoog in
  het water te houden.'
