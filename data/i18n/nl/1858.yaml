name: Foamroller voor quadriceps
description: 'Beginpositie: Ga op je buik liggen met de foamroller onder de voorkant van je dijen. Steun
  met je bovenlichaam op je onderarmen in plankpositie.


  Uitvoering: Rol langzaam van de bovenkant van je bekkenplooi tot net boven je knieschijven. Draai je
  benen licht naar binnen of buiten om alle delen van je quadriceps te behandelen.


  Tips: Span je buikspieren aan zodat je onderrug niet doorzakt in overmatige extensie.'
