name: Enkelmobilisatie met dorsiflexierock
description: 'Neem op een mat een halfknielende houding aan, met één knie op de grond en je voorste voet
  plat op de vloer, ongeveer een scheenbeenlengte naar voren. Leg je handen voor balans op je voorste
  dij.


  1. Beweeg je voorste knie langzaam recht naar voren in lijn met je tenen en houd je hiel stevig op de
  vloer.

  2. Beweeg tot het einde van de dorsiflexie van je enkel en voel een diepe rek in je kuit en achillespees.

  3. Houd de eindpositie 2–3 seconden vast.

  4. Beweeg rustig terug en herhaal de rockende beweging voordat je van been wisselt.


  Laat je voorste hiel niet loskomen; de bron noemt hielcontact essentieel voor het mobiliseren van het
  enkelgewricht en de soleus.'
