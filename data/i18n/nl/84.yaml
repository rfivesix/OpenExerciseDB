name: Voorovergebogen roeien met halterstang en onderhandse greep
description: 'Net als bij de gewone row, maar met een onderhandse greep (handpalmen naar voren):

  Pak de stang breed vast, iets wijder dan schouderbreedte, en buig voorover. Je bovenlichaam is niet
  helemaal parallel aan de vloer, maar helt licht. Houd je borst gedurende de oefening naar voren.

  Trek de stang snel naar je navel, niet hoger. Keer langzaam terug naar de beginpositie. Zwaai niet met
  je lichaam en houd je armen naast je romp.'
