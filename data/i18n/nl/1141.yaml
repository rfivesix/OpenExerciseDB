name: Arabesque
description: Sta rechtop en verplaats het lichaamsgewicht naar één standbeen. Houd de knie licht gebogen,
  heupen en bekken vlak en naar voren gericht, rug neutraal en romp aangespannen. Scharnier vanuit de
  heupen voorover terwijl het vrije been recht naar achteren en omhoog gaat. Laat de romp zakken en til
  het achterste been tot beide ongeveer horizontaal zijn. Span de bilspier en hamstring van het standbeen
  aan en kom langzaam terug.
