name: Plank tuck jump
description: Begin in een plankpositie met je handen recht onder je schouders en je voeten op heupbreedte.
  Span je romp aan en houd je lichaam in een rechte lijn van hoofd tot tenen. Buig vanuit deze positie
  je knieën licht en spring met beide voeten naar voren, zo dicht mogelijk naar je romp. Zodra je voeten
  de grond raken, zet je krachtig af om opnieuw te springen en terug te keren naar de plankpositie. Herhaal
  de sprongen en houd je beweging en romp onder controle. Blijf gelijkmatig en diep ademhalen en kijk
  naar de grond om je wervelkolom goed uitgelijnd te houden. Herhaal gedurende de voorgeschreven tijd
  of het voorgeschreven aantal herhalingen. Beëindig de oefening door uit de plankpositie te komen en
  rust te nemen; rek indien nodig om je spieren losser te maken.
