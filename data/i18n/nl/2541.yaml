name: Eenarmige isometrische triceps pushdown
description: 'Beginpositie: Ga voor een hoge kabelkatrol staan of iets schuin ervoor. Pak met één hand
  een enkel handvat vast met een bovenhandse of neutrale greep. Houd je bovenarm stevig tegen je zij met
  je elleboog ongeveer 90 graden gebogen. Buig iets vanuit je heupen en span je romp aan.


  Uitvoering: Duw omlaag door je elleboog te strekken tot je arm bijna volledig gestrekt is, of tot de
  gekozen hoek halverwege de beweging. Houd deze samengetrokken positie gedurende de voorgeschreven tijd
  volledig stil tegen de kabelweerstand en richt je op de maximale contractie van je triceps. Laat het
  handvat langzaam en gecontroleerd terugkomen naar de startpositie met je elleboog op 90 graden en herhaal
  met de andere arm.


  Aanwijzingen: Houd je elleboog tegen je zij en laat hem tijdens de hold niet naar voren, achteren of
  buiten bewegen. Houd je schouder laag en stil.'
