name: Glute bridge met afwisselende beenstrekking
description: Ga op een mat liggen met gebogen knieën en voeten op heupbreedte, steunend
  op je hielen. Leg je armen naast je. Duw via je hielen je heupen omhoog tot dijen
  en romp één lijn vormen en span je bilspieren aan. Strek één been in het verlengde
  van je dij terwijl je heupen hoog blijven, zet de voet terug en wissel. Houd je
  bekken horizontaal en voorkom draaien of wegzakken.
