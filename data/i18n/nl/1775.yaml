name: Pec-deck rear-delt fly
description: 'Ga met je gezicht naar de leuning van een pec-deckmachine zitten. Stel de zitting zo af
  dat de handgrepen op schouderhoogte staan. Houd je borst tegen de leuning, zet je voeten stevig neer
  en pak de handgrepen neutraal of bovenhands vast met licht gebogen ellebogen.


  1. Beweeg je ellebogen in een brede horizontale boog naar achteren en buitenwaarts door je achterste
  deltaspieren aan te spannen.

  2. Pauzeer een seconde wanneer je armen in lijn met je romp staan.

  3. Breng de handgrepen langzaam en gecontroleerd naar de beginpositie zonder de gewichtstapel te laten
  rusten.


  Focus op de achterkant van je schouders. Haal je trapezius niet op en trek je schouderbladen niet overdreven
  samen.'
