name: Dumbbell triceps extension
description: 'Houd een dumbbell boven je hoofd vast met beide handen onder de binnenste schijf, in een
  hartvormige greep.

  Houd je ellebogen boven je hoofd en laat je onderarmen achter je bovenarmen zakken door je ellebogen
  te buigen. Buig je polsen onderaan om te voorkomen dat de dumbbell je nek raakt. Breng de dumbbell boven
  je hoofd door je ellebogen te strekken en je polsen te overstrekken. Keer terug en herhaal.'
