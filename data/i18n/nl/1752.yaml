name: Laterale kabelheffing kruislings voor het lichaam
description: 'Ga zijwaarts naast een lage kabelkatrol staan. Pak het handvat met je buitenste hand gekruist
  voor je lichaam vast. Houd je romp stil en je knieën licht gebogen.


  1. Hef met een licht gebogen elleboog je arm zijwaarts tot je hand op schouderhoogte komt.

  2. Pauzeer kort bovenaan en span je laterale deltaspier aan.

  3. Laat je arm langzaam en gecontroleerd vóór je lichaam terugzakken en houd de spanning vast.


  Richt de inspanning op de laterale deltaspier. Haal je trapezius niet op en leun niet van de katrol
  af.'
