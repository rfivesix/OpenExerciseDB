name: Schouderdrukken met dumbbells
description: Ga op een bank zitten waarvan de rugleuning bijna verticaal staat. Pak twee dumbbells en breng ze naar
  schouderhoogte. Houd je handpalmen en ellebogen tijdens de hele oefening naar voren gericht. Duw de gewichten
  omhoog; bovenaan komen ze dicht bij elkaar, maar raken ze elkaar niet. Laat ze langzaam zakken en herhaal.
