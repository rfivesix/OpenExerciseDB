name: Bench dips between two benches
description: Zet twee banken zo ver uit elkaar dat je je met je handen aan de ene kunt vasthouden en met
  je voeten de andere net kunt bereiken. Houd je benen tijdens de oefening volledig gestrekt. Richt je
  ellebogen naar achteren en buig ze zo ver mogelijk. Duw jezelf omhoog, maar strek je armen niet helemaal.
