name: Reverse curl met EZ-stang
description: 'Sta rechtop en houd een EZ-stang op schouderbreedte met een bovenhandse greep vast, handpalmen
  omlaag. Houd je ellebogen dicht bij je romp.

  Buig je ellebogen en curl de stang naar je borst; de nadruk ligt op de brachialis en brachioradialis
  in je onderarmen. Span bovenaan aan en laat het gewicht langzaam en gecontroleerd zakken tot je armen
  gestrekt zijn.'
