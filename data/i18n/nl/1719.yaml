name: Eenarmige lat pulldown in halfknielende houding
search_terms:
- "Halfknielende lat pulldown met één arm"
- "Halfknielende lat pulldown"
description: 'Startpositie:

  Stel een kabelkatrol hoog in en bevestig een enkel handvat. Kniel op de knie aan de werkende kant en
  zet de andere voet naar voren voor balans. Pak het handvat met je arm gestrekt boven je hoofd.


  Uitvoering:

  1. Trek het handvat naar je schouder en beweeg je elleboog recht omlaag richting je heup.

  2. Span je lat aan onderaan de beweging.

  3. Laat je arm langzaam weer boven je hoofd strekken en voel de rek langs de zijkant van je rug.


  Tips:

  Houd je romp rechtop en span je core aan. De halfknielende houding beperkt beweging van je onderlichaam
  en isoleert de latissimus dorsi.'
