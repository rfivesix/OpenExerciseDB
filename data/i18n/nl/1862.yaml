name: Heupcirkels
description: 'Beginpositie: Sta rechtop met je voeten op heupbreedte en je handen op je heupen.


  Uitvoering: Maak soepele, ruime cirkels met je heupen, eerst met de klok mee en daarna tegen de klok
  in. Houd je romp redelijk rechtop en beweeg je heupgewrichten door hun beschikbare bewegingsbereik.


  Tips: Beweeg gecontroleerd en zonder rukken om de heupgewrichten te mobiliseren en omliggende spieren
  op te warmen.'
