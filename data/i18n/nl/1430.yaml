name: Gewichtsschijven knijpen en vasthouden
description: Kies één of twee gewichtsschijven (gladde randen werken het best) en knijp ze tussen je duim
  en vingers tegen elkaar. Houd je arm recht langs je zij of iets voor je uit. Houd zo lang mogelijk vast
  met ontspannen schouders en een stevige grip. Je kunt dit op tijd of herhalingen uitvoeren.
