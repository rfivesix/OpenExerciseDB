name: Scapulaire pull-ups
description: Hang met een bovenhandse greep iets breder dan schouderbreedte aan een optrekstang. Houd
  je armen gestrekt, romp aangespannen en schouders ontspannen bij je oren. Trek je schouderbladen omlaag
  en naar elkaar toe zodat je lichaam enkele centimeters omhoogkomt, zonder je ellebogen te buigen. Houd
  de bovenste positie 1 tot 2 seconden vast en laat jezelf langzaam terugzakken tot een volledige hang.
  Houd je armen gestrekt; de beweging komt uit je schouderbladen en rug.
