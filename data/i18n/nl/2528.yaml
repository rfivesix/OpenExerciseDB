name: Squatstretch met reikbeweging omhoog
description: 'Beginpositie: Zet je voeten op schouderbreedte en zak in een diepe squat zonder gewicht.
  Pak je rechterenkel of -voet met je tegenovergestelde (linker)hand vast om jezelf te verankeren.


  Uitvoering: Blijf diep gehurkt en draai je romp en borst naar rechts. Reik met je rechterarm omhoog
  en naar achteren richting het plafond en volg je hand met je ogen. Pauzeer bovenaan 1 tot 2 seconden
  en voel de stretch in je borstwervelkolom, lies en borst. Keer soepel terug naar de neutrale diepe squat.
  Herhaal aan die kant en wissel daarna van hand om naar links te draaien.


  Aanwijzingen: Houd beide hielen plat op de vloer en duw je knieën naar buiten; laat de draai uit je
  middenrug (borstwervelkolom) komen, niet uit je nek.'
