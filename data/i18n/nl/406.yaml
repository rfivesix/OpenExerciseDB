name: Zijlig, externe schouderrotatie
description: Ga op je zij op een mat liggen met een lichte dumbbell in je bovenste hand. Houd de elleboog
  van die arm 90 graden gebogen en licht tegen je zij of taille gedrukt. Draai je onderarm tegen de zwaartekracht
  in omhoog naar het plafond en span de infraspinatus en teres minor aan. Laat je arm daarna langzaam
  en gecontroleerd zakken. Rol niet met je lichaam naar achteren.
