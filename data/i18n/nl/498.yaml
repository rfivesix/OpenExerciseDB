name: Bench press met omgekeerde greep
description: 'Ga op een bank liggen met je voeten stevig op de vloer. Pak de halter iets breder dan schouderbreedte
  met een onderhandse greep vast en houd je polsen recht.

  Haal de halter uit het rek en laat hem gecontroleerd naar je onderborst zakken. Houd je ellebogen in
  een comfortabele hoek en dicht bij je lichaam. Duw de halter omhoog tot je armen gestrekt zijn en span
  je bovenborst (claviculaire deel) en triceps krachtig aan.'
