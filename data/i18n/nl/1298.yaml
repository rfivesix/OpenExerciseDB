name: Tricepsstrekking aan hoge kabel
description: De tricepsstrekking met gekruiste kabel aan een hoge pulley is een isolatieoefening voor
  de triceps, vooral het lange hoofd. Je gebruikt kabels en handgrepen die je met de tegenovergestelde
  handen vastpakt; dit zorgt voor een bijzondere duwbeweging die kan helpen de triceps sterker te maken.
  Vergeleken met varianten met een rechte stang of touw kan deze uitvoering comfortabeler zijn voor je
  polsen en ellebogen.
