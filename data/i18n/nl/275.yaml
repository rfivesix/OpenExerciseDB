name: Cable hammer curls
description: 'Houd de kabel vast met je handpalmen parallel en naar elkaar gericht, en houd je lichaam
  recht. Buig je armen en breng het gewicht vlot omhoog. Laat het zonder pauze langzaam en gecontroleerd
  zakken, maar strek je armen niet helemaal.

  Zwaai niet met je lichaam; je biceps doen het werk. Houd je ellebogen naast je lichaam en beweeg ze
  niet.'
