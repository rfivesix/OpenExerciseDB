name: Foamroller voor kuiten
description: 'Beginpositie: Ga op de vloer zitten en plaats de foamroller horizontaal onder je kuiten,
  tussen de achillespees en de achterkant van je knie. Steun met je handen achter je en til je heupen
  iets op.


  Uitvoering: Rol langzaam heen en weer van net boven je enkels tot net onder je knieën. Draai je benen
  licht naar binnen en buiten om de binnen- en buitenkant van je kuiten te behandelen.


  Tips: Pauzeer 15–20 seconden op gevoelige plekken terwijl je diep ademhaalt.'
