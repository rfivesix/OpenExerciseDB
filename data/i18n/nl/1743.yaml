name: Hangende windshield wipers
description: 'Hang met een bovenhandse greep iets breder dan schouderbreedte aan een optrekstang. Span
  je lats en schouders aan, leun iets naar achteren en til je gestrekte benen op tot je tenen naar de
  stang of het plafond wijzen.


  1. Houd je benen recht en je voeten bij elkaar; draai je heupen en benen langzaam in een boog naar één
  kant.

  2. Keer de richting om door je schuine buikspieren en core aan te spannen en breng je benen terug door
  het midden.

  3. Laat je benen gecontroleerd naar de andere kant zakken en wissel af.


  Houd de beweging gecontroleerd en zwaai niet. Buig je knieën naar je borst als gestrekte benen de uitvoering
  verstoren.'
