name: Decline push-ups
description: Plaats de voeten op een stevige bank of box en de handen op de vloer onder of iets wijder
  dan de schouders. Houd het lichaam in een stevige diagonale lijn. Buig de ellebogen en laat de borst
  beheerst richting vloer zakken, romp aangespannen en heupen hoog. Zak tot neus of bovenborst bijna de
  vloer raakt. Duw de vloer weg en strek de armen. Deze variant legt meer nadruk op bovenborst en voorste
  schouders.
