name: French Press SZ-bar; Skullcrusher SZ-bar
description: 'Houd de EZ-stang vast en ga zo op een vlakke bank liggen dat ongeveer een kwart van je hoofd
  over de rand steekt. Strek je armen met de stang en buig ze om de stang te laten zakken. Duw de stang
  weer omhoog vlak voordat deze je voorhoofd raakt.

  Let op je ellebogen en armen: alleen je triceps werken; de rest van je armen beweegt niet.'
