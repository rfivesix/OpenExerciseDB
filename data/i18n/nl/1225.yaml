name: Brede bicepscurl met dumbbells
description: 'Startpositie:

  • Sta rechtop met in elke hand een dumbbell en je handpalmen naar voren.

  • Richt je onderarmen iets breder dan schouderbreedte naar buiten en houd je ellebogen licht tegen je
  zij.


  Uitvoering:

  • Curl de dumbbells via deze schuine baan naar de buitenkant van je schouders, met nadruk op de korte
  binnenste kop van de biceps.

  • Span je biceps bovenaan kort aan.

  • Laat de dumbbells langzaam en volledig gecontroleerd via dezelfde baan zakken.'
