name: Copenhagen-adductieoefening
description: Ga op je zij liggen met je elleboog recht onder je schouder, zoals bij een zijplank. Leg
  je bovenste been op een bank, met de binnenkant van je voet of enkel op de bank. Til je heupen op en
  houd je lichaam in een rechte lijn; je onderste been blijft van de vloer. De oefening activeert de adductoren
  van het bovenste been sterk en daagt ook de romp- en heupstabilisatoren uit.
