name: Good morning in gespreide stand
description: 'Startpositie:

  Leg een halterstang op je bovenrug, op de trapezius, alsof je gaat squatten. Zet één been een halve
  stap naar voren in een gespreide steunstand. Houd je voorste been bijna gestrekt en je achterste knie
  licht gebogen voor je evenwicht.


  Uitvoering:

  1. Buig vanuit je heupen voorover en duw je billen naar achteren. Houd je borst open en je wervelkolom
  neutraal.

  2. Laat je romp zakken tot je een diepe rek voelt in de hamstrings van je voorste werkbeen; stop wanneer
  je romp ongeveer parallel aan de vloer is.

  3. Duw je heupen naar voren en span je bilspieren en hamstrings aan om soepel rechtop te komen.

  4. Maak alle herhalingen aan één kant af, wissel van stand en herhaal.


  Aandachtspunten:

  Houd het grootste deel van de belasting op de voorste hiel en heup. Rond je onderrug tijdens de heupscharnierbeweging
  niet af.'
