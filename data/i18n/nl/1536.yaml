name: Schouderstretch dwars voor het lichaam
description: 'Beginpositie:

  Sta of zit rechtop, met ontspannen schouders en een neutrale wervelkolom.


  Uitvoering:

  1. Breng één arm op schouderhoogte horizontaal voor je borst langs.

  2. Duw met je andere hand voorzichtig je bovenarm of elleboog dichter naar je romp, tot je een comfortabele
  rek achter in de schouder voelt.

  3. Houd 20 tot 30 seconden vast en adem rustig door.

  4. Laat de arm langzaam los en herhaal aan de andere kant.


  Aandachtspunten:

  Deze stretch rekt de achterste deltaspier en de uitwendige rotatoren. Trek je schouder niet richting
  je oor.'
