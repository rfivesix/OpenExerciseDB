name: Back lever
description: 'Hang aan een optrekstang of gymnastiekringen met een bovenhandse of onderhandse greep. Breng
  je benen tussen je armen door tot je ondersteboven hangt (skin-the-cat-positie), met je gezicht naar
  de vloer.


  1. Laat je lichaam langzaam vanuit de omgekeerde hang zakken tot je lichaam van schouders tot hielen
  recht en horizontaal is.

  2. Houd je armen volledig gestrekt, trek je schouderbladen actief omlaag en naar achteren en span bilspieren,
  rugstrekkers en core aan.

  3. Houd de statische positie de voorgeschreven tijd vast en adem rustig door.

  4. Verlaat de positie gecontroleerd door terug te trekken naar de omgekeerde hang of veilig af te dalen.


  Laat je heupen niet doorzakken of knikken. De bron adviseert opbouw via tuck-variaties om bicepspezen
  en schoudergewricht te conditioneren.'
