name: Laterale en frontale heffingen
description: '- Doe een laterale dumbbellheffing en pauzeer bovenaan, op schouderhoogte.

  - Breng de dumbbells zonder ze te laten zakken met gestrekte armen voor je lichaam bij elkaar, tot de
  eindpositie van een frontale heffing.

  - Laat de dumbbells voor je dijen zakken zoals bij een frontale heffing.

  - Keer de beweging om: hef de dumbbells recht voor je tot schouderhoogte, open je armen naar opzij tot
  de eindpositie van een laterale heffing en laat de gewichten langs je lichaam zakken. Dit is één herhaling.'
