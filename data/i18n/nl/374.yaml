name: Leg press met brede stand
description: 'Ga op de leg press zitten met je rug stevig tegen de rugleuning. Zet je voeten hoog en breed
  op het platform, breder dan schouderbreedte, met je tenen iets naar buiten.

  Ontgrendel de veiligheidsvergrendeling en laat het platform gecontroleerd zakken tot je knieën ongeveer
  90 graden gebogen zijn en in lijn blijven met je tenen. Duw met je hielen en middenvoet terug naar de
  beginpositie zonder je knieën op slot te zetten.'
