name: Heupbuigerstretch
description: 'Beginpositie: Neem een halfknielende lunge aan met je achterste knie op een comfortabele
  mat en je voorste knie 90° gebogen. Houd je romp rechtop.


  Uitvoering: Span de bilspier van je achterste been aan en kantel je staartbeen iets in. Beweeg je heupen
  rustig naar voren tot je een gerichte rek voelt aan de voorkant van je achterste heup en bovenbeen.


  Tips: Houd je wervelkolom recht zonder je onderrug hol te trekken. Houd 20–30 seconden vast terwijl
  je rustig ademt en wissel van kant.'
