name: Triceps kickback met dumbbell
description: De dumbbell kickback is een populaire krachtoefening voor de triceps aan de achterkant van
  je bovenarmen. De oefening versterkt en vormt de triceps en draagt bij aan de algehele armkracht. Van
  de oefeningen voor de armspieren zijn de kickback en varianten ervan effectief. Je kunt ze uitvoeren
  met dumbbells, kabels of weerstandsbanden.
