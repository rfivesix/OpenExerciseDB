name: Push press
description: Sta met je voeten op heup- tot schouderbreedte en leg de halterstang stevig op je voorste
  schouders en sleutelbeenderen. Houd je ellebogen iets naar voren en span je romp aan. Buig je knieën
  enkele centimeters recht omlaag terwijl je romp rechtop blijft. Strek je knieën en heupen explosief
  om de stang omhoog te stuwen; maak de beweging af met je armen en strek ze boven je hoofd. Laat de stang
  beheerst terugzakken naar de front rack-positie.
