name: Hardlopen in zone 2
description: Loop in een gelijkmatig tempo waarbij je kunt praten, passend bij zone 2-cardio (meestal
  60–70% van je maximale hartslag). Houd een intensiteit aan waarbij je comfortabel volledige zinnen kunt
  spreken of voornamelijk door je neus ademt (de praatjestest). Houd je hartslag tijdens de hele duurloop
  stabiel om je aerobe basis en metabole efficiëntie te ontwikkelen.
