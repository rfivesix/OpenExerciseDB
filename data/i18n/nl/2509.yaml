name: Zijplank
description: 'Startpositie:

  Ga op je zij op een mat liggen met je benen gestrekt en je voeten op elkaar of iets versprongen voor
  evenwicht. Steun op je onderste onderarm met de elleboog recht onder je schouder.


  Uitvoering:

  1. Span je romp aan en til je heupen van de vloer tot je lichaam een rechte diagonale lijn van hoofd
  tot voeten vormt.

  2. Plaats je bovenste hand op je heup of strek hem omhoog naar het plafond.

  3. Houd deze stevige isometrische positie gedurende de voorgeschreven tijd vast en adem rustig.

  4. Laat je heupen gecontroleerd zakken en herhaal aan de andere kant.


  Aandachtspunten:

  Laat je heupen niet doorzakken of naar voren rollen. Duw actief via je steunende onderarm om je schouder
  stabiel te houden.'
