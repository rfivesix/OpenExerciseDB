name: Dumbbell incline curl
description: 'Instellen: Zet een verstelbare bank op een helling van ongeveer 45 tot 60 graden.

  Uitgangspositie: Ga met je rug tegen de bank zitten, met een dumbbell in elke hand. Laat je armen recht
  naar de vloer hangen, met je handpalmen naar voren (supinatiegreep).

  Curl: Houd je bovenarmen stil en je schouders tegen de bank. Adem uit en buig je ellebogen om de gewichten
  naar je schouders te brengen.

  Bovenaan: Span je biceps krachtig aan en voorkom dat je ellebogen naar voren bewegen.

  Laat de dumbbells langzaam en gecontroleerd terugzakken naar de beginpositie terwijl je inademt; voel
  de rek in je biceps.'
