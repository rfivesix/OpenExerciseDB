name: Staande overhead press met halterstang
description: Sta met je voeten op heupbreedte en pak de stang iets breder dan schouderbreedte
  vast. Laat hem op je bovenborst en voorste schouders rusten. Span je romp aan en
  druk de stang recht omhoog tot je armen gestrekt zijn; laat hem beheerst terugzakken
  naar je bovenborst.
