name: Clean and press met halter
description: Bij deze oefening til je een halter vanaf de vloer naar je schouders en duw je hem vervolgens
  boven je hoofd. Het is een samengestelde beweging die meerdere spiergroepen aanspreekt, waaronder benen,
  rug, schouders en armen. De oefening wordt vaak gebruikt in kracht- en conditieprogramma’s om het totale
  vermogen en de atletische prestaties te verbeteren.
