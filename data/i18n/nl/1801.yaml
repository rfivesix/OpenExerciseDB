name: Volledige squat met halterstang
description: 'Haal de halter uit het rek met de stang hoog op je trapezius. Zet twee stappen naar achteren
  en plaats je voeten op of iets breder dan schouderbreedte, met je tenen 15–30 graden naar buiten. Adem
  diep in je buik om je rompdruk op te bouwen en houd je borst omhoog.


  1. Buig heupen en knieën tegelijk en beweeg je knieën in lijn met je tenen naar buiten.

  2. Zak vloeiend voorbij parallel tot een diepe squat, met je romp rechtop en hielen op de vloer.

  3. Pauzeer kort zonder uit de onderste positie te stuiteren en duw vanuit je hele voet terug naar stand.

  4. Adem bovenaan uit en span opnieuw aan voor de volgende herhaling.


  De bron zegt dat volledige diepte quadriceps, adductoren en gluteus maximus meer aanspreekt. Zak alleen
  zo diep als je je wervelkolom neutraal kunt houden, zonder sterke bekkenkanteling.'
