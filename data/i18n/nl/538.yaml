name: Schuine bench press met halterstang
description: 'Ga op de schuine bank zitten met je voeten stevig op de vloer voor stabiliteit en je hoofd tegen de
  bank. Haal de halterstang met een greep iets breder dan schouderbreedte uit het rek en duw hem omhoog. Laat de
  stang zakken tot deze je borst kort raakt en duw het gewicht weer omhoog. Voer de beweging langzaam uit (tempo:
  4010).'
