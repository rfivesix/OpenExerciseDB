name: Brug achterwaarts
description: Ga op de vloer liggen met je rug op de grond, je benen gebogen en je voeten plat op de vloer,
  ongeveer 20 cm van je billen. Houd je handen plat op de vloer naast je oren met je vingers naar je tenen
  gericht; je ellebogen zijn gebogen en wijzen naar het plafond. Dit is de startpositie. Duw je heupen
  zo hoog mogelijk en til je lichaam van de vloer. Duw verder via je handen en strek je ellebogen en knieën
  tot je rug volledig gebogen is in een brug. Je hoofd komt ook van de vloer, komt ter hoogte van je ellebogen
  en kijkt naar achteren. Dit is de eindpositie. Laat jezelf langzaam en gecontroleerd zakken. Houd je
  wervelkolom bol en goed gerond; til je rug niet recht van de vloer. Na het optillen staan je heupen
  hoog, zelfs boven je hoofd. Houd armen en benen gestrekt. Deze oefening vraagt volgens de bron veel
  lenigheid. Adem diep en houd je adem niet in. De houding rekt de ribbenkast en zet druk op het middenrif.
