name: Plank
description: 'Ga op de vloer liggen en steun op je onderarmen en tenen. Je armen zijn gebogen en staan
  recht onder je schouders.

  Houd je lichaam steeds in een rechte lijn en houd deze positie zo lang mogelijk vast. Om de oefening
  zwaarder te maken, kun je tijdens het vasthouden een arm of been optillen.'
