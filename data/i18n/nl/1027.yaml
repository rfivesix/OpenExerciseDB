name: Verhoogde gebedshouding-stretch
description: Kniel voor een vlakke bank of verhoging. Plaats beide ellebogen ongeveer op schouderbreedte
  op de rand en druk de handpalmen tegen elkaar in gebedshouding (of houd een lichte stok vast). Duw de
  heupen naar achteren en laat de borst richting de vloer zakken, met het hoofd tussen de bovenarmen.
  Buig de ellebogen en breng de handen naar de nek of bovenrug. Houd de stretch in brede rugspieren, triceps
  en borstwervelkolom 20–40 seconden aan terwijl je langzaam en diep ademt; kom er rustig uit.
