name: Foamroller voor bilspieren
description: 'Beginpositie: Ga op de foamroller zitten. Kruis één enkel over de andere knie in een figure-fourpositie
  en verplaats je gewicht iets naar de gekruiste zijde. Steun met je handen achter je.


  Uitvoering: Rol langzaam en gecontroleerd over je bilspieren en buitenste heup.


  Tips: Pauzeer 15–20 seconden op gevoelige plekken (triggerpoints zoals de piriformis) en blijf rustig
  ademen. Wissel daarna van kant.'
