name: Liggende beenheffing
description: De beenheffing is een krachtoefening voor de iliopsoas (de voorste heupbuigers). Omdat de
  buikspieren tijdens de beweging isometrisch werken om het lichaam te stabiliseren, wordt de oefening
  ook gebruikt om de rechte buikspier en de interne en externe schuine buikspieren te versterken.
