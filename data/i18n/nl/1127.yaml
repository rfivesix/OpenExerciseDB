name: Lat pulldown met smalle onderhandse greep
description: Ga bij de lat pulldown zitten met de dijen onder de kussens. Pak de stang smal onderhands,
  op of iets smaller dan schouderbreedte, handpalmen naar je toe. Houd de romp rechtop met natuurlijke
  holling en borst omhoog. Trek de stang soepel naar de bovenborst, ellebogen omlaag en iets naar achteren
  langs de zij. Span de brede rugspieren aan, pauzeer kort en laat de stang gecontroleerd omhoog tot de
  armen gestrekt zijn.
