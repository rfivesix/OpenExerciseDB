name: Russian twist met medicinebal
description: Ga zitten met gebogen knieën; voeten raken licht de vloer of zijn opgetild voor meer uitdaging.
  Houd de medicinebal voor de borst en leun met rechte rug ongeveer 45 graden achterover. Span de romp
  aan en draai soepel naar rechts, bal naast de rechterheup richting vloer. Draai via het midden naar
  links. Houd heupen en benen zo stil mogelijk en laat de draai uit de borstkas en schuine buikspieren
  komen.
