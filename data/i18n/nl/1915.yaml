name: Quadruped heupabductie (fire hydrant)
description: Begin op handen en knieën met je handen onder je schouders en knieën
  onder je heupen. Een miniband boven je knieën is optioneel. Houd je rug stabiel
  en span je romp aan. Til één gebogen been zijwaarts op tot de dij ongeveer evenwijdig
  aan de vloer is. Houd je bekken recht, laat de knie gecontroleerd zakken zonder
  erop te rusten en wissel na de herhalingen van kant.
