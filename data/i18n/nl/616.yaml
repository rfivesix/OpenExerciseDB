name: Squat thrust
description: 'De burpee, of squat thrust, is een oefening voor het hele lichaam die wordt gebruikt bij krachttraining
  en als aerobe oefening. De basisbeweging bestaat uit vier stappen en heet een burpee in vier tellen: begin rechtop;
  zak naar een squat en zet je handen op de vloer (tel 1); spring met je voeten naar achteren in een plank terwijl
  je armen gestrekt blijven (tel 2); breng je voeten direct terug naar de squatpositie (tel 3); kom vanuit de squat
  weer rechtop staan (tel 4).'
