name: Schouderrotaties met halterschijf
description: Ga rechtop op een bank of de vloer zitten en houd een gewichtsschijf met beide handen vast
  op de posities van 9 en 3 uur. Strek je armen naar voren met je ellebogen licht gebogen en houd de schijf
  net onder ooghoogte. Draai de schijf gecontroleerd van links naar rechts als een stuur, waarbij de ene
  hand steeds bovenaan komt en daarna de andere. Houd je armen op schouderhoogte en je romp gedurende
  de hele set aangespannen.
