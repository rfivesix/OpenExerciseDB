name: Eenbenige glute bridge (unilaterale hip thrust)
description: Ga op je rug liggen, buig één knie en zet die voet dicht bij je bil op
  de vloer. Strek het andere been in lijn met je dij of omhoog. Duw via de hiel je
  heupen omhoog tot romp en dij één lijn vormen. Span je bilspier kort aan, laat gecontroleerd
  zakken zonder helemaal te rusten en herhaal. Houd je heupen horizontaal; wissel
  na alle herhalingen van kant.
