name: Foamrollen van de IT-band
description: Ga op je zij liggen met een foamroller onder de buitenkant van je dij,
  net onder je heup. Steun op je onderarmen en kruis je bovenste been voor je met
  de voet op de vloer om de druk te regelen. Rol langzaam van onder je heup tot net
  boven je knie. Pauzeer enkele ademhalingen op gevoelige plekken en doe 10–15 passages
  per kant. Rol niet rechtstreeks over knie of heupbot.
