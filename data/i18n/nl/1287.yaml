name: Omhoog reiken
description: Ga op je rug liggen met je armen boven je hoofd gestrekt. Span je buikspieren aan en til
  je romp van de vloer terwijl je je armen naar het plafond reikt, zo hoog mogelijk. Keer langzaam en
  gecontroleerd terug naar de beginpositie. Reach-ups versterken de buikspieren en verbeteren de flexibiliteit
  van de wervelkolom. Je kunt ze opnemen in verschillende trainingsroutines voor romp kracht en stabiliteit.
