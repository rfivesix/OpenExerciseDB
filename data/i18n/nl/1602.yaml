name: Scaption met dumbbells
description: 'Beginpositie:

  Sta rechtop met je voeten op schouderbreedte. Houd in elke hand een dumbbell vast met een neutrale greep
  (handpalmen naar elkaar). Houd je ellebogen licht gebogen, je schouders ontspannen en je schouderbladen
  naar achteren.


  Uitvoering:

  Hef de dumbbells langzaam schuin naar voren, ongeveer 30 tot 45 graden vóór je zijwaartse lijn, tot
  schouderhoogte. Laat de gewichten gecontroleerd zakken.


  Aandachtspunten:

  Houd je romp stabiel en trek je schouders niet op richting je oren.'
