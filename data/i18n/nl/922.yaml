name: Zittende cable shrug voor middelste trapezius
description: 'Beginpositie: ga rechtop zitten bij een cable row-station en plaats je voeten tegen de steunen.
  Pak het kabelhulpstuk met gestrekte armen voor je vast. Uitvoering: trek zonder je ellebogen te buigen
  je schouderbladen recht naar achteren en naar elkaar toe. Span je middelste trapezius en rhomboïden
  1–2 seconden stevig aan. Terugkeer: laat je schouderbladen langzaam en gecontroleerd naar voren bewegen.
  Aanwijzingen: houd je romp stil en rechtop; leun niet achterover om het gewicht te verplaatsen.'
