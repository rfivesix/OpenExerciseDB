name: Zittende schouderextensiestretch
description: 'Beginpositie: Ga op de vloer zitten met je handen ongeveer op schouderbreedte achter je,
  vingers naar achteren of iets naar buiten.


  Uitvoering: Houd je armen gestrekt en schuif je heupen en voeten naar voren, zodat je schouders in extensie
  komen tot je een comfortabele rek voelt in de voorste deltaspieren en borst.


  Tips: Ga alleen zo ver als comfortabel is en zonder pijn. Houd de rek 20–30 seconden vast terwijl je
  rustig ademt.'
