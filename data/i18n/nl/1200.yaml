name: Tibialisheffingen
description: 'Startpositie:

  • Leun met je rug plat tegen een muur.

  • Zet je voeten ongeveer 30 tot 60 cm naar voren en houd je benen gestrekt; je hielen blijven op de
  vloer.


  Uitvoering:

  • Trek je tenen en de bal van je voet zo hoog mogelijk naar je schenen.

  • Span de tibialis anterior bovenaan 1 tot 2 seconden aan.

  • Laat je voeten langzaam en gecontroleerd zakken tot ze zacht de vloer raken.'
