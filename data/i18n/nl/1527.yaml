name: Pendulum squat
description: 'Startpositie:

  Stap op het platform van de pendulum squatmachine. Plaats je schouders stevig tegen de kussens en je
  voeten op schouderbreedte in het midden van het voetplateau. Ontgrendel de veiligheidspal en span je
  core aan.


  Uitvoering:

  1. Buig je knieën en heupen en zak in een diepe squat langs de ronde baan van de machine.

  2. Wanneer je bovenbenen diep staan en je quadriceps volledig zijn gerekt, duw je via je middenvoet
  en hielen omhoog.

  3. Keer terug naar de beginpositie zonder je knieën bovenaan krachtig op slot te zetten.'
