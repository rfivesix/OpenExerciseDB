name: Kettlebellcurl met één hand
description: Sta rechtop met de voeten op heup- tot schouderbreedte. Houd een kettlebell aan het handvat
  in één hand naast je, met de arm gestrekt. Buig je elleboog om het gewicht naar schouderhoogte te brengen;
  houd je pols stabiel en je rug neutraal. Laat gecontroleerd zakken en wissel na alle herhalingen van
  kant. Houd je elleboog dicht bij je romp en draai of leun niet.
