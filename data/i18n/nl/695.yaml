name: Lat pulldown met V-greep
description: Bevestig een smalle V-greep aan het lat-pulldownstation en stel de dijsteun af om je benen
  vast te zetten. Pak de handgrepen met de handpalmen naar elkaar vast en zit rechtop met je borst omhoog.
  Trek de greep soepel naar je bovenborst en beweeg je ellebogen omlaag, dicht langs je ribben. Span onderaan
  je lats aan en breng de greep langzaam en gecontroleerd terug tot je armen volledig gestrekt zijn.
