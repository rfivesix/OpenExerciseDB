name: Reverse fly op incline bank
description: Ga met je borst op een incline bank van 30–45 graden liggen en houd in elke hand een dumbbell,
  met je armen omlaag en je handpalmen naar elkaar gericht. Houd je ellebogen licht gebogen en hef de
  dumbbells in een brede boog zijwaarts tot je bovenarmen op schouderhoogte zijn. Span bovenaan je achterste
  schouders en bovenrug stevig aan. Laat de dumbbells langzaam en gecontroleerd zakken zonder momentum
  te gebruiken.
