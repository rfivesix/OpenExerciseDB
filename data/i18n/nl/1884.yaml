name: Shinbox-stretch voor heuprotatie naar binnen
description: Ga op de vloer zitten met beide heupen en knieën ongeveer 90 graden gebogen. Plaats één been
  voor je in buitenwaartse rotatie en het andere opzij of achter je in binnenwaartse rotatie; houd knieën
  en scheenbenen op de grond. Houd je heupen recht en buig je romp voorover of zijwaarts naar het voorste
  been.
