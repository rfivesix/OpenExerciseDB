name: Face pull met lichaamsgewicht aan een deurpost
description: 'Startpositie:

  Sla een stevige badhanddoek om een veilige deurpost of verticale paal. Pak de uiteinden stevig met beide
  handen vast. Loop met je voeten naar de voet van de deurpost en leun met gestrekte armen achterover,
  zodat je lichaam een stevige plank vormt.


  Uitvoering:

  1. Trek je gezicht naar de handdoek door je ellebogen hoog en breed naar buiten te bewegen.

  2. Draai bovenaan je handen terug tot naast je oren en span je achterste schouderspieren en schouderbladtrekkers
  1 seconde stevig aan.

  3. Laat je lichaam langzaam en gecontroleerd zakken tot je armen volledig gestrekt zijn.


  Aandachtspunten:

  Zet je voeten verder naar voren om de weerstand te verhogen. Houd je ellebogen ter hoogte van je oren
  om de achterste schouderspieren en bovenrug te trainen.'
