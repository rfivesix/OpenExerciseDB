name: Legend incline bench press
description: 'Ga op de schuine bank van de Legend Fitness LeverEdge-machine zitten. Stel de zitting zo
  af dat de samenkomende handgrepen op comfortabele hoogte bij je bovenborst staan. Houd je hoofd, bovenrug
  en billen tegen de rugleuning en zet je voeten plat op de vloer. Pak de handgrepen bovenhands vast.


  1. Duw de onafhankelijke hefarmen omhoog en naar binnen langs hun samenkomende baan tot je armen bijna
  gestrekt zijn.

  2. Span je bovenborst (claviculaire deel) bovenaan aan.

  3. Laat het gewicht langzaam en gecontroleerd zakken en voel de rek over je borstspieren voor de volgende
  herhaling.


  Houd je schouderbladen tijdens de hele drukbeweging naar achteren en omlaag tegen de leuning.'
