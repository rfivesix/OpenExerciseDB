name: Schuin bankdrukken met smalle greep
description: 'Startpositie:

  Ga op een bank liggen die ongeveer 30–45° omhoog staat. Pak de halter bovenhands vast, ongeveer op schouderbreedte.
  Haal de stang uit het rek en houd hem met gestrekte armen boven je bovenborst.


  Uitvoering:

  1. Laat de stang gecontroleerd naar je bovenborst of onderkant van je nek zakken, met je ellebogen dicht
  bij je romp (ongeveer 30–45°).

  2. Duw de stang omhoog door je ellebogen te strekken; richt de inspanning op je triceps en bovenste
  borstspieren.

  3. Strek je armen bovenaan zonder je ellebogen te overstrekken en herhaal.


  Aandachtspunten:

  Gebruik geen extreem smalle greep. Ellebogen dicht bij je zij houden vergroot de belasting van de triceps.'
