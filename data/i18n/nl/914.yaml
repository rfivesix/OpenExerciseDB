name: Reverse cable curl met EZ-stang
description: Bevestig een EZ-curlstang aan de lage kabelkatrol en ga voor de machine staan. Pak de stang
  met een bovenhandse greep op de binnenste bochten vast. Houd je ellebogen dicht tegen je zij en curl
  de stang omhoog tot je onderarmen je borst naderen. Laat de stang langzaam en volledig gecontroleerd
  zakken naar de beginpositie en houd spanning op je onderarmen en brachialis.
