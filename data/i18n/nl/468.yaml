name: Buiklig, schouderbladen naar elkaar trekken met armen langs het lichaam
description: 'Ga op je buik liggen met je hoofd op een handdoek.

  Strek je armen recht naar opzij.

  Hef je armen langzaam terwijl je je schouderbladen naar elkaar toe trekt en houd dit 3 seconden vast.'
