name: Shotgun row
description: 'Bevestig één handgreep aan een lage kabel.

  Kies het juiste gewicht en ga een paar stappen naar achteren staan met je voeten breed en versprongen. Je arm
  is gestrekt en je schouder naar voren gebracht. Dit is de startpositie.

  Voer de beweging uit door je schouderbladen naar achteren te trekken en je elleboog te buigen. Draai tijdens het
  trekken je pols naar buiten, zodat je handpalm omhoog komt.

  Pauzeer kort en keer terug naar de startpositie.'
