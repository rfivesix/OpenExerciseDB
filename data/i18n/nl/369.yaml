name: Leg extension
description: De leg extension is een oefening met weerstand voor de quadriceps. Je voert de oefening uit
  op een legextensionmachine; de verschillende modellen kunnen van elkaar verschillen. Het is een isolatieoefening
  voor de quadriceps en geen volledige beentraining zoals een squat of deadlift. Buig je knieën, strek
  je benen en laat ze daarna terugzakken naar de beginpositie.
