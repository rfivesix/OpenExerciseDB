name: Levitation crunch
description: Bij deze beweging beweeg je je bovenlichaam zonder je onderlichaam te verplaatsen. Ga op
  de grond liggen met je voeten plat op de vloer, je armen boven je hoofd gekruist en je handen achter
  je hoofd. Til je bovenlichaam op tot je schouderbladen van de vloer komen en pauzeer één of twee tellen
  bovenaan. Probeer je bovenste buikspieren aan te spannen en houd de contractie vast gedurende 10 gecontroleerde
  herhalingen.
