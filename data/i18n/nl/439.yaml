name: Kabelcurl met bovenhandse greep
description: Ga voor een kabelkatrol staan die op schouder- of borsthoogte is ingesteld. Pak het handvat
  met een bovenhandse greep vast. Houd je bovenarmen evenwijdig aan de vloer en buig je ellebogen om het
  handvat naar je gezicht of bovenborst te brengen. Span daarbij de brachioradialis en onderarmspieren
  aan. Strek je armen langzaam onder spanning terug naar de beginpositie.
