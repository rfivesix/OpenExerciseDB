name: Dumbbell spider curl
description: Ga met je borst op een schuine bank van ongeveer 45 graden liggen en
  steun je tenen op de vloer. Houd dumbbells onderhands vast met je armen verticaal
  omlaag. Buig je ellebogen en curl de dumbbells naar je schouders terwijl je bovenarmen
  stil blijven. Span je biceps bovenaan kort aan en laat de gewichten volledig gecontroleerd
  zakken.
