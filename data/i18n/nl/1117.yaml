name: Zittende kabelroei
description: Ga bij het zittende kabelroeitoestel zitten met voeten op de voetplaten en knieën licht gebogen.
  Buig met rechte rug voorover om het handvat te pakken en kom tot een rechte zithouding. Trek het handvat
  soepel naar buik/onderste ribben, ellebogen dicht bij de romp. Knijp de schouderbladen samen en span
  brede rugspieren en rhomboïden aan. Houd de romp stil; strek de armen langzaam en laat de schouderbladen
  gecontroleerd naar voren glijden.
