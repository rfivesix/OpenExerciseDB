name: Dumbbell cheat curl
description: 'Startpositie:

  Sta rechtop met je voeten op schouderbreedte en houd in elke hand een zware dumbbell met je armen gestrekt
  en je handpalmen naar voren.


  Uitvoering:

  1. Maak een kleine, gecontroleerde heupbeweging om genoeg momentum te creëren om de dumbbells naar je
  schouders te curlen.

  2. Span je biceps bovenaan kort aan.

  3. Laat de gewichten in 3–4 seconden gecontroleerd zakken en weersta de zware belasting tijdens de neerwaartse
  fase.'
