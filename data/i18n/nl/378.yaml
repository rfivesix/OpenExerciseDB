name: Beenheffing in het dipstation
description: Plaats je onderarmen op de kussens van het beenheffingsstation en laat je lichaam vrij hangen.
  Hef je benen snel zo hoog mogelijk, pauzeer bovenaan kort, 1 seconde, en laat ze weer zakken. Zorg dat
  je lichaam niet zwaait; alleen je benen bewegen.
