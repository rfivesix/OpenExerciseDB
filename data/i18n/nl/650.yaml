name: Thruster
description: '- Houd een halterstang in de front-rackpositie voor op je schouders en sta met je voeten op schouderbreedte.

  - Zak in een diepe front squat tot je dijen minstens evenwijdig aan de vloer zijn.

  - Duw explosief omhoog vanuit je hielen en gebruik het momentum van je benen om de halterstang in één vloeiende
  beweging boven je hoofd te drukken.

  - Laat de stang gecontroleerd terugzakken naar je schouders en ga soepel over in de volgende squat.'
