name: Fire-hydrantcirkels
description: Begin op handen en knieën met je handen onder je schouders en knieën
  onder je heupen. Span je romp aan en houd je rug neutraal. Houd de werkende knie
  90 graden gebogen, til hem zijwaarts op en maak een grote soepele cirkel vanuit
  je heup. Maak 10 cirkels naar voren en 10 naar achteren; herhaal met het andere
  been. Draai of kantel je bekken niet.
