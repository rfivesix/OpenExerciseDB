name: Front raise met rechte kabelstang
description: Bevestig een rechte stang aan de lage kabelkatrol. Ga met je rug naar de kabeltoren staan,
  met de kabel tussen je benen. Pak de stang voor je dijen met een bovenhandse greep op schouderbreedte
  vast. Hef de stang recht voor je omhoog met je ellebogen licht gebogen tot schouder- of ooghoogte. Pauzeer
  kort om je voorste schouders aan te spannen en laat de stang langzaam en gecontroleerd zakken zonder
  je heupen te zwaaien.
