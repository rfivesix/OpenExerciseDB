name: Omgekeerde polskrul met halterstang
description: 'Ga op een bank zitten en pak een halterstang vast met je handpalmen omlaag en je handen
  op schouderbreedte. Laat je onderarmen op je dijen rusten en je polsen voorbij je knieën hangen.

  Buig je polsen zodat je knokkels naar je gezicht komen en de stang omhooggaat. Pauzeer kort bovenaan
  en keer langzaam terug naar de beginpositie.'
