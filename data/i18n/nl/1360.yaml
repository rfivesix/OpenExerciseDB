name: Clean en press met twee kettlebells
description: 'Beginpositie:

  Sta met je voeten op schouderbreedte. Plaats twee kettlebells tussen of iets vóór je voeten. Buig vanuit
  je heupen met een rechte rug en pak de handgrepen vast.


  Beweging:

  1. Clean: strek je heupen explosief om de kettlebells omhoog te brengen. Houd ze dicht bij je lichaam
  en vang ze soepel op in de rackpositie op borsthoogte.

  2. Press: span je romp en bilspieren aan en duw beide kettlebells boven je hoofd totdat je ellebogen
  volledig gestrekt zijn.

  3. Laat de kettlebells gecontroleerd terugzakken naar de rackpositie en zwaai ze vervolgens tussen je
  benen omlaag.


  Opmerkingen:

  Leun niet achterover en hol je onderrug niet tijdens de overhead press. Houd je romp gedurende de hele
  oefening aangespannen.'
