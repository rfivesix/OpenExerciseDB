name: Cable fly voor de middelste borst
description: 'Uitvoering


  Beginpositie: Strek je armen zijwaarts in een grote T-vorm en voel de rek in je borst.


  Beweging: Breng je handen in een brede, omhelzende beweging voor je borst bij elkaar. Span je borst
  aan in het midden. Strek je ellebogen niet volledig en maak er geen press van.


  Terugkeer: Open je armen langzaam naar de beginpositie en houd spanning op je borst.'
