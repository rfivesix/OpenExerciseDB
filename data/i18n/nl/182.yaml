name: Dead hang
description: 'Beginpositie:

  Pak een pull-upstang of de rand van een hangbord met een bovenhandse greep op ongeveer schouderbreedte
  vast. Hang vrij met gestrekte armen en je voeten van de vloer.


  Uitvoering:

  1. Houd de stang stevig vast.

  2. Je kunt passief hangen (met volledig ontspannen schouders om de wervelkolom te ontlasten) of actief
  hangen (door je schouderbladen iets omlaag en naar achteren te trekken om de scapulaire stabilisatoren
  aan te spannen).

  3. Houd de hangpositie de voorgeschreven tijd vast.


  Opmerkingen:

  Adem regelmatig en houd je lichaam stil zonder te zwaaien. Pas de moeilijkheid aan door smallere grepen,
  dikkere stangen of extra gewicht te gebruiken.'
