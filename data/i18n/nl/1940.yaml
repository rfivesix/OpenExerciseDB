name: Diafragmatische ademhaling (buikademhaling)
description: Ga comfortabel op je rug liggen, eventueel met gebogen knieën en voeten
  plat. Leg één hand op je borst en één op je bovenbuik onder de ribben. Adem langzaam
  door je neus in en laat je buik uitzetten zodat de buikhand omhoogkomt terwijl de
  borsthand vrijwel stil blijft. Pauzeer 1–2 seconden en adem langzaam uit door neus
  of licht geopende lippen. Herhaal 8–10 rustige ademhalingen en houd nek, schouders
  en kaak ontspannen.
