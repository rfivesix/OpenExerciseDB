name: Knie-naar-borststretch
description: Ga op je rug op een mat liggen met je benen gestrekt en je hoofd ontspannen. Buig één knie
  en pak je scheenbeen of de achterkant van je dij met beide handen vast. Trek je knie voorzichtig naar
  je borst tot je een comfortabele rek in je bilspieren en onderrug voelt. Houd je andere been ontspannen
  en gestrekt op de vloer. Houd 20 tot 30 seconden vast, adem rustig en herhaal met het andere been. Je
  kunt ook beide knieën tegelijk naar je borst trekken.
