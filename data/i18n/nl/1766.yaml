name: Plank reach
description: 'Neem een plankhouding op je onderarmen aan, met je ellebogen recht onder je schouders, onderarmen
  parallel en voeten iets wijder dan heupbreedte voor stabiliteit. Span je core en bilspieren aan zodat
  je lichaam één rechte lijn vormt van hoofd tot hielen.


  1. Til één arm langzaam van de vloer en strek hem op schouderhoogte recht voor je uit.

  2. Houd 1–2 seconden vast en voorkom dat je heupen draaien of kantelen.

  3. Plaats je onderarm gecontroleerd terug en herhaal met de andere arm. Wissel af.


  Houd je heupen en schouders recht naar de vloer gericht.'
