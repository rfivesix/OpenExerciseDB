name: Laterale raise met kabel
description: 'Beginpositie: Sta zijwaarts naast een lage kabelkatrol. Pak de enkele handgreep met de hand
  aan de andere kant, vóór je lichaam langs. Houd je borst omhoog en je elleboog licht gebogen.


  Beweging:

  1. Til de handgreep zijwaarts omhoog, leid met je elleboog, tot je arm op schouderhoogte parallel aan
  de vloer is.

  2. Pauzeer kort bovenaan om de samentrekking van de laterale deltaspier te benadrukken.

  3. Laat het gewicht langzaam en gecontroleerd zakken naar de beginpositie.


  Tips: Trek je schouders niet op en gebruik geen momentum uit je romp. De kabel geeft gedurende de hele
  beweging een gelijkmatige spanning.'
