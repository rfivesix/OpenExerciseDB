name: Roeien met halterstang, borst gesteund op bank
description: 'Startpositie: Ga met je gezicht naar beneden op een vlakke, verhoogde bank liggen. Pak de halterstang
  onder de bank vast met een bovenhandse greep op schouderbreedte.

  Uitvoering: Trek de stang naar je romp door je ellebogen naar achteren te bewegen en je schouderbladen samen te
  knijpen.

  Terugkeer: Laat de stang gecontroleerd zakken tot je armen volledig gestrekt zijn.

  Aandachtspunten: De bank ondersteunt je romp, ontlast de wervelkolom en maakt een geïsoleerde beweging van de
  brede rugspier, ruitvormige spieren en bovenrug mogelijk.'
