name: Nekcirkels tegen de klok in
description: 'Ga rechtop zitten of staan, ontspan je schouders en breng je kin licht naar je borst. Rol
  je hoofd langzaam tegen de klok in: naar je linkerschouder, voorzichtig naar achteren, naar je rechterschouder
  en terug naar je borst. Beweeg soepel en ontspannen zonder je nek te overstrekken.'
