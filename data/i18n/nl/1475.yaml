name: Black Widow knieschuiven
description: 'Startpositie:

  Begin in een hoge plank met je handen direct onder je schouders, vingers gespreid en je lichaam in een
  rechte lijn van hoofd tot hielen.


  Uitvoering:

  1. Breng één knie onder je romp door naar de tegenoverliggende elleboog.

  2. Schuif de knie langs je onderarm omhoog en kantel je bekken achterwaarts om je schuine buikspieren
  en rechte buikspier stevig aan te spannen.

  3. Breng je been gecontroleerd terug naar de plank.

  4. Herhaal aan de andere kant en wissel vloeiend af.


  Aandachtspunten:

  Laat je onderrug niet doorzakken en draai je heupen niet te ver; houd je core aangespannen.'
