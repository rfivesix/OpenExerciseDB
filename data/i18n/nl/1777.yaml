name: Deficit push-ups
description: 'Leg twee gewichtsschijven, yogablokken of push-upgrepen iets wijder dan schouderbreedte
  op de vloer. Zet je handen op de verhogingen en neem een stevige plankhouding aan met je voeten bij
  elkaar en core aangespannen.


  1. Laat je lichaam gecontroleerd zakken door je ellebogen ongeveer 45 graden ten opzichte van je romp
  te buigen.

  2. Zak onder handhoogte in de extra bewegingsuitslag tot je een diepe maar comfortabele rek in je borstspieren
  voelt.

  3. Duw via je handpalmen terug naar de hoge plank en strek je armen.


  De verhoging vergroot de bewegingsuitslag. Houd je core stevig en zak alleen zo diep als je schouders
  comfortabel toelaten.'
