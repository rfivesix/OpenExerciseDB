name: Clean en press
description: Trek de stang vanaf de vloer tot kniehoogte door je benen te strekken
  en houd de hoek van je rug gelijk. Wanneer de stang halverwege je dijen is, strek
  je explosief je heupen en trek je je schouders op. Draai je ellebogen snel onder
  de stang zodat deze op je voorste schouders rust. Druk de stang recht omhoog; beweeg
  je hoofd iets naar voren zodra de stang je voorhoofd passeert.
