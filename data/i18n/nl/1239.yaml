name: Kuitstretch staand
search_terms:
- "Kuitstretch tegen de muur"
- "Staande gastrocnemiusstretch"
description: 'Startpositie:

  • Sta op ongeveer armlengte van een muur met je gezicht naar de muur en je handen op schouderhoogte
  ertegen.

  • Zet één been recht naar achteren in een gespreide stand.


  Uitvoering:

  • Houd je achterste been volledig gestrekt en de hiel stevig plat op de vloer.

  • Buig je voorste knie en beweeg je heupen voorzichtig naar de muur tot je een diepe rek in je achterste
  kuit voelt.

  • Houd 20 tot 30 seconden vast terwijl je rustig ademt en wissel dan van been.'
