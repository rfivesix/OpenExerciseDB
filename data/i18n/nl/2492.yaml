name: Heupadductie op machine, zittend
description: 'Startpositie:

  Ga recht in de heupadductiemachine zitten met je rug tegen de rugleuning. Stel de hendels in op een
  comfortabele openingsstand zodat de kussens tegen de binnenkant van je knieën en bovenbenen rusten.


  Uitvoering:

  1. Knijp je bovenbenen tegen de kussens samen tot ze in het midden bij elkaar komen.

  2. Houd de aanspanning 1–2 seconden vast en richt je aandacht op de adductoren aan de binnenkant van
  je bovenbenen.

  3. Laat de kussens langzaam en gecontroleerd naar de startpositie terugkeren en voel een lichte rek
  voor de volgende herhaling.


  Aandachtspunten:

  Beheers de neerwaartse fase zorgvuldig en houd je heupen op de zitting.'
