name: Bulgaarse split squat (links)
description: Sta ongeveer 60 cm voor een stevige bank of stoel. Leg de bovenkant van je rechtervoet achter
  je op de bank en zet je linkervoet stevig voor je neer. Buig je linkerknie en laat je heupen zakken
  tot je linkerbovenbeen ongeveer parallel aan de vloer is en je rechterknie net boven de vloer hangt.
  Duw via de hiel en middenvoet van je linkerbeen terug omhoog. Houd je rug vlak en laat je voorste knie
  niet naar binnen vallen.
