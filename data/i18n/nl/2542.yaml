name: Bokstraining
description: 'Beginpositie: Neem een gebalanceerde bokshouding aan voor een bokszak of op een open plek
  (orthodox: linkervoet voor; southpaw: rechtervoet voor). Houd je knieën licht gebogen, veer licht op
  de bal van je voeten, houd je handen ter bescherming van je kin omhoog en je ellebogen dicht bij je
  ribben.


  Uitvoering: Maak ritmische, explosieve stootcombinaties met jabs, directen, hoeken en opstoten tegen
  de bokszak of in de lucht (shadowboxing). Draai bij elke stoot je heupen, schouders en romp om kracht
  op te bouwen via de kinetische keten. Blijf actief bewegen: cirkel om de zak, pivot en keer na elke
  combinatie meteen terug naar je verdedigende houding.


  Aanwijzingen: Wikkel je handen altijd in en draag geschikte bokshandschoenen wanneer je een bokszak
  raakt. Houd je polsen bij de impact recht en adem bij elke stoot scherp uit.'
