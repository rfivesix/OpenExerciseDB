name: Langzame squat
description: 'Een squat op tempo, waarbij gecontroleerde beweging de spierspanning verhoogt en de stabiliteit
  van het onderlichaam verbetert.


  Omlaag: zak langzaam in 3 seconden.

  Pauze: houd de onderste positie 1 seconde vast.

  Omhoog: keer in een normaal tempo terug naar de startpositie.

  Houding: houd je borst omhoog en je gewicht op je hielen.'
