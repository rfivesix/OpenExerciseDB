name: Houthakker aan de kabel
description: Stel de kabelkatrol iets lager in dan borsthoogte. Blijf naar voren gericht en houd je heupen
  stabiel. Pak de handgreep vast, strek je armen volledig en beweeg ze naar voren en schuin voor je lichaam
  langs. Houd de eindpositie één seconde vast en keer langzaam terug naar de beginpositie.
