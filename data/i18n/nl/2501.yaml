name: Omgekeerde tafelroeibeweging
description: 'Startpositie:

  Ga op je rug onder een zware, stevige tafel liggen. Pak de tafelrand met een bovenhandse of neutrale
  greep iets wijder dan schouderbreedte vast. Laat je hielen op de vloer rusten en span je romp en bilspieren
  aan zodat je lichaam een stevige horizontale plank vormt.


  Uitvoering:

  1. Trek je borst naar de onderkant van de tafel door je ellebogen naar achteren te bewegen.

  2. Knijp bovenaan je schouderbladen stevig samen en pauzeer 1 seconde.

  3. Laat jezelf gecontroleerd zakken tot je armen volledig gestrekt zijn.


  Aandachtspunten:

  Controleer vóór je begint of de tafel volledig stabiel is. Buig zo nodig je knieën en zet je voeten
  plat neer om de weerstand te verlagen.'
