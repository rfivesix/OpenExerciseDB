name: Isometrische overhead cable press
description: 'Beginpositie: Ga midden tussen lage kabelkatrollen staan met enkelvoudige handgrepen, of
  voor een lage dubbele kabeltoren. Breng de handgrepen met een bovenhandse greep naar schouderhoogte
  en houd je ellebogen recht onder je polsen. Zet je voeten op schouderbreedte en span je romp en bilspieren
  stevig aan.


  Uitvoering: Duw de kabelhandgrepen omhoog tot je handen op voorhoofdhoogte zijn of net voor volledige
  strekking boven je hoofd. Houd deze positie gedurende de voorgeschreven tijd volledig stil tegen de
  constante kabelspanning en span je voorste deltaspieren en triceps maximaal aan. Laat de handgrepen
  na afloop langzaam en gecontroleerd terugzakken tot schouderhoogte.


  Aanwijzingen: Houd je ribben laag en hol je onderrug niet. De constante trekkracht vanuit meerdere richtingen
  vraagt tijdens de isometrische hold veel stabiliteit van je schouders en romp.'
