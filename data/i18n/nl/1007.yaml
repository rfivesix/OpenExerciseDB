name: Hoofd draaiingen
description: 'Beginpositie:

  Zit of sta met je rug recht en schouders naar beneden.

  Stappen:


  Zit of sta rechtop, schouders omlaag.

  Draai uw hoofd zo ver mogelijk opzij. Stop wanneer je een barrière raakt en houd 5 seconden vast.

  Keer terug naar de middenpositie en herhaal, waarbij u van kant wisselt.'
