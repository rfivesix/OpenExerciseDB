name: Heupflexorstretch met verhoogde achtervoet
description: Neem een halfknielende positie voor een bank, box of muur en plaats de
  bovenkant van je achterste voet verhoogd tegen het oppervlak; leg eventueel een
  mat onder je knie. Zet je voorste voet neer met de knie op 90 graden. Houd je romp
  verticaal, kantel je bekken naar achteren en span de bilspier van het achterste
  been aan. Beweeg je heupen voorzichtig naar voren tot je rek voelt aan de voorkant
  van heup en dij. Houd 3 seconden vast en doe 5–10 dynamische herhalingen per kant.
