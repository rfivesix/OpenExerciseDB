name: Zittende kabelroeibeweging met V-greep
description: 'Startpositie:

  Ga op de zitting van het lage kabelstation zitten en bevestig een driehoekige V-greep. Zet je voeten
  stevig neer en houd je rug recht.


  Uitvoering:

  1. Trek de handgreep naar je onderbuik en navel door je ellebogen dicht langs je zij naar achteren te
  bewegen.

  2. Trek bovenaan je schouderbladen krachtig naar elkaar toe en houd 1 seconde vast.

  3. Strek je armen langzaam en gecontroleerd naar voren, weersta de gewichtstapel en laat je lats volledig
  rekken.


  Aandachtspunten:

  Zwaai je romp niet naar achteren om het gewicht omhoog te trekken. Houd je romp rechtop en aangespannen.'
