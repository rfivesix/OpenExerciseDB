name: Ademhaling met zijwaartse kick en kickboard
description: 'Startpositie:

  Zet je op je zij af van de wand. Strek je onderste arm naar voren en houd daarin een kickboard; leg
  je bovenste arm langs je zij en heup.


  Uitvoering:

  1. Blijf continu flutterkicken en houd je lichaam in evenwicht op je zij.

  2. Houd je hoofd neutraal met je gezicht naar de bodem van het zwembad.

  3. Wanneer je lucht nodig hebt, draai je je hoofd iets naar het plafond om in te ademen, terwijl je
  onderste oor op je arm in het water blijft rusten.

  4. Draai je gezicht terug naar het water en herhaal, terwijl je de kick aanhoudt.


  Aandachtspunten:

  Houd je lichaam op zijn zij en je heupen hoog tijdens het ademen.'
