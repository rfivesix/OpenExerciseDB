name: Zijwaartse buigingen op de Romeinse stoel
description: 'Startpositie: Plaats jezelf zijwaarts op een Romeinse stoel of hyperextensiebank van 45°, met je heup
  op het kussen en je voeten stevig vastgezet.

  Uitvoering: Laat je romp zijwaarts naar de vloer zakken tot je lichaam ongeveer evenwijdig aan de vloer is of
  je rek in je schuine buikspieren voelt.

  Terugkeer: Span je bovenste schuine buikspieren aan om je romp terug te brengen naar de rechte startpositie.

  Aandachtspunten: Houd je handen voor je borst gekruist of achter je hoofd en draai je romp niet naar voren of
  achteren.'
