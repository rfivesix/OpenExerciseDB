name: Heupabductie op machine, zittend
description: 'Startpositie:

  Ga stevig in de heupabductiemachine zitten met je rug tegen de rugleuning. Stel de beenkussens zo af
  dat ze comfortabel tegen de buitenkant van je knieën of bovenbenen rusten. Zet je voeten op de voetsteunen.


  Uitvoering:

  1. Duw je benen tegen de weerstand van de kussens naar buiten, zover als je bewegingsruimte comfortabel
  toelaat.

  2. Houd de abductie bovenaan 1–2 seconden vast en span je buitenste bilspieren (middelste en kleine
  bilspier) stevig aan.

  3. Breng je knieën langzaam en volledig gecontroleerd terug naar elkaar zonder de gewichtstapel neer
  te laten slaan.


  Aandachtspunten:

  Houd je romp tegen de rugleuning en leun niet voorover of gebruik geen momentum.'
