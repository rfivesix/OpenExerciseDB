name: Trap-3 raise
description: 'Beginpositie: Buig ongeveer 45° vanuit je heupen met een rechte rug en licht gebogen knieën.
  Steun met één hand op je knie of een schuine bank. Laat je werkarm recht omlaag hangen met je duim omhoog.
  Trek je schouderblad actief omlaag en naar achteren.


  Uitvoering:

  1. Houd je elleboog gestrekt en til je arm schuin naar voren en omhoog tot je hand ongeveer 15–30° boven
  je hoofd is.

  2. Houd je schouderblad omlaag, weg van je oor, om de onderste trapezius (Trap 3) te isoleren.

  3. Pauzeer 1–2 seconden bovenaan en voel de aanspanning in je midden- en onderrug.

  4. Laat je arm soepel en gecontroleerd zakken.


  Aanwijzing: Trek je bovenste trapezius niet naar je oor; het doel is de onderste trapezius en opwaartse
  rotatie van het schouderblad te activeren.'
