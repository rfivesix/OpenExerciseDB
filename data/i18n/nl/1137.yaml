name: Cable pullover vanaf hoge katrol
description: Sta met voeten op schouderbreedte voor een hoge kabelkatrol. Pak de stang bovenhands op schouderbreedte;
  armen bijna gestrekt en ellebogen licht ontgrendeld. Buig licht vanuit de heupen met rechte rug en aangespannen
  romp. Trek de stang in een brede boog met de brede rugspieren naar de bovenbenen, armen gestrekt. Span
  onderaan kort aan en laat de stang beheerst langs dezelfde boog terugkomen tot ooghoogte.
