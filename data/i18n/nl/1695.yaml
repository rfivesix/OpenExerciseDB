name: Pull-up met brede greep
description: 'Trekkende fase (concentrisch): Duw je ellebogen omlaag en iets naar achteren en trek je
  borst naar de stang. Leid de beweging met je borst, niet met je kin. Houd je schouders laag en trek
  ze niet op.


  Bovenste positie: Je kin komt boven de stang of minstens op stanghoogte. Pauzeer kort en span je brede
  rugspieren aan.'
