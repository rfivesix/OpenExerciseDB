name: Push-up tegen de muur
description: Ga op ongeveer een armlengte van een vlakke muur staan met je voeten op heupbreedte. Plaats
  je handpalmen op schouderhoogte tegen de muur, iets breder dan je schouders. Houd je lichaam recht van
  hoofd tot hielen en buig je ellebogen om je borst gecontroleerd naar de muur te brengen. Duw stevig
  met je handen terug naar de beginpositie zonder je onderrug hol te trekken of je heupen te laten zakken.
