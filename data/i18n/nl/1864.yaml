name: Enkelcirkels
description: 'Beginpositie: Zit rechtop op een stoel of op de vloer en til één voet op zodat je enkel
  vrij kan bewegen.


  Uitvoering: Teken langzaam grote cirkels met je tenen en beweeg je enkel door het volledige bereik.
  Maak meerdere cirkels met de klok mee en daarna andersom.


  Tips: Houd je onderbeen en knie stil zodat de beweging uit de enkel komt. Maak per voet 10–15 cirkels
  in beide richtingen.'
