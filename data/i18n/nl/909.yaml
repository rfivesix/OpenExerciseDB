name: Reverse Nordic curl
description: Kniel rechtop op een gevoerde mat met je tenen naar achteren en je heupen gestrekt, zodat
  je lichaam van knieën tot hoofd één lijn vormt. Leun langzaam achterover door alleen je knieën te buigen.
  Rem de beweging met je quadriceps en zak zo ver als je kracht toelaat zonder je heupen te buigen. Span
  je quadriceps krachtig aan om terug te komen naar de rechte knielpositie.
