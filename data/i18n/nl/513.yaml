name: T-bar roeien (brede greep)
description: De uitvoering lijkt sterk op de gewone voorovergebogen roeibeweging, maar de stang is hier bevestigd.
  Pak de stang breed vast, iets breder dan schouderbreedte, en leun voorover. Je bovenlichaam is niet helemaal evenwijdig
  aan de vloer, maar staat onder een lichte hoek. Houd je borst gedurende de hele oefening omhoog. Trek de stang
  snel naar je navel, niet hoger. Laat hem langzaam terugzakken naar de beginpositie. Zwaai niet met je lichaam
  en houd je armen naast je lichaam.
