name: Roman-chair crunch
description: 'Beginpositie: Neem plaats op de Romeinse stoel en zet je voeten stevig vast onder de rolkussens.
  Houd je romp in één lijn.

  Uitvoering: Buig je romp naar voren door je buikspieren aan te spannen. Kom niet helemaal rechtop en
  leun ook niet plat achterover; zo blijft er spanning op je buikspieren.

  Terug: Keer gecontroleerd terug naar de beginpositie zonder je onderrug te overstrekken.'
