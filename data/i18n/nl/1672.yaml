name: Zittende heupabductie
description: 'Beginpositie:

  Stel de zithoogte zo in dat je knieën op één lijn staan met het draaipunt van de machine. Ga met je
  rug tegen de leuning zitten en plaats de buitenkant van je dijen tegen de gevoerde hefbomen. Zet je
  voeten plat op de voetsteunen en pak de handgrepen of zijkanten van de stoel vast. Houd je wervelkolom
  neutraal en span je romp licht aan.


  Beweging:

  Adem uit en duw je benen langzaam naar buiten tegen de weerstand in. Laat de beweging vanuit je heupen
  komen, niet vanuit je knieën. Open je benen tot je een sterke aanspanning aan de buitenkant van je heupen
  en dijen voelt. Houd deze positie kort vast (1–2 seconden). Adem in en breng je benen gecontroleerd
  terug, terwijl je de weerstand blijft beheersen. Laat de gewichtsstapel tussen herhalingen niet neerkomen.
  Herhaal het gewenste aantal keren en houd de beweging onder controle.'
