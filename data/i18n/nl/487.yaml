name: Zittende dumbbell rear delt raise
description: Ga op het uiteinde van een vlakke bank zitten met je voeten op de vloer en een dumbbell in
  elke hand. Buig vanuit je heupen naar voren en breng je romp dicht bij je bovenbenen. Houd je ellebogen
  licht gebogen en hef de dumbbells zijwaarts tot je bovenarmen evenwijdig aan de vloer zijn. Span je
  achterste deltaspieren aan en laat de gewichten langzaam en gecontroleerd zakken.
