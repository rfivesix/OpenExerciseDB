name: Power clean
description: Ga achter de halter staan met je voeten op heupbreedte en pak de stang iets breder dan schouderbreedte
  vast met een haakgreep. Houd je rug vlak en borst omhoog. Begin de eerste trek door je knieën en heupen
  soepel te strekken tot de stang ter hoogte van je knieën is. Strek heupen, knieën en enkels explosief,
  haal je schouders op en trek de stang dicht langs je romp omhoog. Zak snel in een gedeeltelijke squat,
  draai je ellebogen naar voren en vang de stang op je voorste schouders. Kom daarna rechtop.
