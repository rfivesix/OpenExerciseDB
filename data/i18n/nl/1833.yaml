name: Hamstring curl met glijders
description: 'Beginpositie: Ga op je rug op de vloer liggen met je hielen op glijschijven (of handdoeken
  op een gladde vloer). Houd je armen naast je voor stabiliteit. Duw via je hielen en til je heupen in
  een glute bridge, met een rechte lijn van knieën tot schouders.


  Uitvoering:

  1. Houd je heupen omhoog en schuif je hielen langzaam van je lichaam af tot je benen bijna gestrekt
  zijn.

  2. Pauzeer kort zonder je bilspieren op de vloer te laten rusten.

  3. Krul je hielen krachtig terug richting je billen door je hamstrings aan te spannen; til je heupen
  hoger wanneer je hielen onder je knieën komen.

  4. Herhaal vloeiend.


  Aanwijzing: Houd je heupen tijdens zowel het strekken als het krullen omhoog om de hamstrings onder
  spanning te houden.'
