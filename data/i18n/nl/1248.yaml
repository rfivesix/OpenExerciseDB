name: Ice cream maker
description: 'Startpositie:

  Begin bovenaan een chin-up of pull-up, met gebogen armen en je borst dicht bij de stang.


  Uitvoering:

  1. Duw je romp met je schouders en armen naar achteren, houd je romp stevig en strek je armen tot je
  de horizontale front-leverpositie bereikt.

  2. Trek vanuit de front lever je lichaam in een vloeiende boog terug omhoog naar de bovenste pull-up-positie.

  3. Herhaal gecontroleerd.


  Tips:

  Deze oefening vraagt volgens de bron veel kracht in de lats en dynamische controle van de romp.'
