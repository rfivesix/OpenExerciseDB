name: Zwemmen
description: 'Beginpositie:

  Ga het zwembad in en maak je klaar om baantjes te zwemmen met een slag naar keuze, zoals borstcrawl
  of schoolslag.


  Uitvoering:

  1. Zwem onafgebroken baantjes in een gelijkmatig ritme en let op een rustige ademhaling en efficiënte
  voortstuwing.

  2. Gebruik je brede rugspieren, deltaspieren en romp om door het water te trekken en strek je armen
  volledig.

  3. Houd tijdens de sessie een gestroomlijnde, horizontale lichaamshouding aan.


  Aandachtspunt:

  Zwemmen biedt cardiovasculaire conditietraining met weinig impact en traint het spieruithoudingsvermogen,
  met name van rug, schouders en romp.'
