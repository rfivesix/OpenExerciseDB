name: Adductoren-zijplank (Copenhagen-plank)
description: 'Startpositie:

  Ga op je zij naast een vlakke bank liggen. Leg de binnenkant van je bovenste voet en enkel (of onderbeen)
  op de bank. Plaats je onderste onderarm recht onder je schouder op de vloer. Houd je onderste been onder
  de bank.


  Uitvoering:

  1. Duw via je onderste onderarm en de binnenkant van je bovenste voet om je heupen van de vloer te tillen.

  2. Til je lichaam op tot je romp, heupen en bovenste been een rechte, stevige lijn vormen op bankhoogte.

  3. Houd je onderste been van de vloer zodat het net onder de bank zweeft.

  4. Houd deze isometrische positie gedurende de voorgeschreven tijd vast, laat je gecontroleerd zakken
  en wissel van kant.


  Aandachtspunten:

  Laat je heupen niet naar de vloer zakken of naar voren draaien. Span je schuine buikspieren en binnenste
  bovenbeenspieren aan.'
