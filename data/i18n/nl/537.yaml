name: Schuine dumbbell bench press
description: 'Deze variant van de vlakke bench press legt meer nadruk op het sleutelbeengedeelte van de grote borstspier
  (het bovenste deel). Door je romp schuin te plaatsen verandert de duwhoek en komt er meer spanning op de bovenborst
  en schouders, wat bijdraagt aan een evenwichtige ontwikkeling van de romp.


  Bank instellen en voorbereiding: Stel de bank in op een hoek van 30 tot 45 graden (een hoek groter dan 45° belast
  de schouders te veel en vermindert de prikkel voor de borst). Ga zitten met op elke bovenbeen een dumbbell.


  Startpositie: Leun achterover met je rug tegen de bank en gebruik je knieën één voor één om de dumbbells naar
  schouderhoogte te brengen.


  Stabilisatie: Zet je voeten stevig op de vloer. Trek je schouderbladen naar elkaar toe en druk ze tegen de bank
  om je schouders te beschermen en de last te stabiliseren.


  Excentrische fase (laten zakken): Laat de dumbbells langzaam en gecontroleerd naar het bovenste deel van je borst
  zakken. Laat je ellebogen niet 90° zijwaarts uitsteken; houd ze op ongeveer 45–60° ten opzichte van je romp.


  Concentrische fase (duwen): Duw de dumbbells bij het uitademen verticaal omhoog. Volg een licht naar elkaar toelopende
  baan, zonder ze bovenaan tegen elkaar te laten komen. Stop vlak voordat je je ellebogen vergrendelt om de spanning
  op de bovenborst te behouden.'
