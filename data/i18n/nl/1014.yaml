name: Rek voor de rechter schouderbladheffer
description: Ga rechtop zitten of staan en draai je hoofd ongeveer 45 graden naar rechts. Houd je linkerschouder
  omlaag met je linkerhand achter je rug of onder je dij. Leg je rechterhand achter op je hoofd en begeleid
  je kin zachtjes richting je rechteroksel tot je de rek aan de achterkant en linkerkant van je nek voelt.
  Houd 20–30 seconden vast en adem rustig.
