name: Knie-push-up
description: Begin geknield op de vloer met je knieën bij elkaar. Zet je handen iets wijder dan schouderbreedte
  voor je neer. Houd je lichaam recht van hoofd tot knieën, met je handen onder je schouders. Laat je
  bovenlichaam naar de vloer zakken door je ellebogen te buigen en je romp stabiel te houden; je knieën
  blijven op de vloer. Duw via je handen terug naar de startpositie. Span bovenaan je borst-, schouder-
  en armspieren aan. Doe het gewenste aantal herhalingen en houd de beweging gecontroleerd.
