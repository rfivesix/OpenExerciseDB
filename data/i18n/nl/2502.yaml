name: Eenarmige dumbbell row
description: 'Startpositie:

  Zet één knie en de hand aan dezelfde kant op een vlakke bank, of neem een gespreide heupscharnierstand
  aan met steun op een stevig oppervlak. Houd je romp vlak en ongeveer parallel aan de vloer. Houd de
  dumbbell met je vrije hand vast, met je arm naar beneden gestrekt.


  Uitvoering:

  1. Trek de dumbbell naar je heupplooi door je elleboog recht langs je ribben naar achteren te bewegen.

  2. Span bovenaan je lat aan en trek je schouderblad naar achteren; pauzeer 1 seconde.

  3. Laat de dumbbell langzaam en gecontroleerd zakken tot je arm gestrekt is en je lats licht rekken.

  4. Maak de herhalingen af en herhaal aan de andere kant.


  Aandachtspunten:

  Draai je romp niet en ruk het gewicht niet omhoog met momentum. Houd je schouders recht ten opzichte
  van de vloer.'
