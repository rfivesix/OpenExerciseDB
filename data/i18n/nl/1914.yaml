name: Steunhouding op parallelle stangen
description: Ga tussen de dipstangen staan, pak ze met neutrale greep vast en duw
  jezelf omhoog tot je armen gestrekt zijn en je voeten los van de vloer zijn. Houd
  de bovenste dippositie statisch vast, zonder je ellebogen te overstrekken. Duw je
  schouders omlaag, houd je borst open en span romp en bilspieren aan. Trek je schouders
  niet op.
