name: Ab wheel rollout
search_terms:
- "Uitrollen met ab-wheel"
- "Ab wheel"
description: 'Beginpositie:

  Kniel op een gevoerde mat met je knieën op heupbreedte. Pak de handgrepen van het buikspierwiel stevig
  vast en plaats het op de vloer voor je knieën.


  Uitvoering:

  1. Span je buikspieren aan, kantel je bekken iets naar achteren en rol het wiel langzaam en gecontroleerd
  naar voren terwijl je lichaam zich naar de vloer uitstrekt.

  2. Rol alleen zo ver uit als je je wervelkolom neutraal en je onderrug licht afgerond kunt houden, zonder
  door te zakken.

  3. Trek het wiel met je buikspieren en brede rugspieren terug naar de beginpositie.


  Aandachtspunt:

  Dit is een anti-extensieoefening voor de rechte en dwarse buikspier. Laat je onderrug niet overmatig
  hol trekken.'
