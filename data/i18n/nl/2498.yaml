name: Pike-push-ups
description: 'Startpositie:

  Begin in push-uphouding en loop met je voeten naar voren terwijl je je heupen hoog duwt, zodat je lichaam
  een omgekeerde V vormt. Houd je handen op schouderbreedte, je armen gestrekt en je hoofd tussen je schouders.


  Uitvoering:

  1. Buig je ellebogen en laat je hoofd schuin naar voren en omlaag zakken tot je kruin de vloer net vóór
  je handen licht raakt.

  2. Duw krachtig via je handpalmen en voorste schouderspieren terug en omhoog naar de omgekeerde V.

  3. Houd je romp aangespannen en je benen gestrekt of licht gebogen, afhankelijk van de lenigheid van
  je hamstrings.


  Aandachtspunten:

  Beweeg bij het zakken schuin naar voren en duw recht omhoog en naar achteren. Spreid je ellebogen niet
  overdreven.'
