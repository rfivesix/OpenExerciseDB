name: Zijwaartse plank (rechts)
description: 'Beginpositie:

  Ga op je rechterzijde liggen met je benen gestrekt en je voeten op elkaar of achter elkaar. Plaats je
  rechterelleboog recht onder je rechterschouder met je onderarm plat op de grond.


  Uitvoering:

  1. Span je buikspieren, schuine buikspieren en bilspieren aan en til je bekken van de vloer tot je lichaam
  een rechte lijn vormt van hoofd tot hielen.

  2. Houd je schouders en heupen recht boven elkaar zonder in te zakken.

  3. Houd deze positie vast voor de gewenste tijdsduur en blijf rustig doorademen.'
