name: Beenheffen op een declinebank
description: Ga met je hoofd aan de hoge kant op een declinebank liggen en houd de handgrepen vast. Strek
  je benen en houd ze iets boven de bank. Hef ze met je buikspieren richting het plafond, pauzeer bovenaan
  en laat ze langzaam en gecontroleerd zakken.
