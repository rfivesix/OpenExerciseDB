name: Laterale bilpress met één been
description: Dit is een variant van de leg press. Ga schuin op de zitting zitten, plaats één voet hoog
  op het platform en draai deze ongeveer 45 graden iets naar buiten of voren. Houd heup, knie en enkel
  op één lijn en je onderrug tegen het kussen. Laat het gewicht langzaam zakken door je knie diep te buigen
  en een rek in bilspieren en hamstrings te voelen. Duw vanuit je hiel het gewicht terug omhoog, span
  bilspieren en hamstrings aan en strek je been niet helemaal. Veer niet en laat je onderrug niet van
  het kussen komen; houd de spanning en controle vast.
