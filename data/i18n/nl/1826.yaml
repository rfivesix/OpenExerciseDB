name: Band pull-apart met externe rotatie
description: 'Beginpositie: Sta met je voeten op schouderbreedte, borst rechtop en schouders naar achteren
  en omlaag. Houd een lichte weerstandsband met onderhandse greep voor je navel. Buig je ellebogen 90°
  en houd je bovenarmen tegen je ribben.


  Uitvoering:

  1. Houd je ellebogen tegen je zij en draai je onderarmen en handen naar buiten, zodat de band uitrekt.

  2. Knijp je schouderbladen naar elkaar en omlaag terwijl je schouders naar buiten roteren.

  3. Houd de eindcontractie 1–2 seconden vast om de infraspinatus en teres minor te stimuleren.

  4. Breng je handen langzaam en gecontroleerd terug.


  Aanwijzing: Laat je ellebogen niet van je ribben komen; de beweging komt uit externe rotatie van het
  schoudergewricht.'
