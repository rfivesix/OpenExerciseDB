name: Plank
description: De plank is een oefening met lichaamsgewicht. Deze veelzijdige beweging traint niet alleen
  je buikspieren, maar ook je wervelkolom en heupen. Volgens de brontekst versterkt en verstevigt de plank
  het hele lichaam, verbetert hij houding en balans, vermindert hij lichaamsvet en kan hij de stofwisseling
  stimuleren. Plankoefeningen helpen het uithoudingsvermogen van stabiliserende buikspieren op te bouwen.
  Ze kunnen ook helpen bij rugpijn die samenhangt met een verminderde functie van de stabiliserende spieren.
  Planken trainen veel belangrijke spiergroepen en kunnen door iedereen worden gebruikt om het uithoudingsvermogen
  en de algemene lichaamskracht te verbeteren.
