name: L-sit pull-ups
description: 'Pak een optrekstang met een bovenhandse greep iets breder dan schouderbreedte. Hang met
  gestrekte armen en til je gestrekte benen recht voor je omhoog tot ze met je romp een L vormen. Span
  je core en heupbuigers aan.


  1. Houd de L-zitpositie vast en trek jezelf omhoog door je ellebogen omlaag en naar achteren te bewegen,
  tot je kin boven de stang komt.

  2. Pauzeer kort bovenaan en houd je benen horizontaal.

  3. Laat jezelf gecontroleerd zakken tot je weer volledig hangt, zonder je benen te laten zakken.


  Houd je knieën gestrekt en je tenen gestrekt; gebruik geen momentum of kipbeweging.'
