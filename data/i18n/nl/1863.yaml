name: Liggende heuprotatie
description: 'Beginpositie: Ga op je rug liggen met je armen in een T gestrekt en handpalmen omlaag. Buig
  je knieën met je voeten op de vloer of omhoog.


  Uitvoering: Laat je knieën langzaam naar één kant zakken (of kruis één knie over je lichaam) en houd
  beide schouderbladen stevig op de vloer. Je kunt je hoofd rustig naar de andere kant draaien.


  Tips: Houd de rek in je buitenste heup, bilspieren en onderrug 20–30 seconden vast. Adem diep en wissel
  van kant.'
