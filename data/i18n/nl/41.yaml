name: Buikspieruitrol met halterstang
description: 'Kniel op een mat en leg een halterstang voor je op de vloer.

  Pak de stang met een bovenhandse greep op schouderbreedte vast.

  Rol de stang langzaam en gecontroleerd naar voren tot je lichaam gestrekt is en je rug recht blijft.

  Trek de stang met je buikspieren terug naar de beginpositie.'
