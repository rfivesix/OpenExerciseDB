name: Rotatietorso-machine
description: 'Beginpositie:

  Ga op de rotatietorso-machine zitten en stel de borst- en kniekussens zo af dat je onderlichaam comfortabel
  vastzit. Pak de handgrepen vast en zit rechtop met een rechte wervelkolom.


  Beweging:

  Draai je romp met je schuine buikspieren naar één kant. Pauzeer kort aan het einde van de beweging terwijl
  je de spieren aangespannen houdt. Keer vervolgens langzaam tegen de weerstand van het gewichtenblok
  terug naar de beginpositie.


  Opmerkingen:

  Kies een matig gewicht zodat je de rotatie soepel kunt beheersen. Forceer de draai niet en gebruik geen
  momentum van je schouders of armen.'
