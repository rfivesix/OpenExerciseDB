name: Kuitheffen op de hack squatmachine
description: 'Startpositie:

  Ga in de hack squatmachine staan met je schouders onder de kussens en je rug tegen de rugleuning. Plaats
  de bal van je voeten op de onderrand van het voetplateau en laat je hielen vrij hangen. Ontgrendel de
  veiligheidsstoppers en houd je knieën bijna gestrekt met een lichte buiging.


  Uitvoering:

  1. Laat je hielen langzaam en gecontroleerd zo ver onder het plateau zakken als comfortabel is, om je
  kuiten te rekken.

  2. Duw via de bal van je voeten omhoog tot je zo hoog mogelijk op je tenen staat.

  3. Span je kuiten bovenaan één seconde aan en zak gecontroleerd terug.


  Aandachtspunten:

  Veer niet onderaan en buig je knieën niet om momentum te maken; de beweging komt vanuit je enkels.'
