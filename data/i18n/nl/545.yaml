name: Schaarbeweging
description: Ga op je rug liggen met je benen gestrekt en je handen onder je onderrug of naast je lichaam. Til je
  benen iets van de vloer. Beweeg je benen horizontaal of verticaal als een schaar en kruis het ene been afwisselend
  over het andere. Span je romp aan en houd je onderrug tijdens de hele beweging tegen de vloer gedrukt.
