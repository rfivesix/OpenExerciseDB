name: Hammer curls met dumbbells
description: 'Startpositie:

  Sta met je voeten op heupbreedte of zit op een vlakke bank. Houd twee dumbbells naast je lichaam vast
  in neutrale greep, met je handpalmen naar elkaar. Houd je ellebogen dicht bij je romp en je schouders
  naar achteren.


  Uitvoering:

  1. Houd je handpalmen naar binnen en buig je ellebogen om de dumbbells naar je schouders te krullen.

  2. Span bovenaan je biceps, brachialis en onderarmspieren 1 seconde stevig aan.

  3. Laat de dumbbells langzaam en volledig gecontroleerd zakken tot je armen gestrekt zijn.


  Aandachtspunten:

  Houd je bovenarmen stil tegen je ribben. Zwaai de gewichten niet en leun niet achterover.'
