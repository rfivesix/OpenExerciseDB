name: Pallof press aan kabel
description: Sta zijwaarts naast een kabelmachine met katrol op borsthoogte. Pak het handvat met beide
  handen en houd het tegen het midden van de borst. Zet de voeten op schouderbreedte, knieën licht gebogen
  en span romp en bilspieren aan. Duw het handvat recht vooruit tot de armen gestrekt zijn en weersta
  de rotatietrek van de kabel; houd schouders en heupen naar voren gericht. Houd 1–2 seconden vast en
  breng de handen gecontroleerd terug.
