name: Voorovergebogen schouderophalen met halterstang
description: Sta met voeten op schouderbreedte en houd de stang met bovenhandse greep
  iets breder dan schouders vast. Buig je knieën licht en kantel vanuit je heupen
  tot je romp ongeveer 45 graden voorover staat; houd je rug recht en armen gestrekt.
  Hef en trek je schouderbladen naar achteren en omhoog zonder je ellebogen te buigen.
  Span bovenrug en trapezius een seconde aan en laat gecontroleerd zakken. Gebruik
  geen heup- of knie-impuls.
