name: Tricepsstrekking met rechte stang aan kabel
description: Pak de stang vast en sta met je voeten op schouderbreedte. Houd je rug recht en leun iets
  naar voren. Duw de stang omlaag en houd je ellebogen stil. Keer zonder pauze terug naar de beginpositie.
