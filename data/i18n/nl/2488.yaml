name: Achterwaartse bekkenkanteling
description: 'Startpositie:

  Ga op je rug liggen met je knieën gebogen en je voeten plat op de vloer. Houd je armen ontspannen langs
  je lichaam.


  Uitvoering:

  Span je buikspieren aan en kantel je bekken zodat je onderrug tegen de vloer wordt gedrukt. Houd kort
  vast en keer gecontroleerd terug naar de neutrale positie.


  Aandachtspunten:

  Beweeg je bekken beheerst zonder je voeten of schouders van de vloer te tillen.'
