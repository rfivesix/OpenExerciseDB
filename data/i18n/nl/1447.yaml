- "Snatch"
description: Sta met je voeten op heupbreedte bij de stang en pak hem breed vast. Houd je rug vlak, borst
  omhoog en schouders iets voor de stang. Til de stang soepel van de vloer en houd hem dicht bij je schenen
  en dijen. Strek bij je heupplooi je heupen, knieën en enkels explosief om de stang te versnellen. Zak
  snel onder de stang in een diepe overhead squat en vang hem boven je hoofd met gestrekte armen. Stabiliseer
  de stang en sta op terwijl je hem recht boven je zwaartepunt houdt.
