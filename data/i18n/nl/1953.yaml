name: Bent-knee iron cross
description: Ga op je rug liggen met je armen in een T op schouderhoogte en handpalmen
  omlaag. Hef je benen en buig heupen en knieën tot 90 graden, schenen parallel aan
  de vloer. Houd beide schouders op de vloer en laat je knieën samen langzaam naar
  rechts zakken tot vlak boven de vloer of er zacht tegenaan. Trek ze met je schuine
  buikspieren terug naar het midden en herhaal links. Doe 5–10 herhalingen per kant.
