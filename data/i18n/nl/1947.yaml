name: Snatch met dumbbell
description: Plaats de dumbbell tussen je voeten met schouders boven je heupen, borst
  omhoog en rug vlak. Strek explosief heupen, knieën en enkels om het gewicht omhoog
  te brengen; houd de elleboog hoog en dumbbell dicht bij je lichaam. Buig snel heupen
  en knieën om eronder te zakken en vang de dumbbell boven je hoofd met gestrekte
  arm in een halve squat. De bron noemt als fouten te veel armgebruik, een lage elleboog
  en een verkeerde lijn van schouder, elleboog en pols.
