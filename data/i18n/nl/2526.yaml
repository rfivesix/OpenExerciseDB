name: Pulsstretch in lange uitvalspas
description: 'Beginpositie: Stap naar voren in een lange uitvalspas. Laat je heupen zakken tot je voorste
  bovenbeen parallel aan de vloer is en je achterste knie net boven de vloer zweeft. Houd eventueel met
  gestrekte armen een gespannen band boven je hoofd vast.


  Uitvoering: Houd je romp rechtop, je heupen naar voren gericht en je romp aangespannen. Maak rustige,
  gecontroleerde heuppulsen over een kleine afstand van ongeveer 2,5 tot 5 cm. Houd het voorgeschreven
  aantal herhalingen of de voorgeschreven tijd een gelijkmatig ritme aan. Duw af met je voorste voet om
  weer rechtop te staan en herhaal met het andere been.


  Aanwijzingen: Maak vloeiende pulsen zonder schokken; richt je op het verlengen van de heupbuigers en
  het dynamisch activeren van de adductoren.'
