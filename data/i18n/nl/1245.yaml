name: Front lever
description: 'Startpositie:

  Hang aan een stevige optrekstang met een bovenhandse greep op schouderbreedte.


  Uitvoering:

  1. Trek je schouderbladen omlaag en naar elkaar toe en span je lats, romp en bilspieren aan.

  2. Trek met gestrekte armen je lichaam omhoog tot het volledig horizontaal en evenwijdig aan de vloer
  is.

  3. Houd deze statische positie de beoogde tijd vast en houd je lichaam recht van hoofd tot hielen.


  Tips:

  Houd armen en benen volledig gestrekt en laat je heupen niet doorzakken. De bron beschrijft dit als
  een gevorderde isometrische calisthenicshouding.'
