name: 'Yoga: kat-koe'
description: 'Kom eerst op handen en knieën. Zet je handen onder je schouders, spreid je vingers en verdeel
  je gewicht gelijkmatig over handen en knieën. Zet je benen op heupbreedte met je dijen recht onder je
  heupen. Houd je hoofd in het verlengde van je wervelkolom, kijk naar de mat en houd je rug neutraal.
  Adem diep in en begin met de kat. Adem uit en rond je rug wervel voor wervel naar het plafond; breng
  je hoofd naar je borst en kantel je bekken. Adem diep in en ga naar de koe: laat je rug zakken, trek
  je schouders iets naar achteren en til je hoofd zover op als comfortabel is, met je blik omhoog. Adem
  bewust uit en keer terug naar de kat. Wissel bij de volgende uitademing weer naar de koe. Herhaal enkele
  keren en beweeg vloeiend.'
