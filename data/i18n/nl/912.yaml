name: Biceps curl met rechte kabelstang
description: Sta rechtop voor een lage kabelkatrol en pak de rechte stang met een onderhandse greep op
  ongeveer schouderbreedte vast. Houd je ellebogen dicht bij je zij en je romp stil. Buig je ellebogen
  en span je biceps aan om de stang naar je borst te brengen; houd je bovenarmen stil. Knijp bovenaan
  je biceps samen en laat de stang langzaam en gecontroleerd zakken tot je armen gestrekt zijn.
