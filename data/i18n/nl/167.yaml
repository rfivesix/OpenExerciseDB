name: Crunch
description: 'Beginpositie:

  Ga op je rug op een mat liggen met je knieën gebogen en je voeten op heupbreedte plat op de vloer. Leg
  je handen licht achter je hoofd zonder je vingers in elkaar te haken, of kruis je armen over je borst.


  Uitvoering:

  1. Span je buikspieren aan en rol je bovenrug op, waarbij je schouderbladen van de vloer richting je
  bekken komen.

  2. Adem uit en houd de maximale aanspanning bovenaan één seconde vast.

  3. Laat je bovenrug langzaam en beheerst zakken en houd je buikspieren aangespannen.


  Opmerkingen:

  Trek niet met je handen aan je nek. Houd je onderrug tegen de mat; dit is een oprolbeweging van de wervelkolom,
  geen volledige sit-up.'
