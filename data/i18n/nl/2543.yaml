name: Polscirkels
description: 'Beginpositie: Ga rechtop zitten of staan met ontspannen schouders. Vlecht je vingers voor
  je borst in elkaar of maak losse vuisten en houd je handen voor je met je ellebogen comfortabel gebogen.


  Uitvoering: Draai je polsen langzaam en soepel in cirkels door hun volledige comfortabele bewegingsbereik,
  met de klok mee. Draai na de voorgeschreven tijd (bijvoorbeeld 15 tot 30 seconden) de andere kant op.
  Beweeg vloeiend en voel de lichte activering en rek van je polsbuigers en -strekkers.


  Aanwijzingen: Beweeg soepel en pijnvrij; forceer je polsen nooit in scherpe hoeken. Dit is een geschikte
  warming-up vóór presses, handstanden, front squats of pull-ups om je polsen op belasting voor te bereiden.'
