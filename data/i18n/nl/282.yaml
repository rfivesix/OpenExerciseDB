name: Handstand push-up
description: De handstand push-up, ook verticale of omgekeerde push-up genoemd (of «commandos»), is een
  push-up waarbij je lichaam in een handstand staat. Bij de volledige variant houd je de handstand vrij,
  zonder steun. Om kracht en balans op te bouwen, kunnen je voeten tegen een muur worden geplaatst, door
  een partner worden vastgehouden of op een andere manier worden gezekerd om vallen te voorkomen. De handstand
  push-up vraagt veel kracht en vereist bij een vrije uitvoering ook balans en controle.
