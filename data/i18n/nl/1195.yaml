name: Zijwaartse slides naar squats
description: 'Startpositie:

  • Sta met je voeten iets wijder dan schouderbreedte in een lage, atletische verdedigingshouding.

  • Houd je borst omhoog en knieën gebogen.


  Uitvoering:

  • Maak drie snelle, gecontroleerde zijwaartse schuifpassen naar één kant en zet af met de achterste
  voet.

  • Zet je voeten stevig neer en doe een diepe squat; houd je borst opgericht en duw je knieën naar buiten.

  • Draai 180 graden of keer de richting om en schuif naar de andere kant voor nog een squat.'
