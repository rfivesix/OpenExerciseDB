name: Bovenste deel van de buitenste schuine buikspier
description: Neem een zijplankpositie aan of hang stevig aan een optrekstang met aangespannen romp. Buig
  je romp gecontroleerd zijwaarts of til je benen opzij om het bovenste deel van de buitenste schuine
  buikspieren aan te spannen. Houd de maximale aanspanning kort vast en keer soepel terug naar de beginpositie
  voordat je de andere kant herhaalt.
