name: L-sit met voetensteun
description: 'Beginpositie: Zit op de vloer of tussen parallettes met je benen voor je gestrekt. Plaats
  je handen naast je heupen.


  Uitvoering: Duw via je handpalmen en til je heupen en romp van de vloer; laat je hielen op de vloer
  rusten om een deel van het beengewicht te ondersteunen.


  Tips: Houd je schouders laag, weg van je oren, en span je core en triceps aan. Houd de positie isometrisch
  vast gedurende de voorgeschreven tijd.'
