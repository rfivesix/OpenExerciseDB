exercise_id: '1003'
language: nl
status: upstream_unreviewed
name: Kettlebell Deadliften
description: |-
  Beginpositie:
  Ga op heupbreedte uit elkaar staan, met je kettlebell gecentreerd tussen je enkels. Je rug moet recht zijn, je hoofd naar voren gericht.
  Stappen:

  Scharnier bij de heupen en buig lichtjes bij de knieën om je handen op de kettlebell handgrepen te plaatsen. Je rug moet recht zijn terwijl je de beweging uitvoert.
  Pak de kettlebell handgrepen vast, waarbij je handen in tegengestelde richtingen duwen alsof je de handgreep uit elkaar trekt.
  Terwijl u contact maakt met uw buikspieren en bilspieren, gaat u rechtop staan.
  Scharnier weer bij de heupen om de kettlebell weer naar beneden te brengen, op dezelfde manier als bij stap 1.
  Herhaal vanaf stap 3.

  Tips:

  Zorg ervoor dat je de bewegingen correct uitvoert, want als je dat anders doet kan dat tot blessures leiden. Bijvoorbeeld, niet squatten in plaats van scharnieren bij de heupen, niet je rug rond maken terwijl je naar de kettlebell reikt, en niet achterover leunen terwijl je opstaat.
