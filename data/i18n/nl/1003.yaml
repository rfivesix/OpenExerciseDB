name: Kettlebell deadlift
description: Sta met je voeten op heup- tot schouderbreedte en zet de kettlebell midden tussen je voeten,
  ter hoogte van je enkels. Beweeg je heupen naar achteren en buig je knieën licht met een rechte rug.
  Pak het handvat met beide handen vast. Duw via je voeten en breng je heupen naar voren om rechtop te
  staan; span bovenaan je bilspieren aan. Beweeg vanuit je heupen terug en laat de kettlebell gecontroleerd
  zakken. Houd je schouders laag en je wervelkolom neutraal.
