name: Opgetrokken front lever
description: 'Startpositie:

  • Hang met een bovenhandse greep op schouderbreedte aan een optrekstang.

  • Trek je knieën strak naar je borst en span je hele romp aan.


  Uitvoering:

  • Trek met gestrekte armen omlaag en gebruik je lats, achterste deltaspieren en romp om je bovenlichaam
  op te tillen.

  • Breng je romp horizontaal en evenwijdig aan de grond terwijl je knieën opgetrokken blijven.

  • Houd deze isometrische positie de gewenste tijd vast, bijvoorbeeld 5 tot 15 seconden.

  • Laat jezelf langzaam en volledig gecontroleerd terugzakken tot een vrije hang.'
