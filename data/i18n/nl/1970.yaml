name: Sumo high pull met kettlebell
description: 'Startpositie:

  Ga in een brede sumohouding boven een kettlebell staan, met je voeten wijder dan schouderbreedte en
  je tenen ongeveer 30–45 graden naar buiten. Beweeg je heupen naar achteren en buig je knieën met een
  rechte rug. Pak de greep stevig met beide handen in bovenhandse greep.


  Uitvoering:

  Strek je heupen, knieën en enkels explosief door krachtig via je hielen en bilspieren af te zetten.
  Zet die opwaartse impuls om in een verticale trek: houd de kettlebell dicht bij je romp en leid met
  je ellebogen hoog en breed tot de kettlebell je sleutelbeen bereikt. Laat hem soepel langs dezelfde
  baan zakken en ga door naar de volgende herhaling.


  Tips:

  De kracht komt uit de explosieve heupstrekking van de achterste spierketen; je bovenrug en schouders
  begeleiden het gewicht omhoog.'
