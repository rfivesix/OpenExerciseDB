name: Weighted Dips
description: Dips zijn een krachtoefening voor het bovenlichaam. Dips met de handen ongeveer op schouderbreedte
  trainen vooral de triceps. De belangrijkste synergisten zijn de voorste deltaspier, de borstspieren
  (sternale en claviculaire delen en de kleine borstspier) en de romboïden van de rug, in die volgorde.
  Een bredere armpositie legt meer nadruk op de borstspieren, vergelijkbaar met bankdrukken met een brede
  greep, waarbij de borst meer en de triceps minder worden benadrukt.
