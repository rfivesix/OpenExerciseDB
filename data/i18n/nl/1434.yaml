name: Gebogen lat pulldown met halters
description: Sta met je voeten op heupbreedte en je knieën licht gebogen. Buig vanuit je heupen ongeveer
  45 graden voorover met een neutrale rug. Houd in elke hand een halter, met je armen omlaag en je ellebogen
  licht gebogen. Trek de halters in een boog naar je heupen en houd de hoek van je ellebogen vrijwel gelijk.
  Span je brede rugspieren bovenaan aan en laat de halters beheerst zakken. Maak er geen gewone roeibeweging
  van.
