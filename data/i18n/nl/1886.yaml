name: Heupabductie in ruglig
description: Ga op je rug liggen met gestrekte, ontspannen benen en je armen naast je of zijwaarts voor
  stabiliteit. Til één been licht op en beweeg het zijwaarts van het andere been af. Ga alleen zo ver
  als comfortabel is zonder je bekken op te tillen of je romp te draaien; breng het been langzaam terug.
