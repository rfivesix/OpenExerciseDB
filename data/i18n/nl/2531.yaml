name: Elbow lever
description: 'Beginpositie: Kniel op de vloer en plaats je handen op de mat met je vingers naar achteren
  of naar buiten gedraaid. Leun met je romp naar voren en plaats beide ellebogen stevig tegen je onderbuik
  of de voorste bekkenranden.


  Uitvoering: Verplaats je lichaamszwaartepunt voorbij je handen naar voren, totdat je hoofd iets zakt
  en je voeten vanzelf van de vloer komen. Span je rugstrekkers, bilspieren en romp actief aan om je benen
  te strekken en je lichaam horizontaal en parallel aan de vloer te brengen. Balanceer op je handen met
  je ellebogen als steunpunt. Houd deze statische positie de voorgeschreven tijd vast en adem oppervlakkig;
  laat daarna je voeten gecontroleerd zakken.


  Aanwijzingen: Houd je handen op de vloer en beweeg naar voren totdat je het balanspunt vindt; laat je
  schouders niet inzakken.'
