name: Zittende heupabductie op de machine
description: 'Ga rechtop in de heupabductiemachine zitten met je rug tegen de leuning. Plaats de buitenkant
  van je knieën en bovenbenen tegen de kussens. Zet je voeten op de voetplaten en pak de handgrepen vast
  om je bekken te stabiliseren.


  1. Duw je benen naar buiten tegen de kussens en span je gluteus medius en buitenste heupspieren aan.

  2. Open je benen zo ver als comfortabel is en pauzeer 1–2 seconden bovenaan.

  3. Breng je knieën langzaam terug naar het midden en weersta het gewicht; laat de gewichtstapel tussen
  herhalingen niet neerkomen.


  Houd je heupen op de zitting en je romp stil. Gebruik geen momentum en schommel niet.'
