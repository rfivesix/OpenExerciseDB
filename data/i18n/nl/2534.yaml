name: Bilbrug
description: 'Beginpositie: Ga op je rug op een mat liggen met gebogen knieën en je voeten plat op de
  vloer, ongeveer op heupbreedte en een paar centimeter van je billen. Leg je armen langs je zij.


  Uitvoering: Span je romp aan en duw stevig via je hielen om je heupen naar het plafond te tillen. Breng
  je heupen omhoog totdat je bovenbenen, bekken en romp een rechte lijn vormen van knieën tot schouders.
  Span bovenaan je bilspieren krachtig aan en houd 1 tot 2 seconden vast. Laat je heupen gecontroleerd
  zakken tot ze de vloer licht raken en begin meteen aan de volgende herhaling.


  Aanwijzingen: Vermijd overstrekken of hyperextensie van je lendenwervelkolom bovenaan; de strekking
  moet uitsluitend uit je heupgewrichten komen.'
