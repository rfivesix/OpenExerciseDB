name: Staande zijwaartse crunch
description: Sta rechtop met je voeten op schouderbreedte en je handen achter je hoofd, of houd een halter
  in één hand. Buig je romp opzij en span je schuine buikspieren aan terwijl je je elleboog naar je heup
  brengt (of naar de halter buigt). Keer terug naar de beginpositie en wissel van kant, of maak eerst
  alle herhalingen aan één kant.
