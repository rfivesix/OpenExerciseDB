name: Chest press
description: 'Stel de zithoogte zo in dat de handgrepen op borsthoogte staan.

  Duw het voetpedaal met je benen naar voren.

  Breng de handgrepen naar de beginpositie.

  Houd je rug tegen de rugleuning en duw naar voren.

  Duw de handgrepen van je borst weg terwijl je uitademt.

  Laat ze rustig terugkomen tot ze je borst bereiken.

  Laat de handgrepen naar je borst terugkeren terwijl je inademt.'
