name: Knielende cablecrunch
description: Pak het touwaccessoire met beide handen vast en houd het naast je slapen. Kniel met je gezicht
  naar of van de kabelstapel af, met je romp rechtop en licht naar voren gebogen. Maak een crunch door
  je wervelkolom naar binnen te rollen en je ellebogen naar je knieën te brengen. Pauzeer kort en keer
  langzaam en beheerst terug naar de beginpositie.
