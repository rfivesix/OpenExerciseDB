name: Optrekken
description: Pak de optrekstang breed vast en laat je lichaam vrij hangen. Houd je borst vooruit en trek
  jezelf omhoog tot je kin de stang bereikt. Bij de variant achter het hoofd raakt je nek de stang. Laat
  jezelf langzaam en gecontroleerd zakken en houd je borst vooruit.
