name: Hindu squats
description: 'Begin met je voeten op schouderbreedte en je armen iets achter je lichaam.

  Til tijdens het zakken je hielen van de vloer en houd je rug zo rechtop mogelijk.

  Raak onderaan met je handen je hielen aan.

  Kom vervolgens overeind met je hielen op de vloer en je armen voor je borst gestrekt; roei je armen
  terug naar de beginpositie.'
