description: 'Startpositie:

  Sta rechtop of zit op een licht schuine bank. Houd één dumbbell met onderhandse greep op heuphoogte
  en buig je elleboog licht. Leun je romp iets naar de werkende arm.


  Uitvoering:

  1. Breng de dumbbell schuin over je bovenborst naar hoofdhoogte, met je handpalm omhoog.

  2. Volg de natuurlijke richting van de vezels van de bovenste borstspier.

  3. Span bovenaan je bovenborst en voorste schouder één seconde aan.

  4. Laat de dumbbell langzaam en gecontroleerd zakken.'
