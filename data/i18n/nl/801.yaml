name: Push-up met dumbbells
description: Plaats twee dumbbells met vlakke zijkanten ongeveer op schouderbreedte op de vloer en pak
  de handgrepen met een neutrale greep vast. Neem de plankpositie voor push-ups aan en houd je lichaam
  recht en stevig van hoofd tot hielen. Laat je borst tussen de dumbbells zakken; door de verhoging kun
  je verder zakken. Duw stevig via je borst en triceps terug naar de beginplank.
