name: Schouderophalen in de Smith-machine
description: 'Startpositie: Sta rechtop voor de stang van de Smith-machine, met je voeten op schouderbreedte. Pak
  de stang bovenhands vast en laat je armen recht omlaag hangen.

  Uitvoering: Haal je schouders recht omhoog richting je oren zonder je ellebogen te buigen. Houd de maximale aanspanning
  bovenaan 1–2 seconden vast.

  Terugkeer: Laat je schouders langzaam en gecontroleerd zakken naar de startpositie.'
