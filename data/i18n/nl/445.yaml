name: Bench press met pauze
description: 'Breng de stang naar je borst en pauzeer daar 2 seconden zonder de stang te laten rusten.
  Duw hem daarna weer omhoog. Gebruik hetzelfde gewicht als bij de bench press, maar voer losse herhalingen
  uit. Het totale aantal herhalingen moet overeenkomen met het aantal dat je in één set bench press deed
  (bijvoorbeeld: bij 3 sets van 8 doe je 8 losse herhalingen met pauze).'
