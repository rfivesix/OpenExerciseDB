name: Incline dumbbell skull crusher
description: Ga op een incline bank van ongeveer 30–45 graden liggen met in elke hand een dumbbell en
  je armen boven je hoofd gestrekt. Houd je bovenarmen gedurende de beweging iets naar achteren gericht
  en stil. Buig je ellebogen soepel en laat de dumbbells langs de zijkanten van je hoofd zakken tot je
  triceps volledig op rek staan. Strek je ellebogen om terug te keren naar de beginpositie en span bovenaan
  je triceps stevig aan.
