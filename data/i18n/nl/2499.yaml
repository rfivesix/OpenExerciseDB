name: Push-ups met handen verhoogd
description: 'Startpositie:

  Plaats je handen iets wijder dan schouderbreedte op een stevig verhoogd oppervlak, zoals een bank, tafel
  of trede. Loop met je voeten naar achteren tot je lichaam van hoofd tot hielen een rechte, stevige plank
  vormt.


  Uitvoering:

  1. Laat je borst gecontroleerd naar de rand van het verhoogde oppervlak zakken en houd je ellebogen
  ongeveer 45 graden naar achteren gericht.

  2. Span je romp en bilspieren aan zodat je heupen op één lijn met je wervelkolom blijven.

  3. Duw jezelf stevig van het oppervlak af tot je armen gestrekt zijn en je terug bent in plankpositie.


  Aandachtspunten:

  Laat je onderrug niet doorzakken en je heupen niet omhoog komen. Pas de hoogte aan om de moeilijkheid
  geleidelijk te wijzigen richting push-ups op de vloer.'
