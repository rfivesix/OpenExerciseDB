name: Lat pulldown op schuine bank met kabel
description: Plaats een schuine bank (ongeveer 30–45 graden) met de voorkant naar een hoge kabelkatrol.
  Lig met de borst op de bank, hoofd neutraal en voeten stevig. Reik boven het hoofd en pak het handvat
  of de stang met gestrekte armen. Trek soepel naar de bovenborst door de ellebogen omlaag en naar achteren
  te bewegen. De bank beperkt beweging van de romp. Span de rug bovenaan aan en strek de armen gecontroleerd
  terug.
