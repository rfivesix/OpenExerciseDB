name: Isometrische cable lateral raise
description: 'Beginpositie: Ga rechtop naast of midden tussen lage kabelkatrollen staan. Pak de handgreep
  vast met je elleboog licht gebogen. Span je romp aan en houd je houding lang en stabiel, met een heel
  lichte voorwaartse rompleun.


  Uitvoering: Hef je arm zijwaarts in het scapulaire vlak totdat je elleboog ongeveer op schouderhoogte
  is en parallel aan de vloer loopt. Houd de arm gedurende de voorgeschreven tijd volledig stil tegen
  de constante kabelweerstand en span je laterale deltaspier krachtig aan. Laat je arm na afloop langzaam
  en volledig gecontroleerd zakken.


  Aanwijzingen: Trek je schouder niet naar je oor; houd je bovenste trapezius ontspannen. Houd je elleboog
  gedurende de hele isometrische hold licht gebogen en laat je arm niet zakken.'
