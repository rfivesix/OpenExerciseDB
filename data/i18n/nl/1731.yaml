name: Front raise aan de kabel
description: 'Startpositie:

  Ga met je gezicht naar of van een lage kabelkatrol staan. Pak het handvat met een bovenhandse greep
  voor je dijen vast. Houd je elleboog licht gebogen en span je romp aan.


  Uitvoering:

  1. Hef het handvat in een vloeiende boog naar voren en omhoog tot schouderhoogte.

  2. Pauzeer kort bovenaan en span de voorste deltaspier aan.

  3. Laat het handvat langzaam en gecontroleerd zakken naar de beginpositie.


  Tips:

  Houd je houding stabiel. Leun niet achterover en zwaai je romp niet om de herhaling te starten.'
