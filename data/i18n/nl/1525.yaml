name: Medicine ball slam
description: 'Startpositie:

  Sta met je voeten op schouderbreedte en je knieën en heupen licht gebogen. Houd een medicine ball met
  beide handen op borsthoogte en span je core aan.


  Uitvoering:

  1. Strek je knieën en heupen explosief, breng de bal boven je hoofd en kom op je tenen.

  2. Gebruik je core, lats en armen om de bal met maximale kracht recht tussen je voeten op de vloer te
  slaan.

  3. Buig vanuit je heupen en knieën om de beweging op te vangen.

  4. Hurk om de bal op te pakken en begin meteen aan de volgende herhaling.'
