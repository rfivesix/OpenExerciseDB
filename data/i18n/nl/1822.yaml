name: 'Thoracale stretch: open boek'
description: 'Beginpositie: Ga op je zij op een mat liggen met je heupen en knieën 90° gebogen en op elkaar
  gestapeld. Strek beide armen voor je borst uit met de handpalmen tegen elkaar.


  Uitvoering:

  1. Adem in en beweeg je bovenste arm in een boog omhoog en naar achteren, alsof je een boek opent.

  2. Roteer vanuit je borstwervelkolom en houd bekken, heupen en gestapelde knieën stil.

  3. Laat je hoofd en ogen je bewegende hand rustig volgen richting de vloer achter je.

  4. Adem uit aan het einde van de beweging en houd de rek over borst en bovenrug 1–2 seconden vast.

  5. Adem in en beweeg je arm langzaam terug naar de beginpositie, met de handpalmen tegen elkaar.


  Aanwijzing: Beweeg alleen vanuit de midden- en bovenrug; laat je bovenste knie niet naar achteren schuiven.'
