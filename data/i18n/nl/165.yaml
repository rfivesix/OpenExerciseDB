name: Knee tuck met fitnessbal
description: 'Beginpositie:

  Neem een hoge plank- of push-uphouding aan, met je handen op schouderbreedte en je schenen op een fitnessbal.
  Houd je lichaam in een rechte lijn van je schouders tot je enkels en span je romp aan.


  Uitvoering:

  1. Span je buikspieren en heupbuigers aan om je knieën naar je borst te trekken en de bal naar voren
  tot op je tenen te rollen.

  2. Houd de maximale aanspanning van je romp één seconde vast.

  3. Strek je benen langzaam en rol de bal naar achteren tot je weer in de rechte plankpositie bent.


  Opmerkingen:

  Laat je onderrug niet doorzakken en laat je heupen niet onder de lichaamslijn zakken. Houd je schouders
  recht boven je polsen.'
