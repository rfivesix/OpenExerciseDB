name: Isometrische leg extension
description: 'Beginpositie: Ga op de leg-extensionmachine zitten met je rug stevig tegen de rugleuning
  en zorg dat je kniegewrichten op één lijn staan met de draaias van de machine. Plaats de rol tegen je
  onderbenen, net boven de enkels. Pak de handgrepen aan de zijkant vast om je heupen op de zitting te
  houden.


  Uitvoering: Strek je knieën om de gewatteerde hefboom tot de doelhoek te heffen (meestal met 45 tot
  60 graden knieflexie, of net voor volledige strekking). Houd deze positie gedurende de voorgeschreven
  tijd onbeweeglijk tegen de weerstand vast en span je quadriceps maximaal aan. Laat het gewicht na de
  hold langzaam en gecontroleerd zakken.


  Aanwijzingen: Blijf rustig ademen en pers niet met ingehouden adem (Valsalva-manoeuvre). Houd je heupen
  stevig tegen de zitting en laat je knieën tijdens de contractie niet verschuiven.'
