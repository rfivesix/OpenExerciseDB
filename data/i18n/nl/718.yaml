name: Wall sit
description: Sta met je rug tegen de muur en je voeten op schouderbreedte, ongeveer zestig centimeter
  van de muur. Schuif omlaag tot je dijen evenwijdig aan de vloer zijn en je heupen en knieën een hoek
  van 90 graden vormen. Houd je knieën recht boven je enkels, span je romp aan en houd de isometrische
  squat de voorgeschreven tijd vast.
