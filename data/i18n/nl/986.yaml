name: Laterale uitvalspas (links)
description: Sta met je voeten wijder dan schouderbreedte en je tenen naar voren of iets naar buiten.
  Verplaats je gewicht naar links, buig je linkerknie en beweeg je heupen naar achteren. Houd je rechterbeen
  gestrekt en je rechtervoet plat op de vloer. Zak tot je linkerbovenbeen bijna parallel aan de vloer
  is en duw via je linkerhiel terug naar de brede stand. Houd je borst omhoog en je linkerknie in lijn
  met je voet.
