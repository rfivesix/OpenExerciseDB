name: Lat pulldown met omgekeerde greep
description: Ga bij het lat-pulldownstation zitten en stel de dijsteunen af. Pak de
  stang op schouderbreedte met onderhandse greep. Zit rechtop met borst omhoog en
  een lichte holling in je bovenrug. Trek de stang naar je bovenborst door je ellebogen
  omlaag en iets naar achteren te bewegen; trek je schouderbladen samen. Breng de
  stang gecontroleerd terug en zwaai niet met je romp.
