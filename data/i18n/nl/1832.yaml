name: Ring support hold
description: 'Beginpositie: Ga tussen twee hangende gymnastiekringen staan. Pak de ringen neutraal vast
  en spring of druk jezelf omhoog naar een steunpositie met volledig gestrekte armen.


  Uitvoering:

  1. Draai de ringen actief naar buiten (RTO), met je handpalmen naar voren en duimen van je lichaam af,
  zodat je onderarmen niet tegen de banden rusten.

  2. Duw je schouders omlaag, weg van je oren, en strek je ellebogen volledig.

  3. Houd een hollow-bodypositie: span je buikspieren aan, knijp je bilspieren samen en houd je gestrekte
  benen bij elkaar met de tenen gestrekt.

  4. Houd deze isometrische positie de voorgeschreven tijd vast en blijf rustig ademen.


  Aanwijzing: De ringen naar buiten draaien voorkomt dat je op de banden steunt en maximaliseert de stabilisatie
  door borst, biceps en voorste schouders.'
