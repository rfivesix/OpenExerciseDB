name: Donkey kick met dumbbell
description: 'De donkey kick met dumbbell traint de bilspieren en hamstrings. Je voert de oefening doorgaans
  op handen en knieën uit en gebruikt een dumbbell als extra weerstand.


  Beginpositie: Kom op een mat op handen en knieën, met je handen onder je schouders en je knieën onder
  je heupen.

  Dumbbell plaatsen: Houd een dumbbell stevig achter de knie van het been dat je gaat heffen, zodat deze
  niet valt.


  Uitvoering:

  Adem in en til bij het uitademen het been met de dumbbell omhoog, met de knie gebogen in een hoek van
  90 graden.

  Breng het been tot het evenwijdig aan de vloer is en voel de aanspanning in je bilspieren.

  Houd bovenaan één seconde vast en laat het been langzaam zakken naar de beginpositie.


  Herhalingen: Voer 10 tot 15 herhalingen per been uit en houd je techniek gedurende de oefening aan.

  Sets: Doe 2 tot 3 sets, afhankelijk van je conditieniveau.'
