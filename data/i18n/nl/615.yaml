name: Back squat met halterstang
description: Plaats een halterstang in een rek net onder schouderhoogte. Stap onder de stang zodat deze achter je
  nek op je bovenrug rust en pak hem breder dan schouderbreedte vast. Til je borst op en knijp je schouderbladen
  samen om je rug tijdens de hele beweging recht te houden. Sta op om de stang uit het rek te tillen en stap achteruit.
  Zet je voeten iets breder dan schouderbreedte. Beweeg je heupen naar achteren en houd je rug recht en borst omhoog
  terwijl je squat tot je heupen lager zijn dan je knieën. Duw vanaf de onderkant je voeten in de vloer en breng
  je heupen naar voren om weer rechtop te staan.
