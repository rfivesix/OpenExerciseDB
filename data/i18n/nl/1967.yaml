name: Zittende dumbbell shoulder press
description: 'Startpositie:

  Ga op een trainingsbank zitten die ongeveer 75–85 graden rechtop staat. Breng twee dumbbells naar schouderhoogte,
  met de handpalmen naar voren en de ellebogen 90 graden gebogen. Zet je voeten stevig op de vloer en
  houd je bovenrug tegen de rugleuning.


  Uitvoering:

  Duw de dumbbells soepel recht omhoog tot je armen gestrekt zijn, zonder je ellebogen op slot te zetten.
  Breng ze bovenaan dicht bij elkaar zonder ze tegen elkaar te slaan. Pauzeer kort en laat de gewichten
  langzaam en gecontroleerd zakken tot oor- of schouderhoogte.


  Tips:

  Span je romp aan en houd je rug tegen de bank. Voorkom dat je je onderrug overdreven hol trekt om zware
  gewichten te drukken.'
