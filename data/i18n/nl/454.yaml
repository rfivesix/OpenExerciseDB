name: Pike push-up
description: 'Beginpositie:

  Neem de neerwaartse-hond- of pikehouding aan met je handen op schouderbreedte, je heupen hoog en je
  lichaam in een omgekeerde V-vorm.

  Uitvoering:

  1. Buig je ellebogen en laat de bovenkant van je hoofd naar de vloer zakken, tussen of iets voor je
  handen.

  2. Duw stevig met je handpalmen om terug te keren naar de pikehouding.

  3. Houd je romp aangespannen en je benen zo recht mogelijk. Voor meer uitdaging kun je je voeten op
  een bank of box plaatsen.'
