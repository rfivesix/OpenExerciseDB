description: |-
  Startpositie:
  Neem een omgekeerde V-positie aan (neerwaartse hond), met een rechte rug en gestrekte benen en armen. De heupen wijzen omhoog in de lucht.
  Uitvoering:
  1. Buig je ellebogen gecontroleerd en breng de bovenkant van je hoofd schuin naar voren richting de grond.
  2. Duw jezelf krachtig omhoog vanuit de schouders totdat je armen weer volledig gestrekt zijn.
  3. Herhaal voor het gewenste aantal herhalingen.
