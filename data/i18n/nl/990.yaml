name: Geknielde bilspierkickback
description: Begin op handen en knieën op een mat, met je handen onder je schouders en knieën onder je
  heupen. Span je romp aan en houd je knie ongeveer 90 graden gebogen (of strek je been). Duw de voetzool
  van één voet omhoog en naar achteren richting het plafond en span je bilspier aan. Houd bovenaan een
  seconde vast en laat je knie langzaam zakken zonder hem helemaal neer te leggen. Hol je onderrug niet
  en verplaats je gewicht niet sterk naar één kant.
