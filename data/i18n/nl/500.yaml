name: Omgekeerde plank
description: 'Ga op de vloer zitten met je benen recht voor je uit. Zet je handen achter je heupen op
  de vloer, met je vingers naar je voeten gericht.

  Duw via je handpalmen en hielen en til je heupen op tot je lichaam een rechte lijn vormt van je hoofd
  tot je hielen. Span je bilspieren, hamstrings en bovenrug aan en houd je borst omhoog en je heupen hoog.
  Houd deze positie statisch vast.'
