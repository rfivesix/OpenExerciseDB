name: Achterste deltavlieg met borststeun
description: 'Beginpositie: Zet een schuine bank op ongeveer 30–45°. Ga met je borst tegen de steun liggen,
  voeten op de vloer en nek neutraal. Houd lichte dumbbells met neutrale greep of duimen omhoog recht
  onder je.


  Uitvoering:

  1. Til met licht gebogen ellebogen de dumbbells in een brede Y-boog schuin omhoog en naar buiten.

  2. Trek vanuit je achterste deltaspieren en trek bovenaan je schouderbladen naar elkaar.

  3. Knijp een seconde samen wanneer je armen ongeveer op schouderhoogte zijn.

  4. Laat de gewichten langzaam en gecontroleerd zakken.


  Aanwijzing: Je borst tegen de bank houden voorkomt zwaaien en helpt de achterste deltaspieren en bovenrug
  geïsoleerd te trainen.'
