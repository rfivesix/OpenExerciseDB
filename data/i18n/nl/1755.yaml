name: Kabel Y-raise voor de schouders
description: 'Bevestig D-handgrepen aan de lage katrollen van een dubbele kabelmachine. Ga in het midden
  staan en pak de handgrepen gekruist vast: rechterhand aan de linkerkabel en linkerhand aan de rechterkabel.
  Begin met gekruiste handen voor je middel.


  1. Beweeg beide armen in een vloeiende diagonale baan omhoog en naar buiten tot ze boven schouderhoogte
  een Y vormen.

  2. Trek je schouderbladen bovenaan actief naar elkaar toe en omlaag; focus op je onderste trapezius
  en laterale deltaspieren.

  3. Laat je armen langs dezelfde diagonale baan langzaam zakken naar de beginpositie.


  Houd je ellebogen licht gebogen en vast; hol je onderrug niet om de beweging af te maken.'
