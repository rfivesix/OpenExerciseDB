name: Uitvalspas met lichaamsgewicht
description: Sta rechtop met je voeten op heupbreedte, borst omhoog en je handen op je heupen of voor
  je borst. Zet gecontroleerd een ruime stap naar voren. Laat je heupen zakken tot beide knieën ongeveer
  90 graden gebogen zijn en de achterste knie net boven de vloer hangt. Duw via je voorste hiel terug
  naar de startpositie. Houd je romp rechtop en laat je voorste knie in lijn met je tenen bewegen.
