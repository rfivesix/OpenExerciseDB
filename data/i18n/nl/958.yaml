name: Biceps curl met TRX
description: 'Beginpositie: pak de TRX-handgrepen met een onderhandse greep vast en kijk naar het ankerpunt.
  Leun achterover met gestrekte armen en je voeten naar voren, met je lichaam in een rechte planklijn.
  Uitvoering: houd je ellebogen hoog op schouderhoogte en naar voren gericht; buig ze om met je biceps
  je voorhoofd naar je handen te trekken. Terugkeer: strek je armen en laat je lichaam gecontroleerd achterover
  bewegen naar de beginpositie. Aanwijzingen: laat je ellebogen niet zakken en gebruik geen heupzwaai;
  houd je romp voortdurend aangespannen.'
