name: Omgekeerde roeibeweging
description: 'Startpositie:

  • Plaats een halterstang in een rek op heuphoogte, of gebruik een Smith-machine of suspensiontrainer.

  • Ga op je rug onder de stang liggen en pak deze bovenhands iets breder dan schouderbreedte vast.

  • Strek je benen met je hielen op de grond en houd je lichaam recht van hoofd tot hielen.


  Uitvoering:

  • Trek je borst naar de stang door je ellebogen naar achteren te bewegen en je schouderbladen naar elkaar
  toe te trekken.

  • Span je bilspieren en romp aan zodat je heupen niet doorzakken.

  • Laat jezelf langzaam en gecontroleerd zakken tot je armen volledig gestrekt zijn.'
