name: Isometrische lat pulldown
description: 'Beginpositie: Ga op de lat-pulldownmachine zitten en stel het dijbeensteunblok zo af dat
  je benen stevig vastzitten. Pak de brede stang bovenhands vast, wijder dan schouderbreedte. Zit rechtop
  met je borst vooruit, je schouderbladen naar elkaar toe en omlaag getrokken en je romp iets naar achteren
  geleund.


  Uitvoering: Trek de stang soepel tot net onder je kin of tot je bovenborst. Houd deze volledig samengetrokken
  positie gedurende de voorgeschreven tijd onbeweeglijk vast; stuur je ellebogen omlaag en span je lats
  en middenrug maximaal aan. Laat de stang na afloop langzaam en gecontroleerd omhoogkomen.


  Aanwijzingen: Laat de gewichtsstapel je armen aan het einde van de set niet plotseling omhoog trekken.
  Houd je borst omhoog en rond je schouders tijdens de hold niet naar voren.'
