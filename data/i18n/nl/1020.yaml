name: Pistol squat (rechts)
description: |-
  Beginpositie:
  Sta rechtop op je rechterbeen met je linkerbeen gestrekt naar voren boven de grond geheven. Strek je armen naar voren voor balans.

  Uitvoering:
  1. Buig langzaam je rechterknie en heup om gecontroleerd in een diepe eenbenige squat te zakken.
  2. Houd je rug recht, borst opgericht en het linkerbeen van de vloer.
  3. Zak zo diep als je mobiliteit toelaat.
  4. Duw krachtig af vanuit je rechterhiel om weer helemaal rechtop te gaan staan.
