name: Pec-deckfly met smalle greep
description: 'De beweging is hetzelfde als bij de gewone pec-deckfly, maar met een smalle greep:

  Ga op de machine zitten met je voeten stevig op de vloer en je bovenarmen parallel aan de vloer. Breng
  je armen bij elkaar tot de handgrepen elkaar bijna raken, maar niet helemaal. Keer langzaam terug. De
  gewichten blijven tijdens de hele oefening bovenaan.'
