name: Eenarmige overhead tricepsstrekking met kabel
description: Zet de katrol onderaan de kabelmachine en pak de kabel vast zonder handgreep. Strek de kabel
  recht boven je hoofd. Houd je rug recht en je bovenarm stil. Laat de kabel achter je hoofd zakken tot
  je een duidelijke rek in je triceps voelt en strek je arm daarna weer omhoog tot je elleboog gestrekt
  is.
