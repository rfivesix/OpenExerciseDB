name: EZ-bar overhead triceps extension
description: 'Startpositie:

  Zit op een bank met rugsteun of sta rechtop met je core aangespannen. Pak een EZ-stang met een smalle
  bovenhandse greep en druk hem boven je hoofd tot je armen gestrekt zijn.


  Uitvoering:

  1. Houd je bovenarmen dicht bij je hoofd en je ellebogen naar voren. Buig je ellebogen langzaam tot
  ongeveer 90° en laat de stang achter je hoofd zakken.

  2. Pauzeer kort in de gestrekte positie.

  3. Strek je ellebogen en druk de stang terug omhoog; span bovenaan je triceps aan.


  Aandachtspunten:

  Laat je ellebogen niet wijd naar buiten gaan.'
