name: Afwisselende biceps curls met dumbbells
description: Sta rechtop met voeten op heupbreedte en dumbbells naast je, armen gestrekt en handpalmen
  naar binnen. Houd borst omhoog, schouders naar achteren en ellebogen dicht bij de ribben. Curl één dumbbell
  omhoog en draai de onderarm zodat de handpalm bovenaan naar de schouder wijst. Span de biceps aan en
  laat gecontroleerd zakken terwijl de andere arm begint. Houd de romp stil.
