name: Chair dips
description: 'Ga op de voorrand van een stevige stoel of bank zitten. Zet je handen naast je heupen op
  de rand, met je vingers naar voren. Strek je armen en schuif je heupen naar voren zodat ze net voor
  de rand hangen. Zet je voeten plat neer met gebogen knieën (makkelijker) of gestrekte benen en hielen
  op de vloer (moeilijker).


  1. Laat je lichaam langzaam zakken door je ellebogen recht naar achteren te buigen; houd je rug dicht
  bij de stoel.

  2. Zak tot je bovenarmen ongeveer parallel aan de vloer zijn en je ellebogen ongeveer 90 graden gebogen
  zijn.

  3. Duw stevig vanuit je handpalmen en strek je armen om terug te keren naar de beginpositie.


  Houd je romp rechtop en dicht bij de stoel; spreid je ellebogen niet wijd.'
