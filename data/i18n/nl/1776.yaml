name: Suitcase carry
description: 'Til een zware dumbbell of kettlebell met één hand van de vloer alsof het een koffer is.
  Sta rechtop met je voeten op heupbreedte, schouders stabiel en romp verticaal. Span je core en schuine
  buikspieren aan.


  1. Loop in een rechte lijn voorwaarts met langzame, beheerste passen.

  2. Weersta de trekkracht van het gewicht: houd je schouders horizontaal en voorkom dat je romp naar
  de last helt.

  3. Loop de voorgeschreven afstand of tijd, zet het gewicht veilig neer en wissel van hand.


  Loop rechtop. Helle niet naar het gewicht en trek je andere heup niet op.'
