name: Roeibeweging
description: Bij krachttraining is roeien een oefening om de spieren te versterken die de armen naar het
  lichaam toe trekken (latissimus dorsi), de spieren die de schouderbladen naar elkaar toe trekken (trapezius
  en rhomboïden) en de spieren die de wervelkolom ondersteunen (erector spinae). Bij gebruik van een roeimachine
  train je ook de spieren die de benen strekken en ondersteunen (quadriceps en bovenbeenspieren). In alle
  gevallen moeten de buik- en onderrugspieren het lichaam ondersteunen en helpen rugblessures te voorkomen.
