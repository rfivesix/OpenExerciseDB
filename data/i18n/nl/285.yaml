name: High knee jumps
description: 'Begin met je voeten iets breder dan schouderbreedte.

  Zak in een squat met je lichaamsgewicht.

  Duw jezelf onderaan explosief omhoog in een sprong en trek tegelijkertijd tijdens de vlucht je knieën
  naar je borst. Houd je knieën opgetrokken tot het hoogste punt van de sprong.

  Land op beide voeten en houd je knieën licht gebogen om overmatige belasting van je gewrichten te voorkomen.
  Bereid je zo snel mogelijk, maar gecontroleerd, voor op de volgende herhaling.'
