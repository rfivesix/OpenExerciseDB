name: Tricepsstretch boven het hoofd (links)
description: 'Startpositie:

  • Sta of zit rechtop met je wervelkolom in een neutrale houding.

  • Breng je linkerarm boven je hoofd, buig je elleboog en laat je linkerhand achter je nek of tussen
  je schouderbladen zakken.


  Uitvoering:

  • Pak je linkerelleboog met je rechterhand vast en trek hem voorzichtig naar achteren en iets omlaag.

  • Houd 20 tot 30 seconden een lichte, comfortabele rek in je linkertriceps vast.

  • Adem diep en voorkom dat je je onderrug overdreven hol trekt.'
