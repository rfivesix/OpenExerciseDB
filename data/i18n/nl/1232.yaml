description: 'Startpositie:

  • Sta met je linkerzij naast een vlakke muur.

  • Strek je linkerarm recht naar achteren en plaats je linkerhand plat tegen de muur op schouderhoogte,
  met je vingers naar achteren.


  Uitvoering:

  • Draai je romp en heupen langzaam van de muur af naar rechts.

  • Stop zodra je een comfortabele rek voelt in je linkerbiceps, voorste deltaspier en borst.

  • Houd de rek 20 tot 30 seconden vast terwijl je rustig ademt.'
