name: Cable fly vanaf lage katrol
description: 'Stel het kabelapparaat in: zet de katrol op de laagste stand. Kies handgrepen: je kunt neutrale
  handgrepen (handpalmen naar elkaar) of rechte handgrepen gebruiken; neutraal kan prettiger zijn voor
  je polsen. Ga staan met je voeten op schouderbreedte, knieën licht gebogen en romp aangespannen. Houd
  tijdens de oefening een lichte holling in je onderrug. Pak de grepen vast en stap een of twee kleine
  stappen achteruit tot de kabels licht gespannen zijn. Houd je ellebogen licht gebogen. Breng je handen
  vóór je borst naar elkaar alsof je iemand een grote knuffel geeft, en span je borstspieren aan. Richt
  je op het aanspannen van je borst in plaats van met je armen aan de grepen te trekken. Houd bovenaan
  met je handen bij elkaar op borsthoogte kort vast. Laat de spanning langzaam los en breng de grepen
  gecontroleerd terug naar beneden; houd je armen licht gebogen.'
