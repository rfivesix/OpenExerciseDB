  license_author: CptnFatbeard
  source_id: '2531'
description: |-
  開始姿勢：床またはベンチに仰向けになり、狭い手幅でバーベルを握って構えます。
  動作手順：脇を締めてバーを胸へ下ろし、上腕三頭筋を強く意識しながら垂直に押し上げます。
  ポイント：背中を平らに保ち、肘を開かずにまっすぐ押し込むことで三頭筋への刺激を高めます。
