description: |-
  開始姿勢:
  仰向けに寝転がり、両脚を伸ばしてリラックスします。

  動作手順:
  1. 片膝を曲げて両手で抱え込み、胸に向かってゆっくりと引き寄せます。
  2. 反対側の脚は床に平らに伸ばしたまま保ち、腰と臀部の伸びを感じます。
  3. 深い呼吸をしながら20〜30秒間キープし、反対側も同様に行います。

  ポイント:
  腰背部の緊張を緩和し、大臀筋と股関節周囲の柔軟性を回復させます。
