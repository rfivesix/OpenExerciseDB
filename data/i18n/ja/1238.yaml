description: |-
  【開始姿勢】しゃがんで両手を肩幅で床につき、膝を肘の外側または後ろに乗せます。【動作手順】体重を前方へゆっくり預け、足を床から浮かせて両手だけでバランスをとります。【ポイント】三角筋前部と手首の力、体幹で安定させ、前方を見つめて静止します。
