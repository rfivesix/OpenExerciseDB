description: |-
  【開始姿勢】直立して両手にダンベルを持ちます。【動作手順】ダンベルを真横へサイドレイズし、そのまま前方に回してフロントレイズの位置へ移動させて下ろします。【ポイント】三角筋中部 (側部)と三角筋前部を連続して刺激し、動作をコントロールします。
