name: アイソメトリック・ベンチプレス
description: |-
  開始姿勢:
  フラットベンチに仰向けになり、肩甲骨を寄せて下げ、両足を床にしっかりとつけます。バーベルを目線の真上に合わせ、肩幅よりやや広めの順手で握ってラックから外し、胸の真上で安定させます。

  動作手順:
  1. コントロールしながらバーベルを下ろし、胸の数センチ上または自身のスティッキングポイント（動作の停滞位置）で停止させます（あるいはパワーラックのセーフティバーに押し当てます）。
  2. その位置でバーベルを完全に静止させ、大胸筋、三角筋前部、上腕三頭筋に最大の力を込めて指定秒数キープします。
  3. 指定時間が終了したら、バーベルを元のトップポジションまで力強く押し上げてラックに戻します。

  ポイント:
  動作中は足裏で床を押し、体幹のアーチと緊張を崩さないように維持します。バーを胸骨に乗せて休ませないよう注意してください。
