  source_id: '408'
description: |-
  開始姿勢:
  仰向けに寝転がり、膝を約90度に曲げて足裏を床に平らにつけます。足幅は腰幅程度に開き、両腕は体側に置きます。

  動作手順:
  1. 体幹を引き締め、踵で床を押して骨盤を天井に向けて持ち上げます。
  2. 肩から膝までが一直線になる高さまで押し上げ、トップポジションで大臀筋を強く収縮させて1〜2秒静止します。
  3. 臀部をコントロールしながらゆっくりと床のすぐ手前まで下ろします。

  ポイント:
  腰を反らせるのではなく、股関節を伸展させて大臀筋をメインに稼働させます。
