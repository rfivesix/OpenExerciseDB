description: |-
  【開始姿勢】壁に向かって倒立し（または自立倒立）、腕をまっすぐ伸ばして身体を支えます。【動作手順】体幹を締めたまま肘を曲げ、頭頂部が床に軽く触れるまで下ろし、三角筋前部と上腕三頭筋で押し戻します。【ポイント】バランスを崩さないよう視線を固定し、制御しながら行います。
