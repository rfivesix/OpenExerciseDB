description: |-
  【開始姿勢】背中の上部にプレートを乗せ、腕立て伏せの姿勢をとります。【動作手順】体幹をまっすぐに保ちながら胸を床近くまで下ろし、力強く押し上げます。【ポイント】大胸筋と上腕三頭筋に自重以上の高負荷をかけ、筋肥大を促進します。
