description: |-
  開始姿勢：ケーブルタワーの前に立ち、ロープーリーのバーを逆手で握って直立します。
  動作手順：肘を体側に固定し、上腕二頭筋を収縮させてバーを胸の高さまで引き上げます。
  ポイント：動作全体を通して負荷が抜けず一定にかかるため、トップとボトムの両方でコントロールします。
