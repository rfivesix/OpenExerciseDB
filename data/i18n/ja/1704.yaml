description: |-
  開始姿勢：パラレットまたは平行棒に両手をつき、腕を伸ばして体を浮かせます。
  動作手順：膝を曲げて胸に引き寄せ、腹直筋と腸腰筋を使って体が浮いた状態を維持します。
  ポイント：肩を下げて首を長く保ち、お腹を強く引き締めてバランスを保ちます。
