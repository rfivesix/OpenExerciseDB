name: ハイケーブル・クロス・トライセプスエクステンション
description: |-
  開始姿勢：左右の高い位置のケーブルを交差させて握り、ケーブルタワーの中央に立ちます。
  動作手順：肘の位置を固定したまま、腕を斜め下外側に向かって伸ばし、上腕三頭筋長頭を収縮させます。
  ポイント：交差した軌道により三頭筋に独自のストレッチと収縮がかかるため、丁寧にコントロールします。
