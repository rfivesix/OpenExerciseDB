description: |-
  開始姿勢:
  横向きに寝て、股関節を約45度、両膝を約90度に曲げて揃えます。踵同士を合わせます。

  動作手順:
  1. 踵を合わせたまま、貝殻（クラム）が開くように上側の膝をゆっくりと天井に向けて開きます。
  2. 骨盤が後ろに倒れないように固定し、お尻の外側（中臀筋・深層外旋筋群）を収縮させます。
  3. ゆっくりと膝を閉じて元の位置に戻します。

  ポイント:
  股関節の外旋と外転をコントロールする中臀筋を集中的に活性化させる定番種目です。
