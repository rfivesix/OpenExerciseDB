description: |-
  開始姿勢：マットに仰向けになり、膝を曲げて胸の上でウェイトプレートを両手で保持します。
  動作手順：息を吐きながら背中を丸めて上体を起こし、腹直筋を強く収縮させてゆっくり下ろします。
  ポイント：プレートの重みで腹筋にしっかり負荷を乗せ、首に余計な力が入らないよう注意します。
