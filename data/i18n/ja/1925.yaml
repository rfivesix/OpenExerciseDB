name: バーベル・シルバーバックシュラッグ
upstream:
  license: CC-BY-SA-4.0
  source_id: '3074'
description: |-
  開始姿勢: 足を肩幅に開き、肩幅より少し広めのグリップでバーベルを握ります。膝を軽く曲げ、股関節から上体を前傾させて背筋を真っ直ぐ保ちます。動作手順: 肘を曲げずに、肩甲骨同士を背中の中央で触れ合わせるように強く引き寄せます。トップで僧帽筋中部と菱形筋を収縮させ、ゆっくりと肩甲骨を開いて元の位置に戻します。ポイント: 前傾姿勢で行うことで、通常の直立シュラッグでは刺激しにくい背中の中央部に効かせます。
