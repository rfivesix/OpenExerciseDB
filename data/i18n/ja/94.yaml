name: EZバー・バイセップスカール
description: |-
  開始姿勢：背筋を伸ばして立ち、EZバーの曲がり角を肩幅の逆手で握ります。
  動作手順：肘を固定して上腕二頭筋の力でバーを胸の高さまで巻き上げ、トップで静止してからゆっくり下ろします。
  ポイント：手首の自然な角度を保ちつつ、体幹を固めて反動を使わないようにします。
