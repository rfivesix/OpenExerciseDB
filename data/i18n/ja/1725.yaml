description: |-
  開始姿勢: マシンのシートに座り、胸をパッドにつけて背筋を伸ばします。ハンドルを両手で握ります。動作手順: 胸を張ったまま、肘を後方に引いて肩甲骨をしっかりと寄せます。背中の筋肉の収縮を意識したら、ゆっくりと負荷をコントロールしながら戻します。ポイント: 動作中に背中を丸めたり、体を前後に揺らしたりせず、胸をパッドにつけたまま引きます。
