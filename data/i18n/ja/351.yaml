description: |-
  【開始姿勢】直立して両手にダンベルを持ち、体の横に構えます。【動作手順】ダンベルを真横の肩の高さまで持ち上げ、水平を保ったまま前方へ移動させ、ゆっくり下ろします。【ポイント】三角筋中部 (側部)と三角筋前部を連続して刺激し、反動を抑えます。
