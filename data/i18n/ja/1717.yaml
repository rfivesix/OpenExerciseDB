name: ワンアーム・ケーブル・オーバーヘッドエクステンション
description: |-
  開始姿勢：ケーブルに背を向けて立ち、片手で頭の後ろからケーブルハンドルを保持します。
  動作手順：肘の位置を固定したまま前方に向かって腕を押し伸ばし、上腕三頭筋を強く収縮させます。
  ポイント：体幹をまっすぐに保ち、三頭筋のストレッチと収縮をコントロールして行います。
