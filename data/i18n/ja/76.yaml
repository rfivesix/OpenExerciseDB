description: |-
  開始姿勢：フラットベンチに仰向けになり、肩幅程度の狭い手幅でバーベルを握ります。
  動作手順：肘を体側に引き寄せて脇を締めながらバーを胸下部へ下ろし、上腕三頭筋を使って押し上げます。
  ポイント：肘を外側に広げず、手首をまっすぐに立ててバーを支えます。
