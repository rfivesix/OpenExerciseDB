description: |-
  【開始姿勢】足を広めに開き、片手を胸の下につき、反対の手を背中に回します。【動作手順】体幹をねじらないよう意識しながら肘を曲げて身体を下ろし、押し上げます。【ポイント】大胸筋と上腕三頭筋、体幹の強大な筋力が必要な高難度種目です。
