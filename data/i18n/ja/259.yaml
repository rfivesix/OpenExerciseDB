description: |-
  開始姿勢: ケーブルタワーの前に座るか立ち、肩幅より狭いナローグリップでハンドルを握ります。胸を張って背筋を真っ直ぐ保ちます。動作手順: 肘を体側に沿わせながら下方向へ引き、ハンドルを胸の上部まで引き寄せます。広背筋の収縮を感じたら、負荷を感じながらコントロールして開始姿勢に戻します。ポイント: 体幹をぶらさず、反動を使わないように行います。
