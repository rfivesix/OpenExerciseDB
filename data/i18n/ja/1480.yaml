description: |-
  開始姿勢：フラットベンチに仰向けになり、バーベルを肩幅の順手で胸の上に伸ばします。
  動作手順：肘の位置を固定したまま肘を曲げてバーをおでこの上方へ下ろし、上腕三頭筋で押し上げます。
  ポイント：肘が外側に開かないように締め、ゆっくりとコントロールして下ろします。
