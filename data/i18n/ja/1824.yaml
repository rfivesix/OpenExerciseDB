description: |-
  開始姿勢：フラットベンチに仰向けになり、両手にダンベルを持って胸の上で腕を伸ばします。
  動作手順：肘を外側に向けたままダンベルの内側同士を近づけて胸元へ下ろし、上腕三頭筋で押し上げます。
  ポイント：上腕三頭筋内側頭と外側頭に強烈な収縮がかかるため、肘のコントロールを重視します。
