description: |-
  開始姿勢:
  四つん這いまたはプランクの姿勢から、片膝を曲げて両手の間に滑り込ませ、すねを斜めに寝かせます。後ろ脚は真っ直ぐ後方に伸ばします。

  動作手順:
  1. 骨盤を正面に向け、水平を保ったまま上体をゆっくりと前に倒して前腕を床につけます。
  2. 前に曲げた側のお尻（大臀筋・深層外旋筋）に強いストレッチを感じる位置で深く呼吸しながら30秒間キープします。
  3. ゆっくり上体を起こし、脚を入れ替えます。

  ポイント:
  硬くなりやすい臀部を深層から解放し、骨盤のアライメントを整えるヨガ由来の名作ポーズです。
