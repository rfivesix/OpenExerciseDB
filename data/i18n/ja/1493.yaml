description: |-
  開始姿勢：ロープーリーケーブルに背を向けて一歩前に立ち、片手または両手でハンドルを握ります。
  動作手順：肩を後方に引いた伸展位から、上腕二頭筋長頭を使って前腕部を手前へ巻き上げます。
  ポイント：二頭筋が初動から強くストレッチされるため、肘の位置を前後に振らないようにします。
