description: |-
  開始姿勢: ケーブルマシンの横に立ち、片腕を伸ばして高い位置のハンドルを握ります。体幹を安定させます。動作手順: 上体を固定したまま、腕を伸ばした状態でハンドルを体側・太ももの横に向かって弧を描くように引き下ろします。広背筋の外側を強く収縮させ、ゆっくり戻します。ポイント: 体を傾けたり回旋させたりせず、純粋に広背筋の側方からの引きで行います。
