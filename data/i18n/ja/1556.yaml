description: |-
  開始姿勢:
  2個のダンベルを足元の床に置き、足を腰幅に開いて立ちます。

  動作手順:
  1. しゃがんでダンベルのグリップを握り、両足を後ろへ跳ね出して腕立て伏せを行い、胸をダンベルの間の床につけます。
  2. 素早く足をダンベルの外側へ跳び戻してしゃがみ姿勢になり、ダンベルを両脚の間にスイングさせます。
  3. 股関節を爆発的に伸展させ、スナッチのようにダンベルを頭上へ一気に引き上げます。
  4. 頭上でロックアウトした後、コントロールしてダンベルを床へ下ろし、次のレップへ繋げます。

  ポイント:
  バーピーとダンベルスナッチを融合させた究極の全身爆発力・持久力コンディショニング種目です。
