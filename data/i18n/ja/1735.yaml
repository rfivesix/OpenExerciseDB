description: |-
  開始姿勢:
  レッグプレスマシンのシートに横向き気味に座り、鍛える側の足裏をプレートの上部寄りに置きます。

  動作手順:
  1. 膝を曲げてプレートをゆっくりと下ろし、大臀筋と中臀筋のストレッチを感じます。
  2. 踵で力強くプレートを押し出し、大臀筋を収縮させて押し戻します。
  3. 膝をロックしない位置で切り返し、滑らかに動作を繰り返します。

  ポイント:
  身体の角度と片脚支持により、大臀筋の上部および中臀筋に特化した負荷を与えられます。
