description: |-
  【開始姿勢】横向きに寝て、下側の腕の肩と肘を90度に曲げて床につけます。【動作手順】反対の手で手首を軽く押さえ、前腕を床に向けてゆっくりと内旋させます。【ポイント】回旋筋腱板 (ローテーターカフ)の後面を優しく伸ばし、肩の可動域を改善します。
