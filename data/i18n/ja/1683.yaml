description: |-
  開始姿勢：直立して両手にダンベルを持ち、手のひらを正面に向けて構えます。
  動作手順：逆手でダンベルを巻き上げた後、トップで手のひらを下に向けて順手に回し、ゆっくり下ろします。
  ポイント：巻き上げ時は上腕二頭筋、下ろす時は前腕部と腕橈骨筋を強力に鍛えられます。
