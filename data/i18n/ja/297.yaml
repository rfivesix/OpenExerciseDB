description: |-
  開始姿勢：マットに仰向けになり、両腕を頭上に伸ばし、両脚を揃えて伸ばします。
  動作手順：腰を床に強く押し付けたまま、肩甲骨と両脚を床から数センチ浮かせて船のような姿勢を保ちます。
  ポイント：腹直筋と腹横筋を最大限に引き締め、腰が浮きそうになったら膝を曲げて調整します。
