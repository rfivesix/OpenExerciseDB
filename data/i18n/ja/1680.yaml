name: シーテッド4の字ストレッチ
description: |-
  開始姿勢:
  ベンチや椅子に背筋を伸ばして座り、足裏を床につけます。

  動作手順:
  1. 片足の足首を反対側の膝の上に乗せ、「4の字」の形を作ります。
  2. 背筋を真っ直ぐ伸ばしたまま、股関節から胸をすねに近づけるように上体を前に倒します。
  3. 乗せた側の臀筋（特に梨状筋やお尻の奥）に心地よい伸びを感じる位置で20〜30秒キープします。
  4. 脚を入れ替えて反対側も同様に行います。

  ポイント:
  骨盤を立てて前傾させることで、坐骨神経痛の緩和や臀部の柔軟性向上に効果を発揮します。
