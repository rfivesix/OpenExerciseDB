name: スミスマシン・ショルダープレス
description: |-
  【開始姿勢】スミスマシンの下にベンチをほぼ垂直に置き、バーを肩幅よりやや広めに握ります。【動作手順】ロックを外してバーを鎖骨の高さまで下ろし、三角筋前部を意識して頭上へ押し上げます。【ポイント】軌道が固定されているため、肩甲骨を安定させ肩の筋肉に集中します。
