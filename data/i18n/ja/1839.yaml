description: |-
  開始姿勢：床に片膝立ちになり、前足の膝を90度に曲げて背筋をまっすぐに伸ばします。
  動作手順：骨盤を後傾させたままゆっくりと体重を前方へ移動させ、後足の腸腰筋を心地よく伸ばします。
  ポイント：腰を反らさず下腹部に力を入れ、太ももの付け根前側の伸長を感じてキープします。
