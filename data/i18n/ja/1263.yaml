description: |-
  開始姿勢：仰向けに寝て膝を曲げ、足を腰幅に開いて足裏をしっかりと床につけます。
  動作手順：踵で床を押し、大臀筋と脊柱起立筋を収縮させて膝から肩までが一直線になるまで腰を上げます。
  ポイント：腰を過剰に反らせず、トップポジションでお尻を強く引き締めてキープします。
