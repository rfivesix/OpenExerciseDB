description: |-
  開始姿勢:
  マット上に横向きに寝ます。下側の脚は軽く曲げて身体を安定させ、上側の脚を真っ直ぐ伸ばします。

  動作手順:
  1. つま先を正面またはやや下向きに保ちながら、上の脚をゆっくりと斜め上方へ持ち上げます。
  2. 中臀筋が強く収縮する高さまで上げ、トップで一瞬静止します。
  3. コントロールしながら脚を元の位置まで下ろします。

  ポイント:
  骨盤が後ろに倒れないように固定し、中臀筋をダイレクトに刺激します。
