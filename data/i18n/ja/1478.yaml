description: |-
  開始姿勢：マットに仰向けになり、膝を立てて両手を太ももの上に置きます。
  動作手順：息を吐きながら肩甲骨を浮かせ、手を膝に向かってスライドさせて腹直筋を強く収縮させます。
  ポイント：首の力で上がらず、腰を床に押し付けたまま腹筋の力だけで上体を持ち上げます。
