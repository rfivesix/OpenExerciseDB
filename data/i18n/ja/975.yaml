name: ワンハンド・ケトルベルカール
description: |-
  開始姿勢：片手でケトルベルのハンドルを持ち、背筋を伸ばして安定したスタンスで立ちます。
  動作手順：肘を脇腹に固定し、上腕二頭筋を使ってケトルベルを肩に向かって巻き上げます。
  ポイント：体のブレを体幹で抑え、ケトルベルの重心変化に耐えながらスムーズに動かします。
