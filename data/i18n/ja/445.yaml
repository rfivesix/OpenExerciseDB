description: |-
  【開始姿勢】フラットベンチに横になり、バーベルを肩幅よりやや広めに握ります。【動作手順】バーベルを胸の上まで下ろし、胸に触れた状態で1〜2秒静止してから、爆発的に押し上げます。【ポイント】静止中も大胸筋の緊張を緩めず、胸の弾みを使わずに押し上げます。
