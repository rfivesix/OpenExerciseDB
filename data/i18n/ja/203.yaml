description: |-
  開始姿勢:
  足を肩幅より少し広めに開き、つま先をやや外側に向けます。ダンベルの一端を両手で包み込むように持ち、胸の正面の高さで垂直に保持します。

  動作手順:
  1. 胸を張って背筋を伸ばしたまま、股関節を後方に引き、椅子に腰掛けるように深くしゃがみ込みます。
  2. 肘が膝の内側を通過する深さまで下ろし、太ももが床と平行になるまで腰を落とします。
  3. 踵でしっかりと床を押し、大臀筋と大腿四頭筋を意識しながら開始姿勢に戻ります。

  ポイント:
  ダンベルを胸の前に保持することで体幹の垂直が保ちやすく、初心者にも理想的なスクワットです。
