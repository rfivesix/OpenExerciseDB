description: |-
  【開始姿勢】インクラインベンチでダンベルプレスのボトムポジションで構えます。【動作手順】大胸筋上部に強い緊張をかけたまま、指定された時間静止し続けます。【ポイント】大胸筋上部 (鎖骨部)のテンションを逃がさず、呼吸を続けながら耐えます。
