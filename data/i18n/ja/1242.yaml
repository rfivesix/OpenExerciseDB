description: |-
  開始姿勢:
  床に脚を伸ばして座り、レジスタンスバンドの中央を足の母指球に掛け、両端を手で引っ張ってテンションをかけます。

  動作手順:
  1. 足首を伸ばし、バンドの抵抗を押し返すようにつま先を前方へ力強く押し込みます（足関節の底屈）。
  2. ふくらはぎ（下腿三頭筋）が完全に収縮した位置で一時静止します。
  3. 抵抗に耐えながら、ゆっくりと足首を手前に戻してストレッチを感じます。

  ポイント:
  ふくらはぎの筋力強化やリハビリテーションに最適な低衝撃のエクササイズです。
