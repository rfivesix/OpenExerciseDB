description: |-
  開始姿勢:
  足を肩幅に開いて立ち、腕をリラックスさせて体側に下ろします。

  動作手順:
  1. 上体を垂直に保ったまま腰を深く落とし、下降に合わせて踵を床から浮かせてつま先立ちになります。
  2. しゃがみ込みと同時に腕を後方にスイングし、手が踵の近くを通過するように動かします。
  3. 足裏を床に戻しながら力強く立ち上がり、同時に腕を前方の胸の高さへと振り上げます。

  ポイント:
  下半身の筋持久力と足関節の柔軟性を高めるインドの伝統的な自重スクワットです。
