name: ダンベル・スナッチ
description: |-
  開始姿勢:
  両足の間の床にダンベルを縦に置きます。足を肩幅よりやや広めに開き、股関節と膝を曲げてダンベルを片手で握ります。背筋を真っ直ぐ保ちます。

  動作手順:
  1. 股関節と膝を爆発的に伸展させ、地面を強く蹴りながらダンベルを身体に沿わせて垂直に引き上げます。
  2. ダンベルが胸の高さを越えた瞬間、素早く手首を返し、膝を軽く曲げてダンベルの下に潜り込みます。
  3. 頭上で腕をロックアウトして直立します。
  4. ダンベルを肩、太ももを経由して床までコントロールして下ろします。

  ポイント:
  全身の爆発的瞬発力、股関節の伸展力、肩の安定性を一度に鍛える最高峰の機能的種目です。
