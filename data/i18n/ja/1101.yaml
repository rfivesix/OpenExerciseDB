name: アイソメトリック・水平トラクション (静止懸垂)
upstream:
  license: CC-BY-SA-4.0
  license_author: clafal
  source_id: '2061'
description: |-
  開始姿勢: バーまたはサスペンショントレーナーを握り、身体を斜めまたは水平に保持します。動作手順: 胸をバーに引き寄せたトップポジションで身体を静止させ、一定時間 (10〜30秒) 姿勢をキープします。肩甲骨を強く寄せ、広背筋と菱形筋の収縮を維持します。ポイント: 関節を動かさずに背部の筋力と筋持久力を高めるアイソメトリック種目です。
