description: |-
  開始姿勢: 膝を軽く曲げて股関節から上体を前傾させます。片手を膝に当てて支え、反対の肩を下げてリラックスさせます。動作手順: 肘を伸ばしたまま、親指を上に向けて腕を斜め前方 (頭上約15度の高さ) へ引き上げます。トップで僧帽筋下部の収縮を感じて静止し、ゆっくり下ろします。ポイント: 肩をすくめず、肩甲骨の下制と上方回旋を意識して僧帽筋下部を鍛えます。
