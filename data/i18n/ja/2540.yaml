name: アイソメトリック・ラットプルダウン
description: |-
  開始姿勢:
  ラットプルダウンマシンに深く座り、太ももが動かないようパッドでしっかり固定します。肩幅より広めの順手でバーを握り、胸を張って肩甲骨を引き下げ、上半身をわずかに後傾させます。

  動作手順:
  1. バーを鎖骨または胸の上部まで力強く引き下ろします。
  2. 肘を真下に絞り込んだ最大収縮ポジションでバーを完全に静止させ、広背筋と大円筋を力強く収縮させたまま指定秒数キープします。
  3. 時間が終了したら、重りに引っ張られないようコントロールしながら、ゆっくりとバーを元の位置まで戻します。

  ポイント:
  キープ中は肩がすくんで前に出ないよう、常に胸を高く保ちます。最大収縮での筋緊張と神経筋伝達を高めるのに非常に効果的です。
