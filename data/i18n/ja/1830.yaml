name: リバース・バーベルランジ
upstream:
  license: CC-BY-SA-4.0
  source_id: '2965'
description: |-
  開始姿勢:
  バーベルを僧帽筋上部に担ぎ、足を腰幅に開いて背筋を伸ばして直立します。

  動作手順:
  1. 片足を大きく一歩後ろへ引き、前後の膝が90度になるまで腰を真下へ沈めます。
  2. 前足の膝がつま先の真上に来るように保ち、後ろ膝は床スレスレまで下げます。
  3. 前足の踵で床を強く押して立ち上がり、元の直立姿勢に戻ります。

  ポイント:
  前方へのランジに比べて前足の膝関節へのストレスが少なく、大臀筋と大腿四頭筋を安全かつ高重量で鍛えられます。
