name: ベンチ・ライイングロー (胸支持バーベルロー)
description: |-
  開始姿勢: フラットベンチの上にうつ伏せに横たわり、床にあるバーベル (またはダンベル) をオーバーハンドグリップで握ります。動作手順: 肘を後方へ引き上げながら、バーベルをベンチ下部または上体に向かって引き寄せます。肩甲骨を寄せて背中を収縮させたら、コントロールしながらゆっくりと下ろします。ポイント: ベンチが胸を支持するため腰への負担がなく、広背筋や僧帽筋、菱形筋を孤立して鍛えられます。
