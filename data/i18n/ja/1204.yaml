name: エアロバイク・有酸素セッション
upstream:
  license: CC-BY-SA-4.0
  source_id: '2164'
description: |-
  開始姿勢:
  エアロバイクのサドル高とハンドル位置を体格に合わせて調節し、ペダルに足をセットします。

  動作手順:
  1. 設定したプログラムやケイデンス（回転数）に沿ってスムーズにペダリングを行います。
  2. 心拍数をモニタリングしながら、一定の有酸素強度を維持してトレーニングを継続します。

  ポイント:
  関節への衝撃を最小限に抑えながら、下半身の持久力向上とカロリー消費を達成できます。
