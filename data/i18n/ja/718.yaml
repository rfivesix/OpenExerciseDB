  source_id: '387'
description: |-
  開始姿勢:
  壁に背中をぴったりとつけ、足を肩幅に開いて壁から約50〜60cm離れた位置に立ちます。

  動作手順:
  1. 背中を壁に沿わせながら滑り落ちるように膝を曲げ、太ももが床と平行（膝が90度）になる位置まで腰を下ろします。
  2. 膝がつま先の真上に来るように保ち、両手は胸の前で組むか体側に自然に置きます。
  3. このスクワット姿勢を崩さず、大腿四頭筋に力を入れて指定の時間キープします。

  ポイント:
  関節を動かさずに大腿四頭筋をアイソメトリックに強化し、筋持久力と安定性を高めます。
