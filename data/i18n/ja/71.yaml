description: |-
  開始姿勢:
  レッグエクステンションマシンに深く腰掛け、背もたれを調節します。片足の足首前側にパッドを当て、もう一方の足は休止させておきます。

  動作手順:
  1. 大腿四頭筋の力を使って、膝が完全に伸びる位置までパッドを上方へ押し上げます。
  2. トップポジションで1秒間静止し、大腿四頭筋をしっかりと収縮させます。
  3. 重力に逆らいながら、ゆっくりとコントロールして膝を曲げて開始姿勢に戻します。

  ポイント:
  片脚ずつ行うことで左右の筋力バランスの偏りを解消し、集中的な刺激を与えられます。
