name: アックスホールド
description: |-
  開始姿勢:
  足を肩幅に開いて直立し、体幹を引き締めます。両手にダンベルを持ち、体側に構えます。

  動作手順:
  1. 肘をごくわずかに曲げた状態を保ちながら、両腕を真横（側方）へ肩の高さまで持ち上げます。
  2. 腕が床と平行になった位置で静止し、指定された時間、三角筋中部を強く意識してアイソメトリック（等尺性）にキープします。
  3. 時間が経過したら、コントロールしながらゆっくりとダンベルを下ろします。

  ポイント:
  肩をすくめず、反動や上体の後傾を使わないように姿勢を真っ直ぐ保ちます。
