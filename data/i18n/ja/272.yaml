description: |-
  開始姿勢：両手にダンベルを持ち、手のひらを向かい合わせたニュートラルグリップで直立します。
  動作手順：肘を体側に固定したままダンベルを胸の高さまで持ち上げ、腕橈骨筋と上腕筋を収縮させます。
  ポイント：手首の向きを変えずに縦に保持し、ゆっくりと下ろして筋肉に緊張を与えます。
