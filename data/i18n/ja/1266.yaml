description: |-
  開始姿勢：アンカーポイントに背を向けて立ち、TRXのハンドルを握って体を前傾させます。
  動作手順：肘を頭の高さに固定したまま肘を曲げて頭部を下ろし、上腕三頭筋を使って押し戻します。
  ポイント：肘が外側に開かないように締め、体幹を一直線に維持して行います。
