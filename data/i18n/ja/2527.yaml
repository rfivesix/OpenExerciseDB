description: |-
  開始姿勢:
  片膝立ちの姿勢から、前脚を真っ直ぐ前方へ滑らせ、後ろ脚を後方へ伸ばしていきます。

  動作手順:
  1. 骨盤を正面に向けたまま、股関節を真下へ向けてゆっくりと沈めていきます。
  2. 前脚のハムストリングスと後ろ脚の腸腰筋（股関節屈筋群）・大腿四頭筋が深くストレッチされる位置でキープします。
  3. 手で床やブロックを支えて深呼吸を繰り返しながら20〜30秒間保持します。

  ポイント:
  前後開脚（フロントスプリット）の柔軟性を極限まで高めるハイレベルな下半身ストレッチです。
