description: |-
  開始姿勢:
  スミスマシンのバーの下に入り、僧帽筋上部にバーを担ぎます。足を肩幅に開き、足先をわずかに前方に配置します。

  動作手順:
  1. フックを外し、レールに沿って股関節と膝を曲げて深くしゃがみ込みます。
  2. 太ももが床と平行になる深さまで下ろします。
  3. 足裏全体で力強く床を押し、立ち上がります。

  ポイント:
  バーの軌道が固定されているため、フリーウェイトよりもバランスを気にせず大腿四頭筋に高重量の負荷をかけられます。
