description: |-
  開始姿勢：マットに仰向けになり、膝を立ててリラックスした姿勢をとります。
  動作手順：息をゆっくりと完全に吐き出しながら、おへそを背骨に近づけるように腹部を限界まで凹ませます。
  ポイント：浅い呼吸を続けながら凹ませた状態をキープし、深層の腹横筋を意識して引き締めます。
