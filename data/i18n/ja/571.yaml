name: バーベル・シュラッグ
description: |-
  開始姿勢: 肩幅程度でバーベルをオーバーハンドグリップで握り、背筋を真っ直ぐ伸ばして立ちます。腕は体の前で自然に伸ばします。動作手順: 肘を曲げずに、肩を耳に向かって真上に引き上げるようにしてバーベルを持ち上げます。トップで僧帽筋上部を強く収縮させて静止し、コントロールしながらゆっくりと下ろします。ポイント: 肩を回さず垂直に動かし、首や腰に余計な負担をかけないようにします。
