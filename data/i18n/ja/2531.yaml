name: エルボーレバー
description: |-
  開始姿勢：しゃがんで両手を床につき、指先を後方または斜め外側に向けます。
  動作手順：肘をお腹（腸骨付近）に当てて体重を預け、前傾しながら両足を浮かせて体を床と平行に保ちます。
  ポイント：脊柱起立筋と体幹を固めてバランスをとり、手首の柔軟性と前腕部で支えます。
