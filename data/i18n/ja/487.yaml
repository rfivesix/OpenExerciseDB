description: |-
  【開始姿勢】上体を深く前傾させて股関節から曲げ、両手にダンベルを持ちます。【動作手順】肘を軽く曲げたまま、肩甲骨をあまり動かさずにダンベルを斜め後ろへ引き上げます。【ポイント】三角筋後部に負荷を集中させ、腕ではなく肘主導で持ち上げます。
