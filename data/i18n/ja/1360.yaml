description: |-
  【開始姿勢】両足の間に2個のケトルベルを置き、前傾してグリップを握ります。【動作手順】股関節の爆発力でケトルベルを胸元へクリーンし、安定させてから頭上へプレスします。【ポイント】三角筋と全身の連動性を高める非常に機能的な全身種目です。
