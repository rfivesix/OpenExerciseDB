description: |-
  開始姿勢：足を腰幅に開いて背筋を伸ばして直立し、腕を脱力して下ろします。
  動作手順：頭から首、胸、腰の順に背骨を一つずつ丸めながらゆっくりと前屈し、逆の順序で戻ります。
  ポイント：脊柱起立筋と体幹をコントロールし、背骨全体の柔軟性を意識して滑らかに行います。
