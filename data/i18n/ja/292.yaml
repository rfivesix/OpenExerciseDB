name: ライイング・ヒップレイズ
description: |-
  開始姿勢:
  床に仰向けになり、膝を立てて足裏を床にしっかりと密着させます。腕はバランスを取るために体側に伸ばします。

  動作手順:
  1. 大臀筋を意識しながら、骨盤を左右均等に真上へ押し上げます。
  2. 膝から肩までが一直線になるトップポジションでしっかりとホールドします。
  3. コントロールを保ちながらゆっくりと腰を下ろします。

  ポイント:
  反復動作またはトップでのアイソメトリック保持により、臀部とハムストリングスを安全に鍛えます。
