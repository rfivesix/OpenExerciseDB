name: ブルガリアンスクワット (左脚)
upstream:
  license: CC-BY-SA-4.0
  source_id: '1602'
description: |-
  開始姿勢:
  ベンチや台を背にして立ち、大きく一歩前へ出ます。右足の甲を後ろのベンチに乗せ、左足でバランスをとって直立します。

  動作手順:
  1. 左の股関節と膝を曲げて、腰を真下に深く落とします。
  2. 左の太ももが床と平行になり、右膝が床スレスレに来るまで下ろします。
  3. 前側の左足の踵で地面を力強く押し込み、元の直立姿勢まで立ち上がります。

  ポイント:
  左の大腿四頭筋と大臀筋に強烈な負荷が入る単脚種目で、左右の筋力差改善に極めて有効です。
