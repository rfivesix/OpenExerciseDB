name: EZバー・アップライトロー
description: |-
  【開始姿勢】直立してEZバーを順手で握り、太ももの前に腕を伸ばして構えます。【動作手順】肘を外側へ引き上げるようにして、バーを身体に沿って胸から顎の高さまで持ち上げます。【ポイント】三角筋中部 (側部)と僧帽筋上部に負荷を集中させ、トップで一瞬静止します。
