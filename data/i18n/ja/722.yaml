description: |-
  開始姿勢:
  頑丈なボックスやベンチの前に立ち、両手にダンベルを保持して直立します。

  動作手順:
  1. 片足をボックスの上に足裏全体が密着するように乗せます。
  2. 前足の踵で強く踏み込み、大腿四頭筋と大臀筋を収縮させて身体を引き上げ、台の上に直立します。
  3. 後ろ足は軽く台に触れる程度にし、コントロールしながら元の足を床へゆっくりと下ろします。

  ポイント:
  後ろ足で床を蹴って反動を使わず、台に乗せた前足の筋力だけで体重を持ち上げます。
