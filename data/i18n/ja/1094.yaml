description: |-
  【開始姿勢】チェストプレスマシンの座席に深く座り、グリップを胸の高さに合わせます。【動作手順】背中をパッドにつけて胸を張り、息を吐きながらグリップを前方に押し出します。【ポイント】大胸筋を意識して収縮させ、肘を伸ばし切らずにゆっくり負荷を受け止めながら戻します。
