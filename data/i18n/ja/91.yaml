name: バーベル・バイセップスカール
description: |-
  開始姿勢：直立して背筋を伸ばし、肩幅の逆手でバーベルを持ちます。
  動作手順：肘を体側に固定し、上腕二頭筋を収縮させてバーベルを素早く巻き上げ、トップからゆっくりと下ろします。
  ポイント：体幹を安定させて反動を使わず、肘の位置を前後に動かさないようにします。
