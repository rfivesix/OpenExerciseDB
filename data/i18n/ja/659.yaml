description: |-
  開始姿勢：ハイプーリーにセットしたロープを両手で持ち、上体を少し前傾させて立ちます。
  動作手順：肘を体側に固定したまま下向きに腕を伸ばし、上腕三頭筋を収縮させながらロープの端を左右に広げます。
  ポイント：戻すときも重力に負けずコントロールし、肘の位置を前後に揺らさないようにします。
