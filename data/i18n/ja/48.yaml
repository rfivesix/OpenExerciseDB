description: |-
  開始姿勢：フラットベンチに座り、前腕部を大腿またはベンチに固定してバーベルを順手（手の甲を上）で握ります。
  動作手順：手首だけを反らせてバーベルを持ち上げ、手根伸筋群を収縮させた後、ゆっくりと下ろします。
  ポイント：前腕部を浮かさず、反動を使わずに手首のみを動かします。
