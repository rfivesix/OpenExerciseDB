name: ケーブル・バイセップスカール
description: |-
  開始姿勢：ケーブルタワーの前に立ち、ロープーリーに取り付けたバーを肩幅の逆手で握ります。
  動作手順：肘を体側に固定したまま上腕二頭筋を意識してバーを引き上げ、コントロールしながら下ろします。
  ポイント：ケーブルの一定の張力を感じながら、トップポジションでしっかり収縮させます。
