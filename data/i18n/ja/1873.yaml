  license_author: Davidgj32
  source_id: '3015'
description: |-
  開始姿勢:
  壁に手をついて直立するか、横向きに寝ます。

  動作手順:
  1. 片膝を曲げ、同側の手で足首または足の甲を掴んで踵をお尻に引き寄せます。
  2. 骨盤を軽く後傾させ、膝を真下に向けたまま太ももの前面（大腿四頭筋）を心地よく伸ばします。
  3. 20〜30秒間キープし、反対側も同様に行います。

  ポイント:
  腰が反らないように腹筋に力を入れ、大腿直筋を的確にストレッチします。
