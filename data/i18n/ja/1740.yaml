description: |-
  開始姿勢:
  仰向けに寝て両膝を曲げ、足裏を床につけます。片脚を真っ直ぐ持ち上げて宙に浮かせます。

  動作手順:
  1. 床につけた軸足の踵で床を押し、骨盤を天井に向けて持ち上げます。
  2. 肩から膝までが一直線になる高さまで押し上げ、軸足の大臀筋を強く絞り込みます。
  3. コントロールしながらゆっくりと骨盤を床スレスレまで下ろします。

  ポイント:
  片脚で行うことで左右の筋力差を浮き彫りにし、大臀筋を集中的に活性化させます。
