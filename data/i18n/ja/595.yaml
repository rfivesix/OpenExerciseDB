description: |-
  開始姿勢:
  ロープのグリップを両手で持ち、足を揃えて直立します。ロープを足の後ろに置きます。

  動作手順:
  1. 手首のスナップを利かせてロープを頭上から前方に回します。
  2. ロープが足元を通過するタイミングに合わせて両足で軽くジャンプします。
  3. 母指球で柔らかく着地し、リズミカルに跳び続けます。

  ポイント:
  ふくらはぎ（下腿三頭筋）の弾力性と心肺持久力、フットワークを強化する優れた有酸素運動です。
