  license_author: Mahoney
  source_id: '161'
description: |-
  開始姿勢:
  パワーラックのセーフティバーを膝のすぐ下の高さに設定し、バーベルを置きます。足幅を腰幅にしてバーベルに近づいて立ちます。

  動作手順:
  1. 股関節を後ろに引き、背筋を真っ直ぐ保ちながら肩幅の順手でバーベルを握ります。
  2. 体幹を固め、踵で床を押して股関節と膝を伸展させ、直立姿勢まで一気に引き上げます。
  3. トップで大臀筋と背部を収縮させた後、コントロールしながらバーベルをセーフティに下ろします。

  ポイント:
  床からの可動域を制限することで、高重量を扱い大臀筋と脊柱起立筋を集中的に強化します。
