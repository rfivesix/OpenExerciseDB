description: 【開始姿勢】TRXのハンドルを握り、体を斜め前方に倒して体幹を一直線に保ち、腕を胸の前に伸ばします。【動作手順】肘を軽く曲げたまま両腕を横に大きく開き、大胸筋をストレッチさせます。胸の力を使ってハンドルを元の位置に引き寄せます。【ポイント】腰を反らせず体幹を固定して行います。
