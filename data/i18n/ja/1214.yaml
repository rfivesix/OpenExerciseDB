description: |-
  開始姿勢: 懸垂バーを握ってぶら下がり、膝を胸に引き込んで小さく丸まります。動作手順: 肩関節を伸展させて体幹を持ち上げ、胴体が床と平行になる水平の姿勢を保持します。広背筋、大円筋、三角筋後部、上腕二頭筋長頭を強く収縮させて姿勢をキープします。ポイント: 自重キャリステニクスの代表的な高難度技フロントレバーの習得に向けた基本発展種目です。
