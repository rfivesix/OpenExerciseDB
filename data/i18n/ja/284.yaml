description: |-
  開始姿勢：左右のケーブルタワーの中央に立ち、両手で高い位置のケーブルハンドルを握ります。
  動作手順：腕を左右に広げたT字の姿勢を保ち、上腕二頭筋と三角筋を使ってケーブルの負荷に耐えます。
  ポイント：体幹を固めて体が前後に傾かないようにし、一定の時間を耐えるアイソメトリック動作です。
