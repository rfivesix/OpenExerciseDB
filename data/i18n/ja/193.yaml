description: |-
  【開始姿勢】少し後ろに傾けたベンチに座り、バーベルを肩幅で構えます。【動作手順】バーベルを胸の上部から斜め前方・上方へ押し上げ、腕を伸ばします。【ポイント】大胸筋上部 (鎖骨部)と三角筋前部を意識し、胸への負担を抑えつつ肩を強化します。
