description: |-
  【開始姿勢】低い位置のケーブルにショートバーを装着し、順手で握って立ちます。【動作手順】肘を軽く曲げたまま、バーを胸から肩の高さまで前方へ引き上げます。【ポイント】三角筋前部に常に一定の負荷をかけながら、丁寧に動作します。
