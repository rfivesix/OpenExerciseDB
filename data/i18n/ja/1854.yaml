  license_author: Davidgj32
  source_id: '2989'
description: |-
  開始姿勢:
  床に座り、片脚のふくらはぎ（アキレス腱の上から膝裏の間）の下にフォームローラーを横向きに置きます。両手を床についてお尻を浮かせます。

  動作手順:
  1. アキレス腱付近から膝裏の手前まで、体重をかけながらゆっくりと前後にローラーを転がします。
  2. 足先を内側や外側に向け、ふくらはぎの内側・外側の筋膜もくまなくローリングします。
  3. 特にコリや圧痛を感じるポイントで10〜20秒静止して深呼吸します。

  ポイント:
  下腿三頭筋の緊張を解放し、足首の背屈可動域と疲労回復を促進します。
