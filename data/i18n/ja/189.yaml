description: |-
  開始姿勢:
  低いプラットフォームやプレートの上に立ち、通常より低い位置にあるバーベルの前に構えます。足を腰幅に開き、股関節を深く折り曲げて順手またはオルタネイトグリップでバーを握ります。

  動作手順:
  1. 体幹に力を入れ、深い前傾姿勢から床を強く踏み込んでバーベルを引き上げます。
  2. 広い可動域を通じて大腿四頭筋、大臀筋、脊柱起立筋を総動員して直立位置まで引き切ります。
  3. 背筋を真っ直ぐに維持したまま、丁寧かつコントロールされた動作で床までバーベルを下ろします。

  ポイント:
  床からの可動域が広がるため、重量設定に留意し、腰椎のニュートラルを厳格に保持します。
