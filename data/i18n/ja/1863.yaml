description: |-
  開始姿勢:
  床に仰向けになり、両腕を真横に広げて床につけます。両膝を曲げて足を床から浮かせます。

  動作手順:
  1. 両肩を床に密着させたまま、揃えた両膝をゆっくりと片側へ倒して床に近づけます。
  2. 腰背部とお尻の心地よいツイスト感を感じたら、腹斜筋を使って中央へ引き戻します。
  3. 反対側へも同様に倒し、左右交互にコントロールしながら繰り返します。

  ポイント:
  骨盤と腰椎の回旋可動性を高め、腰部の緊張を解きほぐします。
