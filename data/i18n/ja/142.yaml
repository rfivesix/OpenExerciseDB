description: |-
  【開始姿勢】ケーブルのプーリーを肘の高さに合わせ、マシンの横に立ちます。【動作手順】肘を90度に曲げて脇腹に固定し、前腕を外側へゆっくりと回旋させます。【ポイント】回旋筋腱板 (ローテーターカフ)と三角筋後部を意識し、体幹や肘を動かさずに行います。
