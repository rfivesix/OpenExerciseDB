description: |-
  開始姿勢:
  アダクターマシンに座り、膝の内側にパッドをセットします。無理のない開脚幅にレバーを調整します。

  動作手順:
  1. 股関節内転筋群（内もも）の力を使って、両脚を中央に向かってゆっくりと閉じ合わせます。
  2. パッドが合流するポイントで内転筋を強く絞り込みます。
  3. 負荷に抵抗しながら、コントロールしてゆっくりと脚を開きます。

  ポイント:
  内ももの内転筋群を集中的に鍛え、下半身の安定性と骨盤の引き締めを促進します。
