description: |-
  【開始姿勢】サンドバッグの前にファイティングポーズをとって構えます。【動作手順】ジャブやストレート、フックなどのパンチをリズミカルかつ力強く打ち込みます。【ポイント】三角筋、大胸筋、上腕三頭筋を動員し、全身の連動と有酸素持久力を高めます。
