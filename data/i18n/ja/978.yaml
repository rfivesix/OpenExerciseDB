description: |-
  開始姿勢：プルアップバーにぶら下がり、肩を安定させて体を静止させます。
  動作手順：骨盤を後傾させながら両膝を胸に向かって高く引き上げ、腹直筋下部を強く収縮させます。
  ポイント：体を前後に揺らす反動を使わず、トップで一瞬静止してからゆっくり下ろします。
