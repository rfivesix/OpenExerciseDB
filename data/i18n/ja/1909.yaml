description: |-
  開始姿勢：マットに仰向けになり、両手を臀部の横に置いて脚を揃えて床から少し浮かせます。
  動作手順：腹直筋と腸腰筋を使い、両脚で空中に大きな円を描くように回旋させ、逆回転も同様に行います。
  ポイント：腰が床から浮かないよう腹圧を高め、膝を伸ばしたままコントロールして回します。
