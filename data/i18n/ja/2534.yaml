description: |-
  開始姿勢:
  仰向けに寝て両膝を曲げ、足裏を腰幅で床につけます。腕は体側に置きます。

  動作手順:
  1. 体幹を固め、踵で床を押して骨盤を天井へ向けて持ち上げます。
  2. 膝から肩までが一直線になる高さまで押し上げ、大臀筋を強く収縮させて1〜2秒静止します。
  3. ゆっくりと骨盤を床スレスレまで下ろします。

  ポイント:
  腰椎の過伸展を防ぎ、大臀筋とハムストリングスを安全に活性化させる基礎種目です。
