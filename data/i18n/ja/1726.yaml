description: |-
  開始姿勢: ケーブルマシンのハイプーリーの前に立ち、バーをオーバーハンドグリップで握ります。肘は軽く伸ばしたまま固定します。動作手順: 肩をすくめず、肩関節の伸展を使って弧を描くようにバーを太ももに向かって引き下げます。ボトムで広背筋を力強く収縮させ、ゆっくりと頭上まで戻します。ポイント: 腕の力ではなく、広背筋の力だけでバーを押し下げる感覚を掴みます。
