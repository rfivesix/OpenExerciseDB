name: バットキック (踵お尻タッチ走)
description: |-
  開始姿勢:
  足を腰幅に開いて直立し、体幹を引き締めます。

  動作手順:
  1. その場でジョギングするようにリズミカルに足を動かし、踵でお尻をタッチするように膝を深く曲げて後ろに蹴り上げます。
  2. 太ももは前に出さず、膝を真下に向けたまま左右交互に素早く繰り返します。
  3. 腕を前後に軽快に振ってテンポを保ちます。

  ポイント:
  大腿四頭筋の動的ストレッチとハムストリングスの収縮を促し、ランニング前のウォームアップに最適です。
