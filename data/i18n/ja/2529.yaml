name: エクスプロシブ・プッシュアップ
description: |-
  【開始姿勢】通常の腕立て伏せの姿勢をとります。【動作手順】胸を床まで下ろした後、爆発的に床を押して両手が床から離れるように跳ね上がります。【ポイント】大胸筋の速筋線維を強烈に刺激し、着地は肘を軽く曲げて衝撃を吸収します。
