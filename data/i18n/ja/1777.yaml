description: |-
  【開始姿勢】ブロックやプレートの上に両手を置き、床より手を高くして構えます。【動作手順】胸が手の位置より深くなるまで身体を下ろし、大胸筋を最大限にストレッチさせて押し上げます。【ポイント】広い可動域で大胸筋を強く刺激し、体幹をまっすぐに保ちます。
