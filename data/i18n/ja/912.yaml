description: |-
  開始姿勢：ケーブルタワーの前に立ち、ロープーリーのストレートバーを逆手で握ります。
  動作手順：肘を脇腹に固定したままバーを胸まで引き上げ、上腕二頭筋を強く収縮させます。
  ポイント：常にケーブルのテンションを感じながら、背中を反らさずに動作をコントロールします。
