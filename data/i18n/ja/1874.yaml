description: |-
  開始姿勢：前足を大きく踏み出して膝を直角に曲げ、両手を前足の両側の床につきます。
  動作手順：後ろ脚をまっすぐ後方に伸ばして骨盤を低く沈め、腸腰筋と臀部を深くストレッチします。
  ポイント：胸を前方に向け、呼吸を止めずに股関節の緊張をほぐしていきます。
