  license_author: wger.de
  source_id: '117'
description: |-
  開始姿勢:
  レッグカールマシンに深く腰掛け、大腿部を上部パッドでしっかりと固定します。足首の後ろ側に回転アームのパッドをセットします。

  動作手順:
  1. ハムストリングスを収縮させ、膝を曲げてパッドを座面の下へ力強く引き込みます。
  2. 完全に曲げ切ったポイントで1秒静止します。
  3. 抵抗を感じながら、ゆっくりと脚を前方に伸ばして戻します。

  ポイント:
  股関節が屈曲した状態で動作するため、ハムストリングスが強くストレッチされた状態から効率よく収縮できます。
