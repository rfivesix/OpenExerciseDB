description: |-
  開始姿勢：ベンチに背筋を伸ばして座り、両手にダンベルを持って腕を自然に下ろします。
  動作手順：肘を体側に固定したまま上腕二頭筋を意識して巻き上げ、トップで静止してからゆっくり戻します。
  ポイント：座ることで下半身の反動を排除し、二頭筋のみに負荷を集中させて行います。
