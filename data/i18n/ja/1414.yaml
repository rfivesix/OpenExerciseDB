description: |-
  開始姿勢:
  ハックスクワットマシンに乗り、肩パッドに肩を当て、背中を完全にシートに密着させます。足を肩幅でフットプレートの中央に置きます。

  動作手順:
  1. セーフティハンドルを解除し、膝を曲げてコントロールしながら深くしゃがみ込みます。
  2. 太ももがプレートと平行またはそれ以上の深さまで下ろします。
  3. 踵でプレートを強く押し込み、大腿四頭筋を収縮させて元の立ち上がり位置まで押し戻します。

  ポイント:
  バックサポートがあるため腰への負担が最小限に抑えられ、大腿四頭筋を集中的に高重量で追い込めます。
