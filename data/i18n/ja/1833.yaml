name: スライダー・ハムストリングカール
upstream:
  license: CC-BY-SA-4.0
  source_id: '2968'
description: |-
  開始姿勢:
  床に仰向けになり、両踵の下にスライディングディスク（またはタオル）を置きます。両腕は体側に置きます。

  動作手順:
  1. 骨盤を持ち上げてヒップブリッジの姿勢をとります（膝から肩まで一直線）。
  2. 骨盤の高さを維持したまま、踵を前方へ滑らせて脚をゆっくりと伸ばしていきます。
  3. ハムストリングスを強く収縮させ、踵をお尻に向かって力強く引き寄せて戻します。

  ポイント:
  ハムストリングスのエキセントリックとコンセントリックの両局面を極めて高い強度で刺激します。
