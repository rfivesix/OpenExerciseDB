description: |-
  開始姿勢:
  ベンチの横で横向きになり、下側の肘を床につけます。上側の脚の内側をベンチの上に乗せます。

  動作手順:
  1. 上脚の内転筋群でベンチを強く押し下げ、骨盤を床から持ち上げて頭から足までを一直線にします。
  2. 下側の脚を床から浮かせて上脚に揃えるようにキープします。
  3. 内ももと体幹側部を強く緊張させたまま、指定時間ホールドします。

  ポイント:
  内転筋群に対する最高強度のアイソメトリックエクササイズで、アスリートの鼠蹊部障害予防に不可欠です。
