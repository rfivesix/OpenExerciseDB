description: |-
  開始姿勢: マットの上にうつ伏せになり、両腕を前方に伸ばし、脚は床に平らに置きます。動作手順: 両腕を床から浮かせ、弧を描くようにゆっくりと体側まで動かします。肩甲骨をしっかりと引き寄せて背中全体の筋肉を収縮させ、再び弧を描いて頭上へ戻します。ポイント: 動作中は腕を床につけず、僧帽筋、菱形筋、三角筋後部を常に活性化させます。
