  license_author: Croak6728
  source_id: '2975'
description: |-
  開始姿勢:
  床に座り、片脚の膝を軽く曲げて前に出します。手で足先または足首を保持します。

  動作手順:
  1. お腹と太ももを密着させたまま、ゆっくりとお尻を後ろへ引くようにして太もも裏を伸ばします。
  2. 膝を完全に伸ばし切らず軽く曲げたままにすることで、ハムストリングスの筋腹（中心部）にストレッチを集中させます。
  3. 深い呼吸とともに20〜30秒間キープし、反対側も行います。

  ポイント:
  坐骨神経や膝裏の腱に過度な負担をかけず、筋肉自体を効果的に伸張させられます。
