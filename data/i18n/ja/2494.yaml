  source_id: '4976'
description: |-
  開始姿勢:
  頑丈な支柱にレジスタンスバンドを固定し、片脚の膝裏にバンドを掛けます。支柱に向かい合って立ち、バンドにテンションをかけます。

  動作手順:
  1. 膝を軽く曲げた状態から、大腿四頭筋（特に内側広筋）を強く収縮させて膝を完全に真っ直ぐ伸ばし切ります（終末伸展）。
  2. 完全にロック伸展した位置で1〜2秒間強く絞り込みます。
  3. コントロールしながらゆっくりと膝を曲げて緩めます。

  ポイント:
  膝関節の終末伸展を担う内側広筋（VMO）をピンポイントで強化し、膝痛の改善やリハビリに絶大な効果を発揮します。
