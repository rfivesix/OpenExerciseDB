description: |-
  【開始姿勢】低位置に設定したケーブルの横に立ち、反対側の手でハンドルを持ちます。【動作手順】肘を軽く曲げたまま、腕を真横の肩の高さまで引き上げます。【ポイント】三角筋中部 (側部)に負荷を集中させ、反動を使わずに滑らかに動作します。
