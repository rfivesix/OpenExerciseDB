description: |-
  開始姿勢:
  片手にダンベルを持ち、反対側の足で片足立ちになります。背筋を伸ばし、軸足の膝を軽く緩めます。

  動作手順:
  1. 股関節から上体を前に倒し、浮かせた脚を後ろへ真っ直ぐ伸ばしながらダンベルをすねに向かって下ろします。
  2. 軸足のハムストリングスとお尻にストレッチを感じたら、踵で床を押して立ち上がります。
  3. 骨盤の水平を保ちながら直立姿勢へ戻ります。

  ポイント:
  片脚のハムストリングスと大臀筋を集中的に強化し、体幹の回旋ブレを抑える安定性を高めます。
