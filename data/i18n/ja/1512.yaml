description: |-
  開始姿勢：ダンベルを持ち、腕をまっすぐ伸ばした状態から構えます。
  動作手順：ゆっくりとしたペースで肘を曲げてカールし、上腕筋と上腕二頭筋をエキセントリックに刺激します。
  ポイント：急激に脱力せず、下ろす動作でも筋肉の緊張を維持しながら丁寧に行います。
