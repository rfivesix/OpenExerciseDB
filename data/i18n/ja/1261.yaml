description: |-
  開始姿勢：TRXの前に立ち、ハンドルを胸の前で向かい合わせに握って体を後傾させます。
  動作手順：胸を張った姿勢から肘を外側に保ちつつ強く曲げ、上腕筋と二頭筋で体を引き寄せます。
  ポイント：肩甲骨を寄せすぎず、腕の屈曲動作に集中して筋肉を強く収縮させます。
