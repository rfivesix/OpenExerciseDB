name: ジャンピングジャック
description: |-
  開始姿勢:
  足を揃えて背筋を伸ばして直立し、腕を体側に下ろします。

  動作手順:
  1. 軽く跳び上がりながら足を肩幅より広く開き、同時に両腕を横から頭上へ回して拍手します。
  2. 再びジャンプして足を揃え、両腕を体側に戻します。
  3. リズミカルにテンポよく動作を継続します。

  ポイント:
  心拍数を高め、全身の血液循環と筋温を向上させる定番のカーディオ・ウォームアップです。
