description: |-
  開始姿勢:
  足を肩幅に開いて立ち、両腕を頭上へ高く伸ばし、つま先立ちになって身体を完全に伸ばします。

  動作手順:
  1. 腕を前下方に素早く鋭く振り下ろすと同時に、股関節と膝を瞬時に屈曲させて低いアスレチックポジションへ沈み込みます。
  2. 足裏全体で力強く床を捉え、胸を張って背筋を真っ直ぐ保った状態でピタッと静止します。
  3. バランスが安定していることを確認してから、再び開始姿勢に戻ります。

  ポイント:
  着地動作の習得と瞬時の体幹・下半身の減速制動能力（ブレーキ力）を養います。
