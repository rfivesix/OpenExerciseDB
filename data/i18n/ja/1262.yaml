description: |-
  開始姿勢：片手でTRXのハンドルを逆手で握り、体を斜め後ろに倒して踵で支えます。
  動作手順：肘を肩の高さに維持したまま肘を曲げ、上腕二頭筋を使って体をハンドルに近づけます。
  ポイント：反対側の手で体幹の回旋を抑え、片腕の力だけでブレずに引き上げます。
