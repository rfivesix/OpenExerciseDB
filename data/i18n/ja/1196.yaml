description: |-
  開始姿勢：壁に向かって立ち、両手を壁につけて体を斜め一直線に傾けます。
  動作手順：体幹を固めたまま、腸腰筋を使って片膝を腰の高さまで素早く引き上げ、交互に繰り返します。
  ポイント：スプリントの正しいフォームを意識し、骨盤を安定させて足首を固定します。
