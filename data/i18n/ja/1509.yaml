description: |-
  開始姿勢：ロープーリーの前に前傾姿勢で立ち、片手でケーブルを握って肘を腰の高さに引き上げます。
  動作手順：上腕を動かさずに肘を後方へまっすぐ伸ばし、上腕三頭筋長頭を力強く収縮させます。
  ポイント：ケーブルの一定した張力を活かし、トップで1秒静止してコントロールしながら戻します。
