  license_author: BFad07
  source_id: '768'
description: |-
  開始姿勢：直立して背筋を伸ばし、両手にダンベルを持って腕を自然に下ろします。
  動作手順：肘を体側に固定し、上腕二頭筋を収縮させてダンベルを胸の高さまで巻き上げ、ゆっくり下ろします。
  ポイント：上半身を前後に揺らさず、肘の位置を固定して二頭筋に負荷を集中させます。
