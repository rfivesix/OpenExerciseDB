description: |-
  開始姿勢：腕立て伏せの姿勢をとり、胸の下で両手の人差し指と親指をつけてダイヤ型を作ります。
  動作手順：脇を締めて肘を曲げながら胸を手の甲に近づけ、上腕三頭筋を使って押し上げます。
  ポイント：肘を外側に広げず、体幹を一直線に保ちながら三頭筋に強い負荷をかけます。
