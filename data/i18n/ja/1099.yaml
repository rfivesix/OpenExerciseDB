description: |-
  開始姿勢：レジスタンスバンドを取り付けたケトルベルを片手で持ち、直立姿勢をとります。
  動作手順：片足立ちになってバランスをとり、体幹の傾きに耐えながら腹斜筋を使って姿勢を維持します。
  ポイント：重みで体が横に倒れないよう背筋を垂直に保ち、反対側も同様に行います。
