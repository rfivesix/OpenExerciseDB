  license_author: wger.de
  source_id: '114'
description: |-
  開始姿勢:
  シートに深く腰掛け、フットプレートの上部に足を肩幅より大幅に広く置き、つま先を外側約30〜45度に向けて配置します。

  動作手順:
  1. コントロールを保ちながら、膝がつま先と同じ方向を向くように深くプレートを下ろします。
  2. 膝が直角近くまで曲がったら、踵と足裏全体で強く押し上げます。
  3. 膝を完全に伸ばし切らずに連続して動作を行います。

  ポイント:
  足幅を広く取ることで、股関節内転筋群および大臀筋への負荷が高まります。
