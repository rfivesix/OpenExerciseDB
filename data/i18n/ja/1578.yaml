description: |-
  開始姿勢:
  足を腰幅に開いて直立し、手は鼠蹊部（股関節の折り目）に当てるか胸の前で組みます。背筋を伸ばします。

  動作手順:
  1. 膝の角度をわずかな緩みで固定したまま、お尻を真後ろの壁にタッチするように突き出し、股関節から上体を前に倒します。
  2. ハムストリングスに心地よい緊張を感じる深さまで上体を前傾させます。
  3. 大臀筋を収縮させ、腰を前方に押し出して元の直立姿勢に戻ります。

  ポイント:
  スクワットやデッドリフトの基礎となる、腰を丸めずに股関節を折り曲げる最重要基本動作です。
