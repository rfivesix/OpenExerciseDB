description: |-
  開始姿勢：腰の高さにセットしたバーの下に入り、逆手でバーを握って体を斜めに吊るします。
  動作手順：体幹をまっすぐに保ちながら肘を曲げ、上腕二頭筋の力で顔をバーに近づけます。
  ポイント：踵で体重を支えて体を一直線に固定し、腕の力だけで体を引き上げるように意識します。
