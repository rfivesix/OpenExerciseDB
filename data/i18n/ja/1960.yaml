description: |-
  開始姿勢：片膝立ちになり、後ろ足の甲をベンチや台の上に乗せて背筋を伸ばします。
  動作手順：骨盤を後傾させて下腹部に力を入れ、体重をわずかに前方へ移動させて腸腰筋と大腿直筋を伸ばします。
  ポイント：腰を反らさないよう注意し、後ろ足の太もも前部から股関節前面の深部をストレッチします。
