description: |-
  【開始姿勢】ドアフレームの間に立ち、前腕をフレームに当てて肘を直角に曲げます。【動作手順】片足を一歩前へ踏み出し、上体を前方にスライドさせて胸を開きます。【ポイント】大胸筋全体をしっかりとストレッチし、無理のない強さでキープします。
