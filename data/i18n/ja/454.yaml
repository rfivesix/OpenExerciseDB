description: |-
  【開始姿勢】腕立て伏せから腰を高く持ち上げ、身体で「逆V字」の形を作ります。【動作手順】頭頂部が両手の少し前につくように斜め前へ上体を下ろし、三角筋前部で力強く押し戻します。【ポイント】背筋を伸ばし、肩に体重をしっかり乗せて動作します。
