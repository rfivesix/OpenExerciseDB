  license_author: Franpol
  source_id: '2148'
description: |-
  開始姿勢：両手にダンベルを持ち、手のひらを内側に向けて直立します。
  動作手順：片腕ずつ肘を曲げながら前腕部を回外させて巻き上げ、上腕二頭筋を収縮させてからゆっくり下ろします。
  ポイント：反動を使わず肘の位置を脇腹に固定し、下ろしたらすぐに反対側の腕を動作させます。
