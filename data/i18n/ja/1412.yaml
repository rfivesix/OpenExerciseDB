name: バイシクルクランチ
description: |-
  開始姿勢：マットに仰向けになり、両手を後頭部に添えて脚を床から少し浮かせます。
  動作手順：片膝を引き込みながら対角の肘を近づけるように上体をひねり、自転車を漕ぐように交互に行います。
  ポイント：腹斜筋と腹直筋を意識し、反動を使わずにゆっくりと深い回旋を作ります。
