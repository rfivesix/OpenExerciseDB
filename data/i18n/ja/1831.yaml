description: |-
  【開始姿勢】マシンのシートに座り、グリップが下胸部のラインに来るように調整します。【動作手順】大胸筋下部を意識しながら、ハンドルを斜め前下方へ力強く押し出します。【ポイント】大胸筋中部・下部 (胸肋部)を的確に刺激し、左右独立した軌道で押し切ります。
