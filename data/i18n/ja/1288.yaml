description: |-
  開始姿勢：横向きに寝て下側の前腕部で体重を支え、体を一直線にしたサイドプランクをとります。
  動作手順：腰を床すれすれまでゆっくり下ろし、腹斜筋を使って元の高い位置まで押し上げます。
  ポイント：体が前後に傾かないよう骨盤を垂直に保ち、脇腹の伸縮を意識して反復します。
