description: |-
  開始姿勢:
  アダクターマシンに背中をしっかりとつけて座り、パッドが両膝または大腿部の内側に当たるように設定します。

  動作手順:
  1. 息を吐きながら、股関節内転筋群を収縮させて両脚を内側へゆっくりと引き寄せます。
  2. パッドが合流するポイントで一瞬静止し、内転筋の最大収縮を意識します。
  3. 負荷に抵抗しながら、コントロールを保ってゆっくりと脚を開き、開始姿勢に戻ります。

  ポイント:
  動作中に背中やお尻をシートから浮かせず、反動を使わずに内転筋を集中して稼働させます。
