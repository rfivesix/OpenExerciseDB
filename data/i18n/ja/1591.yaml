  license_author: MrAlfaRobot
  source_id: '2540'
description: |-
  開始姿勢：背筋をまっすぐに伸ばして椅子に座るか、リラックスして直立します。
  動作手順：鼻から深く息を吸い込んで横隔膜を広げ、口からゆっくりと完全に息を吐き出します。
  ポイント：肩の力を抜き、お腹と胸が穏やかに膨らみ縮むのを感じながら呼吸を整えます。
