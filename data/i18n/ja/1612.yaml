name: ケトルベル・スモウデッドリフト
description: |-
  開始姿勢:
  足を肩幅の約1.5倍から2倍に大きく開き、つま先を外側45度に向けて立ちます。両足の間の床にケトルベルを置きます。

  動作手順:
  1. 上体を立てたまま股関節と膝を曲げ、ケトルベルのハンドルを両手で握ります。
  2. 足裏全体で床を力強く押し込み、股関節内転筋群と大臀筋を収縮させて直立姿勢まで引き上げます。
  3. トップで大臀筋をしっかり絞り込み、コントロールしながらケトルベルを床に下ろします。

  ポイント:
  内転筋群と大臀筋をターゲットにし、腰への負担を抑えて安全に股関節伸展を鍛えられます。
