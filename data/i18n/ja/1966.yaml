description: |-
  開始姿勢：壁の横で片膝立ちになり、両手を胸の前で合わせます。
  動作手順：骨盤と下半身をまっすぐ前方に固定したまま、上半身を壁に向かって大きく回旋させます。
  ポイント：胸椎と腹斜筋の可動域を広げ、腰を反らさずに胸郭からしっかりとひねります。
