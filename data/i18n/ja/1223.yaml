description: |-
  【開始姿勢】背筋を伸ばして直立し、両腕を体の横に下ろします。【動作手順】腕を伸ばしたまま両手を外側から頭上へ大きく回し上げ、頭の上で手を叩きます。【ポイント】三角筋と肩甲骨の可動性を高め、肩周りの血流を促します。
