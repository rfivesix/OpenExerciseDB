description: |-
  【開始姿勢】直立して両手に軽いダンベルを持ち、親指を上に向けて構えます。【動作手順】身体の正面から斜め30〜45度の角度に沿って、肩の高さまでダンベルを引き上げます。【ポイント】三角筋前部・中部と前鋸筋を自然な軌道で安全に強化します。
