description: |-
  開始姿勢: 懸垂バーを握り、プルアップ動作の任意の位置 (トップ、90度、または中間位置) まで身体を引き上げます。動作手順: その位置で身体を完全に静止させ、指定された時間キープします。肩甲骨を寄せ、広背筋、大円筋、上腕二頭筋を強く収縮させ続けます。ポイント: スティックポイントの克服や、静止状態での筋力・持久力強化に絶大な効果があります。
