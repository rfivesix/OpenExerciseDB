description: |-
  開始姿勢：深くランジの姿勢をとり、前足の足裏を床にしっかりとつけます。
  動作手順：両手を合わせ、上体を前足のある方向へゆっくりと回旋させてキープします。
  ポイント：股関節屈筋群と腹斜筋を同時に伸ばし、背骨の柔軟性を高めながらバランスをとります。
