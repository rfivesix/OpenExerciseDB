description: |-
  開始姿勢:
  膝と股関節を軽く曲げたクォータースクワットの姿勢をとります。足は肩幅に開きます。

  動作手順:
  1. 重心を低く保ったまま、片足を真横へ一歩大きく踏み出します。
  2. 反対側の足を同じ方向へ引き寄せ、常に一定の足幅を保ちながら横歩きを続けます。
  3. 規定距離進んだら、逆方向へサイドステップして戻ります。

  ポイント:
  中臀筋を継続的に緊張させ、骨盤の安定性を高める優れた機能的エクササイズです。
