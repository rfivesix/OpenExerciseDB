description: |-
  【開始姿勢】壁に向かって立ち、前腕を壁に垂直につけます。【動作手順】肩甲骨を外転させて前に突き出しながら、前腕を壁に沿って頭上へスライドさせます。【ポイント】前鋸筋を活性化させ、肩甲骨の動きをスムーズにして肩の痛みを予防します。
