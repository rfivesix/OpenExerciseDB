description: |-
  【開始姿勢】上体を股関節から深く前傾させ、両手にダンベルを持ちます。【動作手順】肘を高く外側に引き上げながら、ダンベルを顔の高さに向けて引き寄せます。【ポイント】三角筋後部と回旋筋腱板 (ローテーターカフ)を収縮させ、姿勢を安定させます。
