description: |-
  開始姿勢:
  ベンチに座り、足の母指球をステップ台やプレートの上に乗せて踵を浮かせます。両太ももの膝の上にダンベルを垂直に乗せて手で支えます。

  動作手順:
  1. 踵を床に向かって深く下げ、ふくらはぎを十分にストレッチさせます。
  2. つま先で強く押し込み、踵を可能な限り高く持ち上げて収縮させます。
  3. トップで1秒間静止し、ゆっくりと下ろします。

  ポイント:
  膝を曲げた姿勢で行うため、ふくらはぎの深層にあるヒラメ筋を集中的に強化できます。
