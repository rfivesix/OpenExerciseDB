description: |-
  【開始姿勢】インクラインベンチに仰向けになり、バーベルを肩幅よりやや広めに握ります。【動作手順】バーベルを鎖骨の少し下へゆっくり下ろし、大胸筋上部 (鎖骨部)を強く収縮させて押し上げます。【ポイント】肩甲骨を寄せて胸を高く保ち、お尻がベンチから浮かないようにします。
