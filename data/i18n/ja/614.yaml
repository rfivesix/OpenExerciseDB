description: |-
  開始姿勢:
  足を肩幅に開いて立ち、胸を張って体幹を引き締めます。

  動作手順:
  1. 股関節と膝を曲げて素早くスクワットの深さまでしゃがみ込みます。
  2. 足裏全体で床を強く蹴り、真上へ向かって爆発的に跳び上がります。
  3. 着地の際はつま先から静かに接地し、膝を柔らかく曲げて衝撃を吸収しながら次のスクワットへ繋げます。

  ポイント:
  大腿四頭筋と大臀筋の爆発的パワー（瞬発力）を強化するプライオメトリック種目です。
