name: ディップスステーション・レッグレイズ
description: |-
  開始姿勢：ディップススタンドのアームパッドに前腕部を乗せ、背中をパッドにつけてぶら下がります。
  動作手順：腹直筋を使って両脚を伸ばしたまま腰の高さまで引き上げ、コントロールして下ろします。
  ポイント：上半身を安定させて体を揺らさず、骨盤を巻き上げるようにして腹筋を収縮させます。
