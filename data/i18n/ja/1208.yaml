description: |-
  開始姿勢:
  足を肩幅に開いて立ち、両手を頭の後ろで組みます。肘をしっかりと外側に張り、胸を大きく開きます。

  動作手順:
  1. 胸を張ったまま、股関節を後ろに引いて膝を曲げ、太ももが床と平行になる深さまで腰を落とします。
  2. 肘が内側に閉じないよう肩甲骨を寄せた状態をキープします。
  3. 踵で床を強く押して立ち上がり、大腿四頭筋と大臀筋を収縮させて元の姿勢に戻ります。

  ポイント:
  頭の後ろに手を添えることで胸椎が伸展し、背筋の真っ直ぐな理想的スクワットフォームが維持できます。
