name: クロスボディ・ワンハンド・ケーブルプルダウン
description: |-
  開始姿勢: ケーブルタワーのハイプーリーに片手でハンドルを握り、ケーブルが体幹を斜めに横切る位置に立ちます。動作手順: 腕を伸ばした状態から、斜め上から反対側の腰に向かって弧を描くようにケーブルを引き下ろします。三角筋後部と広背筋の収縮を意識し、ゆっくりと戻します。ポイント: 体幹を安定させ、腕の振りだけでなく背中の筋肉で引くようにコントロールします。
