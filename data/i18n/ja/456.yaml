description: |-
  開始姿勢:
  片足立ちになり、もう一方の脚を前方に真っ直ぐ伸ばして床から浮かせます。両腕を前に伸ばしてバランスをとります。

  動作手順:
  1. 軸足の膝と股関節を曲げ、伸ばした前脚が床に触れないように深くしゃがみ込みます。
  2. 踵に重心を乗せてフルスクワットの深さまで下ろします。
  3. 軸足の足裏全体で強く床を押し、大腿四頭筋と大臀筋の力で元の片足立ち姿勢まで立ち上がります。

  ポイント:
  高い筋力、柔軟性、バランス能力を要する究極の自重片脚スクワットです。
