name: ベンチ・ライイング・レッグレイズ
description: |-
  開始姿勢：フラットベンチに仰向けになり、頭の後ろでベンチの端を握って体を安定させます。
  動作手順：腹直筋を意識して脚を床と垂直になるまで引き上げ、負荷を感じながらゆっくり下ろします。
  ポイント：勢いをつけず、常に腹筋の力で脚の重さをコントロールしながら動作します。
