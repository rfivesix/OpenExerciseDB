description: |-
  開始姿勢：マットの上にうつ伏せになり、両腕を左右に広げて肩の高さでT字を作ります。
  動作手順：肩甲骨を寄せて胸と両腕を床から持ち上げ、同時に両脚も浮かせて数秒間キープします。
  ポイント：脊柱起立筋と背部上部を意識し、首に余計な力が入らないよう目線を斜め下に保ちます。
