description: |-
  開始姿勢：前腕部を床につけたプランク姿勢をとり、体幹を一直線に保ちます。
  動作手順：手のひらで床を押し、肘を伸ばして腕立て伏せの姿勢へ移行し、再び前腕プランクへ戻します。
  ポイント：腹直筋を固めて腰が左右に揺れないように保ち、上腕三頭筋の力で押し上げます。
