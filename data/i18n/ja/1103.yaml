name: ウォーキングブリッジ (ハンドウォークアウト)
description: |-
  開始姿勢：直立姿勢から軽く膝を曲げて前屈し、両手を床につきます。
  動作手順：手で床を一歩ずつ歩くように前方へ進め、体が伸びたプランク姿勢まで行ってから手押しで戻ります。
  ポイント：大臀筋と腹直筋を強く引き締め、腰が反ったり落ちたりしないようコントロールします。
