name: ハイニースキップ (もも上げスキップ)
description: |-
  開始姿勢:
  リラックスして直立し、視線を前方に向けます。

  動作手順:
  1. スキップのリズムで片脚で跳び上がりながら、反対側の膝を胸の高さまで力強く引き上げます。
  2. 対角の腕を前に力強く振り上げ、空中で高い姿勢を保ちます。
  3. 柔らかく着地し、左右交互にテンポよくリズミカルに前進またはその場で繰り返します。

  ポイント:
  腸腰筋と大腿四頭筋の瞬発力、および下肢のプライオメトリックなバネを養成します。
