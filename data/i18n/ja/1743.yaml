description: |-
  開始姿勢：プルアップバーにぶら下がり、両脚をまっすぐ揃えて天井に向かって持ち上げます。
  動作手順：脚を揃えたまま車のワイパーのように左右へ大きく振り、腹斜筋と腹直筋を強く収縮させます。
  ポイント：腕と広背筋で体をしっかりと安定させ、腰をコントロールしながら滑らかに動かします。
