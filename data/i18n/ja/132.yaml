description: |-
  開始姿勢:
  足を腰幅に開いて直立し、体幹を引き締めます。

  動作手順:
  1. 素早くしゃがみ込んで両手を足の前方の床につきます。
  2. 両足を同時に後ろへ蹴り出し、腕立て伏せの姿勢（プランク）になります。
  3. 胸を床につけてから押し戻し、両足を素早く手の近くへ引き戻してしゃがみ姿勢になります。
  4. その場から真上へ力強くジャンプし、頭上で手を叩いて着地します。

  ポイント:
  全身の瞬発力と心肺機能を同時に高める全身連動の高強度有酸素エクササイズです。
