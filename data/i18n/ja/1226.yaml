description: |-
  【開始姿勢】直立して両手にダンベルを持ち、体の横に構えます。【動作手順】ダンベルを肩に向けてカールし、そのまま上方へ頭上高くプレスします。【ポイント】上腕二頭筋から三角筋前部への移行をスムーズに行い、全身をコントロールします。
