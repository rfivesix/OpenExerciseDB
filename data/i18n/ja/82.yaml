name: ベントオーバー・ラテラルレイズ
description: |-
  【開始姿勢】上体を前に倒して股関節から前傾し、両手にダンベルを持って腕を自然に垂らします。【動作手順】肘をわずかに曲げたまま、ダンベルを横方向へ肩の高さまで引き上げます。【ポイント】三角筋後部と菱形筋を意識し、反動を使わずトップで一瞬静止します。
