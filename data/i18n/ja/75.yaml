name: ダンベル・ベンチプレス
description: |-
  【開始姿勢】フラットベンチに仰向けになり、両手にダンベルを持ち胸の高さに構えます。【動作手順】肩甲骨を寄せて胸を張り、大胸筋を意識しながらダンベルを真上へ押し上げ、ゆっくりと胸の横まで下ろします。【ポイント】肘を直角近くまで曲げ、大胸筋のストレッチを感じながら行います。
