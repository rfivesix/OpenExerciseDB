description: |-
  開始姿勢：プリーチャーベンチに座り、片手でダンベルを持って上腕部をパッドに密着させます。
  動作手順：上腕を固定したまま上腕二頭筋を収縮させてダンベルを巻き上げ、ゆっくりと下ろします。
  ポイント：反対側の手で体を安定させ、肘をパッドから離さないようにコントロールします。
