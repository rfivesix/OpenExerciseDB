  source_id: '110'
description: |-
  開始姿勢: 肩幅よりやや広めのアンダーハンドグリップ (逆手) でバーベルを握り、上半身を前傾させて胸を張ります。背筋は真っ直ぐ保ちます。動作手順: 反動を使わずに、肘を体側に沿わせながらバーベルをおへそに向かって素早く引き上げます。トップで広背筋と上腕二頭筋を収縮させ、コントロールしながらゆっくり下ろします。ポイント: 体幹を安定させ、上体を揺らさないように注意します。
