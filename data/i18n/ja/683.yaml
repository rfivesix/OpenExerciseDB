description: |-
  開始姿勢:
  バーベルの手前に足幅を腰幅にして立ち、肩幅よりわずかに広い順手（フックグリップ）でバーを握ります。背筋を伸ばし、胸を張って構えます。

  動作手順:
  1. 床から膝上までバーベルを一定の角度で引き上げます（ファーストプル）。
  2. 膝を越えた瞬間、股関節、膝、足首を爆発的に完全伸展させ（トリプルエクステンション）、肩をすくめてバーを引き上げます（セカンドプル）。
  3. 素早く肘を前方に回転させてバーベルの下に潜り込み、クォータースクワットの姿勢で肩の前部（フロントラック）にバーを受け止めます。
  4. 膝と股関節を伸ばして直立し、コントロールしてバーを床に戻します。

  ポイント:
  全身の瞬発力と爆発的パワーを養う代表的なウエイトリフティング種目です。
