description: |-
  【開始姿勢】低い位置に設定したケーブルを背にして立ち、ハンドルを握ります。【動作手順】斜め上前方に向けてハンドルを押し出し、大胸筋上部を収縮させます。【ポイント】大胸筋上部 (鎖骨部)を狙い、体幹をしっかり固定して行います。
