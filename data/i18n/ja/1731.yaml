description: |-
  【開始姿勢】低位置にセットしたケーブルの前に立ち、ハンドルを順手で握ります。【動作手順】肘を軽く曲げたまま、腕をまっすぐ前方の肩の高さまで引き上げます。【ポイント】三角筋前部を収縮させ、体幹をまっすぐに保って反動を抑えます。
