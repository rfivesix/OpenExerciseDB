description: |-
  【開始姿勢】低い位置にセットしたケーブルの横に立ち、反対側の手でハンドルを持ちます。【動作手順】肘をわずかに曲げ、肘主導で腕を肩の高さまで真横に引き上げます。【ポイント】三角筋中部 (側部)を意識し、僧帽筋を使わないよう肩を上げずに行います。
