name: シングルレッグ・カーフレイズ
description: |-
  開始姿勢:
  段差やプレートの端に片足の母指球を乗せて立ちます。もう一方の足は浮かせて後ろでクロスさせ、壁や手すりに軽く手を添えてバランスをとります。

  動作手順:
  1. 軸足の踵を深く下ろして、ふくらはぎ（下腿三頭筋）を十分にストレッチさせます。
  2. つま先でステップを力強く押し込み、踵を最大限の高さまで持ち上げて収縮させます。
  3. 頂点で1秒キープした後、コントロールしながらゆっくりと踵を下ろします。

  ポイント:
  自重でも片脚に全体重がかかるため高い負荷が得られます。反動を使わず最大可動域で行います。
