description: |-
  開始姿勢:
  床に座り、片脚の膝を曲げて胸に引き寄せ、両手で膝裏または太もも裏をしっかりと抱え込みます。

  動作手順:
  1. 太ももを胸に密着させたまま、ゆっくりと膝を上方へ伸ばしていき、太もも裏にテンションをかけます。
  2. ハムストリングスの伸びを感じるポイントで数秒キープします。
  3. 膝を曲げて緩め、ポンピングするように反復します。

  ポイント:
  骨盤を後傾させずにハムストリングスの筋腱移行部を安全に伸張させます。
