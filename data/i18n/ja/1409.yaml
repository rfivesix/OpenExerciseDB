description: |-
  開始姿勢：ベンチに仰向けになり、頭の横でベンチの端をしっかりと掴みます。
  動作手順：肩甲骨のみをベンチにつけて体幹から足先までを一直線に浮かせ、ゆっくり上下させます。
  ポイント：腹直筋と腹横筋を極限まで収縮させ、腰を曲げずに一本の棒のようにコントロールします。
