name: 膝つきプッシュアップ (ニー・プッシュアップ)
description: |-
  【開始姿勢】床に両膝をつき、両手を肩幅よりやや広めに床につきます。【動作手順】頭から膝までを一直線に保ち、肘を曲げて胸を床に近づけ、押し上げます。【ポイント】大胸筋をしっかり意識し、通常の腕立て伏せが難しい方に最適な基本種目です。
