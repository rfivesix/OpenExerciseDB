description: |-
  【開始姿勢】フラットベンチに仰向けになり、バーベルを逆手で肩幅よりやや広めに握ります。【動作手順】バーベルを胸の下部にゆっくり下ろし、大胸筋上部 (鎖骨部)と上腕三頭筋を意識して押し上げます。【ポイント】手首の角度に注意し、バーを安定させてコントロールします。
