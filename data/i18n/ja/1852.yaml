description: |-
  開始姿勢：床またはパラレットに座り、両脚を揃えて前に伸ばし、腰の横に手をつきます。
  動作手順：手のひらで床を押して全身を持ち上げ、脚を床と平行にしたL字の姿勢をキープします。
  ポイント：腹直筋、腸腰筋、上腕三頭筋を総動員し、膝をまっすぐ伸ばしたまま耐えます。
