name: ハイニー (もも上げ運動)
upstream:
  license: CC-BY-SA-4.0
  source_id: '1529'
description: |-
  開始姿勢:
  足を腰幅に開いて直立し、胸を張って体幹を引き締めます。

  動作手順:
  1. その場でリズミカルに走りながら、片膝を太ももが床と平行になる高さまで素早く高く引き上げます。
  2. 着地と同時に反対側の膝を同様に素早く引き上げます。
  3. 腕を前後に大きく振りながら軽快なピッチを維持します。

  ポイント:
  腸腰筋（股関節屈筋群）と大腿四頭筋、心肺機能を刺激する優れたアジリティ・ウォームアップ種目です。
