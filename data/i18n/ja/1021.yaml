name: シングルレッグ・カーフレイズ (右脚)
description: |-
  開始姿勢:
  段差や床の上に右足の母指球を乗せて立ち、左足は浮かせておきます。壁に軽く手を添えてバランスを保ちます。

  動作手順:
  1. 右足の踵を深く下ろして、右のふくらはぎを十分にストレッチします。
  2. 右足のつま先で強く押し上げ、踵を限界まで高く引き上げます。
  3. 頂点で1秒キープした後、ゆっくりとコントロールしながら踵を下ろします。

  ポイント:
  右の下腿三頭筋（腓腹筋・ヒラメ筋）を集中的に強化し、左右差を改善します。
