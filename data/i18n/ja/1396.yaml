description: |-
  開始姿勢:
  足を可能な限り大きく左右に広げて立ち（ワイド開脚スタンディング）、つま先を正面に向けます。

  動作手順:
  1. 膝を伸ばしたまま、股関節から上体を前に倒していきます。
  2. 手を床につき、胸を床に近づけるように深く前屈します。
  3. 内転筋群とハムストリングスが強く伸ばされる位置で静止し、深い呼吸を続けます。

  ポイント:
  内転筋群の柔軟性を高め、開脚可動域を広げるハイレベルなストレッチです。
