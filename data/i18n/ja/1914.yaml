name: パラレルバー・アイソメトリックホールド
upstream:
  license: CC-BY-SA-4.0
  source_id: '3061'
description: |-
  開始姿勢：ディップスバーの間に立ち、両手でバーを握って腕を伸ばし体を浮かせます。
  動作手順：肘をロックせずにわずかに曲げた状態を保ち、上腕三頭筋と体幹を固めて静止します。
  ポイント：肩を下げて首を長く保ち、体が前後に揺れないようにしっかりと安定させます。
