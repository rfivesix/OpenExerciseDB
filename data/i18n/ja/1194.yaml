description: |-
  開始姿勢：ケーブルタワーに対して横向きに立ち、胸の前で両手でハンドルを握ります。
  動作手順：体幹を固定したまま両腕を前方にまっすぐ押し出し、数秒キープしてから胸に戻します。
  ポイント：ケーブルの回転力に抗って腹横筋と腹斜筋で体の正面を保ち、回旋を防ぎます。
