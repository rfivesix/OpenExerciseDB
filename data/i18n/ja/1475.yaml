description: |-
  開始姿勢：高いプランクの姿勢をとり、手は肩の真下に置いて体幹をまっすぐにします。
  動作手順：片膝を対角の肘へ向けて引き寄せ、前腕部をすり上げるように骨盤を巻き込みます。
  ポイント：腹斜筋と腹直筋を強く収縮させ、骨盤後傾を意識して左右交互に行います。
