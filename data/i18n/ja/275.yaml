description: |-
  開始姿勢：ロープを装着したロープーリーケーブルの前に立ち、手のひらを向かい合わせてロープを握ります。
  動作手順：肘を脇腹に固定し、腕橈骨筋と上腕二頭筋を使ってロープを胸に向けて引き上げます。
  ポイント：トップポジションでロープの端を少し外側に開き、強い収縮を得るようにします。
