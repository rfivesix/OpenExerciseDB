  license_author: Davidgj32
  source_id: '2995'
description: |-
  開始姿勢:
  マット上で横向きになり、下側の太もも外側（腸脛靭帯）の下にフォームローラーを置きます。上側の脚を前に交差させて床に足裏をつき、負荷を調節します。

  動作手順:
  1. 大転子（股関節の出っ張り）のすぐ下から膝の外側の上部まで、前腕で身体を支えながらゆっくり転がします。
  2. 強い張りを感じる箇所で静止し、深い呼吸を行って筋膜の緊張を緩めます。

  ポイント:
  ランナー膝（腸脛靭帯炎）の予防や、大腿外側の筋膜癒着の解消に有効です。
