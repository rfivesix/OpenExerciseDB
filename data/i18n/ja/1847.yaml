description: |-
  開始姿勢：床に脚を大きく開いて座り、太ももの内側の床に両手をつきます。
  動作手順：手のひらで強く床を押し、腹直筋と腸腰筋を使って開脚したまま両脚とお尻を浮かせます。
  ポイント：上腕三頭筋で体を支え、体幹を強く引き締めて浮遊姿勢を保持します。
