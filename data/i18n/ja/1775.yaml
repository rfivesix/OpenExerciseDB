description: |-
  【開始姿勢】ペックデックマシンに胸をパッドに向けて座り、ハンドルを握ります。【動作手順】腕を真横から後方へ水平に開き、三角筋後部を強く収縮させます。【ポイント】肩甲骨を過度に寄せすぎず、三角筋後部に負荷を集中させます。
