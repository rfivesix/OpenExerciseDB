  source_id: '2795'
description: |-
  開始姿勢:
  アブダクターマシンに深く腰掛け、パッドを両膝の外側にセットします。背中をシートに密着させます。

  動作手順:
  1. 息を吐きながら中臀筋を収縮させ、パッドを外側へ向かって押し開きます。
  2. 最大開脚位置で1〜2秒間静止し、お尻の外側を強く絞り込みます。
  3. 重力に抵抗しながら、ゆっくりと脚を閉じて開始姿勢に戻ります。

  ポイント:
  骨盤の安定やお尻の引き締めに効果的で、反動を使わずに中臀筋を意識します。
