description: |-
  開始姿勢：ハイプーリーの前に立ち、バーまたはロープを両手で握って構えます。
  動作手順：バーを体に密着させながら下腹部へ擦り下ろすように押し込み、上腕三頭筋を収縮させます。
  ポイント：肘を体側に引き付けたまま固定し、ケーブルの張力を感じながら行います。
