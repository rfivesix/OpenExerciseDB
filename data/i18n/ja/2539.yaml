name: アイソメトリック・プリーチャーカール
description: |-
  開始姿勢:
  プリーチャーベンチに座り、脇の下がパッドの上端に密着するようにシートの高さを調節します。上腕の裏側をパッドに平らに乗せ、ダンベルをアンダーハンド（手のひらが上）で保持します。

  動作手順:
  1. 肘を曲げてダンベルを持ち上げ、肘の角度が約90度になるミッドレンジ（最大負荷の位置）で動作を停止させます。
  2. 重力に抵抗してその位置を完全にキープし、上腕二頭筋と上腕筋に最大の力を込め続けて指定時間静止します。
  3. 指定秒数が終了したら、ゆっくりとコントロールしながらダンベルを下ろします。

  ポイント:
  肘や上腕がパッドから浮き上がらないように注意します。手首を過度に巻き込まず、呼吸を止めずに一定の緊張を保ちます。
