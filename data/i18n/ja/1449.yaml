description: |-
  開始姿勢:
  クライムミル（回転式階段マシン）のステップに立ち、手すりを軽く握ります。

  動作手順:
  1. 連続して回転する階段を、一定のペースで1段ずつ正確に登り続けます。
  2. 背筋を真っ直ぐ伸ばし、手すりに体重を預けすぎないように注意して足裏全体でステップを踏みます。

  ポイント:
  大腿四頭筋、大臀筋、ふくらはぎを強化しつつ、極めて高いカロリー消費をもたらす有酸素マシンです。
