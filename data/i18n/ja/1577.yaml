description: |-
  開始姿勢:
  マットの上に横向きに寝ます。上側の脚の膝を曲げて前に出し、床につけて下側の手で膝を押さえます。

  動作手順:
  1. 下側の脚の膝を後ろに曲げ、上側の手で足の甲や足首を掴みます。
  2. 息を吐きながら上の肩を床に向かってゆっくりと回旋させ、胸を開きます。
  3. 下側の太もも前側（大腿四頭筋・腸腰筋）と、上側のお尻（臀筋群）および胸椎の複合ストレッチを20〜30秒間維持します。

  ポイント:
  胸椎の回旋可動域と股関節の柔軟性を同時に改善する代表的なモビリティドリルです。
