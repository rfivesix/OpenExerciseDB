description: |-
  【開始姿勢】壁や柱の横に立ち、片手を肩の高さで壁につけます。【動作手順】上体を腕と反対側へゆっくり回旋させ、胸の筋肉を伸ばします。【ポイント】大胸筋と三角筋前部が心地よくストレッチされる位置で深呼吸しながら静止します。
