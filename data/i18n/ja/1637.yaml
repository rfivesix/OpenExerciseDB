description: |-
  開始姿勢: ハイプーリーの横の床に座り、片手でシングルハンドルを握ります。腕を高く伸ばして広背筋をストレッチさせます。動作手順: 肘を腰に向かって引き下ろすようにしてハンドルを引き寄せ、広背筋を力強く収縮させます。ゆっくりと腕を伸ばして深くストレッチさせます。ポイント: 床に座ることで体幹のブレを抑え、大きな可動域で広背筋を刺激できます。左右それぞれ行います。
