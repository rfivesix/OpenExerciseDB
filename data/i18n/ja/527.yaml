description: |-
  開始姿勢:
  適切なランニングフォームを意識し、背筋を伸ばしてやや前傾姿勢をとります。

  動作手順:
  1. 屋外、トラック、ロードなどを一定のストライドとピッチを保って走ります。
  2. 腕を体側に沿って前後に振り、足の着地衝撃を足裏全体やミッドフットで吸収します。

  ポイント:
  大腿四頭筋、ふくらはぎ、心肺持久力を総合的に高める基本的な持久系運動です。
