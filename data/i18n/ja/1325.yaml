description: |-
  開始姿勢:
  膝を軽く曲げた低いアスレチックスタンスで構えます。

  動作手順:
  1. 片脚で地面を真横に強く蹴り出し（プッシュオフ）、反対方向へ素早く重心を移動させます。
  2. 移動先の足でしっかりと着地して衝撃を吸収し、再び素早く反対方向へ蹴り返します。
  3. 左右への素早い切り返しを連続して行います。

  ポイント:
  中臀筋や内転筋群の側方への爆発力と敏捷性を養うアジリティトレーニングです。
