description: |-
  【開始姿勢】うつ伏せになり、両腕を伸ばします。【動作手順】腕を横に開いた「T」、斜め前の「Y」、頭上へまっすぐ伸ばした「I」の各ポジションで肩甲骨を寄せて腕を持ち上げます。【ポイント】三角筋後部、僧帽筋中部・下部を活性化させ、姿勢を改善します。
