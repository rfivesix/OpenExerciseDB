  license_author: tinman
  source_id: '1973'
description: |-
  開始姿勢：マットに四つ這いになり、左手を後頭部に添えて肘を横に開きます。
  動作手順：左肘を右腕の下へ通すように上体を丸めた後、左胸を開きながら肘を天井へ向けて回旋させます。
  ポイント：骨盤を正面に向けたまま動かさず、胸椎と腹斜筋からしっかりとひねります。
