description: |-
  開始姿勢: 足を肩幅程度に開き、膝と股関節を軽く曲げてメディシンボールを両手で胸の前に保持します。動作手順: 膝と股関節を伸ばしてつま先立ちになりながらボールを頭上に高く持ち上げます。腹筋と広背筋の力を総動員し、ボールを足の間の床に向かって全身全霊で叩きつけます。跳ね返ったボールをキャッチして繰り返します。ポイント: 爆発的なパワーと全身の筋連動、心肺持久力を向上させます。
