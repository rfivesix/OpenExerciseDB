  source_id: '3012'
description: |-
  開始姿勢:
  仰向けに寝転がり、片足の土踏まずにレジスタンスバンドを掛け、両手でバンドの端を持ちます。反対側の脚は床に伸ばします。

  動作手順:
  1. バンドを手前へ引きながら、脚を天井に向かって真っ直ぐ持ち上げます。
  2. 膝を伸ばしたまま心地よい太もも裏（ハムストリングス）の伸張を感じる角度で20〜30秒間静止します。
  3. 脚を交代して同様に行います。

  ポイント:
  バンドの補助により脱力した状態でハムストリングスを効率的にストレッチできます。
