description: |-
  開始姿勢：プリーチャーベンチに座り、EZバーを狭い手幅の順手（オーバーハンド）で握ります。
  動作手順：肘をパッドに固定したままバーを持ち上げ、腕橈骨筋と上腕筋を強く収縮させます。
  ポイント：手首をまっすぐに固定し、反動を使わずにネガティブ動作を丁寧に行います。
