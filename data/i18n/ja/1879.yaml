description: |-
  【開始姿勢】45度のインクラインベンチにうつ伏せになり、両手にダンベルを持ちます。【動作手順】肘を軽く曲げたまま、斜め上前方へ腕を上げて「Y字」を作ります。【ポイント】三角筋中部 (側部)と僧帽筋下部を意識し、肩の健康と姿勢を改善します。
