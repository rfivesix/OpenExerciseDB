name: オルタネイト・ダンベルカール
upstream:
  license: CC-BY-SA-4.0
  source_id: '1907'
description: |-
  開始姿勢：両手にダンベルを持ち、手のひらを内側に向けて背筋を伸ばして立ちます。
  動作手順：片腕ずつ肘を曲げながら前腕部を回外させて巻き上げ、上腕二頭筋を収縮させてからゆっくり戻します。
  ポイント：左右交互にリズミカルに行い、反動を使わずに肘の位置を脇腹に固定します。
