description: |-
  開始姿勢: レジスタンスバンドの一端を肩の高さの柱に固定し、ループに上腕 (上腕三頭筋あたり) を通します。バンドが張る位置まで後退します。動作手順: バンドの抵抗に抗いながら、肘と肩を後方に引き寄せて肩甲骨を背中の中央に寄せます。一瞬キープして収縮を意識し、ゆっくりと戻します。ポイント: 菱形筋と僧帽筋中部を活性化させ、肩甲骨の安定性と正しい姿勢を整えます。
