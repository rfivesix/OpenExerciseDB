description: |-
  開始姿勢：インクラインベンチに座り、両手にダンベルを持って腕を斜め外側に垂らします。
  動作手順：肘を固定したままダンベルを外側へ向けて巻き上げ、上腕二頭筋短頭を強く収縮させます。
  ポイント：腕をWの字を描くように広げて行い、二頭筋内側のストレッチと収縮を強調します。
