  source_id: '1791'
description: |-
  開始姿勢: マットの上で四つん這いになり、両足の親指を合わせ、膝を腰幅より少し広めに開きます。動作手順: 息を吐きながらお尻をかかとの上へ下ろし、両腕を前方に長く伸ばして額をマットに預けます。胸を床に向かって沈め、背中全体と広背筋、腰を心地よく伸ばしながら深く呼吸を繰り返します。ポイント: 背中や肩の緊張をほぐすリラクゼーション・ストレッチです。
