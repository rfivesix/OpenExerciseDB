description: |-
  開始姿勢：指を組むか両手を前に出し、手首の力を抜いてリラックスさせます。
  動作手順：手首を円を描くように時計回りと反時計回りにゆっくりと大きく回します。
  ポイント：手根屈筋群と手根伸筋群をほぐし、トレーニング前のウォームアップや疲労回復に役立てます。
