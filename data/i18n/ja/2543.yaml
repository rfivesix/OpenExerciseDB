name: 手首回し (リストサークル)
description: |-
  開始姿勢:
  背筋を伸ばして立ち、または椅子に座ります。両手の指を胸の前で組むか、両手を軽く握って拳を作り、肘を曲げてリラックスした状態で構えます。

  動作手順:
  1. 手首の力を抜き、時計回りに大きく滑らかな円を描くように手首を回します。
  2. 一定時間（15〜30秒程度）回したら、反対方向（反時計回り）にも同様に回します。
  3. 関節の可動域全体を使い、前腕の手根屈筋群と手根伸筋群を心地よくほぐします。

  ポイント:
  痛みを感じるような無理な力を加えず、滑らかに動かします。腕立て伏せ、懸垂、倒立、ベンチプレスなど手首に強い負荷がかかるトレーニング前のウォームアップに最適です。
