name: EZバー・ミリタリープレス
description: |-
  【開始姿勢】足を揃えて直立し、EZバーを順手で肩幅に握り鎖骨の高さに構えます。【動作手順】体幹を引き締め、バーを頭上へまっすぐ押し上げ、腕を伸ばします。【ポイント】三角筋前部と上腕三頭筋を意識し、腰を反らさないよう腹筋に力を入れます。
