description: |-
  開始姿勢：マットに仰向けになり、膝を曲げて足を床につけ、両手を頭の後ろまたは胸の前に添えます。
  動作手順：息を吐きながら肩甲骨を床から浮かせるように上体を丸め、腹直筋を強く収縮させます。
  ポイント：腰を床につけたまま動作し、首を無理に引っ張らないよう目線はおへそに向けます。
