description: |-
  開始姿勢:
  バーベルの手前に腰幅で立ち、肩幅よりやや広いグリップでバーを握ります。背筋を伸ばして構えます。

  動作手順:
  1. 床からバーベルを爆発的に引き上げ、膝を越えたところで股関節と膝を完全伸展させます。
  2. 肩をすくめ、素早くバーの下に潜り込んでフロントスクワットの深さで肩（フロントラック）にバーを受け止めます。
  3. 脚の力で力強く立ち上がり、コントロールしてバーベルを床へ下ろします。

  ポイント:
  下半身の爆発的瞬発力と全身の協調性を鍛える本格的なウエイトリフティング種目です。
