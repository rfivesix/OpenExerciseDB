name: コマンドー・プルアップ
description: |-
  開始姿勢: 懸垂バーに対して体を縦にして立ち、片手を順手、もう片手を逆手でバーを前後に並べて握ります。動作手順: 身体を引き上げ、頭をバーの片側に寄せて肩がバーに触れるまで引き上げます。コントロールしながら下ろし、次のレップでは頭をバーの反対側に引き上げます。ポイント: 体幹の回旋安定性と広背筋、腕の筋力を左右不均衡なく鍛えます。セットごとに手の前後を入れ替えます。
