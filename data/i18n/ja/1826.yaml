description: |-
  【開始姿勢】レジスタンスバンドを両手で持ち、肩の高さで前に構えます。【動作手順】バンドを横に引き広げると同時に前腕を外側へ回旋させ、親指が後ろを向くように引きます。【ポイント】三角筋後部と回旋筋腱板 (ローテーターカフ)を同時に強化します。
