description: |-
  開始姿勢：四つ這いの姿勢から膝をわずかに床から浮かせ、つま先と両手で体重を支えます。
  動作手順：片手を床から離し、反対側の脚を前方へ蹴り出すように体幹を回転させて戻します。
  ポイント：腹斜筋と体幹を意識し、低い重心を保ちながらリズミカルに行います。
