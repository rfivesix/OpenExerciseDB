  license_author: fabrice
  source_id: '2925'
description: |-
  開始姿勢:
  スクワットラックからバーベルを僧帽筋上部で担ぎ、数歩下がって肩幅よりやや広いスタンスをとります。つま先を少し外に向けます。

  動作手順:
  1. 腹圧を高めて体幹を固め、股関節と膝を曲げてパラレル（平行）を越える深さまで深くしゃがみ込みます。
  2. 臀部がふくらはぎに近づくフルデプスまで腰を沈めます。
  3. 足裏全体で力強く床を押し、大腿四頭筋と大臀筋をフル可動域で動員して立ち上がります。

  ポイント:
  下半身の筋肉を最大可動域で鍛え、柔軟性と筋力を同時に高める究極のスクワットです。
