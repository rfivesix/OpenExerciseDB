description: |-
  開始姿勢：マットの上にうつ伏せになり、両手を胸の横の床につけます。
  動作手順：手のひらで床を押して胸を持ち上げ、骨盤を床につけたまま腹直筋を心地よく伸ばします。
  ポイント：腰に負担がかからないよう肩を下げ、深呼吸を繰り返しながらリラックスして伸ばします。
