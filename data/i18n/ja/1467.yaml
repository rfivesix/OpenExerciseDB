description: |-
  開始姿勢：インクラインベンチに仰向けになり、肩幅程度の狭い手幅でバーベルを握ります。
  動作手順：脇を締めて肘を曲げながらバーを胸上部に下ろし、上腕三頭筋の力で押し上げます。
  ポイント：大胸筋上部と上腕三頭筋に負荷が集中するよう、肘を開かずにコントロールします。
