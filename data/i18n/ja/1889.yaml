description: |-
  開始姿勢：デクラインベンチに仰向けになり、頭側のハンドルを両手で掴んで体を安定させます。
  動作手順：腹直筋下部を意識して両脚を天井へ向けて巻き上げ、腰をわずかに浮かせてからゆっくり下ろします。
  ポイント：傾斜により通常のレッグレイズより負荷が高まるため、腰の反りに注意してコントロールします。
