description: |-
  開始姿勢：床に前腕部をついたプランクの姿勢をとります。
  動作手順：おへそを覗き込むように背中を猫のように丸めて腹直筋を強く収縮させ、数秒キープします。
  ポイント：肩甲骨の間を高く押し上げ、通常のプランクよりも腹筋の屈曲を強調して刺激します。
