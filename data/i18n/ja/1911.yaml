description: '開始姿勢:

  床に四つん這いになり、手は肩の真下に置き、つま先を立てます。両膝を床から数センチだけ浮かせます。


  動作手順:

  1. 手のひらで床を力強く押し込み、肩甲骨を開きながら背中を猫のように丸めます。

  2. 骨盤を後傾させ、おへそを背骨に引きつけるように腹直筋を強く収縮させます。

  3. 膝を浮かせたまま、この丸めた姿勢を指定時間キープします。


  ポイント:

  以前の前腕プランクの誤記を修正。膝をわずかに浮かせた四つん這いから背中を丸めることで前鋸筋と腹筋群を強烈に刺激します。'
