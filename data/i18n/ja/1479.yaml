description: |-
  開始姿勢：マットに仰向けになり、膝を曲げて両手を顔の横でガードのように構えます。
  動作手順：腹直筋を使って上体を素早く起こし、トップで肘を前方に対角に突き出します。
  ポイント：反動を制御し、体幹の回旋と屈曲を力強く連動させて左右交互に行います。
