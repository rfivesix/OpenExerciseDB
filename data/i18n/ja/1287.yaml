description: |-
  開始姿勢：マットに仰向けになり、両腕を天井または頭上へ向けて伸ばします。
  動作手順：息を吐きながら肩甲骨を床から浮かせ、指先を天井高く突き上げるように上体を起こします。
  ポイント：腹直筋上部を意識して収縮させ、首をリラックスさせたままゆっくりと背中を下ろします。
