description: |-
  【開始姿勢】胸の高さに設定したケーブルを両手で持ち、一歩前へ出ます。【動作手順】肘を軽く曲げたまま、胸の前で抱きかかえるように水平に腕を引き寄せます。【ポイント】大胸筋の中部を意識し、腕を開く際に胸をしっかりとストレッチさせます。
