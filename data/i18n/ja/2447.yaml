description: |-
  開始姿勢:
  片足で立ち、背筋を伸ばしたまま上体を前傾させ、もう一方の脚を後ろへ伸ばして飛行機（T字）の姿勢をとります。

  動作手順:
  1. 軸足の股関節を中心にして、骨盤を床に向かって内側に閉じるように回旋させます（股関節内旋）。
  2. 続いて骨盤を天井に向けて外側へ大きく開くように回旋させます（股関節外旋）。
  3. 軸足の足裏で地面を強く捉えながら、ゆっくりとコントロールして回旋を繰り返します。

  ポイント:
  中臀筋、大臀筋、足裏の安定性を極限まで高める最高峰の股関節モビリティ・スタビリティドリルです。
