name: アイソメトリック・リバースグリップ・チンアップホールド
description: |-
  開始姿勢: アンダーハンドグリップ (逆手) で懸垂バーを握り、顎がバーを超えるトップポジションまで身体を引き上げます。動作手順: 肘を曲げ、肩甲骨を強く寄せたトップポジションで身体を静止させ、指定された秒数キープします。コントロールしながらゆっくり下ろします。ポイント: 広背筋と上腕二頭筋の最大収縮位での筋力と持久力を集中的に強化します。
