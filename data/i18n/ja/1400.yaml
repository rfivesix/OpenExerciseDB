description: |-
  開始姿勢:
  立った状態で、片足をもう一方の足の後ろへ交差（クロス）させて置きます。後ろ側の脚は膝を真っ直ぐ伸ばします。

  動作手順:
  1. 息を吐きながら股関節から上体を前に倒し、両手をつま先に向かって下ろします。
  2. 後ろにクロスした脚の太もも裏外側からお尻にかけて心地よい伸びを感じる位置でキープします。
  3. ゆっくりと上体を起こし、脚の前後を入れ替えて反対側も行います。

  ポイント:
  大腿二頭筋（ハムストリングス外側）や腸脛靭帯周辺を重点的にストレッチできます。
