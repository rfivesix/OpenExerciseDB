description: |-
  開始姿勢：直立して両手でメディシンボールまたはタオルを持ち、腕を伸ばして構えます。
  動作手順：腕を頭上に伸ばしながら片足を後方に引き、体幹と脊柱起立筋を使って体を伸ばします。
  ポイント：左右交互に脚を動かし、背筋をまっすぐに伸ばしてバランスを維持します。
