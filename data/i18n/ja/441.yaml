description: |-
  開始姿勢:
  バーベルを広いグリップ（スナッチグリップ）で握り、頭上に真っ直ぐ腕を伸ばしてロックします。足は肩幅に開きます。

  動作手順:
  1. バーベルを頭上の安定した位置に保ちながら、胸を張って膝と股関節を曲げてスクワットします。
  2. 太ももが床と平行になる深さまで上体を崩さずにしゃがみ込みます。
  3. 足裏全体で床を押して立ち上がり、頭上のバーベルを最後まで安定させます。

  ポイント:
  下半身の筋力に加え、肩周りの可動域、胸椎の伸展、強固な体幹安定性が求められる高度な複合種目です。
