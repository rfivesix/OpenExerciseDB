  source_id: '2360'
description: |-
  開始姿勢:
  床に座り、片脚を真っ直ぐ前に伸ばし、もう一方の脚は膝を曲げて足裏を伸ばした脚の内ももにつけます。

  動作手順:
  1. 背筋を伸ばしたまま、伸ばした脚のつま先に向かって胸を近づけるように上体を前に倒します。
  2. 太もも裏（ハムストリングス）に心地よい張りを感じる位置で20〜30秒キープします。
  3. ゆっくり上体を起こし、脚を入れ替えて反対側も行います。

  ポイント:
  背中を丸めず、骨盤から前傾させることでハムストリングスを的確にストレッチします。
