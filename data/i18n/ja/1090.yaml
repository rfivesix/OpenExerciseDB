description: |-
  【開始姿勢】手と足を床につき、お尻を高く持ち上げて身体で「V字」を作ります。【動作手順】頭頂部を両手の間の床に向けて下ろし、肩の力で元の姿勢へ力強く押し戻します。【ポイント】三角筋と上腕三頭筋に体重を乗せ、体幹を引き締めて行います。
