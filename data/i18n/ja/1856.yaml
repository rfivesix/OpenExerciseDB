  license_author: Davidgj32
  source_id: '2993'
description: |-
  開始姿勢:
  床で四つん這いになり、すねの外側前部（前脛骨筋）の下にフォームローラーをセットします。

  動作手順:
  1. 脛骨（すねの骨）自体に直接強い圧がかからないよう、少し外側の筋肉部分にローラーを当てます。
  2. 足首から膝の下まで、ゆっくりと前後に転がして圧迫マッサージを行います。
  3. 反対側のすねも同様に行います。

  ポイント:
  すねの筋肉の張りやシンスプリントの予防・緩和、足首の柔軟性向上に効果的です。
