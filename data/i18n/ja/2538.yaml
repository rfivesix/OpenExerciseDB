name: アイソメトリック・ケーブル・サイドレイズ
description: |-
  開始姿勢:
  低い位置にセットしたケーブルマシンの横に立ち、片手でハンドルを握ります。肘をごくわずかに曲げ、背筋を伸ばして体幹を安定させます。

  動作手順:
  1. 腕を体側から肩の高さ（床と平行）までゆっくりと引き上げます。
  2. 肩の高さで腕を完全に静止させ、ケーブルの引っ張る力に対抗して三角筋中部に強烈な負荷をかけ続けながら指定秒数キープします。
  3. 時間が経過したら、反動を使わずにコントロールしながらゆっくりと腕を下ろします。

  ポイント:
  肩をすくめて僧帽筋に負荷を逃がさないよう注意します。腕を腰の高さで止めるのではなく、肩の高さまでしっかり上げてアイソメトリック収縮を維持します。
