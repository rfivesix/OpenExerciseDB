description: |-
  開始姿勢:
  アブダクターマシンに座り、膝の外側にパッドを当てます。背中をシートに密着させます。

  動作手順:
  1. 息を吐きながら中臀筋を収縮させ、両脚を左右へ大きく押し開きます。
  2. 最大開脚位置で1秒間ホールドし、お尻の外側を収縮させます。
  3. コントロールしながらゆっくりと脚を閉じて戻します。

  ポイント:
  中臀筋を集中的に強化し、骨盤の安定性を高めて美しいヒップラインを作ります。
