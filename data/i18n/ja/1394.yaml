description: |-
  開始姿勢：床に座って両脚をまっすぐ前方に伸ばし、つま先を天井に向けます。
  動作手順：息を吐きながら股関節から上体を前屈させ、両手をつま先に向かって伸ばします。
  ポイント：ハムストリングスと腰部の伸びを感じ、背中だけを丸めずに骨盤から前傾させます。
