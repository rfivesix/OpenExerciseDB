description: |-
  開始姿勢:
  ランドマイン（または部屋の隅）にバーベルの一端を固定し、反対側のスリーブの先端を両手で胸の前に保持します。足は肩幅に開きます。

  動作手順:
  1. 胸を張ったまま深くスクワットを行い、腰を下ろします。
  2. 足裏で床を力強く押して立ち上がる勢いを利用し、バーベルを斜め前方上空へ力強く押し出します（プレス）。
  3. バーベルを胸の前へ戻しながら、流れるように次のスクワットへ移行します。

  ポイント:
  下半身のパワーを体幹を通じて上半身へ伝える爆発的な全身連動トレーニングです。
