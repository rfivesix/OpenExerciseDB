name: 自重スクワット
description: |-
  開始姿勢:
  足を肩幅に開き、つま先をやや外側に向けます。胸の前で腕を組むか前に伸ばします。

  動作手順:
  1. 胸を張ったまま股関節を後方に引き、膝を曲げて太ももが床と平行になるまで腰を下ろします。
  2. 膝がつま先と同じ方向を向いていることを確認します。
  3. 足裏全体で床を押して立ち上がり、直立姿勢に戻ります。

  ポイント:
  下半身トレーニングの基本となる自重種目で、大腿四頭筋と大臀筋の筋力および柔軟性を高めます。
