description: |-
  開始姿勢:
  片足で直立し、背筋を伸ばして体幹を固めます。

  動作手順:
  1. 軸足の膝をわずかに緩め、股関節から上体を前方へ倒すと同時に、浮かせた脚を後方へ一直線に伸ばします。
  2. 上体と浮かせた脚が床と平行になる深さまで倒し、軸足のハムストリングスとお尻の伸びを感じます。
  3. 軸足の踵で床を押し、臀筋を収縮させて元の直立姿勢に戻ります。

  ポイント:
  骨盤が横に傾かないよう床と平行に保ち、片脚のバランスと太もも裏を強化します。
