description: |-
  開始姿勢:
  マットの上で四つん這いになり、手は肩の下、膝は股関節の下に置きます。

  動作手順:
  1. 片脚の膝を曲げたまま外側に持ち上げ、前回りに大きな円を描くように10回回します。
  2. 続いて同じ脚で後ろ回りに大きな円を描くように10回回します。
  3. 反対側の脚も同様に行います。

  ポイント:
  Limber 11の動的種目で、中臀筋と股関節回旋筋群を強力に活性化させます。
