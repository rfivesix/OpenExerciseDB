description: |-
  【開始姿勢】横向きに寝て、上の手でダンベルを持ち、肘を90度に曲げて脇腹に固定します。【動作手順】肘の位置を動かさずに、前腕を天井に向けて外旋させながらゆっくり持ち上げます。【ポイント】回旋筋腱板 (ローテーターカフ)を意識し、反動を使わずコントロールして行います。
