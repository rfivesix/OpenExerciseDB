description: |-
  開始姿勢：胸の深さのプールに立ち、足を肩幅に開いてリラックスします。
  動作手順：息を吸って水中に沈み、鼻や口からゆっくりと息を吐き出しながら立ち上がって息を吸います。
  ポイント：横隔膜と腹直筋をリラックスさせ、水中でリズミカルに呼吸を整えるドリルです。
