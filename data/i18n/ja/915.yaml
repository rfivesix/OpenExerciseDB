description: |-
  【開始姿勢】直立してプレートを両手で持ち、肩の高さで腕を前にまっすぐ伸ばします。【動作手順】車のハンドルを回すように、プレートを左右へ交互に回転させます。【ポイント】三角筋前部と三角筋中部 (側部)の緊張を維持し、腕が下がらないよう高さをキープします。
