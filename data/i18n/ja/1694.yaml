description: |-
  【開始姿勢】チェストプレスマシンの座席に座り、グリップが胸の高さになるよう調整します。【動作手順】背中をパッドにつけて胸を張り、息を吐きながらグリップを前方に押し出します。【ポイント】大胸筋を意識して押し切り、負荷をコントロールしながら戻します。
