description: |-
  開始姿勢:
  トレッドミルマシンの中央に立ち、安全キークリップを衣服に固定します。

  動作手順:
  1. スタートボタンを押し、徐々に目標速度と傾斜へ上げていきます。
  2. 視線を正面に保ち、腕をリズムよく振ってスムーズなストライドで走ります。

  ポイント:
  天候に関係なく速度や走行距離を管理でき、下半身の持久力と心肺機能を効率的に強化できます。
