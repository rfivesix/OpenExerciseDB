description: |-
  開始姿勢：ベンチに座り、ダンベルを両手で支えて頭上に高く持ち上げます。
  動作手順：肘を頭の横に固定したまま肘を曲げて後頭部へ下ろし、上腕三頭筋を使って頭上へ伸ばします。
  ポイント：肘が外側へ開かないように注意し、腰が反らないように体幹を安定させます。
