description: |-
  開始姿勢: ケーブルマシンのハイプーリーの前で片膝立ち (ハーフニーリング) になり、片手でハンドルを握ります。体幹を真っ直ぐ立てます。動作手順: 肘を腰に向かって真っ直ぐ引き下ろし、広背筋を収縮させます。ゆっくりと腕を伸ばしてストレッチポジションへ戻します。ポイント: 下半身を安定させることで体幹のブレを防ぎ、広背筋をダイレクトに刺激します。
