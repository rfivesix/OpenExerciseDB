description: |-
  【開始姿勢】低い位置にセットしたケーブルを握り、少し上体を前傾させて立ちます。【動作手順】下から斜め上前方に向けて両腕を引き上げ、大胸筋上部を収縮させます。【ポイント】大胸筋上部 (鎖骨部)に負荷を集中させ、トップでしっかりと絞り込みます。
