name: バーベル・ショルダープレス
description: |-
  【開始姿勢】ベンチに座り、バーベルを肩幅よりやや広めの順手で握り、鎖骨の高さに構えます。【動作手順】息を吐きながらバーベルを頭上へまっすぐ押し上げ、腕を伸ばします。【ポイント】三角筋前部と上腕三頭筋を意識し、腰を反らさず制御しながら胸元まで下ろします。
