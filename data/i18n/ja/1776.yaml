description: |-
  開始姿勢：片手だけにダンベルを持ち、背筋をまっすぐに伸ばして胸を張って直立します。
  動作手順：重りがある側へ体が傾かないよう反対側の腹斜筋で体幹を垂直に保ちながら、前進歩行します。
  ポイント：肩の高さを左右均等に維持し、小幅でブレのない安定した足取りで歩きます。
