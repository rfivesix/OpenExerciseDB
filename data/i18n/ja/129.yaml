description: |-
  【開始姿勢】マシンのシートに座り、グリップが胸の高さになるよう調整します。【動作手順】肩甲骨を寄せて背もたれにつけ、息を吐きながらグリップを前方に押し出し、大胸筋を収縮させます。【ポイント】肘を伸ばし切らず、ゆっくりとストレッチを感じながら元の位置に戻します。
