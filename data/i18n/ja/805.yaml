description: |-
  開始姿勢：ロープをハイプーリーにセットし、背筋を伸ばしてやや前傾姿勢で立ちます。
  動作手順：脇を締めたままロープを下方へ押し広げ、フィニッシュで上腕三頭筋外側頭を強く収縮させます。
  ポイント：肘の位置を固定し、戻す動作でも負荷を逃がさずゆっくりとコントロールします。
