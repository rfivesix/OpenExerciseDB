description: |-
  開始姿勢:
  ベンチの横でサイドプランクの姿勢をとります。上側の脚の内側をベンチの上に乗せ、下側の脚はベンチの下で浮かせて構えます。

  動作手順:
  1. 肘と前腕で床を支え、上側の脚の内転筋群でベンチを強く押し込み、身体を一直線に保ちます。
  2. 骨盤が垂れ下がらないようにキープし、下側の脚を上脚に引き寄せるように保持します。
  3. 指定の時間キープするか、ゆっくりと骨盤を上下させて反復します。

  ポイント:
  股関節内転筋群の強化において科学的に最も効果が高いとされる高強度の自重種目で、鼠蹊部障害予防に不可欠です。
