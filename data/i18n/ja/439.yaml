description: |-
  開始姿勢：ハイプーリーの中央に立ち、左右のケーブルハンドルを順手（オーバーハンド）で握ります。
  動作手順：肘を肩の高さに保ったまま、上腕二頭筋と前腕部を使って頭に向かって引き寄せます。
  ポイント：肘が下がらないように固定し、ピーク収縮時に二頭筋を力強くスクイーズします。
