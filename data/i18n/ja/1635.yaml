description: |-
  開始姿勢: ラットプルダウンマシンの前にインクラインベンチを設置し、胸を預けて座るか寄りかかります。狭めのグリップでバーを握ります。動作手順: 肘を体側に引き下げてバーを胸の上部まで引き下ろします。広背筋の収縮を感じたら、コントロールしながらゆっくり腕を戻します。ポイント: ベンチで胴体を固定することでチーティングを防ぎ、広背筋を純粋に疲労させます。
