description: |-
  開始姿勢：約45度に設定したインクラインベンチに深く座り、両手にダンベルを持ちます。
  動作手順：肘を固定したまま上腕二頭筋を収縮させてダンベルを巻き上げ、コントロールして下ろします。
  ポイント：腕を下ろした位置で二頭筋の強いストレッチを感じ、肩を上げずに動作します。
