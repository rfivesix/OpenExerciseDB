description: |-
  開始姿勢：TRXのフットクレードルに両足を入れ、腕立て伏せの高いプランク姿勢をとります。
  動作手順：腹斜筋を意識しながら、両膝を曲げて斜め前方の肘に向かって引き込み、ゆっくり戻します。
  ポイント：骨盤を安定させて体幹をひねり、左右交互にコントロールして行います。
