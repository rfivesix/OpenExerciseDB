description: |-
  【開始姿勢】壁に背中、頭、お尻をつけて立ち、肘と手首の甲を壁につけて「W字」を作ります。【動作手順】腕と手首が壁から離れないように保ちながら、ゆっくり頭上へスライドさせて「Y字」まで伸ばします。【ポイント】前鋸筋と僧帽筋下部を意識し、肩甲骨の可動域を広げます。
