name: アシステッド・チンアップ (マシン補助逆手懸垂)
upstream:
  license: CC-BY-SA-4.0
  source_id: '2867'
description: |-
  開始姿勢: アシスト懸垂マシンの膝パッドに膝を乗せ、肩幅のアンダーハンドグリップ (逆手) でバーを握ります。動作手順: 肘を曲げて胸を張り、顎がバーを超えるまで身体を引き上げます。トップで広背筋と上腕二頭筋を収縮させ、ゆっくりとコントロールしながら下ろします。ポイント: カウンターウェイトの補助を利用して正確なフォームを維持し、筋力を段階的に強化します。
