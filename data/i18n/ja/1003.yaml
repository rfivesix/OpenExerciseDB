name: ケトルベル・デッドリフト
upstream:
  license: CC-BY-SA-4.0
  source_id: '1803'
description: |-
  開始姿勢:
  足を腰幅に開き、両足の内側中央にケトルベルを置きます。背筋を伸ばし、股関節を後方に引いてケトルベルのハンドルを両手で握ります。

  動作手順:
  1. 胸を張り、踵で床を押しながら股関節と膝を同時に伸展させます。
  2. ケトルベルを真っ直ぐ引き上げ、直立位置で大臀筋を収縮させます。
  3. 股関節を引いてコントロールしながらケトルベルを両足の間の床へ下ろします。

  ポイント:
  デッドリフトの基本フォームを習得するのに最適な種目で、大臀筋とハムストリングスを安全に鍛えます。
