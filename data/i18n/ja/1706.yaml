description: |-
  開始姿勢:
  両手にダンベルを持ち、ベンチから一歩離れて立ちます。後ろ足の甲をベンチの上に乗せ、前足でバランスをとります。

  動作手順:
  1. 胸を張ったまま、前足の膝と股関節を曲げて垂直に腰を深く落とします。
  2. 前足の太ももが床と平行になり、後ろ膝が床スレスレに来るまで沈み込みます。
  3. 前足の踵で床を力強く押し込み、立ち上がって開始姿勢に戻ります。

  ポイント:
  前脚の大腿四頭筋と大臀筋に強烈な刺激が入り、左右の脚力差を解消する最高の単脚種目です。
