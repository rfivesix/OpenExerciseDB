  license_author: M9
  source_id: '2410'
description: |-
  開始姿勢:
  バーベルの前に腰幅で立ち、背筋を伸ばして順手でバーを握ります。

  動作手順:
  1. 第一動作（クリーン）: 床から爆発的な引き上げでバーベルを肩（フロントラック）にキャッチし、立ち上がります。
  2. 第二動作（ジャーク）: 膝を軽くディップ（屈曲）させ、爆発的な脚の推進力でバーベルを頭上へ押し上げると同時に、足を前後にスプリットさせて下へ潜り込みます。
  3. 頭上で腕をロックした状態で両足を揃えて直立し、コントロールしてバーベルを下ろします。

  ポイント:
  全身の最大パワー、スピード、バランスを競うオリンピック公式の複合リフトです。
