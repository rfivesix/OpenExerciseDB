description: |-
  開始姿勢：ロープーリーケーブルに背を向けて立ち、片手でケーブルを頭の後ろで保持します。
  動作手順：肘を頭の横に固定したまま天井に向かって腕を伸ばし、上腕三頭筋長頭を収縮させます。
  ポイント：片腕ずつ集中してフルレンジで動かし、二の腕の後ろ側の伸びをしっかりと感じます。
