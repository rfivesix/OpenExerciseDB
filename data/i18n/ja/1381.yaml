description: |-
  開始姿勢: マシンに座り、足を踏ん張って胸パッドに胸を当てます。ハンドルを握り、背筋を伸ばします。動作手順: 肩甲骨を背中の中央に寄せる意識を持ちながら、肘を外側・後方に大きく引きます。三角筋後部、菱形筋、僧帽筋中部を強く収縮させ、ゆっくりと負荷をコントロールしながら戻します。ポイント: 上背部と体幹の姿勢保持筋を集中的に強化し、猫背の改善にも寄与します。
