description: |-
  【開始姿勢】サイドレイズマシンの座席に座り、パッドに肘を当てます。【動作手順】背筋を伸ばし、肘でパッドを押し上げるように腕を真横の肩の高さまで持ち上げます。【ポイント】三角筋中部 (側部)に負荷を集中させ、反動を使わずにゆっくり下ろします。
