description: |-
  開始姿勢：床に座って膝を曲げ、上体を少し後傾させて腹筋に力を入れます。
  動作手順：両手を胸の前で合わせ、腹斜筋を意識しながら体幹を左右へゆっくりと交互に回旋させます。
  ポイント：背筋をまっすぐに伸ばし、骨盤を安定させて体幹の深層からひねるように動かします。
