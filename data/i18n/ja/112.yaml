description: |-
  開始姿勢：床に前腕部とつま先をつき、体を一直線に保つプランクの姿勢をとります。
  動作手順：手のひらで床を強く押し、肘を伸ばして上半身を持ち上げ、上腕三頭筋を使ってゆっくり元の位置へ戻します。
  ポイント：動作中に体幹を固め、腰が落ちたり反ったりしないよう維持します。
