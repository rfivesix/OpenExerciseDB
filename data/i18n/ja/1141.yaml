description: |-
  開始姿勢:
  片足で立ち、体幹を引き締めて背筋を伸ばします。

  動作手順:
  1. 軸足の膝をわずかに緩め、股関節から上体を前方へ倒すと同時に、もう一方の脚を後方に真っ直ぐ持ち上げます。
  2. 胴体と浮かせた脚が床と平行で一直線になるまで倒し、バランスを保ちます。
  3. 軸足の臀筋とハムストリングスを使って上体を元の直立姿勢へ戻します。

  ポイント:
  骨盤が横に開かないよう水平を維持し、片脚支持の安定性と臀筋のコントロールを養います。
