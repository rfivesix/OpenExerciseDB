  license_author: wger.de
  source_id: '115'
description: |-
  開始姿勢:
  レッグプレスマシンに座り、フットプレートの中央に両足を揃えるか数センチの間隔で狭く（ナロースタンス）配置します。

  動作手順:
  1. 膝を曲げてプレートを胸の方向へゆっくりと引き下ろします。
  2. 膝が約90度まで曲がったら、足裏全体でプレートを真上へ力強く押し返します。
  3. 膝関節をロックしない位置で切り返し、スムーズに繰り返します。

  ポイント:
  スタンスを狭くすることで、大腿四頭筋の外側部（外側広筋）に刺激を集中させることができます。
