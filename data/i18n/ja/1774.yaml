description: |-
  開始姿勢：椅子の前端に手を置き、足を前に出して膝を曲げ、体を前方に構えます。
  動作手順：背筋を椅子に近づけたまま肘が90度になるまで沈み、上腕三頭筋を使って体を押し上げます。
  ポイント：肩をすくめず肘をまっすぐ後方に曲げ、足の位置を遠くにすると負荷が高まります。
