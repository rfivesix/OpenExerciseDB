name: スプリットスクワット (右前)
upstream:
  license: CC-BY-SA-4.0
  source_id: '1657'
description: |-
  開始姿勢:
  直立した状態から右足を大きく一歩前方へ踏み出し、前後にスタンスをとります。背筋を真っ直ぐ伸ばします。

  動作手順:
  1. 足の位置を動かさず、上半身を垂直に保ったまま腰を真下へ深く落とします。
  2. 右太ももが床と平行になる深さまで沈みます。
  3. 右足の踵で地面を力強く押し上げて元の位置に戻ります。

  ポイント:
  右脚の大腿四頭筋と大臀筋に集中して負荷をかけ、体幹の安定性も高めます。
