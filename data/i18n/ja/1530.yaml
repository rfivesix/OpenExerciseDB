description: |-
  開始姿勢：フラットベンチに仰向けになり、両手にダンベルを持って腕を床に向かって垂らします。
  動作手順：肘の位置を固定したまま上腕二頭筋長頭を使ってダンベルを巻き上げ、ゆっくり下ろします。
  ポイント：初動から二頭筋に強いストレッチがかかるため、反動を使わずに丁寧に動作します。
