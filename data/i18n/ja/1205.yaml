name: ダンベル・リストカール
description: |-
  開始姿勢：ベンチに座り、前腕部を大腿の上に乗せて手首を膝の先に出し、ダンベルを逆手で握ります。
  動作手順：手首を反らせてダンベルを下ろし、手根屈筋群を使って手首を力強く巻き上げます。
  ポイント：腕全体を浮かせずに前腕部を固定し、可動域いっぱいに手首のみを動かします。
