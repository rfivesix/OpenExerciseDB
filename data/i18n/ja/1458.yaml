description: |-
  【開始姿勢】左右のクロスケーブルを交差させて握り、プーリーを低い位置に設定します。【動作手順】腕を斜め上前方へ引き上げ、三角筋中部と僧帽筋下部を収縮させます。【ポイント】僧帽筋上部に頼りすぎず、肩甲骨の自然な上方回旋を意識します。
