description: |-
  開始姿勢: ケーブルローイングマシンに座り、フットプレートに足を置いて膝を軽く曲げます。狭いV字ハンドルを両手で握り、背筋を伸ばします。動作手順: 肘を体側に引き寄せるようにして、ハンドルをみぞおち・お腹に向かって引き寄せます。肩甲骨を寄せて背中の厚み (広背筋・菱形筋) を意識して収縮させ、コントロールしながらゆっくり腕を伸ばして戻します。ポイント: 上体を揺らさず背筋を安定させて引きます。
