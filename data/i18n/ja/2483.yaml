  license_author: Imported from swim plan
  source_id: '4960'
description: |-
  開始姿勢：プール内で片手でプールサイドの壁を掴み、体を水面に水平に浮かべます。
  動作手順：体幹を固め、外腹斜筋を使って下半身を左右にゆっくりと回旋させます。
  ポイント：水の抵抗を感じながら体幹をコントロールし、腰を痛めないよう滑らかに動かします。
