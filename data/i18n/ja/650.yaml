  source_id: '396'
description: |-
  開始姿勢:
  バーベルを鎖骨と肩の前にフロントラックポジションで構え、足を肩幅に開いて立ちます。

  動作手順:
  1. 胸を張ったまま深くフロントスクワットを行い、太ももが床と平行になる深さまでしゃがみます。
  2. 足裏で床を爆発的に蹴って立ち上がる勢い（モメンタム）を利用し、バーベルを一気に頭上へプッシュプレスします。
  3. 頭上で肘をロックし、体幹から一直線になったらコントロールしながらバーベルを鎖骨の上へ戻し、次のスクワットへ流れるように繋げます。

  ポイント:
  下半身の推進力と上半身の押し出しをシームレスに連動させる高強度の全身種目です。
