description: |-
  【開始姿勢】上体を約105度に前傾させ、左右のケーブルハンドルを握ります。【動作手順】肘をわずかに曲げたまま、両手を下から胸の前で抱え込むように引き寄せます。【ポイント】大胸筋中部・下部 (胸肋部)を意識し、背筋をまっすぐに保ちます。
