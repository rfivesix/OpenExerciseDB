description: |-
  【開始姿勢】上体を前傾させ、背筋を伸ばして腕を床へ下ろします。【動作手順】肘を肩の高さまで引き上げ、そこから前腕を天井に向けて外旋させ、逆の順序で戻します。【ポイント】回旋筋腱板 (ローテーターカフ)と菱形筋を意識し、肩のインナーマッスルを強化します。
