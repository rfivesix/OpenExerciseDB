description: |-
  開始姿勢:
  片足の下にスライディングディスク（またはタオル）を敷いて立ちます。胸の前でケトルベルまたはダンベルを保持します。

  動作手順:
  1. 軸足の膝と股関節を曲げてスクワットしながら、スライダーを敷いた脚を真横へ滑らかに滑り出します。
  2. 軸足の太ももが床と平行になる深さまで下ろし、伸ばした脚の内転筋群のストレッチを感じます。
  3. 軸足の踵で強く押し、同時に滑り出した脚を内転筋で引き戻しながら立ち上がります。

  ポイント:
  大腿四頭筋と大臀筋の筋力に加え、内転筋群のエキセントリック・コンセントリック両面のコントロールを養います。
