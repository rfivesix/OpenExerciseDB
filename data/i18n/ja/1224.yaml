  license_author: Lynn_McIntyre
  source_id: '2189'
description: |-
  開始姿勢：直立して両手にダンベルを持ち、手のひらを正面に向けて構えます。
  動作手順：肘を後方に引きながらダンベルを胴体に沿わせて垂直に引き上げ、上腕二頭筋を収縮させます。
  ポイント：肘を前に出さずに後ろへ引くことで、二頭筋の収縮感をダイレクトに高めます。
