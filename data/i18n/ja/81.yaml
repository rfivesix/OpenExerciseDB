name: ダンベル・ワンハンドロー
description: |-
  開始姿勢: フラットベンチに片膝と片手を乗せて上半身を支え、背筋を真っ直ぐ保ちます。もう一方の足は床について体を安定させます。動作手順: フリーの手でダンベルを持ち、肘を体側に沿わせながら腰の高さまで引き上げます。トップで広背筋を収縮させ、コントロールしながらゆっくり下ろします。ポイント: 反動を使わず、背中の力で引き上げます。左右それぞれ行います。
