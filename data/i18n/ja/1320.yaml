name: フロア・ベンチディップス
description: |-
  開始姿勢：床に座り、両手を腰の後方に置いて指先を前方へ向け、膝を立てます。
  動作手順：お尻を少し浮かせ、肘を後方に曲げて体を沈め、上腕三頭筋を使って腕を伸ばし押し上げます。
  ポイント：肩をすくめず首を長く保ち、器具がなくても手軽に三頭筋を追い込めます。
