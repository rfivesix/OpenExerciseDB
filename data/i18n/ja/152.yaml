name: チンアップ (逆手懸垂)
upstream:
  license: CC0-1.0
  license_author: BFad07
  source_id: '803'
description: |-
  開始姿勢: 肩幅ほどのアンダーハンドグリップ (逆手) でプルアップバーを握り、ぶら下がります。動作手順: 胸を張り、肘を曲げながら顎がバーを超えるまで身体を引き上げます。トップで広背筋と上腕二頭筋を強く収縮させ、コントロールしながらゆっくりと開始姿勢まで下ろします。ポイント: 逆手で行うことで、順手の懸垂に比べて上腕二頭筋への関与が高まります。
