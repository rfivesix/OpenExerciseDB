description: |-
  【開始姿勢】横向きに寝て、上側の手にダンベルを持ち、肘を90度に曲げて脇腹につけます。【動作手順】肘を固定したまま、前腕を天井に向けて外旋させて持ち上げます。【ポイント】回旋筋腱板 (ローテーターカフ)を鍛え、肩の安定性を高めます。
