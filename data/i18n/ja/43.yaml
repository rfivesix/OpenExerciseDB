name: バーベル・ハックスクワット
description: |-
  開始姿勢:
  バーベルを床の上に置き、その直前に背を向けて立ちます。足は肩幅程度に開き、背筋を真っ直ぐ保ちます。

  動作手順:
  1. 股関節と膝を曲げて腰を深く落とし、ふくらはぎの真後ろにあるバーベルを順手で握ります。
  2. 胸を張り、背筋を一直線に保ったまま、踵で地面を押して大腿四頭筋の力で立ち上がります。
  3. 膝と股関節が完全に伸びる直前まで押し上げたら、コントロールしながらバーベルを床まで下ろします。

  ポイント:
  腰が丸まらないように体幹をしっかりと引き締め、上半身の前傾を防ぎます。
