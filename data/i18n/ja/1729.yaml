description: |-
  【開始姿勢】肘の高さにセットしたケーブルを反対側の手で持ち、肘を脇につけます。【動作手順】肘を固定したまま前腕を外側へ回旋させ、ケーブルを引きます。【ポイント】回旋筋腱板 (ローテーターカフ)の外旋筋を意識し、丁寧に行います。
