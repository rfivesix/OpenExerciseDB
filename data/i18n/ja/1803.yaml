description: |-
  開始姿勢:
  トラップバー（ヘックスバー）の内側に立ち、足を肩幅程度に開きます。股関節と膝を曲げてニュートラルグリップ（平行握り）でハンドルを握ります。

  動作手順:
  1. 胸を張り、背筋を真っ直ぐ保ったまま足裏全体で力強く床を押します。
  2. 膝と股関節を同時に伸展させて直立姿勢まで立ち上がります。
  3. コントロールしながら腰を落とし、バーを床まで下ろします。

  ポイント:
  スクワットとデッドリフトの利点を兼ね備え、腰への剪断ストレスを減らしながら大腿四頭筋と大臀筋に高負荷をかけられます。
