description: |-
  開始姿勢：平行棒（ディップスバー）の間に立ち、両手でバーを握って体を押し上げます。
  動作手順：肘をまっすぐに伸ばして体を浮かせ、肩を下げて胸を張った姿勢をキープします。
  ポイント：上腕三頭筋と体幹を固め、体が揺れないように固定して一定時間を耐えます。
