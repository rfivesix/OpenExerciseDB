description: |-
  開始姿勢: 腰の高さにセットしたバーの下に仰向けに入り、逆手 (アンダーハンドグリップ) でバーを握ります。頭からかかとまで体を一直線に保ちます。動作手順: 肘を曲げて胸をバーに向かって力強く引き上げ、肩甲骨を中央に寄せます。トップで一瞬静止して背中の収縮を高め、ゆっくりと腕を伸ばして開始位置に戻します。ポイント: 足の位置を前に出すほど負荷が高まり、手前に引くと負荷を軽減できます。
