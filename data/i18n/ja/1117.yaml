description: |-
  開始姿勢: ケーブルローイングマシンに座り、足裏をフットプレートに平らに置きます。膝を軽く曲げ、背筋を伸ばしてハンドルを握ります。動作手順: 胸を張ったまま、肘を後方に引いてハンドルをお腹に向かって引き寄せます。肩甲骨を中央に寄せて広背筋と菱形筋を収縮させ、コントロールしながらゆっくり腕を伸ばして戻します。ポイント: 背中を丸めたり過度に反らしたりせず、体幹を安定させて行います。
