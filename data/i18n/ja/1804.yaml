name: 足関節背屈ロックス (足首モビリティ)
description: |-
  開始姿勢:
  片膝立ち（ハーフニーリング）の姿勢をとり、前足の足裏を床にしっかりと密着させます。

  動作手順:
  1. 前足の踵を床から浮かせないように保ちながら、前膝をまっすぐ前方（またはつま先方向）へ押し出します。
  2. 足首が最大まで背屈（曲がる）位置で2〜3秒間キープします。
  3. ゆっくりと元の位置へ戻し、前後に揺らすようにリズミカルにロッキング動作を繰り返します。

  ポイント:
  踵を床に密着させ続けることで、スクワットの深さに直結する足関節の背屈可動域を改善します。
