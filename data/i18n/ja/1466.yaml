description: |-
  開始姿勢:
  ハックスクワットマシンに入り、フットプレートの下端に母指球を乗せて踵を浮かせます。

  動作手順:
  1. 膝を真っ直ぐ（わずかに緩めた状態）に保ち、踵を深く下ろしてふくらはぎを最大伸張させます。
  2. つま先で強くプレートを押し込み、踵を高く引き上げて下腿三頭筋を収縮させます。
  3. 頂点で1秒キープしてからゆっくりと下ろします。

  ポイント:
  上半身がパッドで安定するため、ふくらはぎに高重量の安全な負荷をかけられます。
