description: |-
  開始姿勢: 約45度に設定したインクラインベンチにうつ伏せになり、両手にダンベルを持ちます。体幹を締め、肩をリラックスさせて腕を自然に下ろします。動作手順: 肩甲骨を寄せながら肘を後方へ引き、ダンベルをみぞおちの高さまで引き上げます。トップで背中を強く収縮させ、ゆっくりと元の位置に戻します。ポイント: 胸がベンチに固定されるため反動を使えず、背中を安全かつ集中的に鍛えられます。
