description: |-
  開始姿勢:
  マット、フォームローラー、ラクロスボールを用意します。

  動作手順:
  1. 筋膜リリース: 腸脛靭帯、内転筋群、大臀筋をローラーやボールでほぐします。
  2. 動的ストレッチ: アイアンクロス、ロールオーバー、ファイヤーハイドラント、ヒップサークル等を行います。
  3. 各種目を指定の回数と秒数に沿って流れるように完了します。

  ポイント:
  ジョー・デフランコ考案の伝説的な下半身モビリティルーティンで、股関節の柔軟性と運動パフォーマンスを劇的に高めます。
