description: |-
  【開始姿勢】床にあるバーベルを構え、背筋を伸ばします。【動作手順】下半身の爆発力でバーを肩へ引き上げてクリーンし、続いて頭上へ力強くプレスします。【ポイント】三角筋前部と全身の瞬発力を連動させ、ダイナミックに行います。
