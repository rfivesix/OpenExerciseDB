  license_author: clafal
  source_id: '2371'
description: |-
  開始姿勢:
  足を肩幅の約2倍に大きく開き、直立します。両手は胸の前で合わせます。

  動作手順:
  1. 片側の膝と股関節を曲げて深く腰を落とし、反対側の脚は真っ直ぐ真横に伸ばします。
  2. 伸ばした脚の踵を床につけ、つま先を天井に向けます。
  3. 曲げた脚の踵が浮かない深さまでしゃがみ込んだら、床を強く押して元のワイドスタンスに戻るか、反対側へ重心をスライドさせます。

  ポイント:
  股関節の可動域を広げ、大腿四頭筋、内転筋群、大臀筋を全可動域で鍛えます。
