description: |-
  開始姿勢：ケーブルタワーに背を向けて立ち、ロープアタッチメントを頭の後ろで保持します。
  動作手順：肘の位置を頭の横に固定したまま前方斜め上に向かって腕を伸ばし、上腕三頭筋長頭を収縮させます。
  ポイント：腰が過剰に反らないよう腹圧を保ち、三頭筋が十分にストレッチされる位置まで戻します。
