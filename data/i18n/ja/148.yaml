name: ハックスクワット・カーフレイズ
description: |-
  開始姿勢:
  ハックスクワットマシンに背中と肩をパッドに密着させて構えます。フットプレートの下端につま先（母指球）を乗せ、踵を外側に浮かせます。

  動作手順:
  1. セーフティを解除し、踵をゆっくりと深く下げて下腿三頭筋（腓腹筋）を最大可動域でストレッチします。
  2. つま先で力強く踏み込んで踵を高く引き上げ、ふくらはぎの頂点での収縮を意識します。
  3. 頂点で1秒キープした後、反動を使わずにゆっくりと下ろします。

  ポイント:
  膝関節を微屈曲で固定し、足首の底屈・背屈動作だけに集中して負荷をかけます。
