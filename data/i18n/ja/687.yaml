description: |-
  【開始姿勢】ラックからバーベルを鎖骨の高さで構え、足を腰幅に開いて立ちます。【動作手順】体幹とお尻を引き締め、顔をわずかに後ろに引きながらバーベルを頭上へ垂直に押し上げます。【ポイント】バーが頭上を通過したら頭を前方に戻し、三角筋前部で支えます。
