description: |-
  開始姿勢：プリーチャーベンチに座り、脇をパッドの縁に当てて上腕部をパッドに固定します。
  動作手順：ダンベルを持ち、上腕二頭筋を意識して肘を曲げながら巻き上げ、ゆっくり戻します。
  ポイント：肘を完全に伸ばしきってロックせず、常に二頭筋に負荷を乗せたまま行います。
