name: ダンベル・ワンハンドロー
description: |-
  開始姿勢:
  フラットベンチ（または安定した台や椅子）に片手と片膝をつき、上体を床と平行に保ちます。もう一方の手にダンベルを持ち、腕を自然に下ろします。

  動作手順:
  1. 肘を脇腹に沿わせながら後方へ引き上げ、ダンベルを骨盤・腰の横へ向かって引き寄せます。
  2. 動作のトップで肩甲骨をしっかり引き寄せ、広背筋を1秒間強く収縮させます。
  3. コントロールを保ちながらゆっくりとダンベルを下ろし、広背筋のストレッチを感じます。
  4. 規定回数を行ったら、反対側も同様に実施します。

  ポイント:
  上体をひねって反動を使わないように注意し、背中の力で丁寧に引き上げます。
