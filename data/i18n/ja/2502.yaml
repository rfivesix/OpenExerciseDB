name: ダンベル・ワンハンドロー (5kg・自宅トレーニング)
upstream:
  license: CC-BY-SA-4.0
  source_id: '4983'
description: |-
  開始姿勢: 椅子や台に片手と片膝をついて上体を前傾させ、背筋を真っ直ぐ伸ばします。もう一方の手にダンベルを持ちます。動作手順: 肘を体側に沿わせながら天井に向かって引き上げ、ダンベルを腰の横まで引き寄せます。背中の収縮を感じたら、ゆっくりとコントロールして下ろします。ポイント: 自宅で行う片側性の水平牽引種目で、広背筋と菱形筋を集中的に強化します。左右それぞれ行います。
