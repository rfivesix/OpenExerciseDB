  license_author: erikocobra
  source_id: '2201'
description: |-
  開始姿勢:
  壁の前に立ち、両手を壁につきます。片足を大きく後ろに引き、つま先を正面に向けます。

  動作手順:
  1. 後ろ足の踵を床にしっかりと密着させたまま、膝を真っ直ぐ伸ばします。
  2. 前足の膝をゆっくり曲げて体重を前方にかけ、後ろ足のふくらはぎ（腓腹筋）を心地よく伸ばします。
  3. 深い呼吸を保ちながら20〜30秒間キープし、脚を入れ替えます。

  ポイント:
  後ろ足の踵が床から浮かないように押し付け、ふくらはぎ全体の柔軟性を高めます。
