description: |-
  開始姿勢: フラットベンチの前に膝立ちになり、両肘をベンチの端に乗せます。手のひらを合わせて祈りの形をとります。動作手順: 股関節を後ろに引きながら胸を床に向かって落とし、頭を両腕の間に沈めます。肘を曲げて手を後頭部に近づけ、広背筋、胸椎、上腕三頭筋の心地よい伸びを感じながら深呼吸を維持します。ポイント: 背中の柔軟性と肩の可動域を向上させます。
