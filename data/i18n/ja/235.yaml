description: |-
  開始姿勢：マットに仰向けになり、両手を臀部の下に置いて脚を床から少し浮かせます。
  動作手順：腹直筋と腸腰筋を締め、左右の脚を上下に細かく交互にバタ足のように動かします。
  ポイント：腰を床にしっかりと密着させ、膝を伸ばしたままリズミカルに行います。
