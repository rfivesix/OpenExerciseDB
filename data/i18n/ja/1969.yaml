description: |-
  開始姿勢：ケーブルタワーの前に立ち、片手でハイプーリーのハンドルを順手で握ります。
  動作手順：肘を体側に固定したまま下向きに腕を押し下げ、上腕三頭筋を強く収縮させます。
  ポイント：片腕ずつ集中して行い、肩が上がらないよう固定してゆっくり元の位置へ戻します。
