description: |-
  開始姿勢：TRXのハンドルを向かい合わせ（ニュートラル）で握り、体を後方に傾けます。
  動作手順：肘を肩の高さに保ったまま肘を曲げ、上腕筋と腕橈骨筋を使って体を手元へ引き上げます。
  ポイント：手首の向きを変えず、体幹を一直線に保ちながら腕の力でスムーズに引きます。
