description: |-
  【開始姿勢】マシンのシートに胸をパッドに当てて座り、両手でハンドルを握ります。【動作手順】肘をわずかに曲げたまま、腕を真横から後方へ大きく開き、三角筋後部を収縮させます。【ポイント】肩甲骨を過度に寄せすぎず、三角筋後部と菱形筋で負荷を受け止めながら戻します。
