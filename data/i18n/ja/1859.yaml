description: |-
  開始姿勢:
  フォームローラーの上に座り、片側のお尻に体重を乗せます。その側の足首を反対側の膝の上に乗せて「4の字」を作ります。

  動作手順:
  1. 体を少し斜めに傾け、大臀筋や中臀筋、梨状筋にピンポイントで圧がかかるように前後に小さく転がします。
  2. 最も張りが強い箇所で静止し、深呼吸して筋肉を緩めます。
  3. 反対側の臀部も同様に行います。

  ポイント:
  お尻の深層筋を緩めることで、骨盤のアライメントと股関節の可動域を劇的に改善します。
