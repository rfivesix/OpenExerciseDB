description: |-
  開始姿勢:
  頑丈なボックスや椅子の前に背を向けて立ちます。片足を床から浮かせ、軸足一本で立ちます。

  動作手順:
  1. 軸足の股関節と膝を曲げ、上体をわずかに前傾させながら腰を後ろへ引き、静かにボックスの上に着席します。
  2. ボックスの上でバウンドせず、体幹の緊張を保ちます。
  3. 軸足の踵で強く床を押し、反動を使わずに立ち上がって直立姿勢に戻ります。

  ポイント:
  ピストルスクワットへのステップアップとして最適で、片脚の大腿四頭筋と臀部の筋力を安全に育成します。
