description: |-
  開始姿勢:
  ベンチまたはリバースハイパーマシンにうつ伏せになり、骨盤の端をパッドに当てます。両脚を揃えて垂らします。

  動作手順:
  1. 体幹を安定させ、大臀筋とハムストリングスを収縮させて両脚を後上方へ持ち上げます。
  2. 胴体と脚が一直線になる高さまで引き上げ、トップで大臀筋を強く収縮させます。
  3. コントロールしながらゆっくりと脚を下ろします。

  ポイント:
  腰椎を牽引しながら臀部とハムストリングスを強化できるため、腰痛のリハビリや予防に極めて効果的です。
