description: |-
  開始姿勢:
  ベンチや椅子に浅く腰掛け、背筋を伸ばします。

  動作手順:
  1. 片足の足首を反対側の膝の上に乗せます。
  2. 胸を張り、背中を丸めずに上体をまっすぐ前へ倒していきます。
  3. お尻の深層にある梨状筋（ピリフォルミス）に強いストレッチを感じる位置で20〜30秒キープします。
  4. 脚を入れ替えて反対側も行います。

  ポイント:
  Limber 11の仕上げ種目で、坐骨神経痛の予防や股関節の柔軟性向上に絶大な効果があります。
