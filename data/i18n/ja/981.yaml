  source_id: '1499'
description: |-
  開始姿勢:
  安定したベンチやステップ台の前に直立します。両手は腰に当てるかリラックスさせます。

  動作手順:
  1. 片足を台の上にしっかりと乗せます。
  2. 台の上の足裏全体で強く踏み込み、大腿四頭筋と大臀筋を使って身体を持ち上げ、台の上に立ち上がります。
  3. コントロールしながらゆっくりと元の足を床へ下ろします。

  ポイント:
  床に残した足でジャンプせず、台に乗せた足の力だけで引き上げる意識を持ちます。
