description: |-
  開始姿勢：床に前腕部をつき、肘が肩の真下に来るようにセットしてつま先立ちになります。
  動作手順：頭、背中、臀部、踵が一直線になるように体を持ち上げ、腹直筋と腹横筋を締めて維持します。
  ポイント：腰を落としたりお尻を突き上げたりせず、床を押して肩甲骨の間を平らに保ちます。
