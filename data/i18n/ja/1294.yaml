name: 自重シングルレッグ・ハムストリングカール
description: '開始姿勢:

  マットの上に仰向けになり、片足の踵を床（またはスライダー）につけ、もう一方の脚は軽く持ち上げます。


  動作手順:

  1. 骨盤を持ち上げて体幹を一直線に保ちます。

  2. 膝を深く曲げながら踵をお尻に向かって引き寄せ、ハムストリングスを強く収縮させます。

  3. 負荷に耐えながらゆっくりと膝を伸ばし、開始姿勢に戻ります。


  ポイント:

  マシンを使わずに自重で左右のハムストリングスを個別に強化できるエクササイズです。'
