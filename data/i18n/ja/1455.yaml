description: |-
  開始姿勢：マットにうつ伏せになり、両手でタオルの両端をピンと張った状態で頭上に伸ばします。
  動作手順：タオルを引っ張り合いながら胸を持ち上げ、肘を曲げてタオルを胸元へ引き寄せて戻します。
  ポイント：脊柱起立筋と広背筋を意識し、背中のアーチを保ったまま肩甲骨を寄せます。
