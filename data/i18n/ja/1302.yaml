description: |-
  開始姿勢：フラットベンチに仰向けになり、ナローグリップでバーベルを胸の上に構えます。
  動作手順：肘を斜め前方に下ろしながらバーを首元へ引き寄せ、上腕三頭筋の力で力強く押し上げます。
  ポイント：ベンチプレスとライイングエクステンションの中間の軌道を意識し、肘への負担に配慮します。
