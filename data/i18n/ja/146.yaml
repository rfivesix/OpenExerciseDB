description: |-
  開始姿勢:
  レッグプレスマシンのシートに深く座り、フットプレートの下端に母指球（つま先側）を乗せます。踵はプレートの外側に浮かせておきます。

  動作手順:
  1. 膝をわずかに緩めた（完全にロックしない）状態を保ち、足首をゆっくり背屈させて踵を手前に引き、ふくらはぎ（腓腹筋）を十分にストレッチします。
  2. つま先でプレートを強く押し込み、足首を最大まで底屈させてふくらはぎを力強く収縮させます。
  3. トップで一瞬静止してから、コントロールしながら元の位置へ戻します。

  ポイント:
  膝を曲げ伸ばしせず、足関節のみの曲げ伸ばしで負荷をコントロールします。
