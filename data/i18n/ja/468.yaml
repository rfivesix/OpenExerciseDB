  license_author: donaddon
  source_id: '429'
description: |-
  開始姿勢: マットの上にうつ伏せになり、頭の下にタオルを敷いて首を楽にします。両腕を体側に真っ直ぐ伸ばします。動作手順: 肩甲骨を背中の中央に寄せるようにしながら、ゆっくりと両腕を床から持ち上げます。トップポジションで3秒間キープし、背中上部の収縮を意識してからゆっくりと下ろします。ポイント: 僧帽筋中部・下部や菱形筋を刺激し、姿勢改善と肩の健康を促進します。
