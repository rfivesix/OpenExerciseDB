name: シーテッド・ダンベルフロントプレス
description: |-
  【開始姿勢】背筋を伸ばしてベンチに座り、両手にダンベルを持って肩の前に構えます。【動作手順】ゆっくりとコントロールしながらダンベルを頭上へまっすぐ押し上げます。【ポイント】三角筋前部を意識し、反動を使わずに丁寧な動作を繰り返します。
