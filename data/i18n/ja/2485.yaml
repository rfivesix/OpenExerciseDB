  license_author: Imported from swim plan
  source_id: '4962'
description: |-
  開始姿勢: 壁を蹴って水中に伸びの姿勢で進みます。動作手順: クロールを数ストローク泳いだ後、息継ぎの際に身体全体を完全に仰向け (背泳ぎの姿勢) にローリングさせて2〜3呼吸キープし、再びうつ伏せに戻ってクロールを続けます。ポイント: 首だけでなく体幹全体を一つのユニットとして連動させて回旋させる感覚を養い、水泳のスムーズな息継ぎを習得します。
