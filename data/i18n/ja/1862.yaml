description: |-
  開始姿勢:
  四つん這いになり、手は肩の真下、膝は股関節の真下に置きます。体幹を水平に保ちます。

  動作手順:
  1. 片脚の膝を曲げたまま、胸の方へ引き寄せます。
  2. 続いて膝を外側へ大きく開き（外転）、そのまま後方へ回し上げてキックバックの姿勢にします。
  3. 股関節を大きく回すように元の位置へ戻します。
  4. 前回しと後ろ回しの両方向を滑らかに行い、反対脚も同様に実施します。

  ポイント:
  股関節の全可動域（屈曲・外転・回旋・伸展）を滑らかに動員し、関節液の分泌と可動性を高めます。
