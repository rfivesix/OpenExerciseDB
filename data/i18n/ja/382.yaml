description: |-
  開始姿勢：プルアップバーにぶら下がり、肩を安定させて体を静止させます。
  動作手順：腹直筋と腸腰筋を使って両脚を伸ばしたまま90度まで持ち上げ、L字の姿勢を保持します。
  ポイント：反動を使わず脚を水平に保ち、体幹の緊張を保ったまま安定した呼吸を続けます。
