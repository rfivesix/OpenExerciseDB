  source_id: '4987'
description: |-
  開始姿勢：マットの上で四つ這いになり、手は肩の真下、膝は股関節の真下に置きます。
  動作手順：対角の腕と脚を床と平行になる高さまでまっすぐ伸ばし、脊柱起立筋と大臀筋を使って静止します。
  ポイント：骨盤が傾いたり腰が反ったりしないよう、体幹を水平に保ったままゆっくり交代します。
