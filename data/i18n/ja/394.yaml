description: |-
  開始姿勢: ロープーリーの前に座り、フットプレートに足を置いて膝を軽く曲げます。ワイドバーを広めのグリップで握り、背筋を伸ばします。動作手順: 肘を体側に近づけながら、バーをおへそに向かって素早く引き寄せます。肩甲骨をしっかりと寄せて背中を収縮させ、腕が完全に伸びるまでコントロールしながらゆっくりと戻します。ポイント: 上体を前後に大きく揺らさず、背中で引く意識を持ちます。
