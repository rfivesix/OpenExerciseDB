name: Tバーローイング (ワイドグリップ)
description: |-
  開始姿勢: Tバーマシンのフットプレートに立ち、膝を軽く曲げて股関節から上半身を前傾させます。ワイドハンドルを広めに握り、胸を張ります。動作手順: 肘を体側に引き寄せながら、バーベルをおへその方向へ引き上げます。トップで背中を強く収縮させ、ゆっくりと元の位置へ戻します。ポイント: 体を揺らさず、背筋を真っ直ぐ保ったまま広背筋と僧帽筋で引きます。
