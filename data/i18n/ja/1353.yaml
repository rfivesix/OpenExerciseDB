description: |-
  【開始姿勢】ベンチに仰向けになり、2つのダンベルを胸の中央でぴったりと合わせます。【動作手順】ダンベル同士を内側へ押し付け合いながら真上へプレスし、ゆっくり胸元へ下ろします。【ポイント】大胸筋の内側を強力に刺激し、動作中ずっとダンベルを強く押し付け合います。
