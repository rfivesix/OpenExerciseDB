  license_author: clafal
  source_id: '2044'
description: |-
  開始姿勢：足を肩幅よりやや広めに開いた高いプランク（腕立て伏せ）の姿勢をとります。
  動作手順：体幹を固定したまま片手を床から離し、反対側の肩をタッチして戻し、交互に行います。
  ポイント：腹直筋と腹斜筋を引き締め、手を動かすときに骨盤が左右に揺れないように耐えます。
