name: ダンベル・シュラッグ
description: |-
  開始姿勢: 両手にダンベルを持ち、体側に腕を自然に下ろして直立します。背筋を伸ばし胸を張ります。動作手順: 肘を真っ直ぐに保ったまま、肩をすくめて耳に近づけるようにダンベルを引き上げます。トップで僧帽筋上部を強く収縮させ、ゆっくりと元の位置へ下ろします。ポイント: ダンベルを体側に保つことで、バーベルよりも自然な軌道で僧帽筋を収縮させることができます。
