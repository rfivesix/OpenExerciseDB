description: |-
  開始姿勢：ハイプーリーにストレートバーを装着し、順手で握って上体を軽く前傾させます。
  動作手順：肘を体側に固定したままバーを太ももに向かって押し下げ、上腕三頭筋を完全に収縮させます。
  ポイント：肩を上げず、肘を支点にして前腕部のみを動かすようにコントロールします。
