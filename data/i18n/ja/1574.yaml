description: |-
  開始姿勢: プールに入り、リラックスした姿勢をとります。動作手順: クロールや平泳ぎなどの泳法で一定のペースを保ちながら継続して泳ぎます。広背筋や肩甲骨周囲筋を活用して滑らかに水をキャッチ＆プルします。ポイント: 関節への衝撃を避けながら心肺機能と背中の筋持久力を高める全身運動です。
