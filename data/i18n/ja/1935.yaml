  source_id: '3084'
description: |-
  開始姿勢:
  ベルトスクワットマシンの専用ベルトを骨盤周りに装着し、ウェイトアームに連結します。フットプラットフォームの上に肩幅で立ちます。

  動作手順:
  1. セーフティレバーを外し、胸を張ったまま股関節と膝を曲げて深くしゃがみ込みます。
  2. 太ももが床と平行になる深さまでスクワットします。
  3. 足裏全体で力強く床を押し、大腿四頭筋と大臀筋を使って立ち上がります。

  ポイント:
  負荷が肩や脊柱ではなく骨盤に直接かかるため、腰に一切の軸圧をかけずに脚を極限まで追い込めます。
