description: |-
  開始姿勢:
  足を腰幅に開いて直立します。

  動作手順:
  1. 右足を左脚の後ろを通すように大きく斜め後ろにクロスさせ、左膝を曲げて腰を深く落とします。
  2. 上体をできるだけ正面に向けたまま、右脚を遠くへ伸ばして沈み込みます。
  3. 前側の左足の踵で床を強く押して立ち上がり、元の位置に戻ります。

  ポイント:
  高度な柔軟性と関節可動域が要求されるスクワットで、中臀筋と大腿部を立体的に刺激します。
