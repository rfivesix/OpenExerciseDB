description: |-
  【開始姿勢】マシンの座席に深く座り、背筋を伸ばしてパッドまたはグリップを握ります。【動作手順】肘を軽く曲げた状態を保ち、胸の前で両腕を合わせるように引き寄せ、大胸筋を強く収縮させます。【ポイント】肩甲骨を寄せたまま腕をゆっくり開き、大胸筋を十分にストレッチさせます。
