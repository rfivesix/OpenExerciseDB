description: |-
  開始姿勢：膝立ちになり、体幹をまっすぐに立てて腕を自然に下ろします。
  動作手順：胸を張りながら上体をわずかに後傾させ、脊柱起立筋と大臀筋を収縮させてキープします。
  ポイント：腰だけを反らせずに太もも前部から体幹全体を一直線に保ち、腹筋の力で支えます。
