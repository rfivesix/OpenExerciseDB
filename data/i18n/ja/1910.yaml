description: '開始姿勢:

  マット上で四つん這いになり、手は肩の真下、膝は股関節の真下に置きます。体幹に力を入れて背骨を真っ直ぐに保ちます。


  動作手順:

  1. 対角線上の片腕を前方へ、反対側の片脚を後方へ同時にまっすぐ伸ばします。

  2. 腕、胴体、脚が床と平行に一直線になった位置で2〜3秒間キープします。

  3. コントロールしながら四つん這いに戻り、手足を入れ替えて反対側も同様に行います。


  ポイント:

  以前の誤記（膝立ち後傾）を訂正。骨盤が傾いたり腰が過度に反らないよう、腹横筋とお尻をしっかり締めて行います。'
