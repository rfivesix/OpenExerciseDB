description: |-
  開始姿勢：ローマンチェアまたはマットにうつ伏せになり、体幹をまっすぐに整えます。
  動作手順：股関節から上体を前方へ倒した後、脊柱起立筋と大臀筋を使って体が一直線になるまで起こします。
  ポイント：反動をつけて背中を過度に反らしすぎず、背筋の筋肉でコントロールして動作します。
