description: |-
  開始姿勢:
  ペンデュラムハックマシンのパッドに背中と肩を密着させ、フットプレートに足を肩幅で置きます。

  動作手順:
  1. 独特の振り子（ペンデュラム）軌道に沿って、膝を曲げて深くしゃがみ込みます。
  2. ボトムで大腿四頭筋が最大ストレッチされたら、足裏全体で力強くプレートを押し上げます。
  3. 膝をロックしない位置まで押し戻し、動作を繰り返します。

  ポイント:
  膝へのストレスを軽減しながら、大腿四頭筋に比類のないストレッチ負荷と筋緊張を与えられます。
