name: スミスマシン・アップライトロー
description: |-
  【開始姿勢】スミスマシンのバーの前に直立し、肩幅より狭めの順手でバーを握ります。【動作手順】肘を先行させてバーを身体に沿わせながら顎の高さまで引き上げます。【ポイント】三角筋中部 (側部)と僧帽筋上部を意識し、肘が手首より高くなるように引き上げます。
