description: |-
  開始姿勢：背筋を伸ばして直立し、足は腰幅に開いて腕を軽く曲げて構えます。
  動作手順：腸腰筋を使って片膝を腰の高さまで高く引き上げ、左右交互にその場で行進するように繰り返します。
  ポイント：背中が丸まらないように胸を張り、体幹をまっすぐに保ちながらリズミカルに行います。
