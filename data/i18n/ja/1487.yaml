description: |-
  開始姿勢：ハイパーエクステンションベンチにうつ伏せになり、両手に軽いプレートを持ちます。
  動作手順：背筋を伸ばしたまま腕で「Y」の字を作り、続いて肘を引いて「W」の字を作ります。
  ポイント：脊柱起立筋と僧帽筋下部を意識し、肩甲骨をしっかりと寄せて保持します。
