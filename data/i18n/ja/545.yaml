description: |-
  開始姿勢：マットに仰向けになり、両手を腰の下または体の横に置いて脚を少し床から浮かせます。
  動作手順：腹直筋と腸腰筋を使って、両脚を交互に左右または上下にハサミのように交差させます。
  ポイント：腰が床から浮かないように腹圧を保ち、脚を低く保つことで負荷を高めます。
