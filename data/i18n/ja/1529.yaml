description: |-
  開始姿勢：プルアップバーに順手でぶら下がり、体をまっすぐに安定させます。
  動作手順：広背筋と腹直筋を強く収縮させ、両脚を伸ばしたままつま先がバーに触れるまで高く持ち上げます。
  ポイント：激しい反動に頼らず、体幹の力でコントロールしながらゆっくりと元の位置へ戻します。
