description: |-
  開始姿勢:
  バーベルを僧帽筋上部に担ぎ、足を肩幅より広く開いたワイドスタンスで立ちます。つま先をやや外側に向けます。

  動作手順:
  1. 膝をごくわずかに曲げて固定し、股関節を後方に引きながら上体を前に倒します（ヒンジ動作）。
  2. 太もも裏と股関節内転筋群に強いストレッチを感じるまで前傾させます。
  3. 大臀筋と内転筋を力強く収縮させて腰を前へ押し出し、直立姿勢に戻ります。

  ポイント:
  足幅を広く取ることで、通常のグッドモーニングに比べて内転筋群への動員が大幅に増加します。
