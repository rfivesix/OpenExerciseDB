description: |-
  開始姿勢：ラットプルダウンマシンに座り、狭い手幅の逆手（アンダーハンド）でバーを握ります。
  動作手順：背筋を伸ばし、肘を曲げながらバーを胸骨に向かって引き下げ、上腕二頭筋と広背筋を収縮させます。
  ポイント：マイク・メンツァーのハイインテンシティ理論に基づき、二頭筋の強い関与を意識して行います。
