description: |-
  開始姿勢：頭上の高い位置にレジスタンスバンドを固定し、両手でバンドの端を握ります。
  動作手順：肘を体側に固定したまま下向きにバンドを引き下げ、上腕三頭筋を強く収縮させます。
  ポイント：バンドの弾性をコントロールし、戻す局面でも負荷が抜けないようゆっくりと戻します。
