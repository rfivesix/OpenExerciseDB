  source_id: '2362'
description: |-
  開始姿勢:
  壁の前に向かい合って立ち、両手を壁に添えて体を安定させます。

  動作手順:
  1. 片脚を浮かせ、身体の前を横切るように内側から外側へ大きく左右にスイングさせます。
  2. 内側へ振る際は内転筋群、外側へ振る際は中臀筋や外側筋群のストレッチと可動性を意識します。
  3. スムーズな振り子運動を繰り返したら、反対脚も同様に行います。

  ポイント:
  上半身のブレを抑え、股関節の内外転可動域を滑らかに広げます。
