  license_author: clafal
  source_id: '1288'
description: |-
  開始姿勢:
  スクワットラックにバーベルをセットし、背後に適切な高さのボックスを置きます。バーベルを担いで立ち、足は肩幅よりやや広めに構えます。

  動作手順:
  1. 股関節を後方に引きながら膝を曲げ、ボックスの上に腰を静かに下ろします。
  2. ボックスの上でバウンドさせず、体幹の緊張を保ったまま一瞬静止します。
  3. 踵で床を力強く押し込み、大臀筋と大腿四頭筋の力で爆発的に立ち上がります。

  ポイント:
  ボックスに着席することで毎回正確な深さを再現でき、反動を排除した立ち上がり筋力を養成します。
