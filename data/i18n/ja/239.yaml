name: デクライン・ダンベルフライ
description: |-
  【開始姿勢】デクラインベンチに仰向けになり、両手にダンベルを持って胸の上に構えます。【動作手順】肘を軽く曲げたまま、胸を張ってダンベルを左右にゆっくり下ろします。【ポイント】大胸筋中部・下部 (胸肋部)の伸びを感じ、肘の角度を一定に保ちながら胸の前へ戻します。
