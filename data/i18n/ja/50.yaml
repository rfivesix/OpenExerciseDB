description: |-
  開始姿勢：フラットベンチに座り、バーベルを肩幅の順手で頭上に真っ直ぐ保持します。
  動作手順：肘の位置を固定したままゆっくりと肘を曲げてバーを頭の後ろへ下ろし、上腕三頭筋を使って押し上げます。
  ポイント：肘が外側に開かないように意識し、コントロールして動作します。
