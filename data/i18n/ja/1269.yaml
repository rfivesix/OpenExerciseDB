description: |-
  開始姿勢：TRXのハンドルを体側で握り、足を前方に置いて体を支えます。
  動作手順：肘を90度まで曲げて体をゆっくりと沈め、上腕三頭筋と大胸筋の力で押し上げます。
  ポイント：ストラップが揺れないよう体幹を安定させ、肩に無理のない深さで動作します。
