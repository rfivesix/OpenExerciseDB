description: |-
  開始姿勢：約45度のインクラインベンチに仰向けになり、両手にダンベルを持って頭上に構えます。
  動作手順：肘を頭の後方に保ったまま前腕部を倒してダンベルを下ろし、上腕三頭筋長頭で押し上げます。
  ポイント：インクラインの角度により三頭筋長頭への強いストレッチが得られるよう意識します。
