description: |-
  開始姿勢:
  トラックや平坦なコース、または上り坂で直立姿勢を整え、ウォームアップを完了します。

  動作手順:
  1. 高強度のスプリントや速いペースでのランニングを一定時間または距離行います。
  2. 続いてジョギングやウォーキングによる積極的休養（レスト）を挟みます。
  3. この高強度と低強度のサイクルを設定回数繰り返します。

  ポイント:
  心肺持久力、VO2max（最大酸素摂取量）、乳酸処理能力を飛躍的に向上させるトレーニングです。
