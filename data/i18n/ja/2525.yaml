description: |-
  開始姿勢：壁やソファの前に片膝立ちになり、後ろ足のすねと甲を壁に立てかけます。
  動作手順：骨盤を後傾させて大臀筋を引き締めながら上体を起こし、腸腰筋と大腿直筋を深く伸ばします。
  ポイント：腰を反らさず体幹をまっすぐに保ち、股関節前面の強いストレッチを感じて深呼吸します。
