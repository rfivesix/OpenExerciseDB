description: |-
  開始姿勢:
  プール内で両手でビート板を保持し、腕を前方へ真っ直ぐ伸ばしてうつ伏せ姿勢をとります。

  動作手順:
  1. 股関節から脚全体をしならせるように、左右交互に水面を強く蹴り下ろします（バタ足）。
  2. 膝を曲げすぎず、大腿四頭筋、大臀筋、足首のしなりを使って推進力を生み出します。

  ポイント:
  水泳のキック力向上とともに、下半身の筋持久力と有酸素能力を関節に負担なく強化できます。
