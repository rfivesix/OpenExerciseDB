name: グルートハムレイズ (GHR)
upstream:
  license: CC-BY-SA-4.0
  source_id: '4955'
description: |-
  開始姿勢:
  GHR（グルートハムディベロッパー）マシンに乗り、膝を半円パッドの上に置き、足首をローラーパッドで固定します。上体を垂直に立てます。

  動作手順:
  1. 膝から頭までを一直線に保ちながら、ハムストリングスで耐えつつ上体を前方へゆっくりと水平まで倒していきます。
  2. ハムストリングスと大臀筋を力強く収縮させ、膝を屈曲させて上体を元の垂直姿勢まで引き戻します。
  3. コントロールを失わずに滑らかに繰り返します。

  ポイント:
  ハムストリングスを膝屈曲と股関節伸展の両面から鍛え上げる最高峰の後面チェーン種目です。
