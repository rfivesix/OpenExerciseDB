  license_author: captive0592
  source_id: '2357'
description: |-
  開始姿勢:
  両足を揃えて直立し、背筋を伸ばします。

  動作手順:
  1. 膝を真っ直ぐ（無理のない範囲）に保ち、股関節から上体をゆっくりと前に倒していきます。
  2. 指先をつま先や床に近づけ、太もも裏（ハムストリングス）とふくらはぎのストレッチを感じます。
  3. 深い呼吸を続けながら、心地よい位置で20〜30秒間静止します。

  ポイント:
  無理に腰を丸めて手を伸ばすのではなく、骨盤を前傾させて太もも裏を伸ばします。
