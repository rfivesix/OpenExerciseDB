name: ボクシング (サンドバッグ打ち＆シャドー)
description: |-
  開始姿勢:
  サンドバッグの前（またはスペース）でボクシングの構えをとります。利き腕と逆の足を前に出し、両膝を柔らかく曲げて重心をつま先寄りに置きます。両拳を顎の高さに構え（ガード）、肘を脇腹に引き締めます。

  動作手順:
  1. ジャブ、ストレート（クロス）、フック、アッパーなどのパンチをリズミカルに繰り出します。
  2. 腕の力だけで打つのではなく、ステップを踏みながら骨盤と体幹の回旋を使って全身でパンチを打ち込みます。
  3. 打った後は素早くガードの位置に戻し、ステップワークやピボットでサンドバッグの周囲を回りながらコンビネーションを継続します。

  ポイント:
  手首の負傷を防ぐため、必ずバンテージやボクシンググローブを着用してください。インパクトの瞬間に手首が曲がらないよう固定し、打つ瞬間に鋭く息を吐きます。
