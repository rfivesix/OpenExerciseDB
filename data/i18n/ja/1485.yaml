description: |-
  開始姿勢：ケーブルの前に立ち、ロープアタッチメントを両手で握ってやや前傾します。
  動作手順：腕を押し下げる動作に合わせて体を前後にわずかに揺らし、上腕三頭筋を強く収縮させます。
  ポイント：反動に頼りすぎず、プッシュダウンのフィニッシュで三頭筋を完全に絞り込みます。
