name: 自重リバースランジ
upstream:
  license: CC-BY-SA-4.0
  source_id: '1753'
description: |-
  開始姿勢:
  足を腰幅に開いて直立し、手は腰に当てるか胸の前で合わせます。

  動作手順:
  1. 片足を大きく一歩後ろへ引き、前後の膝が90度に曲がるまで重心を真っ直ぐ下ろします。
  2. 前足の膝がつま先の真上に来るように保ち、後ろの膝は床スレスレまで下げます。
  3. 前足の踵で床を力強く押して立ち上がり、元の直立姿勢に戻ります。

  ポイント:
  前方に踏み出すランジに比べて前足の膝関節へのストレスが少なく、大臀筋とハムストリングスを効率的に鍛えられます。
