description: |-
  【開始姿勢】デクラインベンチに横になり、バーベルを肩幅よりやや広めに握ります。【動作手順】バーベルをラックから外し、下胸部に向けてゆっくり下ろし、大胸筋中部・下部 (胸肋部)の力で押し上げます。【ポイント】足をしっかり固定し、肘を外に開きすぎないよう注意します。
