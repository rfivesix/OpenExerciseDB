description: |-
  開始姿勢: ベンチの前に膝立ちになり、両肘をベンチに乗せて両手を合わせます。動作手順: 股関節を後ろへ引きながら胸を床に向かって落とし、手を頭の後ろへ曲げていきます。肘を曲げたまま深呼吸を繰り返し、広背筋、胸椎、上腕三頭筋が心地よく伸びるのを感じて一定時間キープします。ポイント: 猫背の改善と肩の柔軟性向上に極めて効果的なストレッチです。
