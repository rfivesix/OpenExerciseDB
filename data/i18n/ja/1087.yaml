description: |-
  開始姿勢:
  両手にダンベルを持ち、体側に構えて立ちます。股関節を軽く後ろに引き、膝をわずかに曲げてダンベルを膝上の高さに保持します（ハングポジション）。

  動作手順:
  1. 股関節と膝を爆発的に伸展させ、同時に肩をすくめてダンベルを上方へ引き上げます。
  2. ダンベルが浮き上がった瞬間に手首を素早く返して下に潜り込み、クォータースクワットの姿勢で肩の上にダンベルをキャッチします。
  3. 膝を伸ばして直立し、ダンベルをコントロールしながらハングポジションへ下ろします。

  ポイント:
  下半身の爆発的な股関節伸展パワーと全身のコーディネーションを養います。
