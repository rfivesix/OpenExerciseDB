  license_author: Davidgj32
  source_id: '3001'
description: |-
  開始姿勢:
  うつ伏せになり、身体と平行にフォームローラーを置きます。片脚の股関節と膝を約90度に曲げて横に開き、太ももの内側（内転筋群）にローラーを当てます。

  動作手順:
  1. 身体を左右に動かし、太ももの付け根（鼠蹊部）から膝の内側手前までゆっくりローリングします。
  2. コリを感じる部位で静止し、筋肉を緩めます。
  3. 脚を入れ替えて反対側も行います。

  ポイント:
  股関節の内転筋群をほぐし、開脚動作やスクワットでの股関節の詰まり感を解消します。
