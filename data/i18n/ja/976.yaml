description: |-
  開始姿勢：マットに仰向けになり、両手でメディシンボールを持って頭上に伸ばします。
  動作手順：上体と両脚を同時に床から持ち上げ、体でV字を作りながらボールをつま先に近づけます。
  ポイント：腹直筋を強く収縮させ、反動を抑えてコントロールしながらゆっくりと仰向けに戻ります。
