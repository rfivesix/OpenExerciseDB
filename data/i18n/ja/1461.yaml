description: |-
  【開始姿勢】フラットベンチの上に両足を乗せるか床から浮かせ、両手にダンベルを持ちます。【動作手順】脚の踏ん張りを使わずに、大胸筋の純粋な力だけでダンベルを押し上げます。【ポイント】体幹を安定させ、大胸筋への負荷を完全に分離して行います。
