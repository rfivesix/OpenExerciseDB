description: |-
  開始姿勢:
  床に座り、両膝を曲げて足裏同士を合わせます。両手でつま先や足首を保持します。

  動作手順:
  1. 踵をできるだけ身体（会陰部）に引き寄せ、背筋を真っ直ぐ伸ばします。
  2. 息を吐きながら両膝を床に向かって優しく押し下げ、胸を足元に近づけるように上体を前に倒します。
  3. 股関節内転筋群（内もも）が心地よく伸びる位置で20〜30秒間キープします。

  ポイント:
  背中を丸めずに骨盤から前傾させ、内転筋の緊張をほぐします。
