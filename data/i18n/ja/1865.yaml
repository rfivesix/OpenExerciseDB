  license_author: Davidgj32
  source_id: '3007'
description: |-
  開始姿勢:
  頑丈な柱にレジスタンスバンドを固定し、ハーフニーリング（片膝立ち）の前足の足首（距骨の真上）にバンドを引っ掛けます。バンドに強いテンションをかけます。

  動作手順:
  1. 前足の踵を床に密着させたまま、膝を前方へまっすぐ押し出し、足関節を最大背屈させます。
  2. バンドの後方への牽引により距骨の後方滑り込みが促され、足首の詰まり感を解消します。
  3. 2〜3秒キープしたら戻し、前後にリズミカルに繰り返します。

  ポイント:
  足関節の背屈制限を取り除き、深いスクワットを可能にする即効性の高いモビリティワークです。
