name: シングルアーム・アイソメトリック・トライセプスプッシュダウン
description: |-
  開始姿勢:
  ハイプーリー（高位置のケーブル）の前に立ち、片手でシングルハンドルを握ります。肘を約90度に曲げ、上腕を体側にしっかりと固定します。体幹を軽く前傾させて姿勢を安定させます。

  動作手順:
  1. 肘を伸ばしてハンドルを下方向へ押し下げ、腕がほぼ伸びきった位置（または指定の中間角度）で動作を止めます。
  2. 上腕三頭筋を強く絞り込むように収縮させたまま、ケーブルの負荷に耐えて指定秒数その場に静止し続けます。
  3. 時間が経過したら、コントロールしながらゆっくりと肘を90度まで戻し、反対側の腕も同様に行います。

  ポイント:
  キープ中に肘が前後に動いたり体から離れたりしないよう固定します。肩に力が入らないよう肩甲骨を下げて動作を行います。
