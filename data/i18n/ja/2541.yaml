description: |-
  開始姿勢：ケーブルタワーの前に立ち、片手でハンドルを握って肘を90度に構えます。
  動作手順：腕を伸ばしきった位置または中間の位置で固定し、上腕三頭筋に強い力を入れ続けて静止します。
  ポイント：肘の位置を体側に固定し、反動を使わずに三頭筋のアイソメトリック収縮を持続させます。
