description: |-
  開始姿勢：床に座って膝を軽く曲げ、両手でメディシンボールを胸の前に保持します。
  動作手順：上体を少し後傾させて腹斜筋を意識し、ボールを左右の床へ交互にタッチするように回旋させます。
  ポイント：背筋を伸ばし、反動を使わずに体幹のコントロールでリズミカルに行います。
