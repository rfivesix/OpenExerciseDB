description: |-
  【開始姿勢】フラットベンチに仰向けになり、両手にダンベルを持ち胸の上に腕を伸ばします。【動作手順】肘をわずかに曲げた角度を固定し、半円を描くようにダンベルを横へ下ろし、大胸筋をストレッチさせます。【ポイント】反動を使わず、大胸筋を絞り込むように元の位置へ戻します。
