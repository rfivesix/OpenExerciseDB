description: |-
  【開始姿勢】スミスマシンのインクラインベンチに座り、バーを肩幅よりやや広めに握ります。【動作手順】セーフティを解除し、バーを胸の上部に向けて下ろし、大胸筋上部 (鎖骨部)で力強く押し上げます。【ポイント】固定された軌道を活かし、大胸筋上部にピンポイントで負荷を乗せます。
