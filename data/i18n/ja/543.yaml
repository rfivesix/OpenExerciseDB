name: マシン・ショルダープレス
description: |-
  【開始姿勢】ショルダープレスマシンに深く座り、グリップが肩の高さになるようシートを調整します。【動作手順】背もたれに背中を密着させ、息を吐きながらハンドルを頭上へ押し上げます。【ポイント】三角筋前部を意識し、肘を完全にロックさせずにゆっくり開始位置へ戻します。
