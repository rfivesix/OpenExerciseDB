description: |-
  【開始姿勢】マシンのシートに座り、背中をパッドにつけてハンドルを握ります。【動作手順】肘を軽く曲げた状態を保ち、胸の前で両腕を合わせるようにゆっくり引き寄せます。【ポイント】大胸筋の収縮を意識し、戻す際も負荷が抜けないようコントロールします。
