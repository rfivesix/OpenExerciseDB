description: |-
  開始姿勢:
  横向きに寝て、膝と股関節を曲げて両脚を重ねます。

  動作手順:
  1. 踵を合わせたまま上側の膝を開き、通常のクラムシェル（外旋）を行います。
  2. 膝を閉じた後、今度は膝を合わせたまま上側の足首を天井に向けて持ち上げ、リバースクラムシェル（内旋）を行います。
  3. 外旋と内旋を流れるように交互に繰り返します。

  ポイント:
  股関節の内旋と外旋を連続して動員し、臀部全体の動的コントロールと関節可動域を向上させます。
