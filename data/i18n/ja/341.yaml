  license_author: wger.de
  source_id: '1054'
description: |-
  開始姿勢:
  スミスマシンのバーを肩の高さに設定し、僧帽筋上部で担ぎます。足幅は狭め（ナロースタンス）にとり、背筋を伸ばします。

  動作手順:
  1. フックを外し、ガイドレールに沿って股関節と膝を曲げ、スクワットの深さまで腰を落とします。
  2. 太ももが床と平行になる深さまで下ろしたら、足裏全体で強く床を押して立ち上がります。
  3. 膝が完全にロックする直前で止め、大腿四頭筋に負荷を保ちます。

  ポイント:
  マシンの軌道が固定されているため、バランスを崩さず大腿四頭筋の外側に集中できます。
