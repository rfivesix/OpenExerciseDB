description: |-
  【開始姿勢】足を肩幅に開いて立ち、両手にダンベルを持ち太ももの前に構えます。【動作手順】肘を軽く曲げたまま、息を吐きながらダンベルを前方の肩の高さまで引き上げます。【ポイント】三角筋前部を意識し、体幹を安定させて上体を前後に揺らさないよう注意します。
