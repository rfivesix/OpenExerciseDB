  license_author: m4k3r
  source_id: '2328'
description: |-
  開始姿勢:
  両手にケトルベルを持ち、前腕と上腕で挟み込むフロントラックポジション（胸の前）で構えます。足は肩幅に開きます。

  動作手順:
  1. 肘を高く保ち、上体を真っ直ぐ立てたまま股関節と膝を曲げて深くしゃがみ込みます。
  2. 太ももが床と平行になる深さまで下ろします。
  3. 足裏全体で床を押して立ち上がり、大腿四頭筋と大臀筋を収縮させます。

  ポイント:
  2つのケトルベルを胸前で保持するため、強烈な体幹（腹筋・背筋）の安定性と大腿四頭筋の筋力が鍛えられます。
