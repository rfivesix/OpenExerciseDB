description: |-
  【開始姿勢】仰向けになり、片手でダンベルを天井に向けて腕を伸ばして保持します。【動作手順】肘をまっすぐに保ったまま、肩甲骨だけを上方へ突き出すように押し上げ、元に戻します。【ポイント】前鋸筋と小胸筋をダイレクトに刺激し、肩甲骨の安定性を高めます。
