name: ダンベル・バイセップスカール
description: |-
  開始姿勢：両手にダンベルを持ち、手のひらを内側に向けて直立します。
  動作手順：肘を曲げながら前腕部を回外させて手のひらを上に向け、上腕二頭筋を強く収縮させて巻き上げ、ゆっくり下ろします。
  ポイント：体を揺らさず反動を抑え、肘の位置を脇腹にしっかり固定します。
