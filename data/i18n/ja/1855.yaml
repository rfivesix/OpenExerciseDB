  license_author: Davidgj32
  source_id: '2991'
description: |-
  開始姿勢:
  床に座り、太もも裏（ハムストリングス）の下にフォームローラーを置きます。両手を後ろについて体重を支え、お尻を浮かせます。

  動作手順:
  1. 坐骨（お尻の付け根）から膝裏の手前まで、体重を乗せながらゆっくりと前後にローリングします。
  2. つま先の向きを内外に変えて、太もも裏の内側・外側の筋肉をバランスよくマッサージします。
  3. 緊張の強い箇所で一時停止して圧をかけます。

  ポイント:
  ハムストリングスの筋膜リリースにより、前屈可動域の向上と腰痛予防に役立ちます。
