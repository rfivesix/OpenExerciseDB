description: |-
  開始姿勢:
  腕立て伏せの姿勢（プランク）になり、肩の真下に手を置き、足は腰幅に開きます。

  動作手順:
  1. 片足を床から持ち上げ、膝を90度に曲げます。
  2. 骨盤を軽く回旋させながら、その足を背中を越えて反対側の体側へ向けてサソリの針のように高く蹴り上げます。
  3. 大臀筋の収縮を感じたら、コントロールしながらプランク姿勢へ戻します。

  ポイント:
  大臀筋の強化とともに股関節と胸椎の回旋可動性を高める動的種目です。
