  license_author: karly
  source_id: '1189'
description: |-
  開始姿勢:
  膝立ちになり、パートナーに足首を強く固定してもらうか、頑丈なバーの下に足首を固定します。股関節を伸ばして体幹を一直線に固めます。

  動作手順:
  1. 股関節を曲げずに、ハムストリングスの力で耐えながら身体を前方の床へ向かってゆっくりと倒していきます。
  2. 耐えきれなくなったら手を前に出して床でソフトに受け止めます。
  3. 手で軽く床を押し返しながら、ハムストリングスを収縮させて元の膝立ち姿勢に戻ります。

  ポイント:
  ハムストリングスのエキセントリック筋力を極限まで鍛え、肉離れ予防に絶大な効果を持つ種目です。
