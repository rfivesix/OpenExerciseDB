description: |-
  開始姿勢: ケーブルマシンのハイプーリーにDハンドルを取り付けます。マシンに向かって片膝立ち (ハーフニーリング) になり、体幹を直立に保ちます。動作手順: 引く側の腕を頭上に伸ばした状態から、肘を体側に引き下げるようにしてハンドルを鎖骨の横まで引き下ろします。広背筋を力強く収縮させ、ゆっくりと元の位置に戻します。ポイント: 片膝立ちにより骨盤が固定され、体幹の回旋ブレを抑えて広背筋を孤立強化できます。
