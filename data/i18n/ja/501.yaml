description: |-
  開始姿勢：吊り下げられた吊り輪（リング）を両手で握り、腕を伸ばして体を支えます。
  動作手順：リングが外側にブレないようコントロールしながら肘を90度まで曲げて下ろし、上腕三頭筋で押し上げます。
  ポイント：体幹を強く引き締めて揺れを抑え、肩の安定性を保ちながら動作します。
