description: |-
  【開始姿勢】直立してレジスタンスバンドや棒を肩幅より広めに持ち、体の前に構えます。【動作手順】肘をまっすぐ伸ばしたまま、腕を頭上を通って背中側へ回し、再び前へと戻します。【ポイント】回旋筋腱板 (ローテーターカフ)と肩関節の柔軟性を向上させるため、無理のない手幅で行います。
