description: |-
  【開始姿勢】直立して両肩の前にダンベルを構えます。【動作手順】膝と股関節を軽く曲げて反動をつけ、脚の伸展の勢いを利用してダンベルを一気に頭上へ押し上げます。【ポイント】三角筋前部と下半身の連動を意識し、頭上でダンベルをしっかり安定させます。
