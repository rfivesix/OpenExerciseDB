description: |-
  開始姿勢:
  足を肩幅より大幅に広く開いたワイドスタンスで立ち、両手を後頭部または胸の前で組みます。

  動作手順:
  1. 膝を伸ばしたまま、股関節から上体を前方に倒してヒンジ動作を行います。
  2. 背筋を平らに保ちながら、太もも裏と内転筋に強いストレッチを感じるまで前傾します。
  3. 大臀筋と内転筋群を収縮させて元の直立姿勢に戻ります。

  ポイント:
  開脚位での股関節屈伸を行うことで、内転筋群とハムストリングスの筋力と柔軟性を同時に向上させます。
