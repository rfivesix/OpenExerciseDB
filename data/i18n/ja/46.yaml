name: スタンディング・バーベルランジ
description: |-
  開始姿勢:
  バーベルを僧帽筋上部で担ぎ、胸を張って直立姿勢をとります。足は腰幅に開いて体幹を引き締めます。

  動作手順:
  1. 片足を大きく一歩前へ踏み出し、両膝が直角（90度）になるまで真下に腰を落とします。
  2. 前足の膝がつま先より前に出すぎないように注意し、後ろ足の膝は床スレスレまで下げます。
  3. 前足の踵で地面を強く蹴り出し、大臀筋と大腿四頭筋を使って元の直立姿勢に戻ります。
  4. 反対側の足も同様に行います。

  ポイント:
  上半身が前後に倒れないよう、体幹を真っ直ぐ垂直に保ちます。
