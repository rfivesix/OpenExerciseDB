  license_author: Franpol
  source_id: '2108'
description: |-
  開始姿勢:
  ロープーリーケーブルにアンクルストラップを装着し、足首に固定します。マシンに向き合って立ち、フレームを握って上体を軽く前傾させます。

  動作手順:
  1. 膝をごくわずかに曲げたまま、大臀筋の力を使って脚を後方へまっすぐ引き上げます。
  2. トップポジションで大臀筋を強く収縮させ、1秒間ホールドします。
  3. ケーブルの負荷に抵抗しながら、ゆっくりと脚を開始位置まで戻します。

  ポイント:
  腰を反らせずに大臀筋の収縮だけで脚を後方へ蹴り出すことが重要です。
