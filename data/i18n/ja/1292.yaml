description: |-
  開始姿勢: 親指を外側に向けたアンダーハンドグリップ (逆手) でバーを肩幅で握り、ぶら下がります。動作手順: 胸を張りながら肘を曲げて身体を引き上げ、顎がバーを超えるまで引き上げます。トップで広背筋と上腕二頭筋を収縮させ、ゆっくりとコントロールしながら下ろします。ポイント: 順手懸垂に比べて腕の力を使いやすく、初心者にも行いやすい懸垂です。
