description: |-
  開始姿勢：ラットプルダウンマシンに座り、狭い手幅の逆手でバーをしっかりと握ります。
  動作手順：背筋を伸ばし、肘を曲げながらバーを胸上部へ引き下げて上腕二頭筋と広背筋を収縮させます。
  ポイント：上体を過度に倒さず、二頭筋の強い引き込みを意識しながらコントロールして戻します。
