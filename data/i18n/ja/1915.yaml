description: |-
  開始姿勢:
  四つん這いになり、手は肩の真下、膝は股関節の真下に置きます。体幹に力を入れて背中を平らに保ちます。

  動作手順:
  1. 膝を90度に曲げたまま、片脚を真横に向かって持ち上げます（股関節の外転）。
  2. 骨盤が反対側に傾かないように体幹で抑えながら、中臀筋が収縮する高さまで上げます。
  3. コントロールしながらゆっくりと膝を床近くまで戻します。

  ポイント:
  骨盤の安定性を司る中臀筋をピンポイントで鍛え、腰椎や骨盤のブレを防ぎます。
