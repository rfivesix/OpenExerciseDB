  source_id: '3076'
description: |-
  開始姿勢: ラットプルダウンマシンに座り、肩幅のアンダーハンドグリップ (逆手) でバーを握ります。胸を張ります。動作手順: 肘を斜め後ろに引き下げるようにして、バーを胸の下部に向かって引き下ろします。トップで広背筋下部と上腕二頭筋を強く収縮させ、ゆっくりと元の位置に戻します。ポイント: 逆手で握ることで可動域が広がり、ボトムでより深い収縮を得ることができます。
