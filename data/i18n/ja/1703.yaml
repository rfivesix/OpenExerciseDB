  license_author: Mariano_O
  source_id: '2823'
description: |-
  開始姿勢：ベンチに片手と片膝をついて上体を前傾させ、もう一方の手にダンベルを持ち肘を脇に固定します。
  動作手順：上腕を動かさずに肘をまっすぐ後方へ伸ばし、上腕三頭筋を力強く収縮させます。
  ポイント：反動を使わずに腕を伸ばしきり、トップで1秒間静止してからゆっくり戻します。
