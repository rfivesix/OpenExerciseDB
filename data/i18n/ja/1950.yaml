description: |-
  開始姿勢:
  マット上で横向きになり、下側の太もも外側の下にフォームローラーを置きます。前腕で床を支えます。

  動作手順:
  1. 骨盤の横から膝の外側の手前まで、ゆっくりと体重をかけて10〜15往復ローリングします。
  2. 圧痛点があれば静止して深呼吸し、筋膜の張りをリリースします。

  ポイント:
  Limber 11の第一種目であり、太もも外側の癒着を剥がして股関節と膝の動きを滑らかにします。
