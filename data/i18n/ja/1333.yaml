description: |-
  開始姿勢：ベンチに前腕部を固定し、手のひらを上に向けたアンダーハンドでダンベルを持ちます。
  動作手順：手首を反らせてダンベルを下ろし、手根屈筋群を意識して手首を力強く巻き上げます。
  ポイント：反動を使わずコントロールされたゆっくりとした動作で前腕部を鍛えます。
