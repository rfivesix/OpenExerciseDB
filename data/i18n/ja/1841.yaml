description: |-
  【開始姿勢】床に座り、両手を肩幅で身体の後ろの床につきます。【動作手順】肘を伸ばしたまま、お尻を前方へ滑らせて肩を伸展させます。【ポイント】三角筋前部と大胸筋を心地よくストレッチし、胸を開いて深呼吸します。
