description: |-
  開始姿勢：プリーチャーベンチに座り、EZバーを肩幅の逆手で握って上腕部をパッドに乗せます。
  動作手順：肘の位置を固定したまま上腕二頭筋を収縮させてバーを巻き上げ、ゆっくりと下ろします。
  ポイント：肘を伸ばしきって関節をロックさせず、常に筋肉の緊張を保ちながら動作します。
