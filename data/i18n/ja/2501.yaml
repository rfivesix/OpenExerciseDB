name: テーブル・インバーテッドロー (自宅自重ローイング)
upstream:
  license: CC-BY-SA-4.0
  source_id: '4982'
description: |-
  開始姿勢: 頑丈なテーブルの下に潜り込み、テーブルの天板の端を両手でしっかりと掴みます。体を頭からかかとまで一直線に伸ばします。動作手順: 肩甲骨を寄せながら肘を曲げ、胸をテーブルの裏側に近づけるように身体を引き上げます。トップで背中の筋肉を収縮させ、ゆっくりと腕を伸ばして下ろします。ポイント: 自宅で器具を使わずに背中の水平引込筋力 (広背筋・菱形筋) を鍛える優れた自重エクササイズです。
