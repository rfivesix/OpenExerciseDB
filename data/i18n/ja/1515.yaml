description: |-
  開始姿勢:
  レッグプレスマシンに深く座り、フットプレートの最下端につま先（母指球）を乗せます。踵は外側に浮かせます。

  動作手順:
  1. 膝を軽く緩めた状態で固定し、踵を手前に引いてふくらはぎを深くストレッチします。
  2. つま先でプレートを強く押し込み、足首を最大まで伸ばしてふくらはぎを収縮させます。
  3. トップで1秒止めてから、コントロールして下ろします。

  ポイント:
  膝を曲げ伸ばしせず、足首の底屈動作のみでプレートを押し動かします。
