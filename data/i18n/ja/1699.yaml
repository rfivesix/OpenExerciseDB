name: バーベル・ベントオーバーロー (アンダーハンドグリップ)
upstream:
  license: CC-BY-SA-4.0
  license_author: daiben
  source_id: '2818'
description: |-
  開始姿勢: バーベルを肩幅でアンダーハンドグリップ (逆手) で握り、膝を軽く曲げて上体を前傾させます。背筋を真っ直ぐ保ちます。動作手順: 肘を体側に沿わせながらバーベルをおへそに向かって引き上げます。トップで広背筋下部と上腕二頭筋を強く収縮させ、コントロールしながらゆっくり下ろします。ポイント: 逆手で引くことで肘を深く引きやすくなり、広背筋下部への刺激が高まります。
