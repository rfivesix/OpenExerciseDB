description: |-
  【開始姿勢】直立または着席し、片手にダンベルを持ち肘を90度に曲げて脇につけます。【動作手順】肘を支点にして前腕を外側（または内側）へゆっくり回旋させます。【ポイント】回旋筋腱板 (ローテーターカフ)を鍛え、肩関節の安定性を高めるため軽めの重量で行います。
