description: |-
  【開始姿勢】柱に固定したレジスタンスバンドの両端を両手で持ち、少し下がって構えます。【動作手順】肘を高く保ちながら、バンドを顔に向けて引き寄せ、同時に外旋させます。【ポイント】三角筋後部と僧帽筋中部を意識し、肩甲骨を寄せて引き締めます。
