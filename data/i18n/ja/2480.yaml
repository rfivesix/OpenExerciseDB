description: |-
  開始姿勢: プールに入り、リラックスした状態でスタートします。動作手順: 会話ができる程度の穏やかで一定のペースを維持しながら、クロールで泳ぎ続けます。スピードやタイムを意識せず、ゆったりとしたストロークで身体を動かして心拍数を適度に高めます。ポイント: 呼吸と腕のストロークを一定に保ち、背中や肩の血流を促進するリカバリー有酸素運動です。
