description: |-
  【開始姿勢】直立して両手にダンベルを持ち、太ももの前に構えます。【動作手順】反動を使わず、肘をわずかに曲げたままダンベルを目の高さまでゆっくり持ち上げます。【ポイント】三角筋前部に常に緊張を保ち、下ろす際もゆっくり耐えながら戻します。
