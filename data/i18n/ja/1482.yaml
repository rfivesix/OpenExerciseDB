description: |-
  開始姿勢：両手に高重量のダンベルを持ち、背筋を伸ばして安定したスタンスをとります。
  動作手順：わずかな股関節の反動を使ってダンベルを巻き上げ、下ろす動作を4秒かけて極めてゆっくり行います。
  ポイント：ネガティブ局面で上腕二頭筋に強いエキセントリック負荷を集中させます。
