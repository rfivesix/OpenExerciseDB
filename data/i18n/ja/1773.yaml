description: |-
  【開始姿勢】Legend Fitnessのレバレッジ・インクラインマシンに座り、グリップを握ります。【動作手順】背もたれに背中を密着させ、大胸筋上部を意識してハンドルを斜め上へ力強く押し出します。【ポイント】大胸筋上部 (鎖骨部)を効果的に鍛え、マシンの安定した軌道を活かします。
