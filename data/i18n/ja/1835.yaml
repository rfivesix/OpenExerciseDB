description: |-
  【開始姿勢】膝を立てて座り、片側の肘を立てた膝の上に乗せてダンベルを持ちます。【動作手順】肘を90度に曲げたまま、前腕を垂直まで起こして回旋させ、ゆっくり戻します。【ポイント】回旋筋腱板 (ローテーターカフ)を強化・ストレッチし、肩の安定性を高めます。
