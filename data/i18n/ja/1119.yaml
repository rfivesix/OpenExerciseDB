  license_author: Franpol
  source_id: '2088'
description: |-
  開始姿勢: ローイングマシンのシートに座り、胸パッドに胸を当てます。ナローグリップのハンドルを握り、背筋を伸ばします。動作手順: 肩甲骨を寄せながら肘を後方に引き、ハンドルをみぞおちに向かって引き寄せます。広背筋と菱形筋を強く収縮させたら、コントロールしながらゆっくり元の位置に戻します。ポイント: 体がパッドから離れないように保ち、背中の筋肉に負荷を集中させます。
