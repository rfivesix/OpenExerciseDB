description: |-
  開始姿勢: シートの高さを調節し、ハンドルが胸の下部と同じ高さになるように座ります。胸パッドに胸を当てて背筋を伸ばします。動作手順: ハンドルを握り、肘を後方に引いて肩甲骨を寄せます。左右交互または同時に引き、背中の筋肉を強く収縮させた後、ゆっくりと開始位置に戻します。ポイント: 体幹を安定させ、胸がパッドから離れないように行います。
