description: |-
  【開始姿勢】レバレッジマシンの座席の高さを調整し、グリップが胸の高さに来るように座ります。【動作手順】背中をパッドにつけ、大胸筋を意識してハンドルを前方に力強く押し出します。【ポイント】押し切った位置で大胸筋を収縮させ、ゆっくりと元の位置に戻します。
