  source_id: '1742'
description: |-
  開始姿勢:
  足を腰幅に開いて直立します。

  動作手順:
  1. 素早くしゃがみ込んで両手を床につけます。
  2. 両足を同時に後ろへ蹴り出し、腕立て伏せのトップポジション（プランク）をとります。
  3. 胸を落とさずにすぐ足を前方へ引き戻します。
  4. 立ち上がると同時に真上へ軽くジャンプし、頭上で手を叩きます。

  ポイント:
  腕立て伏せを省くことで下半身と体幹の瞬発的な連動と心肺持久力にフォーカスできます。
