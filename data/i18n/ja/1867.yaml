description: |-
  開始姿勢：マットの上で片膝立ちのランジ姿勢をとり、両手を前足の膝の上に置きます。
  動作手順：背筋を立てたまま骨盤を前下方へ沈め、後ろ側の股関節屈筋群をゆっくりと伸ばします。
  ポイント：腰を反らさずに大臀筋を意識し、太もも前部から付け根にかけてじんわりと伸ばします。
