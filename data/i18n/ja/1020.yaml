  source_id: '1938'
description: |-
  開始姿勢:
  右足一本で立ち、左脚を前方に真っ直ぐ伸ばして床から浮かせます。両腕を前に伸ばしてバランスをとります。

  動作手順:
  1. 右の股関節と膝を曲げ、上体をわずかに前傾させながら深くしゃがみ込みます。
  2. 左足が床に触れないようにキープし、右の太ももがふくらはぎに接する深さまで下ろします。
  3. 右足の踵で力強く床を押し込み、直立姿勢まで立ち上がります。

  ポイント:
  右脚の大腿四頭筋と大臀筋の筋力、足関節の柔軟性、バランス能力を極限まで高めます。
