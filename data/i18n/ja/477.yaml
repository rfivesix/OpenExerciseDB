description: |-
  開始姿勢: マシンのステップに乗り、膝または足をアシストパッドに乗せます。肩幅より広めにバーを握り、体を支えます。動作手順: 肘を曲げて肩甲骨を寄せながら、顎がバーを超える高さまで身体を引き上げます。コントロールしながらゆっくりと体を下ろし、広背筋をストレッチさせます。ポイント: ウエイトの補助を利用して適切なフォームを習得し、広背筋を効果的に鍛えます。
