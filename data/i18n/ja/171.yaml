description: |-
  開始姿勢：デクラインベンチに仰向けになり、足首をパッドにしっかりと固定します。
  動作手順：腹直筋を意識しながら背中を丸めるように上体を巻き上げ、トップで静止してからゆっくり戻します。
  ポイント：腰を過度に反らせず、重力に抗いながらコントロールして下降します。
