description: |-
  【開始姿勢】両手でレジスタンスバンドを持ち、肩の高さで腕を前に伸ばします。【動作手順】肘をわずかに曲げたまま、バンドが胸につくまで両腕を真横へ大きく引き広げます。【ポイント】三角筋後部と菱形筋を意識して肩甲骨を寄せ、ゆっくり戻します。
