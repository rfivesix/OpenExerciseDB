description: |-
  開始姿勢:
  床に座り、両脚を左右に広く開脚（パンケーキポジション）します。背筋を伸ばし、両手を後頭部または胸の前で組みます。

  動作手順:
  1. 膝を上に向けて伸ばしたまま、股関節から上体をゆっくりと前方へ倒していきます（ヒンジ動作）。
  2. 背筋を平らに保ちながら、内転筋群とハムストリングスが強くストレッチされる深さまで前傾します。
  3. 臀筋と太もも裏の力で上体を起こし、元の直立姿勢に戻ります。

  ポイント:
  座った状態で開脚ヒンジを行うことで、骨盤のコントロールと内転筋・ハムストリングスの柔軟性を高めます。
