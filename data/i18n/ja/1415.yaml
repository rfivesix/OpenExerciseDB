description: |-
  開始姿勢：マットに仰向けになり、膝を直角に曲げ、両手でダンベルを胸の上または頭上に保持します。
  動作手順：息を吐きながら背中を丸めて上体を起こし、腹直筋を強く収縮させてゆっくり下ろします。
  ポイント：ダンベルの重みで負荷を高め、腰を床につけたまま肩甲骨をしっかりと浮かせます。
