description: |-
  開始姿勢:
  パワーラックのセーフティピン（バー）をスクワットのボトム（スティッキングポイント）の高さに設定し、バーベルを担いで構えます。

  動作手順:
  1. 通常通りスクワットを行い、セーフティピンの上にバーベルを静かに着地させます。
  2. ピンの上で反動を完全に消すため1〜2秒間静止し、体幹の緊張を保ち続けます。
  3. 反動を使わずにゼロからの力で床を爆発的に押し、直立姿勢まで立ち上がります。

  ポイント:
  ストレッチショートニングサイクル（反動）を排除し、ボトムからの純粋な立ち上がり筋力を強化します。
