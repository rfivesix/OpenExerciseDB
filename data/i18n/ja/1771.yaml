name: ケーブル・リストカール
description: |-
  開始姿勢：ロープーリーケーブルの前に座るか跪き、前腕部を大腿に乗せてバーを逆手で握ります。
  動作手順：手首を反らせてから、手根屈筋群を使って手首を力強く内側に巻き上げます。
  ポイント：前腕部を動かさず手首のみを屈曲させ、ケーブルの一定した張力を維持します。
