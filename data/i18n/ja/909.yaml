description: |-
  開始姿勢:
  マットの上に両膝立ちになり、足の甲を床に寝かせます。股関節を完全に伸ばし、膝から頭までを一直線に保ちます。

  動作手順:
  1. 股関節を曲げずに一直線を保ったまま、膝関節だけを屈曲させて上体をゆっくりと後方へ倒していきます。
  2. 大腿四頭筋（特に大腿直筋）に強烈なストレッチとエキセントリック負荷を感じる深さまで倒します。
  3. 大腿四頭筋を力強く収縮させて身体を引き戻し、開始姿勢に戻ります。

  ポイント:
  反り腰にならないよう腹筋とお尻に力を入れ、大腿直筋の柔軟性と伸張性筋力を高めます。
