name: パンチング (シャドーボクシング)
description: |-
  【開始姿勢】足を前後に開き、顎を引いてガードを高く構えます。【動作手順】腰の回転と連動させて、まっすぐストレートパンチを前方にテンポよく繰り出します。【ポイント】三角筋前部と体幹の回旋を意識し、有酸素運動としても効果的です。
