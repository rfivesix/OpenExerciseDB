description: |-
  開始姿勢：ケーブルの前にベンチを置いて座り、片手でロープーリーのハンドルを握ります。
  動作手順：肘を大腿内側に固定したまま上腕二頭筋を収縮させてハンドルを引き上げ、ゆっくり下ろします。
  ポイント：ケーブルの一定した負荷を利用し、トップでピーク収縮をしっかりと作ります。
