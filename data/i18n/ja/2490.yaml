name: ロープーリー・ケーブルロー (トライアングルグリップ)
description: |-
  開始姿勢: ロープーリーマシンの前に座り、フットプレートに足を乗せて膝を軽く曲げます。トライアングルハンドルを両手で握り、背筋を伸ばします。動作手順: 肘を体側に引き寄せながら、ハンドルをお腹に向かって引き寄せます。肩甲骨を中央に寄せて背中を収縮させ、コントロールしながらゆっくり腕を伸ばして戻します。ポイント: 背中を丸めず、胸を張って体幹を固定したまま引きます。
