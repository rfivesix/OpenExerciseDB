  license_author: aboksz
  source_id: '2913'
description: |-
  開始姿勢：ランドマインのバーベル端を両手で持ち、腕を伸ばして頭上の高さに構えます。
  動作手順：腕を伸ばしたまま体幹を回旋させ、バーベルを半円を描くように左右の腰の横へ交互に下ろします。
  ポイント：腹斜筋と腹直筋を強く収縮させ、骨盤を安定させて体幹の回転力をコントロールします。
