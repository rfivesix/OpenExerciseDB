description: |-
  【開始姿勢】両手を肩幅よりやや広めに床につき、頭からかかとまで身体を一直線に保ちます。【動作手順】肘を45度程度に曲げながら胸が床につく直前まで身体を下ろし、手のひら全体で床を押して元の位置に戻ります。【ポイント】腰を反らせず大胸筋を意識して行います。
