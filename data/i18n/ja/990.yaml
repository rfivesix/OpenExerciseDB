  source_id: '1630'
description: |-
  開始姿勢:
  マット上で四つん這いになり、手は肩の真下、膝は股関節の真下に置きます。体幹を引き締めます。

  動作手順:
  1. 片脚の膝を90度に曲げたまま、足裏で天井を押すように上方へ脚を蹴り上げます。
  2. 太ももが胴体と一直線またはやや高くなる位置まで上げ、大臀筋を最大収縮させます。
  3. 腰が反らないように注意しながら、ゆっくりと膝を開始位置近くまで戻します。

  ポイント:
  骨盤の傾きや腰椎の過伸展を防ぎ、大臀筋をダイレクトにアイソレーションします。
