description: |-
  開始姿勢: 足を肩幅より広く開いたスモウスタンスでケトルベルをまたぐように立ち、股関節を引いて両手でハンドルをオーバーハンドグリップで握ります。動作手順: 股関節と膝を爆発的に伸展させて立ち上がり、その推進力を利用して肘を高く持ち上げ、ケトルベルを胸から肩の高さまで引き上げます。コントロールしながらゆっくりと床に戻します。ポイント: 大臀筋やハムストリングス、僧帽筋、三角筋を連動させて瞬発力を高める複合種目です。
