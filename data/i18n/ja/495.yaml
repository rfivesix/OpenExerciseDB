description: |-
  開始姿勢：バーベルを肩幅の順手（手の甲を前）で握り、背筋を伸ばして直立します。
  動作手順：肘を脇腹に固定し、腕橈骨筋と上腕筋を意識してバーベルを持ち上げ、ゆっくり下ろします。
  ポイント：手首を反らせずまっすぐに保ち、反動を使わずに腕の力だけでコントロールします。
