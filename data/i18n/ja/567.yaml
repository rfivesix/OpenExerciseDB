name: ダンベル・ショルダープレス
description: |-
  【開始姿勢】ベンチに背筋を伸ばして座り、両手にダンベルを持ち耳の高さで構えます。【動作手順】手のひらを正面に向け、息を吐きながらダンベルを頭上へ押し上げます。【ポイント】頭上でダンベルをぶつけず、三角筋前部と三角筋中部 (側部)の緊張を保ちながら下ろします。
