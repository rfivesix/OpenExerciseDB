description: |-
  開始姿勢：床に座るか直立し、背筋をまっすぐに伸ばして両手を構えます。
  動作手順：骨盤を安定させたまま、上体をゆっくりと片側へ大きくひねり、腹斜筋と腰部を伸ばします。
  ポイント：反動をつけず、息を吐きながら数秒間キープして反対側も同様に行います。
