description: |-
  開始姿勢:
  ベンチに肩甲骨の下部を乗せて座り、片足を前方に伸ばして浮かせます。軸足の足裏を床に置きます。

  動作手順:
  1. 軸足の踵で強く床を押し込み、骨盤を水平に押し上げます。
  2. 上半身と太ももが一直線になる高さで大臀筋を限界まで絞り込みます。
  3. コントロールしながらゆっくりと骨盤を下げ、反対脚も同様に行います。

  ポイント:
  片脚で行うことで負荷が倍増し、大臀筋の筋力左右差を完璧に整えられます。
