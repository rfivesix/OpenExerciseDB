name: アイソメトリック・レッグエクステンション
description: |-
  開始姿勢:
  レッグエクステンションマシンに深く腰掛け、膝の回転軸とマシンの軸を合わせます。パッドを足首のすぐ上のすねに当て、サイドハンドルを握って骨盤をシートに固定します。

  動作手順:
  1. 膝を伸ばしてパッドを持ち上げ、中間角度または完全伸展の手前の指定位置で脚を静止させます。
  2. 関節を動かさずに大腿四頭筋を強く収縮させ続け、その緊張を指定時間キープします。
  3. 時間が経過したら、反動を使わずにゆっくりとコントロールしながらパッドを下ろします。

  ポイント:
  呼吸を止めずに一定のリズムを保ちます。膝蓋腱への負担をコントロールしながら大腿四頭筋を集中的に強化でき、リハビリや補強トレーニングに最適です。
