description: |-
  開始姿勢:
  両手にダンベルを持ち、肩の上にダンベルの一端を載せるフロントラックポジションをとります。肘を前に向け、足は肩幅に開きます。

  動作手順:
  1. 胸を張って上体を直立に保ち、股関節と膝を曲げて深くしゃがみ込みます。
  2. 太ももが床と平行になる深さまで下ろします。
  3. 足裏全体で床を力強く押し、大腿四頭筋と大臀筋を使って立ち上がります。

  ポイント:
  重心が前にあるため上半身が自然と立ち、大腿四頭筋にダイレクトな負荷がかかります。
