description: |-
  【開始姿勢】30〜45度に設定したインクラインベンチに座り、両手にダンベルを持って胸の横に構えます。【動作手順】足を踏ん張って胸を張り、大胸筋上部 (鎖骨部)を意識しながらダンベルを真上へ押し上げます。【ポイント】肘を伸ばし切らず、ゆっくり胸の上部へ下ろします。
