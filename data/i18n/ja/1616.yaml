description: |-
  開始姿勢:
  四つん這いになり、片足の膝裏（膝窩部）に軽いダンベルをしっかりと挟み込みます。体幹を水平に保ちます。

  動作手順:
  1. ダンベルを落とさないよう膝を直角に強く曲げたまま、足裏を天井に向かって押し上げるように脚を蹴り上げます。
  2. 太ももが胴体と水平になる高さまで上げ、大臀筋の最大収縮を意識します。
  3. 腰が反らないように注意しながら、ゆっくりと膝を床近くまで下ろします。

  ポイント:
  ダンベルの重量負荷が加わることで、大臀筋とハムストリングスへの筋肥大刺激が大幅に向上します。
