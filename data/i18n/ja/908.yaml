description: |-
  開始姿勢:
  リラックスした直立姿勢をとり、心拍計を準備します。

  動作手順:
  1. 最大心拍数の約60〜70%（鼻呼吸が維持でき、会話が楽に続けられるペース）で一定にランニングを行います。
  2. ペースが上がりすぎないように一定の心拍ゾーンを厳格にキープします。

  ポイント:
  ミトコンドリア機能の向上と脂質代謝の改善、有酸素ベースの構築に最適なトレーニングです。
