  license_author: aahuja
  source_id: '2455'
description: |-
  開始姿勢: ケーブルマシンの前で片膝立ちになり、ハイプーリーのハンドルを片手で握ります。体幹を真っ直ぐ保ちます。動作手順: 肘を斜め後ろ、広背筋の方向へ向かって引き下げながら、ハンドルを胸の横まで引き寄せます。背中の筋肉の収縮を感じたら、ゆっくりとコントロールして戻します。ポイント: 高い位置から斜め下に引く軌道により、広背筋下部と広背筋外側を効果的に刺激します。
