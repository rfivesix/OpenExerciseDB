description: |-
  開始姿勢：プルアップバーに順手でぶら下がり、体をまっすぐに安定させます。
  動作手順：体を揺らさずに腹直筋と腸腰筋を使って両脚を水平以上まで持ち上げ、ゆっくり下ろします。
  ポイント：反動やモメンタムを使わず、骨盤を後傾させて腹筋の下部をしっかりと巻き込みます。
