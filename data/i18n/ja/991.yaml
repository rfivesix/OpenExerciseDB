name: スプリットスクワット (左前)
upstream:
  license: CC-BY-SA-4.0
  source_id: '1643'
description: |-
  開始姿勢:
  背筋を伸ばして直立し、左足を大きく一歩前へ踏み出して前後に足を開きます。

  動作手順:
  1. 両足の位置を固定したまま、両膝が直角（90度）になるまで腰を垂直に沈めます。
  2. 後ろの右膝が床に軽く触れる直前まで下ろします。
  3. 前の左足の踵で床を押して立ち上がります。

  ポイント:
  足を前後にスプリットした状態で上下運動を行い、左脚の大腿四頭筋と大臀筋を集中的に強化します。
