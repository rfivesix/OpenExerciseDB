name: シーテッド・ケーブルロー (ナローグリップ)
description: |-
  開始姿勢: ケーブルローイングマシンに座り、フットプレートに足を乗せて膝を軽く曲げます。Vバーなどの狭いハンドルを握り、背筋を真っ直ぐ伸ばします。動作手順: 肘を後ろに引きながら、ハンドルをおへそに向かって引き寄せます。肩甲骨を寄せて広背筋と菱形筋を収縮させ、ゆっくりと元の位置に戻します。ポイント: 背中を丸めず、腕の力ではなく背中の筋肉で引くようにコントロールします。
