description: |-
  開始姿勢：ベンチに座るか立ち、EZバーを頭上に腕を伸ばして保持します。
  動作手順：肘を頭の横に固定したままバーを後頭部へゆっくり下ろし、上腕三頭筋長頭を使って押し上げます。
  ポイント：肘が左右に広がらないように注意し、二の腕の後ろ側がしっかり伸びるのを感じます。
