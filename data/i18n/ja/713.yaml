description: |-
  【開始姿勢】壁から一歩離れて立ち、肩幅よりやや広めの位置で両手を壁につきます。【動作手順】身体をまっすぐに保ちながら肘を曲げて胸を壁に近づけ、手のひらで壁を押して元の位置に戻ります。【ポイント】大胸筋を意識し、初心者でも無理なく自重トレーニングを行えます。
