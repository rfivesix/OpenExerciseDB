description: |-
  開始姿勢:
  ロープーリーケーブルにロープアタッチメントをセットします。マシンに背を向けて跨ぐように立ち、股の間から両手でロープを握ります。数歩前へ出ます。

  動作手順:
  1. 膝を軽く緩めたまま、股関節を後方へ引き込んで上体を前傾させます（ヒンジ動作）。
  2. ハムストリングスとお尻にストレッチを感じたら、大臀筋を力強く収縮させて腰を前方に押し出し、直立します。
  3. トップで大臀筋を強く絞り込みます。

  ポイント:
  腰椎への圧迫ストレスを最小限に抑えながら、大臀筋とハムストリングスに強烈な水平方向の負荷をかけられます。
