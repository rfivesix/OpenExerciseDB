name: ダンベル・ハンマーカール
description: |-
  開始姿勢:
  足を肩幅に開いて背筋を伸ばして立ち、両手にダンベルを持ちます。手のひらを内側に向けるニュートラルグリップ（ハンマーグリップ）で構えます。

  動作手順:
  1. 肘の位置を体側にしっかり固定したまま、前腕を曲げてダンベルを肩に向けて巻き上げます。
  2. トップポジションで腕橈骨筋と上腕筋を強く収縮させ、1秒間キープします。
  3. 反動を使わずにコントロールしながら、ゆっくりとダンベルを元の位置まで下ろします。

  ポイント:
  手首をまっすぐに保ち、体幹の反動を使わずに腕の力だけで動作を行います。
