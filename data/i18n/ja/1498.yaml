description: |-
  開始姿勢：フラットベンチに仰向けになり、両手にダンベルを持って胸の上で構えます。
  動作手順：肘を体側にぴったりと引き寄せ（エルボータック）、上腕三頭筋を主動筋として真上に押し上げます。
  ポイント：肘を外側に開かないように意識し、三頭筋と大胸筋内側の緊張を保ちます。
