description: |-
  【開始姿勢】上体を前に倒して片手を椅子につき、反対側の手に軽いダンベルを持って腕を垂らします。【動作手順】身体を軽く揺らしながら、腕を振り子のように円を描いて優しく揺らします。【ポイント】三角筋と肩関節をリラックスさせ、血流を促すリハビリ向け種目です。
