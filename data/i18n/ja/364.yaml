description: |-
  開始姿勢:
  レッグカールマシンに位置につき、足首の後ろにパッドが当たるように調整します。

  動作手順:
  1. ハムストリングスを力強く収縮させ、踵を臀部に向かって巻き込むようにパッドを引き寄せます。
  2. 最大収縮位置で1秒間静止し、太もも裏の緊張を高めます。
  3. 重力に抵抗しながら、コントロールを保ってゆっくりと脚を伸ばします。

  ポイント:
  膝関節の屈曲に特化したアイソレーション種目で、ハムストリングスを集中的に強化します。
