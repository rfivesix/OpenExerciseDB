description: |-
  開始姿勢：背もたれ付きのベンチに座り、両手でダンベルの内側を支えて頭上に保持します。
  動作手順：肘を頭の横に固定したままゆっくり肘を曲げて後頭部へ下ろし、上腕三頭筋で頭上へ押し上げます。
  ポイント：肘が開かないように注意し、腰が反らないよう体幹に力を入れます。
