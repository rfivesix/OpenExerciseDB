  source_id: '1574'
description: |-
  開始姿勢:
  直立姿勢から足を肩幅より大幅に広く左右に開き、つま先をやや外側に向けます。

  動作手順:
  1. 右脚を真っ直ぐ伸ばしたまま、左側の股関節と膝を曲げて腰を左後方へ深く下ろします。
  2. 左の太ももが床と平行近くになるまで沈み込み、右の内転筋がストレッチされるのを感じます。
  3. 左足の踵で床を強く押して元のワイドスタンス姿勢へ戻ります。

  ポイント:
  左の大腿四頭筋と大臀筋を強化しつつ、右脚の内転筋群の柔軟性を向上させます。
