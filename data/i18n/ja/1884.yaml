  license_author: teus_ergaster
  source_id: '3028'
description: |-
  開始姿勢:
  床に座り、前脚を外旋（あぐらのように90度）、後ろ脚を内旋（膝を90度曲げて真横から後ろ）に配置する「シンボックス」の姿勢をとります。

  動作手順:
  1. 後ろ脚側の骨盤を床に向かって押し下げるように意識し、股関節の内旋可動性を高めます。
  2. 上体を軽く回旋または前傾させ、股関節深部にストレッチを感じる位置で20〜30秒保持します。
  3. 脚を左右入れ替えて反対側も行います。

  ポイント:
  不足しがちな股関節の内旋可動域を改善し、スクワット時の骨盤のブレや腰痛を防ぎます。
