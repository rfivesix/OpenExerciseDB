description: |-
  【開始姿勢】ケーブルマシンの間に立ち、両手でハンドルを握って一歩前へ踏み出します。【動作手順】背筋を伸ばし、肘を軽く曲げたまま両手を胸の前で合わせるように弧を描いて引き寄せます。【ポイント】大胸筋の収縮を感じ、ゆっくり腕を開いて胸をストレッチさせます。
