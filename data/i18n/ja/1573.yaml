description: |-
  開始姿勢：マットに膝をつき、アブローラーのハンドルを両手でしっかりと握ります。
  動作手順：体幹を固めてローラーを前方へゆっくりと転がし、腹直筋を使って元の位置へ引き戻します。
  ポイント：腰を反らさず背中をわずかに丸め、腹圧をしっかりとかけた状態で動作します。
