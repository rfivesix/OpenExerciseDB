description: |-
  開始姿勢:
  仰向けになり、両膝を曲げて足を腰幅で床に置きます。腕はリラックスさせて体側に伸ばします。

  動作手順:
  1. 踵で床を力強く押し、股関節を天井に向けて持ち上げます。
  2. 膝から肩までが一直線になる高さまで押し上げ、トップで大臀筋を強く収縮させて1秒静止します。
  3. コントロールしながらゆっくりと骨盤を床近くまで下ろします。

  ポイント:
  腰椎を反らせずに大臀筋の力で骨盤を持ち上げる意識が大切です。
