description: '開始姿勢:

  仰向けになり、両膝を曲げて足を腰幅で床に置きます。腕は体側に伸ばして床につけます。


  動作手順:

  1. 踵で床を押し、膝から肩までが一直線になる高さまで骨盤を持ち上げます。

  2. 骨盤を水平に高く保ったまま、片脚を膝の高さで前方にまっすぐ伸ばします。

  3. 足を床に戻し、反対側の脚も同様に前方に伸ばして交互に行います。


  ポイント:

  脚を伸ばした際に骨盤が落ちたり傾いたりしないよう、大臀筋と体幹を強く引き締めて姿勢を安定させます。'
