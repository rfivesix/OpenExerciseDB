description: |-
  開始姿勢：マシンのシートに座り、胸パッドに密着させてパッドを脚で挟みます。
  動作手順：骨盤を固定したまま、腹斜筋を使って上半身を左右どちらか一方へゆっくりと回旋させます。
  ポイント：反動を使わず一定のスピードで動かし、戻す際も重りの負荷に耐えながら戻します。
