description: |-
  開始姿勢:
  マットの上に仰向けに寝て、両膝を曲げて足を床につけます。

  動作手順:
  1. 片足の足首を反対側の膝の上に乗せて「4の字」の形を作ります。
  2. 下側の脚の太もも裏（またはすね）を両手で抱え込み、胸に向かってゆっくりと引き寄せます。
  3. 乗せた側のお尻（大臀筋・梨状筋）に深いストレッチを感じる位置で20〜30秒間保持します。
  4. 脚を入れ替えて反対側も行います。

  ポイント:
  腰への負担をかけずに臀筋の柔軟性を劇的に向上させる安全なストレッチです。
