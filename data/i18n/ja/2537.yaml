name: アイソメトリック・ケーブル・オーバーヘッドプレス
description: |-
  開始姿勢:
  ロープーリー（低い位置にセットしたケーブル）のハンドルを両手に持ち、肩の高さまで引き上げて構えます。足を肩幅に開き、体幹とお尻に力を入れて骨盤を安定させます。

  動作手順:
  1. ケーブルの負荷に逆らって頭上へ向けて押し上げ、額の高さ、または肘が完全に伸びきる直前の位置で静止させます。
  2. ケーブル特有の持続的なテンションに耐えながら、三角筋前部と上腕三頭筋を強く収縮させて指定時間キープします。
  3. 時間が経過したら、コントロールを保ちながらゆっくりと肩の高さまで下ろします。

  ポイント:
  腰が反らないように腹筋を固め、肋骨が開かないよう注意します。バーベルと異なり多方向からの負荷がかかるため、肩関節と体幹の高い安定性が求められます。
