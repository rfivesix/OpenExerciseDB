description: |-
  開始姿勢：ケーブルタワーの横に立ちまたは座り、胸の高さのハンドルを両手で持ちます。
  動作手順：腕を軽く伸ばしたまま体幹を回旋させ、腹斜筋を使って反対側へ大きくひねります。
  ポイント：骨盤をできるだけ固定し、腰ではなく胸椎と体幹から回旋させる意識を持ちます。
