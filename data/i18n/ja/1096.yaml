description: |-
  開始姿勢:
  壁や椅子の背に手を添えて直立し、体幹を引き締めます。

  動作手順:
  1. 軸足でしっかりと立ち、反対側の脚を伸ばしたまま真横へ向かってゆっくりと外転（持ち上げ）させます。
  2. 骨盤が傾かない範囲で高く持ち上げ、中臀筋の収縮を感じます。
  3. コントロールしながらゆっくりと脚を下ろし、規定回数後に脚を入れ替えます。

  ポイント:
  骨盤の横揺れを防ぐ中臀筋を強化し、歩行や走行時の片脚安定性を向上させます。
