description: |-
  開始姿勢：デクラインベンチに仰向けになり、両足をパッドに固定して両手を胸の前で組みます。
  動作手順：息を吐きながら背骨を丸めるように上体を起こし、腹直筋を強く収縮させてゆっくり戻します。
  ポイント：完全に体を起こしきらず、常に腹筋にテンションがかかった状態を維持します。
