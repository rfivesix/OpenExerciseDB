name: シングルレッグ・カーフレイズ (左脚)
description: |-
  開始姿勢:
  左足の母指球を段差の端に乗せて立ち、右足は浮かせます。手で壁を軽く支えてバランスをとります。

  動作手順:
  1. 左足の踵を深く下ろして、左のふくらはぎをしっかりとストレッチさせます。
  2. つま先で強く押し上げ、踵を最高点まで引き上げて収縮させます。
  3. 頂点で1秒キープした後、ゆっくりと踵を下ろします。

  ポイント:
  左脚の下腿三頭筋を集中的に強化し、足首の安定性を高めます。
