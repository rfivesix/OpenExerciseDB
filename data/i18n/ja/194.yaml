description: |-
  【開始姿勢】平行棒（ディップスバー）を握り、腕を伸ばして身体を支えます。【動作手順】上体を少し前傾させながら肘を曲げ、上腕が床と平行になるまで身体を下ろし、大胸筋と上腕三頭筋で押し上げます。【ポイント】肩甲骨を安定させ、肩関節に過度な負担がかからない深さで行います。
