description: |-
  開始姿勢：ケーブルの横に立ち、胸の高さに設定したハンドルを両手で握ります。
  動作手順：腕を伸ばしたまま体幹を回旋させ、腹斜筋を使って対角線前方へハンドルを引きます。
  ポイント：骨盤を安定させ、腕の力ではなく体幹のひねりでケーブルを動かします。
