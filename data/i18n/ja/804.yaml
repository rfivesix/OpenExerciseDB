description: |-
  開始姿勢：フィンガーボードのスローパーホールドに両手を乗せ、腕を自然に伸ばします。
  動作手順：足を浮かせてぶら下がり、手根屈筋群と前腕部の摩擦力を使って姿勢を一定時間維持します。
  ポイント：肩甲骨を軽く引き下げて肩関節を保護し、反動をつけずに静止を保ちます。
