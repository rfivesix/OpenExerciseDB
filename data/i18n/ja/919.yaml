description: |-
  開始姿勢: Tバーのハンドルを握り、膝を軽く曲げて股関節から上半身を約45度前傾させます。背筋を真っ直ぐ伸ばします。動作手順: 肘を後方に引いて肩甲骨を寄せ、ハンドルをお腹に向かって引き上げます。背中の筋肉の収縮を意識し、コントロールしながらゆっくりと下ろします。ポイント: 体幹を安定させ、腰を丸めないように注意します。
