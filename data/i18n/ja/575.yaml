name: スミスマシン・シュラッグ
description: |-
  開始姿勢: スミスマシンのバーの前に肩幅で立ち、膝を軽く曲げてバーを順手で握ります。背筋を真っ直ぐ保ちます。動作手順: 腕を伸ばしたまま、肩をすくめるようにしてバーを真上へ引き上げます。トップポジションで僧帽筋上部をしっかりと収縮させ、コントロールしながらゆっくりとバーを下ろします。ポイント: ガイドレールに沿って上下するため軌道が安定し、高重量でも安全に僧帽筋を刺激できます。
