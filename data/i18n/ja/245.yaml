  license_author: wger.de
  source_id: '85'
description: |-
  開始姿勢：フラットベンチに仰向けになり、両手にダンベルを持って腕を天井に向けて伸ばします。
  動作手順：上腕を垂直に固定したまま肘を曲げ、ダンベルを耳の横へ下ろしてから上腕三頭筋で伸ばします。
  ポイント：肘の位置を前後にブレさせず、コントロールされた軌道で動作します。
