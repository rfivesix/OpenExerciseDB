description: |-
  【開始姿勢】プーリーを腰の高さにセットしたケーブルマシンの横に立ち、ハンドルを握ります。【動作手順】肘をわずかに曲げたまま、腕を肩の高さまで真横へ引き上げます。【ポイント】三角筋中部 (側部)に最も強い負荷がかかるモーメントアームを活かして動作します。
