description: |-
  【開始姿勢】フラットベンチに仰向けになり、両足を床につけずまっすぐ前方へ浮かせて構えます。【動作手順】足の踏ん張りを使わずに、バーベルを胸まで下ろして押し上げます。【ポイント】大胸筋と体幹の筋力だけでバーをコントロールし、バランス力を高めます。
