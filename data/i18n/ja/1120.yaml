description: |-
  開始姿勢: ローイングマシンのシートに座り、胸をパッドで支えます。逆手 (アンダーハンドグリップ) で狭めのハンドルを握ります。動作手順: 肘を体側に沿わせながら後方へ力強く引き、ハンドルを引き寄せます。トップで広背筋と上腕二頭筋を収縮させ、ゆっくりと負荷を感じながら戻します。ポイント: 逆手で行うことで広背筋下部と上腕二頭筋への刺激を強調します。
