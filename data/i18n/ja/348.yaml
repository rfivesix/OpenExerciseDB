description: |-
  【開始姿勢】足を肩幅に開いて立ち、両手にダンベルを持ち体の横に構えます。【動作手順】肘をわずかに曲げたまま、ダンベルを肩の高さまで真横に引き上げます。【ポイント】三角筋中部 (側部)を意識し、僧帽筋を使わないよう肩をすくめずに行います。
