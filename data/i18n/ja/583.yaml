description: |-
  【開始姿勢】腕立て伏せの姿勢をとり、手幅を広めに構えます。【動作手順】右手に体重を乗せながら胸を右手の真上へ下ろして押し上げ、中央を経由して左手側へ移動して同様に行います。【ポイント】大胸筋への負荷を片側ずつ高め、体幹を真っ直ぐに維持します。
