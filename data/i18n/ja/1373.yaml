name: ボックスジャンプ
description: |-
  開始姿勢:
  頑丈なプライオボックスの前に立ち、足を肩幅程度に開きます。

  動作手順:
  1. 腕を後ろに振りながら素早くクォータースクワットの姿勢をとってパワーを溜めます。
  2. 腕を前上方に振り上げると同時に爆発的に跳び上がり、ボックスの上に着地します。
  3. つま先から静かに柔らかく着地し、膝を曲げて衝撃を吸収したら、立ち上がって身体を完全伸展させます。
  4. 一歩ずつ安全に降りて開始位置に戻ります。

  ポイント:
  下半身の爆発的瞬発力（トリプルエクステンション）を養う代表的なプライオメトリック種目です。
