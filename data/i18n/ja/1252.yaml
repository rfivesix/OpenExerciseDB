  license_author: clafal
  source_id: '2211'
description: |-
  開始姿勢: 懸垂バーを握り、身体を床と平行にしたフロントレバー (またはタックフロントレバー) の姿勢をとります。動作手順: 水平姿勢を維持したまま、肘を曲げて胸をバーに近づけるように身体を引き上げます。トップで背中を強く収縮させた後、コントロールしながら腕を伸ばして水平姿勢に戻ります。ポイント: 広背筋と上背部に絶大な負荷をかける最高難度の水平引込運動です。
