  license_author: BFad07
  source_id: '804'
description: |-
  開始姿勢:
  マシンの背もたれを調節して深く腰掛け、膝の回転軸をマシンのピボットに合わせます。パッドを足首の前側に当て、両サイドのグリップを握ります。

  動作手順:
  1. 大腿四頭筋の力でパッドを上方へ押し上げ、膝がほぼ真っ直ぐになるまで伸ばします。
  2. トップで1秒間ホールドし、大腿四頭筋を強く絞り込みます。
  3. 負荷に逆らいながら、ゆっくりと時間をかけて開始姿勢まで下ろします。

  ポイント:
  大腿四頭筋をピンポイントでアイソレーションできる基本種目です。反動を使わずコントロールを重視します。
