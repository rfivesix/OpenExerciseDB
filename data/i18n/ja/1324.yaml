name: 自重ランジ
description: |-
  開始姿勢:
  足を腰幅に開いて直立し、手は腰に当てるか胸の前で組みます。

  動作手順:
  1. 片足を大きく一歩前へ踏み出し、両膝が直角になるまで腰を垂直に沈めます。
  2. 前足の膝がつま先より前に出ないように注意し、後ろ膝は床スレスレまで下げます。
  3. 前足の踵で地面を押し返して立ち上がり、元の姿勢に戻ります。

  ポイント:
  大腿四頭筋と大臀筋を強化し、骨盤の安定性とバランス感覚を養います。
