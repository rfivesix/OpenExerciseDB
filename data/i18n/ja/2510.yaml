description: |-
  開始姿勢：マットに仰向けになり、両腕を頭上に伸ばし、両脚を揃えて伸ばします。
  動作手順：腰を床に強く押し付けたまま、肩甲骨と両足を床から数センチ浮かせて舟形の姿勢を保ちます。
  ポイント：腹直筋と腹横筋を最大限に収縮させ、腰と床の間に隙間ができないように維持します。
