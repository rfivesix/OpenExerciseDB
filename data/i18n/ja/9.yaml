description: |-
  開始姿勢:
  足を肩幅よりやや広めに開き、ケトルベルを両足の少し前に置きます。背筋を伸ばし、股関節を折り曲げて（ヒンジ動作）ケトルベルを両手で握ります。

  動作手順:
  1. 膝を軽く曲げたままケトルベルを両脚の間へ後方に振り込みます。
  2. 大臀筋とハムストリングスを力強く収縮させ、股関節を爆発的に伸展してケトルベルを胸の高さまで振り上げます。
  3. 重力に従ってケトルベルが下りてくる動きを股関節で受け止め、リズミカルに動作を繰り返します。

  ポイント:
  腕の力で持ち上げるのではなく、臀部と股関節の推進力を使ってスイングします。
