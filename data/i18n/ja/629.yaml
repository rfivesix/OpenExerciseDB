description: |-
  開始姿勢: ハイプーリーにロープを取り付け、両端を上から握ります。足は腰幅に開き、膝を軽く曲げて上体を少し前傾させます。動作手順: 腕を伸ばした状態を保ちながら、弧を描くようにロープを太ももの横に向かって引き下げます。ボトムでロープの両端を広げて広背筋を最大限に収縮させ、コントロールしながら戻します。ポイント: ロープを使うことで可動域が広がり、背中をより強く収縮できます。
