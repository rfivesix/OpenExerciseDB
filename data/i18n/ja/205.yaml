description: |-
  開始姿勢:
  両手にダンベルを持ち、体側に自然に下ろして直立します。足を腰幅に開き、胸を張って体幹を引き締めます。

  動作手順:
  1. 片足を大きく一歩前へ踏み出し、前後の膝が直角（90度）になるまで重心を垂直に沈めます。
  2. 後ろ足の膝が床に触れる直前まで下ろしたら、前足の踵で地面を力強く押し返して直立姿勢に戻ります。
  3. 左右交互に足を入れ替えて同様の動作を繰り返します。

  ポイント:
  前足の膝がつま先より前に突出しないよう注意し、上体を常に垂直にキープします。
