description: |-
  開始姿勢:
  四つん這いになり、両膝を可能な限り左右に大きく開きます。足首を直角に曲げ、足の内側を床につけます。

  動作手順:
  1. 前腕を床について上半身を安定させます。
  2. 息を吐きながら、お尻を後方に向かってゆっくりと押し込みます。
  3. 股関節内転筋群と骨盤周辺に強いストレッチを感じる位置で20〜30秒間静止します。

  ポイント:
  無理のない範囲でゆっくりとお尻を前後に揺らすことで、股関節の深層可動性を劇的に高めます。
