description: |-
  【開始姿勢】パワーラックのピンを顎の高さにセットし、バーベルをその上に置きます。【動作手順】バーの下に入り込み、静止した状態から頭上へ爆発的にバーベルを押し上げます。【ポイント】三角筋前部と上腕三頭筋の立ち上がり筋力を鍛え、反動を使わずに行います。
