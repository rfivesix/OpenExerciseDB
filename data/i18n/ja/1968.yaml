description: |-
  【開始姿勢】片手にダンベルを持ち、肩の高さに構えて直立または着席します。【動作手順】体幹を安定させ、ダンベルを頭上へまっすぐ垂直に押し上げます。【ポイント】三角筋前部を鍛えつつ、左右の筋力差を是正し体幹の回旋を抑えます。
