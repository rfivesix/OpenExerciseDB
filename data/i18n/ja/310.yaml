description: |-
  開始姿勢: インクラインベンチにうつ伏せになり、両手にニュートラルグリップでダンベルを持ちます。腕を真下に伸ばした状態から開始します。動作手順: 肩甲骨を寄せながら肘を曲げ、ダンベルを体側に向かって引き上げます。トップポジションで一時静止して広背筋と菱形筋を収縮させ、ゆっくりと元の位置に戻します。ポイント: ベンチに胸を密着させ、勢いを使わずに引きます。
