description: |-
  開始姿勢：ハイプーリーにストレートバーを取り付け、順手で握って軽く上体を前傾させます。
  動作手順：肘を体側に固定したままバーを下へ押し下げ、上腕三頭筋を完全に収縮させます。
  ポイント：肩の力を使わず肘を支点にして動作し、バーを胸の高さまでゆっくり戻します。
