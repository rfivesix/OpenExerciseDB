  license_author: sevae
  source_id: '342'
description: |-
  開始姿勢:
  足を肩幅に開いて直立し、プレート（重り）を両手で持ち、胸の正面で腕を真っ直ぐ前に伸ばして保持します。

  動作手順:
  1. 腕を前に伸ばしたまま、股関節を後ろに引きながら膝を曲げて深くスクワットします。
  2. 太ももが床と平行になる深さまで下ろし、前方にあるプレートをカウンターバランスにして胸を張った姿勢をキープします。
  3. 踵で床を力強く押して元の直立姿勢に戻ります。

  ポイント:
  プレートを前方に維持することで上半身の前傾を防ぎ、大腿四頭筋と体幹を強化します。
