description: |-
  開始姿勢：プルアップバーを順手でしっかりと握り、足を揃えてぶら下がります。
  動作手順：膝をまっすぐに伸ばしたまま、腹直筋を使って両脚を床と水平以上の高さまで持ち上げます。
  ポイント：反動を使わず体幹の力でコントロールし、下ろす際も重力に耐えてゆっくり下ろします。
