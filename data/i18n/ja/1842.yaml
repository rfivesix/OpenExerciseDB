description: |-
  開始姿勢:
  両膝のすぐ上にミニループバンドを巻き、マット上に横向きに寝ます。膝を約90度、股関節を約45度に曲げて両脚を揃えます。

  動作手順:
  1. 踵同士を密着させたまま、バンドの張力に逆らって上側の膝をゆっくりと天井に向けて開きます。
  2. 骨盤が後ろへ倒れないように体幹を固め、お尻の外側（中臀筋）の収縮を感じます。
  3. コントロールしながらゆっくりと膝を閉じます。

  ポイント:
  バンドの抵抗が加わることで中臀筋と股関節外旋筋群をより強力に活性化させます。
