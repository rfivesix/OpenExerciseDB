name: EZバー・スカルクラッシャー
description: |-
  開始姿勢：フラットベンチに仰向けになり、EZバーの内側の曲がりを狭めの手幅で握って頭上に構えます。
  動作手順：肘の位置を固定し、バーをおでこまたは頭頂部に向かって下ろし、上腕三頭筋で押し戻します。
  ポイント：脇を締めて肘を開かないようにし、反動を使わずに三頭筋を収縮させます。
