  license_author: Moffi
  source_id: '2453'
description: |-
  開始姿勢：約60度のインクラインベンチに胸をつけてうつ伏せになり、両手にダンベルを持ちます。
  動作手順：肘を体側に固定したまま後方へ前腕部を伸ばし、上腕三頭筋長頭を強く収縮させます。
  ポイント：ベンチで上体が固定されるため反動を完全に防ぎ、トップでしっかり静止します。
