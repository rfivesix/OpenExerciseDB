description: |-
  開始姿勢：床にうつ伏せになり、両手を胸の下で狭い手幅にセットしてプランクを作ります。
  動作手順：脇を固く締めて肘を曲げながら胸を床に近づけ、上腕三頭筋を使って力強く押し上げます。
  ポイント：肘を外側に開かず体側に沿わせ、体幹を一直線に保ったまま動作します。
