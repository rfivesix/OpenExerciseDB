description: |-
  【開始姿勢】ケーブルのプーリーを肘の高さに合わせ、マシンの横に立ちます。【動作手順】肘を90度に曲げて脇腹に密着させ、前腕をお腹に向けて内側へ引き寄せます。【ポイント】回旋筋腱板 (ローテーターカフ)の内旋筋を鍛え、肘が浮かないよう注意します。
