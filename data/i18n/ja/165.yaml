description: |-
  開始姿勢：バランスボールの上に足を乗せて腕立て伏せの姿勢をとります。
  動作手順：腹直筋と腸腰筋を意識しながら、ボールを手前に転がすように両膝を胸に向かって引き込みます。
  ポイント：腰を反らさず、背中を丸めながら腹筋をしっかりと収縮させます。
