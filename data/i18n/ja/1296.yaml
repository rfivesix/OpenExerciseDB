name: ローケーブル・クロスオーバー
description: |-
  【開始姿勢】低い位置に設定した左右のケーブルを持ち、足を前後に開いて安定させます。【動作手順】肘を軽く曲げたまま、大胸筋上部を意識して両手を斜め上前方へ引き寄せます。【ポイント】大胸筋上部 (鎖骨部)の収縮を頂点で意識し、ゆっくりと戻します。
