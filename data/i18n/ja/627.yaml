description: |-
  開始姿勢:
  バーベルを肩幅の順手で持ち、足を腰幅に開いて直立します。背筋を伸ばして肩甲骨を引き寄せます。

  動作手順:
  1. 膝をほぼ真っ直ぐ（わずかな緩みを保つ）に保ったまま、股関節を後ろに引いて上体を前に倒します。
  2. バーベルを脚に沿わせながら下ろし、ハムストリングスが強くストレッチされる深さまで下ろします。
  3. 大臀筋とハムストリングスを強く収縮させ、股関節を前方へ押し出して直立姿勢に戻ります。

  ポイント:
  背中が丸まらないように体幹を固め、膝の曲げ伸ばしを行わずに股関節のヒンジ動作だけで動作します。
