description: |-
  開始姿勢:
  運動に適したシューズを履き、リラックスした直立姿勢をとります。

  動作手順:
  1. 適度で無理のないペースを維持しながら、屋外やトラック、トレッドミルで走ります。
  2. 規則的な呼吸を心がけ、肘を軽く曲げてリズミカルに腕を振ります。

  ポイント:
  心肺持久力の向上や脂肪燃焼に最適な基本の有酸素運動です。身体の力みを抜いて行います。
