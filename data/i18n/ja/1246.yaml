description: |-
  開始姿勢：TRXのハンドルを順手で握り、膝立ちまたは立った状態で腕を胸の前に伸ばします。
  動作手順：体幹を固めたまま両腕を頭上前方へ伸ばして体を倒し、腹直筋を使って元の位置へ戻します。
  ポイント：腰が過度に反らないよう腹圧を強く維持し、コントロールできる範囲で前進します。
