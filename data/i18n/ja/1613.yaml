name: チューブ・グルートキックバック
description: |-
  開始姿勢:
  両足首にミニループバンドを装着し、四つん這いになるか、壁に手をついて立ちます。

  動作手順:
  1. バンドの張力に逆らいながら、片脚を後方へ真っ直ぐ力強く蹴り出します。
  2. 大臀筋が強く収縮する高さまで引き上げ、トップで一瞬静止します。
  3. コントロールしながらゆっくりと足を元の位置に戻します。

  ポイント:
  腰を反らさず、お尻の筋肉の収縮だけで脚を後ろへ押し出します。
