  license_author: Franpol
  source_id: '2115'
description: |-
  開始姿勢: ケーブルマシンの前にインクラインベンチを設置し、マシンに顔を向けてうつ伏せに横たわります。動作手順: ハイプーリーからハンドルを握り、肘を体側に引き下げるようにしてプルダウン動作を行います。広背筋がしっかりと収縮したら、コントロールしながらゆっくり腕を伸ばして戻します。ポイント: ベンチに体を預けることで代償動作や反動を防ぎ、広背筋をダイレクトに刺激できます。
