description: |-
  開始姿勢：ベンチに座り、前腕部を太ももに乗せて手首を膝の先に出し、バーベルを逆手で握ります。
  動作手順：手首を反らせてバーを下ろしてから、手根屈筋群を使って手首を巻き上げます。
  ポイント：前腕部をしっかりと固定し、手首以外の関節を動かさないようにコントロールします。
