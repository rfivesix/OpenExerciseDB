name: 縄跳び (ベーシックジャンプ)
upstream:
  license: CC-BY-SA-4.0
  source_id: '1671'
description: |-
  開始姿勢:
  足を揃え、膝を軽く曲げてリラックスした状態で直立します。両手で縄跳びのグリップを保持します。

  動作手順:
  1. 手首を回して縄を回し、縄が足元を通過する瞬間に両足で軽くジャンプします。
  2. 膝を柔らかく使って母指球で静かに着地し、すぐに次のジャンプへ繋げます。

  ポイント:
  高く跳びすぎず、一定のリズムと最小限の接地時間で軽快に跳び続けます。
