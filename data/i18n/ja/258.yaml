  license_author: wger.de
  source_id: '1059'
description: |-
  開始姿勢: ケーブルタワーのハイプーリーの前に座るか立ち、肩幅より広いワイドグリップでバーを握ります。胸を張って背筋を伸ばします。動作手順: 肘を下に向かって引き下げながら、バーを胸の上部まで引き寄せます。トップで広背筋を強く収縮させた後、コントロールしながらゆっくり元の位置へ戻します。ポイント: 腕の力ではなく、肩甲骨の下制と内転を意識して引きます。
