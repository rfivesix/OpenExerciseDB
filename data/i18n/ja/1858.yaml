  license_author: Davidgj32
  source_id: '2997'
description: |-
  開始姿勢:
  床にうつ伏せになり、前腕をついて太ももの前側（大腿四頭筋）の下にフォームローラーを置きます。

  動作手順:
  1. 骨盤の前面から膝の上部まで、体重をかけて前後に滑らかにローリングします。
  2. 脚を軽く内外に回旋させ、外側広筋や大腿直筋など大腿四頭筋全体に圧を行き渡らせます。
  3. トリガーポイントがあれば静止して圧迫します。

  ポイント:
  スクワット等の高強度トレーニング前後の筋膜リリースとして、膝関節の動きを滑らかにします。
