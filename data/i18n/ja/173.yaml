description: |-
  開始姿勢：ケーブルタワーの前に膝立ちになり、ロープアタッチメントを頭の両脇に保持します。
  動作手順：背中を丸めながら肘を太ももに近づけるように体を折り曲げ、腹直筋を収縮させます。
  ポイント：股関節から動かさず、背骨をしっかりと屈曲させて腹筋に負荷を集中させます。
