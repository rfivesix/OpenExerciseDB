description: |-
  開始姿勢：マシンのシートに深く座り、肘をパッドに合わせてグリップを握ります。
  動作手順：上腕三頭筋の力でグリップを前方または下方へ押し込み、肘が伸びるまで動作します。
  ポイント：背中がシートから離れないように固定し、重りが触れ合う直前までゆっくり戻します。
