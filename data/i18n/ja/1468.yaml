description: |-
  開始姿勢：床に仰向けになり、EZバーを狭い手幅で握って腕を天井へ伸ばします。
  動作手順：肘の位置を固定してバーを頭上の床まで下ろし、一瞬床につけてから上腕三頭筋で押し上げます。
  ポイント：床で一旦脱力と切り返しを行うことで反動を排除し、純粋な三頭筋の筋力を発揮します。
