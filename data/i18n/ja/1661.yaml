description: |-
  開始姿勢：ケーブルタワーの前に立ち、片手でハイプーリーのハンドルを握ります。
  動作手順：肘を体側に固定したまま下方向へ向かって腕を押し下げ、上腕三頭筋を強く収縮させます。
  ポイント：肩の位置を動かさずに肘関節のみを伸展させ、トップポジションまでゆっくり戻します。
