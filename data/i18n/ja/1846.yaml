description: |-
  開始姿勢:
  足を肩幅の約2倍に広く開き、つま先を正面またはやや外側に向けて立ちます。胸の前で腕を構えます。

  動作手順:
  1. 上体を垂直に立てたまま、股関節と膝を曲げて太ももが床と平行になる深さまで腰を落とします。
  2. 膝が内側に入らないよう外側に開き、骨盤を安定させます。
  3. この低いワイドスクワットの姿勢を崩さず、大腿四頭筋、内転筋群、大臀筋に力を込めて指定の時間キープします。

  ポイント:
  古武術の基本姿勢（馬歩）であり、下半身全体の驚異的な静的筋力と股関節の柔軟性を養います。
