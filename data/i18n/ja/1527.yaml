description: |-
  開始姿勢:
  ペンデュラムスクワットマシンに入り、肩をパッドに当てて足をプレートの中央に肩幅で配置します。腹圧を高めます。

  動作手順:
  1. 円弧状の軌道に合わせて膝を曲げ、太ももがふくらはぎに触れる深さまで滑らかにしゃがみ込みます。
  2. 大腿四頭筋の伸張を感じたら、足裏全体で力強くプレートを押して立ち上がります。
  3. 膝をロックせず連続して動作を行います。

  ポイント:
  腰椎への負担を分散させつつ、大腿四頭筋（特に大腿直筋・外側広筋）に驚異的な刺激を与えます。
