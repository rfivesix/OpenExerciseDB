description: |-
  開始姿勢:
  足を前後に開いたスタンスをとり、手は腰に当てて直立します。

  動作手順:
  1. 動作の途中で立ち止まらず、前後の膝が90度になる深さまでリズミカルに腰を沈めます。
  2. 前足の踵で床を押して押し戻し、滑らかに連続して上下動を繰り返します。
  3. 規定回数後に足を入れ替えます。

  ポイント:
  大腿四頭筋と大臀筋に休みなく持続的な筋緊張を与えられます。
