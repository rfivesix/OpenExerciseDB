description: |-
  開始姿勢:
  スクワットラックにセットしたバーベルの下に入り、僧帽筋上部で担ぎます。バーを握り、ラックから外して数歩後退します。足は肩幅程度に開き、つま先をやや外側に向けます。

  動作手順:
  1. 胸を張り、腹圧を高めて体幹を固めたまま、股関節と膝を曲げて腰を深く下ろします。
  2. 太ももが床と平行になる深さ（パラレル）までしゃがみます。
  3. 踵と足裏全体で力強く床を押し、大腿四頭筋と大臀筋を収縮させて立ち上がります。

  ポイント:
  背中が丸まらないように体幹を維持し、膝がつま先と同じ方向へ動くように意識します。
