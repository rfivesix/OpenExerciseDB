description: |-
  【開始姿勢】ケーブルマシンの横に斜めに立ち、反対側の手でハンドルを握ります。【動作手順】上体を安定させたまま、腕を身体の正中線を越えるように前方へ斜めに押し出します。【ポイント】大胸筋の内側と短縮域を最大限に収縮させ、絞り込みます。
