description: |-
  【開始姿勢】マット上で腕立て伏せやランジの体勢を整えます。【動作手順】プッシュアップ、ジャンプ、ダッシュなどを組み合わせたサーキット動作を素早く連続して行います。【ポイント】大胸筋や三角筋をはじめ全身を使い、心肺機能と筋持久力を同時に高めます。
