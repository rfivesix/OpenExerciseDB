description: |-
  開始姿勢:
  バーベルの前に足幅を腰幅程度に開いて立ちます。脛をバーに近づけ、股関節から折り曲げて（ヒンジ動作）肩幅のグリップでバーを握ります。胸を張り、背筋を自然な直線に保ちます。

  動作手順:
  1. 腹圧を高めて体幹を固め、踵で床を押しながら膝と股関節を連動させてバーベルを垂直に引き上げます。
  2. バーが膝を通過したら股関節を前に突き出し、直立姿勢まで引き切って大臀筋を収縮させます。
  3. 股関節を後ろに引きながらコントロールしてバーベルを床へ下ろします。

  ポイント:
  背中が丸まらないように注意し、バーを常に身体の近くに沿わせて移動させます。
