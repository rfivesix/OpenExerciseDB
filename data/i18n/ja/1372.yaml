description: |-
  開始姿勢：アシストディップスマシンの膝パッドに乗り、左右のバーをしっかりと握ります。
  動作手順：体をまっすぐに保ちながら肘が90度になるまで沈み、上腕三頭筋を使って押し上げます。
  ポイント：マシンのカウンターウェイトを活用して正しいフォームを保ち、肩への過度な負担を防ぎます。
