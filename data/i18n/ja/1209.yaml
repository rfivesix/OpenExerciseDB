description: |-
  【開始姿勢】腕立て伏せの姿勢から、片足を床から浮かせて3点で身体を支えます。【動作手順】体幹を強固に保ちながら胸を床へ下ろし、大胸筋で力強く押し上げます。【ポイント】大胸筋とともに体幹の回旋を抑える腹筋群を強く刺激します。
