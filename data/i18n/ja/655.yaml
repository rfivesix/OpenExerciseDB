description: |-
  開始姿勢：上体を前傾させて背筋を伸ばし、肘を90度に曲げて脇腹に固定します。
  動作手順：上腕を動かさずに肘から先を後方へ伸ばし、上腕三頭筋を強く収縮させてからゆっくり戻します。
  ポイント：肘の高さが下がらないように維持し、トップポジションで1秒静止します。
