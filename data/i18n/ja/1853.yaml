description: |-
  開始姿勢：床に座って脚を揃えて伸ばし、両手を腰の横について構えます。
  動作手順：手のひらで床を押してお尻を持ち上げ、踵を床につけて体重を一部サポートしながら姿勢を保ちます。
  ポイント：腹直筋と上腕三頭筋に力を入れ、筋力向上に合わせて徐々に足を浮かせる練習にします。
