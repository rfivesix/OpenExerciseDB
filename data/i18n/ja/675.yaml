description: |-
  【開始姿勢】仰向けになり、片手でケトルベルを天井へまっすぐ押し上げた状態を作ります。【動作手順】ケトルベルから目を離さず腕を垂直に保ったまま、肘・手・膝をつき段階的に立ち上がり、逆の手順で戻ります。【ポイント】三角筋と体幹の安定性を保ち、各動作を正確かつ慎重に行います。
