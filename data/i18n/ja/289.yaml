description: |-
  開始姿勢: バーベルを持ち、膝を軽く曲げてバーが膝下に来る前傾姿勢をとります。背筋は真っ直ぐ保ちます。動作手順: 股関節と膝を爆発的に伸展させ、その勢いを利用してバーベルを真上に引き上げます。肘を高く外側に持ち上げ、バーを胸から肩の高さまで引き上げます。コントロールしながら下ろします。ポイント: 腕だけで引かず、下半身と股関節の瞬発力を連動させます。
