name: Pistol squat (sağ bacak)
description: |-
  Başlangıç pozisyonu:
  Sağ bacağınız üzerinde durun, sol bacağınızı öne doğru düz bir şekilde havada tutun. Dengenizi sağlamak için kollarınızı öne uzatın.

  Uygulama:
  1. Sağ dizinizi yavaşça bükerek tek bacak üzerinde derin çömelme (squat) pozisyonuna inin.
  2. Sırtınızı düz tutun ve sol bacağınızın yere değmesine izin vermeyin.
  3. Hareket açıklığınızın elverdiği en derin noktaya kontrollü şekilde inin.
  4. Sağ topuğunuzdan güç alarak kendinizi tekrar başlangıçtaki dik duruşa kaldırın.
