name: Tek bacak baldır kaldırma (sağ)
description: |-
  Başlangıç pozisyonu:
  Sağ ayağınızın parmak ucu/ön kısmı yerde veya bir basamağın kenarında olacak şekilde tek ayak üzerinde durun. Sol ayağınızı havada tutun ve denge için duvara hafifçe tutunun.

  Uygulama:
  1. Baldır kasınızı esnetmek için sağ topuğunuzu kontrollü şekilde aşağı indirin.
  2. Sağ ayak tabanınızın önünden güç alarak parmak ucuna doğru mümkün olduğunca yükseğe yükselin.
  3. En üst noktada baldırınızı 1-2 saniye sıkın.
  4. Yavaş ve kontrollü bir şekilde başlangıç noktasına geri inin.
