name: Yan plank (sağ)
description: |-
  Başlangıç pozisyonu:
  Sağ tarafınıza uzanın, bacaklarınızı düz tutun. Sağ dirseğinizi doğrudan sağ omzunuzun altına yerleştirin ve ön kolunuzu yere koyun.

  Uygulama:
  1. Karın ve oblik kaslarınızı sıkarak kalçanızı yerden kaldırın; başınızdan topuklarınıza kadar vücudunuz düz bir çizgi oluşturmalıdır.
  2. Kalçanızın aşağı düşmesine izin vermeden pozisyonu koruyun.
  3. Belirlenen süre boyunca bu pozisyonda sabit kalın ve düzenli nefes alın.
