# Expected muscle groups per movement pattern.
#
# Derivation methodology:
# 1. Statistical baseline: derived from the 819 non-golden exercises at a
#    relative minimum frequency of >= 5% and a minimum count of >= 2 exercises.
# 2. Golden set validation: tested against the 50 hand-reviewed golden set exercises.
#    6 exercises initially flagged (12.0% false alarm rate of raw statistics),
#    all 6 being fully correct expert annotations.
# 3. Targeted golden set additions: legitimate muscle groups for these 6 cases were
#    explicitly and justifiably added per pattern (not mixed into statistical
#    frequencies, preventing nonsense like quads on bench press).
#
# Note: `other` is exempt from Invariant 20 as an unclassified catch-all.

version: 1

expectations:
  horizontal_push:
    - chest
    - triceps
    - shoulders
    # Golden Set (1523 Sled Push): Horizontal full-body leg drive
    - quads
    - glutes

  vertical_push:
    - shoulders
    - triceps
    - chest
    - quads
    # Golden Set (1100 Wall-Balls, 1684 Dumbbell Thruster): Leg power transfer from squat
    - glutes

  horizontal_pull:
    - back
    - shoulders
    - abs
    - biceps

  vertical_pull:
    - back
    - biceps
    - forearms
    - shoulders
    # Golden Set (423 Muscle-Up): Dip transition above the bar
    - chest

  squat:
    - quads
    - glutes

  hinge:
    - hamstrings
    - glutes
    - adductors
    - quads
    - lower_back

  hip_extension:
    - glutes
    - hamstrings

  lunge:
    - glutes
    - quads

  carry:
    # Golden Set (1116 Farmer's Carry) & Catalog (1430 Plate Pinch, 1776 Suitcase Carry):
    # Forearm grip strength, trapezius shoulder girdle, and trunk stabilization
    - forearms
    - back
    - abs
    - lower_back

  rotation:
    - abs
    - shoulders
    - glutes
    - neck
    - back

  anti_rotation:
    - abs
    - glutes
    - lower_back

  anti_extension:
    - abs
    - back
    - triceps

  anti_lateral_flexion:
    - abs
    - lower_back
    - neck
    - back

  anti_flexion:
    - lower_back
    # Golden Set (500 Reverse Plank): Isometric hip extension against gravity
    - glutes

  elbow_flexion:
    - biceps
    - forearms

  elbow_extension:
    - triceps
    - biceps

  wrist_flexion:
    - forearms

  wrist_extension:
    - forearms

  knee_flexion:
    - hamstrings

  knee_extension:
    - quads

  hip_abduction:
    - glutes
    - adductors

  hip_adduction:
    - adductors

  shoulder_abduction:
    - shoulders
    - back

  shoulder_flexion:
    - shoulders

  scapular_elevation:
    - back

  spinal_extension:
    - lower_back
    - glutes
    - back

  spinal_flexion:
    - abs
    - lower_back

  plantar_flexion:
    - calves

  dorsiflexion:
    - calves

  gait:
    - quads
    - calves
    - glutes
    - abs
    - back
    - shoulders

  other: []
