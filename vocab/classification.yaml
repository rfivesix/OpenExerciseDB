  - { id: anti_lateral_flexion, names: { en: "Anti-lateral-flexion", de: "Anti-Lateralflexion", fr: "Anti-flexion latérale", it: "Anti-flessione laterale", ja: "アンチラテラルフレクション (抗側屈)" } }
  - { id: anti_flexion, names: { en: "Anti-flexion", de: "Anti-Flexion", fr: "Anti-flexion", it: "Anti-flessione", ja: "アンチフレクション (抗屈曲)" } }
