  - { id: vertical_push, names: { en: Vertical push, de: Vertikales Drücken, fr: Poussée verticale, it: Spinta verticale, ja: 垂直プッシュ } }
  - { id: horizontal_pull, names: { en: Horizontal pull, de: Horizontales Ziehen, fr: Tirage horizontal, it: Trazione orizzontale, ja: 水平プル } }
  - { id: vertical_pull, names: { en: Vertical pull, de: Vertikales Ziehen, fr: Tirage vertical, it: Trazione verticale, ja: 垂直プル } }
  - { id: squat, names: { en: Squat, de: Kniebeuge, fr: "Squat (flexion des genoux)", it: "Squat (accosciata)", ja: スクワット } }
  - { id: hinge, names: { en: Hinge, de: Hüftbeuge, fr: "Charnière de hanche (Hinge)", it: "Cerniera d’anca (Hinge)", ja: ヒップヒンジ } }
  - { id: lunge, names: { en: Lunge, de: Ausfallschritt, fr: Fente, it: Affondo, ja: ランジ } }
  - { id: carry, names: { en: Carry, de: Tragen, fr: "Transport / Port de charge", it: "Trasporto di carico (Carry)", ja: "キャリー (運搬)" } }
  - { id: rotation, names: { en: Rotation, de: Rotation, fr: Rotation, it: Rotazione, ja: "回旋 (ローテーション)" } }
  - { id: anti_rotation, names: { en: "Anti-rotation", de: "Anti-Rotation", fr: "Anti-rotation", it: "Anti-rotazione", ja: "アンチローテーション (抗回旋)" } }
