# force_vector wird ABGELEITET, nicht annotiert.
#
# Auswertung der ersten 50 annotierten Uebungen: 19 der 20 vorkommenden
# movement_pattern hatten genau einen force_vector. Der einzige mehrdeutige war
# `other` — der Eimer, der ohnehin "keine Aussage" heisst. force_vector ist also
# eine Funktion von movement_pattern und keine unabhaengige Information; sie zu
# annotieren heisst, dasselbe zweimal zu behaupten und irgendwann zu widersprechen.
#
# `null` heisst ausdruecklich "es gibt keine ehrliche Antwort" und ist kein
# Fehler. Ein Lauf ist weder Druecken noch Ziehen, und `push` dranzuschreiben,
# weil ein Modell konsistent geraten hat, waere Scheinpraezision.
#
# Zwei Zeilen weichen bewusst von dem ab, was das Modell geschrieben hat:
#   shoulder_abduction: das Modell sagte `pull`. Ein Seitheben ist eine
#     Drueck-Bewegung — der Arm geht vom Koerper weg. Hier steht `push`.
#   shoulder_flexion: Arm wird nach vorne/oben gehoben (Delta anterior) -> push.
#   scapular_elevation: Schulterguertel wird nach oben gezogen (Trapez) -> pull.
#
# `hinge: pull` und `hip_extension: pull` brechen die Beuge/Streck-Logik der
# reinen Isolationsmuster (Hueftstreckung waere anatomisch Druecken). Das ist Absicht:
# Kreuzheben, Glute Bridges und Hip Thrusts sind posteriore Kettenuebungen
# und gehoeren zur Zug-Systematik. Bitte nicht "korrigieren".
force_vector_by_pattern:
  horizontal_push: push
  vertical_push: push
  horizontal_pull: pull
  vertical_pull: pull
  squat: push
  hinge: pull
  hip_extension: pull
  lunge: push
  elbow_flexion: pull
  elbow_extension: push
  knee_flexion: pull
  knee_extension: push
  shoulder_abduction: push
  shoulder_flexion: push
  scapular_elevation: pull
  plantar_flexion: push
  dorsiflexion: pull
  wrist_flexion: pull
  wrist_extension: push

  anti_rotation: static
  anti_extension: static
  anti_lateral_flexion: static
  anti_flexion: static

  # Kein ehrlicher Wert:
  carry: null
  rotation: null
  hip_abduction: null
  hip_adduction: null
  spinal_extension: null
  spinal_flexion: null
  gait: null
  other: null

laterality:
  - { id: bilateral, names: { en: Bilateral, de: Beidseitig, fr: Bilatéral, it: Bilaterale, ja: "両側性 (バイラテラル)" } }
  - { id: unilateral, names: { en: Unilateral, de: Einseitig, fr: Unilatéral, it: Unilaterale, ja: "片側性 (ユニラテラル)" } }
  - { id: alternating, names: { en: Alternating, de: Alternierend, fr: Alterné, it: Alternato, ja: "交互 (オルタネーティング)" } }

# Bestimmt die Log-Maske in der App. Ersetzt `Exercise.isCardio`.
tracking_type:
  - id: weight_reps
    names: { en: "Weight & reps", de: "Gewicht & Wiederholungen", fr: "Poids & répétitions", it: "Peso & ripetizioni", ja: "重量 & 回数" }
  - id: bodyweight_reps
    names: { en: Reps only, de: Nur Wiederholungen, fr: Répétitions uniquement, it: Solo ripetizioni, ja: 回数のみ }
  - id: time
    names: { en: Duration, de: Dauer, fr: Durée, it: "Tempo / Durata", ja: "時間 (タイマー)" }
  - id: time_weight
    names: { en: "Duration & weight", de: "Dauer & Gewicht", fr: "Durée & poids", it: "Tempo & peso", ja: "時間 & 重量" }
  - id: distance_time
    names: { en: "Distance & duration", de: "Distanz & Dauer", fr: "Distance & durée", it: "Distanza & tempo", ja: "距離 & 時間" }
  - id: distance_only
    names: { en: Distance, de: Distanz, fr: Distance, it: Distanza, ja: 距離のみ }

# Was die geloggte ZAHL bedeutet. Genau ein Wert.
#
# `tracking_type` sagt, welche FORM die Log-Maske hat. Das reicht nicht: an einer
# Assistenzmaschine ist die eingegebene Zahl Entlastung und nicht Last — mehr
# Kilo heisst leichter. Als `weight_reps` geloggt lesen e1RM, Volumen und
# Progressionserkennung die Entwicklung exakt rueckwaerts.
load_mode:
  - id: external
    names: { en: External load, de: Externe Last, fr: Charge externe, it: Carico esterno, ja: "外付け負荷 (外部重量)" }
    # Die Zahl IST der Widerstand. Langhantel, Maschine, Kabel.
  - id: bodyweight
    names: { en: Bodyweight, de: Körpergewicht, fr: Poids du corps, it: Peso corporeo, ja: 自重負荷 }
    # Koerpergewicht bewegt sich; eine Zahl ist optionales Zusatzgewicht.
    # Klimmzug, Dip, Liegestuetz.
  - id: assisted
    names: { en: Assisted, de: Unterstützt, fr: "Assisté / Délesté", it: "Assistito / Alleggerito", ja: "アシスト (負荷軽減)" }
    # Die Zahl VERRINGERT den Widerstand. Assistenzmaschine — mehr ist leichter.
  - id: variable
    names: { en: Variable resistance, de: Variabler Widerstand, fr: Résistance variable, it: Resistenza variabile, ja: "可変抵抗 (バンド等)" }
    # Die Zahl ist kein Kilogramm. Widerstandsband.

