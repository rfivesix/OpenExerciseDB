  - { id: pull, names: { en: Pull, de: Ziehen, fr: Tirage, it: Trazione, ja: "プル (引き)" } }
  - { id: static, names: { en: Static, de: Statisch, fr: Statique, it: Statico, ja: "スタティック (静的保持)" } }

