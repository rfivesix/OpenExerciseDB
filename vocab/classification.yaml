  - { id: hip_adduction, names: { en: Hip adduction, de: Hüftadduktion, fr: Adduction de la hanche, it: Adduzione dell’anca, ja: 股関節内転 } }
  - { id: shoulder_abduction, names: { en: Shoulder abduction, de: Schulterabduktion, fr: Abduction de l’épaule, it: Abduzione della spalla, ja: 肩関節外転 } }
  - { id: shoulder_flexion, names: { en: Shoulder flexion, de: "Schulterbeugung / Frontheben", fr: "Flexion de l’épaule / Élévation frontale", it: "Flessione della spalla / Alzata frontale", ja: "肩関節屈曲 / フロントレイズ" } }
