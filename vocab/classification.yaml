# Klassifikations-Vokabulare. Alles geschlossene Listen.
#
# Wichtig: das sind ORTHOGONALE Achsen. wger hat sie in ein einziges
# `category_name` gequetscht (Legs/Back/Arms/... UND Cardio), weshalb heute
# `Exercise.isCardio` ein String-Vergleich auf einer Koerperregion ist.

version: 1

