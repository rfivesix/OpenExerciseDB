# Classification vocabularies. All closed lists.
#
# Important: these are ORTHOGONAL axes. wger squeezed them into a single
# `category_name` (Legs/Back/Arms/... AND Cardio), which is why today
# `Exercise.isCardio` is a string comparison on a body region.

version: 1

# What the exercise IS. Exactly one value.
modality:
  - { id: strength, names: { en: Strength, de: Kraft, fr: Force, it: Forza, ja: 筋力トレーニング } }
  - { id: cardio, names: { en: Cardio, de: Ausdauer, fr: Cardio, it: Cardio, ja: 有酸素運動 } }
  - { id: plyometric, names: { en: Plyometric, de: Plyometrie, fr: Pliométrie, it: Pliometria, ja: プライオメトリクス } }
  - { id: mobility, names: { en: Mobility, de: Mobilität, fr: Mobilité, it: Mobilità, ja: モビリティ } }
  - { id: stretch, names: { en: Stretch, de: Dehnung, fr: Étirement, it: Stretching, ja: ストレッチ } }
  - { id: balance, names: { en: Balance, de: Balance, fr: Équilibre, it: Equilibrio, ja: バランストレーニング } }

# What the exercise is USED FOR. Multi-valued, at least one value.
# Multi-valued because a light band pull-apart is legitimately warmup AND accessory.
usage_tags:
