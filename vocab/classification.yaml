  - { id: activation, names: { en: Activation, de: Aktivierung, fr: Activation, it: Attivazione, ja: アクティベーション } }
  - { id: main_lift, names: { en: Main lift, de: Grundübung, fr: Exercice principal, it: Esercizio principale, ja: メイン種目 } }
  - { id: accessory, names: { en: Accessory, de: Zusatzübung, fr: Exercice d’assistance, it: Esercizio accessorio, ja: アクセサリー種目 } }
  - { id: conditioning, names: { en: Conditioning, de: Konditionierung, fr: Conditionnement, it: Condizionamento, ja: コンディショニング } }
  - { id: finisher, names: { en: Finisher, de: Finisher, fr: Finisher, it: Finisher, ja: フィニッシャー } }
  - { id: cooldown, names: { en: "Cool-down", de: Abwärmen, fr: Retour au calme, it: Defaticamento, ja: クールダウン } }
  - { id: prehab, names: { en: "Prehab / rehab", de: "Prehab / Reha", fr: "Préhab / Réhab", it: "Prehab / Riabilitazione", ja: "プレハブ / リハビリ" } }

mechanic:
