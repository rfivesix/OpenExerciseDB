  - { id: intermediate, names: { en: Intermediate, de: Fortgeschritten, fr: Intermédiaire, it: Intermedio, ja: 中級 } }
  - { id: advanced, names: { en: Advanced, de: Experte, fr: Avancé, it: Avanzato, ja: 上級 } }

status:
