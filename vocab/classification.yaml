  - { id: accessory, names: { en: Accessory, de: Zusatzübung, fr: Exercice d’assistance, it: Esercizio accessorio, ja: アクセサリー種目 } }
  - { id: conditioning, names: { en: Conditioning, de: Konditionierung, fr: Conditionnement, it: Condizionamento, ja: コンディショニング } }
  - { id: finisher, names: { en: Finisher, de: Finisher, fr: Finisher, it: Finisher, ja: フィニッシャー } }
