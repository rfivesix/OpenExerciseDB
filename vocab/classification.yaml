  - { id: deprecated, names: { en: Deprecated, de: Veraltet, fr: Obsolète, it: Deprecato, ja: 非推奨 } }
  - { id: merged, names: { en: Merged into another exercise, de: Zusammengeführt, fr: Fusionné avec un autre exercice, it: Unito ad un altro esercizio, ja: 統合済み } }
