  - { id: wrist_extension, names: { en: Wrist extension, de: Handgelenkstreckung, fr: Extension du poignet, it: Estensione del polso, ja: 手関節伸展 } }
  - { id: knee_flexion, names: { en: Knee flexion, de: Kniebeugung, fr: Flexion du genou, it: Flessione del ginocchio, ja: 膝関節屈曲 } }
  - { id: knee_extension, names: { en: Knee extension, de: Kniestreckung, fr: Extension du genou, it: Estensione del ginocchio, ja: 膝関節伸展 } }
  - { id: hip_abduction, names: { en: Hip abduction, de: Hüftabduktion, fr: Abduction de la hanche, it: Abduzione dell’anca, ja: 股関節外転 } }
  - { id: hip_adduction, names: { en: Hip adduction, de: Hüftadduktion, fr: Adduction de la hanche, it: Adduzione dell’anca, ja: 股関節内転 } }
  - { id: shoulder_abduction, names: { en: Shoulder abduction, de: Schulterabduktion, fr: Abduction de l’épaule, it: Abduzione della spalla, ja: 肩関節外転 } }
  - { id: shoulder_flexion, names: { en: Shoulder flexion, de: "Schulterbeugung / Frontheben", fr: "Flexion de l’épaule / Élévation frontale", it: "Flessione della spalla / Alzata frontale", ja: "肩関節屈曲 / フロントレイズ" } }
  - { id: scapular_elevation, names: { en: Scapular elevation, de: "Schulterblatthebung / Shrug", fr: "Élévation scapulaire / Shrug", it: "Elevazione scapolare / Shrug", ja: "肩甲骨挙上 / シュラッグ" } }
  - { id: hip_extension, names: { en: Hip extension, de: Hüftstreckung, fr: Extension de la hanche, it: Estensione dell’anca, ja: 股関節伸展 } }
  - { id: spinal_extension, names: { en: Spinal extension, de: Rumpfstreckung, fr: Extension du rachis, it: Estensione spinale, ja: 脊柱伸展 } }
  - { id: spinal_flexion, names: { en: Spinal flexion, de: Rumpfbeugung, fr: Flexion du rachis, it: Flessione spinale, ja: 脊柱屈曲 } }
  - { id: plantar_flexion, names: { en: Plantar flexion, de: Plantarflexion, fr: Flexion plantaire, it: Flessione plantare, ja: "足関節底屈 (プランターフレクション)" } }
  - { id: dorsiflexion, names: { en: Dorsiflexion, de: Dorsalflexion, fr: Dorsiflexion, it: Dorsiflessione, ja: "足関節背屈 (背屈)" } }
  - { id: gait, names: { en: "Gait / locomotion", de: Fortbewegung, fr: "Marche / Locomotion", it: "Deambulazione / Locomozione", ja: "歩行 / ロコモーション" } }
  - { id: other, names: { en: Other, de: Sonstiges, fr: Autre, it: Altro, ja: その他 } }

# force_vector is DERIVED, not annotated.
#
# Evaluation of the first 50 annotated exercises: 19 of the 20 occurring
# movement_pattern values had exactly one force_vector. The only ambiguous one was
# `other` — the bucket that means "no statement" anyway. force_vector is therefore
# a function of movement_pattern rather than independent information; annotating
# it means asserting the same thing twice and eventually contradicting oneself.
#
# `null` explicitly means "there is no honest answer" and is not an error.
# A run is neither push nor pull, and labeling it `push` because a model guessed
# consistently would be spurious precision.
#
# Two lines deliberately deviate from what the model wrote:
#   shoulder_abduction: the model said `pull`. A lateral raise is a
#     pushing motion — the arm moves away from the body. Here it is `push`.
#   shoulder_flexion: arm is raised forward/upward (anterior delt) -> push.
#   scapular_elevation: shoulder girdle is pulled upward (traps) -> pull.
#
# `hinge: pull` and `hip_extension: pull` break the flexion/extension logic of
# pure isolation patterns (hip extension would anatomically be push). This is intentional:
# deadlifts, glute bridges, and hip thrusts are posterior chain exercises
# and belong to the pull system. Please do not "correct" this.
force_vector_by_pattern:
  horizontal_push: push
  vertical_push: push
  horizontal_pull: pull
  vertical_pull: pull
  squat: push
  hinge: pull
  hip_extension: pull
  lunge: push
  elbow_flexion: pull
  elbow_extension: push
  knee_flexion: pull
  knee_extension: push
  shoulder_abduction: push
  shoulder_flexion: push
  scapular_elevation: pull
  plantar_flexion: push
  dorsiflexion: pull
  wrist_flexion: pull
  wrist_extension: push

  anti_rotation: static
  anti_extension: static
  anti_lateral_flexion: static
  anti_flexion: static

  # No honest value:
  carry: null
  rotation: null
  hip_abduction: null
  hip_adduction: null
  spinal_extension: null
  spinal_flexion: null
  gait: null
  other: null

laterality:
  - { id: bilateral, names: { en: Bilateral, de: Beidseitig, fr: Bilatéral, it: Bilaterale, ja: "両側性 (バイラテラル)" } }
  - { id: unilateral, names: { en: Unilateral, de: Einseitig, fr: Unilatéral, it: Unilaterale, ja: "片側性 (ユニラテラル)" } }
  - { id: alternating, names: { en: Alternating, de: Alternierend, fr: Alterné, it: Alternato, ja: "交互 (オルタネーティング)" } }

# Determines the logging interface in the app. Replaces `Exercise.isCardio`.
tracking_type:
  - id: weight_reps
    names: { en: "Weight & reps", de: "Gewicht & Wiederholungen", fr: "Poids & répétitions", it: "Peso & ripetizioni", ja: "重量 & 回数" }
  - id: bodyweight_reps
    names: { en: Reps only, de: Nur Wiederholungen, fr: Répétitions uniquement, it: Solo ripetizioni, ja: 回数のみ }
  - id: time
    names: { en: Duration, de: Dauer, fr: Durée, it: "Tempo / Durata", ja: "時間 (タイマー)" }
  - id: time_weight
    names: { en: "Duration & weight", de: "Dauer & Gewicht", fr: "Durée & poids", it: "Tempo & peso", ja: "時間 & 重量" }
  - id: distance_time
    names: { en: "Distance & duration", de: "Distanz & Dauer", fr: "Distance & durée", it: "Distanza & tempo", ja: "距離 & 時間" }
  - id: distance_only
    names: { en: Distance, de: Distanz, fr: Distance, it: Distanza, ja: 距離のみ }

# What the logged NUMBER means. Exactly one value.
#
# `tracking_type` determines what FORM the logging UI takes. That is not enough:
# on an assisted machine, the entered number is assistance rather than load —
# higher kilograms mean easier. Logged as `weight_reps`, e1RM, volume, and
# progression tracking would interpret progress backwards.
load_mode:
  - id: external
    names: { en: External load, de: Externe Last, fr: Charge externe, it: Carico esterno, ja: "外付け負荷 (外部重量)" }
    # The number IS the resistance. Barbell, machine, cable.
  - id: bodyweight
    names: { en: Bodyweight, de: Körpergewicht, fr: Poids du corps, it: Peso corporeo, ja: 自重負荷 }
    # Body weight moves; any number is optional added weight.
    # Pull-up, dip, push-up.
  - id: assisted
    names: { en: Assisted, de: Unterstützt, fr: "Assisté / Délesté", it: "Assistito / Alleggerito", ja: "アシスト (負荷軽減)" }
    # The number REDUCES resistance. Assisted machine — higher is lighter.
  - id: variable
    names: { en: Variable resistance, de: Variabler Widerstand, fr: Résistance variable, it: Resistenza variabile, ja: "可変抵抗 (バンド等)" }
    # The number is not a kilogram value. Resistance band.

difficulty:
