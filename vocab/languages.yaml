# Sprach-Registry. Beliebig erweiterbar — eine neue Sprache ist EIN Eintrag
# hier plus ein Verzeichnis unter data/i18n/<code>/. Kein Schema-Change,
# kein App-Change, kein Build-Change.
#
# tier:
#   curated  — von diesem Projekt gepflegt und geprueft; blockiert den Release
#              bei Luecken (Invariante 4)
#   upstream — aus der Quelle uebernommen, von uns inhaltlich NICHT geprueft.
#              Wird ausgeliefert und als solche markiert, blockiert nichts.
#   assisted — KI-erzeugt, menschlich stichprobenartig geprueft
#   machine  — KI-erzeugt, ungeprueft; wird ausgeliefert, aber als solche markiert
#
# Stand Phase 1: saemtliche Texte stammen unveraendert aus wger. `en` ist als
# einzige Sprache `curated`, weil sie Quellsprache und vollstaendig ist und
# damit das Release-Gate traegt; `de` wird auf `curated` hochgestuft, sobald es
# vollstaendig und geprueft ist (heute 628 von 871).
#
# wger_language_id: die numerische Sprach-ID der wger-API (/api/v2/language/).
#   Der Importer liest AUSSCHLIESSLICH diese Registry und prueft sie beim Lauf
#   gegen den Snapshot; weicht ein Eintrag ab, bricht der Import ab.
#   Grund: die alte Pipeline hatte diese Zuordnung fest verdrahtet und dabei
#   falsch (4 galt als fr, 5 als it, 8 als ja — tatsaechlich es, ru, el),
#   weshalb die heute ausgelieferte Datenbank 646 spanische Texte als
#   Franzoesisch, 48 griechische als Japanisch und 10 russische als
#   Italienisch fuehrt. Japanisch gibt es bei wger ueberhaupt nicht.
#
# complete_in_release: Das Release garantiert fuer diese Sprache eine Zeile je
#   aktiver Uebung — fehlt der Text, fuellt der Build ihn ueber die
#   fallback_chain und markiert die Zeile mit `source_lang`. Nur `en` und `de`
#   tragen das, weil der Importer der heutigen App genau diese beiden Sprachen
#   erwartet (_mapExerciseBundle). Ohne das Flag wuerden 22 Sprachen je 871
#   Fallback-Zeilen erzeugen, die zu 95 % englische Duplikate waeren.
#
# fallback_chain: was die App nimmt, wenn ein Text in dieser Sprache fehlt.
# Ausgeliefert wird jede Sprache, unabhaengig vom Fuellstand — die App
# entscheidet anhand von `min_completeness`, ob sie sie im Sprachwaehler zeigt.

version: 2

source_language: en   # Source of Truth fuer alle Uebersetzungen

languages:
  - code: en
    names: { en: English, de: Englisch }
    tier: curated
    wger_language_id: 2
    complete_in_release: true
    fallback_chain: []
  - code: de
    names: { en: German, de: Deutsch }
    tier: upstream
    wger_language_id: 1
    complete_in_release: true
    fallback_chain: [en]
