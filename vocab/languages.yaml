    wger_language_id: null
    fallback_chain: [en]

# Threshold above which a language is considered "displayable" in the release.
# Written per language into the languages table of the DB so the app does not
# need to count them itself. Only genuine translations are counted, not fallback
# rows.
min_completeness: 0.95
