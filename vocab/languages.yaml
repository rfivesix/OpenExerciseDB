# Language registry. Freely extensible — a new language is ONE entry
# here plus a directory under data/i18n/<code>/. No schema change,
# no app change, no build change.
#
# tier:
#   curated  — maintained and verified by this project; blocks releases
#              on coverage gaps (Invariant 4)
#   upstream — imported from upstream, NOT content-reviewed by us.
#              Distributed and marked as such, does not block.
#   assisted — AI-generated, spot-checked by humans
#   machine  — AI-generated, unreviewed; distributed, but marked as such
#
# Status Phase 1: all texts originated unchanged from wger. `en` was
# originally the only `curated` language because it is the source language and
# complete, carrying the release gate.
#
# wger_language_id: the numeric language ID in the wger API (/api/v2/language/).
#   The importer reads EXCLUSIVELY this registry and verifies it against the
#   snapshot during runtime; if an entry differs, import aborts.
#   Reason: the legacy pipeline hard-coded this mapping incorrectly (4 was
#   treated as fr, 5 as it, 8 as ja — actually es, ru, el), causing previously
#   distributed databases to serve 646 Spanish texts as French, 48 Greek as
#   Japanese, and 10 Russian as Italian. Japanese does not exist in wger at all.
#
# complete_in_release: The release guarantees a row per active exercise for
#   this language — if text is missing, the build fills it via fallback_chain
#   and marks the row with `source_lang`. Only `en` and `de` carry this flag
#   because the app importer expects exactly these two languages
#   (_mapExerciseBundle). Without this flag, 22 languages would each generate
#   868 fallback rows that would be 95% English duplicates.
#
# fallback_chain: what the app uses when text in this language is missing.
# Every language is distributed regardless of completion percentage — the app
# uses `min_completeness` to decide whether to display it in the language picker.

version: 2

source_language: en   # Source of truth for all translations

languages:
  - code: en
    names: { en: English, de: Englisch }
    tier: curated
    wger_language_id: 2
    complete_in_release: true
    fallback_chain: []
  - code: de
    names: { en: German, de: Deutsch }
    tier: upstream
    wger_language_id: 1
    complete_in_release: true
    fallback_chain: [en]
  - code: es
    names: { en: Spanish, de: Spanisch }
    tier: upstream
    wger_language_id: 4
    fallback_chain: [en]
