# data/exercises/475.yaml
# Language-agnostic facts. Contains NO translatable text — that lives
# exclusively under data/i18n/<lang>/475.yaml.
#
# Chosen example because it illustrates what the legacy schema could not express:
# Pull-ups are bodyweight, but require a bar; they are logged in
# repetitions and can take added weight. The assisted variant is not an
# attribute of this exercise, but a distinct exercise with `load_mode: assisted` —
# on the assisted pull-up machine, the entered number represents assistance rather than load.

id: "475"                 # wger catalog ID, preserved unchanged
slug: pull-up             # stable, human-readable, for URLs and debugging
status: active

modality: strength
mechanic: compound
movement_pattern: vertical_pull   # force_vector is derived from this
laterality: bilateral
difficulty: intermediate
usage_tags: [main_lift, accessory]

tracking_type: bodyweight_reps
load_mode: bodyweight        # body weight moves; a number would be added weight
supports_added_weight: true

primary_equipment: bodyweight
setup: [pullup_bar]

muscles:
  - { id: latissimus_dorsi, role: primary }
  - { id: teres_major,      role: primary }
  - { id: biceps_brachii,   role: secondary }
  - { id: brachialis,       role: secondary }
  - { id: traps_lower,      role: secondary }
  - { id: rhomboids,        role: secondary }
  - { id: rectus_abdominis, role: secondary }

# Provenance for each field. Tracked per field, not per exercise — otherwise
# a later "check all AI muscle assignments from model X" becomes archaeology
# instead of a simple query.
provenance:
  id:                { source: wger }
  muscles:           { source: ai, model: <model-id>, at: 2026-09-02, reviewed_by: <handle>, reviewed_at: 2026-09-02 }
  primary_equipment: { source: ai, model: <model-id>, at: 2026-09-02, reviewed_by: <handle>, reviewed_at: 2026-09-02 }
  setup:             { source: ai, model: <model-id>, at: 2026-09-02, reviewed_by: <handle>, reviewed_at: 2026-09-02 }
  tracking_type:     { source: human, at: 2026-09-02 }
  load_mode:         { source: human, at: 2026-09-03 }

# License provenance. wger licenses per entry, not globally — see
# SCHEMA.md §3b. Set during import and never touched afterwards.
upstream:
  source: wger
  source_id: "475"
  license: CC-BY-SA-4.0
  license_author: wger.de
  imported_at: 2026-09-02
